[package]
name = "draw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../vcs/rs" }
dsl = { path = "../../dsl/rs" }
kernel_2d_engine = { path = "../../kernel/2d/engine/rs" }
kernel_2d_rs = { path = "../../kernel/2d/rs" }
semio-framework-core = { path = "../../framework/core/rs" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
