[package]
name = "draw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../s/kernel/protocol/rs", package = "semio-s-kernel-protocol" }
dsl = { path = "../../s/kernel/dsl/rs", package = "semio-s-kernel-dsl" }
kernel_2d_engine = { path = "../../s/kernel/geometry/2d/engine/rs", package = "semio-s-kernel-geometry-2d-engine" }
kernel_2d_rs = { path = "../../s/kernel/geometry/2d/rs", package = "semio-s-kernel-geometry-2d" }
semio-framework-core = { path = "../../framework/core/rs" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
