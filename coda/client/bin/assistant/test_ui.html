<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Energy Sketchpad — MCP App</title>
    <meta name="description" content="Interactive 3D zone-based building energy analysis — MCP App edition">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0f1e;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        /* ── Layout: 2-column (controls + canvas) ── */
        .dashboard {
            display: grid;
            grid-template-columns: 360px 1fr;
            grid-template-rows: 1fr;
            height: 100vh;
            gap: 0;
        }

        /* ── Left Panel ── */
        .panel-left {
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.72rem;
            color: #64748b;
            margin-bottom: 16px;
        }

        /* Section Card */
        .section-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .section-card h3 {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        /* Zone List */
        .zone-list {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 4px;
        }

        .zone-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 6px;
            transition: border-color 0.2s;
        }

        .zone-card:hover {
            border-color: #38bdf8;
        }

        .zone-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .zone-card-header span {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .zone-card-type {
            font-size: 0.7rem;
            color: #818cf8;
            background: rgba(129, 140, 248, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .zone-card .dims {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .zone-card .dims span {
            color: #38bdf8;
            font-weight: 500;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .btn-delete:hover {
            opacity: 1;
        }

        /* Form elements */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .form-row.single {
            grid-template-columns: 1fr;
        }

        label {
            font-size: 0.68rem;
            color: #64748b;
            display: block;
            margin-bottom: 2px;
        }

        input,
        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            padding: 7px 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
        }

        input:disabled,
        select:disabled {
            background: rgba(255, 255, 255, 0.03);
            color: #64748b;
            border-color: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
        }

        select option {
            background: #1e293b;
        }

        .btn-primary {
            width: 100%;
            padding: 9px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-calculate {
            background: linear-gradient(135deg, #10b981, #059669);
            margin-top: 10px;
            padding: 12px;
            font-size: 0.95rem;
            position: sticky;
            bottom: 0;
        }

        /* ── Center: 3D Canvas ── */
        .panel-center {
            position: relative;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .status-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 20px;
            font-size: 0.78rem;
            color: #94a3b8;
            display: flex;
            gap: 16px;
        }

        .status-bar .stat-value {
            color: #38bdf8;
            font-weight: 600;
        }

        /* Results overlay */
        .results-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 16px;
            max-width: 320px;
            font-size: 0.8rem;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .results-overlay.visible {
            display: block;
        }

        .results-overlay h4 {
            font-size: 0.9rem;
            color: #38bdf8;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .results-overlay .result-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .results-overlay .result-row:last-child {
            border-bottom: none;
        }

        .results-overlay .result-label {
            color: #94a3b8;
        }

        .results-overlay .result-value {
            color: #e2e8f0;
            font-weight: 600;
        }

        .results-overlay .result-value.highlight {
            color: #10b981;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Inline notification */
        .toast {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.9);
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.2s ease;
            z-index: 10;
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.9);
        }

        .toast.visible {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Wall Segment Cards */
        .wall-seg {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 6px 8px;
            margin-bottom: 4px;
            font-size: 0.75rem;
        }

        .wall-seg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .wall-seg-dir {
            font-weight: 700;
            font-size: 0.8rem;
            padding: 1px 6px;
            border-radius: 4px;
            color: #0f172a;
        }

        .wall-seg-dir.dir-N {
            background: #ef4444;
        }

        .wall-seg-dir.dir-E {
            background: #38bdf8;
        }

        .wall-seg-dir.dir-S {
            background: #fbbf24;
        }

        .wall-seg-dir.dir-W {
            background: #a78bfa;
        }

        .wall-seg-info {
            color: #94a3b8;
            font-size: 0.7rem;
        }

        .wall-seg-windows {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 3px;
        }

        .win-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 0.7rem;
            color: #38bdf8;
        }

        .win-tag .win-remove {
            cursor: pointer;
            color: #ef4444;
            font-size: 0.65rem;
            opacity: 0.7;
        }

        .win-tag .win-remove:hover {
            opacity: 1;
        }

        .btn-add-win {
            background: none;
            border: 1px dashed rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 0.68rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-add-win:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Toolbar */
        .toolbar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .toolbar button {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .toolbar button.active {
            background: rgba(56, 189, 248, 0.3);
            border-color: #38bdf8;
            color: #38bdf8;
            font-weight: 600;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>

<body>
    <div class="dashboard">
        <!-- ── Left Panel: All Controls ── -->
        <div class="panel-left">
            <div class="logo">Building Energy Sketchpad</div>
            <div class="subtitle">Draw zones · Configure settings · Calculate energy via MCP</div>

            <!-- Zone List -->
            <div class="zone-list" id="zone-list"></div>

            <!-- Add Zone Form -->
            <div class="section-card">
                <h3>+ Add Zone</h3>
                <div class="form-row single">
                    <div>
                        <label>Room Type</label>
                        <select id="zone-type">
                            <option>Living Room</option>
                            <option>Kitchen</option>
                            <option>Bedroom</option>
                            <option>Bathroom</option>
                            <option>Hallway</option>
                            <option>Office</option>
                            <option>Storage</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div><label>Width (m)</label><input type="number" id="zone-width" value="5" step="0.1" min="0.5">
                    </div>
                    <div><label>Length (m)</label><input type="number" id="zone-length" value="4" step="0.1" min="0.5">
                    </div>
                </div>
                <div class="form-row">
                    <div><label>X Position (m)</label><input type="number" id="zone-x" value="0" step="0.1"></div>
                    <div><label>Y Position (m)</label><input type="number" id="zone-y" value="0" step="0.1"></div>
                </div>
                <button class="btn-primary" id="btn-add-zone">Add Zone</button>
            </div>

            <!-- Hidden inputs: TABULA values locked by LLM chat answers -->
            <input type="hidden" id="tabula-type" value="SFH">
            <input type="hidden" id="tabula-year" value="2016-...">
            <input type="hidden" id="tabula-scenario" value="Existing State">
            <input type="hidden" id="num-stories" value="1">
            <input type="hidden" id="story-height" value="2.8">

            <!-- Hidden inputs to prevent JS errors when HVAC is commented out -->
            <input type="hidden" id="ventilation-system" value="Natural">
            <input type="hidden" id="heating-system" value="Gas Condensing Boiler">

            <!-- Wall Segments & Windows (populated dynamically) -->
            <div class="section-card" id="wall-window-panel" style="display:none;">
                <div class="form-row single"
                    style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1);">
                    <div>
                        <label>North Angle (°)</label>
                        <input type="range" id="building-rotation" value="0" min="0" max="360" step="5"
                            style="width:100%">
                        <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:#64748b;">
                            <span>0°</span><span id="rotation-value">0°</span><span>360°</span>
                        </div>
                    </div>
                </div>
                <h3>🪟 Wall Segments</h3>
                <div id="wall-segment-list" style="max-height:160px; overflow-y:auto; padding-right:4px;"></div>
            </div>

            <!-- Action Button -->
            <div style="margin-top: 12px; position: sticky; bottom: 0; display: flex; gap: 8px;">
                <button id="btn-undo" style="
                    flex: 1;
                    padding: 11px 0;
                    background: #18181b;
                    color: #ffffff;
                    border: 1px solid rgba(255,255,255,0.12);
                    border-radius: 8px;
                    font-size: 0.88rem;
                    font-weight: 600;
                    cursor: pointer;
                    transition: background 0.18s;
                ">Undo</button>
                <button id="btn-redo" style="
                    flex: 1;
                    padding: 11px 0;
                    background: #18181b;
                    color: #ffffff;
                    border: 1px solid rgba(255,255,255,0.12);
                    border-radius: 8px;
                    font-size: 0.88rem;
                    font-weight: 600;
                    cursor: pointer;
                    transition: background 0.18s;
                ">Redo</button>
            </div>

            <!-- System Logs -->
            <div class="section-card" id="logs-panel"
                style="margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <h3 style="margin-bottom:0; font-size:0.75rem; color:#94a3b8;">💻 System Logs</h3>
                    <button id="btn-clear-logs"
                        style="background:none; border:none; color:#64748b; cursor:pointer; font-size:0.7rem;">Clear</button>
                </div>
                <div id="log-console"
                    style="max-height:80px; overflow-y:auto; font-family:monospace; font-size:0.65rem; color:#94a3b8; line-height:1.2; word-break:break-all;">
                </div>
            </div>
        </div>

        <!-- ── Center: 3D View ── -->
        <div class="panel-center">
            <!-- Toolbar -->
            <div class="toolbar">
                <button id="btn-mode-orbit" class="active">Orbit</button>
                <button id="btn-mode-select">Select</button>
                <div style="width: 1px; background: rgba(255,255,255,0.1); margin: 0 4px;" id="toolbar-divider" style="display:none;"></div>
                <button id="btn-transform-translate" style="display:none;" class="active">Moving</button>
                <button id="btn-transform-scale" style="display:none;">Scaling</button>
            </div>

            <div id="canvas-container"></div>

            <!-- Toast notification -->
            <div class="toast" id="toast"></div>

            <!-- Compass Rose -->
            <div id="compass-container"
                style="position:absolute; top:16px; left:16px; width:80px; height:80px; cursor:pointer; user-select:none;">
                <svg id="compass-svg" viewBox="0 0 100 100" width="80" height="80"
                    style="filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));">
                    <circle cx="50" cy="50" r="48" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.15)"
                        stroke-width="1.5" />
                    <line x1="50" y1="5" x2="50" y2="12" stroke="#64748b" stroke-width="1" />
                    <line x1="95" y1="50" x2="88" y2="50" stroke="#64748b" stroke-width="1" />
                    <line x1="50" y1="95" x2="50" y2="88" stroke="#64748b" stroke-width="1" />
                    <line x1="5" y1="50" x2="12" y2="50" stroke="#64748b" stroke-width="1" />
                    <g id="compass-needle" transform="rotate(0, 50, 50)">
                        <polygon points="50,10 44,48 56,48" fill="#ef4444" opacity="0.9" />
                        <polygon points="50,90 44,52 56,52" fill="#94a3b8" opacity="0.5" />
                        <circle cx="50" cy="50" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
                    </g>
                    <text x="50" y="22" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700"
                        font-family="Inter,sans-serif">N</text>
                    <text x="83" y="54" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="500"
                        font-family="Inter,sans-serif">E</text>
                    <text x="50" y="86" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="500"
                        font-family="Inter,sans-serif">S</text>
                    <text x="17" y="54" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="500"
                        font-family="Inter,sans-serif">W</text>
                </svg>
                <div id="compass-angle" style="text-align:center; font-size:0.6rem; color:#64748b; margin-top:2px;">0°
                </div>
            </div>

            <!-- Results Overlay -->
            <div class="results-overlay" id="results-overlay">
                <h4>✅ Energy Results</h4>
                <div id="results-content"></div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar" id="status-bar">
                <div>Zones: <span class="stat-value" id="stat-zones">0</span></div>
                <div>Area: <span class="stat-value" id="stat-area">–</span></div>
                <div>Trans. Loss: <span class="stat-value" id="stat-trans-loss">–</span></div>
                <div>Vent. Loss: <span class="stat-value" id="stat-vent-loss">–</span></div>
                <div>Heat Loss: <span class="stat-value" id="stat-heat-loss">–</span></div>
                <div>Solar Gains: <span class="stat-value" id="stat-solar-gains">–</span></div>
                <div>Heating Demand: <span class="stat-value" id="stat-heating-demand">–</span></div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

<script type="module">
// =============================================================================
// Building Energy Sketchpad — MCP App Edition
// =============================================================================
//
// This module handles:
//   1. MCP App bridge (communication with host via postMessage)
//   2. Zone management (add/remove rectangular zones)
//   3. 3D visualization of zones as colored volumes (Three.js)
//   4. Energy calculation via app.callServerTool()
//   5. Results display in floating overlay
//
// NO fetch('/api/...') calls — everything goes through the MCP protocol.
// NO polling — results come back directly from tool calls.
// =============================================================================

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DragControls } from 'three/addons/controls/DragControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { ViewHelper } from 'three/addons/helpers/ViewHelper.js';

// ── MCP App Bridge ──────────────────────────────────────────────────────────
function logToConsole(msg) {
    console.log(msg);
    const consoleEl = document.getElementById('log-console');
    if (consoleEl) {
        const time = new Date().toLocaleTimeString();
        consoleEl.innerHTML += `<div>[${time}] ${msg}</div>`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }
}
window.logToConsole = logToConsole;

if (window.__wasmLogs) {
    window.__wasmLogs.forEach(l => logToConsole(l.msg));
    window.__wasmLogs = [];
}

// Global error logger for easier debugging
window.onerror = function (message, source, lineno, colno, error) {
    logToConsole(`[ERROR] ${message} at ${source}:${lineno}:${colno}`);
    return false;
};
window.onunhandledrejection = function (event) {
    logToConsole(`[UNHANDLED REJECTION] ${event.reason}`);
};

// Hook up clear button
function setupClearLogs() {
    const clearBtn = document.getElementById('btn-clear-logs');
    if (clearBtn) {
        clearBtn.addEventListener('click', () => {
            const consoleEl = document.getElementById('log-console');
            if (consoleEl) consoleEl.innerHTML = '';
        });
    }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupClearLogs);
} else {
    setupClearLogs();
}

let app = null;
let AppClass = null;

try {
    logToConsole("Attempting local SDK import...");
    // Try to import from bundled/local npm package first
    const sdk = await import("@modelcontextprotocol/ext-apps");
    AppClass = sdk.App;
    logToConsole("Local SDK imported successfully.");
} catch (e) {
    logToConsole("Local SDK import failed. Attempting CDN import...");
    try {
        // Fallback to CDN for unbundled/dev/FastAPI mode
        const sdk = await import("https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps/+esm");
        AppClass = sdk.App;
        logToConsole("CDN SDK imported successfully.");
    } catch (err) {
        logToConsole("CDN SDK import failed: " + err.message);
        console.warn('MCP App SDK not available:', err.message);
    }
}

if (AppClass) {
    try {
        logToConsole("Instantiating App...");
        app = new AppClass({ name: "Building Planner", version: "1.0.0" });
        logToConsole("App instantiated. Connect function type: " + typeof app.connect);
        if (typeof app.connect === 'function') {
            logToConsole("Connecting to host...");
            app.connect().then(() => {
                logToConsole("Connected! Host capabilities: " + JSON.stringify(app.getHostCapabilities()));
            }).catch(err => {
                logToConsole("Connect failed: " + err.message);
            });
        }

        // When the host sends tool result data (e.g., pre-populated settings)
        app.ontoolresult = (result) => {
            logToConsole("Received ontoolresult. Payload: " + JSON.stringify(result));
            try {
                let dataStr = result;
                if (result && typeof result === 'object') {
                    if (result.content && Array.isArray(result.content)) {
                        const textItem = result.content.find(c => c.type === 'text');
                        dataStr = textItem ? textItem.text : result;
                    } else if (result.text) {
                        dataStr = result.text;
                    }
                }
                const data = typeof dataStr === 'string' ? JSON.parse(dataStr) : dataStr;
                if (data.defaults) {
                    logToConsole("Applying default values from host...");
                    if (data.defaults.building_type) {
                        const el = document.getElementById('tabula-type');
                        if (el) {
                            el.value = data.defaults.building_type;
                            el.disabled = true;
                        }
                    }
                    if (data.defaults.year_class) {
                        const el = document.getElementById('tabula-year');
                        if (el) {
                            if (el.tagName === 'SELECT') {
                                for (const opt of el.options) {
                                    const val = opt.value || opt.text;
                                    if (val === data.defaults.year_class || opt.text === data.defaults.year_class) {
                                        el.value = val;
                                        break;
                                    }
                                }
                            } else {
                                el.value = data.defaults.year_class;
                            }
                            el.disabled = true;
                        }
                    }
                    if (data.defaults.scenario) {
                        const el = document.getElementById('tabula-scenario');
                        if (el) {
                            el.value = data.defaults.scenario;
                            el.disabled = true;
                        }
                    }
                    logToConsole("Defaults applied successfully.");
                }
            } catch (e) {
                logToConsole("Error parsing/applying defaults: " + e.message);
                console.log('Could not parse tool result defaults:', e);
            }
        };
    } catch (e) {
        logToConsole("Error during App instantiation/setup: " + e.message);
        console.error('Failed to initialize MCP App:', e);
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// Three.js Setup
// ─────────────────────────────────────────────────────────────────────────────

function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1e);

    const container = document.getElementById('canvas-container');
    const rect = container.getBoundingClientRect();

    const aspect = rect.width / rect.height;
    const frustumSize = 30;
    camera = new THREE.OrthographicCamera((frustumSize * aspect) / -2, (frustumSize * aspect) / 2, frustumSize / 2, frustumSize / -2, -1000, 1000);
    camera.position.set(20, 20, 20); // Isometric perspective
    camera.up.set(0, 0, 1);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(rect.width, rect.height);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.autoClear = false;
    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    // Prevent Gimbal lock when looking straight down or up
    controls.minPolarAngle = 0.001;
    controls.maxPolarAngle = Math.PI - 0.001;

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(15, 25, 15);
    dirLight.castShadow = true;
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0x818cf8, 0.3);
    fillLight.position.set(-10, 5, -10);
    scene.add(fillLight);

    // Grid
    const grid = new THREE.GridHelper(30, 30, 0x1e293b, 0x0f172a);
    grid.rotation.x = Math.PI / 2;
    grid.position.z = -0.01;
    scene.add(grid);

    // North Arrow
    const dir = new THREE.Vector3(0, 1, 0);
    const origin = new THREE.Vector3(-12, -12, 0);
    window.northArrow = new THREE.ArrowHelper(dir, origin, 3, 0xef4444, 1, 0.8);
    scene.add(window.northArrow);

    scene.add(buildingGroup);

    // Resize
    window.addEventListener('resize', () => {
        const r = container.getBoundingClientRect();
        const aspect = r.width / r.height;
        const frustumSize = 30;
        camera.left = (frustumSize * aspect) / -2;
        camera.right = (frustumSize * aspect) / 2;
        camera.top = frustumSize / 2;
        camera.bottom = frustumSize / -2;
        camera.updateProjectionMatrix();
        renderer.setSize(r.width, r.height);
    });

    // Drag Controls
    dragControls = new DragControls(draggableObjects, camera, renderer.domElement);
    dragControls.addEventListener('dragstart', (event) => {
        controls.enabled = false;
        event.object.material.opacity = 0.5;
    });
    dragControls.addEventListener('drag', (event) => {
        const zPos = event.object.userData.storyIndex * (parseFloat(document.getElementById('story-height').value) || 2.8) + (parseFloat(document.getElementById('story-height').value) || 2.8) / 2;
        event.object.position.z = zPos;
    });
    dragControls.addEventListener('dragend', (event) => {
        controls.enabled = true;
        event.object.material.opacity = 0.25;
        const zoneId = event.object.userData.zoneId;
        const zone = zones.find(z => z.id === zoneId);
        if (zone) {
            zone.geometry.x = Math.round((event.object.position.x - zone.geometry.width / 2) * 2) / 2;
            zone.geometry.y = Math.round((event.object.position.y - zone.geometry.length / 2) * 2) / 2;
            renderZoneList();
            render3DZones();
            updateStats();
            if (typeof dispatchState === 'function') dispatchState();
        }
    });

    // Setup TransformControls (Gumball)
    translateControl = new TransformControls(camera, renderer.domElement);
    scaleControl = new TransformControls(camera, renderer.domElement);
    scaleControl.setMode('scale');
    
    // Hide Z axis handles since building zones are constrained to XY plane manipulation
    translateControl.showZ = false;
    scaleControl.showZ = false;

    translateControl.addEventListener('dragging-changed', function (event) {
        controls.enabled = !event.value;
    });
    scaleControl.addEventListener('dragging-changed', function (event) {
        controls.enabled = !event.value;
    });
    translateControl.addEventListener('change', function () {
        if (selectedObject && translateControl.object) {
            const storyH = parseFloat(document.getElementById('story-height').value) || 2.8;
            const zPos = selectedObject.userData.storyIndex * storyH + storyH / 2;
            selectedObject.position.z = zPos; // lock Z axis
        }
    });
    
    function rebuildAndRetainSelection(zoneId) {
        renderZoneList();
        render3DZones();
        updateStats();
        if (typeof dispatchState === 'function') dispatchState();
        const newMesh = draggableObjects.find(obj => obj.userData.zoneId === zoneId);
        if (newMesh) {
            selectedObject = newMesh;
            if (window.activeTransformMode === 'scale') {
                scaleControl.attach(selectedObject);
                translateControl.detach();
            } else {
                translateControl.attach(selectedObject);
                scaleControl.detach();
            }
        } else {
            translateControl.detach();
            scaleControl.detach();
            selectedObject = null;
        }
    }

    translateControl.addEventListener('mouseUp', function () {
        if (selectedObject) {
            const zoneId = selectedObject.userData.zoneId;
            const zone = zones.find(z => z.id === zoneId);
            if (zone) {
                zone.geometry.x = Math.round((selectedObject.position.x - zone.geometry.width / 2) * 2) / 2;
                zone.geometry.y = Math.round((selectedObject.position.y - zone.geometry.length / 2) * 2) / 2;
                rebuildAndRetainSelection(zoneId);
            }
        }
    });
    scaleControl.addEventListener('mouseUp', function () {
        if (selectedObject) {
            const zoneId = selectedObject.userData.zoneId;
            const zone = zones.find(z => z.id === zoneId);
            if (zone) {
                const scaleX = selectedObject.scale.x;
                const scaleY = selectedObject.scale.y;
                zone.geometry.width = Math.round(zone.geometry.width * scaleX * 10) / 10;
                zone.geometry.length = Math.round(zone.geometry.length * scaleY * 10) / 10;
                rebuildAndRetainSelection(zoneId);
            }
        }
    });

    scene.add(translateControl);
    scene.add(scaleControl);

    // Setup ViewHelper
    viewHelper = new ViewHelper(camera, renderer.domElement);
    viewHelper.center = controls.target;

    // For X/Y axes: use native ViewHelper animation (works fine).
    // For Z-axis: bypass ViewHelper animation entirely because camera.up === view direction causes NaN gimbal lock.
    const originalHandleClick = viewHelper.handleClick.bind(viewHelper);
    viewHelper.handleClick = function(event) {
        const wasAnimating = this.animating;
        const result = originalHandleClick(event);

        if (this.animating && !wasAnimating) {
            const targetDir = this.targetPosition.clone();

            if (Math.abs(targetDir.z) > 0.99) {
                // Cancel native animation — it will produce NaN for Z-up
                this.animating = false;

                const dist = camera.position.distanceTo(controls.target);
                const sign = targetDir.z > 0 ? 1 : -1;

                // Place camera slightly off-axis so lookAt never divides by zero
                camera.position.copy(controls.target).add(
                    new THREE.Vector3(0.0001, 0, sign * dist)
                );
                camera.up.set(0, 0, 1);
                camera.lookAt(controls.target);
                camera.updateProjectionMatrix();
                controls.update();
            }
        }
        return result;
    };

    container.addEventListener('pointerup', (event) => {
        viewHelper.handleClick(event);
    });

    container.addEventListener('pointerdown', (event) => {
        if (!selectionModeActive) return;

        const rect = container.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(draggableObjects, false);
        if (intersects.length > 0) {
            const object = intersects[0].object;
            if (selectedObject !== object) {
                selectedObject = object;
                if (window.activeTransformMode === 'scale') {
                    scaleControl.attach(selectedObject);
                    translateControl.detach();
                } else {
                    translateControl.attach(selectedObject);
                    scaleControl.detach();
                }
            }
        } else {
            // Clicked empty space
            if (translateControl.object || scaleControl.object) {
                translateControl.detach();
                scaleControl.detach();
                selectedObject = null;
            }
        }
    });

    animate();
}

let clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const delta = clock.getDelta();
    if (viewHelper && viewHelper.animating === true) {
        viewHelper.update(delta);
    } else {
        controls.update();
    }
    
    renderer.clear();
    renderer.render(scene, camera);
    if (viewHelper) viewHelper.render(renderer);
}

function addZone(type, x, y, width, length) {
    zoneCounter++;
    const zone = { id: `zone_${zoneCounter}`, type, geometry: { x, y, width, length } };
    zones.push(zone);
    renderZoneList();
    render3DZones();
    updateStats();
    return zone;
}

function removeZone(id) {
    zones = zones.filter(z => z.id !== id);
    renderZoneList();
    render3DZones();
    updateStats();
}

function getGeometryPayload() {
    return { version: "1.0", units: "meters", building_zones: zones };
}


// ─────────────────────────────────────────────────────────────────────────────
// 3D Rendering
// ─────────────────────────────────────────────────────────────────────────────

function render3DZones() {
    draggableObjects.length = 0;
    while (buildingGroup.children.length > 0) {
        const child = buildingGroup.children[0];
        child.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                else obj.material.dispose();
            }
        });
        buildingGroup.remove(child);
    }
    
    // Clear selection on re-render to avoid detached gizmo
    if (translateControl && translateControl.object) {
        translateControl.detach();
        scaleControl.detach();
        selectedObject = null;
    }

    const storyHeight = parseFloat(document.getElementById('story-height').value) || 2.8;
    const numStories = parseInt(document.getElementById('num-stories').value) || 1;

    zones.forEach((zone, idx) => {
        const { x, y, width, length } = zone.geometry;
        const color = ZONE_COLORS[idx % ZONE_COLORS.length];

        for (let s = 0; s < numStories; s++) {
            const boxGeom = new THREE.BoxGeometry(width, length, storyHeight);
            const boxMat = new THREE.MeshPhongMaterial({
                color, transparent: true, opacity: 0.25, side: THREE.DoubleSide,
            });
            const boxMesh = new THREE.Mesh(boxGeom, boxMat);
            boxMesh.position.set(x + width / 2, y + length / 2, s * storyHeight + storyHeight / 2);
            if (s === 0) {
                boxMesh.userData = { zoneId: zone.id, storyIndex: s };
                draggableObjects.push(boxMesh);
            }
            buildingGroup.add(boxMesh);

            const edgesGeom = new THREE.EdgesGeometry(boxGeom);
            const edgesMat = new THREE.LineBasicMaterial({ color, linewidth: 2 });
            const edges = new THREE.LineSegments(edgesGeom, edgesMat);
            edges.position.copy(boxMesh.position);
            buildingGroup.add(edges);
        }

        // Floor plane
        const floorGeom = new THREE.PlaneGeometry(width, length);
        const floorMat = new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        // Z-up: PlaneGeometry defaults to XY plane, so no rotation needed!
        floor.position.set(x + width / 2, y + length / 2, 0.01);
        buildingGroup.add(floor);

        // Label sprite
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, 256, 64);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(zone.type, 128, 25);
        ctx.font = '16px Inter, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`${width}m × ${length}m`, 128, 50);
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(3, 0.75, 1);
        sprite.position.set(x + width / 2, y + length / 2, numStories * storyHeight + 0.8);
        buildingGroup.add(sprite);
    });

    if (zones.length > 0) {
        const bbox = new THREE.Box3().setFromObject(buildingGroup);
        const center = bbox.getCenter(new THREE.Vector3());
        controls.target.copy(center);
    }
}

function updateStats() {
    document.getElementById('stat-zones').textContent = zones.length;
    if (zones.length === 0) {
        document.getElementById('stat-area').textContent = '–';
        if (document.getElementById('stat-trans-loss')) document.getElementById('stat-trans-loss').textContent = '–';
        if (document.getElementById('stat-vent-loss')) document.getElementById('stat-vent-loss').textContent = '–';
        if (document.getElementById('stat-heat-loss')) document.getElementById('stat-heat-loss').textContent = '–';
        if (document.getElementById('stat-solar-gains')) document.getElementById('stat-solar-gains').textContent = '–';
        if (document.getElementById('stat-heating-demand')) document.getElementById('stat-heating-demand').textContent = '–';
        return;
    }
    const totalArea = zones.reduce((sum, z) => sum + z.geometry.width * z.geometry.length, 0);
    document.getElementById('stat-area').textContent = totalArea.toFixed(1) + ' m²';
}

function getRustStatePayload() {
    const story_height = parseFloat(document.getElementById('story-height').value) || 2.8;
    const num_stories = parseInt(document.getElementById('num-stories').value) || 1;
    const params = {
        building_type: document.getElementById('tabula-type').value,
        year_class: document.getElementById('tabula-year').value,
        scenario: document.getElementById('tabula-scenario').value,
        story_height,
        num_stories,
        window_to_wall_ratio: 0.15,
        building_rotation_deg: buildingRotationDeg,
        heating_system: document.getElementById('heating-system').value,
    };
    
    const rust_zones = zones.map(z => ({
        id: z.id,
        room_type: z.type || "Zone",
        width: z.geometry.width,
        length: z.geometry.length,
        x: z.geometry.x,
        y: z.geometry.y
    }));
    
    return { zones: rust_zones, params };
}

function syncUIFromState(state) {
    zones = state.zones.map(z => ({
        id: z.id,
        type: z.room_type,
        geometry: { width: z.width, length: z.length, x: z.x, y: z.y }
    }));
    zoneCounter = zones.length;
    
    document.getElementById('tabula-type').value = state.params.building_type;
    document.getElementById('tabula-year').value = state.params.year_class;
    document.getElementById('tabula-scenario').value = state.params.scenario;
    document.getElementById('story-height').value = state.params.story_height;
    document.getElementById('num-stories').value = state.params.num_stories;
    buildingRotationDeg = state.params.building_rotation_deg;
    document.getElementById('heating-system').value = state.params.heating_system;
    
    renderZoneList();
    render3DZones();
    updateStats();
}

        }

            document.getElementById('stat-vent-loss').textContent = data.heat_losses.ventilation_loss_kWh_a.toFixed(1) + ' kWh/a';

        }
        if (data.tabula_u_values) {
            html += `<div class="result-row"><span class="result-label">U-Wall:</span><span class="result-value">${data.tabula_u_values.wall_W_m2K.toFixed(2)} W/m²K</span></div>`;
            html += `<div class="result-row"><span class="result-label">U-Window:</span><span class="result-value">${data.tabula_u_values.window_W_m2K.toFixed(2)} W/m²K</span></div>`;
        }

        }
        if (data.heat_losses) {
            html += `<div class="result-row"><span class="result-label">Heat Losses:</span><span class="result-value">${data.heat_losses.Q_ht_kWh_a.toFixed(1)} kWh/a</span></div>`;
            if (data.heat_losses.transmission_loss_kWh_a) {
                html += `<div class="result-row"><span class="result-label">Transmission Loss:</span><span class="result-value">${data.heat_losses.transmission_loss_kWh_a.toFixed(1)} kWh/a</span></div>`;
            }
            if (data.heat_losses.ventilation_loss_kWh_a) {
                html += `<div class="result-row"><span class="result-label">Ventilation Loss:</span><span class="result-value">${data.heat_losses.ventilation_loss_kWh_a.toFixed(1)} kWh/a</span></div>`;
            }
        }
        if (data.heat_gains && data.heat_gains.solar_gains_kWh_a) {
            html += `<div class="result-row"><span class="result-label">Solar Gains:</span><span class="result-value">${data.heat_gains.solar_gains_kWh_a.toFixed(1)} kWh/a</span></div>`;
        }
        if (data.final_energy) {
            html += `<div class="result-row"><span class="result-label">Final Energy:</span><span class="result-value">${data.final_energy.specific_Q_final_kWh_m2a.toFixed(1)} kWh/m²a</span></div>`;
        }
        content.innerHTML = html;
        overlay.classList.add('visible');
    }
}

async function dispatchState() {
    try {
        if (!window.sketchpadRs) {
            if (window.wasmInitPromise) await window.wasmInitPromise;
            else {
                logToConsole("WASM engine not ready yet.");
                return;
            }
        }
        const payload = getRustStatePayload();
        logToConsole(`Dispatching state to WASM... (${payload.zones.length} zones)`);
        const resultJson = window.sketchpadRs.update_state(JSON.stringify(payload));
        const data = JSON.parse(resultJson);
        if (data.status === 'success') {
            displayRustResults(data);
            logToConsole("WASM calculations updated successfully.");
        } else {
            logToConsole(`WASM calculation error: ${data.message}`);
        }
    } catch (err) {
        logToConsole(`Error in dispatchState: ${err.message}`);
    }
}

async function handleUndo() {
    try {
        logToConsole("Undo clicked");
        if (!window.sketchpadRs) await window.wasmInitPromise;
        const resultJson = window.sketchpadRs.undo();
        const result = JSON.parse(resultJson);
        if (result.state) {
            syncUIFromState(result.state);
            if (result.energy && result.energy.status === 'success') {
                displayRustResults(result.energy);
            }
            logToConsole("Undo successful.");
        } else {
            logToConsole("No undo history available.");
        }
    } catch (err) {
        logToConsole(`Error during undo: ${err.message}`);
    }
}

async function handleRedo() {
    try {
        logToConsole("Redo clicked");
        if (!window.sketchpadRs) await window.wasmInitPromise;
        const resultJson = window.sketchpadRs.redo();
        const result = JSON.parse(resultJson);
        if (result.state) {
            syncUIFromState(result.state);
            if (result.energy && result.energy.status === 'success') {
                displayRustResults(result.energy);
            }
            logToConsole("Redo successful.");
        } else {
            logToConsole("No redo history available.");
        }
    } catch (err) {
        logToConsole(`Error during redo: ${err.message}`);
    }
}

// Hook into addZone, removeZone, geometry changes
const _origAddZone = addZone;
addZone = function(type, x, y, width, length) {
    const res = _origAddZone(type, x, y, width, length);
    dispatchState();
    return res;
};

const _origRemoveZone = removeZone;
removeZone = function(id) {
    _origRemoveZone(id);
    dispatchState();
};

function rebuildAndRetainSelection(zoneId) {
    renderZoneList();
    render3DZones();
    updateStats();
    dispatchState();
    const newMesh = draggableObjects.find(obj => obj.userData.zoneId === zoneId);
    if (newMesh) {
        selectedObject = newMesh;
        if (window.activeTransformMode === 'scale') {
            scaleControl.attach(selectedObject);
            translateControl.detach();
        } else {
            translateControl.attach(selectedObject);
            scaleControl.detach();
        }
    } else {
        translateControl.detach();
        scaleControl.detach();
        selectedObject = null;
    }
}

function initCompass() {
    const rotInput = document.getElementById('building-rotation');
    const rotVal = document.getElementById('rotation-value');
    const compassNeedle = document.getElementById('compass-needle');
    const compassAngle = document.getElementById('compass-angle');
    
    if (rotInput) {
        rotInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (rotVal) rotVal.textContent = val + '°';
            if (compassNeedle) compassNeedle.setAttribute('transform', `rotate(${val}, 50, 50)`);
            if (compassAngle) compassAngle.textContent = val + '°';
            buildingRotationDeg = parseFloat(val);
            if (window.northArrow) {
                // update north arrow
                const rad = -buildingRotationDeg * Math.PI / 180;
                window.northArrow.setDirection(new THREE.Vector3(Math.sin(rad), Math.cos(rad), 0));
            }
            // dispatch state
            dispatchState();
        });
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// Event Listeners & Init
// ─────────────────────────────────────────────────────────────────────────────

function initEventListeners() {
    document.getElementById('btn-add-zone').addEventListener('click', () => {
        const type = document.getElementById('zone-type').value;
        const width = parseFloat(document.getElementById('zone-width').value) || 5;
        const length = parseFloat(document.getElementById('zone-length').value) || 4;
        const x = parseFloat(document.getElementById('zone-x').value) || 0;
        const y = parseFloat(document.getElementById('zone-y').value) || 0;
        addZone(type, x, y, width, length);
        document.getElementById('zone-x').value = x + width;
        document.getElementById('zone-y').value = y;
    });

    const btnOrbit = document.getElementById('btn-mode-orbit');
    const btnSelect = document.getElementById('btn-mode-select');
    const btnTranslate = document.getElementById('btn-transform-translate');
    const btnScale = document.getElementById('btn-transform-scale');
    const divider = document.getElementById('toolbar-divider');
    
    window.activeTransformMode = 'translate';

    if (btnOrbit) {
        btnOrbit.addEventListener('click', () => {
            selectionModeActive = false;
            btnOrbit.classList.add('active');
            btnSelect.classList.remove('active');
            
            if (btnTranslate) btnTranslate.style.display = 'none';
            if (btnScale) btnScale.style.display = 'none';
            if (divider) divider.style.display = 'none';
            
            dragControls.enabled = true;
            controls.enabled = true;
            if (translateControl && translateControl.object) {
                translateControl.detach();
                scaleControl.detach();
            }
            selectedObject = null;
        });

        btnSelect.addEventListener('click', () => {
            selectionModeActive = true;
            btnSelect.classList.add('active');
            btnOrbit.classList.remove('active');
            
            if (btnTranslate) btnTranslate.style.display = 'block';
            if (btnScale) btnScale.style.display = 'block';
            if (divider) divider.style.display = 'block';
            
            dragControls.enabled = false;
            
            window.activeTransformMode = 'translate';
            if (btnTranslate) btnTranslate.classList.add('active');
            if (btnScale) btnScale.classList.remove('active');
            if (selectedObject) {
                translateControl.attach(selectedObject);
                scaleControl.detach();
            }
        });

        if (btnTranslate) {
            btnTranslate.addEventListener('click', () => {
                window.activeTransformMode = 'translate';
                btnTranslate.classList.add('active');
                btnScale.classList.remove('active');
                if (selectedObject) {
                    translateControl.attach(selectedObject);
                    scaleControl.detach();
                }
            });
        }

        if (btnScale) {
            btnScale.addEventListener('click', () => {
                window.activeTransformMode = 'scale';
                btnScale.classList.add('active');
                btnTranslate.classList.remove('active');
                if (selectedObject) {
                    scaleControl.attach(selectedObject);
                    translateControl.detach();
                }
            });
        }
    }

    const btnUndo = document.getElementById('btn-undo');
    if (btnUndo) btnUndo.addEventListener('click', handleUndo);
    
    const btnRedo = document.getElementById('btn-redo');
    if (btnRedo) btnRedo.addEventListener('click', handleRedo);

    ['tabula-type', 'tabula-year', 'tabula-scenario', 'num-stories', 'story-height', 'heating-system'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            render3DZones();
            dispatchState();
        });
    });
}

// ── Bootstrap ───────────────────────────────────────────────────────────────
initThree();
initEventListeners();
initCompass();

</script>
