<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <title>coda</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- [DEBUG] Catch module evaluation errors before renderer.tsx loads -->
    <script>
      window.__coda_errors = [];
      window.addEventListener("error", function (e) {
        window.__coda_errors.push("ERR: " + e.message + " at " + e.filename + ":" + e.lineno);
        console.error("[DEBUG] uncaught:", e.message, "at", e.filename + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__coda_errors.push("REJ: " + String(e.reason));
        console.error("[DEBUG] rejection:", String(e.reason));
      });
    </script>
    <script type="module" src="./renderer.tsx"></script>
  </body>
</html>
