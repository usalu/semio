[package]
name = "writer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
framework_editor = { path = "../../framework/editor/rs" }
vcs = { path = "../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../s/kernel/protocol/rs", package = "semio-s-kernel-protocol" }
dsl = { path = "../../s/kernel/dsl/rs", package = "semio-s-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
