[package]
name = "semio-s-kernel-geometry-2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "kernel_2d_rs"
path = "📦.rs"

[features]
default = ["booleans", "trace"]
booleans = ["dep:geo"]
trace = []

[dependencies]
async-trait = "0.1.88"
kernel_2d_engine = { path = "../../🔨/engine/⚡️/🦀", package = "semio-s-kernel-geometry-2d-engine" }
geo = { version = "0.29", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
semio-framework-core = { path = "../../../../../🧰/⚡️/🦀", package = "semio-framework-core" }
