[package]
name = "process-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:process"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "process3d"
app = "process3d-play"
aliases = ["process 3d"]
ports = { react = 6022, wgpu = 6122 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦.rs"

[dependencies]
process_3d = { path = "../../../../🎛️/3d/⚡️/🦀", package = "semio-s-app-process-3d" }
process_3d_engine = { path = "../../../../🎛️/3d/🔨/engine/⚡️/🦀", package = "semio-s-app-process-3d-engine" }
process_3d_ui = { path = "../../../../🎛️/3d/🔨/ui/⚡️/🦀", package = "semio-s-app-process-3d-ui" }
semio-framework-plugin = { path = "../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../../../🧰/🛍️/💻/⚡️/🦀", package = "semio-framework-os" }
serde_json = "1.0.140"
