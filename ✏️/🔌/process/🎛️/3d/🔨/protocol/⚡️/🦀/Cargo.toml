[package]
name = "semio-s-app-process-3d-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Process 3d app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
process_3d = { path = "../../../../⚡️/🦀", package = "semio-s-app-process-3d" }
process_3d_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-process-3d-op" }
protocol = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"

[dev-dependencies]
vcs = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/vcs/⚡️/🦀", package = "semio-framework-os-kernel-vcs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
