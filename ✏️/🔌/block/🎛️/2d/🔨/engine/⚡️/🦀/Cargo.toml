[package]
name = "semio-s-app-block-2d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Block 2D app — headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
