[package]
name = "semio-s-app-block-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Block 3D app — DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "📦.rs"

[dependencies]
block_3d = { path = "../../../../⚡️/🦀", package = "semio-s-app-block-3d" }
block_3d_dsl = { path = "../../../dsl/⚡️/🦀", package = "semio-s-app-block-3d-dsl" }
block_3d_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-block-3d-engine" }
block_3d_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-block-3d-op" }
block_shared = { path = "../../../../../../🔨/shared/⚡️/🦀", package = "semio-s-plugin-block-shared" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
