[package]
name = "writer-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:writer"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "writer"
ports = { react = 6062, wgpu = 6162 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", features = ["component-guest"], package = "semio-framework-plugin" }
framework_editor = { path = "../../../../../../../🧰/🔨/editor/⚡️/🦀", package = "framework_editor" }
writer = { path = "../../../../🎛️/writer/⚡️/🦀", package = "semio-s-app-writer" }
writer_op = { path = "../../../../🎛️/writer/🔨/op/⚡️/🦀", package = "semio-s-app-writer-op" }
writer_ui = { path = "../../../../🎛️/writer/🔨/ui/⚡️/🦀", package = "semio-s-app-writer-ui" }
store = { path = "../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
