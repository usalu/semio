[package]
name = "trinity_ram"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
vcs = { path = "../../../../../../../🧰/🛍️/💻/🔨/vcs/⚡️/🦀", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../../🧰/🛍️/💻/🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../../../🧰/🛍️/💻/🔨/dsl/⚡️/🦀", package = "semio-framework-os-kernel-dsl" }
mathematical_graph_manifest = { path = "../../../../../../../🧰/🔨/math/⚡️/🦀/graph/manifest", package = "semio-framework-os-kernel-math-graph-manifest" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
