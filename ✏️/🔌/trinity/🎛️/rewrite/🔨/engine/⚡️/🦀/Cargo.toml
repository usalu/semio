[package]
name = "semio-s-app-trinity-rewrite-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Trinity Rewrite app - headless compute (constitutional: engine)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
rewrite = { path = "../../../../⚡️/🦀", package = "semio-s-app-trinity-rewrite" }
trinity_ram = { path = "../../../../../../🔨/ram/⚡️/🦀", package = "trinity_ram" }
trinity_jack = { path = "../../../../../../🔨/jack/⚡️/🦀", package = "trinity_jack" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
infinite_board_port_directed = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/infinite/⚡️/🦀/board/port/directed", package = "semio-framework-os-kernel-infinite-board-port-directed" }
infinite_board_port_directed_normal = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/infinite/⚡️/🦀/board/port/directed/normal", package = "semio-framework-os-kernel-infinite-board-port-directed-normal" }
infinite_cavas = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/infinite/⚡️/🦀/canvas", package = "semio-framework-os-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
