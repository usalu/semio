[package]
name = "semio-s-app-draw-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
draw = { path = "../../../../⚡️/🦀", package = "semio-s-app-draw" }
draw_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-draw-engine" }
draw_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-draw-op" }
fsm = { path = "../../../../../../🔨/fsm/⚡️/🦀", package = "fsm" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
