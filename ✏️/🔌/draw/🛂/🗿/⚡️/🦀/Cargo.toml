[package]
name = "draw-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:draw"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "draw"
ports = { react = 6064, wgpu = 6164 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦.rs"

[dependencies]
draw = { path = "../../../../🎛️/draw/⚡️/🦀", package = "semio-s-app-draw" }
draw_engine = { path = "../../../../🎛️/draw/🔨/engine/⚡️/🦀", package = "semio-s-app-draw-engine" }
draw_ui = { path = "../../../../🎛️/draw/🔨/ui/⚡️/🦀", package = "semio-s-app-draw-ui" }
semio-framework-os = { path = "../../../../../../../🧰/🛍️/💻/⚡️/🦀", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", features = ["component-guest"], package = "semio-framework-plugin" }
base64 = "0.22"

