[package]
name = "forms-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:forms"

[package.metadata.semio]
consumes = ["forms.questionKind"]

[[package.metadata.semio.playground]]
variant = "forms"
ports = { react = 6058, wgpu = 6158 }

[lib]
crate-type = ["cdylib", "rlib"]
