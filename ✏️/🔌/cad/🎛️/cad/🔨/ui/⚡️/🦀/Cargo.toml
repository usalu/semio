[package]
name = "semio-s-app-cad-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cad app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
cad_document = { path = "../../../../⚡️/🦀", package = "semio-s-app-cad" }
cad_document_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-cad-engine" }
cad_document_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-cad-op" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../../../🧰/⚡️/🦀", package = "semio-framework-core" }
kernel_3d_brepkit = { path = "../../../../../../../../🔨/3d/⚡️/🦀/brep", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../../../../../../../🔨/3d/⚡️/🦀/brep/engine", package = "semio-framework-os-kernel-3d-brep-engine" }
ui_wgpu = { path = "../../../../../../../../../🧰/🔨/ui/⚡️/🦀/wgpu", package = "ui_wgpu" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

[dev-dependencies]
protocol = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
