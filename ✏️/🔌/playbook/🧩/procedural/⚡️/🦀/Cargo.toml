[package]
name = "playbook-module-procedural"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook-module-procedural"

[package.metadata.semio]
contributes = ["playbook.blockKind"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦.rs"

[dependencies]
playbook = { path = "../../../../../../../🧰/🛍️/💻/🔨/workflow/⚡️/🦀", package = "semio-framework-os-kernel-workflow" }
vcs = { path = "../../../../../../../🧰/🛍️/💻/🔨/vcs/⚡️/🦀", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../../🧰/🛍️/💻/🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
flow_core = { path = "../../../../../../../🧰/🛍️/💻/🔨/flow/⚡️/🦀/core", package = "semio-framework-os-kernel-flow-core" }
flow_module_brep = { path = "../../../../../../../🧰/🛍️/💻/🔨/flow/⚡️/🦀/module/brep", default-features = false, package = "semio-s-kernel-flow-module-brep" }
kernel_3d_engine = { path = "../../../../../../🔨/3d/⚡️/🦀/brep/engine", features = ["parallel"], package = "semio-framework-os-kernel-3d-brep-engine" }
semio-framework-plugin = { path = "../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../🧰/⚡️/🦀", package = "semio-framework-core" }
dsl = { path = "../../../../../../../🧰/🛍️/💻/🔨/dsl/⚡️/🦀", package = "semio-framework-os-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
