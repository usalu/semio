[package]
name = "semio-s-app-animate-present-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Animate present app — binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
present = { path = "../../../../⚡️/🦀", package = "semio-s-app-animate-present" }
present_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-animate-present-op" }
present_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-animate-present-engine" }
protocol = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
