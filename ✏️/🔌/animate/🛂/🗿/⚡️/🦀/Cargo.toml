[package]
name = "animate-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:animate"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "animate"
ports = { react = 6051, wgpu = 6151 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦.rs"

[dependencies]
present = { path = "../../../../🎛️/present/⚡️/🦀", package = "semio-s-app-animate-present" }
present_engine = { path = "../../../../🎛️/present/🔨/engine/⚡️/🦀", package = "semio-s-app-animate-present-engine" }
present_ui = { path = "../../../../🎛️/present/🔨/ui/⚡️/🦀", package = "semio-s-app-animate-present-ui" }
semio-framework-os = { path = "../../../../../../../🧰/🛍️/💻/⚡️/🦀", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", features = ["component-guest"], package = "semio-framework-plugin" }
