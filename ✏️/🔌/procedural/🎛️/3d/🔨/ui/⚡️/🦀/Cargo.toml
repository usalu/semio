[package]
name = "semio-s-app-procedural-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 3D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "📦.rs"

[dependencies]
procedural_3d = { path = "../../../../⚡️/🦀", package = "semio-s-app-procedural-3d" }
procedural_3d_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-procedural-3d-engine" }
procedural_3d_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-procedural-3d-op" }
protocol = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
flow_core = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/flow/⚡️/🦀/core", package = "semio-framework-os-kernel-flow-core" }
playbook = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/workflow/⚡️/🦀", package = "semio-framework-os-kernel-workflow" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../../../🧰/⚡️/🦀", package = "semio-framework-core" }
ui_wgpu = { path = "../../../../../../../../../🧰/🔨/ui/⚡️/🦀/wgpu", package = "ui_wgpu" }
ui_styling = { path = "../../../../../../../../../🧰/🔨/ui/⚡️/🦀/styling", package = "ui_styling" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
