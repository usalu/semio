[package]
name = "semio-s-app-procedural-3d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 3D app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "📦.rs"

[dependencies]
procedural_3d = { path = "../../../../⚡️/🦀", package = "semio-s-app-procedural-3d" }
procedural_3d_dsl = { path = "../../../dsl/⚡️/🦀", package = "semio-s-app-procedural-3d-dsl" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
flow_core = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/flow/⚡️/🦀/core", package = "semio-framework-os-kernel-flow-core" }
flow_module_brep = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/flow/⚡️/🦀/module/brep", default-features = false, package = "semio-s-kernel-flow-module-brep" }
playbook = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/workflow/⚡️/🦀", package = "semio-framework-os-kernel-workflow" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../../../🧰/⚡️/🦀", package = "semio-framework-core" }
ui_wgpu = { path = "../../../../../../../../../🧰/🔨/ui/⚡️/🦀/wgpu", package = "ui_wgpu" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
kernel_3d_scene = { path = "../../../../../../../../🔨/3d/⚡️/🦀/scene", package = "semio-framework-os-kernel-3d-scene" }
