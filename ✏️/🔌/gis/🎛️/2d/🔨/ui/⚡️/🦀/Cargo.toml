[package]
name = "semio-s-app-gis-2d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "GIS 2D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "📦.rs"

[dependencies]
gis2d = { path = "../../../../⚡️/🦀", package = "semio-s-app-gis-2d" }
gis2d_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-gis-2d-engine" }
gis2d_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-gis-2d-op" }
protocol = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
framework_surface_tiled_map = { path = "../../../../../../../../../🧰/🔨/surface/⚡️/🦀/tiled-map", package = "framework_surface_tiled_map" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
