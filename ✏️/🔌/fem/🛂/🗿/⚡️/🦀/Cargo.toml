[package]
name = "semio-s-plugin-fem"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:fem"

[[package.metadata.semio.playground]]
variant = "fem2d"
app = "fem2d-play"
aliases = ["fem 2d"]
ports = { react = 6086, wgpu = 6186 }

[[package.metadata.semio.playground]]
variant = "fem3d"
app = "fem3d-play"
aliases = ["fem 3d"]
ports = { react = 6087, wgpu = 6187 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦.rs"

[dependencies]
fem2d = { path = "../../../../🎛️/2d/⚡️/🦀", package = "semio-s-app-fem-2d" }
fem2d_ui = { path = "../../../../🎛️/2d/🔨/ui/⚡️/🦀", package = "semio-s-app-fem-2d-ui" }
fem3d = { path = "../../../../🎛️/3d/⚡️/🦀", package = "semio-s-app-fem-3d" }
fem3d_ui = { path = "../../../../🎛️/3d/🔨/ui/⚡️/🦀", package = "semio-s-app-fem-3d-ui" }
semio-framework-plugin = { path = "../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", features = ["component-guest"], package = "semio-framework-plugin" }
