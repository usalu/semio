[package]
name = "semio-s-app-raster-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Raster app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "📦.rs"

[dependencies]
raster = { path = "../../../../⚡️/🦀", package = "semio-s-app-raster" }
