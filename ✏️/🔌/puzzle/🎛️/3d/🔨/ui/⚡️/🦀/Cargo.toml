[package]
name = "semio-s-app-puzzle-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle 3d app — DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "📦.rs"

[dependencies]
puzzle_3d = { path = "../../../../⚡️/🦀", package = "semio-s-app-puzzle-3d" }
puzzle_3d_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-puzzle-3d-engine" }
puzzle_3d_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-puzzle-3d-op" }
puzzle_3d_dsl = { path = "../../../dsl/⚡️/🦀", package = "semio-s-app-puzzle-3d-dsl" }
semio-framework-core = { path = "../../../../../../../../../🧰/⚡️/🦀", package = "semio-framework-core" }
semio-framework-os = { path = "../../../../../../../../../🧰/🛍️/💻/⚡️/🦀", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
