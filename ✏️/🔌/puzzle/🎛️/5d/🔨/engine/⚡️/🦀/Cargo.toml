[package]
name = "semio-s-app-puzzle-5d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle 5d app — headless compute (constitutional: engine)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
puzzle_5d = { path = "../../../../⚡️/🦀", package = "semio-s-app-puzzle-5d" }
puzzle_3d_engine = { path = "../../../../../3d/🔨/engine/⚡️/🦀", package = "semio-s-app-puzzle-3d-engine" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
mathematical_graph_manifest = { path = "../../../../../../../../../🧰/🔨/math/⚡️/🦀/graph/manifest", package = "semio-framework-os-kernel-math-graph-manifest" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
