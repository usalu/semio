[package]
name = "semio-s-app-puzzle-5d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle 5d app — DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "📦.rs"

[dependencies]
puzzle_5d = { path = "../../../../⚡️/🦀", package = "semio-s-app-puzzle-5d" }
puzzle_5d_engine = { path = "../../../engine/⚡️/🦀", package = "semio-s-app-puzzle-5d-engine" }
puzzle_5d_op = { path = "../../../op/⚡️/🦀", package = "semio-s-app-puzzle-5d-op" }
puzzle_5d_dsl = { path = "../../../dsl/⚡️/🦀", package = "semio-s-app-puzzle-5d-dsl" }
infinite_board_port_directed_normal = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/infinite/⚡️/🦀/board/port/directed/normal", package = "semio-framework-os-kernel-infinite-board-port-directed-normal" }
semio-framework-os = { path = "../../../../../../../../../🧰/🛍️/💻/⚡️/🦀", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
store = { path = "../../../../../../../../../🧰/🛍️/💻/🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
