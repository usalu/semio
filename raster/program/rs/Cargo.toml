[package]
name = "raster-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:raster"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "raster"
ports = { react = 6060, wgpu = 6160 }
engines = ["framework/surface/paint/rs"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
semio-framework-program = { path = "../../../framework/program/rs" }
vcs = { path = "../../../vcs/rs" }
store = { path = "../../../store/rs" }
protocol = { path = "../../../protocol/rs" }
dsl = { path = "../../../dsl/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

