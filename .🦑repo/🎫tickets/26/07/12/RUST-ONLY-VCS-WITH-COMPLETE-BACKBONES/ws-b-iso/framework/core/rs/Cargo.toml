[package]
name = "semio-framework-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Render-independent framework kernel: Platform, ActionBus, declarative UiTree, layouts"

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
ts-rs = { version = "10", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
# 🧬 Generates the TypeScript mirror for boundary/protocol types (see `js/generated/manifest.ts`);
# never enabled by default so `ts-rs` never affects the plain `cargo build`/`cargo test` path.
typegen = ["dep:ts-rs"]
