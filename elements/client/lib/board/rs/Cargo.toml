[package]
name = "elements_board"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[build-dependencies]
serde_json = "1.0.140"

[dependencies]
nalgebra = { version = "0.33.2", default-features = false, features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vello = { version = "0.9.0", default-features = true }
usvg = "0.46.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
