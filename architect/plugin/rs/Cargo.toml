[package]
name = "architect-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:architect"

[[package.metadata.semio.playground]]
variant = "architect"
ports = { react = 6090, wgpu = 6190 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
architect_program = { path = "../../program/rs" }
vcs = { path = "../../../vcs/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
