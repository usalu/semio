[package]
name = "db_storage_postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db storage backend over postgres"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db_core = { path = "../../../core/rs" }
db_storage = { path = "../../../storage/rs" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
