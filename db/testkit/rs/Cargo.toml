[package]
name = "db_testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db testkit — SimRuntime, FaultStorage, CrashHarness, generators, cross-crate laws, benchmarks"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db = { path = "../../rs" }
pack_testkit = { path = "../../../pack/testkit/rs" }
# 🎯 Genuinely missing additions (not in the stub's dependency list), noted per this wave's
# instructions: the `db` facade (above) is still an unimplemented stub as of this wave — every law/
# harness below drives the family's REAL, already-implemented crates directly (`db_engine::Database`
# for the facade-shaped laws, `db_document::DocumentEngine` one layer below it for laws `db_engine`
# doesn't yet expose a path to — snapshot, preview, undo, projections — see this crate's module doc).
# `db_core`/`db_storage`/`db_state`/`db_document`/`db_engine`/`db_projection`/`db_sync`/`db_actor`
# are the crates this testkit's laws/harnesses actually call by name; `protocol` for the
# `OperationEnvelope` family the whole `db` command pipeline is built on; `pack` for
# `ByteRange`/`ContentHash`, named directly because `FaultStorage`'s trait impls must repeat
# `db_storage`'s own `WalStorage`/`PayloadStorage` method signatures verbatim; `serde_json` to build
# schema-erased command payloads the same way `db_document`'s own tests do.
db_core = { path = "../../core/rs" }
db_storage = { path = "../../storage/rs" }
db_state = { path = "../../state/rs" }
db_document = { path = "../../document/rs" }
db_engine = { path = "../../engine/rs" }
db_projection = { path = "../../projection/rs" }
db_sync = { path = "../../sync/rs" }
db_actor = { path = "../../actor/rs" }
protocol = { path = "../../../protocol/rs" }
pack = { path = "../../../pack/rs" }
serde_json = "1"

[[bench]]
name = "db"
harness = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

