[package]
name = "db_compact"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db compaction and GC — WAL merge/recompress, snapshot consolidation, payload/tombstone/branch/preview GC"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs" }
db_wal = { path = "../../wal/rs" }
db_storage = { path = "../../storage/rs" }
db_snapshot = { path = "../../snapshot/rs" }
db_index = { path = "../../index/rs" }
db_state = { path = "../../state/rs" }
