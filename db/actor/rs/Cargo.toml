[package]
name = "db_actor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db actor runtime — bounded priority mailbox, supervision, generations, hand-rolled send/recv/reply futures, thread spawner"

[lints]
workspace = true
[lib]
path = "lib.rs"

[features]
default = ["thread"]
thread = []

[dependencies]
db_core = { path = "../../core/rs" }
