[package]
name = "lowpoly_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
kernel_3d_mesh = { path = "../../../s/kernel/geometry/3d/mesh/rs", package = "semio-s-kernel-geometry-3d-mesh" }
vcs = { path = "../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
dsl = { path = "../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
thiserror = "2.0.12"

[dev-dependencies]
cad-plugin = { path = "../../../s/plugin/cad/plugin/rs", package = "cad-plugin" }
cad_document = { path = "../../../s/plugin/cad/rs", package = "cad_document" }
kernel_3d_brepkit = { path = "../../../s/kernel/geometry/3d/brep/rs", package = "semio-s-kernel-geometry-3d-brep" }
kernel_3d_engine = { path = "../../../s/kernel/geometry/3d/brep/engine/rs", package = "semio-s-kernel-geometry-3d-brep-engine" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
