[package]
name = "lowpoly_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
kernel_3d_mesh = { path = "../../../kernel/3d/mesh/rs" }
vcs = { path = "../../../vcs/rs" }
dsl = { path = "../../../dsl/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
thiserror = "2.0.12"

[dev-dependencies]
cad-plugin = { path = "../../../cad/plugin/rs" }
cad_document = { path = "../../../cad/rs" }
kernel_3d_brepkit = { path = "../../../kernel/3d/brep/rs" }
kernel_3d_engine = { path = "../../../kernel/3d/brep/engine/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
