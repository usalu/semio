[package]
name = "geometry_drawing_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
path = "lib.rs"

[features]
default = ["booleans", "trace"]
booleans = ["dep:geo"]
trace = []

[dependencies]
async-trait = "0.1.88"
geometry_drawing_engine = { path = "../engine" }
geo = { version = "0.29", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
