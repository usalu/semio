[package]
name = "pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format facade — re-exports the core/format/value/io/async/http/index layers"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
pack_core = { path = "../core/rs" }
pack_format = { path = "../format/rs" }
pack_value = { path = "../value/rs" }
pack_io = { path = "../io/rs" }
pack_async = { path = "../async/rs" }
pack_http = { path = "../http/rs" }
pack_index = { path = "../index/rs" }
dsl_schema = { path = "../../dsl/schema/rs" }
