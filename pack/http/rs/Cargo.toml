[package]
name = "pack_http"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format HTTP layer — range-request transport trait, HTTP source, chunk LRU cache"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
pack_core = { path = "../../core/rs" }
pack_format = { path = "../../format/rs" }
pack_async = { path = "../../async/rs" }
async-trait = "0.1"
ureq = { version = "2", optional = true }

[features]
ureq = ["dep:ureq"]
