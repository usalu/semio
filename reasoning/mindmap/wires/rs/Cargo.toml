[dependencies]
reasoning_mindmap = { path = "../../rs" }
infinite_board_normal_undirected = { path = "../../../../s/kernel/infinite/board/normal/undirected/rs", package = "semio-s-kernel-infinite-board-normal-undirected" }
infinite_cavas = { path = "../../../../s/kernel/infinite/canvas/rs", package = "semio-s-kernel-infinite-canvas" }
vcs = { path = "../../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
