[package]
name = "reasoning_mindmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../vcs/rs" }
mathematical_graph_normal_directed = { path = "../../mathematical/graph/normal/directed" }
infinite_cavas = { path = "../../infinite/cavas/rs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
