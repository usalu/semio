[package]
name = "playbook-module-procedural"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook-module-procedural"

[package.metadata.semio]
contributes = ["playbook.blockKind"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
playbook = { path = "../../../rs" }
vcs = { path = "../../../../vcs/rs" }
store = { path = "../../../../store/rs" }
protocol = { path = "../../../../protocol/rs" }
flow_core = { path = "../../../../flow/core/rs" }
flow_module_brep = { path = "../../../../flow/module/brep/rs", default-features = false }
kernel_3d_engine = { path = "../../../../kernel/3d/brep/engine/rs", features = ["parallel"] }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../../framework/core/rs" }
dsl = { path = "../../../../dsl/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
