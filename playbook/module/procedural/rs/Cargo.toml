[package]
name = "playbook-module-procedural"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook-module-procedural"

[package.metadata.semio]
contributes = ["playbook.blockKind"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
playbook = { path = "../../../../s/kernel/playbook/rs", package = "semio-s-kernel-playbook" }
vcs = { path = "../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
flow_core = { path = "../../../../s/kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
flow_module_brep = { path = "../../../../s/kernel/flow/module/brep/rs", default-features = false, package = "semio-s-kernel-flow-module-brep" }
kernel_3d_engine = { path = "../../../../s/kernel/geometry/3d/brep/engine/rs", features = ["parallel"], package = "semio-s-kernel-geometry-3d-brep-engine" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../../framework/core/rs" }
dsl = { path = "../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
