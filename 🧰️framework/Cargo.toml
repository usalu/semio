member-manifests = ["📦️packages/🦀️rust/Cargo.toml", "🔨️modules/**/📦️packages/🦀️rust/Cargo.toml"]
exclude-patterns = ["**/🏅️standards/**", "**/🔮️oracles/**", "**/👽️guest/**"]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

  [workspace.dependencies]
  wasm-bindgen = "0.2.106"

    [workspace.dependencies.pack]
    path = "🔨️modules/🎒️pack/📦️packages/🦀️rust"
    package = "semio-framework-pack"

    [workspace.dependencies.semio-framework-3d]
