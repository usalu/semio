[package]
name = "semio-framework-os-kernel-pack-http"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format HTTP layer — range-request transport trait, HTTP source, chunk LRU cache"


[lints]
workspace = true
[lib]
name = "pack_http"
path = "../../../🌐️http/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
pack_core = { path = "../../../🫀️core/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-pack-core" }
pack_format = { path = "../../../📐️format/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-pack-format" }
pack_async = { path = "../../../⏳️async/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-pack-async" }
async-trait = "0.1"
ureq = { version = "2", optional = true }

[dev-dependencies]
futures-lite = "2"

[features]
ureq = ["dep:ureq"]
