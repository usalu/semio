[package]
name = "semio-framework-os-kernel-store-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Browser Web Worker WASM actor for store's DocumentHost"

[lints]
workspace = true

[lib]
name = "store_worker"
crate-type = ["cdylib", "rlib"]
path = "../../../👷️worker/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
store_sync = { path = "../../../🔄️sync/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store-sync" }
tokio = { version = "1", features = ["sync"], default-features = false }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent", "Worker"] }
