[package]
name = "semio-framework-os-kernel-db-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db engine — Database supervisor, catalog actor, open/recovery, document lifecycle, VersionGraph impl over vcs, sagas, migration"

[lints]
workspace = true
[lib]
name = "db_engine"
path = "../../../⚙️engine/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
db_core = { path = "../../../🫀️core/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-core" }
db_actor = { path = "../../../🎭️actor/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-actor" }
db_document = { path = "../../../📄️document/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-document" }
db_storage = { path = "../../../🗄️storage/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-storage" }
db_wal = { path = "../../../📝️wal/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-wal" }
db_compact = { path = "../../../🗜️compact/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-compact" }
db_sync = { path = "../../../🔄️sync/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-sync" }
db_security = { path = "../../../🔒️security/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-security" }
db_observe = { path = "../../../👁️observe/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-observe" }
db_cluster = { path = "../../../🌐️cluster/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-db-cluster" }
protocol = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-protocol" }
vcs = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌿️vcs/⚡️implementation/🦀️rust", optional = true, package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", optional = true, package = "semio-framework-os-kernel-store" }
# 🎯️ Genuinely missing additions (not in the stub's dependency list), noted per the wave's
# instructions: `pack_core` because the frozen `CommandReceipt.state_hash` field is typed
# `pack_core::ContentHash` verbatim in the contract, and this crate names that path directly
# (not just via `db_document`/`db_wal`'s own re-exports); `serde`+`serde_json` because this crate's
# catalog root encoding and its `vcs` feature's schema-erased `HashProjection`/`HashOperation`
# (see `//#region 🔖️VersionGraph`) need `derive(Serialize, Deserialize)` directly.
pack_core = { path = "../../../../🎒️pack/🫀️core/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-pack-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["vcs"]
vcs = ["dep:vcs", "dep:store"]
tokio = []

