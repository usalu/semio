[package]
name = "semio-framework-os-kernel-infinite-board-port-directed-dag"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "infinite_board_port_directed_dag"
crate-type = ["rlib", "cdylib"]
path = "../../../../../../🎲️board/🔌️port/➡️directed/🕸️dag/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
vcs = { path = "../../../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌿️vcs/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-dsl" }
ui_styling = { path = "../../../../../../../../../../🔨️module/🖱️ui/🎨️styling/⚡️implementation/🦀️rust", package = "semio-framework-ui-styling" }
infinite_board_port_directed = { path = "../../../../../../🎲️board/🔌️port/➡️directed/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-infinite-board-port-directed" }
mathematical_graph_manifest = { path = "../../../../../../../../../../🔨️module/🧮️math/🕸️graph/🛂️manifest/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph-manifest" }
mathematical_graph_dsl = { path = "../../../../../../../../../../🔨️module/🧮️math/🕸️graph/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph-dsl" }
mathematical_graph_drawing = { path = "../../../../../../../../../../🔨️module/🧮️math/🕸️graph/🖊️drawing/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph-drawing" }
mathematical_graph = { path = "../../../../../../../../../../🔨️module/🧮️math/🕸️graph/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph" }
infinite_canvas = { path = "../../../../../../🖼️canvas/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
