[package]
name = "semio-framework-os-kernel-flow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "flow_core"
crate-type = ["rlib", "cdylib"]
path = "../../../🫀️core/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
vcs = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌿️vcs/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-dsl" }
flow_module_brep = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/📐️brep", default-features = false, package = "semio-s-kernel-flow-module-brep" }
flow_module_draw = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/🖍️draw", default-features = false, package = "semio-s-kernel-flow-module-draw" }
flow_module_bim = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/🏗️bim", default-features = false, package = "semio-s-kernel-flow-module-bim" }
flow_module_core = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/🫀️core", default-features = false, package = "semio-s-kernel-flow-module-core" }
flow_module_dictionary = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/📖️dictionary", default-features = false, package = "semio-s-kernel-flow-module-dictionary" }
flow_module_list = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/📃️list", default-features = false, package = "semio-s-kernel-flow-module-list" }
flow_module_logic = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/🧠️logic", default-features = false, package = "semio-s-kernel-flow-module-logic" }
flow_module_math = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🔨️module/🧮️math", default-features = false, package = "semio-s-kernel-flow-module-math" }
