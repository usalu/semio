kernel_3d_engine = { path = "../../../../../../../../✏️s/🔨️module/🧊️3d/📐️brep/⚙️engine/⚡️implementation/🦀️rust", features = ["parallel"], package = "semio-framework-os-kernel-3d-brep-engine" }
semio-framework-core = { path = "../../../../../../../../🧰️framework/⚡️implementation/🦀️rust", package = "semio-framework-core" }
neural_engine = { path = "../../../../🧠️neural/⚙️engine/⚡️implementation/🦀️rust", features = ["parallel"], package = "semio-framework-os-kernel-neural-engine" }
neural_dag = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🧠️neural/⚡️implementation/🦀️rust/🕸️dag", package = "semio-framework-kernel-neural-dag" }
mathematical_graph_manifest = { path = "../../../../../../../🔨️module/🧮️math/🕸️graph/🛂️manifest/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph-manifest" }
infinite_board_port_directed_dag = { path = "../../../../♾️infinite/🎲️board/🔌️port/➡️directed/🕸️dag/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-infinite-board-port-directed-dag" }
infinite_cavas = { path = "../../../../♾️infinite/🖼️canvas/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas" }
ui_styling = { path = "../../../../../../../🔨️module/🖱️ui/🎨️styling/⚡️implementation/🦀️rust", package = "semio-framework-ui-styling" }
playbook = { path = "../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🔁️workflow/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-workflow" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
