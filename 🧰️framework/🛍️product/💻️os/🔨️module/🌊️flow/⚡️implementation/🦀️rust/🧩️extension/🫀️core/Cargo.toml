version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "flow_extension_core"
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🧩️extension/🫀️core/📦️lib.rs"

