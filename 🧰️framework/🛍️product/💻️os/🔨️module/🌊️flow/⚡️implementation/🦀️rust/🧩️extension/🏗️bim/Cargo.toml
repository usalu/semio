[package]
name = "semio-s-kernel-flow-extension-bim"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "flow_extension_bim"
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🧩️extension/🏗️bim/📦️lib.rs"

[features]
default = ["standalone-wasm"]
standalone-wasm = ["dep:wasm-bindgen"]

[dependencies]
flow_extension_sdk = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🌊️flow/⚡️implementation/🦀️rust/🧩️extension/🕸️wasm", package = "semio-s-kernel-flow-extension-wasm" }
neural_engine = { path = "../../../../../🧠️neural/⚙️engine/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.77"
wasm-bindgen = { version = "0.2.106", optional = true }
