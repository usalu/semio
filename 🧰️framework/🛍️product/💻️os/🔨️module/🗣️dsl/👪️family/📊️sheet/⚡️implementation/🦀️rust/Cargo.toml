[package]
name = "semio-framework-os-kernel-dsl-family-sheet"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The calc-sheet family notation kit — an expression evaluator (dsl_schema::ExprValue deliberately parses/prints but never evaluates; this is the consuming-technology evaluator its own doc comment calls for) and the self-verifying `name = expr -> value` trace line, shared by fem2d/3d and the norm-family apps"


[lints]
workspace = true
[lib]
name = "dsl_family_sheet"
path = "../../../../👪️family/📊️sheet/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
dsl_core = { package = "semio-framework-os-kernel-dsl-core", path = "../../../../🫀️core/⚡️implementation/🦀️rust" }
dsl_schema = { package = "semio-framework-os-kernel-dsl-schema", path = "../../../../🧬️schema/⚡️implementation/🦀️rust" }
dsl_notation = { package = "semio-framework-os-kernel-dsl-notation", path = "../../../../🖋️notation/⚡️implementation/🦀️rust" }

[dev-dependencies]
dsl_grammar = { package = "semio-framework-os-kernel-dsl-grammar", path = "../../../../📖️grammar/⚡️implementation/🦀️rust" }
