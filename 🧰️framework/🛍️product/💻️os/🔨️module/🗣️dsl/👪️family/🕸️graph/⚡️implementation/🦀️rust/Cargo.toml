[package]
name = "semio-framework-os-kernel-dsl-family-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The graph family notation kit — node/edge/chain statement piece-parsers shared by graph-shaped app grammars (trinity, dag, flow, sequence, wires, puzzle, space, architect, procedural), built on dsl_notation's edge/arrow literal"


[lints]
workspace = true
[lib]
name = "dsl_family_graph"
path = "../../../../👪️family/🕸️graph/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
dsl_core = { package = "semio-framework-os-kernel-dsl-core", path = "../../../../🫀️core/⚡️implementation/🦀️rust" }
dsl_notation = { package = "semio-framework-os-kernel-dsl-notation", path = "../../../../🖋️notation/⚡️implementation/🦀️rust" }

[dev-dependencies]
dsl_grammar = { package = "semio-framework-os-kernel-dsl-grammar", path = "../../../../📖️grammar/⚡️implementation/🦀️rust" }
