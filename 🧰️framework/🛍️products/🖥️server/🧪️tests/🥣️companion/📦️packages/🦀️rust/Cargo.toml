[package]
workspace = "../../../../../../.."
name = "semio-framework-server-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of the server product: actor turn, policy, storage conformance and gateway laws"
publish = false

[package.metadata.semio]
role = "product"
id = "server-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-server = { path = "../../../../📦️packages/🦀️rust", features = ["conformance", "testkit"] }

[dev-dependencies]
semio-framework-async = { workspace = true }
semio-framework-async-macros = { path = "../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
semio-framework-dispatch-macros = { path = "../../../../../../🔨️modules/🔀️dispatch/📦️packages/🦀️rust" }
serde_json = "1.0.140"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "net", "time"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
