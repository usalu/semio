[package]
workspace = "../../../../../../.."
name = "semio-framework-server-contract"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Server contract: the command and query envelopes, outcomes, offline policies, actor keys, lane records and instance manifests every party agrees on without sharing a runtime. Pure data; the optimistic replica and the authority both link it."

[package.metadata.semio]
role = "product"
id = "server-contract"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-replication = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
