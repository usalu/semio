[package]
workspace = "../../../../../../../.."
name = "semio-framework-server-presence"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Server presence rooms: the roster with colour leases, the rooms with their readers, pages and per-address outflow budget, and the state frame admission"

[package.metadata.semio]
role = "product"
id = "server-presence"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-async = { workspace = true }
semio-framework-server-contract = { path = "../../../../🧬️contract/📦️packages/🦀️rust" }
semio-framework-server-throttle = { path = "../../../../🚦️throttle/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
