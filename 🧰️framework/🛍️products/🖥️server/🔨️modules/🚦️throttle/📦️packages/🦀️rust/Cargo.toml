[package]
workspace = "../../../../../../.."
name = "semio-framework-server-throttle"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Server throttle: per-address token buckets for writes, reads and socket upgrades, caps on open sockets and requests in flight, over a bounded table of addresses; pure bookkeeping with no transport and no clock."

[package.metadata.semio]
role = "product"
id = "server-throttle"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]

[dev-dependencies]
# 🔮️ Third-party oracle of the throttle's token bucket: an independent implementation of the generic
# cell rate algorithm, run over the same schedules as `🧪️tests/🧫️fixtures/🚦️throttle/🔣️.json`.
governor = { version = "0.10", default-features = false, features = ["std"] }
serde_json = "1.0.140"
