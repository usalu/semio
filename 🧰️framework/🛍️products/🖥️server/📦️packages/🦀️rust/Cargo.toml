[package]
name = "semio-framework-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Authoritative application server product: CQRS command/query contracts, the actor turn protocol, policy vocabulary and the server-instance framework that hub and zentrale compose. Speaks the replication contract; never depends on the os product."

[package.metadata.semio]
role = "product"
id = "server"

[lints]
workspace = true

[lib]
name = "server"
path = "🦀️.rs"

[dependencies]
semio-framework-async = { workspace = true }
semio-framework-replication = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "net", "time"] }
futures = "0.3"
# 🔀️ O1 (drop dyn dispatch, dedyn-fw-server): `#[dyn_enum]`/`dyn_enum_close!` — every former
# `dyn <Trait>` seam in `storage`/`authority`/`policy`/`gateway` closes over a generated enum
# instead of a boxed trait object.
semio-framework-dispatch-macros = { path = "../../../../🔨️modules/🔀️dispatch/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
