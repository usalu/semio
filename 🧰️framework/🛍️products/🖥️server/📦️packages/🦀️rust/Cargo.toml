[package]
name = "semio-framework-server"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Authoritative application server product: CQRS command/query contracts, the actor turn protocol, policy vocabulary and the server-instance framework that hub and zentrale compose. Speaks the replication contract; never depends on the os product."

[package.metadata.semio]
role = "product"
id = "server"

[lints]
workspace = true

[lib]
name = "server"
path = "🦀️.rs"

[features]
# 🔬️ Compiles `🧪️tests/🔬️conformance/🦀️.rs` — the four storage roles' contract as backend-generic
# assertion functions — into the library, so an instance crate can hold its own durable backends
# against the identical bodies the reference in-memory ones are held against. Meant for a
# dev-dependency entry only; no default build enables it.
conformance = []

[dependencies]
semio-framework-async = { workspace = true }
semio-framework-replication = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "net", "time"] }
futures = "0.3"
# 🔀️ O1 (drop dyn dispatch, dedyn-fw-server): `#[dyn_enum]`/`dyn_enum_close!` — every former
# `dyn <Trait>` seam in `storage`/`authority`/`policy`/`gateway` closes over a generated enum
# instead of a boxed trait object.
semio-framework-dispatch-macros = { path = "../../../../🔨️modules/🔀️dispatch/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }

# 🔒️ The cross-crate half of the `dyn_enum_close!` recipe: an integration test links `server` the
# way hub does, so closing a set of any of the eight `impl Future + Send` ports is gated here.
[[test]]
name = "closed_ports"
path = "../../🧪️tests/🔒️closed-ports/🦀️.rs"

# 🔌️ The Rust half of the cross-language wire gate: every vector of
# `🧫️fixtures/🔌️wire/🔣️.json` round-trips through its contract type, and the fixture's route table
# is checked against `base_router`. `🟦️.ts` runs the same document through the TypeScript twin, so a
# serde rename fails both suites instead of silently splitting the contract in two.
[[test]]
name = "wire"
path = "../../🧪️tests/🔬️wire/🦀️.rs"
