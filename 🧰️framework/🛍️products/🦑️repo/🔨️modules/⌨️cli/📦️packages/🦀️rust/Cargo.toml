[package]
name = "semio-framework-repo-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "semio monorepo orchestrator CLI + TUI dashboard (binary: semio)"

[package.metadata.semio]
role = "tool"

[lints]
workspace = true

[lib]
path = "📦️lib.rs"

[[bin]]
name = "semio"
path = "📦️main.rs"

[dependencies]
ui_tui = { path = "../../../../../../🔨️modules/🖱️ui/📦️packages/🦀️rust", features = ["tui-terminal"], package = "semio-framework-ui" }
ui_styling = { path = "../../../../../../🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
