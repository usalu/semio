[package]
workspace = "../../../../../../.."
name = "semio-framework-repo-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Repository command line with explicit MCP stdio command"

[package.metadata.semio]
role = "tool"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[bin]]
name = "repo"
path = "📦️mcp-main.rs"

