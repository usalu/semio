[package]
name = "semio-framework-repo-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "semio monorepo orchestrator CLI + TUI dashboard (binary: semio)"

[package.metadata.semio]
role = "tool"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[bin]]
name = "semio"
path = "../../🚪️entrypoint/🦀️.rs"

[[bin]]
name = "repo"
path = "📦️mcp-main.rs"

[[bin]]
name = "semio-repo"
path = "📦️cli-main.rs"

[dependencies]
semio-framework-repo-dashboard = { path = "../../../🎛️dashboard/📦️packages/🦀️rust" }
serde = { workspace = true }
serde_json = { workspace = true }
semio-framework-repo-workspace = { path = "../../../🏠️workspace/📦️packages/🦀️rust" }
semio-framework-repo-identity = { path = "../../../🪪️identity/📦️packages/🦀️rust" }
semio-framework-repo-model = { path = "../../../📐️model/📦️packages/🦀️rust" }
semio-framework-repo-languages = { path = "../../../🗣️languages/📦️packages/🦀️rust" }
