# 🧭️ Own workspace root: this crate is linked by generated cache-local hosts by path and must not be
# a member of the repository workspace, whose root manifest is a shared, leased file.
[workspace]

[package]
name = "semio-repo-test-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "🧪️ Rust native host of the semio repository test platform. Domain-neutral and dependency-free."

[lib]
name = "semio_repo_test_host"
path = "📦️lib.rs"

# 🚫️ No dependencies, optional or otherwise. Reference implementations are CONTRIBUTED by the owner
# of the format they reference (see `testContributionDirName` in 🔣️taxonomy.json); the framework host
# supplies only the protocol, the runner and the adapter API. If a dependency ever appears here, the
# framework has started to know about an implementation.
