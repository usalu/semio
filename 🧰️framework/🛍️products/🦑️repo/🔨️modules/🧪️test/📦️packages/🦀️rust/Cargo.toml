[package]
workspace = "../../../../../../.."
name = "semio-repo-test-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "🧪️ Rust native host of the semio repository test platform. Domain-neutral and dependency-free."

[package.metadata.semio]
role = "library"
id = "repo-test-host"

[lib]
name = "semio_repo_test_host"
path = "../../🦀️.rs"

# 🚫️ No third-party dependencies, optional or otherwise. Reference implementations are CONTRIBUTED by
# the owner of the format they reference (see `testOraclesDirName` in 🔣️taxonomy.json); the framework
# host supplies only the protocol, the runner and the adapter API. The one dependency is the
# framework's own workspace-identity crate, so the host and the launcher share a single definition of a
# workspace root. If a third-party dependency ever appears here, the framework has started to know about
# an implementation.

[dependencies]
semio-framework-process-routing-workspace = { path = "../../../../../../🔨️modules/🏃️process/🧭️routing/🏠️workspace/📦️packages/🦀️rust" }
