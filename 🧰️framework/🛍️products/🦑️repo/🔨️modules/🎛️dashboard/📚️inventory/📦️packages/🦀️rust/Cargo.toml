[package]
workspace = "../../../../../../../.."
name = "semio-framework-repo-dashboard-inventory"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "repo dashboard inventory: reads the sources of a workspace into a snapshot, discovers the command registry from them in the background and projects it as launcher rows and wizard steps"

[package.metadata.semio]
role = "tool"
id = "repo-dashboard-inventory"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
dashboard_core = { path = "../../../🧱️invocation-catalog/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-core" }
dashboard_registry = { path = "../../../🎮️registry/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-registry" }
dashboard_repo_domain = { path = "../../../🏛️repo-domain/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-repo-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
semio-framework-repo-tickets = { path = "../../../../🎫️tickets/📦️packages/🦀️rust" }

[dev-dependencies]
dashboard_launch = { path = "../../../🧾️launch/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-launch" }
