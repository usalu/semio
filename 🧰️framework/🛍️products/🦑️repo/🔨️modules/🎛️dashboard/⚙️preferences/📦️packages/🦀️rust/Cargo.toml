[package]
workspace = "../../../../../../../.."
name = "semio-framework-repo-dashboard-preferences"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "repo dashboard preferences: the layered preference files and the declarative keymap"

[package.metadata.semio]
role = "tool"
id = "repo-dashboard-preferences"

[package.metadata.semio.rust-source-boundary]
