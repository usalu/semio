[package]
workspace = "../../../../../../.."
name = "semio-framework-repo-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "semio repo dashboard (binary: semio): the wizard command tree, its pseudo-terminal windows, the session daemon and the repo-domain leaves the Rust domain crates answer in process"

[package.metadata.semio]
role = "tool"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[bin]]
name = "semio"
path = "../../🚪️entrypoint/🦀️.rs"

[dependencies]
dashboard_cli = { path = "../../🧭️cli/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-cli" }
dashboard_core = { path = "../../🧱️invocation-catalog/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-core" }
dashboard_daemon = { path = "../../🌀️daemon/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-daemon" }
dashboard_inventory = { path = "../../📚️inventory/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-inventory" }
dashboard_labels = { path = "../../🖥️terminal/🌐️labels/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-labels" }
dashboard_preferences = { path = "../../⚙️preferences/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-preferences" }
dashboard_repo_domain = { path = "../../🏛️repo-domain/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-repo-domain" }
dashboard_terminal = { path = "../../🖥️terminal/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-terminal" }
dashboard_wire = { path = "../../🌀️daemon/🧵️wire/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-wire" }
serde_json = { workspace = true }
semio-framework-repo-workspace = { path = "../../../🏠️workspace/📦️packages/🦀️rust" }
