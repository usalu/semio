[package]
workspace = "../../../../../../../.."
name = "semio-framework-repo-dashboard-terminal"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "repo dashboard terminal view: the launcher, the managed windows named after their tasks and the keymap-driven controls"

[package.metadata.semio]
role = "tool"
id = "repo-dashboard-terminal"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-filesystem-workspace = { path = "../../../../../../../🔨️modules/📁️filesystem/📝️workspace/📦️packages/🦀️rust" }
dashboard_core = { path = "../../../🧱️invocation-catalog/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-core" }
dashboard_cli = { path = "../../../🧭️cli/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-cli" }
dashboard_daemon = { path = "../../../🌀️daemon/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-daemon" }
dashboard_inventory = { path = "../../../📚️inventory/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-inventory" }
dashboard_labels = { path = "../../🌐️labels/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-labels" }
dashboard_launcher = { path = "../../🚀️launcher/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-launcher" }
dashboard_launch = { path = "../../../🧾️launch/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-launch" }
dashboard_preferences = { path = "../../../⚙️preferences/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-preferences" }
dashboard_registry = { path = "../../../🎮️registry/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-registry" }
dashboard_wire = { path = "../../../🌀️daemon/🧵️wire/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-wire" }
ui_locale = { path = "../../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust", package = "semio-framework-ui-locale" }
ui_styling = { path = "../../../../../../../🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
semio-framework-ui-tui-core = { path = "../../../../../../../🔨️modules/🖱️ui/⌨️tui/🧱️cell-model/📦️packages/🦀️rust" }
semio-framework-ui-tui-engine = { path = "../../../../../../../🔨️modules/🖱️ui/⌨️tui/⚙️engine/📦️packages/🦀️rust" }
semio-framework-ui-tui-frame = { path = "../../../../../../../🔨️modules/🖱️ui/⌨️tui/🏛️frame/📦️packages/🦀️rust" }
semio-framework-ui-tui-terminal = { path = "../../../../../../../🔨️modules/🖱️ui/⌨️tui/📺️terminal/📦️packages/🦀️rust", features = ["native"] }
semio-framework-ui-tui-vt = { path = "../../../../../../../🔨️modules/🖱️ui/⌨️tui/📟️vt/📦️packages/🦀️rust" }
semio-framework-ui-tui-widgets = { path = "../../../../../../../🔨️modules/🖱️ui/⌨️tui/🧩️widgets/📦️packages/🦀️rust" }

[dev-dependencies]
dashboard_core = { path = "../../../🧱️invocation-catalog/📦️packages/🦀️rust", features = ["testkit"], package = "semio-framework-repo-dashboard-core" }
semio-framework-test-fixtures = { path = "../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
serde_json = { workspace = true }
