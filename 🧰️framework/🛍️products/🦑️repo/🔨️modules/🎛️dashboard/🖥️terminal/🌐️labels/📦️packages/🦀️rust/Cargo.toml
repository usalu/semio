[package]
workspace = "../../../../../../../../.."
name = "semio-framework-repo-dashboard-labels"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "repo dashboard labels: every string the native dashboard shows, in every language, in one compile-checked catalogue"

[package.metadata.semio]
role = "tool"
id = "repo-dashboard-labels"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
dashboard_launch = { path = "../../../../🧾️launch/📦️packages/🦀️rust", package = "semio-framework-repo-dashboard-launch" }
