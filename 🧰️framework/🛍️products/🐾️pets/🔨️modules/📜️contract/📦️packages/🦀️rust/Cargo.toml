[package]
workspace = "../../../../../../.."
name = "semio-framework-pets-contract"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pets contract: the Rust twin of the normative pets schema (menageries of rigged species, the stage, its events and frames) and the validation of documents. Pure functions only, bit for bit the results of the TypeScript twin @semio-tech/pets."

[package.metadata.semio]
role = "product"
id = "pets-contract"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["dep:serde_json", "dep:semio-framework-test-fixtures"]

[dependencies]
semio-framework-test-fixtures = { path = "../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust", optional = true }
serde = { workspace = true }
# 🎯️ `float_roundtrip`: without it serde_json reads a long decimal one unit in the last place off, while JSON.parse and Python round correctly; the test kit feeds the unit tests the very doubles the other languages read.
serde_json = { workspace = true, features = ["float_roundtrip"], optional = true }

[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
serde_json = { workspace = true, features = ["float_roundtrip"] }
