[package]
workspace = "../../../../.."
name = "semio-framework-pets"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pets product façade: the one crate (lib `pets`) the language-agnostic subject hosts link. The pure core is carved into the producer crates semio-framework-pets-contract, -kinematics, -clearance, -traversal, -interaction, -character and -staging; this crate re-exports exactly the names the cases call, bit for bit the results of the TypeScript twin @semio-tech/pets."

[package.metadata.semio]
role = "product"
id = "pets"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "pets"
path = "../../🦀️.rs"

[dependencies]
semio-framework-pets-contract = { path = "../../🔨️modules/📜️contract/📦️packages/🦀️rust" }
semio-framework-pets-kinematics = { path = "../../🔨️modules/⚙️kinematics/📦️packages/🦀️rust" }
semio-framework-pets-clearance = { path = "../../🔨️modules/🚧️clearance/📦️packages/🦀️rust" }
semio-framework-pets-traversal = { path = "../../🔨️modules/🧭️traversal/📦️packages/🦀️rust" }
semio-framework-pets-interaction = { path = "../../🔨️modules/🖱️interaction/📦️packages/🦀️rust" }
semio-framework-pets-character = { path = "../../🔨️modules/🎭️character/📦️packages/🦀️rust" }
semio-framework-pets-staging = { path = "../../🔨️modules/🎬️staging/📦️packages/🦀️rust" }
# 🎯️ `float_roundtrip`: without it serde_json reads a long decimal one unit in the last place off (measured:
# 0.9421396472025663 came back as 0.9421396472025664), while JSON.parse and Python round correctly. The subject
# hosts and the unit tests must feed the twins the very doubles the other languages read, or nothing is bit-exact.
serde_json = { workspace = true, features = ["float_roundtrip"] }
