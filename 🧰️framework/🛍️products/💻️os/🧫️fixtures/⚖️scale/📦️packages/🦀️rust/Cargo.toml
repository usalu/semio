cargo-features = ["trim-paths"]

[package]
name = "semio-framework-os-scale-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME F1: one parametric wasm32-wasip2 actor component whose manifest profile (idle/cpu/ui/io/hang/crash/stateful) selects its handwritten reactor behaviour, proving the ABI at 50-plugin x 50-extension scale."

[lints]
workspace = true

[package.metadata.component]
package = "semio:scale-fixture"

[package.metadata.semio]
role = "testkit"

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[features]
default = []
component-guest = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# 🧬️ Must track the guest SDK's pin (`🔌️plugin/📦️packages/🦀️rust`), which moved to 0.57.1 when the
# schema gained WASI-0.3 `async func`/`stream<T>` syntax: this fixture has its OWN `generate!` over
# the SAME `🧬️schema` package, so 0.36.0's wit-parser rejected the whole package and the fixture wasm
# — and therefore the scale bench — could not build at all. Any crate with an independent `generate!`
# against that schema has to move in lockstep; there is no per-world parsing.
wit-bindgen = { version = "0.57.1", features = ["macros"] }
