<!doctype html>
<html>
<head><meta charset="utf-8"><title>terra-jco-spike</title></head>
<body>
<h1>terra-jco-spike — Web Worker harness</h1>
<pre id="out">running...</pre>
<script type="module">
  const out = document.getElementById("out");
  const worker = new Worker("./🧵️worker.js", { type: "module" });
  const lines = [];
  worker.onmessage = (ev) => {
    const msg = ev.data;
    if (msg.kind === "log") {
      lines.push(msg.text);
      out.textContent = lines.join("\n");
      console.log("[worker]", msg.text);
    } else if (msg.kind === "done") {
      lines.push(`==== DONE, overall=${msg.overall} ====`);
      out.textContent = lines.join("\n");
      window.__jcoprobeResult = msg;
      console.log("[worker] DONE", JSON.stringify(msg));
    }
  };
  worker.onerror = (ev) => {
    lines.push(`WORKER ERROR: ${ev.message} (${ev.filename}:${ev.lineno})`);
    out.textContent = lines.join("\n");
    window.__jcoprobeError = ev.message;
    console.error("[worker error]", ev.message, ev.filename, ev.lineno);
  };
</script>
</body>
</html>
