[package]
name = "semio-turnharness-host"
version = "0.1.0"
edition = "2021"
publish = false

# 🧪️ terra-async-harness-spike: own workspace root, same reasoning as 🖥️host/Cargo.toml.
[workspace]

[[bin]]
name = "semio-turnharness-host"
path = "🦀️main.rs"

[dependencies]
wasmtime = { version = "47.0.3", features = ["cranelift", "component-model", "component-model-async"] }
wasmtime-wasi = "47.0.3"
anyhow = "1"
futures = "0.3"
# 🧪️ Q6: mission asks that the runtime receive a `tokio::runtime::Handle`, not construct a Runtime
# (policy: tokio is owned by `semio-framework-os-services`) — needs the full `rt-multi-thread` +
# `time`/`sync`/`macros` feature set to build a real multi-thread Runtime here and hand its Handle
# down, mirroring that policy inside a standalone harness.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
