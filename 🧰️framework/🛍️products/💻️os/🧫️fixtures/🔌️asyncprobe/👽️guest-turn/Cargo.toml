[package]
name = "semio-turnharness-guest"
version = "0.1.0"
edition = "2021"
publish = false

# 🧪️ terra-async-harness-spike: own workspace root, same reasoning as 👽️guest/Cargo.toml.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "🦀️component.rs"

[dependencies]
wit-bindgen = { version = "0.57.1", features = ["macros"] }

[profile.release]
opt-level = "s"
