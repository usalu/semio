[package]
name = "semio-asyncprobe-tlsprobe"
version = "0.1.0"
edition = "2021"
publish = false

# 🧪️ terra-probe-spikes W6 S8 spike: own workspace root, same reasoning as the other asyncprobe
# fixture manifests — never a member of the repo's root workspace.
[workspace]

[[bin]]
name = "semio-asyncprobe-tlsprobe"
path = "🦀️main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
