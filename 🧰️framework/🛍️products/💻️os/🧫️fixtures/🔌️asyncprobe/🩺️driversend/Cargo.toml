[package]
name = "semio-asyncprobe-driversend"
version = "0.1.0"
edition = "2021"
publish = false

# 🧪️ terra-probe-spikes W6 S7 spike: own workspace root, same reasoning as the async probe's
# guest/host manifests — never a member of the repo's root workspace.
[workspace]

[[bin]]
name = "semio-asyncprobe-driversend"
path = "🦀️main.rs"

# 🧪️ Versions/features copied verbatim from
# `🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust/Cargo.toml`'s `sqlx`/`neo4rs`
# lines — this crate exists purely to type-check `assert_send::<T: Send>` against their query
# future types, never to actually connect to a database.
[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
neo4rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
