[package]
name = "semio-brepprobe-wasmpollster"
version = "0.1.0"
edition = "2021"
publish = false

# 🧪️ terra-brep-probe spike (packet brep-probe): deliberately its own workspace root, same
# pattern as 🔌️asyncprobe/👽️guest/Cargo.toml — never a member of the repo's root workspace.
[workspace]

[[bin]]
name = "wasmpollster"
path = "🦀️src/main.rs"

[dependencies]
pollster = "0.4.0"
