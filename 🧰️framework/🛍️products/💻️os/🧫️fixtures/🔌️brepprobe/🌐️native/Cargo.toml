[package]
name = "semio-brepprobe-native"
version = "0.1.0"
edition = "2021"
publish = false

# 🧪️ terra-brep-probe spike (packet brep-probe): deliberately its own workspace root so cargo
# never treats this as a member of the repo's root workspace — registrar-owned file, this crate is
# not registered anywhere.
[workspace]

[[bin]]
name = "probe"
path = "🦀️src/main.rs"

[dependencies]
pollster = "0.4.0"
