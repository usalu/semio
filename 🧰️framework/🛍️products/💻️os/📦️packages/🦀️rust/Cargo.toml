[package]
name = "semio-framework-os-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Semio framework OS kernel — wasm-safe store/spr/dsl/pack document model"

[package.metadata.semio]
role = "framework"
id = "os-kernel"

[lints]
workspace = true

[lib]
name = "semio_framework_os_kernel"
crate-type = ["rlib", "cdylib"]
path = "📦️glue.rs"

[features]
default = ["deflate"]
deflate = ["dep:miniz_oxide", "semio-framework-replication/deflate", "semio-framework-pack/deflate"]
dsl-fixture-sweep-full = []
ureq = ["dep:ureq"]
# 🧵️ No `tokio/net` reference here (unlike `rt`/`time`): `tokio` is a target-independent
# `[dependencies]` entry, so a feature-flag `tokio/net` would unify onto EVERY target including
# wasm32, and tokio's own build script hard-errors on `net` for `wasm32` (unlike `rt`/`time`, which
# it explicitly supports there). `net` is instead added unconditionally for non-wasm32 targets only,
# via the `[target.cfg(not(wasm32))]` `tokio` entry below — see its docstring. WASI-P2 guest plugins
# never link the sync actor's native (tokio-tungstenite) transport — see `🔄️sync/🦀️component.rs`'s
# `native_actor` vs `wasm_actor` split — so `net` has no business reaching wasm32 at all.
sync = ["dep:tokio-tungstenite", "dep:notify", "dep:rusqlite", "tokio/rt", "tokio/time"]
worker = ["sync"]
# 🧬️ Generates the TypeScript mirror for boundary/protocol types owned at this layer (e.g. the
# 🕹️interaction spec/runtime family relocated here from `semio-framework`); never enabled by
# default so `ts-rs` never affects the plain `cargo build`/`cargo test` path — mirrors
# `semio-framework`'s own `typegen` feature, which enables this one transitively.
typegen = ["dep:ts-rs"]

[dependencies]
dsl_derive = { path = "../../🔨️modules/🗣️dsl/✨️derive/📦️packages/🦀️rust", package = "semio-framework-os-kernel-dsl-derive" }
semio-framework-pack = { workspace = true }
semio-framework-replication = { workspace = true }
async-trait = "0.1"
base64 = "0.22.1"
blake3 = "1"
futures-lite = "2"
futures-util = { version = "0.3", features = ["sink"] }
miniz_oxide = { version = "0.8", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1", features = ["sync", "macros"], default-features = false }
ts-rs = { workspace = true, optional = true }
ureq = { version = "2", optional = true }
semio-framework-hash = { path = "../../../../🔨️modules/#⃣hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.98", features = ["Window", "Storage", "console", "WebSocket", "MessageEvent", "BinaryType", "Request", "RequestInit", "Response", "Headers"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { version = "0.26", optional = true }
notify = { version = "8", optional = true }
rusqlite = { version = "0.38.0", optional = true, features = ["bundled"] }
# 🧵️ Same crate key as the base `[dependencies]` entry above — cargo unifies same-name deps declared
# in `[dependencies]` and a matching `[target.cfg(...)]` table into one edge for that target, unioning
# features (non-optional here to match the base entry's non-optional bit; a rename-alias or a mixed
# optional/non-optional pairing under one name both hit cargo's "multiple times with different names"
# / conflicting-optionality rejections). `net` is therefore always present for non-wasm32 builds of
# this crate, independent of the `sync` feature toggle — harmless (tokio without `sync`'s other deps
# never spins up a listener) and the only way to keep `net` off wasm32 unconditionally, which is the
# actual requirement: WASI-P2 guest plugins must never link tokio's networking.
tokio = { version = "1", default-features = false, features = ["net"] }

# 🧪️ `🏪️store/🔄️sync`'s actor tests use `tempfile::tempdir()`; they are gated
# `#[cfg(not(target_arch = "wasm32"))]`, so the dev-dep is target-gated to match.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.20.0"

[[bin]]
name = "pack"
path = "../../🔨️modules/🎒️pack/⌨️cli/📦️main.rs"

[[bin]]
name = "spr"
path = "../../🔨️modules/📡️spr/⌨️cli/📦️main.rs"

[[bin]]
name = "semio"
path = "../../🔨️modules/🧬️semio/📦️bin.rs"
