[package]
workspace = "../../../../../../.."
name = "semio-framework-os-pack"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The os side of the .spk family: pack runtime bridge, stored content hash read and record codec laws over the framework pack record codec"

[package.metadata.semio]
role = "framework"
id = "os-pack"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = ["deflate"]
deflate = ["pack/deflate", "protocol/deflate"]
record-codec-laws = ["pack/corruption-testing"]

[dependencies]
semio-framework-pack-source = { path = "../../../../../../🔨️modules/🎒️pack/🚰️source/📦️packages/🦀️rust" }
pack = { path = "../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
protocol = { path = "../../../../../../🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../../../🔨️modules/🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-async = { path = "../../../../../../🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust" }
semio-framework-io-base64 = { path = "../../../../../../🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust" }
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-dsl = { path = "../../../../../../🔨️modules/🗣️dsl/📦️packages/🦀️rust" }
pack = { path = "../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack", features = ["corruption-testing"] }
