[package]
name = "semio-framework-os-kernel-pack-format"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format container — header/footer/manifest byte layout, segment framing, writer/reader, recovery"


[lints]
workspace = true
[lib]
name = "pack_format"
path = "../../../📐️format/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
pack_core = { path = "../../../🫀️core/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-core" }
blake3 = "1"
miniz_oxide = { version = "0.8", optional = true }

[features]
default = ["deflate"]
deflate = ["dep:miniz_oxide"]
