[package]
name = "semio-framework-os-kernel-pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format facade — re-exports the core/format/value/io/async/http/index layers"


[lints]
workspace = true
[lib]
name = "pack"
path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
pack_core = { path = "../../🫀️core/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-core" }
pack_format = { path = "../../📐️format/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-format" }
pack_value = { path = "../../🔢️value/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-value" }
pack_io = { path = "../../🔌️io/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-io" }
pack_async = { path = "../../⏳️async/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-async" }
pack_http = { path = "../../🌐️http/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-http" }
pack_index = { path = "../../🔢️index/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack-index" }
dsl_schema = { path = "../../../🗣️dsl/🧬️schema/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-schema" }

[features]
default = ["deflate"]
deflate = ["pack_format/deflate"]
ureq = ["pack_http/ureq"]
