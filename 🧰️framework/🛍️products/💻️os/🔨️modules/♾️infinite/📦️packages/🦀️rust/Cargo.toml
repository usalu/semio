[package]
workspace = "../../../../../../.."
name = "semio-framework-os-infinite"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "OS infinite family — world/canvas/board Shape V2 glue"

[package.metadata.semio]
role = "product"
id = "os-infinite"

[lints]
workspace = true

[lib]
name = "semio_framework_os_infinite"
crate-type = ["rlib"]
path = "🦀️.rs"

[dependencies]
semio-framework-os-infinite-directed-presentation = { path = "../../🎲️board/🔌️ports/➡️directed/🧬️schema/🖼️presentation/📦️packages/🦀️rust" }
# 🎲️ The board family lives in producer crates (schema, engine, normal model/scene/focus/gestures/fill/host, dag model/graph/host); `src/🦀️.rs` re-exports them under the former `board` paths.
semio-framework-os-infinite-board-schema = { path = "../../🎲️board/🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-engine = { path = "../../🎲️board/⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-model = { path = "../../🎲️board/🔌️ports/➡️directed/➕️normal/🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-scene = { path = "../../🎲️board/🔌️ports/➡️directed/➕️normal/🖼️scene/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-focus = { path = "../../🎲️board/🔌️ports/➡️directed/➕️normal/🎯️focus/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-gestures = { path = "../../🎲️board/🔌️ports/➡️directed/➕️normal/🕹️gestures/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-fill = { path = "../../🎲️board/🔌️ports/➡️directed/➕️normal/🪣️fill/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-host = { path = "../../🎲️board/🔌️ports/➡️directed/➕️normal/🧭️host/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-dag-model = { path = "../../🎲️board/🔌️ports/➡️directed/🕸️dag/🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-dag-graph = { path = "../../🎲️board/🔌️ports/➡️directed/🕸️dag/🕸️graph/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-dag-host = { path = "../../🎲️board/🔌️ports/➡️directed/🕸️dag/🧭️host/📦️packages/🦀️rust" }
semio-framework-pack = { path = "../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-canvas = { path = "../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-ui-locale = { path = "../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-job = { workspace = true }
semio-framework-job-payload = { workspace = true }
# ⏯️ Decodes the `World3dScene.tool_run_trace` delta for the world's trace layer (`🌍️world/⏯️tool-run-trace`).
# Renderer-side only: ui/ui-scene/os-kernel/job never depend on it (`📓️wave-W0-A.md` cycle rule).
semio-framework-tool-run = { workspace = true }
# 🧱️ `boxed_fixed_slots` (the heap-first fixed slot table every retirement/admission registry in
# this crate builds through) plus the browser session bridges' async vocabulary. Unconditional: the
# helper is target-neutral and `semio-framework-job` already pulls this crate in on every target.
semio-framework-async = { workspace = true }
semio-framework = { path = "../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
geometry = { path = "../../../../../../🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-graph-manifest = { path = "../../../../../../🔨️modules/🕸️graph/🛂️manifest/📦️packages/🦀️rust" }
graph = { path = "../../../../../../🔨️modules/🕸️graph/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-graph-engine" }
semio-framework-graph-drawing = { path = "../../../../../../🔨️modules/🕸️graph/🖊️drawing/📦️packages/🦀️rust" }
ui_styling = { path = "../../../../../../🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
semio-framework-ui-viewport = { path = "../../../../../../🔨️modules/🖱️ui/🪟️viewport/📦️packages/🦀️rust" }
semio-framework-ui-runtime = { path = "../../../../../../🔨️modules/🖱️ui/🧠️runtime/📦️packages/🦀️rust" }
semio-framework-ui-contract = { path = "../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# 🔤️ First-party RFC 4648 codec — replaces the third-party `base64` crate for `icon_codec`'s
# `data:...;base64,...` decode (target-neutral: guest-reachable via `resolve_icon_kind`, see
# `🖼️canvas/🦀️.rs`). RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS (26/09/01).
base64_codec = { path = "../../../../../../🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust", package = "semio-framework-io-base64" }
# #️⃣ Unkeyed BLAKE3 for the `registerBrushMesh` upload identity (`🌍️world/🦀️.rs`) — byte-identical
# to the puzzle guest's own `brush_mesh_digest` and React's `puzzle3dBrushMeshDigest`, which is what
# lets the guest refuse a page run that does not reassemble into the announced mesh.
semio-framework-hash = { workspace = true }
# 🏔️ The single owner of the terrain tile engine (`TerrainSessionCore`, Terrarium DEM decode, heightfield meshing). It is a
# real downward dependency now: `semio-framework-surface-terrain` depends on neither this crate nor `semio-framework-surface`,
# so the former `#[path]` re-mounting of its source into two crates is gone.
semio-framework-surface-terrain = { path = "../../../../../../🔨️modules/🗺️surface/🏔️terrain/📦️packages/🦀️rust" }
# 🖼️ Decodes the world's texture PNGs (`🌍️world/🧱️scene`) through the first-party codec, no third-party image crate on any
# target. RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS (26/09/01).
semio-framework-pixels = { path = "../../../../../../🔨️modules/🔲️pixels/📦️packages/🦀️rust", package = "semio-framework-pixels" }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
ui_gpu = { path = "../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/🖍️draw/📦️packages/🦀️rust", package = "semio-framework-ui-wgpu-render" }
# 🌍️ The world family lives in producer crates (components, cursors, scene, bridge, interaction, host over the model); `src/🌍️world/🦀️.rs` is only their facade.
semio-framework-os-infinite-world-model = { path = "../../🌍️world/🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-components = { path = "../../🌍️world/🧩️components/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-cursors = { path = "../../🌍️world/🧲️cursors/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-scene = { path = "../../🌍️world/🧱️scene/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-bridge = { path = "../../🌍️world/🌉️bridge/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-interaction = { path = "../../🌍️world/🧵️interaction/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-host = { path = "../../🌍️world/🎛️host/📦️packages/🦀️rust" }
ui_scene = { path = "../../../../../../🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }

[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
ui_scene = { path = "../../../../../../🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }

# 🌉️ Browser-only Board session bridges and their async vocabulary. Excluded
# from `wasm32-wasip2` because `target_arch = "wasm32"` is TRUE for the WASI component target too —
# the wasip2 guest never attaches an `HtmlCanvasElement`. `dag_debug_log`/`pointer_event_now_ms`
# (same `🕸️dag` file) needed genuine wasip2 arms instead — see their docstrings.
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement", "Window", "Request", "RequestInit", "RequestMode", "Response", "console"] }

[dev-dependencies]
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-job-worker = { path = "../../../../../../🔨️modules/🧵️job/👷️worker/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-job-worker-authority = { path = "../../../../../../🔨️modules/🧵️job/👷️worker/🎟️authority/📦️packages/🦀️rust", features = ["testkit"] }

semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-trace = { path = "../../../../../../🔨️modules/⏱️trace/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["mutation-testing"] }
semio-framework-async-macros = { path = "../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }

[[test]]
name="original_world_resources"
path="../../🌍️world/♻️resources/🧪️tests/🦀️.rs"

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
