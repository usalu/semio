[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-infinite-board-engine"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Board engine: the retained graph engine with camera, selection and hit testing, plus the directed port descriptors it exposes"

[package.metadata.semio]
role = "product"
id = "os-infinite-board-engine"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-infinite-board-schema/testkit"]

[dependencies]
semio-framework-os-infinite-directed-presentation = { path = "../../../../🎲️board/🔌️ports/➡️directed/🧬️schema/🖼️presentation/📦️packages/🦀️rust" }
semio-framework-canvas = { path = "../../../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true }
semio-framework-async-slots = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../../../../../../🔨️modules/🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-value-derive = { path = "../../../../../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
geometry = { path = "../../../../../../../../🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-graph-manifest = { path = "../../../../../../../../🔨️modules/🕸️graph/🛂️manifest/📦️packages/🦀️rust" }
graph = { path = "../../../../../../../../🔨️modules/🕸️graph/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-graph-engine" }
semio-framework-graph-drawing = { path = "../../../../../../../../🔨️modules/🕸️graph/🖊️drawing/📦️packages/🦀️rust" }
ui_styling = { path = "../../../../../../../../🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
serde = { version = "1.0.219", features = ["derive"] }
semio-framework-os-infinite-board-schema = { path = "../../../🧬️schema/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["mutation-testing"] }
serde_json = "1.0.140"

[[test]]
name = "board_engine_undirected_normal"
path = "../../🧪️tests/↔️undirected-normal/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_engine_undirected_ports"
path = "../../🧪️tests/↔️undirected-ports/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_engine_directed_normal"
path = "../../🧪️tests/➡️directed-normal/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_engine_quadrant"
path = "../../🧪️tests/📐️quadrant/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_engine_dag_unit"
path = "../../🧪️tests/🔬️dag-unit/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_engine_engine_unit"
path = "../../🧪️tests/🔬️engine-unit/🦀️.rs"
required-features = ["testkit"]
