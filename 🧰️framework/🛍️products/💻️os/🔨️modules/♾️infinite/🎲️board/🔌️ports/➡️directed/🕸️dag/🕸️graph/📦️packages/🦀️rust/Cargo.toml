[package]
workspace = "../../../../../../../../../../../.."
name = "semio-framework-os-infinite-board-dag-graph"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Dag board graph and viewport components with the engine sync, selection and projection functions"

[package.metadata.semio]
role = "product"
id = "os-infinite-board-dag-graph"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-infinite-board-schema/testkit", "semio-framework-os-infinite-board-engine/testkit", "semio-framework-os-infinite-board-normal-model/testkit", "semio-framework-os-infinite-board-dag-model/testkit"]

