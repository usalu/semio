[package]
workspace = "../../../../../../../../../../../.."
name = "semio-framework-os-infinite-board-normal-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Normal board host: the composed `BoardHost` owner with pointer and render orchestration"

[package.metadata.semio]
role = "product"
id = "os-infinite-board-normal-host"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-infinite-board-schema/testkit", "semio-framework-os-infinite-board-engine/testkit", "semio-framework-os-infinite-board-normal-model/testkit", "semio-framework-os-infinite-board-normal-scene/testkit", "semio-framework-os-infinite-board-normal-focus/testkit", "semio-framework-os-infinite-board-normal-gestures/testkit", "semio-framework-os-infinite-board-normal-fill/testkit"]

[dependencies]
semio-framework-canvas = { path = "../../../../../../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
geometry = { path = "../../../../../../../../../../../🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-graph-manifest = { path = "../../../../../../../../../../../🔨️modules/🕸️graph/🛂️manifest/📦️packages/🦀️rust" }
