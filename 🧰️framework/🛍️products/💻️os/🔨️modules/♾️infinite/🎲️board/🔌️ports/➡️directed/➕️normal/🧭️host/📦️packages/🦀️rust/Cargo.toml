semio-framework-os-infinite-board-schema = { path = "../../../../../../🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-engine = { path = "../../../../../../⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-model = { path = "../../../🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-scene = { path = "../../../🖼️scene/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-focus = { path = "../../../🎯️focus/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-gestures = { path = "../../../🕹️gestures/📦️packages/🦀️rust" }
