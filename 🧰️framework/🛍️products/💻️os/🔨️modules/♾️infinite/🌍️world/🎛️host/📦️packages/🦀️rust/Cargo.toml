[package]
workspace = "../../../../../../../../.."
name = "semio-os-infinite-world-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "World3d host: the composed `World3dState`, frame sync and render orchestration"

[package.metadata.semio]
role = "product"
id = "os-infinite-world-host"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-os-infinite-world-model/testkit", "semio-os-infinite-world-components/testkit", "semio-os-infinite-world-cursors/testkit", "semio-os-infinite-world-scene/testkit", "semio-os-infinite-world-bridge/testkit", "semio-os-infinite-world-interaction/testkit", "dep:semio-framework-test-fixtures"]

[dependencies]
semio-framework-pack-json = { path = "../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust", optional = true }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-tool-run = { workspace = true }
semio-framework = { path = "../../../../../../../../📦️packages/🦀️rust" }
semio-ui-viewport = { path = "../../../../../../../../🔨️modules/🖱️ui/🪟️viewport/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semio-os-infinite-world-model = { path = "../../../🗃️model/📦️packages/🦀️rust" }
semio-os-infinite-world-components = { path = "../../../🧩️components/📦️packages/🦀️rust" }
semio-os-infinite-world-cursors = { path = "../../../🧲️cursors/📦️packages/🦀️rust" }
semio-os-infinite-world-scene = { path = "../../../🧱️scene/📦️packages/🦀️rust" }
semio-os-infinite-world-bridge = { path = "../../../🌉️bridge/📦️packages/🦀️rust" }
semio-os-infinite-world-interaction = { path = "../../../🧵️interaction/📦️packages/🦀️rust" }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
