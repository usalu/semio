[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-infinite-world-interaction"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "World3d interaction: pointer, wheel and gesture entry points and the interaction authority"

[package.metadata.semio]
role = "product"
id = "os-infinite-world-interaction"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-infinite-world-model/testkit", "semio-framework-os-infinite-world-components/testkit", "semio-framework-os-infinite-world-cursors/testkit", "semio-framework-os-infinite-world-scene/testkit", "semio-framework-os-infinite-world-bridge/testkit"]

[dependencies]
semio-framework-pack-json = { path = "../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-ui-locale = { path = "../../../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework = { path = "../../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
serde_json = "1.0.140"
semio-framework-os-infinite-world-model = { path = "../../../🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-components = { path = "../../../🧩️components/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-cursors = { path = "../../../🧲️cursors/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-scene = { path = "../../../🧱️scene/📦️packages/🦀️rust" }
semio-framework-os-infinite-world-bridge = { path = "../../../🌉️bridge/📦️packages/🦀️rust" }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
semio-framework-ui-action = { path = "../../../../../../../../🔨️modules/🖱️ui/🎬️action/📦️packages/🦀️rust" }
semio-framework-ui-declaration = { path = "../../../../../../../../🔨️modules/🖱️ui/📜️declaration/📦️packages/🦀️rust" }
semio-framework-ui-draw-contract = { path = "../../../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/🖍️draw/🏷️types/📦️packages/🦀️rust" }
semio-framework-ui-raster-owner = { path = "../../../../../../../../🔨️modules/🖱️ui/🖼️raster/🧵️ownership/📦️packages/🦀️rust" }
semio-framework-ui-theme = { path = "../../../../../../../../🔨️modules/🖱️ui/🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-input = { path = "../../../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/📥️input/📦️packages/🦀️rust" }
ui_scene = { path = "../../../../../../../../🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }

[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
semio-framework-ui-action = { path = "../../../../../../../../🔨️modules/🖱️ui/🎬️action/📦️packages/🦀️rust" }
semio-framework-ui-declaration = { path = "../../../../../../../../🔨️modules/🖱️ui/📜️declaration/📦️packages/🦀️rust" }
semio-framework-ui-draw-contract = { path = "../../../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/🖍️draw/🏷️types/📦️packages/🦀️rust" }
semio-framework-ui-raster-owner = { path = "../../../../../../../../🔨️modules/🖱️ui/🖼️raster/🧵️ownership/📦️packages/🦀️rust" }
semio-framework-ui-theme = { path = "../../../../../../../../🔨️modules/🖱️ui/🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-input = { path = "../../../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/📥️input/📦️packages/🦀️rust" }
ui_scene = { path = "../../../../../../../../🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }

[dev-dependencies]
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-test-fixtures = { path = "../../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }

[[test]]
name = "world_interaction_unit"
path = "../../🧪️tests/🔬️unit/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "world_interaction_pointer_gestures"
path = "../../🧪️tests/🖱️pointer-gestures/🦀️.rs"
required-features = ["testkit"]
