[package]
workspace = "../../../../../../../../.."
name = "semio-framework-artifact-infinite-dag"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Composable directed acyclic graph artifact and mutations"

[package.metadata.semio]
role = "artifact"
id = "infinite-dag"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-artifact-infinite-dag-vcs = { path = "../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-os-infinite-directed-presentation = { path = "../../../../🎲️board/🔌️ports/➡️directed/🧬️schema/🖼️presentation/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-os-kernel = { workspace = true }
semio-framework-graph-manifest = { path = "../../../../../../../../🔨️modules/🕸️graph/🛂️manifest/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-os-kernel = { workspace = true, features = ["mutation-testing", "protocol-laws"] }
semio-framework-async-macros = { workspace = true }
semio-framework-pack = { path = "../../../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
serde_json = "1"
semio-framework-os-space-testing-sqlite-native-caller = { path = "../../../../../🪐️space/🧪️tests/🪶️sqlite/🫴️native-caller/📦️packages/🦀️rust" }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
semio-framework-job = { workspace = true }
semio-framework-async = { workspace = true }
wasm-bindgen = "0.2.106"
