[package]
name = "semio-framework-kernel-infinite-world"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Application-neutral 3D world canvas engine for wgpu renderers"

[lib]
name = "infinite_world"
path = "../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/⚡️implementations/🦀️rust/🌍️world/📦️lib.rs"

[dependencies]
kernel_3d_scene = { path = "../../../../../../../../✏️s/🔨️modules/🧊️3d/🎬️scene/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-3d-scene" }
ui_wgpu = { path = "../../../../../../../🔨️modules/🖱️ui/🧊️wgpu/⚡️implementations/🦀️rust", features = ["engine"], package = "semio-framework-ui-wgpu" }
semio-framework-core = { path = "../../../../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
framework_surface_terrain = { path = "../../../../../../../🔨️modules/🗺️surface/🏔️terrain/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-surface-terrain" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "console",
] }
