[package]
workspace = "../../../../../../../../../../.."
name = "semio-renderer-wgpu-kernel-runtime"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Kernel runtime facade and the scale bench of the native renderer"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-kernel-runtime"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-renderer-wgpu-contracts/testkit", "semio-renderer-wgpu-kernel-pool/testkit", "semio-renderer-wgpu-kernel-protocol/testkit", "semio-renderer-wgpu-kernel-retained/testkit"]

[dependencies]
semio-renderer-wgpu-kernel-pool = { path = "../../../🏊️kernel-pool/📦️packages/🦀️rust" }
semio-renderer-wgpu-kernel-retained = { path = "../../../🗃️kernel-retained/📦️packages/🦀️rust" }
semio-plugin-interpreter-runtime = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
ui_contract = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-ui-contract" }
semio-framework-job-payload = { workspace = true }
semio-renderer-wgpu-host-plumbing = { path = "../../../🔧️host-plumbing/📦️packages/🦀️rust" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-renderer-wgpu-contracts = { path = "../../../🤝️contracts/📦️packages/🦀️rust" }
semio-renderer-wgpu-host-base = { path = "../../../🏛️host-base/📦️packages/🦀️rust" }
semio-renderer-wgpu-kernel-protocol = { path = "../../../📡️kernel-protocol/📦️packages/🦀️rust" }
semio-framework = { path = "../../../../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-actor = { workspace = true }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-async-slots = { workspace = true }
semio-framework-hash = { path = "../../../../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-os-services = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-plugin-host = { path = "../../../../../../../🔌️plugin/🖥️host/📦️packages/🦀️rust", package = "semio-plugin-host" }
serde_json = "1.0.140"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "net", "time"], default-features = false }
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-renderer-wgpu-kernel-retained = { path = "../../../🗃️kernel-retained/📦️packages/🦀️rust", features = ["testkit"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
semio-renderer-wgpu-kernel-protocol = { path = "../../../📡️kernel-protocol/📦️packages/🦀️rust", features = ["testkit"] }
