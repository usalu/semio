[package]
workspace = "../../../../../../../../../../.."
name = "semio-framework-os-renderer-wgpu-host-plumbing"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Surface lane, input wire, render snapshot, deadlines, native caller and browser output adapters"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-host-plumbing"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-renderer-wgpu-contracts = { path = "../../../🤝️contracts/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-host-base = { path = "../../../🏛️host-base/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-media-slots = { path = "../../../🎥️media-slots/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-job-worker = { path = "../../../../../../../../../../🔨️modules/🧵️job/👷️worker/📦️packages/🦀️rust" }
semio-framework-job-worker-authority = { path = "../../../../../../../../../../🔨️modules/🧵️job/👷️worker/🎟️authority/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-trace = { workspace = true }
semio-framework-value = { path = "../../../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
ui_render = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🖌️render/📦️packages/🦀️rust", package = "semio-framework-ui-render" }
semio-framework-ui-wgpu-hosting = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/🧭️hosting/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-input = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/📥️input/📦️packages/🦀️rust" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-actor = { workspace = true }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-plugin-guest-contract = { workspace = true }
semio-framework-os-services = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
semio-framework-async = { workspace = true }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-job = { workspace = true, features = ["testkit"] }

[[test]]
name = "original_native_frame_caller"
path = "../../../🎟️native-caller/🧪️tests/🦀️.rs"
