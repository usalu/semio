[package]
workspace = "../../../../../../../../../../.."
name = "semio-renderer-wgpu-browser-worker"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Browser renderer worker and bootstrap"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-browser-worker"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-renderer-wgpu-app-runtime = { path = "../../../🏃️app-runtime/📦️packages/🦀️rust" }
