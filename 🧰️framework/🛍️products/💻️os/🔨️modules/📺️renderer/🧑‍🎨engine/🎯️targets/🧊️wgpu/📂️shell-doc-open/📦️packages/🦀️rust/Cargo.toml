[package]
workspace = "../../../../../../../../../../.."
name = "semio-renderer-wgpu-shell-doc-open"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "OpeningState component of the shell: document opening, import transfers and icon export"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-shell-doc-open"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = []

