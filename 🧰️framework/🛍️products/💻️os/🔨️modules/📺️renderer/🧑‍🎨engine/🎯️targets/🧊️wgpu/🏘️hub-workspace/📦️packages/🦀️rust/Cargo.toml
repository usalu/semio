[package]
workspace = "../../../../../../../../../../.."
name = "semio-renderer-wgpu-hub-workspace"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Hub connection, space administration and canvas presence"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-hub-workspace"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
replication = { path = "../../../../../../../../../../🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-framework = { path = "../../../../../../../../../../📦️packages/🦀️rust" }
semio-framework-async = { workspace = true }
semio-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", features = ["sync"] }
semio-ui-locale = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
semio-ui-declaration = { path = "../../../../../../../../../../🔨️modules/🖱️ui/📜️declaration/📦️packages/🦀️rust" }
semio-ui-theme = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-renderer-wgpu-contracts = { path = "../../../🤝️contracts/📦️packages/🦀️rust" }
semio-renderer-wgpu-hub-contracts = { path = "../../../🔐️hub-contracts/📦️packages/🦀️rust" }
semio-renderer-wgpu-media-slots = { path = "../../../🎥️media-slots/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
serde_json = "1.0.140"

[dev-dependencies]
semio-renderer-wgpu-doors = { path = "../../../🛂️doors/📦️packages/🦀️rust" }
ui_contract = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-ui-contract" }
