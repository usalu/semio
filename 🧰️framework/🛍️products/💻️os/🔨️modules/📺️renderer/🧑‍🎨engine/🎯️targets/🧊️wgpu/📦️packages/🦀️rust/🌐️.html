<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semio Wgpu</title>
    <!-- 🔬️ Trunk appends its own module here that instantiates the renderer a SECOND time on the UI thread
         and publishes that never-booted instance as `window.wasmBindings` (measured: neither `data-type=
         "worker"` nor `data-wasm-no-import` suppresses it in trunk 0.21.14). The renderer's `UI_ENGINE`
         thread-local lives in the frame Worker, so calling that copy traps with a wasm "memory access out
         of bounds" — which is why the introspection beacon is `window.semioWgpuIntrospection`, owned by
         `🚀️browser-boot/🟦️.ts` over the Worker seam, and never `wasmBindings`. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-type="worker" data-bindgen-target="web" />
    <link data-trunk rel="copy-dir" href="../../../../../../🧑‍💻dev/🔌️plugin-modules" data-target-path="🔌️plugin-modules" />
    <link data-trunk rel="copy-dir" href="../../../../../../../../../🔨️modules/🖼️assets" data-target-path="🖼️assets" />
    <link data-trunk rel="copy-file" href="🟦️typescript/🚀️boot.js" />
    <link data-trunk rel="copy-file" href="🟦️typescript/🎞️frame-worker.js" />
    <script type="module" src="🚀️boot.js" data-trunk-nav-ignore></script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #001117;
      }
      canvas,
      #semio-wgpu-canvas {
        outline: none;
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
