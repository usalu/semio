[package]
workspace = "../../../../../../../../../../.."
name = "semio-framework-os-renderer-wgpu-kernel-protocol"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Kernel request, replay and job-progress protocol with the parallel runtime of the native kernel"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-kernel-protocol"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-renderer-wgpu-contracts/testkit"]

[dependencies]
semio-framework-ui-contract-validation = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🧬️contract/🛡️limits/📦️packages/🦀️rust" }
ui_contract = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-job-payload = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-os-renderer-wgpu-contracts = { path = "../../../🤝️contracts/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-host-base = { path = "../../../🏛️host-base/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-host-plumbing = { path = "../../../🔧️host-plumbing/📦️packages/🦀️rust" }
semio-framework = { path = "../../../../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-actor = { workspace = true }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-async-slots = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-job-worker = { path = "../../../../../../../../../../🔨️modules/🧵️job/👷️worker/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", features = ["sync", "ureq"], package = "semio-framework-os-kernel" }
semio-framework-os-services-native-io = { workspace = true }
semio-framework-plugin = { path = "../../../../../../../🔌️plugin/📦️packages/🦀️rust", package = "semio-framework-plugin" }
semio-framework-plugin-guest-contract = { workspace = true }
semio-framework-plugin-host = { path = "../../../../../../../🔌️plugin/🖥️host/📦️packages/🦀️rust", package = "semio-framework-plugin-host" }
semio-framework-value = { path = "../../../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../../../../../../../../🔨️modules/🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", features = ["mutation-testing"], package = "semio-framework-os-kernel" }
semio-framework-plugin-interpreter-runtime = { workspace = true }
semio-framework-trace = { workspace = true }
