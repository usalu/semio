[package]
workspace = "../../../../../../../../../../.."
name = "semio-renderer-wgpu-kernel-pool"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Kernel pool state, client and loop of the native renderer"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-kernel-pool"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-renderer-wgpu-contracts/testkit", "semio-renderer-wgpu-kernel-protocol/testkit"]

[dependencies]
semio-plugin-interpreter-runtime = { workspace = true }
semio-ui-contract-validation = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🧬️contract/🛡️limits/📦️packages/🦀️rust" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-renderer-wgpu-contracts = { path = "../../../🤝️contracts/📦️packages/🦀️rust" }
semio-renderer-wgpu-host-base = { path = "../../../🏛️host-base/📦️packages/🦀️rust" }
semio-renderer-wgpu-kernel-protocol = { path = "../../../📡️kernel-protocol/📦️packages/🦀️rust" }
semio-renderer-wgpu-kernel-retained = { path = "../../../🗃️kernel-retained/📦️packages/🦀️rust" }
semio-framework = { path = "../../../../../../../../../../📦️packages/🦀️rust" }
semio-framework-actor = { workspace = true }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-hash = { path = "../../../../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", features = ["sync", "ureq"] }
semio-os-services = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-plugin-host = { path = "../../../../../../../🔌️plugin/🖥️host/📦️packages/🦀️rust" }
serde_json = "1.0.140"
ui_contract = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-ui-contract" }

[dev-dependencies]
semio-framework-trace = { workspace = true }
