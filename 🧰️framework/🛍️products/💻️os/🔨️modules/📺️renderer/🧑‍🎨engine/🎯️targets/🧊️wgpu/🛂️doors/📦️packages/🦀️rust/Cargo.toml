[package]
workspace = "../../../../../../../../../../.."
name = "semio-framework-os-renderer-wgpu-doors"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Duplex socket door and directory door transports"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-doors"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
semio-framework-os-renderer-wgpu-host-base = { path = "../../../🏛️host-base/📦️packages/🦀️rust" }
semio-framework-io-base64 = { path = "../../../../../../../../../../🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust", package = "semio-framework-io-base64" }
semio-framework-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
serde_json = "1.0.140"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", features = ["sync", "ureq"], package = "semio-framework-os-kernel" }
semio-framework-os-services = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", features = ["sync"], package = "semio-framework-os-kernel" }

[dev-dependencies]
semio-framework-os-kernel = { path = "../../../../../../../../📦️packages/🦀️rust", features = ["mutation-testing"], package = "semio-framework-os-kernel" }
