[package]
workspace = "../../../../../../../../../../.."
name = "semio-framework-os-renderer-wgpu-scene-canvas2d"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Canvas2d scene and the retained UI image loader"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-scene-canvas2d"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-renderer-wgpu-asset-authority = { path = "../../../🗂️asset-authority/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-canvas2d-paint = { path = "../../../🖌️canvas2d-paint/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-canvas2d-host = { path = "../../../🔄️canvas2d-host/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-contracts = { path = "../../../🤝️contracts/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-media-slots = { path = "../../../🎥️media-slots/📦️packages/🦀️rust" }
semio-framework-os-renderer-wgpu-scene-state = { path = "../../../🎭️scene-state/📦️packages/🦀️rust" }
base64 = "0.22.1"
infinite_canvas = { path = "../../../../../../../♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.45.1"
semio-framework-2d = { workspace = true }
serde_json = "1.0.140"
tiny-skia = "0.11.4"
ui_wgpu = { path = "../../../../../../../../../../🔨️modules/🖱️ui/📦️packages/🦀️rust", features = ["wgpu-engine"], package = "semio-framework-ui" }
usvg = "0.45.1"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
semio-framework = { path = "../../../../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-job = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
ui_render = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🖌️render/📦️packages/🦀️rust", package = "semio-framework-ui-render" }

[dev-dependencies]
