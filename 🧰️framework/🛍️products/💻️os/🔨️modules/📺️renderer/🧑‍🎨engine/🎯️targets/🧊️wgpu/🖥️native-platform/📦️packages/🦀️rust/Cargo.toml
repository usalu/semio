[package]
workspace = "../../../../../../../../../../.."
name = "semio-framework-os-renderer-wgpu-native-platform"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Native accessibility bridge and temporal adapters of the wgpu renderer"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-native-platform"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = "0.25.1"
accesskit_winit = { version = "0.34.1", default-features = false, features = ["rwh_06"] }
serde_json = "1.0.140"
ui_contract = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
ui_render = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🖌️render/📦️packages/🦀️rust", package = "semio-framework-ui-render" }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_winit = { version = "0.34.1", default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[dev-dependencies]
accesskit_consumer = "0.39.1"
