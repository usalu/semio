[package]
workspace = "../../../../../../../../../../.."
name = "semio-renderer-wgpu-shell-frame-pumps"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Shell frame pumps: directory events, media actions, retained document opening, auto check-in and operation publications"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-shell-frame-pumps"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-ui-wgpu-layout = { path = "../../../../../../../../../../🔨️modules/🖱️ui/🎯️targets/🧊️wgpu/🧱️layout-stack/📦️packages/🦀️rust" }
semio-renderer-wgpu-host-base = { path = "../../../🏛️host-base/📦️packages/🦀️rust" }
semio-renderer-wgpu-shell-actions = { path = "../../../🔀️shell-actions/📦️packages/🦀️rust" }
semio-renderer-wgpu-shell-async = { path = "../../../⏳️shell-async/📦️packages/🦀️rust" }
semio-renderer-wgpu-shell-chrome-state = { path = "../../../🎚️shell-chrome-state/📦️packages/🦀️rust" }
semio-renderer-wgpu-shell-commands = { path = "../../../🎹️shell-commands/📦️packages/🦀️rust" }
semio-renderer-wgpu-shell-directory = { path = "../../../📒️shell-directory/📦️packages/🦀️rust" }
semio-renderer-wgpu-shell-doc-open = { path = "../../../📂️shell-doc-open/📦️packages/🦀️rust" }
