[package]
workspace = "../../../../../../../../../../.."
name = "semio-renderer-wgpu-ui-engine-focus"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Retained UI focus statics, key handlers, scene intents and clipboard IO"

[package.metadata.semio]
role = "framework"
id = "os-renderer-wgpu-ui-engine-focus"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-renderer-wgpu-contracts/testkit"]

