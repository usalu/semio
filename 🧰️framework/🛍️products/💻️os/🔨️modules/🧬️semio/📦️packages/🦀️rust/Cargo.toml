[package]
workspace = "../../../../../../.."
name = "semio-framework-os-semio"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The .semio container of the OS kernel: envelope wrap and unwrap, text preamble split"

[package.metadata.semio]
role = "framework"
id = "os-semio"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-value-native-owned = { path = "../../../../../../🔨️modules/🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-trace-memory-testing = { path = "../../../../../../🔨️modules/⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
serde_json = "1.0.140"

[features]
native-bin = []
