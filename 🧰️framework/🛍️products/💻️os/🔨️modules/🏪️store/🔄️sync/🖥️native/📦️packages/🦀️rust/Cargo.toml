[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-store-sync-native"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The native Store sync actor and the folder event log storage"

[package.metadata.semio]
role = "framework"
id = "os-store-sync-native"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testing = ["dep:semio-framework-async-macros", "dep:semio-framework-plugin-component-receipt"]

[dependencies]
semio-framework-async-macros = { path = "../../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust", optional = true }
semio-framework-plugin-component-receipt = { path = "../../../../../🔌️plugin/🖨️describe/🏷️component-receipt/🧬️schema/📦️packages/🦀️rust", optional = true }
semio-framework-os-semio = { path = "../../../../../🧬️semio/📦️packages/🦀️rust" }
semio-framework-os-spr = { path = "../../../../../📡️spr/📦️packages/🦀️rust" }
semio-framework-os-store-backbone = { path = "../../../../🔗️backbone/📦️packages/🦀️rust" }
semio-framework-os-store-codec-registry = { path = "../../../../📦️codec/📦️packages/🦀️rust" }
semio-framework-os-store-engine = { path = "../../../../⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-store-space-member = { path = "../../../../🧩️composition/👥️space-member/📦️packages/🦀️rust" }
semio-framework-os-store-text-io = { path = "../../../../🚪️io/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-diagnostic = { path = "../../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-os-directory = { path = "../../../../../📇️directory/📦️packages/🦀️rust" }
semio-framework-os-directory-client = { path = "../../../../../📇️directory/🔌️client/📦️packages/🦀️rust" }
semio-framework-os-store-blob-identity = { path = "../../../../../../../../🔨️modules/🧬️schema/🗿️artifact-reference/📦️blob/🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-vcs = { path = "../../../../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
semio-framework-os-store-sync = { path = "../../../📦️packages/🦀️rust" }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = "0.3"
semio-framework-os-services = { workspace = true }
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-plugin-component-receipt = { path = "../../../../../🔌️plugin/🖨️describe/🏷️component-receipt/🧬️schema/📦️packages/🦀️rust" }
