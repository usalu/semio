[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-store-replay"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Effective forwards, edit replay with the prefix snapshot ring, pair merges and replay budget"

[package.metadata.semio]
role = "framework"
id = "os-store-replay"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
hot-path-census = ["semio-framework-os-store-ledger/hot-path-census"]

[dependencies]
semio-framework-os-spr = { path = "../../../../📡️spr/📦️packages/🦀️rust" }
semio-framework-os-store-ledger = { path = "../../../📒️ledger/📦️packages/🦀️rust" }
semio-framework-diagnostic = { path = "../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-os-pack = { path = "../../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-os-store-command = { path = "../../../📬️command/📦️packages/🦀️rust" }
semio-framework-os-store-message-ledger = { path = "../../../📒️ledger/📨️messages/📦️packages/🦀️rust" }
semio-framework-os-store-one-item = { path = "../../../🎮️one-item/📦️packages/🦀️rust" }
semio-framework-os-store-projection = { path = "../../../🎞️projection/🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-vcs = { path = "../../../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-value-snapshot-read = { path = "../../../../../../../🔨️modules/🌱️value/📸️snapshot/👁️read/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
semio-framework-trace = { workspace = true }
serde_json = "1.0.140"
semio-framework-os-store-ledger = { path = "../../../📒️ledger/📦️packages/🦀️rust", features = ["hot-path-census"] }
