[package]
workspace = "../../../../../../../.."
name = "semio-os-store-config"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The config store: config envelope, hydration and apply"

[package.metadata.semio]
role = "framework"
id = "os-store-config"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
