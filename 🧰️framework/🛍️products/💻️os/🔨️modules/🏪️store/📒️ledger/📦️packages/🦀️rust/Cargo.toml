[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-store-ledger"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The Store edit-message ledger, cursor revision accumulator, history commit reservation and edit retirement"

[package.metadata.semio]
role = "framework"
id = "os-store-ledger"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
hot-path-census = []

[dependencies]
semio-framework-os-spr = { path = "../../../../📡️spr/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
