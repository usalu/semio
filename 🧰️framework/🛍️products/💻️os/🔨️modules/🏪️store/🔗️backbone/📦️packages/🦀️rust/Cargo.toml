[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-store-backbone"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Hot-swappable Store backbones: memory, channel, port, registry and their retirement"

[package.metadata.semio]
role = "framework"
id = "os-store-backbone"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-dsl = { path = "../../../../🗣️dsl/📦️packages/🦀️rust" }
semio-framework-os-spr = { path = "../../../../📡️spr/📦️packages/🦀️rust" }
semio-framework-diagnostic = { path = "../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../../../../🔨️modules/🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-dsl-record-derive = { path = "../../../../../../../🔨️modules/🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
semio-framework-os-pack = { path = "../../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-os-store-envelope = { path = "../../../✉️envelope/📦️packages/🦀️rust" }
semio-framework-os-vcs = { path = "../../../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
serde = { version = "1.0.219", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
web-sys = { version = "0.3.98", features = ["Window", "Storage", "console", "WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "Request", "RequestInit", "Response", "Headers"] }

[dev-dependencies]
semio-framework-trace = { workspace = true }
serde_json = "1.0.140"
