[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-store-initialization-runtime"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The Store initialization runtime: digest, edit index, owner catalog and clock helpers"

[package.metadata.semio]
role = "framework"
id = "os-store-initialization-runtime"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-io = { path = "../../../../../🚪️io/📦️packages/🦀️rust" }
semio-framework-os-spr = { path = "../../../../../📡️spr/📦️packages/🦀️rust" }
semio-framework-os-store-ledger = { path = "../../../../📒️ledger/📦️packages/🦀️rust" }
semio-framework-os-store-read = { path = "../../../../🔗️read/📦️packages/🦀️rust" }
semio-framework-os-store-replay = { path = "../../../../🔁️replay/📦️packages/🦀️rust" }
semio-framework-os-store-space-schema = { path = "../../../../🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-store-text-io = { path = "../../../../🚪️io/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-os-identity = { path = "../../../../../🪪️identity/📦️packages/🦀️rust" }
semio-framework-os-store-ephemeral = { path = "../../../../🫧️ephemeral/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-vcs = { path = "../../../../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-pack = { path = "../../../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-value-snapshot-read = { path = "../../../../../../../../🔨️modules/🌱️value/📸️snapshot/👁️read/📦️packages/🦀️rust" }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
js-sys = "0.3.83"

[dev-dependencies]
