[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-store-canonical-json"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Store-owned canonical JSON traversal, value admission, borrowed typed nodes and the bounded reader"

[package.metadata.semio]
role = "framework"
id = "os-store-canonical-json"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-spr = { path = "../../../../📡️spr/📦️packages/🦀️rust" }
semio-framework-os-store-one-item = { path = "../../../🎮️one-item/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-value-persistent = { path = "../../../../../../../🔨️modules/🌱️value/📋️list/🔗️persistent/📦️packages/🦀️rust" }
semio-framework-value-snapshot-read = { path = "../../../../../../../🔨️modules/🌱️value/📸️snapshot/👁️read/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
semio-framework-hash = { workspace = true }

[dev-dependencies]
semio-framework-trace = { workspace = true }
semio-framework-value-derive = { path = "../../../../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde_json = "1.0.140"
