[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-kernel-neural-engine"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "product"
id = "os-neural-engine"

[lints]
workspace = true

[lib]
name = "neural_engine"
crate-type = ["rlib"]
path = "🦀️.rs"

[dependencies]
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-replication = { path = "../../../../../../../🔨️modules/📡️replication/📦️packages/🦀️rust" }
semio-framework-os-kernel-neural-engine-model = { path = "../../🧱️model/📦️packages/🦀️rust" }
semio-framework-os-kernel-neural-engine-registry = { path = "../../📔️registry/📦️packages/🦀️rust" }
semio-framework-os-kernel-neural-engine-budgeted = { path = "../../⏱️evaluation/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-trace = { path = "../../../../../../../🔨️modules/⏱️trace/📦️packages/🦀️rust" }
semio-framework-async = { path = "../../../../../../../🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-framework-replication = { path = "../../../../../../../🔨️modules/📡️replication/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semio-framework-os-kernel-neural-engine-model = { path = "../../🧱️model/📦️packages/🦀️rust", features = ["testkit"] }

[[test]]
name = "registry_admission"
path = "../../📔️registry/🏗️admission/🧪️tests/🦀️.rs"
