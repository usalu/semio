[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-kernel-db-io-driver"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db I/O kernel driver: task submission, drive loop, WAL writer table and the storage traits"

[package.metadata.semio]
role = "product"
id = "os-db-io-driver"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_io_driver"
path = "../../🦀️.rs"

[features]
testkit = ["dep:semio-framework-os-kernel-db-durability", "semio-framework-os-kernel-db-io-core/testkit"]

[dependencies]
semio-framework-os-kernel-db-ids = { path = "../../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🧱️io-core/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-registry = { path = "../../../📇️io-registry/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-policy = { path = "../../../../🎚️policy/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-durability = { path = "../../../../💾️durability/📦️packages/🦀️rust", optional = true }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust" }
semio-framework-pack = { workspace = true }

[dev-dependencies]
semio-framework-os-kernel-db-durability = { path = "../../../../💾️durability/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🧱️io-core/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async = { workspace = true, features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
serde_json = { workspace = true }
semio-framework-trace = { workspace = true }
semio-framework-replication = { workspace = true }
semio-framework-diagnostic = { path = "../../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
