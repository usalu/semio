[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-kernel-db-storage-sqlite"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db SQLite storage backend"

[package.metadata.semio]
role = "product"
id = "os-db-storage-sqlite"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_storage_sqlite"
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-kernel-db-durability = { path = "../../../../💾️durability/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-ids = { path = "../../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🧱️io-core/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-driver = { path = "../../../🚦️io-driver/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-registry = { path = "../../../📇️io-registry/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true }
semio-framework-hash = { path = "../../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["blob", "bundled"] }

[dev-dependencies]
semio-framework-os-kernel-db-actor = { path = "../../../../🎭️actor/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🧱️io-core/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-io-driver = { path = "../../../🚦️io-driver/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust", features = ["durable-group-testing", "mutation-testing"] }
