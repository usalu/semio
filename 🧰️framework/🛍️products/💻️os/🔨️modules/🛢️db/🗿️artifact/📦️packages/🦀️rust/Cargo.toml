[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-kernel-db-artifact"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db document authority actor and runner"

[package.metadata.semio]
role = "product"
id = "os-db-artifact"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_artifact"
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-kernel-db-artifact-history/testkit", "semio-framework-os-kernel-db-io-core/testkit"]

[dependencies]
semio-framework-os-kernel-db-actor = { path = "../../../🎭️actor/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-artifact-contract = { path = "../../🧬️contract/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-artifact-engine = { path = "../../⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-artifact-history = { path = "../../📜️history/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-compact = { path = "../../../🗜️compact/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-durability = { path = "../../../💾️durability/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-ids = { path = "../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-policy = { path = "../../../🎚️policy/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-query = { path = "../../../🔍️query/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-os-kernel-db-artifact-history = { path = "../../📜️history/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-io-core = { path = "../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-io-driver = { path = "../../../🗄️storage/🚦️io-driver/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-storage = { path = "../../../🗄️storage/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-storage-memory = { path = "../../../🗄️storage/🗃️memory/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-wal = { path = "../../../📝️wal/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-wal-log = { path = "../../../📝️wal/🧾️log/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async = { workspace = true, features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", features = ["durable-group-testing", "mutation-testing"] }
semio-framework-schema-composition = { path = "../../../../../../../🔨️modules/🧬️schema/🧩️composition/📦️packages/🦀️rust" }
