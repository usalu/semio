[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-kernel-db-artifact-history"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db artifact history replay"

[package.metadata.semio]
role = "product"
id = "os-db-artifact-history"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_artifact_history"
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-kernel-db-io-core/testkit", "semio-framework-os-kernel-db-storage/testkit", "semio-framework-os-kernel-db-wal-log/testkit"]

[dependencies]
semio-framework-os-kernel-db-durability = { path = "../../../../💾️durability/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-ids = { path = "../../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-storage = { path = "../../../../🗄️storage/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-wal-log = { path = "../../../../📝️wal/🧾️log/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }

[dev-dependencies]
semio-framework-os-kernel-db-io-core = { path = "../../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-io-driver = { path = "../../../../🗄️storage/🚦️io-driver/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-storage = { path = "../../../../🗄️storage/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-storage-memory = { path = "../../../../🗄️storage/🗃️memory/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-wal = { path = "../../../../📝️wal/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-wal-log = { path = "../../../../📝️wal/🧾️log/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust", features = ["durable-group-testing", "mutation-testing"] }
