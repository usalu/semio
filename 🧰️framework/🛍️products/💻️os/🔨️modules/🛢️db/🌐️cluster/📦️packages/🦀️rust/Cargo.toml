[package]
workspace = "../../../../../../../.."
name = "semio-os-kernel-db-cluster"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db sharding, ownership leases and replication routing"

[package.metadata.semio]
role = "product"
id = "os-db-cluster"

[package.metadata.semio.rust-source-boundary]
