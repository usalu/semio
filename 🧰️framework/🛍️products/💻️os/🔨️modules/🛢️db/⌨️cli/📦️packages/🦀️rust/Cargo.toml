[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-kernel-db-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db command line inspection and repair tooling"

[package.metadata.semio]
role = "product"
id = "os-db-cli"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_cli"
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-kernel-db-actor = { path = "../../../🎭️actor/📦️packages/🦀️rust" }
