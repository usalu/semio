semio-framework-os-kernel-db-durability = { path = "../../../💾️durability/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-engine = { path = "../../../⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-engine-base = { path = "../../../⚙️engine/🧱️base/📦️packages/🦀️rust" }
