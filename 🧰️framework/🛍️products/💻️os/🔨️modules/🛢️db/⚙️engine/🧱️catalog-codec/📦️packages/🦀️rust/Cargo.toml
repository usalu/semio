[package]
workspace = "../../../../../../../../.."
name = "semio-os-kernel-db-engine-base"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db engine shared types, catalog codec and document mount registry"

[package.metadata.semio]
role = "product"
id = "os-db-engine-base"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_engine_base"
path = "../../🦀️.rs"

[features]
testkit = ["semio-os-kernel-db-artifact/testkit", "semio-os-kernel-db-io-core/testkit"]

[dependencies]
semio-os-kernel-db-actor = { path = "../../../../🎭️actor/📦️packages/🦀️rust" }
semio-os-kernel-db-artifact = { path = "../../../../🗿️artifact/📦️packages/🦀️rust" }
semio-os-kernel-db-artifact-contract = { path = "../../../../🗿️artifact/🧬️contract/📦️packages/🦀️rust" }
semio-os-kernel-db-artifact-engine = { path = "../../../../🗿️artifact/⚙️engine/📦️packages/🦀️rust" }
semio-os-kernel-db-durability = { path = "../../../../💾️durability/📦️packages/🦀️rust" }
semio-os-kernel-db-ids = { path = "../../../../🆔️ids/📦️packages/🦀️rust" }
semio-os-kernel-db-io-core = { path = "../../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust" }
semio-os-kernel-db-observe = { path = "../../../../👁️observe/📦️packages/🦀️rust" }
semio-os-kernel-db-query = { path = "../../../../🔍️query/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true }
semio-os-kernel = { path = "../../../../../../📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semio-framework-pack = { workspace = true }

[dev-dependencies]
semio-os-kernel-db-artifact = { path = "../../../../🗿️artifact/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-kernel-db-io-core = { path = "../../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-kernel-db-io-driver = { path = "../../../../🗄️storage/🚦️io-driver/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async = { workspace = true, features = ["testkit"] }
semio-os-kernel = { path = "../../../../../../📦️packages/🦀️rust", features = ["durable-group-testing", "mutation-testing"] }
