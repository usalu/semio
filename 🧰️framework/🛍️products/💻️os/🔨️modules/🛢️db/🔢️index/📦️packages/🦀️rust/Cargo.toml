[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-kernel-db-index"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db secondary index engine"

[package.metadata.semio]
role = "product"
id = "os-db-index"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_index"
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-kernel-db-durability = { path = "../../../💾️durability/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-ids = { path = "../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-registry = { path = "../../../🗄️storage/📇️io-registry/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-os-kernel-db-actor = { path = "../../../🎭️actor/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-io-driver = { path = "../../../🗄️storage/🚦️io-driver/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-kernel-db-storage-memory = { path = "../../../🗄️storage/🗃️memory/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async = { workspace = true, features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", features = ["durable-group-testing", "mutation-testing"] }
