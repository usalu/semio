[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-kernel-db-wal-log"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db write-ahead log records, payload transforms, group commit, sink and recovery"

