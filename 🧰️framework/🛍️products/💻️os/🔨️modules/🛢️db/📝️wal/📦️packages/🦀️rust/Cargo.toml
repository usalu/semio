[package]
workspace = "../../../../../../../.."
name = "semio-os-kernel-db-wal"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db write-ahead log segments and the per-document ArtifactWal"

[package.metadata.semio]
role = "product"
id = "os-db-wal"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_wal"
path = "../../🦀️.rs"

[features]
testkit = ["dep:semio-os-kernel-db-io-driver", "dep:semio-os-kernel-db-storage-memory", "semio-os-kernel-db-io-core/testkit", "semio-os-kernel-db-io-driver/testkit", "semio-os-kernel-db-storage-memory/testkit", "semio-os-kernel-db-wal-log/testkit"]

[dependencies]
semio-os-kernel-db-durability = { path = "../../../💾️durability/📦️packages/🦀️rust" }
semio-os-kernel-db-ids = { path = "../../../🆔️ids/📦️packages/🦀️rust" }
semio-os-kernel-db-io-core = { path = "../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust" }
semio-os-kernel-db-wal-log = { path = "../../🧾️log/📦️packages/🦀️rust" }
semio-os-kernel-db-io-driver = { path = "../../../🗄️storage/🚦️io-driver/📦️packages/🦀️rust", optional = true }
semio-os-kernel-db-storage-memory = { path = "../../../🗄️storage/🗃️memory/📦️packages/🦀️rust", optional = true }
semio-framework-async = { workspace = true }
semio-os-kernel = { path = "../../../../../📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
serde_json = "1.0.140"

[dev-dependencies]
semio-os-kernel-db-actor = { path = "../../../🎭️actor/📦️packages/🦀️rust" }
semio-os-kernel-db-io-core = { path = "../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-kernel-db-io-driver = { path = "../../../🗄️storage/🚦️io-driver/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-kernel-db-io-registry = { path = "../../../🗄️storage/📇️io-registry/📦️packages/🦀️rust" }
semio-os-kernel-db-storage = { path = "../../../🗄️storage/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-kernel-db-storage-fs = { path = "../../../🗄️storage/📁️fs/📦️packages/🦀️rust" }
semio-os-kernel-db-storage-memory = { path = "../../../🗄️storage/🗃️memory/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-kernel-db-wal-log = { path = "../../🧾️log/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async = { workspace = true, features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-os-kernel = { path = "../../../../../📦️packages/🦀️rust", features = ["durable-group-testing", "mutation-testing"] }
semio-framework-pack-source = { path = "../../../../../../../🔨️modules/🎒️pack/🚰️source/📦️packages/🦀️rust" }
