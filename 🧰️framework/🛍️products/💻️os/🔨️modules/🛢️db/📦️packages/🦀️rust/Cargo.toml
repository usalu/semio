[package]
name = "semio-framework-os-kernel-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db facade — Shape V2 #[path] glue over owner-tree db components"

[package.metadata.semio]
role = "product"
id = "os-db"

[lints]
workspace = true

[lib]
name = "db"
path = "📦️glue.rs"

[features]
default = ["fs", "thread", "deflate", "vcs"]
fs = []
thread = []
deflate = []
vcs = []
tokio = []
cluster = []
otel = []
sqlite = []
postgres = []
neo4j = []

[dependencies]
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
async-trait = "0.1"
