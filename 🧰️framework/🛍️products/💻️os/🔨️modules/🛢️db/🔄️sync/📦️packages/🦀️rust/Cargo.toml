[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-kernel-db-sync"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Db server side of the wire protocol: frontier exchange and bootstrap"

[package.metadata.semio]
role = "product"
id = "os-db-sync"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "db_sync"
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-kernel-db-io-core/testkit", "semio-framework-os-kernel-db-storage/testkit", "semio-framework-os-kernel-db-wal-log/testkit"]

[dependencies]
semio-framework-os-kernel-db-durability = { path = "../../../💾️durability/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-ids = { path = "../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-core = { path = "../../../🗄️storage/🧱️io-core/📦️packages/🦀️rust" }
semio-framework-os-kernel-db-io-registry = { path = "../../../🗄️storage/📇️io-registry/📦️packages/🦀️rust" }
