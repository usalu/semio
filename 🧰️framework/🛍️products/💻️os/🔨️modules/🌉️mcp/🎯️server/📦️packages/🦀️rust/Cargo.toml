[package]
workspace = "../../../../../../../.."
name = "semio-os-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The MCP server dispatcher and the stdio transport."

[package.metadata.semio]
role = "product"
id = "os-mcp-server"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"
doctest = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde_json = { workspace = true }
semio-os-mcp-foundation = { path = "../../../🧱️foundation/📦️packages/🦀️rust" }
semio-os-mcp-wire = { path = "../../../📡️wire/📦️packages/🦀️rust" }
semio-os-mcp-bridge-codec = { path = "../../../🧶️bridge-codec/📦️packages/🦀️rust" }
semio-os-mcp-bridge = { path = "../../../🪢️bridge-session/📦️packages/🦀️rust" }
semio-os-mcp-consent = { path = "../../../🙋️consent/📦️packages/🦀️rust" }
semio-os-mcp-workspace = { path = "../../../🪟️workspace-host/📦️packages/🦀️rust" }
