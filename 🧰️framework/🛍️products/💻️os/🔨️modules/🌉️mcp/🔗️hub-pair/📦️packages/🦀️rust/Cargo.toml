[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-mcp-hub-pair"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Canonical checkpoint pair receiver, cache and binding errors."

[package.metadata.semio]
role = "product"
id = "os-mcp-hub-pair"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"
doctest = false

[features]
testkit = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
framework_hash = { path = "../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["sync", "ureq"] }
semio-framework-os-services = { workspace = true }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
