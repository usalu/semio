name = "semio-framework-os-mcp-tools-inference"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Inference discovery, jobs and resources."

[package.metadata.semio]
role = "product"
id = "os-mcp-tools-inference"

