[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-mcp-hub-remote"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Hub remote binding, component assets and the native binding driver."

[package.metadata.semio]
role = "product"
id = "os-mcp-hub-remote"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"
doctest = false

[dependencies]
framework_hash = { path = "../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework = { workspace = true }
semio-framework-actor = { path = "../../../../../../../🔨️modules/🎭️actor/📦️packages/🦀️rust", package = "semio-framework-actor" }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["sync", "ureq"] }
semio-framework-os-services = { workspace = true }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
serde_json = { workspace = true }
semio-framework-os-mcp-foundation = { path = "../../../🧱️foundation/📦️packages/🦀️rust" }
semio-framework-os-mcp-wire = { path = "../../../📡️wire/📦️packages/🦀️rust" }
semio-framework-os-mcp-schema = { path = "../../../📐️schema-contract/📦️packages/🦀️rust" }
semio-framework-os-mcp-inference-hub = { path = "../../../🌐️inference-hub/📦️packages/🦀️rust" }
semio-framework-os-mcp-hub-pair = { path = "../../../🔗️hub-pair/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
tokio = { workspace = true, features = ["full"] }
semio-framework-os-mcp-capabilities = { path = "../../../🧰️capabilities/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-os-mcp-hub-pair = { path = "../../../🔗️hub-pair/📦️packages/🦀️rust", features = ["testkit"] }
