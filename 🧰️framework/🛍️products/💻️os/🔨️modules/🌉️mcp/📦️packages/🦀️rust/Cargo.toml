semio-os-mcp-capabilities = { path = "../../🧰️capabilities/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-mcp-port = { path = "../../🔌️channel-port/📦️packages/🦀️rust", features = ["testkit"] }
