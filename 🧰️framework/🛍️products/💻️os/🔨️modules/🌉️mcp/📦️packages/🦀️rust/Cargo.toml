semio-os-mcp-port = { path = "../../🔌️channel-port/📦️packages/🦀️rust" }
semio-os-mcp-bridge = { path = "../../🪢️bridge-session/📦️packages/🦀️rust" }
semio-os-mcp-consent = { path = "../../🙋️consent/📦️packages/🦀️rust" }
semio-os-mcp-plugin-runtime = { path = "../../⚙️plugin-runtime/📦️packages/🦀️rust" }
