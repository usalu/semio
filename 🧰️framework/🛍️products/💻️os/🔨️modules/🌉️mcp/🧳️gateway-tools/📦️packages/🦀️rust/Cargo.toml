[package]
workspace = "../../../../../../../.."
name = "semio-os-mcp-tools-gateway"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Artifact, ui, context resource and prompt tools."

[package.metadata.semio]
role = "product"
id = "os-mcp-tools-gateway"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"
doctest = false

[dependencies]
semio-framework-async = { workspace = true }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
serde_json = { workspace = true }
semio-os-mcp-foundation = { path = "../../../🧱️foundation/📦️packages/🦀️rust" }
semio-os-mcp-wire = { path = "../../../📡️wire/📦️packages/🦀️rust" }
semio-os-mcp-schema = { path = "../../../📐️schema-contract/📦️packages/🦀️rust" }
semio-os-mcp-catalog = { path = "../../../📚️catalog-compiler/📦️packages/🦀️rust" }
semio-os-mcp-capabilities = { path = "../../../🧰️capabilities/📦️packages/🦀️rust" }
semio-os-mcp-port = { path = "../../../🔌️channel-port/📦️packages/🦀️rust" }
semio-os-mcp-bridge-codec = { path = "../../../🧶️bridge-codec/📦️packages/🦀️rust" }
semio-os-mcp-bridge = { path = "../../../🪢️bridge-session/📦️packages/🦀️rust" }
semio-os-mcp-probe-document = { path = "../../../🔬️probe-document/📦️packages/🦀️rust" }
semio-os-mcp-shell-channel = { path = "../../../🎛️shell-channel/📦️packages/🦀️rust" }
semio-os-mcp-dispatch = { path = "../../../🪝️action-dispatch/📦️packages/🦀️rust" }
semio-os-mcp-workspace = { path = "../../../🪟️workspace-host/📦️packages/🦀️rust" }
semio-os-mcp-tools-inference = { path = "../../../🔭️inference-tools/📦️packages/🦀️rust" }
semio-os-kernel = { workspace = true }

[dev-dependencies]
framework_hash = { path = "../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-os-kernel", features = ["sync", "ureq"] }
semio-framework-test-fixtures = { path = "../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-ui-locale = { path = "../../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
tokio = { workspace = true, features = ["full"] }
semio-os-mcp-capabilities = { path = "../../../🧰️capabilities/📦️packages/🦀️rust", features = ["testkit"] }

[features]
testkit = []
