[package]
workspace = "../../../../../../../.."
name = "semio-os-mcp-inference-hub"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Inference job wire, hub inference client and bindings."

[package.metadata.semio]
role = "product"
id = "os-mcp-inference-hub"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"
doctest = false

[dependencies]
semio-framework-async = { workspace = true }
semio-os-kernel = { path = "../../../../../📦️packages/🦀️rust", features = ["sync", "ureq"] }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
serde = { workspace = true }
serde_json = { workspace = true }
semio-os-mcp-foundation = { path = "../../../🧱️foundation/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-schema-registry = { path = "../../../../../../../🔨️modules/🧬️schema/📇️registry/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
tokio = { workspace = true, features = ["full"] }
semio-os-mcp-wire = { path = "../../../📡️wire/📦️packages/🦀️rust" }
semio-os-mcp-schema = { path = "../../../📐️schema-contract/📦️packages/🦀️rust" }
