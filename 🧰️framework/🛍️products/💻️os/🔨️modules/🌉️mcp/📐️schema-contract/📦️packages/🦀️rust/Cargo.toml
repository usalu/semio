[package]
workspace = "../../../../../../../.."
name = "semio-os-mcp-schema"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The os.mcp schema registry: tool schemas, scope exports and the committed mirror."

[package.metadata.semio]
role = "product"
id = "os-mcp-schema"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"
doctest = false

[dependencies]
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
