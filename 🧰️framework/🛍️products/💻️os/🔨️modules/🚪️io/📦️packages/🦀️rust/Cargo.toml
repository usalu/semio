[package]
workspace = "../../../../../../.."
name = "semio-framework-os-io"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The OS artifact IO mechanism: typed registry, routing, IO fallback and wire framing"

[package.metadata.semio]
role = "framework"
id = "os-io"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-store-codec-registry = { path = "../../../🏪️store/📦️codec/📦️packages/🦀️rust" }
semio-framework-os-store-read = { path = "../../../🏪️store/🔗️read/📦️packages/🦀️rust" }
semio-framework-os-store-space-history = { path = "../../../🏪️store/📜️space-history/📦️packages/🦀️rust" }
semio-framework-os-store-text-io = { path = "../../../🏪️store/🚪️io/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-diagnostic = { path = "../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-io-control = { path = "../../../../../../🔨️modules/🚪️io/⏱️control/📦️packages/🦀️rust" }
semio-framework-io-schema = { path = "../../../../../../🔨️modules/🚪️io/🧬️schema/📦️packages/🦀️rust" }
semio-framework-io-sqlite-snapshot = { path = "../../../../../../🔨️modules/🚪️io/🪶️sqlite-snapshot/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-pack = { path = "../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-schema-registry = { workspace = true }
semio-framework-ui-contract-validation = { path = "../../../../../../🔨️modules/🖱️ui/🧬️contract/🛡️limits/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
