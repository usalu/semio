[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-services-native-io"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Native filesystem and process-observation interactive jobs of the OS host services"

[package.metadata.semio]
role = "product"
id = "os-services-native-io"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-job = { workspace = true }
semio-framework-job-payload = { workspace = true }
semio-framework-value = { workspace = true }

[dev-dependencies]
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-job-worker = { path = "../../../../../../../🔨️modules/🧵️job/👷️worker/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-job-worker-authority = { path = "../../../../../../../🔨️modules/🧵️job/👷️worker/🎟️authority/📦️packages/🦀️rust" }
semio-framework-trace = { workspace = true }
serde_json = { workspace = true }
