[package]
name = "semio-framework-os-kernel-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol facade — command/collaboration semantics and binary op-log format, re-exporting the full protocol_* family"


[lints]
workspace = true
[lib]
name = "protocol"
path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust/📦️lib.rs"

[features]
default = ["deflate"]
deflate = ["protocol_format/deflate"]

[dependencies]
protocol_core = { path = "../../🫀️core/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-core" }
protocol_command = { path = "../../🎮️command/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-command" }
protocol_causal = { path = "../../🔗️causal/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-causal" }
protocol_crdt = { path = "../../🔀️crdt/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-crdt" }
protocol_format = { path = "../../📐️format/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-format" }
protocol_history = { path = "../../📜️history/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-history" }
protocol_materialize = { path = "../../💎️materialize/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-materialize" }
protocol_wire = { path = "../../📡️wire/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-wire" }
protocol_channel = { path = "../../🧵️channel/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-channel" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
protocol_io = { path = "../../🔌️io/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol-io" }
