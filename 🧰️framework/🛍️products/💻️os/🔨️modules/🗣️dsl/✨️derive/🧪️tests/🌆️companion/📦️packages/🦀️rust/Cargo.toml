[package]
workspace = "../../../../../../../../../.."
name = "semio-framework-os-kernel-dsl-derive-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of the DSL derive expansion library through source and public facts"
publish = false

[package.metadata.semio]
role = "framework"
id = "os-kernel-dsl-derive-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
