[package]
name = "semio-framework-os-kernel-dsl-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Proc-macros compiling #[dsl(...)]-annotated struct/enum declarations into DocumentDsl/OpText impls"

[lints]
workspace = true

[lib]
name = "dsl_derive"
proc-macro = true
path = "🦀️.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
serde_json = "1.0"
semio-framework-hash = { path = "../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
