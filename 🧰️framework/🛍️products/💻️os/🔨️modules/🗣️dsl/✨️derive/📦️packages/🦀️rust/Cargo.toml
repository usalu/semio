[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-kernel-dsl-derive"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Proc-macros compiling #[dsl(...)]-annotated struct/enum declarations into DocumentDsl/OpText impls"

[package.metadata.semio]
role = "framework"
id = "dsl-derive"

[lints]
workspace = true

[lib]
name = "dsl_derive"
proc-macro = true
path = "🦀️.rs"

[dependencies]
semio-framework-ui-locale = { path = "../../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-schema-state = { path = "../../../../../../../🔨️modules/🧬️schema/📶️state/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
serde_json = "1.0"
semio-framework-hash = { path = "../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
