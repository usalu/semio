[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-kernel-dsl-derive-expand"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Expansion library of the DSL derives: the product artifact envelope, OS diff codec and source-authorized mutation derive implementations behind the proc-macro crate"

[package.metadata.semio]
role = "framework"
id = "dsl-derive-expand"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_os_kernel_dsl_derive_expand"
path = "../../🦀️.rs"

[features]
testkit = []

[dependencies]
semio-framework-ui-locale = { path = "../../../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-schema-state = { path = "../../../../../../../../🔨️modules/🧬️schema/📶️state/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
# 🧷️ `visit`/`visit-mut` pinned: `wasm-bindgen-macro-support` requests them in some hub components, and one host `syn` feature set keeps every component on the same proc-macro units.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
serde_json = "1.0"
semio-framework-hash = { path = "../../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-native-build-compiler-resources = { path = "../../../../../../../../🔨️modules/🏃️process/📦️artifacts/🏗️native-build/📥️resources/🧮️compiler/📦️packages/🦀️rust" }
