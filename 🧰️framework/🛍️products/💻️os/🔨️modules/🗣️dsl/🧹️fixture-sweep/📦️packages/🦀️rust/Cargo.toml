[package]
workspace = "../../../../../../../.."
name = "semio-os-dsl-fixture-sweep-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of os-dsl: the DSL fixture sweep"
publish = false

[package.metadata.semio]
role = "framework"
id = "os-dsl-fixture-sweep-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-os-dsl = { path = "../../../📦️packages/🦀️rust" }
semio-framework-dsl = { path = "../../../../../../../🔨️modules/🗣️dsl/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-os-kernel = { path = "../../../../../📦️packages/🦀️rust", features = ["protocol-laws", "mutation-testing"] }
semio-framework-test-fixtures = { path = "../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
