[package]
workspace = "../../../../../../.."
name = "semio-os-dsl"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The OS product grammars: dsl component, family kits, grammar, language server and the schema registry"

[package.metadata.semio]
role = "framework"
id = "os-dsl"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-os-semio = { path = "../../../🧬️semio/📦️packages/🦀️rust" }
dsl_derive = { path = "../../✨️derive/📦️packages/🦀️rust", package = "semio-os-kernel-dsl-derive" }
semio-framework-diagnostic = { path = "../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-dsl = { path = "../../../../../../🔨️modules/🗣️dsl/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../../../🔨️modules/🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-os-pack = { path = "../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../../../../🔨️modules/🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-os-pack-tools = { path = "../../../🎒️pack/⌨️cli/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-dsl-record-derive = { path = "../../../../../../🔨️modules/🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
serde_json = "1.0.140"
