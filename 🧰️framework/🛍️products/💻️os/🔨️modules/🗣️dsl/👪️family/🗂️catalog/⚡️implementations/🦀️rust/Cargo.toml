[package]
name = "semio-framework-os-kernel-dsl-family-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The catalog family notation kit — slash-path idents, count literals, and compat pairs (reusing dsl_notation's edge grammar), shared by block2d/3d/5d, curate, and forms"


[lints]
workspace = true
[lib]
name = "dsl_family_catalog"
path = "../../../../👪️family/🗂️catalog/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
dsl_core = { package = "semio-framework-os-kernel-dsl-core", path = "../../../../🫀️core/⚡️implementations/🦀️rust" }
dsl_notation = { package = "semio-framework-os-kernel-dsl-notation", path = "../../../../🖋️notation/⚡️implementations/🦀️rust" }

[dev-dependencies]
dsl_grammar = { package = "semio-framework-os-kernel-dsl-grammar", path = "../../../../📖️grammar/⚡️implementations/🦀️rust" }
