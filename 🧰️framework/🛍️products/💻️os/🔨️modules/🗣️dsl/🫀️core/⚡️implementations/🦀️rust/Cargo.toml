[package]
name = "semio-framework-os-kernel-dsl-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Token-native DSL engine foundation — spans, errors, tokens, lexer, limits, diagnostics, canonical escaping/number policy"


[lints]
workspace = true
[lib]
name = "dsl_core"
path = "../../../🫀️core/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
wasm-bindgen = { version = "0.2.106", optional = true }

[features]
default = []
js = ["wasm-bindgen"]
