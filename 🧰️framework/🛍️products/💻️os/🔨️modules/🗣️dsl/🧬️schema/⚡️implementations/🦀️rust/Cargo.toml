[package]
name = "semio-framework-os-kernel-dsl-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Data-driven declarative grammar engine — Shape/RecordSpec, parser, chunk writer with the newline law, DslValue, canonicalizer, LanguageService"


[lints]
workspace = true
[lib]
name = "dsl_schema"
path = "../../../🧬️schema/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
dsl_core = { path = "../../../🫀️core/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-core" }
dsl_notation = { path = "../../../🖋️notation/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-notation" }
serde = { version = "1.0.219", features = ["derive"] }
