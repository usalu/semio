[package]
name = "semio-framework-os-kernel-dsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Facade for the token-native declarative DSL engine — re-exports dsl_core/dsl_schema, the DslField/DslVariants runtime traits generated code binds against, and derive macros"


[lints]
workspace = true
[lib]
name = "dsl"
path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
dsl_core = { path = "../../🫀️core/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-core" }
dsl_schema = { path = "../../🧬️schema/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-schema" }
dsl_derive = { path = "../../✨️derive/📦️packages/🦀️rust", package = "semio-framework-os-kernel-dsl-derive" }
dsl_grammar = { path = "../../📖️grammar/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-grammar" }
pack = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
protocol = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
semio_format = { path = "../../../🧬️semio/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-semio" }
serde_json = "1.0.140"

[dev-dependencies]
store = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
