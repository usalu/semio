[package]
workspace = "../../../../../../../../.."
name = "semio-framework-os-dsl-module-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of os-dsl: the unit tests of the family kits, grammar, registry and receiving modules"
publish = false

[package.metadata.semio]
role = "framework"
id = "os-dsl-module-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-dsl = { path = "../../../../📦️packages/🦀️rust" }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-diagnostic = { path = "../../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-dsl = { path = "../../../../../../../../🔨️modules/🗣️dsl/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../../../../../🔨️modules/🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-dsl-record-derive = { path = "../../../../../../../../🔨️modules/🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
semio-framework-replication = { workspace = true }
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-value-native-owned = { path = "../../../../../../../../🔨️modules/🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async-macros = { path = "../../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../📦️packages/🦀️rust", features = ["protocol-laws", "mutation-testing"] }
semio-framework-test-fixtures = { path = "../../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-os-pack-tools = { path = "../../../../../🎒️pack/⌨️cli/📦️packages/🦀️rust" }
semio-framework-os-pack = { path = "../../../../../🎒️pack/📦️packages/🦀️rust" }
