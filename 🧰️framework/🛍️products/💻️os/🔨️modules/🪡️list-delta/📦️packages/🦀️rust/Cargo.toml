[package]
workspace = "../../../../../../.."
name = "semio-framework-os-list-delta"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Positional list deltas of the OS kernel: removed, inserted, moved and patched rows with base and after coordinates"

[package.metadata.semio]
role = "framework"
id = "os-list-delta"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
