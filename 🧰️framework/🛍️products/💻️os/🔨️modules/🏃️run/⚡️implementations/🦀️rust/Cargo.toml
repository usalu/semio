[package]
name = "semio-framework-os-run"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Headless runner: computes an OS studio's workflow without a UI"


[lints]
workspace = true
[lib]
path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏃️run/⚡️implementations/🦀️rust/📦️lib.rs"
[[bin]]
name = "semio-framework-os-run"
path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏃️run/⚡️implementations/🦀️rust/📦️bin.rs"

[dependencies]
semio-framework-core = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework-core" }
semio-framework-os = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
workflow = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔁️workflow/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-workflow" }
semio-framework-plugin = { path = "../../../🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
framework_hash = { path = "../../../../../../../🧰️framework/🔨️modules/#⃣hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
store = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
dsl = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
dsl_core = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/🫀️core/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-plugin-host = { path = "../../../🔌️plugin/🖥️host/⚡️implementations/🦀️rust", package = "semio-framework-plugin-host" }

[dev-dependencies]
pretty_assertions = "1.4.1"
