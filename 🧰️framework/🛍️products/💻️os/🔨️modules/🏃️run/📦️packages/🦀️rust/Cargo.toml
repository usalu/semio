[package]
name = "semio-framework-os-run"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Headless runner: computes an OS studio's workflow without a UI"

[package.metadata.semio]
role = "product"
id = "os-run"

[lints]
workspace = true

[lib]
path = "📦️glue.rs"

[[bin]]
name = "semio-framework-os-run"
path = "../../📦️bin.rs"

[dependencies]
semio-framework = { path = "../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-actor = { workspace = true }
semio-framework-os = { path = "../../../../🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../🔌️plugin/📦️packages/🦀️rust", package = "semio-framework-plugin" }
framework_hash = { path = "../../../../../../🔨️modules/#⃣hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
# 🪪️ `OperationContext`/`CancelToken`/`TraceId` — carried through `AppChannelHost::exchange` so a
# run's cancellation/deadline propagate rather than being bolted on later (ticket
# 26/08/17/MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME, packet terra-directory-and-run). Pure, no
# tokio, so unconditional like every other dependency here.
#
# 🎠️ MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME (packet `run-kernel-wiring`): also `📦️bin.rs`'s own
# `block_on` bridge now (was `futures-lite`, moved to `[dev-dependencies]` below — see that crate's
# own doc for why the canonical bridge, not an incidental external one, belongs in production code).
semio-framework-async = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-plugin-host = { path = "../../../🔌️plugin/🖥️host/📦️packages/🦀️rust", package = "semio-framework-plugin-host" }

[dev-dependencies]
pretty_assertions = "1.4.1"
# 🌀️ async-first rewrite (ticket 26/08/17/MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME, packet
# terra-directory-and-run) — `AppChannelHost::exchange`/`SpaceRunner::run` are `async fn`; this
# crate's own `#[cfg(test)] mod tests` drives them with a plain single-poll executor (R4 clause 5: a
# `#[test] fn` body is a sanctioned executor entry point). MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME
# (packet `run-kernel-wiring`) moved this from `[dependencies]` to here: `📦️bin.rs`'s own production
# bridge is now `semio_framework_async::block_on` (above), and a `grep` across this crate found zero
# remaining non-test `futures_lite` call sites — see that file's own doc comment.
futures-lite = "2"
