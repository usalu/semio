[package]
workspace = "../../../../../../../.."
name = "semio-os-flow-wasm"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Flow wasm session: bridge runtime, domain trait implementation, operation dispatch and linear-memory exports"

[package.metadata.semio]
role = "product"
id = "os-flow-wasm"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-os-flow-wasm-domain = { path = "../../🧩️domain-adapter/📦️packages/🦀️rust" }
semio-os-flow-wasm-actions-a = { path = "../../🎬️actions-a/📦️packages/🦀️rust" }
semio-os-flow-wasm-actions-b = { path = "../../🎞️actions-b/📦️packages/🦀️rust" }
semio-os-flow-host-core = { path = "../../../🖥️host/🧱️flow-host-model/📦️packages/🦀️rust" }
semio-os-flow-vcs = { path = "../../../🌿️vcs/📦️packages/🦀️rust" }
semio-os-flow-drawing = { path = "../../../🖍️drawing/📦️packages/🦀️rust" }
semio-framework-canvas = { path = "../../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-artifact-flow-flow = { workspace = true }
semio-os-infinite = { path = "../../../../♾️infinite/📦️packages/🦀️rust" }
semio-framework = { path = "../../../../../../../📦️packages/🦀️rust" }
semio-framework-abi = { path = "../../../../../../../🔨️modules/🌉️abi/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-replication = { workspace = true }
serde_json = "1"

[dev-dependencies]
semio-os-flow-host = { path = "../../../🖥️host/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-test-fixtures = { path = "../../../../../../../🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-trace = { path = "../../../../../../../🔨️modules/⏱️trace/📦️packages/🦀️rust" }
semio-framework-artifact-flow-flow = { workspace = true, features = ["protocol-laws"] }
semio-framework-replication = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-ui-declaration = { path = "../../../../../../../🔨️modules/🖱️ui/📜️declaration/📦️packages/🦀️rust" }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
ui_webgpu = { path = "../../../../../../../🔨️modules/🖱️ui/🖌️render/🎯️targets/🧊️webgpu/📦️packages/🦀️rust", package = "semio-ui-backend-webgpu" }
