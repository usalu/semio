[package]
workspace = "../../../../../../../../.."
name = "semio-os-flow-host-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Flow host core: the retained FlowHost, graph editing, evaluation steps, history and close ladder with host errors"

[package.metadata.semio]
role = "product"
id = "os-flow-host-core"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-os-flow-host-source = { path = "../../../📥️evaluation-source/📦️packages/🦀️rust" }
