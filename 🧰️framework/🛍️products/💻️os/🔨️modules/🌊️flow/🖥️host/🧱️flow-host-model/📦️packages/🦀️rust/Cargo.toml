semio-os-flow-extensions = { path = "../../../../🧩️extensions/🕸️wasm/📦️packages/🦀️rust" }
semio-os-flow-geometry = { path = "../../../../🌐️geometry/📦️packages/🦀️rust" }
semio-os-flow-vcs = { path = "../../../../🌿️vcs/📦️packages/🦀️rust" }
semio-os-infinite-directed-presentation = { path = "../../../../../♾️infinite/🎲️board/🔌️ports/➡️directed/🧬️schema/🖼️presentation/📦️packages/🦀️rust" }
