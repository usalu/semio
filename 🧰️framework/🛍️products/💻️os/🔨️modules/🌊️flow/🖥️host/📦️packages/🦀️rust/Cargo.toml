[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-flow-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Flow host: canvas editing, evaluation session and host errors composed from the core, read and session producers"

[package.metadata.semio]
role = "product"
id = "os-flow-host"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-flow-host-core = { path = "../../🧱️flow-host-model/📦️packages/🦀️rust" }
semio-framework-os-flow-host-read = { path = "../../📥️evaluation-source/🔎️read/📦️packages/🦀️rust" }
semio-framework-os-flow-host-session = { path = "../../🎞️session/📦️packages/🦀️rust" }
semio-framework-os-flow-operators = { path = "../../../🗃️operators/📦️packages/🦀️rust" }
semio-framework-os-flow-drawing = { path = "../../../🖍️drawing/📦️packages/🦀️rust" }
semio-framework-os-flow-vcs = { path = "../../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-os-infinite-directed-presentation = { path = "../../../../♾️infinite/🎲️board/🔌️ports/➡️directed/🧬️schema/🖼️presentation/📦️packages/🦀️rust" }
semio-framework-canvas = { path = "../../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-ordered = { path = "../../../../../../../🔨️modules/🌱️value/🗂️ordered/📦️packages/🦀️rust" }
semio-framework-artifact-flow-flow = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-os-infinite = { path = "../../../../♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-replication = { workspace = true }
neural_engine = { path = "../../../../🧠️neural/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
semio-framework-graph-manifest = { path = "../../../../../../../🔨️modules/🕸️graph/🛂️manifest/📦️packages/🦀️rust" }
semio-framework-graph-dsl = { path = "../../../../../../../🔨️modules/🕸️graph/🗣️dsl/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["mutation-testing"] }
semio-framework-artifact-flow-flow = { workspace = true, features = ["protocol-laws"] }
semio-framework-replication = { workspace = true }
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
ui_contract = { path = "../../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-pack = { path = "../../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
ui_styling = { path = "../../../../../../../🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
semio-framework-ui-declaration = { path = "../../../../../../../🔨️modules/🖱️ui/📜️declaration/📦️packages/🦀️rust" }
serde_json = "1"
semio-framework-os-flow-operators = { path = "../../../🗃️operators/📦️packages/🦀️rust", features = ["protocol-laws"] }
