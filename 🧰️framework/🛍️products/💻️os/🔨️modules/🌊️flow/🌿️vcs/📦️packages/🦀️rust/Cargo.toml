[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-flow-vcs"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Flow document VCS: retained operations, DSL, store, canonical forms and the forms bridge"

[package.metadata.semio]
role = "product"
id = "os-flow-vcs"

[package.metadata.semio.rust-source-boundary]
