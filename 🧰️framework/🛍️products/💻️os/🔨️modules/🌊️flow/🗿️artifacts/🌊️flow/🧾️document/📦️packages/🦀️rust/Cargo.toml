[package]
workspace = "../../../../../../../../../.."
name = "semio-framework-artifact-flow-flow-document"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Flow document: the persisted host snapshot, its mutation catalogue and the native text, binary and SQLite representations"

[package.metadata.semio]
role = "artifact"
id = "flow-flow-document"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

