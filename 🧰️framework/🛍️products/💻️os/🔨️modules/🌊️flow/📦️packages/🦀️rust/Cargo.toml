[package]
workspace = "../../../../../../.."
name = "semio-framework-os-flow"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "OS flow family facade — re-exports the document, host, drawing, vcs, geometry, mesh and wasm session producers; operators (light/draw/brep/bim) are packaged extensions"

[package.metadata.semio]
role = "product"
id = "os-flow"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_os_flow"
path = "🦀️.rs"

[dependencies]
semio-framework-os-flow-geometry = { path = "../../🌐️geometry/📦️packages/🦀️rust" }
semio-framework-os-flow-mesh = { path = "../../🎒️mesh/📦️packages/🦀️rust" }
semio-framework-os-flow-drawing = { path = "../../🖍️drawing/📦️packages/🦀️rust" }
semio-framework-os-flow-operators = { path = "../../🗃️operators/📦️packages/🦀️rust" }
semio-framework-os-flow-vcs = { path = "../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-os-flow-extensions = { path = "../../🧩️extensions/🕸️wasm/📦️packages/🦀️rust" }
semio-framework-os-flow-host-core = { path = "../../🖥️host/🧱️core/📦️packages/🦀️rust" }
semio-framework-os-flow-host-read = { path = "../../🖥️host/📥️evaluation-source/🔎️read/📦️packages/🦀️rust" }
semio-framework-os-flow-host-session = { path = "../../🖥️host/🎞️session/📦️packages/🦀️rust" }
semio-framework-os-flow-host = { path = "../../🖥️host/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-os-infinite = { path = "../../../♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-canvas = { path = "../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
neural_engine = { path = "../../../🧠️neural/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }

# 🌉️ `wasm_session` is the browser wasm-pack SDK bridge; the WASI guest component drops it together with its `ui_webgpu` chain.
[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
semio-framework-os-flow-wasm = { path = "../../🕸️wasm/📦️packages/🦀️rust" }

# 🌉️ Browser byte-ABI and canvas bindings require a JavaScript engine and are excluded from WASI.
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

# 🎒️ Preview mesh wire laws (pack record body + chunking + LOD cache) — ticket
# 26/09/09/PROCEDURAL-3D-END-TO-END. Declared as its own `[[test]]` so the cross-language wire
# contract stays runnable from this crate's PUBLIC surface alone.
[[test]]
name = "flow_mesh_pack_wire"
path = "../../🧪️tests/🎒️mesh-pack-wire/🦀️.rs"

[[test]]
name = "flow_retirement_law"
path = "../../🧪️tests/⚖️retirement-law/🦀️.rs"
