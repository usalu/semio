[package]
name = "semio-s-kernel-flow-extension-brep"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "flow_extension_brep"
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow/⚡️implementations/🦀️rust/🧩️extensions/📐️brep/📦️lib.rs"

[features]
default = ["standalone-wasm"]
standalone-wasm = ["dep:wasm-bindgen"]

[dependencies]
flow_extension_sdk = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow/⚡️implementations/🦀️rust/🧩️extensions/🕸️wasm", package = "semio-s-kernel-flow-extension-wasm" }
semio-s-3d = { path = "../../../../../../../../../✏️s/🔨️modules/🧊️3d/📦️packages/🦀️rust" }
neural_engine = { path = "../../../../../🧠️neural/⚙️engine/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
semio-framework-core = { path = "../../../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework-core" }
base64 = "0.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.77"
wasm-bindgen = { version = "0.2.106", optional = true }
