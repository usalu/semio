[package]
workspace = "../../../../../../../../../.."
name = "semio-os-command-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of os-command: command protocol unit tests, the mutation payload law and the registry and mutation-law fixtures"
publish = false

[package.metadata.semio]
role = "framework"
id = "os-command-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

