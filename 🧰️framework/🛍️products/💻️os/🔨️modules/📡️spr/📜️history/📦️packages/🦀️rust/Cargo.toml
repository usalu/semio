[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-history"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Independent persisted history records and bounded codec"

[package.metadata.semio]
role = "framework"
id = "os-history"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = ["deflate"]
deflate = ["protocol/deflate", "semio-framework-os-pack/deflate"]

[dependencies]
semio-framework-pack-source = { path = "../../../../../../../🔨️modules/🎒️pack/🚰️source/📦️packages/🦀️rust" }
semio-framework-os-history-schema = { path = "../../🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-history-codec = { path = "../../⚙️codec/📦️packages/🦀️rust" }
semio-framework-os-history-record-decode = { path = "../../🛬️decode/📋️record-set/📦️packages/🦀️rust" }

protocol = { path = "../../../../../../../🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-framework-os-pack = { path = "../../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-diagnostic = { path = "../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-async = { path = "../../../../../../../🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../../../../🔨️modules/🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-trace-memory-testing = { path = "../../../../../../../🔨️modules/⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-os-history-testing-retirement = { path = "../../🧪️testing/♻️retirement/📦️packages/🦀️rust" }
