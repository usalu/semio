[package]
workspace = "../../../../../../../../.."
name = "semio-plugin-tests-20"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion test crate tests-20 of the plugin SDK partition (hosts: retained-command unit tests)"
publish = false

[package.metadata.semio]
role = "framework"
id = "plugin-tests-20"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-plugin-retained-command = { path = "../../../../🧵️retained-command/📦️packages/🦀️rust", features = ["artifact-app-testing"] }
semio-plugin-decl-app = { path = "../../../../📜️declaration/🧩️app/📦️packages/🦀️rust", features = ["artifact-app-testing", "reserved-producer-testing"] }
semio-plugin-decl-emission = { path = "../../../../📜️declaration/📨️emission/📦️packages/🦀️rust" }
semio-framework = { path = "../../../../../../../../📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", features = ["testkit"] }
semio-os-kernel = { path = "../../../../../../📦️packages/🦀️rust", features = ["mutation-testing"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
