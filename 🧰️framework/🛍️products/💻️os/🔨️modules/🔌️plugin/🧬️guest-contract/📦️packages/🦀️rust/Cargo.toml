semio-framework-actor-job-state = { path = "../../../../../../../🔨️modules/🎭️actor/🎟️retained-turn/💼️job/🏠️state/📦️packages/🦀️rust" }
semio-framework-pack-json-source = { workspace = true }
semio-framework-kernel-json = { workspace = true }
semio-framework = { workspace = true }
semio-framework-actor = { workspace = true }
semio-framework-artifact-reference = { workspace = true }
