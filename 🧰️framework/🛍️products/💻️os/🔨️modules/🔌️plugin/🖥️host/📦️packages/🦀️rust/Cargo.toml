[package]
name = "semio-framework-plugin-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.semio]
role = "product"
id = "os-plugin-host"

[lints]
workspace = true

[lib]
path = "📦️glue.rs"

[dependencies]
semio-framework = { path = "../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
ui_wgpu = { path = "../../../../../../../🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"] }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
wasmtime = { version = "22.0.1", features = ["cranelift", "component-model"] }
wasmtime-wasi = "22.0.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
