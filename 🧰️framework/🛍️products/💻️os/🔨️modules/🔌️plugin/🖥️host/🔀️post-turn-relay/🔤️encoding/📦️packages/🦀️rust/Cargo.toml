[package]
workspace = "../../../../../../../../../.."
name = "semio-framework-plugin-host-source-json"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Source-bound resumable JSON encoding and scoped actor budget views."

[package.metadata.semio]
role = "product"
id = "os-plugin-host-source-json"

[package.metadata.semio.rust-source-boundary]
