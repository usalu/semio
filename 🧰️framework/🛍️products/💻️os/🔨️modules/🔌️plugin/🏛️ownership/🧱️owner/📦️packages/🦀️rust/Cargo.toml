[package]
workspace = "../../../../../../../../.."
name = "semio-plugin-ownership"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "🏛️ Plugin SDK ownership: bounded lifecycle steps and grants, SDK faults and worker session admission."

[package.metadata.semio]
role = "framework"
id = "plugin-ownership"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = []

[dependencies]
semio-framework = { path = "../../../../../../../../📦️packages/🦀️rust" }
semio-framework-async = { path = "../../../../../../../../🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-framework-diagnostic = { path = "../../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust" }
semio-framework-job-worker = { path = "../../../../../../../../🔨️modules/🧵️job/👷️worker/📦️packages/🦀️rust" }
semio-framework-job-worker-authority = { path = "../../../../../../../../🔨️modules/🧵️job/👷️worker/🎟️authority/📦️packages/🦀️rust" }
semio-framework-trace = { workspace = true }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-ordered = { path = "../../../../../../../../🔨️modules/🌱️value/🗂️ordered/📦️packages/🦀️rust" }
semio-os-kernel = { path = "../../../../../../📦️packages/🦀️rust" }
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-job = { path = "../../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", features = ["testkit"] }
