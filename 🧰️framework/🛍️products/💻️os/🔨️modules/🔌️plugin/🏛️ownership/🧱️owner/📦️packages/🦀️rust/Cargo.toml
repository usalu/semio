[package]
workspace = "../../../../../../../../.."
name = "semio-framework-plugin-ownership"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "🏛️ Plugin SDK ownership: bounded lifecycle steps and grants, SDK faults, worker session admission, store lifecycle and disposers, and transient publication."

[package.metadata.semio]
role = "framework"
id = "plugin-ownership"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework = { path = "../../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
