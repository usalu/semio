[package]
workspace = "../../../../../../../../.."
name = "semio-framework-plugin-reactor-surfaces"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Cold pair, checkpoint and surface slots of the plugin reactor"

[package.metadata.semio]
role = "framework"
id = "plugin-reactor-surfaces"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-plugin-reactor-app = { path = "../../../🔌️app/📦️packages/🦀️rust" }
