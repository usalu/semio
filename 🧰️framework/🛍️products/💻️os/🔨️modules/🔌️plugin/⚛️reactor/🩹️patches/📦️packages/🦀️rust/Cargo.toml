[package]
workspace = "../../../../../../../../.."
name = "semio-framework-plugin-reactor-patches"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pending patches and patch tracker of the plugin reactor"

[package.metadata.semio]
role = "framework"
id = "plugin-reactor-patches"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
artifact-app-testing = ["original-actor-context-testing"]
original-actor-context-testing = ["dep:semio-framework-trace"]

[dependencies]
semio-framework-trace = { workspace = true, optional = true }
semio-framework-plugin-reactor-lifecycle = { path = "../../../📨️pending/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", package = "semio-framework-job" }
semio-framework-value = { path = "../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio_framework_ui_runtime = { path = "../../../../../../../../🔨️modules/🖱️ui/🧠️runtime/📦️packages/🦀️rust", package = "semio-framework-ui-runtime" }
semio-framework-plugin-abi = { path = "../../../../🚪️io/📦️packages/🦀️rust" }
semio_framework_ui_contract = { path = "../../../../../../../../🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }

[dev-dependencies]
semio-framework-job = { path = "../../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", features = ["testkit"], package = "semio-framework-job" }
semio-framework = { path = "../../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-trace = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semio-framework-plugin-testing-caller = { path = "../../../../🧪️testing/🎟️caller/📦️packages/🦀️rust" }
semio-framework-plugin-reactor-lifecycle = { path = "../../../📨️pending/📦️packages/🦀️rust", features = ["artifact-app-testing"] }
