[package]
workspace = "../../../../../../../.."
name = "semio-framework-plugin-operation"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Cancellation, operation progress, initialization, completion and cold-task vocabulary of the plugin SDK"

[package.metadata.semio]
role = "framework"
id = "plugin-operation"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
media-turn-testing = []

[dependencies]
semio-framework = { path = "../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-async = { path = "../../../../../../../🔨️modules/⏳️async/📦️packages/🦀️rust", package = "semio-framework-async" }
semio-framework-job = { path = "../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", package = "semio-framework-job" }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin-ownership = { path = "../../../🏛️ownership/🧱️owner/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-trace = { workspace = true }
serde_json = "1.0.140"
semio-framework-job = { path = "../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", package = "semio-framework-job", features = ["testkit"] }
