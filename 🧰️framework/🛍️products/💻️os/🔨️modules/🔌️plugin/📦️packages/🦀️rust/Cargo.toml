[package]
name = "semio-framework-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Declarative app plugin SDK for semio framework WASM components"

[lints]
workspace = true

[lib]
path = "📦️lib.rs"

[features]
default = []
component-guest = []

[dependencies]
semio-framework-core = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework-core" }
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
ui_wgpu = { path = "../../../../../../🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
wit-bindgen = { version = "0.36.0", features = ["macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
