[package]
workspace = "../../../../../../../.."
name = "semio-framework-plugin-actor-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Actor host API of the plugin SDK: host requests, body, backbone binding and the reactor executors"

[package.metadata.semio]
role = "framework"
id = "plugin-actor-host"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework = { path = "../../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-job-worker = { path = "../../../../../../../🔨️modules/🧵️job/👷️worker/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-plugin-abi = { path = "../../../🚪️io/📦️packages/🦀️rust" }
semio-framework-trace = { workspace = true }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-derive = { path = "../../../../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
serde_json = "1.0.140"
