[package]
workspace = "../../../../../../../.."
name = "semio-plugin-builder"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The PluginBuilder typestate of the plugin SDK"

[package.metadata.semio]
role = "framework"
id = "plugin-builder"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
canvas-runtime-assets = ["dep:semio-framework-canvas-assets"]

[dependencies]
