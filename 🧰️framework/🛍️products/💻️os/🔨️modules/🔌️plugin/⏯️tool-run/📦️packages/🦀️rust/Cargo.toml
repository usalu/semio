[package]
workspace = "../../../../../../../.."
name = "semio-framework-plugin-tool-run"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Tool run ledger, driver and continuous controls of the plugin SDK"

[package.metadata.semio]
role = "framework"
id = "plugin-tool-run"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
artifact-app-testing = []

[dependencies]
semio-framework-plugin-interaction = { path = "../../../🕹️interaction/📦️packages/🦀️rust" }
semio-framework-plugin-window-config = { path = "../../../🪟️window/🎚️config/📦️packages/🦀️rust" }
semio-framework-plugin-window-transient = { path = "../../../🪟️window/📦️packages/🦀️rust" }
semio-framework-plugin-window-kits = { path = "../../../🪟️window-kits/📦️packages/🦀️rust" }
semio-framework-plugin-decl-views = { path = "../../../📜️declaration/👁️view/📦️packages/🦀️rust" }
semio-framework-plugin-decl-emission = { path = "../../../📜️declaration/📨️emission/📦️packages/🦀️rust" }
semio-framework-plugin-decl-app = { path = "../../../📜️declaration/🧩️app/📦️packages/🦀️rust" }
base64_codec = { path = "../../../../../../../🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust", package = "semio-framework-io-base64" }
replication = { path = "../../../../../../../🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-framework-async = { path = "../../../../../../../🔨️modules/⏳️async/📦️packages/🦀️rust", package = "semio-framework-async" }
semio-framework-job = { path = "../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", package = "semio-framework-job" }
semio-framework-os-kernel = { path = "../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin-mounted-owner = { path = "../../../🏇️mounted-owner/📦️packages/🦀️rust" }
