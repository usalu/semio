semio-plugin-window-config-original = { path = "../../../🪟️window/🎚️config/🧿️original/📦️packages/🦀️rust" }
semio-plugin-decl-views = { path = "../../../📜️declaration/👁️view/📦️packages/🦀️rust" }
semio-plugin-decl-emission = { path = "../../../📜️declaration/📨️emission/📦️packages/🦀️rust" }
