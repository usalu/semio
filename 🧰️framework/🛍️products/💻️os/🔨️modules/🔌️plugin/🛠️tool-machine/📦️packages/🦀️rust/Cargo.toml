[package]
workspace = "../../../../../../../.."
name = "semio-plugin-tool-machine"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Tool machine runtime of the plugin SDK: continuous-control presses, typing runs, gestures and their original follow, settlement and tag turns"

[package.metadata.semio]
role = "framework"
id = "plugin-tool-machine"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
artifact-app-testing = []

[dependencies]
