[package]
name = "semio-framework-plugin-mounted-owner"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Explicit mounted physical ownership under original job scheduling authority"

[workspace]
resolver = "2"
members = ["."]

[workspace.metadata.semio.repository]
schema-version = 1
member-manifests = ["Cargo.toml"]
exclude-patterns = []

[package.metadata.semio]
role = "framework"
id = "plugin-mounted-owner"

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-job = { path = "../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }

[dev-dependencies]
serde_json = "1.0.149"
semio-framework-trace = { path = "../../../../../../../🔨️modules/⏱️trace/📦️packages/🦀️rust" }

[profile.dev]
debug = false
incremental = false
