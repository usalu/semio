[package]
name = "semio-plugin-result-page"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
workspace = "../../../../../../../../.."

[package.metadata.semio]
role = "framework"
id = "plugin-result-page"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-value-native-owned = { path = "../../../../../../../../../🔨️modules/🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework = { path = "../../../../../../../../../📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-pack-json-source-sink = { path = "../../../../../../../../../🔨️modules/🎒️pack/🔤️json/🛫️encode/🫳️borrowed/📦️packages/🦀️rust" }
semio-framework-actor = { workspace = true }

[dev-dependencies]
semio-os-store-one-item = { path = "../../../../../../🏪️store/🎮️one-item/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../../../../🔨️modules/🧵️job/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-trace = { workspace = true }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }

