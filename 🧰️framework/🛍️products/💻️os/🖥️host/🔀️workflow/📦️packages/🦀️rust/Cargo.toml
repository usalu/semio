[package]
workspace = "../../../../../../.."
name = "semio-framework-os-host-workflow"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "OS host workflow vocabulary, media negotiation and the media export and import handler registries"

[package.metadata.semio]
role = "product"
id = "os-host-workflow"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework = { path = "../../../../../../📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-derive = { path = "../../../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64_codec = { path = "../../../../../../🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust", package = "semio-framework-io-base64" }
semio-framework-artifact-workflow-workflow = { workspace = true }
semio-framework-os-host-instance = { path = "../../../🧱️instance/📦️packages/🦀️rust" }
semio-framework-os-host-registry = { path = "../../../🗂️registry/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-pack-json = { path = "../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-ui-locale = { path = "../../../../../../🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["mutation-testing", "protocol-laws"] }
