[package]
name = "semio-framework-os"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Plugin-based OS kernel: hot-swappable WASM plugins, workflow, document VCS"


[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust/📦️lib.rs"

[dependencies]
semio-framework-core = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework-core" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
ui_wgpu = {path = "../../../../🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"]}
semio-s-3d = { path = "../../../../../✏️s/🔨️modules/🧊️3d/📦️packages/🦀️rust" }
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
workflow = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔁️workflow/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-workflow" }
space = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🪐️space/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-space" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
base64 = "0.22.1"
png = "0.17.16"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.45.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
store_sync = { path = "../../🔨️modules/🏪️store/🔄️sync/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store-sync" }
tokio = { version = "1", features = ["sync"], default-features = false }
uuid = { version = "1.20", features = ["v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.20", features = ["v7", "serde", "js"] }
wasm-bindgen = "0.2.106"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
pretty_assertions = "1.4.1"
