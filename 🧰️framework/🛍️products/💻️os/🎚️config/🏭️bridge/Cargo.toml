# 🧭️ Own workspace root: the repository root manifest is a shared leased file, and a member crate would serialise
# every concurrent session behind that lease.
[workspace]

[package]
name = "semio-config-mutation-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "🏭️ Production mutation bridge for 🎚️config — answers listMutations from the production dispatch aggregates themselves."

[[bin]]
name = "semio-config-mutation-bridge"
path = "🦀️.rs"

[dependencies]
semio-framework-dsl-record-derive = { path = "../../../../🔨️modules/🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
semio-framework-diagnostic = { path = "../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../🔨️modules/🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../📦️packages/🦀️rust" }
pack = { path = "../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
semio-framework-os-config = { path = "../📦️packages/🦀️rust" }
