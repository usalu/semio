syntax = "proto3";
package semio.os.config.opening;

message ArtifactDialect {
  string artifact_kind = 1;
  string standard = 2;
  string subset = 3;
}

enum AppRole {
  VIEWER = 0;
  EDITOR = 1;
}

message AppRef {
  string plugin_id = 1;
  string app_id = 2;
}

message DefaultApp {
  ArtifactDialect dialect = 1;
  AppRole role = 2;
  AppRef app = 3;
}

message OpeningPreferences {
  // @state config
  repeated DefaultApp defaults = 1;
}
