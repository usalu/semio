[package]
workspace = "../../../../.."
name = "semio-framework-quiz"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Quiz product core: the quiz contract types, bit-exact randomness, solution-free sheets, validation, partial-credit scoring, badges, the learner lifecycle (pure decide/evolve) and the proctor read models. Pure functions only; the TypeScript twin is @semio-tech/quiz."

[package.metadata.semio]
role = "product"
id = "quiz"

[lints]
workspace = true

[lib]
name = "quiz"
path = "🦀️.rs"

[features]
sut = ["dep:serde_json"]

[dependencies]
serde = { workspace = true }
# 🎯️ `float_roundtrip`: quiz documents are read correctly rounded, as `JSON.parse` and Python read them (`3.828e26` is
# otherwise read one double low, and the twins' sheets and verdicts part).
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
# 🔮️ Third-party oracle of the handle tables: NFC, NFKC and the composition of pairs.
unicode-normalization = "0.1.25"
