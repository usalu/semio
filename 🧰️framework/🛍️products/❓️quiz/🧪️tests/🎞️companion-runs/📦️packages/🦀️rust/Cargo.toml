[package]
workspace = "../../../../../../.."
name = "semio-framework-quiz-tests-runs"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of the quiz product: the learner lifecycle and the proctor read models"
publish = false

[package.metadata.semio]
role = "product"
id = "quiz-tests-runs"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-quiz = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }

[dev-dependencies]
semio-framework-quiz-schema = { path = "../../../../🧬️schema/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-quiz-tests-support = { path = "../../../🧷️companion-support/📦️packages/🦀️rust" }
serde_json = { workspace = true, features = ["float_roundtrip"] }
