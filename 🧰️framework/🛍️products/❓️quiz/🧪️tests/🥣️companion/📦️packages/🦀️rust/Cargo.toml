[package]
workspace = "../../../../../../.."
name = "semio-framework-quiz-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of the quiz product: sheet, validation, scoring, badges, lifecycle, views and challenge laws"
publish = false

[package.metadata.semio]
role = "product"
id = "quiz-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-quiz = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }

[dev-dependencies]
semio-framework-quiz-tests-support = { path = "../../../🧷️companion-support/📦️packages/🦀️rust" }
semio-framework-quiz-schema = { path = "../../../../🧬️schema/📦️packages/🦀️rust", features = ["testkit"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
# 🔮️ Third-party oracle of the handle tables: NFC, NFKC and the composition of pairs.
unicode-normalization = "0.1.25"
