[package]
workspace = "../../../../../../.."
name = "semio-framework-quiz-tests-support"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Shared fixtures of the quiz companion tests: the quiz builders and the learner-lifecycle kit"
publish = false

[package.metadata.semio]
role = "product"
id = "quiz-tests-support"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-quiz = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-quiz-schema = { path = "../../../../🧬️schema/📦️packages/🦀️rust", features = ["testkit"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
