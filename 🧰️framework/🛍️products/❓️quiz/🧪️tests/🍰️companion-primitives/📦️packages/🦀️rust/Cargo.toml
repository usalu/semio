[package]
workspace = "../../../../../../.."
name = "semio-framework-quiz-primitives-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of the quiz primitives: Mersenne Twister, shuffle and presence tags"
publish = false

[package.metadata.semio]
role = "product"
id = "quiz-primitives-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-quiz = { path = "../../../../📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-quiz-schema = { path = "../../../../🧬️schema/📦️packages/🦀️rust", features = ["testkit"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
