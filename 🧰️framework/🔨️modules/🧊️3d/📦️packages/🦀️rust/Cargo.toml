[package]
name = "semio-framework-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generic 3D geometry kernel - native B-Rep kernel, half-edge mesh, and BVH spatial index"

[lints]
workspace = true

[package.metadata.semio]
role = "framework"

[lib]
path = "📦️glue.rs"

# 🚪️ `brep`'s `dep:semio-framework`/`dep:async-trait`/`dep:base64`/`dep:blake3`/`dep:pollster`
# REMOVED (ticket 26/08/12/DISSOLVE-KERNELS-AND-MODULES-INTO-EVENT-SOURCED-ARTIFACTS wave DEDUP):
# they were only used by `⚙️engine`'s deleted `BrepKernel`/`Brep`/`BrepEngineHost` consumer-contract
# duplicate and `🧰️kernel`'s `Brep` implementation, both now solely at
# `semio_s_plugin_stdio::…::subsets::brep::schema::engine`. Repo-wide grep across the WHOLE 🧊️3d
# tree (not just brep/) confirmed zero remaining uses of any of the five. `semio-framework-os-kernel`
# stays — `🕸️topology`'s `EngineRep` still uses it.
[features]
default = ["parallel", "brep"]
parallel = ["dep:rayon", "dep:futures"]
brep = ["dep:semio-framework-os-kernel"]

[dependencies]
futures = { version = "0.3.31", optional = true }
rayon = { version = "1.10.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
semio-framework-number = { workspace = true }
semio-framework-geometry = { workspace = true }
semio-framework-os-kernel = { workspace = true, optional = true }
