[package]
name = "semio-framework-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generic 3D geometry kernel - native B-Rep kernel, half-edge mesh, scene math, and BVH spatial index"

[lints]
workspace = true

[package.metadata.semio]
role = "framework"

[lib]
path = "📦️glue.rs"

[features]
default = ["parallel", "brep"]
parallel = ["dep:rayon", "dep:futures"]
brep = [
    "dep:semio-framework",
    "dep:semio-framework-os-kernel",
    "dep:async-trait",
    "dep:base64",
    "dep:blake3",
    "dep:pollster",
]

[dependencies]
async-trait = { version = "0.1.88", optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3.31", optional = true }
pollster = { version = "0.4.0", optional = true }
rayon = { version = "1.10.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
semio-framework-math = { workspace = true }
semio-framework-geometry = { workspace = true }
semio-framework = { workspace = true, optional = true }
semio-framework-os-kernel = { workspace = true, optional = true }
blake3 = { version = "1", optional = true }
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
[[bench]]
name = "kernel"
path = "benches/kernel.rs"
harness = false
