[package]
workspace = "../../../.."
name = "semio-framework-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generic 3D geometry kernel - half-edge mesh, rigid-body and inertia algebra, and BVH collision queries"

[lints]
workspace = true

[package.metadata.semio]
role = "framework"

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-3d-collision = { path = "../../🧿️collision/📦️packages/🦀️rust" }
semio-framework-3d-rigid = { path = "../../🌀️rigid/📦️packages/🦀️rust" }
semio-framework-3d-mesh-reconstruction = { path = "../../🥽️mesh/🛠️modeling/🔁️reconstruction/📦️packages/🦀️rust" }
semio-framework-3d-mesh-document = { path = "../../🥽️mesh/📄️document/📦️packages/🦀️rust" }
semio-framework-3d-mesh-contract = { path = "../../🥽️mesh/🧬️contract/📦️packages/🦀️rust" }
semio-framework-3d-mesh-clipping = { path = "../../🥽️mesh/🛠️modeling/✂️clipping/📦️packages/🦀️rust" }
semio-framework-3d-brep-vector.workspace = true
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-mesh-engine.workspace = true
# 🧬️ `#[derive(ToValue, FromValue)]`; types here target `#[value(crate = "::semio_framework_value")]`.
semio-framework-value-derive = { path = "../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust" }

[features]
mesh-test-observation = ["semio-framework-3d-mesh-reconstruction/mesh-test-observation"]
