[package]
workspace = "../../../../../../.."
name = "semio-framework-3d-mesh-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[package.metadata.semio]
role = "test"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lib]
path = "../../🦀️.rs"

[dev-dependencies]
semio-framework-3d = { path = "../../../../../📦️packages/🦀️rust", features = ["mesh-test-observation"] }
semio-framework-3d-mesh-reconstruction = { path = "../../../../🛠️modeling/🔁️reconstruction/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-async-macros = { path = "../../../../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-3d-testing-support = { path = "../../../../../🧪️tests/🧰️support/📦️packages/🦀️rust" }
semio-framework-mesh-engine.workspace = true
serde_json.workspace = true
parry3d = "0.17"
semio-framework-trace.workspace = true

[[test]]
name = "mesh-api"
path = "../../../🔬️unit/🦀️.rs"

[[test]]
name = "mesh-modeling"
path = "../../../🔬️modeling/🦀️.rs"

[[test]]
name = "mesh-jobs"
path = "../../../🔬️jobs/🦀️.rs"

[[test]]
name = "mesh-surface"
path = "../../../../🎨️surface/🧪️tests/🔬️unit/🦀️.rs"

[[test]]
name = "mesh-quality"
path = "../../../../🔎️quality/🧪️tests/🔬️unit/🦀️.rs"


