[package]
workspace = "../../../.."
name = "semio-framework-canvas"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Application-neutral Canvas drawing, geometry, labels and rendering ports"

[package.metadata.semio]
role = "framework"
id = "canvas"
cargo-execution = "🧪️execution/🔣️.json"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_canvas"
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-canvas-assets/testkit"]

[dependencies]
semio-framework-canvas-assets = { path = "../../🔌️runtime-assets/📦️packages/🦀️rust" }
semio-framework-canvas-camera = { path = "../../📷️camera/📦️packages/🦀️rust" }
semio-framework-canvas-icons = { path = "../../🪪️icon-codec/📦️packages/🦀️rust" }
semio-framework-canvas-scene = { path = "../../🎬️scene/📦️packages/🦀️rust" }

[dev-dependencies]
geometry = { path = "../../../📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
serde_json = { workspace = true }
