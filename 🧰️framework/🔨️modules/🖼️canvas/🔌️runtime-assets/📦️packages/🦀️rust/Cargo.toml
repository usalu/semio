[package]
workspace = "../../../../.."
name = "semio-framework-canvas-assets"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Canvas runtime asset port: the fonts and the icon pack a host delivers once, before the first icon or label resolves"

[package.metadata.semio]
role = "framework"
id = "canvas-assets"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["dep:semio-framework-test-fixtures"]

[dependencies]
compiler = { path = "../../../../📚️compiler/📦️packages/🦀️rust", package = "semio-framework-compiler" }
semio-framework-test-fixtures = { path = "../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
wasm-bindgen = { workspace = true }

[dev-dependencies]
semio-framework-hash = { workspace = true }
semio-framework-test-fixtures = { path = "../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }

[[test]]
name = "guest_delivery"
path = "../../🧪️tests/📥️guest-delivery/🦀️.rs"

[[test]]
name = "guest_refusal"
path = "../../🧪️tests/🚫️guest-refusal/🦀️.rs"
