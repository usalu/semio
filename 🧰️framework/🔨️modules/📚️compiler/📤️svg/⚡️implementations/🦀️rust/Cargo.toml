[package]
name = "semio-framework-compiler-svg"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "compiler's SVG target: serializes a compiler_math::MathBox into an SVG string (glyph outlines to paths, emoji rasters to embedded PNG images) — a strict subset usvg/vello_svg already parse"


[lints]
workspace = true
[lib]
name = "compiler_svg"
path = "../../../../../../🧰️framework/🔨️modules/📚️compiler/📤️svg/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
compiler_math = { package = "semio-framework-compiler-math", path = "../../../../../../🧰️framework/🔨️modules/📚️compiler/🧮️math/⚡️implementations/🦀️rust" }
compiler_text = { package = "semio-framework-compiler-text", path = "../../../../../../🧰️framework/🔨️modules/📚️compiler/🔤️text/⚡️implementations/🦀️rust" }
base64 = "0.22.1"

[dev-dependencies]
compiler_world = { package = "semio-framework-compiler-world", path = "../../../../../../🧰️framework/🔨️modules/📚️compiler/🌍️world/⚡️implementations/🦀️rust" }
compiler_syntax = { package = "semio-framework-compiler-syntax", path = "../../../../../../🧰️framework/🔨️modules/📚️compiler/📖️syntax/⚡️implementations/🦀️rust" }
