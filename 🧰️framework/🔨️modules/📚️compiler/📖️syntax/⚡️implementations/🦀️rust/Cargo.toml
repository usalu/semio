[package]
name = "semio-framework-compiler-syntax"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "compiler's syntax kernel: the semio math notation lexer, AST, recursive-descent parser, and canonical printer — extends dsl_core's shared token alphabet the same way dsl_grammar does"


[lints]
workspace = true
[lib]
name = "compiler_syntax"
path = "../../../../../../🧰️framework/🔨️modules/📚️compiler/📖️syntax/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
dsl_core = { package = "semio-framework-os-kernel-dsl-core", path = "../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/🫀️core/⚡️implementations/🦀️rust" }

[dev-dependencies]
dsl_grammar = { package = "semio-framework-os-kernel-dsl-grammar", path = "../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/📖️grammar/⚡️implementations/🦀️rust" }
