semio-framework-manifest-media = { path = "../../../🛂️manifest/🎞️media/📦️packages/🦀️rust" }
semio-framework-manifest-view-model = { path = "../../../🛂️manifest/🖼️view-model/📦️packages/🦀️rust" }
pack = { workspace = true }
