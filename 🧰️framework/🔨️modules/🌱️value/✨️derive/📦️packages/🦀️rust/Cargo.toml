[package]
workspace = "../../../../.."
name = "semio-framework-value-derive"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Proc-macros for #[derive(ToValue, FromValue)] with #[value(...)] container/field attributes"

[package.metadata.semio]
role = "framework"
id = "value-derive"

[lints]
workspace = true

[lib]
name = "semio_framework_value_derive"
proc-macro = true
path = "../../🦀️.rs"

[dependencies]
semio-framework-hash = { workspace = true }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
semio-framework-value = { path = "../../../📦️packages/🦀️rust" }
# 🔬 Third-party oracle for the `flatten` integration test only (CLAUDE.md's sanctioned pattern:
# external libs allowed in dev-dependencies to validate our own implementation) — proves this
# derive's `#[value(flatten)]` wire shape is byte-identical to `#[serde(flatten)]`'s, never reached
# by production code.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semio-framework-dsl-record-derive = { path = "../../../../🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../🗣️dsl/🧬️schema/📦️packages/🦀️rust" }

# 🗺️ Cargo derives an integration test's crate name from its file stem, and a crate name may only
# contain ASCII — so the repo's emoji filename convention needs an explicit name/path pair here.
[[test]]
name = "deny_unknown_fields_enums"
path = "../../🧪️tests/🛡️deny-unknown-fields-enums/🦀️.rs"

[[test]]
name = "flatten_with_skip"
path = "../../🧪️tests/🪗️flatten-with-skip/🦀️.rs"

[[test]]
name = "newtype_transparent"
path = "../../🧪️tests/🆔️newtype-transparent/🦀️.rs"

[[test]]
name = "variant_field_casing"
path = "../../🧪️tests/🐫️variant-field-casing/🦀️.rs"

[[test]]
name = "typed_path"
path = "../../🧪️tests/🧭️typed-path/🦀️.rs"

[[test]]
name = "neutral_owner"
path = "../../../🧪️tests/🧩️neutral-owner/🦀️.rs"

[[test]]
name = "owned_json"
path = "../../🧪️tests/📚️owned-json/🦀️.rs"
