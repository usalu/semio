[package]
workspace = "../../../../../.."
name = "semio-framework-value-derive-expansion"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Token expansion of the value derives: the ToValue and FromValue codecs with their attributes, typed paths and controlled output, the canonical JSON tree and funded native receiving."

[package.metadata.semio]
role = "framework"
id = "value-derive-expansion"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_value_derive_expansion"
path = "../../🦀️.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
serde_json = { workspace = true }
