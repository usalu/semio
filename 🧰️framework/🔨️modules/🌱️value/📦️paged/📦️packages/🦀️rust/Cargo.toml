[package]
workspace = "../../../../.."
name = "semio-framework-value-paged"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Schema-preserving paged text, sequence and insertion-ordered map owners with their retained clone cursors."

[package.metadata.semio]
role = "framework"
id = "value-paged"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_value_paged"
path = "🦀️.rs"

[dependencies]
semio-framework-value-retirement-contract = { path = "../../../♻️retirement/🧬️contract/📦️packages/🦀️rust" }
semio-framework-value-retained-map = { path = "../../../🧬️retained-clone/🗺️ordered-map/📦️packages/🦀️rust" }
semio-framework-value-retained-clone = { path = "../../../🧬️retained-clone/🧬️contract/📦️packages/🦀️rust" }
semio-framework-value-intrinsic = { path = "../../../🌳️intrinsic/📦️packages/🦀️rust" }
semio-framework-value-shared-utf8 = { path = "../../../📝️shared-utf8/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework-value-native-encoding = { path = "../../../🛫️encode/📦️packages/🦀️rust" }
semio-framework-value-original-slot = { path = "../../../🧬️retained-clone/📦️original-slot/📦️packages/🦀️rust" }
semio-framework-value-factory = { path = "../../../♻️retirement/🏭️factory/📦️packages/🦀️rust" }
