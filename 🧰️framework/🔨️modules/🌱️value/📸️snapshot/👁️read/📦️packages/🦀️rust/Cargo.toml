[package]
workspace = "../../../../../.."
name = "semio-framework-value-snapshot-read"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "value-snapshot-read"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["dep:semio-framework-trace", "dep:semio-framework-value-testing-presence-retirement"]

[dependencies]
semio-framework-value = { path = "../../../../📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../../🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework-value-testing-presence-retirement = { path = "../../../../🧪️testing/👥️presence-retirement/📦️packages/🦀️rust", optional = true }
semio-framework-trace = { path = "../../../../../⏱️trace/📦️packages/🦀️rust", optional = true }

[dev-dependencies]
semio-framework-trace = { path = "../../../../../⏱️trace/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
serde_json = "1.0.140"

semio-framework-value = { path="../../../../📦️packages/🦀️rust", features=["testkit"] }
semio-framework-value-testing-presence-retirement = { path = "../../../../🧪️testing/👥️presence-retirement/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-os-io = { path = "../../../../../../🛍️products/💻️os/🔨️modules/🚪️io/📦️packages/🦀️rust" }
