syntax = "proto3";
package semio.framework.value;
enum NullValue { NULL_VALUE = 0; }
message Number { oneof literal { uint64 uint_value = 1; sint64 int_value = 2; fixed64 float_bits = 3; } }
message DslArray { repeated DslValue values = 1; }
message DslEntry { string key = 1; DslValue value = 2; }
message DslObject { repeated DslEntry fields = 1; }
message DslValue {
  oneof value {
    NullValue null_value = 1;
    bool bool_value = 2;
    Number number_value = 3;
    string string_value = 4;
    DslArray array_value = 5;
    DslObject object_value = 6;
    bytes bytes_value = 7;
  }
}

message Binary64Word { fixed64 bits = 1; }
enum ValueTypeScalar { BOOLEAN = 0; INTEGER = 1; DECIMAL = 2; TEXT = 3; ANY = 4; }
message ValueType { oneof kind { ValueTypeScalar scalar = 1; ValueType list = 2; string schema = 3; } }
