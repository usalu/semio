[package]
workspace = "../../../../../.."
name = "semio-framework-value-edit"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Indexed and named collection edit plans, key indexes, persistent roots, collection commits and the bounded heap sort that orders them."

[package.metadata.semio]
role = "framework"
id = "value-edit"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_value_edit"
path = "🦀️.rs"

[dependencies]
semio-framework-value-retirement-contract = { path = "../../../../♻️retirement/🧬️contract/📦️packages/🦀️rust" }
semio-framework-value-original-vector = { path = "../../../../♻️retirement/📋️original-vector/📦️packages/🦀️rust" }
semio-framework-value-sort = { path = "../../../../📶️sort/📦️packages/🦀️rust" }
semio-framework-value-control-contract = { path = "../../../../🎟️control/🧬️contract/📦️packages/🦀️rust" }
semio-framework-value-derive = { path = "../../../../✨️derive/📦️packages/🦀️rust" }
semio-framework-value-intrinsic = { path = "../../../../🌳️intrinsic/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../../🛬️decode/🧳️owned/📦️packages/🦀️rust" }
