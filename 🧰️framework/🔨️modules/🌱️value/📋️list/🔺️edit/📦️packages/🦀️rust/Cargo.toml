[features]
testkit = []

[dev-dependencies]
semio-framework-value-edit = { path = ".", features = ["testkit"] }
semio-framework-value = { path = "../../../../📦️packages/🦀️rust" }
semio-framework-value-native-receiving-original = { path = "../../../../🛬️decode/🧳️owned/🧳️original/📦️packages/🦀️rust" }
