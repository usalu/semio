[package]
workspace = "../../../.."
name = "semio-framework-value"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Neutral typed value conversion, ordered ownership, bounded retained cloning and explicit retirement."

[package.metadata.semio]
role = "framework"
id = "value"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_value"
path = "🦀️.rs"

[features]
testkit = []

[dependencies]
semio-framework-value-retained-map = { path="../../🧬️retained-clone/🗺️ordered-map/📦️packages/🦀️rust" }
semio-framework-value-retained-clone = { path="../../🧬️retained-clone/🧬️contract/📦️packages/🦀️rust" }
semio-framework-value-intrinsic = { path="../../🌳️intrinsic/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework-value-native-encoding = { path="../../🛫️encode/📦️packages/🦀️rust" }
semio-framework-value-shared-issuance = { path="../../♻️retirement/🔗️arc-custody/🔒️sealed/📦️packages/🦀️rust" }
semio-framework-value-original-slot = { path="../../🧬️retained-clone/📦️original-slot/📦️packages/🦀️rust" }
semio-framework-value-factory = { path="../../♻️retirement/🏭️factory/📦️packages/🦀️rust" }
semio-framework-value-retirement = { path="../../♻️retirement/📦️packages/🦀️rust" }
semio-framework-value-control-contract = { path="../../🎟️control/🧬️contract/📦️packages/🦀️rust" }
semio-framework-value-derive = { path = "../../✨️derive/📦️packages/🦀️rust" }
semio-framework-value-persistent = { path = "../../📋️list/🔗️persistent/📦️packages/🦀️rust" }
semio-framework-value-snapshot-projection = { path = "../../📽️projection/📦️packages/🦀️rust" }
semio-framework-io-base64 = { path = "../../../🚪️io/🔤️base64/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"


[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-value-testing-allocator = { path = "../../🧪️testing/💾️allocator/📦️packages/🦀️rust" }
