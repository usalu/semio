[package]
workspace = "../../../../.."
name = "semio-framework-replication-causal"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Causal envelopes: MutationEnvelope, ArtifactDiff, InverseMutation, frontiers, the mutation dag and their binary and text codecs."

[package.metadata.semio]
role = "framework"
id = "replication-causal"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-replication-codec = { path = "../../../⚙️codec/📦️packages/🦀️rust" }
semio-framework-replication-edit = { path = "../../../🎮️mutation/✏️edit/📦️packages/🦀️rust" }
semio-framework-replication-error = { path = "../../../⚠️error/📦️packages/🦀️rust" }
semio-framework-replication-ids = { path = "../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-replication-mutation = { path = "../../../🎮️mutation/📦️packages/🦀️rust" }
semio-framework-replication-wire-core = { path = "../../../🧾️wire/📦️packages/🦀️rust" }
semio-framework-value.workspace = true
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
semio-framework-mutation-diff = { path = "../../../🎮️mutation/🔺️diff/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
serde_json = "1.0.140"
