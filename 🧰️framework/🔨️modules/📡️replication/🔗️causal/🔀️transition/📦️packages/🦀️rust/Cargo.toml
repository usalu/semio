[package]
workspace = "../../../../../.."
name = "semio-framework-replication-history"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "History transitions: fold, drafts, checkpoints, alternatives, supersession and the transition codec."

[package.metadata.semio]
role = "framework"
id = "replication-history"

[package.metadata.semio.rust-source-boundary]
