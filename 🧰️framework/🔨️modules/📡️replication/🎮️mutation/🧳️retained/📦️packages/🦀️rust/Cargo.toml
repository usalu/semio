[package]
workspace = "../../../../../.."
name = "semio-framework-replication-retained"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Retained mutation: required granular semantic preparation, field and record changes, row patches, diagnostics and typed diffs under central grant admission."

[package.metadata.semio]
role = "framework"
id = "replication-retained"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[[test]]
name = "original-diagnostic"
path = "../../⚠️diagnostic/🧪️tests/owning.rs"

[dependencies]
semio-framework-replication-retained-key = { path = "../../🔎️key/📦️packages/🦀️rust" }
semio-framework-value-factory = { path = "../../../../../🌱️value/♻️retirement/🏭️factory/📦️packages/🦀️rust" }
semio-framework-mutation-diff = { path = "../../../🔺️diff/📦️packages/🦀️rust" }
semio-framework-replication-retained-field = { path = "../../🪡️field/📦️packages/🦀️rust" }
semio-framework-replication-mutation = { path = "../../../📦️packages/🦀️rust" }
semio-framework-replication-mutation-messages = { path = "../../../📨️messages/📦️packages/🦀️rust" }
semio-framework-value.workspace = true
semio-framework-value-snapshot-projection.workspace = true
semio-framework-value-persistent.workspace = true
semio-framework-value-native-owned.workspace = true
semio-framework-diagnostic = { path = "../../../../../⚠️diagnostic/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-value-derive = { path = "../../../../../🌱️value/✨️derive/📦️packages/🦀️rust" }
serde = { version = "1", features = ["derive"] }
semio-framework-mutation-diff = { path = "../../../🔺️diff/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-test-fixtures = { path = "../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
semio-framework-replication-ids = { path = "../../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-trace = { path = "../../../../../⏱️trace/📦️packages/🦀️rust" }
serde_json = "1.0.140"
semio-framework-value-testing-effect-bank = { path = "../../../../../🌱️value/🧪️testing/📥️admission/🎟️effect/📦️packages/🦀️rust" }
semio-framework-value-testing-allocator = { path = "../../../../../🌱️value/🧪️testing/💾️allocator/📦️packages/🦀️rust" }
semio-framework-value-clone-source-testing = { path = "../../../../../🌱️value/🧬️retained-clone/🔗️source/🧪️testing/📦️packages/🦀️rust" }
