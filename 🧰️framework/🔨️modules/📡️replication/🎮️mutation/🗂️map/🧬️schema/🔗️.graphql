# 🗂️ Shared map changes with original-base presence requirements.
# import DslValue from "🧰️framework/🔨️modules/🌱️value/🧬️schema/🔗️.graphql"
enum MapPresence { ANY PRESENT ABSENT NEVER }
type MapSet { value: DslValue }
type MapRemove { kind: String! }
type MapReject { kind: String! }
union MapEntryOperation = MapSet | MapRemove | MapReject
type MapEntryDelta { precondition: MapPresence!, operation: MapEntryOperation! }
scalar MapDeltaEntries
type MapDelta { entries: MapDeltaEntries! }
