syntax = "proto3";
package semio.framework.replication.mutation.map;
import "../../../../🌱️value/🧬️schema/🛰️.proto";
enum MapPresence { ANY = 0; PRESENT = 1; ABSENT = 2; NEVER = 3; }
message MapRemove {}
message MapReject {}
message MapEntryOperation {
  oneof operation {
    semio.framework.value.DslValue set = 1;
    MapRemove remove = 2;
    MapReject reject = 3;
  }
}
message MapEntryDelta { MapPresence precondition = 1; MapEntryOperation operation = 2; }
message MapDelta { map<string, MapEntryDelta> entries = 1; }
