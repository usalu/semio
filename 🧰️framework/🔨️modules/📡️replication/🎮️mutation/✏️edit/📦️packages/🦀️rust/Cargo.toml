[package]
workspace = "../../../../../.."
name = "semio-framework-replication-edit"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The recorded Edit: transaction reference, mutation meta and origin, canonical field cursors, transaction admission and the canonical edit seal."

[package.metadata.semio]
role = "framework"
id = "replication-edit"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-hash = { path = "../../../../../🔏️hash/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-replication-crypto = { path = "../../../../🔐️crypto/📦️packages/🦀️rust" }
semio-framework-replication-ids = { path = "../../../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-replication-mutation = { path = "../../../📦️packages/🦀️rust" }
semio-framework-replication-wire-core = { path = "../../../../🧾️wire/📦️packages/🦀️rust" }
semio-framework-value.workspace = true
semio-framework-value-persistent.workspace = true
semio-framework-value-native-owned.workspace = true

[dev-dependencies]
blake3 = "1.8.2"
semio-framework-trace = { path = "../../../../../⏱️trace/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
