[package]
workspace = "../../../../.."
name = "semio-framework-replication-format"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The .spr record file format: header, frames, commit chain, writer, recovery, retained verification and slice helpers."

[package.metadata.semio]
role = "framework"
id = "replication-format"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
deflate = ["semio-framework-replication-codec/deflate"]

[dependencies]
semio-framework-value = { path = "../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../🔏️hash/📦️packages/🦀️rust" }
semio-framework-pack-error = { path = "../../../../🎒️pack/⚠️error/📦️packages/🦀️rust" }
semio-framework-pack-source = { path = "../../../../🎒️pack/🚰️source/📦️packages/🦀️rust" }
semio-framework-replication-codec = { path = "../../../⚙️codec/📦️packages/🦀️rust" }
semio-framework-replication-crypto = { path = "../../../🔐️crypto/📦️packages/🦀️rust" }
semio-framework-replication-error = { path = "../../../⚠️error/📦️packages/🦀️rust" }
semio-framework-replication-wire-core = { path = "../../../🧾️wire/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-trace = { path = "../../../../⏱️trace/📦️packages/🦀️rust" }
blake3 = "1.8.2"
semio-framework-async-macros = { path = "../../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
serde_json = "1.0.140"
