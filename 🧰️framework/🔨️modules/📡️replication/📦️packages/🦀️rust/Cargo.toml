[package]
workspace = "../../../.."
name = "semio-framework-replication"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Product-neutral replication contract: lane-tagged client/server frames, causal mutation envelopes, the mutation trait family, conflict vocabulary, the .spr record format and the pack codec primitives beneath them. Spoken identically by the optimistic local replica and the authoritative server; depends on neither."

[package.metadata.semio]
role = "framework"
id = "replication"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "protocol"
path = "🦀️.rs"

[[test]]
name = "paged_seal_digest"
path = "../../🚪️io/📝️text/🧵️canonical/🔏️seal/🧪️tests/📄️paged-digest/🦀️.rs"

[features]
# 🗜️ Deflate segment compression (`CodecId(1)`); off by default so the pure contract stays dependency-light.
deflate = ["dep:semio-framework-deflate", "semio-framework-replication-codec/deflate", "semio-framework-replication-format/deflate"]

[dependencies]
semio-framework-deflate = { path = "../../../🗜️deflate/📦️packages/🦀️rust", optional = true }
semio-framework-io-base64 = { path = "../../../🚪️io/🔤️base64/📦️packages/🦀️rust" }
semio-framework-mutation-diff = { path = "../../🎮️mutation/🔺️diff/📦️packages/🦀️rust" }
semio-framework-pack-error = { path = "../../../🎒️pack/⚠️error/📦️packages/🦀️rust" }
semio-framework-replication-causal = { path = "../../🔗️causal/📦️packages/🦀️rust" }
semio-framework-replication-codec = { path = "../../⚙️codec/📦️packages/🦀️rust" }
semio-framework-replication-command-ingress = { path = "../../📡️wire/🎮️command/📥️ingress/📦️packages/🦀️rust" }
semio-framework-replication-conflict = { path = "../../⚔️conflict/📦️packages/🦀️rust" }
semio-framework-replication-crypto = { path = "../../🔐️crypto/📦️packages/🦀️rust" }
semio-framework-replication-edit = { path = "../../🎮️mutation/✏️edit/📦️packages/🦀️rust" }
semio-framework-replication-error = { path = "../../⚠️error/📦️packages/🦀️rust" }
semio-framework-replication-format = { path = "../../📐️format/📦️packages/🦀️rust" }
semio-framework-replication-frames = { path = "../../📡️wire/📦️packages/🦀️rust" }
semio-framework-replication-history = { path = "../../🔗️causal/🔀️transition/📦️packages/🦀️rust" }
semio-framework-replication-history-index = { path = "../../🔗️causal/🔀️transition/🔁️fold/🗂️index/📦️packages/🦀️rust" }
semio-framework-replication-ids = { path = "../../🆔️ids/📦️packages/🦀️rust" }
semio-framework-replication-interaction = { path = "../../📡️wire/🕹️interaction/📦️packages/🦀️rust" }
semio-framework-replication-local-interaction = { path = "../../📡️wire/🏠️local-interaction/📦️packages/🦀️rust" }
semio-framework-replication-mutation = { path = "../../🎮️mutation/📦️packages/🦀️rust" }
semio-framework-replication-mutation-messages = { path = "../../🎮️mutation/📨️messages/📦️packages/🦀️rust" }
semio-framework-replication-presence = { path = "../../📡️wire/👥️presence/📦️packages/🦀️rust" }
semio-framework-replication-wire-core = { path = "../../🧾️wire/📦️packages/🦀️rust" }
semio-framework-value.workspace = true

[dev-dependencies]
semio-framework-hash = { path = "../../../🔏️hash/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-schema-registry = { path = "../../../🧬️schema/📇️registry/📦️packages/🦀️rust" }
serde_json = "1.0.140"

[[test]]
name = "retained_diff_sequence"
path = "../../🎮️mutation/🧳️retained/🔺️diff/🪢️sequence/🧪️tests/🦀️.rs"
