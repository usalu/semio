[package]
workspace = "../../../../.."
name = "semio-framework-replication-codec"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pack-level byte codec primitives under the replication contract: byte spans and ranges, chunk and codec ids, history read limits, owned operation bytes and the OpBinary and OpText trait family."

[package.metadata.semio]
role = "framework"
id = "replication-codec"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
deflate = ["dep:semio-framework-deflate"]

[dependencies]
semio-framework-deflate = { path = "../../../../🗜️deflate/📦️packages/🦀️rust", optional = true }
semio-framework-diagnostic = { path = "../../../../⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-io-base64 = { path = "../../../../🚪️io/🔤️base64/📦️packages/🦀️rust" }
semio-framework-pack-error = { path = "../../../../🎒️pack/⚠️error/📦️packages/🦀️rust" }
semio-framework-replication-error = { path = "../../../⚠️error/📦️packages/🦀️rust" }
semio-framework-value.workspace = true
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
serde_json = "1.0.140"
