[package]
workspace = "../../../../../../.."
name = "semio-framework-replication-command-ingress"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Paged command ingress: fixed command pages, command envelopes, batches and the resumable batch driver."

[package.metadata.semio]
role = "framework"
id = "replication-command-ingress"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-diagnostic = { path = "../../../../../../⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-trace = { path = "../../../../../../⏱️trace/📦️packages/🦀️rust" }
semio-framework-value.workspace = true
semio-framework-value-derive = { path = "../../../../../../🌱️value/✨️derive/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
