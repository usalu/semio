[package]
name = "semio-framework-hash"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Content-addressing and Merkle hash utilities for the framework kernel"

[package.metadata.semio]
role = "framework"
id = "hash"

[lints]
workspace = true
[lib]
path = "📦️lib.rs"

[dependencies]
blake3 = "1.8.2"

# ==== 🧪️ TEMPORARY VERIFICATION OVERLAY — delete this section + nested target/Cargo.lock at
# registrar handoff (see TEMPLATE.md §3 "chicken-and-egg" verification recipe). ====
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
