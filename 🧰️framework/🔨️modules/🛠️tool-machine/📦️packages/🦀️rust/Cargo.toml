[package]
workspace = "../../../.."
name = "semio-framework-tool-machine"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Domain-neutral, pure tool machines: ToolYield effects of a machine statechart folded by ToolMachineRunner into at most one open ToolTransaction that commits one edit stamped with a TransactionRef or aborts with zero trace. Ticket 26/09/30/NON-DESTRUCTIVE-HISTORY-EDITING lane W1-C."

[package.metadata.semio]
role = "framework"
id = "tool-machine"

[lints]
workspace = true

[lib]
name = "semio_framework_tool_machine"
path = "🦀️.rs"

[dependencies]
# 🎰️ `statechart!` expansions name the kernel `machine::…`, so the dependency carries that name.
machine = { path = "../../../🔄️machine/📦️packages/🦀️rust", package = "semio-framework-machine" }
semio-framework-replication = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-value = { workspace = true }

[dev-dependencies]
# 🔏️ Third-party oracle for the transaction id minting pinned by the transaction-law fixture.
blake3 = "1.8.2"
serde_json = { workspace = true }
