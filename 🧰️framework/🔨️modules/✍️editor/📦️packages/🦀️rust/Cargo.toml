[package]
workspace = "../../../.."
name = "semio-framework-editor"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Canvas-agnostic editor state machine (selection, transforms, undo) for the framework"

[package.metadata.semio]
role = "framework"
id = "editor"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true }
semio-framework-pack = { path = "../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
ui_styling = { path = "../../../🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
canvas = { path = "../../../🖼️canvas/📦️packages/🦀️rust", package = "semio-framework-canvas" }
# 🧬️ The value derive resolves its default types through the General Value owner.
semio-framework-value-derive = { path = "../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust" }
serde = { workspace = true }
serde_json = { workspace = true }

# 🌉️ Browser-only `EditorSession` canvas bridge (`🦀️.rs`'s `Wasm` region). Excluded from
# `wasm32-wasip2` because `target_arch = "wasm32"` is TRUE for the WASI component target too — the
# wasip2 guest never attaches an `HtmlCanvasElement`.
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }

[dev-dependencies]
canvas = { path = "../../../🖼️canvas/📦️packages/🦀️rust", package = "semio-framework-canvas", features = ["testkit"] }
semio-framework-pack = { path = "../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../🗣️dsl/🧬️schema/📦️packages/🦀️rust" }

[[test]]
name = "canonical-editor-scene"
path = "../../🧬️scene/🧪️tests/🦀️.rs"
