[package]
workspace = "../../../../.."
name = "semio-framework-io-codec"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Bounded domain-neutral payload, resource and lossless codec contracts"

[package.metadata.semio]
role = "framework"
id = "io-codec"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_io_codec"
path = "🦀️.rs"

[dependencies]
semio-framework-artifact-reference.workspace = true
semio-framework-io-schema = { path = "../../../🧬️schema/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-async-macros.workspace = true
serde_json = "1.0.140"
syn = { version = "2", features = ["full"] }
