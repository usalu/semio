[package]
name = "semio-framework-schema-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Proc-macros for #[derive(ArtifactSchema)] with #[state]/#[artifact_schema] field annotations"

[lints]
workspace = true

[lib]
name = "semio_framework_schema_derive"
proc-macro = true
path = "🦀️.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
