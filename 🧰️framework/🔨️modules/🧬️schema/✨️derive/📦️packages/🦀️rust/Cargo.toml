[package]
workspace = "../../../../.."
name = "semio-framework-schema-derive"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Proc-macros for #[derive(ArtifactSchema)] with #[state]/#[artifact_schema] field annotations"

[package.metadata.semio]
role = "framework"
id = "schema-derive"
cargo-execution = "🧪️execution/🔣️.json"

[lints]
workspace = true

[lib]
name = "semio_framework_schema_derive"
proc-macro = true
path = "../../🦀️.rs"

[dependencies]
semio-framework-schema-composition = { path = "../../../🧩️composition/📦️packages/🦀️rust" }
semio-framework-schema-state = { path = "../../../📶️state/📦️packages/🦀️rust" }
# 🧷️ `visit`/`visit-mut` pinned: `wasm-bindgen-macro-support` requests them in some hub components, and one host `syn` feature set keeps every component on the same proc-macro units.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
