[package]
name = "semio-framework-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Schema derivation and validation for the command kernel"
build = "build.rs"

[package.metadata.semio]
role = "framework"
id = "schema"

[lints]
workspace = true
[lib]
path = "📦️lib.rs"

[dependencies]
jsonschema = "0.29.1"
schemars = "0.8.22"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# ==== 🧪️ TEMPORARY VERIFICATION OVERLAY — delete this section + nested target/Cargo.lock at
# registrar handoff (see TEMPLATE.md §3 "chicken-and-egg" verification recipe). ====
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
