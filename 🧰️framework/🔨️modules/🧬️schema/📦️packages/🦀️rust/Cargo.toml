[package]
name = "semio-framework-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Schema derivation and validation for the command kernel"
build = "build.rs"

[package.metadata.semio]
role = "framework"
id = "schema"

[lints]
workspace = true
[lib]
path = "📦️glue.rs"

[features]
default = []
# Artifact CatalogIntegration still needs a cycle-free registration path (A3 parked plugin deps).
catalog-integration = []

[dependencies]
jsonschema = "0.29.1"
schemars = "0.8.22"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

semio-framework-os-kernel = { path = "../../../../🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-schema-derive = { path = "../../✨️derive/📦️packages/🦀️rust", package = "semio-framework-schema-derive" }
