[package]
name = "semio-framework-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Schema derivation and validation for the command kernel"
build = "build.rs"

[package.metadata.semio]
role = "framework"
id = "schema"

[lints]
workspace = true
[lib]
path = "📦️glue.rs"

[dependencies]
jsonschema = "0.29.1"
schemars = "0.8.22"
