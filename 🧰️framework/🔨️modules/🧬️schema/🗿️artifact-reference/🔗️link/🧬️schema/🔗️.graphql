# import ArtifactRef from "🧰️framework/🔨️modules/🚪️io/🧬️schema/🔗️.graphql"
# import BlobRef from "🧰️framework/🔨️modules/🧬️schema/🗿️artifact-reference/📦️blob/🧬️schema/🔗️.graphql"
enum LinkPinKind { head checkpoint snapshot }
type LinkHeadPin { kind: LinkPinKind! }
type LinkCheckpointPin { kind: LinkPinKind! id: String! }
type LinkSnapshotPin { kind: LinkPinKind! blob: BlobRef! }
union LinkPin = LinkHeadPin | LinkCheckpointPin | LinkSnapshotPin
type ArtifactLink { target: ArtifactRef! pin: LinkPin! role: String! }
