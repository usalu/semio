[package]
name = "semio-framework-ui-backend-d3d12"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Hand-written Direct3D 12 backend for Windows"

[package.metadata.semio]
role = "framework"
id = "d3d12-backend"

[lints]
workspace = true

[lib]
path = "📦️glue.rs"

[features]
default = []
backend-testing = ["ui_render/backend-testing"]

[dependencies]
ui_render = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-ui-render" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
