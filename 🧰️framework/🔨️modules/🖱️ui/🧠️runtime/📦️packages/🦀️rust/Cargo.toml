[package]
workspace = "../../../../.."
name = "semio-framework-ui-runtime"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Headless UI runtime: typed entities with mutation leasing, actual-read dependency tracking, and keyed reconciliation into transactional UiPatch revisions"

[package.metadata.semio]
role = "framework"
id = "ui-runtime"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../../🌱️value/📦️packages/🦀️rust" }
ui_scene = { path = "../../../🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }
semio-framework-job = { path = "../../../../🧵️job/📦️packages/🦀️rust" }
ui_contract = { path = "../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }

[dev-dependencies]
semio-framework-job = { path = "../../../../🧵️job/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-trace = { workspace = true }
# 🧪️ `TransactionPatch`'s test-only `Serialize` impl and the fixture-oracle tests diff published
# patches/snapshots against `serde_json` directly — ticket 26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-
# FOR-S-PLUGINS-AND-ARTIFACTS. No non-test symbol in this crate names `serde` any more.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140" }

[[test]]
name = "native_resource_custody"
path = "../../🎭️present/📦️resources/🧪️tests/🦀️.rs"
