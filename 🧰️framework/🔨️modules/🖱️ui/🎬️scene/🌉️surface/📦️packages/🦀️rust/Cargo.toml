[package]
workspace = "../../../../../.."
name = "semio-ui-scene-surface"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The encode/decode bridge between a typed SceneDoc payload and ui_contract's SurfaceProps.doc — wasm-safe"

[package.metadata.semio]
role = "framework"
id = "ui-scene-surface"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-ui-scene-doc = { path = "../../../🎬️scenes/📜️doc/📦️packages/🦀️rust" }
semio-ui-scene-pack = { path = "../../../📦️pack/📦️packages/🦀️rust" }
ui_contract = { path = "../../../../🧬️contract/📦️packages/🦀️rust", package = "semio-ui-contract" }

[dev-dependencies]
semio-ui-scene-plane = { path = "../../../🎬️scenes/🖼️plane/📦️packages/🦀️rust" }
semio-ui-scene-views = { path = "../../../🎬️scenes/📄️views/📦️packages/🦀️rust" }
semio-ui-scene-world3d = { path = "../../../🎬️scenes/🌍️world3d/📦️packages/🦀️rust" }
serde_json = { version = "1.0.140" }
