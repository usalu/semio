[package]
workspace = "../../../../../.."
name = "semio-ui-scene-modelling"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Domain-neutral world-3d modelling primitives: annotations, scalar fields, pick filter, section plane and highlight tokens — wasm-safe"

[package.metadata.semio]
role = "framework"
id = "ui-scene-modelling"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
protocol = { path = "../../../../../📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-framework-pack-json = { path = "../../../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { workspace = true }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
semio-framework-geometry = { path = "../../../../../📐️geometry/📦️packages/🦀️rust" }
semio-ui-scene-algebra = { path = "../../../📐️math/🧮️algebra/📦️packages/🦀️rust" }
semio-ui-scene-camera = { path = "../../../📐️math/🎥️camera/📦️packages/🦀️rust", features = ["testkit"] }
semio-ui-scene-mesh = { path = "../../../📐️math/🕸️mesh/📦️packages/🦀️rust", features = ["testkit"] }
semio-ui-viewport = { path = "../../../../🪟️viewport/📦️packages/🦀️rust" }
serde_json = { version = "1.0.140" }
