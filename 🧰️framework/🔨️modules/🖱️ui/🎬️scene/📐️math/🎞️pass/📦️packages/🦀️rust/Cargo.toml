[package]
workspace = "../../../../../../.."
name = "semio-framework-ui-scene-pass"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Scene draw descriptors, materials, lighting, shadow pass, line and grid draws and frustum culling — wasm-safe"

[package.metadata.semio]
role = "framework"
id = "ui-scene-pass"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-geometry = { path = "../../../../../../📐️geometry/📦️packages/🦀️rust" }
semio-framework-ui-scene-algebra = { path = "../../../🧮️algebra/📦️packages/🦀️rust" }
semio-framework-ui-scene-mesh = { path = "../../../🕸️mesh/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
semio-framework-ui-scene-camera = { path = "../../../🎥️camera/📦️packages/🦀️rust", features = ["testkit"] }
