[package]
workspace = "../../../../.."
name = "semio-ui-scene"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Thin facade over the ui-scene producer crates: product scene payloads (World3dScene/TableScene/...), their pack-encoded SurfaceDoc bridge and the generic 3D scene math, re-exported name for name — wasm-safe"

[package.metadata.semio]
role = "framework"
id = "ui-scene"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[dependencies]
semio-ui-scene-algebra = { path = "../../📐️math/🧮️algebra/📦️packages/🦀️rust" }
semio-ui-scene-camera = { path = "../../📐️math/🎥️camera/📦️packages/🦀️rust" }
semio-ui-scene-doc = { path = "../../🎬️scenes/📜️doc/📦️packages/🦀️rust" }
semio-ui-scene-mesh = { path = "../../📐️math/🕸️mesh/📦️packages/🦀️rust" }
semio-ui-scene-modelling = { path = "../../📏️world3d-modelling/📦️packages/🦀️rust" }
semio-ui-scene-node-graph = { path = "../../🎬️scenes/🕸️node-graph/📦️packages/🦀️rust" }
semio-ui-scene-pack = { path = "../../📦️pack/📦️packages/🦀️rust" }
semio-ui-scene-pass = { path = "../../📐️math/🎞️pass/📦️packages/🦀️rust" }
semio-ui-scene-picking = { path = "../../📐️math/🎯️picking/📦️packages/🦀️rust" }
semio-ui-scene-plane = { path = "../../🎬️scenes/🖼️plane/📦️packages/🦀️rust" }
semio-ui-scene-surface = { path = "../../🌉️surface/📦️packages/🦀️rust" }
semio-ui-scene-views = { path = "../../🎬️scenes/📄️views/📦️packages/🦀️rust" }
semio-ui-scene-world3d = { path = "../../🎬️scenes/🌍️world3d/📦️packages/🦀️rust" }

[dev-dependencies]
serde_json = { version = "1.0.140" }
