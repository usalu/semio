[package]
name = "semio-framework-ui-scene"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Product scene payloads (World3dScene/TableScene/...) and their pack-encoded SurfaceDoc bridge, plus generic 3D scene math — wasm-safe, depends on ui-contract and serde only"

[package.metadata.semio]
role = "framework"
id = "ui-scene"

[lints]
workspace = true

[lib]
path = "📦️glue.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
ui_contract = { path = "../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
# 🚧️ `protocol` (not `os-kernel`) deliberately: this crate's own "wasm-safe, minimal deps" boundary
# (see the module docstring) forbids the OS kernel, but `ToValue`/`FromValue` are natively owned by
# `semio-framework-replication` ("depends on neither" — its own description) and `os-kernel` only
# re-exports them. `#[derive(ToValue, FromValue)]` hardcodes its expansion at `::semio_framework_os_kernel::…`
# (see the fan-out playbook), which is wrong for a crate that must never depend on the OS kernel, so
# the `NodeGraph*Record` impls below are hand-written against `protocol::value::` directly instead of
# derived. Ticket `26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS`.
protocol = { path = "../../../../📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }

[dependencies.semio-framework-geometry]
path = "../../../../📐️geometry/📦️packages/🦀️rust"
package = "semio-framework-geometry"

[dev-dependencies]
serde_json = { version = "1.0.140" }
