[package]
name = "semio-framework-ui-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Platform layer: window/event-loop hosting, platform event normalization, and the per-target concrete graphics backend alias"

[package.metadata.semio]
role = "framework"
id = "ui-host"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[dependencies]
ui_render = { path = "../../../🖌️render/📦️packages/🦀️rust", package = "semio-framework-ui-render" }
ui_contract = { path = "../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
raw-window-handle = "0.6"

[dev-dependencies]
serde_json = { workspace = true }

# 🪟️ Native windowing. Absent on wasm, where the browser canvas host takes over.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
arboard = "3"
rfd = "0.15.4"
semio-framework-job = { path = "../../../../🧵️job/📦️packages/🦀️rust" }

[target.'cfg(target_os = "macos")'.dependencies]
backend_metal = { path = "../../../🖌️render/🎯️targets/🍎️metal/📦️packages/🦀️rust", package = "semio-framework-ui-backend-metal" }

[target.'cfg(target_os = "windows")'.dependencies]
backend_d3d12 = { path = "../../../🖌️render/🎯️targets/🪟️d3d12/📦️packages/🦀️rust", package = "semio-framework-ui-backend-d3d12" }

[target.'cfg(target_os = "linux")'.dependencies]
backend_vulkan = { path = "../../../🖌️render/🎯️targets/🌋️vulkan/📦️packages/🦀️rust", package = "semio-framework-ui-backend-vulkan" }

# 🌉️ `backend_webgpu` is a browser-only WebGPU-via-`wasm-bindgen` backend. Excluded from
# `wasm32-wasip2` because `target_arch = "wasm32"` is TRUE for the WASI component target too.
# This crate is the OS product's native desktop windowing host, never embedded inside a shipped
# plugin component — no s plugin depends on it — and there is no wasip2 `ActiveBackend` here (see
# `🦀️backend_alias.rs`): a headless component has no platform GPU surface to alias to. Left
# unresolved for wasip2 deliberately; fixing it is out of this slice's scope.
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
backend_webgpu = { path = "../../../🖌️render/🎯️targets/🧊️webgpu/📦️packages/🦀️rust", package = "semio-framework-ui-backend-webgpu" }
