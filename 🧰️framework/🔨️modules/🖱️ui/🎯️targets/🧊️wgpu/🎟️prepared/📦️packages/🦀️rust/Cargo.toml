[package]
workspace = "../../../../../../.."
name = "semio-framework-ui-prepared"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "ui-prepared"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-ui-prepared-staging/testkit", "semio-framework-job/testkit", "dep:ui_contract"]
browser-presenter = ["dep:js-sys"]

[dependencies]
semio-framework-ui-scene-mesh = { path = "../../../../../🎬️scene/📐️math/🕸️mesh/📦️packages/🦀️rust" }
semio-framework-ui-scene-pass = { path = "../../../../../🎬️scene/📐️math/🎞️pass/📦️packages/🦀️rust" }
semio-framework-ui-draw-contract = { path = "../../../🖍️draw/🏷️types/📦️packages/🦀️rust" }
semio-framework-ui-prepared-staging = { path = "../../📤️staging/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../🧵️job/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../🌱️value/📦️packages/🦀️rust" }

ui_contract = { path = "../../../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract", optional = true }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
js-sys = { version = "0.3.83", optional = true }

[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-trace = { path = "../../../../../../⏱️trace/📦️packages/🦀️rust" }
serde_json = "1.0.140"
semio-framework-ui-theme = { path = "../../../../../🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-framework-async-macros = { path = "../../../../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
