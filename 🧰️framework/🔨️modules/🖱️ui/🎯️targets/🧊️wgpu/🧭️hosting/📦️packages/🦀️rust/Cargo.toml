[package]
workspace = "../../../../../../.."
name = "semio-framework-ui-wgpu-hosting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "semio wgpu hosting: accessibility projection, cursors, shell, window host and scene slots"

[package.metadata.semio]
role = "framework"
id = "ui-wgpu-hosting"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = []

[dependencies]
semio-framework-async = { path = "../../../../../../⏳️async/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../🧵️job/📦️packages/🦀️rust" }
semio-framework-job-worker-authority = { path = "../../../../../../🧵️job/👷️worker/🎟️authority/📦️packages/🦀️rust" }
semio-framework-ui-arena = { path = "../../../../../🌳️retained/🏟️arena/📦️packages/🦀️rust" }
semio-framework-ui-declaration = { path = "../../../../../📜️declaration/📦️packages/🦀️rust" }
semio-framework-ui-draw-contract = { path = "../../../🖍️draw/🏷️types/📦️packages/🦀️rust" }
semio-framework-ui-locale = { path = "../../../../../🌐️locale/📦️packages/🦀️rust" }
semio-framework-ui-retained-tree = { path = "../../../../../🌳️retained/🌳️tree/📦️packages/🦀️rust" }
semio-framework-ui-text = { path = "../../../../../🔤️typography/📦️packages/🦀️rust" }
semio-framework-ui-theme = { path = "../../../../../🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-events = { path = "../../../⚡️events/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-input = { path = "../../../📥️input/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-layout = { path = "../../../🧱️layout-stack/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../🌱️value/📦️packages/🦀️rust" }
ui_contract = { path = "../../../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-job-payload = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
wasm-bindgen = { version = "0.2.106", optional = true }
web-sys = { version = "0.3.98", features = ["Window", "Navigator", "Clipboard", "HtmlCanvasElement", "OffscreenCanvas", "HtmlElement", "CssStyleDeclaration", "MouseEvent", "WheelEvent", "KeyboardEvent", "Request", "RequestInit", "RequestMode", "Response"], optional = true }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
winit = { version = "0.30.12", features = ["rwh_06"], default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.12", features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3" }

[dev-dependencies]
semio-framework-ui-retained-tree = { path = "../../../../../🌳️retained/🌳️tree/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-ui-text = { path = "../../../../../🔤️typography/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-ui-wgpu-mounted-layout = { path = "../../../📌️mounted_layout/📦️packages/🦀️rust" }
serde_json = "1.0.140"
