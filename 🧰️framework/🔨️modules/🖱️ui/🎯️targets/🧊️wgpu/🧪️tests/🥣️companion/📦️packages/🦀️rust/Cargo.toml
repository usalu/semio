[package]
workspace = "../../../../../../../.."
name = "semio-ui-wgpu-laws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "semio wgpu cross-crate laws: document tree reconcile, conformance corpus, theme token parity, text renderer, prepared engine, prepared raster refusal and clipboard ingress"

[package.metadata.semio]
role = "framework"
id = "ui-wgpu-laws"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]

