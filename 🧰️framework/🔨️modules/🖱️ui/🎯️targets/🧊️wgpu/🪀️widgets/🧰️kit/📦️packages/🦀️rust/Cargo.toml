[package]
workspace = "../../../../../../../.."
name = "semio-framework-ui-wgpu-widget-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "semio wgpu widget kit: immediate-mode context, interaction maps, widget node model and text drawing"

[package.metadata.semio]
role = "framework"
id = "ui-wgpu-widget-kit"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-ui-declaration = { path = "../../../../../../📜️declaration/📦️packages/🦀️rust" }
semio-framework-ui-draw-contract = { path = "../../../../🖍️draw/🏷️types/📦️packages/🦀️rust" }
semio-framework-ui-select-behavior = { path = "../../../../../../🧱️elements/🔽️Select/🧭️behavior/📦️packages/🦀️rust" }
semio-framework-ui-text = { path = "../../../../../../🔤️typography/📦️packages/🦀️rust" }
semio-framework-ui-theme = { path = "../../../../../../🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-input = { path = "../../../../📥️input/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-mounted-layout = { path = "../../../../📌️mounted_layout/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🌱️value/📦️packages/🦀️rust" }
ui_scene = { path = "../../../../../../🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }

[dev-dependencies]
semio-framework-async = { path = "../../../../../../../⏳️async/📦️packages/🦀️rust", features = ["entrypoint"] }
semio-framework-ui-draw-contract = { path = "../../../../🖍️draw/🏷️types/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-ui-text = { path = "../../../../../../🔤️typography/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-ui-wgpu-render = { path = "../../../../🖍️draw/📦️packages/🦀️rust", features = ["testkit"] }
serde_json = "1.0.140"
tiny-skia = "0.11.4"
wgpu = { version = "29.0.4", features = ["std", "wgsl"], default-features = false }
