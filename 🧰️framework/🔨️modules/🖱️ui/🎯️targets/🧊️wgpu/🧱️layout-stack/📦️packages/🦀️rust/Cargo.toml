[package]
workspace = "../../../../../../.."
name = "semio-framework-ui-wgpu-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "semio wgpu layout stack: chrome metrics, layout rules and the flex solver"

[package.metadata.semio]
role = "framework"
id = "ui-wgpu-layout"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-job = { path = "../../../../../../🧵️job/📦️packages/🦀️rust" }
semio-framework-ui-declaration = { path = "../../../../../📜️declaration/📦️packages/🦀️rust" }
semio-framework-ui-draw-contract = { path = "../../../🖍️draw/🏷️types/📦️packages/🦀️rust" }
semio-framework-ui-layout = { path = "../../../../../📜️declaration/📐️layout/📦️packages/🦀️rust" }
semio-framework-ui-retained-tree = { path = "../../../../../🌳️retained/🌳️tree/📦️packages/🦀️rust" }
semio-framework-ui-text = { path = "../../../../../🔤️typography/📦️packages/🦀️rust" }
semio-framework-ui-theme = { path = "../../../../../🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../🌱️value/📦️packages/🦀️rust" }
taffy = { version = "0.9", features = ["std", "flexbox", "grid", "taffy_tree"], default-features = false }
ui_contract = { path = "../../../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
ui_styling = { path = "../../../../../🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }

[dev-dependencies]
semio-framework-job = { path = "../../../../../../🧵️job/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-trace = { workspace = true }
semio-framework-ui-text = { path = "../../../../../🔤️typography/📦️packages/🦀️rust", features = ["testkit"] }
serde_json = "1.0.140"
taffy = { version = "0.9", features = ["std", "flexbox", "taffy_tree"], default-features = false }
