[package]
workspace = "../../../../../../../../.."
name = "semio-framework-ui-wgpu-device"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
build = false

[package.metadata.semio]
role = "framework"
id = "ui-wgpu-device"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
canvas-raster = ["dep:semio-framework-canvas-scene"]

[dependencies]
semio-framework-ui-render-device = { path = "../../../../../../../🖌️render/🔌️device/📦️packages/🦀️rust" }
semio-framework-canvas-scene = { path = "../../../../../../../../🖼️canvas/🎬️scene/📦️packages/🦀️rust", optional = true }
wgpu = { version = "29.0.4", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "29.0.4", default-features = false, features = ["std", "metal", "vulkan", "dx12", "wgsl"] }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
wgpu = { version = "29.0.4", default-features = false, features = ["std", "webgpu", "wgsl"] }
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.98", features = ["Window", "OffscreenCanvas"] }

[dev-dependencies]
semio-framework-async = { path = "../../../../../../../../⏳️async/📦️packages/🦀️rust", features = ["entrypoint"] }
