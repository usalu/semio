[package]
workspace = "../../../../../../.."
name = "semio-framework-ui-wgpu-render"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
build = false

[package.metadata.semio]
role = "framework"
id = "ui-wgpu-render"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
canvas-raster = ["dep:semio-framework-canvas-scene", "semio-framework-ui-wgpu-device/canvas-raster"]
testkit = ["semio-framework-ui-wgpu-draw-execution/testkit", "semio-framework-ui-prepared/testkit", "semio-framework-ui-draw-contract/testkit", "semio-framework-ui-raster-owner/testkit", "semio-framework-job/testkit"]

[dependencies]
semio-framework-ui-wgpu-draw-execution = { path = "../../🔧️pipeline/🎬️execution/📦️packages/🦀️rust" }
semio-framework-ui-wgpu-device = { path = "../../🎮️execution/🔌️device/📦️packages/🦀️rust" }
semio-framework-ui-render-prepared-shaders = { path = "../../🎨️shaders/📦️packages/🦀️rust" }
semio-framework-ui-scene-mesh = { path = "../../../../../🎬️scene/📐️math/🕸️mesh/📦️packages/🦀️rust" }
semio-framework-ui-scene-pass = { path = "../../../../../🎬️scene/📐️math/🎞️pass/📦️packages/🦀️rust" }
semio-framework-ui-scene-camera = { path = "../../../../../🎬️scene/📐️math/🎥️camera/📦️packages/🦀️rust" }
semio-framework-ui-scene-algebra = { path = "../../../../../🎬️scene/📐️math/🧮️algebra/📦️packages/🦀️rust" }
semio-framework-ui-draw-contract = { path = "../../🏷️types/📦️packages/🦀️rust" }
semio-framework-ui-prepared = { path = "../../../🎟️prepared/📦️packages/🦀️rust", features = ["browser-presenter"] }
semio-framework-ui-raster-owner = { path = "../../../../../🖼️raster/🧵️ownership/📦️packages/🦀️rust" }
semio-framework-ui-theme = { path = "../../../../../🎨️styling/🎭️theme/📦️packages/🦀️rust" }
semio-framework-ui-text = { path = "../../../../../🔤️typography/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../🧵️job/📦️packages/🦀️rust" }
semio-framework-pixels = { path = "../../../../../../🔲️pixels/📦️packages/🦀️rust" }
semio-framework-canvas-scene = { path = "../../../../../../🖼️canvas/🎬️scene/📦️packages/🦀️rust", optional = true }
bytemuck = { version = "1.24.0", features = ["derive", "extern_crate_alloc", "min_const_generics"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.98", features = ["Window", "OffscreenCanvas"] }

[dev-dependencies]
semio-framework-ui-draw-contract = { path = "../../🏷️types/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-ui-raster-owner = { path = "../../../../../🖼️raster/🧵️ownership/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-ui-wgpu-draw-execution = { path = "../../🔧️pipeline/🎬️execution/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async = { path = "../../../../../../⏳️async/📦️packages/🦀️rust", features = ["entrypoint"] }
ui_styling = { path = "../../../../../🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
serde_json = "1.0.140"
tiny-skia = "0.11.4"
semio-framework-ui-prepared = { path = "../../../🎟️prepared/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-trace = { workspace = true }
