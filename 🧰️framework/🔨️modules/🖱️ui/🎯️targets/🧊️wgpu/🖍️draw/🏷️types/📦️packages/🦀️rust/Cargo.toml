[package]
workspace = "../../../../../../../.."
name = "semio-ui-draw-contract"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "ui-draw-contract"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = []

[dependencies]
semio-ui-scene-mesh = { path = "../../../../../../🎬️scene/📐️math/🕸️mesh/📦️packages/🦀️rust" }
semio-ui-scene-pass = { path = "../../../../../../🎬️scene/📐️math/🎞️pass/📦️packages/🦀️rust" }
semio-ui-scene-camera = { path = "../../../../../../🎬️scene/📐️math/🎥️camera/📦️packages/🦀️rust" }
semio-ui-scene-algebra = { path = "../../../../../../🎬️scene/📐️math/🧮️algebra/📦️packages/🦀️rust" }
semio-ui-theme = { path = "../../../../../../🎨️styling/🎭️theme/📦️packages/🦀️rust" }
ui_styling = { path = "../../../../../../🎨️styling/📦️packages/🦀️rust", package = "semio-ui-styling" }
semio-framework-job = { path = "../../../../../../../🧵️job/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-paged-list = { path = "../../../../../../../🌱️value/📋️list/📦️packages/🦀️rust" }
bytemuck = { version = "1.24.0", features = ["derive", "extern_crate_alloc", "min_const_generics"] }

[dev-dependencies]
serde_json = { workspace = true }
