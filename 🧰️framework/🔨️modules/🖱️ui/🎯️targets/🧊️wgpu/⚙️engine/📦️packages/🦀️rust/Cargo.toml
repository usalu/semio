[package]
workspace = "../../../../../../.."
name = "semio-ui-wgpu-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "semio wgpu retained-mode engine: the `Ui` facade over surfaces, events, layout and paint"

[package.metadata.semio]
role = "framework"
id = "ui-wgpu-engine"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-ui-wgpu-mounted-layout/testkit", "semio-ui-wgpu-hosting/testkit", "semio-ui-wgpu-engine-surface/testkit", "semio-ui-retained-tree/testkit", "dep:semio-ui-wgpu-paint-reference"]

[dependencies]
semio-framework-async = { path = "../../../../../../⏳️async/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../../../🧵️job/📦️packages/🦀️rust" }
semio-framework-job-worker = { path = "../../../../../../🧵️job/👷️worker/📦️packages/🦀️rust" }
semio-framework-job-worker-authority = { path = "../../../../../../🧵️job/👷️worker/🎟️authority/📦️packages/🦀️rust" }
semio-ui-action = { path = "../../../../../🎬️action/📦️packages/🦀️rust" }
semio-ui-arena = { path = "../../../../../🌳️retained/🏟️arena/📦️packages/🦀️rust" }
semio-ui-declaration = { path = "../../../../../📜️declaration/📦️packages/🦀️rust" }
semio-ui-draw-contract = { path = "../../../🖍️draw/🏷️types/📦️packages/🦀️rust" }
