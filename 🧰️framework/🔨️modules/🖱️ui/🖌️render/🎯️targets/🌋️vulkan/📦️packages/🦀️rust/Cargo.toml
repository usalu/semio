[package]
name = "semio-framework-ui-backend-vulkan"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Hand-written Vulkan backend for Linux"

[package.metadata.semio]
role = "framework"
id = "vulkan-backend"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
default = []
backend-testing = ["ui_render/backend-testing"]

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
ui_render = { path = "../../../../📦️packages/🦀️rust", package = "semio-framework-ui-render" }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
raw-window-handle = "0.6"
