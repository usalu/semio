[package]
workspace = "../../../../.."
name = "semio-framework-ui-render"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Backend-neutral GPU UI core: transient elements, taffy layout, coherent frame snapshots, and the RenderPacket every graphics backend replays"

[package.metadata.semio]
role = "framework"
id = "ui-render"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
default = []
# 🧪️ Offscreen readback + forced device loss, for the cross-backend pixel conformance suite. Never on
# in a shipping build — it exists so four hand-written backends can be proven to agree.
backend-testing = ["semio-framework-ui-render-packet/backend-testing"]

[dependencies]
ui_styling = { path = "../../../🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
ui_contract = { path = "../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-ui-render-interaction = { path = "../../🕹️interaction/📦️packages/🦀️rust" }
semio-framework-ui-render-packet = { path = "../../📮️packet/📦️packages/🦀️rust" }
semio-framework-ui-render-shader-contract = { path = "../../✨️shader-contract/📦️packages/🦀️rust" }
semio-framework-ui-render-text = { path = "../../🖋️text/📦️packages/🦀️rust" }
taffy = { version = "0.9", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }

[dev-dependencies]
semio-framework-ui-render-packet = { path = "../../📮️packet/📦️packages/🦀️rust", features = ["backend-testing"] }
