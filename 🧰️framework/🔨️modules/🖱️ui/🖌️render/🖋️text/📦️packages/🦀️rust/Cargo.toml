[package]
workspace = "../../../../../.."
name = "semio-framework-ui-render-text"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "CPU-side text for the GPU UI core: font registration and fallback, shaped-layout cache, measurement and the glyph atlas; built-in fonts arrive at run time through TextFontSet"

[package.metadata.semio]
role = "framework"
id = "ui-render-text"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-ui-render-packet = { path = "../../../📮️packet/📦️packages/🦀️rust" }
# 🖋️ CPU-side text only: shaping/fallback (parley) and glyph rasterization into our own atlas (swash).
# The GPU copy of that atlas belongs to whichever backend is active — this crate never touches a device.
# Fonts are runtime bytes only, so parley runs `no_std` + `libm`: its default `system`/`std` features add
# fontique's path/mmap font sources, which link `std::fs` and make every guest that shapes text import
# `wasi:filesystem` — an interface no closed browser actor admits (`boundaries` forbids `memmap2`).
parley = { version = "0.5.0", default-features = false, features = ["libm"] }
swash = { version = "0.2.6", default-features = false, features = ["render", "std"] }

[dev-dependencies]
serde_json = { version = "1.0.140" }
