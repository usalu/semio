[package]
workspace = "../../../../../.."
name = "semio-ui-retained-tree"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "ui-retained-tree"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-ui-retained-tree-tree/testkit"]

[dependencies]
semio-ui-retained-tree-tree = { path = "../../🍃️nodes/📦️packages/🦀️rust" }
semio-ui-arena = { path = "../../../🏟️arena/📦️packages/🦀️rust" }
semio-ui-action = { path = "../../../../🎬️action/📦️packages/🦀️rust" }
semio-ui-declaration = { path = "../../../../📜️declaration/📦️packages/🦀️rust" }
semio-ui-layout = { path = "../../../../📜️declaration/📐️layout/📦️packages/🦀️rust" }
ui_contract = { path = "../../../../🧬️contract/📦️packages/🦀️rust", package = "semio-ui-contract" }
semio-ui-locale = { path = "../../../../🌐️locale/📦️packages/🦀️rust" }
semio-ui-select-behavior = { path = "../../../../🧱️elements/🔽️Select/🧭️behavior/📦️packages/🦀️rust" }
semio-ui-theme = { path = "../../../../🎨️styling/🎭️theme/📦️packages/🦀️rust" }
ui_scene = { path = "../../../../🎬️scene/📦️packages/🦀️rust", package = "semio-ui-scene" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-ui-viewport = { path = "../../../../🪟️viewport/📦️packages/🦀️rust" }
