[package]
workspace = "../../../../.."
name = "semio-framework-ui-declaration"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Renderer-independent UI declaration and icon contracts"

[package.metadata.semio]
role = "framework"
id = "ui-declaration"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-ui-layout = { path = "../../📐️layout/📦️packages/🦀️rust" }
semio-framework-icon-contract = { path = "../../../../🖼️assets/🔣️icons/🧬️schema/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../🌱️value/📦️packages/🦀️rust" }
ui_contract = { path = "../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
ui_scene = { path = "../../../🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }
semio-framework-ui-locale = { path = "../../../🌐️locale/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
