[package]
workspace = "../../../../../.."
name = "semio-ui-contract-operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Canonical semantic UI operations owner"

[lints]
workspace = true

[package.metadata.semio]
role = "framework"
rust-source-boundary = { maxSourceBytes = 262144, maxSourceFiles = 32, maxActiveLines = 4000 }

[lib]
path = "../../🦀️.rs"

[features]
default = []

[dependencies]
semio-ui-contract-components = { path = "../../../🧩️component/📦️packages/🦀️rust" }
semio-ui-contract-values = { path = "../../../🌱️values/📦️packages/🦀️rust" }

[dev-dependencies]
semio-ui-contract-values = { path = "../../../🌱️values/📦️packages/🦀️rust", features = ["testkit"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
