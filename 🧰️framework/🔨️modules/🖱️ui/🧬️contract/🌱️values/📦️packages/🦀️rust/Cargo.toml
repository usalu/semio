[package]
workspace = "../../../../../.."
name = "semio-ui-contract-values"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Canonical semantic UI values owner"

[lints]
workspace = true

[package.metadata.semio]
role = "framework"
rust-source-boundary = { maxSourceBytes = 262144, maxSourceFiles = 32, maxActiveLines = 4000 }

[lib]
path = "../../🦀️.rs"

[features]
default = []
testkit = []

[dependencies]
semio-framework-job = { path="../../../../../🧵️job/📦️packages/🦀️rust" }
semio-ui-contract-budget = { path = "../../../📏️budget/📦️packages/🦀️rust" }
semio-ui-contract-text = { path = "../../../🔤️text/📦️packages/🦀️rust" }
semio-ui-contract-identity = { path = "../../../🆔️identity/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-persistent = { path = "../../../../../🌱️value/📋️list/🔗️persistent/📦️packages/🦀️rust" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
semio-framework-job-testing-caller = { workspace = true }
serde_json.workspace = true
semio-framework-value = { path = "../../../../../🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-value-testing-allocator = { path = "../../../../../🌱️value/🧪️testing/💾️allocator/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
