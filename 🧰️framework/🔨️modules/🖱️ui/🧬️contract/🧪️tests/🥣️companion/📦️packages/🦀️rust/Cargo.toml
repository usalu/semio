[package]
workspace = "../../../../../../.."
name = "semio-ui-contract-laws"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion laws of ui-contract: document compare, resident permits, assembly, typed retirement and worker retirement"
publish = false

[package.metadata.semio]
role = "framework"
id = "ui-contract-laws"

[package.metadata.semio.rust-source-boundary]
