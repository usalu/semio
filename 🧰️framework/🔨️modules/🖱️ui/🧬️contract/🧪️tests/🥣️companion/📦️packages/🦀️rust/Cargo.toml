maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-ui-contract = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }
semio-ui-contract-values = { path = "../../../../🌱️values/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-test-fixtures = { path = "../../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
serde_json = { workspace = true }
