[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "semio-framework-ui-styling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
build = ["hatchling==1.27.0"]

[tool.semio]
role = "framework"
id = "ui-styling-py"

[tool.hatch.build.targets.wheel]
packages = ["🎨️styling"]

[tool.hatch.build.targets.wheel.force-include]
"../../🔤️tokens/🐍️.py" = "🎨️styling/🐍️.py"

[tool.uv]
package = true
