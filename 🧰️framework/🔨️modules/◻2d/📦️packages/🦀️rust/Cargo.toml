[package]
name = "semio-framework-2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "🖊️ 2D geometry kernel: shared path-segment vocabulary, planar booleans, bitmap trace."

[lints]
workspace = true

[package.metadata.semio]
role = "framework"

[lib]
path = "🦀️.rs"

[features]
default = ["booleans", "trace"]
booleans = []
trace = []

[dependencies]
semio-framework-os-kernel = { workspace = true }
# 🔢️ `⚙️engine`, mounted into this crate via `#[path]`, content-addresses its cache keys with
# `semio_framework_hash::hash` — the dep travels with that mount.
semio-framework-hash = { path = "../../../🔢️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
serde = { workspace = true }
