[package]
name = "semio-framework-2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "🖊️ 2D geometry kernel: shared path-segment vocabulary, planar booleans, bitmap trace."

[lints]
workspace = true

[package.metadata.semio]
role = "framework"

[lib]
path = "📦️glue.rs"

[features]
default = ["booleans", "trace", "parallel"]
booleans = ["dep:geo"]
trace = []
parallel = ["dep:rayon", "dep:futures"]

[dependencies]
futures = { version = "0.3.31", optional = true }
geo = { version = "0.29", optional = true }
pollster = "0.4.0"
rayon = { version = "1.10.0", optional = true }
semio-framework-os-kernel = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
blake3 = "1"
