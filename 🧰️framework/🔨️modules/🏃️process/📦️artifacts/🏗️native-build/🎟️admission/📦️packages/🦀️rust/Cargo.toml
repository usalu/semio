cargo-features = ["trim-paths"]

[package]
name = "semio-build-scheduler"
version = "0.0.0"
edition = "2024"
publish = false
description = "Memory-admitting rustc wrapper of the native build driver"

[[bin]]
name = "semio-build-scheduler"
path = "../../🦀️.rs"

[[example]]
name = "jobserver-oracle"
path = "../../../🎰️jobserver/🔮️oracles/🦀️.rs"

[dev-dependencies]
jobserver = "=0.1.35"

[workspace]
members = ["."]

[workspace.metadata.semio.repository]
exclude-patterns = []
schema-version = 1
member-manifests = ["Cargo.toml"]
