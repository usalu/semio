[package]
name = "semio-framework-geometry"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
autotests = false
description = "First-party 2D geometry (Point/Vec2/Affine/shapes/BezPath, selection and curve math), the fixed-size render matrices Vec3/Mat4, and the seeded reproducible Rng — the framework-internal geometric vocabulary every framework crate may name without reaching a plugin. `kurbo` is a differential-test oracle only — see RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS/REIMPLEMENT-KURBO-BACKED-GEOMETRY-TYPES-FIRST-PARTY (26/09/01)."

[package.metadata.semio]
role = "framework"
id = "geometry"

[lints]
workspace = true

[lib]
name = "semio_framework_geometry"
path = "🦀️.rs"

[[test]]
name = "first_party_geometry"
path = "tests/📐️first_party_geometry.rs"

[dependencies]

[dev-dependencies]
kurbo = "0.13.1"
semio-framework-async-macros = { path = "../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
