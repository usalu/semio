[package]
workspace = "../../../.."
name = "semio-framework-pixels"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Owned raster image codecs (PNG) and pixel-buffer utilities for the framework kernel"

[package.metadata.semio]
role = "framework"
id = "pixels"

[lints]
workspace = true
[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-pixels-codecs = { path = "../../🎞️codecs/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-persistent = { path = "../../../🌱️value/📋️list/🔗️persistent/📦️packages/🦀️rust" }
semio-framework-2d = { path = "../../../◻️2d/📦️packages/🦀️rust" }

[features]
# 🪝️ Exposes the `testkit` hooks (aliases and forwarders of crate-private items) for the companion crate `semio-framework-pixels-tests`.
testkit = ["semio-framework-pixels-codecs/testkit"]

[dev-dependencies]
serde_json = { workspace = true }
semio-framework-trace = { path = "../../../⏱️trace/📦️packages/🦀️rust" }

semio-framework-value-testing-allocator = { path = "../../../🌱️value/🧪️testing/💾️allocator/📦️packages/🦀️rust" }
