[package]
workspace = "../../../.."
name = "semio-framework-pixels"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Owned raster image codecs (PNG) and pixel-buffer utilities for the framework kernel"

[package.metadata.semio]
role = "framework"
id = "pixels"

[lints]
workspace = true
[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-2d = { path = "../../../◻️2d/📦️packages/🦀️rust", default-features = false }
semio-framework-io-binary-source = { path = "../../../🚪️io/🔢️binary/📥️source/📦️packages/🦀️rust" }
semio-framework-io-base64 = { path = "../../../🚪️io/🔤️base64/📦️packages/🦀️rust" }
semio-framework-deflate = { path = "../../../🗜️deflate/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-2d = { path = "../../../◻️2d/📦️packages/🦀️rust", default-features = false, features = ["booleans", "trace"] }
base64 = "0.22.1"
percent-encoding = "2.3.2"
png = "0.17.16"
serde_json = { workspace = true }
image = { version = "0.25", default-features = false }
