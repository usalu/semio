semio-framework-font-noto-emoji-supplement-regular = { path = "../../../🖼️assets/🔤️fonts/😀️noto-emoji/🪉️supplement/📖️regular/📦️packages/🦀️rust" }

[dev-dependencies]
serde_json = { workspace = true }
blake3 = "1.8.2"
semio-framework-pixels = { path = "../../../🔲️pixels/📦️packages/🦀️rust" }

ttf-parser = "0.25.1"
tiny-skia = "0.11.4"
rustybuzz = "0.20.1"
semio-framework-trace = { path = "../../../⏱️trace/📦️packages/🦀️rust" }
