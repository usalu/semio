[package]
workspace = "../../../.."
name = "semio-framework-2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "🖊️ 2D geometry kernel: shared path-segment vocabulary, planar booleans, bitmap trace."

[lints]
workspace = true

[package.metadata.semio]
role = "framework"

[lib]
name = "semio_framework_2d"
path = "🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
# 🔢️ Neutral compute owns content-addressed engine keys.
semio-framework-hash = { path = "../../../🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
# 🧬️ `#[derive(ToValue, FromValue)]`, always on — the plugin-facing wire encoding for `PathSegment`.
semio-framework-value-derive = { path = "../../../🌱️value/✨️derive/📦️packages/🦀️rust" }
# 🔤️ Shipped font families: each outline is owned by its own font asset crate.
semio-framework-font-anta-latin-regular = { path = "../../../🖼️assets/🔤️fonts/🚀️anta/🏛️latin/📖️regular/📦️packages/🦀️rust" }
semio-framework-font-anta-latin-ext-regular = { path = "../../../🖼️assets/🔤️fonts/🚀️anta/➕️latin-ext/📖️regular/📦️packages/🦀️rust" }
semio-framework-font-anta-math-regular = { path = "../../../🖼️assets/🔤️fonts/🚀️anta/🧮️math/📖️regular/📦️packages/🦀️rust" }
semio-framework-font-anta-symbols-regular = { path = "../../../🖼️assets/🔤️fonts/🚀️anta/🔣️symbols/📖️regular/📦️packages/🦀️rust" }
semio-framework-font-kelly-slab-latin-regular = { path = "../../../🖼️assets/🔤️fonts/🧱️kelly-slab/🏛️latin/📖️regular/📦️packages/🦀️rust" }
semio-framework-font-kelly-slab-latin-ext-regular = { path = "../../../🖼️assets/🔤️fonts/🧱️kelly-slab/➕️latin-ext/📖️regular/📦️packages/🦀️rust" }
