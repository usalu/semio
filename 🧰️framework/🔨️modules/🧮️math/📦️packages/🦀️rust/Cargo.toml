[package]
name = "semio-framework-math"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Semio math framework — algebra, geometry, graph theory, CAS, WFC, probability/statistics and signal domains in one crate"
build = "build.rs"

[package.metadata.semio]
role = "framework"
id = "math"

[lints]
workspace = true

[lib]
name = "semio_framework_math"
crate-type = ["rlib", "cdylib"]
path = "📦️glue.rs"

[dependencies]
dsl = { path = "../../../../🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
dsl_core = { path = "../../../../🛍️products/💻️os/🔨️modules/🗣️dsl/🫀️core/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-core" }
dsl_schema = { path = "../../../../🛍️products/💻️os/🔨️modules/🗣️dsl/🧬️schema/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl-schema" }
neural_engine = { path = "../../../../🛍️products/💻️os/🔨️modules/🧠️neural/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
kurbo = "0.13.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

[build-dependencies]
serde_json = "1.0.140"
