[package]
name = "semio-framework-math"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Semio math framework — algebra, number theory, WFC, probability/statistics, signal and spatial domains in one crate. Geometry/random live in semio-framework-geometry; the graph vocabulary, algorithms, drawing and manifest live in semio-framework-graph; symbolic algebra (CAS) and polynomials live in the ➗️mathematical plugin's own artifact tree (ticket 26/08/12/DISSOLVE-KERNELS-AND-MODULES-INTO-EVENT-SOURCED-ARTIFACTS, wave M3a)."

[package.metadata.semio]
role = "framework"
id = "math"

[lints]
workspace = true

[lib]
name = "semio_framework_math"
crate-type = ["rlib", "cdylib"]
path = "📦️glue.rs"

[dependencies]
semio-framework-os-kernel = { path = "../../../../🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-geometry = { path = "../../../📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-graph = { path = "../../../🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
