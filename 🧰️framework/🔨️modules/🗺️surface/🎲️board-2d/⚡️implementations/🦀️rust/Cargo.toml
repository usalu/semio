cargo-features = ["trim-paths"]
[package]
name = "semio-framework-os-kernel-surface-board-2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle board (2d) rendering surface — WebGPU canvas session over puzzle_2d_engine's headless compute"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# 🪶️ REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT. Applies when 📜️script.ts builds with wasm-pack
# `--profile wasm-release` (wasm-pack 0.15+ maps any custom profile name to this `custom` section,
# ignoring `profile.release` above). Runs after wasm-bindgen, mirroring os-dev's plugin -Oz post-pass
# (WASM_OPT_ARGS) minus `--low-memory-unused`: this module's stack-first memory layout means the
# "low 1KB is unused" assumption binaryen makes for that flag is unverified here.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../🎲️board-2d/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
puzzle = { path = "../../../../../../✏️s/🔌️plugins/🧩️puzzle/📦️packages/🦀️rust", package = "semio-s-plugin-puzzle" }
store = { path = "../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
mathematical_geometry = { path = "../../../../../../🧰️framework/🔨️modules/🧮️math/📐️geometry/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-geometry" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }

# ─── TEMPORARY VERIFICATION OVERLAY (ticket 26/08/06/FRAMEWORK-SURFACE-FAMILY-CRATE-CONSOLIDATION) ───
# Makes this manifest its own workspace root so it can be verified in isolation while the root
# workspace is red from other sessions' in-flight migrations. DELETE THIS WHOLE BLOCK AT HANDOFF,
# together with the nested target/ and Cargo.lock this nested workspace creates.
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
thiserror = "2.0.18"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[profile.wasm-release.package.semio-framework-os-kernel-store]
codegen-units = 1

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
# ─── END TEMPORARY VERIFICATION OVERLAY ───
