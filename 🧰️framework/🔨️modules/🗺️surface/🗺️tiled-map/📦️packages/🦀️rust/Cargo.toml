[package]
workspace = "../../../../.."
name = "semio-framework-surface-tiled-map"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Surface tiled map host: raster and vector tile scenes, interaction, picking, label declutter and the browser MapSession bridge"

[package.metadata.semio]
role = "framework"
id = "surface-tiled-map"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
canvas = { path = "../../../../🖼️canvas/📦️packages/🦀️rust", package = "semio-framework-canvas" }
ui_styling = { path = "../../../../🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
serde_json = "1.0.140"
semio-framework-pixels = { path = "../../../../🔲️pixels/📦️packages/🦀️rust", package = "semio-framework-pixels" }
tiled_map_model = { path = "../../🧮️model/📦️packages/🦀️rust", package = "semio-framework-surface-tiled-map-model" }
tiled_map_mvt = { path = "../../🧱️vector-tiles/📦️mvt-decoder/📦️packages/🦀️rust", package = "semio-framework-surface-tiled-map-mvt" }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
semio-framework-async = { workspace = true }
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement", "Window"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
