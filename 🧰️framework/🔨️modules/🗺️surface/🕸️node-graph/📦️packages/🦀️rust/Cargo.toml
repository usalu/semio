[package]
workspace = "../../../../.."
name = "semio-framework-surface-node-graph"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Surface node graph: neutral graph scene records and retained explicit-framing scene decode"

[package.metadata.semio]
role = "framework"
id = "surface-node-graph"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-io-base64 = { path = "../../../../🚪️io/🔤️base64/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-replication = { path = "../../../../📡️replication/📦️packages/🦀️rust" }
semio-framework-ui-viewport = { path = "../../../../🖱️ui/🪟️viewport/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
semio-framework-trace = { path = "../../../../⏱️trace/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
