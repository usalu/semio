cargo-features = ["trim-paths"]
[package]
workspace = "../../../.."
name = "semio-framework-surface"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Surface family facade — re-exports the paint, terrain, node-graph and tiled-map producer crates as one wasm-bindgen library"

[package.metadata.semio]
role = "framework"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[dependencies]
# 🧩️ The facade owns no module source: every surface family is its own producer crate, re-exported as `paint`, `terrain`, `node_graph` and `tiled_map`.
semio-framework-surface-paint = { path = "../../🎨️paint/📦️packages/🦀️rust" }
semio-framework-surface-terrain = { path = "../../🏔️terrain/📦️packages/🦀️rust" }
semio-framework-surface-node-graph = { path = "../../🕸️node-graph/📦️packages/🦀️rust" }
semio-framework-surface-tiled-map = { path = "../../🗺️tiled-map/📦️packages/🦀️rust" }

# 🗺️ Cargo derives an integration test's crate name from its file stem, and a crate name may only
# contain ASCII — so the repo's emoji filename convention needs an explicit name/path pair here.
[[test]]
name = "tiled_map_mercator_oracle"
path = "../../🧪️tests/🗺️tiled-map-mercator-oracle/🦀️.rs"

[dev-dependencies]
serde_json = "1.0.140"
