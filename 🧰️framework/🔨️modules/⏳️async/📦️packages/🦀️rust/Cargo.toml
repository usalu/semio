[package]
workspace = "../../../.."
name = "semio-framework-async"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Async-runtime interface layer AND the process-wide CPU substrate: OperationContext/CancelToken/Scope/ChannelPolicy vocabulary, the HostAsyncRuntime trait, and (Phase 1 packet P1a, INTERACTIVE-JOB-RUNTIME-REFACTOR) WorkerPool — the one process-wide work-stealing thread pool every subsystem schedules onto, replacing ThreadPlan/ThreadBudget and per-role OS threads. The future-polling executor itself (tokio today) still lives in a sibling crate (design ticket 26/08/17/MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME, packet R2/P1b)."

[package.metadata.semio]
role = "framework"
id = "async"

[lints]
workspace = true

[lib]
name = "semio_framework_async"
path = "🦀️.rs"

[features]
# 🧪️ Turns on the `schema_metadata` projection and the `internals` hooks the companion crate
# `semio-framework-async-tests` drives; the `ManualRuntime` double lives in `semio-framework-async-testkit`.
testkit = []
# 🚪️ Gates `block_on` to approved process entry points (a CLI `main`) and test/testkit consumers —
# the companion crate `semio-framework-async-tests` enables it, same shape as `testkit`. See
# `block_on`'s doc for why interactive-reachable code must never enable this.
entrypoint = []
# 🕸️ Compiles the cooperative `wasm_pool` natively (it is always compiled for `wasm32`) so the companion
# crate `semio-framework-async-wasm-pool-tests` can drive it; `serde` parses its JSON test corpus.
wasm-pool-host = ["dep:serde"]

[dependencies]
semio-framework-trace = { workspace = true }
semio-framework-async-timer = { workspace = true }
semio-framework-value = { workspace = true }

# 🧪️ `🤝️cooperative`'s fixture-driven suite parses a JSON test corpus; no shipped type in this crate
# derives Serialize/Deserialize (ticket `26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-
# ARTIFACTS`, `serde-off-guest-path.md` — every prior derive was dead, zero repo-wide call sites), so
# `serde` is optional and only the `wasm-pool-host` feature turns it on; it never reaches the
# `wasm32-wasip2` guest link path.
serde = { version = "1.0.228", features = ["derive"], optional = true }

# 🌉️ Browser-only `pub mod browser` (JS `Promise`/`JsValue` bridge — `spawn_local`/
# `future_to_promise`/`JsFuture`). Excluded from `wasm32-wasip2` because `target_arch = "wasm32"`
# is TRUE for the WASI component target too. wasip2 does not need this bridge: task execution is
# already covered target-neutrally by this crate's `WorkerPool`/`block_on` (the latter's own
# `not(target_arch = "wasm32")` split is unrelated — it is about `std::thread::park`/`unpark`
# availability, not JS, and stays bare since it is correct for wasip2 too).
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
