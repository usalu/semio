[package]
name = "semio-framework-async"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Async-runtime interface layer AND the process-wide CPU substrate: OperationContext/CancelToken/Scope/ChannelPolicy vocabulary, the HostAsyncRuntime trait, and (Phase 1 packet P1a, INTERACTIVE-JOB-RUNTIME-REFACTOR) WorkerPool — the one process-wide work-stealing thread pool every subsystem schedules onto, replacing ThreadPlan/ThreadBudget and per-role OS threads. The future-polling executor itself (tokio today) still lives in a sibling crate (design ticket 26/08/17/MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME, packet R2/P1b)."

[package.metadata.semio]
role = "framework"
id = "async"

[lints]
workspace = true

[lib]
name = "semio_framework_async"
path = "📦️glue.rs"

[features]
# 🧬️ Generates the TypeScript mirror for the pure vocabulary types (see `../../🤖️generated/`);
# never enabled by default so `ts-rs` never affects the plain `cargo build`/`cargo test` path.
typegen = ["dep:ts-rs"]
# 🧪️ Turns on the `testkit::ManualRuntime` `HostAsyncRuntime` test double for downstream crates
# (packets R2/R4) to unit-test against without linking tokio. Always available under `cfg(test)`
# for this crate's own test suite regardless of this feature.
testkit = []
# 🚪️ Gates `block_on` to approved process entry points (a CLI `main`) and test/testkit consumers —
# always available under `cfg(test)` for this crate's own suite regardless of this feature, same
# shape as `testkit`. See `block_on`'s doc for why interactive-reachable code must never enable this.
entrypoint = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = { version = "10", optional = true }
semio-framework-trace = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { path = "../../✨️macros/📦️packages/🦀️rust" }
