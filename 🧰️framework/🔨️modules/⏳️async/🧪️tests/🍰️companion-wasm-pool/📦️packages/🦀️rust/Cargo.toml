[package]
workspace = "../../../../../.."
name = "semio-framework-async-wasm-pool-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of the cooperative wasm worker pool of async, run natively"
publish = false

[package.metadata.semio]
role = "framework"
id = "async-wasm-pool-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-async = { path = "../../../../📦️packages/🦀️rust", features = ["wasm-pool-host"] }
semio-framework-test-fixtures = { path = "../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-trace = { workspace = true }
semio-framework-async-macros = { path = "../../../../✨️macros/📦️packages/🦀️rust" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
