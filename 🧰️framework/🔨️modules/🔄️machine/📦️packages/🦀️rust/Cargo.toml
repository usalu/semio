[package]
name = "semio-framework-machine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Statechart kernel, actor runtime and hosts — the core state machine every app engine is built on"

[package.metadata.semio]
role = "framework"
id = "machine"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "🦀️.rs"

[features]
default = ["macros", "serde"]
macros = ["dep:machine_derive"]
serde = ["dep:serde", "dep:serde_json"]
testing = []

[dependencies]
machine_derive = { path = "../../✨️derive/📦️packages/🦀️rust", optional = true, package = "semio-framework-machine-derive" }
semio-framework-dispatch-macros = { path = "../../../🔀️dispatch/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }

# 🌉️ Browser-only `WasmHost` (JS timer/effect-callback bridge, `wasm_bridge` mod in `🦀️.rs`).
# Excluded from `wasm32-wasip2` because `target_arch = "wasm32"` is TRUE for the WASI component
# target too. wasip2 doesn't need this bridge: `NativeHost` (same file) is backed by
# `std::time::Instant`, which WASI's clock supports, so it already serves the component target.
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"

[dev-dependencies]
