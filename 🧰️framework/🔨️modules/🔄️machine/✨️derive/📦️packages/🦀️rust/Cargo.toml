[package]
workspace = "../../../../.."
name = "semio-framework-machine-derive"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Proc-macros compiling statechart! declarations into semio-framework-machine static tables"

[package.metadata.semio]
role = "framework"
id = "machine-derive"

[lints]
workspace = true

[lib]
name = "semio_framework_machine_derive"
proc-macro = true
path = "../../🦀️.rs"

[dependencies]
# 🧷️ `visit`/`visit-mut` pinned: `wasm-bindgen-macro-support` requests them in some hub components, and one host `syn` feature set keeps every component on the same proc-macro units.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
