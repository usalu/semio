[package]
workspace = "../../../.."
name = "semio-framework-pack"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The .spk binary document container: header/footer/segment/manifest/chunk-table framing, the value codec, recovery, and native/async/http sources. A file format, product-neutral like the .spr record format it shares a codec with."

[package.metadata.semio]
role = "framework"
id = "pack"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "pack"
path = "🦀️.rs"

[[test]]
name = "pack_schema_hash"
path = "../../🌱️value/🧪️tests/🔬️schema-hash/🦀️.rs"

[features]
default = ["deflate"]
deflate = ["semio-framework-replication-codec/deflate", "semio-framework-pack-format/deflate", "semio-framework-pack-format-retained/deflate"]
corruption-testing = []

[dependencies]
semio-framework-diagnostic = { path = "../../../⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../🔏️hash/📦️packages/🦀️rust" }
semio-framework-io-schema = { path = "../../../🚪️io/🧬️schema/📦️packages/🦀️rust" }
semio-framework-io-sqlite-snapshot = { path = "../../../🚪️io/🪶️sqlite-snapshot/📦️packages/🦀️rust" }
semio-framework-pack-async = { path = "../../⏳️async/📦️packages/🦀️rust" }
semio-framework-pack-error = { path = "../../⚠️error/📦️packages/🦀️rust" }
semio-framework-pack-format = { path = "../../📐️format/📦️packages/🦀️rust" }
semio-framework-pack-format-catalog = { path = "../../📐️format/🗂️catalog/📦️packages/🦀️rust" }
semio-framework-pack-format-retained = { path = "../../📐️format/🎮️retained/📦️packages/🦀️rust" }
semio-framework-pack-http = { path = "../../🌐️http/📦️packages/🦀️rust" }
semio-framework-pack-intrinsic = { path = "../../🌱️intrinsic/📦️packages/🦀️rust" }
semio-framework-pack-io = { path = "../../🔌️io/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../🔤️json/📦️packages/🦀️rust" }
semio-framework-pack-record = { path = "../../🌱️value/📦️packages/🦀️rust" }
semio-framework-pack-record-encode = { path = "../../🌱️value/🛫️encode/📦️packages/🦀️rust" }
semio-framework-pack-record-preflight = { path = "../../🌱️value/🫳️preflight/📦️packages/🦀️rust" }
semio-framework-pack-record-retained = { path = "../../🌱️value/🛬️decode/📦️packages/🦀️rust" }
semio-framework-pack-record-schema = { path = "../../🌱️value/🧬️schema/📦️packages/🦀️rust" }
semio-framework-replication-codec = { path = "../../../📡️replication/⚙️codec/📦️packages/🦀️rust" }
semio-framework-replication-interaction = { path = "../../../📡️replication/📡️wire/🕹️interaction/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }

[dev-dependencies]
blake3 = "1.8.2"
semio-framework-async = { workspace = true }
semio-framework-dsl = { path = "../../../🗣️dsl/📦️packages/🦀️rust" }
semio-framework-dsl-record-derive = { path = "../../../🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../🧵️job/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-trace = { path = "../../../⏱️trace/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
semio-framework-pack-intrinsic-media-laws = { path = "../../🌱️value/🧪️tests/🎞️intrinsic-media/📦️packages/🦀️rust" }

[[test]]
name = "pack_record_laws"
path = "../../🧪️tests/🔬️record-laws/🦀️.rs"

[[test]]
name = "pack_record_schema_laws"
path = "../../🧪️tests/🧮️record-schema-laws/🦀️.rs"

[[test]]
name = "original-owned-wire"
path = "../../🌱️value/🛫️encode/🫳️borrowed/📨️wire/🧪️tests/🦀️.rs"
