[package]
workspace = "../../../../../../.."
name = "semio-framework-pack-json-source"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Source-funded resumable JSON encoding."

[package.metadata.semio]
role = "framework"
id = "pack-json-source"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"
doctest = false

[dependencies]
semio-framework-job = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-pack-json = { path = "../../../📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-trace = { workspace = true }
serde_json = { workspace = true }
