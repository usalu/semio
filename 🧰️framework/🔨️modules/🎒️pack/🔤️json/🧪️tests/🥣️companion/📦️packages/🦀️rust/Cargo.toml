[package]
workspace = "../../../../../../.."
name = "semio-framework-pack-json-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of pack-json: ordered values, canonical trees, text and wire cursors, read policy and refusal receipts"
publish = false

[package.metadata.semio]
role = "framework"
id = "pack-json-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack-json = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-pack-json-source-sink = { path = "../../../../🛫️encode/🫳️borrowed/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-ordered = { path = "../../../../../../🌱️value/🗂️ordered/📦️packages/🦀️rust" }
semio-framework-value-persistent = { path = "../../../../../../🌱️value/📋️list/🔗️persistent/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../../../../🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }

[dev-dependencies]
serde = { workspace = true }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
semio-framework-trace = { path = "../../../../../../⏱️trace/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
