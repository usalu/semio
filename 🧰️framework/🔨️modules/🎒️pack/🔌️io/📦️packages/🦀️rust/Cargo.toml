[package]
workspace = "../../../../.."
name = "semio-framework-pack-io"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Native file I/O for the pack container family."

[package.metadata.semio]
role = "framework"
id = "pack-io"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack-error = { path = "../../../⚠️error/📦️packages/🦀️rust" }
