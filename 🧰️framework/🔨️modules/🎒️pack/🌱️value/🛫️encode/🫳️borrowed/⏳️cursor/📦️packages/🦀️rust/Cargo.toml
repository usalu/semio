[package]
workspace = "../../../../../../../.."
name = "semio-framework-pack-record-encode-cursor"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Retained borrowed Pack cursors: canonical record symbols and ordinal emission, retained document frames and owned wire emission"

[package.metadata.semio]
role = "framework"
id = "pack-record-encode-cursor"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = ["deflate"]
deflate = ["semio-framework-replication-codec/deflate"]

[dependencies]
semio-framework-value = { path = "../../../../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../../../../🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-value-paged-text = { path = "../../../../../../../🌱️value/📝️text/📦️paged/📦️packages/🦀️rust" }
semio-framework-value-persistent = { path = "../../../../../../../🌱️value/📋️list/🔗️persistent/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../../🔏️hash/📦️packages/🦀️rust" }
semio-framework-pack-format = { path = "../../../../../../📐️format/📦️packages/🦀️rust" }
semio-framework-pack-record-preflight = { path = "../../../../../🫳️preflight/📦️packages/🦀️rust" }
semio-framework-replication-codec = { path = "../../../../../../../📡️replication/⚙️codec/📦️packages/🦀️rust" }
semio-framework-pack-record-schema = { path = "../../../../../🧬️schema/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-pack-record-encode = { path = "../../../../📦️packages/🦀️rust" }
semio-framework-pack-error = { path = "../../../../../../⚠️error/📦️packages/🦀️rust" }
semio-framework-dsl-record-derive = { path = "../../../../../../../🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
semio-framework-trace = { path = "../../../../../../../⏱️trace/📦️packages/🦀️rust" }
semio-framework-trace-memory-testing = { path = "../../../../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
blake3 = "1.8.2"
