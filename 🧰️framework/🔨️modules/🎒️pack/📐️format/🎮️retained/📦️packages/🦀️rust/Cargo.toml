[package]
workspace = "../../../../../.."
name = "semio-framework-pack-format-retained"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Retained canonical Pack source admission cursors: pages, segments, varints and anchors, bounded and cancellable byte by byte."

[package.metadata.semio]
role = "framework"
id = "pack-format-retained"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
deflate = ["semio-framework-replication-codec/deflate"]

[dependencies]
semio-framework-pack-error = { path = "../../../../⚠️error/📦️packages/🦀️rust" }
semio-framework-pack-format = { path = "../../../📦️packages/🦀️rust" }
semio-framework-pack-source = { path = "../../../../🚰️source/📦️packages/🦀️rust" }
semio-framework-replication-codec = { path = "../../../../../📡️replication/⚙️codec/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../🌱️value/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
