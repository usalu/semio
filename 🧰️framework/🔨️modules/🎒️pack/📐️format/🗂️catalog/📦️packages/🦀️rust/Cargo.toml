[package]
workspace = "../../../../../.."
name = "semio-framework-pack-format-catalog"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Retained canonical Pack catalog cursors: manifest, symbol table, chunk table and inline symbols, bounded and cancellable byte by byte."

[package.metadata.semio]
role = "framework"
id = "pack-format-catalog"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-hash = { path = "../../../../../🔏️hash/📦️packages/🦀️rust" }
semio-framework-pack-error = { path = "../../../../⚠️error/📦️packages/🦀️rust" }
semio-framework-pack-format = { path = "../../../📦️packages/🦀️rust" }
semio-framework-pack-format-retained = { path = "../../../🎮️retained/📦️packages/🦀️rust" }
semio-framework-pack-source = { path = "../../../../🚰️source/📦️packages/🦀️rust" }
semio-framework-replication-codec = { path = "../../../../../📡️replication/⚙️codec/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-persistent = { path = "../../../../../🌱️value/📋️list/🔗️persistent/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-trace = { path = "../../../../../⏱️trace/📦️packages/🦀️rust" }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
semio-framework-pack-format = { path = "../../../📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-value-testing-allocator = { path = "../../../../../🌱️value/🧪️testing/💾️allocator/📦️packages/🦀️rust" }
