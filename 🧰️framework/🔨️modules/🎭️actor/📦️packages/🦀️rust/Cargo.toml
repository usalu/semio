[package]
workspace = "../../../.."
name = "semio-framework-actor"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pooled actor/plugin runtime kernel: PackageId/ActorId/Lane/Budget vocabulary, the hierarchical deficit-round-robin scheduler, mailbox backpressure, the failure ladder, scene-commit + metrics, and the Kernel facade — pure, no I/O, no clock, no wasm_bindgen/web_sys/winit/tokio/std::thread in the core (transports and time are injected)."

[package.metadata.semio]
role = "framework"
id = "actor"
cargo-execution = "🧪️execution/🔣️.json"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[[test]]
name = "original-retained-receiving"
path = "../../🎟️retained-turn/🫴️receiving/🧪️tests/📬️public/🦀️.rs"

[dependencies]
semio-framework-actor-retained-context = { path = "../../🎟️retained-turn/🎟️context/📦️packages/🦀️rust" }
semio-framework-actor-pack = { path = "../../🧵️pack/📦️packages/🦀️rust" }
semio-framework-actor-retained-turn = { path = "../../🎟️retained-turn/📦️packages/🦀️rust" }
semio-framework-actor-vocabulary = { path = "../../📖️vocabulary/📦️packages/🦀️rust" }
semio-framework-actor-job-publication = { path = "../../💼️job/📨️publication/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
serde = { version = "1.0.228", features = ["derive"] }
semio-framework-job = { workspace = true }
semio-framework-value-derive = { path = "../../../🌱️value/✨️derive/📦️packages/🦀️rust" }

# 🌉️ Browser-only `KernelHost` wasm-bindgen bridge (`🦀️.rs`'s `kernel_host` mod, React-web /
# wgpu-web hosts). Excluded from `wasm32-wasip2` because `target_arch = "wasm32"` is TRUE for the
# WASI component target too — declaring these under the bare arch gate linked `wasm-bindgen` (and,
# via the `wasm_bindgen_futures` alias, this crate's own first-party async runtime) into the shipped
# plugin component. The wasip2 guest path is `semio-framework-plugin` on `wasm32-wasip2`,
# not this bridge.
semio-framework-diagnostic = { path = "../../../⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
semio-framework-async = { workspace = true }
wasm-bindgen = "0.2.106"


[dev-dependencies]
semio-framework-async = { workspace = true }
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-job-native-decode = { path = "../../../🧵️job/⏱️context/🛬️decode/📦️packages/🦀️rust" }
semio-framework-diagnostic = { path = "../../../⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-trace = { path = "../../../⏱️trace/📦️packages/🦀️rust" }
# 🧪️ `#[cfg_attr(test, derive(Serialize, Deserialize))]` oracle: this crate's real wire stays
# `pack_encode`/`pack_decode` (see the module doc's "opaque seam" note) — serde only proves the
# `ToValue`/`FromValue` derive against serde's own independent shape inside `#[cfg(test)]`, so it
# never reaches a non-test build.
serde = { version = "1.0.228", features = ["derive"] }
# 🧪️ terra-shard-grants: proves the Part A serde-shape fix by actually serializing to bytes and
# back (`serde_json`, not an in-process equality check — that is exactly what hid the `JobStep`
# newtype-variant defect this fix generalizes). Dev-only: the crate core has zero `serde_json`
# dependency on its real wire, which stays `pack_encode`/`pack_decode` (see the module doc's
# "opaque seam" note) — this never reaches a non-test build.
serde_json = { workspace = true }
# 🧪️ terra-actor-green: `#[async_test]` keeps this crate's test fns' literal `async fn` (universal-
# async convention) while expanding to a plain `#[test]` harness over an inline, dependency-free
# `block_on` — see R4 clause 5 (a `#[test]` fn body is a sanctioned executor entry point).
semio-framework-async-macros = { path = "../../../⏳️async/✨️macros/📦️packages/🦀️rust" }

[[test]]
name = "original-owned-async-turn"
path = "../../🎟️retained-turn/💼️job/⏸️park/🧪️tests/🦀️.rs"

[[test]]
name = "kernel-unit"
path = "../../🧪️tests/🔬️unit/🦀️.rs"

[[test]]
name = "typegen"
path = "../../🧪️tests/🧬️typegen/🦀️.rs"
