[package]
workspace = "../../../.."
name = "semio-framework-diagnostic"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Canonical neutral source spans, bounded text errors and structured fault diagnostics."

[package.metadata.semio]
role = "framework"
id = "diagnostic"

[lints]
workspace = true

[lib]
name = "semio_framework_diagnostic"
path = "🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-native-owned = { path = "../../../🌱️value/🛬️decode/🧳️owned/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"


[dev-dependencies]
semio-framework-trace = { path = "../../../⏱️trace/📦️packages/🦀️rust" }
