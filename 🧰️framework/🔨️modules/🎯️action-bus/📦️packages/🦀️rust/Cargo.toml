[package]
workspace = "../../../.."
name = "semio-framework-action-bus"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "action-bus"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-manifest-actions = { path = "../../../🛂️manifest/🕹️actions/📦️packages/🦀️rust" }
semio-framework-manifest-app-surface = { path = "../../../🛂️manifest/🧱️app-surface/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../🧵️job/📦️packages/🦀️rust", package = "semio-framework-job" }
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-artifact-reference = { workspace = true }
semio-framework-async-macros = { path = "../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-manifest-arg-schema = { path = "../../../🛂️manifest/🧮️arg-schema/📦️packages/🦀️rust" }
semio-framework-manifest-media = { path = "../../../🛂️manifest/🎞️media/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
