[package]
workspace = "../../../.."
name = "semio-framework-job"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Resumable interactive job protocol, original caller authority, funded payload results and paid physical retirement."

[package.metadata.semio]
role = "framework"
id = "job"

[lints]
workspace = true

[lib]
name = "semio_framework_job"
path = "🦀️.rs"

[features]
testkit = ["semio-framework-async/testkit"]

[dependencies]
semio-framework-trace = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-shared-issuance = { path = "../../../🌱️value/♻️retirement/🔗️arc-custody/🔒️sealed/📦️packages/🦀️rust" }
