[package]
workspace = "../../../../../.."
name = "semio-framework-job-payload"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Job payload custody: the paid payload pages and operation ledger, the in-place payload builder, staged source and original page handoff, funded through the job step."

[package.metadata.semio]
role = "framework"
id = "job-payload"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_job_payload"
path = "🦀️.rs"

[dependencies]
semio-framework-value-derive = { workspace = true }
semio-framework-value-retained-clone = { path = "../../../../../🌱️value/🧬️retained-clone/🧬️contract/📦️packages/🦀️rust" }
semio-framework-value-control-contract = { path = "../../../../../🌱️value/🎟️control/🧬️contract/📦️packages/🦀️rust" }
semio-framework-trace = { workspace = true }
semio-framework-value-retirement = { path = "../../../../../🌱️value/♻️retirement/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-value-testing-effect-bank = { path = "../../../../../🌱️value/🧪️testing/📥️admission/🎟️effect/📦️packages/🦀️rust" }
semio-framework-value-testing-allocator = { path = "../../../../../🌱️value/🧪️testing/💾️allocator/📦️packages/🦀️rust" }
serde_json = "1.0.140"
semio-framework-trace-memory-testing = { path = "../../../../../⏱️trace/🧮️memory/🧪️testing/📥️requests/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true, features = ["testkit"] }

[[test]]
name = "original-page-transfer"
path = "../../../📖️source/📦️page-transfer/🧪️tests/🦀️.rs"

[[test]]
name = "dense-page-prefix"
path = "../../📄️prefix/🧪️tests/🦀️.rs"

[[test]]
name = "original-header-initialization"
path = "../../🧪️tests/🏗️initialization/🦀️.rs"

[[test]]
name = "original-builder-close"
path = "../../♻️close/🧪️tests/🦀️.rs"

[[test]]
name = "original_payload_admission"
path = "../../🏭️admission/🧪️tests/🦀️.rs"
