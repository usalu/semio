[package]
workspace = "../../../../.."
name = "semio-framework-job-receiving"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Original native decoder and recipient custody across funded caller turns."

[package.metadata.semio]
role = "framework"
id = "job-receiving"

