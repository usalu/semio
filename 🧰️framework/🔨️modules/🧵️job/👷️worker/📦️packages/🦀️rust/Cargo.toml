[package]
workspace = "../../../../.."
name = "semio-framework-job-worker"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "job-worker"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
testkit = ["semio-framework-job/testkit"]

[dependencies]
semio-framework-job-worker-authority = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-trace = { workspace = true }
semio-framework-job-payload = { workspace = true }

[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
serde_json = { workspace = true }
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-job-conformance = { workspace = true }

[[test]]
name = "original-payload"
required-features = ["testkit"]
path = "../../📬️payload/🧪️tests/🦀️.rs"

[[test]]
name = "original-normal-failure"
required-features = ["testkit"]
path = "../../⚠️failure/🧪️tests/🦀️.rs"

[[test]]
name = "original-staged-metadata"
required-features = ["testkit"]
path = "../../🚪️admission/🚚️staged/🎟️metadata/🧪️tests/🌍️public/🦀️.rs"

[[test]]
name = "original-worker-turn"
required-features = ["testkit"]
path = "../../🎟️turn/🧪️tests/🦀️.rs"

[[test]]
name = "original-native-preparation"
required-features = ["testkit"]
path = "../../🚪️admission/🏗️preparation/🧪️tests/🌍️public/🦀️.rs"
