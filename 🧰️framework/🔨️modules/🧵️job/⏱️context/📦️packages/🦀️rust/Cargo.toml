[package]
workspace = "../../../../.."
name = "semio-framework-job-context"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Genuine original caller context, source authority, prepaid continuation and retained protocol custody."

[package.metadata.semio]
role = "framework"
id = "job-context"

[package.metadata.semio.rust-source-boundary]
