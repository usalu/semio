[package]
workspace = "../../../../../.."
name = "semio-framework-dsl-record-derive"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "dsl-record-derive"

[lints]
workspace = true

[lib]
name = "semio_framework_dsl_record_derive"
path = "../../🦀️.rs"
proc-macro = true

[dependencies]
# 🧷️ `visit`/`visit-mut` pinned: `wasm-bindgen-macro-support` requests them in some hub components, and one host `syn` feature set keeps every component on the same proc-macro units.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
serde_json = "1.0"
