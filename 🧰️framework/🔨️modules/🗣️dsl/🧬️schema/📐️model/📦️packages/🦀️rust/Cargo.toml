[package]
workspace = "../../../../../.."
name = "semio-framework-dsl-record-model"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "dsl-record-model"

[package.metadata.semio.rust-source-boundary]
