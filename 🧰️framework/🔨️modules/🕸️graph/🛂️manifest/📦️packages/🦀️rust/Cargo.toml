[package]
workspace = "../../../../.."
name = "semio-framework-graph-manifest"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Compile-time graph manifest kernel: schema, registry, property values and strict validation."

[package.metadata.semio]
role = "framework"
id = "graph-manifest"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_graph_manifest"
path = "../../🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-derive = { path = "../../../../🌱️value/✨️derive/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-replication = { path = "../../../../📡️replication/📦️packages/🦀️rust" }

[dev-dependencies]
serde_json = "1"
