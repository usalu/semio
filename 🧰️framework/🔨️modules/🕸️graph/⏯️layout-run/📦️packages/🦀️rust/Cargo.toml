[package]
name = "semio-framework-graph-layout-run"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Domain-neutral, stepped, cancellable force-directed layout run: an InteractiveJob a ToolRun runJob drives (one iteration per fuel unit, Barnes-Hut repulsion, per-node entity trace verdicts, iterations/energy/displacement counters, provisional move ops through a caller encoder, compaction checkpoints and resume). Ticket 26/09/13/INTERACTIVE-TOOLS-VISIBLE-PROCESS lane W3-F."

[package.metadata.semio]
role = "framework"
id = "graph-layout-run"

[lints]
workspace = true

[lib]
name = "semio_framework_graph_layout_run"
path = "🦀️.rs"

[dependencies]
# 🎒️ `ToValue`/`FromValue` derives; the derive output is rooted at `::semio_framework_os_kernel::`.
semio-framework-os-kernel = { workspace = true }
semio-framework-hash = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-tool-run = { workspace = true }
# 🗣️ `LocalizedLabel` lives in the declarative-only `wgpu` feature (no `wgpu` crate).
ui = { path = "../../../../🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"] }
serde = { workspace = true }
# 🔮️ Third-party oracle behind the test-only `testing` feature: consumer crates enable it from their dev-dependencies.
fdg-sim = { version = "0.9.1", optional = true }

[features]
testing = ["dep:fdg-sim"]

[dev-dependencies]
serde_json = { workspace = true }
# 🔮️ Third-party oracle (test-only): Fruchterman-Reingold layouts to compare normalized stress against.
fdg-sim = "0.9.1"
