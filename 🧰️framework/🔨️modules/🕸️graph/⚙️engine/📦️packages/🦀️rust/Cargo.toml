[package]
workspace = "../../../../.."
name = "semio-framework-graph-engine"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Pure graph foundation: topology markers, node, handle and edge kinds, storage, views and flow networks."

[package.metadata.semio]
role = "framework"
id = "graph-engine"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
name = "semio_framework_graph_engine"
path = "../../🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-value-derive = { path = "../../../../🌱️value/✨️derive/📦️packages/🦀️rust" }
geometry = { path = "../../../../📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-graph-manifest = { path = "../../../../🕸️graph/🛂️manifest/📦️packages/🦀️rust" }
