[package]
workspace = "../../../.."
name = "semio-framework-onboarding"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[package.metadata.semio]
role = "framework"
id = "onboarding"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-manifest-actions = { path = "../../../🛂️manifest/🕹️actions/📦️packages/🦀️rust" }
semio-framework-manifest-address = { path = "../../../🛂️manifest/🧭️address/📦️packages/🦀️rust" }
semio-framework-manifest-arg-schema = { path = "../../../🛂️manifest/🧮️arg-schema/📦️packages/🦀️rust" }
replication = { package = "semio-framework-replication", path = "../../../📡️replication/📦️packages/🦀️rust" }
semio-framework-ui-locale = { path = "../../../🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../🌱️value/📦️packages/🦀️rust" }
serde = { workspace = true }
serde_json = { workspace = true }
semio-framework-ui-declaration = { path = "../../../🖱️ui/📜️declaration/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../🎒️pack/🔤️json/📦️packages/🦀️rust" }
