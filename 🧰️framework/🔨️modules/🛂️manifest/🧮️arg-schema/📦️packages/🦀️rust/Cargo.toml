[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../../🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-framework-pack-json-native-input = { path = "../../../../🎒️pack/🔤️json/📥️decode/🪪️native-input/📦️packages/🦀️rust" }
semio-framework-job = { path = "../../../../🧵️job/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-trace = { path = "../../../../⏱️trace/📦️packages/🦀️rust" }
serde_json = { workspace = true }
