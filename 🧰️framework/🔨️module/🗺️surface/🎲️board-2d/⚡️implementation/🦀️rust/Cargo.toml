[package]
name = "semio-framework-os-kernel-surface-board-2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle board (2d) rendering surface — WebGPU canvas session over puzzle_2d_engine's headless compute"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# 🪶️ REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT. Applies when 📜️script.ts builds with wasm-pack
# `--profile wasm-release` (wasm-pack 0.15+ maps any custom profile name to this `custom` section,
# ignoring `profile.release` above). Runs after wasm-bindgen, mirroring os-dev's plugin -Oz post-pass
# (WASM_OPT_ARGS) minus `--low-memory-unused`: this module's stack-first memory layout means the
# "low 1KB is unused" assumption binaryen makes for that flag is unverified here.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-bulk-memory-opt", "--enable-call-indirect-overlong", "--enable-extended-const", "--enable-multivalue", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-reference-types", "--enable-sign-ext"]

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../🎲️board-2d/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
puzzle_2d_engine = { path = "../../../../../../✏️s/🔌️plugin/🧩️puzzle/🎛️app/◻2d/🔨️module/⚙️engine/⚡️implementation/🦀️rust", package = "semio-s-app-puzzle-2d-engine" }
puzzle_2d = { path = "../../../../../../✏️s/🔌️plugin/🧩️puzzle/🎛️app/◻2d/⚡️implementation/🦀️rust", package = "semio-s-app-puzzle-2d" }
store = { path = "../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store" }
mathematical_geometry = { path = "../../../../../../🧰️framework/🔨️module/🧮️math/📐️geometry/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-geometry" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
