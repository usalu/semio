[package]
name = "semio-framework-os-kernel-surface-tiled-map"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../🗺️tiled-map/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
ui_styling = { path = "../../../../🖱️ui/🎨️styling/⚡️implementation/🦀️rust", package = "semio-framework-ui-styling" }
infinite_canvas = { path = "../../../../../🛍️product/💻️os/🔨️module/♾️infinite/🖼️canvas/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
image = { version = "0.25", default-features = false, features = ["png"] }
prost = "0.13"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement", "Window"] }
