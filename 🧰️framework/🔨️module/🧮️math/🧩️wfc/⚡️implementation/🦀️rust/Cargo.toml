[package]
name = "semio-framework-os-kernel-math-wfc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lints]
workspace = true

[lib]
name = "mathematical_wfc"
crate-type = ["rlib"]
path = "../../../🧩️wfc/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
mathematical_graph = { path = "../../../🕸️graph/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph" }
mathematical_random = { path = "../../../🎲️random/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-random" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
mathematical_entropy = { path = "../../../🎲️entropy/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-entropy" }
