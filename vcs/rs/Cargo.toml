[package]
name = "vcs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Generic document VCS engine — Operation/Edit/Change/Checkpoint/Alternative, materialize-by-replay, backbone"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
dsl_core = { path = "../../dsl/core/rs" }
dsl = { path = "../../dsl/rs" }
pack = { path = "../../pack/rs" }
semio-framework-core = { path = "../../framework/core/rs" }
semio-framework-hash = { path = "../../framework/hash/rs" }
# 🎞️ CW3 kernel cut-over: Operation/OperationDiff/OpText/OperationMeta/Edit/collection-kit/
# merge_concurrent_diffs now canonically live in `protocol` (protocol_command/protocol_crdt);
# vcs re-exports them as a temporary shim (see the `🚧TEMPORARY` block near the top of lib.rs).
protocol = { path = "../../protocol/rs" }
# 🎞️ CW3: content-addressed checkpoint ids + `OperationMeta.payload_hash` — `pack::content_hash`
# reads a pack FILE's footer (wrong tool for hashing arbitrary bytes), so this crate hashes directly
# with blake3 (the same primitive `pack_core::ContentHash`/`protocol_format::Blake3Hasher` use).
blake3 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.83", features = ["Window", "Storage"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.20.0"
