[package]
name = "vcs-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:vcs"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "vcs"
ports = { react = 6075, wgpu = 6175 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

