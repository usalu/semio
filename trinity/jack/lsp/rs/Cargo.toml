[package]
name = "trinity_jack_lsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
mathematical_graph_dsl = { path = "../../../../mathematical/graph/dsl/rs" }
trinity_jack = { path = "../../core/rs" }
trinity_ram = { path = "../../../ram/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
