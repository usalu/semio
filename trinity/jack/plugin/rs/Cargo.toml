[package]
name = "trinity-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:trinity"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
trinity_jack = { path = "../../core/rs" }
trinity_ram = { path = "../../../ram/rs" }
mathematical_core = { path = "../../../../mathematical/core/rs" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
vcs = { path = "../../../../vcs/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
