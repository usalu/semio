[package]
name = "trinity-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:trinity"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "trinity-jack"
app = "trinity-jack-play"
aliases = ["trinity jack"]
ports = { react = 6054, wgpu = 6154 }

[[package.metadata.semio.playground]]
variant = "trinity-rewrite"
app = "trinity-rewrite-play"
aliases = ["trinity rewrite"]
ports = { react = 6056, wgpu = 6156 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
trinity_jack = { path = "../../jack/core/rs" }
trinity_rewrite = { path = "../../rewrite/engine/rs" }
trinity_ram = { path = "../../ram/rs" }
mathematical_graph_drawing = { path = "../../../s/kernel/mathematical/graph/drawing/rs", package = "semio-s-kernel-mathematical-graph-drawing" }
mathematical_geometry = { path = "../../../s/kernel/mathematical/geometry/rs", package = "semio-s-kernel-mathematical-geometry" }
semio-framework-program = { path = "../../../framework/program/rs" }
vcs = { path = "../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

