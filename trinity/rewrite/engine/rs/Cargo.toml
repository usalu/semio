[package]
name = "trinity_rewrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../vcs/rs" }
trinity_jack = { path = "../../../jack/core/rs" }
trinity_ram = { path = "../../../ram/rs" }
infinite_board_port_directed = { path = "../../../../infinite/board/port/directed/rs" }
infinite_board_port_directed_normal = { path = "../../../../infinite/board/port/directed/normal/rs" }
infinite_cavas = { path = "../../../../infinite/cavas/rs" }
ui_styling = { path = "../../../../ui/styling/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
