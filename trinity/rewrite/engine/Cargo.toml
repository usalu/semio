[package]
name = "trinity_rewrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
trinity_jack = { path = "../../jack/core" }
trinity_ram = { path = "../../ram" }
mathematical_graph_port_directed = { path = "../../../mathematical/graph/port/directed" }
mathematical_core = { path = "../../../mathematical/core" }
infinite_cavas = { path = "../../../infinite/cavas/rs" }
ui_styling = { path = "../../../ui/styling/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
