[package]
name = "trinity_ram"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_core = { path = "../../mathematical/core" }
mathematical_graph_manifest = { path = "../../mathematical/graph/manifest" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
