[package]
name = "fem-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:fem"

[[package.metadata.semio.playground]]
variant = "fem2d"
app = "fem2d-play"
aliases = ["fem 2d"]
ports = { react = 6086, wgpu = 6186 }

[[package.metadata.semio.playground]]
variant = "fem3d"
app = "fem3d-play"
aliases = ["fem 3d"]
ports = { react = 6087, wgpu = 6187 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
fem_2d = { path = "../../2d/rs" }
fem_3d = { path = "../../3d/rs" }
fem_core = { path = "../../core/rs" }
semio-framework-program = { path = "../../../framework/program/rs" }
vcs = { path = "../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
