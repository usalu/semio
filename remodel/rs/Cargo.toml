[package]
name = "remodel_document"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../framework/core/rs" }
vcs = { path = "../../vcs/rs" }
store = { path = "../../store/rs" }
protocol = { path = "../../protocol/rs" }
dsl = { path = "../../dsl/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
