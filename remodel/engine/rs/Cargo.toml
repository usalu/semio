[package]
name = "remodel_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
remodel_image = { path = "../../image/rs" }
remodel_video = { path = "../../video/rs" }
remodel_camera = { path = "../../camera/rs" }
remodel_feature = { path = "../../feature/rs" }
remodel_sfm = { path = "../../sfm/rs" }
remodel_dense = { path = "../../dense/rs" }
remodel_mesh = { path = "../../mesh/rs" }
remodel_motion = { path = "../../motion/rs" }
remodel_geo = { path = "../../geo/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
mathematical_random = { path = "../../../s/kernel/mathematical/random/rs", package = "semio-s-kernel-mathematical-random" }

[dev-dependencies]
mathematical_lie = { path = "../../../s/kernel/mathematical/lie/rs", package = "semio-s-kernel-mathematical-lie" }
mathematical_algebra = { path = "../../../s/kernel/mathematical/algebra/rs", package = "semio-s-kernel-mathematical-algebra" }
