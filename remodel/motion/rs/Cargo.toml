[package]
name = "remodel_motion"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
remodel_image = { path = "../../image/rs" }
remodel_feature = { path = "../../feature/rs" }
remodel_camera = { path = "../../camera/rs" }
remodel_sfm = { path = "../../sfm/rs" }
mathematical_algebra = { path = "../../../framework/kernel/mathematical/algebra/rs", package = "semio-framework-kernel-mathematical-algebra" }
mathematical_signal = { path = "../../../framework/kernel/mathematical/signal/rs", package = "semio-framework-kernel-mathematical-signal" }
mathematical_lie = { path = "../../../framework/kernel/mathematical/lie/rs", package = "semio-framework-kernel-mathematical-lie" }
mathematical_optimize = { path = "../../../framework/kernel/mathematical/optimize/rs", package = "semio-framework-kernel-mathematical-optimize" }
mathematical_spatial = { path = "../../../framework/kernel/mathematical/spatial/rs", package = "semio-framework-kernel-mathematical-spatial" }
