[project]
name = "monorepo"
version = "0.1.0"
description = "🐍️ compose monorepo Python workspace"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ueli Saluz", email = "ueli@semio-tech.com" }]
dependencies = []

[tool.uv.workspace]
members = ["compose/py", "compose/engine"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.6.0",
    "ipykernel>=7.3.0",
    "ruff>=0.15.18",
    "black>=26.5.1",
    "pandas>=3.0.3",
    "numpy>=2.5.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.0",
    "scipy>=1.18.0",
    "scikit-learn>=1.5.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "deepdiff>=9.1.0",
    "mercantile>=1.2.1",
]

# 🧪️ This Pytest configuration is COMPOSE-SCOPED and must stay that way: `testpaths` names only
# `compose/py` and `compose/engine`. Non-compose Python tests are NOT discovered through it. They are
# owned by their language-neutral domain owner as `🧪️tests/<case>/🐍️component.py` adapters and are
# executed by the repository's own Python host
# (`🧰️framework/🛍️products/🦑️repo/🔨️modules/🧪️test/📦️packages/🐍️python/🐍️.py`), which loads
# exactly the adapter the coordinator names and needs no discovery configuration at all. Do not widen
# `testpaths` to pull non-compose paths back in — see ticket 26/08/23/END-TO-END-TESTING-REFACTOR.
[tool.pytest.ini_options]
python_files = ["**/engine/main.py", "**/py/main.py", "test_*.py", "*_test.py", "*.test.py"]
testpaths = ["compose/py", "compose/engine"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "quick: fast test, included from the quick level upward",
    "long: slower test, included from the long level upward",
    "exhaustive: slowest test, only run at the exhaustive level",
]

[tool.coverage.run]
relative_files = true
branch = true

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402", "F401"]
