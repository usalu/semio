[project]
name = "monorepo"
version = "0.1.0"
description = "🐍️ Semio repository Python tools"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ueli Saluz", email = "ueli@semio-tech.com" }]
dependencies = []

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.6.0",
    "ipykernel>=7.3.0",
    "ruff>=0.15.18",
    "black>=26.5.1",
    "pandas>=3.0.3",
    "numpy>=2.5.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.0",
    "scipy>=1.18.0",
    "scikit-learn>=1.5.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "deepdiff>=9.1.0",
    "jsonpatch>=1.33",
    "jsonschema>=4.26.0",
    "mercantile>=1.2.1",
    "networkx>=3.6.1",
    "shapely>=2.1.2",
    "lxml>=6.1.3",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "html5lib>=1.1",
    "steputils>=0.1",
    "ifcopenshell==0.8.4.post1",
    "anastruct>=1.6.1",
    "scikit-fem>=10.0.2",
    "PyNiteFEA>=1.1.6",
]

[tool.pytest.ini_options]
python_files = ["🐍️.py"]
testpaths = ["🧰️framework", "✏️s", "♻️mit-bestand"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "quick: fast test, included from the quick level upward",
    "long: slower test, included from the long level upward",
    "exhaustive: slowest test, only run at the exhaustive level",
]

[tool.coverage.run]
relative_files = true
branch = true
