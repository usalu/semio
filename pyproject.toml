[project]
name = "monorepo"
version = "0.1.0"
description = "🐍 semio monorepo Python workspace"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ueli Saluz", email = "ueli@semio-tech.com" }]
dependencies = []

[tool.uv.workspace]
members = ["semio/py", "semio/engine"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.3.2",
    "ipykernel>=6.29.5",
    "ruff>=0.15.15",
    "black>=25.1.0",
    "debugpy>=1.8.21",
    "pandas>=2.2.0",
    "numpy>=2.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "deepdiff>=8.0.0",
]

[tool.pytest.ini_options]
python_files = ["**/engine/main.py", "**/py/main.py", "test_*.py", "*_test.py", "*.test.py"]
testpaths = ["semio/py", "semio/engine"]
addopts = "--import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402", "F401"]
