[package]
name = "imperative-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:imperative"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
imperative_core = { path = "../../core/rs" }
imperative_engine = { path = "../../engine/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../../vcs/rs" }

