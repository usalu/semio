[package]
name = "imperative_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
neural_engine = { path = "../../neural/engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
imperative_module_core = { path = "../module/core" }
