[package]
name = "imperative_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
neural_engine = { path = "../../neural/engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
imperative_module_core = { path = "../module/core" }
imperative_module_text = { path = "../module/text" }
imperative_module_math = { path = "../module/math" }
imperative_module_logic = { path = "../module/logic" }
imperative_module_control = { path = "../module/control" }

[dev-dependencies]
imperative_module_core = { path = "../module/core" }
imperative_module_text = { path = "../module/text" }
imperative_module_math = { path = "../module/math" }
imperative_module_logic = { path = "../module/logic" }
imperative_module_control = { path = "../module/control" }
