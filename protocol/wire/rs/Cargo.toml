[package]
name = "protocol_wire"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol hub wire frames — lane-tagged client/server frame types shared by native and wasm sync clients"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
protocol_core = { path = "../../core/rs" }
protocol_causal = { path = "../../causal/rs" }
protocol_command = { path = "../../command/rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
