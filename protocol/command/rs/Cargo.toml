[package]
name = "protocol_command"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol command layer — Operation/OperationDiff/OpText traits, OperationMeta, Edit, collection ops, descriptor registry"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
protocol_core = { path = "../../core/rs" }
dsl_core = { path = "../../../dsl/core/rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
