[package]
name = "protocol_testkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol testkit — seeded generators, law assertions, corruption fuzzing, benchmarks"


[lints]
workspace = true
[lib]
path = "lib.rs"

[[bench]]
name = "protocol"
harness = false

[dependencies]
protocol = { path = "../../rs" }
pack_testkit = { path = "../../../pack/testkit/rs" }
# Genuinely missing from the frozen contract's `Deps:` line: the `protocol` facade re-exports the
# *types* `RecoveryMode`/`RecoveryReport`/`FrameCursor`/etc. but not the free fn `protocol_format::
# recover` or the `HEADER_SIZE`/`REC_*` constants this crate's frame-level laws
# (`assert_zero_copy`/`assert_chain_detects_tamper`/`assert_recovery_truncates_to_commit`/
# `assert_compaction_identity`) need to walk raw record streams and classify frame kinds. Added
# directly rather than routed through `protocol` since the facade deliberately does not re-export
# them (see `protocol/rs/lib.rs`'s own `🔖Reexports` region).
protocol_core = { path = "../../core/rs" }
protocol_format = { path = "../../format/rs" }
# Also genuinely missing from the facade: `protocol_history::{encode_history, decode_history}`
# themselves. `protocol`'s `compile_ops`/`decompile_ops` only round-trip ops *text*, never a
# `protocol::HistoryLog` struct directly — but `HistoryLogGen::generate` (below) produces exactly
# that struct, and the frozen `assert_history_encode_decode_identity`/`assert_history_canonical_
# stable`/`assert_streamed_equals_buffered` law signatures all take `&protocol::HistoryLog`, so
# this crate must call the struct-level codec directly.
protocol_history = { path = "../../history/rs" }
# `OpDagGen`/wire-frame law samples build `serde_json::Value` payloads directly (the facade re-
# exports the frame/envelope *types* that embed `serde_json::Value` but not the `serde_json` crate
# itself), and this crate's own inline tests define local `Operation`/`OperationDiff` fixtures that
# need `#[derive(serde::Serialize, serde::Deserialize)]`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
# Only this crate's own `#[cfg(test)]` `OpText` fixtures reference `dsl_core::TextError`/`TextSpan`
# (the error type `protocol_command::OpText::parse_op` returns) — never the public API surface, so
# it is a dev-dependency, not a regular one.
dsl_core = { path = "../../../dsl/core/rs" }
