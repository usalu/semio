[package]
name = "protocol_format"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol .spr binary container — record framing, commit chain, recovery, zero-copy cursors"


[lints]
workspace = true
[lib]
path = "lib.rs"

[features]
default = ["deflate"]
deflate = ["pack_format/deflate"]

[dependencies]
protocol_core = { path = "../../core/rs" }
pack_core = { path = "../../../pack/core/rs" }
pack_format = { path = "../../../pack/format/rs" }
blake3 = "1"
