[package]
name = "semios_studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Semios studio CQRS store — programs, app instances, media graph, checkpoints"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
framework_vcs = { path = "../../framework/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
