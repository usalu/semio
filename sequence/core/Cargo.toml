[package]
name = "sequence_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
imperative_engine = { path = "../../imperative/engine" }
imperative_module_core = { path = "../../imperative/module/core" }
neural_engine = { path = "../../neural/engine" }
mathematical_graph_port_directed_dag = { path = "../../mathematical/graph/port/directed/dag" }
infinite_cavas = { path = "../../infinite/cavas/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
