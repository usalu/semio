[package]
name = "sequence-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:sequence"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "sequence"
ports = { react = 6077, wgpu = 6177 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
sequence_core = { path = "../../core/rs" }
infinite_board_port_directed_dag = { path = "../../../infinite/board/port/directed/dag/rs" }
semio-framework-program = { path = "../../../framework/program/rs" }
vcs = { path = "../../../vcs/rs" }
store = { path = "../../../store/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

