# 🐳️ quizze.architektur-und-technologie.de — the production service, matching the Dockerfile beside this file.
#
#   docker compose up --build --detach     first start and every update, run in this directory
#   docker compose stop                    before a backup: the SQLite file is copied only while the proctor is stopped
#
# The build context is the repository root, because the builder stage compiles the site and the proctor from source; the
# runtime image carries the binary, the built site and the catalog only.

name: architecture-quiz

services:
  proctor:
    build:
      context: ../../../..
      dockerfile: 🎓️teaching/🏛️architecture/❓️quiz/🚀️deploy/Dockerfile
    image: semio/architecture-quiz:latest
    # 🌐️ Published on the host's loopback only: the proctor speaks plain HTTP, so it belongs behind the TLS-terminating
    # Caddy on this host. Inside the container the bind is 0.0.0.0, which a loopback bind would make unreachable.
    ports:
      - "127.0.0.1:8791:8791"
    environment:
      PROCTOR_MODE: production
      PROCTOR_BIND: 0.0.0.0
      PROCTOR_PORT: "8791"
      # 🛂️ A network bind in production mode is refused without BOTH of these, each naming itself.
      PROCTOR_ALLOWED_ORIGINS: https://quizze.architektur-und-technologie.de
      PROCTOR_TRUSTED_FORWARDING: proxy
    volumes:
      # 🗄️ The whole durable state: proctor.sqlite with its WAL and SHM siblings. Backup unit = this volume, proctor stopped.
      - proctor-data:/srv/quiz/data
    # 🛑️ The proctor closes the database on SIGTERM; give in-flight submissions room before Docker escalates to SIGKILL.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  proctor-data:
