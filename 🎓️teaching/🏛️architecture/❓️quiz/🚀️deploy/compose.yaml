# 🐳️ The architecture quiz proctor stack (`proctor.quizzes.architektur-und-technologie.de`, see `🔣️.json`): the proctor
# and Caddy, which terminates TLS with a certificate it obtains and renews itself. The whole host contract is DNS A/AAAA for
# the proctor host, ports 80 and 443 (tcp and udp) open, and in this directory:
#
#   docker compose up -d        first start and every update (after `git pull`)
#   docker compose stop proctor before a backup: the SQLite file is copied only while the proctor is stopped
#
# The proctor image is pulled from the registry when it is not on the host (`pull_policy: missing`); `build:` compiles it
# from this clone instead (`docker compose build` or `up --build`), e.g. on an architecture the registry does not carry.
# Every default is overridable from the environment or an `.env` file beside this file: PROCTOR_HOST, PROCTOR_TAG,
# PROCTOR_ALLOWED_ORIGINS, QUIZ_HTTP_PORT, QUIZ_HTTPS_PORT.

name: architecture-quiz

services:
  proctor:
    image: ghcr.io/usalu/architecture-quiz-proctor:${PROCTOR_TAG:-latest}
    pull_policy: missing
    build:
      context: ../../../..
      dockerfile: 🎓️teaching/🏛️architecture/❓️quiz/🚀️deploy/Dockerfile
    # 🔒️ Reachable by Caddy on the compose network only, never published: `PROCTOR_TRUSTED_FORWARDING=proxy` (baked into
    # the image with the rest of the production configuration) is true by construction.
    expose:
      - "8791"
    environment:
      PROCTOR_ALLOWED_ORIGINS: ${PROCTOR_ALLOWED_ORIGINS:-https://quizzes.architektur-und-technologie.de}
    volumes:
      # 🗄️ The whole durable state: proctor.sqlite with its WAL and SHM siblings. Backup unit = this volume, proctor stopped.
      - proctor-data:/srv/quiz/data
    # 🛑️ The proctor closes the database on SIGTERM; give in-flight submissions room before Docker escalates to SIGKILL.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${QUIZ_HTTP_PORT:-80}:80"
      - "${QUIZ_HTTPS_PORT:-443}:443"
      - "${QUIZ_HTTPS_PORT:-443}:443/udp"
    environment:
      PROCTOR_HOST: ${PROCTOR_HOST:-proctor.quizzes.architektur-und-technologie.de}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 🔐️ ACME account and certificates; losing it re-issues certificates and can hit the CA's rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      proctor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  proctor-data:
  caddy-data:
  caddy-config:
