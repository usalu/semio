cargo-features = ["trim-paths"]

[package]
name = "staffage-dwg"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Staffage archive DWG export: ModelScene JSON to a genuine AC1024 drawing through a self-contained writer with no dependencies; CLI and raw C-ABI wasm."

[lib]
name = "staffage_dwg"
path = "🦀️.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "staffage-dwg"
path = "🚀️cli/🦀️.rs"

[[test]]
name = "dwg_reopen"
path = "../../../../../🧪️tests/🖊️dwg-reopen/🦀️.rs"

[[test]]
name = "dwg_format"
path = "../../../../../🧪️tests/🖊️dwg-format/🦀️.rs"

[dependencies]

[dev-dependencies]
serde_json = "1.0.149"
acadrust = { version = "0.5.5", default-features = false }
ezdwg-core = "0.19.2"

[workspace]
