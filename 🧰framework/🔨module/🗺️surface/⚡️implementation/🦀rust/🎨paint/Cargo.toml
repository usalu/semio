[package]
name = "framework_surface_paint"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../../../../🧰framework/🔨module/🗺️surface/⚡️implementation/🦀rust/🎨paint/📦lib.rs"

[dependencies]
ui_styling = { path = "../../../../../../🧰framework/🔨module/🖱️ui/⚡️implementation/🦀rust/🎨styling", package = "ui_styling" }
infinite_cavas = { path = "../../../../../../🧰framework/🛍️product/💻os/🔨module/♾️infinite/⚡️implementation/🦀rust/🖼️canvas", package = "semio-framework-os-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
