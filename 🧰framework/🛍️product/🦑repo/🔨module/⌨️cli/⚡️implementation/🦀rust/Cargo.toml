[package]
name = "repo_cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "semio monorepo orchestrator CLI + TUI dashboard (binary: semio)"


[lints]
workspace = true
[lib]
path = "../../../../../../../🧰framework/🛍️product/🦑repo/🔨module/⌨️cli/⚡️implementation/🦀rust/📦lib.rs"

[[bin]]
name = "semio"
path = "../../../../../../../🧰framework/🛍️product/🦑repo/🔨module/⌨️cli/⚡️implementation/🦀rust/📦main.rs"

[dependencies]
ui_tui = { path = "../../../../../../🔨module/🖱️ui/⌨️tui/⚡️implementation/🦀rust", features = ["terminal"], package = "ui_tui" }
ui_styling = { path = "../../../../../../🔨module/🖱️ui/🎨styling/⚡️implementation/🦀rust", package = "ui_styling" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
