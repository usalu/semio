[package]
name = "semio-framework-os-kernel-neural-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "neural_engine"
crate-type = ["rlib"]
path = "../../../⚙️engine/⚡️implementation/🦀rust/📦lib.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
