[package]
name = "semio-framework-os-kernel-dsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Facade for the token-native declarative DSL engine — re-exports dsl_core/dsl_token/dsl_schema, the DslField/DslVariants runtime traits generated code binds against, and derive macros"


[lints]
workspace = true
[lib]
name = "dsl"
path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🗣️dsl/⚡️implementation/🦀rust/📦lib.rs"

[dependencies]
dsl_core = { path = "../../🫀core/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-dsl-core" }
dsl_schema = { path = "../../🧬schema/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-dsl-schema" }
dsl_derive = { path = "../../✨derive/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-dsl-derive" }
pack = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-pack" }
protocol = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/📡protocol/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-protocol" }
serde_json = "1.0.140"

[dev-dependencies]
store = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🏪store/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
