[package]
name = "semio-s-kernel-flow-module-brep"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "flow_module_brep"
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🌊flow/⚡️implementation/🦀rust/🔨module/📐brep/📦lib.rs"

[features]
default = ["standalone-wasm"]
standalone-wasm = ["dep:wasm-bindgen"]

[dependencies]
flow_module_wasm = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🌊flow/⚡️implementation/🦀rust/🔨module/🕸️wasm", package = "semio-s-kernel-flow-module-wasm" }
kernel_3d_brepkit = { path = "../../../../../../../../../✏️s/🔨module/🧊3d/⚡️implementation/🦀rust/📐brep", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../../../../../../../../✏️s/🔨module/🧊3d/⚡️implementation/🦀rust/📐brep/⚙️engine", package = "semio-framework-os-kernel-3d-brep-engine" }
neural_engine = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🧠neural/⚡️implementation/🦀rust/⚙️engine", package = "semio-framework-os-kernel-neural-engine" }
semio-framework-core = { path = "../../../../../../../../../🧰framework/⚡️implementation/🦀rust", package = "semio-framework-core" }
base64 = "0.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.77"
wasm-bindgen = { version = "0.2.106", optional = true }
