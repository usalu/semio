[package]
name = "semio-framework-os-kernel-protocol-format"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol .spr binary container — record framing, commit chain, recovery, zero-copy cursors"


[lints]
workspace = true
[lib]
name = "protocol_format"
path = "../../../📐format/⚡️implementation/🦀rust/📦lib.rs"

[features]
default = ["deflate"]
deflate = ["pack_format/deflate"]

[dependencies]
protocol_core = { path = "../../../🫀core/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-protocol-core" }
pack_core = { path = "../../../../🎒pack/🫀core/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-pack-core" }
pack_format = { path = "../../../../🎒pack/📐format/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-pack-format" }
blake3 = "1"
