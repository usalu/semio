[package]
name = "semio-framework-os-kernel-pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format facade — re-exports the core/format/value/io/async/http/index layers"


[lints]
workspace = true
[lib]
name = "pack"
path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/📦lib.rs"

[dependencies]
pack_core = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/🫀core", package = "semio-framework-os-kernel-pack-core" }
pack_format = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/📐format", package = "semio-framework-os-kernel-pack-format" }
pack_value = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/🔢value", package = "semio-framework-os-kernel-pack-value" }
pack_io = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/🔌io", package = "semio-framework-os-kernel-pack-io" }
pack_async = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/⏳async", package = "semio-framework-os-kernel-pack-async" }
pack_http = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/🌐http", package = "semio-framework-os-kernel-pack-http" }
pack_index = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust/🔢index", package = "semio-framework-os-kernel-pack-index" }
dsl_schema = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🗣️dsl/⚡️implementation/🦀rust/🧬schema", package = "semio-framework-os-kernel-dsl-schema" }

[features]
default = ["deflate"]
deflate = ["pack_format/deflate"]
ureq = ["pack_http/ureq"]
