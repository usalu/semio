[package]
name = "semio-framework-kernel-infinite-world"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Application-neutral 3D world canvas engine for wgpu renderers"

[lib]
name = "infinite_world"
path = "../../../../../../../../🧰framework/🛍️product/💻os/🔨module/♾️infinite/⚡️implementation/🦀rust/🌍world/📦lib.rs"

[dependencies]
kernel_3d_scene = { path = "../../../../../../../../✏️s/🔨module/🧊3d/⚡️implementation/🦀rust/🎬scene", package = "semio-framework-os-kernel-3d-scene" }
ui_wgpu = { path = "../../../../../../../../🧰framework/🔨module/🖱️ui/⚡️implementation/🦀rust/🧊wgpu", features = ["engine"], package = "ui_wgpu" }
semio-framework-core = { path = "../../../../../../../../🧰framework/⚡️implementation/🦀rust", package = "semio-framework-core" }
framework_surface_terrain = { path = "../../../../../../../../🧰framework/🔨module/🗺️surface/⚡️implementation/🦀rust/🏔️terrain", package = "framework_surface_terrain" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "console",
] }
