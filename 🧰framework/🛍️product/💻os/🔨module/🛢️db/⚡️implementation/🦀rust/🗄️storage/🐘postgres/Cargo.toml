[package]
name = "semio-framework-os-kernel-db-storage-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db storage backend over postgres"

[lints]
workspace = true
[lib]
name = "db_storage_postgres"
path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🛢️db/⚡️implementation/🦀rust/🗄️storage/🐘postgres/📦lib.rs"

[dependencies]
db_core = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🛢️db/⚡️implementation/🦀rust/🫀core", package = "semio-framework-os-kernel-db-core" }
db_storage = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🛢️db/⚡️implementation/🦀rust/🗄️storage", package = "semio-framework-os-kernel-db-storage" }
pack = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-pack" }
blake3 = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
