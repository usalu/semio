[package]
name = "semio-framework-os-kernel-db-storage-sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db storage backend over sqlite"

[lints]
workspace = true
[lib]
name = "db_storage_sqlite"
path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🛢️db/⚡️implementation/🦀rust/🗄️storage/🪶sqlite/📦lib.rs"

[dependencies]
db_core = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🛢️db/⚡️implementation/🦀rust/🫀core", package = "semio-framework-os-kernel-db-core" }
db_storage = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🛢️db/⚡️implementation/🦀rust/🗄️storage", package = "semio-framework-os-kernel-db-storage" }
pack = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🎒pack/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-pack" }
blake3 = "1"

# 🗄️ Same bundled rusqlite version `vcs` already links (single-link-per-workspace constraint —
# see `vcs/rs/Cargo.toml`). Native-only (bundled sqlite's C build doesn't target wasm32-unknown-
# unknown), gated the same way `vcs` gates it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
