[package]
name = "sourcing-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:sourcing"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "sourcing"
app = "sourcing-curate"
aliases = ["curate"]
ports = { react = 6081, wgpu = 6181 }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
sourcing_curate = { path = "../../curate/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
