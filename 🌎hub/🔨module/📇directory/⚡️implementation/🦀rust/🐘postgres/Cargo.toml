# #region 🔖Header
# 2026 Ueli Saluz
# AGPL-3.0
# HubDirectory implementation over PostgreSQL — direct `sqlx-postgres`/`sqlx-core` (not the `sqlx`
# facade), matching the exact precedent in `compose/server/hub/rs/bin.rs`. The scale-out backend for
# multi-node self-hosted deployments; schema bootstrap is `directory/postgres/🛢️schema.sql`.
# #endregion 🔖Header

[package]
name = "hub-directory-postgres"
version = "0.1.0"
edition = "2021"


[lints]
workspace = true
[lib]
path = "../../../../../../🌎hub/🔨module/📇directory/⚡️implementation/🦀rust/🐘postgres/📦lib.rs"

[dependencies]
async-trait = "0.1"
serde_json = "1.0"
uuid = { version = "1.20", features = ["v7"] }
sqlx_core = { package = "sqlx-core", version = "0.8", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx_postgres = { package = "sqlx-postgres", version = "0.8", features = ["uuid", "json"] }
os-hub-directory = { path = "../../../../../../🌎hub/🔨module/📇directory/⚡️implementation/🦀rust", package = "hub-directory" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }
