    directory: "/js/js"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/js/desktop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/js/docs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/py/engine"
