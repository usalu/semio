# Version updates are off: Dependabot works through branches and pull requests, and this repo has no merge path for them
# (one shared worktree, no branches or pull requests). Dependency bumps are normal edits in the shared worktree.
# open-pull-requests-limit: 0 stops version-update pull requests; security alerts stay visible on GitHub.
version: 2
updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/♻️mit-bestand"
      - "/✏️s"
      - "/🌎️hub"
      - "/🎓️teaching"
      - "/🏢️semio-tech"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/✏️s"
      - "/🌎️hub"
      - "/🎓️teaching"
      - "/✏️s/🔌️plugins/*/🏭️bridge"
      - "/✏️s/🔌️plugins/🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/✉️base/🏭️bridge"
      - "/🧰️framework/🛍️products/💻️os/🎚️config/🏭️bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

