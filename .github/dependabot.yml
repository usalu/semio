version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/js/compose"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/js/desktop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/js/docs"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/py/compose"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/py/engine"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/net/Compose"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "FluentValidation"
      - dependency-name: "System.Collections.Immutable"
      - dependency-name: "Microsoft.Data.Sqlite"
  - package-ecosystem: "nuget"
    directory: "/net/Compose.Grasshopper"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "Grasshopper"
      - dependency-name: "System.Drawing.Common"
        versions: [">= 8.0.0"]
      - dependency-name: "System.Resources.Extensions"
        versions: [">= 8.0.0"]
  - package-ecosystem: "nuget"
    directory: "/net/Compose.Tests"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/net/Compose.Grasshopper.Tests"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/go/cli"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/go/mcp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/repo/client"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/go/compose"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/rs/compose"
    schedule:
      interval: "weekly"
