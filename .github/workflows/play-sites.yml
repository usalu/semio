name: play sites (static build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `puzzle-2d-play`/`puzzle-3d-play`/`puzzle-5d-play`/`cad-js-renderer` were removed from this
      # matrix in ticket 26/08/05/STALE-CONFIG-FIXES-AND-CAPABILITY-LINT-REVIVAL: none of the four
      # nx projects exist anymore under any name (verified with a repo-wide grep) and
      # `@semio-tech/cad-js-renderer`'s surviving project.json has no `build` target at all — their
      # standalone static-site builds were superseded by the unified `framework-os-dev` playground
      # build (`bun ./📜️script.ts build <plugin>`), which doesn't fit this one-dist-per-project
      # matrix shape. Re-add once/if a per-plugin static-site build target exists again.
      matrix:
        include:
          - project: "@semio-tech/compose-sketchpad-play"
            dist: compose/client/lib/sketchpad/play/dist
          - project: "@semio-tech/mit-bestand-praesentation-projektetage"
            dist: ♻️mit-bestand/🎤️präsentation/📅️33.projektetage/⚡️implementation/🟦️typescript/dist
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-play-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ matrix.project }}
          restore-keys: |
            nx-play-${{ runner.os }}-
      - name: Install and build ${{ matrix.project }}
        run: |
          bun install --frozen-lockfile
          bun nx run ${{ matrix.project }}:build
      - name: Verify static site artifacts
        run: |
          test -f "${{ matrix.dist }}/index.html"
          test -f "${{ matrix.dist }}/.nojekyll"
          test -f "${{ matrix.dist }}/CNAME"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-dist
          path: ${{ matrix.dist }}
