name: Playwright Tests

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Workspace setup (toolchains)
        run: bun nx run workspace:setup
      - name: Run Storybook Playwright suite
        run: bun nx run workspace:test-storybook
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
      - name: Run Playwright tests (sketchpad)
        run: bun nx run @semio-tech/compose-sketchpad:test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
