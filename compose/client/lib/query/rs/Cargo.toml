[package]
name = "semio-compose-query"
version = "0.1.0"
edition = "2021"


[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
math = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/📦️packages/🦀️rust", package = "semio-framework-math" }
# 🃏️ wave MATHEND (ticket 26/08/12/DISSOLVE-KERNELS-AND-MODULES-INTO-EVENT-SOURCED-ARTIFACTS):
# `math::graph::dsl` relocated to `graph::dsl` (Jack now lives in the framework `🕸️graph` module,
# not `🧮️math`) — this crate's own `math::graph::manifest::PropertyValue` usage is untouched (a
# separate, pre-existing reference, out of this wave's scope; see the wave report).
graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-async = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
pin-project-lite = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio_compose_rs = { path = "../../rs", package = "semio-compose-rs" }
async-graphql = { version = "7.2.1", default-features = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
