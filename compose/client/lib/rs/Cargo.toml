[package]
name = "compose"
version = "0.1.0"
edition = "2021"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../s/kernel/protocol/rs", package = "semio-s-kernel-protocol" }
dsl = { path = "../../../../s/kernel/dsl/rs", package = "semio-s-kernel-dsl" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v7", "serde"] }
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
instant = { version = "0.1", features = ["wasm-bindgen"] }
async-broadcast = "0.7"
futures-lite = "2"
async-channel = "2"
async-executor = "1.13"
async-lock = "3"
# GraphQL control plane: shared by wasm (WASM) and rlib (native tests / future hosts).
async-graphql = { version = "7.2.1", default-features = true }
paste = "1.0"
async-stream = "0.3.6"
futures-channel = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ["console", "Window", "Response", "Request", "RequestInit", "RequestMode", "Headers"] }
serde-wasm-bindgen = "0.6.5"
base64 = "0.22"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.19.0", features = ["js"] }
console_error_panic_hook = "0.1.7"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
chrono = "0.4.43"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
tempfile = "3.21"
walkdir = "2.5"
base64 = "0.22"
ureq = { version = "2.12", features = ["json"] }
