[package]
name = "semio-compose-hub"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[[bin]]
name = "semio-compose-hub"
path = "bin.rs"

[dependencies]
# 🗄️ db + protocol facades (CW6b: compose-hub rebuilt as a thin server on `db::Database`, wired
# over `protocol_wire` — see contract.md "Hub rebuild surface"). `compose`/sqlx-postgres/dashmap
# (bespoke Postgres session-actor storage) are retired; db owns document persistence now.
db = { path = "../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/⚡️implementations/🦀️rust" }
protocol = { path = "../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.20", features = ["v7", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
dashmap = "6"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.26"
