[workspace]

# 🧹️ RUST-WIDE-CLEAN-REFACTOR-CAMPAIGN baseline, kept in sync with the root
# workspace's [workspace.lints] table (this crate is deliberately detached
# into its own single-crate workspace, so it cannot inherit).
[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
# phase B (enable after the T2/T3 waves land): unwrap_used = "warn"

[package]
name = "semio-compose-hub"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[[bin]]
name = "semio-compose-hub"
path = "bin.rs"

[dependencies]
# 🗄️ db + protocol facades (CW6b: compose-hub rebuilt as a thin server on `db::Database`, wired
# over `protocol_wire` — see contract.md "Hub rebuild surface"). `compose`/sqlx-postgres/dashmap
# (bespoke Postgres session-actor storage) are retired; db owns document persistence now.
db = { path = "../../../../🧰️framework/🛍️product/💻️os/🔨️module/🛢️db/⚡️implementation/🦀️rust" }
protocol = { path = "../../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.20", features = ["v7", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
dashmap = "6"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.26"
