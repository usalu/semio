# Docker Compose for compose-hub only: the Rust compose-hub binary, `db`-backed (CW6b). Zero-touch:
# `db::Database` (FsStorage) + compose-hub's own directory/history stores live under COMPOSE_HUB_DATA,
# a plain volume-mounted directory — no external database service.
# #endregion 🔖️Header

services:
  # #region 🔖️Hub
  # Specs: compose-hub Rust backend with embedded /admin dashboard; protect JSON admin APIs with COMPOSE_ADMIN_TOKEN.
  hub:
    image: rust:1.89-bookworm
    restart: unless-stopped
    working_dir: /workspace/compose/hub
    command: ["cargo", "run", "--bin", "compose-hub"]
    environment:
      COMPOSE_HUB_DATA: /data
      LISTEN_ADDR: 0.0.0.0:8788
      COMPOSE_ADMIN_TOKEN: ${COMPOSE_ADMIN_TOKEN:?COMPOSE_ADMIN_TOKEN required for /admin JSON APIs}
      COMPOSE_HUB_DB_PROFILE: ${COMPOSE_HUB_DB_PROFILE:-prod}
      RUST_LOG: ${RUST_LOG:-compose_hub=info,tower_http=info}
    volumes:
      - ../..:/workspace
      - compose_hub_data:/data
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8788"]
      interval: 10s
      timeout: 3s
      retries: 5
  # #endregion 🔖️Hub

volumes:
  compose_hub_data:
