# #region 🔖Header
# 2025 Ueli Saluz <ueli@semio-tech.com>
# AGPL-3.0
# Kubernetes manifests for compose-hub only: Namespace, compose-hub Deployment (`db`-backed, CW6b),
# a PVC for its data root, Service, Ingress. Zero-touch: `db::Database` (FsStorage) + compose-hub's
# own directory/history stores live under COMPOSE_HUB_DATA on the PVC — no external database service.
# Specs: kubectl apply -f k8s.yaml after replacing the Secret placeholder. Hub is single-replica by
# default (in-process SessionDirectory + a single-writer local `db::Database`) — `Recreate` strategy
# ensures the old pod releases the PVC before the new one mounts it.
# #endregion 🔖Header

# #region 🔖Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: compose-hub
# #endregion 🔖Namespace

---
# #region 🔖Secrets
apiVersion: v1
kind: Secret
metadata:
  name: compose-hub-secrets
  namespace: compose-hub
type: Opaque
stringData:
  COMPOSE_ADMIN_TOKEN: "REPLACE_ME_admin_token"
# #endregion 🔖Secrets

---
# #region 🔖Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: compose-hub-config
  namespace: compose-hub
data:
  RUST_LOG: "compose_hub=info,tower_http=info"
  COMPOSE_HUB_DB_PROFILE: "prod"
# #endregion 🔖Config

---
# #region 🔖HubData
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compose-hub-data
  namespace: compose-hub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
# #endregion 🔖HubData

---
# #region 🔖HubService
apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: compose-hub
spec:
  selector:
    app: hub
  ports:
    - name: http
      port: 8788
      targetPort: 8788
# #endregion 🔖HubService

---
# #region 🔖HubDeployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: compose-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hub
  template:
    metadata:
      labels:
        app: hub
    spec:
      containers:
        - name: hub
          image: semio/compose-hub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8788"
            - name: COMPOSE_HUB_DATA
              value: "/data"
            - name: COMPOSE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: compose-hub-secrets
                  key: COMPOSE_ADMIN_TOKEN
            - name: COMPOSE_HUB_DB_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: compose-hub-config
                  key: COMPOSE_HUB_DB_PROFILE
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: compose-hub-config
                  key: RUST_LOG
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 8788
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8788
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: compose-hub-data
# #endregion 🔖HubDeployment

---
# #region 🔖Ingress
# Specs: Terminates HTTP for compose-hub (HTTP API, WebSocket, embedded /admin). Requires an ingress controller (e.g. nginx). Replace host with your cluster DNS name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compose-hub
  namespace: compose-hub
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: compose-hub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  number: 8788
# #endregion 🔖Ingress
