[package]
workspace = "../../../.."
name = "semio-hub-artifact-checkin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Hub-materialized document Check In authority and job registry"

[package.metadata.semio]
role = "hub"
id = "hub-artifact-checkin"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-hub-artifact-authority = { workspace = true }
semio-framework-hash = { path = "../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }

[dev-dependencies]
semio-hub-artifact-authority = { workspace = true, features = ["testkit"] }
semio-s-artifact-gis-gismap = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
protocol = { path = "../../../../../🧰️framework/🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
