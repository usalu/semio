[package]
workspace = "../../../../.."
name = "semio-hub-trinity-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `trinity` plugin component: the one cdylib of `semio-hub-trinity`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:trinity"

[package.metadata.semio]
role = "hub"
deployment-directory = "🔱️trinity"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "trinity-jack"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.trinity.jack@1/*#editor"
aliases = ["trinity jack"]
ports = { react = 6054, wgpu = 6154 }

[[package.metadata.semio.playground]]
variant = "trinity-rewriting"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.trinity.rewriting@1/*#editor"
aliases = ["trinity rewriting"]
ports = { react = 6056, wgpu = 6156 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🔱️trinity/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-trinity = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
