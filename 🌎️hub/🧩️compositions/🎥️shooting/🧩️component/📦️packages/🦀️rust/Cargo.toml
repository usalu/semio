[package]
workspace = "../../../../.."
name = "semio-hub-shooting-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `shooting` plugin component: the one cdylib of `semio-hub-shooting`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:shooting"

[package.metadata.semio]
role = "hub"
deployment-directory = "🎥️shooting"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "shooting"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.shooting.shooting@1/*#editor"
ports = { react = 6019, wgpu = 6119 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
catalog = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/📇️catalog.json"

# 📦️ Carried over verbatim from the old `📡️protocol` sub-crate — the `wasm_bridge` module in
# `🦀️wasm.rs` still builds a wasm-bindgen surface distinct from the WASM Component Model plugin ABI,
# and skipping wasm-opt keeps that dev-loop fast.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🎥️shooting/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-shooting = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
