[package]
workspace = "../../../../.."
name = "semio-hub-animate-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `animate` plugin component: the one cdylib of `semio-hub-animate`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:animate"

[package.metadata.semio]
role = "hub"
deployment-directory = "🎞️animate"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "animate"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
ports = { react = 6051, wgpu = 6151 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🎞️animate/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-animate = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
