[package]
workspace = "../../../../.."
name = "semio-hub-wfc-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `wfc` plugin component: the one cdylib of `semio-hub-wfc`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:wfc"

[package.metadata.semio]
role = "hub"
deployment-directory = "🀄️wfc"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "bitmap"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.wfc.bitmap@1/*#editor"
aliases = ["wfc bitmap"]
ports = { react = 6041, wgpu = 6141 }

[[package.metadata.semio.playground]]
variant = "grid2d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.wfc.grid2d@1/*#editor"
aliases = ["wfc 2d grid"]
ports = { react = 6042, wgpu = 6142 }

[[package.metadata.semio.playground]]
variant = "wfc2d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.wfc.wfc2d@1/*#editor"
aliases = ["wfc 2d"]
ports = { react = 6043, wgpu = 6143 }

[[package.metadata.semio.playground]]
variant = "grid3d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.wfc.grid3d@1/*#editor"
aliases = ["wfc 3d grid"]
ports = { react = 6044, wgpu = 6144 }

[[package.metadata.semio.playground]]
variant = "wfc3d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.wfc.wfc3d@1/*#editor"
aliases = ["wfc 3d"]
ports = { react = 6045, wgpu = 6145 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🀄️wfc/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-wfc = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
