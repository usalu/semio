[package]
workspace = "../../../../.."
name = "semio-hub-fem-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `fem` plugin component: the one cdylib of `semio-hub-fem`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:fem"

[package.metadata.semio]
role = "hub"
deployment-directory = "🏗️fem"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "fem2d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.fem.fem2d@1/*#editor"
aliases = ["fem 2d"]
ports = { react = 6086, wgpu = 6186 }

[[package.metadata.semio.playground]]
variant = "fem3d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.fem.fem3d@1/*#editor"
aliases = ["fem 3d"]
distDir = "✏️s/🔌️plugins/🏗️fem/dist"
ports = { react = 6087, wgpu = 6187 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🏗️fem/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-fem = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
