[package]
workspace = "../../../.."
name = "semio-hub-fem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FEM plugin composition for independently packaged 2D and 3D artifacts"

[lints]
workspace = true

[package.metadata.semio]
role = "hub"

# 📚️ Storybook coverage opt-in — read by `.storybook/📖️stories/🧭️coordination/🟦️.ts`'s `buildGeneratedScopes`, which resolves
# `sourceRoots` against this package's discovered owner root and derives the story glob
# the owner-relative `📖️stories/**/🧪️.story.tsx` glob from package metadata.
[package.metadata.semio.storybook]
id = "fem"
titlePrefix = "🏗️fem"
sourceRoots = ["../../../✏️s/🔌️plugins/🏗️fem"]
storyGlobs = ["../../../✏️s/🔌️plugins/🏗️fem/📖️stories/**/🧪️.story.tsx"]

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-s-artifact-fem-2d = { workspace = true }
semio-s-artifact-fem-3d = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async-macros = { workspace = true }
