[package]
workspace = "../../../../../../.."
name = "semio-hub-stdio-bim-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `stdio-bim` plugin component: the one cdylib of `semio-hub-stdio-bim`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-bim"

[package.metadata.semio]
role = "hub"
deployment-directory = "🏠️stdio-bim"
component-kind = "plugin"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-ifc-2x3"
app = "s.stdio.ifc@2x3/*#editor"
aliases = ["stdio ifc 2x3"]
ports = { react = 6245, wgpu = 6345 }

[[package.metadata.semio.playground]]
variant = "stdio-ifc-2x3-cobie"
app = "s.stdio.ifc@2x3/cobie#editor"
aliases = ["stdio ifc cobie"]
ports = { react = 6246, wgpu = 6346 }

[[package.metadata.semio.playground]]
variant = "stdio-ifc-2x3-cv20"
app = "s.stdio.ifc@2x3/cv20#editor"
aliases = ["stdio ifc coordination view"]
ports = { react = 6247, wgpu = 6347 }

[[package.metadata.semio.playground]]
variant = "stdio-ifc-2x3-sav"
app = "s.stdio.ifc@2x3/sav#editor"
aliases = ["stdio ifc structural analysis view"]
ports = { react = 6248, wgpu = 6348 }

[[package.metadata.semio.playground]]
variant = "stdio-ifc-4"
app = "s.stdio.ifc@4/*#editor"
aliases = ["stdio ifc 4"]
ports = { react = 6249, wgpu = 6349 }

[[package.metadata.semio.playground]]
variant = "stdio-bcf"
app = "s.stdio.bcf@2.1/*#editor"
aliases = ["stdio bcf"]
ports = { react = 6250, wgpu = 6350 }
# /🧩️ Composition Playgrounds

[package.metadata.semio.sources]
artifacts = ["../../../../../../../../✏️s/🔌️plugins/🗄️stdio/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-stdio-bim = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
