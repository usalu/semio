[package]
workspace = "../../../../../.."
name = "semio-hub-stdio-bim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the IFC and BCF building-information apps"

[lints]
workspace = true

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
role = "hub"

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
# 🧩️ Composition Dependencies
semio-s-artifact-stdio-ifc = { workspace = true }
semio-s-artifact-stdio-ifc-2x3-base = { workspace = true }
semio-s-artifact-stdio-ifc-2x3-base-model = { workspace = true }
semio-s-artifact-stdio-ifc-2x3-base-mutations = { workspace = true }
semio-s-artifact-stdio-ifc-2x3-cobie = { workspace = true }
semio-s-artifact-stdio-ifc-2x3-cv20 = { workspace = true }
semio-s-artifact-stdio-ifc-2x3-sav = { workspace = true }
semio-s-artifact-stdio-ifc-4 = { workspace = true }
semio-s-artifact-stdio-ifc-4-model = { workspace = true }
semio-s-artifact-stdio-ifc-4-mutations = { workspace = true }
semio-s-artifact-stdio-bcf = { workspace = true }
# /🧩️ Composition Dependencies
semio-s-artifact-stdio-contract = { workspace = true }
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }

[package.metadata.semio.preparation]
script = "../../../../📦️packages/🦀️rust/📜️script.ts"
command = ["composition", "prepare"]
