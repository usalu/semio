[package]
workspace = "../../../../../../.."
name = "semio-hub-stdio-image-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `stdio-image` plugin component: the one cdylib of `semio-hub-stdio-image`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-image"

[package.metadata.semio]
role = "hub"
deployment-directory = "🖼️stdio-image"
component-kind = "plugin"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-svg"
app = "s.stdio.svg@1.1/*#editor"
aliases = ["stdio svg"]
ports = { react = 6228, wgpu = 6328 }

[[package.metadata.semio.playground]]
variant = "stdio-svg-basic"
app = "s.stdio.svg@1.1/basic#editor"
aliases = ["stdio svg basic"]
ports = { react = 6229, wgpu = 6329 }

[[package.metadata.semio.playground]]
variant = "stdio-svg-tiny"
app = "s.stdio.svg@1.1/tiny#editor"
aliases = ["stdio svg tiny"]
ports = { react = 6230, wgpu = 6330 }

[[package.metadata.semio.playground]]
variant = "stdio-png"
app = "s.stdio.png@1.2/*#editor"
aliases = ["stdio png"]
ports = { react = 6219, wgpu = 6319 }

[[package.metadata.semio.playground]]
variant = "stdio-jpg"
app = "s.stdio.jpg@jfif-1.01/*#editor"
aliases = ["stdio jpeg"]
ports = { react = 6220, wgpu = 6320 }

[[package.metadata.semio.playground]]
variant = "stdio-jpg-baseline"
app = "s.stdio.jpg@jfif-1.01/baseline#editor"
aliases = ["stdio baseline jpeg"]
ports = { react = 6221, wgpu = 6321 }

[[package.metadata.semio.playground]]
variant = "stdio-gif-87a"
app = "s.stdio.gif@87a/*#editor"
aliases = ["stdio gif 87a"]
ports = { react = 6226, wgpu = 6326 }

[[package.metadata.semio.playground]]
variant = "stdio-gif-89a"
app = "s.stdio.gif@89a/*#editor"
aliases = ["stdio gif 89a"]
ports = { react = 6227, wgpu = 6327 }

[[package.metadata.semio.playground]]
variant = "stdio-bmp"
app = "s.stdio.bmp@v3/*#editor"
aliases = ["stdio bitmap"]
ports = { react = 6223, wgpu = 6323 }

[[package.metadata.semio.playground]]
variant = "stdio-tiff"
