[package]
workspace = "../../../../../../.."
name = "semio-hub-stdio-binary-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `stdio-binary` plugin component: the one cdylib of `semio-hub-stdio-binary`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-binary"

[package.metadata.semio]
role = "hub"
deployment-directory = "🔢️stdio-binary"
component-kind = "plugin"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-binary"
app = "s.stdio.binary@raw/*#editor"
aliases = ["stdio binary"]
ports = { react = 6296, wgpu = 6396 }

[[package.metadata.semio.playground]]
variant = "stdio-deflate"
app = "s.stdio.deflate@rfc1950/*#editor"
aliases = ["stdio deflate"]
ports = { react = 6297, wgpu = 6397 }

[[package.metadata.semio.playground]]
variant = "stdio-zip"
app = "s.stdio.zip@2.0/*#editor"
aliases = ["stdio zip"]
ports = { react = 6298, wgpu = 6398 }

[[package.metadata.semio.playground]]
variant = "stdio-zip-iso21320"
app = "s.stdio.zip@2.0/iso21320#editor"
aliases = ["stdio iso zip"]
ports = { react = 6299, wgpu = 6399 }

[[package.metadata.semio.playground]]
variant = "stdio-epw"
app = "s.stdio.epw@energyplus/*#editor"
aliases = ["stdio weather"]
ports = { react = 6300, wgpu = 6400 }
# /🧩️ Composition Playgrounds

[package.metadata.semio.sources]
artifacts = ["../../../../../../../../✏️s/🔌️plugins/🗄️stdio/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-stdio-binary = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
