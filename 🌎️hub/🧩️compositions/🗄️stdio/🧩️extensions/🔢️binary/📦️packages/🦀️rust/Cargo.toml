[package]
workspace = "../../../../../.."
name = "semio-hub-stdio-binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the raw binary, deflate, zip and EnergyPlus weather apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-binary"

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
deployment-directory = "🔢️stdio-binary"
component-kind = "plugin"
role = "hub"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-binary"
app = "s.stdio.binary@raw/*#editor"
aliases = ["stdio binary"]
ports = { react = 6296, wgpu = 6396 }

[[package.metadata.semio.playground]]
variant = "stdio-deflate"
app = "s.stdio.deflate@rfc1950/*#editor"
aliases = ["stdio deflate"]
ports = { react = 6297, wgpu = 6397 }

[[package.metadata.semio.playground]]
variant = "stdio-zip"
app = "s.stdio.zip@2.0/*#editor"
aliases = ["stdio zip"]
ports = { react = 6298, wgpu = 6398 }

[[package.metadata.semio.playground]]
variant = "stdio-zip-iso21320"
app = "s.stdio.zip@2.0/iso21320#editor"
aliases = ["stdio iso zip"]
ports = { react = 6299, wgpu = 6399 }

[[package.metadata.semio.playground]]
variant = "stdio-epw"
app = "s.stdio.epw@energyplus/*#editor"
aliases = ["stdio weather"]
ports = { react = 6300, wgpu = 6400 }
# /🧩️ Composition Playgrounds

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!`). Default-on so this family builds as its own component, and
# switched off by any crate that links it as a library (the stdio census law links every family at once).
default = ["plugin-root"]
plugin-root = ["semio-framework-plugin/component-guest"]

[dependencies]
# 🧩️ Composition Dependencies
semio-s-artifact-stdio-binary = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-deflate = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-zip = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-epw = { workspace = true, features = ["component-app-assembly"] }
# /🧩️ Composition Dependencies
semio-s-artifact-stdio-contract = { workspace = true }
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }

[package.metadata.semio.sources]
artifacts = ["../../../../../../../✏️s/🔌️plugins/🗄️stdio/🗿️artifacts"]

[package.metadata.semio.preparation]
script = "../../../../📦️packages/🦀️rust/📜️script.ts"
command = ["composition", "prepare"]
