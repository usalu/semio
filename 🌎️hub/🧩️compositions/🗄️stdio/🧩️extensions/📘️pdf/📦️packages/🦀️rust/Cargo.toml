[package]
workspace = "../../../../../.."
name = "semio-hub-stdio-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the PDF 1.4 and 1.7 document apps with their ISO profiles"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-pdf"

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
deployment-directory = "📘️stdio-pdf"
component-kind = "plugin"
role = "hub"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-4-a"
app = "s.stdio.pdf@1.4/a#editor"
aliases = ["stdio pdf 1.4 archival"]
ports = { react = 6256, wgpu = 6356 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-4"
app = "s.stdio.pdf@1.4/*#editor"
aliases = ["stdio pdf 1.4"]
ports = { react = 6257, wgpu = 6357 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-4-x"
app = "s.stdio.pdf@1.4/x#editor"
aliases = ["stdio pdf 1.4 print"]
ports = { react = 6258, wgpu = 6358 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7-a"
app = "s.stdio.pdf@1.7/a#editor"
aliases = ["stdio pdf 1.7 archival"]
ports = { react = 6259, wgpu = 6359 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7"
app = "s.stdio.pdf@1.7/*#editor"
aliases = ["stdio pdf 1.7"]
ports = { react = 6260, wgpu = 6360 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7-e"
app = "s.stdio.pdf@1.7/e#editor"
aliases = ["stdio pdf engineering"]
ports = { react = 6261, wgpu = 6361 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7-h"
app = "s.stdio.pdf@1.7/h#editor"
aliases = ["stdio pdf healthcare"]
ports = { react = 6262, wgpu = 6362 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7-ua"
app = "s.stdio.pdf@1.7/ua#editor"
aliases = ["stdio pdf accessible"]
ports = { react = 6263, wgpu = 6363 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7-vt"
app = "s.stdio.pdf@1.7/vt#editor"
aliases = ["stdio pdf variable print"]
ports = { react = 6264, wgpu = 6364 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7-x"
app = "s.stdio.pdf@1.7/x#editor"
aliases = ["stdio pdf 1.7 print"]
ports = { react = 6265, wgpu = 6365 }
# /🧩️ Composition Playgrounds

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!`). Default-on so this family builds as its own component, and
# switched off by any crate that links it as a library (the stdio census law links every family at once).
default = ["plugin-root"]
plugin-root = ["semio-framework-plugin/component-guest"]

[dependencies]
# 🧩️ Composition Dependencies
semio-s-artifact-stdio-pdf = { workspace = true, features = ["component-app-assembly"] }
# /🧩️ Composition Dependencies
semio-s-artifact-stdio-contract = { workspace = true }
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }

[package.metadata.semio.sources]
artifacts = ["../../../../../../../✏️s/🔌️plugins/🗄️stdio/🗿️artifacts"]

[package.metadata.semio.preparation]
script = "../../../../📦️packages/🦀️rust/📜️script.ts"
command = ["composition", "prepare"]
