[package]
workspace = "../../../../../../../../.."
name = "semio-hub-stdio-pdf-1-4-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deployable component of the `stdio-pdf` plugin: the PDF 1.4 editors and viewers, the one cdylib of `semio-hub-stdio-pdf-1-4`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-pdf"

# 🧩️ One deployable component of `stdio-pdf` (`PackageDescriptor.components` names it `semio-hub-stdio-pdf-1-4`): the browser loads it only when
# one of its apps opens, so a page compiles the code of the apps it serves and no other.
[package.metadata.semio]
role = "hub"

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-stdio-pdf-1-4 = { path = "../../../📦️packages/🦀️rust" }
semio-plugin = { workspace = true }
