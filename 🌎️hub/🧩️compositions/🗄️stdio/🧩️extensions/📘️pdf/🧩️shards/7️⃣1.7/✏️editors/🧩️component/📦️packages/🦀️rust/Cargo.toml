[package]
workspace = "../../../../../../../../../.."
name = "semio-hub-stdio-pdf-1-7-editors-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deployable component of the `stdio-pdf` plugin: the PDF 1.7 editors, the one cdylib of `semio-hub-stdio-pdf-1-7-editors`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-pdf"

# 🧩️ One deployable component of `stdio-pdf` (`PackageDescriptor.components` names it `semio-hub-stdio-pdf-1-7-editors`): the browser loads it only when
# one of its apps opens, so a page compiles the code of the apps it serves and no other.
[package.metadata.semio]
role = "hub"

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-stdio-pdf-1-7-editors = { path = "../../../📦️packages/🦀️rust" }
semio-plugin = { workspace = true }
