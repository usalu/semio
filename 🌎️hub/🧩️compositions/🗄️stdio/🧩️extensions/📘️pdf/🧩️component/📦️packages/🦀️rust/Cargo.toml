[package]
workspace = "../../../../../../.."
name = "semio-hub-stdio-pdf-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `stdio-pdf` plugin component: the one cdylib of `semio-hub-stdio-pdf`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-pdf"

[package.metadata.semio]
role = "hub"
deployment-directory = "📘️stdio-pdf"
component-kind = "plugin"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-4-a"
app = "s.stdio.pdf@1.4/a#editor"
aliases = ["stdio pdf 1.4 archival"]
ports = { react = 6256, wgpu = 6356 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-4"
app = "s.stdio.pdf@1.4/*#editor"
aliases = ["stdio pdf 1.4"]
ports = { react = 6257, wgpu = 6357 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-4-x"
app = "s.stdio.pdf@1.4/x#editor"
aliases = ["stdio pdf 1.4 print"]
ports = { react = 6258, wgpu = 6358 }

[[package.metadata.semio.playground]]
variant = "stdio-pdf-1-7-a"
app = "s.stdio.pdf@1.7/a#editor"
aliases = ["stdio pdf 1.7 archival"]
ports = { react = 6259, wgpu = 6359 }

