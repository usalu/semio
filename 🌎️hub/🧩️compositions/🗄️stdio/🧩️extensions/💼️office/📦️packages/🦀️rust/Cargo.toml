[package]
workspace = "../../../../../.."
name = "semio-hub-stdio-office"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the Office Open XML docx/pptx/xlsx apps"

[lints]
workspace = true

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
role = "hub"

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
# 🧩️ Composition Dependencies
semio-s-artifact-stdio-docx = { workspace = true }
semio-s-artifact-stdio-docx-base = { workspace = true }
semio-s-artifact-stdio-docx-base-mutations = { workspace = true }
semio-s-artifact-stdio-docx-strict = { workspace = true }
semio-s-artifact-stdio-docx-strict-mutations = { workspace = true }
semio-s-artifact-stdio-docx-transitional = { workspace = true }
semio-s-artifact-stdio-pptx = { workspace = true }
semio-s-artifact-stdio-pptx-base = { workspace = true }
semio-s-artifact-stdio-pptx-base-model = { workspace = true }
semio-s-artifact-stdio-pptx-base-mutations = { workspace = true }
semio-s-artifact-stdio-pptx-strict = { workspace = true }
semio-s-artifact-stdio-pptx-strict-mutations = { workspace = true }
semio-s-artifact-stdio-pptx-transitional = { workspace = true }
semio-s-artifact-stdio-xlsx = { workspace = true }
semio-s-artifact-stdio-xlsx-base = { workspace = true }
semio-s-artifact-stdio-xlsx-base-model = { workspace = true }
semio-s-artifact-stdio-xlsx-base-mutations = { workspace = true }
semio-s-artifact-stdio-xlsx-strict = { workspace = true }
semio-s-artifact-stdio-xlsx-strict-mutations = { workspace = true }
semio-s-artifact-stdio-xlsx-transitional = { workspace = true }
# /🧩️ Composition Dependencies
semio-s-artifact-stdio-contract = { workspace = true }
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }

[package.metadata.semio.preparation]
script = "../../../../📦️packages/🦀️rust/📜️script.ts"
command = ["composition", "prepare"]
