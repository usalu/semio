[package]
workspace = "../../../../../.."
name = "semio-hub-stdio-office"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the Office Open XML docx/pptx/xlsx apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-office"

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
deployment-directory = "💼️stdio-office"
component-kind = "plugin"
role = "hub"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-docx"
app = "s.stdio.docx@ecma-376/*#editor"
aliases = ["stdio docx"]
ports = { react = 6266, wgpu = 6366 }

[[package.metadata.semio.playground]]
variant = "stdio-docx-strict"
app = "s.stdio.docx@ecma-376/strict#editor"
aliases = ["stdio docx strict"]
ports = { react = 6267, wgpu = 6367 }

[[package.metadata.semio.playground]]
variant = "stdio-docx-transitional"
app = "s.stdio.docx@ecma-376/transitional#editor"
aliases = ["stdio docx transitional"]
ports = { react = 6268, wgpu = 6368 }

[[package.metadata.semio.playground]]
variant = "stdio-pptx"
app = "s.stdio.pptx@ecma-376/*#editor"
aliases = ["stdio pptx"]
ports = { react = 6269, wgpu = 6369 }

[[package.metadata.semio.playground]]
variant = "stdio-pptx-strict"
app = "s.stdio.pptx@ecma-376/strict#editor"
aliases = ["stdio pptx strict"]
ports = { react = 6270, wgpu = 6370 }

[[package.metadata.semio.playground]]
variant = "stdio-pptx-transitional"
app = "s.stdio.pptx@ecma-376/transitional#editor"
aliases = ["stdio pptx transitional"]
ports = { react = 6271, wgpu = 6371 }

[[package.metadata.semio.playground]]
variant = "stdio-xlsx"
app = "s.stdio.xlsx@ecma-376/*#editor"
aliases = ["stdio xlsx"]
ports = { react = 6272, wgpu = 6372 }

[[package.metadata.semio.playground]]
variant = "stdio-xlsx-strict"
app = "s.stdio.xlsx@ecma-376/strict#editor"
aliases = ["stdio xlsx strict"]
ports = { react = 6273, wgpu = 6373 }

[[package.metadata.semio.playground]]
variant = "stdio-xlsx-transitional"
app = "s.stdio.xlsx@ecma-376/transitional#editor"
aliases = ["stdio xlsx transitional"]
ports = { react = 6275, wgpu = 6375 }
# /🧩️ Composition Playgrounds

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!`). Default-on so this family builds as its own component, and
# switched off by any crate that links it as a library (the stdio census law links every family at once).
default = ["plugin-root"]
plugin-root = ["semio-framework-plugin/component-guest"]

[dependencies]
# 🧩️ Composition Dependencies
semio-s-artifact-stdio-docx = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-pptx = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-xlsx = { workspace = true, features = ["component-app-assembly"] }
# /🧩️ Composition Dependencies
semio-s-artifact-stdio-contract = { workspace = true }
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }

[package.metadata.semio.sources]
artifacts = ["../../../../../../../✏️s/🔌️plugins/🗄️stdio/🗿️artifacts"]

[package.metadata.semio.preparation]
script = "../../../../📦️packages/🦀️rust/📜️script.ts"
command = ["composition", "prepare"]
