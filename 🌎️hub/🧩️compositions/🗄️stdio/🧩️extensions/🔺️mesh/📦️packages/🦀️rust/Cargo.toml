[package]
workspace = "../../../../../.."
name = "semio-hub-stdio-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the glTF/OBJ/STL/PLY mesh and LAS point-cloud apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-mesh"

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
deployment-directory = "🔺️stdio-mesh"
component-kind = "plugin"
role = "hub"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
# 🧩️ Composition Playgrounds
[[package.metadata.semio.playground]]
variant = "stdio-gltf"
app = "s.stdio.gltf@2.0/*#editor"
aliases = ["stdio gltf"]
ports = { react = 6251, wgpu = 6351 }

[[package.metadata.semio.playground]]
variant = "stdio-obj"
app = "s.stdio.obj@3.0/*#editor"
aliases = ["stdio obj"]
ports = { react = 6252, wgpu = 6352 }

[[package.metadata.semio.playground]]
variant = "stdio-stl"
app = "s.stdio.stl@ascii/*#editor"
aliases = ["stdio stl"]
ports = { react = 6253, wgpu = 6353 }

[[package.metadata.semio.playground]]
variant = "stdio-ply"
app = "s.stdio.ply@1.0/*#editor"
aliases = ["stdio ply"]
ports = { react = 6254, wgpu = 6354 }

[[package.metadata.semio.playground]]
variant = "stdio-las"
app = "s.stdio.las@1.0/*#editor"
aliases = ["stdio las"]
ports = { react = 6255, wgpu = 6355 }
# /🧩️ Composition Playgrounds

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!`). Default-on so this family builds as its own component, and
# switched off by any crate that links it as a library (the stdio census law links every family at once).
default = ["plugin-root"]
plugin-root = ["semio-framework-plugin/component-guest"]

[dependencies]
# 🧩️ Composition Dependencies
semio-s-artifact-stdio-gltf = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-obj = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-stl = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-ply = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-las = { workspace = true, features = ["component-app-assembly"] }
# /🧩️ Composition Dependencies
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-plugin = { workspace = true }

[package.metadata.semio.sources]
artifacts = ["../../../../../../../✏️s/🔌️plugins/🗄️stdio/🗿️artifacts"]

[package.metadata.semio.preparation]
script = "../../../../📦️packages/🦀️rust/📜️script.ts"
command = ["composition", "prepare"]
