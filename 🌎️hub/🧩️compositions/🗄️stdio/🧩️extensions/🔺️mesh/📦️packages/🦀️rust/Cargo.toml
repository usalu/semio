[package]
workspace = "../../../../../.."
name = "semio-hub-stdio-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the glTF/OBJ/STL/PLY mesh and LAS point-cloud apps"

[lints]
workspace = true

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
role = "hub"

[lib]
path = "../../🦀️.rs"

[dependencies]
# 🧩️ Composition Dependencies
semio-s-artifact-stdio-gltf = { workspace = true }
semio-s-artifact-stdio-gltf-model = { workspace = true }
semio-s-artifact-stdio-gltf-mutations = { workspace = true }
semio-s-artifact-stdio-gltf-editor = { workspace = true }
semio-s-artifact-stdio-obj = { workspace = true }
semio-s-artifact-stdio-stl = { workspace = true }
semio-s-artifact-stdio-ply = { workspace = true }
semio-s-artifact-stdio-las = { workspace = true }
# /🧩️ Composition Dependencies
semio-s-artifact-stdio-contract = { workspace = true }
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }

[package.metadata.semio.preparation]
script = "../../../../📦️packages/🦀️rust/📜️script.ts"
command = ["composition", "prepare"]
