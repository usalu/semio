[package]
workspace = "../../../.."
name = "semio-hub-puzzle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle plugin composition for independently packaged 2D, 3D, and 5D artifacts"

[lints]
workspace = true

[package.metadata.semio]
role = "hub"

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-s-artifact-puzzle-3d-editor = { workspace = true }
semio-s-artifact-puzzle-3d-model = { workspace = true }
semio-s-artifact-puzzle-3d-viewer = { workspace = true }
semio-framework-pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-s-artifact-puzzle-2d = { workspace = true }
semio-s-artifact-puzzle-3d = { workspace = true }
semio-s-artifact-puzzle-5d = { workspace = true }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-os-kernel = { workspace = true }
semio-plugin = { workspace = true }
# ⏯️ `dyn_enum_close!` copies `PluginApp::tool_run_trace_delta`'s signature verbatim into the generated
# impl HERE, so the domain-neutral tool-run types have to resolve in this crate too.
semio-framework-tool-run = { workspace = true }

[dev-dependencies]
semio-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async-macros = { workspace = true }
serde_json = { workspace = true }
semio-framework-artifact-reference = { path = "../../../../../🧰️framework/🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust" }
original_owners = { path = "../../../../../🧰️framework/🔨️modules/🧪️test/🛬️original-snapshot-owners/📦️packages/🦀️rust", package = "semio-framework-test-original-snapshot-owners" }
semio-framework-trace = { path = "../../../../../🧰️framework/🔨️modules/⏱️trace/📦️packages/🦀️rust" }
semio-framework-actor = { path = "../../../../../🧰️framework/🔨️modules/🎭️actor/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust" }
semio-framework-async = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/📦️packages/🦀️rust", features = ["entrypoint"] }
semio-framework-pack-json = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-test-fixtures = { path = "../../../../../🧰️framework/🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-plugin-host = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/🖥️host/📦️packages/🦀️rust" }
semio-plugin-interpreter-runtime = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/🧠️interpreter/🏃️runtime/📦️packages/🦀️rust" }
semio-plugin-host-operation = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/🖥️host/🚪️io/🎛️operation/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-job = { workspace = true, features = ["testkit"] }

semio-plugin-plugin-program = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/🏗️builder/🔌️program/📦️packages/🦀️rust" }

[[test]]
name = "guest-io"
path = "../../🧪️tests/🧩️guest-io/🦀️.rs"
