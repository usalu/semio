[package]
workspace = "../../../../.."
name = "semio-hub-remodel-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `remodel` plugin component: the one cdylib of `semio-hub-remodel`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:remodel"

[package.metadata.semio]
role = "hub"
deployment-directory = "📸️remodel"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "remodel"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.remodel.remodeling@1/*#editor"
ports = { react = 6063, wgpu = 6163 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/📸️remodel/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-remodel = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
