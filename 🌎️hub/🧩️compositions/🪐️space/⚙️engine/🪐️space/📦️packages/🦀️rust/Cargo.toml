[package]
workspace = "../../../../../.."
name = "semio-hub-space-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Studio app: artifact app, manifest and dispatch, main window modes and panels"

[package.metadata.semio]
role = "hub"
id = "hub-space-app"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = []

[dependencies]
semio-hub-space-commands-authoring = { workspace = true }
semio-hub-space-commands-media = { workspace = true }
semio-hub-space-foundation = { workspace = true }
semio-hub-space-operations = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-ui-locale = { path = "../../../../../../../🧰️framework/🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-schema-registry = { path = "../../../../../../../🧰️framework/🔨️modules/🧬️schema/📇️registry/📦️packages/🦀️rust" }
semio-framework-2d = { path = "../../../../../../../🧰️framework/🔨️modules/◻️2d/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-s-space-core = { path = "../../../../../../../✏️s/🔌️plugins/🪐️space/🫀️core/📦️packages/🦀️rust" }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["canvas-runtime-assets"] }
semio-framework = { workspace = true }
semio-framework-action-bus = { path = "../../../../../../../🧰️framework/🔨️modules/🎯️action-bus/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-ui-contract = { workspace = true }
semio-framework-ui-scene = { workspace = true }
semio-framework-os = { workspace = true }
serde_json = { workspace = true }
semio-framework-async-macros = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws"] }
