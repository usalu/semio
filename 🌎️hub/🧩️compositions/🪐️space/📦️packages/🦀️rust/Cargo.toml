[package]
workspace = "../../../.."
name = "semio-hub-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "S Studio plugin: OS host shell bundling the Home launcher and Studio apps"

[package.metadata.semio]
role = "hub"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-hub-space-app = { workspace = true }
semio-framework-async = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-s-artifact-space-home = { workspace = true }
semio-s-artifact-space-space = { workspace = true }
semio-s-space-core = { path = "../../../../../✏️s/🔌️plugins/🪐️space/🫀️catalog-documents/📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true, features = ["canvas-runtime-assets"] }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-os = { workspace = true }

[dev-dependencies]
semio-hub-space-commands-media = { workspace = true }
semio-hub-space-foundation = { workspace = true }
semio-hub-space-app = { workspace = true, features = ["testkit"] }
semio-s-artifact-writer-writer = { path = "../../../../../✏️s/🔌️plugins/✒️writer/🗿️artifacts/✒️writer/📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws"] }
# 🌱️ Test-only: every production/`#[cfg(test)]`-adjacent call site now runs on `ToValue`/`FromValue`
# (ticket `26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS`). What remains is the
# `🧪️tests/<case>/🦀️.rs` per-mutation fixture-comparison suite, which deliberately keeps
# `serde_json` as the differential third-party oracle its own assertions are named after (CLAUDE.md:
# "You SHOULD use existing libraries as possible to test our implementation").
serde_json = { workspace = true }
semio-framework-pack-json = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
pack = { workspace = true }
semio-framework-value = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework = { workspace = true }
semio-s-artifact-draw-drawing-examples = { workspace = true }
semio-s-artifact-draw-drawing-model = { workspace = true }
