[package]
workspace = "../../../.."
name = "semio-hub-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "S Studio plugin: OS host shell bundling the Home launcher and Studio apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:space"

[package.metadata.semio]
deployment-directory = "🪐️space"
component-kind = "plugin"
role = "hub"
capabilities = ["localBackboneStorage"]
host = { landing = "home", shell = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
catalog-default = true
devContribution = "✏️s/🧑‍💻dev/🎭️variants/🌍️gis/🧬️schema/🔣️.json"
ports = { react = 6070, wgpu = 6066 }
user_ports = { react = [6072, 6073], wgpu = [6067, 6068] }
# 🔗️ The dashboard offers these as the `hub`, `data` and `local-only` parameters of `playground:s`.
hub = "http://127.0.0.1:8787"
data_dir = ".🧬semio/🔗space/s-dev"
user_data_dir = ".🧬semio/🔗space/s-user{N}"
local_only = true

[[package.metadata.semio.playground]]
variant = "home"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.space.home@1/*#editor"
ports = { react = 6108, wgpu = 6208 }

[[package.metadata.semio.playground]]
variant = "space"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.space.space@1/*#editor"
ports = { react = 6109, wgpu = 6209 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-framework-async = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-diagnostic = { path = "../../../../../🧰️framework/🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-dsl = { path = "../../../../../🧰️framework/🔨️modules/🗣️dsl/📦️packages/🦀️rust" }
semio-framework-dsl-record = { path = "../../../../../🧰️framework/🔨️modules/🗣️dsl/🧬️schema/📦️packages/🦀️rust" }
semio-framework-dsl-record-derive = { path = "../../../../../🧰️framework/🔨️modules/🗣️dsl/🧬️schema/✨️derive/📦️packages/🦀️rust" }
semio-framework-schema-state = { workspace = true }
semio-framework-schema-composition = { workspace = true }
semio-framework-ui-locale = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🌐️locale/📦️packages/🦀️rust" }
semio-framework-schema-registry = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📇️registry/📦️packages/🦀️rust" }
semio-framework-2d = { path = "../../../../../🧰️framework/🔨️modules/◻️2d/📦️packages/🦀️rust", default-features = false }
semio-framework-value = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-s-artifact-space-home = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-space-space = { workspace = true, features = ["component-app-assembly"] }
semio-s-space-core = { path = "../../../../../✏️s/🔌️plugins/🪐️space/🫀️core/📦️packages/🦀️rust" }
semio-framework-artifact-infinite-dag = { workspace = true }
semio-framework-artifact-space-space = { workspace = true }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-dispatch-macros = { workspace = true }
semio-framework = { workspace = true }
semio-framework-job.workspace = true
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
pack = { workspace = true }
base64_codec = { path = "../../../../../🧰️framework/🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust", package = "semio-framework-io-base64" }
semio-framework-artifact-workflow-workflow = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔁️workflow/🗿️artifacts/🔁️workflow/📦️packages/🦀️rust" }
semio-framework-tool-machine = { path = "../../../../../🧰️framework/🔨️modules/🛠️tool-machine/📦️packages/🦀️rust" }
semio-framework-ui-contract = { workspace = true }
semio-framework-ui-scene = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
semio-framework-os = { workspace = true, features = ["space-guest"] }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
semio-framework-os = { workspace = true, features = ["os-host-full"] }

[dev-dependencies]
semio-s-artifact-draw-drawing = { path = "../../../../../✏️s/🔌️plugins/🖍️draw/🗿️artifacts/🖍️drawing/📦️packages/🦀️rust" }
semio-s-artifact-writer-writer = { path = "../../../../../✏️s/🔌️plugins/✒️writer/🗿️artifacts/✒️writer/📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true, features = ["component-guest", "artifact-app-testing"] }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws"] }
semio-framework-hash = { workspace = true }
# 🌱️ Test-only: every production/`#[cfg(test)]`-adjacent call site now runs on `ToValue`/`FromValue`
# (ticket `26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS`). What remains is the
# `🧪️tests/<case>/🦀️.rs` per-mutation fixture-comparison suite, which deliberately keeps
# `serde_json` as the differential third-party oracle its own assertions are named after (CLAUDE.md:
# "You SHOULD use existing libraries as possible to test our implementation").
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.semio.sources]
artifacts = ["../../../../../✏️s/🔌️plugins/🪐️space/🗿️artifacts"]
