[package]
workspace = "../../../../.."
name = "semio-hub-space-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `space` plugin component: the one cdylib of `semio-hub-space`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:space"

[package.metadata.semio]
role = "hub"
deployment-directory = "🪐️space"
component-kind = "plugin"
capabilities = ["localBackboneStorage"]
host = { landing = "home", shell = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
catalog-default = true
devContribution = "✏️s/🧑‍💻dev/🎭️variants/🌍️gis/🧬️schema/🔣️.json"
ports = { react = 6070, wgpu = 6066 }
user_ports = { react = [6072, 6073], wgpu = [6067, 6068] }
# 🔗️ The dashboard offers these as the `hub`, `data` and `local-only` parameters of `playground:s`.
hub = "http://127.0.0.1:8787"
data_dir = ".🧬semio/🔗space/s-dev"
user_data_dir = ".🧬semio/🔗space/s-user{N}"
local_only = true

[[package.metadata.semio.playground]]
variant = "home"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.space.home@1/*#editor"
ports = { react = 6108, wgpu = 6208 }

[[package.metadata.semio.playground]]
variant = "space"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.space.space@1/*#editor"
ports = { react = 6109, wgpu = 6209 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🪐️space/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-space = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
