[package]
workspace = "../../../../.."
name = "semio-hub-draw-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `draw` plugin component: the one cdylib of `semio-hub-draw`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:draw"

[package.metadata.semio]
role = "hub"
deployment-directory = "🖍️draw"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "draw"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.draw.drawing@1/*#editor"
ports = { react = 6064, wgpu = 6164 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🖍️draw/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-draw = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
