[package]
workspace = "../../../.."
name = "semio-hub-norm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Norm plugin — five DIN/ISO/VDI compliance-standard document apps (DIN 4108, DIN EN 16798, DIN V 18599, ISO 16757, VDI 3805) with headless NormHost-backed checking in one hot-swappable WASM component; the Eurocodes live in the norm-eurocode and norm-eurocode-materials extension plugins"

[lints]
workspace = true

[package.metadata.semio]
role = "hub"

[lib]
path = "../../🦀️.rs"

[[test]]
name = "surface_render"
path = "../../🖥️app-surface/🧪️tests/🖥️app-surface/🦀️.rs"

[[test]]
name = "compliance_gate"
path = "../../🧪️tests/🚦️compliance-gate/🦀️.rs"

