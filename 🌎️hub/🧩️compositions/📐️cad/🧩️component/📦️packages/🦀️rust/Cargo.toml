[package]
workspace = "../../../../.."
name = "semio-hub-cad-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `cad` plugin component: the one cdylib of `semio-hub-cad`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:cad"

[package.metadata.semio]
role = "hub"
deployment-directory = "📐️cad"
component-kind = "plugin"
consumes = ["cad.computer"]

[[package.metadata.semio.playground]]
variant = "cad"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.cad.cad@1/*#editor"
ports = { react = 6020, wgpu = 6120 }

[[package.metadata.semio.playground]]
variant = "koordinator"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.cad.cad@1/*#editor"
brand = "entwerfen-mit-bestand-koordinator"
devContribution = "♻️mit-bestand/🧺️demonstrator/🐚️shell/🧬️schema/🔣️.json"
aliases = ["entwerfen-mit-bestand-koordinator"]
ports = { react = 6028, wgpu = 6128 }

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-assets"
app = "s.cad.cad@1/*#editor"
root = "✏️s/🔌️plugins/📐️cad/🗿️artifacts/📐️cad/🏅️standards/🔖️1/🪆️subsets/✳️any/📚️examples/🖼️assets"

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/📐️cad/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-cad = { path = "../../../📦️packages/🦀️rust" }
semio-plugin = { workspace = true }

[dev-dependencies]
semio-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
