[package]
workspace = "../../../../.."
name = "semio-hub-mathematical-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `mathematical` plugin component: the one cdylib of `semio-hub-mathematical`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:mathematical"

[package.metadata.semio]
role = "hub"
deployment-directory = "➗️mathematical"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "mathematical"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.mathematical.equation@1/*#editor"
aliases = ["mathematical", "math"]
ports = { react = 6084, wgpu = 6184 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/➗️mathematical/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-mathematical = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
