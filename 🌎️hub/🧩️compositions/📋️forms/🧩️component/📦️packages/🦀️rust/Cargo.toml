[package]
workspace = "../../../../.."
name = "semio-hub-forms-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `forms` plugin component: the one cdylib of `semio-hub-forms`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:forms"

[package.metadata.semio]
role = "hub"
deployment-directory = "📋️forms"
component-kind = "plugin"
consumes = ["forms.questionKind"]

[[package.metadata.semio.playground]]
variant = "forms"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.forms.forms@1/*#editor"
ports = { react = 6058, wgpu = 6158 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/📋️forms/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-forms = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
