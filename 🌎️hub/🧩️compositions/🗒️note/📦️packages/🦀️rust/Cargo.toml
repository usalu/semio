[package]
workspace = "../../../.."
name = "semio-hub-note"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Note plugin - one crate for the note artifact (diff/op/dsl/pack/spr/engine) and the note play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.semio]
role = "hub"

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-s-artifact-note-note = { workspace = true }
semio-ui-contract.workspace = true
semio-framework-job.workspace = true
semio-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-os-kernel" }
semio-os = { workspace = true }
semio-plugin = { workspace = true }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework = { workspace = true }
semio-s-artifact-stdio-dwg = { workspace = true }
semio-s-artifact-stdio-dxf = { workspace = true }
semio-s-artifact-stdio-pdf = { workspace = true }
semio-s-artifact-stdio-png = { workspace = true }

semio-s-artifact-stdio-svg = { workspace = true }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
semio-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-test-fixtures = { path = "../../../../../🧰️framework/🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust" }
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-plugin-host = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
semio-os-run = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏃️run/📦️packages/🦀️rust", package = "semio-os-run" }
