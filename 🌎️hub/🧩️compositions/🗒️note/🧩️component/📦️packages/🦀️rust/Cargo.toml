[package]
workspace = "../../../../.."
name = "semio-hub-note-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `note` plugin component: the one cdylib of `semio-hub-note`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:note"

[package.metadata.semio]
role = "hub"
deployment-directory = "🗒️note"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "note"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.note.note@1/*#editor"
ports = { react = 6080, wgpu = 6180 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🗒️note/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-note = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
