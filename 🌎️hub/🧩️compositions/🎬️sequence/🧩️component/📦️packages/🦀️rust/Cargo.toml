[package]
workspace = "../../../../.."
name = "semio-hub-sequence-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `sequence` plugin component: the one cdylib of `semio-hub-sequence`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:sequence"

[package.metadata.semio]
role = "hub"
deployment-directory = "🎬️sequence"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "sequence"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
ports = { react = 6077, wgpu = 6177 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🎬️sequence/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-sequence = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
