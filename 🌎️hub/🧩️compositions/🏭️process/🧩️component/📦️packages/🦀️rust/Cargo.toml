[package]
workspace = "../../../../.."
name = "semio-hub-process-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `process` plugin component: the one cdylib of `semio-hub-process`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:process"

[package.metadata.semio]
role = "hub"
deployment-directory = "🏭️process"
component-kind = "plugin"
consumes = ["process.machines"]

[[package.metadata.semio.playground]]
variant = "process3d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.process.process3d@1/*#editor"
aliases = ["process 3d"]
ports = { react = 6022, wgpu = 6122 }

# 🎪️ The `bearbeiten` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🪪️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT).

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🏭️process/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-process = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
