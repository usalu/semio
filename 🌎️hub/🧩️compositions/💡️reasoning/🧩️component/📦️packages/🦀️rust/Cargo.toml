[package]
workspace = "../../../../.."
name = "semio-hub-reasoning-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `reasoning` plugin component: the one cdylib of `semio-hub-reasoning`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:reasoning"

[package.metadata.semio]
role = "hub"
deployment-directory = "💡️reasoning"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "reasoning-wires"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
aliases = ["wires"]
ports = { react = 6015, wgpu = 6115 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/💡️reasoning/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-reasoning = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
