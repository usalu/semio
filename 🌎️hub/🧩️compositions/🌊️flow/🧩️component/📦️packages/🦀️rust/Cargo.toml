[package]
workspace = "../../../../.."
name = "semio-hub-flow-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `flow` plugin component: the one cdylib of `semio-hub-flow`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:flow"

[package.metadata.semio]
role = "hub"
deployment-directory = "🌊️flow"
component-kind = "plugin"
consumes = ["flow.extension"]

[[package.metadata.semio.playground]]
variant = "flow"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
ports = { react = 6016, wgpu = 6116 }
engines = ["./🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow/🫀️core/📦️packages/🦀️rust"]

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🌊️flow/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-flow = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
