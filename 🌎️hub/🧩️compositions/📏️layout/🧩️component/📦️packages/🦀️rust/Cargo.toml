[package]
workspace = "../../../../.."
name = "semio-hub-layout-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `layout` plugin component: the one cdylib of `semio-hub-layout`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:layout"

[package.metadata.semio]
role = "hub"
deployment-directory = "📏️layout"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "layout"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.layout.layout@1/*#editor"
ports = { react = 6079, wgpu = 6179 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/📏️layout/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-layout = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
