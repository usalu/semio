[package]
workspace = "../../../../.."
name = "semio-hub-gis-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `gis` plugin component: the one cdylib of `semio-hub-gis`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:gis"

[package.metadata.semio]
role = "hub"
deployment-directory = "🌍️gis"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "gis2d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
mcpHost = { cratePath = "✏️s/🧑‍💻dev/🎭️variants/🌍️gis/💡️services/📦️packages/🦀️rust", project = "@semio-tech/s-gis-services-native", package = "semio-s-dev-gis-services", binary = "semio-s-gis-services-mcp", target = "mcp-build" }
nativeHost = { cratePath = "✏️s/🧑‍💻dev/🎭️variants/🌍️gis/💡️services/📦️packages/🦀️rust", project = "@semio-tech/s-gis-services-native", package = "semio-s-dev-gis-services", binary = "semio-s-gis-services-native", target = "native-build" }
aliases = ["gis 2d"]
app = "s.gis.gismap@1/*#editor"
ports = { react = 6040, wgpu = 6140 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

[[package.metadata.semio.playground]]
variant = "gis3d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
aliases = ["gis 3d"]
app = "s.gis.gisterrain@1/*#editor"
ports = { react = 6083, wgpu = 6183 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

# 🎪️ The `verfolgen` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🪪️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The `/osm`+`/vt` asset rows below
# stay here too (copies also live on the bundle crate) since the standalone `gis2d` dev variant needs
# them independently of the demonstrator.

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/osm"
app = "s.gis.gismap@1/*#editor"
upstream = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
cache = ".🧬semio/🗺️map/osm-tiles"
userAgent = "ComposeGisMapPlay/0.1 (+https://github.com/usalu/semio; dev playground)"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/vt"
app = "s.gis.gismap@1/*#editor"
upstream = "https://tiles.openfreemap.org/planet"
cache = ".🧬semio/🗺️map/openfreemap-vt"
userAgent = "ComposeGisMapPlay/0.1 (+https://github.com/usalu/semio; dev playground)"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/dem"
app = "s.gis.gisterrain@1/*#editor"
upstream = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
cache = ".🧬semio/🗺️map/terrarium-dem"
userAgent = "ComposeGisMapPlay/0.1 (+https://github.com/usalu/semio; dev playground)"

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🌍️gis/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-gis = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
