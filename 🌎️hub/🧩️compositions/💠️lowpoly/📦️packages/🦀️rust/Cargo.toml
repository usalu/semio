[package]
workspace = "../../../.."
name = "semio-hub-lowpoly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lowpoly plugin - one crate for the lowpoly artifact (diff/op/dsl/pack/spr/engine) and the lowpoly play app (commands/modes/windows/options/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:lowpoly"

[package.metadata.semio]
deployment-directory = "💠️lowpoly"
component-kind = "plugin"
role = "hub"

[[package.metadata.semio.playground]]
variant = "lowpoly"
app = "s.lowpoly.lowpoly@1/*#editor"
ports = { react = 6078, wgpu = 6178 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[dependencies]
semio-framework-value = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-s-artifact-lowpoly-lowpoly = { workspace = true }
semio-framework = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-ui-contract = { workspace = true }
semio-s-artifact-stdio-dwg = { workspace = true }
semio-s-artifact-stdio-gltf = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-las = { workspace = true }
semio-s-artifact-stdio-obj = { workspace = true }
semio-s-artifact-stdio-ply = { workspace = true }
semio-s-artifact-stdio-png = { workspace = true }
semio-s-artifact-stdio-semio = { workspace = true }
semio-s-artifact-stdio-stl = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-3d = { path = "../../../../../🧰️framework/🔨️modules/🧊️3d/📦️packages/🦀️rust" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde.workspace = true
serde_json.workspace = true
base64_codec = { path = "../../../../../🧰️framework/🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust", package = "semio-framework-io-base64" }
semio-framework-pixels = { path = "../../../../../🧰️framework/🔨️modules/🔲️pixels/📦️packages/🦀️rust", package = "semio-framework-pixels" }

[features]
# 🧪️ Optional: CAD fixture round-trip tests in `⚙️engine/🧵️media` (Wave 4 must keep CAD compilable).
cad-fixtures = ["semio-s-artifact-lowpoly-lowpoly/cad-fixtures"]


[dev-dependencies]
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest", "artifact-app-testing"], package = "semio-framework-plugin" }
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }

[package.metadata.semio.sources]
artifacts = ["../../../../../✏️s/🔌️plugins/💠️lowpoly/🗿️artifacts"]
