[package]
workspace = "../../../../.."
name = "semio-hub-raster-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `raster` plugin component: the one cdylib of `semio-hub-raster`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:raster"

[package.metadata.semio]
role = "hub"
deployment-directory = "🖨️raster"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "raster"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.raster.raster@1/*#editor"
ports = { react = 6060, wgpu = 6160 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🖨️raster/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-raster = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
