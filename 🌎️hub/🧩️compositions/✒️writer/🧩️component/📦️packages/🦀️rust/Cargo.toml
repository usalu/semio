[package]
workspace = "../../../../.."
name = "semio-hub-writer-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `writer` plugin component: the one cdylib of `semio-hub-writer`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:writer"

[package.metadata.semio]
role = "hub"
deployment-directory = "✒️writer"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "writer"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
ports = { react = 6062, wgpu = 6162 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/✒️writer/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-writer = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
