[package]
workspace = "../../../../.."
name = "semio-hub-bim-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `bim` plugin component: the one cdylib of `semio-hub-bim`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:bim"

[package.metadata.semio]
role = "hub"
deployment-directory = "🏬️bim"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "bim"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.bim.model@1/*#editor"
ports = { react = 6302, wgpu = 6402 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🏙️bim/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-bim = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
