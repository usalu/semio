[package]
workspace = "../../../.."
name = "semio-hub-bim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "BIM plugin - one crate for the bim model artifact (diff/mutations/inferences/io) and the bim editor and viewer apps (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:bim"

[package.metadata.semio]
deployment-directory = "🏬️bim"
component-kind = "plugin"
role = "hub"

[[package.metadata.semio.playground]]
variant = "bim"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.bim.model@1/*#editor"
ports = { react = 6302, wgpu = 6402 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[dependencies]
semio-framework-async = { workspace = true }
semio-framework-value ={ path = "../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-s-artifact-bim-model = { workspace = true }
semio-framework-ui-contract.workspace = true
semio-framework-job.workspace = true
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework = { workspace = true }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["component-guest", "artifact-app-testing"] }
semio-framework-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust" }
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }

[package.metadata.semio.sources]
artifacts = ["../../../../../✏️s/🔌️plugins/🏙️bim/🗿️artifacts"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
semio-framework-os-run = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏃️run/📦️packages/🦀️rust", package = "semio-framework-os-run" }
