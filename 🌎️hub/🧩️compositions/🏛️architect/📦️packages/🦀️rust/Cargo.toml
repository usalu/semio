[package]
workspace = "../../../.."
name = "semio-hub-architect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Architect plugin — the architectural programming document app (registers, adjacency, analysis, reporting) in one hot-swappable WASM component"

[lints]
workspace = true

[package.metadata.semio]
role = "hub"

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-s-artifact-architect-program = { workspace = true }
semio-framework-ui-contract.workspace = true
semio-framework-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }
semio-s-artifact-stdio-csv = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-semio = { workspace = true }
semio-s-artifact-stdio-tsv = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
semio-s-artifact-stdio-xlsx = { workspace = true }
semio-s-artifact-stdio-zip = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-job.workspace = true
semio-framework-tool-run.workspace = true

[dev-dependencies]
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["artifact-app-testing"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
zip = { version = "6", default-features = false, features = ["deflate"] }
# 🚫️ NOT a path dev-dependency on `semio-s-artifact-stdio-xlsx-test-oracle`. That crate declares its own
# `[workspace]` on purpose ("linked by generated cache-local test hosts by path and must not join
# the repository workspace"), so a direct path dep from a workspace member makes cargo fail with
# "multiple workspace roots found in the same workspace" — which breaks EVERY cargo command
# repo-wide, for every session. Reach the oracle through a generated test host instead.
