[package]
workspace = "../../../../.."
name = "semio-hub-architect-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `architect` plugin component: the one cdylib of `semio-hub-architect`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:architect"

[package.metadata.semio]
role = "hub"
deployment-directory = "🏛️architect"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "architect"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
ports = { react = 6088, wgpu = 6188 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🏛️architect/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-architect = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
