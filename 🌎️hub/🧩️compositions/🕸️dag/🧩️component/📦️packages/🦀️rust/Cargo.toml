[package]
workspace = "../../../../.."
name = "semio-hub-dag-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `dag` plugin component: the one cdylib of `semio-hub-dag`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
