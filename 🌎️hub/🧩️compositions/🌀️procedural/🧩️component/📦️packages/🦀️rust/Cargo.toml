[package]
workspace = "../../../../.."
name = "semio-hub-procedural-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `procedural` plugin component: the one cdylib of `semio-hub-procedural`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:procedural"

[package.metadata.semio]
role = "hub"
deployment-directory = "🌀️procedural"
component-kind = "plugin"
consumes = ["forms.questionKind", "flow.extension"]
depends-on = [
  "flow-extension-bim",
  "flow-extension-brep",
  "flow-extension-dictionary",
  "flow-extension-draw",
  "flow-extension-list",
  "flow-extension-logic",
  "flow-extension-math",
  "flow-extension-primitive",
  "flow-extension-text",
]

[[package.metadata.semio.playground]]
variant = "generation2d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.procedural.generation2d@1/*#editor"
aliases = ["procedural 2d"]
ports = { react = 6021, wgpu = 6121 }

[[package.metadata.semio.playground]]
variant = "generation3d"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.procedural.generation3d@1/*#editor"
aliases = ["procedural 3d"]
ports = { react = 6018, wgpu = 6118 }
viewer_path = "/?plugin=generation3d&role=viewer"

# 🎪️ The `generator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🪪️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT).

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🌀️procedural/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-procedural = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
