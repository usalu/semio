[package]
workspace = "../../../.."
name = "semio-hub-sourcing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sourcing plugin - one crate for the curation artifact (diff/op/dsl/pack/spr/engine) and the curation app (commands/modes/windows)"

[lints]
workspace = true

[package.metadata.semio]
role = "hub"

[lib]
path = "🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-s-artifact-sourcing-curation = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-obj = { workspace = true }
semio-s-artifact-stdio-png = { workspace = true }
semio-s-artifact-stdio-semio = { workspace = true }
semio-s-artifact-stdio-stl = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
semio-s-artifact-stdio-zip = { workspace = true }
semio-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-tool-run = { workspace = true }
semio-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust" }
# 🎬️ `MeshWindowKit::render` packs its `World3dScene` into the surface's opaque `UiFixedBytes`, so the
# window tests decode the scene back rather than string-matching the built node (see 🎪️demonstrator).
semio-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust" }

[dev-dependencies]
semio-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["artifact-app-testing"] }
# 🔬️ Every schema type now has its own first-party `ToValue`/`FromValue` codec (ticket 26/09/01/
# RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS) — `serde`'s `Serialize`/`Deserialize`
# survive only `#[cfg(test)]`/`#[cfg_attr(test, …)]`-gated as differential oracles, never a
# production dependency of this crate.
serde.workspace = true
serde_json.workspace = true
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
