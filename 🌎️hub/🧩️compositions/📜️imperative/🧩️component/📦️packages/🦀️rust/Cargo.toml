[package]
workspace = "../../../../.."
name = "semio-hub-imperative-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `imperative` plugin component: the one cdylib of `semio-hub-imperative`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:imperative"

[package.metadata.semio]
role = "hub"
deployment-directory = "📜️imperative"
component-kind = "plugin"
consumes = ["imperative.module"]

[[package.metadata.semio.playground]]
variant = "imperative"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
ports = { react = 6076, wgpu = 6176 }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/📜️imperative/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-imperative = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
