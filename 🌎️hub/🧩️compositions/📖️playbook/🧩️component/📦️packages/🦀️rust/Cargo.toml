[package]
workspace = "../../../../.."
name = "semio-hub-playbook-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `playbook` plugin component: the one cdylib of `semio-hub-playbook`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:playbook"

[package.metadata.semio]
role = "hub"
deployment-directory = "📖️playbook"
component-kind = "plugin"
consumes = ["playbook.blockKind"]

[[package.metadata.semio.playground]]
variant = "playbook"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
ports = { react = 6085, wgpu = 6185 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/📖️playbook/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-hub-playbook = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async = { workspace = true }
