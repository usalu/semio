[package]
workspace = "../../../../.."
name = "semio-hub-energy-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The `energy` plugin component: the one cdylib of `semio-hub-energy`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:energy"

[package.metadata.semio]
role = "hub"
deployment-directory = "🔋️energy"
component-kind = "plugin"

[[package.metadata.semio.playground]]
variant = "energy"
compositionConfigPath = "✏️s/🧑‍💻dev/🧩️catalog/🧊️wgpu/🟦️.ts"
app = "s.energy.model@1/*#editor"
ports = { react = 6106, wgpu = 6206 }

[package.metadata.semio.sources]
artifacts = ["../../../../../../✏️s/🔌️plugins/🔋️energy/🗿️artifacts"]

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-hub-energy = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { workspace = true }

[dev-dependencies]
semio-framework-async = { workspace = true }
