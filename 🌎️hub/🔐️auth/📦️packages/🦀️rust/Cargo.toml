[package]
workspace = "../../.."
name = "semio-hub-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Credential sign-in, session minting policy and the route rate limiter"

[package.metadata.semio]
role = "hub"
id = "hub-auth"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-hub-directory-contract = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["full"] }
semio-framework-hash = { path = "../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
directory = { path = "../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }

[dev-dependencies]
semio-framework-test-fixtures = { path = "../../../../🧰️framework/🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
syn = { version = "2", features = ["full", "visit"] }
semio-framework-schema = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
serde_json = { workspace = true }
