[package]
workspace = "../../../.."
name = "semio-hub-inference-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Owner-private proposal runtime, routes and checkpoint control"

[package.metadata.semio]
role = "hub"
id = "hub-inference-runtime"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
integration-fixtures = ["semio-hub-inference/integration-fixtures"]

[dependencies]
semio-hub-directory = { workspace = true }
semio-hub-directory-contract = { workspace = true }
semio-hub-directory-dispatch = { workspace = true }
semio-hub-inference = { workspace = true }
semio-hub-inference-catalog = { workspace = true }
semio-hub-inference-ledger = { workspace = true }
semio-hub-inference-runtime-contract = { workspace = true }
semio-hub-lag-rebootstrap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
semio-hub-inference-binding = { workspace = true }
semio-framework-plugin = { workspace = true }
protocol = { path = "../../../../../🧰️framework/🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }

[dev-dependencies]
