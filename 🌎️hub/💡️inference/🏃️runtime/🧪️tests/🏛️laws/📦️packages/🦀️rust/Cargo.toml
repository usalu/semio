[package]
workspace = "../../../../../.."
name = "semio-hub-inference-laws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Inference laws over the proposal runtime and the retained approval committer"

[package.metadata.semio]
role = "hub"
id = "hub-inference-laws"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-hub-inference/testkit", "semio-hub-inference-runtime-contract/testkit"]

[dependencies]

[dev-dependencies]
semio-hub-inference = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-inference-committer = { workspace = true }
semio-hub-inference-ledger = { workspace = true }
semio-hub-inference-runtime = { workspace = true, features = ["integration-fixtures"] }
semio-hub-inference-runtime-contract = { workspace = true, features = ["testkit"] }
semio-s-artifact-gis-gismap = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
db = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db", features = ["claimed-backend-laws"] }
semio-framework-async = { workspace = true }
semio-hub-gis = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
serde_json = { workspace = true }
semio-hub-inference-binding = { workspace = true }
semio-framework-artifact-reference = { path = "../../../../../../../🧰️framework/🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust" }
protocol = { path = "../../../../../../../🧰️framework/🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-framework-plugin = { workspace = true }
