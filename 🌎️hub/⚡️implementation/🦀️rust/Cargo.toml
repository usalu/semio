# #region 🔖️Header
# 2026 Ueli Saluz
# AGPL-3.0
# OS hub backend — thin axum shell over `db::Database` (document authority + content-addressed
# blobs) and `HubDirectory` (identity/tenancy), speaking `protocol_wire`'s binary frames over
# WebSocket.
# #endregion 🔖️Header

[package]
name = "semio-hub"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "os-hub"
path = "../../../🌎️hub/⚡️implementation/🦀️rust/📦️bin.rs"


[lints]
workspace = true
[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.20", features = ["v7", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
dashmap = "6"
protocol = { path = "../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-protocol" }
db = { path = "../../../🧰️framework/🛍️product/💻️os/🔨️module/🛢️db/⚡️implementation/🦀️rust", features = ["sqlite", "postgres", "neo4j"], package = "semio-framework-os-kernel-db" }
os-hub-directory = { path = "../../../🌎️hub/🔨️module/📇️directory/⚡️implementation/🦀️rust", package = "semio-hub-directory" }
os-hub-directory-sqlite = { path = "../../🔨️module/📇️directory/🪶️sqlite/⚡️implementation/🦀️rust", package = "semio-hub-directory-sqlite" }
os-hub-directory-postgres = { path = "../../🔨️module/📇️directory/🐘️postgres/⚡️implementation/🦀️rust", package = "semio-hub-directory-postgres" }
os-hub-directory-neo4j = { path = "../../🔨️module/📇️directory/🌐️neo4j/⚡️implementation/🦀️rust", package = "semio-hub-directory-neo4j" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
