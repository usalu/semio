[package]
workspace = "../../../.."
name = "semio-hub-directory-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Hub directory capabilities over PostgreSQL (sqlx)"

[package.metadata.semio]
role = "hub"
id = "hub-directory-postgres"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-hub-artifact-authority/testkit", "semio-hub-directory/testkit", "dep:db"]

[dependencies]
semio-hub-artifact-authority = { workspace = true }
semio-hub-artifact-creation = { workspace = true }
semio-hub-directory = { workspace = true }
semio-hub-directory-contract = { workspace = true }
semio-framework-pack-json = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
serde_json = { workspace = true }
semio-framework-hash = { path = "../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
sqlx_core = { package = "sqlx-core", version = "0.8", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx_postgres = { package = "sqlx-postgres", version = "0.8", features = ["uuid", "json"] }
db = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db", features = ["claimed-backend-laws"], optional = true }

[dev-dependencies]
semio-hub-artifact-authority = { workspace = true, features = ["testkit"] }
semio-hub-directory = { workspace = true, features = ["testkit"] }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
db = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db", features = ["claimed-backend-laws"] }
