# 🐳️ `os-hub` compose example — the production topology, matching `🌎️hub/Dockerfile`.
#
#   docker compose -f 🌎️hub/compose.yaml up --build             # sqlite + filesystem store (default)
#   docker compose -f 🌎️hub/compose.yaml --profile postgres up --build
#   docker compose -f 🌎️hub/compose.yaml --profile neo4j up --build
#
# Seed the first user into the volume before the first `up` — there is no sign-up, and the verb
# needs the data root rather than a running hub:
#
#   docker compose -f 🌎️hub/compose.yaml run --rm hub credential set --email ada@example.com --display-name Ada
#
# `docker compose config` resolves this file (Docker 29.5). Nothing here has been *started*: the
# build stage compiles the hub's full release dependency graph. See the Dockerfile's header for what
# has and has not been verified.
#
# The build context is the repository root, because the builder stage compiles from source; the
# runtime image carries the binary and the admin SPA only.

name: semio-hub

services:
  hub:
    build:
      context: ..
      dockerfile: 🌎️hub/Dockerfile
    # 🌐️ Published on the host's loopback only: the hub speaks plain HTTP and always will, so it
    # belongs behind a TLS-terminating reverse proxy on this host (`🌎️hub/README.md` §
    # "TLS-terminating reverse proxy"). Inside the container the bind is `0.0.0.0` — a loopback bind
    # inside a container would make this mapping unreachable.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      OS_HUB_DATA: /srv/semio-hub/data
      OS_HUB_ADMIN_DIR: /srv/semio-hub/admin
      OS_HUB_BIND: 0.0.0.0
      OS_HUB_PORT: "8787"
      OS_HUB_MODE: production
      OS_HUB_CREDENTIAL_SIGN_IN: "true"
      OS_HUB_SESSION_TTL_SECONDS: "43200"
      OS_HUB_STORAGE_BACKEND: fs
      OS_HUB_DIRECTORY_BACKEND: sqlite
      # 🛂️ A network bind in production mode is refused without BOTH of these, each naming itself.
      # `OS_HUB_ALLOWED_ORIGINS` is the origin your `s` bundle is served from; `proxy` is you taking
      # responsibility for the transport in front of this socket.
      OS_HUB_ALLOWED_ORIGINS: https://s.example.com
      OS_HUB_TRUSTED_FORWARDING: proxy
      # 👑️ Production mode requires at least one admin identity. The provider string for a password
      # credential is literally `credential.password.v1`; the subject is the seeded email.
      OS_HUB_ADMIN_SUBJECTS: credential.password.v1:ada@example.com
    volumes:
      # 🗄️ The whole durable state of a hub: WAL + snapshots, `directory.db`, blobs, the trusted
      # catalog pointer and the instance stores' format stamps. Backup unit = this volume, hub
      # stopped (`README.md` § "Backup and restore").
      - hub-data:/srv/semio-hub/data
    # 🛑️ The hub drains on SIGTERM; give the drains room before Docker escalates to SIGKILL.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  # 🐘️ Optional. `docker compose --profile postgres up` starts this *and* the hub still has to be
  # told to use it — uncomment the two `OS_HUB_*_DATABASE_URL` lines below into the `hub` service's
  # environment and switch the two backend variables to `postgres`. Both the document store and the
  # directory can be pointed at postgres independently; they are separate variables on purpose.
  #
  #   OS_HUB_STORAGE_BACKEND: postgres
  #   OS_HUB_DATABASE_URL: postgres://semio:semio@postgres:5432/semio
  #   OS_HUB_DIRECTORY_BACKEND: postgres
  #   OS_HUB_DIRECTORY_DATABASE_URL: postgres://semio:semio@postgres:5432/semio
  #
  # The image must be built with the `postgres` cargo feature for those variables to be anything
  # but a boot error naming the backend. Every document's WAL writer holds a session advisory lock
  # on this server (`🛢️db/🗄️storage/🔐️writer` `WalWriterFenceV1`), released when the hub closes
  # its storage on SIGTERM or when the server ends a crashed hub's session.
  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: semio
      POSTGRES_PASSWORD: semio
      POSTGRES_DB: semio
    volumes:
      - hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=semio --dbname=semio"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 🕸️ Optional, the Neo4j twin of `postgres` above. `docker compose --profile neo4j up` starts it;
  # point the hub at it with the `neo4j` cargo feature and these variables in the `hub` service:
  #
  #   OS_HUB_STORAGE_BACKEND: neo4j
  #   OS_HUB_NEO4J_URI: bolt://neo4j:7687
  #   OS_HUB_NEO4J_USER: neo4j
  #   OS_HUB_NEO4J_PASSWORD: semio-hub
  #   OS_HUB_DIRECTORY_BACKEND: neo4j
  #   OS_HUB_DIRECTORY_NEO4J_URI: bolt://neo4j:7687
  #
  # Every document's WAL writer is a lease node on this server (`🛢️db/🗄️storage/🔐️writer`
  # `WalWriterFenceV1`): a hub that stops on SIGTERM releases its leases before it exits, a crashed
  # hub's leases lapse after `leaseTtlMs` (15 s) on this server's clock.
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/semio-hub
    volumes:
      - hub-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell --username neo4j --password semio-hub 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  hub-data:
  hub-postgres:
  hub-neo4j:
