[package]
workspace = "../../../.."
name = "semio-hub-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The shared HubState every hub route handler runs over"

[package.metadata.semio]
role = "hub"
id = "hub-state"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-hub-artifact-authority/testkit", "semio-hub-inference-runtime-contract/testkit", "semio-hub-ledgers/testkit", "semio-hub-route-models/testkit", "semio-hub-runtime/testkit", "semio-hub-trusted-catalog/testkit"]

[dependencies]
semio-hub-artifact-authority = { workspace = true }
semio-hub-artifact-checkin = { workspace = true }
semio-hub-artifact-creation-service = { workspace = true }
semio-hub-auth = { workspace = true }
semio-hub-directory-contract = { workspace = true }
semio-hub-directory-dispatch = { workspace = true }
semio-hub-directory-service = { workspace = true }
semio-hub-inference-catalog = { workspace = true }
semio-hub-inference-runtime = { workspace = true }
semio-hub-inference-runtime-contract = { workspace = true }
semio-hub-lag-rebootstrap = { workspace = true }
semio-hub-ledgers = { workspace = true }
semio-hub-observability = { workspace = true }
semio-hub-route-models = { workspace = true }
semio-hub-runtime = { workspace = true }
semio-hub-stores = { workspace = true }
semio-hub-trusted-catalog = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
futures = "0.3"
semio-framework-async = { workspace = true }
semio-framework-trace = { workspace = true }
protocol = { path = "../../../../../🧰️framework/🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
db = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db" }
semio-framework-server = { workspace = true }

[dev-dependencies]
