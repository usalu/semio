[package]
workspace = "../../../.."
name = "semio-hub-route-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Hub route models: admin, artifact creation, directory, document socket, check in, session and state seam vocabulary"

[package.metadata.semio]
role = "hub"
id = "hub-route-models"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-hub-artifact-authority/testkit", "semio-hub-directory/testkit", "semio-hub-inference/testkit", "semio-hub-inference-runtime-contract/testkit", "semio-hub-ledgers/testkit", "semio-hub-runtime/testkit", "semio-hub-trusted-catalog/testkit"]

[dependencies]
semio-hub-artifact-authority = { workspace = true }
semio-hub-artifact-checkin = { workspace = true }
semio-hub-artifact-creation = { workspace = true }
semio-hub-artifact-creation-service = { workspace = true }
semio-hub-auth = { workspace = true }
semio-hub-directory = { workspace = true }
semio-hub-directory-contract = { workspace = true }
semio-hub-directory-dispatch = { workspace = true }
semio-hub-directory-service = { workspace = true }
semio-hub-inference = { workspace = true }
semio-hub-inference-runtime-contract = { workspace = true }
semio-hub-lag-rebootstrap = { workspace = true }
semio-hub-ledgers = { workspace = true }
semio-hub-observability = { workspace = true }
semio-hub-refusal = { workspace = true }
semio-hub-runtime = { workspace = true }
semio-hub-trusted-catalog = { workspace = true }
semio-hub-trusted-catalog-descriptor = { workspace = true }
semio-framework-pack-json = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
axum = { version = "0.8", features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = "0.3"
semio-framework-async = { workspace = true }
semio-framework-hash = { path = "../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-trace = { workspace = true }
protocol = { path = "../../../../../🧰️framework/🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
db = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db" }

[dev-dependencies]
semio-hub-artifact-authority = { workspace = true, features = ["testkit"] }
semio-hub-directory = { workspace = true, features = ["testkit"] }
semio-hub-inference = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-inference-runtime-contract = { workspace = true, features = ["testkit"] }
semio-hub-ledgers = { workspace = true, features = ["testkit"] }
semio-hub-runtime = { workspace = true, features = ["testkit"] }
semio-hub-trusted-catalog = { workspace = true, features = ["testkit", "integration-fixtures"] }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
db = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db", features = ["claimed-backend-laws"] }
