[package]
workspace = "../../../../../.."
name = "semio-hub-hostile-input-laws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Hostile input laws: the generative hostile-input suites and the held count lease"

[package.metadata.semio]
role = "hub"
id = "hub-hostile-input-laws"

[package.metadata.semio.rust-source-boundary]
