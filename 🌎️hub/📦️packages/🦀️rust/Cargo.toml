[package]
name = "semio-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OS hub — the multi-tenant document/directory server: an axum WS shell over db::Database (documents/blobs) and HubDirectory (identity/tenancy), sqlite/postgres/neo4j backends selectable per Cargo feature"

[package.metadata.semio]
role = "hub"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[[bin]]
name = "os-hub"
path = "📦️bin.rs"

[features]
default = ["sqlite"]
# 🔌️ Each backend feature both pulls in its own driver dep and forwards to `db`'s same-named
# storage feature (`db::storage_sqlite`/`storage_postgres`/`storage_neo4j`) — one feature name
# controls both the directory backend AND the document/blob storage substrate together, so there
# is no split-brain where one half of a backend is compiled in and the other isn't.
sqlite = ["dep:rusqlite", "db/sqlite"]
postgres = ["dep:sqlx_core", "dep:sqlx_postgres", "db/postgres"]
neo4j = ["dep:neo4rs", "db/neo4j"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
futures = "0.3"
semio-framework-async = { workspace = true }
protocol = { path = "../../../🧰️framework/🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
# 📇️ `os_directory` is hub domain vocabulary still mounted in the os kernel; Wave 3 relocates it here.
directory = { path = "../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
db = { path = "../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db" }

# 🔌️ Directory backend drivers — optional, enabled only by this crate's same-named feature (see
# `[features]` above and `connect_db`/`connect_directory` in `📦️bin.rs`).
rusqlite = { version = "0.38.0", features = ["bundled"], optional = true }
sqlx_core = { package = "sqlx-core", version = "0.8", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"], optional = true }
sqlx_postgres = { package = "sqlx-postgres", version = "0.8", features = ["uuid", "json"], optional = true }
neo4rs = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
