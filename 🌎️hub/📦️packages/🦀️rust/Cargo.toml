[package]
workspace = "../.."
name = "semio-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OS hub — the multi-tenant document/directory server: an axum WS shell over db::Database (documents/blobs) and the hub directory capabilities (identity/tenancy), sqlite/postgres/neo4j backends selectable by feature"

[package.metadata.semio]
channel-version-consumers = "🔖️channel-version/📇️consumers.json"
role = "hub"

[lints]
workspace = true

[[bin]]
name = "os-hub"
path = "../../🏗️bootstrap/🦀️.rs"

[features]
integration-fixtures = ["semio-hub-inference-runtime/integration-fixtures", "semio-hub-trusted-catalog/integration-fixtures", "semio-hub-trusted-catalog-contract/integration-fixtures"]

[dependencies]
semio-hub-artifact-authority = { workspace = true }
semio-hub-artifact-checkin = { workspace = true }
semio-hub-artifact-creation-service = { workspace = true }
semio-hub-auth = { workspace = true }
semio-hub-directory = { workspace = true }
semio-hub-directory-contract = { workspace = true }
semio-hub-directory-service = { workspace = true }
semio-hub-inference-catalog = { workspace = true }
semio-hub-inference-committer = { workspace = true }
semio-hub-inference-ledger = { workspace = true }
semio-hub-inference-runtime = { workspace = true }
semio-hub-inference-runtime-contract = { workspace = true }
semio-hub-lag-rebootstrap = { workspace = true }
semio-hub-ledgers = { workspace = true }
semio-hub-local-bootstrap = { workspace = true }
semio-hub-native-openable = { workspace = true }
semio-hub-route-models = { workspace = true }
semio-hub-routes = { workspace = true }
semio-hub-runtime = { workspace = true }
semio-hub-state = { workspace = true }
semio-hub-trusted-catalog = { workspace = true }
semio-hub-trusted-catalog-contract = { workspace = true }
semio-hub-trusted-catalog-descriptor = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
futures = "0.3"
semio-framework-async = { workspace = true }
semio-framework-async-slots = { workspace = true }
semio-framework-trace = { workspace = true }
semio-hub-gis = { workspace = true }
semio-hub-inference-binding = { workspace = true }
directory = { path = "../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
db = { path = "../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db" }

[dev-dependencies]
semio-hub-artifact-authority = { workspace = true, features = ["testkit"] }
semio-hub-directory = { workspace = true, features = ["testkit"] }
semio-hub-inference-runtime = { workspace = true, features = ["integration-fixtures"] }
semio-hub-inference-runtime-contract = { workspace = true, features = ["testkit"] }
semio-hub-ledgers = { workspace = true, features = ["testkit"] }
semio-hub-route-models = { workspace = true, features = ["testkit"] }
semio-hub-runtime = { workspace = true, features = ["testkit"] }
semio-hub-state = { workspace = true, features = ["testkit"] }
semio-hub-trusted-catalog = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-trusted-catalog-contract = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-s-artifact-gis-gismap = { workspace = true }
semio-s-artifact-gis-gismap-mcp = { workspace = true }
semio-framework-os-mcp = { path = "../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌉️mcp/📦️packages/🦀️rust" }
semio-framework-schema = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
db = { path = "../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db", features = ["claimed-backend-laws"] }
serde_json = { workspace = true }
semio-framework-pack-json = { path = "../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }

[[test]]
name = "inference_client_contract"
path = "../../💡️inference/🧪️tests/🔬️client-contract/🦀️.rs"
