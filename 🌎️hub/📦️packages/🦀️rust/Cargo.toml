[package]
name = "semio-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "OS hub — the multi-tenant document/directory server: an axum WS shell over db::Database (documents/blobs) and HubDirectory (identity/tenancy), sqlite/postgres/neo4j backends selectable per Cargo feature"

[package.metadata.semio]
role = "hub"

[lints]
workspace = true

[lib]
path = "📦️lib.rs"

[[bin]]
name = "os-hub"
path = "📦️bin.rs"

[features]
default = ["sqlite"]
# 🔌️ Each backend feature both pulls in its own driver dep and forwards to `db`'s same-named
# storage feature (`db::storage_sqlite`/`storage_postgres`/`storage_neo4j`) — one feature name
# controls both the directory backend AND the document/blob storage substrate together, so there
# is no split-brain where one half of a backend is compiled in and the other isn't.
sqlite = ["dep:rusqlite", "db/sqlite"]
postgres = ["dep:sqlx_core", "dep:sqlx_postgres", "db/postgres"]
neo4j = ["dep:neo4rs", "db/neo4j"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1.20", features = ["v7", "serde"] }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
dashmap = "6"
async-trait = "0.1"
protocol = { path = "../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
db = { path = "../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-db" }

# 🔌️ Directory backend drivers — optional, enabled only by this crate's same-named feature (see
# `[features]` above and `connect_db`/`connect_directory` in `📦️bin.rs`).
rusqlite = { version = "0.38.0", features = ["bundled"], optional = true }
sqlx_core = { package = "sqlx-core", version = "0.8", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"], optional = true }
sqlx_postgres = { package = "sqlx-postgres", version = "0.8", features = ["uuid", "json"], optional = true }
neo4rs = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.26"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# ============================================================================
# 🚧️ TEMPORARY isolated-verification overlay (ticket 26/08/06/HUB-PRODUCT-CRATE-CONSOLIDATION-
# DRESS-REHEARSAL) — makes this crate its own workspace root so it can be `cargo check`/`clippy`/
# `test`-ed via `--manifest-path` before the registrar adds it as a root-workspace member (root
# Cargo.toml still lists the OLD 5 crates until the registrar's swap). DELETE this whole block
# (down to end of file) and the nested `target/`/`Cargo.lock` at handoff — see TEMPLATE.md §3.
# ============================================================================
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3
