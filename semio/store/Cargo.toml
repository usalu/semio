[package]
name = "semio-store"
version = "0.1.0"
edition = "2021"
description = "NDJSON JSON-RPC 2.0 sidecar for semio KitStore (stdio)"
publish = false

[[bin]]
name = "semio-store"
path = "bin.rs"

[dependencies]
semio = { path = "../rs" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures-lite = "2.6.0"
async-broadcast = "0.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
  "env-filter",
  "fmt",
  "std",
] }

[dev-dependencies]
scopeguard = "1.2"
