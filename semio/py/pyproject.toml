[project]
name = "semio"
version = "4.4.0"
description = "🏘️ semio domain models for Python"
authors = [{ name = "Ueli Saluz", email = "ueli@semio-tech.com" }]
requires-python = ">=3.14,<3.15"
license = "LGPL-3.0-or-later"
maintainers = [{ name = "Ueli Saluz", email = "ueli@semio-tech.com" }]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=2.0.0",
    "networkx>=3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "graphene>=3.0.0",
    "graphene-pydantic>=0.6.0",
    "graphene-sqlalchemy>=3.0.0rc1",
    "loguru>=0.7.0",
    "pytransform3d>=3.0.0",
    "ifcopenshell>=0.8.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.18",
    "trimesh>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/usalu/semio"
Repository = "https://github.com/usalu/semio"

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "deepdiff>=8.0.0",
    "pytest-cov>=6.0.0",
]
dev = []

[tool.uv]
default-groups = ["test", "dev"]

[tool.hatch.build.targets.sdist]
include = ["main.py"]

[tool.hatch.build.targets.wheel]
include = ["main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 250

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "*.test.py", "main.py"]
testpaths = ["."]
addopts = "--import-mode=importlib"
