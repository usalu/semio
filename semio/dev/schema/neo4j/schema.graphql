# https://neo4j.com/docs/graphql/current/
# Composition and containment use OWNS (…); do not persist denormalized owner names/ids/kinds on nodes — use OWNS edges only.
# `IS`: Each kit member (`Data` / `Computation` / `Reference`) has **exactly one** outgoing `IS` to its declared `FieldIs` from `semio/client/schema/semio/schema.yaml`. Each `Class` / `Interface` keeps **only** direct `implements` targets as `IS` (no persisted transitive closure to supertypes like Entity or StrongEntity — walk the chain in application logic if needed).
# Persisted node properties are minimal: `Data`/`Reference`/`Computation` keep `name`, `rank` (sibling order string), `isList`, and `Computation` also `cached`; `Class`/`Interface`/`Scalar`/`Module` keep `name`; `Constraint` keeps `description` only. Everything else (e.g. `targetName`, `UNIQUE IMPORT ID`, …) must not be stored — use `OWNS`/`IS` shape only. In `schema.yaml`, derived kit members set `cached` on the field map (Neo4j `Computation`); there is no separate field-`kind` property.
# Naming: `Module.name`, `Class.name`, `Interface.name`, and `Scalar.name` are PascalCase; persisted member names on `Data` / `Computation` / `Reference` are lowerCamelCase. `Module.name` is unique only among siblings. Root `Schema` has `General` and `Domain`; `Schema`→`General` holds `Scalar`, `Module` `Entity` (with `WeakEntity`, `StrongEntity`, … under it), and other shared kit graph modules; `Schema`→`Domain` holds `Module` `Kit`, `Module` `VCS` (version-control shell subtree), and other domain-scoped modules as modeled.
# Kit members: `Data` (embedded value), `Computation` (`cached` true for cached derivations, false for computed), `Reference` (graph reference). There is no `Field` label — use `KitField` union in GraphQL over `OWNS` from `Class` / `Interface` only.

interface Constraint {
  description: String!
}

interface Node {
  name: String!
  constraints: [Constraint!]! @relationship(type: "OWNS", direction: OUT)
}

interface Primitive implements Node {
  name: String!
  constraints: [Constraint!]! @relationship(type: "OWNS", direction: OUT)
}

interface Scalar implements Primitive {
  name: String!
  constraints: [Constraint!]! @relationship(type: "OWNS", direction: OUT)
}

union FieldIs = Scalar | Class | Interface

"""
📦 Data — Embedded kit member; `IS` targets a `Scalar` (or other `FieldIs` as modeled).
"""
type Data implements Node @node {
  name: String!
  rank: String!
  constraints: [Constraint!]! @relationship(type: "OWNS", direction: OUT)
  is: FieldIs! @relationship(type: "IS", direction: OUT)
}

"""
⚡ Computation — Derived kit member; `cached` distinguishes cached vs on-the-fly computed.
"""
type Computation implements Node @node {
  name: String!
  rank: String!
  cached: Boolean!
  constraints: [Constraint!]! @relationship(type: "OWNS", direction: OUT)
  is: FieldIs! @relationship(type: "IS", direction: OUT)
}

"""
🔗 Reference — Referential kit member; `IS` targets `Class`, `Interface`, or `Scalar` as modeled.
"""
type Reference implements Node @node {
  name: String!
  rank: String!
  constraints: [Constraint!]! @relationship(type: "OWNS", direction: OUT)
  is: FieldIs! @relationship(type: "IS", direction: OUT)
}

union KitField = Data | Computation | Reference

interface Interface implements Node {
  name: String!
  fields: [KitField!]! @relationship(type: "OWNS", direction: OUT)
  is: [Interface!]! @relationship(type: "IS", direction: OUT)
}

interface Class implements Node @node {
  name: String!
  interfaces: [Interface!]! @relationship(type: "IS", direction: OUT)
  fields: [KitField!]! @relationship(type: "OWNS", direction: OUT)
  methods: [Method!]! @relationship(type: "OWNS", direction: OUT)
}

type Module implements Primitive @node {
  # Node
  name: String!
  # Module
  scalars: [Scalar!]! @relationship(type: "OWNS", direction: OUT)
  interfaces: [Interface!]! @relationship(type: "OWNS", direction: OUT)
  classes: [Class!]! @relationship(type: "OWNS", direction: OUT)
  modules: [Module!]! @relationship(type: "OWNS", direction: OUT)
}
