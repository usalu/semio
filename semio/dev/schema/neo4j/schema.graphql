# https://neo4j.com/docs/graphql/current/
# Composition and containment use HAS (…); do not persist denormalized owner names/ids/kinds on nodes — use HAS edges only.
# `IS` is a materialized subtype graph: Interface→Interface includes transitive supertypes; Class and Field→Interface include every ancestor of the declared interface (e.g. strongEntity/weakEntity→entity).

interface Constraint {
  description: String!
}

interface Node {
  name: String!
  constraints: [Constraint!]! @relationship(type: "HAS", direction: OUT)
}

interface Primitive implements Node {
  name: String!
  constraints: [Constraint!]! @relationship(type: "HAS", direction: OUT)
}

interface Scalar implements Primitive {
  name: String!
  constraints: [Constraint!]! @relationship(type: "HAS", direction: OUT)
}

union FieldIs = Scalar | Class | Interface

enum FieldKind {
  EMBEDDED
  REFERENCE
  COMPUTED
  CACHED
}

interface Field implements Node {
  name: String!
  constraints: [Constraint!]! @relationship(type: "HAS", direction: OUT)
  is: FieldIs! @relationship(type: "IS", direction: OUT)
}

interface Interface implements Node {
  name: String!
  fields: [Field!]! @relationship(type: "HAS", direction: OUT)
  is: [Interface!]! @relationship(type: "IS", direction: OUT)
}

interface Command implements Node {
  name: String!
  fields: [Field!]! @relationship(type: "HAS", direction: OUT)
}

interface Class implements Node @node {
  name: String!
  interfaces: [Interface!]! @relationship(type: "IS", direction: OUT)
  fields: [Field!]! @relationship(type: "HAS", direction: OUT)
  methods: [Method!]! @relationship(type: "HAS", direction: OUT)
}

type Module implements Primitive @node {
  # Node
  name: String!
  # Module
  scalars: [Scalar!]! @relationship(type: "HAS", direction: OUT)
  interfaces: [Interface!]! @relationship(type: "HAS", direction: OUT)
  classes: [Class!]! @relationship(type: "HAS", direction: OUT)
  modules: [Module!]! @relationship(type: "HAS", direction: OUT)
}
