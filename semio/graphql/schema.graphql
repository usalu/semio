
directive @oneOf on INPUT_OBJECT

"""async-graphql `JSON` scalar; matches semio/rs wasm kit control plane."""
scalar JSON

scalar DateTime
scalar Cursor
scalar Long

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

type Query {
  """Live kit root (pointer graph); no selector input."""
  kitStore: KitStore!
}

type Mutation {
  """Apply `ChangeKitCommand` batch on the live graph (actor queue)."""
  changeKitCommands(commands: JSON!): Boolean!

  """VCS: `KitStoreCommand::NewSession` (returns tagged `KitStoreCommandResult` JSON)."""
  newSession: JSON!
  endSession(id: String!): JSON!
  newAlternative(fromCheckpoint: String, name: String!): JSON!
  executeSessionCommands(sessionId: String!, sessionCommands: [JSON!]!): JSON!
  executeKitCheckpointCommands(checkpointId: String!, commands: [JSON!]!): JSON!
  executeKitAlternativeCommands(alternativeId: String!, commands: [JSON!]!): JSON!

  attachBackbone(config: JSON!): JSON!
  detachBackbone: JSON!
  setActiveCheckpoint(id: String): JSON!
  listConflicts: JSON!
  resolveConflict(id: String!, strategy: JSON!): JSON!
  backboneStatus: JSON!
  syncNow: JSON!
  kitStoreBatch(commands: [JSON!]!): JSON!
}

type Subscription {
  """Broadcast `KitEvent` JSON payloads from the live kit bus."""
  eventStream: JSON!
}

type KitStore {
  name: String!
  description: String
  types: [Type!]!
  designs: [Design!]!
  """Ordered type ids in kit graph order (replaces `readKitTypeIds` batch)."""
  typeIds: [String!]!
  typesMetadata: JSON!
  """Ordered design ids in kit graph order (`ReadKitDesignIdsCommand`)."""
  designIds: [String!]!
  designsMetadata: JSON!
  coloredConnectors: JSON!
  liveFullDto: JSON!
  theKitDto: JSON!
  materializeAt(checkpointId: String): JSON!
  vcsStateJson: JSON!
  designForId(id: String!): Design
  typeForId(id: String!): Type
}

type Design {
  id: String!
  name: String!
  description: String
  pieces: [Piece!]!
  connections: [Connection!]!
  flattenMap: JSON!
  pieceForId(id: String!): Piece
  clusterableGroups(selection: [String!]!): [[String!]!]!
  qualitySum(qualityId: String!): Float!
  replaceableCatalog(selection: [String!]!): ReplaceableCatalog!
  includedDesigns: JSON!
  includedDesignIds: [String!]!
}

type Piece {
  id: String!
  name: String
  description: String
  flatPlane: JSON!
  flatCenter: JSON!
  flatPose: JSON!
  scale: Float
  parentConnectionFull: JSON
}

type Type {
  id: String!
  name: String!
  description: String
  connectors: [Connector!]!
  representations: [Representation!]!
  bestRepresentation(tagIds: [String!]!): JSON
}

type Connector {
  id: String!
  code: String!
}

type Representation {
  id: String!
  url: String!
  description: String
}

type Connection {
  id: String!
  gap: Float
  shift: Float
  rise: Float
  rotation: Float
  turn: Float
  tilt: Float
  u: Float
  v: Float
  description: String
}

type ReplaceableCatalog {
  typeIds: [String!]!
  designIds: [String!]!
}
