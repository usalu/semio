directive @oneOf on INPUT_OBJECT

scalar Long

input UnitInput {
  unit: Boolean = true
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  readKit(commands: [ReadKitCommandInput!]!): [ReadKitCommandOutput!]!
  readType(id: ID!, commands: [ReadTypeCommandInput!]!): [ReadTypeCommandOutput!]!
  readDesign(id: ID!, commands: [ReadDesignCommandInput!]!): [ReadDesignCommandOutput!]!
  readPiece(id: ID!, commands: [ReadPieceCommandInput!]!): [ReadPieceCommandOutput!]!
  readConnection(id: ID!, commands: [ReadConnectionCommandInput!]!): [ReadConnectionCommandOutput!]!
  readSide(id: ID!, commands: [ReadSideCommandInput!]!): [ReadSideCommandOutput!]!
  readPort(id: ID!, commands: [ReadPortCommandInput!]!): [ReadPortCommandOutput!]!
  readConnector(id: ID!, commands: [ReadConnectorCommandInput!]!): [ReadConnectorCommandOutput!]!
  readRepresentation(id: ID!, commands: [ReadRepresentationCommandInput!]!): [ReadRepresentationCommandOutput!]!
  readFamily(id: ID!, commands: [ReadFamilyCommandInput!]!): [ReadFamilyCommandOutput!]!
  readFile(id: ID!, commands: [ReadFileCommandInput!]!): [ReadFileCommandOutput!]!
  readFolder(id: ID!, commands: [ReadFolderCommandInput!]!): [ReadFolderCommandOutput!]!
  readLocation(id: ID!, commands: [ReadLocationCommandInput!]!): [ReadLocationCommandOutput!]!
  readLayer(id: ID!, commands: [ReadLayerCommandInput!]!): [ReadLayerCommandOutput!]!
  readGroup(id: ID!, commands: [ReadGroupCommandInput!]!): [ReadGroupCommandOutput!]!
  readAuthor(id: ID!, commands: [ReadAuthorCommandInput!]!): [ReadAuthorCommandOutput!]!
  readConcept(id: ID!, commands: [ReadConceptCommandInput!]!): [ReadConceptCommandOutput!]!
  readTag(id: ID!, commands: [ReadTagCommandInput!]!): [ReadTagCommandOutput!]!
  readQuality(id: ID!, commands: [ReadQualityCommandInput!]!): [ReadQualityCommandOutput!]!
  readBenchmark(id: ID!, commands: [ReadBenchmarkCommandInput!]!): [ReadBenchmarkCommandOutput!]!
  readProp(id: ID!, commands: [ReadPropCommandInput!]!): [ReadPropCommandOutput!]!
  readAttribute(id: ID!, commands: [ReadAttributeCommandInput!]!): [ReadAttributeCommandOutput!]!
  readStat(id: ID!, commands: [ReadStatCommandInput!]!): [ReadStatCommandOutput!]!
}

type CommandQueuedReceipt {
  requestId: ID!
  queued: Boolean!
  acceptedAt: String!
}

type Mutation {
  enqueue(command: KitStoreCommandInput!, requestId: ID): CommandQueuedReceipt!
  enqueueBatch(commands: [KitStoreCommandInput!]!, requestId: ID): CommandQueuedReceipt!
}

enum EntityKind {
  KIT
  TYPE
  DESIGN
  PIECE
  CONNECTION
  SIDE
  PORT
  CONNECTOR
  REPRESENTATION
  FAMILY
  FILE
  FOLDER
  LOCATION
  LAYER
  GROUP
  AUTHOR
  CONCEPT
  TAG
  QUALITY
  BENCHMARK
  PROP
  ATTRIBUTE
  CHECKPOINT
  ALTERNATIVE
  SESSION
  DRAFT
  TRANSACTION
}

type CommandCompletedEvent {
  requestId: ID!
  result: KitStoreCommandResult!
  emittedAt: String!
}

type ErrorEvent {
  requestId: ID
  code: String!
  message: String!
  emittedAt: String!
}

type StateChangedEvent {
  requestId: ID
  entityKinds: [EntityKind!]!
  entityIds: [ID!]!
  emittedAt: String!
}

union ActorEvent = CommandCompletedEvent | ErrorEvent | StateChangedEvent

type Subscription {
  eventStream: ActorEvent!
  commandResults(requestId: ID!): CommandCompletedEvent!
}

enum ConflictResolution {
  DROP_WIP
  FORCE_OVERWRITE_BACKBONE
}

enum KitChangeKindTag {
  INFERRED
  SET_KIT_METADATA
  ADD_TYPE
  REMOVE_TYPE
  MODIFY_TYPE
  ADD_DESIGN
  REMOVE_DESIGN
  MODIFY_DESIGN
  ADD_PIECE
  REMOVE_PIECE
  CONNECT
  DISCONNECT
  UNIFY_CHECKPOINTS
  MARK_RELEASE
  OTHER
}

type KitChangeKind {
  tag: KitChangeKindTag!
  other: String
}

input KitChangeKindInput {
  tag: KitChangeKindTag!
  other: String
}

