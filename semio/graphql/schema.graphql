
directive @oneOf on INPUT_OBJECT

"""async-graphql `JSON` scalar; matches semio/rs wasm kit control plane."""
scalar JSON

scalar DateTime
scalar Cursor
scalar Long

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

type Query {
  """Live kit root (pointer graph); no selector input."""
  kitStore: KitStore!
}

type Mutation {
  """Apply `ChangeKitCommand` batch on the live graph (actor queue)."""
  changeKitCommands(commands: JSON!): Boolean!
  """Structured `KitStoreCommand` / VCS / backbone dispatch (actor queue)."""
  kitStoreExecute(command: JSON!): JSON!
}

type Subscription {
  """Broadcast `KitEvent` JSON payloads from the live kit bus."""
  eventStream: JSON!
}

type KitStore {
  name: String!
  description: String
  types: [Type!]!
  designs: [Design!]!
  liveFullDto: JSON!
  theKitDto: JSON!
  materializeAt(checkpointId: String): JSON!
  vcsStateJson: JSON!
  readKitCommands(batch: JSON!): JSON!
}

type Design {
  id: String!
  name: String!
  description: String
  pieces: [Piece!]!
  connections: [Connection!]!
  flattenMap: JSON!
}

type Piece {
  id: String!
  name: String
  description: String
  flatPlane: JSON!
  flatCenter: JSON!
  flatPose: JSON!
  scale: Float
}

type Type {
  id: String!
  name: String!
  description: String
  connectors: [Connector!]!
  representations: [Representation!]!
}

type Connector {
  id: String!
  code: String!
}

type Representation {
  id: String!
  url: String!
  description: String
}

type Connection {
  id: String!
  gap: Float
  shift: Float
  rise: Float
  rotation: Float
  turn: Float
  tilt: Float
  u: Float
  v: Float
  description: String
}
