interface KitInteraction {
  actor: Actor!
  timestamp: DateTime!
}

input StartSessionKitCommandInput {

}

type StartSessionInteraction implements KitInteraction {
  actor: Actor!
  timestamp: DateTime!
  timeout: Float!
  lastCheckpoint: DateTime!
  input: StartSessionInput!
}

interface ChangeKitInteraction implements KitInteraction {
  actor: Actor!
  timestamp: DateTime!
  hash: Hash!
  forward: KitDiff!
  backward: KitDiff!
  last: ChangeKitInteraction!
}

input CreateFixedPieceChangeKitCommandInput {
  name: String
  description: String
  type: TypeIdInput
  center: CoordinateInput
  plane: PlaneInput
  designPiece: DesignIdInput
  attributes: [AttributeInput!]
}

type CreateFixedPieceChangeKitInteraction implements ChangeKitInteraction {
  actor: Actor!
  timestamp: DateTime!
  hash: String!
  forward: KitDiff!
  backward: KitDiff!
  input: CreateFixedPieceChangeKitCommandInput!
}


type KitOperation {
  changes: [ChangeKitInteraction!]!
}


type KitSnapshot {
  id: ID!
  hash: String!
  name: String!
  description: String
  release: String
  remote: String
  homepage: String
  preview: String
  icon: String
  image: String
  license: LicenseSnapshot!
  attributes: [AttributeSnapshot!]
  createdAt: DateTime
  createdBy: AuthorSnapshot!
  modifiedAt: DateTime
  tags: [TagSnapshot!]
  concepts: [ConceptSnapshot!]
  ports: [PortSnapshot!]
  qualities: [QualitySnapshot!]
  authors: [AuthorSnapshot!]
  folders: [FolderSnapshot!]
  files: [FileSnapshot!]
  types: [TypeSnapshot!]
  designs: [DesignSnapshot!]
}

type KitClient {
  id: ID!
  started: DateTime!
  allowedCommands: [KitCommandKind!]
  lastHeartbeat: DateTime!
  operations: [KitOperation!]
}

type KitBackbone {
  id: ID!
  snapshot: KitSnapshot!
  changes: [ChangeKitInteraction!]
  clients: [KitClient!]
  backbone: KitBackbone
}

type Query {
  kit(id: ID!): Kit
}

type Mutation {
  startSession(input: StartSessionInput!): StartSessionInteraction!
  createFixedPiece(input: CreateFixedPieceInput!): CreateFixedPieceInteraction!
}
