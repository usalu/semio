"""
@emoji 🧭 Selects which materialized kit snapshot `Graph.theKit` resolves (main line, checkpoint root, alternative draft tip, or explicit draft).
"""
input KitReadPointInput {
	theKit: Boolean
	checkpointId: Id
	checkpointChangeId: Id
	checkpointOperationId: Id
	alternativeId: Id
	draftAlternativeId: Id
	draftId: Id
	draftChangeId: Id
	draftTransactionId: Id
