type TypeConnection {
	edges: [TypeEdge!]!
	pageInfo: PageInfo!
	hash: String!
}

type TypeEdge {
	cursor: String!
	node: Type!
}

type Vector {
	id: Id!
	hash: String!
	ownerEntity: OwnerEntity
	ownedEntities: OwnedEntityConnection
	x: Float!
	y: Float!
	z: Float!
}

input VectorInput {
