  targetAlternative: Alternative
  before: Kit!
  transactions(first: Int, after: Cursor, last: Int, before: Cursor): TransactionConnection!
  redoTransactions(first: Int, after: Cursor, last: Int, before: Cursor): TransactionConnection!
  openTransaction: Transaction
  canUndo: Boolean!
  canRedo: Boolean!
}

type Transaction implements Node {
  id: ID!
  state: TransactionState!
  changes(first: Int, after: Cursor, last: Int, before: Cursor): ChangeRecordConnection!
  redoChanges(first: Int, after: Cursor, last: Int, before: Cursor): ChangeRecordConnection!
  canUndo: Boolean!
  canRedo: Boolean!
}

type Checkpoint implements Node {
  id: ID!
  parent: Checkpoint
  children(first: Int, after: Cursor, last: Int, before: Cursor): CheckpointConnection!
  message: String
  time: DateTime
  authors(first: Int, after: Cursor, last: Int, before: Cursor): AuthorConnection!
  changes(first: Int, after: Cursor, last: Int, before: Cursor): ChangeRecordConnection!
