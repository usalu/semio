type Alternative {
	id: Id!
	hash: String!
	owner: Graph
	name: String!
	start: Checkpoint!
	checkpoints: [Checkpoint!]!
	store: Kit!
	draft: Draft
	transaction: Transaction
}

type Attribute {
	id: Id!
	key: String!
	value: String!
	definition: String
}

type Author {
	id: Id!
	name: String!
	email: String!
	role: String
	rank: Int
}

"""
@emoji 🗄️ Declared backbone capabilities for dev JSON vs local `.semio/` stores (no SQL surface).
"""
type BackboneCapabilitySet {
	supportsDevJson: Boolean!
	supportsLocalDotSemio: Boolean!
	supportsAttach: Boolean!
	supportsDetach: Boolean!
}

"""
@emoji 🗄️ Dev JSON bundle vs local `.semio/` backbone — capability surface without SQL leakage.
"""
enum BackboneStoreKind {
	DEV_JSON
	LOCAL_DOT_SEMIO
}

type Benchmark {
	id: Id!
	name: String!
	min: Float
	max: Float
	minExcluded: Boolean
	maxExcluded: Boolean
}

"""
🧩 Blueprint union (Type | Design) — what a Piece references and what a Piece's owner is.
"""
union Blueprint = Type | Design

type Change {
	id: Id!
	hash: String!
	owner: ChangeOwner!
	forwards: [OperationKind!]!
	backwards: [OperationKind!]!
	"""
	@emoji 🔗 Ordered semantic op record ids constituting the forwards side (bundle `semanticOpLog` ids) when persisted.
	"""
	forwardSemanticOpRecordIds: [Id!]!
	"""
	@emoji 🔗 Ordered semantic op record ids for backwards / inverse application when persisted separately from `OperationKind`.
	"""
	backwardSemanticOpRecordIds: [Id!]!
}

union ChangeOwner = Transaction | Draft | Checkpoint

type ChangedDescription implements Operation {
	id: Id!
	hash: String!
	owner: Change!
	input: ChangedDescriptionInput!
	diff: Diff!
	entity: Kit!
}

type ChangedDescriptionInput {
	description: String!
}

type Checkpoint {
	id: Id!
	hash: String!
	timestamp: Timestamp
	authors: [Author!]!
	root: Kit
	parentCheckpoint: Checkpoint
	message: String
	isRelease: Boolean!
	changeCount: Int!
	"""
	@emoji 🔗 Checkpoint-scoped semantic op ids (`histories.checkpoint` wraps op log ids without duplicating kit trees).
	"""
	semanticOpRecordIds: [Id!]!
}

"""
✅ Lightweight signal that a command was accepted (used by `commandSucceeded`).
"""
type Command {
	requestId: Id!
	kind: String!
}

type Concept {
	id: Id!
	name: String!
	description: String
	order: Int
}

type Conflict {
	id: Id!
	backboneTip: String
	reason: String!
	createdAt: Timestamp!
}

type Connection {
	id: Id!
	hash: String!
	owner: Design!
	connected: Side!
	connecting: Side!
	gap: Float
	shift: Float
	rise: Float
	rotation: Float
	turn: Float
	tilt: Float
	u: Float
	v: Float
	description: String
	attributes: [Attribute!]!
}

type Connector {
	id: Id!
	hash: String!
	owner: Type!
	code: String!
	description: String
	port: Port
	qualities: [Quality!]!
	attributes: [Attribute!]!
}

type Coordinate {
	u: Float!
	v: Float!
}

input CoordinateInput {
	u: Float!
	v: Float!
}

type CreatedFixedPiece implements Operation {
	id: Id!
	hash: String!
	owner: Change!
	input: CreatedFixedPieceInput!
	diff: Diff!
	piece: Piece!
}

type CreatedFixedPieceInput {
	designId: Id!
	blueprintId: Id!
	position: Position!
	name: String
	description: String
}

type Design {
	id: Id!
	hash: String!
	owner: Kit!
	name: String!
	description: String
	icon: String
	image: String
	location: Location
	unit: String
	created: Timestamp
	updated: Timestamp
	pieces: [Piece!]!
	piece(id: Id!): Piece
	connections: [Connection!]!
	connection(id: Id!): Connection
	layers: [Layer!]!
	groups: [Group!]!
	authors: [Author!]!
	concepts: [Concept!]!
	tags: [Tag!]!
	qualities: [Quality!]!
	props: [Prop!]!
	attributes: [Attribute!]!
	stats: [Stat!]!
	qualitySum(qualityId: Id!): Float!
	references: [Design!]!
	referencedBy: [Piece!]!
}

type Diff {
	id: Id!
	summary: String
}

type Draft {
	id: Id!
	hash: String!
	owner: Alternative
	parentCheckpoint: Checkpoint
	targetAlternative: Alternative
	openTransaction: Transaction
	finalizedTransactions: [Transaction!]!
	redoTransactions: [Transaction!]!
	changes: [Change!]!
	canUndo(steps: Int!): Boolean!
	canRedo(steps: Int!): Boolean!
	"""
	@emoji 🔗 Stable transaction open order on this draft (bundle `histories.draft`).
	"""
	orderedTransactionIds: [Id!]!
}

type DraggedPiece implements Operation {
	id: Id!
	hash: String!
	owner: Change!
	input: DraggedPieceInput!
	diff: Diff!
	pieces: [Piece!]!
}

type DraggedPieceInput {
	designId: Id!
	pieceIds: [Id!]!
	offset: Offset!
}

type Error {
	kind: String!
	message: String!
	requestId: String
}

type File {
	id: Id!
	url: String!
	mime: String
	size: Int
	hash: String!
	description: String
	created: Timestamp
	updated: Timestamp
}

type FixedPiece implements Operation {
	id: Id!
	hash: String!
	owner: Change!
	input: FixedPieceInput!
	diff: Diff!
	piece: Piece!
}

type FixedPieceInput {
	designId: Id!
	pieceId: Id!
}

type Folder {
	id: Id!
	path: String!
	description: String
}

type Graph {
	id: Id!
	hash: String!
	owner: Session
	theKit: Kit
	alternative(id: Id!): Alternative
	alternatives: [Alternative!]!
	checkpoint(id: Id!): Checkpoint
	checkpoints: [Checkpoint!]!
	release(id: Id!): Checkpoint
	releases: [Checkpoint!]!
	"""
	@emoji 📜 Ordered semantic op log for this graph line (persisted bundle field); empty until store wiring lands.
	"""
	semanticOpLog(limit: Int): [SemanticOpRecord!]!
	"""
	@emoji 🔢 Stable `projectionFingerprint` (blake3-style `hash::h`) keyed from graph + kit identity until piece-center sort lands.
	"""
	projectionFingerprint: String!
	"""
	@emoji 📸 Hash of the materialized root kit aggregate for this graph head.
	"""
	rootSnapshotHash: String!
}

type Group {
	id: Id!
	name: String!
	description: String
	color: String
	icon: String
}

scalar Id

type Kit {
	id: Id!
	hash: String!
	"""
	Owner [`crate::vcs::Graph`] is set by [`crate::worker::ChildRuntime::new`] via Weak.
	"""
	owner: Graph
	checkpoint: Checkpoint
	draft: Draft
	transaction: Transaction
	name: String!
	description: String
	icon: String
	image: String
	preview: String
	remote: String
	homepage: String
	license: String
	uri: String
	created: Timestamp
	updated: Timestamp
	version: String
	design(id: Id!): Design
	designs: [Design!]!
	type(id: Id!): Type
	types: [Type!]!
	files: [File!]!
	folders: [Folder!]!
	authors: [Author!]!
	concepts: [Concept!]!
	tags: [Tag!]!
	qualities: [Quality!]!
	props: [Prop!]!
	attributes: [Attribute!]!
	stats: [Stat!]!
}

"""
@emoji 🧭 Which materialized graph line a read or write targets (`wip` vs `authoritative`).
"""
enum KitGraphWorkspace {
	WIP
	AUTHORITATIVE
}

type Layer {
	id: Id!
	name: String!
	description: String
	color: String
	order: Int
	visible: Boolean
	locked: Boolean
}

type Location {
	id: Id!
}

type Mutation {
	renameKit(workspace: KitGraphWorkspace!, draftId: Id!, transactionId: Id!, name: String!): Command!
	changeDescription(workspace: KitGraphWorkspace!, draftId: Id!, transactionId: Id!, description: String!): Command!
	createFixedPiece(workspace: KitGraphWorkspace!, draftId: Id!, transactionId: Id!, designId: Id!, position: PositionInput!, name: String, description: String): Command!
	fixPiece(workspace: KitGraphWorkspace!, draftId: Id!, transactionId: Id!, designId: Id!, pieceId: Id!): Command!
	"""
	@emoji 🔗 Attach a backbone store handle (JSON dev bundle or local `.semio/`); async completion via `commandSucceeded`.
	"""
	backboneAttach(workspace: KitGraphWorkspace!, connectionUri: String!, storeKind: BackboneStoreKind!): Command!
	"""
	@emoji 🔗 Detach a backbone connection; async completion via `commandSucceeded`.
	"""
	backboneDetach(workspace: KitGraphWorkspace!, connectionUri: String!): Command!
}

type Offset {
	u: Float!
	v: Float!
}

"""
🪄 GraphQL `interface Operation` (each variant is an Arc-shared operation entity).
"""
interface Operation {
	id: Id!
	hash: String!
	owner: Change!
	diff: Diff!
}

"""
🌗 Sum-type carrying any operation through the event bus / change log (Arc-shared).
"""
union OperationKind = CreatedFixedPiece | FixedPiece | DraggedPiece | RenamedKit | ChangedDescription

type Piece {
	id: Id!
	hash: String!
	owner: Blueprint!
	name: String
	description: String
	position: Position
	scale: Float
	blueprint: Blueprint!
	connectionKind: PieceConnectionKind
	flatPosition: Position!
	replaceableBlueprint: [Blueprint!]!
	parentConnection: Connection
	childConnections: [Connection!]!
	parentPiece: Piece
	childPieces: [Piece!]!
	depth: Int!
	path: [Piece!]!
	props: [Prop!]!
	attributes: [Attribute!]!
}

enum PieceConnectionKind {
	FIXED
	CONNECTED
}

type Plane {
	origin: Point!
	xAxis: Vector!
	yAxis: Vector!
}

input PlaneInput {
	origin: PointInput!
	xAxis: VectorInput!
	yAxis: VectorInput!
}

type Point {
	x: Float!
	y: Float!
	z: Float!
}

input PointInput {
	x: Float!
	y: Float!
	z: Float!
}

type Port {
	id: Id!
	hash: String!
	owner: Type!
	code: String
	label: String
	order: Int
}

type Position {
	center: Coordinate!
	plane: Plane!
}

input PositionInput {
	center: CoordinateInput!
	plane: PlaneInput!
}

type Prop {
	id: Id!
	key: String!
	value: String!
	unit: String
	quality: Quality
}

type Quality {
	id: Id!
	key: String!
	value: String
	unit: String
	definition: String
	description: String
	benchmarks: [Benchmark!]!
}

type Query {
	session: Session!
	wip: Graph!
	authoritative: Graph
	conflicts: [Conflict!]!
	"""
	@emoji 🧭 Primary read entrypoint: explicit kit-store projection (`checkpointId` / `draftId`+`transactionId` reserved for materialized tips).
	"""
	readableKitGraph(selector: ReadableGraphSelector!): Graph!
	"""
	@emoji 🧭 Backbone capability discovery for this process (integrators choose `BackboneStoreKind` without SQL).
	"""
	backboneCapabilities(selector: ReadableGraphSelector!): BackboneCapabilitySet!
}

"""
@emoji 🧭 Identifies which readable projection of the kit store is queried (workspace + optional checkpoint/draft/tx anchors).
"""
input ReadableGraphSelector {
	workspace: KitGraphWorkspace!
	checkpointId: Id
	draftId: Id
	transactionId: Id
}

type RenamedKit implements Operation {
	id: Id!
	hash: String!
	owner: Change!
	input: RenamedKitInput!
	diff: Diff!
	kit: Kit!
}

type RenamedKitInput {
	name: String!
}

type Representation {
	id: Id!
	hash: String!
	owner: Type!
	url: String!
	description: String
	file: File
	tags: [Tag!]!
	qualities: [Quality!]!
	attributes: [Attribute!]!
}

"""
@emoji 📜 One persisted semantic op: stable id, kind string, JSON payload, monotonic sequence index.
"""
type SemanticOpRecord {
	id: Id!
	opKind: String!
	payloadJson: String!
	sequence: Int!
}

type Session {
	id: Id!
	startedAt: Timestamp
	drafts: [Draft!]!
}

type Side {
	id: Id!
	piece: Piece!
	port: Port
	designPiece: Piece
	connector: Connector
}

type Stat {
	id: Id!
	key: String!
	value: String!
	unit: String
	description: String
}

type SubscriptionRoot {
	commandSucceeded: Command!
	operationSucceeded: Operation!
	operationFailed: Error!
	kitRenamed: RenamedKit!
	descriptionChanged: ChangedDescription!
	createdFixedPiece: CreatedFixedPiece!
	fixedPiece: FixedPiece!
	draggedPiece: DraggedPiece!
	error: Error!
}

type Tag {
	id: Id!
	name: String!
	order: Int
}

scalar Timestamp

type Transaction {
	id: Id!
	hash: String!
	owner: Draft
	changes: [Change!]!
	"""
	@emoji 🔗 Transaction forwards op sequence as `semanticOpLog` ids (see `histories.transaction`).
	"""
	semanticOpRecordIds: [Id!]!
}

type Type {
	id: Id!
	hash: String!
	owner: Kit!
	name: String!
	description: String
	icon: String
	image: String
	unit: String
	created: Timestamp
	updated: Timestamp
	connectors: [Connector!]!
	connector(id: Id!): Connector
	representations: [Representation!]!
	representation(id: Id!): Representation
	bestRepresentation(tagIds: [Id!]!): Representation
	authors: [Author!]!
	concepts: [Concept!]!
	tags: [Tag!]!
	qualities: [Quality!]!
	props: [Prop!]!
	attributes: [Attribute!]!
	stats: [Stat!]!
}

type Vector {
	x: Float!
	y: Float!
	z: Float!
}

input VectorInput {
	x: Float!
	y: Float!
	z: Float!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
	subscription: SubscriptionRoot
}
