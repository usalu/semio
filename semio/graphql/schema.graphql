enum KitStoreEventKind {
  STORE_CHANGED
  INTERACTION_RECORDED
  CHANGE_CANDIDATE_REQUESTED
  CHANGE_APPLIED
  CONFLICT_RAISED
  SESSION_CHANGED
  TRANSACTION_CHANGED
  HISTORY_CHANGED
}

type KitStoreEvent {
  hash: Hash!
  kind: KitStoreEventKind!
  store: KitStore!
  interaction: KitInteractionRecord
  change: KitChange
  candidate: KitChangeCandidate
  conflict: KitConflict
  session: KitSession
  transaction: KitTransaction
}

"""📡Stream semantic kit store events for synchronized UI state."""
type Subscription {
  kitStoreEvents(kitId: ID!, sessionId: ID): KitStoreEvent!
}
