  name: String!
}

input KeySelectorInput {
  key: String!
}

input PathSelectorInput {
  path: String!
}

input UrlSelectorInput {
  url: String!
}

input TypeSelectorInput @oneOf {
  byId: EntityIdInput
  byName: NameSelectorInput
}

input DesignSelectorInput @oneOf {
  byId: EntityIdInput
  byName: NameSelectorInput
}

input PieceSelectorInput @oneOf {
  byId: EntityIdInput
}

input ConnectionSelectorInput @oneOf {
  byId: EntityIdInput
}

input SideSelectorInput @oneOf {
  byId: EntityIdInput
}

input PortSelectorInput @oneOf {
  byId: EntityIdInput
  byName: NameSelectorInput
}

input ConnectorSelectorInput @oneOf {
  byId: EntityIdInput
  byName: NameSelectorInput
}

input RepresentationSelectorInput @oneOf {
  byId: EntityIdInput
