"""🔎Read the current kit store, history, candidates, conflicts and command catalog."""
type Query {
  kit(id: ID!): Kit
  kitStore(id: ID!): KitStore
  kitSession(kitId: ID!, sessionId: ID!): KitSession
  kitTransaction(kitId: ID!, transactionId: ID!): KitTransaction
  kitCandidate(kitId: ID!, candidateId: ID!): KitChangeCandidate
  kitConflict(kitId: ID!, conflictId: ID!): KitConflict
  kitHistory(kitId: ID!, cursor: String, limit: Int): KitHistoryPage!
  kitInteractions(kitId: ID!, cursor: String, limit: Int): KitInteractionPage!
  kitCommandCatalog: [KitCommandDescriptor!]!
}

"""🌱Apply semantic kit store commands through explicit command inputs."""
