  PORT
  CONNECTOR
  REPRESENTATION
  FAMILY
  FILE
  FOLDER
  LOCATION
  AUTHOR
  CONCEPT
  TAG
  QUALITY
  PROP
  ATTRIBUTE
  LAYER
  GROUP
  STAT
  BENCHMARK
  SESSION
  DRAFT
  TRANSACTION
  CHECKPOINT
  ALTERNATIVE
  CONFLICT
}

enum TransactionState {
  OPEN
  FINALIZED
}

enum ChangeKind {
  INFERRED
  SET_KIT_METADATA
  ADD_TYPE
  REMOVE_TYPE
  MODIFY_TYPE
  ADD_DESIGN
  REMOVE_DESIGN
  MODIFY_DESIGN
  ADD_PIECE
  REMOVE_PIECE
  CONNECT
  DISCONNECT
  UNIFY_CHECKPOINTS
  MARK_RELEASE
  OTHER
