input TransactionCommandInput @oneOf {
  readKitCommands: TransactionCommandReadKitCommandsInput
  changeKitCommands: TransactionCommandChangeKitCommandsInput
  finalize: UnitInput
  abort: UnitInput
  undo: UnitInput
  undoAll: UnitInput
  canUndo: UnitInput
  redo: UnitInput
  redoAll: UnitInput
  canRedo: UnitInput
}

input TransactionCommandReadKitCommandsInput {
  commands: [ReadKitCommandInput!]!
}

input TransactionCommandChangeKitCommandsInput {
  commands: [ChangeKitCommandInput!]!
}