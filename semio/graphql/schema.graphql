input ConfirmOnlyInput {
	confirm: Boolean
}

type Connection {
	id: String!
	gap: Float
	shift: Float
	rise: Float
	rotation: Float
	turn: Float
	tilt: Float
	u: Float
	v: Float
	description: String
}

type Connector {
	id: String!
	code: String!
}

type Design {
	id: String!
	name: String!
	description: String
	pieces: [Piece!]!
	"""
	🌐 Resolves a piece by persisted DTO id within this design.
	"""
	pieceByDtoId(id: String!): Piece
	connections: [Connection!]!
	flattenMap: JSON!
	clusterableGroups(selection: [String!]!): [[String!]!]!
	qualitySum(qualityId: String!): Float!
	replaceableCatalog(selection: [String!]!): ReplaceableCatalog!
	includedDesigns: JSON!
	includedDesignIds: [String!]!
	"""
	🌐 Full piece DTO list (same as [`KitGraph::get_pieces_json`] for this design).
	"""
	piecesFullJson: JSON!
	"""
	🌐 Full connection DTO list (same as [`KitGraph::get_connections_json`] for this design).
	"""
	connectionsFullJson: JSON!
	"""
	🌐 Flatten placement map JSON (same as [`KitGraph::get_pieces_metadata_json`]).
	"""
	piecesMetadataJson: JSON!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type KitCommandReceipt {
	requestId: String!
	commandKind: String!
	accepted: Boolean!
}

input KitCommandShellInput {
	commandKind: String!
	request: JSON!
}

input KitReadScopeAlternativeInput {
	alternativeId: String!
}

input KitReadScopeCheckpointInput {
	checkpointId: String!
}

input KitReadScopeDraftInput {
	sessionId: String!
	draftId: String!
}

"""
GraphQL input: one of the wire shapes for [`crate::kit_read_scope::KitReadScope`].
"""
input KitReadScopeInput @oneOf {
	theKit: ConfirmOnlyInput
	checkpoint: KitReadScopeCheckpointInput
	alternative: KitReadScopeAlternativeInput
	draft: KitReadScopeDraftInput
	transaction: KitReadScopeTransactionInput
}

input KitReadScopeTransactionInput {
	sessionId: String!
	draftId: String!
	transactionId: String!
}

type KitStore {
	name: String!
	"""
	🌐 Same as the former WASM `canUndo` / `canRedo` helpers.
	"""
	canUndo: Boolean!
	"""
	🌐 Same as the former WASM `canUndo` / `canRedo` helpers.
	"""
	canRedo: Boolean!
	"""
	🌐 Resolves a design by persisted DTO id (linear scan; for hosts that only hold string ids).
	"""
	designByDtoId(id: String!): Design
	"""
	🌐 Resolves a kit [`crate::typ::TypeStore`] by persisted DTO id.
	"""
	typeByDtoId(id: String!): Type
	description: String
	"""
	🌐 Persisted DTO id list for [`LiveKitRoot`] and catalog queries.
	"""
	typeIds: [String!]!
	"""
	🌐 Persisted DTO id list for [`LiveKitRoot`] and catalog queries.
	"""
	designIds: [String!]!
	types: [Type!]!
	designs: [Design!]!
	"""
	🌐 Per-type metadata rows.
	"""
	typesMetadata: JSON!
	"""
	🌐 Per-design metadata rows.
	"""
	designsMetadata: JSON!
	"""
	🌐 Colored connector index rows.
	"""
	coloredConnectors: JSON!
	"""
	Full kit DTO snapshot (materialized live graph).
	"""
	liveFullDto: JSON!
	"""
	`the_kit` line DTO (committed main line).
	"""
	theKitDto: JSON!
	materializeAt(checkpointId: String): JSON!
	"""
	🌐 Same JSON as [`KitGraph::get_kit_json`] (kit metadata DTO).
	"""
	kitMetadataJson: JSON!
	"""
	🌐 Shallow design rows (same as [`KitGraph::get_designs_json`]).
	"""
	designsShallowJson: JSON!
	"""
	🌐 Shallow type rows (same as [`KitGraph::get_types_json`]).
	"""
	typesShallowJson: JSON!
	"""
	🌐 Shallow author rows (same as [`KitGraph::get_authors_json`]).
	"""
	authorsShallowJson: JSON!
	"""
	Opaque JSON VCS tree (same shape as `vcsState` WASM helper).
	"""
	vcsStateJson: JSON!
}

type Mutation {
	"""
	Submit any semantic kit mutation through one asynchronous shell.
	"""
	submitKitCommand(input: KitCommandShellInput!): KitCommandReceipt!
}

type Piece {
	id: String!
	name: String
	description: String
	flatPlane: JSON!
	flatCenter: JSON!
	flatPose: JSON!
	scale: Float
	"""
	Strong ref to the resolved type for this piece (in-memory, not a lookup by id).
	"""
	refType: Type
	"""
	🌐 Full parent connection DTO when the piece is linked through a connection.
	"""
	parentConnectionFull: JSON
}

type Query {
	"""
	Live kit graph root (strong handles: nested fields return the same in-memory `Arc` stores).
	"""
	kitStore: KitStore!
	"""
	Materialized kit view for **scoped** reads (the kit, checkpoint, alternative, draft, or open transaction), matching [`KitReadScope`].
	"""
	kitReadScope(scope: KitReadScopeInput!): KitStore!
}

type ReplaceableCatalog {
	"""
	🌐
	"""
	typeIds: [String!]!
	"""
	🌐
	"""
	designIds: [String!]!
}

type Representation {
	id: String!
	url: String!
	description: String
}

type Subscription {
	"""
	Broadcast [`KitEvent`] stream (same bus as `KitStoreHandle::subscribe`).
	"""
	eventStream: JSON!
}

type Type {
	id: String!
	name: String!
	description: String
	connectors: [Connector!]!
	representations: [Representation!]!
	"""
	🌐 Best matching representation for tag selection.
	"""
	bestRepresentation(tagIds: [String!]!): JSON
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Indicates that an Input Object is a OneOf Input Object (and thus requires exactly one of its field be provided)
"""
directive @oneOf on INPUT_OBJECT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
