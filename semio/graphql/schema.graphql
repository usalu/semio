input KitStoreQueryInput {
  scope: KitStoreScopeInput
}

input KitStoreScopeInput @oneOf {
  live: LiveScopeInput
  atCheckpoint: CheckpointScopeInput
  atAlternativeTip: AlternativeScopeInput
  atDraft: DraftScopeInput
  atTransaction: TransactionScopeInput
}

input LiveScopeInput {
  current: Boolean! = true
}

input CheckpointScopeInput {
  checkpoint: CheckpointSelectorInput!
}

input AlternativeScopeInput {
  alternative: AlternativeSelectorInput!
}

input DraftScopeInput {
  session: SessionSelectorInput!
  draft: DraftSelectorInput!
}

input TransactionScopeInput {
  session: SessionSelectorInput!
  draft: DraftSelectorInput!
  transaction: TransactionSelectorInput!
}

enum KitStoreViewKind {
  LIVE
  CHECKPOINT
  ALTERNATIVE_TIP
  DRAFT
  TRANSACTION
}

type KitStoreView {
  kind: KitStoreViewKind!
  checkpoint: Checkpoint
  alternative: Alternative
  session: Session
  draft: Draft
  transaction: Transaction
}

type KitStore {
  view: KitStoreView!
  kit: Kit!
  activeCheckpoint: Checkpoint
  backbone: BackboneStatus!

  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!

  conflicts(first: Int, after: Cursor, last: Int, before: Cursor): KitConflictConnection!
  conflict(input: ConflictSelectorInput!): KitConflict

  checkpoints(first: Int, after: Cursor, last: Int, before: Cursor): CheckpointConnection!
  checkpoint(input: CheckpointSelectorInput!): Checkpoint

  alternatives(first: Int, after: Cursor, last: Int, before: Cursor): AlternativeConnection!
  alternative(input: AlternativeSelectorInput!): Alternative

  sessions(first: Int, after: Cursor, last: Int, before: Cursor): SessionConnection!
  session(input: SessionSelectorInput!): Session
}

input ChangeInput {
  clientMutationId: String
  requestToken: String
  target: ChangeTargetInput
  commands: [KitChangeCommandInput!]!
}

input ChangeTargetInput @oneOf {
  live: LiveScopeInput
  draft: DraftScopeInput
  transaction: TransactionScopeInput
}

input ExecuteInput {
  clientMutationId: String
  requestToken: String
  commands: [ExecuteCommandInput!]!
}

type CommandTarget {
  live: Boolean!
  session: Session
  draft: Draft
  transaction: Transaction
}

type CommandReceipt {
  accepted: Boolean!
  requestToken: String
  commandTokens: [String!]!
  queuedAt: DateTime!
  target: CommandTarget
}

type ChangePayload {
  clientMutationId: String
  receipt: CommandReceipt!
}

type ExecutePayload {
  clientMutationId: String
  receipt: CommandReceipt!
}

enum StoreEventKind {
  CHANGE
  EXECUTE
  SESSION
  DRAFT
  TRANSACTION
  CHECKPOINT
  ALTERNATIVE
  BACKBONE
  CONFLICT
  SYNC
  STATE
  ERROR
}

enum EventPhase {
  ACCEPTED
  STARTED
  APPLIED
  COMPLETED
  FAILED
}

input EventSubjectSelectorInput @oneOf {
  type: TypeSelectorInput
  design: DesignSelectorInput
  piece: PieceSelectorInput
  connection: ConnectionSelectorInput
  port: PortSelectorInput
  connector: ConnectorSelectorInput
  representation: RepresentationSelectorInput
  family: FamilySelectorInput
  file: FileSelectorInput
  folder: FolderSelectorInput
  location: LocationSelectorInput
  author: AuthorSelectorInput
  concept: ConceptSelectorInput
  tag: TagSelectorInput
  quality: QualitySelectorInput
  prop: PropSelectorInput
  attribute: AttributeSelectorInput
  layer: LayerSelectorInput
  group: GroupSelectorInput
  stat: StatSelectorInput
  benchmark: BenchmarkSelectorInput
  session: SessionSelectorInput
  draft: DraftSelectorInput
  transaction: TransactionSelectorInput
  checkpoint: CheckpointSelectorInput
  alternative: AlternativeSelectorInput
  conflict: ConflictSelectorInput
}

input EventStreamInput {
  requestToken: String
  commandToken: String
  kinds: [StoreEventKind!]
  phases: [EventPhase!]
  subject: EventSubjectSelectorInput
  session: SessionSelectorInput
  draft: DraftSelectorInput
  transaction: TransactionSelectorInput
  checkpoint: CheckpointSelectorInput
  alternative: AlternativeSelectorInput
  conflict: ConflictSelectorInput
}

type UserError {
  code: String!
  message: String!
