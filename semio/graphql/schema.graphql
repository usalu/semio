# =========================
# Execute commands
# =========================

input ExecuteCommandInput @oneOf {
  session: SessionCommandInput
  draft: DraftCommandInput
  transaction: TransactionCommandInput
  checkpoint: CheckpointCommandInput
  alternative: AlternativeCommandInput
  backbone: BackboneCommandInput
  conflict: ConflictCommandInput
  sync: SyncCommandInput
}

input SessionCommandInput @oneOf {
  create: CreateSessionInput
  end: EndSessionInput
  createDraft: CreateDraftInput
}

input DraftCommandInput @oneOf {
  startTransaction: StartTransactionInput
  finalizeToCheckpoint: FinalizeDraftInput
  abort: AbortDraftInput
  undo: DraftUndoInput
  redo: DraftRedoInput
}

input TransactionCommandInput @oneOf {
  finalize: FinalizeTransactionInput
  abort: AbortTransactionInput
  undo: TransactionUndoInput
  undoAll: UndoAllTransactionInput
  redo: TransactionRedoInput
  redoAll: RedoAllTransactionInput
}

input CheckpointCommandInput @oneOf {
  markRelease: MarkReleaseInput
}

input AlternativeCommandInput @oneOf {
  create: CreateAlternativeInput
  unify: UnifyAlternativeInput
  setActiveCheckpoint: SetActiveCheckpointInput
}

input BackboneCommandInput @oneOf {
  attach: AttachBackboneInput
  detach: DetachBackboneInput
}

input ConflictCommandInput @oneOf {
  resolve: ResolveConflictInput
}

input SyncCommandInput @oneOf {
  now: SyncNowInput
}

input CreateSessionInput {
  clientSessionId: ID
}

input EndSessionInput {
  sessionId: ID!
}

input CreateDraftInput {
  sessionId: ID!
  checkpointId: ID
  alternativeId: ID
}

input StartTransactionInput {
  sessionId: ID!
  draftId: ID!
}

input FinalizeDraftInput {
  sessionId: ID!
  draftId: ID!
  message: String!
}

input AbortDraftInput {
  sessionId: ID!
  draftId: ID!
}

input DraftUndoInput {
  sessionId: ID!
  draftId: ID!
  count: Int! = 1
}

input DraftRedoInput {
  sessionId: ID!
  draftId: ID!
  count: Int! = 1
}

input FinalizeTransactionInput {
  sessionId: ID!
  draftId: ID!
  transactionId: ID!
}

input AbortTransactionInput {
  sessionId: ID!
  draftId: ID!
  transactionId: ID!
}

input TransactionUndoInput {
  sessionId: ID!
  draftId: ID!
  transactionId: ID!
}

input UndoAllTransactionInput {
  sessionId: ID!
  draftId: ID!
  transactionId: ID!
}

input TransactionRedoInput {
  sessionId: ID!
  draftId: ID!
  transactionId: ID!
}

input RedoAllTransactionInput {
  sessionId: ID!
  draftId: ID!
  transactionId: ID!
}

input MarkReleaseInput {
  checkpointId: ID!
}

input CreateAlternativeInput {
  name: String!
  fromCheckpointId: ID
}

input UnifyAlternativeInput {
  alternativeId: ID!
  message: String!
}

input SetActiveCheckpointInput {
  checkpointId: ID
}

input AttachBackboneInput @oneOf {
  dev: DevBackboneInput
  local: LocalBackboneInput
  remote: RemoteBackboneInput
}

input DevBackboneInput {
  path: String!
}

input LocalBackboneInput {
  folder: String!
}

input RemoteBackboneInput {
  url: String!
  sessionId: String!
}

input DetachBackboneInput {
  confirm: Boolean! = true
}

input ResolveConflictInput {
  conflictId: ID!
  resolution: ConflictResolution!
}

input SyncNowInput {
  confirm: Boolean! = true
}
