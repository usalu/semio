"""
Dual-channel WASM actor schema.

Design rules:
1. Queries are synchronous, in-memory reads only. They MUST NOT enqueue work.
2. Mutations validate input and enqueue work on the inbound JS -> WASM bus.
3. Subscriptions stream results/events from the outbound WASM -> JS bus.
4. The transport boundary remains the single exported `execute(...)` FFI entrypoint.
5. Most read payloads stay JSON during migration so command removal does not block on
   exhaustively typing the full DTO graph on day one.
"""
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"""
Arbitrary structured payloads for incremental migration.
Implement with `async_graphql::Json<serde_json::Value>` or a custom scalar.
"""
scalar JSON

"""
RFC 3339 / ISO-8601 timestamp.
"""
scalar DateTime

"""
Logical entity families observed across the current store and control surface.
"""
enum EntityKind {
  KIT
  TYPE
  DESIGN
  PIECE
  CONNECTION
  SIDE
  PORT
  CONNECTOR
  REPRESENTATION
  FAMILY
  FILE
  FOLDER
  LOCATION
  AUTHOR
  CONCEPT
  TAG
  QUALITY
  PROP
  ATTRIBUTE
  LAYER
  GROUP
  STAT
  BENCHMARK
}

"""
Outbound event categories emitted by the WASM actor.
"""
enum EventKind {
  COMMAND_ACCEPTED
  COMMAND_STARTED
  COMMAND_COMPLETED
  COMMAND_FAILED
  STATE_CHANGED
  SNAPSHOT_CHANGED
  VCS_STATE_CHANGED
  CONFLICTS_CHANGED
  INFO
  WARNING
  ERROR
}

"""
Lifecycle state for a single queued mutation.
"""
enum EventStatus {
  QUEUED
  RUNNING
  SUCCEEDED
  FAILED
}

type ErrorEvent {
  code: String!
  message: String!
  details: JSON
  recoverable: Boolean!
}

"""
Canonical outbound message delivered over the long-lived subscription.
`payload` is intentionally loose so the event contract can stabilize before the
entire DTO graph is fully retyped in GraphQL.
"""
type WasmEvent {
  id: ID!
  type: EventKind!
  status: EventStatus
  operation: String!
  clientMutationId: ID
  entityKind: EntityKind
  entityId: ID
  designId: ID
  sessionId: ID
  checkpointId: ID
  payload: JSON
  error: ErrorEvent
  emittedAt: DateTime!
}

type BackboneStatus {
  attached: Boolean!
  kind: String
  tip: ID
}

type CurrentState {
  snapshot: JSON!
  vcsState: JSON!
  canUndo: Boolean!
  canRedo: Boolean!
}

"""
Immediate reads against live in-memory state.
No queue, no background execution, no polling.
"""
type Query {
  """
  Convenience query for initial UI hydration.
  """
  currentState: CurrentState!

  """
  Live store DTO snapshot (`snapshot()` equivalent).
  """
  snapshot: JSON!

  """
  Materialized kit at a checkpoint; null / omitted checkpoint means initial materialization.
  """
  materializedKit(checkpointId: ID): JSON!

  """
  Full VCS tree snapshot for timeline / graph UI.
  """
  vcsState: JSON!

  """
  Backbone attachment status.
  """
  backboneStatus: BackboneStatus!

  """
  Current unresolved conflicts, if any.
  """
  conflicts: [JSON!]!

  """
  Top-level kit metadata.
  """
  kitMetadata: JSON!

  """
  All designs in the live graph.
  """
  designs: [JSON!]!

  """
  A single design DTO.
  """
  design(id: ID!): JSON

  """
  All types in the live graph.
  """
  types: [JSON!]!

  """
  A single type DTO.
  """
  typeById(id: ID!): JSON

  """
  All authors in the live graph.
  """
  authors: [JSON!]!

  """
  A single author DTO.
  """
  author(id: ID!): JSON

  """
  Piece metadata projection for one design.
  """
  piecesMetadata(designId: ID!): [JSON!]!

  """
  Full piece DTOs for one design.
  """
  pieces(designId: ID!): [JSON!]!

  """
  A single piece DTO within a design.
  """
  piece(designId: ID!, id: ID!): JSON

  """
  Full connection DTOs for one design.
  """
  connections(designId: ID!): [JSON!]!

  """
  A single connection DTO within a design.
  """
  connection(designId: ID!, id: ID!): JSON

  """
  Escape hatch for existing field-centric UI reads during the migration.
  """
  field(kind: EntityKind!, id: ID!, field: String!): JSON

  """
  Expose current undo state without enqueueing work.
  """
  canUndo: Boolean!

  """
  Expose current redo state without enqueueing work.
  """
  canRedo: Boolean!
}

"""
Every mutation below is fire-and-forget.
Resolvers validate, serialize a domain work item, push it onto the inbound queue,
and return `true` when the work item has been accepted for processing.
Result payloads arrive later on `eventStream`.
"""
type Mutation {
  # Generic graph edits
  patchEntityField(input: PatchEntityFieldInput!): Boolean!
  addChildEntity(input: AddChildEntityInput!): Boolean!
  removeChildEntity(input: RemoveChildEntityInput!): Boolean!

  # Design / piece / connection operations
  clusterPieces(input: ClusterPiecesInput!): Boolean!
  dragPieces(input: DragPiecesInput!): Boolean!
  movePieces(input: MovePiecesInput!): Boolean!
  fixPieces(input: FixPiecesInput!): Boolean!
  flattenDesign(input: FlattenDesignInput!): Boolean!
  expandDesign(input: ExpandDesignInput!): Boolean!
  deleteConnection(input: DeleteConnectionInput!): Boolean!
  changePieceType(input: ChangePieceTypeInput!): Boolean!
  pasteDesignSelection(input: PasteDesignSelectionInput!): Boolean!
  createHangingPieces(input: CreateHangingPiecesInput!): Boolean!
  createConnectedPiece(input: CreateConnectedPieceInput!): Boolean!
  createFixedPiece(input: CreateFixedPieceInput!): Boolean!

  # Undo / redo
  undo(input: UndoInput): Boolean!
  redo(input: RedoInput): Boolean!

  # Control-plane / VCS operations
  newSession(input: NewSessionInput): Boolean!
  endSession(input: EndSessionInput!): Boolean!
  newAlternative(input: NewAlternativeInput!): Boolean!
  setActiveCheckpoint(input: SetActiveCheckpointInput!): Boolean!
  attachBackbone(input: AttachBackboneInput!): Boolean!
  detachBackbone(input: DetachBackboneInput): Boolean!
  resolveConflict(input: ResolveConflictInput!): Boolean!
  syncNow(input: SyncNowInput): Boolean!
}

"""
Single outbound pipe for actor results, state changes, and async failures.
JS should open this once during boot and keep it alive for the worker lifetime.
"""
type Subscription {
  eventStream(
    types: [EventKind!]
    operation: String
    entityKind: EntityKind
    entityId: ID
    designId: ID
    sessionId: ID
    clientMutationId: ID
  ): WasmEvent!
}

"""
Common metadata carried by every mutation input.
Use `clientMutationId` to correlate a mutation with one or more later events.
"""
input PatchEntityFieldInput {
  clientMutationId: ID
  kind: EntityKind!
  id: ID!
  field: String!
  value: JSON!
}

input AddChildEntityInput {
  clientMutationId: ID
  parentKind: EntityKind!
  parentId: ID!
  childKind: EntityKind!
  child: JSON!
}

input RemoveChildEntityInput {
  clientMutationId: ID
  parentKind: EntityKind!
  parentId: ID!
  childKind: EntityKind!
  childId: ID!
}

input ClusterPiecesInput {
  clientMutationId: ID
  designId: ID!
  pieceIds: [ID!]!
  clusterName: String!
}

input DragPiecesInput {
  clientMutationId: ID
  designId: ID!
  pieceIds: [ID!]!
  du: Float!
  dv: Float!
}

input MovePiecesInput {
  clientMutationId: ID
  designId: ID!
  pieceIds: [ID!]!
  gap: Float!
  shift: Float!
  rise: Float!
}

input FixPiecesInput {
  clientMutationId: ID
  designId: ID!
  pieceIds: [ID!]!
}

input FlattenDesignInput {
  clientMutationId: ID
  designId: ID!
}

input ExpandDesignInput {
  clientMutationId: ID
  parentDesignId: ID!
  nestedDesignId: ID!
}

input DeleteConnectionInput {
  clientMutationId: ID
  designId: ID!
  connectionId: ID!
}

input ChangePieceTypeInput {
  clientMutationId: ID
  designId: ID!
  pieceId: ID!
  newTypeId: ID!
}

"""
`selection` and `plane` remain JSON because the existing selection/geometry DTOs are
substantial and can be typed later without changing the queueing model.
"""
input PasteDesignSelectionInput {
  clientMutationId: ID
  designId: ID!
  selection: JSON!
  plane: JSON
}

input CreateHangingPiecesInput {
  clientMutationId: ID
  designId: ID!
  typeIds: [ID!]!
  plane: JSON!
}

input CreateConnectedPieceInput {
  clientMutationId: ID
  designId: ID!
  parentPieceId: ID!
  parentPortId: ID!
  childTypeId: ID!
  childPortId: ID!
}

input CreateFixedPieceInput {
  clientMutationId: ID
  designId: ID!
  typeId: ID!
  plane: JSON!
}

input UndoInput {
  clientMutationId: ID
}

input RedoInput {
  clientMutationId: ID
}

input NewSessionInput {
  clientMutationId: ID
}

input EndSessionInput {
  clientMutationId: ID
  sessionId: ID!
}

input NewAlternativeInput {
  clientMutationId: ID
  name: String!
  fromCheckpoint: ID
}

input SetActiveCheckpointInput {
  clientMutationId: ID
  checkpointId: ID
}

"""
Opaque backbone config payload for the first migration cut.
This can be split into typed config inputs once the concrete transport variants settle.
"""
input AttachBackboneInput {
  clientMutationId: ID
  config: JSON!
}

input DetachBackboneInput {
  clientMutationId: ID
}

"""
`strategy` intentionally stays JSON so the worker can continue using the current
conflict-resolution structure while the GraphQL contract stabilizes.
"""
input ResolveConflictInput {
  clientMutationId: ID
  conflictId: ID!
  strategy: JSON!
}

input SyncNowInput {
  clientMutationId: ID
}
