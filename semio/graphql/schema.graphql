"""
GraphQL-native control surface for the dual-channel WASM actor.

Design constraints:
- Query exposes exactly one root read entrypoint: `kitStore(input: ...)`.
- Mutation exposes exactly two write entrypoints:
  - `change(...)` for kit-content mutations.
  - `execute(...)` for non-kit-changing control-plane / workflow commands.
- Subscription carries typed outbound worker events.
- No JSON escape hatches.
- Polymorphic command inputs use `@oneOf` input objects.
"""
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"""
Input-object sum type.
Exactly one field must be provided.
"""
directive @oneOf on INPUT_OBJECT

scalar DateTime

# =========================
# Root operations
# =========================

type Query {
  """
  Single synchronous read entrypoint.
  Omit `input.scope` to read the live working store.
  """
  kitStore(input: KitStoreQueryInput!): KitStore!
}

type Mutation {
  """
  Enqueue one or more kit-content changes.
  These mutate the kit graph, either directly or within a transaction context.
  """
  change(input: ChangeInput!): CommandReceipt!

  """
  Enqueue one or more non-kit-changing commands.
  This is the control surface for sessions, drafts, transactions,
  checkpoint / alternative operations, backbone control, conflicts, and sync.
  """
  execute(input: ExecuteInput!): CommandReceipt!
}

type Subscription {
  """
  Long-lived outbound event stream from the WASM actor.
  """
  eventStream(input: EventStreamInput): StoreEvent!
}

# =========================
# Query root model
# =========================

input KitStoreQueryInput {
  """
  Materialize the returned `kit` field against a specific historical or workflow context.
  Omit for the live working kit.
  """
  scope: KitStoreScopeInput
}

input KitStoreScopeInput @oneOf {
  atCheckpoint: AtCheckpointScopeInput
  atAlternativeTip: AtAlternativeTipScopeInput
  atDraft: AtDraftScopeInput
  atTransaction: AtTransactionScopeInput
}

input AtCheckpointScopeInput {
  checkpointId: ID!
}

input AtAlternativeTipScopeInput {
  alternativeId: ID!
}

input AtDraftScopeInput {
  sessionId: ID!
  draftId: ID!
}

input AtTransactionScopeInput {
  sessionId: ID!
  draftId: ID!
  transactionId: ID!
}

enum KitStoreViewKind {
  LIVE
  CHECKPOINT
  ALTERNATIVE_TIP
  DRAFT
  TRANSACTION
}

type KitStoreView {
  kind: KitStoreViewKind!
  checkpointId: ID
  alternativeId: ID
  sessionId: ID
  draftId: ID
  transactionId: ID
}

type KitStore {
  view: KitStoreView!
  kit: Kit!
  activeCheckpointId: ID
  backbone: BackboneStatus!
  conflicts: [KitConflict!]!
  checkpoints: [Checkpoint!]!
  checkpoint(id: ID!): Checkpoint
  alternatives: [Alternative!]!
  alternative(id: ID!): Alternative
  sessions: [Session!]!
  session(id: ID!): Session
}

# =========================
# Mutation envelopes
# =========================

input ChangeInput {
  requestId: ID
  target: ChangeTargetInput
  commands: [KitChangeCommandInput!]!
}

"""
If omitted, changes apply directly to the live working kit.
When provided, changes are scoped to a workflow context.
"""
input ChangeTargetInput {
  sessionId: ID
  draftId: ID
  transactionId: ID
}

input ExecuteInput {
  requestId: ID
  commands: [ExecuteCommandInput!]!
}

type CommandReceipt {
  accepted: Boolean!
  requestId: ID
  commandIds: [ID!]!
  queuedAt: DateTime!
}

# =========================
# Subscriptions
# =========================

enum StoreEventKind {
  CHANGE
  EXECUTE
  SESSION
  DRAFT
  TRANSACTION
  CHECKPOINT
  ALTERNATIVE
  BACKBONE
  CONFLICT
  SYNC
  STATE
  ERROR
}

enum EventPhase {
  ACCEPTED
  STARTED
  APPLIED
  COMPLETED
  FAILED
}

input EventStreamInput {
  requestId: ID
  commandId: ID
  kinds: [StoreEventKind!]
  phases: [EventPhase!]
  entityKind: EntityKind
  entityId: ID
  sessionId: ID
  draftId: ID
  transactionId: ID
  checkpointId: ID
  alternativeId: ID
}

type StoreEvent {
  id: ID!
  requestId: ID
  commandId: ID
  kind: StoreEventKind!
  phase: EventPhase!
  entity: EntityRef
  sessionId: ID
  draftId: ID
  transactionId: ID
  checkpointId: ID
  alternativeId: ID
  conflictId: ID
  message: String
  error: UserError
  at: DateTime!
}

type UserError {
  code: String!
  message: String!
  recoverable: Boolean!
}

# =========================
# Domain enums / refs
# =========================

enum EntityKind {
  KIT
  TYPE
  DESIGN
  PIECE
  CONNECTION
  SIDE
  PORT
  CONNECTOR
  REPRESENTATION
  FAMILY
  FILE
  FOLDER
  LOCATION
  AUTHOR
  CONCEPT
  TAG
  QUALITY
  PROP
  ATTRIBUTE
  LAYER
  GROUP
  STAT
  BENCHMARK
  SESSION
  DRAFT
  TRANSACTION
  CHECKPOINT
  ALTERNATIVE
  CONFLICT
}

type EntityRef {
  kind: EntityKind!
  id: ID!
}

enum TransactionState {
  OPEN
  FINALIZED
}

enum ChangeKind {
  INFERRED
  SET_KIT_METADATA
  ADD_TYPE
  REMOVE_TYPE
  MODIFY_TYPE
  ADD_DESIGN
  REMOVE_DESIGN
  MODIFY_DESIGN
  ADD_PIECE
  REMOVE_PIECE
  CONNECT
  DISCONNECT
  UNIFY_CHECKPOINTS
  MARK_RELEASE
  OTHER
}

enum ConflictResolution {
  DROP_WIP
  FORCE_OVERWRITE_BACKBONE
}

