}

input AttributeSelectorInput @oneOf {
  byId: EntityIdInput
  byKey: KeySelectorInput
}

input LayerSelectorInput @oneOf {
  byId: EntityIdInput
  byName: NameSelectorInput
}

input GroupSelectorInput @oneOf {
  byId: EntityIdInput
  byName: NameSelectorInput
}

input StatSelectorInput @oneOf {
  byId: EntityIdInput
  byKey: KeySelectorInput
}

input BenchmarkSelectorInput @oneOf {
  byId: EntityIdInput
  byKey: KeySelectorInput
}

input SessionSelectorInput @oneOf {
  byId: EntityIdInput
}

input DraftSelectorInput @oneOf {
  byId: EntityIdInput
