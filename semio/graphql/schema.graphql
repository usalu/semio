input ConnectionInputNode {
  """
  💬 The optional human-readable description of the connection.
  """
  description: String = ""

  """
  ↕️ The optional longitudinal gap (applied after rotation and tilt in connector direction) between the connected and the connecting piece.
  """
  gap: Float = 0

  """
  ↔️ The optional lateral shift (applied after the rotation, the turn and the tilt in the plane) between the connected and the connecting piece..
  """
  shift: Float = 0

  """
  🪜 The optional vertical rise in connector direction between the connected and the connecting piece. Set this only when necessary as it is not a symmetric property which means that when the parent piece and child piece are flipped it yields a different result.
  """
  rise: Float = 0

  """
  🔄 The optional horizontal rotation in connector direction between the connected and the connecting piece in degrees.
  """
  rotation: Float = 0

  """
  🛞 The optional turn perpendicular to the connector direction (applied after rotation and the turn) between the connected and the connecting piece in degrees.  Set this only when necessary as it is not a symmetric property which means that when the parent piece and child piece are flipped it yields a different result.
  """
  turn: Float = 0

  """
  ↗️ The optional horizontal tilt perpendicular to the connector direction (applied after rotation and the turn) between the connected and the connecting piece in degrees.
  """
  tilt: Float = 0

  """
  ➡️ The optional offset in x direction between the icons of the child and the parent piece in the diagram. One unit is equal the width of a piece icon.
  """
  x: Float = 0

  """
  ⬆️ The optional offset in y direction between the icons of the child and the parent piece in the diagram. One unit is equal the width of a piece icon.
  """
  y: Float = 0

  """
  🧲 The connected side of the connection.
  """
  connected: SideInputNode!

  """
  🧲 The connecting side of the connection.
  """
  connecting: SideInputNode!
}

input SideInputNode {
  piece: PieceIdInputNode!
  connector: ConnectorIdInputNode!
}

