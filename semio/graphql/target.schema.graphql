# Extension of the [relay specs](https://relay.dev/docs/guides/graphql-server-specification)

#region Scalars

scalar Timestamp

#endregion Scalars

#region Entities

interface Node {
  id: ID!
}

interface Entity implements Node {
  id: ID!
  hash: String!
  owner: Entity
  owns: [Entity!]!
}

# interface ENTITYEdge {
#   cursor: String! // an entity id
#   node: ENTITY
# }

# type PageInfo {
#   hasNextPage: Boolean!
#   hasPreviousPage: Boolean!
