# Custom semio extension of the [relay specs](https://relay.dev/docs/guides/graphql-server-specification)

#region Scalars

scalar Timestamp

#endregion Scalars

#region Entities

interface Node {
  id: ID!
}

union EntityConnection = DiffConnection | VectorConnection | 

interface Entity implements Node { // Our own extension ontop of the relay specs
  id: ID!
  hash: String! 
  owner: Entity
  owns: EntityConnection
}

interface EntityEdge {
  cursor: String! // an entity id
  # node: ENTITY
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String // start at this entity
  endCursor: String // end at this entity
}

interface EntityConnection {
  # edges: [ENTITYEdge]
  pageInfo: PageInfo!
  hash: String! // Our own extension ontop of the relay specs
}

#region Weak // Weak entities have hash as id

# interface WeakEntity implements Entity {
#   id: ID! # hash
# }

# interface Modification implements WeakEntity {
  # FIELD: NULLABLE FIELD // if the field was modified then return the modified value
  # removeNULLABLEFIELD: Boolean // use this if the field is by default nullable to indicate that it was removed
# }

union Modification = PlaneModification | AttributeModification

interface Diff implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection

  before: Entity!
  modification: Modification!
  after: Entity!
}

union DiffConnection = PlaneDiffConnection | PointDiffConnection

type Diffs implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection

  removed: EntityConnection
  diffs: DiffConnection
  added: EntityConnection
}

#region Vector

input VectorInput {
  x: Float!
  y: Float!
  z: Float!
}

union VectorOwner = Plane | PlaneModification
# union VectorOwned = Nothing

type Vector implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity # VectorOwner
  owns: EntityConnection # VectorOwned

  x: Float!
  y: Float!
  z: Float!
}

type VectorConnection implements EntityConnection {
  edges: [VectorEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

#endregion Vector

#region Point

input PointInput {
  x: Float!
  y: Float!
  z: Float!
}

union PointOwner = Plane | PlaneModification
# union PointOwned = Nothing

type Point implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection

  x: Float!
  y: Float!
  z: Float!
}

#endregion Point

#region Coordinate

input CoordinateInput {
  u: Float!
  v: Float!
}

union CoordinateOwner = Position | PositionModification
# union CoordinateOwned = Nothing

type Coordinate implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity # CoordinateOwner
  owns: EntityConnection # CoordinateOwned

  u: Float!
  v: Float!
}

#endregion Coordinate

#region Offset

input OffsetInput {
  u: Float!
  v: Float!
}


union OffsetOwner = Position | PositionModification
# union OffsetOwned = Nothing

type Offset implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity # OffseteOwner
  owns: EntityConnection # OffseteOwned

  u: Float!
  v: Float!
}

#endregion Offset

#region Plane

input PlaneInput {
  origin: PointInput!
  xAxis: VectorInput!
  yAxis: VectorInput!
}

#endregion Plane

union PlaneOwner = Piece | PieceModification | PlaneDiff

type Plane implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity # PlaneOwner
  owns: EntityConnection # PlaneOwned

  origin: Point!
  xAxis: Vector!
  yAxis: Vector!
}

type PlaneModification implements Entity { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection

  origin: Point
  xAxis: Vector
  yAxis: Vector
}

#endregion Plane

#region Position

input PositionInput {
  center: CoordinateInput!
  plane: PlaneInput!
}

type Position implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection

  center: Coordinate!
  plane: Plane!
}

type PositionModification implements Entity { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  center: Coordinate
  plane: Plane
}

type PositionDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  before: Entity! # Position
  modification: PositionModification!
  after: Entity! # Position
}

#endregion Position

#region Location

input LocationInput {
  longitude: Float!
  latitude: Float!
  altitude: Float
}

type Location implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  longitude: Float!
  latitude: Float!
  altitude: Float!
}

type LocationModification implements Entity { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  longitude: Float
  latitude: Float
  altitude: Float
}

type LocationDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  before: Entity! # Location
  modification: LocationModification!
  after: Entity! # Location
}

#endregion Location

#region Attribute

input AttributeInput {
  key: String!
  value: String
  definition: String
}

type Attribute implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  key: String!
  value: String!
  definition: String!
}

type AttributeModification implements Entity { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  key: String
  value: String
  definition: String
}

type AttributeDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  before: Entity! # Attribute
  modification: Entity! # AttributeModification
  after: Entity! # Attribute
}

type AttributeDiffConnection {
  edges: [AttributeEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

type AttributesDiff implements Diffs {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  removed: EntityConnection # Attribute
  diffs: DiffConnection # AttributeDiffConnection
  added: EntityConnection # Attribute
}

#endregion Attribute

#endregion Weak

#region Strong

# interface StrongEntity implements Entity {
#   id: ID! # uuidv7
#   hash: String!
#   owner: Entity # ENTITYKIND
#   owns: EntityConnection # ENTITYKIND
# }

union Input = RenamedKitInput | ChangedDescriptionInput | CreatedFixedPieceInput | FixedPieceInput | DraggedPieceInput

interface Operation implements Entity { # implements StrongEntity
  id: ID! # uuidv7
  hash: String!
  owner: Entity # Change
  owns: EntityConnection # Input
  diff: Diff!
  input: Input
}

#region Kit

#region Place

type Place implements Entity { # implements StrongEntity
  id: ID!
  hash: String!
  owner: Entity!
  owns: EntityConnection
  name: String
  location: Location
}

type PlaceModification implements Entity { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  name: String
  location: LocationModification
  removeLocation: Boolean
}

type PlaceDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: EntityConnection
  before: Place!
  modification: PlaceModification!
  after: Place!
}

#endregion Place

#region Folder

union FolderOwner = Kit | Folder
union FolderOwned = Folder | File | Design | Type

type Folder implements Entity { # implements StrongEntity
  id: ID!
  hash: String!
  owner: Entity! # FolderOwner
  owns: EntityConnection # FolderOwned
  name: String!
  path: String!
  description: String!
}

#endregion Folder

#region File

union FileOwner = Kit | Folder

type File implements Entity { # implements StrongEntity
  id: ID!
  hash: String!
  owner: Entity! # FileOwner
  owns: EntityConnection # Nothing
  url: String!
  mime: String
  size: Int
  description: String
  created: Timestamp
  updated: Timestamp
}

#endregion File

