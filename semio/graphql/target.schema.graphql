# Custom semio extension of the [relay specs](https://relay.dev/docs/guides/graphql-server-specification)

#region Scalars

scalar Timestamp

#endregion Scalars

#region Entities

interface Node {
  id: ID!
}

interface Entity implements Node { # Our own extension ontop of the relay specs
  id: ID!
  hash: String!
  owner: Entity
  owns: EntityConnection
}

interface EntityEdge {
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String # start at this entity
  endCursor: String # end at this entity
}

interface EntityConnectionInterface {
  # edges: [ENTITYEdge]
  pageInfo: PageInfo!
  hash: String! # Our own extension ontop of the relay specs
}

union EntityConnection =
  | AlternativeConnection
  | AttributeDiffConnection
  | AttributeListingConnection
  | AuthorConnection
  | BridgeConnection
  | ChangeConnection
  | CheckpointConnection
  | ConnectorConnection
  | CoordinateConnection
  | DesignConnection
  | DraftConnection
  | DiffsConnection
  | FileConnection
  | FolderConnection
  | GraphConnection
  | KitConnection
  | LocationConnection
  | LocationDiffConnection
  | LocationModificationConnection
  | OffsetConnection
  | PieceListingConnection
  | PlaneConnection
  | PlaneDiffConnection
  | PlaneModificationConnection
  | PlaceConnection
  | PlaceDiffConnection
  | PlaceModificationConnection
  | PointConnection
  | PointDiffConnection
  | PositionConnection
  | PositionModificationConnection
  | RepresentationConnection
  | SessionConnection
  | TransactionConnection
  | TypeConnection
  | VectorConnection

#region Weak // Weak entities have hash as id

# interface WeakEntity implements Entity {
#   id: ID! # hash
# }

#region Diffs

# interface Modification implements WeakEntity {
# FIELD: NULLABLE FIELD // if the field was modified then return the modified value
# removeNULLABLEFIELD: Boolean // use this if the field is by default nullable to indicate that it was removed
# }

union Modification = PlaneModification | AttributeModification

union DiffOwner = Diffs | Change | Operation
union DiffOwned = PlaneDiff | PointDiff | AttributeDiff | LocationDiff | PlaceDiff

interface Diff implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity # DiffOwner
  owns: EntityConnection # DiffOwned
  before: Entity!
  modification: Modification!
  after: Entity!
}

union DiffsOwner = Diff | Operation | Change
union DiffsOwned = Diffs | PlaneDiff | PointDiff | AttributeDiff | LocationDiff | PlaceDiff

type Diffs implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity # DiffsOwner
  owns: EntityConnection #DiffsOwned
  removed: EntityConnection
  diffs: DiffConnection
  added: EntityConnection
}

type DiffsEdge implements EntityEdge {
  cursor: String!
  node: Diffs!
}

type DiffsConnection implements EntityConnectionInterface {
  edges: [DiffsEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

#endregion Diffs

