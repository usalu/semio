#region Piece

enum PieceConnectionKind {
  FIXED
  CONNECTED
}

union Blueprint = Type | Design

type Piece implements Entity {
  id: ID!
  hash: String!
  owner: Entity! # Blueprint
  owns: EntityConnection
  name: String
  description: String
  position: Position
  scale: Float
  blueprint: Blueprint!
  connectionKind: PieceConnectionKind
  flatPosition: Position!
  replaceableBlueprint: [Blueprint!]!
  parentConnection: Connection
  childConnections: [Connection!]!
  parentPiece: Piece
  childPieces: [Piece!]!
  depth: Int!
  path: [Piece!]!
  props: [Prop!]!
  attributes: [Attribute!]!
}

type Connection implements Entity {
  id: ID!
  hash: String!
  owner: Design!
  owns: EntityConnection
  connected: Side!
  connecting: Side!
  gap: Float
  shift: Float
  rise: Float
  rotation: Float
  turn: Float
  tilt: Float
  u: Float
  v: Float
  description: String
  attributes: [Attribute!]!
}

