#region Weak // Weak entities have hash as id

# interface WeakEntity implements Entity {
#   id: ID! # hash
# }

# interface Modification implements WeakEntity {
  # FIELD: NULLABLE FIELD // if the field was modified then return the modified value
  # removeNULLABLEFIELD: Boolean // use this if the field is by default nullable to indicate that it was removed
# }

interface Diff implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  before: Entity!
  # modification: Modification!
  after: Entity!
}

interface Diffs implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  removed: [Entity!]!
  diffs: [Diff!]!
  added: [Entity!]!
}

input VectorInput {
  x: Float!
  y: Float!
  z: Float!
}

type Vector implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  x: Float!
  y: Float!
  z: Float!
}

input PointInput {
  x: Float!
  y: Float!
  z: Float!
}

type Point implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  x: Float!
  y: Float!
  z: Float!
}

input CoordinateInput {
  u: Float!
  v: Float!
}

type Coordinate implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  u: Float!
  v: Float!
}

input OffsetInput {
  u: Float!
  v: Float!
}

type Offset implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  u: Float!
  v: Float!
}

input PlaneInput {
  origin: PointInput!
  xAxis: VectorInput!
  yAxis: VectorInput!
}

type Plane implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  origin: Point!
  xAxis: Vector!
  yAxis: Vector!
}

input PositionInput {
  center: CoordinateInput!
  plane: PlaneInput!
}

type Position implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  center: Coordinate!
  plane: Plane!
}

type PositionModification implements Entity { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  center: Coordinate
  plane: Plane
}

type PositionDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  before: Entity! # Position
  modification: PositionModification!
  after: Entity! # Position
}

input LocationInput {
  longitude: Float!
  latitude: Float!
  altitude: Float
}

type Location implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  longitude: Float!
  latitude: Float!
  altitude: Float!
}

type LocationModification implements Entity { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  longitude: Float
  latitude: Float
  altitude: Float
}

type LocationDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  before: Entity! # Location
  modification: LocationModification!
  after: Entity! # Location
}

input AttributeInput {
  key: String!
  value: String
  definition: String
}

type Attribute implements Entity { # implements WeakEntity
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  key: String!
  value: String!
  definition: String!
}

type AttributeModification { # implements Modification
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  key: String
  value: String
  definition: String
}

type AttributeDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  before: Attribute!
  modification: AttributeModification!
  after: Attribute!
}

type AttributesDiff implements Diffs {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  removed: [Attribute!]
  diffs: [AttributeDiff!]
  added: [Attribute!]
}

#endregion Weak

#region Strong

# interface StrongEntity implements Entity {
#   id: ID! # uuidv7
#   hash: String!
#   owner: Entity # ENTITYKIND
#   owns: [Entity!]! # ENTITYKIND
# }

union Input = RenamedKitInput | ChangedDescriptionInput | CreatedFixedPieceInput | FixedPieceInput | DraggedPieceInput

interface Operation implements Entity { # implements StrongEntity
  id: ID! # uuidv7
  hash: String!
  owner: Entity # Change
  owns: [Entity!]! # Input
  diff: Diff!
  input: Input
}

#region Kit

#region Place

type Place implements Entity { # implements StrongEntity
  id: ID!
  hash: String!
  owner: Entity!
  owns: [Entity!]!
  name: String
  location: Location
}

type PlaceModification implements Entity { # implements Modification
  id: ID! # hash
  name: String
  location: LocationModification
  removeLocation: Boolean
}

type PlaceDiff implements Diff {
  id: ID! # hash
  hash: String!
  owner: Entity
  owns: [Entity!]!
  before: Place!
  modification: PlaceModification!
  after: Place!
}

#endregion Place

#region Folder

union FolderOwner = Kit | Folder
union FolderOwned = Folder | File | Design | Type

type Folder implements Entity { # implements StrongEntity
  id: ID!
  hash: String!
  owner: Entity! # FolderOwner
  owns: [Entity!]! # FolderOwned
  name: String!
  path: String!
  description: String!
}

#endregion Folder

#region File

union FileOwner = Kit | Folder

type File implements Entity { # implements StrongEntity
  id: ID!
  hash: String!
  owner: Entity! # FileOwner
  owns: [Entity!]! # Nothing
  url: String!
  mime: String
  size: Int
  description: String
  created: Timestamp
  updated: Timestamp
}

#endregion File

#region Author

type Author {
  id: ID!
  name: String!
  email: String!
  role: String
  rank: Int
  drafts: [Draft!]!
  transactions: [Transaction!]!
  checkpoints: [Checkpoints!]!
}

#endregion Author

#region Prop

type Prop {
  id: ID!
  key: String!
  value: String!
  unit: String
  quality: Quality
}

#endregion Prop

#region Benchmark

type Benchmark {
  id: ID!
  name: String!
  min: Float
  max: Float
  minExcluded: Boolean
  maxExcluded: Boolean
}

#endregion Benchmark

#region Quality

type Quality {
  id: ID!
  key: String!
  value: String
  unit: String
  definition: String
  description: String
  benchmarks: [Benchmark!]!
}

#endregion Quality

#region Tag

type Tag {
  id: ID!
  name: String!
  order: Int
}

#endregion Tag

#region Concept

type Concept {
  id: ID!
  name: String!
  description: String
  order: Int
}

#endregion Concept

#region Stat

type Stat {
  id: ID!
  key: String!
  value: String!
  unit: String
  description: String
}

#endregion Stat

#region Type

type Connector implements Entity {
  id: ID!
  hash: String!
  owner: Type!
  code: String!
  description: String
  portId: ID
  qualities: [Quality!]!
  attributes: [Attribute!]!
}

type Representation implements Entity {
  id: ID!
  hash: String!
  owner: Type!
  url: String!
  description: String
  file: File
  tags: [Tag!]!
  qualities: [Quality!]!
  attributes: [Attribute!]!
}

type Type implements Entity {
  id: ID!
  hash: String!
  owner: Kit!
  name: String!
  description: String
  icon: String
  image: String
  unit: String
  created: Timestamp
  updated: Timestamp
  connectors: [Connector!]!
  connector(id: ID!): Connector
  representations: [Representation!]!
  representation(id: ID!): Representation
  bestRepresentation(tagIds: [ID!]!): Representation
  authors: [Author!]!
  concepts: [Concept!]!
  tags: [Tag!]!
  qualities: [Quality!]!
  props: [Prop!]!
  attributes: [Attribute!]!
  stats: [Stat!]!
}

#endregion Type

#region Design

#region Layer

type Layer {
  id: ID!
  name: String!
  description: String
  color: String
  order: Int
  visible: Boolean
  locked: Boolean
}

#endregion Layer

#region Group

type Group {
  id: ID!
  name: String!
  description: String
  color: String
  icon: String
  pieces: [Piece!]!
}

#endregion Group

#region Piece

enum PieceConnectionKind {
  FIXED
  CONNECTED
}

union Blueprint = Type | Design

type Piece implements Entity {
  id: ID!
  hash: String!
  owner: Blueprint!
  name: String
  description: String
  position: Position
  scale: Float
  blueprint: Blueprint!
  connectionKind: PieceConnectionKind
  flatPosition: Position!
  replaceableBlueprint: [Blueprint!]!
  parentConnection: Connection
  childConnections: [Connection!]!
  parentPiece: Piece
  childPieces: [Piece!]!
  depth: Int!
  path: [Piece!]!
  props: [Prop!]!
  attributes: [Attribute!]!
}

type Connection implements Entity {
  id: ID!
  hash: String!
  owner: Design!
  connected: Side!
  connecting: Side!
  gap: Float
  shift: Float
  rise: Float
  rotation: Float
  turn: Float
  tilt: Float
  u: Float
  v: Float
  description: String
  attributes: [Attribute!]!
}

#region Operations

type CreatedFixedPieceInput {
  designId: ID!
  blueprintId: ID!
  position: Position!
  name: String
  description: String
}

type CreatedFixedPiece implements Operation {
  id: ID!
  hash: String!
  owner: Change!
  input: CreatedFixedPieceInput!
  diff: Diff!
  piece: Piece!
}

type FixedPieceInput {
  designId: ID!
  pieceId: ID!
}

type FixedPiece implements Operation {
  id: ID!
  hash: String!
  owner: Change!
  input: FixedPieceInput!
  diff: Diff!
  piece: Piece!
}

type DraggedPieceInput {
  designId: ID!
  pieceIds: [ID!]!
  offset: Offset!
}

type DraggedPiece implements Operation {
  id: ID!
  hash: String!
  owner: Change!
  input: DraggedPieceInput!
  diff: Diff!
  pieces: [Piece!]!
}

#endregion Operations

#endregion Piece

#region Connection

#region Side

type Side {
  id: ID!
  piece: Piece!
  port: Connector
  designPiece: Piece
  connector: Connector
}

#endregion Side

#endregion Connection

type Design implements Entity {
  id: ID!
  hash: String!
  owner: Kit!
  name: String!
  description: String
  icon: String
  image: String
  place: Place
  unit: String
  created: Timestamp
  updated: Timestamp
  pieces: [Piece!]!
  piece(id: ID!): Piece
  connections: [Connection!]!
  connection(id: ID!): Connection
  layers: [Layer!]!
  groups: [Group!]!
  authors: [Author!]!
  concepts: [Concept!]!
  tags: [Tag!]!
  qualities: [Quality!]!
  props: [Prop!]!
  attributes: [Attribute!]!
  stats: [Stat!]!
  qualitySum(qualityId: ID!): Float!
  references: [Design!]!
  referencedBy: [Piece!]!
}

#endregion Design

type Kit implements Entity {
  id: ID!
  hash: String!
  owner: Graph
  checkpoint: Checkpoint
  draft: Draft
  transaction: Transaction
  name: String!
  description: String
  icon: String
  image: String
  preview: String
  remote: String
  homepage: String
  license: String
  uri: String
  created: Timestamp
  updated: Timestamp
  version: String
  design(id: ID!): Design
  designs: [Design!]!
  type(id: ID!): Type
  types: [Type!]!
  files: [File!]!
  folders: [Folder!]!
  authors: [Author!]!
  concepts: [Concept!]!
  tags: [Tag!]!
  qualities: [Quality!]!
  props: [Prop!]!
  attributes: [Attribute!]!
  stats: [Stat!]!
}

#region Operations

type RenamedKitInput {
  name: String!
}

type RenamedKit implements Operation & Entity {
  id: ID!
  hash: String!
  owner: Change!
  input: RenamedKitInput!
  diff: Diff!
  kit: Kit!
}

type ChangedDescriptionInput {
  description: String!
}

type ChangedDescription implements Operation & Entity {
  id: ID!
  hash: String!
  owner: Change!
  input: ChangedDescriptionInput!
  diff: Diff!
  entity: Entity!
}

#endregion Operations

#endregion Kit

#endregion Entities

#region VCS

union ChangeOwner = Transaction | Draft | Checkpoint

type Change implements Entity {
  id: ID!
  hash: String!
  owner: ChangeOwner!
  description: String
  origin: String
  forwards: [Operation!]!
  backwards: [Operation!]!
  sequenceNumber: Int!
}

type Transaction implements Entity {
  id: ID!
  hash: String!
  owner: Draft
  changes: [Change!]!
}

type Draft implements Entity {
  id: ID!
  hash: String!
  owner: Author!
  parentCheckpoint: Checkpoint
  targetAlternative: Alternative
  openTransaction: Transaction
  finalizedTransactions: [Transaction!]!
  redoTransactions: [Transaction!]!
  changes: [Change!]!
  canUndo(steps: Int!): Boolean!
  canRedo(steps: Int!): Boolean!
}

type Checkpoint implements Entity {
  id: ID!
  hash: String!
  timestamp: Timestamp
  authors: [Author!]!
  root: Kit
  parentCheckpoint: Checkpoint
  message: String
  isRelease: Boolean!
  changeCount: Int!
}

type Alternative implements Entity {
  id: ID!
  hash: String!
  owner: Graph
  name: String!
  start: Checkpoint!
  checkpoints: [Checkpoint!]!
  store: Kit!
  draft: Draft
  transaction: Transaction
}

type Graph implements Entity {
  id: ID!
  hash: String!
  owner: Session
  theKit: Kit
  alternative(id: ID!): Alternative
  alternatives: [Alternative!]!
  checkpoint(id: ID!): Checkpoint
  checkpoints: [Checkpoint!]!
  release(id: ID!): Checkpoint
  releases: [Checkpoint!]!
}

type Session {
  id: ID!
  startedAt: Timestamp
  drafts: [Draft!]!
}

type ReadVersion {
  checkpoint: Checkpoint
  change: Change
  operation: Operation
}

type WriteVersion {
  draft: Draft
  transaction: Transaction
  checkpoint: Checkpoint
  change: Change
  operation: Operation
}

enum ConflictKind {

}

type Conflict {
  id: ID!
  authoritativeVersion: ReadVersion
  transactionVersion: WriteVersion
  reason: String!
  createdAt: Timestamp!
}

#endregion VCS

#region Schema

type Query {
  session: Session!
  wip: Graph!
  authoritative: Graph
  conflicts: [Conflict!]!
  node(id: ID!): Node
  entity(id: ID!): Entity
}

type Mutation {
  renameKit(draftId: ID!, transactionId: ID!, name: String!): ID!
  changeDescription(draftId: ID!, transactionId: ID!, description: String!): ID!
  createFixedPiece(draftId: ID!, transactionId: ID!, designId: ID!, position: PositionInput!, name: String, description: String): ID!
  fixPiece(draftId: ID!, transactionId: ID!, designId: ID!, pieceId: ID!): ID!
}

type Subscription {
  commandSucceeded: Command!
  operationSucceeded: Operation!
  operationFailed: Error!
  kitRenamed: RenamedKit!
  descriptionChanged: ChangedDescription!
  createdFixedPiece: CreatedFixedPiece!
  fixedPiece: FixedPiece!
  draggedPiece: DraggedPiece!
  error: Error!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

#endregion Schema
