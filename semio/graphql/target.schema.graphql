  name: String!
}

type RenamedKit implements Operation & Entity {
  id: ID!
  hash: String!
  owner: Change!
  owns: EntityConnection
  input: RenamedKitInput!
  diff: Diff!
  kit: Kit!
}

type ChangedDescriptionInput {
  entityId: ID!
  description: String!
}

type ChangedDescription implements Operation & Entity {
