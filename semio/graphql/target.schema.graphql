scalar Timestamp

#region Entities

#region Weak

input VectorInput {
  x: Float!
  y: Float!
  z: Float!
}

type Vector {
  x: Float!
  y: Float!
  z: Float!
}

input PointInput {
  x: Float!
  y: Float!
  z: Float!
}

type Point {
  x: Float!
  y: Float!
  z: Float!
}

input CoordinateInput {
  u: Float!
  v: Float!
}

type Coordinate {
  u: Float!
  v: Float!
}

input OffsetInput {
  u: Float!
  v: Float!
}

type Offset {
  u: Float!
  v: Float!
}

input PlaneInput {
  origin: PointInput!
  xAxis: VectorInput!
  yAxis: VectorInput!
}

type Plane {
  origin: Point!
  xAxis: Vector!
  yAxis: Vector!
}

input PositionInput {
  center: CoordinateInput!
  plane: PlaneInput!
}

type Position {
  center: Coordinate!
  plane: Plane!
}

input LocationInput {
  longitude: Float!
  latitude: Float!
  altitude: Float
}

type Location {
  longitude: Float!
  latitude: Float!
  altitude: Float
}

#endregion Weak

#region Strong

type Place {
  id: ID!
  name: String
  place: Place
}

type File {
  id: ID!
  url: String!
  mime: String
  size: Int
  hash: String!
  description: String
  created: Timestamp
  updated: Timestamp
}

type Folder {
  id: ID!
  path: String!
  description: String
}

type Author {
  id: ID!
  name: String!
  email: String!
  role: String
  rank: Int
  drafts: [Draft!]!
  transactions: [Transaction!]!
  checkpoints: [Checkpoints!]!
}

type Attribute {
  id: ID!
  key: String!
  value: String!
  definition: String
}

type Prop {
  id: ID!
  key: String!
  value: String!
  unit: String
  quality: Quality
}

type Benchmark {
  id: ID!
  name: String!
  min: Float
  max: Float
  minExcluded: Boolean
  maxExcluded: Boolean
}

type Quality {
  id: ID!
  key: String!
  value: String
  unit: String
  definition: String
  description: String
  benchmarks: [Benchmark!]!
}

type Tag {
  id: ID!
  name: String!
  order: Int
}

type Concept {
  id: ID!
  name: String!
  description: String
  order: Int
}

type Stat {
  id: ID!
  key: String!
  value: String!
  unit: String
  description: String
}

type Layer {
  id: ID!
  name: String!
  description: String
  color: String
  order: Int
  visible: Boolean
  locked: Boolean
}

type Group {
  id: ID!
  name: String!
  description: String
  color: String
  icon: String
  pieces: [Piece!]!
}

#endregion Shared Entities

#region Strong

interface Entity {
  id: ID!
  hash: String!
}

union OperationInput = RenamedKitInput | ChangedDescriptionInput | CreatedFixedPieceInput | FixedPieceInput | DraggedPieceInput

interface Operation implements Entity {
  id: ID!
  hash: String!
  owner: Change!
  diff: Diff!
  input: OperationInput
}

#region Kit

#region Type

type Connector implements Entity {
  id: ID!
  hash: String!
  owner: Type!
  code: String!
  description: String
  portId: ID
  qualities: [Quality!]!
  attributes: [Attribute!]!
}

type Representation implements Entity {
  id: ID!
  hash: String!
  owner: Type!
  url: String!
  description: String
  file: File
  tags: [Tag!]!
  qualities: [Quality!]!
  attributes: [Attribute!]!
}

type Type implements Entity {
  id: ID!
  hash: String!
  owner: Kit!
  name: String!
  description: String
  icon: String
  image: String
  unit: String
  created: Timestamp
  updated: Timestamp
  connectors: [Connector!]!
  connector(id: ID!): Connector
  representations: [Representation!]!
  representation(id: ID!): Representation
  bestRepresentation(tagIds: [ID!]!): Representation
  authors: [Author!]!
  concepts: [Concept!]!
  tags: [Tag!]!
  qualities: [Quality!]!
  props: [Prop!]!
  attributes: [Attribute!]!
  stats: [Stat!]!
}

#endregion Type

#region Design

#region Piece

enum PieceConnectionKind {
  FIXED
  CONNECTED
}

union Blueprint = Type | Design

type Piece implements Entity {
  id: ID!
  hash: String!
  owner: Blueprint!
  name: String
  description: String
  pose: Position
  scale: Float
  blueprint: Blueprint!
  connectionKind: PieceConnectionKind
  flatPosition: Position!
  replaceableBlueprint: [Blueprint!]!
  parentConnection: Connection
  childConnections: [Connection!]!
  parentPiece: Piece
  childPieces: [Piece!]!
  depth: Int!
  path: [Piece!]!
  props: [Prop!]!
  attributes: [Attribute!]!
}

type Connection implements Entity {
  id: ID!
  hash: String!
  owner: Design!
  connected: Side!
  connecting: Side!
  gap: Float
  shift: Float
  rise: Float
  rotation: Float
  turn: Float
  tilt: Float
  u: Float
  v: Float
  description: String
  attributes: [Attribute!]!
}

#region Operations

type CreatedFixedPieceInput {
  designId: ID!
  blueprintId: ID!
  pose: Position!
  name: String
  description: String
}

type CreatedFixedPiece implements Operation {
  id: ID!
  hash: String!
  owner: Change!
  input: CreatedFixedPieceInput!
  diff: Diff!
  piece: Piece!
}

type FixedPieceInput {
  designId: ID!
  pieceId: ID!
}

type FixedPiece implements Operation {
  id: ID!
  hash: String!
  owner: Change!
  input: FixedPieceInput!
  diff: Diff!
  piece: Piece!
}

type DraggedPieceInput {
  designId: ID!
  pieceIds: [ID!]!
  offset: Offset!
}

type DraggedPiece implements Operation {
  id: ID!
  hash: String!
  owner: Change!
  input: DraggedPieceInput!
  diff: Diff!
  pieces: [Piece!]!
}

#endregion Operations

#endregion Piece

#region Connection

#region Side

type Side {
  id: ID!
  piece: Piece!
  port: Connector
  designPiece: Piece
  connector: Connector
}

#endregion Side

#endregion Connection

type Design implements Entity {
  id: ID!
  hash: String!
  owner: Kit!
  name: String!
  description: String
  icon: String
  image: String
  place: Place
  unit: String
  created: Timestamp
  updated: Timestamp
  pieces: [Piece!]!
  piece(id: ID!): Piece
  connections: [Connection!]!
  connection(id: ID!): Connection
  layers: [Layer!]!
  groups: [Group!]!
  authors: [Author!]!
  concepts: [Concept!]!
  tags: [Tag!]!
  qualities: [Quality!]!
  props: [Prop!]!
  attributes: [Attribute!]!
  stats: [Stat!]!
  qualitySum(qualityId: ID!): Float!
  references: [Design!]!
  referencedBy: [Piece!]!
}

#endregion Design

type Kit implements Entity {
  id: ID!
  hash: String!
  owner: Graph
  checkpoint: Checkpoint
  draft: Draft
  transaction: Transaction
  name: String!
  description: String
  icon: String
  image: String
  preview: String
  remote: String
  homepage: String
  license: String
  uri: String
  created: Timestamp
  updated: Timestamp
  version: String
  design(id: ID!): Design
  designs: [Design!]!
  type(id: ID!): Type
  types: [Type!]!
  files: [File!]!
  folders: [Folder!]!
  authors: [Author!]!
  concepts: [Concept!]!
  tags: [Tag!]!
  qualities: [Quality!]!
  props: [Prop!]!
  attributes: [Attribute!]!
  stats: [Stat!]!
}

#region Operations

type RenamedKitInput {
  name: String!
}

type RenamedKit implements Operation & Entity {
  id: ID!
  hash: String!
  owner: Change!
  input: RenamedKitInput!
  diff: Diff!
  kit: Kit!
}

type ChangedDescriptionInput {
  description: String!
}

type ChangedDescription implements Operation & Entity {
  id: ID!
  hash: String!
  owner: Change!
  input: ChangedDescriptionInput!
  diff: Diff!
  entity: Entity!
}

#endregion Operations

#endregion Kit

#endregion Entities

#region VCS

union ChangeOwner = Transaction | Draft | Checkpoint

type Change implements Entity {
  id: ID!
  hash: String!
  owner: ChangeOwner!
  description: String
  origin: String
  forwards: [Operation!]!
  backwards: [Operation!]!
}

type Transaction implements Entity {
  id: ID!
  hash: String!
  owner: Draft
  changes: [Change!]!
}

type Draft implements Entity {
  id: ID!
  hash: String!
  owner: Author!
  parentCheckpoint: Checkpoint
  targetAlternative: Alternative
  openTransaction: Transaction
  finalizedTransactions: [Transaction!]!
  redoTransactions: [Transaction!]!
  changes: [Change!]!
  canUndo(steps: Int!): Boolean!
  canRedo(steps: Int!): Boolean!
}

type Checkpoint implements Entity {
  id: ID!
  hash: String!
  timestamp: Timestamp
  authors: [Author!]!
  root: Kit
  parentCheckpoint: Checkpoint
  message: String
  isRelease: Boolean!
  changeCount: Int!
}

type Alternative implements Entity {
  id: ID!
  hash: String!
  owner: Graph
  name: String!
  start: Checkpoint!
  checkpoints: [Checkpoint!]!
  store: Kit!
  draft: Draft
  transaction: Transaction
}

type Graph implements Entity {
  id: ID!
  hash: String!
  owner: Session
  theKit: Kit
  alternative(id: ID!): Alternative
  alternatives: [Alternative!]!
  checkpoint(id: ID!): Checkpoint
  checkpoints: [Checkpoint!]!
  release(id: ID!): Checkpoint
  releases: [Checkpoint!]!
}

type Session {
  id: ID!
  startedAt: Timestamp
  drafts: [Draft!]!
}

type Conflict {
  id: ID!
  backboneTip: String
  reason: String!
  createdAt: Timestamp!
}

#endregion VCS

#region Schema

type Query {
  session: Session!
  wip: Graph!
  authoritative: Graph
  conflicts: [Conflict!]!
}

type Mutation {
  renameKit(draftId: ID!, transactionId: ID!, name: String!): ID!
  changeDescription(draftId: ID!, transactionId: ID!, description: String!): ID!
  createFixedPiece(draftId: ID!, transactionId: ID!, designId: ID!, pose: PositionInput!, name: String, description: String): ID!
  fixPiece(draftId: ID!, transactionId: ID!, designId: ID!, pieceId: ID!): ID!
}

type Subscription {
  commandSucceeded: Command!
  operationSucceeded: Operation!
  operationFailed: Error!
  kitRenamed: RenamedKit!
  descriptionChanged: ChangedDescription!
  createdFixedPiece: CreatedFixedPiece!
  fixedPiece: FixedPiece!
  draggedPiece: DraggedPiece!
  error: Error!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

#endregion Schema
