#region Schema

type Query {
  session: Session!
  wip: Graph!
  authoritative: Graph
  conflicts: ConflictConnection! # computed
  node(id: ID!): Node # reference
  entity(hash: ID!): Entity
}

#region ScopedCommands

# 🎬 Single initial for every kit-changing operation. Resolves into a chain of scope objects:
#     `session → alternative(id) → transaction(id) → kit → …`. Leaf fields execute and return the
#     resulting operation `ID!`; intermediate fields navigate one scope deeper.
type Mutation {
  session: SessionScopedCommandInput!
}

# 🎬 Top-level command scope. `start`/`end` open and close the session; `alternative` enters one.
type SessionScopedCommandInput {
  start: ID! # data
  end: ID! # data
  alternative(id: ID!): AlternativeScopedCommandInput!
}

# 📑 Alternative scope. `transaction` enters (or opens) the alternative's open transaction.
type AlternativeScopedCommandInput {
  transaction(id: ID!): TransactionScopedCommandInput!
}

# 💼 Transaction scope. Currently every kit-changing operation lives under `kit`. Multiple
#     leaf operations can be chained inside one transaction via aliased GraphQL selections.
type TransactionScopedCommandInput {
  kit: KitScopedOperationInput!
}

# 🧰 Kit scope. Owns tags, concepts, qualities, types and designs. Every create takes the
#     entity's primitive fields directly — no input wrappers, no array bulk variants. Bulk
#     creation is achieved by chaining aliased single-create selections within one transaction.
type KitScopedOperationInput {
  # Artifact
  rename(newName: String!): ID!
  changeDescription(newDescription: String!): ID!

  # Tags
  createTag(name: String!, description: String, icon: String, order: Int): ID!
  tag(id: ID!): TagScopedOperationInput!
  deleteTag(id: ID!): ID!
  deleteTags(ids: [ID!]!): ID!

  # Concepts
  createConcept(name: String!, description: String, icon: String, order: Int): ID!
  concept(id: ID!): ConceptScopedOperationInput!
  deleteConcept(id: ID!): ID!
  deleteConcepts(ids: [ID!]!): ID!

  # Qualities
  createQuality(key: String!, value: String, unit: String, definition: String, description: String, icon: String): ID!
  quality(id: ID!): QualityScopedOperationInput!
  deleteQuality(id: ID!): ID!
  deleteQualities(ids: [ID!]!): ID!

  # Types
  createType(name: String!, description: String, icon: String, image: String, unit: String): ID!
  type(id: ID!): TypeScopedOperationInput!
  deleteType(id: ID!): ID!
  deleteTypes(ids: [ID!]!): ID!

  # Designs
  createDesign(name: String!, description: String, icon: String, image: String, unit: String): ID!
  design(id: ID!): DesignScopedOperationInput!
  deleteDesign(id: ID!): ID!
  deleteDesigns(ids: [ID!]!): ID!
}

# 🏷️ Tag scope. Artifact + attributes.
type TagScopedOperationInput {
  # Artifact
  rename(newName: String!): ID!
  changeDescription(newDescription: String!): ID!
  changeIcon(newIcon: String!): ID!
  # Attributes
  addAttribute(key: String!, value: String!, definition: String!): ID!
  removeAttribute(id: ID!): ID!
  removeAttributes(ids: [ID!]!): ID!
}

# 💡 Concept scope. Artifact + attributes.
type ConceptScopedOperationInput {
  # Artifact
  rename(newName: String!): ID!
  changeDescription(newDescription: String!): ID!
  changeIcon(newIcon: String!): ID!
  # Attributes
  addAttribute(key: String!, value: String!, definition: String!): ID!
  removeAttribute(id: ID!): ID!
  removeAttributes(ids: [ID!]!): ID!
}

# 📐 Quality scope. Renamed by `key`; artifact + attributes otherwise.
type QualityScopedOperationInput {
  # Artifact
  rename(newKey: String!): ID!
  changeDescription(newDescription: String!): ID!
  changeIcon(newIcon: String!): ID!
  # Attributes
  addAttribute(key: String!, value: String!, definition: String!): ID!
  removeAttribute(id: ID!): ID!
  removeAttributes(ids: [ID!]!): ID!
}

# 🏗️ Type scope. Owns ports & connectors, plus artifact + attributes.
type TypeScopedOperationInput {
  # Artifact
  rename(newName: String!): ID!
  changeDescription(newDescription: String!): ID!
  changeIcon(newIcon: String!): ID!
  # Attributes
  addAttribute(key: String!, value: String!, definition: String!): ID!
  removeAttribute(id: ID!): ID!
  removeAttributes(ids: [ID!]!): ID!
  # Ports
  createPort(code: String, label: String, description: String, icon: String, order: Int): ID!
  port(id: ID!): PortScopedOperationInput!
  deletePort(id: ID!): ID!
  deletePorts(ids: [ID!]!): ID!
  # Connectors
  addConnector(code: String!, description: String, icon: String, portId: ID): ID!
  connector(id: ID!): ConnectorScopedOperationInput!
  removeConnector(id: ID!): ID!
  removeConnectors(ids: [ID!]!): ID!
}

# 🔌 Port scope. Renamed by `code` + optional `label`; artifact + attributes otherwise.
type PortScopedOperationInput {
  # Artifact
  rename(newCode: String!, newLabel: String): ID!
  changeDescription(newDescription: String!): ID!
  changeIcon(newIcon: String!): ID!
  # Attributes
  addAttribute(key: String!, value: String!, definition: String!): ID!
  removeAttribute(id: ID!): ID!
  removeAttributes(ids: [ID!]!): ID!
}

# 🪢 Connector scope. Renamed by `code`; no attributes.
type ConnectorScopedOperationInput {
  # Artifact
  rename(newCode: String!): ID!
  changeDescription(newDescription: String!): ID!
  changeIcon(newIcon: String!): ID!
}

# 🏛️ Design scope. Owns pieces, plus artifact + attributes + flatten.
type DesignScopedOperationInput {
  # Artifact
  rename(newName: String!): ID!
  changeDescription(newDescription: String!): ID!
  # Design
  flatten: ID!
  # Attributes
  addAttribute(key: String!, value: String!, definition: String!): ID!
  removeAttribute(id: ID!): ID!
  removeAttributes(ids: [ID!]!): ID!
  # Pieces
  addFixedPiece(blueprintId: ID!, position: PositionInput!, name: String, description: String): ID!
  addChildPieceWithParentConnection(blueprintId: ID!, parentPieceId: ID!, parentConnector: String!, childConnector: String!, name: String, description: String, position: PositionInput, scale: Float): ID!
  addHangingChildPieceWithParentConnection(blueprintId: ID!, parentPieceId: ID!, parentConnector: String!, childConnector: String!, position: PositionInput!, name: String, description: String, scale: Float): ID!
  piece(id: ID!): PieceScopedOperationInput!
  pieces(ids: [ID!]!): PiecesScopedOperationInput!
  deletePiece(id: ID!): ID!
  deletePieces(ids: [ID!]!): ID!
  deletePiecesAndConnections(pieceIds: [ID!]!, connectionIds: [ID!]!): ID!
}

# 🧩 Piece scope. Per-piece artifact + transforms + attributes.
type PieceScopedOperationInput {
  # Artifact
  rename(newName: String!): ID!
  changeDescription(newDescription: String!): ID!
  # Piece
  drag(offset: OffsetInput!): ID!
  move(position: PositionInput!): ID!
  fix: ID!
  changeBlueprint(blueprintId: ID!): ID!
  # Attributes
  addAttribute(key: String!, value: String!, definition: String!): ID!
  removeAttribute(id: ID!): ID!
  removeAttributes(ids: [ID!]!): ID!
}

# 🧩📚 Multi-piece scope (`movePieces`/`dragPieces`/`fixPieces`/`editPiecesToType`).
type PiecesScopedOperationInput {
  drag(offset: OffsetInput!): ID!
  move(offset: OffsetInput!): ID!
  fix: ID!
  changeBlueprint(blueprintId: ID!): ID!
}

#endregion ScopedCommands

type Subscription {
  event: Json!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

#endregion Schema
