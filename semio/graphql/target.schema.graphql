}

interface Operation implements Entity {
	id: ID!
	hash: String!
	diff: Diff!
}

union ChangeOwner = Transaction | Draft | Checkpoint

type Change implements Entity {
	id: ID!
	hash: String!
	owner: ChangeOwner!
	forwards: [Operation!]!
	backwards: [Operation!]!
}

type Transaction {
	id: ID!
	hash: String!
	changes: [Change!]!
}

type Draft {
	id: ID!
	hash: String!
	changes: [Change!]!
}

type Kit{
	id: ID!
	hash: String!
	owner: Graph
	checkpoint: Checkpoint
	draft: Draft
	transaction: Transaction
	name: String!
	description: String
	...
	design(id: ID!): Design
	designs: [Design!]!
	type(id: ID!): Type
	types: [Type!]!
	...
}

type Checkpoint {
	id: ID
	hash: String!
	timestamp: Timestamp
	authors: [Author!]!
	parentCheckpoint: Checkpoint
	parent: Kit
	message: String
}

type Alternative {
	id: ID!
	hash: String!
	owner: Graph
	name: String!
	start: Checkpoint!
	checkpoints: [Checkpoint!]!
	store: Kit!
	draft: Draft
	transaction: Transaction
}

type Graph {
	id:ID!
	hash: String!
	owner: Session
	theKit: Kit
	alternative(id: ID!): Alternative
	alternatives: [Alternative!]!
	checkpoint(id:ID!): Checkpoint
	checkpoints: [Checkpoint!]!
	release(id: ID!): Checkpoint
	releases: [Checkpoint!]!
}

type Session {
	id: ID!
	startedAt: Timestamp
}

type Query {
	session: Session!
	wip: Graph!
	authorative: Graph
	conflicts: [Conflict!]!
}

type Mutation {
	renameKit(draftId: ID!, transactionId: ID!, name: String!): ID!
	changeDescription(draftId: ID!, transactionId: ID!, description: String!): ID!
	createFixedPiece(draftId: ID!, transactionId: ID!, pose: PoseInput!, name: String, description: String): ID!
	fixPiece(draftId: ID!, transactionId: ID!, designId: ID!, pieceId: ID!): ID!
}

interface Event {
  id: ID!
  timestamp: Timestamp!
}

enum ResponseStatus {
	SUCCESS
	PARTIAL
	FAILED
}

enum Severity {
	INFO
	WARNING
	ERROR
}

type Message {
	severity: Severity!
	text: String!
}

interface Response implements Event {
	id: ID!
	timestamp: Timestamp!
	request: Request!
	status: ResponseStatus!
	messages: [Message!]!
}

interface KitChanged  {
  	kit: Kit
	change: Change
}

type KitRenamed implements UserEvent & Response {
  kit: Kit
}

type Subscription {
	kitRenamed: KitRenamed
}

schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}



