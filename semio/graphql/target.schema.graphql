type TransactionEdge implements EntityEdge {
  cursor: String!
  node: Transaction!
}

type TransactionConnection implements EntityConnectionInterface {
  edges: [TransactionEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

union DraftOwner = Author

type Draft implements Entity {
  id: ID!
  hash: String!
  owner: Entity! # DraftOwner
  owns: EntityConnection
  parentCheckpoint: Checkpoint
  targetAlternative: Alternative
  openTransaction: Transaction
  finalizedTransactions: [Transaction!]!
  redoTransactions: [Transaction!]!
  changes: [Change!]!
  canUndo(steps: Int!): Boolean!
  canRedo(steps: Int!): Boolean!
}

type DraftEdge implements EntityEdge {
  cursor: String!
  node: Draft!
}

type DraftConnection implements EntityConnectionInterface {
  edges: [DraftEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

union CheckpointOwner = Alternative | Graph | Kit | Author

type Checkpoint implements Entity {
  id: ID!
  hash: String!
  owner: Entity # CheckpointOwner
  owns: EntityConnection
  timestamp: Timestamp
  authors: [Author!]!
  root: Kit
  parentCheckpoint: Checkpoint
  message: String
  isRelease: Boolean!
  changeCount: Int!
}

type CheckpointEdge implements EntityEdge {
  cursor: String!
  node: Checkpoint!
}

type CheckpointConnection implements EntityConnectionInterface {
  edges: [CheckpointEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

union AlternativeOwner = Graph

type Alternative implements Entity {
  id: ID!
  hash: String!
  owner: Entity # AlternativeOwner
  owns: EntityConnection
  name: String!
  start: Checkpoint!
  checkpoints: [Checkpoint!]!
  store: Kit!
  draft: Draft
  transaction: Transaction
}

type AlternativeEdge implements EntityEdge {
  cursor: String!
  node: Alternative!
}

type AlternativeConnection implements EntityConnectionInterface {
  edges: [AlternativeEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

union GraphOwner = Session

type Graph implements Entity {
  id: ID!
  hash: String!
  owner: Entity # GraphOwner
  owns: EntityConnection
  theKit: Kit
  alternative(id: ID!): Alternative
  alternatives: [Alternative!]!
  checkpoint(id: ID!): Checkpoint
  checkpoints: [Checkpoint!]!
  release(id: ID!): Checkpoint
  releases: [Checkpoint!]!
}

type GraphEdge implements EntityEdge {
  cursor: String!
  node: Graph!
}

type GraphConnection implements EntityConnectionInterface {
  edges: [GraphEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

union SessionOwner = Graph | Checkpoint | Alternative

type Session implements Entity {
  id: ID!
  hash: String!
  owner: Entity # SessionOwner
  owns: EntityConnection
  startedAt: Timestamp
  drafts: [Draft!]!
}

type SessionEdge implements EntityEdge {
  cursor: String!
  node: Session!
}

type SessionConnection implements EntityConnectionInterface {
  edges: [SessionEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

type ReadVersion {
  checkpoint: Checkpoint
  change: Change
  operation: Operation
}

type WriteVersion {
  draft: Draft
  transaction: Transaction
  checkpoint: Checkpoint
  change: Change
  operation: Operation
}

type Conflict {
  id: ID!
  authoritativeVersion: ReadVersion
  transactionVersion: WriteVersion
  reason: String!
  createdAt: Timestamp!
}

#endregion VCS

#region Schema

type Query {
  session: Session!
  wip: Graph!
  authoritative: Graph
  conflicts: [Conflict!]!
  node(id: ID!): Node
  entity(id: ID!): Entity
}

type Mutation {
  renameKit(draftId: ID!, transactionId: ID!, name: String!): ID!
  changeDescription(draftId: ID!, transactionId: ID!, description: String!): ID!
  createFixedPiece(draftId: ID!, transactionId: ID!, designId: ID!, position: PositionInput!, name: String, description: String): ID!
  fixPiece(draftId: ID!, transactionId: ID!, designId: ID!, pieceId: ID!): ID!
}

type Subscription {
  commandSucceeded: Command!
  operationSucceeded: Operation!
  operationFailed: Error!
  kitRenamed: RenamedKit!
  descriptionChanged: ChangedDescription!
  createdFixedPiece: CreatedFixedPiece!
  fixedPiece: FixedPiece!
  draggedPiece: DraggedPiece!
  error: Error!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

#endregion Schema
