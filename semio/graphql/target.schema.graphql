# Custom semio extension of the [relay specs](https://relay.dev/docs/guides/graphql-server-specification)

#region Scalars

scalar Timestamp

#endregion Scalars

#region Entities

#region General

interface Node {
  id: ID!
}

interface Entity implements Node { # Our own extension ontop of the relay specs
  id: ID!
  hash: String!
  # owner: ENTITY
  # ENTITYOwner: ENTITYOwner
  EntityOwner: EntityOwner
  # owns: ENTITYConnection
  ownedEntities: OwnedEntityConnection
}

interface EntityEdge {
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String # start at this entity
  endCursor: String # end at this entity
}

interface EntityConnectionInterface {
  # edges: [ENTITYEdge]
  pageInfo: PageInfo!
  hash: String! # Our own extension ontop of the relay specs
}
# interface WeakEntity implements Entity {
#   id: ID! # hash
# }

# interface StrongEntity implements Entity {
#   id: ID! # uuidv7
#   hash: String!
#   entityOwner: OwnerEntity # ENTITYKIND
#   ownedEntities: OwnedEntityConnection # ENTITYKIND
# }

#endregion General

#region Diffs

# interface Modification implements WeakEntity {
#   FIELD: NULLABLE FIELD // if the field was modified then return the modified value
#   removeNULLABLEFIELD: Boolean // use this if the field is by default nullable to indicate that it was removed
# }

type ModificationEdge implements EntityEdge {
  cursor: String!
  node: Modification!
}

type ModificationConnection implements EntityConnectionInterface {
  edges: [ModificationEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

interface Diff implements Entity { # implements WeakEntity
  # WeakEntity
  id: ID! # hash
  hash: String!
  owner: DiffOwner!
  ownerDiffs: Diffs
  changeOwner: Change
  operationOwner: Operation
  entityOwner: OwnerEntity # DiffOwner
  ownedEntities: OwnedEntityConnection # DiffOwned
  # Diff
  before: Entity!
  modification: Modification!
  after: Entity!
}

type DiffEdge implements EntityEdge {
  cursor: String!
  node: Diff!
}

type DiffConnection implements EntityConnectionInterface {
  edges: [DiffEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

type Diffs implements Entity { # implements WeakEntity
  # WeakEntity
  id: ID! # hash
  hash: String!
  owner: DiffsOwner!
  diffOwner: Diff
  operationOwner: Operation
  changeOwner: Change
  entityOwner: OwnerEntity # DiffsOwner
  ownedEntities: OwnedEntityConnection # DiffOwned
  # Fields
  removed: EntityConnection
  diffs: DiffConnection
  added: EntityConnection
}

type DiffsEdge implements EntityEdge {
  cursor: String!
  node: Diffs!
}

type DiffsConnection implements EntityConnectionInterface {
  edges: [DiffsEdge!]!
  pageInfo: PageInfo!
  hash: String!
}

#endregion Diffs

