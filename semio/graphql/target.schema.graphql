type Mutation {
  change(transactionScope: TransactionScopeInput!): KitChange!
}

type KitChange {
  # Kit
  renameKit(input: RenameKitInput!): ID!
  changeDescription(entityId: ID!, input: ChangeDescriptionInput!): ID!

  # Tag
  createTag(ownerId: ID!, tag: TagInput!): ID!
  createTags(ownerId: ID!, tags: [TagInput!]!): ID!
  renameTag(tagId: ID!, input: RenameTagInput!): ID!
  changedTagDescription(tagId: ID!, input: UpdateTagDescriptionInput!): ID!
  changedTagIcon(tagId: ID!, input: UpdateTagIconInput!): ID!
  addAttributeToTag(tagId: ID!, attribute: AttributeInput!): ID!
  addAttributesToTag(tagId: ID!, attributes: [AttributeInput!]!): ID!
  removeAttributeFromTag(tagId: ID!, attributeId: ID!): ID!
  removeAttributesFromTag(tagId: ID!, attributeIds: [ID!]!): ID!
  deleteTag(tagId: ID!): ID!
  deleteTags(tagIds: [ID!]!): ID!

  # Concept
  createConcept(ownerId: ID!, concept: ConceptInput!): ID!
  createConcepts(ownerId: ID!, concepts: [ConceptInput!]!): ID!
  renameConcept(conceptId: ID!, input: RenameConceptInput!): ID!
  changedConceptDescription(conceptId: ID!, input: UpdateConceptDescriptionInput!): ID!
  changedConceptIcon(conceptId: ID!, input: UpdateConceptIconInput!): ID!
  addAttributeToConcept(conceptId: ID!, attribute: AttributeInput!): ID!
  addAttributesToConcept(conceptId: ID!, attributes: [AttributeInput!]!): ID!
  removeAttributeFromConcept(conceptId: ID!, attributeId: ID!): ID!
  removeAttributesFromConcept(conceptId: ID!, attributeIds: [ID!]!): ID!
  deleteConcept(conceptId: ID!): ID!
  deleteConcepts(conceptIds: [ID!]!): ID!

  # Port
  createPort(port: PortInput!): ID!
  createPorts(ports: [PortInput!]!): ID!
  renamePort(portId: ID!, input: RenamePortInput!): ID!
  changedPortDescription(portId: ID!, input: UpdatePortDescriptionInput!): ID!
  changedPortIcon(portId: ID!, input: UpdatePortIconInput!): ID!
  addAttributeToPort(portId: ID!, attribute: AttributeInput!): ID!
  addAttributesToPort(portId: ID!, attributes: [AttributeInput!]!): ID!
  removeAttributeFromPort(portId: ID!, attributeId: ID!): ID!
  removeAttributesFromPort(portId: ID!, attributeIds: [ID!]!): ID!
  deletePort(portId: ID!): ID!
  deletePorts(portIds: [ID!]!): ID!

  # Quality
  createQuality(quality: QualityInput!): ID!
  createQualities(qualities: [QualityInput!]!): ID!
  renameQuality(qualityId: ID!, input: RenameQualityInput!): ID!
  changedQualityDescription(qualityId: ID!, input: UpdateQualityDescriptionInput!): ID!
  changedQualityIcon(qualityId: ID!, input: UpdateQualityIconInput!): ID!
  addAttributeToQuality(qualityId: ID!, attribute: AttributeInput!): ID!
  addAttributesToQuality(qualityId: ID!, attributes: [AttributeInput!]!): ID!
  removeAttributeFromQuality(qualityId: ID!, attributeId: ID!): ID!
  removeAttributesFromQuality(qualityId: ID!, attributeIds: [ID!]!): ID!
  deleteQuality(qualityId: ID!): ID!
  deleteQualities(qualityIds: [ID!]!): ID!

  # Type
  createType(type: TypeInput!): ID!
  createTypes(types: [TypeInput!]!): ID!
  renameType(typeId: ID!, input: RenameTypeInput!): ID!
  changedTypeDescription(typeId: ID!, input: UpdateTypeDescriptionInput!): ID!
  changedTypeIcon(typeId: ID!, input: UpdateTypeIconInput!): ID!
  addAttributeToType(typeId: ID!, attribute: AttributeInput!): ID!
  addAttributesToType(typeId: ID!, attributes: [AttributeInput!]!): ID!
  removeAttributeFromType(typeId: ID!, attributeId: ID!): ID!
  removeAttributesFromType(typeId: ID!, attributeIds: [ID!]!): ID!
  deleteType(typeId: ID!): ID!
  deleteTypes(typeIds: [ID!]!): ID!

  # Connector
  addConnectorToType(typeId: ID!, connector: ConnectorInput!): ID!
  addConnectorsToType(typeId: ID!, connectors: [ConnectorInput!]!): ID!
  renameConnectorInType(connectorId: ID!, input: RenameConnectorInTypeInput!): ID!
  changedConnectorDescriptionInType(connectorId: ID!, input: UpdateConnectorDescriptionInTypeInput!): ID!
  changedConnectorIconInType(connectorId: ID!, input: UpdateConnectorIconInTypeInput!): ID!
  removeConnectorFromType(connectorId: ID!): ID!
  removeConnectorsFromType(connectorIds: [ID!]!): ID!

  # Design
  createDesign(design: DesignInput!): ID!
  createDesigns(designs: [DesignInput!]!): ID!
  deleteDesign(designId: ID!): ID!
  deleteDesigns(designIds: [ID!]!): ID!
  flattenDesign(designId: ID!): ID!
  addAttributeToDesign(designId: ID!, attribute: AttributeInput!): ID!
  addAttributesToDesign(designId: ID!, attributes: [AttributeInput!]!): ID!
  removeAttributeFromDesign(designId: ID!, attributeId: ID!): ID!
  removeAttributesFromDesign(designId: ID!, attributeIds: [ID!]!): ID!

  # Piece
  addFixedPieceToDesign(designId: ID!, input: AddFixedPieceToDesignInput!): ID!
  addChildPieceWithParentConnectionToDesign(designId: ID!, child: ChildPieceWithParentConnectionInput!): ID!
  addChildPiecesWithParentConnectionsToDesign(designId: ID!, children: [ChildPieceWithParentConnectionInput!]!): ID!
  addHangingChildPieceWithParentConnectionToDesign(designId: ID!, child: HangingChildPieceWithParentConnectionInput!): ID!
  addHangingChildPiecesWithParentConnectionsToDesign(designId: ID!, children: [HangingChildPieceWithParentConnectionInput!]!): ID!
  renamePieceInDesign(pieceId: ID!, input: RenamePieceInDesignInput!): ID!
  changedPieceDescriptionInDesign(pieceId: ID!, input: UpdatePieceDescriptionInDesignInput!): ID!
  dragPieceInDesign(designId: ID!, pieceId: ID!, offset: OffsetInput!): ID!
  dragPiecesInDesign(designId: ID!, pieceIds: [ID!]!, offset: OffsetInput!): ID!
  movePieceInDesign(designId: ID!, pieceId: ID!, position: PositionInput!): ID!
  movePiecesInDesign(designId: ID!, pieceIds: [ID!]!, offset: OffsetInput!): ID!
  fixPieceInDesign(designId: ID!, pieceId: ID!): ID!
  fixPiecesInDesign(designId: ID!, pieceIds: [ID!]!): ID!
  changePieceToTypeInDesign(pieceId: ID!, input: ChangePieceToTypeInDesignInput!): ID!
  changePiecesToTypeInDesign(pieceIds: [ID!]!, input: ChangePiecesToTypeInDesignInput!): ID!
  addAttributeToPiece(pieceId: ID!, attribute: AttributeInput!): ID!
  addAttributesToPiece(pieceId: ID!, attributes: [AttributeInput!]!): ID!
  removeAttributeFromPiece(pieceId: ID!, attributeId: ID!): ID!
  removeAttributesFromPiece(pieceId: ID!, attributeIds: [ID!]!): ID!
  deletePieceInDesign(designId: ID!, pieceId: ID!): ID!
  deletePiecesInDesign(designId: ID!, pieceIds: [ID!]!): ID!
  deletePiecesAndConnectionsInDesign(designId: ID!, pieceIds: [ID!]!, connectionIds: [ID!]!): ID!
}

