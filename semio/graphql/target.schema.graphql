#endregion Entities

#region VCS

union ChangeOwner = Transaction | Draft | Checkpoint

type Change implements Entity {
  id: ID!
  hash: String!
  owner: Entity! # ChangeOwner
  owns: EntityConnection
  description: String
  origin: String
  forwards: [Operation!]!
  backwards: [Operation!]!
  sequenceNumber: Int!
}

type Transaction implements Entity {
  id: ID!
  hash: String!
  owner: Draft
  owns: EntityConnection
  changes: [Change!]!
}

type Draft implements Entity {
  id: ID!
  hash: String!
  owner: Author!
  owns: EntityConnection
  parentCheckpoint: Checkpoint
  targetAlternative: Alternative
  openTransaction: Transaction
  finalizedTransactions: [Transaction!]!
  redoTransactions: [Transaction!]!
  changes: [Change!]!
  canUndo(steps: Int!): Boolean!
  canRedo(steps: Int!): Boolean!
}

type Checkpoint implements Entity {
  id: ID!
  hash: String!
  owner: Entity
  owns: EntityConnection
  timestamp: Timestamp
  authors: [Author!]!
  root: Kit
  parentCheckpoint: Checkpoint
  message: String
  isRelease: Boolean!
  changeCount: Int!
}

type Alternative implements Entity {
  id: ID!
  hash: String!
  owner: Graph
  owns: EntityConnection
  name: String!
  start: Checkpoint!
  checkpoints: [Checkpoint!]!
  store: Kit!
  draft: Draft
  transaction: Transaction
}

type Graph implements Entity {
  id: ID!
  hash: String!
  owner: Session
  owns: EntityConnection
  theKit: Kit
  alternative(id: ID!): Alternative
  alternatives: [Alternative!]!
  checkpoint(id: ID!): Checkpoint
  checkpoints: [Checkpoint!]!
  release(id: ID!): Checkpoint
  releases: [Checkpoint!]!
}

type Session implements Entity {
  id: ID!
  hash: String!
  owner: Entity
  owns: EntityConnection
  startedAt: Timestamp
  drafts: [Draft!]!
}

type ReadVersion {
  checkpoint: Checkpoint
  change: Change
  operation: Operation
}

type WriteVersion {
  draft: Draft
  transaction: Transaction
  checkpoint: Checkpoint
  change: Change
  operation: Operation
}

enum ConflictKind {

}

type Conflict {
  id: ID!
  authoritativeVersion: ReadVersion
  transactionVersion: WriteVersion
  reason: String!
  createdAt: Timestamp!
}

#endregion VCS

#region Schema

type Query {
  session: Session!
  wip: Graph!
  authoritative: Graph
  conflicts: [Conflict!]!
  node(id: ID!): Node
  entity(id: ID!): Entity
}

type Mutation {
  renameKit(draftId: ID!, transactionId: ID!, name: String!): ID!
  changeDescription(draftId: ID!, transactionId: ID!, description: String!): ID!
  createFixedPiece(draftId: ID!, transactionId: ID!, designId: ID!, position: PositionInput!, name: String, description: String): ID!
  fixPiece(draftId: ID!, transactionId: ID!, designId: ID!, pieceId: ID!): ID!
}

type Subscription {
  commandSucceeded: Command!
  operationSucceeded: Operation!
  operationFailed: Error!
  kitRenamed: RenamedKit!
  descriptionChanged: ChangedDescription!
  createdFixedPiece: CreatedFixedPiece!
  fixedPiece: FixedPiece!
  draggedPiece: DraggedPiece!
  error: Error!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

#endregion Schema
