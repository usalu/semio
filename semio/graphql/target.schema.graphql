#region SubscriptionPayloads

type Command {
  id: ID!
}

type Error {
  message: String!
}

#endregion SubscriptionPayloads

#region Schema

type Query {
  session: Session!
  wip: Graph!
  authoritative: Graph
  conflicts: ConflictConnection!
  node(id: ID!): Node
  entity(id: ID!): Entity
}

type Mutation {
  renameKit(draftId: ID!, transactionId: ID!, name: String!): ID!
  changeDescription(draftId: ID!, transactionId: ID!, description: String!): ID!
  createFixedPiece(draftId: ID!, transactionId: ID!, designId: ID!, position: PositionInput!, name: String, description: String): ID!
  fixPiece(draftId: ID!, transactionId: ID!, designId: ID!, pieceId: ID!): ID!
}

type Subscription {
  commandSucceeded: Command!
  operationSucceeded: Operation!
  operationFailed: Error!
  kitRenamed: RenamedKit!
  descriptionChanged: ChangedDescription!
  createdFixedPiece: CreatedFixedPiece!
  fixedPiece: FixedPiece!
  draggedPiece: DraggedPiece!
  error: Error!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

#endregion Schema
