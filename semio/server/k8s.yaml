# #region 🔖Header
# 2025 Ueli Saluz <ueli@semio-tech.com>
# AGPL-3.0
# Kubernetes manifests for the full semio server stack: Postgres, semio-session (Rust) with embedded /admin dashboard, repo web (Next.js) + worker, and an ingress.
# Specs: Single-file manifest (kubectl apply -f k8s.yaml) using a dedicated namespace, a PVC-backed Postgres StatefulSet, separate Deployments for session/web/worker, ClusterIP Services, and an nginx Ingress routing /admin, /sessions and /ws to the session backend and everything else to the web frontend.
# #endregion 🔖Header

# #region 🔖Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: semio
# #endregion 🔖Namespace

---
# #region 🔖Secrets
apiVersion: v1
kind: Secret
metadata:
  name: semio-secrets
  namespace: semio
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_postgres_password"
  SEMIO_ADMIN_TOKEN: "REPLACE_ME_admin_token"
  GITHUB_WEBHOOK_SECRET: ""
  DISCORD_WEBHOOK_URL: ""
# #endregion 🔖Secrets

---
# #region 🔖Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: semio-config
  namespace: semio
data:
  POSTGRES_DB: semio_repo
  POSTGRES_USER: semio
  APP_BASE_URL: "https://repo.semio.dev"
  UPLOAD_BLOB_ROOT: "/srv/semio/blob"
  RUST_LOG: "semio_session=info,tower_http=info"
# #endregion 🔖Config

---
# #region 🔖PostgresSchema
# Specs: Applies the repo Postgres schema on first boot via an init ConfigMap mounted into /docker-entrypoint-initdb.d. Replace this with a Helm chart or migration job for production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: semio-postgres-init
  namespace: semio
data:
  01-schema.sql: |
    -- semio repo postgres schema is applied via the `repo/postgres/schema.sql` file.
    -- For kubectl-only deployments, use an init container or a bootstrap Job that copies the file into place.
    -- Keeping this map as a placeholder so StatefulSet mounts are valid even before the schema is provisioned.
    SELECT 1;
# #endregion 🔖PostgresSchema

---
# #region 🔖PostgresService
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: semio
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
# #endregion 🔖PostgresService

---
# #region 🔖PostgresStatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: semio
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "semio", "-d", "semio_repo"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "semio", "-d", "semio_repo"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgres-init
          configMap:
            name: semio-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
# #endregion 🔖PostgresStatefulSet

---
# #region 🔖SessionService
apiVersion: v1
kind: Service
metadata:
  name: session
  namespace: semio
spec:
  selector:
    app: session
  ports:
    - name: http
      port: 8788
      targetPort: 8788
# #endregion 🔖SessionService

---
# #region 🔖SessionDeployment
# Specs: Single-replica by default because SessionDirectory is an in-process actor registry. Scale horizontally only with a sticky-session or session-affinity strategy per session UUID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session
  namespace: semio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: session
  template:
    metadata:
      labels:
        app: session
    spec:
      containers:
        - name: session
          image: semio/semio-session:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8788
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8788"
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: POSTGRES_PASSWORD
            - name: SEMIO_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: SEMIO_ADMIN_TOKEN
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: RUST_LOG
          readinessProbe:
            tcpSocket:
              port: 8788
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8788
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
# #endregion 🔖SessionDeployment

---
# #region 🔖WebService
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: semio
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 8787
      targetPort: 8787
# #endregion 🔖WebService

---
# #region 🔖WebDeployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: semio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: semio/repo-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: POSTGRES_PASSWORD
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: APP_BASE_URL
            - name: UPLOAD_BLOB_ROOT
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: UPLOAD_BLOB_ROOT
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: DISCORD_WEBHOOK_URL
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: GITHUB_WEBHOOK_SECRET
          volumeMounts:
            - name: blob
              mountPath: /srv/semio/blob
          readinessProbe:
            httpGet:
              path: /
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: blob
          persistentVolumeClaim:
            claimName: semio-blob
# #endregion 🔖WebDeployment

---
# #region 🔖WorkerDeployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: semio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: semio/repo-web:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "-e", "require('tsx/esm');import('./lib/worker.ts')"]
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: semio-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: POSTGRES_PASSWORD
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: semio-secrets
                  key: DISCORD_WEBHOOK_URL
          volumeMounts:
            - name: blob
              mountPath: /srv/semio/blob
      volumes:
        - name: blob
          persistentVolumeClaim:
            claimName: semio-blob
# #endregion 🔖WorkerDeployment

---
# #region 🔖BlobPVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: semio-blob
  namespace: semio
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
# #endregion 🔖BlobPVC

---
# #region 🔖Ingress
# Specs: Routes /admin, /sessions/*, /ws to the session backend (dashboard + realtime APIs) and all other paths to the repo web frontend. Requires an nginx-ingress-controller (or equivalent) installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: semio
  namespace: semio
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: repo.semio.dev
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: session
                port:
                  number: 8788
          - path: /sessions
            pathType: Prefix
            backend:
              service:
                name: session
                port:
                  number: 8788
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: session
                port:
                  number: 8788
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8787
# #endregion 🔖Ingress
