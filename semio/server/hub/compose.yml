# Docker Compose for semio-hub only: PostgreSQL plus the Rust semio-hub binary. Schema is created by semio-hub at startup (run_migrations); no external init SQL.
# #endregion 🔖Header

services:
  # #region 🔖Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semio_hub}
      POSTGRES_USER: ${POSTGRES_USER:-semio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semio} -d ${POSTGRES_DB:-semio_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
  # #endregion 🔖Postgres

  # #region 🔖Hub
  # Specs: semio-hub Rust backend with embedded /admin dashboard; protect JSON admin APIs with SEMIO_ADMIN_TOKEN.
  hub:
    image: rust:1.89-bookworm
    restart: unless-stopped
    working_dir: /workspace/semio/hub
    command: ["cargo", "run", "--bin", "semio-hub"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-semio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-semio_hub}
      LISTEN_ADDR: 0.0.0.0:8788
      SEMIO_ADMIN_TOKEN: ${SEMIO_ADMIN_TOKEN:?SEMIO_ADMIN_TOKEN required for /admin JSON APIs}
      RUST_LOG: ${RUST_LOG:-semio_hub=info,tower_http=info}
    volumes:
      - ../..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8788"]
      interval: 10s
      timeout: 3s
      retries: 5
  # #endregion 🔖Hub

volumes:
  postgres_data:
