# Docker Compose for semio-hub only: PostgreSQL plus the Rust semio-hub binary built from the mounted repository. The schema (postgres/schema.sql) is applied by semio-hub at startup.
# #endregion 🔖Header

services:
  # #region 🔖Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semio}
      POSTGRES_USER: ${POSTGRES_USER:-semio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semio} -d ${POSTGRES_DB:-semio}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
  # #endregion 🔖Postgres

  # #region 🔖Hub
  hub:
    image: rust:1-bookworm
    restart: unless-stopped
    working_dir: /workspace/semio/server/hub
    command: ["cargo", "run", "--bin", "semio-hub"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-semio}:${POSTGRES_PASSWORD:-semio}@postgres:5432/${POSTGRES_DB:-semio}
      LISTEN_ADDR: 0.0.0.0:8080
      CARGO_TARGET_DIR: /cargo-target
      RUST_LOG: ${RUST_LOG:-semio_hub=info,tower_http=info}
    volumes:
      - ../../..:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/cargo-target
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 60
  # #endregion 🔖Hub

volumes:
  postgres_data:
  cargo_registry:
  cargo_target:
