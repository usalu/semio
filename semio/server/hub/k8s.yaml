# 2026 Ueli Saluz <ueli@semio-tech.de>
# AGPL-3.0
# Kubernetes manifests for semio-hub only: Namespace, PostgreSQL StatefulSet, semio-hub Deployment, Services, Ingress. semio-hub applies postgres/schema.sql on startup; Postgres starts with an empty database.
# Specs: kubectl apply -f k8s.yaml after replacing Secret placeholders. DATABASE_URL in the Secret must use the same credentials as POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB in ConfigMap + Secret. The hub is single-replica (one in-process single-writer actor per session, Recreate strategy).
# #endregion 🔖Header

# #region 🔖Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: semio-hub
# #endregion 🔖Namespace

---
# #region 🔖Secrets
apiVersion: v1
kind: Secret
metadata:
  name: semio-hub-secrets
  namespace: semio-hub
type: Opaque
stringData:
  # Must match POSTGRES_PASSWORD below inside DATABASE_URL (same string in both places).
  POSTGRES_PASSWORD: "REPLACE_ME_postgres_password"
  DATABASE_URL: "postgres://semio:REPLACE_ME_postgres_password@postgres:5432/semio"
# #endregion 🔖Secrets

---
# #region 🔖Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: semio-hub-config
  namespace: semio-hub
data:
  POSTGRES_DB: semio
  POSTGRES_USER: semio
  RUST_LOG: "semio_hub=info,tower_http=info"
# #endregion 🔖Config

---
# #region 🔖PostgresService
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: semio-hub
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
# #endregion 🔖PostgresService

---
# #region 🔖PostgresStatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: semio-hub
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: semio-hub-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: semio-hub-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: semio-hub-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "semio", "-d", "semio"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "semio", "-d", "semio"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
# #endregion 🔖PostgresStatefulSet

---
# #region 🔖HubService
apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: semio-hub
spec:
  selector:
    app: hub
  ports:
    - name: http
      port: 8080
      targetPort: 8080
# #endregion 🔖HubService

---
# #region 🔖HubDeployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: semio-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hub
  template:
    metadata:
      labels:
        app: hub
    spec:
      containers:
        - name: hub
          image: semio/semio-hub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: semio-hub-secrets
                  key: DATABASE_URL
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: semio-hub-config
                  key: RUST_LOG
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
# #endregion 🔖HubDeployment

---
# #region 🔖Ingress
# Specs: Terminates HTTP for semio-hub (Hub Protocol v1 HTTP API, session WebSockets, MCP at /mcp). Requires an ingress controller (e.g. nginx). Replace host with your cluster DNS name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: semio-hub
  namespace: semio-hub
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: semio-hub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  number: 8080
# #endregion 🔖Ingress
