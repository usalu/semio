[package]
name = "semio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v7", "serde"] }
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
gltf = "1.4.1"
gltf-json = "1.4.1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ["console"] }
serde-wasm-bindgen = "0.6.5"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.19.0", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
chrono = "0.4.43"
zip = "7.2"
tempfile = "3.21"
walkdir = "2.5"
base64 = "0.22"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
futures = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2.5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.9.0"
