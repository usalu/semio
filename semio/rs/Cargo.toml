[package]
name = "semio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v7", "serde"] }
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
gltf = "1.4.1"
gltf-json = "1.4.1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ["console"] }
serde-wasm-bindgen = "0.6.5"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.19.0", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
chrono = "0.4.43"
zip = "7.2"
tempfile = "3.21"
walkdir = "2.5"
base64 = "0.22"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.9.0"

[[bin]]
name = "semio-session"
path = "src/bin/bin.rs"
required-features = ["session"]

[features]
default = []
session = [
    "dep:tokio",
    "dep:axum",
    "dep:sqlx",
    "dep:tower-http",
    "dep:time",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:futures",
    "dep:tokio-stream",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1"
features = ["full"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.axum]
version = "0.8"
features = ["ws"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tower-http]
version = "0.6"
features = ["cors", "trace"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.time]
version = "0.3"
features = ["serde", "formatting", "parsing"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tracing]
version = "0.1"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.futures]
version = "0.3"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-stream]
version = "0.1"
optional = true
