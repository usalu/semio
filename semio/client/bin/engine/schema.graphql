"""
🕸️GraphQL root query type exposing kit retrieval by URI.
Callers MUST provide a valid URI when resolving kit queries.
"""
type Query {
  node(
    """The ID of the object"""
    id: ID!
  ): Node
  kit(uri: String!): Kit
}

"""🕸️Relay-compliant GraphQL node interface."""
interface Node {
  """The ID of the object"""
  id: ID!
}

"""🔖GraphQL node exposing kit data."""
type Kit implements Node {
  uri: String!
  preview: String!
  license: String!
  homepage: String!
  remote: String!
  image: String!
  icon: String!
  description: String!
  version: String!
  name: String!

  """The ID of the object"""
  id: ID!
}

"""
🌱GraphQL root mutation type exposing kit creation.
Callers MUST provide a valid KitInput when creating kits.
"""
type Mutation {
  createKit(kit: KitInputNode!): Kit
}

"""🔖GraphQL input node for kit mutations."""
input KitInputNode {
  name: String!
  description: String = ""
  icon: String = ""
  image: String = ""
  preview: String = ""
  version: String = ""
  remote: String = ""
  homepage: String = ""
  license: String = ""
  types: [TypeInputNode] = null
  designs: [DesignInputNode] = null
  folders: [FolderInputNode] = null
  attributes: [AttributeInputNode] = null
  concepts: [String] = null
}

"""🔖GraphQL input node for type mutations."""
input TypeInputNode {
  name: String!
  description: String = ""
  icon: String = ""
  image: String = ""
  stock: Int = 2147483647
  isVirtual: Boolean = false
  unit: String = ""
  parent: String = null
  isAbstract: Boolean = null
  folder: String = null
  location: LocationInputNode = null
  representations: [RepresentationInputNode] = null
  connectors: [ConnectorInputNode] = null
  props: [PropInputNode] = null
  authors: [String] = null
  attributes: [AttributeInputNode] = null
  concepts: [String] = null
}

"""🔖GraphQL input node for location mutations."""
input LocationInputNode {
  longitude: Float!
  latitude: Float!
  altitude: Float = null
}

"""🔖GraphQL input node for representation mutations."""
input RepresentationInputNode {
  url: String!
  file: String!
  name: String = null
  description: String = ""
  tags: [String] = null
  attributes: [AttributeInputNode] = null
}

"""🟪GraphQL input node for attribute mutations."""
input AttributeInputNode {
  name: String!
  value: String = ""
  definition: String = ""
}

"""🔖GraphQL input node for connector mutations."""
input ConnectorInputNode {
  id_: String = ""
  description: String = ""
  isMandatory: Boolean = false
  maxChildren: Int = 1
  port: String = ""
  compatiblePorts: [String] = null
  t: Float = 0
  point: PointInputNode!
  direction: VectorInputNode!
  attributes: [AttributeInputNode] = null
}

"""💚GraphQL input node for point mutations."""
input PointInputNode {
  x: Float!
  y: Float!
  z: Float!
}

"""💗GraphQL input node for vector mutations."""
input VectorInputNode {
  x: Float!
  y: Float!
  z: Float!
}

"""🔖GraphQL input node for prop mutations."""
input PropInputNode {
  key: String!
  value: String!
  unit: String = ""
}

"""🔖GraphQL input node for design mutations."""
input DesignInputNode {
  name: String!
  description: String = ""
  icon: String = ""
  image: String = ""
  unit: String = ""
  parent: String = null
  isAbstract: Boolean = null
  folder: String = null
  activeLayer: String = null
  location: LocationInputNode = null
  pieces: [PieceInputNode] = null
  connections: [ConnectionInputNode] = null
  props: [PropInputNode] = null
  authors: [String] = null
  attributes: [AttributeInputNode] = null
  concepts: [String] = null
}

"""🔖GraphQL input node for piece mutations."""
input PieceInputNode {
  id_: String = ""
  description: String = ""
  plane: PlaneInputNode = null
  center: CoordinateInputNode = null
  attributes: [AttributeInputNode] = null
  type: TypeIdInputNode
  designPiece: DesignIdInputNode = null
}

"""🔖GraphQL input node for plane mutations."""
input PlaneInputNode {
  origin: PointInputNode!
  xAxis: VectorInputNode!
  yAxis: VectorInputNode!
}

"""🟤GraphQL input node for coordinate mutations."""
input CoordinateInputNode {
  u: Float!
  v: Float!
}

"""🔖GraphQL input node for type id mutations."""
input TypeIdInputNode {
  variant: String = ""
  name: String!
}

"""🔖GraphQL input node for design id mutations."""
input DesignIdInputNode {
  name: String!
}

"""🔖GraphQL input node for connection mutations."""
input ConnectionInputNode {
  description: String = ""
  gap: Float = 0
  shift: Float = 0
  rise: Float = 0
  rotation: Float = 0
  turn: Float = 0
  tilt: Float = 0
  u: Float = 0
  v: Float = 0
  connected: SideInputNode!
  connecting: SideInputNode!
}

"""🔖GraphQL input node for side mutations."""
input SideInputNode {
  piece: PieceIdInputNode!
  designPiece: PieceIdInputNode
  connector: ConnectorIdInputNode
}

"""🔖GraphQL input node for piece id mutations."""
input PieceIdInputNode {
  id_: String = ""
}

"""🔖GraphQL input node for connector id mutations."""
input ConnectorIdInputNode {
  id_: String = ""
}

"""🔖GraphQL input node for folder mutations."""
input FolderInputNode {
  id: String!
  name: String!
  parent: String = null
  description: String = ""
  createdAt: DateTime!
  createdBy: String = null
  updatedAt: DateTime!
  updatedBy: String = null
  attributes: [AttributeInputNode] = null
}

"""
The `DateTime` scalar type represents a DateTime
value as specified by
[iso8601](https://en.wikipedia.org/wiki/ISO_8601).
"""
scalar DateTime