schema:
  scalar: &scalar
    - &string
    - &number
    - &boolean
    - &timestamp
  interface: &interface
    entity: &entity
      fields:
        id: *string
        hash: *string
        owner: *entity
        owns: [*entity]
    weakEntity: &weakEntity
      contraints:
        - &hashAsId "id is hash of entity"
    strongEntity: &strongEntity
      contraints:
        - &uuidv7AsId "id is uuidv7 at creation time"
    richStrongEntity: &richStrongEntity
      fields:
        data:
          name: *string
          description: *string
          icon: *string
        computed:
          createdAt: *timestamp
          createdBy: *string
  class: &class
    point: &point
      implements: [*weakEntity]
      fields:
        x: *number
        y: *number
        z: *number
    vector: &vector
      implements: [*weakEntity]
      fields:
        x: *number
        y: *number
        z: *number
