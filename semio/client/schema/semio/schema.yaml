schema:
  interfaces:
    entity: &entity
      fields:
        id: string
        hash: string
        owner: *entity
        owns: [*entity]
    weakEntity:
      contraints:
        - "No id and uses hash as id."
    strongEntity:
      contraints:
        - "id is uuidv7 at creation time"



    name: string
