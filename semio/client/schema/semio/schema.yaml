schema:
  primitives:
    - &scalar
    - &enum
    - &field
    - &interface
    - &class
    - &module
  general: &general
    is: *module
    scalars:
      - &string
      - &number
      - &boolean
      - &timestamp
      - &color
      - &uri
      - &icon
    interfaces:
      entity: &entity
        fields:
          id: *string
          hash: *string
          owner: *entity
          owns: [*entity]
      weakEntity: &weakEntity
        implements: [*entity]
        contraints:
          - &hashAsId "id is hash of entity"
      data: &data
        implements: [*weakEntity]
      strongEntity: &strongEntity
        implements: [*entity]
        contraints:
          - &uuidv7AsId "id is uuidv7 at creation time"
      richStrongEntity: &richStrongEntity
        implements: [*strongEntity]
        fields:
          name:
            is: *string
            constraints:
              - &nameNonEmpty "name is not empty"
              - &nameShort "name is less than 100 chars"
          description:
            is: *string
            constraints:
              - &descriptionShort "description is less than 1000 chars"
          icon: *string
          createdAt: *timestamp
          createdBy:
            is: *author
            cached: false
      artifact: &artifact
        implements: [*richStrongEntity]
        fields:
          authoredBy: [*author]
          changedIn: [*artifact]
          lastChangedAt: *timestamp
          lastChangedBy: *author
          lastChangedIn: *artifact
          changes: [*change]
          edits: [*edit]
      document: &document
        implements: [*artifact]
        fields:
          reference:
            previewImage: *artifact
      event: &event
        implements: [*weakEntity]
        fields:
          data:
            timestamp: *timestamp
          reference:
            involves: [*artifact]
  domain: &domain
    is: *module
    interfaces:
      response: &response
        implements: [*weakEntity]
      input: &input
        implements: [*weakEntity]
    classes:
      vector: &vector
        implements: [*data]
        fields:
          x: *number
          y: *number
          z: *number
      point: &point
        implements: [*data]
        fields:
          x: *number
          y: *number
          z: *number
      coordinate: &coordinate
        implements: [*data]
        fields:
          u: *number
          v: *number
      offset: &offset
        implements: [*data]
        fields:
          x: *number
          y: *number
      plane: &plane
        implements: [*data]
        fields:
          origin: *point
          xAxis: *vector
          yAxis: *vector
          zAxis: *vector
      position: &position
        implements: [*weakEntity]
        fields:
          coordinate: *coordinate
          offset: *offset
          plane: *plane
      location: &location
        implements: [*weakEntity]
        fields:
          position: *position
          place: *place
      attribute: &attribute
        implements: [*weakEntity]
        fields:
          key: *string
          value: *string
      place: &place
        implements: [*artifact]
        fields:
          locations: [*location]
      family: &family
        implements: [*artifact]
        fields:
          artifacts: [*artifact]
      folder: &folder
        implements: [*artifact]
        fields:
          children: [*artifact]
      file: &file
        implements: [*document]
        fields:
          uri: *uri
          mediaType: *string
          size: *number
      author: &author
        implements: [*artifact]
        fields:
          email: *string
          url: *uri
      prop: &prop
        implements: [*artifact]
      benchmark: &benchmark
        implements: [*artifact]
      quality: &quality
        implements: [*artifact]
        fields:
          attributes: [*attribute]
      tag: &tag
        implements: [*artifact]
        fields:
          attributes: [*attribute]
      concept: &concept
        implements: [*artifact]
        fields:
          qualities: [*quality]
          tags: [*tag]
          attributes: [*attribute]
      port: &port
        implements: [*artifact]
        fields:
          concept: *concept
          position: *position
          qualities: [*quality]
          attributes: [*attribute]
      connector: &connector
        implements: [*artifact]
        fields:
          from: *port
          to: *port
          qualities: [*quality]
          attributes: [*attribute]
      representation: &representation
        implements: [*artifact]
        fields:
          file: *file
          attributes: [*attribute]
      type: &type
        implements: [*artifact]
        fields:
          concepts: [*concept]
          ports: [*port]
          representations: [*representation]
          attributes: [*attribute]
          # Neo4j: `connector` / `connectors` kit members OWNS from Class Type (not Interface Operation). Kit-level `connectors` on Class Kit stays separate.
          data:
            connectors: [*connector]
          computed:
            connector: *connector
      layer: &layer
        implements: [*artifact]
        fields:
          visible: *boolean
          locked: *boolean
      piece: &piece
        implements: [*artifact]
        fields:
          type: *type
          location: *location
          ports: [*port]
          attributes: [*attribute]
      side: &side
        implements: [*strongEntity]
        fields:
          piece: *piece
          port: *port
      connection: &connection
        implements: [*artifact]
        fields:
          connector: *connector
          from: *side
          to: *side
          attributes: [*attribute]
      group: &group
        implements: [*artifact]
        fields:
          pieces: [*piece]
          connections: [*connection]
      design: &design
