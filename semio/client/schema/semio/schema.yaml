    vcs: &vcs
      is: *module
      interfaces:
        workspace: &workspace
          implements: [*strongEntity]
          fields:
            data:
              savedChanges: [*change]
              unsavedChanges: [*change]
            computed:
              latestWipCheckpointAncestor: *checkpoint
              kit: *kit
            reference:
              checkpoint: *checkpoint
        diff: &diff
          implements: [*weakEntity]
        modification: &modification
          implements: [*weakEntity]
          fields:
