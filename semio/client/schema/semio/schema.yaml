        fields:
          pieces: [*piece]
          connections: [*connection]
          layers: [*layer]
          groups: [*group]
          attributes: [*attribute]
      kit: &kit
        implements: [*artifact]
        fields:
          places: [*place]
          families: [*family]
          folders: [*folder]
          files: [*file]
          authors: [*author]
          props: [*prop]
          benchmarks: [*benchmark]
          qualities: [*quality]
          tags: [*tag]
          concepts: [*concept]
          ports: [*port]
          connectors: [*connector]
          representations: [*representation]
          types: [*type]
          layers: [*layer]
          pieces: [*piece]
          connections: [*connection]
          groups: [*group]
          designs: [*design]
