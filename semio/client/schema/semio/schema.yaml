schema:
  primitives:
    - &scalar
    - &enum
    - &field
    - &interface
    - &class
    - &module
  general: &general
    is: *module
    scalars:
      - &string
      - &number
      - &boolean
      - &timestamp
      - &color
      - &uri
      - &icon
    interfaces:
      entity: &entity
        fields:
          id: *string
          hash: *string
          owner: *entity
          owns: [*entity]
      weakEntity: &weakEntity
        implements: [*entity]
        contraints:
          - &hashAsId "id is hash of entity"
      data: &data
        implements: [*weakEntity]
      strongEntity: &strongEntity
        implements: [*entity]
        contraints:
          - &uuidv7AsId "id is uuidv7 at creation time"
      richStrongEntity: &richStrongEntity
        implements: [*strongEntity]
        fields:
          name:
            is: *string
            constraints:
              - &nameNonEmpty "name is not empty"
              - &nameShort "name is less than 100 chars"
          description:
            is: *string
            constraints:
              - &descriptionShort "description is less than 1000 chars"
          icon: *string
          createdAt: *timestamp
          createdBy:
            is: *author
            cached: false
      artifact: &artifact
        implements: [*richStrongEntity]
        fields:
          authoredBy: [*author]
          changedIn: [*artifact]
          lastChangedAt: *timestamp
          lastChangedBy: *author
          lastChangedIn: *artifact
          changes: [*change]
          edits: [*edit]
      document: &document
        implements: [*artifact]
        fields:
          reference:
            previewImage: *artifact
      event: &event
        implements: [*weakEntity]
        fields:
          data:
            timestamp: *timestamp
          reference:
            involves: [*artifact]
  domain: &domain
    is: *module
    interfaces:
      command: &command
        implements: [*weakEntity]
        fields:
          computed:
            response: *response
      response: &response
        implements: [*weakEntity]
      input: &input
        implements: [*weakEntity]
    classes:
      vector: &vector
        implements: [*data]
        fields:
          x: *number
          y: *number
          z: *number
      point: &point
        implements: [*data]
        fields:
          x: *number
          y: *number
          z: *number
      coordinate: &coordinate
        implements: [*data]
        fields:
          u: *number
          v: *number
      offset: &offset
        implements: [*data]
        fields:
          x: *number
          y: *number
      plane: &plane
        implements: [*data]
        fields:
          origin: *point
          xAxis: *vector
          yAxis: *vector
          zAxis: *vector
      position: &position
        implements: [*weakEntity]
        fields:
          coordinate: *coordinate
          offset: *offset
          plane: *plane
      location: &location
        implements: [*weakEntity]
        fields:
          position: *position
          place: *place
      attribute: &attribute
        implements: [*weakEntity]
        fields:
          key: *string
          value: *string
      place: &place
        implements: [*artifact]
        fields:
          locations: [*location]
      family: &family
        implements: [*artifact]
        fields:
          artifacts: [*artifact]
      folder: &folder
        implements: [*artifact]
        fields:
          children: [*artifact]
      file: &file
        implements: [*document]
        fields:
          uri: *uri
          mediaType: *string
          size: *number
      author: &author
        implements: [*artifact]
        fields:
          email: *string
          url: *uri
      prop: &prop
        implements: [*artifact]
      benchmark: &benchmark
        implements: [*artifact]
      quality: &quality
        implements: [*artifact]
        fields:
          attributes: [*attribute]
      tag: &tag
        implements: [*artifact]
        fields:
          attributes: [*attribute]
      concept: &concept
        implements: [*artifact]
        fields:
          qualities: [*quality]
          tags: [*tag]
          attributes: [*attribute]
      port: &port
        implements: [*artifact]
        fields:
          concept: *concept
          position: *position
          qualities: [*quality]
          attributes: [*attribute]
      connector: &connector
        implements: [*artifact]
        fields:
          from: *port
          to: *port
          qualities: [*quality]
          attributes: [*attribute]
      representation: &representation
        implements: [*artifact]
        fields:
          file: *file
          attributes: [*attribute]
      type: &type
        implements: [*artifact]
        fields:
          concepts: [*concept]
          ports: [*port]
          representations: [*representation]
          attributes: [*attribute]
      layer: &layer
        implements: [*artifact]
        fields:
          visible: *boolean
          locked: *boolean
      piece: &piece
        implements: [*artifact]
        fields:
          type: *type
          location: *location
          ports: [*port]
          attributes: [*attribute]
      side: &side
        implements: [*strongEntity]
        fields:
          piece: *piece
          port: *port
      connection: &connection
        implements: [*artifact]
        fields:
          connector: *connector
          from: *side
          to: *side
          attributes: [*attribute]
      group: &group
        implements: [*artifact]
        fields:
          pieces: [*piece]
          connections: [*connection]
      design: &design
        implements: [*artifact]
        fields:
          pieces: [*piece]
          connections: [*connection]
          layers: [*layer]
          groups: [*group]
          attributes: [*attribute]
      kit: &kit
        implements: [*artifact]
        fields:
          places: [*place]
          families: [*family]
          folders: [*folder]
          files: [*file]
          authors: [*author]
          props: [*prop]
          benchmarks: [*benchmark]
          qualities: [*quality]
          tags: [*tag]
          concepts: [*concept]
          ports: [*port]
          connectors: [*connector]
          representations: [*representation]
          types: [*type]
          layers: [*layer]
          pieces: [*piece]
          connections: [*connection]
          groups: [*group]
          designs: [*design]
      edit: &edit
        implements: [*strongEntity]
        fields:
          forwards: [*operation]
          backwards: [*operation]
          sequenceNumber: *number
          startedAt: *timestamp
          finishedAt: *timestamp
          finished: *boolean
          description: *string
          origin: *string
      change: &change
        implements: [*strongEntity]
        fields:
          edits: [*edit]
          startedAt: *timestamp
          savedAt: *timestamp
          saved:
            is: *boolean
            cached: false
            constraints:
              - &changeSavedDerivedFromSavedAt "📌 saved derives from embedded sibling savedAt: non-null persisted timestamp implies the boolean reads true."
          description: *string
          origin: *string
      checkpoint: &checkpoint
        implements: [*strongEntity]
        fields:
          timestamp: *timestamp
          message: *string
          authors: [*author]
          parent: *checkpoint
          ancestors: [*checkpoint]
          initial: *kit
          kit: *kit
          changes: [*change]
          edits: [*edit]
      theKit: &theKit
        implements: [*workspace]
      alternative: &alternative
        implements: [*workspace]
        fields:
          name: *string
      graph: &graph
        implements: [*strongEntity]
        fields:
          initialKit: *kit
          theKit: *theKit
          alternatives: [*alternative]
          checkpoints: [*checkpoint]
          releases: [*checkpoint]
      conflict: &conflict
        implements: [*strongEntity]
        fields:
          authoritativeChange: *change
          wipChange: *change
          reasons: [*string]
      store: &store
        implements: [*strongEntity]
        fields:
          wip: *graph
          stage: *graph
          authoritative: *graph
          conflicts: [*conflict]
          backbone: *backbone
      fileBackbone: &fileBackbone
        implements: [*backbone]
      websocketBackbone: &websocketBackbone
        implements: [*backbone]
      localProvider: &localProvider
        implements: [*provider]
        fields:
          uri: *uri
          stores: [*store]
      remoteProvider: &remoteProvider
        implements: [*provider]
        fields:
          uri: *uri
          url: *uri
      session: &session
        implements: [*strongEntity]
        fields:
          stores: [*store]
          localProvider: *localProvider
          remoteProviders: [*remoteProvider]
          startedAt: *timestamp
    vcs: &vcs
      is: *module
      interfaces:
        workspace: &workspace
          implements: [*strongEntity]
          fields:
            data:
              savedChanges: [*change]
              unsavedChanges: [*change]
            computed:
              latestWipCheckpointAncestor: *checkpoint
              kit: *kit
            reference:
              checkpoint: *checkpoint
        diff: &diff
          implements: [*weakEntity]
        modification: &modification
          implements: [*weakEntity]
          fields:
            reference:
              before: *graph
              diff: *diff
              after: *graph
        operation: &operation
          implements: [*strongEntity]
          fields:
            data:
              input: *input
            computed:
              modification: *modification
            reference:
              scope: *artifact
        backbone: &backbone
          implements: [*strongEntity]
          fields:
            data:
              uri: *uri
              status: *string
        provider: &provider
          implements: [*strongEntity]
          fields:
            data:
              backbones: [*backbone]
            computed:
              backbone: *backbone