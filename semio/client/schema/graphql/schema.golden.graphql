# Custom semio merkle-tree extension of the [relay specs](https://relay.dev/docs/guides/graphql-server-specification)

#region Scalars

scalar Timestamp

scalar Color

#endregion Scalars

#region Entities

#region General

interface Node {
  # Node
  id: ID! # data
}

interface Entity implements Node { # Our own extension on top of the relay specs
  # Node
  id: ID! # data
  # Entity
  hash: String! # cached
  owner: Entity # reference
  owns: EntityConnection # reference
}

interface EntityEdge {
  # EntityEdge
  cursor: String! # computed
  # EntityEdgeNode
  # node: ENTITY # reference
}

type PageInfo {
  # PageInfo
  hasNextPage: Boolean! # computed
  hasPreviousPage: Boolean! # computed
  startCursor: String! # computed // start at this entity
  endCursor: String! # computed // end at this entity
}

type PageInfoEdge implements EntityEdge {
  # EntityEdge
  cursor: String! # computed
  # EntityEdgeNode
  node: PageInfo! # reference
}

type PageInfoConnection implements EntityConnection {
  # EntityConnection
  edges: [PageInfoEdge!]! # computed
  pageInfo: PageInfo! # computed
  hash: String! # cached
}

interface EntityConnection {
  # EntityConnection
  # edges: [ENTITYEdge] # computed
  pageInfo: PageInfo! # computed
  hash: String! # cached // our own extension on top of the relay specs
}

interface WeakEntity implements Entity & Node {
  # Node
  id: ID! # computed // hash
  # Entity
  hash: String! # cached
  owner: Entity # reference
  owns: EntityConnection # reference
}

interface StrongEntity implements Entity & Node {
  # Node
  id: ID! # data // uuidv7
  # Entity
  hash: String! # cached
  owner: Entity # reference
  owns: EntityConnection # reference
}

interface RichStrongEntity implements StrongEntity & Entity & Node {
  # Node
  id: ID! # data // uuidv7
  # Entity
  hash: String! # cached
  owner: Entity # reference
  owns: EntityConnection # reference
  # RichStrongEntity
  name: String! # data
  description: String! # data
  icon: String! # data
  createdAt: Timestamp # computed
  createdBy: Author # computed
}

interface Artifact implements RichStrongEntity & StrongEntity & Entity & Node {
  # Node
  id: ID! # data // uuidv7
  # Entity
  hash: String! # cached
  owner: Entity # reference
  owns: EntityConnection # reference
  # RichStrongEntity
  name: String! # data
  description: String! # data
  icon: String! # data
  createdAt: Timestamp # computed
  createdBy: Author # computed
  # Artifact
  authoredBy: AuthorConnection # computed
  changedIn: CheckpointConnection # computed
  lastChangedAt: Timestamp # computed
  lastChangedBy: Author # computed
  lastChangedIn: Checkpoint # computed
  changes: ChangeConnection # computed
  edits: EditConnection # computed
}

interface Document implements Artifact & RichStrongEntity & StrongEntity & Entity & Node {
  # Node
  id: ID! # data // uuidv7
  # Entity
  hash: String! # cached
  owner: Entity # reference
  owns: EntityConnection # reference
  # RichStrongEntity
  name: String! # data
  description: String! # data
  icon: String! # data
  createdAt: Timestamp # computed
  createdBy: Author # computed
  # Artifact
  authoredBy: AuthorConnection # computed
  changedIn: CheckpointConnection # computed
  lastChangedAt: Timestamp # computed
  lastChangedBy: Author # computed
  lastChangedIn: Checkpoint # computed
  changes: ChangeConnection # computed
  edits: EditConnection # computed
  # Document
  previewImage: File # reference // preview
}

interface Event implements WeakEntity & Entity & Node {
  # Node
  id: ID! # computed // hash
  # Entity
  hash: String! # cached
  owner: Entity # reference
  owns: EntityConnection # reference
  # Event
  timestamp: Timestamp! # data
  involves: EntityConnection # reference
}

