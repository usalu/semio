  node: RemoteProviderCommand! # reference
}

type RemoteProviderCommandConnection implements EntityConnection {
  # EntityConnection
  edges: [RemoteProviderCommandEdge!]! # computed
  pageInfo: PageInfo! # computed
  hash: String! # cached
}

#endregion RemoteProvider

#endregion Providers

#region Sessions

type SessionEdge implements EntityEdge {
  # EntityEdge
  cursor: String! # computed
  # EntityEdgeNode
  node: Session! # reference
}

type SessionConnection implements EntityConnection {
  # EntityConnection
  edges: [SessionEdge!]! # computed
  pageInfo: PageInfo! # computed
  hash: String! # cached
}

type Session implements StrongEntity & Entity & Node {
  # Node
  id: ID! # data // uuidv7
  # Entity
  hash: String! # cached
  owner: Entity # reference // Graph
  owns: EntityConnection # reference // Alternative | Graph | Checkpoint
  # Session
  stores: StoreConnection # data
  localProvider: LocalProvider # data
  remoteProviders: RemoteProviderConnection # data
  startedAt: Timestamp # data
}

#region Commands

type SessionCommand {
  # SessionCommand
  start: ID!
  end: ID!
  store(id: ID!): StoreCommand!
  localProvider: LocalProviderCommand!
  remoteProvider(url: String!): RemoteProviderCommand!
}

type SessionCommandEdge implements EntityEdge {
  # EntityEdge
  cursor: String! # computed
  # EntityEdgeNode
  node: SessionCommand! # reference
}

type SessionCommandConnection implements EntityConnection {
  # EntityConnection
  edges: [SessionCommandEdge!]! # computed
  pageInfo: PageInfo! # computed
  hash: String! # cached
}

#endregion Commands

#endregion Sessions

#endregion VCS

#endregion Entities

#region Schema

type Query {
  # Node
  node(id: ID!): Node
  # Entity
  entity(hash: ID!): Entity
  # Query
  session: Session!
}

#region ScopedCommands

# 🎬 Kit-changing operations resolve through command scopes:
#     `session → theKit | alternative(id) | startAlternative(name) | start | end | login | logout`,
#     then `theKit → startNewChange | unsavedChange(id) | save | createCheckpoint`,
#     then `unsavedChange(id) → kit → …`. Leaf fields return the resulting operation `ID!`.
type Mutation {
  # Mutation
  session: SessionCommand!
}

# 🔴 Live subscription: mirrors `Query`. The server emits the resolved selection on subscribe
# and re-emits whenever any selected field changes (live-query). Selecting a single leaf scalar
# limits emissions to updates of that scalar.
type Subscription {
  # Subscription
  session: Session!
  operation: Operation!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

#endregion Schema
