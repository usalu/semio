[package]
name = "procedural-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:procedural"

[package.metadata.semio]
consumes = ["forms.questionKind"]

[[package.metadata.semio.playground]]
variant = "procedural2d"
app = "procedural2d-play"
aliases = ["procedural 2d"]
ports = { react = 6021, wgpu = 6121 }

[[package.metadata.semio.playground]]
variant = "procedural3d"
app = "procedural3d-play"
aliases = ["procedural 3d"]
ports = { react = 6018, wgpu = 6118 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
procedural_2d = { path = "../../2d/rs" }
procedural_3d = { path = "../../3d/rs" }
playbook = { path = "../../../s/kernel/playbook/rs", package = "semio-s-kernel-playbook" }
flow_core = { path = "../../../s/kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
flow_module_draw = { path = "../../../s/kernel/flow/module/draw/rs", default-features = false, package = "semio-s-kernel-flow-module-draw" }
flow_module_brep = { path = "../../../s/kernel/flow/module/brep/rs", default-features = false, package = "semio-s-kernel-flow-module-brep" }
semio-framework-program = { path = "../../../framework/program/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
ui_wgpu = { path = "../../../ui/wgpu/rs" }
ui_styling = { path = "../../../ui/styling/rs" }
kernel_3d_engine = { path = "../../../s/kernel/geometry/3d/brep/engine/rs", features = ["parallel"], package = "semio-s-kernel-geometry-3d-brep-engine" }
kernel_3d_scene = { path = "../../../s/kernel/geometry/3d/scene/rs", package = "semio-s-kernel-geometry-3d-scene" }
vcs = { path = "../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

