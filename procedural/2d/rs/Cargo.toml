[package]
name = "procedural_2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
dsl = { path = "../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
flow_core = { path = "../../../s/kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
playbook = { path = "../../../s/kernel/playbook/rs", package = "semio-s-kernel-playbook" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
