[package]
name = "procedural_2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../vcs/rs" }
protocol = { path = "../../../protocol/rs" }
dsl = { path = "../../../dsl/rs" }
flow_core = { path = "../../../flow/core/rs" }
playbook = { path = "../../../playbook/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
