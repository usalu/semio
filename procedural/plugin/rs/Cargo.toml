[package]
name = "procedural-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:procedural"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
procedural_2d = { path = "../../2d/rs" }
flow_core = { path = "../../../flow/core/rs" }
flow_module_draw = { path = "../../../flow/module/draw/rs", default-features = false }
flow_module_brep = { path = "../../../flow/module/brep/rs", default-features = false }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
kernel_3d_brepkit = { path = "../../../kernel/3d/brep/rs" }
kernel_3d_engine = { path = "../../../kernel/3d/brep/engine/rs", features = ["parallel"] }
kernel_3d_scene = { path = "../../../kernel/3d/scene/rs" }
vcs = { path = "../../../vcs/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

