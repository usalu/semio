[package]
name = "procedural-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:procedural"

[package.metadata.semio]
consumes = ["forms.questionKind"]

[[package.metadata.semio.playground]]
variant = "procedural2d"
app = "procedural2d-play"
aliases = ["procedural 2d"]
ports = { react = 6021, wgpu = 6121 }

[[package.metadata.semio.playground]]
variant = "procedural3d"
app = "procedural3d-play"
aliases = ["procedural 3d"]
ports = { react = 6018, wgpu = 6118 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
procedural_2d = { path = "../../2d/rs" }
procedural_3d = { path = "../../3d/rs" }
protocol = { path = "../../../protocol/rs" }
flow_core = { path = "../../../flow/core/rs" }
flow_module_draw = { path = "../../../flow/module/draw/rs", default-features = false }
flow_module_brep = { path = "../../../flow/module/brep/rs", default-features = false }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
ui_wgpu = { path = "../../../ui/wgpu/rs" }
kernel_3d_engine = { path = "../../../kernel/3d/brep/engine/rs", features = ["parallel"] }
kernel_3d_scene = { path = "../../../kernel/3d/scene/rs" }
vcs = { path = "../../../vcs/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

