[package]
name = "procedural3d-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:procedural3d"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
flow_core = { path = "../../../../flow/core/rs" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
