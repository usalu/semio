[package]
name = "cad-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:cad"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "cad"
ports = { react = 6020, wgpu = 6120 }

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-fixture"
root = "cad/fixture"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
cad_document = { path = "../../rs" }
semio-framework-program = { path = "../../../framework/program/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
ui_wgpu = { path = "../../../ui/wgpu/rs" }
kernel_3d_brepkit = { path = "../../../s/kernel/geometry/3d/brep/rs", package = "semio-s-kernel-geometry-3d-brep" }
kernel_3d_engine = { path = "../../../s/kernel/geometry/3d/brep/engine/rs", package = "semio-s-kernel-geometry-3d-brep-engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
vcs = { path = "../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../s/kernel/protocol/rs", package = "semio-s-kernel-protocol" }

