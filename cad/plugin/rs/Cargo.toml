[package]
name = "cad-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:cad"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
cad_document = { path = "../../rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../../vcs/rs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
