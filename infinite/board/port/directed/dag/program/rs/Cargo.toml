[package]
name = "dag-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:dag"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "dag"
ports = { react = 6017, wgpu = 6117 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
infinite_board_port_directed_dag = { path = "../../rs" }
protocol = { path = "../../../../../../../protocol/rs" }
vcs = { path = "../../../../../../../vcs/rs" }
store = { path = "../../../../../../../store/rs" }
semio-framework-program = { path = "../../../../../../../framework/program/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

