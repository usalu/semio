[package]
name = "infinite_board"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
ui_styling = { path = "../../../ui/styling/rs" }
infinite_cavas = { path = "../../cavas/rs" }
mathematical_graph = { path = "../../../mathematical/graph/rs" }
mathematical_graph_drawing = { path = "../../../mathematical/graph/drawing/rs" }
mathematical_geometry = { path = "../../../mathematical/geometry/rs" }
mathematical_graph_manifest = { path = "../../../mathematical/graph/manifest/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
