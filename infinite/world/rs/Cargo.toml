[package]
name = "infinite_world"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Application-neutral 3D world canvas engine for wgpu renderers"

[lib]
path = "lib.rs"

[dependencies]
kernel_3d_scene = { path = "../../../kernel/3d/scene/rs" }
ui_wgpu = { path = "../../../ui/wgpu/rs", features = ["engine"] }
semio-framework-core = { path = "../../../framework/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "console",
] }
