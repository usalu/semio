# Pre-commit hooks for Semio monorepo
# See https://pre-commit.com for more information

default_language_version:
  python: python3.13
  node: 18.0.0

repos:
  # Prettier - JavaScript/TypeScript/JSON/YAML/Markdown formatter
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format with Prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, scss]
        exclude: ^(package-lock\.json|\.prettierignore|dist/|storybook-static/|\.nx/)

  # Ruff - Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff
        name: Lint Python with Ruff
        args: [--fix]
        files: ^py/
      - id: ruff-format
        name: Format Python with Ruff
        files: ^py/

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        exclude: ^\.github/
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]

  # Custom TypeScript hooks
  - repo: local
    hooks:
      - id: i18n-validation
        name: Validate i18n translations
        entry: npx tsx hooks/i18n.ts
        language: system
        pass_filenames: false
        files: ^js/js/sketchpad/(locales/.*\.json|.*\.tsx?)$
        
      - id: typescript-check
        name: TypeScript compiler check
        entry: npx tsx hooks/typescript.ts
        language: system
        pass_filenames: false
        files: \.tsx?$
        exclude: ^(node_modules/|dist/|\.nx/)
        
      - id: eslint-check
        name: ESLint check
        entry: npx tsx hooks/eslint.ts
        language: system
        pass_filenames: false
        files: \.(js|jsx|ts|tsx)$
        exclude: ^(node_modules/|dist/|\.nx/)
        
      - id: prettier-check
        name: Prettier format check
        entry: npx tsx hooks/prettier.ts
        language: system
        pass_filenames: false
        files: \.(js|jsx|ts|tsx|json|md|yaml|yml|css|scss)$
        exclude: ^(package-lock\.json|node_modules/|dist/|\.nx/)

  # Python-specific hooks (only for py/ directory)
  - repo: local
    hooks:
      - id: ruff-report
        name: Ruff linter with report
        entry: npx tsx hooks/ruff.ts
        language: system
        pass_filenames: false
        files: ^py/.*\.py$
