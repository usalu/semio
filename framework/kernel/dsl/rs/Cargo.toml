[package]
name = "semio-framework-kernel-dsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Facade for the token-native declarative DSL engine — re-exports dsl_core/dsl_token/dsl_schema, the DslField/DslVariants runtime traits generated code binds against, and derive macros"


[lints]
workspace = true
[lib]
name = "dsl"
path = "lib.rs"

[dependencies]
dsl_core = { path = "../core/rs", package = "semio-framework-kernel-dsl-core" }
dsl_schema = { path = "../schema/rs", package = "semio-framework-kernel-dsl-schema" }
dsl_derive = { path = "../derive/rs", package = "semio-framework-kernel-dsl-derive" }
pack = { path = "../../../../s/kernel/pack/rs", package = "semio-s-kernel-pack" }
protocol = { path = "../../protocol/rs", package = "semio-framework-kernel-protocol" }
serde_json = "1.0.140"

[dev-dependencies]
store = { path = "../../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
