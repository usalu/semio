[package]
name = "semio-framework-kernel-dsl-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Token-transaction editor: undo/redo history, selections, bracket-matching navigation, completion-to-transaction bridge"


[lints]
workspace = true
[lib]
name = "dsl_editor"
path = "lib.rs"

[dependencies]
dsl_core = { path = "../../core/rs", package = "semio-framework-kernel-dsl-core" }
dsl_token = { path = "../../token/rs", package = "semio-framework-kernel-dsl-token" }
dsl_schema = { path = "../../schema/rs", package = "semio-framework-kernel-dsl-schema" }
