[package]
name = "semio-framework-kernel-protocol-format"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol .spr binary container — record framing, commit chain, recovery, zero-copy cursors"


[lints]
workspace = true
[lib]
name = "protocol_format"
path = "lib.rs"

[features]
default = ["deflate"]
deflate = ["pack_format/deflate"]

[dependencies]
protocol_core = { path = "../../core/rs", package = "semio-framework-kernel-protocol-core" }
pack_core = { path = "../../../../../s/kernel/pack/core/rs", package = "semio-s-kernel-pack-core" }
pack_format = { path = "../../../../../s/kernel/pack/format/rs", package = "semio-s-kernel-pack-format" }
blake3 = "1"
