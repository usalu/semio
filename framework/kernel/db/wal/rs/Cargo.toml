[package]
name = "semio-framework-kernel-db-wal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db write-ahead log — reuses protocol's .spr container, db record kinds in the 0x40..=0x4F extension range, group commit, segment rotation"

[lints]
workspace = true
[lib]
name = "db_wal"
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-framework-kernel-db-core" }
db_storage = { path = "../../storage/rs", package = "semio-framework-kernel-db-storage" }
protocol = { path = "../../../protocol/rs", package = "semio-framework-kernel-protocol" }
# 🎯 protocol_format is a direct dep (not just via the `protocol` facade) because the facade does
# not re-export `recover`/`parse_commit_payload`/`COMMIT_FRAME_LEN`/`HEADER_SIZE` — see this crate's
# `//#region 🔖Recovery` doc comment for the full rationale. Everything else this crate needs
# (SprWriter, FrameCursor, ReverseFrameCursor, RecoveryMode, RecoveryReport, ProtocolError,
# ProtocolLimits) comes from the `protocol` facade per the contract.
protocol_format = { path = "../../../protocol/format/rs", package = "semio-framework-kernel-protocol-format" }
# 🎯 protocol_core is a direct dep (not just via the `protocol` facade) because the facade only
# re-exports `ProtocolError`/`ProtocolLimits`/`RecordHasher`/`Signer`/`SignatureVerifier` from it —
# this crate also needs the `REC_COMMIT` record-kind byte (to recognize commit frames while
# recovering/replaying) and the `REQUIRED_HASH_CHAIN` header flag bit (to open every `.spr` segment
# with hash-chaining required).
protocol_core = { path = "../../../protocol/core/rs", package = "semio-framework-kernel-protocol-core" }
pack_core = { path = "../../../../../s/kernel/pack/core/rs", package = "semio-s-kernel-pack-core" }
blake3 = "1"
