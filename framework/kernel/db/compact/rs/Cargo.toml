[package]
name = "semio-framework-kernel-db-compact"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db compaction and GC — WAL merge/recompress, snapshot consolidation, payload/tombstone/branch/preview GC"

[lints]
workspace = true
[lib]
name = "db_compact"
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-framework-kernel-db-core" }
db_wal = { path = "../../wal/rs", package = "semio-framework-kernel-db-wal" }
db_storage = { path = "../../storage/rs", package = "semio-framework-kernel-db-storage" }
db_snapshot = { path = "../../snapshot/rs", package = "semio-framework-kernel-db-snapshot" }
db_index = { path = "../../index/rs", package = "semio-framework-kernel-db-index" }
db_state = { path = "../../state/rs", package = "semio-framework-kernel-db-state" }
