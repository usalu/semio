[package]
name = "semio-framework-kernel-db-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db storage traits — DbStorage/WalStorage/SnapshotStorage/PayloadStorage/CatalogStorage/IndexStorage/LeaseStorage, MemoryStorage, FsStorage"

[lints]
workspace = true
[lib]
name = "db_storage"
path = "lib.rs"

[features]
default = ["fs"]
fs = []

[dependencies]
db_core = { path = "../../core/rs", package = "semio-framework-kernel-db-core" }
pack = { path = "../../../../../s/kernel/pack/rs", package = "semio-s-kernel-pack" }
blake3 = "1"
