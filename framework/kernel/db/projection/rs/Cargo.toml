[package]
name = "semio-framework-kernel-db-projection"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db projections — projection classes, DAG deps, incremental apply, frontier tracking, historical + preview-augmented"

[lints]
workspace = true
[lib]
name = "db_projection"
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-framework-kernel-db-core" }
db_state = { path = "../../state/rs", package = "semio-framework-kernel-db-state" }
db_index = { path = "../../index/rs", package = "semio-framework-kernel-db-index" }
db_storage = { path = "../../storage/rs", package = "semio-framework-kernel-db-storage" }
protocol = { path = "../../../protocol/rs", package = "semio-framework-kernel-protocol" }
