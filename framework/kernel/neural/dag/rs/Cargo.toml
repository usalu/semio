[package]
name = "semio-framework-kernel-neural-dag"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "neural_dag"
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_graph_dsl = { path = "../../../mathematical/graph/dsl/rs", package = "semio-framework-kernel-mathematical-graph-dsl" }
mathematical_graph_manifest = { path = "../../../mathematical/graph/manifest/rs", package = "semio-framework-kernel-mathematical-graph-manifest" }
neural_engine = { path = "../../engine/rs", package = "semio-framework-kernel-neural-engine" }
serde_json = "1.0.140"
thiserror = "2.0.12"
