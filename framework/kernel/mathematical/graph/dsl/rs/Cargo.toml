[package]
name = "semio-framework-kernel-mathematical-graph-dsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "mathematical_graph_dsl"
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
dsl_core = { path = "../../../../dsl/core/rs", package = "semio-framework-kernel-dsl-core" }
dsl_schema = { path = "../../../../dsl/schema/rs", package = "semio-framework-kernel-dsl-schema" }
mathematical_graph_manifest = { path = "../../manifest/rs", package = "semio-framework-kernel-mathematical-graph-manifest" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
