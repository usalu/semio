[package]
name = "semio-framework-kernel-mathematical-wfc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lints]
workspace = true

[lib]
name = "mathematical_wfc"
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_graph = { path = "../../graph/rs", package = "semio-framework-kernel-mathematical-graph" }
mathematical_random = { path = "../../random/rs", package = "semio-framework-kernel-mathematical-random" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
mathematical_entropy = { path = "../../entropy/rs", package = "semio-framework-kernel-mathematical-entropy" }
