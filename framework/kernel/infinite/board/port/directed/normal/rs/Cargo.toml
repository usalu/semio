[package]
name = "semio-framework-kernel-infinite-board-port-directed-normal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "infinite_board_port_directed_normal"
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
ui_styling = { path = "../../../../../../../../ui/styling/rs" }
infinite_board_port_directed = { path = "../../rs", package = "semio-framework-kernel-infinite-board-port-directed" }
infinite_board_normal_undirected = { path = "../../../../normal/undirected/rs", package = "semio-framework-kernel-infinite-board-normal-undirected" }
mathematical_graph_manifest = { path = "../../../../../../mathematical/graph/manifest/rs", package = "semio-framework-kernel-mathematical-graph-manifest" }
mathematical_graph_drawing = { path = "../../../../../../mathematical/graph/drawing/rs", package = "semio-framework-kernel-mathematical-graph-drawing" }
infinite_cavas = { path = "../../../../../canvas/rs", package = "semio-framework-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
