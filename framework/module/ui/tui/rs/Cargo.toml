[package]
name = "ui_tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Handcrafted retained-mode terminal UI: semio-styled scene/cell renderer (default, wasm-safe) and native ANSI terminal backend (feature \"terminal\")"


[lints]
workspace = true
[lib]
path = "lib.rs"

[features]
default = []
# 🖥️ Native terminal backend: raw mode, alt screen, stdin ANSI input decoding. Off by
# default so wasm32 builds carry no platform I/O.
terminal = ["dep:libc", "dep:windows-sys"]
# 🌐 wasm-bindgen exports of the WasmHost for browser hosts (xterm.js); never default.
bindgen = ["dep:wasm-bindgen"]

[dependencies]
ui_styling = { path = "../../styling/rs", package = "ui_styling" }
unicode-width = "0.2.2"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = { version = "0.2.186", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.106", optional = true }
