[package]
name = "semio-framework-os-kernel-math-cas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "mathematical_cas"
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_number = { path = "../../number/rs", package = "semio-framework-os-kernel-math-number" }
mathematical_polynomial = { path = "../../polynomial/rs", package = "semio-framework-os-kernel-math-polynomial" }
mathematical_algebra = { path = "../../algebra/rs", package = "semio-framework-os-kernel-math-algebra" }
mathematical_random = { path = "../../random/rs", package = "semio-framework-os-kernel-math-random" }
