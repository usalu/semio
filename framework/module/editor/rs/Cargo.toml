[package]
name = "framework_editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../product/os/module/vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
ui_styling = { path = "../../ui/styling/rs", package = "ui_styling" }
infinite_cavas = { path = "../../../product/os/module/infinite/canvas/rs", package = "semio-framework-os-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
