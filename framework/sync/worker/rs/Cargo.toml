[package]
name = "semio-framework-sync-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Browser Web Worker WASM actor for framework/sync DocumentHost"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-sync = { path = "../../rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent", "Worker"] }
