[package]
name = "semio-framework-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Render-independent framework kernel: Platform, ActionBus, declarative UiTree, layouts"

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[dev-dependencies]
pretty_assertions = "1.4.1"
