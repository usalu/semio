[package]
name = "presentation-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:presentation"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "presentation"
ports = { react = 6051, wgpu = 6151 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
presentation_deck = { path = "../../rs" }
vcs = { path = "../../../../../vcs/rs" }
semio-framework-core = { path = "../../../../core/rs" }
semio-framework-os = { path = "../../../../product/os/core/rs" }
semio-framework-plugin = { path = "../../../../plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

