[package]
name = "semio-framework-os-run"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Headless runner: computes an OS studio's workflow without a UI"


[lints]
workspace = true
[lib]
path = "lib.rs"
[[bin]]
name = "semio-framework-os-run"
path = "bin.rs"

[dependencies]
semio-framework-core = { path = "../../../../core/rs" }
semio-framework-os = { path = "../../core/rs" }
semio-framework-hash = { path = "../../../../hash/rs" }
store = { path = "../../../../../store/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-program-host = { path = "../../../../program/host/rs" }

[dev-dependencies]
pretty_assertions = "1.4.1"
