[package]
name = "semio-framework-os"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Plugin-based OS kernel: hot-swappable WASM components, media graph, document VCS"

[lib]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../../../core/rs" }
semio-framework-plugin = { path = "../../../../plugin/rs" }
vcs = { path = "../../../../../vcs/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
base64 = "0.22.1"
png = "0.17.16"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.45.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
