[package]
name = "semio-framework-os"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Plugin-based OS kernel: hot-swappable WASM components, media graph, document VCS"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../../../core/rs" }
semio-framework-plugin = { path = "../../../../plugin/rs" }
ui_wgpu = { path = "../../../../../ui/wgpu/rs" }
kernel_3d_brepkit = { path = "../../../../../kernel/3d/brep/rs" }
kernel_3d_engine = { path = "../../../../../kernel/3d/brep/engine/rs" }
vcs = { path = "../../../../../vcs/rs" }
store = { path = "../../../../../store/rs" }
protocol = { path = "../../../../../protocol/rs" }
dsl = { path = "../../../../../dsl/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
base64 = "0.22.1"
png = "0.17.16"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.45.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
store_sync = { path = "../../../../../store/sync/rs" }
tokio = { version = "1", features = ["sync"], default-features = false }
uuid = { version = "1.20", features = ["v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.20", features = ["v7", "serde", "js"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
