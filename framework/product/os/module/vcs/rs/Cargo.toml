[package]
name = "semio-framework-os-kernel-vcs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Generic document version-graph algebra — Author/Change/Checkpoint/Alternative/DocumentVcs, VcsError, content-addressed checkpoint ids"


[lints]
workspace = true

[lib]
name = "vcs"
path = "lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
# 🎞️ Operation/Edit — this crate's own `DocumentVcs.edits: Vec<Edit<Operation>>` field type and the
# `apply_operation`/`absorb_diff` generic bound. `pack`/`dsl` moved to `store` (the serialization seam
# now lives there — see `26/07/28/EXTRACT-STORE-INTO-ITS-OWN-TECHNOLOGY`).
protocol = { path = "../../protocol/rs", package = "semio-framework-os-kernel-protocol" }
# 🎞️ content-addressed checkpoint ids — `pack::content_hash` reads a pack FILE's footer (wrong tool
# for hashing arbitrary bytes), so this crate hashes directly with blake3 (the same primitive
# `pack_core::ContentHash`/`protocol_format::Blake3Hasher` use).
blake3 = "1"

[dev-dependencies]
tempfile = "3.20.0"
