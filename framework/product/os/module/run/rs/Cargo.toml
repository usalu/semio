[package]
name = "semio-framework-os-run"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Headless runner: computes an OS studio's workflow without a UI"


[lints]
workspace = true
[lib]
path = "lib.rs"
[[bin]]
name = "semio-framework-os-run"
path = "bin.rs"

[dependencies]
semio-framework-core = { path = "../../../../../rs", package = "semio-framework-core" }
semio-framework-os = { path = "../../../rs", package = "semio-framework-os" }
semio-framework-hash = { path = "../../../../../module/hash/rs", package = "semio-framework-hash" }
store = { path = "../../store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-plugin-host = { path = "../../plugin/host/rs", package = "semio-framework-plugin-host" }

[dev-dependencies]
pretty_assertions = "1.4.1"
