[package]
name = "semio-framework-os-renderer-wgpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Raw wgpu WASM renderer for declarative framework UiNode trees"
build = "build.rs"


[lints]
workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../../../../../rs", package = "semio-framework-core" }
framework_surface_node_graph = { path = "../../../../../../module/surface/node-graph/rs", package = "framework_surface_node_graph" }
framework_editor = { path = "../../../../../../module/editor/rs", package = "framework_editor" }
infinite_cavas = { path = "../../../infinite/canvas/rs", package = "semio-framework-os-kernel-infinite-canvas" }
infinite_world = { path = "../../../infinite/world/rs", package = "semio-framework-kernel-infinite-world" }
# 🎬 Direct dependency (rather than reaching through `infinite_world`, which imports these privately)
# so the Tutorial track's camera keyframes can convert to/from `OrbitController`/`Camera3d` — see
# `//#region 🎬Tutorial` in lib.rs.
kernel_3d_scene = { path = "../../../../../../../s/module/3d/scene/rs", package = "semio-framework-os-kernel-3d-scene" }
framework_surface_tiled_map = { path = "../../../../../../module/surface/tiled-map/rs", package = "framework_surface_tiled_map" }
puzzle_2d_engine = { path = "../../../../../../../s/plugin/puzzle/app/2d/engine/rs", package = "semio-s-app-puzzle-2d-engine" }
flow_core = { path = "../../../flow/core/rs", package = "semio-framework-os-kernel-flow-core" }
ui_wgpu = { path = "../../../../../../module/ui/wgpu/rs", features = ["engine"], package = "ui_wgpu" }
semio-framework-plugin = { path = "../../../plugin/rs", package = "semio-framework-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
vello = { version = "0.7.0", default-features = false, features = ["wgpu"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
pollster = "0.4.0"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.45.1"

[features]
native-bin = []

[[bin]]
name = "semio-wgpu-native"
path = "bin.rs"
required-features = ["native-bin"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-plugin-host = { path = "../../../plugin/host/rs", package = "semio-framework-plugin-host" }
store_sync = { path = "../../../store/sync/rs", package = "semio-framework-os-kernel-store-sync" }
vcs = { path = "../../../vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../store/rs", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../protocol/rs", package = "semio-framework-os-kernel-protocol" }
tokio = { version = "1", features = ["sync"], default-features = false }
ureq = "2.12.1"
rfd = "0.15.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
    "Event",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "InputEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRect",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "console",
    "MediaQueryList",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.56"
