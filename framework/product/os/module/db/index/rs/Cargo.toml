[package]
name = "semio-framework-os-kernel-db-index"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db secondary indexes — immutable sorted runs, LSM-lite merges, per-kind index builders"

[lints]
workspace = true
[lib]
name = "db_index"
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-framework-os-kernel-db-core" }
db_storage = { path = "../../storage/rs", package = "semio-framework-os-kernel-db-storage" }
pack_core = { path = "../../../pack/core/rs", package = "semio-framework-os-kernel-pack-core" }
