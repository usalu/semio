[package]
name = "semio-framework-os-kernel-protocol-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol command/collaboration-semantics foundation — ids, HLC, errors, limits, record kinds, scalar codecs, crypto traits"


[lints]
workspace = true
[lib]
name = "protocol_core"
path = "lib.rs"

[dependencies]
pack_core = { path = "../../../pack/core/rs", package = "semio-framework-os-kernel-pack-core" }
thiserror = "2.0.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
