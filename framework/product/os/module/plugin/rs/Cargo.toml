[package]
name = "semio-framework-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Declarative app plugin SDK for semio framework WASM components"


[lints]
workspace = true
[lib]
path = "lib.rs"

[features]
# 🧩 Enables WASI-P2 WIT guest exports + `semio_plugin_install_bundle` linkage. Only actual plugin
# crates (those expanding `semio_plugin!` / `plugin_exports!`) turn this on — consumers like
# `semio-framework-os` must not, or their wasm cdylib fails to link the guest-only symbol.
default = []
component-guest = []

[dependencies]
semio-framework-core = { path = "../../../../../rs", package = "semio-framework-core" }
ui_wgpu = { path = "../../../../../module/ui/wgpu/rs", package = "ui_wgpu" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
vcs = { path = "../../vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../store/rs", package = "semio-framework-os-kernel-store" }
# 🎞️ CW3 kernel cut-over: `DocumentApp::Operation`'s trait bound now references `protocol::Operation`/
# `protocol::OpText` directly.
protocol = { path = "../../protocol/rs", package = "semio-framework-os-kernel-protocol" }
wit-bindgen = { version = "0.36.0", features = ["macros"] }

[dev-dependencies]
dsl = { path = "../../dsl/rs", package = "semio-framework-os-kernel-dsl" }
