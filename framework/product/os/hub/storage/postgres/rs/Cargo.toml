# HubStorage implementation over PostgreSQL (sqlx-postgres/sqlx-core direct, matching the
# compose/server/hub precedent) — the scale-out backend for multi-node self-hosted deployments.
# #endregion 🔖Header

[package]
name = "os-hub-storage-postgres"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1"
serde_json = "1.0"
uuid = { version = "1.20", features = ["v7"] }
sqlx_core = { package = "sqlx-core", version = "0.8", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx_postgres = { package = "sqlx-postgres", version = "0.8", features = ["uuid", "json"] }
semio-framework-core = { path = "../../../../../../core/rs" }
os-hub-storage = { path = "../../rs" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
testcontainers-modules = { version = "0.11", features = ["postgres"] }
