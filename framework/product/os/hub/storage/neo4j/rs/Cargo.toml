# HubStorage implementation over Neo4j (neo4rs) — users/studios/memberships as real nodes and
# relationships; documents/operations stay a flat node-with-properties log (see lib.rs header for why).
# #endregion 🔖Header

[package]
name = "os-hub-storage-neo4j"
version = "0.1.0"
edition = "2021"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
serde_json = "1.0"
uuid = { version = "1.20", features = ["v7"] }
neo4rs = "0.8"
semio-framework-core = { path = "../../../../../../core/rs" }
semio-framework-hash = { path = "../../../../../../hash/rs" }
os-hub-storage = { path = "../../rs" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
