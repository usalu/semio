[package]
name = "semio-framework-renderer-wgpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Raw wgpu WASM renderer for declarative framework UiNode trees"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../../core/rs" }
framework_graph = { path = "../../../graph/rs" }
framework_editor = { path = "../../../editor/rs" }
infinite_cavas = { path = "../../../../infinite/cavas/rs" }
infinite_world = { path = "../../../../infinite/world/rs" }
gis_2d = { path = "../../../../gis/2d/rs" }
flow_core = { path = "../../../../flow/core/rs" }
ui_wgpu = { path = "../../../../ui/wgpu/rs", features = ["engine"] }
semio-framework-plugin = { path = "../../../plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
vello = { version = "0.7.0", default-features = false, features = ["wgpu"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
pollster = "0.4.0"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.45.1"

[features]
native-bin = []

[[bin]]
name = "semio-wgpu-native"
path = "bin.rs"
required-features = ["native-bin"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
semio-framework-plugin-host = { path = "../../../plugin/host/rs" }
ureq = "2.12.1"
rfd = "0.15.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
    "Event",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "InputEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRect",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "console",
    "MediaQueryList",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.56"
