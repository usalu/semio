[package]
name = "semio-s-kernel-flow-module-draw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "flow_module_draw"
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[features]
default = ["standalone-wasm"]
standalone-wasm = ["dep:wasm-bindgen"]

[dependencies]
flow_module_wasm = { path = "../../wasm/rs", package = "semio-s-kernel-flow-module-wasm" }
kernel_2d_engine = { path = "../../../../2d/engine/rs", package = "semio-s-kernel-geometry-2d-engine" }
kernel_2d_rs = { path = "../../../../2d/rs", package = "semio-s-kernel-geometry-2d" }
neural_engine = { path = "../../../../neural/engine/rs", package = "semio-framework-os-kernel-neural-engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2.106", optional = true }
