[package]
name = "semio-framework-os-kernel-pack-value"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format value layer — DSL schema-aware wire encoding/decoding of records"


[lints]
workspace = true
[lib]
name = "pack_value"
path = "lib.rs"

[dependencies]
pack_core = { path = "../../core/rs", package = "semio-framework-os-kernel-pack-core" }
pack_format = { path = "../../format/rs", package = "semio-framework-os-kernel-pack-format" }
dsl_schema = { path = "../../../dsl/schema/rs", package = "semio-framework-os-kernel-dsl-schema" }
blake3 = "1"
