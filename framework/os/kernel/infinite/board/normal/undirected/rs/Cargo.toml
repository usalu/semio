[package]
name = "semio-framework-os-kernel-infinite-board-normal-undirected"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "infinite_board_normal_undirected"
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
infinite_cavas = { path = "../../../../canvas/rs", package = "semio-framework-os-kernel-infinite-canvas" }
infinite_board = { path = "../../../rs", package = "semio-framework-os-kernel-infinite-board" }
mathematical_graph = { path = "../../../../../math/graph/rs", package = "semio-framework-os-kernel-math-graph" }
mathematical_graph_drawing = { path = "../../../../../math/graph/drawing/rs", package = "semio-framework-os-kernel-math-graph-drawing" }
mathematical_geometry = { path = "../../../../../math/geometry/rs", package = "semio-framework-os-kernel-math-geometry" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
