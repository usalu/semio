[package]
name = "semio-framework-os-kernel-infinite-board"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "infinite_board"
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
ui_styling = { path = "../../../../../ui/styling/rs" }
infinite_cavas = { path = "../../canvas/rs", package = "semio-framework-os-kernel-infinite-canvas" }
mathematical_graph = { path = "../../../math/graph/rs", package = "semio-framework-os-kernel-math-graph" }
mathematical_graph_drawing = { path = "../../../math/graph/drawing/rs", package = "semio-framework-os-kernel-math-graph-drawing" }
mathematical_geometry = { path = "../../../math/geometry/rs", package = "semio-framework-os-kernel-math-geometry" }
mathematical_graph_manifest = { path = "../../../math/graph/manifest/rs", package = "semio-framework-os-kernel-math-graph-manifest" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
