[package]
name = "semio-framework-os"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Plugin-based OS kernel: hot-swappable WASM plugins, workflow, document VCS"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../../core/rs" }
semio-framework-plugin = { path = "../../../plugin/rs" }
ui_wgpu = { path = "../../../ui/wgpu/rs", package = "ui_wgpu" }
kernel_3d_brepkit = { path = "../../kernel/3d/brep/rs", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../kernel/3d/brep/engine/rs", package = "semio-framework-os-kernel-3d-brep-engine" }
vcs = { path = "../../kernel/vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../kernel/store/rs", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
base64 = "0.22.1"
png = "0.17.16"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.45.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
store_sync = { path = "../../kernel/store/sync/rs", package = "semio-framework-os-kernel-store-sync" }
tokio = { version = "1", features = ["sync"], default-features = false }
uuid = { version = "1.20", features = ["v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.20", features = ["v7", "serde", "js"] }
wasm-bindgen = "0.2.106"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
pretty_assertions = "1.4.1"
