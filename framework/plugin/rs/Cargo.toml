[package]
name = "semio-framework-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Declarative app plugin SDK for semio framework WASM components"

[lib]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
