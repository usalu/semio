[package]
name = "semio-framework-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Declarative app plugin SDK for semio framework WASM components"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../core/rs" }
ui_wgpu = { path = "../../ui/wgpu/rs", package = "ui_wgpu" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
vcs = { path = "../../os/kernel/vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
# 🎞️ CW3 kernel cut-over: `DocumentApp::Operation`'s trait bound now references `protocol::Operation`/
# `protocol::OpText` directly.
protocol = { path = "../../os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
wit-bindgen = { version = "0.36.0", features = ["macros"] }

[dev-dependencies]
dsl = { path = "../../os/kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
