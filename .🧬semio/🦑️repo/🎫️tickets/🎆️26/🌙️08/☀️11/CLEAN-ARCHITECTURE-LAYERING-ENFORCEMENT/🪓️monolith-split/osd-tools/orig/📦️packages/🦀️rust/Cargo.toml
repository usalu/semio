[package]
workspace = "../../../../../../.."
name = "semio-framework-os-directory"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Directory event projection, protocol and transport boundary"

[package.metadata.semio]
role = "framework"
id = "os-directory"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []

[dependencies]
semio-framework-value = { path = "../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
protocol = { path = "../../../../../../🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-framework-value-derive = { path = "../../../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust" }
semio-framework-schema-validator = { path = "../../../../../../🔨️modules/🧬️schema/✅️validator/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { path = "../../../../../../🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust" }
semio-framework-async = { path = "../../../../../../🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-framework-os-identity = { path = "../../../🪪️identity/📦️packages/🦀️rust" }
semio-framework-os-channel = { path = "../../../📡️spr/🧵️channel/📦️packages/🦀️rust" }
semio-framework-plugin-component-receipt = { path = "../../../🔌️plugin/🖨️describe/🏷️component-receipt/🧬️schema/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

