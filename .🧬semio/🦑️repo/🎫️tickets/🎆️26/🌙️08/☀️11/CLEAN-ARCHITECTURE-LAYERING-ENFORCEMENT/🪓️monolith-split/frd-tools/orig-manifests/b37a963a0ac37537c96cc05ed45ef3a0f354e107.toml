[package]
workspace = "../../../../../.."
name = "semio-framework-async-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of async: cancellation, scopes, combinators, publication, native worker pool, parking, maintenance and deferred wake laws"
publish = false

[package.metadata.semio]
role = "framework"
id = "async-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-async = { path = "../../../../📦️packages/🦀️rust", features = ["testkit", "entrypoint"] }

[dev-dependencies]
semio-framework-trace = { workspace = true }
semio-framework-value = { workspace = true }
parking_lot = "=0.12.5"
semio-framework-async-macros = { path = "../../../../✨️macros/📦️packages/🦀️rust" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
