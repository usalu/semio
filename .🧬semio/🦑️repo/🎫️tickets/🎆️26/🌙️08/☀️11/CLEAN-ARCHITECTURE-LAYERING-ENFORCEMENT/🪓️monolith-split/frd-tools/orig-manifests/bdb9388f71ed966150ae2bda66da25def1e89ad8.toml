[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-store-sync"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The Store sync session, ArtifactHost and the shared socket and link vocabulary"

[package.metadata.semio]
role = "framework"
id = "os-store-sync"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testing = []

[dependencies]
semio-framework-os-spr = { path = "../../../../📡️spr/📦️packages/🦀️rust" }
semio-framework-os-store-backbone = { path = "../../../🔗️backbone/📦️packages/🦀️rust" }
semio-framework-os-store-codec-registry = { path = "../../../📦️codec/📦️packages/🦀️rust" }
semio-framework-os-store-engine = { path = "../../../⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-store-space-schema = { path = "../../../🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-store-text-io = { path = "../../../🚪️io/📦️packages/🦀️rust" }
semio-framework-async = { workspace = true, features = ["entrypoint"] }
semio-framework-diagnostic = { path = "../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../../🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-os-directory = { path = "../../../../📇️directory/📦️packages/🦀️rust" }
semio-framework-os-directory-client = { path = "../../../../📇️directory/🔌️client/📦️packages/🦀️rust" }
semio-framework-os-identity = { path = "../../../../🪪️identity/📦️packages/🦀️rust" }
semio-framework-os-pack = { path = "../../../../🎒️pack/📦️packages/🦀️rust" }
semio-framework-os-vcs = { path = "../../../../🌿️vcs/📦️packages/🦀️rust" }
semio-framework-pack = { path = "../../../../../../../🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-value-derive = { path = "../../../../../../../🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
semio-framework-process-routing-workspace = { path = "../../../../../../../🔨️modules/🏃️process/🧭️routing/🏠️workspace/📦️packages/🦀️rust" }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["net"] }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-plugin-component-receipt = { path = "../../../../🔌️plugin/🖨️describe/🏷️component-receipt/🧬️schema/📦️packages/🦀️rust" }
serde_json = "1.0.140"
