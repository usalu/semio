[package]
workspace = "../../../../../../../.."
name = "semio-framework-repo-cli-event-stream"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "semio repo CLI event stream: the typed event records, the Go-twin number formatting and the NDJSON, human and Markdown renderers every verb result flows through"

[package.metadata.semio]
role = "library"
id = "repo-cli-event-stream"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-repo-graphql = { path = "../../../../🔗️graphql/📦️packages/🦀️rust" }
semio-framework-repo-model = { path = "../../../../📐️model/📦️packages/🦀️rust" }
semio-framework-repo-tree = { path = "../../../../🌳️tree/📦️packages/🦀️rust" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
