[package]
workspace = "../../.."
name = "teaching-proctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Teaching proctor: the quiz lifecycle (identity without passwords, randomized runs, whole-run scoring, badges, leaderboard) as a CQRS/event-sourced, API-only instance of the framework server product over one SQLite file, called cross-origin by the CDN-hosted quiz site."

# 🛂️ A deployable instance of the server product, like the hub it mirrors.
[package.metadata.semio]
role = "hub"
id = "teaching-proctor"

[lints]
workspace = true

[lib]
name = "proctor"
path = "🦀️.rs"

[[bin]]
name = "proctor"
path = "../../🏗️bootstrap/🦀️.rs"

[dependencies]
teaching-proctor-base = { path = "../../🔨️modules/🧱️base/📦️packages/🦀️rust" }
teaching-proctor-domain = { path = "../../🔨️modules/🧠️domain/📦️packages/🦀️rust" }
semio-framework-quiz = { workspace = true }
semio-framework-server = { workspace = true }
semio-framework-async = { workspace = true }
# 🎯️ `float_roundtrip`: catalogs, commands and stored events are read correctly rounded, as the device reads them, so
# the proctor deals the device's sheets (`3.828e26` is otherwise read one double low).
serde_json = { workspace = true, features = ["float_roundtrip"] }
axum = { version = "0.8" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "sync"] }

[dev-dependencies]
# 🧰️ The fixtures of the base and domain tests (fixture catalog, scratch directories, ids, the command bus).
teaching-proctor-base = { path = "../../🔨️modules/🧱️base/📦️packages/🦀️rust", features = ["testkit"] }
teaching-proctor-domain = { path = "../../🔨️modules/🧠️domain/📦️packages/🦀️rust", features = ["testkit"] }
# 🔬️ Compiles the server product's backend-generic storage laws for this crate's tests only.
semio-framework-server = { workspace = true, features = ["conformance"] }
# 🔮️ Third-party oracles: `ureq` as an independent HTTP client driving the real gateway in the
# end-to-end test, `tungstenite` as an independent websocket client joining its presence rooms.
ureq = { version = "2", default-features = false }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

# 🔬️ The four storage roles over SQLite held to the framework's conformance laws.
[[test]]
name = "conformance"
path = "../../🧪️tests/🔬️conformance/🦀️.rs"

# 🌐️ The proctor on an ephemeral port, driven through its real HTTP API.
[[test]]
name = "end_to_end"
path = "../../🧪️tests/🌐️end-to-end/🦀️.rs"
