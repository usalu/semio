[package]
workspace = "../../../../../.."
name = "semio-hub-trusted-catalog-laws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trusted-catalog laws over the verified catalog"

[package.metadata.semio]
role = "hub"
id = "hub-trusted-catalog-laws"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
integration-fixtures = ["semio-hub-inference/integration-fixtures", "semio-hub-trusted-catalog/integration-fixtures", "semio-hub-trusted-catalog-contract/integration-fixtures"]
testkit = ["semio-hub-artifact-authority/testkit", "semio-hub-inference/testkit", "semio-hub-trusted-catalog/testkit", "semio-hub-trusted-catalog-contract/testkit"]

[dependencies]

[dev-dependencies]
semio-hub-artifact-authority = { workspace = true, features = ["testkit"] }
semio-hub-inference = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-inference-catalog = { workspace = true }
semio-hub-native-openable = { workspace = true }
semio-hub-testing = { workspace = true }
semio-hub-trusted-catalog = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-trusted-catalog-contract = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-trusted-catalog-descriptor = { workspace = true }
semio-framework-plugin-interpreter = { workspace = true }
semio-s-artifact-gis-gismap = { workspace = true }
blake3 = "1"
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
serde_json = { workspace = true }
semio-framework = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust" }
semio-framework-plugin-guest-contract = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-hub-stdio-catalog = { workspace = true }
semio-hub-gis = { workspace = true }
semio-framework-hash = { path = "../../../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-hub-vcs = { workspace = true }
semio-framework-value = { path = "../../../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
futures = "0.3"
