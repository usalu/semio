[package]
workspace = "../../../../../.."
name = "semio-framework-tool-machine-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of tool-machine: the transaction, scrub, typing, node-graph-edit and gesture-drive laws against the shared fixtures, with the third-party blake3 oracle for minted ids"
publish = false

[package.metadata.semio]
role = "framework"
id = "tool-machine-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-tool-machine = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }

[dev-dependencies]
# 🎰️ `statechart!` expansions name the kernel `machine::…`, so the dependency carries that name.
machine = { path = "../../../../../🔄️machine/📦️packages/🦀️rust", package = "semio-framework-machine" }
semio-framework-replication = { workspace = true }
semio-framework-value = { workspace = true }
# 🔏️ Third-party oracle for the transaction id minting pinned by the transaction-law fixture.
blake3 = "1.8.2"
serde_json = { workspace = true }
