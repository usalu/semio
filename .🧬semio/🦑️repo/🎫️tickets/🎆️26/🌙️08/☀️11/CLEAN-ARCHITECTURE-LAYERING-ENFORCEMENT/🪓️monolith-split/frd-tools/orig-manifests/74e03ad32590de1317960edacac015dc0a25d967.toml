[package]
workspace = "../../../../../../../.."
name = "semio-framework-os-config-tests-2"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of os-config (2 of 2): configuration schema, mutation and text IO tests"
publish = false

[package.metadata.semio]
role = "framework"
id = "os-config-tests-2"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-config = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-async-macros = { workspace = true }
semio-framework-diagnostic = { path = "../../../../../../../🔨️modules/⚠️diagnostic/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-value-derive = { workspace = true }
serde_json = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
