[package]
workspace = "../../../../../../../../../../../.."
name = "semio-framework-os-infinite-board-normal-fill"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Normal board fill: snapshot capture and ingress, the fill job state machine and the commit encoder"

[package.metadata.semio]
role = "product"
id = "os-infinite-board-normal-fill"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-infinite-board-schema/testkit", "semio-framework-os-infinite-board-engine/testkit", "semio-framework-os-infinite-board-normal-model/testkit", "semio-framework-os-infinite-board-normal-scene/testkit", "semio-framework-os-infinite-board-normal-gestures/testkit"]

[dependencies]
semio-framework-canvas = { path = "../../../../../../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
geometry = { path = "../../../../../../../../../../../🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
graph = { path = "../../../../../../../../../../../🔨️modules/🕸️graph/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-graph-engine" }
semio-framework-graph-drawing = { path = "../../../../../../../../../../../🔨️modules/🕸️graph/🖊️drawing/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-schema = { path = "../../../../../../🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-engine = { path = "../../../../../../⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-model = { path = "../../../🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-scene = { path = "../../../🖼️scene/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-gestures = { path = "../../../🕹️gestures/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-job-worker = { path = "../../../../../../../../../../../🔨️modules/🧵️job/👷️worker/📦️packages/🦀️rust", features = ["testkit"] }
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-trace = { path = "../../../../../../../../../../../🔨️modules/⏱️trace/📦️packages/🦀️rust" }
serde_json = "1.0.140"

[[test]]
name = "board_normal_fill_board_host"
path = "../../🧪️tests/🔬️board-host/🦀️.rs"
required-features = ["testkit"]
