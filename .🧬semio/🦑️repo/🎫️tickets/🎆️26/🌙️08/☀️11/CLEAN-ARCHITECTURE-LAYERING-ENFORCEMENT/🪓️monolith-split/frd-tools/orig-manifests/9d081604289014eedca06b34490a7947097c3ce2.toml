[package]
workspace = "../../../../../../.."
name = "semio-framework-ui-host-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Companion tests of ui-host: event normalization, event queue admission and the input byte buffer"
publish = false

[package.metadata.semio]
role = "framework"
id = "ui-host-tests"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-ui-host = { path = "../../../../📦️packages/🦀️rust", features = ["testkit"] }

[dev-dependencies]
semio-framework-abi = { path = "../../../../../../🌉️abi/📦️packages/🦀️rust" }
ui_render = { path = "../../../../../🖌️render/📦️packages/🦀️rust", package = "semio-framework-ui-render" }
serde_json = { workspace = true }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
ui_contract = { path = "../../../../../🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-value = { path = "../../../../../../🌱️value/📦️packages/🦀️rust" }
semio-framework-async = { path = "../../../../../../⏳️async/📦️packages/🦀️rust" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
semio-framework-job = { path = "../../../../../../🧵️job/📦️packages/🦀️rust" }
semio-framework-job-worker = { path = "../../../../../../🧵️job/👷️worker/📦️packages/🦀️rust" }
semio-framework-job-worker-authority = { path = "../../../../../../🧵️job/👷️worker/🎟️authority/📦️packages/🦀️rust" }
