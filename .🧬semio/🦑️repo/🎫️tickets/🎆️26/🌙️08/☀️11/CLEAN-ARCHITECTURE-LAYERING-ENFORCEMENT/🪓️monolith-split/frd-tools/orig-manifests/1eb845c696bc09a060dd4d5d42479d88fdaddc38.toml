[package]
workspace = "../../../../../../../../../../../.."
name = "semio-framework-os-infinite-board-dag-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Dag board host: the composed `DagHost` owner with pointer, paint, minimap and note orchestration"

[package.metadata.semio]
role = "product"
id = "os-infinite-board-dag-host"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["semio-framework-os-infinite-board-schema/testkit", "semio-framework-os-infinite-board-engine/testkit", "semio-framework-os-infinite-board-normal-model/testkit", "semio-framework-os-infinite-board-dag-model/testkit", "semio-framework-os-infinite-board-dag-graph/testkit"]

[dependencies]
semio-framework-os-infinite-directed-presentation = { path = "../../../../../../../🎲️board/🔌️ports/➡️directed/🧬️schema/🖼️presentation/📦️packages/🦀️rust" }
semio-framework-canvas = { path = "../../../../../../../../../../../🔨️modules/🖼️canvas/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../../../../../../../../🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../../../../../../../../🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-async = { workspace = true }
geometry = { path = "../../../../../../../../../../../🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
graph = { path = "../../../../../../../../../../../🔨️modules/🕸️graph/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-graph-engine" }
semio-framework-graph-drawing = { path = "../../../../../../../../../../../🔨️modules/🕸️graph/🖊️drawing/📦️packages/🦀️rust" }
ui_styling = { path = "../../../../../../../../../../../🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
semio-framework-os-infinite-board-schema = { path = "../../../../../../🧬️schema/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-engine = { path = "../../../../../../⚙️engine/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-normal-model = { path = "../../../../➕️normal/🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-dag-model = { path = "../../../🗃️model/📦️packages/🦀️rust" }
semio-framework-os-infinite-board-dag-graph = { path = "../../../🕸️graph/📦️packages/🦀️rust" }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
ui_wgpu = { path = "../../../../../../../../../../../🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu", "wgpu-engine"] }

[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
ui_wgpu = { path = "../../../../../../../../../../../🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"] }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement", "Window", "Request", "RequestInit", "RequestMode", "Response", "console"] }

[dev-dependencies]
semio-framework-os-kernel = { path = "../../../../../../../../../📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["mutation-testing"] }
serde_json = "1.0.140"

[[test]]
name = "board_dag_host_input"
path = "../../🧪️tests/🎛️input/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_dag_host_wire_edit"
path = "../../🧪️tests/🔗️wire-edit/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_dag_host_dag_unit"
path = "../../🧪️tests/🔬️dag-unit/🦀️.rs"
required-features = ["testkit"]

[[test]]
name = "board_dag_host_edit_rows"
path = "../../🧪️tests/🛠️edit-rows/🦀️.rs"
required-features = ["testkit"]
