[package]
workspace = "../../../../.."
name = "semio-hub-directory-laws-2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Directory laws: the writer and decider unit laws and the per-backend artifact-creation laws (part 2)"

[package.metadata.semio]
role = "hub"
id = "hub-directory-laws-2"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]

[dev-dependencies]
semio-hub-artifact-authority = { workspace = true, features = ["testkit"] }
semio-hub-artifact-creation = { workspace = true }
semio-hub-directory = { workspace = true, features = ["testkit"] }
semio-hub-directory-contract = { workspace = true }
semio-hub-directory-dispatch = { workspace = true }
semio-hub-directory-neo4j = { workspace = true, features = ["testkit"] }
semio-hub-directory-neo4j-rows = { workspace = true }
semio-hub-directory-postgres = { workspace = true, features = ["testkit"] }
semio-hub-directory-service = { workspace = true, features = ["testkit"] }
semio-hub-directory-sqlite = { workspace = true, features = ["testkit"] }
semio-hub-testing = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
db = { path = "../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db", features = ["claimed-backend-laws"] }
serde_json = { workspace = true }
rusqlite = { version = "0.38.0", features = ["bundled"] }
neo4rs = { version = "0.8" }
sqlx_core = { package = "sqlx-core", version = "0.8", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
semio-framework-pack-json = { path = "../../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-async = { workspace = true }
