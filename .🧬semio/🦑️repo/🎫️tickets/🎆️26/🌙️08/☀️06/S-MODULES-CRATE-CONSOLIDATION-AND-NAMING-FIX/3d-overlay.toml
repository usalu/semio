
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ TEMPORARY VERIFICATION OVERLAY (ticket 26/08/06/S-MODULES-CRATE-CONSOLIDATION-AND-NAMING-FIX)
# Makes this manifest its own workspace root while the root workspace is broken /
# while this crate is not yet a member. DELETE before handoff. Copied VERBATIM from
# root Cargo.toml so artifact fingerprints match and the shared target/ stays warm.
# ─────────────────────────────────────────────────────────────────────────────
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust" }

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
