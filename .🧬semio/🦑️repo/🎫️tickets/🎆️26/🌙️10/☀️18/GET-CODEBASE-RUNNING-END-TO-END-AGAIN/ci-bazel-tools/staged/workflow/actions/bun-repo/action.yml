name: bun repo
description: >-
  Starts the neutral build entry on a fresh runner without any manual step: the repository's Node pin, then the pinned
  Bun whose SHA-256 is verified against the hashes below, then a check that both pins equal package.json. After this
  action every build step is `bun repo ...`; nothing else is installed here. The hashes are the official release
  hashes of bun-v1.4.2 (SHASUMS256.txt); bumping Bun means bumping packageManager, `bun-version` and these rows together.

inputs:
  bun-version:
    description: Pinned Bun version; must equal the packageManager pin of package.json.
    required: true
  node-version:
    description: Pinned Node version; must equal engines.node of package.json.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Check that the workflow pins equal the repository pins
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        node -e "const p=require('./package.json');if(p.packageManager!=='bun@'+process.env.BUN_VERSION||p.engines.node!==process.env.NODE_VERSION)throw Error('package.json pins '+p.packageManager+' and node '+p.engines.node+' differ from the workflow pins')"
    - name: Install the pinned Bun and verify its SHA-256 (Linux, macOS)
      if: ${{ runner.os != 'Windows' }}
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset=bun-linux-x64; expected=36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913 ;;
          macOS-ARM64) asset=bun-darwin-aarch64; expected=90987a3a16d7db556d886ac3d551e7b6d3edf0a1cf43acaed622e8676be1d12f ;;
          *) echo "::error::no pinned Bun asset for ${RUNNER_OS} ${RUNNER_ARCH}"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/bun-install"
        mkdir -p "$dir/bin"
        curl --fail --silent --show-error --location --retry 3 --max-time 300 --output "$dir/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${asset}.zip"
        if command -v sha256sum >/dev/null; then actual="$(sha256sum "$dir/bun.zip" | cut -d' ' -f1)"; else actual="$(shasum -a 256 "$dir/bun.zip" | cut -d' ' -f1)"; fi
        test "$actual" = "$expected" || { echo "::error::SHA-256 of ${asset}.zip is $actual, expected $expected"; exit 1; }
        unzip -p "$dir/bun.zip" "${asset}/bun" > "$dir/bin/bun"
        chmod 755 "$dir/bin/bun"
        echo "$dir/bin" >> "$GITHUB_PATH"
    - name: Install the pinned Bun and verify its SHA-256 (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $rows = @{ 'Windows-X64' = @('bun-windows-x64', 'ce4c17497b2f29712a99d3d53f028de28cd42e3bacb8589599e7f000e49b6405') }
        $key = "$($env:RUNNER_OS)-$($env:RUNNER_ARCH)"
        if (-not $rows.ContainsKey($key)) { throw "no pinned Bun asset for $key" }
        $asset = $rows[$key][0]
        $expected = $rows[$key][1]
        $dir = Join-Path $env:RUNNER_TEMP 'bun-install'
        New-Item -ItemType Directory -Force -Path (Join-Path $dir 'bin') | Out-Null
        Invoke-WebRequest -Uri "https://github.com/oven-sh/bun/releases/download/bun-v$($env:BUN_VERSION)/$asset.zip" -OutFile (Join-Path $dir 'bun.zip')
        $actual = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $dir 'bun.zip')).Hash.ToLowerInvariant()
        if ($actual -ne $expected) { throw "SHA-256 of $asset.zip is $actual, expected $expected" }
        Expand-Archive -Path (Join-Path $dir 'bun.zip') -DestinationPath (Join-Path $dir 'x')
        Copy-Item -Path (Join-Path $dir "x\$asset\bun.exe") -Destination (Join-Path $dir 'bin\bun.exe')
        Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dir 'bin') -Encoding utf8
    - name: Check the installed Bun version
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: test "$(bun --version)" = "$BUN_VERSION"
