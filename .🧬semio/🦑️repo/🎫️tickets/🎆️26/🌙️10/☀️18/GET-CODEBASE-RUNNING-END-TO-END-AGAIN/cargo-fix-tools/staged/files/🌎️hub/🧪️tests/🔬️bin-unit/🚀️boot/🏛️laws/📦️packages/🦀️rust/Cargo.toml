[package]
workspace = "../../../../../.."
name = "semio-hub-boot-laws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Boot laws: startup, readiness, hostile routes, check in, inference and canonical pair routes over a real hub router"

[package.metadata.semio]
role = "hub"
id = "hub-boot-laws"

[package.metadata.semio.rust-source-boundary]
maxSourceBytes = 262144
maxSourceFiles = 32
maxActiveLines = 4000

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
integration-fixtures = ["semio-hub-inference/integration-fixtures", "semio-hub-inference-runtime/integration-fixtures", "semio-hub-trusted-catalog/integration-fixtures", "semio-hub-trusted-catalog-contract/integration-fixtures"]
testkit = ["semio-hub-artifact-authority/testkit", "semio-hub-document-routes/testkit", "semio-hub-inference/testkit", "semio-hub-inference-runtime-contract/testkit", "semio-hub-ledgers/testkit", "semio-hub-route-models/testkit", "semio-hub-runtime/testkit", "semio-hub-session-routes/testkit", "semio-hub-state/testkit", "semio-hub-trusted-catalog/testkit", "semio-hub-trusted-catalog-contract/testkit"]

[dependencies]

[dev-dependencies]
semio-hub-artifact-authority = { workspace = true, features = ["testkit"] }
semio-hub-artifact-creation = { workspace = true }
semio-hub-directory = { workspace = true }
semio-hub-directory-contract = { workspace = true }
semio-hub-document-routes = { workspace = true, features = ["testkit"] }
semio-hub-inference = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-inference-ledger = { workspace = true }
semio-hub-inference-runtime = { workspace = true, features = ["integration-fixtures"] }
semio-hub-inference-runtime-contract = { workspace = true, features = ["testkit"] }
semio-hub-lag-rebootstrap = { workspace = true }
semio-hub-ledgers = { workspace = true, features = ["testkit"] }
semio-hub-native-openable = { workspace = true }
semio-hub-refusal = { workspace = true }
semio-hub-route-models = { workspace = true, features = ["testkit"] }
semio-hub-route-testkit = { workspace = true }
semio-hub-runtime = { workspace = true, features = ["testkit"] }
semio-hub-session-routes = { workspace = true, features = ["testkit"] }
semio-hub-state = { workspace = true, features = ["testkit"] }
semio-hub-testing = { workspace = true }
semio-hub-trusted-catalog = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-trusted-catalog-contract = { workspace = true, features = ["testkit", "integration-fixtures"] }
semio-hub-trusted-catalog-fixtures = { workspace = true }
semio-s-artifact-gis-gismap = { workspace = true }
semio-framework-schema = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
directory = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["durable-group-testing"] }
db = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🛢️db/📦️packages/🦀️rust", package = "semio-framework-os-kernel-db", features = ["claimed-backend-laws"] }
serde_json = { workspace = true }
semio-framework-job = { workspace = true }
protocol = { path = "../../../../../../../🧰️framework/🔨️modules/📡️replication/📦️packages/🦀️rust", package = "semio-framework-replication" }
semio-hub-gis = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-hash = { path = "../../../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
axum = { version = "0.8", features = ["ws"] }
semio-framework-trace = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
