name: semio-rbe

x-storage-image: &storage-image ghcr.io/buildbarn/bb-storage:20260906T092937Z-ae61334@sha256:05760070ed561be9090e9483c6ee0cf55e7f806cf7c28752f1301f31015002c7
x-scheduler-image: &scheduler-image ghcr.io/buildbarn/bb-scheduler:20261008T101024Z-582d07f@sha256:3e61fd8824706c174b0c7e87ca02b5c1ae99ba27a1f586b2e1b3a0af909bb491
x-worker-image: &worker-image ghcr.io/buildbarn/bb-worker:20261008T101024Z-582d07f@sha256:9188ee7ba21f78ecdfd8ee7304dba555af4bec6cc00b2fe12d11a31a0b7005c7
x-installer-image: &installer-image ghcr.io/buildbarn/bb-runner-installer:20261008T101024Z-582d07f@sha256:50f1936a10d5eb3b100cb99ea77a50ccaa0e0b8d44f682f79254c555fbe668c7
x-runner-image: &runner-image docker.io/library/ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956

services:
  storage:
    image: *storage-image
    command: ["/config/storage.json"]
    expose: ["8981"]
    volumes:
      - ./config:/config:ro
      - storage:/storage
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    image: *storage-image
    command: ["/config/frontend.json"]
    ports:
      - "127.0.0.1:${SEMIO_RBE_PORT:-8980}:8980"
      - "127.0.0.1:${SEMIO_RBE_DIAGNOSTICS_PORT:-8981}:80"
    volumes:
      - ./config:/config:ro
    depends_on: [storage, scheduler]

  scheduler:
    image: *scheduler-image
    command: ["/config/scheduler.json"]
    expose: ["8982", "8983", "8984"]
    volumes:
      - ./config:/config:ro
    depends_on: [storage]

  init:
    image: *runner-image
    platform: ${SEMIO_RBE_DOCKER_PLATFORM:-linux/arm64}
    command: ["sh", "-c", "mkdir -p /storage/cas /storage/ac /worker/build /worker/cache && chmod 0777 /worker/build && chmod 0700 /worker/cache"]
    restart: "no"
    network_mode: none
    volumes:
      - storage:/storage
      - worker:/worker

  runner-installer:
    image: *installer-image
    volumes:
      - bb:/bb

  worker:
    image: *worker-image
    command: ["/config/worker-${SEMIO_RBE_PLATFORM:-linux-arm64}.json"]
    volumes:
      - ./config:/config:ro
      - worker:/worker
    depends_on:
      init:
        condition: service_completed_successfully
      scheduler:
        condition: service_started
      storage:
        condition: service_started

  runner:
    image: *runner-image
    platform: ${SEMIO_RBE_DOCKER_PLATFORM:-linux/arm64}
    command: ["sh", "-c", "while ! test -f /bb/installed; do sleep 1; done; exec /bb/bb_runner /config/runner.json"]
    network_mode: none
    mem_limit: 4g
    cpus: 4
    volumes:
      - ./config:/config:ro
      - bb:/bb:ro
      - worker:/worker
    depends_on:
      runner-installer:
        condition: service_started
      init:
        condition: service_completed_successfully

volumes:
  storage:
  worker:
  bb:
