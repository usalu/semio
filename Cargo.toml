    "✏️s/🔌️plugin/📕️norm/🎛️app/📔️vdi3805/🔨️module/📡️protocol/⚡️implementation/🦀️rust",
    "✏️s/🔌️plugin/📕️norm/🎛️app/📔️vdi3805/🔨️module/🖱️ui/⚡️implementation/🦀️rust",
    "✏️s/🔌️plugin/📕️norm/🛂️manifest/🗿️artifact/⚡️implementation/🦀️rust",
    "✏️s/🔌️plugin/🔋️energy/🔨️module/⚙️engine/⚡️implementation/🦀️rust",
    "✏️s/🔌️plugin/🏛️architect/🛂️manifest/🗿️artifact/⚡️implementation/🦀️rust",
