# 📦️ W0 mechanism prep (CRATE-CONSOLIDATION-AND-PLUGIN-TAXONOMY-RESTRUCTURE, ticket
# 26/08/05/ROOT-WORKSPACE-DEPENDENCIES-AND-REGISTRAR-PROTOCOL). Purely additive: no
# existing member below adopts `.workspace = true` yet, so this table changes nothing
# about today's build. It exists so later waves can opt a crate in with one line, or
# repoint a merged/moved crate's consumers by editing exactly one line here.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
semio-framework-math = { path = "🧰️framework/🔨️modules/🧮️math/📦️packages/🦀️rust" }
