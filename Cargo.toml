[workspace]
members = [
    "framework/core/rs",
    "framework/hash/rs",
    "framework/plugin/rs",
    "framework/product/os/core/rs",
    "puzzle/plugin/rs",
    "puzzle/2d/rs",
    "puzzle/3d/rs",
    "puzzle/5d/rs",
    "vcs/rs",
    "protocol/rs",
    "protocol/plugin/rs",
    "protocol/module/procedural/rs",
    "infinite/board/port/directed/normal/rs",
    "infinite/board/port/directed/rs",
    "infinite/board/port/directed/dag/rs",
    "infinite/board/port/directed/dag/plugin/rs",
    "infinite/board/port/undirected/rs",
    "infinite/board/normal/directed/rs",
    "infinite/board/normal/undirected/rs",
    "infinite/board/rs",
    "infinite/board/port/rs",
    "infinite/cavas/rs",
    "mathematical/graph/rs",
    "mathematical/graph/drawing/rs",
    "mathematical/graph/dsl/rs",
    "mathematical/graph/manifest/rs",
    "mathematical/geometry/rs",
    "neural/engine/rs",
    "ui/styling/rs",
    "reasoning/mindmap/rs",
    "gis/2d/rs",
    "kernel/3d/brep/rs",
    "kernel/3d/brep/engine/rs",
]

resolver = "2"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
strip = "debuginfo"
