# 🧮️ The owned wasm interpreter (`semio-framework-plugin-host::interpreter`) runs every trusted-catalog
# verification `codec.pack-schema-hash` on the hub's startup path. At `opt-level = 0` a debug hub spent
# >11 min of one core interpreting writer/draw/puzzle during catalog load and the candidate readiness
# wait gave up (ticket 26/09/23 W1 §4.6, sampled: 100 % in `CoreInstance::execute_machine`).
[profile.dev.package.semio-framework-plugin-host]
opt-level = 3

# 🔐️ The repository's own SHA-256 carries every hub credential check: a sign-in derives PBKDF2-HMAC-SHA256
# at 210 000 iterations. At `opt-level = 0` one derivation took ~2 s on an idle debug hub and 8.5 s on hub
# 7800 under load (ticket 26/09/23 H9 session 12), all inside the compression function; optimizing this
# one small crate makes a dev hub's sign-in cost what a release hub's does.
[profile.dev.package.semio-framework-hash]
opt-level = 3

# 🛡️ WASI component links alone select this mitigation for rust-lld's ElemSection crash.
# Native dev retains Cargo's parallel codegen policy; publication stays wasm-release.
[profile.wasm-dev]
inherits = "dev"
codegen-units = 1
# 🧾️ A component's described bytes must be its shipped bytes: `describe` and `component-dev` link the same
# `cargo rustc --crate-type cdylib` unit, and `incremental` is part of that unit's profile identity, so an
# inherited `incremental = true` split it by the caller's `CARGO_INCREMENTAL` into two compiles with two
# different wasm hashes (ticket 26/09/23 W1: descriptor `ce48…`/`2a5c…` vs staged `a740…`).
incremental = false

# 🔐️ The dev-profile hash optimization above is for native hosts' credential checks; guests keep their
# own `wasm-dev` code for this crate, so a component's bytes do not change with a host-side decision.
[profile.wasm-dev.package.semio-framework-hash]
opt-level = 0

# 🎚️ The plugin guest must meet the framework's 8 ms interactive-step contract even in the dev
# profile: at `opt-level = 0` a lowpoly render turn tessellates its seeded mesh in 10-11.5 ms and
# the runtime traps it with `plugin.internal.interactive-ceiling`, so the window renders a fault
# instead of geometry. Scoped to this package rather than raised on the whole profile because the
# io layer (`semio-s-plugin-stdio`) is not on the render path and is far more expensive to compile.
[profile.wasm-dev.package.semio-s-artifact-lowpoly-lowpoly]
opt-level = 2

# 🎚️ Same interactive-step contract as lowpoly above, measured on puzzle3d: at `opt-level = 0` a
# puzzle3d turn overran the ceiling at 9100us against the 8000us budget and the runtime trapped it
# with `plugin.internal.interactive-ceiling`, so both windows rendered a fault instead of the scene.
[profile.wasm-dev.package.semio-s-artifact-puzzle-3d]
opt-level = 2

# 🎚️ Same interactive-step contract as lowpoly/puzzle3d above, measured on the procedural
# generation3d flow chain (ticket 26/09/09/PROCEDURAL-3D-END-TO-END,
# `📓️audit-guest-tick-cost-2026-09-12.md`): `flowEvalTick` is a SYNCHRONOUS, non-preemptible guest
# step, and in the browser each of its five hops sat in one silent reactor turn for 3.5-18.4 s
# against the same 8 ms budget, converging the example in ~130 s. The identical code path measures
# 2.3-7.4 ms NATIVELY at `opt-level = 0`, so the overrun is the wasm baseline tier executing
# unoptimized code, not the algorithm. The seven packages below are exactly the crates a
# `flowEvalTick` hop executes, read off `cargo tree -p semio-s-plugin-procedural
# --target wasm32-wasip2 -e normal`: the plugin's own tick/preview payload, the flow host plus its
# BREP kernel, the topological dag walk, the per-node value model and its JSON codec, and the two
# extension components that answer `evaluate`/`tessellate`. `2` (not `1`) matches the two
# precedents above rather than introducing a third tuning value.

# 🎚️ Hosts `flowEvalTick`, `FlowEvalSession::tick`, the preview payload and the tessellation cache.
[profile.wasm-dev.package.semio-s-plugin-procedural]
opt-level = 2

# 🎚️ `FlowHost::evaluate_step` and `brep_geometry::{evaluate_invoke_json, tessellate_step_envelope_json}`
# — the solid-modeling kernel every flow-domain plugin shares.
[profile.wasm-dev.package.semio-framework-os-flow]
opt-level = 2

