[package]
name = "flow-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:flow"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "flow"
ports = { react = 6016, wgpu = 6116 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
flow_core = { path = "../../core/rs" }
protocol = { path = "../../../protocol/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
vcs = { path = "../../../vcs/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

