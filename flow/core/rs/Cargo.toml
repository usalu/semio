[package]
name = "flow_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../vcs/rs" }
dsl = { path = "../../../dsl/rs" }
flow_module_brep = { path = "../../module/brep/rs", default-features = false }
flow_module_draw = { path = "../../module/draw/rs", default-features = false }
flow_module_bim = { path = "../../module/bim/rs", default-features = false }
flow_module_core = { path = "../../module/core/rs", default-features = false }
flow_module_dictionary = { path = "../../module/dictionary/rs", default-features = false }
flow_module_list = { path = "../../module/list/rs", default-features = false }
flow_module_logic = { path = "../../module/logic/rs", default-features = false }
flow_module_math = { path = "../../module/math/rs", default-features = false }
flow_module_text = { path = "../../module/text/rs", default-features = false }
kernel_3d_engine = { path = "../../../kernel/3d/brep/engine/rs", features = ["parallel"] }
semio-framework-core = { path = "../../../framework/core/rs" }
neural_engine = { path = "../../../neural/engine/rs", features = ["parallel"] }
neural_dag = { path = "../../../neural/dag/rs" }
mathematical_graph_manifest = { path = "../../../mathematical/graph/manifest/rs" }
infinite_board_port_directed_dag = { path = "../../../infinite/board/port/directed/dag/rs" }
infinite_cavas = { path = "../../../infinite/cavas/rs" }
ui_styling = { path = "../../../ui/styling/rs" }
playbook = { path = "../../../playbook/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
