[package]
name = "flow_module_brep"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[features]
default = ["standalone-wasm"]
standalone-wasm = ["dep:wasm-bindgen"]

[dependencies]
flow_module_wasm = { path = "../../wasm/rs" }
kernel_3d_brepkit = { path = "../../../../kernel/3d/brep/rs" }
kernel_3d_engine = { path = "../../../../kernel/3d/brep/engine/rs" }
neural_engine = { path = "../../../../neural/engine/rs" }
semio-framework-core = { path = "../../../../framework/core/rs" }
base64 = "0.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.77"
wasm-bindgen = { version = "0.2.106", optional = true }
