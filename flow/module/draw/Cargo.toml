[package]
name = "flow_module_draw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[features]
default = ["standalone-wasm"]
standalone-wasm = ["dep:wasm-bindgen"]

[dependencies]
flow_module_wasm = { path = "../wasm" }
kernel_2d_engine = { path = "../../../kernel/2d/engine" }
kernel_2d_rs = { path = "../../../kernel/2d/rs" }
neural_engine = { path = "../../../neural/engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2.106", optional = true }
