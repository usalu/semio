[package]
name = "flow_module_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[features]
default = ["standalone-wasm"]
standalone-wasm = ["dep:wasm-bindgen"]

[dependencies]
flow_module_wasm = { path = "../../wasm/rs" }
neural_engine = { path = "../../../../neural/engine/rs", features = ["parallel"] }
serde_json = "1.0.140"
wasm-bindgen = { version = "0.2.106", optional = true }
