[package]
name = "flow-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:flow"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "flow"
ports = { react = 6016, wgpu = 6116 }
engines = ["flow/core/rs"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
flow_core = { path = "../../core/rs" }
playbook = { path = "../../../playbook/rs" }
semio-framework-program = { path = "../../../framework/program/rs" }
vcs = { path = "../../../vcs/rs" }
store = { path = "../../../store/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

