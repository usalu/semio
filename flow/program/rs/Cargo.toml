[package]
name = "flow-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:flow"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "flow"
ports = { react = 6016, wgpu = 6116 }
engines = ["s/kernel/flow/core/rs"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
flow_core = { path = "../../../s/kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
playbook = { path = "../../../s/kernel/playbook/rs", package = "semio-s-kernel-playbook" }
semio-framework-program = { path = "../../../framework/program/rs" }
vcs = { path = "../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

