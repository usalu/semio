# Codex MCP Server Configuration
# See: https://github.com/openai/codex/blob/main/docs/config.md

[mcp_servers.playwright-test]
command = "npx"
args = ["playwright", "run-test-mcp-server"]
enabled = true

[mcp_servers.repo]
command = "./repo/cli/cli"
args = ["mcp"]
enabled = true

[mcp_servers.semio]
command = "uv"
args = ["--directory", "semio/engine", "run", "engine.py", "--mcp-stdio"]
enabled = true

[mcp_servers.coda]
command = "uv"
args = ["--directory", "coda/py", "run", "coda.py", "--mcp-stdio"]
enabled = true
