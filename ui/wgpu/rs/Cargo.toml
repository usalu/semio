[package]
name = "ui_wgpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Business-logic-free wgpu UI toolkit for browser WASM renderers"

[lib]
path = "lib.rs"

[dependencies]
ui_styling = { path = "../../styling/rs" }
kernel_3d_scene = { path = "../../../kernel/3d/scene/rs" }
fontdue = "0.9.3"
bytemuck = { version = "1.24.0", features = ["derive"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
wgpu = { version = "27.0.1", default-features = false, features = ["wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["webgpu", "wgsl"] }
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = [
    "Window",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["metal", "vulkan", "dx12", "wgsl"] }
pollster = "0.4.0"
