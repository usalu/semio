[package]
name = "s-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:s"

[package.metadata.semio]
capabilities = ["localBackboneStorage"]
host = { landing = "home", studio = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
ports = { react = 6070, wgpu = 6066 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-program = { path = "../../../framework/program/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../kernel/protocol/rs", package = "semio-s-kernel-protocol" }
dsl = { path = "../../kernel/dsl/rs", package = "semio-s-kernel-dsl" }
infinite_board_port_directed_dag = { path = "../../kernel/infinite/board/port/directed/dag/rs", package = "semio-s-kernel-infinite-board-port-directed-dag" }
base64 = "0.22"
