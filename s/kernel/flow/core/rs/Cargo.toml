[package]
name = "semio-s-kernel-flow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "flow_core"
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
dsl = { path = "../../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
flow_module_brep = { path = "../../module/brep/rs", default-features = false, package = "semio-s-kernel-flow-module-brep" }
flow_module_draw = { path = "../../module/draw/rs", default-features = false, package = "semio-s-kernel-flow-module-draw" }
flow_module_bim = { path = "../../module/bim/rs", default-features = false, package = "semio-s-kernel-flow-module-bim" }
flow_module_core = { path = "../../module/core/rs", default-features = false, package = "semio-s-kernel-flow-module-core" }
flow_module_dictionary = { path = "../../module/dictionary/rs", default-features = false, package = "semio-s-kernel-flow-module-dictionary" }
flow_module_list = { path = "../../module/list/rs", default-features = false, package = "semio-s-kernel-flow-module-list" }
flow_module_logic = { path = "../../module/logic/rs", default-features = false, package = "semio-s-kernel-flow-module-logic" }
flow_module_math = { path = "../../module/math/rs", default-features = false, package = "semio-s-kernel-flow-module-math" }
flow_module_text = { path = "../../module/text/rs", default-features = false, package = "semio-s-kernel-flow-module-text" }
kernel_3d_engine = { path = "../../../geometry/3d/brep/engine/rs", features = ["parallel"], package = "semio-s-kernel-geometry-3d-brep-engine" }
semio-framework-core = { path = "../../../../../framework/core/rs" }
neural_engine = { path = "../../../../../framework/kernel/neural/engine/rs", features = ["parallel"], package = "semio-framework-kernel-neural-engine" }
neural_dag = { path = "../../../../../framework/kernel/neural/dag/rs", package = "semio-framework-kernel-neural-dag" }
mathematical_graph_manifest = { path = "../../../../../framework/kernel/mathematical/graph/manifest/rs", package = "semio-framework-kernel-mathematical-graph-manifest" }
infinite_board_port_directed_dag = { path = "../../../../../framework/kernel/infinite/board/port/directed/dag/rs", package = "semio-framework-kernel-infinite-board-port-directed-dag" }
infinite_cavas = { path = "../../../../../framework/kernel/infinite/canvas/rs", package = "semio-framework-kernel-infinite-canvas" }
ui_styling = { path = "../../../../../ui/styling/rs" }
playbook = { path = "../../../playbook/rs", package = "semio-s-kernel-playbook" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
