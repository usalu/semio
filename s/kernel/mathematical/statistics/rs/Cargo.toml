[package]
name = "semio-s-kernel-mathematical-statistics"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_algebra = { path = "../../algebra/rs", package = "semio-s-kernel-mathematical-algebra" }
mathematical_probability = { path = "../../probability/rs", package = "semio-s-kernel-mathematical-probability" }
mathematical_tabular = { path = "../../tabular/rs", package = "semio-s-kernel-mathematical-tabular" }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
