[package]
name = "semio-s-kernel-playbook"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Generic strict-list, module-based visual code/data-generation editor domain model — typed VCS on `vcs`"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "playbook"
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
dsl = { path = "../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
ui_wgpu = { path = "../../../../ui/wgpu/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
