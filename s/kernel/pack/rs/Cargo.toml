[package]
name = "semio-s-kernel-pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Pack binary document format facade — re-exports the core/format/value/io/async/http/index layers"


[lints]
workspace = true
[lib]
name = "pack"
path = "lib.rs"

[dependencies]
pack_core = { path = "../core/rs", package = "semio-s-kernel-pack-core" }
pack_format = { path = "../format/rs", package = "semio-s-kernel-pack-format" }
pack_value = { path = "../value/rs", package = "semio-s-kernel-pack-value" }
pack_io = { path = "../io/rs", package = "semio-s-kernel-pack-io" }
pack_async = { path = "../async/rs", package = "semio-s-kernel-pack-async" }
pack_http = { path = "../http/rs", package = "semio-s-kernel-pack-http" }
pack_index = { path = "../index/rs", package = "semio-s-kernel-pack-index" }
dsl_schema = { path = "../../../../framework/kernel/dsl/schema/rs", package = "semio-framework-kernel-dsl-schema" }

[features]
default = ["deflate"]
deflate = ["pack_format/deflate"]
ureq = ["pack_http/ureq"]
