[package]
name = "semio-s-kernel-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local-first, non-blocking, client-side, in-memory document store — DocumentStore/Backbone/BlobStore/Studio over vcs's version-graph algebra"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "store"
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
dsl_core = { path = "../../../../framework/kernel/dsl/core/rs", package = "semio-framework-kernel-dsl-core" }
dsl = { path = "../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
pack = { path = "../../pack/rs", package = "semio-s-kernel-pack" }
semio-framework-core = { path = "../../../../framework/core/rs" }
protocol = { path = "../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
vcs = { path = "../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
blake3 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.83", features = ["Window", "Storage"] }

[dev-dependencies]
tempfile = "3.20.0"
