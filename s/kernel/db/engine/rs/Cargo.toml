[package]
name = "semio-s-kernel-db-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db engine — Database supervisor, catalog actor, open/recovery, document lifecycle, VersionGraph impl over vcs, sagas, migration"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-s-kernel-db-core" }
db_actor = { path = "../../actor/rs", package = "semio-s-kernel-db-actor" }
db_document = { path = "../../document/rs", package = "semio-s-kernel-db-document" }
db_storage = { path = "../../storage/rs", package = "semio-s-kernel-db-storage" }
db_wal = { path = "../../wal/rs", package = "semio-s-kernel-db-wal" }
db_compact = { path = "../../compact/rs", package = "semio-s-kernel-db-compact" }
db_sync = { path = "../../sync/rs", package = "semio-s-kernel-db-sync" }
db_security = { path = "../../security/rs", package = "semio-s-kernel-db-security" }
db_observe = { path = "../../observe/rs", package = "semio-s-kernel-db-observe" }
db_cluster = { path = "../../cluster/rs", package = "semio-s-kernel-db-cluster" }
protocol = { path = "../../../protocol/rs", package = "semio-s-kernel-protocol" }
vcs = { path = "../../../vcs/rs", optional = true, package = "semio-s-kernel-vcs" }
store = { path = "../../../store/rs", optional = true, package = "semio-s-kernel-store" }
# 🎯 Genuinely missing additions (not in the stub's dependency list), noted per the wave's
# instructions: `pack_core` because the frozen `CommandReceipt.state_hash` field is typed
# `pack_core::ContentHash` verbatim in the contract, and this crate names that path directly
# (not just via `db_document`/`db_wal`'s own re-exports); `serde`+`serde_json` because this crate's
# catalog root encoding and its `vcs` feature's schema-erased `HashProjection`/`HashOperation`
# (see `//#region 🔖VersionGraph`) need `derive(Serialize, Deserialize)` directly.
pack_core = { path = "../../../pack/core/rs", package = "semio-s-kernel-pack-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["vcs"]
vcs = ["dep:vcs", "dep:store"]
tokio = []

