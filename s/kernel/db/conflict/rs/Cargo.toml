[package]
name = "semio-s-kernel-db-conflict"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db conflict detection — touched-region intersection, bloom filters, command-kind matrix, protocol-declared resolution"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-s-kernel-db-core" }
db_state = { path = "../../state/rs", package = "semio-s-kernel-db-state" }
protocol = { path = "../../../protocol/rs", package = "semio-s-kernel-protocol" }
