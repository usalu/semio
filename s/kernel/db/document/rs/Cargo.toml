[package]
name = "semio-s-kernel-db-document"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db document authority actor — command pipeline, materialize, transactions/batches, inverse undo, effect outbox, live-query notify"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-s-kernel-db-core" }
db_actor = { path = "../../actor/rs", package = "semio-s-kernel-db-actor" }
db_state = { path = "../../state/rs", package = "semio-s-kernel-db-state" }
db_wal = { path = "../../wal/rs", package = "semio-s-kernel-db-wal" }
db_storage = { path = "../../storage/rs", package = "semio-s-kernel-db-storage" }
db_snapshot = { path = "../../snapshot/rs", package = "semio-s-kernel-db-snapshot" }
db_index = { path = "../../index/rs", package = "semio-s-kernel-db-index" }
db_conflict = { path = "../../conflict/rs", package = "semio-s-kernel-db-conflict" }
db_projection = { path = "../../projection/rs", package = "semio-s-kernel-db-projection" }
db_query = { path = "../../query/rs", package = "semio-s-kernel-db-query" }
db_preview = { path = "../../preview/rs", package = "semio-s-kernel-db-preview" }
db_security = { path = "../../security/rs", package = "semio-s-kernel-db-security" }
protocol = { path = "../../../protocol/rs", package = "semio-s-kernel-protocol" }
pack = { path = "../../../pack/rs", package = "semio-s-kernel-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
