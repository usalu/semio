[package]
name = "semio-s-kernel-db-state"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db persistent diff-state overlays — PMap/PVec/PText/PTree/PGraph, content-addressed pages, touched-region descriptors"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db_core = { path = "../../core/rs", package = "semio-s-kernel-db-core" }
pack_core = { path = "../../../pack/core/rs", package = "semio-s-kernel-pack-core" }
blake3 = "1"
