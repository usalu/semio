[package]
name = "semio-s-kernel-db-storage-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db storage backend over postgres"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
db_core = { path = "../../../core/rs", package = "semio-s-kernel-db-core" }
db_storage = { path = "../../rs", package = "semio-s-kernel-db-storage" }
pack = { path = "../../../../pack/rs", package = "semio-s-kernel-pack" }
blake3 = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
