[package]
name = "semio-s-kernel-infinite-board-port-directed-dag"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../../../vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../../../../store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../../../protocol/rs", package = "semio-s-kernel-protocol" }
dsl = { path = "../../../../../../dsl/rs", package = "semio-s-kernel-dsl" }
ui_styling = { path = "../../../../../../../../ui/styling/rs" }
infinite_board_port_directed = { path = "../../rs", package = "semio-s-kernel-infinite-board-port-directed" }
mathematical_graph_manifest = { path = "../../../../../../mathematical/graph/manifest/rs", package = "semio-s-kernel-mathematical-graph-manifest" }
mathematical_graph_dsl = { path = "../../../../../../mathematical/graph/dsl/rs", package = "semio-s-kernel-mathematical-graph-dsl" }
mathematical_graph_drawing = { path = "../../../../../../mathematical/graph/drawing/rs", package = "semio-s-kernel-mathematical-graph-drawing" }
mathematical_graph = { path = "../../../../../../mathematical/graph/rs", package = "semio-s-kernel-mathematical-graph" }
infinite_cavas = { path = "../../../../../canvas/rs", package = "semio-s-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
