[package]
name = "semio-s-kernel-infinite-board-port-directed"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
ui_styling = { path = "../../../../../../../ui/styling/rs" }
infinite_board = { path = "../../../rs", package = "semio-s-kernel-infinite-board" }
infinite_board_port = { path = "../../rs", package = "semio-s-kernel-infinite-board-port" }
infinite_board_normal_undirected = { path = "../../../normal/undirected/rs", package = "semio-s-kernel-infinite-board-normal-undirected" }
mathematical_graph = { path = "../../../../../mathematical/graph/rs", package = "semio-s-kernel-mathematical-graph" }
infinite_cavas = { path = "../../../../canvas/rs", package = "semio-s-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
