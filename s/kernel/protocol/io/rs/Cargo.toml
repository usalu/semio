[package]
name = "semio-s-kernel-protocol-io"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol native append-only file lifecycle — create/open/resume, sidecars, recovery, tailing, compaction"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
protocol_core = { path = "../../core/rs", package = "semio-s-kernel-protocol-core" }
protocol_format = { path = "../../format/rs", package = "semio-s-kernel-protocol-format" }
protocol_history = { path = "../../history/rs", package = "semio-s-kernel-protocol-history" }
pack_core = { path = "../../../pack/core/rs", package = "semio-s-kernel-pack-core" }
pack_io = { path = "../../../pack/io/rs", package = "semio-s-kernel-pack-io" }
