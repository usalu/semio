[package]
name = "semio-s-kernel-protocol-history"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol history log — typed record model, ops-text grammar twin, per-kind payload codecs, streaming append/scan"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
protocol_core = { path = "../../core/rs", package = "semio-s-kernel-protocol-core" }
protocol_format = { path = "../../format/rs", package = "semio-s-kernel-protocol-format" }
pack_core = { path = "../../../pack/core/rs", package = "semio-s-kernel-pack-core" }
dsl_core = { path = "../../../dsl/core/rs", package = "semio-s-kernel-dsl-core" }
dsl_schema = { path = "../../../dsl/schema/rs", package = "semio-s-kernel-dsl-schema" }
