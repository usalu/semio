[package]
name = "sourcing-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:sourcing"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "sourcing"
app = "sourcing-curate"
aliases = ["curate"]
ports = { react = 6081, wgpu = 6181 }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
sourcing = { path = "../../app/curate/rs", package = "semio-s-app-sourcing-curate" }
sourcing_ui = { path = "../../app/curate/ui/rs", package = "semio-s-app-sourcing-curate-ui" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
