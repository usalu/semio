[package]
name = "semio-s-app-sourcing-curate-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Sourcing curate app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
sourcing = { path = "../../rs", package = "semio-s-app-sourcing-curate" }
sourcing_engine = { path = "../../engine/rs", package = "semio-s-app-sourcing-curate-engine" }
sourcing_op = { path = "../../op/rs", package = "semio-s-app-sourcing-curate-op" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../framework/rs", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
