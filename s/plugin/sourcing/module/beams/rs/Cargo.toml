[package]
name = "sourcing-module-beams"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:sourcing-module-beams"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
sourcing_curate = { path = "../../../app/curate/engine/rs", package = "semio-s-app-sourcing-curate-engine" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../../../../framework/core/rs" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
