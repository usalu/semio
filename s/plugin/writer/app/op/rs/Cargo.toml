[package]
name = "semio-s-app-writer-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Writer app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
writer = { path = "../../rs", package = "semio-s-app-writer" }
dsl = { path = "../../../../../../framework/os/kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
writer_engine = { path = "../../engine/rs", package = "semio-s-app-writer-engine" }
