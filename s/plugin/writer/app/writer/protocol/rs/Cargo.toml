[package]
name = "semio-s-app-writer-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Writer app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
writer = { path = "../../rs", package = "semio-s-app-writer" }
writer_op = { path = "../../op/rs", package = "semio-s-app-writer-op" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }

[dev-dependencies]
writer_engine = { path = "../../engine/rs", package = "semio-s-app-writer-engine" }
