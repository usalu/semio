[package]
name = "semio-s-app-writer-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Writer app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
writer = { path = "../../rs", package = "semio-s-app-writer" }
writer_dsl = { path = "../../dsl/rs", package = "semio-s-app-writer-dsl" }
store = { path = "../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
trinity_jack = { path = "../../../../trinity/jack/core/rs", package = "trinity_jack" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
regex = "1.11.1"
