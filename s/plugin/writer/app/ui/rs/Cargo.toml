[package]
name = "semio-s-app-writer-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Writer app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
writer = { path = "../../rs", package = "semio-s-app-writer" }
writer_engine = { path = "../../engine/rs", package = "semio-s-app-writer-engine" }
writer_op = { path = "../../op/rs", package = "semio-s-app-writer-op" }
trinity_jack = { path = "../../../../trinity/jack/core/rs", package = "trinity_jack" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
