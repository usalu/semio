[package]
name = "writer-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:writer"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "writer"
ports = { react = 6062, wgpu = 6162 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"], package = "semio-framework-plugin" }
framework_editor = { path = "../../../../../../framework/module/editor/rs", package = "framework_editor" }
writer = { path = "../../../app/writer/rs", package = "semio-s-app-writer" }
writer_op = { path = "../../../app/writer/op/rs", package = "semio-s-app-writer-op" }
writer_ui = { path = "../../../app/writer/ui/rs", package = "semio-s-app-writer-ui" }
store = { path = "../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
