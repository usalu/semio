[package]
name = "imperative-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:imperative"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "imperative"
ports = { react = 6076, wgpu = 6176 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
imperative_core = { path = "../../core/rs", package = "imperative_core" }
imperative_engine = { path = "../../engine/rs", package = "imperative_engine" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }

