[package]
name = "semio-s-app-imperative-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Imperative app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
imperative = { path = "../../rs", package = "semio-s-app-imperative" }
dsl = { path = "../../../../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
imperative_engine = { path = "../../engine/rs", package = "semio-s-app-imperative-engine" }
vcs = { path = "../../../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
neural_engine = { path = "../../../../../../../framework/kernel/neural/engine/rs", package = "semio-framework-kernel-neural-engine" }
