[package]
name = "semio-s-app-imperative-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Imperative app - headless compute (constitutional: engine)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
imperative = { path = "../../rs", package = "semio-s-app-imperative" }
imperative_engine = { path = "../../../../../../module/imperative/rs", package = "imperative_engine" }
imperative_dsl = { path = "../../dsl/rs", package = "semio-s-app-imperative-dsl" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

[dev-dependencies]
neural_engine = { path = "../../../../../../../framework/product/os/module/neural/engine/rs", package = "semio-framework-os-kernel-neural-engine" }
