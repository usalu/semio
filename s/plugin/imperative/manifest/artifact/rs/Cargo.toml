[package]
name = "imperative-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:imperative"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "imperative"
ports = { react = 6076, wgpu = 6176 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
imperative_ui = { path = "../../../app/imperative/ui/rs", package = "semio-s-app-imperative-ui" }
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"], package = "semio-framework-plugin" }
