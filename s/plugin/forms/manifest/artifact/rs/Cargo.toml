[package]
name = "forms-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:forms"

[package.metadata.semio]
consumes = ["forms.questionKind"]

[[package.metadata.semio.playground]]
variant = "forms"
ports = { react = 6058, wgpu = 6158 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
forms = { path = "../../../app/forms/rs", package = "semio-s-app-forms" }
forms_ui = { path = "../../../app/forms/ui/rs", package = "semio-s-app-forms-ui" }
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"], package = "semio-framework-plugin" }
