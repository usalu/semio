[package]
name = "forms"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Forms document domain — a forms-flavored instance of the generic `playbook` list/block model"


[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
playbook = { path = "../../../kernel/playbook/rs", package = "semio-s-kernel-playbook" }
vcs = { path = "../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
