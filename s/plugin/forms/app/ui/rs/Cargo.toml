[package]
name = "semio-s-app-forms-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Forms app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
forms = { path = "../../rs", package = "semio-s-app-forms" }
forms_dsl = { path = "../../dsl/rs", package = "semio-s-app-forms-dsl" }
forms_engine = { path = "../../engine/rs", package = "semio-s-app-forms-engine" }
forms_op = { path = "../../op/rs", package = "semio-s-app-forms-op" }
playbook = { path = "../../../../../../framework/os/kernel/workflow/rs", package = "semio-framework-os-kernel-workflow" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
