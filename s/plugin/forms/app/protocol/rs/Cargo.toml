[package]
name = "semio-s-app-forms-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Forms app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
forms = { path = "../../rs", package = "semio-s-app-forms" }
forms_op = { path = "../../op/rs", package = "semio-s-app-forms-op" }
playbook = { path = "../../../../../../framework/os/kernel/workflow/rs", package = "semio-framework-os-kernel-workflow" }
protocol = { path = "../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }

[dev-dependencies]
forms_engine = { path = "../../engine/rs", package = "semio-s-app-forms-engine" }
