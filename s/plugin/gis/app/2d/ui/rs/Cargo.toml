[package]
name = "semio-s-app-gis-2d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "GIS 2D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
gis2d = { path = "../../rs", package = "semio-s-app-gis-2d" }
gis2d_engine = { path = "../../engine/rs", package = "semio-s-app-gis-2d-engine" }
gis2d_op = { path = "../../op/rs", package = "semio-s-app-gis-2d-op" }
protocol = { path = "../../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
framework_surface_tiled_map = { path = "../../../../../../../framework/surface/tiled-map/rs" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
