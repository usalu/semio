[package]
name = "semio-s-app-gis-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "GIS 3D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
gis3d = { path = "../../rs", package = "semio-s-app-gis-3d" }
gis3d_dsl = { path = "../../dsl/rs", package = "semio-s-app-gis-3d-dsl" }
gis3d_engine = { path = "../../engine/rs", package = "semio-s-app-gis-3d-engine" }
gis3d_op = { path = "../../op/rs", package = "semio-s-app-gis-3d-op" }
framework_surface_terrain = { path = "../../../../../../../framework/surface/terrain/rs" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
