[package]
name = "semio-s-app-shooting-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Shooting app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
shooting = { path = "../../rs", package = "semio-s-app-shooting" }
shooting_dsl = { path = "../../dsl/rs", package = "semio-s-app-shooting-dsl" }
store = { path = "../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
semio-framework-os = { path = "../../../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
