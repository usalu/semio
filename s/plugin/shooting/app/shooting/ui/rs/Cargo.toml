[package]
name = "semio-s-app-shooting-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Shooting app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
shooting = { path = "../../rs", package = "semio-s-app-shooting" }
shooting_engine = { path = "../../engine/rs", package = "semio-s-app-shooting-engine" }
shooting_op = { path = "../../op/rs", package = "semio-s-app-shooting-op" }
protocol = { path = "../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
shooting_dsl = { path = "../../dsl/rs", package = "semio-s-app-shooting-dsl" }
