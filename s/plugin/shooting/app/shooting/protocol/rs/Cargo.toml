[package]
name = "semio-s-app-shooting-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Shooting app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
shooting = { path = "../../rs", package = "semio-s-app-shooting" }
shooting_op = { path = "../../op/rs", package = "semio-s-app-shooting-op" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
