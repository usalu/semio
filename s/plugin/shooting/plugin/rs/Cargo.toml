[package]
name = "shooting-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:shooting"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "shooting"
ports = { react = 6019, wgpu = 6119 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
roots = ["asset/metabolism/representation", "asset/abbau-aufbau"]
placeholder = "asset/mesh/placeholder.glb"
filter_from_examples = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../../../framework/core/rs" }
shooting = { path = "../../rs", package = "shooting" }
protocol = { path = "../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
vcs = { path = "../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

