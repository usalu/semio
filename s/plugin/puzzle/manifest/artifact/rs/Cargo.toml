[package]
name = "puzzle-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:puzzle"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "puzzle2d"
app = "puzzle2d-play"
aliases = ["2d"]
ports = { react = 6012, wgpu = 6112 }
engines = ["s/plugin/puzzle/app/2d/engine/rs"]

[[package.metadata.semio.playground]]
variant = "puzzle3d"
app = "puzzle3d-play"
aliases = ["3d"]
ports = { react = 6013, wgpu = 6113 }

[[package.metadata.semio.playground]]
variant = "puzzle5d"
app = "puzzle5d-play"
aliases = ["5d"]
ports = { react = 6014, wgpu = 6114 }

[[package.metadata.semio.playground]]
variant = "aggregator"
app = "puzzle3d-play"
brand = "entwerfen-mit-bestand"
aliases = ["mit-bestand", "entwerfen-mit-bestand"]
ports = { react = 6023, wgpu = 6123 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "puzzle3d-play"
roots = ["framework/module/asset/metabolism/representation", "mit-bestand/asset/abbau-aufbau"]
placeholder = "framework/module/asset/mesh/placeholder.glb"
filter_from_examples = true

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/infinite-fixture"
app = "puzzle3d-play"
root = "framework/os/kernel/infinite/fixture"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"], package = "semio-framework-plugin" }
puzzle_2d_ui = { path = "../../../app/2d/ui/rs", package = "semio-s-app-puzzle-2d-ui" }
puzzle_3d_ui = { path = "../../../app/3d/ui/rs", package = "semio-s-app-puzzle-3d-ui" }
puzzle_5d_ui = { path = "../../../app/5d/ui/rs", package = "semio-s-app-puzzle-5d-ui" }
