[package]
name = "semio-s-app-puzzle-5d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle 5d app — DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
puzzle_5d = { path = "../../rs", package = "semio-s-app-puzzle-5d" }
puzzle_5d_engine = { path = "../../engine/rs", package = "semio-s-app-puzzle-5d-engine" }
puzzle_5d_op = { path = "../../op/rs", package = "semio-s-app-puzzle-5d-op" }
puzzle_5d_dsl = { path = "../../dsl/rs", package = "semio-s-app-puzzle-5d-dsl" }
infinite_board_port_directed_normal = { path = "../../../../../../../framework/kernel/infinite/board/port/directed/normal/rs", package = "semio-framework-kernel-infinite-board-port-directed-normal" }
semio-framework-os = { path = "../../../../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
