[package]
name = "semio-s-app-puzzle-2d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle 2d app — headless compute (constitutional: engine)"
build = "build.rs"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[build-dependencies]
serde_json = "1.0.140"

[dependencies]
puzzle_2d = { path = "../../rs", package = "semio-s-app-puzzle-2d" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
mathematical_geometry = { path = "../../../../../../../framework/kernel/mathematical/geometry/rs", package = "semio-framework-kernel-mathematical-geometry" }
infinite_board_port_directed_normal = { path = "../../../../../../../framework/kernel/infinite/board/port/directed/normal/rs", package = "semio-framework-kernel-infinite-board-port-directed-normal" }
reasoning_mindmap = { path = "../../../../../reasoning/shared/rs", package = "reasoning_mindmap" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
