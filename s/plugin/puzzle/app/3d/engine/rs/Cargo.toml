[package]
name = "semio-s-app-puzzle-3d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Puzzle 3d app — headless compute (constitutional: engine)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
puzzle_3d = { path = "../../rs", package = "semio-s-app-puzzle-3d" }
store = { path = "../../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
mathematical_graph_manifest = { path = "../../../../../../../framework/os/kernel/math/graph/manifest/rs", package = "semio-framework-os-kernel-math-graph-manifest" }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
parry3d = "0.17"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
