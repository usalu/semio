[package]
name = "semio-s-app-cad"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cad app - document entities (constitutional: general)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
dsl = { path = "../../../../../framework/os/kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
