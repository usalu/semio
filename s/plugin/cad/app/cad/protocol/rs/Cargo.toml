[package]
name = "semio-s-app-cad-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cad app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
cad_document = { path = "../../rs", package = "semio-s-app-cad" }
cad_document_op = { path = "../../op/rs", package = "semio-s-app-cad-op" }
protocol = { path = "../../../../../../../framework/product/os/module/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
