[package]
name = "cad-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:cad"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "cad"
ports = { react = 6020, wgpu = 6120 }

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-fixture"
root = "cad/fixture"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
cad_document = { path = "../app/rs", package = "semio-s-app-cad" }
cad_document_engine = { path = "../app/engine/rs", package = "semio-s-app-cad-engine" }
cad_document_ui = { path = "../app/ui/rs", package = "semio-s-app-cad-ui" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../../framework/os/core/rs", package = "semio-framework-os" }
semio-framework-core = { path = "../../../../framework/core/rs" }
kernel_3d_brepkit = { path = "../../../../framework/os/kernel/3d/brep/rs", package = "semio-framework-os-kernel-3d-brep" }
serde_json = "1.0.140"
