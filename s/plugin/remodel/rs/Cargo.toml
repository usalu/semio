[package]
name = "remodel-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:remodel"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "remodel"
ports = { react = 6063, wgpu = 6163 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
remodel = { path = "../app/rs", package = "semio-s-app-remodel" }
remodel_engine = { path = "../app/engine/rs", package = "semio-s-app-remodel-engine" }
remodel_ui = { path = "../app/ui/rs", package = "semio-s-app-remodel-ui" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../../framework/os/core/rs", package = "semio-framework-os" }
