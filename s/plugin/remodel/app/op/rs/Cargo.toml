[package]
name = "semio-s-app-remodel-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Remodel app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
remodel = { path = "../../rs", package = "semio-s-app-remodel" }
dsl = { path = "../../../../../../framework/os/kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
semio-framework-core = { path = "../../../../../../framework/core/rs" }
