[package]
name = "remodel-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:remodel"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "remodel"
ports = { react = 6063, wgpu = 6163 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
remodel_document = { path = "../../rs", package = "remodel_document" }
remodel_engine = { path = "../../engine/rs", package = "remodel_engine" }
remodel_image = { path = "../../image/rs", package = "remodel_image" }
remodel_video = { path = "../../video/rs", package = "remodel_video" }
remodel_camera = { path = "../../camera/rs", package = "remodel_camera" }
remodel_sfm = { path = "../../sfm/rs", package = "remodel_sfm" }
remodel_dense = { path = "../../dense/rs", package = "remodel_dense" }
remodel_mesh = { path = "../../mesh/rs", package = "remodel_mesh" }
remodel_geo = { path = "../../geo/rs", package = "remodel_geo" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../../../framework/product/os/core/rs" }
semio-framework-core = { path = "../../../../../framework/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
vcs = { path = "../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../kernel/store/rs", package = "semio-s-kernel-store" }
