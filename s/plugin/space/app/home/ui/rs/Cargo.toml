[package]
name = "semio-s-app-space-home-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "S Home launcher app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
home = { path = "../../rs", package = "semio-s-app-space-home" }
home_engine = { path = "../../engine/rs", package = "semio-s-app-space-home-engine" }
home_op = { path = "../../op/rs", package = "semio-s-app-space-home-op" }
space_shared = { path = "../../../../shared/rs", package = "semio-s-plugin-space-shared" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
semio-framework-os = { path = "../../../../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
