[package]
name = "s_studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "S studio CQRS store — programs, app instances, workflow, checkpoints"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
dsl = { path = "../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
