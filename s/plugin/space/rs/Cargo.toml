[package]
name = "s-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:s"

[package.metadata.semio]
capabilities = ["localBackboneStorage"]
host = { landing = "home", studio = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
ports = { react = 6070, wgpu = 6066 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../../framework/os/core/rs", package = "semio-framework-os" }
home_ui = { path = "../app/home/ui/rs", package = "semio-s-app-space-home-ui" }
space_ui = { path = "../app/space/ui/rs", package = "semio-s-app-space-space-ui" }
