[package]
name = "semio-s-app-sequence-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Sequence app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
sequence = { path = "../../rs", package = "semio-s-app-sequence" }
sequence_engine = { path = "../../engine/rs", package = "semio-s-app-sequence-engine" }
sequence_op = { path = "../../op/rs", package = "semio-s-app-sequence-op" }
infinite_board_port_directed_dag = { path = "../../../../../../framework/os/kernel/infinite/board/port/directed/dag/rs", package = "semio-framework-os-kernel-infinite-board-port-directed-dag" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
