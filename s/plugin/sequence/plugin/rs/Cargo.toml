[package]
name = "sequence-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:sequence"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "sequence"
ports = { react = 6077, wgpu = 6177 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
sequence = { path = "../../app/rs", package = "semio-s-app-sequence" }
sequence_engine = { path = "../../app/engine/rs", package = "semio-s-app-sequence-engine" }
sequence_ui = { path = "../../app/ui/rs", package = "semio-s-app-sequence-ui" }
infinite_board_port_directed_dag = { path = "../../../../../framework/kernel/infinite/board/port/directed/dag/rs", package = "semio-framework-kernel-infinite-board-port-directed-dag" }
infinite_cavas = { path = "../../../../../framework/kernel/infinite/canvas/rs", package = "semio-framework-kernel-infinite-canvas" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
