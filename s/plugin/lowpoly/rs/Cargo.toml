[package]
name = "lowpoly-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:lowpoly"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "lowpoly"
ports = { react = 6078, wgpu = 6178 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../../framework/product/os/core/rs" }
lowpoly = { path = "../app/rs", package = "semio-s-app-lowpoly" }
lowpoly_engine = { path = "../app/engine/rs", package = "semio-s-app-lowpoly-engine" }
lowpoly_ui = { path = "../app/ui/rs", package = "semio-s-app-lowpoly-ui" }
