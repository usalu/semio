[package]
name = "lowpoly-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:lowpoly"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "lowpoly"
ports = { react = 6078, wgpu = 6178 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../../../framework/product/os/core/rs" }
vcs = { path = "../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../kernel/store/rs", package = "semio-s-kernel-store" }
lowpoly_core = { path = "../../core/rs", package = "lowpoly_core" }
kernel_3d_mesh = { path = "../../../../kernel/geometry/3d/mesh/rs", package = "semio-s-kernel-geometry-3d-mesh" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
png = "0.17.16"

