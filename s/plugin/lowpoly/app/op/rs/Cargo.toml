[package]
name = "semio-s-app-lowpoly-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Lowpoly app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
lowpoly = { path = "../../rs", package = "semio-s-app-lowpoly" }
lowpoly_engine = { path = "../../engine/rs", package = "semio-s-app-lowpoly-engine" }
dsl = { path = "../../../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
protocol = { path = "../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
base64 = "0.22.1"

[dev-dependencies]
kernel_3d_mesh = { path = "../../../../../kernel/geometry/3d/mesh/rs", package = "semio-s-kernel-geometry-3d-mesh" }
