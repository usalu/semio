[package]
name = "semio-s-app-lowpoly-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Lowpoly app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
lowpoly = { path = "../../rs", package = "semio-s-app-lowpoly" }
lowpoly_engine = { path = "../../engine/rs", package = "semio-s-app-lowpoly-engine" }
dsl = { path = "../../../../../../../framework/product/os/module/dsl/rs", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../framework/product/os/module/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
base64 = "0.22.1"

[dev-dependencies]
kernel_3d_mesh = { path = "../../../../../../module/3d/mesh/rs", package = "semio-framework-os-kernel-3d-mesh" }
