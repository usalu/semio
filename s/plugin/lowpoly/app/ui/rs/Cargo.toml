[package]
name = "semio-s-app-lowpoly-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Lowpoly app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
lowpoly = { path = "../../rs", package = "semio-s-app-lowpoly" }
lowpoly_engine = { path = "../../engine/rs", package = "semio-s-app-lowpoly-engine" }
lowpoly_op = { path = "../../op/rs", package = "semio-s-app-lowpoly-op" }
kernel_3d_mesh = { path = "../../../../../kernel/geometry/3d/mesh/rs", package = "semio-s-kernel-geometry-3d-mesh" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
png = "0.17.16"
