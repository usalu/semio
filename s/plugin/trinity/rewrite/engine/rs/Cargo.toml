[package]
name = "trinity_rewrite"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
dsl = { path = "../../../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
trinity_jack = { path = "../../../jack/core/rs", package = "trinity_jack" }
trinity_ram = { path = "../../../ram/rs", package = "trinity_ram" }
infinite_board_port_directed = { path = "../../../../../../framework/kernel/infinite/board/port/directed/rs", package = "semio-framework-kernel-infinite-board-port-directed" }
infinite_board_port_directed_normal = { path = "../../../../../../framework/kernel/infinite/board/port/directed/normal/rs", package = "semio-framework-kernel-infinite-board-port-directed-normal" }
infinite_cavas = { path = "../../../../../../framework/kernel/infinite/canvas/rs", package = "semio-framework-kernel-infinite-canvas" }
ui_styling = { path = "../../../../../../ui/styling/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
