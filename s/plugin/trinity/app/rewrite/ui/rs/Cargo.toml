[package]
name = "semio-s-app-trinity-rewrite-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Trinity Rewrite app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
rewrite = { path = "../../rs", package = "semio-s-app-trinity-rewrite" }
rewrite_op = { path = "../../op/rs", package = "semio-s-app-trinity-rewrite-op" }
rewrite_engine = { path = "../../engine/rs", package = "semio-s-app-trinity-rewrite-engine" }
trinity_ram = { path = "../../../../ram/rs", package = "trinity_ram" }
trinity_jack = { path = "../../../../jack/core/rs", package = "trinity_jack" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
