[package]
name = "semio-s-app-trinity-jack-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Trinity Jack app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
trinity_ram = { path = "../../../../module/ram/rs", package = "trinity_ram" }
trinity_jack = { path = "../../../../module/jack/rs", package = "trinity_jack" }
trinity_rewrite = { path = "../../../rewrite/engine/rs", package = "semio-s-app-trinity-rewrite-engine" }
mathematical_graph_drawing = { path = "../../../../../../../framework/module/math/graph/drawing/rs", package = "semio-framework-os-kernel-math-graph-drawing" }
mathematical_geometry = { path = "../../../../../../../framework/module/math/geometry/rs", package = "semio-framework-os-kernel-math-geometry" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
