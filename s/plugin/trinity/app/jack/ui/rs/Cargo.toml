[package]
name = "semio-s-app-trinity-jack-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Trinity Jack app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
trinity_ram = { path = "../../../../ram/rs", package = "trinity_ram" }
trinity_jack = { path = "../../../../jack/core/rs", package = "trinity_jack" }
trinity_rewrite = { path = "../../../rewrite/engine/rs", package = "semio-s-app-trinity-rewrite-engine" }
mathematical_graph_drawing = { path = "../../../../../../../framework/kernel/mathematical/graph/drawing/rs", package = "semio-framework-kernel-mathematical-graph-drawing" }
mathematical_geometry = { path = "../../../../../../../framework/kernel/mathematical/geometry/rs", package = "semio-framework-kernel-mathematical-geometry" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
