[package]
name = "trinity_jack_lsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
mathematical_graph_dsl = { path = "../../../../../../framework/kernel/mathematical/graph/dsl/rs", package = "semio-framework-kernel-mathematical-graph-dsl" }
trinity_jack = { path = "../../core/rs", package = "trinity_jack" }
trinity_ram = { path = "../../../ram/rs", package = "trinity_ram" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
