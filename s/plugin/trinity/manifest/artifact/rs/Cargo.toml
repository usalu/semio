[package]
name = "trinity-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:trinity"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "trinity-jack"
app = "trinity-jack-play"
aliases = ["trinity jack"]
ports = { react = 6054, wgpu = 6154 }

[[package.metadata.semio.playground]]
variant = "trinity-rewrite"
app = "trinity-rewrite-play"
aliases = ["trinity rewrite"]
ports = { react = 6056, wgpu = 6156 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../../framework/product/os/rs", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"], package = "semio-framework-plugin" }
trinity_ram = { path = "../../../module/ram/rs", package = "trinity_ram" }
trinity_rewrite = { path = "../../../app/rewrite/rs", package = "semio-s-app-trinity-rewrite" }
trinity_jack_ui = { path = "../../../app/jack/ui/rs", package = "semio-s-app-trinity-jack-ui" }
trinity_rewrite_ui = { path = "../../../app/rewrite/ui/rs", package = "semio-s-app-trinity-rewrite-ui" }
