[package]
name = "semio-s-app-draw-pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw app - binary document surface + laws (constitutional: pack)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
draw = { path = "../../rs", package = "semio-s-app-draw" }
pack = { path = "../../../../../kernel/pack/rs", package = "semio-s-kernel-pack" }
store = { path = "../../../../../kernel/store/rs", package = "semio-s-kernel-store" }

[dev-dependencies]
draw_dsl = { path = "../../dsl/rs", package = "semio-s-app-draw-dsl" }
draw_engine = { path = "../../engine/rs", package = "semio-s-app-draw-engine" }
