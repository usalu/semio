[package]
name = "semio-s-app-draw-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
draw = { path = "../../rs", package = "semio-s-app-draw" }
draw_dsl = { path = "../../dsl/rs", package = "semio-s-app-draw-dsl" }
semio-framework-core = { path = "../../../../../../framework/core/rs" }
kernel_2d_engine = { path = "../../../../../kernel/geometry/2d/engine/rs", package = "semio-s-kernel-geometry-2d-engine" }
kernel_2d_rs = { path = "../../../../../kernel/geometry/2d/rs", package = "semio-s-kernel-geometry-2d" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
