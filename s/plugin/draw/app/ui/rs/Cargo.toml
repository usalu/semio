[package]
name = "semio-s-app-draw-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
draw = { path = "../../rs", package = "semio-s-app-draw" }
draw_engine = { path = "../../engine/rs", package = "semio-s-app-draw-engine" }
draw_op = { path = "../../op/rs", package = "semio-s-app-draw-op" }
fsm = { path = "../../../fsm/rs", package = "fsm" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
store = { path = "../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
