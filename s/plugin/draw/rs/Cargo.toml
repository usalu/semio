[package]
name = "draw-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:draw"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "draw"
ports = { react = 6064, wgpu = 6164 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
draw = { path = "../app/rs", package = "semio-s-app-draw" }
draw_engine = { path = "../app/engine/rs", package = "semio-s-app-draw-engine" }
draw_ui = { path = "../app/ui/rs", package = "semio-s-app-draw-ui" }
semio-framework-os = { path = "../../../../framework/os/core/rs", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
base64 = "0.22"

