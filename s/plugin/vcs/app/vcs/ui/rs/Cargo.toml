[package]
name = "semio-s-app-vcs-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "VCS app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
vcs = { path = "../../rs", package = "semio-s-app-vcs" }
vcs_engine = { path = "../../engine/rs", package = "semio-s-app-vcs-engine" }
vcs_op = { path = "../../op/rs", package = "semio-s-app-vcs-op" }
vcs_kernel = { path = "../../../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
