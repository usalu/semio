[package]
name = "semio-s-plugin-vcs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:vcs"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "vcs"
ports = { react = 6075, wgpu = 6175 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
vcs = { path = "../../app/rs", package = "semio-s-app-vcs" }
vcs_ui = { path = "../../app/ui/rs", package = "semio-s-app-vcs-ui" }

