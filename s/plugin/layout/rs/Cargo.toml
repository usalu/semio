[package]
name = "semio-s-plugin-layout"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:layout"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "layout"
ports = { react = 6079, wgpu = 6179 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
layout = { path = "../app/rs", package = "semio-s-app-layout" }
layout_engine = { path = "../app/engine/rs", package = "semio-s-app-layout-engine" }
layout_ui = { path = "../app/ui/rs", package = "semio-s-app-layout-ui" }
