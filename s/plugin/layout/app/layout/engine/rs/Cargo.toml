[package]
name = "semio-s-app-layout-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Layout app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
layout = { path = "../../rs", package = "semio-s-app-layout" }
layout_dsl = { path = "../../dsl/rs", package = "semio-s-app-layout-dsl" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
infinite_cavas = { path = "../../../../../../../framework/kernel/infinite/canvas/rs", package = "semio-framework-kernel-infinite-canvas" }
semio-framework-os = { path = "../../../../../../../framework/product/os/core/rs" }
serde_json = "1.0.140"
parley = { version = "0.5.0" }
swash = { version = "0.2.6", default-features = false, features = ["render", "std"] }
fontique = "0.4.0"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "2.0.12"
