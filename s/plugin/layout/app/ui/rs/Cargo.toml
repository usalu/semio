[package]
name = "semio-s-app-layout-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Layout app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
layout = { path = "../../rs", package = "semio-s-app-layout" }
layout_engine = { path = "../../engine/rs", package = "semio-s-app-layout-engine" }
layout_op = { path = "../../op/rs", package = "semio-s-app-layout-op" }
infinite_cavas = { path = "../../../../../../framework/os/kernel/infinite/canvas/rs", package = "semio-framework-os-kernel-infinite-canvas" }
protocol = { path = "../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
semio-framework-plugin = { path = "../../../../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../../../../framework/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

[dev-dependencies]
layout_dsl = { path = "../../dsl/rs", package = "semio-s-app-layout-dsl" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
