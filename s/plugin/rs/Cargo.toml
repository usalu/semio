[package]
name = "s-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:s"

[package.metadata.semio]
capabilities = ["localBackboneStorage"]
host = { landing = "home", studio = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
ports = { react = 6070, wgpu = 6066 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../../vcs/rs" }
store = { path = "../../../store/rs" }
protocol = { path = "../../../protocol/rs" }
dsl = { path = "../../../dsl/rs" }
infinite_board_port_directed_dag = { path = "../../../infinite/board/port/directed/dag/rs" }
base64 = "0.22"
