[package]
name = "s-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:s"

[package.metadata.semio]
capabilities = ["localBackboneStorage"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../../vcs/rs" }
mathematical_graph_port_directed_dag = { path = "../../../mathematical/graph/port/directed/dag/rs" }
base64 = "0.22"
