[package]
name = "semio-s-app-procedural-3d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 3D app - document entities (constitutional: general)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
dsl = { path = "../../../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
store = { path = "../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
flow_core = { path = "../../../../../kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
playbook = { path = "../../../../../kernel/playbook/rs", package = "semio-s-kernel-playbook" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
