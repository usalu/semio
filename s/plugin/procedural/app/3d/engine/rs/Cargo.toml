[package]
name = "semio-s-app-procedural-3d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 3D app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
procedural_3d = { path = "../../rs", package = "semio-s-app-procedural-3d" }
procedural_3d_dsl = { path = "../../dsl/rs", package = "semio-s-app-procedural-3d-dsl" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
flow_core = { path = "../../../../../../kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
flow_module_brep = { path = "../../../../../../kernel/flow/module/brep/rs", default-features = false, package = "semio-s-kernel-flow-module-brep" }
playbook = { path = "../../../../../../kernel/playbook/rs", package = "semio-s-kernel-playbook" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../../../../../framework/core/rs" }
ui_wgpu = { path = "../../../../../../../ui/wgpu/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
kernel_3d_scene = { path = "../../../../../../kernel/geometry/3d/scene/rs", package = "semio-s-kernel-geometry-3d-scene" }
