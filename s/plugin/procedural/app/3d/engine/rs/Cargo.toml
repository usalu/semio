[package]
name = "semio-s-app-procedural-3d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 3D app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
procedural_3d = { path = "../../rs", package = "semio-s-app-procedural-3d" }
procedural_3d_dsl = { path = "../../dsl/rs", package = "semio-s-app-procedural-3d-dsl" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
flow_core = { path = "../../../../../../../framework/product/os/module/flow/core/rs", package = "semio-framework-os-kernel-flow-core" }
flow_module_brep = { path = "../../../../../../../framework/product/os/module/flow/module/brep/rs", default-features = false, package = "semio-s-kernel-flow-module-brep" }
playbook = { path = "../../../../../../../framework/product/os/module/workflow/rs", package = "semio-framework-os-kernel-workflow" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../framework/rs", package = "semio-framework-core" }
ui_wgpu = { path = "../../../../../../../framework/module/ui/wgpu/rs", package = "ui_wgpu" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
kernel_3d_scene = { path = "../../../../../../module/3d/scene/rs", package = "semio-framework-os-kernel-3d-scene" }
