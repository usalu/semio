[package]
name = "semio-s-app-procedural-2d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 2D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
procedural_2d = { path = "../../rs", package = "semio-s-app-procedural-2d" }
procedural_2d_engine = { path = "../../engine/rs", package = "semio-s-app-procedural-2d-engine" }
procedural_2d_op = { path = "../../op/rs", package = "semio-s-app-procedural-2d-op" }
protocol = { path = "../../../../../../../framework/product/os/module/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
flow_core = { path = "../../../../../../../framework/product/os/module/flow/core/rs", package = "semio-framework-os-kernel-flow-core" }
playbook = { path = "../../../../../../../framework/product/os/module/workflow/rs", package = "semio-framework-os-kernel-workflow" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../framework/rs", package = "semio-framework-core" }
ui_styling = { path = "../../../../../../../framework/module/ui/styling/rs", package = "ui_styling" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
