[package]
name = "semio-s-app-procedural-2d-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 2D app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
procedural_2d = { path = "../../rs", package = "semio-s-app-procedural-2d" }
dsl = { path = "../../../../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
flow_core = { path = "../../../../../../kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
playbook = { path = "../../../../../../kernel/playbook/rs", package = "semio-s-kernel-playbook" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
procedural_2d_engine = { path = "../../engine/rs", package = "semio-s-app-procedural-2d-engine" }
vcs = { path = "../../../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
