[package]
name = "semio-s-app-procedural-2d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 2D app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
procedural_2d = { path = "../../rs", package = "semio-s-app-procedural-2d" }
procedural_2d_dsl = { path = "../../dsl/rs", package = "semio-s-app-procedural-2d-dsl" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
flow_core = { path = "../../../../../../../framework/product/os/module/flow/core/rs", package = "semio-framework-os-kernel-flow-core" }
flow_module_draw = { path = "../../../../../../../framework/product/os/module/flow/module/draw/rs", default-features = false, package = "semio-s-kernel-flow-module-draw" }
playbook = { path = "../../../../../../../framework/product/os/module/workflow/rs", package = "semio-framework-os-kernel-workflow" }
semio-framework-os = { path = "../../../../../../../framework/product/os/rs", package = "semio-framework-os" }
semio-framework-core = { path = "../../../../../../../framework/rs", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
