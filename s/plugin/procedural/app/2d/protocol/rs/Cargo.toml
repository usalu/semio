version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Procedural 2D app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
procedural_2d = { path = "../../rs", package = "semio-s-app-procedural-2d" }
