[package]
name = "architect-spine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:architect"

[[package.metadata.semio.playground]]
variant = "architect"
ports = { react = 6090, wgpu = 6190 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
architect_spine = { path = "." }
vcs = { path = "../../../../../../framework/product/os/module/vcs/rs" }
store = { path = "../../../../../../framework/product/os/module/store/rs" }
protocol = { path = "../../../../../../framework/product/os/module/protocol/rs" }
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"]}
semio-framework-core = { path = "../../../../../../framework/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
