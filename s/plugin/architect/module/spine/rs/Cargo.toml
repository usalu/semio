[package]
name = "architect_spine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Headless architectural programming domain — program_registers, adjacency, analysis, and exchange"


[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
vcs = { path = "../../../../../../framework/product/os/module/vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../framework/product/os/module/protocol/rs", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../../framework/product/os/module/dsl/rs", package = "semio-framework-os-kernel-dsl" }
mathematical_graph = { path = "../../../../../../framework/module/math/graph/rs", package = "semio-framework-os-kernel-math-graph" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
