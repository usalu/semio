dsl = { path = "../../../../../framework/os/kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
mathematical_graph = { path = "../../../../../framework/os/kernel/math/graph/rs", package = "semio-framework-os-kernel-math-graph" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
