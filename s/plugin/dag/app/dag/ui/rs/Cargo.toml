[package]
name = "semio-s-app-dag-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "DAG app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
dag = { path = "../../rs", package = "semio-s-app-dag" }
dag_engine = { path = "../../engine/rs", package = "semio-s-app-dag-engine" }
dag_op = { path = "../../op/rs", package = "semio-s-app-dag-op" }
infinite_board_port_directed_dag = { path = "../../../../../../../framework/product/os/module/infinite/board/port/directed/dag/rs", package = "semio-framework-os-kernel-infinite-board-port-directed-dag" }
protocol = { path = "../../../../../../../framework/product/os/module/protocol/rs", package = "semio-framework-os-kernel-protocol" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
