[package]
name = "dag-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:dag"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "dag"
ports = { react = 6017, wgpu = 6117 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
dag = { path = "../app/rs", package = "semio-s-app-dag" }
dag_ui = { path = "../app/ui/rs", package = "semio-s-app-dag-ui" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }

