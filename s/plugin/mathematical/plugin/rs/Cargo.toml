[package]
name = "mathematical-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:mathematical"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "mathematical"
app = "mathematical-play"
aliases = ["mathematical", "math"]
ports = { react = 6084, wgpu = 6184 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
mathematical_ui = { path = "../../app/ui/rs", package = "semio-s-app-mathematical-ui" }
