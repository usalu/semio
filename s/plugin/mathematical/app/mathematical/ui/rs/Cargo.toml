[package]
name = "semio-s-app-mathematical-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Mathematical app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
mathematical = { path = "../../rs", package = "semio-s-app-mathematical" }
mathematical_engine = { path = "../../engine/rs", package = "semio-s-app-mathematical-engine" }
mathematical_op = { path = "../../op/rs", package = "semio-s-app-mathematical-op" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
