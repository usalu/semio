vcs = { path = "../../../../../../../framework/os/kernel/vcs/rs", package = "semio-framework-os-kernel-vcs" }
semio-framework-core = { path = "../../../../../../../framework/core/rs" }
semio-framework-os = { path = "../../../../../../../framework/os/core/rs", package = "semio-framework-os" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
