[package]
name = "semio-s-app-animate-present-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Animate present app — operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
present = { path = "../../rs", package = "semio-s-app-animate-present" }
dsl = { path = "../../../../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
present_engine = { path = "../../engine/rs", package = "semio-s-app-animate-present-engine" }
vcs = { path = "../../../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
