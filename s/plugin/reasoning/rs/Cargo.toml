[package]
name = "reasoning-mindmap-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:reasoning-mindmap"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "reasoning-wires"
aliases = ["wires"]
ports = { react = 6015, wgpu = 6115 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
reasoning_wires = { path = "../app/wires/rs", package = "semio-s-app-reasoning-wires" }
reasoning_wires_ui = { path = "../app/wires/ui/rs", package = "semio-s-app-reasoning-wires-ui" }
