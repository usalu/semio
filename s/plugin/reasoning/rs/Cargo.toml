[package]
name = "reasoning_mindmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
vcs = { path = "../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
dsl = { path = "../../../../framework/kernel/dsl/rs", package = "semio-framework-kernel-dsl" }
infinite_board_normal_directed = { path = "../../../../framework/kernel/infinite/board/normal/directed/rs", package = "semio-framework-kernel-infinite-board-normal-directed" }
infinite_cavas = { path = "../../../../framework/kernel/infinite/canvas/rs", package = "semio-framework-kernel-infinite-canvas" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
