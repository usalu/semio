[package]
name = "reasoning-mindmap-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:reasoning-mindmap"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "reasoning-wires"
aliases = ["wires"]
ports = { react = 6015, wgpu = 6115 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
reasoning_mindmap = { path = "../../rs", package = "reasoning_mindmap" }
reasoning_mindmap_wires = { path = "../../wires/rs", package = "reasoning_mindmap_wires" }
infinite_board_port_directed = { path = "../../../../../framework/kernel/infinite/board/port/directed/rs", package = "semio-framework-kernel-infinite-board-port-directed" }
vcs = { path = "../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

