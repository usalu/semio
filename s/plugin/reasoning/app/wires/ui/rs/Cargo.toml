[package]
name = "semio-s-app-reasoning-wires-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Reasoning wires app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
reasoning_wires = { path = "../../rs", package = "semio-s-app-reasoning-wires" }
reasoning_wires_engine = { path = "../../engine/rs", package = "semio-s-app-reasoning-wires-engine" }
reasoning_wires_op = { path = "../../op/rs", package = "semio-s-app-reasoning-wires-op" }
infinite_board_port_directed = { path = "../../../../../../../framework/os/kernel/infinite/board/port/directed/rs", package = "semio-framework-os-kernel-infinite-board-port-directed" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
store = { path = "../../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
