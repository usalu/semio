[package]
name = "semio-s-app-reasoning-wires-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Reasoning wires app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
reasoning_wires = { path = "../../rs", package = "semio-s-app-reasoning-wires" }
reasoning_wires_op = { path = "../../op/rs", package = "semio-s-app-reasoning-wires-op" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }

[dev-dependencies]
reasoning_wires_engine = { path = "../../engine/rs", package = "semio-s-app-reasoning-wires-engine" }
serde_json = "1.0.140"
