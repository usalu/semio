[package]
name = "semio-s-app-process-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Process 3d app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
process_3d = { path = "../../rs", package = "semio-s-app-process-3d" }
process_3d_engine = { path = "../../engine/rs", package = "semio-s-app-process-3d-engine" }
process_3d_op = { path = "../../op/rs", package = "semio-s-app-process-3d-op" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
semio-framework-core = { path = "../../../../../../../framework/core/rs" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
