[package]
name = "semio-s-app-process-3d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Process 3d app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
process_3d = { path = "../../rs", package = "semio-s-app-process-3d" }
process_3d_dsl = { path = "../../dsl/rs", package = "semio-s-app-process-3d-dsl" }
store = { path = "../../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
kernel_3d_brepkit = { path = "../../../../../../../framework/os/kernel/3d/brep/rs", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../../../../../../framework/os/kernel/3d/brep/engine/rs", features = ["parallel"], package = "semio-framework-os-kernel-3d-brep-engine" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
