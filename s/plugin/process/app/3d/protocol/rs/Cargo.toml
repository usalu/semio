[package]
name = "semio-s-app-process-3d-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Process 3d app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
process_3d = { path = "../../rs", package = "semio-s-app-process-3d" }
process_3d_op = { path = "../../op/rs", package = "semio-s-app-process-3d-op" }
protocol = { path = "../../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde_json = "1.0.140"

[dev-dependencies]
vcs = { path = "../../../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
