[package]
name = "process-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:process"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "process3d"
app = "process3d-play"
aliases = ["process 3d"]
ports = { react = 6022, wgpu = 6122 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
process_3d = { path = "../app/3d/rs", package = "semio-s-app-process-3d" }
process_3d_engine = { path = "../app/3d/engine/rs", package = "semio-s-app-process-3d-engine" }
process_3d_ui = { path = "../app/3d/ui/rs", package = "semio-s-app-process-3d-ui" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
semio-framework-os = { path = "../../../../framework/product/os/core/rs" }
serde_json = "1.0.140"
