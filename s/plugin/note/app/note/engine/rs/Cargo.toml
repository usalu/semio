[package]
name = "semio-s-app-note-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Note app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
note = { path = "../../rs", package = "semio-s-app-note" }
note_dsl = { path = "../../dsl/rs", package = "semio-s-app-note-dsl" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
