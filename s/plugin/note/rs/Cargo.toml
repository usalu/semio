[package]
name = "semio-s-plugin-note"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:note"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "note"
ports = { react = 6080, wgpu = 6180 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
note = { path = "../app/note/rs", package = "semio-s-app-note" }
note_engine = { path = "../app/note/engine/rs", package = "semio-s-app-note-engine" }
note_ui = { path = "../app/note/ui/rs", package = "semio-s-app-note-ui" }
