[package]
name = "semio-s-app-block-5d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Block 5D app — headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
block_5d = { path = "../../rs", package = "semio-s-app-block-5d" }
block_shared = { path = "../../../../module/shared/rs", package = "semio-s-plugin-block-shared" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
