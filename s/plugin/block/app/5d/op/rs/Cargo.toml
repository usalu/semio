[package]
name = "semio-s-app-block-5d-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Block 5D app — operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
block_5d = { path = "../../rs", package = "semio-s-app-block-5d" }
block_shared = { path = "../../../../module/shared/rs", package = "semio-s-plugin-block-shared" }
dsl = { path = "../../../../../../../framework/product/os/module/dsl/rs", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../framework/product/os/module/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
block_5d_engine = { path = "../../engine/rs", package = "semio-s-app-block-5d-engine" }
