[package]
name = "semio-s-app-block-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Block 3D app — DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
block_3d = { path = "../../rs", package = "semio-s-app-block-3d" }
block_3d_dsl = { path = "../../dsl/rs", package = "semio-s-app-block-3d-dsl" }
block_3d_engine = { path = "../../engine/rs", package = "semio-s-app-block-3d-engine" }
block_3d_op = { path = "../../op/rs", package = "semio-s-app-block-3d-op" }
block_shared = { path = "../../../../module/shared/rs", package = "semio-s-plugin-block-shared" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
