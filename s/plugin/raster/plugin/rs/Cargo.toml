[package]
name = "raster-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:raster"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "raster"
ports = { react = 6060, wgpu = 6160 }
engines = ["framework/surface/paint/rs"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
raster = { path = "../../app/raster/rs", package = "semio-s-app-raster" }
raster_engine = { path = "../../app/raster/engine/rs", package = "semio-s-app-raster-engine" }
raster_op = { path = "../../app/raster/op/rs", package = "semio-s-app-raster-op" }
raster_ui = { path = "../../app/raster/ui/rs", package = "semio-s-app-raster-ui" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

