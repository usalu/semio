[package]
name = "semio-s-app-raster-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Raster app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
raster = { path = "../../rs", package = "semio-s-app-raster" }
raster_dsl = { path = "../../dsl/rs", package = "semio-s-app-raster-dsl" }
store = { path = "../../../../../../kernel/store/rs", package = "semio-s-kernel-store" }
semio-framework-os = { path = "../../../../../../../framework/product/os/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
