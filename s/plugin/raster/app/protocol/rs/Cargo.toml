[package]
name = "semio-s-app-raster-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Raster app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
raster = { path = "../../rs", package = "semio-s-app-raster" }
raster_op = { path = "../../op/rs", package = "semio-s-app-raster-op" }
protocol = { path = "../../../../../../framework/kernel/protocol/rs", package = "semio-framework-kernel-protocol" }
store = { path = "../../../../../kernel/store/rs", package = "semio-s-kernel-store" }

[dev-dependencies]
raster_engine = { path = "../../engine/rs", package = "semio-s-app-raster-engine" }
serde_json = "1.0.140"
