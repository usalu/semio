[package]
name = "semio-s-app-raster-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Raster app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
raster = { path = "../../rs", package = "semio-s-app-raster" }
raster_engine = { path = "../../engine/rs", package = "semio-s-app-raster-engine" }
dsl = { path = "../../../../../../framework/os/kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
vcs = { path = "../../../../../../framework/os/kernel/vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
