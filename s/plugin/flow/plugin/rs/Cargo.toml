[package]
name = "flow-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:flow"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "flow"
ports = { react = 6016, wgpu = 6116 }
engines = ["s/kernel/flow/core/rs"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
flow = { path = "../../app/rs", package = "semio-s-app-flow" }
flow_ui = { path = "../../app/ui/rs", package = "semio-s-app-flow-ui" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
