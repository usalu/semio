[package]
name = "semio-s-app-flow-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Flow app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
flow = { path = "../../rs", package = "semio-s-app-flow" }
flow_core = { path = "../../../../../../kernel/flow/core/rs", package = "semio-s-kernel-flow-core" }
flow_engine = { path = "../../engine/rs", package = "semio-s-app-flow-engine" }
flow_op = { path = "../../op/rs", package = "semio-s-app-flow-op" }
playbook = { path = "../../../../../../kernel/playbook/rs", package = "semio-s-kernel-playbook" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
