[package]
name = "fem-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:fem"

[[package.metadata.semio.playground]]
variant = "fem2d"
app = "fem2d-play"
aliases = ["fem 2d"]
ports = { react = 6086, wgpu = 6186 }

[[package.metadata.semio.playground]]
variant = "fem3d"
app = "fem3d-play"
aliases = ["fem 3d"]
ports = { react = 6087, wgpu = 6187 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
fem_2d = { path = "../../2d/rs", package = "fem_2d" }
fem_3d = { path = "../../3d/rs", package = "fem_3d" }
fem_core = { path = "../../core/rs", package = "fem_core" }
semio-framework-plugin = { path = "../../../../../framework/plugin/rs" }
vcs = { path = "../../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
