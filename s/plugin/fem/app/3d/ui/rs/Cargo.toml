[package]
name = "semio-s-app-fem-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "FEM 3D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
fem3d = { path = "../../rs", package = "semio-s-app-fem-3d" }
fem3d_engine = { path = "../../engine/rs", package = "semio-s-app-fem-3d-engine" }
fem3d_op = { path = "../../op/rs", package = "semio-s-app-fem-3d-op" }
fem3d_dsl = { path = "../../dsl/rs", package = "semio-s-app-fem-3d-dsl" }
fem_shared = { path = "../../../../shared/rs", package = "semio-s-plugin-fem-shared" }
fem_core = { path = "../../../../core/rs", package = "fem_core" }
store = { path = "../../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/plugin/rs" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
