[package]
name = "semio-s-app-fem-3d-op"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "FEM 3D app - operation enum + laws (constitutional: op)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
fem3d = { path = "../../rs", package = "semio-s-app-fem-3d" }
dsl = { path = "../../../../../../../framework/os/kernel/dsl/rs", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
vcs = { path = "../../../../../../../framework/os/kernel/vcs/rs", package = "semio-framework-os-kernel-vcs" }
