[package]
name = "semio-s-app-fem-2d-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "FEM 2D app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
fem2d = { path = "../../rs", package = "semio-s-app-fem-2d" }
fem2d_op = { path = "../../op/rs", package = "semio-s-app-fem-2d-op" }
protocol = { path = "../../../../../../../framework/os/kernel/protocol/rs", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../framework/os/kernel/store/rs", package = "semio-framework-os-kernel-store" }

[dev-dependencies]
fem2d_engine = { path = "../../engine/rs", package = "semio-s-app-fem-2d-engine" }
