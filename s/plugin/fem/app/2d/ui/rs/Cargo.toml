[package]
name = "semio-s-app-fem-2d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "FEM 2D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "lib.rs"

[dependencies]
fem2d = { path = "../../rs", package = "semio-s-app-fem-2d" }
fem2d_engine = { path = "../../engine/rs", package = "semio-s-app-fem-2d-engine" }
fem2d_op = { path = "../../op/rs", package = "semio-s-app-fem-2d-op" }
fem2d_dsl = { path = "../../dsl/rs", package = "semio-s-app-fem-2d-dsl" }
fem_shared = { path = "../../../../module/shared/rs", package = "semio-s-plugin-fem-shared" }
fem_core = { path = "../../../../module/core/rs", package = "fem_core" }
store = { path = "../../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../framework/product/os/module/plugin/rs", package = "semio-framework-plugin" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
