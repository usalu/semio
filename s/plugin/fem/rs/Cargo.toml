[package]
name = "semio-s-plugin-fem"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:fem"

[[package.metadata.semio.playground]]
variant = "fem2d"
app = "fem2d-play"
aliases = ["fem 2d"]
ports = { react = 6086, wgpu = 6186 }

[[package.metadata.semio.playground]]
variant = "fem3d"
app = "fem3d-play"
aliases = ["fem 3d"]
ports = { react = 6087, wgpu = 6187 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
fem2d = { path = "../app/2d/rs", package = "semio-s-app-fem-2d" }
fem2d_ui = { path = "../app/2d/ui/rs", package = "semio-s-app-fem-2d-ui" }
fem3d = { path = "../app/3d/rs", package = "semio-s-app-fem-3d" }
fem3d_ui = { path = "../app/3d/ui/rs", package = "semio-s-app-fem-3d-ui" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
