[package]
name = "playbook-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook"

[package.metadata.semio]
consumes = ["playbook.blockKind"]

[[package.metadata.semio.playground]]
variant = "playbook"
ports = { react = 6085, wgpu = 6185 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
playbook = { path = "../../../kernel/playbook/rs", package = "semio-s-kernel-playbook" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
vcs = { path = "../../../../framework/kernel/vcs/rs", package = "semio-framework-kernel-vcs" }
store = { path = "../../../kernel/store/rs", package = "semio-s-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
