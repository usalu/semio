[package]
name = "playbook-module-procedural"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook-module-procedural"

[package.metadata.semio]
contributes = ["playbook.blockKind"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
playbook = { path = "../../../../../../framework/product/os/module/workflow/rs", package = "semio-framework-os-kernel-workflow" }
vcs = { path = "../../../../../../framework/product/os/module/vcs/rs", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../framework/product/os/module/store/rs", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../framework/product/os/module/protocol/rs", package = "semio-framework-os-kernel-protocol" }
flow_core = { path = "../../../../../../framework/product/os/module/flow/core/rs", package = "semio-framework-os-kernel-flow-core" }
flow_module_brep = { path = "../../../../../../framework/product/os/module/flow/module/brep/rs", default-features = false, package = "semio-s-kernel-flow-module-brep" }
kernel_3d_engine = { path = "../../../../../module/3d/brep/engine/rs", features = ["parallel"], package = "semio-framework-os-kernel-3d-brep-engine" }
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../framework/rs", package = "semio-framework-core" }
dsl = { path = "../../../../../../framework/product/os/module/dsl/rs", package = "semio-framework-os-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
