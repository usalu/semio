[package]
name = "playbook-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook"

[package.metadata.semio]
consumes = ["playbook.blockKind"]

[[package.metadata.semio.playground]]
variant = "playbook"
ports = { react = 6085, wgpu = 6185 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../../framework/product/os/module/plugin/rs", features = ["component-guest"], package = "semio-framework-plugin" }
playbook = { path = "../../../app/playbook/rs", package = "semio-s-app-playbook" }
playbook_ui = { path = "../../../app/playbook/ui/rs", package = "semio-s-app-playbook-ui" }
