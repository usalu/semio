[package]
name = "puzzle-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:puzzle"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "puzzle2d"
app = "puzzle2d-play"
aliases = ["2d"]
ports = { react = 6012, wgpu = 6112 }
engines = ["puzzle/2d/rs"]

[[package.metadata.semio.playground]]
variant = "puzzle3d"
app = "puzzle3d-play"
aliases = ["3d"]
ports = { react = 6013, wgpu = 6113 }

[[package.metadata.semio.playground]]
variant = "puzzle5d"
app = "puzzle5d-play"
aliases = ["5d"]
ports = { react = 6014, wgpu = 6114 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "puzzle3d-play"
roots = ["asset/metabolism/representation", "asset/abbau-aufbau"]
placeholder = "asset/mesh/placeholder.glb"
filter_from_examples = true

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/infinite-fixture"
app = "puzzle3d-play"
root = "infinite/fixture"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
ui_wgpu = { path = "../../../ui/wgpu/rs" }
vcs = { path = "../../../vcs/rs" }
puzzle_2d = { path = "../../2d/rs" }
puzzle_3d = { path = "../../3d/rs" }
puzzle_5d = { path = "../../5d/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
