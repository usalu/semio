[package]
name = "puzzle2d-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:puzzle2d"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../../framework/plugin/rs" }
puzzle_2d = { path = "../../rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
