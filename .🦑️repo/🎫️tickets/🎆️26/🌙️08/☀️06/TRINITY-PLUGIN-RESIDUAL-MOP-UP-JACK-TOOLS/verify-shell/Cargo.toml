cargo-features = ["trim-paths"]

[package]
name = "semio-s-plugin-trinity-jack-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Jack query REPL — a shell tool over trinity graphs"

[[bin]]
name = "semio-s-plugin-trinity-jack-shell"
path = "/Users/ueli/Documents/semio/✏️s/🔌️plugins/🔱️trinity/🔨️modules/🔌️jack/🐚️shell/📦️packages/🦀️rust/📦️bin.rs"

[dependencies]
trinity = { path = "/Users/ueli/Documents/semio/✏️s/🔌️plugins/🔱️trinity/📦️packages/🦀️rust", package = "semio-s-plugin-trinity" }
semio-framework-os-kernel = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
thiserror = "2.0.18"

[workspace]

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
