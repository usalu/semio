# #region 🔖Compose
# Dev stack: workspace app container + Neo4j 5 Community. In-container tools use bolt://neo4j:7687; native clients use the published localhost Bolt/HTTP ports.
services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p password 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  semio:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    shm_size: 1gb
    environment:
      DEVCONTAINER: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      NEO4J_TELEMETRY: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspaces/semio:cached
    command: ["sleep", "infinity"]
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
# #endregion 🔖Compose
