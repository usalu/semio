# #region 🔖️Compose
# Dev stack: a single workspace app container.
name: compose
services:
  compose:
    image: compose
    container_name: compose
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: 1gb
    environment:
      DEVCONTAINER: "true"
    volumes:
      - ..:/workspaces/semio:cached
    command: ["sleep", "infinity"]
# #endregion 🔖️Compose
