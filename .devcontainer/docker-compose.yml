# #region 🔖Compose
# Dev stack: workspace app container + Neo4j 5. MCP uses bolt://neo4j:7687. semio-entrypoint.sh + neo4j-host-forward.sh bind :7687/:7474 to neo4j; semio publishes 127.0.0.1:7687, 127.0.0.1:17687 (spare), and 127.0.0.1:7474 on the Docker host.
services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p password 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  semio:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspaces/semio:cached
    entrypoint:
      - /bin/bash
      - /workspaces/semio/.devcontainer/semio-entrypoint.sh
    command: ["sleep", "infinity"]
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:17687:7687"
      - "127.0.0.1:7474:7474"

volumes:
  neo4j-data:
# #endregion 🔖Compose
