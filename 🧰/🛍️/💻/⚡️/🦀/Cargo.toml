[package]
name = "semio-framework-os"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Plugin-based OS kernel: hot-swappable WASM plugins, workflow, document VCS"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib"]
path = "📦.rs"

[dependencies]
semio-framework-core = { path = "../../../../⚡️/🦀", package = "semio-framework-core" }
semio-framework-plugin = { path = "../../🔨/plugin/⚡️/🦀", package = "semio-framework-plugin" }
ui_wgpu = { path = "../../../../🔨/ui/⚡️/🦀/wgpu", package = "ui_wgpu" }
kernel_3d_brepkit = { path = "../../../../../✏️/🔨/3d/⚡️/🦀/brep", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../../../../✏️/🔨/3d/⚡️/🦀/brep/engine", package = "semio-framework-os-kernel-3d-brep-engine" }
vcs = { path = "../../🔨/vcs/⚡️/🦀", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../🔨/store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../🔨/protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../🔨/dsl/⚡️/🦀", package = "semio-framework-os-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
base64 = "0.22.1"
png = "0.17.16"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.45.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
store_sync = { path = "../../🔨/store/⚡️/🦀/sync", package = "semio-framework-os-kernel-store-sync" }
tokio = { version = "1", features = ["sync"], default-features = false }
uuid = { version = "1.20", features = ["v7", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.20", features = ["v7", "serde", "js"] }
wasm-bindgen = "0.2.106"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
pretty_assertions = "1.4.1"
