[package]
name = "semio-framework-os-kernel-db-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db engine — Database supervisor, catalog actor, open/recovery, document lifecycle, VersionGraph impl over vcs, sagas, migration"

[lints]
workspace = true
[lib]
name = "db_engine"
path = "📦.rs"

[dependencies]
db_core = { path = "../core", package = "semio-framework-os-kernel-db-core" }
db_actor = { path = "../actor", package = "semio-framework-os-kernel-db-actor" }
db_document = { path = "../document", package = "semio-framework-os-kernel-db-document" }
db_storage = { path = "../storage", package = "semio-framework-os-kernel-db-storage" }
db_wal = { path = "../wal", package = "semio-framework-os-kernel-db-wal" }
db_compact = { path = "../compact", package = "semio-framework-os-kernel-db-compact" }
db_sync = { path = "../sync", package = "semio-framework-os-kernel-db-sync" }
db_security = { path = "../security", package = "semio-framework-os-kernel-db-security" }
db_observe = { path = "../observe", package = "semio-framework-os-kernel-db-observe" }
db_cluster = { path = "../cluster", package = "semio-framework-os-kernel-db-cluster" }
protocol = { path = "../../../../protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
vcs = { path = "../../../../vcs/⚡️/🦀", optional = true, package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../store/⚡️/🦀", optional = true, package = "semio-framework-os-kernel-store" }
# 🎯 Genuinely missing additions (not in the stub's dependency list), noted per the wave's
# instructions: `pack_core` because the frozen `CommandReceipt.state_hash` field is typed
# `pack_core::ContentHash` verbatim in the contract, and this crate names that path directly
# (not just via `db_document`/`db_wal`'s own re-exports); `serde`+`serde_json` because this crate's
# catalog root encoding and its `vcs` feature's schema-erased `HashProjection`/`HashOperation`
# (see `//#region 🔖VersionGraph`) need `derive(Serialize, Deserialize)` directly.
pack_core = { path = "../../../../pack/⚡️/🦀/core", package = "semio-framework-os-kernel-pack-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["vcs"]
vcs = ["dep:vcs", "dep:store"]
tokio = []

