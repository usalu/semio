[package]
name = "semio-framework-os-kernel-db-snapshot"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Db snapshots — pack files with pages in KIND_CHUNK, descriptor in KIND_SNAPSHOT, incremental generations via footer chaining"

[lints]
workspace = true
[lib]
name = "db_snapshot"
path = "📦.rs"

[dependencies]
db_core = { path = "../core", package = "semio-framework-os-kernel-db-core" }
db_state = { path = "../state", package = "semio-framework-os-kernel-db-state" }
db_storage = { path = "../storage", package = "semio-framework-os-kernel-db-storage" }
pack = { path = "../../../../pack/⚡️/🦀", package = "semio-framework-os-kernel-pack" }
