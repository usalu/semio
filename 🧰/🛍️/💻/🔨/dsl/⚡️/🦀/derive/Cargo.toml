[package]
name = "semio-framework-os-kernel-dsl-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Proc-macros compiling #[dsl(...)]-annotated struct/enum declarations into vcs::DocumentDsl/OpText impls"


[lints]
workspace = true
[lib]
name = "dsl_derive"
proc-macro = true
path = "📦.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
