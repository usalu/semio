[package]
name = "semio-framework-os-kernel-dsl-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Token-transaction editor: undo/redo history, selections, bracket-matching navigation, completion-to-transaction bridge"


[lints]
workspace = true
[lib]
name = "dsl_editor"
path = "📦.rs"

[dependencies]
dsl_core = { path = "../core", package = "semio-framework-os-kernel-dsl-core" }
dsl_token = { path = "../token", package = "semio-framework-os-kernel-dsl-token" }
dsl_schema = { path = "../schema", package = "semio-framework-os-kernel-dsl-schema" }
