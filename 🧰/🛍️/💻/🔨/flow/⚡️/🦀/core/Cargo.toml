[package]
name = "semio-framework-os-kernel-flow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "flow_core"
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
vcs = { path = "../../../../vcs/⚡️/🦀", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../dsl/⚡️/🦀", package = "semio-framework-os-kernel-dsl" }
flow_module_brep = { path = "../module/brep", default-features = false, package = "semio-s-kernel-flow-module-brep" }
flow_module_draw = { path = "../module/draw", default-features = false, package = "semio-s-kernel-flow-module-draw" }
flow_module_bim = { path = "../module/bim", default-features = false, package = "semio-s-kernel-flow-module-bim" }
flow_module_core = { path = "../module/core", default-features = false, package = "semio-s-kernel-flow-module-core" }
flow_module_dictionary = { path = "../module/dictionary", default-features = false, package = "semio-s-kernel-flow-module-dictionary" }
flow_module_list = { path = "../module/list", default-features = false, package = "semio-s-kernel-flow-module-list" }
flow_module_logic = { path = "../module/logic", default-features = false, package = "semio-s-kernel-flow-module-logic" }
flow_module_math = { path = "../module/math", default-features = false, package = "semio-s-kernel-flow-module-math" }
flow_module_text = { path = "../module/text", default-features = false, package = "semio-s-kernel-flow-module-text" }
kernel_3d_engine = { path = "../../../../../../../../✏️/🔨/3d/⚡️/🦀/brep/engine", features = ["parallel"], package = "semio-framework-os-kernel-3d-brep-engine" }
semio-framework-core = { path = "../../../../../../../⚡️/🦀", package = "semio-framework-core" }
neural_engine = { path = "../../../../neural/⚡️/🦀/engine", features = ["parallel"], package = "semio-framework-os-kernel-neural-engine" }
neural_dag = { path = "../../../../neural/⚡️/🦀/dag", package = "semio-framework-kernel-neural-dag" }
mathematical_graph_manifest = { path = "../../../../../../../🔨/math/⚡️/🦀/graph/manifest", package = "semio-framework-os-kernel-math-graph-manifest" }
infinite_board_port_directed_dag = { path = "../../../../infinite/⚡️/🦀/board/port/directed/dag", package = "semio-framework-os-kernel-infinite-board-port-directed-dag" }
infinite_cavas = { path = "../../../../infinite/⚡️/🦀/canvas", package = "semio-framework-os-kernel-infinite-canvas" }
ui_styling = { path = "../../../../../../../🔨/ui/⚡️/🦀/styling", package = "ui_styling" }
playbook = { path = "../../../../workflow/⚡️/🦀", package = "semio-framework-os-kernel-workflow" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
