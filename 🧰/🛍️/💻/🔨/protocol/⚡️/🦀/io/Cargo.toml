[package]
name = "semio-framework-os-kernel-protocol-io"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol native append-only file lifecycle — create/open/resume, sidecars, recovery, tailing, compaction"


[lints]
workspace = true
[lib]
name = "protocol_io"
path = "📦.rs"

[dependencies]
protocol_core = { path = "../core", package = "semio-framework-os-kernel-protocol-core" }
protocol_format = { path = "../format", package = "semio-framework-os-kernel-protocol-format" }
protocol_history = { path = "../history", package = "semio-framework-os-kernel-protocol-history" }
pack_core = { path = "../../../../pack/⚡️/🦀/core", package = "semio-framework-os-kernel-pack-core" }
pack_io = { path = "../../../../pack/⚡️/🦀/io", package = "semio-framework-os-kernel-pack-io" }
