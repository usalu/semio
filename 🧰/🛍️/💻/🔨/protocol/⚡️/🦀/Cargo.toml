[package]
name = "semio-framework-os-kernel-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Protocol facade — command/collaboration semantics and binary op-log format, re-exporting the full protocol_* family"


[lints]
workspace = true
[lib]
name = "protocol"
path = "📦.rs"

[features]
default = ["deflate"]
deflate = ["protocol_format/deflate"]

[dependencies]
protocol_core = { path = "core", package = "semio-framework-os-kernel-protocol-core" }
protocol_command = { path = "command", package = "semio-framework-os-kernel-protocol-command" }
protocol_causal = { path = "causal", package = "semio-framework-os-kernel-protocol-causal" }
protocol_crdt = { path = "crdt", package = "semio-framework-os-kernel-protocol-crdt" }
protocol_format = { path = "format", package = "semio-framework-os-kernel-protocol-format" }
protocol_history = { path = "history", package = "semio-framework-os-kernel-protocol-history" }
protocol_materialize = { path = "materialize", package = "semio-framework-os-kernel-protocol-materialize" }
protocol_wire = { path = "wire", package = "semio-framework-os-kernel-protocol-wire" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
protocol_io = { path = "io", package = "semio-framework-os-kernel-protocol-io" }
