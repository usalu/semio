[package]
name = "semio-framework-os-kernel-infinite-board-port-directed-dag"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "infinite_board_port_directed_dag"
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
vcs = { path = "../../../../../../../vcs/⚡️/🦀", package = "semio-framework-os-kernel-vcs" }
store = { path = "../../../../../../../store/⚡️/🦀", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../../protocol/⚡️/🦀", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../../../dsl/⚡️/🦀", package = "semio-framework-os-kernel-dsl" }
ui_styling = { path = "../../../../../../../../../../🔨/ui/⚡️/🦀/styling", package = "ui_styling" }
infinite_board_port_directed = { path = "..", package = "semio-framework-os-kernel-infinite-board-port-directed" }
mathematical_graph_manifest = { path = "../../../../../../../../../../🔨/math/⚡️/🦀/graph/manifest", package = "semio-framework-os-kernel-math-graph-manifest" }
mathematical_graph_dsl = { path = "../../../../../../../../../../🔨/math/⚡️/🦀/graph/dsl", package = "semio-framework-os-kernel-math-graph-dsl" }
mathematical_graph_drawing = { path = "../../../../../../../../../../🔨/math/⚡️/🦀/graph/drawing", package = "semio-framework-os-kernel-math-graph-drawing" }
mathematical_graph = { path = "../../../../../../../../../../🔨/math/⚡️/🦀/graph", package = "semio-framework-os-kernel-math-graph" }
infinite_cavas = { path = "../../../../canvas", package = "semio-framework-os-kernel-infinite-canvas" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
