mathematical_graph_drawing = { path = "../../../../../../../🔨/math/⚡️/🦀/graph/drawing", package = "semio-framework-os-kernel-math-graph-drawing" }
mathematical_geometry = { path = "../../../../../../../🔨/math/⚡️/🦀/geometry", package = "semio-framework-os-kernel-math-geometry" }
mathematical_graph_manifest = { path = "../../../../../../../🔨/math/⚡️/🦀/graph/manifest", package = "semio-framework-os-kernel-math-graph-manifest" }
serde = { version = "1.0.219", features = ["derive"] }
