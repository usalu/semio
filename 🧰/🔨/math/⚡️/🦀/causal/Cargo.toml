[package]
name = "semio-framework-os-kernel-math-causal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "mathematical_causal"
crate-type = ["rlib"]
path = "📦.rs"

[dependencies]
mathematical_algebra = { path = "../algebra", package = "semio-framework-os-kernel-math-algebra" }
mathematical_graph = { path = "../graph", package = "semio-framework-os-kernel-math-graph" }
mathematical_probability = { path = "../probability", package = "semio-framework-os-kernel-math-probability" }
mathematical_random = { path = "../random", package = "semio-framework-os-kernel-math-random" }
mathematical_statistics = { path = "../statistics", package = "semio-framework-os-kernel-math-statistics" }
mathematical_tabular = { path = "../tabular", package = "semio-framework-os-kernel-math-tabular" }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
