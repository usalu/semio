[package]
name = "semio-framework-os-kernel-math-graph-dsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "mathematical_graph_dsl"
crate-type = ["rlib", "cdylib"]
path = "📦.rs"

[dependencies]
dsl_core = { path = "../../../../../../🛍️/💻/🔨/dsl/⚡️/🦀/core", package = "semio-framework-os-kernel-dsl-core" }
dsl_schema = { path = "../../../../../../🛍️/💻/🔨/dsl/⚡️/🦀/schema", package = "semio-framework-os-kernel-dsl-schema" }
mathematical_graph_manifest = { path = "../manifest", package = "semio-framework-os-kernel-math-graph-manifest" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
