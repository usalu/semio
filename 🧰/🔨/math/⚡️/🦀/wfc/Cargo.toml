[package]
name = "semio-framework-os-kernel-math-wfc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lints]
workspace = true

[lib]
name = "mathematical_wfc"
crate-type = ["rlib"]
path = "📦.rs"

[dependencies]
mathematical_graph = { path = "../graph", package = "semio-framework-os-kernel-math-graph" }
mathematical_random = { path = "../random", package = "semio-framework-os-kernel-math-random" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
mathematical_entropy = { path = "../entropy", package = "semio-framework-os-kernel-math-entropy" }
