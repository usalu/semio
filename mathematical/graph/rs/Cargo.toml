[package]
name = "mathematical_graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
ui_styling = { path = "../../../ui/styling/rs" }
mathematical_core = { path = "../../core/rs" }
mathematical_geometry = { path = "../../geometry/rs" }
mathematical_graph_manifest = { path = "../manifest/rs" }
infinite_cavas = { path = "../../../infinite/cavas/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
