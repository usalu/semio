[package]
name = "mathematical_graph_dsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
dsl_core = { path = "../../../../dsl/core/rs" }
dsl_schema = { path = "../../../../dsl/schema/rs" }
mathematical_graph_manifest = { path = "../../manifest/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
