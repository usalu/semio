[package]
name = "mathematical-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:mathematical"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "mathematical"
app = "mathematical-play"
aliases = ["mathematical", "math"]
ports = { react = 6084, wgpu = 6184 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
mathematical_graph = { path = "../../graph/rs" }
mathematical_graph_drawing = { path = "../../graph/drawing/rs" }
mathematical_geometry = { path = "../../geometry/rs" }
mathematical_algebra = { path = "../../algebra/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
vcs = { path = "../../../vcs/rs" }
dsl = { path = "../../../dsl/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
