[package]
name = "mathematical_wfc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_graph = { path = "../../graph/rs" }
mathematical_random = { path = "../../random/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
mathematical_entropy = { path = "../../entropy/rs" }
