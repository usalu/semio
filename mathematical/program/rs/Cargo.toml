[package]
name = "mathematical-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:mathematical"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "mathematical"
app = "mathematical-play"
aliases = ["mathematical", "math"]
ports = { react = 6084, wgpu = 6184 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
mathematical_graph = { path = "../../../s/kernel/mathematical/graph/rs", package = "semio-s-kernel-mathematical-graph" }
mathematical_graph_drawing = { path = "../../../s/kernel/mathematical/graph/drawing/rs", package = "semio-s-kernel-mathematical-graph-drawing" }
mathematical_geometry = { path = "../../../s/kernel/mathematical/geometry/rs", package = "semio-s-kernel-mathematical-geometry" }
mathematical_algebra = { path = "../../../s/kernel/mathematical/algebra/rs", package = "semio-s-kernel-mathematical-algebra" }
semio-framework-program = { path = "../../../framework/program/rs" }
vcs = { path = "../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../s/kernel/protocol/rs", package = "semio-s-kernel-protocol" }
dsl = { path = "../../../s/kernel/dsl/rs", package = "semio-s-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
