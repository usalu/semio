[package]
name = "mathematical_causal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_algebra = { path = "../../algebra/rs" }
mathematical_graph = { path = "../../graph/rs" }
mathematical_probability = { path = "../../probability/rs" }
mathematical_random = { path = "../../random/rs" }
mathematical_statistics = { path = "../../statistics/rs" }
mathematical_tabular = { path = "../../tabular/rs" }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
