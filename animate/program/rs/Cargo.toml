[package]
name = "animate-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:animate"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "animate"
ports = { react = 6051, wgpu = 6151 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
animate_present = { path = "../../present/rs" }
animate_video = { path = "../../video/rs" }
protocol = { path = "../../../protocol/rs" }
vcs = { path = "../../../vcs/rs" }
store = { path = "../../../store/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
semio-framework-program = { path = "../../../framework/program/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
