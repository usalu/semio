[package]
name = "animate_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Manim-class animation core: Sobject scene graph, timeline, and animation composites"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
mathematical_geometry = { path = "../../../s/kernel/mathematical/geometry/rs", package = "semio-s-kernel-mathematical-geometry" }
framework_hash = { package = "semio-framework-hash", path = "../../../framework/hash/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
kurbo = "0.13.1"
usvg = "0.45.1"
typst = "0.14.2"
typst-svg = "0.14.2"
typst-assets = { version = "0.14.2", features = ["fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22.1"
fontdb = { version = "0.23.0", default-features = false }
ecow = "0.2.6"
thiserror = "2.0.12"
comemo = "0.5.1"
