[package]
name = "animate_present"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Headless presentation compiler: deck documents and static wgpu-ready sites"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
animate_core = { path = "../../core/rs" }
animate_video = { path = "../../video/rs" }
vcs = { path = "../../../s/kernel/vcs/rs", package = "semio-s-kernel-vcs" }
store = { path = "../../../s/kernel/store/rs", package = "semio-s-kernel-store" }
protocol = { path = "../../../s/kernel/protocol/rs", package = "semio-s-kernel-protocol" }
dsl = { path = "../../../s/kernel/dsl/rs", package = "semio-s-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
