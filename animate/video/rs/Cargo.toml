[package]
name = "animate_video"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
animate_core = { path = "../../core/rs" }
infinite_cavas = { path = "../../../infinite/cavas/rs" }
mathematical_geometry = { path = "../../../mathematical/geometry/rs" }
semio-framework-hash = { path = "../../../framework/hash/rs" }
vello = { version = "0.7.0", features = ["wgpu", "wgpu_default"] }
wgpu = "27.0.1"
pollster = "0.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
image = { version = "0.25", default-features = false, features = ["png"] }
