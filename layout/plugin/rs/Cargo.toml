[package]
name = "layout-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:layout"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "layout"
ports = { react = 6079, wgpu = 6179 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
semio-framework-os = { path = "../../../framework/product/os/core/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
layout_rs = { path = "../../rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

