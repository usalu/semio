[package]
name = "layout_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
infinite_cavas = { path = "../../infinite/cavas/rs" }
vcs = { path = "../../vcs/rs" }
protocol = { path = "../../protocol/rs" }
dsl = { path = "../../dsl/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
parley = { version = "0.5.0" }
swash = { version = "0.2.6", default-features = false, features = ["render", "std"] }
fontique = "0.4.0"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
