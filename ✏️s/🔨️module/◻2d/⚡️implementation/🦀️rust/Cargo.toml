[package]
name = "semio-s-kernel-geometry-2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "kernel_2d_rs"
path = "../../../../../✏️s/🔨️module/◻2d/⚡️implementation/🦀️rust/📦️lib.rs"

[features]
default = ["booleans", "trace"]
