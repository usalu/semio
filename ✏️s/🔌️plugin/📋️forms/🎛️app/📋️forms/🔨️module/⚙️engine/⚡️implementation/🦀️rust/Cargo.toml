forms_dsl = { path = "../../../../../../../../../✏️s/🔌️plugin/📋️forms/🎛️app/📋️forms/🔨️module/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-s-app-forms-dsl" }
playbook = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/📖️playbook/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-playbook" }
