# port recipe) — a direct dependency on the core crate is the minimal fix, mirroring how the plugin
# crate itself depends on it.
semio-framework-core = { path = "../../../../../../../../../🧰️framework/⚡️implementation/🦀️rust", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
