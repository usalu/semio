[package]
name = "semio-s-app-cad-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Cad app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "../../../../../../../../../✏️s/🔌️plugin/📐️cad/🎛️app/📐️cad/🔨️module/⚙️engine/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
cad_document = { path = "../../../../../../../../../✏️s/🔌️plugin/📐️cad/🎛️app/📐️cad/⚡️implementation/🦀️rust", package = "semio-s-app-cad" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🔌️plugin/⚡️implementation/🦀️rust", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../../../🧰️framework/⚡️implementation/🦀️rust", package = "semio-framework-core" }
kernel_3d_brepkit = { path = "../../../../../../../../🔨️module/🧊️3d/📐️brep/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../../../../../../../🔨️module/🧊️3d/📐️brep/⚙️engine/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-3d-brep-engine" }
mathematical_graph_dsl = { path = "../../../../../../../../../🧰️framework/🔨️module/🧮️math/🕸️graph/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph-dsl" }
mathematical_graph_manifest = { path = "../../../../../../../../../🧰️framework/🔨️module/🧮️math/🕸️graph/🛂️manifest/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-math-graph-manifest" }
# 🧮️ `CadConfig` (WORKFLOWS-END-TO-END-TYPED-PORTS config recipe) is a real `dsl::DslDocument` /
# `store::ConfigRecord` / `protocol::OperationDiff` — needs the dsl/store/protocol trio directly,
# mirroring `shooting_engine`'s dependency set for its own `ShootingConfig`.
dsl = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-protocol" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
