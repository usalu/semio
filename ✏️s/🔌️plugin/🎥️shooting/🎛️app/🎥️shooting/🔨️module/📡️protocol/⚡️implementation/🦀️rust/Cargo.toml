[package]
name = "semio-s-app-shooting-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Shooting app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../✏️s/🔌️plugin/🎥️shooting/🎛️app/🎥️shooting/🔨️module/📡️protocol/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
shooting = { path = "../../../../../../../../../✏️s/🔌️plugin/🎥️shooting/🎛️app/🎥️shooting/⚡️implementation/🦀️rust", package = "semio-s-app-shooting" }
shooting_op = { path = "../../../../../../../../../✏️s/🔌️plugin/🎥️shooting/🎛️app/🎥️shooting/🔨️module/🔧️op/⚡️implementation/🦀️rust", package = "semio-s-app-shooting-op" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store" }
dsl = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
