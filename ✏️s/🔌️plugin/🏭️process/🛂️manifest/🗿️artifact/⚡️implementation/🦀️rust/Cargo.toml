[package]
name = "semio-s-plugin-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:process"

[package.metadata.semio]
consumes = ["process.machines"]

[[package.metadata.semio.playground]]
variant = "process3d"
app = "process3d-play"
