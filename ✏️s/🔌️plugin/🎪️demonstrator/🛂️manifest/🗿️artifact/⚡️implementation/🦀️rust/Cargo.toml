process_3d = { path = "../../../../../../../✏️s/🔌️plugin/🏭️process/🎛️app/🧊️3d/⚡️implementation/🦀️rust", package = "semio-s-app-process-3d" }
process_3d_engine = { path = "../../../../../../../✏️s/🔌️plugin/🏭️process/🎛️app/🧊️3d/🔨️module/⚙️engine/⚡️implementation/🦀️rust", package = "semio-s-app-process-3d-engine" }
