[package]
name = "semio-s-plugin-sourcing"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:sourcing"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "sourcing"
app = "sourcing-curate"
aliases = ["curate"]
ports = { react = 6081, wgpu = 6181 }

[[package.metadata.semio.playground]]
variant = "aussuchen"
app = "sourcing-curate"
brand = "entwerfen-mit-bestand-aussuchen"
aliases = ["entwerfen-mit-bestand-aussuchen"]
ports = { react = 6030, wgpu = 6130 }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌️plugin/🪵️sourcing/🛂️manifest/🗿️artifact/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
sourcing = { path = "../../../../../../../✏️s/🔌️plugin/🪵️sourcing/🎛️app/🗂️curate/⚡️implementation/🦀️rust", package = "semio-s-app-sourcing-curate" }
sourcing_ui = { path = "../../../../../../../✏️s/🔌️plugin/🪵️sourcing/🎛️app/🗂️curate/🔨️module/🖱️ui/⚡️implementation/🦀️rust", package = "semio-s-app-sourcing-curate-ui" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🔌️plugin/⚡️implementation/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
