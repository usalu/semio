[package]
name = "animate_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Manim-class animation core: Sobject scene graph, timeline, and animation composites"


[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "../../../../../../../✏️s/🔌️plugin/🎞️animate/🔨️module/🫀️core/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
