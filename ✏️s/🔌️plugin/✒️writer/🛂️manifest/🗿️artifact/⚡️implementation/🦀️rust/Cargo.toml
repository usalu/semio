framework_editor = { path = "../../../../../../../🧰️framework/🔨️module/✍️editor/⚡️implementation/🦀️rust", package = "semio-framework-editor" }
writer = { path = "../../../../../../../✏️s/🔌️plugin/✒️writer/🎛️app/✒️writer/⚡️implementation/🦀️rust", package = "semio-s-app-writer" }
