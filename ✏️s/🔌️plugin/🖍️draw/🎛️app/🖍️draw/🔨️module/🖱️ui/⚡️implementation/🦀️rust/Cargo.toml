[package]
name = "semio-s-app-draw-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../✏️s/🔌️plugin/🖍️draw/🎛️app/🖍️draw/🔨️module/🖱️ui/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
draw = { path = "../../../../../../../../../✏️s/🔌️plugin/🖍️draw/🎛️app/🖍️draw/⚡️implementation/🦀️rust", package = "semio-s-app-draw" }
draw_engine = { path = "../../../../../../../../../✏️s/🔌️plugin/🖍️draw/🎛️app/🖍️draw/🔨️module/⚙️engine/⚡️implementation/🦀️rust", package = "semio-s-app-draw-engine" }
draw_op = { path = "../../../../../../../../../✏️s/🔌️plugin/🖍️draw/🎛️app/🖍️draw/🔨️module/🔧️op/⚡️implementation/🦀️rust", package = "semio-s-app-draw-op" }
fsm = { path = "../../../../../../../../../✏️s/🔌️plugin/🖍️draw/🔨️module/🔄️fsm/⚡️implementation/🦀️rust", package = "fsm" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🔌️plugin/⚡️implementation/🦀️rust", package = "semio-framework-plugin" }
store = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
