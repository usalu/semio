[package]
name = "semio-s-app-block-5d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Block 5D app — headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "../../../../../../../../../✏️s/🔌️plugin/🧱️block/🎛️app/🖐️5d/🔨️module/⚙️engine/⚡️implementation/🦀️rust/📦️lib.rs"

[dependencies]
block_5d = { path = "../../../../../../../../../✏️s/🔌️plugin/🧱️block/🎛️app/🖐️5d/⚡️implementation/🦀️rust", package = "semio-s-app-block-5d" }
block_shared = { path = "../../../../../../../../../✏️s/🔌️plugin/🧱️block/🔨️module/🤝️shared/⚡️implementation/🦀️rust", package = "semio-s-plugin-block-shared" }
store = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🏪️store/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-store" }
dsl = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🗣️dsl/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/📡️protocol/⚡️implementation/🦀️rust", package = "semio-framework-os-kernel-protocol" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️product/💻️os/🔨️module/🔌️plugin/⚡️implementation/🦀️rust", package = "semio-framework-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
