[package]
name = "semio-s-plugin-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Raster plugin - one crate for the raster artifact (diff/op/dsl/pack/spr/engine) and the raster play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:raster"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "raster"
ports = { react = 6060, wgpu = 6160 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/🎨️paint/⚡️implementations/🦀️rust"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }

# 🚧️ TEMPORARY VERIFICATION OVERLAY — delete this whole block (and the nested target/Cargo.lock it
# creates) at registrar handoff. Makes this manifest its own workspace root so `cargo check
# --manifest-path …` works before the crate is a real root-workspace member (see TEMPLATE.md §3,
# "The chicken-and-egg, and how to verify anyway"). Copied verbatim from root Cargo.toml.
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
thiserror = "2.0.18"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
# END TEMPORARY VERIFICATION OVERLAY
