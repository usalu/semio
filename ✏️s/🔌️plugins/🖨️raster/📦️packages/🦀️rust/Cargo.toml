[package]
name = "semio-s-plugin-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Raster plugin - one crate for the raster artifact (diff/op/dsl/pack/spr/engine) and the raster play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:raster"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "raster"
ports = { react = 6060, wgpu = 6160 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-core = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework-core" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
