[package]
name = "semio-s-app-raster-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Raster app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "../../../../../../../../../✏️s/🔌️plugins/🖨️raster/🎛️apps/🖨️raster/🔨️modules/⚙️engine/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
raster = { path = "../../../../../../../../../✏️s/🔌️plugins/🖨️raster/🎛️apps/🖨️raster/⚡️implementations/🦀️rust", package = "semio-s-app-raster" }
raster_dsl = { path = "../../../../../../../../../✏️s/🔌️plugins/🖨️raster/🎛️apps/🖨️raster/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-s-app-raster-dsl" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-framework-os = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
# 🧮️ WORKFLOWS-END-TO-END-TYPED-PORTS config recipe: `RasterConfig`'s `dsl::DslDocument` derive +
# `protocol::OperationDiff` impl (mirrors `shooting_engine`'s `ShootingConfig`).
dsl = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
# 🔌️ `AppIo`/`MediaPortSpec`/`Media` port surface (port recipe): direct core dependency, mirroring
# `shooting_engine`'s note that `semio-framework-plugin` doesn't re-export every core port type.
semio-framework-core = { path = "../../../../../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
