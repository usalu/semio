syntax = "proto3";
package semio.s.raster.raster.mutation;
import "✏️s/🔌️plugins/🖨️raster/🗿️artifacts/🖨️raster/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

message CreateLayer {
  optional string parent_id = 1;
  uint32 index = 2;
  bytes layer = 3; // RasterLayerNode, see ../📸️snapshot/🛰️.proto
}

message DeleteLayer {
  string layer_id = 1;
}

message ReorderLayers {
  string layer_id = 1;
  optional string parent_id = 2;
  uint32 index = 3;
}

message RenameLayer {
  string layer_id = 1;
  string new_name = 2;
}

message ChangeLayerLocked { string layer_id = 1; bool expected = 2; bool locked = 3; }

message ChangeLayerVisible {
  string layer_id = 1;
  bool new_visible = 2;
}

message ChangeLayerOpacity {
  string layer_id = 1;
  float new_opacity = 2;
}

message ChangeLayerBlendMode {
  string layer_id = 1;
  string new_blend_mode = 2;
}

message MoveLayer {
  string layer_id = 1;
  double new_x = 2;
  double new_y = 3;
}

message ResizeLayer {
  string layer_id = 1;
  uint32 new_width = 2;
  uint32 new_height = 3;
}

message ChangeLayerAdjustmentKind {
  string layer_id = 1;
  string new_adjustment_kind = 2;
}

message AddLayerAsset {
  string asset_id = 1;
  string mime = 2;
  bytes data = 3;
}

message RemoveLayerAsset {
  string asset_id = 1;
}

message RasterPixelContent {
  optional string image_key = 1;
  optional uint32 width = 2;
  optional uint32 height = 3;
}
message ChangeLayerPixels {
  string layer_id = 1;
  optional string expected_image_key = 2;
  RasterPixelContent content = 3;
  optional semio.s.raster.raster.artifact.RasterTransform transform = 4;
}
message ChangeLayerMask {
  string layer_id = 1;
  optional semio.s.raster.raster.artifact.RasterLayerMask expected = 2;
  optional semio.s.raster.raster.artifact.RasterLayerMask mask = 3;
}
message ChangeLayerAdjustmentParameter { string layer_id = 1; string parameter = 2; optional double expected = 3; optional double value = 4; }
message ChangeLayerTransform {string layer_id = 1; semio.s.raster.raster.artifact.RasterTransform expected = 2; semio.s.raster.raster.artifact.RasterTransform transform = 3;}
message RasterStrokePoint { double x = 1; double y = 2; }
message RasterBrush { double size = 1; double hardness = 2; double opacity = 3; repeated double color = 4; }
message RasterSelectionSpan { uint32 start = 1; uint32 length = 2; uint32 coverage = 3; }
message RasterSelection { repeated RasterSelectionSpan spans = 1; }
message PaintStroke { string layer_id = 1; string target = 2; string tool = 3; RasterBrush brush = 4; repeated RasterStrokePoint points = 5; optional RasterSelection selection = 6; }
message RasterSeed { uint32 x = 1; uint32 y = 2; }
message FillRegion { string layer_id = 1; string target = 2; RasterSeed seed = 3; uint32 tolerance = 4; repeated double color = 5; optional RasterSelection selection = 6; }
message RasterMutation {
  oneof mutation {
    CreateLayer create_layer = 1;
    DeleteLayer delete_layer = 2;
    ReorderLayers reorder_layers = 3;
    RenameLayer rename_layer = 4;
    ChangeLayerVisible change_layer_visible = 5;
    ChangeLayerLocked change_layer_locked = 16;
    ChangeLayerOpacity change_layer_opacity = 6;
    ChangeLayerBlendMode change_layer_blend_mode = 7;
    MoveLayer move_layer = 8;
    ResizeLayer resize_layer = 9;
    ChangeLayerAdjustmentKind change_layer_adjustment_kind = 10;
    AddLayerAsset add_layer_asset = 11;
    RemoveLayerAsset remove_layer_asset = 12;
    ChangeLayerPixels change_layer_pixels = 13;
    ChangeLayerMask change_layer_mask = 14;
    ChangeLayerTransform change_layer_transform = 17;
    ChangeLayerAdjustmentParameter change_layer_adjustment_parameter = 15;
    PaintStroke paint_stroke = 18;
    FillRegion fill_region = 19;
  }
}
