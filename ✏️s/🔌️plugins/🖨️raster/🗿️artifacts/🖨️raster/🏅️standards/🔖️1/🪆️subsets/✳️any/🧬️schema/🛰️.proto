// 🧬️ Raster artifact schema — every field with its state class.
syntax = "proto3";
package semio.s.raster.raster.artifact;
import "🧰️framework/🔨️modules/🌱️value/🧬️schema/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";

message RasterArtifact {
  string schema = 1;
  string id = 2;
  optional string title = 3;
  repeated RasterLayerNode layers = 4;
  map<string, semio.os.store.ArtifactChild> assets = 5;
}

message RasterLayerNode {
  oneof node {
    RasterLayerPixel pixel = 1;
    RasterLayerGroup group = 2;
    RasterLayerAdjustment adjustment = 3;
  }
}

message RasterTransform {
  double x = 1;
  double y = 2;
  double a = 3;
  double b = 4;
  double c = 5;
  double d = 6;
}

message RasterLayerMask {
  bool enabled = 1;
  bool linked = 2;
  bool invert = 3;
  optional uint32 width = 4;
  optional uint32 height = 5;
  optional string image_key = 6;
  RasterTransform transform = 7;
}

message RasterLayerPixel {
  string id = 1;
  string name = 2;
  bool visible = 3;
  float opacity = 4;
  string blend_mode = 5;
  RasterTransform transform = 6;
  optional RasterLayerMask mask = 7;
  optional uint32 width = 8;
  optional uint32 height = 9;
  optional string image_key = 10;
  bool locked = 11;
}

message RasterLayerGroup {
  string id = 1;
  string name = 2;
  bool visible = 3;
  float opacity = 4;
  string blend_mode = 5;
  RasterTransform transform = 6;
  optional RasterLayerMask mask = 7;
  repeated RasterLayerNode children = 8;
  bool locked = 9;
}

message RasterParamEntry { string key = 1; semio.framework.value.DslValue value = 2; }
message RasterLayerAdjustment {
  string id = 1;
  string name = 2;
  bool visible = 3;
  float opacity = 4;
  string blend_mode = 5;
  RasterTransform transform = 6;
  string adjustment_kind = 7;
  repeated RasterParamEntry params = 8;
  bool locked = 9;
}


message RasterViewportSize {
  double width = 1;
  double height = 2;
}
