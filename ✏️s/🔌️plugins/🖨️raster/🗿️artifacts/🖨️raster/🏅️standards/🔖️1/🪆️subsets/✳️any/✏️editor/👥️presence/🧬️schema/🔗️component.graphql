type RasterPresenceCamera {
  x: Float! @state(class: PRESENCE)
  y: Float! @state(class: PRESENCE)
  zoom: Float! @state(class: PRESENCE)
}

type RasterPresence {
  brushSize: Float! @state(class: PRESENCE)
  brushOpacity: Float! @state(class: PRESENCE)
  camera: RasterPresenceCamera! @state(class: PRESENCE)
  activeUtilityId: String! @state(class: PRESENCE)
}
