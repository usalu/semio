# 🧬️ Raster artifact schema — every field with its state class.

type RasterArtifact {
  schema: String! @state(class: ARTIFACT)
  id: String! @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  layers: [RasterLayerNode!]! @state(class: ARTIFACT)
  assets: [RasterImageAssetEntry!]! @state(class: ARTIFACT)
  selectedIds: [String!]! @state(class: PRESENCE)
  activeUtilityId: String! @state(class: PRESENCE)
  brushSize: Float! @state(class: CONFIG)
  brushOpacity: Float! @state(class: CONFIG)
  compositeViewport: RasterViewportSize @state(class: CONFIG)
  cameraX: Float! @state(class: CONFIG)
  cameraY: Float! @state(class: CONFIG)
  cameraZoom: Float! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
  hoveredId: String @state(class: ARTIFACT)
}

type RasterLayerNode {
  kind: String!
}

type RasterImageAssetEntry {
  key: String!
  value: RasterImageAsset!
}

type RasterImageAsset {
  mime: String!
  data: String!
}

type RasterViewportSize {
  width: Float!
  height: Float!
}
