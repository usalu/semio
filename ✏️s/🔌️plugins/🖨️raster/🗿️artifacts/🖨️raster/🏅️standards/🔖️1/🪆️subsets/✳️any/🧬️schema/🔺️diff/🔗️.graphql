# import SemioImageSnapshot from "✏️s/🔌️plugins/🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/🖼️image/🧬️schema/📸️snapshot/🔗️.graphql"
# 🧬️ Raster diff schema — sparse field delta over the artifact.
# import RasterArtifact from "../🔗️.graphql"
# import RasterLayerNode from "../🔗️.graphql"

type RasterDiff {
  artifact: RasterArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  layers: RasterLayersDelta @state(class: ARTIFACT)
  assets: RasterAssetsDelta @state(class: ARTIFACT)
  pixels: [RasterPixelRegion!] @state(class: ARTIFACT)
}

type RasterAssetsDelta {
  entries: [RasterAssetsDeltaEntry!]!
}

type RasterAssetsDeltaEntry {
  key: String!
  value: SemioImageSnapshot
}

type RasterLayersDelta {
  removed: [RasterLayerRemoval!]!
  inserted: [RasterLayerInsertion!]!
  moved: [RasterLayerRelocation!]!
  modified: [RasterLayerModification!]!
}

type RasterLayerAddress {
  parentId: String
  index: Int!
}

type RasterLayerRemoval {
  id: String!
  parentId: String
  index: Int!
}

type RasterLayerInsertion {
  parentId: String
  index: Int!
  layer: RasterLayerNode!
}

type RasterLayerRelocation {
  id: String!
  from: RasterLayerAddress!
  to: RasterLayerAddress!
}

type RasterPixelRegion {
  layerId: String!
  target: String!
  x: Int!
  y: Int!
  width: Int!
  height: Int!
  samples: [Int!]!
}

type RasterLayerModification {
  id: String!
  patch: RasterLayerPatch!
}

type RasterPixelContent {
  imageKey: String
  width: Int
  height: Int
}

type RasterMaskContent {
  mask: RasterLayerMask
}

type RasterAdjustmentParameter {parameter: String! value: Float}

type RasterLayerPatch {
  adjustmentParameters: [RasterAdjustmentParameter!]
  maskContent: RasterMaskContent
  pixelContent: RasterPixelContent
  transform: RasterTransform
  name: String
  locked: Boolean
  visible: Boolean
  opacity: Float
  blendMode: String
  transformX: Float
  transformY: Float
  width: Int
  height: Int
  adjustmentKind: String
}
