type RasterCamera {
  x: Float! @state(class: CONFIG)
  y: Float! @state(class: CONFIG)
  zoom: Float! @state(class: CONFIG)
}

type RasterConfigViewportSize {
  width: Float! @state(class: CONFIG)
  height: Float! @state(class: CONFIG)
}

type RasterConfig {
  brushSize: Float! @state(class: CONFIG)
  brushOpacity: Float! @state(class: CONFIG)
  brushColor: String! @state(class: CONFIG)
  brushHardness: Float! @state(class: CONFIG)
  paintTarget: String! @state(class: CONFIG)
  maskValue: Int! @state(class: CONFIG)
  fillTolerance: Int! @state(class: CONFIG)
  filterKind: String! @state(class: CONFIG)
  filterAmount: Float! @state(class: CONFIG)
  imageGrid: RasterImageGrid! @state(class: CONFIG)
  pixelSelection: RasterPixelSelection @state(class: CONFIG)
  compositeViewport: RasterConfigViewportSize @state(class: CONFIG)
  camera: RasterCamera! @state(class: CONFIG)
}

type RasterPixelSelection {
  layerId: String! @state(class: CONFIG)
  target: String! @state(class: CONFIG)
  width: Int! @state(class: CONFIG)
  height: Int! @state(class: CONFIG)
  spans: [RasterSelectionSpan!]! @state(class: CONFIG)
}

type RasterImageGrid {
  x: Int! @state(class: CONFIG)
  y: Int! @state(class: CONFIG)
  width: Int! @state(class: CONFIG)
  height: Int! @state(class: CONFIG)
  bilinear: Boolean! @state(class: CONFIG)
}

type RasterSelectionSpan {
  start: Int!
  length: Int!
  coverage: Int!
}
