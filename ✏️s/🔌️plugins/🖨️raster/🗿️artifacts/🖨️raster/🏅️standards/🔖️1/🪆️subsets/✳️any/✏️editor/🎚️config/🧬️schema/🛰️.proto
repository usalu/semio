syntax = "proto3";
package semio.app.raster.raster;

message RasterCamera {
  // @state config
  double x = 1;
  // @state config
  double y = 2;
  // @state config
  double zoom = 3;
}

message RasterConfigViewportSize {
  // @state config
  double width = 1;
  // @state config
  double height = 2;
}

message RasterConfig {
  reserved 1, 2;
  // @state config
  double brush_size = 3;
  // @state config
  double brush_opacity = 4;
  // @state config
  optional RasterConfigViewportSize composite_viewport = 5;
  // @state config
  RasterCamera camera = 6;
  // @state config
  string active_utility_id = 7;
  // @state config
  string locale = 8;
}
