syntax = "proto3";
package semio.app.raster.raster;

message RasterCamera {
  // @state config
  double x = 1;
  // @state config
  double y = 2;
  // @state config
  double zoom = 3;
}

message RasterConfigViewportSize {
  // @state config
  double width = 1;
  // @state config
  double height = 2;
}

message RasterConfig {
  reserved 1, 2;
  // @state config
  double brush_size = 3;
  // @state config
  double brush_opacity = 4;
  // @state config
  optional RasterConfigViewportSize composite_viewport = 5;
  // @state config
  RasterCamera camera = 6;
  // @state config
  string brush_color = 7;
  // @state config
  double brush_hardness = 8;
  string paint_target = 9;
  uint32 mask_value = 10;
  optional RasterPixelSelection pixel_selection = 11;
  // @state config
}

message RasterPixelSelection {
  string layer_id = 1;
  string target = 2;
  uint32 width = 3;
  uint32 height = 4;
  string spans = 5;
}
