# 🧬️ RasterMutation — closed semantic mutation vocabulary for the raster document.

type CreateLayer {
  parentId: String
  index: Int!
  layer: RasterLayerNode!
}

type DeleteLayer {
  layerId: String!
}

type ReorderLayers {
  layerId: String!
  parentId: String
  index: Int!
}

type RenameLayer {
  layerId: String!
  newName: String!
}

type ChangeLayerLocked { layerId: String! expected: Boolean! locked: Boolean! }

type ChangeLayerVisible {
  layerId: String!
  newVisible: Boolean!
}

type ChangeLayerOpacity {
  layerId: String!
  newOpacity: Float!
}

type ChangeLayerBlendMode {
  layerId: String!
  newBlendMode: String!
}

type MoveLayer {
  layerId: String!
  newX: Float!
  newY: Float!
}

type ResizeLayer {
  layerId: String!
  newWidth: Int!
  newHeight: Int!
}

type ChangeLayerAdjustmentKind {
  layerId: String!
  newAdjustmentKind: String!
}

type AddLayerAsset {
  assetId: String!
  asset: RasterImageAsset!
}

type RemoveLayerAsset {
  assetId: String!
}

type ChangeLayerMask {
  layerId: String!
  expected: RasterLayerMask
  mask: RasterLayerMask
}

type ChangeLayerPixels {
  layerId: String!
  expectedImageKey: String
  content: RasterPixelContent!
  transform: RasterTransform
}

type RasterPixelContent {
  imageKey: String
  width: Int
  height: Int
}

type ChangeLayerAdjustmentParameter {layerId: String! parameter: String! expected: Float value: Float}

union RasterMutation =
    ChangeLayerAdjustmentParameter |
    CreateLayer
  | DeleteLayer
  | ReorderLayers
  | RenameLayer
  | ChangeLayerLocked
  | ChangeLayerVisible
  | ChangeLayerOpacity
  | ChangeLayerBlendMode
  | MoveLayer
  | ResizeLayer
  | ChangeLayerAdjustmentKind
  | AddLayerAsset
  | RemoveLayerAsset
  | ChangeLayerPixels
  | ChangeLayerMask
  | ChangeLayerTransform
  | PaintStroke
  | FillRegion

type ChangeLayerTransform {layerId: String! expected: RasterTransform! transform: RasterTransform!}

type RasterStrokePoint { x: Float!, y: Float! }
type RasterBrush { size: Float!, hardness: Float!, opacity: Float!, color: [Float!]! }
type RasterSelectionSpan { start: Int!, length: Int!, coverage: Int! }
type PaintStroke { layerId: String!, target: String!, tool: String!, brush: RasterBrush!, points: [RasterStrokePoint!]!, selection: [RasterSelectionSpan!] }
type RasterSeed { x: Int!, y: Int! }
type FillRegion { layerId: String!, target: String!, seed: RasterSeed!, tolerance: Int!, color: [Float!]!, selection: [RasterSelectionSpan!] }
