syntax = "proto3";
package semio.s.raster.raster.inference;

// 💡️ Raster inference schema — layer-tree topology (structural pre-order + nesting depth).

message RasterInference {
  // @state inferred
  RasterTopology topology = 1;
}

message RasterTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}
