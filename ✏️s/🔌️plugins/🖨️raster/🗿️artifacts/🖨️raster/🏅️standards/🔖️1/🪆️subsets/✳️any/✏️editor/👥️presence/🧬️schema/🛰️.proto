syntax = "proto3";
package semio.app.raster.raster;

message RasterPresenceCamera {
  // @state presence
  double x = 1;
  // @state presence
  double y = 2;
  // @state presence
  double zoom = 3;
}

message RasterPresence {
  reserved 1, 2;
  // @state presence
  double brush_size = 3;
  // @state presence
  double brush_opacity = 4;
  // @state presence
  RasterPresenceCamera camera = 5;
  // @state presence
  string active_utility_id = 6;
}

message RasterCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
