# 🧬️ Raster artifact schema — every field with its state class.
# import DslValue from "🧰️framework/🔨️modules/🌱️value/🧬️schema/🔗️.graphql"
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"

type RasterArtifact {
  schema: String! @state(class: ARTIFACT)
  id: String! @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  layers: [RasterLayerNode!]! @state(class: ARTIFACT)
  assets: [RasterAssetEntry!]! @state(class: ARTIFACT)
}

union RasterLayerNode = RasterLayerPixel | RasterLayerGroup | RasterLayerAdjustment

type RasterLayerPixel {
  kind: String!
  id: String!
  name: String!
  visible: Boolean!
  opacity: Float!
  blendMode: String!
  transform: RasterTransform!
  mask: RasterLayerMask
  width: Int
  height: Int
  imageKey: String
}

type RasterLayerGroup {
  kind: String!
  id: String!
  name: String!
  visible: Boolean!
  opacity: Float!
  blendMode: String!
  transform: RasterTransform!
  mask: RasterLayerMask
  children: [RasterLayerNode!]!
}

type RasterLayerAdjustment {
  kind: String!
  id: String!
  name: String!
  visible: Boolean!
  opacity: Float!
  blendMode: String!
  transform: RasterTransform!
  adjustmentKind: String!
  params: [RasterLayerParamEntry!]!
}

type RasterLayerParamEntry {
  key: String!
  value: DslValue!
}

type RasterAssetEntry {
  key: String!
  value: ArtifactChild!
}

type RasterImageAsset {
  mime: String!
  data: String!
}

type RasterTransform {
  x: Float!
  y: Float!
  scaleX: Float!
  scaleY: Float!
  rotation: Float!
}

type RasterLayerMask {
  enabled: Boolean!
  linked: Boolean!
  invert: Boolean!
  width: Int
  height: Int
}

type RasterViewportSize {
  width: Float!
  height: Float!
}
