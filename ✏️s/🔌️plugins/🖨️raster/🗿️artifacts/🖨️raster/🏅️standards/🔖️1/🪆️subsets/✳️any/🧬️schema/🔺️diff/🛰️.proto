syntax = "proto3";
package semio.s.raster.raster.diff;
import "✏️s/🔌️plugins/🖨️raster/🗿️artifacts/🖨️raster/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

message RasterAssetsDeltaEntry { string key = 1; optional semio.s.raster.raster.artifact.RasterImageAsset value = 2; }
message RasterAssetsDelta { repeated RasterAssetsDeltaEntry entries = 1; }
message RasterLayersDelta {
  repeated RasterLayerInsertion added = 1;
  repeated string removed = 2;
  repeated RasterLayerPatchEntry patched = 3;
  repeated RasterLayerMove moved = 4;
}
message RasterLayerInsertion {
  optional string parent_id = 1;
  uint64 index = 2;
  semio.s.raster.raster.artifact.RasterLayerNode layer = 3;
}
message RasterLayerMove { string id = 1; optional string parent_id = 2; uint64 index = 3; }
message RasterLayerPatchEntry { string id = 1; RasterLayerPatch patch = 2; }
message RasterLayerPatch {
  optional string name = 1;
  optional bool visible = 2;
  optional double opacity = 3;
  optional string blend_mode = 4;
  optional double transform_x = 5;
  optional double transform_y = 6;
  optional uint32 width = 7;
  optional uint32 height = 8;
  optional string adjustment_kind = 9;
}
message RasterDiff {
  optional semio.s.raster.raster.artifact.RasterArtifact artifact = 1;
  optional string schema = 2;
  optional string id = 3;
  optional string title = 4;
  optional RasterLayersDelta layers = 5;
  optional RasterAssetsDelta assets = 6;
}
