syntax = "proto3";
package semio.s.raster.raster.diff;
import "✏️s/🔌️plugins/🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/🖼️image/🧬️schema/📸️snapshot/🛰️.proto";
import "✏️s/🔌️plugins/🖨️raster/🗿️artifacts/🖨️raster/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

message RasterAssetsDeltaEntry { string key = 1; optional semio.s_stdio_semio_image.snapshot.SemioImageSnapshot value = 2; }
message RasterAssetsDelta { repeated RasterAssetsDeltaEntry entries = 1; }
message RasterLayersDelta {
  repeated RasterLayerRemoval removed = 1;
  repeated RasterLayerInsertion inserted = 2;
  repeated RasterLayerRelocation moved = 3;
  repeated RasterLayerModification modified = 4;
}
message RasterLayerAddress { optional string parent_id = 1; uint64 index = 2; }
message RasterLayerRemoval { string id = 1; optional string parent_id = 2; uint64 index = 3; }
message RasterLayerInsertion {
  optional string parent_id = 1;
  uint64 index = 2;
  semio.s.raster.raster.artifact.RasterLayerNode layer = 3;
}
message RasterLayerRelocation { string id = 1; RasterLayerAddress from = 2; RasterLayerAddress to = 3; }
message RasterPixelRegion { string layer_id = 1; string target = 2; uint32 x = 3; uint32 y = 4; uint32 width = 5; uint32 height = 6; bytes samples = 7; }
message RasterLayerModification { string id = 1; RasterLayerPatch patch = 2; }
message RasterPixelContent { optional string image_key = 1; optional uint32 width = 2; optional uint32 height = 3; }
message RasterMaskContent { optional semio.s.raster.raster.artifact.RasterLayerMask mask = 1; }
message RasterAdjustmentParameter { string parameter = 1; optional double value = 2; }
message RasterLayerPatch {
  optional string name = 1;
  optional bool visible = 2;
  optional bool locked = 14;
  optional double opacity = 3;
  optional string blend_mode = 4;
  optional double transform_x = 5;
  optional double transform_y = 6;
  optional uint32 width = 7;
  optional uint32 height = 8;
  optional string adjustment_kind = 9;
  optional RasterPixelContent pixel_content = 10;
  optional semio.s.raster.raster.artifact.RasterTransform transform = 11;
  optional RasterMaskContent mask_content = 12;
  repeated RasterAdjustmentParameter adjustment_parameters = 13;
}
message RasterDiff {
  optional semio.s.raster.raster.artifact.RasterArtifact artifact = 1;
  optional string schema = 2;
  optional string id = 3;
  optional string title = 4;
  optional RasterLayersDelta layers = 5;
  optional RasterAssetsDelta assets = 6;
  repeated RasterPixelRegion pixels = 7;
}

import "../../../../../../../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/🖼️image/🧬️schema/📸️snapshot/🛰️.proto";
