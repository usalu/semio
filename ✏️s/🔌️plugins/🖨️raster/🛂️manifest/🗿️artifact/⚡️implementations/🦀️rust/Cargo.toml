[package]
name = "semio-s-plugin-raster"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:raster"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "raster"
ports = { react = 6060, wgpu = 6160 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/🎨️paint/⚡️implementations/🦀️rust"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌️plugins/🖨️raster/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
raster = { path = "../../../../../../../✏️s/🔌️plugins/🖨️raster/🎛️apps/🖨️raster/⚡️implementations/🦀️rust", package = "semio-s-app-raster" }
raster_engine = { path = "../../../../../../../✏️s/🔌️plugins/🖨️raster/🎛️apps/🖨️raster/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-raster-engine" }
raster_op = { path = "../../../../../../../✏️s/🔌️plugins/🖨️raster/🎛️apps/🖨️raster/🔨️modules/🔧️op/⚡️implementations/🦀️rust", package = "semio-s-app-raster-op" }
raster_ui = { path = "../../../../../../../✏️s/🔌️plugins/🖨️raster/🎛️apps/🖨️raster/🔨️modules/🖱️ui/⚡️implementations/🦀️rust", package = "semio-s-app-raster-ui" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

