[package]
name = "semio-s-plugin-animate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Animate plugin - one crate for the present artifact (diff/op/dsl/pack/spr/engine, incl. the Manim-class animation core and headless video engine as engine topic files) and the present play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:animate"

[package.metadata.semio]
role = "plugin"

# 📖️ Opts this plugin into the generated Storybook scope registry (`.storybook/scopes.ts`'s
# `GENERATED_SCOPES`, read via `readSemioMarkerSubTable`) instead of a hand-maintained entry — see
# 26/08/06/GENERATED-STORYBOOK-SCOPES-AND-STORIES-FROM-PACKAGE-CATALOG. `sourceRoots` are relative to
# this plugin's OWNER dir (`✏️s/🔌️plugins/🎞️animate`), matching the pre-existing hand-curated `animate` scope.
[package.metadata.semio.storybook]
id = "animate"
titlePrefix = "🎬️animate"
sourceRoots = ["🗿️artifacts/🎬️present/🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/📺️renderer/⚛️react"]

[[package.metadata.semio.playground]]
variant = "animate"
ports = { react = 6051, wgpu = 6151 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
geometry = { path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-ui-contract = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }
framework_hash = { package = "semio-framework-hash", path = "../../../../../🧰️framework/🔨️modules/#⃣hash/📦️packages/🦀️rust" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust" }
serde.workspace = true
serde_json.workspace = true

# 🎬️ animate engine topic file
kurbo = "0.13.1"
usvg = "0.45.1"
typst = "0.14.2"
typst-svg = "0.14.2"
typst-assets = { version = "0.14.2", features = ["fonts"] }

# 🎥️ animate_video engine topic file
vello = { version = "0.7.0", features = ["wgpu", "wgpu_default"] }
wgpu = "27.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
default = []
preview-window = ["winit"]

[dependencies.winit]
version = "0.30.12"
default-features = false
features = ["rwh_06"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4.71"


[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
