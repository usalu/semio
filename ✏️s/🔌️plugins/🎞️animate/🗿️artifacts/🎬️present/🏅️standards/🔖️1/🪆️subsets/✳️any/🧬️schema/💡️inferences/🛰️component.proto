syntax = "proto3";
package semio.s.animate.present.inference;

// 💡️ Present inference schema — topology derived from the persisted tile order.

message PresentInference {
  // @state inferred
  PresentTopology topology = 1;
}

message PresentTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}
