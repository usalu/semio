syntax = "proto3";
package semio.s.animate.present.diff;
message PresentDiff {
  optional PresentArtifact artifact = 1; // @state persistent
  optional string schema = 2; // @state persistent
  optional FigureTileSource source = 3; // @state persistent
  optional PresentTilesDelta tiles = 4; // @state persistent
  optional PresentStringList selected_ids = 5; // @state shared-ui
  optional string engagement_input = 6; // @state local-ui
  optional string locale = 7; // @state local-ui
}
message PresentStringList { repeated string values = 1; }
message PresentTilesDelta {
  repeated FigureTileDraft added = 1;
  repeated string removed = 2;
  repeated PresentTilePatchEntry patched = 3;
  repeated string reordered = 4;
}
message PresentTilePatchEntry { string id = 1; FigureTileDraftPatch patch = 2; }
message FigureTileDraftPatch { optional string name = 1; optional FigureTileFrame crop = 2; }
message FigureTileFrame { double x = 1; double y = 2; double width = 3; double height = 4; }
message FigureTileSource { string src = 1; string kind = 2; FigureTileFrame frame = 3; optional double source_aspect = 4; optional uint32 pdf_page = 5; }
message FigureTileDraft { string id = 1; string name = 2; FigureTileFrame crop = 3; }
message PresentArtifact {
  string schema = 1;
  FigureTileSource source = 2;
  repeated FigureTileDraft tiles = 3;
  repeated string selected_ids = 4;
  string engagement_input = 5;
  string locale = 6;
}
