syntax = "proto3";
package semio.s.animate.presentation.diff;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
import "✏️s/🔌️plugins/🎞️animate/🗿️artifacts/🎬️presentation/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
message PresentationDiff {
  optional string schema = 1;
  optional PresentationSourcePatch source = 2;
  optional PresentationTilesDelta tiles = 3;
}
message PresentationSourcePatch {
  optional string src = 1;
  optional string kind = 2;
  optional semio.s.animate.presentation.FigureTileFrame frame = 3;
  optional PresentationOptionalAspect source_aspect = 4;
  optional PresentationOptionalPage pdf_page = 5;
}
message PresentationOptionalAspect { optional double value = 1; }
message PresentationOptionalPage { optional uint32 value = 1; }
message PresentationTilesRemoval {
  string id = 1;
  uint32 index = 2;
}
message PresentationTilesInsertion {
  uint32 index = 1;
  semio.s.animate.presentation.FigureTileDraft row = 2;
}
message PresentationTilesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message PresentationTilesDelta {
  repeated PresentationTilesRemoval removed = 1;
  repeated PresentationTilesInsertion inserted = 2;
  repeated PresentationTilesRelocation moved = 3;
  repeated PresentationTilesModification modified = 4;
}
message PresentationTilesModification {
  string id = 1;
  PresentationTilePatch patch = 2;
}
message PresentationTilePatch {
  optional string name = 1;
  optional semio.s.animate.presentation.FigureTileFrame crop = 2;
}
