syntax = "proto3";
package semio.s.animate.presentation;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
message PresentationArtifact {
  string schema = 1;
  semio.os.store.ArtifactChild presentation = 2;
  semio.os.store.ArtifactChild animation = 3;
  FigureTileSource source = 4;
  repeated FigureTileDraft tiles = 5;
}
message FigureTileFrame { double x = 1; double y = 2; double width = 3; double height = 4; }
message FigureTileSource { string src = 1; string kind = 2; FigureTileFrame frame = 3; optional double source_aspect = 4; optional uint32 pdf_page = 5; }
message FigureTileDraft { string id = 1; string name = 2; FigureTileFrame crop = 3; }
message FigureTileDraftList { repeated FigureTileDraft values = 1; }
