# 🧬️ Presentation durable diff: a field patch of the working source, a positional tile row delta.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
# import FigureTileFrame, FigureTileDraft from "✏️s/🔌️plugins/🎞️animate/🗿️artifacts/🎬️presentation/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/🔗️.graphql"
type PresentationDiff {
  schema: String @state(class: ARTIFACT)
  source: PresentationSourcePatch @state(class: ARTIFACT)
  tiles: PresentationTilesDelta @state(class: ARTIFACT)
}

type PresentationSourcePatch {
  src: String
  kind: String
  frame: FigureTileFrame
  sourceAspect: PresentationOptionalAspect
  pdfPage: PresentationOptionalPage
}

type PresentationOptionalAspect { value: Float }

type PresentationOptionalPage { value: Int }

type PresentationTilesDelta {
  removed: [PresentationTilesRemoval!]!
  inserted: [PresentationTilesInsertion!]!
  moved: [PresentationTilesRelocation!]!
  modified: [PresentationTilesModification!]!
}

type PresentationTilesModification {
  id: String!
  patch: PresentationTilePatch!
}

type PresentationTilesRemoval {
  id: String!
  index: Int!
}

type PresentationTilesInsertion {
  index: Int!
  row: FigureTileDraft!
}

type PresentationTilesRelocation {
  id: String!
  from: Int!
  to: Int!
}

type PresentationTilePatch {
  name: String
  crop: FigureTileFrame
}
