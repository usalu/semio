syntax = "proto3";
package semio.app.space.space;
message SpaceConfig {
  // @state config
  map<string, SpaceWindowCamera> camera = 1;
  // @state config
  repeated string selected_node_ids = 2;
  // @state config
  optional string hovered_node_id = 3;
  // @state config
  repeated string collapsed_node_ids = 4;
  // @state config
  repeated string preview_off_node_ids = 5;
  // @state config
  optional string active_node_id = 6;
  // @state config
  optional string focused_node_id = 7;
  // @state config
  repeated string clipboard_node_ids = 8;
  // @state config
  string workflow_engagement_input = 9;
  // @state config
  string compiled_dag_engagement_input = 10;
  // @state config
  optional string pending_import_node_id = 11;
  // @state config
  optional string pending_import_format = 12;
  // @state config
  string active_panel_tab = 13;
  // @state config
  optional string space_id = 14;
  // @state config
  optional string client_id = 15;
  // @state config
  optional string client_name = 16;
  // @state config
  string locale = 17;
}

message SpaceWindowCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
