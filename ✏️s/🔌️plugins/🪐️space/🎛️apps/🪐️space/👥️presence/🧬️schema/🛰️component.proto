syntax = "proto3";
package semio.app.space.space;
message SpacePresence {
  // @state presence
  repeated string selected_node_ids = 1;
  // @state presence
  optional string hovered_node_id = 2;
  // @state presence
  map<string, SpaceWindowCamera> camera = 3;
  // @state presence
  optional string active_node_id = 4;
  // @state presence
  optional string focused_node_id = 5;
  // @state presence
  repeated string collapsed_node_ids = 6;
  // @state presence
  repeated string preview_off_node_ids = 7;
}

message SpaceWindowCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
