syntax = "proto3";
package semio.app.space.space;
message SpacePresence {
  // @state presence
  map<string, SpaceWindowCamera> camera = 1;
  // @state presence
  optional string active_node_id = 2;
  // @state presence
  optional string focused_node_id = 3;
  // @state presence
  repeated string collapsed_node_ids = 4;
  // @state presence
  repeated string preview_off_node_ids = 5;
}

message SpaceWindowCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
