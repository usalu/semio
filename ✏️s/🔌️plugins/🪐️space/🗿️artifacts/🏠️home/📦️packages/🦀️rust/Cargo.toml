[package]
name = "semio-s-artifact-space-home"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Space home artifact"

[package.metadata.semio]
role = "s-module"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
component-app-assembly = ["semio-framework-plugin/component-guest", "dep:semio-framework", "dep:semio-framework-artifact-space-space", "dep:semio-framework-dispatch-macros", "dep:semio-framework-os", "dep:semio-framework-os-infinite", "dep:semio-framework-ui-contract", "dep:semio-framework-ui-scene", "dep:semio-s-artifact-space-space", "semio-s-artifact-space-space/component-app-assembly"]

[dependencies]
semio-framework = { workspace = true, optional = true }
semio-framework-artifact-space-space = { workspace = true, optional = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-csv = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
semio-s-artifact-stdio-xlsx = { workspace = true }
semio-s-artifact-stdio-zip = { workspace = true }
semio-s-artifact-space-space = { workspace = true, optional = true }
pack = { workspace = true }
semio-framework-dispatch-macros = { workspace = true, optional = true }
semio-framework-os-infinite = { workspace = true, optional = true }
semio-framework-ui-contract = { workspace = true, optional = true }
semio-framework-ui-scene = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
semio-framework-os = { workspace = true, features = ["space-guest"], optional = true }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
semio-framework-os = { workspace = true, features = ["os-host-full"], optional = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws"] }
semio-framework-hash = { workspace = true }
semio-framework-async-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
