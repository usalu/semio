syntax = "proto3";
package semio.app.space.space;
message SpaceConfig {
  // @state config
  map<string, SpaceWindowCamera> camera = 1;
  // @state config
  repeated string collapsed_node_ids = 2;
  // @state config
  repeated string preview_off_node_ids = 3;
  // @state config
  optional string active_node_id = 4;
  // @state config
  optional string focused_node_id = 5;
  // @state config
  repeated string clipboard_node_ids = 6;
  // @state config
  string workflow_engagement_input = 7;
  // @state config
  string compiled_dag_engagement_input = 8;
  // @state config
  optional string pending_import_node_id = 9;
  // @state config
  optional string pending_import_format = 10;
  // @state config
  string active_panel_tab = 11;
  // @state config
  optional string space_id = 12;
  // @state config
  optional string client_id = 13;
  // @state config
  optional string client_name = 14;
  // @state config
  string locale = 15;
}

message SpaceWindowCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
