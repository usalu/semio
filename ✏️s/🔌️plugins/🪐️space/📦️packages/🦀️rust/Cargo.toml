[package]
name = "semio-s-plugin-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "S Studio plugin: OS host shell bundling the Home launcher and Studio apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:s"

[package.metadata.semio]
role = "plugin"
capabilities = ["localBackboneStorage"]
host = { landing = "home", studio = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
ports = { react = 6070, wgpu = 6066 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
pack = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
infinite_board_port_directed_dag = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🎲️board/🔌️ports/➡️directed/🕸️dag/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-board-port-directed-dag" }
# 🚧️ Plain `path =` (not `workspace = true`) for these three, even though their keys match root
# `[workspace.dependencies]` exactly: this crate isn't a workspace member yet (see the temporary
# overlay below), and the overlay's own minimal `[workspace.dependencies]` can't carry the framework
# crates' full dependency graphs. `workspace = true` for these three is safe to adopt in the SAME
# registrar pass that adds this crate as a real root-workspace member (see registrar handoff).
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework-core" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

[dev-dependencies]
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }

