[package]
name = "semio-s-plugin-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "S Studio plugin: OS host shell bundling the Home launcher and Studio apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:space"

[package.metadata.semio]
role = "plugin"
capabilities = ["localBackboneStorage"]
host = { landing = "home", shell = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
ports = { react = 6070, wgpu = 6066 }
user_ports = { react = [6072, 6073], wgpu = [6067, 6068] }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-artifact-space-home = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-space-space = { workspace = true, features = ["component-app-assembly"] }
semio-framework-artifact-infinite-dag = { workspace = true }
semio-framework-artifact-space-space = { workspace = true }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-dispatch-macros = { workspace = true }
semio-framework = { workspace = true }
semio-framework-job.workspace = true
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
pack = { workspace = true }
base64_codec = { path = "../../../../../🧰️framework/🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust", package = "semio-framework-io-base64" }
semio-framework-ui-contract = { workspace = true }
semio-framework-ui-scene = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_env = "p2"))'.dependencies]
semio-framework-os = { workspace = true, features = ["space-guest"] }

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
semio-framework-os = { workspace = true, features = ["os-host-full"] }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
semio-framework-hash = { workspace = true }
# 🌱️ Test-only: every production/`#[cfg(test)]`-adjacent call site now runs on `ToValue`/`FromValue`
# (ticket `26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS`). What remains is the
# `🧪️tests/<case>/🦀️.rs` per-mutation fixture-comparison suite, which deliberately keeps
# `serde_json` as the differential third-party oracle its own assertions are named after (CLAUDE.md:
# "You SHOULD use existing libraries as possible to test our implementation").
serde = { workspace = true }
serde_json = { workspace = true }
