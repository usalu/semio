[package]
name = "semio-s-plugin-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "S Studio plugin: OS host shell bundling the Home launcher and Studio apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:s"

[package.metadata.semio]
role = "plugin"
capabilities = ["localBackboneStorage"]
host = { landing = "home", shell = "studio" }

[[package.metadata.semio.playground]]
variant = "s"
ports = { react = 6070, wgpu = 6066 }
user_ports = { react = [6072, 6073], wgpu = [6067, 6068] }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
# 🚧️ Plain `path =` (not `workspace = true`) for these three, even though their keys match root
# `[workspace.dependencies]` exactly: this crate isn't a workspace member yet (see the temporary
# overlay below), and the overlay's own minimal `[workspace.dependencies]` can't carry the framework
# crates' full dependency graphs. `workspace = true` for these three is safe to adopt in the SAME
# registrar pass that adds this crate as a real root-workspace member (see registrar handoff).
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os", features = ["os-host-full"] }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

[dev-dependencies]

