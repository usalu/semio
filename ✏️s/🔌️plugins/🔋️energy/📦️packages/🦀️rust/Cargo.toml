[package]
name = "semio-s-plugin-energy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Energy plugin - headless building energy model (BEM) engine with energy.model artifact facets"

[lints]
workspace = true

[package.metadata.component]
package = "semio:energy"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "energy"
app = "s.energy.model@1/*#editor"
ports = { react = 6106, wgpu = 6206 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false, features = ["full-artifact-catalog"] }
geometry = { path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-job = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
# 🏢️ Architecturally pinned, not "not yet converted": `🗿️artifacts/🔋️model/🦀️.rs`'s
#    `energy_structure_from_model`/`energy_model_from_structure` (the sole lossless `Model` <->
#    `s.stdio.semio.value` bridge) calls `serde_json::to_value`/`from_value` directly on
#    `crate::model::Model`, whose own derive requires `Serialize`/`Deserialize` transitively across
#    its 40 fields and the ~44-file engine tree under `🔨️modules/⚡️simulation/⚙️engine/`. `Model`
#    ALSO derives `ToValue`/`FromValue` now, and `DslValue::Number` has UInt/Int/Float fidelity
#    (ticket 26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS), so the original
#    "would lose int/float fidelity" reason for staying on serde_json no longer holds at the
#    DslValue layer — but rewriting the bridge itself to route through `ToValue`/`FromValue` instead
#    of `serde_json::Value` is a real, unstarted code change, out of this batch's scope. See that
#    file's own docstring for the full rationale.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
