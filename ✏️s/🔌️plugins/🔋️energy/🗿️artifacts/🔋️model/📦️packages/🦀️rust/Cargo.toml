[package]
workspace = "../.."
name = "semio-s-artifact-energy-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "energy model artifact: kind spec, definition and declaration over the energy model crates"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-artifact-reference = { workspace = true }
semio-framework-dsl = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-native-owned = { workspace = true }
semio-s-artifact-energy-model-diff = { workspace = true }
semio-s-artifact-energy-model-inferences = { workspace = true }
semio-s-artifact-energy-model-io = { workspace = true }
semio-s-artifact-energy-model-mutations = { workspace = true }
semio-s-artifact-energy-model-schema = { workspace = true }
semio-s-artifact-energy-model-snapshot = { workspace = true }

[dev-dependencies]
semio-s-plugin-energy-engine-sim = { workspace = true, features = ["testing"] }
pack = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-trace = { path = "../../../../../../../🧰️framework/🔨️modules/⏱️trace/📦️packages/🦀️rust" }
csv = "1"
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-test-fixtures = { path = "../../../../../../../🧰️framework/🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-s-plugin-energy-engine-model = { workspace = true }
semio-s-plugin-energy-engine-schedule = { workspace = true }
serde_json = { workspace = true }
semio-framework-test-original-snapshot-owners = { path = "../../../../../../../🧰️framework/🔨️modules/🧪️test/🛬️original-snapshot-owners/📦️packages/🦀️rust" }
