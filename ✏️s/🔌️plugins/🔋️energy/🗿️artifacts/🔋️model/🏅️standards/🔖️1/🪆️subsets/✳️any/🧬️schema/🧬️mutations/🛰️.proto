syntax = "proto3";
package semio.s.energy.model.mutation;

// 🧬️ EnergyModel mutation schema - one message per handcrafted semantic mutation kind.
// `oneof` field numbers are allocated by the ticket ledger's per-group ranges
// (📓️mutation-tag-ledger.md), never sequentially, so concurrent groups never collide.

// 📐️ Shared fixed-arity numeric tuple — protobuf has no nested repeated scalar, so every
// `Vec<[f64; N]>` payload field (surface and shading polygons) repeats this instead.
message Vertex3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message RenameModel {
  string new_name = 1;
}

message ChangeModelVersion {
  string new_version = 1;
}

message UpdateSite {
  double latitude_deg = 1;
  double longitude_deg = 2;
  double elevation_m = 3;
  double time_zone_hours = 4;
  double north_axis_deg = 5;
}

message UpdateGroundTemperature {
  repeated double building_surface_c = 1;
  repeated double shallow_c = 2;
  double deep_c = 3;
}

message UpdateRunPeriod {
  uint32 start_month = 1;
  uint32 start_day = 2;
  uint32 end_month = 3;
  uint32 end_day = 4;
  uint32 year = 5;
}

message ReplaceAirflowNetwork {
  bool present = 1;
  repeated uint32 zone_ids = 2;
  repeated uint32 node_ids = 3;
