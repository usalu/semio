# 🧬️ EnergyModel diff schema — sparse typed per-entity delta; an absent field means unchanged.

type EnergyModelDiff {
  model: EnergyModelPatch
  referencedModel: EnergyLinkSlotDelta
  weatherLink: EnergyLinkSlotDelta
}

# 🔗️ A link slot delta; an absent field means the slot did not change at all.
type EnergyLinkSlotDelta {
  kind: String!
  link: JSON
}

# 🎯️ A change of an optional field: `cleared`, or `assigned` with its value.
type EnergyOptionChange {
  kind: String!
  value: JSON
}

# 🔢️ One assigned slot of a fixed array.
type EnergySlotEdit {
  index: Int!
  value: JSON!
}

# ✂️ One removed entry: its base index and key.
type EnergyRowCut {
  index: Int!
  key: JSON!
}

# ➕️ One inserted entry: its after index and row.
type EnergyRowPut {
  index: Int!
  row: JSON!
}

# 📋️ A positional edit of an ordered list.
type EnergyListEdit {
  removed: [EnergyRowCut!]
  inserted: [EnergyRowPut!]
}

