# 🧬️ EnergyModel diff schema.

type EnergyModelDiff {
  artifact: EnergyModelArtifact
  schema: String
  model: JSON
  structure: JSON
  zones: JSON
  referencedModel: EnergyLinkSlotDelta
  weatherLink: EnergyLinkSlotDelta
  resultsJson: String
}

# 🔗️ A link slot delta; an absent field means the slot did not change at all.
type EnergyLinkSlotDelta {
  kind: String!
  link: JSON
}

type EnergyModelArtifact {
  schema: String!
  model: JSON!
  structure: JSON!
  zones: JSON!
  referencedModel: JSON
  weatherLink: JSON
  resultsJson: String!
}
