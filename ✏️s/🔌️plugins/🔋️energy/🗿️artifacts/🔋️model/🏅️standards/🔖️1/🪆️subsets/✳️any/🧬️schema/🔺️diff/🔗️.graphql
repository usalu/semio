# 🧬️ EnergyModel diff schema.

type EnergyModelDiff {
  artifact: EnergyModelArtifact
  schema: String
  model: JSON
  structure: JSON
  zones: JSON
  referencedModel: JSON
  resultsJson: String
}

type EnergyModelArtifact {
  schema: String!
  model: JSON!
  structure: JSON!
  zones: JSON!
  referencedModel: JSON
  resultsJson: String!
}
