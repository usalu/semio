semio-s-artifact-energy-model-editor-config = { workspace = true }
semio-s-artifact-energy-model-editor-interaction = { workspace = true }
semio-s-artifact-energy-model-editor-results = { workspace = true }
semio-s-artifact-energy-model-session = { workspace = true }
semio-s-artifact-energy-model-snapshot = { workspace = true }
