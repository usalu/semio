syntax = "proto3";
package semio.s.energy.model;

message EnergyModelDiff {
  optional EnergyModelArtifact artifact = 1;
  optional string schema = 2;
  optional bytes model = 3;
  optional bytes structure = 4;
  optional bytes zones = 5;
  optional EnergyLinkSlotDelta referenced_model = 6;
  optional EnergyLinkSlotDelta weather_link = 7;
  optional string results_json = 8;
}

// 🔗️ A link slot delta; an absent field means the slot did not change at all.
message EnergyLinkSlotDelta {
  string kind = 1;
  bytes link = 2;
}

message EnergyModelArtifact {
  string schema = 1;
  bytes model = 2;
  bytes structure = 3;
  bytes zones = 4;
  bytes referenced_model = 5;
  bytes weather_link = 6;
  string results_json = 7;
}
