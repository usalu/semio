syntax = "proto3";
package semio.s.energy.model;

message EnergyModelDiff {
  optional EnergyModelArtifact artifact = 1;
  optional string schema = 2;
  optional bytes model = 3;
  optional bytes structure = 4;
  optional bytes zones = 5;
  optional bytes referenced_model = 6;
  optional string results_json = 7;
}

message EnergyModelArtifact {
  string schema = 1;
  bytes model = 2;
  bytes structure = 3;
  bytes zones = 4;
  bytes referenced_model = 5;
  string results_json = 6;
}
