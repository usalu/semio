syntax = "proto3";
package semio.s.energy.model;

message EnergyModelDiff {
  EnergyModelBranches model = 1;
  optional bytes referenced_model = 2;
  optional bytes weather_link = 3;
}
message EnergyModelBranches {
  optional bytes identity = 1;
  optional bytes geometry = 2;
  optional bytes materials = 3;
  optional bytes loads = 4;
  optional bytes controls = 5;
  optional bytes systems = 6;
  optional bytes generation = 7;
  optional bytes outputs = 8;
}
