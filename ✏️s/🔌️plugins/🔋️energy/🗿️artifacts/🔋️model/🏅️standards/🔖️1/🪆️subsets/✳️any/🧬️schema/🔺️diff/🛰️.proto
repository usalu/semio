syntax = "proto3";
package semio.s.energy.model;

message EnergyModelDiff {
  optional EnergyModelPatch model = 1;
  optional EnergyLinkSlotDelta referenced_model = 2;
  optional EnergyLinkSlotDelta weather_link = 3;
}

// 🔗️ A link slot delta; an absent field means the slot did not change at all.
message EnergyLinkSlotDelta {
  string kind = 1;
  bytes link = 2;
}

// 🎯️ A change of an optional field: `cleared`, or `assigned` with its value.
message EnergyOptionChange {
  string kind = 1;
  bytes value = 2;
}

// 🔢️ One assigned slot of a fixed array.
message EnergySlotEdit {
  uint32 index = 1;
  bytes value = 2;
}

// ✂️ One removed entry: its base index and key.
message EnergyRowCut {
  uint32 index = 1;
  bytes key = 2;
}

// ➕️ One inserted entry: its after index and row.
message EnergyRowPut {
  uint32 index = 1;
  bytes row = 2;
}

// 📋️ A positional edit of an ordered list.
message EnergyListEdit {
  repeated EnergyRowCut removed = 1;
  repeated EnergyRowPut inserted = 2;
}

message EnergyZonePatch {
  uint32 id = 1;
  optional string name = 2;
  optional double volume_m3 = 3;
  optional uint32 multiplier = 4;
  optional bool conditioned = 5;
  optional bool part_of_total_floor_area = 6;
}

message EnergyZoneRows {
  repeated EnergyRowCut removed = 1;
  repeated EnergyRowPut inserted = 2;
  repeated EnergyZonePatch modified = 3;
}

message EnergySpacePatch {
  uint32 id = 1;
  optional string name = 2;
  optional uint32 zone_id = 3;
  optional double floor_area_m2 = 4;
}

message EnergySpaceRows {
  repeated EnergyRowCut removed = 1;
  repeated EnergyRowPut inserted = 2;
  repeated EnergySpacePatch modified = 3;
}

message EnergySurfacePatch {
  uint32 id = 1;
  optional string name = 2;
  optional uint32 zone_id = 3;
  optional string class = 4;
  repeated repeated double vertices_m = 5;
  optional uint32 construction_id = 6;
  optional bytes outside_boundary_condition = 7;
  optional bool sun_exposed = 8;
  optional bool wind_exposed = 9;
  optional uint32 multiplier = 10;
}

message EnergySurfaceRows {
  repeated EnergyRowCut removed = 1;
  repeated EnergyRowPut inserted = 2;
  repeated EnergySurfacePatch modified = 3;
}

message EnergyFenestrationPatch {
  uint32 id = 1;
  optional string name = 2;
  optional uint32 surface_id = 3;
  optional double u_value_w_m2k = 4;
  optional double shgc = 5;
  optional double vlt = 6;
  optional double area_m2 = 7;
  optional double height_m = 8;
  optional double sill_height_m = 9;
  optional double frame_conductance_w_k = 10;
  optional double divider_conductance_w_k = 11;
  optional double overhang_depth_m = 12;
  optional double overhang_offset_m = 13;
  optional double fin_depth_m = 14;
  optional double fin_offset_m = 15;
  optional EnergyOptionChange glazing_construction_id = 16;
  repeated repeated double vertices_m = 17;
}

message EnergyFenestrationRows {
  repeated EnergyRowCut removed = 1;
  repeated EnergyRowPut inserted = 2;
  repeated EnergyFenestrationPatch modified = 3;
}

message EnergyMaterialPatch {
  uint32 id = 1;
  optional string name = 2;
  optional string roughness = 3;
  optional double thickness_m = 4;
  optional double conductivity_w_m_k = 5;
  optional double density_kg_m3 = 6;
  optional double specific_heat_j_kg_k = 7;
  optional double thermal_absorptance = 8;
  optional double solar_absorptance = 9;
  optional double visible_absorptance = 10;
}

message EnergyMaterialRows {
  repeated EnergyRowCut removed = 1;
  repeated EnergyRowPut inserted = 2;
  repeated EnergyMaterialPatch modified = 3;
}

message EnergyGlazingMaterialPatch {
