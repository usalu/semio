  optional string name = 2;
  optional double thickness_m = 3;
  optional double conductivity_w_m_k = 4;
  optional double solar_transmittance = 5;
  optional double solar_reflectance_front = 6;
  optional double solar_reflectance_back = 7;
  optional double visible_transmittance = 8;
  optional double visible_reflectance_front = 9;
  optional double visible_reflectance_back = 10;
  optional double infrared_transmittance = 11;
  optional double infrared_emissivity_front = 12;
  optional double infrared_emissivity_back = 13;
