# 🦴️ Authored structural analysis schema
type StructuralLocation { Point: PointLocation, Line: LineLocation, Area: Boolean }
type PointLocation { station: Float! }
type LineLocation { start: Float!, end: Float! }
type Restraints { x:Boolean!, y:Boolean!, z:Boolean!, rx:Boolean!, ry:Boolean!, rz:Boolean! }
type StructuralSupport { name: String! member: String! location: StructuralLocation! offset: Point3! restraints: Restraints! }
type StructuralSupportRow { id:String!, value:StructuralSupport! }
type LoadCase { name: String! category: String! factor: Float! }
type LoadCaseRow { id:String!, value:LoadCase! }
type StructuralLoad { name: String! load_case: String! member: String! location: StructuralLocation! force: Point3! moment: Point3! }
type StructuralLoadRow { id:String!, value:StructuralLoad! }
type StructuralSupportPatch { name: String member: String location: StructuralLocation offset: Point3 restraints: Restraints }
type StructuralSupportEntry { id:String!, created:StructuralSupport, deleted:Boolean, replaced:StructuralSupport, patched:StructuralSupportPatch }
type LoadCasePatch { name: String category: String factor: Float }
type LoadCaseEntry { id:String!, created:LoadCase, deleted:Boolean, replaced:LoadCase, patched:LoadCasePatch }
type StructuralLoadPatch { name: String load_case: String member: String location: StructuralLocation force: Point3 moment: Point3 }
type StructuralLoadEntry { id:String!, created:StructuralLoad, deleted:Boolean, replaced:StructuralLoad, patched:StructuralLoadPatch }
extend type ModelDiff { supports:[StructuralSupportEntry!], load_cases:[LoadCaseEntry!], loads:[StructuralLoadEntry!] }
