message StructuralLocation { message Point { double station = 1; } message Line { double start = 1; double end = 2; } oneof location { Point point = 1; Line line = 2; bool area = 3; } }
message Restraints { bool x = 1; bool y = 2; bool z = 3; bool rx = 4; bool ry = 5; bool rz = 6; }
message StructuralSupport { string name = 1; string member = 2; StructuralLocation location = 3; Point3 offset = 4; Restraints restraints = 5; }
message LoadCase { string name = 1; string category = 2; double factor = 3; }
message StructuralLoad { string name = 1; string load_case = 2; string member = 3; StructuralLocation location = 4; Point3 force = 5; Point3 moment = 6; }

message StructuralRing { repeated Point3 points = 1; }
message AnalyticalMember { string element = 1; string storey = 2; string kind = 3; repeated Point3 path = 4; repeated Point3 boundary = 5; repeated StructuralRing holes = 6; double length = 7; double area = 8; double start_offset = 9; double end_offset = 10; }
message RigidLink { string member = 1; string other = 2; Point3 start = 3; Point3 end = 4; double length = 5; }
message ResolvedSupport { StructuralSupport authored = 1; repeated Point3 points = 2; }
message ResolvedLoad { StructuralLoad authored = 1; repeated Point3 points = 2; double factor = 3; }
message StructuralAnalysis { map<string,AnalyticalMember> members = 1; map<string,RigidLink> rigid_links = 2; map<string,ResolvedSupport> supports = 3; map<string,ResolvedLoad> loads = 4; repeated string findings = 5; }