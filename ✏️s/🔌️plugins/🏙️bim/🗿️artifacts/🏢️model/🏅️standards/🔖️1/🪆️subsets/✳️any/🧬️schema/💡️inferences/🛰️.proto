    ParameterValueNumber number = 1;
    ParameterValueLength length = 2;
    ParameterValueAngle angle = 3;
    ParameterValueBoolean boolean = 4;
    ParameterValueText text = 5;
  }
}

message ParameterValueNumber {
  double value = 1;
}

message ParameterValueLength {
  double value = 1;
}

message ParameterValueAngle {
  double value = 1;
}

message ParameterValueBoolean {
  bool value = 1;
}

message ParameterValueText {
  string value = 1;
}

message ResolvedParameter {
  ParameterKind kind = 1;
