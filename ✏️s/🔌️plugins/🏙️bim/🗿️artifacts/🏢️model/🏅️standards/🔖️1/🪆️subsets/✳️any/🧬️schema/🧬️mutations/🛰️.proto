message StructuralLocation { message Point { double station = 1; } message Line { double start = 1; double end = 2; } oneof location { Point point = 1; Line line = 2; bool area = 3; } }
message Restraints { bool x = 1; bool y = 2; bool z = 3; bool rx = 4; bool ry = 5; bool rz = 6; }
message StructuralSupport { string name = 1; string member = 2; StructuralLocation location = 3; Point3 offset = 4; Restraints restraints = 5; }
message LoadCase { string name = 1; string category = 2; double factor = 3; }
message StructuralLoad { string name = 1; string load_case = 2; string member = 3; StructuralLocation location = 4; Point3 force = 5; Point3 moment = 6; }

message CreateSupport { string id = 1; StructuralSupport support = 2; }

message SetSupport { string id = 1; optional string name = 2; optional string member = 3; optional StructuralLocation location = 4; optional Point3 offset = 5; optional Restraints restraints = 6; }

message DeleteSupport { string id = 1;  }

message CreateLoadCase { string id = 1; LoadCase load_case = 2; }

message SetLoadCase { string id = 1; optional string name = 2; optional string category = 3; optional double factor = 4; }

message DeleteLoadCase { string id = 1;  }

message CreateLoad { string id = 1; StructuralLoad load = 2; }

message SetLoad { string id = 1; optional string name = 2; optional string load_case = 3; optional string member = 4; optional StructuralLocation location = 5; optional Point3 force = 6; optional Point3 moment = 7; }

message DeleteLoad { string id = 1;  }