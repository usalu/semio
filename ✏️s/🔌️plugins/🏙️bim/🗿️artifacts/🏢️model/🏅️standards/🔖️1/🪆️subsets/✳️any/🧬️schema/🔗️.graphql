# 🧬️ BIM model artifact schema — every field with its state class.

type ModelArtifact {
  schema: String! @state(class: ARTIFACT)
  project: Project! @state(class: ARTIFACT)
  materials: [MaterialRow!]! @state(class: ARTIFACT)
  wall_types: [WallTypeRow!]! @state(class: ARTIFACT)
  slab_types: [SlabTypeRow!]! @state(class: ARTIFACT)
  roof_types: [RoofTypeRow!]! @state(class: ARTIFACT)
  column_types: [ColumnTypeRow!]! @state(class: ARTIFACT)
  beam_types: [BeamTypeRow!]! @state(class: ARTIFACT)
  window_types: [WindowTypeRow!]! @state(class: ARTIFACT)
  door_types: [DoorTypeRow!]! @state(class: ARTIFACT)
  sites: [SiteRow!]! @state(class: ARTIFACT)
  buildings: [BuildingRow!]! @state(class: ARTIFACT)
  storeys: [StoreyRow!]! @state(class: ARTIFACT)
  grids: [GridLineRow!]! @state(class: ARTIFACT)
  walls: [WallRow!]! @state(class: ARTIFACT)
  curtain_walls: [CurtainWallRow!]! @state(class: ARTIFACT)
  columns: [ColumnRow!]! @state(class: ARTIFACT)
  beams: [BeamRow!]! @state(class: ARTIFACT)
  slabs: [SlabRow!]! @state(class: ARTIFACT)
  roofs: [RoofRow!]! @state(class: ARTIFACT)
  openings: [OpeningRow!]! @state(class: ARTIFACT)
  stairs: [StairRow!]! @state(class: ARTIFACT)
  railings: [RailingRow!]! @state(class: ARTIFACT)
  spaces: [SpaceRow!]! @state(class: ARTIFACT)
  properties: [PropertySetRow!]! @state(class: ARTIFACT)
  classifications: [ClassificationRow!]! @state(class: ARTIFACT)
}

enum MaterialCategory {
  Concrete
  Masonry
  Wood
  Metal
  Glass
  Insulation
  Finish
  Membrane
  Other
}

enum LayerFunction {
  Structure
  Substrate
  Insulation
  Finish
  Membrane
  Core
}

enum LocationLine {
  Center
  Interior
  Exterior
  CoreCenter
}

enum Phase {
  Existing
  New
  Demolished
  Temporary
}

enum DoorLeaves {
  Single
  Double
}

enum Swing {
  Left
  Right
}

enum Turn {
  Left
  Right
}

enum StringerKind {
  None
  Closed
  Open
  Mono
}

enum RiserKind {
  Open
  Closed
}

# externally tagged: exactly one member is present
type Axis {
  [object Object]: AxisLine
  [object Object]: AxisArc
}

type AxisLine {
  start: Point2!
  end: Point2!
}

type AxisArc {
  start: Point2!
  end: Point2!
  bulge: Float!
}

# externally tagged: exactly one member is present
type TopConstraint {
  [object Object]: TopConstraintUnconnected
  [object Object]: TopConstraintStoreyTop
  [object Object]: TopConstraintStorey
}

type TopConstraintUnconnected {
  height: Float!
}

type TopConstraintStoreyTop {
  offset: Float!
}

type TopConstraintStorey {
  storey: String!
  offset: Float!
}

# externally tagged: exactly one member is present
type Profile {
  [object Object]: ProfileRectangle
  [object Object]: ProfileCircle
  [object Object]: ProfileIShape
  [object Object]: ProfileCustom
}

type ProfileRectangle {
  width: Float!
  depth: Float!
}

type ProfileCircle {
  diameter: Float!
}

type ProfileIShape {
  width: Float!
  depth: Float!
  web: Float!
  flange: Float!
}

type ProfileCustom {
  outline: [Vertex!]!
}

# externally tagged: exactly one member is present
type RoofShape {
  [object Object]: Boolean
  [object Object]: RoofShapeShed
  [object Object]: RoofShapeGable
  [object Object]: RoofShapeHip
  [object Object]: RoofShapeMansard
}

type RoofShapeShed {
  pitch: Float!
  direction: Float!
}

type RoofShapeGable {
  pitch: Float!
  ridge_direction: Float!
}

type RoofShapeHip {
  pitch: Float!
}

type RoofShapeMansard {
  lower_pitch: Float!
  upper_pitch: Float!
  break_height: Float!
}

# externally tagged: exactly one member is present
type OpeningKind {
  [object Object]: OpeningKindWindow
  [object Object]: OpeningKindDoor
  [object Object]: OpeningKindVoid
}

type OpeningKindWindow {
  window_type: String!
}

type OpeningKindDoor {
  door_type: String!
}

type OpeningKindVoid {
  width: Float!
  height: Float!
}

# externally tagged: exactly one member is present
type StairFlight {
  [object Object]: Boolean
  [object Object]: StairFlightLTurn
  [object Object]: StairFlightUTurn
  [object Object]: StairFlightSpiral
}

type StairFlightLTurn {
  split: Float!
  turn: Turn!
}

type StairFlightUTurn {
  gap: Float!
}

type StairFlightSpiral {
  radius: Float!
  sweep: Float!
}

