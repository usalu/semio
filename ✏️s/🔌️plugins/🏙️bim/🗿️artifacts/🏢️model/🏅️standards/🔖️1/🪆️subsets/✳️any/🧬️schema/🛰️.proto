syntax = "proto3";
package semio.s.bim.model.artifact;

// 🧬️ BIM model artifact schema — every field with its state class.

message ModelArtifact {
  string schema = 1;
  Project project = 2;
  map<string, Material> materials = 3;
  map<string, WallType> wall_types = 4;
  map<string, SlabType> slab_types = 5;
  map<string, RoofType> roof_types = 6;
  map<string, ColumnType> column_types = 7;
  map<string, BeamType> beam_types = 8;
  map<string, WindowType> window_types = 9;
  map<string, DoorType> door_types = 10;
  map<string, CurtainWallType> curtain_wall_types = 11;
  map<string, Site> sites = 12;
  map<string, Building> buildings = 13;
  map<string, Storey> storeys = 14;
  map<string, GridLine> grids = 15;
  map<string, Wall> walls = 16;
  map<string, CurtainWall> curtain_walls = 17;
  map<string, CurtainPanelOverride> curtain_panel_overrides = 18;
  map<string, Column> columns = 19;
  map<string, Beam> beams = 20;
  map<string, Slab> slabs = 21;
  map<string, Roof> roofs = 22;
  map<string, Opening> openings = 23;
  map<string, Stair> stairs = 24;
  map<string, Railing> railings = 25;
  map<string, Ramp> ramps = 26;
  map<string, Space> spaces = 27;
  map<string, CeilingType> ceiling_types = 28;
  map<string, Ceiling> ceilings = 29;
  map<string, Zone> zones = 30;
  map<string, AreaScheme> area_schemes = 31;
  map<string, SpaceConditions> space_conditions = 32;
  map<string, View> views = 33;
  map<string, Sheet> sheets = 34;
  map<string, Viewport> viewports = 35;
  map<string, SheetRevision> sheet_revisions = 36;
  map<string, Dimension> dimensions = 37;
  map<string, Tag> tags = 38;
  map<string, TextNote> text_notes = 39;
  map<string, Leader> leaders = 40;
  map<string, AnnotationStyle> annotation_styles = 41;
  map<string, Family> families = 42;
  map<string, FamilyParameter> family_parameters = 43;
  map<string, FamilySolid> family_solids = 44;
  map<string, Component> components = 45;
  map<string, ComponentOverride> component_overrides = 46;
  map<string, MepElement> mep_elements = 47;
  map<string, ClashSet> clash_sets = 48;
  map<string, Rule> rules = 49;
  map<string, Issue> issues = 50;
  map<string, IssueComment> issue_comments = 51;
  map<string, WallSweep> wall_sweeps = 52;
  map<string, Schedule> schedules = 53;
  map<string, PropertyTemplate> property_templates = 54;
  map<string, ClassificationSystem> classification_systems = 55;
  map<string, PropertySetRows> properties = 56;
  map<string, ClassificationSetRows> classifications = 57;
}

