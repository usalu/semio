  AREAMEASURE_GROSS = 1;
  AREAMEASURE_NET = 2;
}

message AnnotationAnchorPoint {
  Point2 point = 1;
}

message AnnotationAnchorWallFace {
  string wall = 1;
  WallSide side = 2;
}

message AnnotationAnchorWallAxis {
  string wall = 1;
}

message AnnotationAnchorWallEnd {
  string wall = 1;
  AnchorEnd end = 2;
}

message AnnotationAnchorOpeningCentre {
  string opening = 1;
}

message AnnotationAnchorGrid {
  string grid = 1;
}

message AnnotationAnchorColumnCentre {
  string column = 1;
}

message AnnotationAnchor {
  oneof variant {
    AnnotationAnchorPoint point = 1;
    AnnotationAnchorWallFace wallface = 2;
    AnnotationAnchorWallAxis wallaxis = 3;
    AnnotationAnchorWallEnd wallend = 4;
    AnnotationAnchorOpeningCentre openingcentre = 5;
    AnnotationAnchorGrid grid = 6;
    AnnotationAnchorColumnCentre columncentre = 7;
  }
}

message ParametricProfileRectangle {
  string width = 1;
  string depth = 2;
}

message ParametricProfileCircle {
  string diameter = 1;
}

message ParametricProfileIShape {
  string width = 1;
  string depth = 2;
  string web = 3;
  string flange = 4;
}

message ParametricProfilePolygon {
  repeated ExprPoint points = 1;
}

message ParametricProfile {
  oneof variant {
    ParametricProfileRectangle rectangle = 1;
    ParametricProfileCircle circle = 2;
    ParametricProfileIShape ishape = 3;
    ParametricProfilePolygon polygon = 4;
  }
}

message SolidShapeExtrusion {
  ParametricProfile profile = 1;
  string base = 2;
  string height = 3;
}

message SolidShapeRevolution {
  ParametricProfile profile = 1;
  SolidAxis axis = 2;
  string angle = 3;
}

message SolidShapeSweep {
  ParametricProfile profile = 1;
  repeated ExprPoint path = 2;
}

message SolidShapeCuboid {
  string x = 1;
  string y = 2;
  string z = 3;
  string width = 4;
  string depth = 5;
  string height = 6;
}

message SolidShape {
  oneof variant {
    SolidShapeExtrusion extrusion = 1;
    SolidShapeRevolution revolution = 2;
    SolidShapeSweep sweep = 3;
    SolidShapeCuboid cuboid = 4;
  }
}

message MepShapeDuct {
  double width = 1;
  double height = 2;
}

message MepShapePipe {
  double diameter = 1;
}

message MepShapeTray {
  double width = 1;
  double height = 2;
}

message MepShape {
  oneof variant {
    MepShapeDuct duct = 1;
    MepShapePipe pipe = 2;
    MepShapeTray tray = 3;
  }
}

message PaperIso {
  IsoSize size = 1;
}

message PaperCustom {
  double width = 1;
  double height = 2;
}

message Paper {
  oneof variant {
    PaperIso iso = 1;
    PaperCustom custom = 2;
  }
}

message CurtainGridSpacing {
  double spacing = 1;
}

message CurtainGridLines {
  repeated double positions = 1;
}

message CurtainGrid {
  oneof variant {
    CurtainGridSpacing spacing = 1;
    CurtainGridLines lines = 2;
  }
}

message CurtainPanelSolid {
  string material = 1;
}

message CurtainPanelDoor {
  string door_type = 1;
}

message CurtainPanelWindow {
  string window_type = 1;
}

message CurtainPanel {
  oneof variant {
    bool glass = 1;
    CurtainPanelSolid solid = 2;
    CurtainPanelDoor door = 3;
    CurtainPanelWindow window = 4;
    bool empty = 5;
  }
}

message AxisLine {
  Point2 start = 1;
  Point2 end = 2;
}

message AxisArc {
  Point2 start = 1;
  Point2 end = 2;
  double bulge = 3;
}

message Axis {
  oneof variant {
    AxisLine line = 1;
    AxisArc arc = 2;
  }
}

message TopConstraintUnconnected {
  double height = 1;
}

message TopConstraintStoreyTop {
  double offset = 1;
}

message TopConstraintStorey {
  string storey = 1;
  double offset = 2;
}

message TopConstraintRoof {
  string roof = 1;
  double offset = 2;
}

message TopConstraintSlab {
  string slab = 1;
  double offset = 2;
}

message TopConstraintCeiling {
  string ceiling = 1;
  double offset = 2;
}

message TopConstraint {
  oneof variant {
    TopConstraintUnconnected unconnected = 1;
    TopConstraintStoreyTop storeytop = 2;
    TopConstraintStorey storey = 3;
    TopConstraintRoof roof = 4;
    TopConstraintSlab slab = 5;
    TopConstraintCeiling ceiling = 6;
  }
}

message ProfileRectangle {
  double width = 1;
  double depth = 2;
}

message ProfileCircle {
  double diameter = 1;
}

message ProfileIShape {
  double width = 1;
  double depth = 2;
  double web = 3;
  double flange = 4;
}

message ProfileCustom {
  repeated Vertex outline = 1;
}

message ProfileFamily {
  string family = 1;
}

message Profile {
  oneof variant {
    ProfileRectangle rectangle = 1;
    ProfileCircle circle = 2;
    ProfileIShape ishape = 3;
    ProfileCustom custom = 4;
    ProfileFamily family = 5;
  }
}

message RoofShapeShed {
  double pitch = 1;
  double direction = 2;
}

message RoofShapeGable {
  double pitch = 1;
  double ridge_direction = 2;
}

message RoofShapeHip {
  double pitch = 1;
}

message RoofShapeMansard {
  double lower_pitch = 1;
  double upper_pitch = 2;
  double break_height = 3;
}

message RoofShape {
  oneof variant {
    bool flat = 1;
    RoofShapeShed shed = 2;
    RoofShapeGable gable = 3;
    RoofShapeHip hip = 4;
    RoofShapeMansard mansard = 5;
  }
}

message OpeningKindWindow {
  string window_type = 1;
}

message OpeningKindDoor {
  string door_type = 1;
}

message OpeningKindVoid {
  double width = 1;
  double height = 2;
}

message OpeningKind {
  oneof variant {
    OpeningKindWindow window = 1;
    OpeningKindDoor door = 2;
    OpeningKindVoid void = 3;
  }
}

message StairFlightLTurn {
  double split = 1;
  Turn turn = 2;
}

message StairFlightUTurn {
  double gap = 1;
}

message StairFlightSpiral {
  double radius = 1;
  double sweep = 2;
}

message StairFlight {
  oneof variant {
    bool straight = 1;
    StairFlightLTurn lturn = 2;
    StairFlightUTurn uturn = 3;
    StairFlightSpiral spiral = 4;
  }
}

message PropertyValueText {
  string value = 1;
}

message PropertyValueReal {
  double value = 1;
}

message PropertyValueInteger {
  int32 value = 1;
}

message PropertyValueBoolean {
  bool value = 1;
}

message PropertyValueLength {
  double value = 1;
}

message PropertyValueArea {
  double value = 1;
}

message PropertyValueVolume {
  double value = 1;
}

message PropertyValueAngle {
  double value = 1;
}

message PropertyValue {
  oneof variant {
    PropertyValueText text = 1;
    PropertyValueReal real = 2;
    PropertyValueInteger integer = 3;
    PropertyValueBoolean boolean = 4;
    PropertyValueLength length = 5;
    PropertyValueArea area = 6;
    PropertyValueVolume volume = 7;
    PropertyValueAngle angle = 8;
  }
}

message InfillGlass {
  double thickness = 1;
}

message InfillPanel {
  double thickness = 1;
}

message Infill {
  oneof variant {
    bool none = 1;
    InfillGlass glass = 2;
    InfillPanel panel = 3;
  }
}

message SpaceBoundaryBounded {
  Point2 seed = 1;
}

message SpaceBoundaryExplicit {
  repeated Vertex outline = 1;
}

message SpaceBoundary {
  oneof variant {
    SpaceBoundaryBounded bounded = 1;
    SpaceBoundaryExplicit explicit = 2;
  }
}

message ScheduleKeyField {
  ScheduleField field = 1;
}

message ScheduleKeyProperty {
  string set = 1;
  string name = 2;
}

message ScheduleKey {
  oneof variant {
    ScheduleKeyField field = 1;
    ScheduleKeyProperty property = 2;
  }
}

message PropertyDef {
  string name = 1;
  PropertyKind kind = 2;
  optional string unit = 3;
  optional string description = 4;
  bool required = 5;
  optional PropertyValue default_value = 6;
  repeated PropertyValue allowed = 7;
  optional double minimum = 8;
  optional double maximum = 9;
}

message PropertyTemplate {
  string name = 1;
  repeated TemplateTarget applies_to = 2;
  repeated PropertyDef properties = 3;
}

message ClassificationItem {
  string code = 1;
  string title = 2;
  optional string parent = 3;
}

message ClassificationSystem {
  string name = 1;
  string edition = 2;
  optional string source = 3;
  repeated ClassificationItem entries = 4;
}

message SpaceConditions {
  optional string occupancy = 1;
  optional double occupancy_density = 2;
  optional double heating_setpoint = 3;
  optional double cooling_setpoint = 4;
  optional double ventilation_rate = 5;
  optional double lighting_power_density = 6;
  optional double equipment_power_density = 7;
  optional string schedule = 8;
}

message Dimension {
  string storey = 1;
  repeated AnnotationAnchor anchors = 2;
  double angle = 3;
  double offset = 4;
