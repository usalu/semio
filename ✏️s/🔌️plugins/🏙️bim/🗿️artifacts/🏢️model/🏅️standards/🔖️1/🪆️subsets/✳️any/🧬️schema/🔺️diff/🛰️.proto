syntax = "proto3";
package semio.s.bim.model.diff;

// 🔺️ BIM model diff schema — a sparse per-collection keyed delta.

message ModelDiff {
  optional ProjectPatch project = 1;
  map<string, MaterialEntry> materials = 2;
  map<string, WallTypeEntry> wall_types = 3;
  map<string, SlabTypeEntry> slab_types = 4;
  map<string, RoofTypeEntry> roof_types = 5;
  map<string, ColumnTypeEntry> column_types = 6;
  map<string, BeamTypeEntry> beam_types = 7;
  map<string, WindowTypeEntry> window_types = 8;
  map<string, DoorTypeEntry> door_types = 9;
  map<string, CurtainWallTypeEntry> curtain_wall_types = 10;
  map<string, SiteEntry> sites = 11;
  map<string, BuildingEntry> buildings = 12;
  map<string, StoreyEntry> storeys = 13;
  map<string, GridLineEntry> grids = 14;
  map<string, WallEntry> walls = 15;
  map<string, CurtainWallEntry> curtain_walls = 16;
  map<string, CurtainPanelOverrideEntry> curtain_panel_overrides = 17;
  map<string, ColumnEntry> columns = 18;
  map<string, BeamEntry> beams = 19;
  map<string, SlabEntry> slabs = 20;
  map<string, RoofEntry> roofs = 21;
  map<string, OpeningEntry> openings = 22;
  map<string, StairEntry> stairs = 23;
  map<string, RailingEntry> railings = 24;
  map<string, RampEntry> ramps = 25;
  map<string, SpaceEntry> spaces = 26;
  map<string, CeilingTypeEntry> ceiling_types = 27;
  map<string, CeilingEntry> ceilings = 28;
  map<string, ZoneEntry> zones = 29;
  map<string, AreaSchemeEntry> area_schemes = 30;
  map<string, ViewEntry> views = 31;
  map<string, SheetEntry> sheets = 32;
  map<string, ViewportEntry> viewports = 33;
  map<string, SheetRevisionEntry> sheet_revisions = 34;
  map<string, DimensionEntry> dimensions = 35;
  map<string, TagEntry> tags = 36;
  map<string, TextNoteEntry> text_notes = 37;
  map<string, LeaderEntry> leaders = 38;
  map<string, AnnotationStyleEntry> annotation_styles = 39;
  map<string, FamilyEntry> families = 40;
  map<string, FamilyParameterEntry> family_parameters = 41;
  map<string, FamilySolidEntry> family_solids = 42;
  map<string, WallSweepEntry> wall_sweeps = 43;
  map<string, ScheduleEntry> schedules = 44;
  map<string, PropertyTemplateEntry> property_templates = 45;
  map<string, ClassificationSystemEntry> classification_systems = 46;
  map<string, PropertySetEntry> properties = 47;
  map<string, ClassificationSetEntry> classifications = 48;
}

message Assigned {
  bool present = 1;
}

message PropertyTemplatePatch {
  optional string name = 1;
  optional TemplateTargetList applies_to = 2;
  optional PropertyDefList properties = 3;
}

message ClassificationSystemPatch {
  optional string name = 1;
  optional string edition = 2;
  optional string source = 3;
  optional ClassificationItemList entries = 4;
}

message DimensionPatch {
  optional string storey = 1;
  optional AnnotationAnchorList anchors = 2;
  optional double angle = 3;
  optional double offset = 4;
  optional string style = 5;
  optional double lock = 6;
  optional string name = 7;
}

message TagPatch {
  optional string storey = 1;
  optional string element = 2;
  optional TagCategory category = 3;
  optional Point2 offset = 4;
  optional string style = 5;
}

message TextNotePatch {
  optional string storey = 1;
  optional Point2 position = 2;
  optional string text = 3;
  optional double rotation = 4;
  optional string style = 5;
}

message LeaderPatch {
  optional string storey = 1;
  optional AnnotationAnchor anchor = 2;
  optional Point2 offset = 3;
  optional string text = 4;
  optional string style = 5;
}

message AnnotationStylePatch {
  optional string name = 1;
  optional double text_height = 2;
  optional Terminator terminator = 3;
  optional DimensionUnit unit = 4;
  optional uint32 precision = 5;
  optional double mark_size = 6;
  optional double gap = 7;
  optional double overshoot = 8;
}

message FamilyPatch {
  optional string name = 1;
  optional FamilyCategory category = 2;
}

message FamilyParameterPatch {
  optional string family = 1;
  optional string name = 2;
  optional ParameterKind kind = 3;
  optional string value = 4;
}

message FamilySolidPatch {
  optional string family = 1;
  optional string name = 2;
  optional SolidShape shape = 3;
  optional string material = 4;
  optional string visible = 5;
  optional ExprPoint3 offset = 6;
}

message SheetPatch {
  optional string number = 1;
  optional string name = 2;
  optional Paper paper = 3;
  optional Orientation orientation = 4;
  optional string project = 5;
  optional string drawn_by = 6;
  optional string checked_by = 7;
  optional string date = 8;
  optional string revision = 9;
  optional string scale_label = 10;
}

message ViewportPatch {
  optional string sheet = 1;
  optional string view = 2;
  optional Point2 position = 3;
  optional uint32 scale = 4;
  optional ViewCrop crop = 5;
  optional string label = 6;
}

message SheetRevisionPatch {
  optional string sheet = 1;
  optional string number = 2;
  optional string date = 3;
  optional string description = 4;
  optional string author = 5;
}

message WallSweepPatch {
  optional string host = 1;
  optional WallSide side = 2;
  optional Profile profile = 3;
  optional double height = 4;
  optional double inset = 5;
  optional string material = 6;
  optional string name = 7;
}

message ProjectPatch {
  optional string name = 1;
  optional string description = 2;
  optional string author = 3;
  optional string organization = 4;
  optional StringList phase_names = 5;
}

message MaterialPatch {
  optional string name = 1;
  optional MaterialCategory category = 2;
  optional Rgb color = 3;
  optional double density = 4;
  optional double conductivity = 5;
  optional double specific_heat = 6;
}

message WallTypePatch {
  optional string name = 1;
  optional LayerList layers = 2;
}

message SlabTypePatch {
  optional string name = 1;
  optional LayerList layers = 2;
}

message CeilingTypePatch {
  optional string name = 1;
  optional LayerList layers = 2;
}

message RoofTypePatch {
  optional string name = 1;
  optional LayerList layers = 2;
}

message ColumnTypePatch {
  optional string name = 1;
  optional Profile profile = 2;
  optional string material = 3;
}

message BeamTypePatch {
  optional string name = 1;
  optional Profile profile = 2;
  optional string material = 3;
}

message WindowTypePatch {
  optional string name = 1;
  optional double width = 2;
  optional double height = 3;
  optional double sill = 4;
  optional double frame_width = 5;
  optional double frame_depth = 6;
  optional uint32 panes = 7;
  optional string material = 8;
}

message DoorTypePatch {
  optional string name = 1;
  optional double width = 2;
  optional double height = 3;
  optional double frame_width = 4;
  optional double frame_depth = 5;
  optional DoorLeaves leaves = 6;
  optional Swing swing = 7;
  optional string material = 8;
}

message SitePatch {
  optional string name = 1;
  optional double latitude = 2;
  optional double longitude = 3;
  optional double elevation = 4;
  optional double true_north = 5;
  optional Point2List boundary = 6;
}

message BuildingPatch {
  optional string site = 1;
  optional string name = 2;
  optional Point2 origin = 3;
  optional double rotation = 4;
  optional double elevation = 5;
}

message StoreyPatch {
  optional string building = 1;
  optional string name = 2;
  optional int32 level = 3;
  optional double height = 4;
  optional double cut_height = 5;
}

message GridLinePatch {
  optional string building = 1;
  optional string label = 2;
  optional Point2 start = 3;
  optional Point2 end = 4;
}

message WallPatch {
  optional string storey = 1;
  optional string wall_type = 2;
  optional Axis axis = 3;
  optional LocationLine location = 4;
  optional double base_offset = 5;
  optional TopConstraint top = 6;
  optional Phase phase = 7;
  optional EndJoin start_join = 8;
  optional EndJoin end_join = 9;
  optional string name = 10;
  optional string base_slab = 11;
}

message CurtainWallTypePatch {
  optional string name = 1;
  optional CurtainGrid u_grid = 2;
  optional CurtainGrid v_grid = 3;
  optional Profile interior_mullion = 4;
  optional Profile border_mullion = 5;
  optional CurtainPanel panel = 6;
  optional string panel_material = 7;
  optional string mullion_material = 8;
}

message CurtainPanelOverridePatch {
  optional string curtain = 1;
  optional uint32 u = 2;
  optional uint32 v = 3;
  optional CurtainPanel panel = 4;
}

message CurtainWallPatch {
  optional string storey = 1;
  optional string curtain_wall_type = 2;
  optional Axis axis = 3;
  optional double base_offset = 4;
  optional TopConstraint top = 5;
  optional CurtainGrid u_grid = 6;
  optional CurtainGrid v_grid = 7;
  optional Phase phase = 8;
  optional string name = 9;
}

message ColumnPatch {
  optional string storey = 1;
  optional string column_type = 2;
  optional Point2 position = 3;
  optional double rotation = 4;
  optional Slope tilt = 5;
  optional double base_offset = 6;
  optional TopConstraint top = 7;
  optional Phase phase = 8;
  optional string name = 9;
}

message BeamPatch {
  optional string storey = 1;
  optional string beam_type = 2;
  optional Axis axis = 3;
  optional double top_offset = 4;
  optional double end_top_offset = 5;
  optional Phase phase = 6;
  optional string name = 7;
}

message SlabPatch {
  optional string storey = 1;
  optional string slab_type = 2;
  optional VertexList boundary = 3;
  optional VertexListList holes = 4;
  optional double offset = 5;
  optional Slope slope = 6;
  optional Phase phase = 7;
  optional string name = 8;
}

message CeilingPatch {
  optional string storey = 1;
  optional string ceiling_type = 2;
  optional VertexList boundary = 3;
  optional VertexListList holes = 4;
  optional double offset = 5;
  optional Slope slope = 6;
  optional string name = 7;
}

message RoofPatch {
  optional string storey = 1;
  optional string roof_type = 2;
  optional VertexList footprint = 3;
  optional RoofShape shape = 4;
  optional double overhang = 5;
  optional double base_offset = 6;
  optional Phase phase = 7;
  optional string name = 8;
}

message OpeningPatch {
  optional string host = 1;
  optional OpeningKind kind = 2;
  optional double offset = 3;
  optional double sill_override = 4;
  optional double width = 5;
  optional double height = 6;
  optional bool flip_hand = 7;
  optional bool flip_facing = 8;
  optional string name = 9;
  optional double reveal_depth = 10;
  optional string reveal_material = 11;
}

message StairPatch {
  optional string storey = 1;
  optional Point2 start = 2;
  optional double direction = 3;
  optional double width = 4;
  optional StairFlight flight = 5;
  optional TopConstraint top = 6;
  optional double max_riser = 7;
  optional double min_tread = 8;
  optional StairStringer stringer = 9;
  optional double nosing = 10;
  optional double tread_thickness = 11;
  optional RiserKind riser = 12;
  optional double landing_depth = 13;
  optional Phase phase = 14;
  optional string name = 15;
}

message RailingPatch {
  optional string storey = 1;
  optional Point2List path = 2;
  optional double height = 3;
  optional double post_spacing = 4;
  optional Profile profile = 5;
  optional Profile post_profile = 6;
  optional Baluster baluster = 7;
  optional Infill infill = 8;
  optional string material = 9;
  optional double base_offset = 10;
  optional RailingHost host = 11;
  optional Phase phase = 12;
  optional string name = 13;
}

message RampPatch {
  optional string storey = 1;
  optional VertexList path = 2;
  optional double width = 3;
  optional double landing_start = 4;
  optional double landing_end = 5;
  optional double landing_turn = 6;
  optional double max_slope = 7;
  optional double thickness = 8;
  optional string material = 9;
  optional double base_offset = 10;
  optional TopConstraint top = 11;
  optional bool railing_left = 12;
  optional bool railing_right = 13;
  optional string name = 14;
}

message SpacePatch {
  optional string storey = 1;
  optional string number = 2;
  optional string name = 3;
  optional SpaceBoundary boundary = 4;
  optional string usage = 5;
  optional Phase phase = 6;
  optional string zone = 7;
  optional string floor_finish = 8;
  optional string wall_finish = 9;
  optional string ceiling_finish = 10;
}

message ZonePatch {
  optional string name = 1;
  optional string category = 2;
  optional double occupancy_density = 3;
}

message AreaSchemePatch {
  optional string name = 1;
  optional AreaMeasure measure = 2;
  optional StringList usages = 3;
  optional StringList zones = 4;
}

message ViewPatch {
  optional string building = 1;
  optional string name = 2;
  optional ViewKind kind = 3;
  optional string storey = 4;
  optional ViewPlane plane = 5;
  optional ViewCamera camera = 6;
  optional double cut_height = 7;
  optional double depth = 8;
  optional ViewCrop crop = 9;
  optional ViewCategoryList hidden = 10;
  optional Phase phase = 11;
  optional uint32 scale = 12;
  optional DetailLevel detail = 13;
}

message SchedulePatch {
  optional string name = 1;
  optional ScheduleCategory category = 2;
  optional ScheduleColumnList columns = 3;
  optional ScheduleSortList sort = 4;
  optional ScheduleFilterList filter = 5;
  optional ScheduleGroupList group = 6;
  optional bool itemize = 7;
  optional StringList storeys = 8;
  optional PhaseList phases = 9;
}

message PropertySetPatch {
  map<string, PropertyGroupPatch> assigned = 1;
}

message PropertyGroupPatch {
  map<string, PropertyValue> set = 1;
  repeated string removed = 2;
}

message ClassificationSetPatch {
  map<string, string> set = 1;
  repeated string removed = 2;
}

enum EntryKind {
  ENTRY_UNSPECIFIED = 0;
  ENTRY_CREATED = 1;
  ENTRY_DELETED = 2;
  ENTRY_REPLACED = 3;
  ENTRY_PATCHED = 4;
}

message MaterialEntry {
  EntryKind entry = 1;
  optional Material record = 2;
  optional MaterialPatch patch = 3;
}

message WallTypeEntry {
  EntryKind entry = 1;
  optional WallType record = 2;
  optional WallTypePatch patch = 3;
}

message SlabTypeEntry {
  EntryKind entry = 1;
  optional SlabType record = 2;
  optional SlabTypePatch patch = 3;
}

message RoofTypeEntry {
  EntryKind entry = 1;
  optional RoofType record = 2;
  optional RoofTypePatch patch = 3;
}

message ColumnTypeEntry {
  EntryKind entry = 1;
  optional ColumnType record = 2;
  optional ColumnTypePatch patch = 3;
}

message BeamTypeEntry {
  EntryKind entry = 1;
  optional BeamType record = 2;
  optional BeamTypePatch patch = 3;
}

message WindowTypeEntry {
  EntryKind entry = 1;
  optional WindowType record = 2;
  optional WindowTypePatch patch = 3;
}

message DoorTypeEntry {
  EntryKind entry = 1;
  optional DoorType record = 2;
  optional DoorTypePatch patch = 3;
}

message CurtainWallTypeEntry {
  EntryKind entry = 1;
  optional CurtainWallType record = 2;
  optional CurtainWallTypePatch patch = 3;
}

message SiteEntry {
  EntryKind entry = 1;
  optional Site record = 2;
  optional SitePatch patch = 3;
}

message BuildingEntry {
  EntryKind entry = 1;
  optional Building record = 2;
  optional BuildingPatch patch = 3;
}

message StoreyEntry {
  EntryKind entry = 1;
  optional Storey record = 2;
  optional StoreyPatch patch = 3;
}

message GridLineEntry {
  EntryKind entry = 1;
  optional GridLine record = 2;
  optional GridLinePatch patch = 3;
}

message WallEntry {
  EntryKind entry = 1;
  optional Wall record = 2;
  optional WallPatch patch = 3;
}

message CurtainWallEntry {
  EntryKind entry = 1;
  optional CurtainWall record = 2;
  optional CurtainWallPatch patch = 3;
}

message CurtainPanelOverrideEntry {
  EntryKind entry = 1;
  optional CurtainPanelOverride record = 2;
  optional CurtainPanelOverridePatch patch = 3;
}

message ColumnEntry {
  EntryKind entry = 1;
  optional Column record = 2;
  optional ColumnPatch patch = 3;
}

message BeamEntry {
  EntryKind entry = 1;
  optional Beam record = 2;
  optional BeamPatch patch = 3;
}

message SlabEntry {
  EntryKind entry = 1;
  optional Slab record = 2;
  optional SlabPatch patch = 3;
}

message RoofEntry {
  EntryKind entry = 1;
  optional Roof record = 2;
  optional RoofPatch patch = 3;
}

message OpeningEntry {
  EntryKind entry = 1;
  optional Opening record = 2;
  optional OpeningPatch patch = 3;
}

message StairEntry {
  EntryKind entry = 1;
  optional Stair record = 2;
  optional StairPatch patch = 3;
}

message RailingEntry {
  EntryKind entry = 1;
  optional Railing record = 2;
  optional RailingPatch patch = 3;
}

message RampEntry {
  EntryKind entry = 1;
  optional Ramp record = 2;
  optional RampPatch patch = 3;
}

message SpaceEntry {
  EntryKind entry = 1;
  optional Space record = 2;
  optional SpacePatch patch = 3;
}

message CeilingTypeEntry {
  EntryKind entry = 1;
  optional CeilingType record = 2;
  optional CeilingTypePatch patch = 3;
}

message CeilingEntry {
  EntryKind entry = 1;
  optional Ceiling record = 2;
  optional CeilingPatch patch = 3;
}

message ZoneEntry {
  EntryKind entry = 1;
  optional Zone record = 2;
  optional ZonePatch patch = 3;
}

message AreaSchemeEntry {
  EntryKind entry = 1;
