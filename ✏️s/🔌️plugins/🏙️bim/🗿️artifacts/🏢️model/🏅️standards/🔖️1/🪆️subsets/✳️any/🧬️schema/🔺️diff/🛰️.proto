  EntryKind entry = 1;
  optional FamilyParameter record = 2;
  optional FamilyParameterPatch patch = 3;
}

message FamilySolidEntry {
  EntryKind entry = 1;
  optional FamilySolid record = 2;
  optional FamilySolidPatch patch = 3;
}

message WallSweepEntry {
  EntryKind entry = 1;
  optional WallSweep record = 2;
  optional WallSweepPatch patch = 3;
}

message ScheduleEntry {
  EntryKind entry = 1;
  optional Schedule record = 2;
  optional SchedulePatch patch = 3;
}

message PropertyTemplateEntry {
  EntryKind entry = 1;
  optional PropertyTemplate record = 2;
  optional PropertyTemplatePatch patch = 3;
}

message ClassificationSystemEntry {
  EntryKind entry = 1;
  optional ClassificationSystem record = 2;
  optional ClassificationSystemPatch patch = 3;
