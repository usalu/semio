}

message SheetEntry {
  EntryKind entry = 1;
  optional Sheet record = 2;
  optional SheetPatch patch = 3;
}

message ViewportEntry {
  EntryKind entry = 1;
  optional Viewport record = 2;
  optional ViewportPatch patch = 3;
}

message SheetRevisionEntry {
  EntryKind entry = 1;
  optional SheetRevision record = 2;
