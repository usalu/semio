cargo-features = [ "trim-paths" ]

[workspace]
resolver = "2"
members = [
    "📦️packages/🦀️rust",
]
exclude = [
    "**/🏅️standards/**",
    "**/🏭️bridge/**",
    "**/👽️guest/**",
    "**/🔮️oracles/**",
]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**"
]
member-manifests = [ "**/📦️packages/🦀️rust/Cargo.toml" ]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

[workspace.dependencies.semio-framework-pack]
path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-artifact-reference]
path = "../../../../../🧰️framework/🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-geometry]
path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-job]
path = "../../../../../🧰️framework/🔨️modules/🧵️job/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-ui-contract]
path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-csv]
path = "../../../🗄️stdio/🗿️artifacts/📊️csv/📦️packages/🦀️rust"


[workspace.dependencies.semio-s-artifact-stdio-gltf-model]
path = "../../../🗄️stdio/🗿️artifacts/🧊️gltf/🏅️standards/🔖️2.0/🪆️subsets/♾️any/🧬️schema/📦️packages/🦀️rust"
[workspace.dependencies.semio-s-artifact-stdio-ifc-2x3-base]
path = "../../../🗄️stdio/🗿️artifacts/🏗️ifc/🏅️standards/🔖️2x3/🪆️subsets/🧱️base/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-ifc-2x3-base-model]
path = "../../../🗄️stdio/🗿️artifacts/🏗️ifc/🏅️standards/🔖️2x3/🪆️subsets/🧱️base/🧬️schema/📦️packages/🦀️rust"
[workspace.dependencies.semio-s-artifact-stdio-json]
path = "../../../🗄️stdio/🗿️artifacts/🧾️json/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-pdf]
path = "../../../🗄️stdio/🗿️artifacts/📖️pdf/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-svg]
path = "../../../🗄️stdio/🗿️artifacts/🎨️svg/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xml]
path = "../../../🗄️stdio/🗿️artifacts/📰️xml/📦️packages/🦀️rust"

[workspace.dependencies.serde]
version = "1.0.228"
features = [ "derive" ]

[workspace.dependencies.serde_json]
version = "1.0.149"
features = [ "raw_value" ]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

  [workspace.lints.rust.future_incompatible]
  level = "warn"
  priority = -1

  [workspace.lints.rust.rust_2018_idioms]
  level = "warn"
  priority = -1

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

  [workspace.lints.clippy.all]
  level = "warn"
  priority = -1

