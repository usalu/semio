cargo-features = [ "trim-paths" ]

[workspace]
resolver = "2"
members = [
    "⚙️engine/📦️packages/🦀️rust",
]
exclude = [
    "**/🏅️standards/**",
    "**/🏭️bridge/**",
    "**/👽️guest/**",
    "**/🔮️oracles/**",
    "🗿️artifacts/**",
    "🗿️artifacts/◻️2d",
    "🗿️artifacts/🔲️grid2d",
    "🗿️artifacts/🖼️bitmap",
    "🗿️artifacts/🧊️3d",
    "🗿️artifacts/🧱️grid3d",
    "🧩️extensions/**",
]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**",
  "🗿️artifacts/**",
  "🧩️extensions/**"
]
member-manifests = [ "**/📦️packages/🦀️rust/Cargo.toml" ]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

[workspace.dependencies.semio-framework-dispatch-macros]
path = "../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-geometry]
path = "../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-graph-engine]
path = "../../../🧰️framework/🔨️modules/🕸️graph/⚙️engine/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-job]
path = "../../../🧰️framework/🔨️modules/🧵️job/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-os-kernel]
path = "../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-value-derive]
path = "../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust"

[workspace.dependencies.serde_json]
version = "1.0.149"
features = [ "raw_value" ]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

  [workspace.lints.rust.future_incompatible]
  level = "warn"
  priority = -1

  [workspace.lints.rust.rust_2018_idioms]
  level = "warn"
  priority = -1

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

  [workspace.lints.clippy.all]
  level = "warn"
  priority = -1

