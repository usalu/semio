cargo-features = [ "trim-paths" ]

[workspace]
resolver = "2"
members = [
  "🏅️standards/🔖️1/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🎚️config/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🎭️modes/✏️edit/🪟️windows/👁️preview/🧪️tests/🔬️unit/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🫧️transient/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/💡️inferences/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🔺️diff/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/🎲️change-seed/🧪️tests/🎲️reseeds/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/📌️pin-slot/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/📦️packages/🦀️rust",
  "📦️packages/🦀️rust",
]
exclude = [
    "**/🏭️bridge/**",
    "**/👽️guest/**",
    "**/🔮️oracles/**",
]

[workspace.metadata.semio.mutation-inventory]
script = "🏭️bridge/📜️script.ts"
roots = ["."]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**",
]
member-manifests = [ "**/📦️packages/🦀️rust/Cargo.toml" ]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

[workspace.dependencies.pack]
path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust"
package = "semio-framework-pack"

[workspace.dependencies.semio-framework]
path = "../../../../../🧰️framework/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-artifact-reference]
path = "../../../../../🧰️framework/🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-async-macros]
path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-dispatch-macros]
path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-geometry]
path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-job]
path = "../../../../../🧰️framework/🔨️modules/🧵️job/📦️packages/🦀️rust"


[workspace.dependencies.semio-framework-job-payload]
path = "../../../../../🧰️framework/🔨️modules/🧵️job/📬️outcome/📦️builder/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-os-flow]
path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-os-infinite]
path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-os-kernel]
path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-plugin]
path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-schema]
path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-tool-machine]
path = "../../../../../🧰️framework/🔨️modules/🛠️tool-machine/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-tool-run]
path = "../../../../../🧰️framework/🔨️modules/⏯️tool-run/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-ui-contract]
path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-ui-styling]
path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-value-derive]
path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-png]
path = "../../../🗄️stdio/🗿️artifacts/📷️png/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio-image]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/🖼️image/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-txt]
path = "../../../🗄️stdio/🗿️artifacts/🔤️txt/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-plugin-wfc-engine]
path = "../../⚙️engine/📦️packages/🦀️rust"

[workspace.dependencies.serde]
version = "1.0.228"
features = [ "derive" ]

[workspace.dependencies.serde_json]
version = "1.0.149"
features = [ "raw_value" ]

[workspace.dependencies.semio-s-wfc-sqlite-bitmap]
path = "../../🪶️sqlite/🎨️bitmap/📦️packages/🦀️rust"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

  [workspace.lints.rust.future_incompatible]
  level = "warn"
  priority = -1

  [workspace.lints.rust.rust_2018_idioms]
  level = "warn"
  priority = -1

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

  [workspace.lints.clippy.all]
  level = "warn"
  priority = -1

