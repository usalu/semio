syntax = "proto3";
package semio.s.wfc.bitmap.diff;

// 🔺️ bitmap diff — scalars are optional absolutes; every list is a positional list delta (`protocol::list_delta`): removed ids at their base index, inserted rows at their after index, moved ids, id-keyed modifications.

message BitmapSize {
  uint32 width = 1;
  uint32 height = 2;
}

message BitmapInputWrite {
  oneof write {
    BitmapPixelRegion region = 1;
    BitmapPixelCells cells = 2;
  }
}

message BitmapPixelRegion {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  bytes pixels = 5;
}

message BitmapPixelCell {
  uint32 x = 1;
  uint32 y = 2;
  uint32 value = 3;
}

message BitmapPixelCells {
  repeated BitmapPixelCell cells = 1;
}

message BitmapInputPatch {
  optional BitmapSize size = 1;
  repeated BitmapInputWrite writes = 2;
}

message BitmapPaletteInsertion {
  uint32 index = 1;
  BitmapColor color = 2;
}

message BitmapPaletteRecolor {
  uint32 index = 1;
  BitmapColor color = 2;
}

message BitmapPaletteDelta {
  repeated uint32 removed = 1;
  repeated BitmapPaletteInsertion inserted = 2;
  repeated BitmapPaletteRecolor recolored = 3;
}

message BitmapPinnedPatch {
  optional uint32 color = 1;
}

message BitmapPinnedRemoval {
  string id = 1;
  uint32 index = 2;
}

message BitmapPinnedInsertion {
  uint32 index = 1;
  BitmapPinnedPixel row = 2;
}

message BitmapPinnedRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BitmapPinnedModification {
  string id = 1;
  BitmapPinnedPatch patch = 2;
}

message BitmapPinnedDelta {
  repeated BitmapPinnedRemoval removed = 1;
  repeated BitmapPinnedInsertion inserted = 2;
  repeated BitmapPinnedRelocation moved = 3;
  repeated BitmapPinnedModification modified = 4;
}

message BitmapDiff {
  optional string schema = 1;
  optional uint64 seed = 2;
  optional BitmapInputPatch input = 3;
  optional BitmapPaletteDelta palette = 4;
  optional BitmapOutputSpec output = 5;
  optional BitmapOverlappingModel model = 6;
  BitmapPinnedDelta pinned = 7;
}
