syntax = "proto3";
package semio.s.wfc.bitmap.artifact;

message BitmapArtifact {
  BitmapSnapshot snapshot = 1;
}

message BitmapColor {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
  uint32 a = 4;
}

message BitmapInput {
  uint32 width = 1;
  uint32 height = 2;
  repeated BitmapColor palette = 3;
  string pixels = 4;
}

message BitmapOutputSpec {
  uint32 width = 1;
  uint32 height = 2;
  bool periodic = 3;
}

message BitmapOverlappingModel {
  uint32 pattern_size = 1;
  uint32 symmetry = 2;
  bool periodic_input = 3;
  optional uint32 ground = 4;
}

message BitmapPinnedPixel {
  uint32 x = 1;
  uint32 y = 2;
  uint32 color = 3;
}

message BitmapSnapshot {
  string schema = 1;
  uint64 seed = 2;
  BitmapInput input = 3;
  BitmapOutputSpec output = 4;
  BitmapOverlappingModel model = 5;
  repeated BitmapPinnedPixel pinned = 6;
}
