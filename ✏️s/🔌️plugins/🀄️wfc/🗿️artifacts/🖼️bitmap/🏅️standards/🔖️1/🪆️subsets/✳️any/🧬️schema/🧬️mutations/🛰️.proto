syntax = "proto3";
package semio.s.wfc.bitmap.mutations;

import "📸️snapshot/🛰️.proto";

message ChangeSeed { uint64 seed = 1; }
message ResizeInput { uint32 width = 1; uint32 height = 2; }
message SetInputPixels { uint32 x = 1; uint32 y = 2; uint32 width = 3; uint32 height = 4; string pixels = 5; }
message AddPaletteColor { uint64 index = 1; semio.s.wfc.bitmap.snapshot.BitmapColor color = 2; }
message ChangePaletteColor { uint64 index = 1; semio.s.wfc.bitmap.snapshot.BitmapColor color = 2; }
message RemovePaletteColor { uint64 index = 1; }
message ResizeOutput { uint32 width = 1; uint32 height = 2; bool periodic = 3; }
message ChangeModel { uint32 pattern_size = 1; uint32 symmetry = 2; bool periodic_input = 3; optional uint32 ground = 4; }
message PinPixel { uint32 x = 1; uint32 y = 2; uint32 color = 3; }
message UnpinPixel { uint32 x = 1; uint32 y = 2; }

message BitmapMutation {
  oneof kind {
    ChangeSeed change_seed = 1;
    ResizeInput resize_input = 2;
    SetInputPixels set_input_pixels = 3;
    AddPaletteColor add_palette_color = 4;
    ChangePaletteColor change_palette_color = 5;
    RemovePaletteColor remove_palette_color = 6;
    ResizeOutput resize_output = 7;
    ChangeModel change_model = 8;
    PinPixel pin_pixel = 9;
    UnpinPixel unpin_pixel = 10;
  }
}
