# 🔺️ bitmap diff — scalars are optional absolutes; every list is a positional list delta: removed ids at their base index, inserted rows at their after index, moved ids, id-keyed modifications.

type BitmapPinnedPatch {
  color: Int
}

type BitmapPinnedRemoval {
  id: String!
  index: Int!
}

type BitmapPinnedInsertion {
  index: Int!
  row: BitmapPinnedPixel!
}

type BitmapPinnedRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BitmapPinnedModification {
  id: String!
  patch: BitmapPinnedPatch!
}

type BitmapPinnedDelta {
  removed: [BitmapPinnedRemoval!]!
  inserted: [BitmapPinnedInsertion!]!
  moved: [BitmapPinnedRelocation!]!
  modified: [BitmapPinnedModification!]!
}

type BitmapDiff {
  schema: String @state(class: ARTIFACT)
  seed: Float @state(class: ARTIFACT)
  input: BitmapInputPatch @state(class: ARTIFACT)
  palette: BitmapPaletteDelta @state(class: ARTIFACT)
  output: BitmapOutputSpec @state(class: ARTIFACT)
  model: BitmapOverlappingModel @state(class: ARTIFACT)
  pinned: BitmapPinnedDelta! @state(class: ARTIFACT)
}
