syntax = "proto3";
package semio.s.wfc.grid2d.diff;

// 🔺️ grid2d diff — scalars are optional absolutes; every list is a positional list delta (`protocol::list_delta`): removed ids at their base index, inserted rows at their after index, moved ids, id-keyed modifications.

message Grid2dTilePatch {
  optional double weight = 1;
  optional WfcTileMedia2d media = 2;
  optional string label = 3; // set or clear
}

message Grid2dTilesRemoval {
  string id = 1;
  uint32 index = 2;
}

message Grid2dTilesInsertion {
  uint32 index = 1;
  WfcTile2d row = 2;
}

message Grid2dTilesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Grid2dTilesModification {
  string id = 1;
  Grid2dTilePatch patch = 2;
}

message Grid2dTilesDelta {
  repeated Grid2dTilesRemoval removed = 1;
  repeated Grid2dTilesInsertion inserted = 2;
  repeated Grid2dTilesRelocation moved = 3;
  repeated Grid2dTilesModification modified = 4;
}

message Grid2dRulePatch {
  optional string tile_a_id = 1;
  optional string tile_b_id = 2;
  optional WfcDirection2d direction = 3;
  optional bool allowed = 4;
}

message Grid2dRulesRemoval {
  string id = 1;
  uint32 index = 2;
}

message Grid2dRulesInsertion {
  uint32 index = 1;
  WfcAdjacencyRule2d row = 2;
}

message Grid2dRulesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Grid2dRulesModification {
  string id = 1;
  Grid2dRulePatch patch = 2;
}

message Grid2dRulesDelta {
  repeated Grid2dRulesRemoval removed = 1;
  repeated Grid2dRulesInsertion inserted = 2;
  repeated Grid2dRulesRelocation moved = 3;
  repeated Grid2dRulesModification modified = 4;
}

message Grid2dPinnedPatch {
  optional string tile_id = 1;
}

message Grid2dPinnedRemoval {
  string id = 1;
  uint32 index = 2;
}

message Grid2dPinnedInsertion {
  uint32 index = 1;
  WfcPinnedCell2d row = 2;
}

message Grid2dPinnedRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Grid2dPinnedModification {
  string id = 1;
  Grid2dPinnedPatch patch = 2;
}

message Grid2dPinnedDelta {
  repeated Grid2dPinnedRemoval removed = 1;
  repeated Grid2dPinnedInsertion inserted = 2;
  repeated Grid2dPinnedRelocation moved = 3;
  repeated Grid2dPinnedModification modified = 4;
}

message Grid2dMaskedPatch {
}

message Grid2dMaskedRemoval {
  string id = 1;
  uint32 index = 2;
}

message Grid2dMaskedInsertion {
  uint32 index = 1;
  WfcCell2d row = 2;
}

message Grid2dMaskedRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Grid2dMaskedModification {
  string id = 1;
  Grid2dMaskedPatch patch = 2;
}

message Grid2dMaskedDelta {
  repeated Grid2dMaskedRemoval removed = 1;
  repeated Grid2dMaskedInsertion inserted = 2;
  repeated Grid2dMaskedRelocation moved = 3;
  repeated Grid2dMaskedModification modified = 4;
}

message Grid2dDiff {
  optional string schema = 1;
  optional uint64 seed = 2;
  optional uint32 width = 3;
  optional uint32 height = 4;
  optional double cell_width = 5;
  optional double cell_height = 6;
  optional bool periodic_x = 7;
  optional bool periodic_y = 8;
  Grid2dTilesDelta tiles = 9;
  Grid2dRulesDelta rules = 10;
  Grid2dPinnedDelta pinned = 11;
  Grid2dMaskedDelta masked = 12;
}
