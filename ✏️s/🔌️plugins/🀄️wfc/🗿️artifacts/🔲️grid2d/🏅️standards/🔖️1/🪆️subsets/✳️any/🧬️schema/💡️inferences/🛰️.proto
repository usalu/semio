syntax = "proto3";
package semio.s.wfc.grid2d.inference;

message Grid2dAssignment {
  uint32 x = 1;
  uint32 y = 2;
  string tile_id = 3;
}

message Grid2dCellEntropy {
  uint32 x = 1;
  uint32 y = 2;
  double value = 3;
}

message Grid2dInferenceCommit {
  repeated Grid2dAssignment assignments = 1;
  bool contradiction = 2;
  repeated Grid2dCellEntropy entropy = 3;
}
