syntax = "proto3";
package semio.s.wfc.grid2d;

enum WfcDirection2d {
  LEFT = 0;
  RIGHT = 1;
  TOP = 2;
  BOTTOM = 3;
}

message WfcColor {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
  uint32 a = 4;
}

message WfcPoint2 {
  double x = 1;
  double y = 2;
}

message WfcPathSegment {
  string kind = 1;
  WfcPoint2 to = 2;
  WfcPoint2 ctrl = 3;
  WfcPoint2 ctrl1 = 4;
  WfcPoint2 ctrl2 = 5;
}

message WfcVectorPath {
  repeated WfcPathSegment segments = 1;
  WfcColor fill = 2;
  WfcColor stroke = 3;
  double stroke_width = 4;
}

message WfcTileMedia2d {
  string kind = 1;
  uint32 width = 2;
  uint32 height = 3;
  repeated WfcColor palette = 4;
  string pixels = 5;
  repeated WfcVectorPath paths = 6;
  string child = 7;
}

message WfcTile2d {
  string id = 1;
  string label = 2;
  double weight = 3;
  WfcTileMedia2d media = 4;
}

message WfcAdjacencyRule2d {
  string id = 1;
  string tile_a_id = 2;
  string tile_b_id = 3;
  WfcDirection2d direction = 4;
  bool allowed = 5;
}

message WfcPinnedCell2d {
  uint32 x = 1;
  uint32 y = 2;
  string tile_id = 3;
}

message WfcCell2d {
  uint32 x = 1;
  uint32 y = 2;
}

message Grid2dSnapshot {
  string schema = 1;
  uint64 seed = 2;
  uint32 width = 3;
  uint32 height = 4;
  double cell_width = 5;
  double cell_height = 6;
  bool periodic_x = 7;
  bool periodic_y = 8;
  repeated WfcTile2d tiles = 9;
  repeated WfcAdjacencyRule2d rules = 10;
  repeated WfcPinnedCell2d pinned = 11;
  repeated WfcCell2d masked = 12;
}
