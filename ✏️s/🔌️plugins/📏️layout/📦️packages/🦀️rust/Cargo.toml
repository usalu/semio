cargo-features = ["trim-paths"]

[package]
name = "semio-s-plugin-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Layout plugin - one crate for the layout artifact (diff/op/dsl/pack/spr/engine) and the layout play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:layout"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "layout"
ports = { react = 6079, wgpu = 6179 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🖼️canvas/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas" }
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
pack = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parley = { version = "0.5.0" }
swash = { version = "0.2.6", default-features = false, features = ["render", "std"] }
fontique = "0.4.0"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
base64 = "0.22.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }

# 🚧️ TEMPORARY verification-only overlay (see master TEMPLATE.md §3 "chicken-and-egg"). The new crate
# is not yet a workspace member (registrar hasn't pruned the old member lines / added this one), and
# Cargo refuses to build a manifest that sits inside a workspace without being a member of it. This
# overlay makes the crate its own workspace root for the duration of standalone verification; DELETE
# this whole region (and the nested target/ + Cargo.lock it creates) at registrar handoff.
[workspace]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[profile.wasm-release.package.semio-framework-os-kernel-store]
codegen-units = 1
