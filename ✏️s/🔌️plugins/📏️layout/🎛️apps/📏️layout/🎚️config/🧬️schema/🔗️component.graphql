type LayoutConfig {
  activePageId: String! @state(class: CONFIG)
  selectedIds: [String!]! @state(class: CONFIG)
  hoveredId: String @state(class: CONFIG)
  dropPreview: LayoutDropPreviewState! @state(class: CONFIG)
  engagementInput: String! @state(class: CONFIG)
  camera: LayoutCamera! @state(class: CONFIG)
  previewCamera: LayoutCamera! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}
type LayoutDropPreviewState {
  kind: String!
  x: Float!
  y: Float!
}
type LayoutCamera {
  x: Float!
  y: Float!
  zoom: Float!
}
