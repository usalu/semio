syntax = "proto3";
package semio.app.layout.layout;
message LayoutConfig {
  // @state local-ui
  string active_page_id = 1;
  // @state local-ui
  repeated string selected_ids = 2;
  // @state local-ui
  optional string hovered_id = 3;
  // @state local-ui
  LayoutDropPreviewState drop_preview = 4;
  // @state local-ui
  string engagement_input = 5;
  // @state local-ui
  LayoutCamera camera = 6;
  // @state local-ui
  LayoutCamera preview_camera = 7;
  // @state local-ui
  string locale = 8;
}
message LayoutDropPreviewState {
  string kind = 1;
  double x = 2;
  double y = 3;
}
message LayoutCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
