[package]
name = "semio-s-app-layout-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Layout app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/🔨️modules/🖱️ui/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
layout = { path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/⚡️implementations/🦀️rust", package = "semio-s-app-layout" }
layout_engine = { path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-layout-engine" }
layout_op = { path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/🔨️modules/🔧️op/⚡️implementations/🦀️rust", package = "semio-s-app-layout-op" }
layout_protocol = { path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-s-app-layout-protocol" }
infinite_canvas = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🖼️canvas/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"

[dev-dependencies]
layout_dsl = { path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-s-app-layout-dsl" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }
