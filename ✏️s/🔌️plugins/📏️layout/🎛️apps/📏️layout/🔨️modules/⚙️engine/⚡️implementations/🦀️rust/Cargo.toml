[package]
name = "semio-s-app-layout-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Layout app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/🔨️modules/⚙️engine/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
layout = { path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/⚡️implementations/🦀️rust", package = "semio-s-app-layout" }
layout_dsl = { path = "../../../../../../../../../✏️s/🔌️plugins/📏️layout/🎛️apps/📏️layout/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-s-app-layout-dsl" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
infinite_canvas = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🖼️canvas/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas", default-features = false }
semio-framework-os = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
# 🔌️ `PortMultiplicity` isn't re-exported by `semio-framework-plugin` (WORKFLOWS-END-TO-END-TYPED-PORTS
# port recipe) — a direct dependency on the core crate is the minimal fix, mirroring how the plugin
# crate itself depends on it.
semio-framework-core = { path = "../../../../../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
parley = { version = "0.5.0" }
swash = { version = "0.2.6", default-features = false, features = ["render", "std"] }
fontique = "0.4.0"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "2.0.12"
