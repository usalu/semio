# 📸️ Layout snapshot schema — persistent fields only.

type LayoutSnapshot {
  schema: String! @state(class: PERSISTENT)
  name: String! @state(class: PERSISTENT)
  grid: GridSettings! @state(class: PERSISTENT)
  paragraphStyles: [ParagraphStyle!]! @state(class: PERSISTENT)
  characterStyles: [CharacterStyle!]! @state(class: PERSISTENT)
  stories: [TextStory!]! @state(class: PERSISTENT)
  links: [ImageLink!]! @state(class: PERSISTENT)
  parentPages: [ParentPage!]! @state(class: PERSISTENT)
  spreads: [Spread!]! @state(class: PERSISTENT)
  pages: [Page!]! @state(class: PERSISTENT)
  printTarget: String @state(class: PERSISTENT)
  dataFieldsJson: String @state(class: PERSISTENT)
}

type GridSettings {
  baselineGrid: Float!
  baselineOffset: Float!
  snapToBaseline: Boolean!
}

type ParagraphStyle { id: String! }
type CharacterStyle { id: String! }
type TextStory { id: String! }
type ImageLink { id: String! }
type ParentPage { id: String! }
type Spread { id: String! }
type Page { id: String! }
