syntax = "proto3";
package semio.s.layout.layout.snapshot;

message LayoutSnapshot {
  string schema = 1; // @state persistent
  string name = 2; // @state persistent
  GridSettings grid = 3; // @state persistent
  repeated ParagraphStyle paragraph_styles = 4; // @state persistent
  repeated CharacterStyle character_styles = 5; // @state persistent
  repeated TextStory stories = 6; // @state persistent
  repeated ImageLink links = 7; // @state persistent
  repeated ParentPage parent_pages = 8; // @state persistent
  repeated Spread spreads = 9; // @state persistent
  repeated Page pages = 10; // @state persistent
  optional string print_target = 11; // @state persistent
  optional string data_fields_json = 12; // @state persistent
}

message GridSettings {
  double baseline_grid = 1;
  double baseline_offset = 2;
  bool snap_to_baseline = 3;
}

message ParagraphStyle { string id = 1; }
message CharacterStyle { string id = 1; }
message TextStory { string id = 1; }
message ImageLink { string id = 1; }
message ParentPage { string id = 1; }
message Spread { string id = 1; }
message Page { string id = 1; }
