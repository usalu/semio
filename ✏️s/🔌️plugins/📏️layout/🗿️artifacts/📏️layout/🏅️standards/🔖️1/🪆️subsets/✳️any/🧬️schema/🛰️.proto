syntax = "proto3";
package semio.s.layout.layout.artifact;

message LayoutArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  string name = 2;
  // @state artifact
  GridSettings grid = 3;
  // @state artifact
  repeated ParagraphStyle paragraph_styles = 4;
  // @state artifact
  repeated CharacterStyle character_styles = 5;
  // @state artifact
  repeated TextStory stories = 6;
  // @state artifact
  repeated ImageLink links = 7;
  // @state artifact
  repeated ParentPage parent_pages = 8;
  // @state artifact
  repeated Spread spreads = 9;
  // @state artifact
  repeated Page pages = 10;
  // @state artifact
  optional string print_target = 11;
  // @state artifact
  optional string data_fields_json = 12;
}

message GridSettings {
  double baseline_grid = 1;
  double baseline_offset = 2;
  bool snap_to_baseline = 3;
}

message LayoutDropPreviewState {
  string kind = 1;
  double x = 2;
  double y = 3;
}

message ParagraphStyle { string id = 1; }
message CharacterStyle { string id = 1; }
message TextStory { string id = 1; }
message ImageLink { string id = 1; }
message ParentPage { string id = 1; }
message Spread { string id = 1; }
message Page { string id = 1; }

message LayoutStringList {
  repeated string values = 1;
}
