# 🧬️ LayoutMutation — closed semantic mutation vocabulary for the layout document, mirrors
# `🧬️mutations/🦀️.rs`'s `LayoutMutation` enum and its 28 per-verb leaf structs
# field-for-field. GraphQL unions self-discriminate via `__typename`, so the wire-level JSON tagging
# scheme (layout's enum has no `#[serde(tag = ...)]`, hence an externally-tagged `{ "Variant": {...}
# }` shape on the JSON side — see the TS sibling file's header for the full citation) has no bearing
# on this SDL shape, matching the `raster`/`RasterMutation` precedent's own union convention.

type LayoutBounds {
  x: Float!
  y: Float!
  w: Float!
  h: Float!
  rotation: Float!
}

type LayoutRect {
  x: Float!
  y: Float!
  w: Float!
  h: Float!
}

type PageMargins {
  top: Float!
  right: Float!
  bottom: Float!
  left: Float!
}

type PageColumns {
  count: Int!
  gutter: Float!
}

type Layer {
  id: String!
  name: String!
  visible: Boolean!
  locked: Boolean!
  objectIds: [String!]!
}

union Frame = FrameRect | FrameText | FrameImage

type FrameRect {
  kind: String!
  id: String!
  layerId: String!
  bounds: LayoutBounds!
  locked: Boolean
  visible: Boolean
  fill: [Float!]
  stroke: [Float!]
}

type FrameText {
  kind: String!
  id: String!
  layerId: String!
  bounds: LayoutBounds!
  locked: Boolean
  visible: Boolean
  storyId: String!
  threadNext: String
  columns: Int!
  inset: LayoutRect!
  wrapMode: String!
}

type FrameImage {
  kind: String!
  id: String!
  layerId: String!
  bounds: LayoutBounds!
  locked: Boolean
  visible: Boolean
  linkId: String!
}

type PageOverride {
  objectId: String!
  bounds: LayoutBounds
  visible: Boolean
  locked: Boolean
}

type Page {
  id: String!
  name: String!
  spreadId: String!
  parentPageId: String
  width: Float!
  height: Float!
  margins: PageMargins!
  columns: PageColumns!
  guides: [LayoutRect!]!
  layerIds: [String!]!
  layers: [Layer!]!
  frames: [Frame!]!
  overrides: [PageOverride!]!
}

type TextStyleRun {
  start: Int!
  end: Int!
  paragraphStyleId: String
  characterStyleId: String
}

type TextStory {
  id: String!
  content: String!
  styleRuns: [TextStyleRun!]!
}

type ImageLink {
  id: String!
  path: String!
  hash: String!
  width: Int!
  height: Int!
  dpi: Int!
  colorProfile: String
  state: String
  proxyDataUrl: String
}

type RenameLayout {
  newName: String!
}

type ChangePrintTarget {
  newPrintTarget: String
}

type ChangeDataFields {
  newFields: FormDictionaryInput
}

type CreatePage {
  page: Page!
  index: Int
}

type DeletePage {
  id: String!
}

type RenamePage {
  id: String!
  newName: String!
}

type ChangePageWidth {
  id: String!
  newWidth: Float!
}

type ChangePageHeight {
  id: String!
  newHeight: Float!
}

type UpdatePageMargins {
  id: String!
  top: Float!
  right: Float!
  bottom: Float!
  left: Float!
}

type UpdatePageColumns {
  id: String!
  count: Int!
  gutter: Float!
}

type ReorderPages {
  id: String!
  toIndex: Int!
}

type CreateStory {
  story: TextStory!
  index: Int
}

type DeleteStory {
  id: String!
}

type EditStory {
  id: String!
  newContent: String!
}

type CreateLink {
  link: ImageLink!
  index: Int
}

type DeleteLink {
  id: String!
}

type ChangeLinkPath {
  id: String!
  newPath: String!
}

type CreateFrame {
  pageId: String!
  frame: Frame!
  index: Int
  layerId: String
}

type DeleteFrame {
  pageId: String!
  frameId: String!
}

type MoveFrame {
  pageId: String!
  frameId: String!
  newX: Float!
  newY: Float!
}

type ResizeFrame {
  pageId: String!
  frameId: String!
  newWidth: Float!
  newHeight: Float!
}

type RotateFrame {
  pageId: String!
  frameId: String!
  newRotation: Float!
}

type ChangeFrameFill {
  pageId: String!
  frameId: String!
  newFill: [Float!]
}

type ChangeFrameStroke {
  pageId: String!
  frameId: String!
  newStroke: [Float!]
}

type ChangeFrameWrapMode {
  pageId: String!
  frameId: String!
  newWrapMode: String!
}

type ChangeFrameColumns {
  pageId: String!
  frameId: String!
  newColumns: Int!
}

type UpdateGrid {
  baselineGrid: Float!
  baselineOffset: Float!
  snapToBaseline: Boolean!
}

type SetFrameFlags {
  pageId: String!
  frameId: String!
  locked: Boolean
  visible: Boolean
}

type UpdateParagraphStyle {
  id: String!
  name: String!
  fontFamily: String!
  fontSize: Float!
  fontWeight: Int!
  leading: Float!
  tracking: Float!
  alignment: String!
}

type UpdateTextFrame {
  pageId: String!
  frameId: String!
  storyId: String!
  threadNext: String
  insetX: Float!
  insetY: Float!
  insetWidth: Float!
  insetHeight: Float!
}

type UpdateLayer {
  pageId: String!
  layerId: String!
  name: String!
  visible: Boolean!
  locked: Boolean!
}

type CreateCharacterStyle {
  id: String!
  name: String
}

type DeleteCharacterStyle {
  id: String!
}

type UpdateCharacterStyle {
  id: String!
  name: String
  fontFamily: String
  fontSize: Float
  fontWeight: Int
  italic: Boolean
  color: [Float!]
  tracking: Float
}

type UpdateParentPage {
  id: String!
  name: String!
  width: Float!
  height: Float!
}

type UpdateSpread {
  id: String!
  name: String!
}

type SetPageParent {
  id: String!
  parentPageId: String
}

type SetPageGuides {
  id: String!
  guides: [LayoutRect!]!
}

type SetStoryRuns {
  id: String!
  runs: [TextStyleRun!]!
}

type UpdateLink {
  id: String!
  width: Int!
  height: Int!
  dpi: Int!
  colorProfile: String
}

type SetPageOverrides {
  id: String!
  overrides: [PageOverride!]!
}

type CreateLayer {
  pageId: String!
  id: String!
  name: String!
  remove: Boolean!
}

type SetFrameLayer {
  pageId: String!
  frameId: String!
  layerId: String!
}

type SetDrawingText {
  index: Int!
  text: String!
}

type ReorderFrame {
  pageId: String!
  frameId: String!
  forward: Boolean!
}

type DragFrames {
  pageId: String!
  targets: [String!]!
  dx: Float!
  dy: Float!
}

type RotateFrames {
  pageId: String!
  targets: [String!]!
  pivotX: Float!
  pivotY: Float!
  angle: Float!
}

type ScaleFrames {
  pageId: String!
  targets: [String!]!
  pivotX: Float!
  pivotY: Float!
  sx: Float!
  sy: Float!
}

union LayoutMutation =
    RenameLayout
  | ChangePrintTarget
  | ChangeDataFields
  | CreatePage
  | DeletePage
  | RenamePage
  | ChangePageWidth
  | ChangePageHeight
  | UpdatePageMargins
  | UpdatePageColumns
  | ReorderPages
  | CreateStory
  | DeleteStory
  | EditStory
  | CreateLink
  | DeleteLink
  | ChangeLinkPath
  | CreateFrame
  | DeleteFrame
  | MoveFrame
  | ResizeFrame
  | RotateFrame
  | ChangeFrameFill
  | ChangeFrameStroke
  | ChangeFrameWrapMode
  | ChangeFrameColumns
  | UpdateGrid
  | SetFrameFlags
  | UpdateParagraphStyle
  | UpdateTextFrame
  | UpdateLayer
  | CreateCharacterStyle
  | DeleteCharacterStyle
  | UpdateCharacterStyle
  | UpdateParentPage
  | UpdateSpread
  | SetPageParent
  | SetPageGuides
  | SetStoryRuns
  | UpdateLink
  | SetPageOverrides
  | CreateLayer
  | SetFrameLayer
  | SetDrawingText
  | ReorderFrame
  | DragFrames
  | RotateFrames
  | ScaleFrames
