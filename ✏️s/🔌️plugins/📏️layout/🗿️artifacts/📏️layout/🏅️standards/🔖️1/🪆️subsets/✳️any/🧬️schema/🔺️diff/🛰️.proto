syntax = "proto3";
package semio.s.layout.layout.diff;
import "✏️s/🔌️plugins/📏️layout/🗿️artifacts/📏️layout/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🔗️link/🧬️schema/🛰️.proto";
message ParagraphStylePatch { optional string name = 1; }
message CharacterStylePatch { optional string name = 1; }
message ParentPagePatch { optional string name = 1; }
message SpreadPatch { optional string name = 1; }
message TextStoryPatch { optional string content = 1; }
message ImageLinkPatch { optional string path = 1; }
message FramePatch { optional double x = 1; optional double y = 2; optional double width = 3; optional double height = 4; optional semio.s.layout.layout.artifact.Rgba fill = 5; optional semio.s.layout.layout.artifact.Rgba stroke = 6; optional string wrap_mode = 7; optional uint32 columns = 8; }
message PageFrameAdded { semio.s.layout.layout.artifact.Frame frame = 1; optional uint64 index = 2; optional string layer_id = 3; }
message PageFramePatched { string frame_id = 1; FramePatch patch = 2; }
message PagePatch { optional string name = 1; optional double width = 2; optional double height = 3; optional double margin_top = 4; optional double margin_right = 5; optional double margin_bottom = 6; optional double margin_left = 7; optional uint32 columns_count = 8; optional double columns_gutter = 9; optional PageFrameAdded frame_added = 10; optional string frame_removed = 11; optional PageFramePatched frame_patched = 12; }
message LayoutPagePatchEntry { string id = 1; PagePatch patch = 2; }
message LayoutStoryPatchEntry { string id = 1; TextStoryPatch patch = 2; }
message LayoutLinkPatchEntry { string id = 1; ImageLinkPatch patch = 2; }
message LayoutParagraphStylePatchEntry { string id = 1; ParagraphStylePatch patch = 2; }
message LayoutCharacterStylePatchEntry { string id = 1; CharacterStylePatch patch = 2; }
message LayoutParentPagePatchEntry { string id = 1; ParentPagePatch patch = 2; }
message LayoutSpreadPatchEntry { string id = 1; SpreadPatch patch = 2; }
message LayoutPagesDelta { repeated semio.s.layout.layout.artifact.Page added = 1; repeated string removed = 2; repeated LayoutPagePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutStoriesDelta { repeated semio.s.layout.layout.artifact.TextStory added = 1; repeated string removed = 2; repeated LayoutStoryPatchEntry patched = 3; repeated string reordered = 4; }
message LayoutLinksDelta { repeated semio.s.layout.layout.artifact.ImageLink added = 1; repeated string removed = 2; repeated LayoutLinkPatchEntry patched = 3; repeated string reordered = 4; }
message LayoutParagraphStylesDelta { repeated semio.s.layout.layout.artifact.ParagraphStyle added = 1; repeated string removed = 2; repeated LayoutParagraphStylePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutCharacterStylesDelta { repeated semio.s.layout.layout.artifact.CharacterStyle added = 1; repeated string removed = 2; repeated LayoutCharacterStylePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutParentPagesDelta { repeated semio.s.layout.layout.artifact.ParentPage added = 1; repeated string removed = 2; repeated LayoutParentPagePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutSpreadsDelta { repeated semio.s.layout.layout.artifact.Spread added = 1; repeated string removed = 2; repeated LayoutSpreadPatchEntry patched = 3; repeated string reordered = 4; }
message LayoutDiff {
  semio.s.layout.layout.artifact.LayoutArtifact artifact = 1;
  optional string schema = 2;
  optional string name = 3;
  semio.s.layout.layout.artifact.GridSettings grid = 4;
  LayoutParagraphStylesDelta paragraph_styles = 5;
  LayoutCharacterStylesDelta character_styles = 6;
  LayoutStoriesDelta stories = 7;
  LayoutLinksDelta links = 8;
  LayoutParentPagesDelta parent_pages = 9;
  LayoutSpreadsDelta spreads = 10;
  LayoutPagesDelta pages = 11;
  optional string print_target = 12;
  optional string data_fields_json = 13;
  semio.s.layout.layout.artifact.LayoutDrawingChild background_drawing = 14;
  semio.os.store.ArtifactLink referenced_model = 15;
}
