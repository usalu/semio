syntax = "proto3";
package semio.s.layout.layout.diff;
import "✏️s/🔌️plugins/📋️forms/🗿️artifacts/📋️forms/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧾️dictionary/🛰️.proto";
import "✏️s/🔌️plugins/📏️layout/🗿️artifacts/📏️layout/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🔗️link/🧬️schema/🛰️.proto";
message ParagraphStylePatch { optional string name = 1; optional string font_family = 2; optional double font_size = 3; optional uint32 font_weight = 4; optional double leading = 5; optional double tracking = 6; optional string alignment = 7; }
message CharacterStylePatch { optional string name = 1; optional string font_family = 2; optional double font_size = 3; optional uint32 font_weight = 4; optional bool italic = 5; optional semio.s.layout.layout.artifact.Rgba color = 6; optional double tracking = 7; }
message ParentPagePatch { optional string name = 1; optional double width = 2; optional double height = 3; }
message SpreadPatch { optional string name = 1; }
message TextStyleRunRow { uint64 index = 1; semio.s.layout.layout.artifact.TextStyleRun run = 2; }
message TextStyleRunsDelta { optional uint64 len = 1; repeated TextStyleRunRow rows = 2; }
message TextStoryPatch { optional string content = 1; optional TextStyleRunsDelta style_runs = 2; }
message ImageLinkPatch { optional string path = 1; optional uint32 width = 2; optional uint32 height = 3; optional uint32 dpi = 4; optional string color_profile = 5; }
message FramePatch { optional double x = 1; optional double y = 2; optional double width = 3; optional double height = 4; optional semio.s.layout.layout.artifact.Rgba fill = 5; optional semio.s.layout.layout.artifact.Rgba stroke = 6; optional string wrap_mode = 7; optional uint32 columns = 8; optional double rotation = 9; optional bool locked = 10; optional bool visible = 11; optional string story_id = 12; optional string thread_next = 13; optional double inset_x = 14; optional double inset_y = 15; optional double inset_width = 16; optional double inset_height = 17; }
message PageLayerAdded { semio.s.layout.layout.artifact.Layer layer = 1; optional uint64 index = 2; }
message PageFrameAdded { semio.s.layout.layout.artifact.Frame frame = 1; optional uint64 index = 2; optional string layer_id = 3; }
message PageFramePatched { string frame_id = 1; FramePatch patch = 2; }
message PageGuideRow { uint64 index = 1; semio.s.layout.layout.artifact.LayoutRect guide = 2; }
message PageGuidesDelta { optional uint64 len = 1; repeated PageGuideRow rows = 2; }
message PageOverridePatchEntry { string id = 1; semio.s.layout.layout.artifact.PageOverride item = 2; }
message PageOverridesDelta { repeated semio.s.layout.layout.artifact.PageOverride added = 1; repeated string removed = 2; repeated PageOverridePatchEntry patched = 3; repeated string reordered = 4; }
message PagePatch { optional string name = 1; optional double width = 2; optional double height = 3; optional double margin_top = 4; optional double margin_right = 5; optional double margin_bottom = 6; optional double margin_left = 7; optional uint32 columns_count = 8; optional double columns_gutter = 9; optional PageFrameAdded frame_added = 10; optional string frame_removed = 11; repeated PageFramePatched frames_patched = 12; optional PageLayerPatched layer_patched = 13; optional string parent_page_id = 14; optional PageGuidesDelta guides = 15; optional PageOverridesDelta overrides = 16; optional PageLayerAdded layer_added = 17; optional string layer_removed = 18; optional PageFrameLayer frame_layer = 19; repeated string frame_order = 20; }
message PageLayerPatched { string layer_id = 1; optional string name = 2; optional bool visible = 3; optional bool locked = 4; }
message PageFrameLayer { string frame_id = 1; string layer_id = 2; }
message LayoutPagePatchEntry { string id = 1; PagePatch patch = 2; }
message LayoutStoryPatchEntry { string id = 1; TextStoryPatch patch = 2; }
message LayoutLinkPatchEntry { string id = 1; ImageLinkPatch patch = 2; }
message LayoutParagraphStylePatchEntry { string id = 1; ParagraphStylePatch patch = 2; }
message LayoutCharacterStylePatchEntry { string id = 1; CharacterStylePatch patch = 2; }
message LayoutParentPagePatchEntry { string id = 1; ParentPagePatch patch = 2; }
message LayoutSpreadPatchEntry { string id = 1; SpreadPatch patch = 2; }
message LayoutPagesDelta { repeated semio.s.layout.layout.artifact.Page added = 1; repeated string removed = 2; repeated LayoutPagePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutStoriesDelta { repeated semio.s.layout.layout.artifact.TextStory added = 1; repeated string removed = 2; repeated LayoutStoryPatchEntry patched = 3; repeated string reordered = 4; }
message LayoutLinksDelta { repeated semio.s.layout.layout.artifact.ImageLink added = 1; repeated string removed = 2; repeated LayoutLinkPatchEntry patched = 3; repeated string reordered = 4; }
message LayoutParagraphStylesDelta { repeated semio.s.layout.layout.artifact.ParagraphStyle added = 1; repeated string removed = 2; repeated LayoutParagraphStylePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutCharacterStylesDelta { repeated semio.s.layout.layout.artifact.CharacterStyle added = 1; repeated string removed = 2; repeated LayoutCharacterStylePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutParentPagesDelta { repeated semio.s.layout.layout.artifact.ParentPage added = 1; repeated string removed = 2; repeated LayoutParentPagePatchEntry patched = 3; repeated string reordered = 4; }
message LayoutSpreadsDelta { repeated semio.s.layout.layout.artifact.Spread added = 1; repeated string removed = 2; repeated LayoutSpreadPatchEntry patched = 3; repeated string reordered = 4; }
message GridPatch { optional double baseline_grid = 1; optional double baseline_offset = 2; optional bool snap_to_baseline = 3; }
message PrintTargetChange { optional string target = 1; }
enum DataFieldsPresence { DATA_FIELDS_PRESENCE_UNSPECIFIED = 0; CREATED = 1; DELETED = 2; REPLACED = 3; }
message LayoutDataEntryPatchEntry { string id = 1; semio.s.forms.forms.dictionary.FormDictionaryEntry item = 2; }
message LayoutDataEntriesDelta { repeated semio.s.forms.forms.dictionary.FormDictionaryEntry added = 1; repeated string removed = 2; repeated LayoutDataEntryPatchEntry patched = 3; repeated string reordered = 4; }
message LayoutDataFieldsDelta { optional DataFieldsPresence presence = 1; optional LayoutDataEntriesDelta entries = 2; }
message LayoutDrawingTextRow { uint32 index = 1; string text = 2; }
message LayoutDiff {
  optional string schema = 1;
  optional string name = 2;
  optional GridPatch grid = 3;
  LayoutParagraphStylesDelta paragraph_styles = 4;
  LayoutCharacterStylesDelta character_styles = 5;
  LayoutStoriesDelta stories = 6;
  LayoutLinksDelta links = 7;
  LayoutParentPagesDelta parent_pages = 8;
  LayoutSpreadsDelta spreads = 9;
  LayoutPagesDelta pages = 10;
  optional PrintTargetChange print_target = 11;
  optional LayoutDataFieldsDelta data_fields = 12;
  semio.s.layout.layout.artifact.LayoutDrawingChild background_drawing = 13;
  repeated LayoutDrawingTextRow drawing_texts = 14;
  semio.os.store.ArtifactLink referenced_model = 15;
}

