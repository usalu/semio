syntax = "proto3";
package semio.layout_layout.mutations;

message RenameLayout {
  string new_name = 1;
}
message ChangePrintTarget {
  optional string new_print_target = 1;
}
message ChangeDataFields {
  optional string new_json = 1;
}
message CreatePage {
  bytes page = 1;
  optional uint32 index = 2;
}
message DeletePage {
  string id = 1;
}
message RenamePage {
  string id = 1;
  string new_name = 2;
}
message ChangePageWidth {
  string id = 1;
  double new_width = 2;
}
message ChangePageHeight {
  string id = 1;
  double new_height = 2;
}
message UpdatePageMargins {
  string id = 1;
  double top = 2;
  double right = 3;
  double bottom = 4;
  double left = 5;
}
message UpdatePageColumns {
  string id = 1;
  uint32 count = 2;
  double gutter = 3;
}
message ReorderPages {
  string id = 1;
  uint32 to_index = 2;
}
message CreateStory {
  bytes story = 1;
  optional uint32 index = 2;
}
message DeleteStory {
  string id = 1;
}
message EditStory {
  string id = 1;
  string new_content = 2;
}
message CreateLink {
  bytes link = 1;
  optional uint32 index = 2;
}
message DeleteLink {
  string id = 1;
}
message ChangeLinkPath {
  string id = 1;
  string new_path = 2;
}
message CreateFrame {
  string page_id = 1;
  bytes frame = 2;
  optional uint32 index = 3;
  optional string layer_id = 4;
}
message DeleteFrame {
  string page_id = 1;
  string frame_id = 2;
}
message MoveFrame {
  string page_id = 1;
  string frame_id = 2;
  double new_x = 3;
  double new_y = 4;
}
message ResizeFrame {
  string page_id = 1;
  string frame_id = 2;
  double new_width = 3;
  double new_height = 4;
}
message RotateFrame {
  string page_id = 1;
  string frame_id = 2;
  double new_rotation = 3;
}
message ChangeFrameFill {
  string page_id = 1;
  string frame_id = 2;
  optional bytes new_fill = 3;
}
message ChangeFrameStroke {
  string page_id = 1;
  string frame_id = 2;
  optional bytes new_stroke = 3;
}
message ChangeFrameWrapMode {
  string page_id = 1;
  string frame_id = 2;
  string new_wrap_mode = 3;
}
message ChangeFrameColumns {
  string page_id = 1;
  string frame_id = 2;
  uint32 new_columns = 3;
}
message UpdateGrid {
  double baseline_grid = 1;
  double baseline_offset = 2;
  bool snap_to_baseline = 3;
}
message SetFrameFlags {
  string page_id = 1;
  string frame_id = 2;
  optional bool locked = 3;
  optional bool visible = 4;
}
message UpdateParagraphStyle {
  string id = 1;
  string name = 2;
  string font_family = 3;
  double font_size = 4;
  uint32 font_weight = 5;
  double leading = 6;
  double tracking = 7;
  string alignment = 8;
}
message UpdateTextFrame {
  string page_id = 1;
  string frame_id = 2;
  string story_id = 3;
  optional string thread_next = 4;
  double inset_x = 5;
  double inset_y = 6;
  double inset_width = 7;
  double inset_height = 8;
}
message UpdateLayer {
  string page_id = 1;
  string layer_id = 2;
  string name = 3;
  bool visible = 4;
  bool locked = 5;
}
message CreateCharacterStyle {
  string id = 1;
  optional string name = 2;
}
message DeleteCharacterStyle {
  string id = 1;
}
message UpdateCharacterStyle {
  string id = 1;
  optional string name = 2;
  optional string font_family = 3;
  optional double font_size = 4;
  optional uint32 font_weight = 5;
  optional bool italic = 6;
  optional bytes color = 7;
  optional double tracking = 8;
}
message UpdateParentPage {
  string id = 1;
  string name = 2;
  double width = 3;
  double height = 4;
}
message UpdateSpread {
  string id = 1;
  string name = 2;
}
message SetPageParent {
  string id = 1;
  optional string parent_page_id = 2;
}
message SetPageGuides {
  string id = 1;
  bytes guides = 2;
}
message SetStoryRuns {
  string id = 1;
  bytes runs = 2;
}
message UpdateLink {
  string id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 dpi = 4;
  optional string color_profile = 5;
}
message SetPageOverrides {
  string id = 1;
  bytes overrides = 2;
}
message CreateLayer {
  string page_id = 1;
  string id = 2;
  string name = 3;
  bool remove = 4;
}
message SetFrameLayer {
  string page_id = 1;
  string frame_id = 2;
  string layer_id = 3;
}
message SetDrawingText {
  uint32 index = 1;
  string text = 2;
}
message ReorderFrame {
  string page_id = 1;
  string frame_id = 2;
  bool forward = 3;
}
message DragFrames {
  string page_id = 1;
  repeated string targets = 2;
  double dx = 3;
  double dy = 4;
}
message RotateFrames {
  string page_id = 1;
  repeated string targets = 2;
  double pivot_x = 3;
  double pivot_y = 4;
  double angle = 5;
}
message ScaleFrames {
  string page_id = 1;
  repeated string targets = 2;
  double pivot_x = 3;
  double pivot_y = 4;
  double sx = 5;
  double sy = 6;
}

message LayoutMutation {
  oneof kind {
    RenameLayout rename_layout = 1;
    ChangePrintTarget change_print_target = 2;
    ChangeDataFields change_data_fields = 3;
    CreatePage create_page = 4;
    DeletePage delete_page = 5;
    RenamePage rename_page = 6;
    ChangePageWidth change_page_width = 7;
    ChangePageHeight change_page_height = 8;
    UpdatePageMargins update_page_margins = 9;
    UpdatePageColumns update_page_columns = 10;
    ReorderPages reorder_pages = 11;
    CreateStory create_story = 12;
    DeleteStory delete_story = 13;
    EditStory edit_story = 14;
    CreateLink create_link = 15;
    DeleteLink delete_link = 16;
    ChangeLinkPath change_link_path = 17;
    CreateFrame create_frame = 18;
    DeleteFrame delete_frame = 19;
    MoveFrame move_frame = 20;
    ResizeFrame resize_frame = 21;
    ChangeFrameFill change_frame_fill = 22;
    ChangeFrameStroke change_frame_stroke = 23;
    ChangeFrameWrapMode change_frame_wrap_mode = 24;
    ChangeFrameColumns change_frame_columns = 25;
    UpdateGrid update_grid = 26;
    SetFrameFlags set_frame_flags = 27;
    RotateFrame rotate_frame = 28;
    UpdateParagraphStyle update_paragraph_style = 29;
    UpdateTextFrame update_text_frame = 30;
    UpdateLayer update_layer = 31;
    CreateCharacterStyle create_character_style = 32;
    DeleteCharacterStyle delete_character_style = 33;
    UpdateCharacterStyle update_character_style = 34;
    UpdateParentPage update_parent_page = 35;
    UpdateSpread update_spread = 36;
    SetPageParent set_page_parent = 37;
    SetPageGuides set_page_guides = 38;
    SetStoryRuns set_story_runs = 39;
    UpdateLink update_link = 40;
    SetPageOverrides set_page_overrides = 41;
    CreateLayer create_layer = 42;
    SetFrameLayer set_frame_layer = 43;
    SetDrawingText set_drawing_text = 44;
    ReorderFrame reorder_frame = 45;
    DragFrames drag_frames = 46;
    RotateFrames rotate_frames = 47;
    ScaleFrames scale_frames = 48;
  }
}
