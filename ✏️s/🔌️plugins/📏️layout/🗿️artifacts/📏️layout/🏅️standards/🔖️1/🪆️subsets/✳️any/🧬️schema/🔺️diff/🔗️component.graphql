# 🧬️ Layout diff schema — sparse field delta over the artifact, mirrors `🔺️diff/🦀️component.rs`'s
# `LayoutDiff` field-for-field.

type LayoutDiff {
  artifact: LayoutArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  name: String @state(class: ARTIFACT)
  grid: GridSettings @state(class: ARTIFACT)
  paragraphStyles: LayoutParagraphStylesDelta @state(class: ARTIFACT)
  characterStyles: LayoutCharacterStylesDelta @state(class: ARTIFACT)
  stories: LayoutStoriesDelta @state(class: ARTIFACT)
  links: LayoutLinksDelta @state(class: ARTIFACT)
  parentPages: LayoutParentPagesDelta @state(class: ARTIFACT)
  spreads: LayoutSpreadsDelta @state(class: ARTIFACT)
  pages: LayoutPagesDelta @state(class: ARTIFACT)
  printTarget: String @state(class: ARTIFACT)
  dataFieldsJson: String @state(class: ARTIFACT)
  backgroundDrawing: LayoutDrawingChild @state(class: ARTIFACT) @child(kind: "s.stdio.semio.drawing")
  referencedModel: ArtifactLink @state(class: ARTIFACT) @link(roles: ["model"])
  selectedIds: LayoutStringList @state(class: PRESENCE)
  activePageId: String @state(class: CONFIG)
  engagementInput: String @state(class: CONFIG)
  cameraX: Float @state(class: CONFIG)
  cameraY: Float @state(class: CONFIG)
  cameraZoom: Float @state(class: CONFIG)
  previewCameraX: Float @state(class: CONFIG)
  previewCameraY: Float @state(class: CONFIG)
  previewCameraZoom: Float @state(class: CONFIG)
  dropPreview: LayoutDropPreviewState @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  hoveredId: String @state(class: ARTIFACT)
}

# 🌉️ Opaque mirror of the full `LayoutArtifact` aggregate (artifact + presence + config lanes) — out
# of this facet's own scope.
type LayoutArtifact { _placeholder: Boolean }

type LayoutDropPreviewState {
  kind: String!
  x: Float!
  y: Float!
}

type LayoutStringList {
  values: [String!]!
}

type GridSettings {
  baselineGrid: Float!
  baselineOffset: Float!
  snapToBaseline: Boolean!
}

type ParagraphStyle {
  id: String!
  name: String!
  fontFamily: String!
  fontSize: Float!
  fontWeight: Int!
  leading: Float!
  tracking: Float!
  alignment: String!
}

type CharacterStyle {
  id: String!
  name: String
  fontFamily: String
  fontSize: Float
  fontWeight: Int
  italic: Boolean
  color: [Float!]
  tracking: Float
}

type TextStyleRun {
  start: Int!
  end: Int!
  paragraphStyleId: String
  characterStyleId: String
}

type TextStory {
  id: String!
  content: String!
  styleRuns: [TextStyleRun!]!
}

type ImageLink {
  id: String!
  path: String!
  hash: String!
  width: Int!
  height: Int!
  dpi: Int!
  colorProfile: String
  state: String
  proxyDataUrl: String
}

type LayoutBounds {
  x: Float!
  y: Float!
  w: Float!
  h: Float!
  rotation: Float!
}

type LayoutRect {
  x: Float!
  y: Float!
  w: Float!
  h: Float!
}

type PageMargins {
  top: Float!
  right: Float!
  bottom: Float!
  left: Float!
}

type PageColumns {
  count: Int!
  gutter: Float!
}

type Layer {
  id: String!
  name: String!
  visible: Boolean!
  locked: Boolean!
  objectIds: [String!]!
}

union Frame = FrameRect | FrameText | FrameImage

type FrameRect {
  kind: String!
  id: String!
  layerId: String!
  bounds: LayoutBounds!
  locked: Boolean
  visible: Boolean
  fill: [Float!]
  stroke: [Float!]
}

type FrameText {
  kind: String!
  id: String!
  layerId: String!
  bounds: LayoutBounds!
  locked: Boolean
  visible: Boolean
  storyId: String!
  threadNext: String
  columns: Int!
  inset: LayoutRect!
  wrapMode: String!
}

type FrameImage {
  kind: String!
  id: String!
  layerId: String!
  bounds: LayoutBounds!
  locked: Boolean
  visible: Boolean
  linkId: String!
}

type PageOverride {
  objectId: String!
  bounds: LayoutBounds
  visible: Boolean
  locked: Boolean
}

type ParentPage {
  id: String!
  name: String!
  width: Float!
  height: Float!
  layerIds: [String!]!
  layers: [Layer!]!
  frames: [Frame!]!
}

type Page {
  id: String!
  name: String!
  spreadId: String!
  parentPageId: String
  width: Float!
  height: Float!
  margins: PageMargins!
  columns: PageColumns!
  guides: [LayoutRect!]!
  layerIds: [String!]!
  layers: [Layer!]!
  frames: [Frame!]!
  overrides: [PageOverride!]!
}

type Spread {
  id: String!
  name: String!
  pageIds: [String!]!
}

# 🌉️ Opaque mirror of `store::os_io::ArtifactRef` — a cross-cutting framework identity type, out of
# this facet's own domain.
type ArtifactRef { _placeholder: Boolean }

# 🌉️ Mirrors `store::ArtifactChild<S>` (`#[serde(rename_all = "camelCase")]`, `childId`/`target`
# fields only — the skip-serialized `localOwner`/phantom fields carry nothing on the wire).
type ArtifactChildHandle {
  childId: String!
  target: ArtifactRef!
}

# 🌉️ Opaque mirror of `store::LinkPin` — a tagged enum (`Head` / `Checkpoint{id}` /
# `Snapshot{blob}`), out of this facet's own domain.
type LinkPin { _placeholder: Boolean }

# 🌉️ Mirrors `store::ArtifactLink` (`target`/`pin`/`role`).
type ArtifactLink {
  target: ArtifactRef!
  pin: LinkPin!
  role: String!
}

# 🌉️ Opaque mirror of stdio's `SemioDrawingSnapshot` — a composed child subset from a different
# plugin, out of this facet's own domain.
type LayoutSemioDrawingSnapshot { _placeholder: Boolean }

# 🌉️ Mirrors `crate::artifacts::layout::LayoutDrawingChild` (`handle`/`content`).
type LayoutDrawingChild {
  handle: ArtifactChildHandle!
  content: LayoutSemioDrawingSnapshot!
}

type LayoutPagesDelta {
  added: [Page!]!
  removed: [String!]!
  patched: [LayoutPagePatchEntry!]!
  reordered: [String!]
}

type LayoutPagePatchEntry {
  id: String!
  patch: PagePatch!
}

type LayoutStoriesDelta {
  added: [TextStory!]!
  removed: [String!]!
  patched: [LayoutStoryPatchEntry!]!
  reordered: [String!]
}

type LayoutStoryPatchEntry {
  id: String!
  patch: TextStoryPatch!
}

type LayoutLinksDelta {
  added: [ImageLink!]!
  removed: [String!]!
  patched: [LayoutLinkPatchEntry!]!
  reordered: [String!]
}

type LayoutLinkPatchEntry {
  id: String!
  patch: ImageLinkPatch!
}

type LayoutParagraphStylesDelta {
  added: [ParagraphStyle!]!
  removed: [String!]!
  patched: [LayoutParagraphStylePatchEntry!]!
  reordered: [String!]
}

type LayoutParagraphStylePatchEntry {
  id: String!
  patch: ParagraphStylePatch!
}

type LayoutCharacterStylesDelta {
  added: [CharacterStyle!]!
  removed: [String!]!
  patched: [LayoutCharacterStylePatchEntry!]!
  reordered: [String!]
}

type LayoutCharacterStylePatchEntry {
  id: String!
  patch: CharacterStylePatch!
}

type LayoutParentPagesDelta {
  added: [ParentPage!]!
  removed: [String!]!
  patched: [LayoutParentPagePatchEntry!]!
  reordered: [String!]
}

type LayoutParentPagePatchEntry {
  id: String!
  patch: ParentPagePatch!
}

type LayoutSpreadsDelta {
  added: [Spread!]!
  removed: [String!]!
  patched: [LayoutSpreadPatchEntry!]!
  reordered: [String!]
}

type LayoutSpreadPatchEntry {
  id: String!
  patch: SpreadPatch!
}

type ParagraphStylePatch {
  name: String
}

type CharacterStylePatch {
  name: String
}

type ParentPagePatch {
  name: String
}

type SpreadPatch {
  name: String
}

type TextStoryPatch {
  content: String
}

type ImageLinkPatch {
  path: String
}

# 🩹️ `PagePatch`'s Rust struct has no `#[serde(rename_all = "camelCase")]`, so its wire field names
# stay snake_case — mirrored verbatim, not camelCased.
type PagePatch {
  name: String
  width: Float
  height: Float
  margin_top: Float
  margin_right: Float
  margin_bottom: Float
  margin_left: Float
  columns_count: Int
  columns_gutter: Float
  frame_added: PageFrameAdded
  frame_removed: String
  frame_patched: PageFramePatched
}

# 🌱️ Same no-`rename_all` snake_case wire shape as `PagePatch` itself.
type PageFrameAdded {
  frame: Frame!
  index: Int
  layer_id: String
}

# 🩹️ Same no-`rename_all` snake_case wire shape as `PagePatch` itself.
type PageFramePatched {
  frame_id: String!
  patch: FramePatch!
}

# 🖼️ Same no-`rename_all` snake_case wire shape as `PagePatch` itself.
type FramePatch {
  x: Float
  y: Float
  width: Float
  height: Float
  fill: [Float!]
  stroke: [Float!]
  wrap_mode: String
  columns: Int
}
