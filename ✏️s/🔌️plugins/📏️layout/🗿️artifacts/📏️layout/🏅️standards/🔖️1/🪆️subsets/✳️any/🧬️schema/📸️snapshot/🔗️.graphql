# 📸️ Canonical Layout snapshot fields; framework and Drawing types are assembled from their owners.

type LayoutSnapshot {
  schema: String! @state(class: ARTIFACT)
  name: String! @state(class: ARTIFACT)
  grid: GridSettings! @state(class: ARTIFACT)
  paragraphStyles: [ParagraphStyle!]! @state(class: ARTIFACT)
  characterStyles: [CharacterStyle!]! @state(class: ARTIFACT)
  stories: [TextStory!]! @state(class: ARTIFACT)
  links: [ImageLink!]! @state(class: ARTIFACT)
  parentPages: [ParentPage!]! @state(class: ARTIFACT)
  spreads: [Spread!]! @state(class: ARTIFACT)
  pages: [Page!]! @state(class: ARTIFACT)
  printTarget: String @state(class: ARTIFACT)
  dataFieldsJson: String @state(class: ARTIFACT)
  backgroundDrawing: LayoutDrawingChild @state(class: ARTIFACT) @child(kind: "s.stdio.semio")
  referencedModel: ArtifactLink @state(class: ARTIFACT) @link(roles: ["model"])
}

type GridSettings { baselineGrid: Float! baselineOffset: Float! snapToBaseline: Boolean! }
type ParagraphStyle { id: String! name: String! fontFamily: String! fontSize: Float! fontWeight: Int! leading: Float! tracking: Float! alignment: String! }
type CharacterStyle { id: String! name: String fontFamily: String fontSize: Float fontWeight: Int italic: Boolean color: [Float!] tracking: Float }
type TextStyleRun { start: Int! end: Int! paragraphStyleId: String characterStyleId: String }
type TextStory { id: String! content: String! styleRuns: [TextStyleRun!]! }
type ImageLink { id: String! path: String! hash: String! width: Int! height: Int! dpi: Int! colorProfile: String state: String proxyDataUrl: String }
type LayoutBounds { x: Float! y: Float! w: Float! h: Float! rotation: Float! }
type LayoutRect { x: Float! y: Float! w: Float! h: Float! }
type PageMargins { top: Float! right: Float! bottom: Float! left: Float! }
type PageColumns { count: Int! gutter: Float! }
type Layer { id: String! name: String! visible: Boolean! locked: Boolean! objectIds: [String!]! }
union Frame = FrameRect | FrameText | FrameImage
type FrameRect { kind: String! id: String! layerId: String! bounds: LayoutBounds! locked: Boolean visible: Boolean fill: [Float!] stroke: [Float!] }
type FrameText { kind: String! id: String! layerId: String! bounds: LayoutBounds! locked: Boolean visible: Boolean storyId: String! threadNext: String columns: Int! inset: LayoutRect! wrapMode: String! }
type FrameImage { kind: String! id: String! layerId: String! bounds: LayoutBounds! locked: Boolean visible: Boolean linkId: String! }
type PageOverride { objectId: String! bounds: LayoutBounds visible: Boolean locked: Boolean }
type ParentPage { id: String! name: String! width: Float! height: Float! layerIds: [String!]! layers: [Layer!]! frames: [Frame!]! }
type Page { id: String! name: String! spreadId: String! parentPageId: String width: Float! height: Float! margins: PageMargins! columns: PageColumns! guides: [LayoutRect!]! layerIds: [String!]! layers: [Layer!]! frames: [Frame!]! overrides: [PageOverride!]! }
type Spread { id: String! name: String! pageIds: [String!]! }
type LayoutDrawingChild { handle: ArtifactChild! content: SemioDrawingSnapshot! }
