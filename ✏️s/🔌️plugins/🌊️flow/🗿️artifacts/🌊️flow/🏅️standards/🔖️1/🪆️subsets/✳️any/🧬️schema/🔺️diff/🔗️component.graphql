# 🧬️ Flow diff schema — sparse field delta.

type FlowDiff {
  artifact: FlowArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  camera: CameraJson @state(class: ARTIFACT)
  widgets: FlowWidgetsDelta @state(class: ARTIFACT)
  synapses: FlowSynapsesDelta @state(class: ARTIFACT)
  layout: FlowLayoutMapDelta @state(class: ARTIFACT)
  selectedNodeIds: FlowStringList @state(class: PRESENCE)
  selectedEdgeIds: FlowStringList @state(class: PRESENCE)
  selectedHandleIds: FlowStringList @state(class: PRESENCE)
  previewOffNodeIds: FlowStringList @state(class: PRESENCE)
  lodMode: String @state(class: CONFIG)
  proximityDistance: Float @state(class: CONFIG)
  gridVisible: Boolean @state(class: CONFIG)
  gridSnapEnabled: Boolean @state(class: CONFIG)
  gridFactor: Float @state(class: CONFIG)
  catalogueSectionsJson: String @state(class: CONFIG)
  automationEnabledJson: String @state(class: CONFIG)
  contributionsJson: String @state(class: CONFIG)
  generationJson: String @state(class: CONFIG)
  locale: String @state(class: CONFIG)
}

type FlowArtifact {
  schema: String!
  camera: CameraJson!
  widgets: [Widget!]!
  synapses: [SynapseSpec!]!
  layout: [WidgetLayoutEntry!]!
  selectedNodeIds: [String!]!
  selectedEdgeIds: [String!]!
  selectedHandleIds: [String!]!
  previewOffNodeIds: [String!]!
  lodMode: String!
  proximityDistance: Float!
  gridVisible: Boolean!
  gridSnapEnabled: Boolean!
  gridFactor: Float!
  catalogueSectionsJson: String!
  automationEnabledJson: String!
  contributionsJson: String!
  generationJson: String!
  locale: String!
}

type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}

type WidgetLayout {
  x: Float!
  y: Float!
}

type WidgetLayoutEntry {
  key: String!
  value: WidgetLayout!
}

type SynapseSpec {
  id: String!
  from: String!
  to: String!
  fromPort: String!
  toPort: String!
}

scalar Widget

type FlowStringList {
  values: [String!]!
}

type FlowWidgetPatchEntry {
  id: String!
  patch: Widget!
}

type FlowWidgetsDelta {
  added: [Widget!]!
  removed: [String!]!
  patched: [FlowWidgetPatchEntry!]!
  reordered: [String!]
}

type FlowSynapsePatchEntry {
  id: String!
  patch: SynapseSpec!
}

type FlowSynapsesDelta {
  added: [SynapseSpec!]!
  removed: [String!]!
  patched: [FlowSynapsePatchEntry!]!
  reordered: [String!]
}

type FlowLayoutMapDelta {
  entries: [FlowLayoutNullableEntry!]!
}

type FlowLayoutNullableEntry {
  key: String!
  value: WidgetLayout
}
