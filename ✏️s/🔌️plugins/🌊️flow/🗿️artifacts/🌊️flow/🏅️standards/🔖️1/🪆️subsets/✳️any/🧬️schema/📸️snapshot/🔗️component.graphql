# 🧬️ Flow snapshot schema — artifact-lane fields only.

type FlowSnapshot {
  schema: String! @state(class: ARTIFACT)
  camera: CameraJson! @state(class: ARTIFACT)
  widgets: [Widget!]! @state(class: ARTIFACT)
  synapses: [SynapseSpec!]! @state(class: ARTIFACT)
  layout: [WidgetLayoutEntry!]! @state(class: ARTIFACT)
}

type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}

type WidgetLayout {
  x: Float!
  y: Float!
}

type WidgetLayoutEntry {
  key: String!
  value: WidgetLayout!
}

type SynapseSpec {
  id: String!
  from: String!
  to: String!
  fromPort: String!
  toPort: String!
}

scalar Widget
