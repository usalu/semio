syntax = "proto3";
package semio.app.flow.flow;
message FlowConfig {
  // @state config
  repeated string preview_off_node_ids = 1;
  // @state config
  CameraJson camera = 2;
  // @state config
  string lod_mode = 3;
  // @state config
  double proximity_distance = 4;
  // @state config
  bool grid_visible = 5;
  // @state config
  bool grid_snap_enabled = 6;
  // @state config
  double grid_factor = 7;
  // @state config
  string catalogue_sections_json = 8;
  // @state config
  string automation_enabled_json = 9;
  // @state config
  string contributions_json = 10;
  // @state config
  string generation_json = 11;
  // @state config
  string locale = 12;
  // @state config
  string duplicate_widget_progress_json = 13;
}

message CameraJson {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
