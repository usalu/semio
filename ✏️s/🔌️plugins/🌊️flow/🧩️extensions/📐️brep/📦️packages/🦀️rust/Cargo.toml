[package]
name = "semio-s-plugin-flow-extension-brep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Flow Brep extension — contributes B-Rep geometry operators to flow-play and procedural3d-play"

[lints]
workspace = true

[package.metadata.component]
package = "semio:flow-extension-brep"

[package.metadata.semio]
role = "extension"
extends = "flow"
contributes = ["flow.extension"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[features]
default = ["component-guest"]
component-guest = ["dep:semio-framework-plugin", "dep:semio-framework"]

[dependencies]
semio-framework-3d = { path = "../../../../../../../🧰️framework/🔨️modules/🧊️3d/📦️packages/🦀️rust" }
semio-s-plugin-stdio = { path = "../../../../../../../✏️s/🔌️plugins/🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
flow_extension_sdk = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow/📦️packages/🦀️rust", package = "semio-framework-os-flow" }
neural_engine = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🧠️neural/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
pack = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin", optional = true }
semio-framework = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework", optional = true }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
