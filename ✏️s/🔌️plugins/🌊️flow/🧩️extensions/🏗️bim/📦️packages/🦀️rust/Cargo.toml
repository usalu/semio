[package]
name = "semio-s-plugin-flow-extension-bim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Flow BIM extension — contributes BIM operators to flow-play and procedural3d-play"

[lints]
workspace = true

[package.metadata.component]
