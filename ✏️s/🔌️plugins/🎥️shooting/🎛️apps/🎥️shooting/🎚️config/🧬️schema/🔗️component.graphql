type ShootingConfig {
  defaultShotFormat: String! @state(class: CONFIG)
  defaultShotShape: String! @state(class: CONFIG)
  defaultAssetFormat: String! @state(class: CONFIG)
  selectedShotIds: [String!]! @state(class: CONFIG)
  selectedAssetIds: [String!]! @state(class: CONFIG)
  selectionMethod: String! @state(class: CONFIG)
  hoveredAssetId: String @state(class: CONFIG)
  centerModel: Boolean! @state(class: CONFIG)
  fitRevision: Int! @state(class: CONFIG)
  cameraDraftLabel: String! @state(class: CONFIG)
  camera: ShootingCamera! @state(class: CONFIG)
  activeUtilityId: String! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}

type ShootingCamera {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
  fov: Float!
  up: [Float!]
  projection: String
}
