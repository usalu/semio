syntax = "proto3";
package semio.app.shooting.shooting;
message ShootingConfig {
  // @state config
  string default_shot_format = 1;
  // @state config
  string default_shot_shape = 2;
  // @state config
  string default_asset_format = 3;
  // @state config
  repeated string selected_shot_ids = 4;
  // @state config
  bool center_model = 8;
  // @state config
  uint32 fit_revision = 9;
  // @state config
  string camera_draft_label = 10;
  // @state config
  ShootingCamera camera = 11;
  // @state config
  string active_utility_id = 12;
  // @state config
  string locale = 13;
}

message ShootingCamera {
  repeated double position = 1;
  repeated double target = 2;
  double zoom = 3;
  double fov = 4;
  repeated double up = 5;
  optional string projection = 6;
}
