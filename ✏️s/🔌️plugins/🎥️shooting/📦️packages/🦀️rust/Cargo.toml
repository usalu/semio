[package]
name = "semio-s-plugin-shooting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shooting plugin - one crate for the shooting artifact (diff/op/dsl/pack/spr/engine) and the shooting play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:shooting"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "shooting"
ports = { react = 6019, wgpu = 6119 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
roots = ["🧰️framework/🔨️modules/🖼️assets/🌱️metabolism/🎨️representation", "♻️mit-bestand/🖼️assets/🏚️abbau-aufbau"]
placeholder = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/🧊️placeholder.glb"
filter_from_examples = true

# 📦️ Carried over verbatim from the old `📡️protocol` sub-crate — the `wasm_bridge` module in
# `🦀️wasm.rs` still builds a wasm-bindgen surface distinct from the WASM Component Model plugin ABI,
# and skipping wasm-opt keeps that dev-loop fast.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework-core" }
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

[dev-dependencies]
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }

