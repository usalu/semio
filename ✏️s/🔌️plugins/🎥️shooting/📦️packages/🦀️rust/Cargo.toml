[package]
name = "semio-s-plugin-shooting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shooting plugin - one crate for the shooting artifact (diff/op/dsl/pack/spr/engine) and the shooting play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:shooting"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "shooting"
ports = { react = 6019, wgpu = 6119 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
catalog = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/📇️catalog.json"

# 📦️ Carried over verbatim from the old `📡️protocol` sub-crate — the `wasm_bridge` module in
# `🦀️wasm.rs` still builds a wasm-bindgen surface distinct from the WASM Component Model plugin ABI,
# and skipping wasm-opt keeps that dev-loop fast.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
