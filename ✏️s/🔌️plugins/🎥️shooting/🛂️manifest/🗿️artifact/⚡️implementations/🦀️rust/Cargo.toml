[package]
name = "semio-s-plugin-shooting"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:shooting"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "shooting"
ports = { react = 6019, wgpu = 6119 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
roots = ["🧰️framework/🔨️modules/🖼️assets/⚡️implementations/🟦️typescript/🌱️metabolism/🎨️representation", "♻️mit-bestand/🖼️assets/🏚️abbau-aufbau"]
