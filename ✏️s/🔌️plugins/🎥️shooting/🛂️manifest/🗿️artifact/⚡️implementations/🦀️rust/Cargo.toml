filter_from_examples = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌️plugins/🎥️shooting/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
shooting = { path = "../../../../../../../✏️s/🔌️plugins/🎥️shooting/🎛️apps/🎥️shooting/⚡️implementations/🦀️rust", package = "semio-s-app-shooting" }
shooting_engine = { path = "../../../../../../../✏️s/🔌️plugins/🎥️shooting/🎛️apps/🎥️shooting/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-shooting-engine" }
shooting_ui = { path = "../../../../../../../✏️s/🔌️plugins/🎥️shooting/🎛️apps/🎥️shooting/🔨️modules/🖱️ui/⚡️implementations/🦀️rust", package = "semio-s-app-shooting-ui" }

