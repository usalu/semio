# 🧬️ Shooting diff schema — sparse field delta over the artifact.
scalar UInt32
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"

type ShootingDiff {
  schema: String @state(class: ARTIFACT)
  assets: ShootingAssetsDelta @state(class: ARTIFACT)
  savedCameras: ShootingSavedCamerasDelta @state(class: ARTIFACT)
  scene: ShootingScenePatch @state(class: ARTIFACT)
  shots: ShootingShotsDelta @state(class: ARTIFACT)
  activeShotId: String @state(class: ARTIFACT)
  activeAssetId: String @state(class: ARTIFACT)
  emblem: ShootingAssignedEmblem @state(class: ARTIFACT)
}

type ShootingAssignedEmblem {
  value: ArtifactChild
}

type ShootingAssignedQuaternion {
  value: [Float!]
}

type ShootingAssignedVector {
  value: [Float!]
}

type ShootingAssignedString {
  value: String
}

enum ShootingEditKind {
  ADD
  REMOVE
  MOVE
}

type ShootingAssetEdit {
  edit: ShootingEditKind!
  index: UInt32
  id: String
  from: UInt32
  to: UInt32
  item: ShootingAsset
}

type ShootingShotEdit {
  edit: ShootingEditKind!
  index: UInt32
  id: String
  from: UInt32
  to: UInt32
  item: ShootingShot
}

type ShootingSavedCameraEdit {
  edit: ShootingEditKind!
  index: UInt32
  id: String
  from: UInt32
  to: UInt32
  item: ShootingSavedCamera
}

type ShootingAssetsDelta {
  edits: [ShootingAssetEdit!]!
  patched: [ShootingAssetPatchEntry!]!
}

type ShootingShotsDelta {
  edits: [ShootingShotEdit!]!
  patched: [ShootingShotPatchEntry!]!
}

type ShootingSavedCamerasDelta {
  edits: [ShootingSavedCameraEdit!]!
  patched: [ShootingSavedCameraPatchEntry!]!
}

type ShootingAssetPatchEntry {
  id: String!
  patch: ShootingAssetPatch!
}

type ShootingShotPatchEntry {
  id: String!
  patch: ShootingShotPatch!
}

type ShootingSavedCameraPatchEntry {
  id: String!
  patch: ShootingSavedCameraPatch!
}

type ShootingAssetPatch {
  name: String
  url: String
  format: String
  origin: [Float!]
  orientation: ShootingAssignedQuaternion
  scale: ShootingAssignedVector
}

type ShootingShotPatch {
  label: String
  width: UInt32
  height: UInt32
  format: String
  shape: String
  background: ShootingAssignedString
  cameraId: ShootingAssignedString
}

type ShootingSavedCameraPatch {
  label: String
  camera: ShootingCamera
}

type ShootingScenePatch {
  background: String
  sunEnabled: Boolean
  sunAzimuth: Float
  sunElevation: Float
  sunIntensity: Float
  sunColor: String
  ambientIntensity: Float
  ambientColor: String
  shadowEnabled: Boolean
  shadowOpacity: Float
  shadowSoftness: Float
  materialColor: String
  materialMetalness: Float
  materialRoughness: Float
  materialEmissive: String
  materialEmissiveIntensity: Float
  materialStroke: String
}

type ShootingArtifact {
  schema: String!
  assets: [ShootingAsset!]!
  savedCameras: [ShootingSavedCamera!]!
  scene: ShootingSceneLighting!
  shots: [ShootingShot!]!
  activeShotId: String!
  activeAssetId: String!
  emblem: ArtifactChild
}

type ShootingCamera {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
  fov: Float!
  up: [Float!]
  projection: String
}

type ShootingSavedCamera {
  id: String!
  label: String!
  camera: ShootingCamera!
}

type ShootingAsset {
  id: String!
  name: String!
  url: String!
  format: String!
  origin: [Float!]!
  orientation: [Float!]
  scale: [Float!]
}

type ShootingShot {
  id: String!
  label: String!
  width: UInt32!
  height: UInt32!
  format: String!
  shape: String!
  background: String
  cameraId: String
}

type ShootingSun {
  enabled: Boolean!
  azimuth: Float!
  elevation: Float!
  intensity: Float!
  color: String!
}

type ShootingAmbient {
  intensity: Float!
  color: String!
}

type ShootingShadow {
  enabled: Boolean!
  opacity: Float!
  softness: Float!
}

type ShootingMaterial {
  color: String!
  metalness: Float!
  roughness: Float!
  emissive: String!
  emissiveIntensity: Float!
  stroke: String!
}

type ShootingSceneLighting {
  background: String!
  sun: ShootingSun!
  ambient: ShootingAmbient!
  shadow: ShootingShadow!
  material: ShootingMaterial!
}
