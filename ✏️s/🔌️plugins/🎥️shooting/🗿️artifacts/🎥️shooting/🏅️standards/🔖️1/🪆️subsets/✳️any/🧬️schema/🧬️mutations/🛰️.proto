syntax = "proto3";
package semio.s.shooting.shooting.mutation;
import "🧰️framework/🔨️modules/🧬️schema/🗿️artifact-reference/🪆️child/🧬️schema/🛰️.proto";

// 🧬️ Shooting mutation schema — artifact-lane fields only.

message ShootingMutation {
  // @state artifact
  string schema = 1;
  // @state artifact
  repeated ShootingAsset assets = 2;
  // @state artifact
  repeated ShootingSavedCamera saved_cameras = 3;
  // @state artifact
  ShootingSceneLighting scene = 4;
  // @state artifact
  repeated ShootingShot shots = 5;
  // @state artifact
  string active_shot_id = 6;
  // @state artifact
  string active_asset_id = 7;
  // @state artifact
  optional semio.framework.schema.artifact_child.ArtifactChild emblem = 8;
}

message ShootingCamera {
  repeated double position = 1;
  repeated double target = 2;
  double zoom = 3;
  double fov = 4;
  repeated double up = 5;
  optional string projection = 6;
}

message ShootingSavedCamera {
  string id = 1;
  string label = 2;
  ShootingCamera camera = 3;
}

message ShootingAsset {
  string id = 1;
  string name = 2;
  string url = 3;
  string format = 4;
  repeated double origin = 5;
  repeated double orientation = 6;
  repeated double scale = 7;
}

message ShootingShot {
  string id = 1;
  string label = 2;
  uint32 width = 3;
  uint32 height = 4;
  string format = 5;
  string shape = 6;
  optional string background = 7;
  optional string camera_id = 8;
  optional ShootingDrawing drawing = 9;
  optional bool auto_fit = 10;
}

message ShootingSun {
  bool enabled = 1;
  double azimuth = 2;
  double elevation = 3;
  double intensity = 4;
  string color = 5;
}

message ShootingAmbient {
  double intensity = 1;
  string color = 2;
}

message ShootingShadow {
  bool enabled = 1;
  double opacity = 2;
  double softness = 3;
}

message ShootingMaterial {
  string color = 1;
  double metalness = 2;
  double roughness = 3;
  string emissive = 4;
  double emissive_intensity = 5;
  string stroke = 6;
}

message ShootingSceneLighting {
  string background = 1;
  ShootingSun sun = 2;
  ShootingAmbient ambient = 3;
  ShootingShadow shadow = 4;
  ShootingMaterial material = 5;
}


message ShootingDrawing {
  bool background = 1;
  bool fill = 2;
  optional string fill_color = 3;
  double fill_opacity = 4;
  bool visible_lines = 5;
  bool hidden_lines = 6;
  string visible_color = 7;
  string hidden_color = 8;
  double visible_width = 9;
  double hidden_width = 10;
  double line_easing = 11;
  bool merge_lines = 12;
}

message SetShotDrawing {
  string id = 1;
  ShootingDrawingPatch patch = 2;
}

message ShootingAssignedString {
  optional string value = 1;
}

message ShootingDrawingPatch {
  optional bool background = 1;
  optional bool fill = 2;
  optional ShootingAssignedString fill_color = 3;
  optional double fill_opacity = 4;
  optional bool visible_lines = 5;
  optional bool hidden_lines = 6;
  optional string visible_color = 7;
  optional string hidden_color = 8;
  optional double visible_width = 9;
  optional double hidden_width = 10;
  optional double line_easing = 11;
  optional bool merge_lines = 12;
  optional bool restore_absent = 13;
}

message PatchShotCamera {
  string shot_id = 1;
  string field = 2;
  ShootingCamera camera = 3;
  ShootingCamera fallback = 4;
  optional ShotCameraSlot release = 5;
}

message ShotCameraSlot {
  ShootingCamera seed = 1;
  optional string camera_id = 2;
}

message SetShotAutoFit {
  string id = 1;
  optional bool auto_fit = 2;
}
