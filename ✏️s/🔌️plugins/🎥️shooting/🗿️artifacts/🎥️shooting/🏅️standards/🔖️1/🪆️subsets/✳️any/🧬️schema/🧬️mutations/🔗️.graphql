# 🧬️ Shooting mutation schema — artifact-lane fields only.
scalar UInt32

type ShootingMutation {
  schema: String! @state(class: ARTIFACT)
  assets: [ShootingAsset!]! @state(class: ARTIFACT)
  savedCameras: [ShootingSavedCamera!]! @state(class: ARTIFACT)
  scene: ShootingSceneLighting! @state(class: ARTIFACT)
  shots: [ShootingShot!]! @state(class: ARTIFACT)
  activeShotId: String! @state(class: ARTIFACT)
  activeAssetId: String! @state(class: ARTIFACT)
}

type ShootingCamera {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
  fov: Float!
  up: [Float!]
  projection: String
}

type ShootingSavedCamera {
  id: String!
  label: String!
  camera: ShootingCamera!
}

type ShootingAsset {
  id: String!
  name: String!
  url: String!
  format: String!
  origin: [Float!]!
  orientation: [Float!]
  scale: [Float!]
}

type ShootingShot {
  id: String!
  label: String!
  width: UInt32!
  height: UInt32!
  format: String!
  shape: String!
  background: String
  cameraId: String
  drawing: ShootingDrawing
  autoFit: Boolean
}

type ShootingSun {
  enabled: Boolean!
  azimuth: Float!
  elevation: Float!
  intensity: Float!
  color: String!
}

type ShootingAmbient {
  intensity: Float!
  color: String!
}

type ShootingShadow {
  enabled: Boolean!
  opacity: Float!
  softness: Float!
}

type ShootingMaterial {
  color: String!
  metalness: Float!
  roughness: Float!
  emissive: String!
  emissiveIntensity: Float!
  stroke: String!
}

type ShootingSceneLighting {
  background: String!
  sun: ShootingSun!
  ambient: ShootingAmbient!
  shadow: ShootingShadow!
  material: ShootingMaterial!
}


type ShootingDrawing {
  background: Boolean!
  fill: Boolean!
  fillColor: String
  fillOpacity: Float!
  visibleLines: Boolean!
  hiddenLines: Boolean!
  visibleColor: String!
  hiddenColor: String!
  visibleWidth: Float!
  hiddenWidth: Float!
  lineEasing: Float!
  mergeLines: Boolean!
}

type SetShotDrawing {
  id: String!
  patch: ShootingDrawingPatch!
}

type ShootingAssignedString {
  value: String
}

type ShootingDrawingPatch {
  background: Boolean
  fill: Boolean
  fillColor: ShootingAssignedString
  fillOpacity: Float
  visibleLines: Boolean
  hiddenLines: Boolean
  visibleColor: String
  hiddenColor: String
  visibleWidth: Float
  hiddenWidth: Float
  lineEasing: Float
  mergeLines: Boolean
  restoreAbsent: Boolean
}

type PatchShotCamera {
  shotId: String!
  field: String!
  camera: ShootingCamera!
  fallback: ShootingCamera!
  release: ShotCameraSlot
}

type ShotCameraSlot {
  seed: ShootingCamera!
  cameraId: String
}

type SetShotAutoFit {
  id: String!
  autoFit: Boolean
}
