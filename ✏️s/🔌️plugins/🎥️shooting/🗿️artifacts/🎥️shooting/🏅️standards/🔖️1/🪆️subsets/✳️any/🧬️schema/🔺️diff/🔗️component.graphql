# 🧬️ Shooting diff schema — sparse field delta over the artifact.

type ShootingDiff {
  artifact: ShootingArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  assets: ShootingAssetsDelta @state(class: ARTIFACT)
  savedCameras: ShootingSavedCamerasDelta @state(class: ARTIFACT)
  scene: ShootingSceneLighting @state(class: ARTIFACT)
  shots: ShootingShotsDelta @state(class: ARTIFACT)
  activeShotId: String @state(class: ARTIFACT)
  activeAssetId: String @state(class: ARTIFACT)
  selectedShotIds: ShootingStringList @state(class: PRESENCE)
  selectedAssetIds: ShootingStringList @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  defaultShotFormat: String @state(class: CONFIG)
  defaultShotShape: String @state(class: CONFIG)
  defaultAssetFormat: String @state(class: CONFIG)
  selectionMethod: String @state(class: CONFIG)
  centerModel: Boolean @state(class: CONFIG)
  fitRevision: Int @state(class: CONFIG)
  cameraDraftLabel: String @state(class: CONFIG)
  camera: ShootingCamera @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  hoveredAssetId: String @state(class: ARTIFACT)
}

type ShootingStringList {
  values: [String!]!
}

type ShootingAssetsDelta {
  added: [ShootingAsset!]!
  removed: [String!]!
  patched: [ShootingAssetPatchEntry!]!
  reordered: [String!]
}

type ShootingShotsDelta {
  added: [ShootingShot!]!
  removed: [String!]!
  patched: [ShootingShotPatchEntry!]!
  reordered: [String!]
}

type ShootingSavedCamerasDelta {
  added: [ShootingSavedCamera!]!
  removed: [String!]!
  patched: [ShootingSavedCameraPatchEntry!]!
  reordered: [String!]
}

type ShootingAssetPatchEntry {
  id: String!
  patch: ShootingAssetPatch!
}

type ShootingShotPatchEntry {
  id: String!
  patch: ShootingShotPatch!
}

type ShootingSavedCameraPatchEntry {
  id: String!
  patch: ShootingSavedCameraPatch!
}

type ShootingAssetPatch {
  name: String
  url: String
  origin: [Float!]
  orientation: [Float!]
  scale: [Float!]
}

type ShootingShotPatch {
  label: String
  width: Int
  height: Int
  format: String
  shape: String
}

type ShootingSavedCameraPatch {
  label: String
  camera: ShootingCamera
}

type ShootingArtifact {
  schema: String!
  assets: [ShootingAsset!]!
  savedCameras: [ShootingSavedCamera!]!
  scene: ShootingSceneLighting!
  shots: [ShootingShot!]!
  activeShotId: String!
  activeAssetId: String!
  selectedShotIds: [String!]!
  selectedAssetIds: [String!]!
  activeUtilityId: String!
  defaultShotFormat: String!
  defaultShotShape: String!
  defaultAssetFormat: String!
  selectionMethod: String!
  centerModel: Boolean!
  fitRevision: Int!
  cameraDraftLabel: String!
  camera: ShootingCamera!
  locale: String!
  hoveredAssetId: String
}

type ShootingCamera {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
  fov: Float!
  up: [Float!]
  projection: String
}

type ShootingSavedCamera {
  id: String!
  label: String!
  camera: ShootingCamera!
}

type ShootingAsset {
  id: String!
  name: String!
  url: String!
  format: String!
  origin: [Float!]!
  orientation: [Float!]
  scale: [Float!]
}

type ShootingShot {
  id: String!
  label: String!
  width: Int!
  height: Int!
  format: String!
  shape: String!
  background: String
  cameraId: String
}

type ShootingSun {
  enabled: Boolean!
  azimuth: Float!
  elevation: Float!
  intensity: Float!
  color: String!
}

type ShootingAmbient {
  intensity: Float!
  color: String!
}

type ShootingShadow {
  enabled: Boolean!
  opacity: Float!
  softness: Float!
}

type ShootingMaterial {
  color: String!
  metalness: Float!
  roughness: Float!
  emissive: String!
  emissiveIntensity: Float!
}

type ShootingSceneLighting {
  background: String!
  sun: ShootingSun!
  ambient: ShootingAmbient!
  shadow: ShootingShadow!
  material: ShootingMaterial!
  emblemBase64: String
}
