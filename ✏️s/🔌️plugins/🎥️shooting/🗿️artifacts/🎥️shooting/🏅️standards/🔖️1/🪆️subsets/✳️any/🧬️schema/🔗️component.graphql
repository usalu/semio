# 🧬️ Shooting artifact schema — every field with its state class.

type ShootingArtifact {
  schema: String! @state(class: PERSISTENT)
  assets: [ShootingAsset!]! @state(class: PERSISTENT)
  savedCameras: [ShootingSavedCamera!]! @state(class: PERSISTENT)
  scene: ShootingSceneLighting! @state(class: PERSISTENT)
  shots: [ShootingShot!]! @state(class: PERSISTENT)
  activeShotId: String! @state(class: PERSISTENT)
  activeAssetId: String! @state(class: PERSISTENT)
  selectedShotIds: [String!]! @state(class: SHARED_UI)
  selectedAssetIds: [String!]! @state(class: SHARED_UI)
  activeUtilityId: String! @state(class: SHARED_UI)
  defaultShotFormat: String! @state(class: LOCAL_UI)
  defaultShotShape: String! @state(class: LOCAL_UI)
  defaultAssetFormat: String! @state(class: LOCAL_UI)
  selectionMethod: String! @state(class: LOCAL_UI)
  centerModel: Boolean! @state(class: LOCAL_UI)
  fitRevision: Int! @state(class: LOCAL_UI)
  cameraDraftLabel: String! @state(class: LOCAL_UI)
  camera: ShootingCamera! @state(class: LOCAL_UI)
  locale: String! @state(class: LOCAL_UI)
  hoveredAssetId: String @state(class: PREVIEW)
}

type ShootingCamera {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
  fov: Float!
  up: [Float!]
  projection: String
}

type ShootingSavedCamera {
  id: String!
  label: String!
  camera: ShootingCamera!
}

type ShootingAsset {
  id: String!
  name: String!
  url: String!
  format: String!
  origin: [Float!]!
  orientation: [Float!]
  scale: [Float!]
}

type ShootingShot {
  id: String!
  label: String!
  width: Int!
  height: Int!
  format: String!
  shape: String!
  background: String
  cameraId: String
}

type ShootingSun {
  enabled: Boolean!
  azimuth: Float!
  elevation: Float!
  intensity: Float!
  color: String!
}

type ShootingAmbient {
  intensity: Float!
  color: String!
}

type ShootingShadow {
  enabled: Boolean!
  opacity: Float!
  softness: Float!
}

type ShootingMaterial {
  color: String!
  metalness: Float!
  roughness: Float!
  emissive: String!
  emissiveIntensity: Float!
}

type ShootingSceneLighting {
  background: String!
  sun: ShootingSun!
  ambient: ShootingAmbient!
  shadow: ShootingShadow!
  material: ShootingMaterial!
  emblemBase64: String
}
