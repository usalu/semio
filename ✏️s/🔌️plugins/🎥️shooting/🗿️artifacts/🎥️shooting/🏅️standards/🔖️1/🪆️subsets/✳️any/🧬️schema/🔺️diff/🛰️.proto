syntax = "proto3";
package semio.s.shooting.shooting.diff;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";

// 🧬️ Shooting diff schema — sparse field delta over the artifact.

message ShootingDiff {
  // @state artifact
  optional string schema = 1;
  // @state artifact
  optional ShootingAssetsDelta assets = 2;
  // @state artifact
  optional ShootingSavedCamerasDelta saved_cameras = 3;
  // @state artifact
  optional ShootingScenePatch scene = 4;
  // @state artifact
  optional ShootingShotsDelta shots = 5;
  // @state artifact
  optional string active_shot_id = 6;
  // @state artifact
  optional string active_asset_id = 7;
  // @state artifact
  optional ShootingAssignedEmblem emblem = 8;
}

message ShootingAssignedEmblem {
  optional semio.os.store.ArtifactChild value = 1;
}

message ShootingAssignedQuaternion {
  repeated double value = 1;
  bool present = 2;
}

message ShootingAssignedVector {
  repeated double value = 1;
  bool present = 2;
}

message ShootingAssignedString {
  optional string value = 1;
}

enum ShootingEditKind {
  SHOOTING_EDIT_KIND_ADD = 0;
  SHOOTING_EDIT_KIND_REMOVE = 1;
  SHOOTING_EDIT_KIND_MOVE = 2;
}

message ShootingAssetEdit {
  ShootingEditKind edit = 1;
  optional uint32 index = 2;
  optional string id = 3;
  optional ShootingAsset item = 4;
  optional uint32 from = 5;
  optional uint32 to = 6;
}

message ShootingShotEdit {
  ShootingEditKind edit = 1;
  optional uint32 index = 2;
  optional string id = 3;
  optional ShootingShot item = 4;
  optional uint32 from = 5;
  optional uint32 to = 6;
}

message ShootingSavedCameraEdit {
  ShootingEditKind edit = 1;
  optional uint32 index = 2;
  optional string id = 3;
  optional ShootingSavedCamera item = 4;
  optional uint32 from = 5;
  optional uint32 to = 6;
}

message ShootingAssetsDelta {
  repeated ShootingAssetEdit edits = 1;
  repeated ShootingAssetPatchEntry patched = 2;
}

message ShootingShotsDelta {
  repeated ShootingShotEdit edits = 1;
  repeated ShootingShotPatchEntry patched = 2;
}

message ShootingSavedCamerasDelta {
  repeated ShootingSavedCameraEdit edits = 1;
  repeated ShootingSavedCameraPatchEntry patched = 2;
}

message ShootingAssetPatchEntry {
  string id = 1;
  ShootingAssetPatch patch = 2;
}

message ShootingShotPatchEntry {
  string id = 1;
  ShootingShotPatch patch = 2;
}

message ShootingSavedCameraPatchEntry {
  string id = 1;
  ShootingSavedCameraPatch patch = 2;
}

message ShootingAssetPatch {
  optional string name = 1;
  optional string url = 2;
  optional string format = 3;
  repeated double origin = 4;
  optional ShootingAssignedQuaternion orientation = 5;
  optional ShootingAssignedVector scale = 6;
}

message ShootingShotPatch {
  optional string label = 1;
  optional uint32 width = 2;
  optional uint32 height = 3;
  optional string format = 4;
  optional string shape = 5;
  optional ShootingAssignedString background = 6;
  optional ShootingAssignedString camera_id = 7;
}

message ShootingSavedCameraPatch {
  optional string label = 1;
  optional ShootingCamera camera = 2;
}

message ShootingScenePatch {
  optional string background = 1;
  optional bool sun_enabled = 2;
  optional double sun_azimuth = 3;
  optional double sun_elevation = 4;
  optional double sun_intensity = 5;
  optional string sun_color = 6;
  optional double ambient_intensity = 7;
  optional string ambient_color = 8;
  optional bool shadow_enabled = 9;
  optional double shadow_opacity = 10;
  optional double shadow_softness = 11;
  optional string material_color = 12;
  optional double material_metalness = 13;
  optional double material_roughness = 14;
  optional string material_emissive = 15;
  optional double material_emissive_intensity = 16;
  optional string material_stroke = 17;
}

message ShootingArtifact {
  string schema = 1;
  repeated ShootingAsset assets = 2;
  repeated ShootingSavedCamera saved_cameras = 3;
  ShootingSceneLighting scene = 4;
  repeated ShootingShot shots = 5;
  string active_shot_id = 6;
  string active_asset_id = 7;
  optional semio.os.store.ArtifactChild emblem = 8;
}

message ShootingCamera {
  repeated double position = 1;
  repeated double target = 2;
  double zoom = 3;
  double fov = 4;
  repeated double up = 5;
  optional string projection = 6;
}

message ShootingSavedCamera {
  string id = 1;
  string label = 2;
  ShootingCamera camera = 3;
}

message ShootingAsset {
  string id = 1;
  string name = 2;
  string url = 3;
  string format = 4;
  repeated double origin = 5;
  repeated double orientation = 6;
  repeated double scale = 7;
}

message ShootingShot {
  string id = 1;
  string label = 2;
  uint32 width = 3;
  uint32 height = 4;
  string format = 5;
  string shape = 6;
  optional string background = 7;
  optional string camera_id = 8;
}

message ShootingSun {
  bool enabled = 1;
  double azimuth = 2;
  double elevation = 3;
  double intensity = 4;
  string color = 5;
}

message ShootingAmbient {
  double intensity = 1;
  string color = 2;
}

message ShootingShadow {
  bool enabled = 1;
  double opacity = 2;
  double softness = 3;
}

message ShootingMaterial {
  string color = 1;
  double metalness = 2;
  double roughness = 3;
  string emissive = 4;
  double emissive_intensity = 5;
  string stroke = 6;
}

message ShootingSceneLighting {
  string background = 1;
  ShootingSun sun = 2;
  ShootingAmbient ambient = 3;
  ShootingShadow shadow = 4;
  ShootingMaterial material = 5;
}
