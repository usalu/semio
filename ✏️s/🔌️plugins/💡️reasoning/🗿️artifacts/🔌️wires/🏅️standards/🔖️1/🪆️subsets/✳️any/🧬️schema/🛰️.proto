syntax = "proto3";
package semio.s.reasoning.wires.artifact;

// 🧬️ Wires artifact schema.

message WiresArtifact {
  // @state artifact
  DslValue wires_fixture = 1;
  // @state artifact
  DslValue board_fixture = 2;
  // @state artifact
  optional string drag_node_id = 3;
  // @state artifact
  double drag_last_x = 4;
  // @state artifact
  double drag_last_y = 5;
  // @state config
  string locale = 6;
}

message DslValue {}
