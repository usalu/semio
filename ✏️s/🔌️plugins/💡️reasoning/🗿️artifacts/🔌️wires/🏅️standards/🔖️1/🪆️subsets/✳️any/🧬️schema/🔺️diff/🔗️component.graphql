# 🧬️ Wires diff schema — sparse field delta.

scalar DslValue

type WiresDiff {
  artifact: WiresArtifact @state(class: ARTIFACT)
  wiresFixture: DslValue @state(class: ARTIFACT)
  boardFixture: DslValue @state(class: ARTIFACT)
  dragNodeId: String @state(class: ARTIFACT)
  dragLastX: Float @state(class: ARTIFACT)
  dragLastY: Float @state(class: ARTIFACT)
  locale: String @state(class: CONFIG)
}

type WiresArtifact {
  wiresFixture: DslValue!
  boardFixture: DslValue!
  dragNodeId: String
  dragLastX: Float!
  dragLastY: Float!
  locale: String!
}
