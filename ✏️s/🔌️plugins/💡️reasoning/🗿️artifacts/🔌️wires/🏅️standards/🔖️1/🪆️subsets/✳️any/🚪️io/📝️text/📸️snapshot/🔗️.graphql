scalar UInt64
scalar Int64
scalar Ieee754Word64
scalar IntrinsicOctets
enum IntrinsicKind { NULL BOOLEAN UNSIGNED SIGNED FLOAT TEXT BYTES ARRAY OBJECT }
type Document { fixtureRoot: UInt64! metaRoot: UInt64! content: Child! nodes: [Node!]! }
type Child { childId: String! target: Target! }
type Target { artifactId: String! artifactKind: String! standard: String! subset: String! }
