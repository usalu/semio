# 🧬️ Wires artifact schema — every field with its state class.

scalar DslValue

type WiresArtifact {
  wiresFixture: DslValue! @state(class: ARTIFACT)
  boardFixture: DslValue! @state(class: ARTIFACT)
  dragNodeId: String @state(class: ARTIFACT)
  dragLastX: Float! @state(class: ARTIFACT)
  dragLastY: Float! @state(class: ARTIFACT)
  locale: String! @state(class: CONFIG)
}
