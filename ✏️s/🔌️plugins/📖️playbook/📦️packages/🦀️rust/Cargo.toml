[package]
name = "semio-s-plugin-playbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Playbook plugin - one crate for the playbook artifact (diff/op/dsl/pack/spr/engine, all thin wrappers over the shared kernel domain) and the playbook play app (commands/modes/windows)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:playbook"

[package.metadata.semio]
role = "plugin"
consumes = ["playbook.blockKind"]

[[package.metadata.semio.playground]]
variant = "playbook"
ports = { react = 6085, wgpu = 6185 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
playbook = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true
