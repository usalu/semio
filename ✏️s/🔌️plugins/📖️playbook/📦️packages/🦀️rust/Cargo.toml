cargo-features = ["trim-paths"]

[package]
name = "semio-s-plugin-playbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Playbook plugin - one crate for the playbook artifact (diff/op/dsl/pack/spr/engine, all thin wrappers over the shared kernel domain) and the playbook play app (commands/modes/windows)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:playbook"

[package.metadata.semio]
role = "plugin"
consumes = ["playbook.blockKind"]

[[package.metadata.semio.playground]]
variant = "playbook"
ports = { react = 6085, wgpu = 6185 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
playbook = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📖️playbook/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-playbook" }
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true

# 🩹️ TEMPORARY verification overlay (TEMPLATE.md §3) — this crate is not yet a workspace member (the
# registrar hasn't swapped root Cargo.toml's member lines), so it needs to be its own workspace root to
# `cargo check`/`test`/`clippy` in isolation. DELETE this whole block (and the nested target/+Cargo.lock
# it creates) before handoff; the registrar's member-line swap is what makes it real again.
[workspace]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
