playbook = { path = "../../../../../../../✏️s/🔌️plugins/📖️playbook/🎛️apps/📖️playbook/⚡️implementations/🦀️rust", package = "semio-s-app-playbook" }
playbook_ui = { path = "../../../../../../../✏️s/🔌️plugins/📖️playbook/🎛️apps/📖️playbook/🔨️modules/🖱️ui/⚡️implementations/🦀️rust", package = "semio-s-app-playbook-ui" }
