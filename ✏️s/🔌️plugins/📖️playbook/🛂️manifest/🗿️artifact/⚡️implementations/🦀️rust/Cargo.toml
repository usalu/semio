[package]
name = "semio-s-plugin-playbook"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook"

[package.metadata.semio]
consumes = ["playbook.blockKind"]

[[package.metadata.semio.playground]]
variant = "playbook"
ports = { react = 6085, wgpu = 6185 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌️plugins/📖️playbook/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
