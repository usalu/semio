# 💡️ Playbook inference schema — topology (step/block dependency order).

type PlaybookInference {
  topology: PlaybookTopology! @derived
}

type PlaybookTopology {
  topoOrder: [String!]!
  depth: [PlaybookTopologyDepthEntry!]!
  cycleFree: Boolean!
  nodeCount: Int!
}

type PlaybookTopologyDepthEntry {
  nodeId: String!
  depth: Int!
}
