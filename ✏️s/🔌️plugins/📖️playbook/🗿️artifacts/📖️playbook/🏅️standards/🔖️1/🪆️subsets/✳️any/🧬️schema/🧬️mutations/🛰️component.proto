syntax = "proto3";
package semio.s.playbook.playbook.mutation;

message PlaybookMutation {
  oneof kind {
    AddStep add_step = 1;
    RemoveStep remove_step = 2;
    MoveStep move_step = 3;
    AddBlock add_block = 4;
    RemoveBlock remove_block = 5;
    MoveBlock move_block = 6;
    ReplaceBlock replace_block = 7;
    UpdateStep update_step = 8;
    ChangeTitle change_title = 9;
  }
}

message AddStep { bytes step_json = 1; optional uint32 index = 2; }
message RemoveStep { string step_id = 1; }
message MoveStep { string step_id = 1; uint32 index = 2; }
message AddBlock { string step_id = 1; bytes block_json = 2; optional uint32 index = 3; }
message RemoveBlock { string step_id = 1; string block_id = 2; }
message MoveBlock { string block_id = 1; string from_step_id = 2; string to_step_id = 3; uint32 index = 4; }
message ReplaceBlock { string step_id = 1; bytes block_json = 2; }
message UpdateStep { string step_id = 1; string title = 2; optional string description = 3; }
message ChangeTitle { optional string new_title = 1; }
