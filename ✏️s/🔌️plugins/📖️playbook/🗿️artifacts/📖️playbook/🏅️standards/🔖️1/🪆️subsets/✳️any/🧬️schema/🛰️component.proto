syntax = "proto3";
package semio.s.playbook.playbook.artifact;

message PlaybookArtifact {
  string schema = 1;
  string id = 2;
  string version = 3;
  optional string title = 4;
  repeated PlaybookStep steps = 5;
  repeated string selected_ids = 6;
  string locale = 7;
  string contributions_json = 8;
}

message PlaybookStep {
  string id = 1;
  string title = 2;
  optional string description = 3;
  repeated PlaybookBlock blocks = 4;
}

message PlaybookBlock {
  string id = 1;
  string label = 2;
  string kind = 3;
}
