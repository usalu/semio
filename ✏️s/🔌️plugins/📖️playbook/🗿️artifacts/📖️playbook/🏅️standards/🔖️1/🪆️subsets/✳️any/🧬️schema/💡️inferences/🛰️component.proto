syntax = "proto3";
package semio.s.playbook.playbook.inference;

// 💡️ Playbook inference schema — topology (step/block dependency order).

message PlaybookInference {
  // @derived
  PlaybookTopology topology = 1;
}

message PlaybookTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}
