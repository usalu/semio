# 🧬️ Playbook diff schema — sparse field delta over the artifact.

type PlaybookDiff {
  artifact: PlaybookArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  version: String @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  document: ArtifactLink @state(class: ARTIFACT) @child(kind: "s.stdio.semio.document")
  flow: ArtifactLink @state(class: ARTIFACT) @child(kind: "s.stdio.semio.flow")
  selectedIds: PlaybookStringList @state(class: PRESENCE)
  locale: String @state(class: CONFIG)
  contributionsJson: String @state(class: CONFIG)
}

type PlaybookStringList {
  values: [String!]!
}

type PlaybookArtifact { schema: String! }
