[package]
name = "semio-s-plugin-playbook-procedural"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook-module-procedural"

[package.metadata.semio]
role = "extension"
extends = "playbook"
contributes = ["playbook.blockKind"]

[lib]
crate-type = ["cdylib", "rlib"]
