[package]
name = "semio-s-plugin-playbook-procedural"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:playbook-module-procedural"

[package.metadata.semio]
role = "extension"
extends = "playbook"
contributes = ["playbook.blockKind"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-framework-os-kernel = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
flow = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow/📦️packages/🦀️rust", default-features = false, package = "semio-framework-os-flow" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-value-derive = { path = "../../../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
pack = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
# 🚧️ Genuine remainder, not an oversight — `flow::playbook::visible_blocks` and `FlowFixture`'s own
# parse (both `🌊️flow`, `🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow`) are hard-typed to
# `serde_json::{Map, Value}`/`serde::Deserialize`; that framework module is a peer's own in-progress
# serde-fanout wave (ticket 26/09/01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS),
# not this extension's to convert. Every other JSON value in this crate goes through
# `pack::json`/`ToValue`/`FromValue` — see `🦀️component.rs`'s own top-of-file docstring.
serde_json = "1.0.140"

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
