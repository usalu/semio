[package]
workspace = "../../.."
name = "semio-s-plugin-playbook-procedural-component"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The `playbook-module-procedural` extension component: the one cdylib of `semio-s-plugin-playbook-procedural`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:playbook-module-procedural"

[package.metadata.semio]
