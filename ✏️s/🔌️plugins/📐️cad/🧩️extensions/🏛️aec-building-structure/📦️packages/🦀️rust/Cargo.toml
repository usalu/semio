[package]
name = "semio-s-plugin-cad-aec-building-structure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CAD aec-building-structure extension — contributes structure computers to cad-play"

[lints]
workspace = true

[package.metadata.component]
package = "semio:cad-extension-aec-building-structure"

[package.metadata.semio]
role = "extension"
extends = "cad"
contributes = ["cad.computer"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
