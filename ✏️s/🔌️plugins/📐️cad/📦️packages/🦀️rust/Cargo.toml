[package]
name = "semio-s-plugin-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CAD plugin - one crate for the cad artifact (diff/op/dsl/pack/spr/engine) and the cad play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:cad"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "cad"
app = "cad-play"
ports = { react = 6020, wgpu = 6120 }

# 🎪️ The `koordinator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The `/cad-fixture` asset row below
# stays here too (a copy also lives on the bundle crate) since the standalone `cad` dev variant needs
# it independently of the demonstrator.
[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-fixture"
app = "cad-play"
root = "✏️s/🔌️plugins/📐️cad/🧫️fixtures"

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
kernel_3d_brepkit = { path = "../../../../🔨️modules/🧊️3d/📐️brep/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../../../🔨️modules/🧊️3d/📐️brep/⚙️engine/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-3d-brep-engine" }
mathematical_graph_dsl = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🕸️graph/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-graph-dsl" }
mathematical_graph_manifest = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🕸️graph/🛂️manifest/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-graph-manifest" }
ui_wgpu = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧊️wgpu/⚡️implementations/🦀️rust", package = "semio-framework-ui-wgpu" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# ⛔️ TEMPORARY overlay (removed at registrar handoff) — see the migration ticket.
[workspace]
members = ["."]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
[profile.dev]
debug = false
incremental = true
[profile.dev.build-override]
opt-level = 3
[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
[profile.wasm-release.package.semio-framework-os-kernel-store]
codegen-units = 1
