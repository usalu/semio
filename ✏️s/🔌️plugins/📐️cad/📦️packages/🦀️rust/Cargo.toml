[package]
name = "semio-s-plugin-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CAD plugin - one crate for the cad artifact (diff/op/dsl/pack/spr/engine) and the cad play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:cad"

[package.metadata.semio]
role = "plugin"

# 📖️ Opts this plugin into the generated Storybook scope registry (`.storybook/scopes.ts`'s
# `GENERATED_SCOPES`, read via `readSemioMarkerSubTable`) instead of a hand-maintained entry — see
# 26/08/06/GENERATED-STORYBOOK-SCOPES-AND-STORIES-FROM-PACKAGE-CATALOG. `sourceRoots` are relative to
# this plugin's OWNER dir (`✏️s/🔌️plugins/📐️cad`), matching the pre-existing hand-curated `cad` scope.
[package.metadata.semio.storybook]
id = "cad"
titlePrefix = "📐️cad"
sourceRoots = ["🎛️apps/📐️cad/⚙️engine/📺️renderer", "🗿️artifacts/📐️cad/📚️examples/🖼️assets", "🗿️artifacts/📐️cad/📚️examples/🧫️fixtures"]

[[package.metadata.semio.playground]]
variant = "cad"
app = "cad-play"
ports = { react = 6020, wgpu = 6120 }

# 🎪️ The `koordinator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The `/cad-fixture` asset row below
# stays here too (a copy also lives on the bundle crate) since the standalone `cad` dev variant needs
# it independently of the demonstrator.
[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-fixture"
app = "cad-play"
root = "✏️s/🔌️plugins/📐️cad/🗿️artifacts/📐️cad/📚️examples/🧫️fixtures"

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio" }
math = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/📦️packages/🦀️rust", package = "semio-framework-math" }
graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-3d = { path = "../../../../../🧰️framework/🔨️modules/🧊️3d/📦️packages/🦀️rust" }
# 🚪️ Ticket 26/08/13/UNIFIED-STATE-ARCHITECTURE-AND-DEMONSTRATOR-RESTORATION D2: `"3d.cad"`'s ten
# solid/mesh/dwg host registrations moved here from 🎪️demonstrator's koordinator pane, which owned
# neither the kind nor the codecs. The registrars are `semio_framework_os::` free functions with no
# SDK re-export yet, so the owner needs the host crate directly until APA/M3 lands them on
# `semio_framework_plugin` — tracked by `taxonomy/plugin-dependency-os-host`, not carved out.
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
ui_wgpu = {path = "../../../../../🧰️framework/🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"]}
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
