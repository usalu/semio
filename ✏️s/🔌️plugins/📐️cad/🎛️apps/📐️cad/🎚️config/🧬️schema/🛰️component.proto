syntax = "proto3";
package semio.app.cad.cad;

message CadHoverTarget {
  optional string object_id = 1;
  optional string mode = 2;
  optional uint32 id = 3;
}
message CadSelectionTargets {
  bool mesh = 1;
  bool vertex = 2;
  bool edge = 3;
  bool face = 4;
}
message CadComponentSelection {
  CadSelectionTargets targets = 1;
  string mode = 2;
  repeated uint32 ids = 3;
}
message CadSunConfig {
  bool enabled = 1;
  double azimuth = 2;
  double elevation = 3;
  double intensity = 4;
  string color = 5;
}
message CadProjectionDsl {
  string kind = 1;
}
message CadCamera {
  repeated double position = 1;
  repeated double target = 2;
  double zoom = 3;
  double fov = 4;
  CadProjectionDsl projection = 5;
}
message CadDislocateOptions {
  bool move_enabled = 1;
  bool rotate_enabled = 2;
}

message CadConfig {
  // @state config
  repeated string selected_object_ids = 1;
  // @state config
  repeated string selected_node_ids = 2;
  // @state config
  string selection_method = 3;
  // @state config
  optional string hovered_object_id = 4;
  // @state config
  optional CadHoverTarget hovered_target = 5;
  // @state config
  optional string active_object_id = 6;
  // @state config
  CadComponentSelection component_selection = 7;
  // @state config
  string engagement_input = 8;
  // @state config
  string engagement_step = 9;
  // @state config
  optional string active_example_id = 10;
  // @state config
  optional string selected_reference_model_definition_id = 11;
  // @state config
  optional string selected_reference_id = 12;
  // @state config
  optional string selected_primitive_id = 13;
  // @state config
  optional string selected_primitive_kind = 14;
  // @state config
  optional string engagement_pane = 15;
  // @state config
  optional string engagement_session_json = 16;
  // @state config
  optional string last_finalized_interaction_id = 17;
  // @state config
  CadSunConfig sun = 18;
  // @state config
  CadCamera camera = 19;
  // @state config
  CadCamera camera_building = 20;
  // @state config
  CadCamera camera_energy = 21;
  // @state config
  CadCamera camera_structure_classic = 22;
  // @state config
  CadDislocateOptions dislocate_shape = 23;
  // @state config
  CadDislocateOptions dislocate_building = 24;
  // @state config
  CadDislocateOptions dislocate_energy = 25;
  // @state config
  CadDislocateOptions dislocate_structure_classic = 26;
  // @state config
  string active_utility_id = 27;
  // @state config
  string locale = 28;
  // @state config
  string terminology = 29;
  // @state config
  string contributions_json = 30;
}
