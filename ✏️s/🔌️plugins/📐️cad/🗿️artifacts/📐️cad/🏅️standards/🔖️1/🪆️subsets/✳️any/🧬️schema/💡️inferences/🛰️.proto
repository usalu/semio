syntax = "proto3";
package semio.s.cad.cad.inference;

// 💡️ Cad inference schema — object/vertex counts + 3d bounding box across every pane.

message CadInference {
  // @derived
  uint64 object_count = 1;
  // @derived
  uint64 vertex_count = 2;
  // @derived
  CadBounds bounds = 3;
}

message CadBounds {
  repeated double min = 1;
  repeated double max = 2;
}
