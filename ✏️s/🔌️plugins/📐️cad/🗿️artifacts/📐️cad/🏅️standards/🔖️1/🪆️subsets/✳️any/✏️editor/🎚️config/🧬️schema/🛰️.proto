syntax = "proto3";
package semio.app.cad.cad;

message CadConfig {
  // @state config
  repeated string selected_node_ids = 1;
  // @state config
  optional string hovered_reference_id = 2;
  // @state config
  optional string active_example_id = 3;
  // @state config
  optional string selected_reference_model_definition_id = 4;
  // @state config
  optional string selected_reference_id = 5;
  // @state config
  string contributions_json = 6;
}
