# 🧬️ CAD document composed from shared stdio model and drawing child identities.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
type CadArtifact {
  schema: String! @state(class: ARTIFACT)
  id: String! @state(class: ARTIFACT)
  shapeModel: ArtifactChild @state(class: ARTIFACT)
  buildingModel: ArtifactChild @state(class: ARTIFACT)
  energyModel: ArtifactChild @state(class: ARTIFACT)
  structureClassicModel: ArtifactChild @state(class: ARTIFACT)
  drawings: [ArtifactChild!]! @state(class: ARTIFACT)
  referencesByModelDefinitionId: [CadReferenceListEntry!]! @state(class: ARTIFACT)
  nodes: [CadNode!]! @state(class: ARTIFACT)
}
type CadNode { id: String! label: String! kind: String! }
type CadReference {
  id: String!
  sourceUrl: String!
  mediaKind: String!
  origin: [Float!]!
  orientation: [Float!]
  scale: Float
  widthWorld: Float!
  hidden: Boolean!
  locked: Boolean!
  opacity: Float
}
type CadReferenceList { values: [CadReference!]! }
type CadReferenceListEntry { key: String! value: CadReferenceList! }
