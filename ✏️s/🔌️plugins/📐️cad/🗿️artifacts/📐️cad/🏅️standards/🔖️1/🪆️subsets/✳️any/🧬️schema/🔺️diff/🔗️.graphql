# 🧬️ CadDiff schema.

type CadDiff {
  artifact: CadArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  objects: CadObjectsDelta @state(class: ARTIFACT)
  buildingObjects: CadObjectsDelta @state(class: ARTIFACT)
  energyObjects: CadObjectsDelta @state(class: ARTIFACT)
  structureClassicObjects: CadObjectsDelta @state(class: ARTIFACT)
  referencesByModelDefinitionId: [CadReferenceListEntry!] @state(class: ARTIFACT)
  nodes: CadNodesDelta @state(class: ARTIFACT)
  shapeGeometry: CadGeometry @state(class: ARTIFACT)
  buildingGeometry: CadGeometry @state(class: ARTIFACT)
  energyGeometry: CadGeometry @state(class: ARTIFACT)
  structureClassicGeometry: CadGeometry @state(class: ARTIFACT)
  activeModelDefinitionId: String @state(class: ARTIFACT)
  selectedObjectIds: CadStringList @state(class: PRESENCE)
  selectedNodeIds: CadStringList @state(class: PRESENCE)
  activeObjectId: String @state(class: PRESENCE)
  componentSelection: CadComponentSelection @state(class: PRESENCE)
  selectedReferenceModelDefinitionId: String @state(class: PRESENCE)
  selectedReferenceId: String @state(class: PRESENCE)
  selectedPrimitiveId: String @state(class: PRESENCE)
  selectedPrimitiveKind: String @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  activeExampleId: String @state(class: PRESENCE)
  selectionMethod: String @state(class: CONFIG)
  engagementInput: String @state(class: CONFIG)
  engagementStep: String @state(class: CONFIG)
  engagementPane: String @state(class: CONFIG)
  engagementSessionJson: String @state(class: CONFIG)
  lastFinalizedInteractionId: String @state(class: CONFIG)
  sunEnabled: Boolean @state(class: CONFIG)
  sunAzimuth: Float @state(class: CONFIG)
  sunElevation: Float @state(class: CONFIG)
  sunIntensity: Float @state(class: CONFIG)
  sunColor: String @state(class: CONFIG)
  camera: CadCamera @state(class: CONFIG)
  cameraBuilding: CadCamera @state(class: CONFIG)
  cameraEnergy: CadCamera @state(class: CONFIG)
  cameraStructureClassic: CadCamera @state(class: CONFIG)
  dislocateShape: CadDislocateOptions @state(class: CONFIG)
  dislocateBuilding: CadDislocateOptions @state(class: CONFIG)
  dislocateEnergy: CadDislocateOptions @state(class: CONFIG)
  dislocateStructureClassic: CadDislocateOptions @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  terminology: String @state(class: CONFIG)
  contributionsJson: String @state(class: CONFIG)
  hoveredObjectId: String @state(class: ARTIFACT)
  hoveredTargetObjectId: String @state(class: ARTIFACT)
  hoveredTargetMode: String @state(class: ARTIFACT)
  hoveredTargetId: Int @state(class: ARTIFACT)
}

type CadObject { id: String! }
type CadNode { id: String! }
type CadReferenceList { values: [String!]! }
type CadReferenceListEntry { key: String! value: CadReferenceList! }
type CadGeometry { anchorsJson: String }
type CadCamera { zoom: Float }
type CadComponentSelection { mode: String! }
type CadDislocateOptions { moveEnabled: Boolean! rotateEnabled: Boolean! }

type CadStringList { values: [String!]! }
type CadObjectsDelta { added: [CadObject!]! removed: [String!]! patched: [CadObject!]! reordered: [String!] }
type CadNodesDelta { added: [CadNode!]! removed: [String!]! patched: [CadNode!]! reordered: [String!] }
type CadArtifact { schema: String }
