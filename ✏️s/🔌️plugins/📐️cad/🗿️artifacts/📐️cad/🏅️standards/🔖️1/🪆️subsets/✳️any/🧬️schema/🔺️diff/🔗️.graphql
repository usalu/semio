# 🔺️ Sparse CAD document diff over composed model and drawing child identities.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
# import CadArtifact from "✏️s/🔌️plugins/📐️cad/🗿️artifacts/📐️cad/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🔗️.graphql"
type CadDiff {
  artifact: CadArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  shapeModel: ArtifactChild @state(class: ARTIFACT)
  buildingModel: ArtifactChild @state(class: ARTIFACT)
  energyModel: ArtifactChild @state(class: ARTIFACT)
  structureClassicModel: ArtifactChild @state(class: ARTIFACT)
  drawings: CadDrawingChildList @state(class: ARTIFACT)
  referencesByModelDefinitionId: [CadReferenceListEntry!] @state(class: ARTIFACT)
  nodes: CadNodesDelta @state(class: ARTIFACT)
}
type CadDrawingChildList { values: [ArtifactChild!]! }
type CadNodePatch { label: String }
type CadNodePatchEntry { id: String! patch: CadNodePatch! }
type CadNodesDelta { added: [CadNode!]! removed: [String!]! patched: [CadNodePatchEntry!]! reordered: [String!] }
