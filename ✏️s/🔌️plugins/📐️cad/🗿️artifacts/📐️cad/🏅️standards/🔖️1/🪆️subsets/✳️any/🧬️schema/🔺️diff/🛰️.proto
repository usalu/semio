syntax = "proto3";
package semio.s.cad.cad.diff;

// 🧬️ CadDiff schema.

message CadDiff {
  // @state artifact
  optional CadArtifact artifact = 1;
  // @state artifact
  optional string schema = 2;
  // @state artifact
  optional string id = 3;
  // @state artifact
  optional CadObjectsDelta objects = 4;
  // @state artifact
  optional CadObjectsDelta building_objects = 5;
  // @state artifact
  optional CadObjectsDelta energy_objects = 6;
  // @state artifact
  optional CadObjectsDelta structure_classic_objects = 7;
  // @state artifact
  map<string, CadReferenceList> references_by_model_definition_id = 8;
  // @state artifact
  optional CadNodesDelta nodes = 9;
  // @state artifact
  optional CadGeometry shape_geometry = 10;
  // @state artifact
  optional CadGeometry building_geometry = 11;
  // @state artifact
  optional CadGeometry energy_geometry = 12;
  // @state artifact
  optional CadGeometry structure_classic_geometry = 13;
  // @state artifact
  optional string active_model_definition_id = 14;
  // @state presence
  optional CadStringList selected_object_ids = 15;
  // @state presence
  optional CadStringList selected_node_ids = 16;
  // @state presence
  optional string active_object_id = 17;
  // @state presence
  optional CadComponentSelection component_selection = 18;
  // @state presence
  optional string selected_reference_model_definition_id = 19;
  // @state presence
  optional string selected_reference_id = 20;
  // @state presence
  optional string selected_primitive_id = 21;
  // @state presence
  optional string selected_primitive_kind = 22;
  // @state presence
  optional string active_utility_id = 23;
  // @state presence
  optional string active_example_id = 24;
  // @state config
  optional string selection_method = 25;
  // @state config
  optional string engagement_input = 26;
  // @state config
  optional string engagement_step = 27;
  // @state config
  optional string engagement_pane = 28;
  // @state config
  optional string engagement_session_json = 29;
  // @state config
  optional string last_finalized_interaction_id = 30;
  // @state config
  optional bool sun_enabled = 31;
  // @state config
  optional double sun_azimuth = 32;
  // @state config
  optional double sun_elevation = 33;
  // @state config
  optional double sun_intensity = 34;
  // @state config
  optional string sun_color = 35;
  // @state config
  optional CadCamera camera = 36;
  // @state config
  optional CadCamera camera_building = 37;
  // @state config
  optional CadCamera camera_energy = 38;
  // @state config
  optional CadCamera camera_structure_classic = 39;
  // @state config
  optional CadDislocateOptions dislocate_shape = 40;
  // @state config
  optional CadDislocateOptions dislocate_building = 41;
  // @state config
  optional CadDislocateOptions dislocate_energy = 42;
  // @state config
  optional CadDislocateOptions dislocate_structure_classic = 43;
  // @state config
  optional string locale = 44;
  // @state config
  optional string terminology = 45;
  // @state config
  optional string contributions_json = 46;
  // @state artifact
  optional string hovered_object_id = 47;
  // @state artifact
  optional string hovered_target_object_id = 48;
  // @state artifact
  optional string hovered_target_mode = 49;
  // @state artifact
  optional uint32 hovered_target_id = 50;
}

message CadObject { string id = 1; }
message CadNode { string id = 1; }
message CadReferenceList { repeated string values = 1; }
message CadGeometry { string anchors_json = 1; }
message CadCamera { double zoom = 1; }
message CadComponentSelection { string mode = 1; }
message CadDislocateOptions { bool move_enabled = 1; bool rotate_enabled = 2; }

message CadStringList { repeated string values = 1; }
message CadObjectsDelta { repeated CadObject added = 1; repeated string removed = 2; repeated CadObject patched = 3; repeated string reordered = 4; }
message CadNodesDelta { repeated CadNode added = 1; repeated string removed = 2; repeated CadNode patched = 3; repeated string reordered = 4; }
message CadArtifact { string schema = 1; }
