syntax = "proto3";
package semio.s.cad.cad.diff;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
import "✏️s/🔌️plugins/📐️cad/🗿️artifacts/📐️cad/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
message CadDiff {
  optional semio.s.cad.cad.artifact.CadArtifact artifact = 1;
  optional string schema = 2;
  optional string id = 3;
  optional semio.os.store.ArtifactChild shape_model = 4;
  optional semio.os.store.ArtifactChild building_model = 5;
  optional semio.os.store.ArtifactChild energy_model = 6;
  optional semio.os.store.ArtifactChild structure_classic_model = 7;
  optional CadDrawingChildList drawings = 8;
  map<string, semio.s.cad.cad.artifact.CadReferenceList> references_by_model_definition_id = 9;
  optional CadNodesDelta nodes = 10;
}
message CadDrawingChildList { repeated semio.os.store.ArtifactChild values = 1; }
message CadNodePatch { optional string label = 1; }
message CadNodePatchEntry { string id = 1; CadNodePatch patch = 2; }
message CadNodesDelta {
  repeated semio.s.cad.cad.artifact.CadNode added = 1;
  repeated string removed = 2;
  repeated CadNodePatchEntry patched = 3;
  repeated string reordered = 4;
}
