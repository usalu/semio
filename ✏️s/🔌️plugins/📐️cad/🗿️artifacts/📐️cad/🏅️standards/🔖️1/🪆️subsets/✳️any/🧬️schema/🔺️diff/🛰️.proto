syntax = "proto3";
package semio.s.cad.cad.diff;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
import "✏️s/🔌️plugins/📐️cad/🗿️artifacts/📐️cad/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
message CadDiff {
  optional string schema = 1;
  optional string id = 2;
  optional CadModelSlot shape_model = 3;
  optional CadModelSlot building_model = 4;
  optional CadModelSlot energy_model = 5;
  optional CadModelSlot structure_classic_model = 6;
  optional CadDrawingsDelta drawings = 7;
  optional CadBrepsDelta breps = 8;
  map<string, CadReferencesDelta> references_by_model_definition_id = 9;
  optional CadNodesDelta nodes = 10;
}
message CadModelSlot { optional semio.os.store.ArtifactChild child = 1; }
message CadNodeRemoval { string id = 1; uint64 index = 2; }
message CadNodeRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message CadReferenceRemoval { string id = 1; uint64 index = 2; }
message CadReferenceRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message CadDrawingRemoval { string id = 1; uint64 index = 2; }
message CadDrawingRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message CadBrepRemoval { string id = 1; uint64 index = 2; }
message CadBrepRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message CadDrawingInsertion { uint64 index = 1; semio.os.store.ArtifactChild row = 2; }
message CadBrepInsertion { uint64 index = 1; semio.os.store.ArtifactChild row = 2; }
message CadReferenceInsertion { uint64 index = 1; semio.s.cad.cad.artifact.CadReference row = 2; }
message CadNodeInsertion { uint64 index = 1; semio.s.cad.cad.artifact.CadNode row = 2; }
message CadDrawingsDelta { repeated CadDrawingRemoval removed = 1; repeated CadDrawingInsertion inserted = 2; repeated CadDrawingRelocation moved = 3; }
message CadBrepsDelta { repeated CadBrepRemoval removed = 1; repeated CadBrepInsertion inserted = 2; repeated CadBrepRelocation moved = 3; }
message CadOrientationSet { repeated double value = 1; }
message CadScaleSet { optional double value = 1; }
message CadOpacitySet { optional double value = 1; }
message CadReferencePatch {
  optional string source_url = 1;
  optional string media_kind = 2;
  repeated double origin = 3;
  optional CadOrientationSet orientation = 4;
  optional CadScaleSet scale = 5;
  optional double width_world = 6;
  optional bool hidden = 7;
  optional bool locked = 8;
  optional CadOpacitySet opacity = 9;
}
message CadReferenceModification { string id = 1; CadReferencePatch patch = 2; }
message CadReferencesDelta {
  repeated CadReferenceRemoval removed = 1;
  repeated CadReferenceInsertion inserted = 2;
  repeated CadReferenceRelocation moved = 3;
  repeated CadReferenceModification modified = 4;
}
message CadNodePatch { optional string label = 1; }
message CadNodeModification { string id = 1; CadNodePatch patch = 2; }
message CadNodesDelta {
  repeated CadNodeRemoval removed = 1;
  repeated CadNodeInsertion inserted = 2;
  repeated CadNodeRelocation moved = 3;
  repeated CadNodeModification modified = 4;
}
