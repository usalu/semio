syntax = "proto3";
package semio.s.cad.cad.artifact;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
message CadArtifact {
  string schema = 1;
  string id = 2;
  optional semio.os.store.ArtifactChild shape_model = 3;
  optional semio.os.store.ArtifactChild building_model = 4;
  optional semio.os.store.ArtifactChild energy_model = 5;
  optional semio.os.store.ArtifactChild structure_classic_model = 6;
  repeated semio.os.store.ArtifactChild drawings = 7;
  map<string, CadReferenceList> references_by_model_definition_id = 8;
  repeated CadNode nodes = 9;
}
message CadNode { string id = 1; string label = 2; string kind = 3; }
message CadReference {
  string id = 1;
  string source_url = 2;
  string media_kind = 3;
  repeated double origin = 4;
  repeated double orientation = 5;
  optional double scale = 6;
  double width_world = 7;
  bool hidden = 8;
  bool locked = 9;
  optional double opacity = 10;
}
message CadReferenceList { repeated CadReference values = 1; }
