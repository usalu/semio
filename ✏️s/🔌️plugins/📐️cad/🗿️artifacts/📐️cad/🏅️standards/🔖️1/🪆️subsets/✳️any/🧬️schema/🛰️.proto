syntax = "proto3";
package semio.s.cad.cad.artifact;

// 🧬️ CadArtifact schema.

message CadArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  string id = 2;
  // @state artifact
  repeated CadObject objects = 3;
  // @state artifact
  repeated CadObject building_objects = 4;
  // @state artifact
  repeated CadObject energy_objects = 5;
  // @state artifact
  repeated CadObject structure_classic_objects = 6;
  // @state artifact
  map<string, CadReferenceList> references_by_model_definition_id = 7;
  // @state artifact
  repeated CadNode nodes = 8;
  // @state artifact
  optional CadGeometry shape_geometry = 9;
  // @state artifact
  optional CadGeometry building_geometry = 10;
  // @state artifact
  optional CadGeometry energy_geometry = 11;
  // @state artifact
  optional CadGeometry structure_classic_geometry = 12;
  // @state artifact
  string active_model_definition_id = 13;
  // @state presence
  repeated string selected_object_ids = 14;
  // @state presence
  repeated string selected_node_ids = 15;
  // @state presence
  optional string active_object_id = 16;
  // @state presence
  CadComponentSelection component_selection = 17;
  // @state presence
  optional string selected_reference_model_definition_id = 18;
  // @state presence
  optional string selected_reference_id = 19;
  // @state presence
  optional string selected_primitive_id = 20;
  // @state presence
  optional string selected_primitive_kind = 21;
  // @state presence
  string active_utility_id = 22;
  // @state presence
  optional string active_example_id = 23;
  // @state config
  string selection_method = 24;
  // @state config
  string engagement_input = 25;
  // @state config
  string engagement_step = 26;
  // @state config
  optional string engagement_pane = 27;
  // @state config
  optional string engagement_session_json = 28;
  // @state config
  optional string last_finalized_interaction_id = 29;
  // @state config
  bool sun_enabled = 30;
  // @state config
  double sun_azimuth = 31;
  // @state config
  double sun_elevation = 32;
  // @state config
  double sun_intensity = 33;
  // @state config
  string sun_color = 34;
  // @state config
  CadCamera camera = 35;
  // @state config
  CadCamera camera_building = 36;
  // @state config
  CadCamera camera_energy = 37;
  // @state config
  CadCamera camera_structure_classic = 38;
  // @state config
  CadDislocateOptions dislocate_shape = 39;
  // @state config
  CadDislocateOptions dislocate_building = 40;
  // @state config
  CadDislocateOptions dislocate_energy = 41;
  // @state config
  CadDislocateOptions dislocate_structure_classic = 42;
  // @state config
  string locale = 43;
  // @state config
  string terminology = 44;
  // @state config
  string contributions_json = 45;
  // @state artifact
  optional string hovered_object_id = 46;
  // @state artifact
  optional string hovered_target_object_id = 47;
  // @state artifact
  optional string hovered_target_mode = 48;
  // @state artifact
  optional uint32 hovered_target_id = 49;
}

message CadObject { string id = 1; }
message CadNode { string id = 1; }
message CadReferenceList { repeated string values = 1; }
message CadGeometry { string anchors_json = 1; }
message CadCamera { double zoom = 1; }
message CadComponentSelection { string mode = 1; }
message CadDislocateOptions { bool move_enabled = 1; bool rotate_enabled = 2; }
