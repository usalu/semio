[package]
workspace = "../../../../../../../../.."
name = "semio-s-artifact-cad-cad-modes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "cad edit mode, world windows and options"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

