[package]
workspace = "../../../../../../../.."
name = "semio-s-artifact-cad-cad-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "cad editor kit: runtime, view, dispatch context, helpers and terminology"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework = { workspace = true }
semio-framework-3d-brep-engine = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-ui-contract = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-cad-cad-config = { workspace = true }
semio-s-artifact-cad-cad-inferences = { workspace = true }
semio-s-artifact-cad-cad-interaction = { workspace = true }
semio-s-artifact-cad-cad-io = { workspace = true }
semio-s-artifact-cad-cad-model = { workspace = true }
semio-s-artifact-cad-cad-play = { workspace = true }
semio-s-artifact-cad-cad-transform = { workspace = true }
semio-s-artifact-cad-cad-transient = { workspace = true }
semio-s-artifact-stdio-semio-model = { workspace = true }

[dev-dependencies]
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
