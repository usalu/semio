[package]
workspace = "../.."
name = "semio-s-artifact-cad-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "cad cad artifact"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[test]]
name = "cad_editor_unit"
path = "../../🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🧪️tests/🔬️unit/🦀️.rs"

[dependencies]
semio-framework-dsl = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-s-artifact-cad-cad-editor = { workspace = true }
semio-s-artifact-cad-cad-inferences = { workspace = true }
semio-s-artifact-cad-cad-io = { workspace = true }
semio-s-artifact-cad-cad-model = { workspace = true }

[dev-dependencies]
base64_codec = { workspace = true }
semio-framework = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-ui-locale = { workspace = true }
semio-framework-ui-scene = { workspace = true }
semio-framework-value = { workspace = true }
semio-s-artifact-cad-cad-examples = { workspace = true }
semio-s-artifact-cad-cad-interaction = { workspace = true }
semio-s-artifact-cad-cad-mut-nodes = { workspace = true }
semio-s-artifact-cad-cad-play = { workspace = true }
semio-s-artifact-cad-cad-typology = { workspace = true }
semio-s-artifact-stdio-semio = { workspace = true }
semio-s-artifact-stdio-semio-brep = { workspace = true }
semio-s-artifact-stdio-semio-model = { workspace = true }
serde_json = { workspace = true }
ui_wgpu = { workspace = true, features = ["wgpu"] }
