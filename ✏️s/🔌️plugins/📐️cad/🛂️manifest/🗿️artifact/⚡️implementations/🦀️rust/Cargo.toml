[package]
name = "semio-s-plugin-cad"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:cad"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "cad"
app = "cad-play"
ports = { react = 6020, wgpu = 6120 }

# 🎪️ The `koordinator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The `/cad-fixture` asset row below
# stays here too (a copy also lives on the bundle crate) since the standalone `cad` dev variant needs
# it independently of the demonstrator.
[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-fixture"
app = "cad-play"
root = "✏️s/🔌️plugins/📐️cad/🧫️fixtures"

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌️plugins/📐️cad/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
cad_document = { path = "../../../../../../../✏️s/🔌️plugins/📐️cad/🎛️apps/📐️cad/⚡️implementations/🦀️rust", package = "semio-s-app-cad" }
cad_document_engine = { path = "../../../../../../../✏️s/🔌️plugins/📐️cad/🎛️apps/📐️cad/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-cad-engine" }
cad_document_ui = { path = "../../../../../../../✏️s/🔌️plugins/📐️cad/🎛️apps/📐️cad/🔨️modules/🖱️ui/⚡️implementations/🦀️rust", package = "semio-s-app-cad-ui" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-core = { path = "../../../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
kernel_3d_brepkit = { path = "../../../../../../🔨️modules/🧊️3d/📐️brep/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-3d-brep" }
serde_json = "1.0.140"
