# 🧭️ Own workspace root: the repository root manifest is a shared leased file, and a member crate would serialise
# every concurrent session behind that lease.
[workspace]

[package]
name = "semio-procedural-mutation-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "🏭️ Production mutation bridge for 🌀️procedural — answers listMutations from the production dispatch aggregates themselves."

[[bin]]
name = "semio-procedural-mutation-bridge"
path = "🦀️.rs"

[dependencies]
semio-s-artifact-procedural-2d-mutations = { path = "../🗿️artifacts/🌀️generation2d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/📦️packages/🦀️rust" }
semio-s-artifact-procedural-2d-model = { path = "../🗿️artifacts/🌀️generation2d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📦️packages/🦀️rust" }
semio-s-artifact-procedural-2d-editor-transient = { path = "../🗿️artifacts/🌀️generation2d/🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🫧️transient/📦️packages/🦀️rust" }
semio-s-artifact-procedural-3d-viewer-transient = { path = "../🗿️artifacts/🧊️generation3d/🏅️standards/🔖️1/🪆️subsets/✳️any/👁️viewer/🫧️transient/📦️packages/🦀️rust" }
semio-s-artifact-procedural-3d-viewer-presence = { path = "../🗿️artifacts/🧊️generation3d/🏅️standards/🔖️1/🪆️subsets/✳️any/👁️viewer/👥️presence/📦️packages/🦀️rust" }
semio-s-artifact-procedural-3d-viewer-config = { path = "../🗿️artifacts/🧊️generation3d/🏅️standards/🔖️1/🪆️subsets/✳️any/👁️viewer/🎚️config/📦️packages/🦀️rust" }
semio-s-artifact-procedural-3d-editor-transient = { path = "../🗿️artifacts/🧊️generation3d/🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🫧️transient/📦️packages/🦀️rust" }
semio-s-artifact-procedural-3d-editor-config = { path = "../🗿️artifacts/🧊️generation3d/🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🎚️config/📦️packages/🦀️rust" }
semio-s-artifact-procedural-3d-mutations = { path = "../🗿️artifacts/🧊️generation3d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/📦️packages/🦀️rust" }
semio-s-artifact-procedural-3d-model = { path = "../🗿️artifacts/🧊️generation3d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📦️packages/🦀️rust" }
semio-framework-pack-json = { path = "../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust" }
pack = { path = "../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
semio-s-artifact-procedural-generation2d = { path = "../🗿️artifacts/🌀️generation2d/📦️packages/🦀️rust" }
semio-s-artifact-procedural-generation3d = { path = "../🗿️artifacts/🧊️generation3d/📦️packages/🦀️rust" }

[profile.prototype]
inherits = "dev"
