syntax = "proto3";
package semio.app.procedural.3d;
message Procedural3dConfig {
  // @state config
  string lod_mode = 1;
  // @state config
  string show_mode = 2;
  // @state config
  CameraJson camera = 3;
  // @state config
  Procedural3dPreviewCamera preview_camera = 4;
  // @state config
  string sun_json = 5;
  // @state config
  optional string selected_generation_id = 6;
  // @state config
  optional string generation_preview_text = 7;
  // @state config
  string active_utility_id = 8;
  // @state config
  string locale = 9;
  // @state config
  string contributions_json = 10;
}
message CameraJson {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
message Procedural3dPreviewCamera {
  repeated double position = 1;
  repeated double target = 2;
  double fov = 3;
}
