type Procedural3dConfig {
  selectedNodeIds: [String!]! @state(class: CONFIG)
  lodMode: String! @state(class: CONFIG)
  showMode: String! @state(class: CONFIG)
  selectionMethod: String! @state(class: CONFIG)
  hoveredNodeId: String @state(class: CONFIG)
  camera: CameraJson! @state(class: CONFIG)
  previewCamera: Procedural3dPreviewCamera! @state(class: CONFIG)
  sunJson: String! @state(class: CONFIG)
  selectedGenerationId: String @state(class: CONFIG)
  generationPreviewText: String @state(class: CONFIG)
  activeUtilityId: String! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
  contributionsJson: String! @state(class: CONFIG)
}
type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}
type Procedural3dPreviewCamera {
  position: [Float!]!
  target: [Float!]!
  fov: Float!
}
