type Procedural3dPresence {
  camera: CameraJson! @state(class: PRESENCE)
  previewCamera: Procedural3dPreviewCamera! @state(class: PRESENCE)
  activeUtilityId: String! @state(class: PRESENCE)
  showMode: String! @state(class: PRESENCE)
}
type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}
type Procedural3dPreviewCamera {
  position: [Float!]!
  target: [Float!]!
  fov: Float!
}
