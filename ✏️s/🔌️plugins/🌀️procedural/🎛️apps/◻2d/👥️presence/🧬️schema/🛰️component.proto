syntax = "proto3";
package semio.app.procedural.2d;
message Procedural2dPresence {
  // @state shared-ui
  repeated string selected_ids = 1;
  // @state shared-ui
  CameraJson camera = 2;
  // @state shared-ui
  string show_mode = 3;
  // @state shared-ui
  optional string selected_generation_id = 4;
}
message CameraJson {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
