syntax = "proto3";
package semio.s.procedural.assembly.artifact;

message AssemblyArtifact {
  AssemblySnapshot snapshot = 1;
}

message AssemblySlot {
  string id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  optional string pinned_module_id = 5;
}

message AssemblySlotEdge {
  string id = 1;
  string from_slot_id = 2;
  string to_slot_id = 3;
}

message AssemblyModuleWeight {
  string module_id = 1;
  double weight = 2;
}

message AssemblyRule {
  string id = 1;
  string module_a_id = 2;
  string module_b_id = 3;
  bool allowed = 4;
  string params_json = 5;
}

message ArtifactDialect {
  string artifact_kind = 1;
  string standard = 2;
  string subset = 3;
}

message ArtifactRef {
  string artifact_id = 1;
  ArtifactDialect dialect = 2;
}

message ArtifactChildHandle {
  string child_id = 1;
  ArtifactRef target = 2;
}

message AssemblySnapshot {
  string schema = 1;
  uint64 seed = 2;
  repeated AssemblySlot slots = 3;
  repeated AssemblySlotEdge edges = 4;
  repeated ArtifactChildHandle modules = 5;
  repeated AssemblyModuleWeight weights = 6;
  repeated AssemblyRule rules = 7;
}
