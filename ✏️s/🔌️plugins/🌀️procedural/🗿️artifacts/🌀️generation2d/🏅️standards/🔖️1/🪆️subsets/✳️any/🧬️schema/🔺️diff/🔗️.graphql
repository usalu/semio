# 🧬️ Generation2d diff schema — sparse field delta.

type Generation2dDiff {
  artifact: Generation2dArtifact @state(class: ARTIFACT)
  hostSnapshot: FlowHostSnapshot @state(class: ARTIFACT)
  generation: GenerationPlayState @state(class: ARTIFACT)
}

type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}
type WidgetLayout {
  x: Float!
  y: Float!
}
type SynapseSpec {
  id: String!
  from: String!
  to: String!
  fromPort: String!
  toPort: String!
}
scalar Widget
type FlowHostSnapshot {
  schema: String!
  camera: CameraJson!
  widgets: [Widget!]!
  synapses: [SynapseSpec!]!
  layout: [FlowHostSnapshotLayoutEntry!]!
}
type FlowHostSnapshotLayoutEntry {
  key: String!
  value: WidgetLayout!
}
type FormGeneration {
  id: String!
  name: String!
  valuesJson: String!
}
type GenerationPlayState {
  generations: [FormGeneration!]!
  selectedGenerationId: String
  previewText: String
}
type Generation2dStringList {
  values: [String!]!
}
type Generation2dArtifact {
  hostSnapshot: FlowHostSnapshot!
  generation: GenerationPlayState!
}
