# 🧬️ Generation2d diff schema — sparse field delta.

type Generation2dDiff {
  schema: String @state(class: ARTIFACT)
  camera: CameraJson @state(class: ARTIFACT)
  widgets: Generation2dWidgetsDelta @state(class: ARTIFACT)
  synapses: Generation2dSynapsesDelta @state(class: ARTIFACT)
  layout: Generation2dLayoutDelta @state(class: ARTIFACT)
  generations: Generation2dGenerationsDelta @state(class: ARTIFACT)
  selectedGeneration: Generation2dSelectionChange @state(class: ARTIFACT)
  previewText: Generation2dPreviewChange @state(class: ARTIFACT)
}

type Generation2dWidgetsDelta { added: [Widget!]! removed: [String!]! patched: [Generation2dWidgetPatchEntry!]! reordered: [String!] }
type Generation2dWidgetPatchEntry { id: String! patch: Generation2dWidgetPatch! }
union Generation2dWidgetPatch = Generation2dWidgetReplace | Generation2dWidgetSlider
type Generation2dWidgetReplace { kind: String! widget: Widget! }
type Generation2dWidgetSlider { kind: String! value: Float! min: Float! max: Float! step: Float! }
type Generation2dSynapsesDelta { added: [SynapseSpec!]! removed: [String!]! patched: [Generation2dSynapsePatchEntry!]! reordered: [String!] }
type Generation2dSynapsePatchEntry { id: String! item: SynapseSpec! }
type Generation2dLayoutRow { id: String! layout: WidgetLayout! }
type Generation2dLayoutDelta { added: [Generation2dLayoutRow!]! removed: [String!]! patched: [Generation2dLayoutRow!]! }
type Generation2dGenerationsDelta { added: [FormGeneration!]! removed: [String!]! patched: [Generation2dGenerationPatchEntry!]! reordered: [String!] }
type Generation2dGenerationPatchEntry { id: String! patch: Generation2dGenerationPatch! }
type Generation2dGenerationPatch { name: String values: Generation2dValuesDelta }
type Generation2dValueRow { questionId: String! value: JSON }
type Generation2dValuesDelta { added: [Generation2dValueRow!]! removed: [String!]! patched: [Generation2dValueRow!]! }
type Generation2dSelectionChange { id: String }
type Generation2dPreviewChange { text: String }

type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}
type WidgetLayout {
  x: Float!
  y: Float!
}
type SynapseSpec {
  id: String!
  from: String!
  to: String!
  fromPort: String!
  toPort: String!
}
scalar JSON
"""🎛️ One flow widget, discriminated by `kind`."""
union Widget = NeuronWidget | InputSliderWidget | InputNoteWidget | InputImageWidget | VariableWidget | OutputPreviewWidget | OutputActionWidget | OutputExportWidget | ClusterWidget
type NeuronWidget {
  kind: String!
  id: String!
  neuronKind: String!
  params: JSON!
  inputPorts: [String!]!
  outputPorts: [String!]!
  preview: Boolean!
}
type InputSliderWidget {
  kind: String!
  id: String!
  label: String!
  value: Float!
  min: Float!
  max: Float!
  step: Float!
}
type InputNoteWidget {
  kind: String!
  id: String!
  text: String!
}
type InputImageWidget {
  kind: String!
  id: String!
  src: String!
}
type VariableWidget {
  kind: String!
  id: String!
  name: String!
  schema: String!
}
type OutputPreviewWidget {
  kind: String!
  id: String!
  preview: JSON!
  expanded: [String!]!
}
type OutputActionWidget {
  kind: String!
  id: String!
  action: String!
}
type OutputExportWidget {
  kind: String!
  id: String!
  format: String!
}
type ClusterWidget {
  kind: String!
  id: String!
  name: String!
  tree: FlowTree!
  flow: FlowUi!
}
type FlowTree {
  neurons: [FlowNeuron!]!
  synapses: [SynapseSpec!]!
}
type FlowNeuron {
  id: String!
  kind: String!
  params: JSON!
  tree: FlowTree
}
type FlowUi {
  camera: CameraJson!
  nodes: [FlowUiNodesEntry!]!
  previews: [FlowPreviewGui!]!
}
type FlowUiNodesEntry {
  key: String!
  value: FlowNodeGui!
}
type FlowNodeGui {
  layout: WidgetLayout!
  chrome: NodeChrome!
}
union NodeChrome = PlainChrome | SliderChrome | NoteChrome | ImageChrome | VariableChrome
type PlainChrome {
  kind: String!
  preview: Boolean!
}
type SliderChrome {
  kind: String!
  label: String!
  min: Float!
  max: Float!
  step: Float!
  value: Float!
}
type NoteChrome {
  kind: String!
  text: String!
}
type ImageChrome {
  kind: String!
  src: String!
}
type VariableChrome {
  kind: String!
  name: String!
  schema: String!
}
type FlowPreviewGui {
  id: String!
  source: FlowChannelRef
  mode: String!
  preview: JSON!
  expanded: [String!]!
  layout: WidgetLayout
}
type FlowChannelRef {
  neuron: String!
  channel: String!
}
type FlowHostSnapshot {
  schema: String!
  camera: CameraJson!
  widgets: [Widget!]!
  synapses: [SynapseSpec!]!
  layout: [FlowHostSnapshotLayoutEntry!]!
}
type FlowHostSnapshotLayoutEntry {
  key: String!
  value: WidgetLayout!
}
type FormGeneration {
  id: String!
  name: String!
  values: JSON!
}
type GenerationPlayState {
  generations: [FormGeneration!]!
  selectedGenerationId: String
  previewText: String
}
type Generation2dStringList {
  values: [String!]!
}
type Generation2dArtifact {
  hostSnapshot: FlowHostSnapshot!
  generation: GenerationPlayState!
}
