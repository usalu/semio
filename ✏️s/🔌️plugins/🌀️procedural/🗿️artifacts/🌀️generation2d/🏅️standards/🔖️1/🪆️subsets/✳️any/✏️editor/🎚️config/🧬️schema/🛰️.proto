syntax = "proto3";
package semio.app.generation.2d;
message Generation2dConfig {
  // @state config
  CameraJson camera = 1;
  // @state config
  string show_mode = 2;
  // @state config
  optional string selected_generation_id = 3;
  // @state config
  optional string generation_preview_text = 4;
  // @state config
  string locale = 5;
}
message CameraJson {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
