# 🧬️ Procedural2d diff schema — sparse field delta.

type Procedural2dDiff {
  artifact: Procedural2dArtifact @state(class: PERSISTENT)
  fixture: FlowFixture @state(class: PERSISTENT)
  generation: GenerationPlayState @state(class: PERSISTENT)
  selectedIds: Procedural2dStringList @state(class: SHARED_UI)
  graphCamera: CameraJson @state(class: LOCAL_UI)
  showMode: String @state(class: LOCAL_UI)
  selectedGenerationId: String @state(class: SHARED_UI)
  generationPreviewText: String @state(class: PREVIEW)
  locale: String @state(class: LOCAL_UI)
}

type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}
type WidgetLayout {
  x: Float!
  y: Float!
}
type SynapseSpec {
  id: String!
  from: String!
  to: String!
  fromPort: String!
  toPort: String!
}
scalar Widget
type FlowFixture {
  schema: String!
  camera: CameraJson!
  widgets: [Widget!]!
  synapses: [SynapseSpec!]!
  layout: [FlowFixtureLayoutEntry!]!
}
type FlowFixtureLayoutEntry {
  key: String!
  value: WidgetLayout!
}
type FormGeneration {
  id: String!
  name: String!
  valuesJson: String!
}
type GenerationPlayState {
  generations: [FormGeneration!]!
  selectedGenerationId: String
  previewText: String
}
type Procedural2dStringList {
  values: [String!]!
}
type Procedural2dArtifact {
  fixture: FlowFixture!
  generation: GenerationPlayState!
}
