# 🧬️ Procedural2d mutation schema — persistent fields only.

type Procedural2dMutation {
  fixture: FlowFixture! @state(class: PERSISTENT)
  generation: GenerationPlayState! @state(class: PERSISTENT)
}

type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}
type WidgetLayout {
  x: Float!
  y: Float!
}
type SynapseSpec {
  id: String!
  from: String!
  to: String!
  fromPort: String!
  toPort: String!
}
scalar Widget
type FlowFixture {
  schema: String!
  camera: CameraJson!
  widgets: [Widget!]!
  synapses: [SynapseSpec!]!
  layout: [FlowFixtureLayoutEntry!]!
}
type FlowFixtureLayoutEntry {
  key: String!
  value: WidgetLayout!
}
type FormGeneration {
  id: String!
  name: String!
  valuesJson: String!
}
type GenerationPlayState {
  generations: [FormGeneration!]!
  selectedGenerationId: String
  previewText: String
}
