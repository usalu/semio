[package]
workspace = "../../../.."
name = "semio-s-artifact-procedural-3d-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural generation3d test support: the serial lease lock, the publication door, the retirement driver and the document store fixture (dev-dependency only)"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]

semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-s-artifact-procedural-3d-model = { workspace = true }
semio-s-artifact-procedural-3d-mutations = { workspace = true }
semio-framework-value = { path = "../../../../../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-value = { path = "../../../../../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true, features = ["testkit"] }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }

