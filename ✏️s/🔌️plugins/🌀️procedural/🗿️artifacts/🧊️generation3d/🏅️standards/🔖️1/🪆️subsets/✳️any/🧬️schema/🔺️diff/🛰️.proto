syntax = "proto3";
package semio.s.procedural.generation3d.diff;

import "google/protobuf/struct.proto";

// 🧬️ Generation3d diff schema — sparse field delta.

message Generation3dDiff {
  // @state artifact
  optional string schema = 1;
  // @state artifact
  optional CameraJson camera = 2;
  // @state artifact
  optional Generation3dWidgetsDelta widgets = 3;
  // @state artifact
  optional Generation3dSynapsesDelta synapses = 4;
  // @state artifact
  optional Generation3dLayoutDelta layout = 5;
  // @state artifact
  optional Generation3dGenerationsDelta generations = 6;
  // @state artifact
  optional Generation3dSelectionChange selected_generation = 7;
  // @state artifact
  optional Generation3dPreviewChange preview_text = 8;
}

message Generation3dWidgetsDelta {
  repeated Widget added = 1;
  repeated string removed = 2;
  repeated Generation3dWidgetPatchEntry patched = 3;
  repeated string reordered = 4;
}
message Generation3dWidgetPatchEntry {
  string id = 1;
  Generation3dWidgetPatch patch = 2;
}
message Generation3dWidgetPatch {
  oneof patch {
    Widget replace = 1;
    Generation3dWidgetSlider slider = 2;
  }
}
message Generation3dWidgetSlider {
  double value = 1;
  double min = 2;
  double max = 3;
  double step = 4;
}
message Generation3dSynapsesDelta {
  repeated SynapseSpec added = 1;
  repeated string removed = 2;
  repeated Generation3dSynapsePatchEntry patched = 3;
  repeated string reordered = 4;
}
message Generation3dSynapsePatchEntry {
  string id = 1;
  SynapseSpec item = 2;
}
message Generation3dLayoutRow {
  string id = 1;
  WidgetLayout layout = 2;
}
message Generation3dLayoutDelta {
  repeated Generation3dLayoutRow added = 1;
  repeated string removed = 2;
  repeated Generation3dLayoutRow patched = 3;
}
message Generation3dGenerationsDelta {
  repeated FormGeneration added = 1;
  repeated string removed = 2;
  repeated Generation3dGenerationPatchEntry patched = 3;
  repeated string reordered = 4;
}
message Generation3dGenerationPatchEntry {
  string id = 1;
  Generation3dGenerationPatch patch = 2;
}
message Generation3dGenerationPatch {
  optional string name = 1;
  optional Generation3dValuesDelta values = 2;
}
message Generation3dValueRow {
  string question_id = 1;
  google.protobuf.Value value = 2;
}
message Generation3dValuesDelta {
  repeated Generation3dValueRow added = 1;
  repeated string removed = 2;
  repeated Generation3dValueRow patched = 3;
}
message Generation3dSelectionChange {
  optional string id = 1;
}
message Generation3dPreviewChange {
  optional string text = 1;
}

message CameraJson {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
message WidgetLayout {
  double x = 1;
  double y = 2;
}
message SynapseSpec {
  string id = 1;
  string from = 2;
  string to = 3;
  string from_port = 4;
  string to_port = 5;
}
message Widget {
  oneof kind {
    NeuronWidget neuron = 1;
    InputSliderWidget input_slider = 2;
    InputNoteWidget input_note = 3;
    InputImageWidget input_image = 4;
    VariableWidget variable = 5;
    OutputPreviewWidget output_preview = 6;
    OutputActionWidget output_action = 7;
    OutputExportWidget output_export = 8;
    ClusterWidget cluster = 9;
  }
}
message NeuronWidget {
  string id = 1;
  string neuron_kind = 2;
  google.protobuf.Struct params = 3;
  repeated string input_ports = 4;
  repeated string output_ports = 5;
  bool preview = 6;
}
message InputSliderWidget {
  string id = 1;
  string label = 2;
  double value = 3;
  double min = 4;
  double max = 5;
  double step = 6;
}
message InputNoteWidget {
  string id = 1;
  string text = 2;
}
message InputImageWidget {
  string id = 1;
  string src = 2;
}
message VariableWidget {
  string id = 1;
  string name = 2;
  string schema = 3;
}
message OutputPreviewWidget {
  string id = 1;
  google.protobuf.Struct preview = 2;
  repeated string expanded = 3;
}
message OutputActionWidget {
  string id = 1;
  string action = 2;
}
message OutputExportWidget {
  string id = 1;
  string format = 2;
}
message ClusterWidget {
  string id = 1;
  string name = 2;
  FlowTree tree = 3;
  FlowUi flow = 4;
}
message FlowTree {
  repeated FlowNeuron neurons = 1;
  repeated SynapseSpec synapses = 2;
}
message FlowNeuron {
  string id = 1;
  string kind = 2;
  google.protobuf.Struct params = 3;
  optional FlowTree tree = 4;
}
message FlowUi {
  CameraJson camera = 1;
  map<string, FlowNodeGui> nodes = 2;
  repeated FlowPreviewGui previews = 3;
}
message FlowNodeGui {
  WidgetLayout layout = 1;
  NodeChrome chrome = 2;
}
message NodeChrome {
  oneof kind {
    PlainChrome plain = 1;
    SliderChrome slider = 2;
    NoteChrome note = 3;
    ImageChrome image = 4;
    VariableChrome variable = 5;
  }
}
message PlainChrome {
  bool preview = 1;
}
message SliderChrome {
  string label = 1;
  double min = 2;
  double max = 3;
  double step = 4;
  double value = 5;
}
message NoteChrome {
  string text = 1;
}
message ImageChrome {
  string src = 1;
}
message VariableChrome {
  string name = 1;
  string schema = 2;
}
message FlowPreviewGui {
  string id = 1;
  optional FlowChannelRef source = 2;
  string mode = 3;
  google.protobuf.Struct preview = 4;
  repeated string expanded = 5;
  optional WidgetLayout layout = 6;
}
message FlowChannelRef {
  string neuron = 1;
  string channel = 2;
}
message FlowHostSnapshot {
  string schema = 1;
  CameraJson camera = 2;
  repeated Widget widgets = 3;
  repeated SynapseSpec synapses = 4;
  map<string, WidgetLayout> layout = 5;
}
message FormGeneration {
  string id = 1;
  string name = 2;
  google.protobuf.Struct values = 3;
}
message GenerationPlayState {
  repeated FormGeneration generations = 1;
  optional string selected_generation_id = 2;
  optional string preview_text = 3;
}
message Generation3dPreviewCamera {
  double position_x = 1;
  double position_y = 2;
  double position_z = 3;
  double target_x = 4;
  double target_y = 5;
  double target_z = 6;
  double fov = 7;
}
message Generation3dStringList {
  repeated string values = 1;
}
message Generation3dArtifact {
  FlowHostSnapshot host_snapshot = 1;
  GenerationPlayState generation = 2;
}
