# 🧬️ Generation3d diff schema — sparse field delta.

type Generation3dDiff {
  schema: String @state(class: ARTIFACT)
  camera: CameraJson @state(class: ARTIFACT)
  widgets: Generation3dWidgetsDelta @state(class: ARTIFACT)
  synapses: Generation3dSynapsesDelta @state(class: ARTIFACT)
  layout: Generation3dLayoutDelta @state(class: ARTIFACT)
  generations: Generation3dGenerationsDelta @state(class: ARTIFACT)
  selectedGeneration: Generation3dSelectionChange @state(class: ARTIFACT)
  previewText: Generation3dPreviewChange @state(class: ARTIFACT)
}

type Generation3dWidgetsDelta { removed: [Generation3dWidgetRemoval!]! inserted: [Generation3dWidgetInsertion!]! moved: [Generation3dWidgetRelocation!]! patched: [Generation3dWidgetModification!]! }
type Generation3dWidgetRemoval { id: String! index: Int! }
type Generation3dWidgetInsertion { index: Int! row: Widget! }
type Generation3dWidgetRelocation { id: String! from: Int! to: Int! }
type Generation3dWidgetModification { id: String! patch: Generation3dWidgetPatch! }
union Generation3dWidgetPatch = Generation3dWidgetReplace | Generation3dWidgetSlider
type Generation3dWidgetReplace { kind: String! widget: Widget! }
type Generation3dWidgetSlider { kind: String! value: Float! min: Float! max: Float! step: Float! }
type Generation3dSynapsesDelta { removed: [Generation3dSynapseRemoval!]! inserted: [Generation3dSynapseInsertion!]! moved: [Generation3dSynapseRelocation!]! patched: [Generation3dSynapseModification!]! }
type Generation3dSynapseRemoval { id: String! index: Int! }
type Generation3dSynapseInsertion { index: Int! row: SynapseSpec! }
type Generation3dSynapseRelocation { id: String! from: Int! to: Int! }
type Generation3dSynapseModification { id: String! patch: SynapseSpec! }
type Generation3dLayoutRow { id: String! layout: WidgetLayout! }
type Generation3dLayoutDelta { added: [Generation3dLayoutRow!]! removed: [String!]! patched: [Generation3dLayoutRow!]! }
type Generation3dGenerationsDelta { removed: [Generation3dGenerationRemoval!]! inserted: [Generation3dGenerationInsertion!]! moved: [Generation3dGenerationRelocation!]! modified: [Generation3dGenerationModification!]! }
type Generation3dGenerationRemoval { id: String! index: Int! }
type Generation3dGenerationInsertion { index: Int! row: FormGeneration! }
type Generation3dGenerationRelocation { id: String! from: Int! to: Int! }
type Generation3dGenerationModification { id: String! patch: Generation3dGenerationPatch! }
type Generation3dGenerationPatch { name: String values: Generation3dValuesDelta }
type Generation3dValueRow { questionId: String! value: JSON }
type Generation3dValuesDelta { added: [Generation3dValueRow!]! removed: [String!]! patched: [Generation3dValueRow!]! }
type Generation3dSelectionChange { id: String }
type Generation3dPreviewChange { text: String }

type CameraJson {
  x: Float!
  y: Float!
  zoom: Float!
}
type WidgetLayout {
  x: Float!
  y: Float!
}
type SynapseSpec {
  id: String!
  from: String!
  to: String!
  fromPort: String!
  toPort: String!
}
scalar JSON
"""🎛️ One flow widget, discriminated by `kind`."""
union Widget = NeuronWidget | InputSliderWidget | InputNoteWidget | InputImageWidget | VariableWidget | OutputPreviewWidget | OutputActionWidget | OutputExportWidget | ClusterWidget
type NeuronWidget {
  kind: String!
  id: String!
  neuronKind: String!
  params: JSON!
  inputPorts: [String!]!
  outputPorts: [String!]!
  preview: Boolean!
}
type InputSliderWidget {
  kind: String!
  id: String!
  label: String!
  value: Float!
  min: Float!
  max: Float!
  step: Float!
}
type InputNoteWidget {
  kind: String!
  id: String!
  text: String!
}
type InputImageWidget {
  kind: String!
  id: String!
  src: String!
}
type VariableWidget {
  kind: String!
  id: String!
  name: String!
  schema: String!
}
type OutputPreviewWidget {
  kind: String!
  id: String!
  preview: JSON!
  expanded: [String!]!
}
type OutputActionWidget {
  kind: String!
  id: String!
  action: String!
}
type OutputExportWidget {
  kind: String!
  id: String!
  format: String!
}
type ClusterWidget {
  kind: String!
  id: String!
  name: String!
  tree: FlowTree!
  flow: FlowUi!
}
type FlowTree {
  neurons: [FlowNeuron!]!
  synapses: [SynapseSpec!]!
}
type FlowNeuron {
  id: String!
  kind: String!
  params: JSON!
  tree: FlowTree
}
type FlowUi {
  camera: CameraJson!
  nodes: [FlowUiNodesEntry!]!
  previews: [FlowPreviewGui!]!
}
type FlowUiNodesEntry {
  key: String!
  value: FlowNodeGui!
}
type FlowNodeGui {
  layout: WidgetLayout!
  chrome: NodeChrome!
}
union NodeChrome = PlainChrome | SliderChrome | NoteChrome | ImageChrome | VariableChrome
type PlainChrome {
  kind: String!
  preview: Boolean!
}
type SliderChrome {
  kind: String!
  label: String!
  min: Float!
  max: Float!
  step: Float!
  value: Float!
}
type NoteChrome {
  kind: String!
  text: String!
}
type ImageChrome {
  kind: String!
  src: String!
}
type VariableChrome {
  kind: String!
  name: String!
  schema: String!
}
type FlowPreviewGui {
  id: String!
  source: FlowChannelRef
  mode: String!
  preview: JSON!
  expanded: [String!]!
  layout: WidgetLayout
}
type FlowChannelRef {
  neuron: String!
  channel: String!
}
type FlowHostSnapshot {
  schema: String!
  camera: CameraJson!
  widgets: [Widget!]!
  synapses: [SynapseSpec!]!
  layout: [FlowHostSnapshotLayoutEntry!]!
}
type FlowHostSnapshotLayoutEntry {
  key: String!
  value: WidgetLayout!
}
type FormGeneration {
  id: String!
  name: String!
  values: JSON!
}
type GenerationPlayState {
  generations: [FormGeneration!]!
  selectedGenerationId: String
  previewText: String
}
type Generation3dPreviewCamera {
  positionX: Float!
  positionY: Float!
  positionZ: Float!
  targetX: Float!
  targetY: Float!
  targetZ: Float!
  fov: Float!
}
type Generation3dStringList {
  values: [String!]!
}
type Generation3dArtifact {
  hostSnapshot: FlowHostSnapshot!
  generation: GenerationPlayState!
}
