syntax = "proto3";
package semio.s.procedural.procedural3d.diff;

// 🧬️ Procedural3d diff schema — sparse field delta.

message Procedural3dDiff {
  // @state persistent
  optional Procedural3dArtifact artifact = 1;
  // @state persistent
  optional FlowFixture fixture = 2;
  // @state persistent
  optional GenerationPlayState generation = 3;
  // @state shared-ui
  optional Procedural3dStringList selected_node_ids = 4;
  // @state local-ui
  optional string lod_mode = 5;
  // @state local-ui
  optional string show_mode = 6;
  // @state local-ui
  optional string selection_method = 7;
  // @state preview
  optional string hovered_node_id = 8;
  // @state local-ui
  optional CameraJson graph_camera = 9;
  // @state local-ui
  optional Procedural3dPreviewCamera preview_camera = 10;
  // @state local-ui
  optional string sun_json = 11;
  // @state shared-ui
  optional string selected_generation_id = 12;
  // @state preview
  optional string generation_preview_text = 13;
  // @state shared-ui
  optional string active_utility_id = 14;
  // @state local-ui
  optional string locale = 15;
  // @state local-ui
  optional string contributions_json = 16;
}

message CameraJson {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
message WidgetLayout {
  double x = 1;
  double y = 2;
}
message SynapseSpec {
  string id = 1;
  string from = 2;
  string to = 3;
  string from_port = 4;
  string to_port = 5;
}
message Widget {
  string json = 1;
}
message FlowFixture {
  string schema = 1;
  CameraJson camera = 2;
  repeated Widget widgets = 3;
  repeated SynapseSpec synapses = 4;
  map<string, WidgetLayout> layout = 5;
}
message FormGeneration {
  string id = 1;
  string name = 2;
  string values_json = 3;
}
message GenerationPlayState {
  repeated FormGeneration generations = 1;
  optional string selected_generation_id = 2;
  optional string preview_text = 3;
}
message Procedural3dPreviewCamera {
  double position_x = 1;
  double position_y = 2;
  double position_z = 3;
  double target_x = 4;
  double target_y = 5;
  double target_z = 6;
  double fov = 7;
}
message Procedural3dStringList {
  repeated string values = 1;
}
message Procedural3dArtifact {
  FlowFixture fixture = 1;
  GenerationPlayState generation = 2;
}
