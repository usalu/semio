syntax = "proto3";
package semio.s.procedural.procedural3d.artifact;

// 🧬️ Procedural3d artifact schema — every field with its state class.

message Procedural3dArtifact {
  // @state artifact
  FlowFixture fixture = 1;
  // @state artifact
  GenerationPlayState generation = 2;
  // @state presence
  repeated string selected_node_ids = 3;
  // @state config
  string lod_mode = 4;
  // @state config
  string show_mode = 5;
  // @state config
  string selection_method = 6;
  // @state artifact
  optional string hovered_node_id = 7;
  // @state config
  CameraJson graph_camera = 8;
  // @state config
  Procedural3dPreviewCamera preview_camera = 9;
  // @state config
  string sun_json = 10;
  // @state presence
  optional string selected_generation_id = 11;
  // @state artifact
  optional string generation_preview_text = 12;
  // @state presence
  string active_utility_id = 13;
  // @state config
  string locale = 14;
}

message CameraJson {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
message WidgetLayout {
  double x = 1;
  double y = 2;
}
message SynapseSpec {
  string id = 1;
  string from = 2;
  string to = 3;
  string from_port = 4;
  string to_port = 5;
}
message Widget {
  string json = 1;
}
message FlowFixture {
  string schema = 1;
  CameraJson camera = 2;
  repeated Widget widgets = 3;
  repeated SynapseSpec synapses = 4;
  map<string, WidgetLayout> layout = 5;
}
message FormGeneration {
  string id = 1;
  string name = 2;
  string values_json = 3;
}
message GenerationPlayState {
  repeated FormGeneration generations = 1;
  optional string selected_generation_id = 2;
  optional string preview_text = 3;
}
message Procedural3dPreviewCamera {
  double position_x = 1;
  double position_y = 2;
  double position_z = 3;
  double target_x = 4;
  double target_y = 5;
  double target_z = 6;
  double fov = 7;
}
