syntax = "proto3";
package semio.s.procedural.procedural3d.inference;

// 💡️ Procedural3d inference schema — topology (DAG shape of `fixture`'s widget/synapse graph).

message Procedural3dInference {
  // @state inferred
  Procedural3dTopology topology = 1;
}

message Procedural3dTopology {
  uint32 node_count = 1;
  uint32 edge_count = 2;
  repeated string topo_order = 3;
  uint32 depth = 4;
  bool cycle_free = 5;
}
