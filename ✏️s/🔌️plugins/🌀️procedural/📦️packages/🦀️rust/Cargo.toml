[package]
name = "semio-s-plugin-procedural"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural plugin - one crate for the generation2d/generation3d artifacts (diff/op/dsl/pack/spr/engine) and the 2d/3d play apps (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:procedural"

[package.metadata.semio]
role = "plugin"
consumes = ["forms.questionKind", "flow.extension"]

[[package.metadata.semio.playground]]
variant = "generation2d"
app = "s.procedural.generation2d@1/*#editor"
aliases = ["procedural 2d"]
ports = { react = 6021, wgpu = 6121 }

[[package.metadata.semio.playground]]
variant = "generation3d"
app = "s.procedural.generation3d@1/*#editor"
aliases = ["procedural 3d"]
ports = { react = 6018, wgpu = 6118 }

# 🎪️ The `generator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT).

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it (the 🎪️demonstrator bundles all six panes into one
# component): seven crates each exporting the same `#[no_mangle]` symbol is a duplicate-symbol
# link error, and the embedding crate is the one that must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
# 🚦️ O1 de-dyn: `#[dyn_enum]`/`dyn_enum_close!` generate `Constraints` (⛓️constraint), replacing
# the crate's 12 `Box<dyn Constraint>`/`&dyn SoftConstraint` seams — MICROKERNEL-POOLED-ACTOR-PLUGIN-RUNTIME.
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
semio-framework-geometry = { path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
flow = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌊️flow/📦️packages/🦀️rust", default-features = false, package = "semio-framework-os-flow" }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
ui_wgpu = {path = "../../../../../🧰️framework/🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"]}
ui_styling = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎨️styling/📦️packages/🦀️rust", package = "semio-framework-ui-styling" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-job = { workspace = true }
semio-framework-ui-contract = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
# 🎬️ `EngineComputeTests` (below, in the generation3d editor's root component.rs) exercises frustum-cull/AABB scene
# math that now lives at `ui_wgpu`'s `kernel_3d_scene` mount (ticket
# 26/08/12/DISSOLVE-KERNELS-AND-MODULES-INTO-EVENT-SOURCED-ARTIFACTS wave MESH — `semio-framework-3d`
# no longer has a `scene` module to depend on). Same crate-rename as the normal `["wgpu"]` dependency
# above (Cargo rejects depending on one crate under two different names) with the extra
# `wgpu-engine` features cargo's resolver unifies in for dev/test builds only.
ui_wgpu = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu-engine"] }
