[package]
name = "semio-s-plugin-note"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Note plugin - one crate for the note artifact (diff/op/dsl/pack/spr/engine) and the note play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:note"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "note"
ports = { react = 6080, wgpu = 6180 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
semio-framework-os = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# ⚠️ TEMPORARY VERIFICATION-ONLY OVERLAY — DELETE BEFORE HANDOFF (see TEMPLATE.md §3's
# chicken-and-egg note). This crate is not yet a root-workspace member, so it needs to be its own
# temporary workspace root to run `cargo check`/`clippy`/`test` in isolation. The registrar deletes
# this block, the crate's `Cargo.lock`, and its `target/` dir when it adds the real member line.
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust" }

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[profile.wasm-release.package.semio-framework-os-kernel-store]
codegen-units = 1

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
