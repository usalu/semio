[package]
name = "semio-s-plugin-note"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Note plugin - one crate for the note artifact (diff/op/dsl/pack/spr/engine) and the note play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:note"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "note"
ports = { react = 6080, wgpu = 6180 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-os = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
