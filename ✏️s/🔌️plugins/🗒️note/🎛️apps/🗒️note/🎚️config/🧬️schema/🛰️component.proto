syntax = "proto3";
package semio.app.note.note;
message NoteConfig {
  // @state config
  repeated string selected_block_ids = 1;
  // @state config
  optional string hovered_block_id = 2;
  // @state config
  string engagement_input = 3;
  // @state config
  NoteCamera camera = 4;
  // @state config
  string active_utility_id = 5;
  // @state config
  string locale = 6;
}

message NoteCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
