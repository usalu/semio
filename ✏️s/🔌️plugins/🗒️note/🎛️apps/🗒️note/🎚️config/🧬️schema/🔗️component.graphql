type NoteConfig {
  selectedBlockIds: [String!]! @state(class: LOCAL_UI)
  hoveredBlockId: String @state(class: LOCAL_UI)
  engagementInput: String! @state(class: LOCAL_UI)
  camera: NoteCamera! @state(class: LOCAL_UI)
  activeUtilityId: String! @state(class: LOCAL_UI)
  locale: String! @state(class: LOCAL_UI)
}

type NoteCamera {
  x: Float!
  y: Float!
  zoom: Float!
}
