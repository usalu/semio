[package]
name = "semio-s-app-note-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Note app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[lib]
path = "../../../../../../../../../✏️s/🔌️plugins/🗒️note/🎛️apps/🗒️note/🔨️modules/📡️protocol/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
note = { path = "../../../../../../../../../✏️s/🔌️plugins/🗒️note/🎛️apps/🗒️note/⚡️implementations/🦀️rust", package = "semio-s-app-note" }
note_op = { path = "../../../../../../../../../✏️s/🔌️plugins/🗒️note/🎛️apps/🗒️note/🔨️modules/🔧️op/⚡️implementations/🦀️rust", package = "semio-s-app-note-op" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
dsl = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
note_engine = { path = "../../../../../../../../../✏️s/🔌️plugins/🗒️note/🎛️apps/🗒️note/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-note-engine" }

# 🧪️ TEMPORARY isolation overlay (TEMPLATE.md §3's chicken-and-egg trick) — makes this crate its own
# workspace root so it can be baseline-tested standalone while the real root workspace is red from a
# concurrent batch-2 session's in-flight migration (per master.md). Deleted with the rest of this crate
# in §8 of the migration recipe; never touched by the registrar.
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3
