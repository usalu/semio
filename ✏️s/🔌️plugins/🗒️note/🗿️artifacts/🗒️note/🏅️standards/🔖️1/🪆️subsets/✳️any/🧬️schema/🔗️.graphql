# 🧬️ Note artifact schema.

type NoteArtifact {
  schema: String!
  id: String!
  title: String
  blocks: [NoteBlockNode!]!
  gridVisible: Boolean
  gridSpacing: Float
  gridSubdivisions: Float
  gridOpacity: Float
  snapEnabled: Boolean
  snapGridSpacing: Float
  pencilWidth: Float
  eraserRadius: Float
  assets: [NoteImageAssetEntry!]!
  selectedBlockIds: [String!]!
  activeUtilityId: String!
  engagementInput: String!
  cameraX: Float!
  cameraY: Float!
  cameraZoom: Float!
  locale: String!
  hoveredBlockId: String
}

type NoteBlockNode {
  kind: String!
}

type NoteImageAssetEntry {
  key: String!
  value: NoteImageAsset!
}

type NoteImageAsset {
  mime: String!
  data: String!
  width: Float
  height: Float
}
