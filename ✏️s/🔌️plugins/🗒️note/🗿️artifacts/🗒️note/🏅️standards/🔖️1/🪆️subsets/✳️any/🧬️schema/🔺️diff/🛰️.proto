syntax = "proto3";
package semio.s.note.note;
import "✏️s/🔌️plugins/🗒️note/🗿️artifacts/🗒️note/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🔗️link/🧬️schema/🛰️.proto";
message NoteDiff {
  optional string schema = 1;
  optional string id = 2;
  optional NoteStringNullable title = 3;
  optional NoteBlocksDelta blocks = 4;
  optional NoteBoolNullable grid_visible = 5;
  optional NoteDoubleNullable grid_spacing = 6;
  optional NoteDoubleNullable grid_subdivisions = 7;
  optional NoteDoubleNullable grid_opacity = 8;
  optional NoteBoolNullable snap_enabled = 9;
  optional NoteDoubleNullable snap_grid_spacing = 10;
  optional NoteDoubleNullable pencil_width = 11;
  optional NoteDoubleNullable eraser_radius = 12;
  optional NoteAssetsDelta assets = 13;
  optional NoteLinkNullable linked_artifact = 14;
}
message NoteStringNullable { optional string value = 1; }
message NoteBoolNullable { optional bool value = 1; }
message NoteDoubleNullable { optional double value = 1; }
message NoteLinkNullable { optional semio.os.store.ArtifactLink value = 1; }
enum NoteBlockRowKind { NOTE_BLOCK_ROW_KIND_ADD = 0; NOTE_BLOCK_ROW_KIND_REMOVE = 1; NOTE_BLOCK_ROW_KIND_MOVE = 2; NOTE_BLOCK_ROW_KIND_PATCH = 3; }
message NoteBlockRow { NoteBlockRowKind row = 1; optional string id = 2; optional string parent_id = 3; optional uint64 index = 4; optional NoteBlockNode block = 5; optional NoteBlockPatch patch = 6; optional string from_parent_id = 7; optional uint64 from_index = 8; }
message NoteBlocksDelta { repeated NoteBlockRow rows = 1; }
enum NoteTableEditKind { NOTE_TABLE_EDIT_KIND_INSERT_ROW = 0; NOTE_TABLE_EDIT_KIND_REMOVE_ROW = 1; NOTE_TABLE_EDIT_KIND_INSERT_COLUMN = 2; NOTE_TABLE_EDIT_KIND_REMOVE_COLUMN = 3; }
message NoteTableEdit { NoteTableEditKind edit = 1; uint64 index = 2; optional string name = 3; repeated NoteTableCell cells = 4; }
message NotePoint { double x = 1; double y = 2; }
message NoteBlockPatch {
  optional string name = 1;
  optional double x = 2;
  optional double y = 3;
  optional double width = 4;
  optional double height = 5;
  optional double rotation = 6;
  optional bool visible = 7;
  optional bool locked = 8;
  optional NoteTextChild content = 9;
  optional double font_size = 10;
  optional string font_weight = 11;
  optional string align = 12;
  optional string image_key = 13;
  repeated NoteTableEdit table = 14;
  optional string tex = 15;
  optional bool display_mode = 16;
  repeated NotePoint points = 17;
  optional double stroke_width = 18;
  repeated double color = 19;
}
enum NoteAssetRowKind { NOTE_ASSET_ROW_KIND_INSERT = 0; NOTE_ASSET_ROW_KIND_REPLACE = 1; NOTE_ASSET_ROW_KIND_REMOVE = 2; }
message NoteAssetRow { NoteAssetRowKind row = 1; string key = 2; optional NoteImageAsset asset = 3; }
message NoteAssetsDelta { repeated NoteAssetRow rows = 1; }
