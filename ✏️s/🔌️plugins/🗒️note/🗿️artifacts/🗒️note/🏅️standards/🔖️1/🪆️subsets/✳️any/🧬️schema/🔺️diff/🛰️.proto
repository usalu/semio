syntax = "proto3";
package semio.s.note.note;
import "✏️s/🔌️plugins/🗒️note/🗿️artifacts/🗒️note/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🔗️link/🧬️schema/🛰️.proto";
message NoteDiff {
  optional NoteArtifact artifact = 1;
  optional string schema = 2;
  optional string id = 3;
  optional NoteStringNullable title = 4;
  optional NoteBlocksDelta blocks = 5;
  optional NoteBoolNullable grid_visible = 6;
  optional NoteDoubleNullable grid_spacing = 7;
  optional NoteDoubleNullable grid_subdivisions = 8;
  optional NoteDoubleNullable grid_opacity = 9;
  optional NoteBoolNullable snap_enabled = 10;
  optional NoteDoubleNullable snap_grid_spacing = 11;
  optional NoteDoubleNullable pencil_width = 12;
  optional NoteDoubleNullable eraser_radius = 13;
  optional NoteAssetsDelta assets = 14;
  optional NoteLinkNullable linked_artifact = 15;
}
message NoteStringNullable { optional string value = 1; }
message NoteBoolNullable { optional bool value = 1; }
message NoteDoubleNullable { optional double value = 1; }
message NoteLinkNullable { optional semio.os.store.ArtifactLink value = 1; }
message NoteImageAssetNullable { optional NoteImageAsset value = 1; }
message NoteAddedBlockEntry { optional string parent_id = 1; optional uint64 index = 2; NoteBlockNode block = 3; }
message NoteBlocksDelta { repeated NoteAddedBlockEntry added = 1; repeated string removed = 2; repeated NoteBlockPatchEntry patched = 3; NoteStringList reordered = 4; }
message NoteBlockPatchEntry { string id = 1; NoteBlockPatch patch = 2; }
message NoteBlockPatch { optional string block_json = 1; }
message NoteAssetsDelta { map<string, NoteImageAssetNullable> entries = 1; }
message NoteStringList { repeated string values = 1; }
