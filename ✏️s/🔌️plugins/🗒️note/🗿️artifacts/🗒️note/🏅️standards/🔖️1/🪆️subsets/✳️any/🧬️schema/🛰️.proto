syntax = "proto3";
package semio.s.note.note;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🔗️link/🧬️schema/🛰️.proto";
message NoteArtifact {
  string schema = 1;
  string id = 2;
  optional string title = 3;
  repeated NoteBlockNode blocks = 4;
  optional bool grid_visible = 5;
  optional double grid_spacing = 6;
  optional double grid_subdivisions = 7;
  optional double grid_opacity = 8;
  optional bool snap_enabled = 9;
  optional double snap_grid_spacing = 10;
  optional double pencil_width = 11;
  optional double eraser_radius = 12;
  map<string, NoteImageAsset> assets = 13;
  optional semio.os.store.ArtifactLink linked_artifact = 14;
}
message NoteBlockNode { oneof kind { NoteTextBlock text = 1; NoteImageBlock image = 2; NoteTableBlock table = 3; NoteMathBlock math = 4; NoteStrokeBlock stroke = 5; NoteGroupBlock group = 6; } }
message NoteTextBlock { string id = 1; string name = 2; double x = 3; double y = 4; double width = 5; double height = 6; optional double rotation = 7; optional bool visible = 8; optional bool locked = 9; NoteTextChild content = 10; double font_size = 11; string font_weight = 12; string align = 13; }
message NoteImageBlock { string id = 1; string name = 2; double x = 3; double y = 4; double width = 5; double height = 6; optional double rotation = 7; optional bool visible = 8; optional bool locked = 9; string image_key = 10; }
message NoteTableBlock { string id = 1; string name = 2; double x = 3; double y = 4; double width = 5; double height = 6; optional double rotation = 7; optional bool visible = 8; optional bool locked = 9; repeated string columns = 10; repeated NoteTableRow rows = 11; }
message NoteMathBlock { string id = 1; string name = 2; double x = 3; double y = 4; double width = 5; double height = 6; optional double rotation = 7; optional bool visible = 8; optional bool locked = 9; string tex = 10; bool display_mode = 11; }
message NoteStrokeBlock { string id = 1; string name = 2; double x = 3; double y = 4; double width = 5; double height = 6; optional double rotation = 7; optional bool visible = 8; optional bool locked = 9; repeated NotePoint points = 10; double stroke_width = 11; NoteColor color = 12; }
message NoteGroupBlock { string id = 1; string name = 2; double x = 3; double y = 4; double width = 5; double height = 6; optional double rotation = 7; optional bool visible = 8; optional bool locked = 9; repeated NoteBlockNode children = 10; }
message NotePoint { double x = 1; double y = 2; }
message NoteColor { double red = 1; double green = 2; double blue = 3; double alpha = 4; }
message NoteTextChild { semio.os.store.ArtifactChild handle = 1; repeated NoteTextParagraph paragraphs = 2; }
message NoteTextParagraph { repeated NoteTextRun runs = 1; }
message NoteTextRun { string text = 1; optional bool bold = 2; optional bool italic = 3; optional bool underline = 4; optional string link = 5; }
message NoteTableCell { string content = 1; }
message NoteTableRow { repeated NoteTableCell cells = 1; }
message NoteImageAsset { string mime = 1; string data = 2; optional double width = 3; optional double height = 4; }
