# 🧬️ Note diff schema.

type NoteDiff {
  artifact: NoteArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  blocks: NoteBlocksDelta @state(class: ARTIFACT)
  gridVisible: Boolean @state(class: ARTIFACT)
  gridSpacing: Float @state(class: ARTIFACT)
  gridSubdivisions: Float @state(class: ARTIFACT)
  gridOpacity: Float @state(class: ARTIFACT)
  snapEnabled: Boolean @state(class: ARTIFACT)
  snapGridSpacing: Float @state(class: ARTIFACT)
  pencilWidth: Float @state(class: ARTIFACT)
  eraserRadius: Float @state(class: ARTIFACT)
  assets: NoteAssetsDelta @state(class: ARTIFACT)
  selectedBlockIds: NoteStringList @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  engagementInput: String @state(class: CONFIG)
  cameraX: Float @state(class: CONFIG)
  cameraY: Float @state(class: CONFIG)
  cameraZoom: Float @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  hoveredBlockId: String @state(class: ARTIFACT)
}

type NoteArtifact {
  schema: String!
  id: String!
  title: String
  blocks: [NoteBlockNode!]!
  gridVisible: Boolean
  gridSpacing: Float
  gridSubdivisions: Float
  gridOpacity: Float
  snapEnabled: Boolean
  snapGridSpacing: Float
  pencilWidth: Float
  eraserRadius: Float
  assets: [NoteImageAssetEntry!]!
  selectedBlockIds: [String!]!
  activeUtilityId: String!
  engagementInput: String!
  cameraX: Float!
  cameraY: Float!
  cameraZoom: Float!
  locale: String!
  hoveredBlockId: String
}

type NoteAssetsDelta {
  entries: [NoteImageAssetDiffEntry!]!
}

type NoteStringList {
  values: [String!]!
}

type NoteBlocksDelta {
  added: [NoteBlockNode!]!
  removed: [String!]!
  patched: [NoteBlockPatchEntry!]!
  reordered: [String!]
}

type NoteBlockPatchEntry {
  id: String!
  patch: NoteBlockPatch!
}

type NoteBlockPatch {
  blockJson: String
}

type NoteBlockNode {
  kind: String!
}

type NoteImageAssetEntry {
  key: String!
  value: NoteImageAsset!
}

type NoteImageAssetDiffEntry {
  key: String!
  value: NoteImageAsset
}

type NoteImageAsset {
  mime: String!
  data: String!
  width: Float
  height: Float
}
