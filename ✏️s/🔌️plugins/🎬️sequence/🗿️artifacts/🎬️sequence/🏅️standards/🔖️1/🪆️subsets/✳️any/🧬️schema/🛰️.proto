syntax = "proto3";
package semio.s.sequence.sequence.artifact;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
message SequenceArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  semio.os.store.ArtifactChild content = 2;
}
message SequenceStep { string id = 1; string kind = 2; string params_json = 3; double x = 4; double y = 5; optional SlotRef slot = 6; bool collapsed = 7; }
message SequenceEdge { string id = 1; string from = 2; string to = 3; }
message SlotRef { string owner = 1; string name = 2; }
message SequenceCamera { double x = 1; double y = 2; double zoom = 3; }
