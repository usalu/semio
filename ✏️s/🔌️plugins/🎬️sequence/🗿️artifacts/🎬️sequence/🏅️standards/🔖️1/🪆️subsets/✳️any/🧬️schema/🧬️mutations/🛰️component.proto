syntax = "proto3";
package semio.s.sequence.sequence.mutation;

import "🌱create-step/🛰️component.proto";
import "🗑️delete-step/🛰️component.proto";
import "📍move-step/🛰️component.proto";
import "🔧edit-step-params/🛰️component.proto";
import "🗂️change-step-collapsed/🛰️component.proto";
import "🔗connect-steps/🛰️component.proto";
import "✂️disconnect-steps/🛰️component.proto";
import "🧬duplicate-step/🛰️component.proto";

message SequenceMutation {
  oneof mutation {
    CreateStep create_step = 1;
    DeleteStep delete_step = 2;
    MoveStep move_step = 3;
    EditStepParams edit_step_params = 4;
    ChangeStepCollapsed change_step_collapsed = 5;
    ConnectSteps connect_steps = 6;
    DisconnectSteps disconnect_steps = 7;
    DuplicateStep duplicate_step = 8;
  }
}
