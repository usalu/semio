syntax = "proto3";
package semio.s.sequence.sequence.mutation;

message CreateStep {
  SequenceStep step = 1;
}

message SequenceStep {
  string id = 1;
  string kind = 2;
  string params_json = 3;
  double x = 4;
  double y = 5;
  optional SlotRef slot = 6;
  bool collapsed = 7;
}

message SlotRef {
  string owner = 1;
  string name = 2;
}
