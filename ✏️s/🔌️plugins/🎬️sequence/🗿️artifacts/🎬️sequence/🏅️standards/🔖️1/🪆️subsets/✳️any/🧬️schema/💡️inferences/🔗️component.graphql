# 💡️ Sequence inference schema — topology is a real Kahn's-algorithm topological sort over the
# step DAG (steps + edges).

type SequenceInference {
  topology: SequenceTopology! @state(class: INFERRED)
}

type SequenceTopology {
  topoOrder: [String!]!
  depth: [SequenceTopologyDepthEntry!]!
  cycleFree: Boolean!
  nodeCount: Int!
}

type SequenceTopologyDepthEntry {
  id: String!
  depth: Int!
}
