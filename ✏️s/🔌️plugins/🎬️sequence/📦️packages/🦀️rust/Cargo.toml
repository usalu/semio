[package]
name = "semio-s-plugin-sequence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sequence plugin - one crate for the sequence artifact (diff/op/dsl/pack/spr/engine) and the sequence play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:sequence"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "sequence"
ports = { react = 6077, wgpu = 6177 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false, features = ["full-artifact-catalog"] }
graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
neural_engine = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🧠️neural/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
imperative_engine = { path = "../../../../../✏️s/🔨️modules/📜️imperative/📦️packages/🦀️rust", package = "semio-s-imperative" }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-s-plugin-imperative-math = { path = "../../../📜️imperative/🧩️extensions/🧮️math/📦️packages/🦀️rust", package = "semio-s-plugin-imperative-math" }
semio-s-plugin-imperative-text = { path = "../../../📜️imperative/🧩️extensions/📝️text/📦️packages/🦀️rust", package = "semio-s-plugin-imperative-text" }
semio-s-plugin-imperative-effect = { path = "../../../📜️imperative/🧩️extensions/📣️effect/📦️packages/🦀️rust", package = "semio-s-plugin-imperative-effect" }
semio-s-plugin-imperative-control = { path = "../../../📜️imperative/🧩️extensions/🎮️control/📦️packages/🦀️rust", package = "semio-s-plugin-imperative-control" }
