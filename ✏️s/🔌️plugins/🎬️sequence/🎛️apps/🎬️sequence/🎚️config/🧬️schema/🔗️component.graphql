type SequenceConfig {
  selectedStepIds: [String!]! @state(class: CONFIG)
  lastRunJson: String! @state(class: CONFIG)
  orientation: String! @state(class: CONFIG)
  camera: SequenceCamera! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}
type SequenceCamera { x: Float! y: Float! zoom: Float! }
