syntax = "proto3";
package semio.s.process.process3d.artifact;

// 🧬️ Process3d artifact schema — every field with its state class.

message Process3dArtifact {
  // @state artifact
  Process3dWorkshop workshop = 1;
  // @state artifact
  string stock_id = 2;
  string stock_label = 3;
  Process3dPose stock_pose = 4;
  Process3dStock stock_payload = 5;
  ArtifactChildHandle stock_solid = 6;
  // @state artifact
  ArtifactChildHandle steps = 7;
  repeated Process3dStep step_payloads = 8;
  repeated ArtifactChildHandle tool_solids = 9;
  // @state artifact
  optional uint32 resolved_up_to = 10;
  // @state presence
  optional string selected_id = 11;
  // @state presence
  optional uint32 selected_face_id = 12;
  // @state presence
  string active_utility_id = 13;
  // @state config
  string selection_method = 14;
  // @state config
  string engagement_input = 15;
  // @state config
  double camera_position_x = 16;
  // @state config
  double camera_position_y = 17;
  // @state config
  double camera_position_z = 18;
  // @state config
  double camera_target_x = 19;
  // @state config
  double camera_target_y = 20;
  // @state config
  double camera_target_z = 21;
  // @state config
  double camera_fov = 22;
  // @state config
  bool sun_enabled = 23;
  // @state config
  double sun_azimuth = 24;
  // @state config
  double sun_elevation = 25;
  // @state config
  double sun_intensity = 26;
  // @state config
  string sun_color = 27;
  // @state config
  string locale = 28;
  // @state config
  string contributions_json = 29;
  // @state artifact
  optional string hovered_id = 30;
}

message Process3dWorkshop {}
message Process3dStock {}
message Process3dStep {}
message Process3dPose {}
message ArtifactChildHandle { string child_id = 1; string target = 2; }
