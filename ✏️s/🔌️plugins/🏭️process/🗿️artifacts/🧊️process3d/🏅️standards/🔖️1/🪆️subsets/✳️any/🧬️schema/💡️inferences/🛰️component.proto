syntax = "proto3";
package semio.s.process.process3d.inference;

// 💡️ Process3d inference schema — stockBounds (world-space AABB) + stepCount.

message Process3dInference {
  // @derived
  BoundingBox stock_bounds = 1;
  // @derived
  uint64 step_count = 2;
}

message BoundingBox {
  repeated double min = 1;
  repeated double max = 2;
}
