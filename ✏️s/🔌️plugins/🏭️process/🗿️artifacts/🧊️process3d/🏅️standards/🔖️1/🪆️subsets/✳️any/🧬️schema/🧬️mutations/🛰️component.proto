syntax = "proto3";
package semio.s.process.process3d.mutation;

// 🧬️ Process3d mutation schema — persistent fields only.

message Process3dMutation {
  // @state artifact
  Process3dWorkshop workshop = 1;
  // @state artifact
  Process3dStock stock = 2;
  // @state artifact
  repeated Process3dStep steps = 3;
  // @state artifact
  optional uint32 resolved_up_to = 4;
}

message Process3dWorkshop {}
message Process3dStock {}
message Process3dStep {}
