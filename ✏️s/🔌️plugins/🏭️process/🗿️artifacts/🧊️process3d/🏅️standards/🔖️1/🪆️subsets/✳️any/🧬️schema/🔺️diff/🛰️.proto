syntax = "proto3";
package semio.s.process.process3d.diff;

// 🧬️ Process3d diff schema — sparse field delta over the artifact: id-keyed machine, step and tool-solid row deltas plus the scalar stock slots.

message Process3dDiff {
  // @state artifact
  optional Process3dMachinesDelta workshop = 1;
  // @state artifact
  optional string stock_id = 2;
  optional string stock_label = 3;
  optional Process3dPose stock_pose = 4;
  optional Process3dStock stock_payload = 5;
  optional ArtifactChildHandle stock_solid = 6;
  // @state artifact
  optional Process3dStepsDelta step_payloads = 8;
  // @state presence
  // @state config
}

message Process3dStock {}
message Process3dPose {}
message Process3dMachine {}
message Process3dCapability {}
message Process3dStep {}
message Process3dMeasure {}
message Process3dOrigin {}
message ArtifactChildHandle { string child_id = 1; string target = 2; }

message Process3dMachinesRemoval {
  string id = 1;
  uint32 index = 2;
}
message Process3dMachinesInsertion {
  uint32 index = 1;
  Process3dMachine row = 2;
}
message Process3dMachinesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message Process3dMachinesDelta {
  repeated Process3dMachinesRemoval removed = 1;
  repeated Process3dMachinesInsertion inserted = 2;
  repeated Process3dMachinesRelocation moved = 3;
  repeated Process3dMachinesModification modified = 4;
}
message Process3dMachinesModification {
  string id = 1;
  Process3dMachinePatch patch = 2;
}

message Process3dMachinePatch {
  optional string label = 1;
  optional string icon_id = 2;
  repeated Process3dCapability capabilities = 3;
}

message Process3dStepsRemoval {
  string id = 1;
  uint32 index = 2;
}
message Process3dStepsInsertion {
  uint32 index = 1;
  Process3dStep row = 2;
}
message Process3dStepsRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message Process3dStepsDelta {
  repeated Process3dStepsRemoval removed = 1;
  repeated Process3dStepsInsertion inserted = 2;
  repeated Process3dStepsRelocation moved = 3;
  repeated Process3dStepsModification modified = 4;
}
message Process3dStepsModification {
  string id = 1;
  Process3dStepPatch patch = 2;
}

message Process3dStepPatch {
  optional string label = 1;
  optional bool enabled = 2;
  optional Process3dMeasure measure = 3;
  optional Process3dOptionalOrigin origin = 4;
}

message Process3dOptionalOrigin { optional Process3dOrigin value = 1; }
