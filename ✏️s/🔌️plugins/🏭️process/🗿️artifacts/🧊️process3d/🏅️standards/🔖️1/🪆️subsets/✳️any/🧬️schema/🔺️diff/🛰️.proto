syntax = "proto3";
package semio.s.process.process3d.diff;

// 🧬️ Process3d diff schema — sparse field delta over the artifact.

message Process3dDiff {
  // @state artifact
  optional Process3dArtifact artifact = 1;
  // @state artifact
  optional Process3dWorkshop workshop = 2;
  // @state artifact
  optional string stock_id = 3;
  optional string stock_label = 4;
  optional Process3dPose stock_pose = 5;
  optional Process3dStock stock_payload = 6;
  optional ArtifactChildHandle stock_solid = 7;
  // @state artifact
  optional ArtifactChildHandle steps = 8;
  repeated Process3dStep step_payloads = 9;
  repeated ArtifactChildHandle tool_solids = 10;
  // @state artifact
  optional uint32 resolved_up_to = 11;
  // @state presence
  optional string selected_id = 12;
  // @state presence
  optional uint32 selected_face_id = 13;
  // @state presence
  optional string active_utility_id = 14;
  // @state config
  optional string selection_method = 15;
  // @state config
  optional string engagement_input = 16;
  // @state config
  optional double camera_position_x = 17;
  // @state config
  optional double camera_position_y = 18;
  // @state config
  optional double camera_position_z = 19;
  // @state config
  optional double camera_target_x = 20;
  // @state config
  optional double camera_target_y = 21;
  // @state config
  optional double camera_target_z = 22;
  // @state config
  optional double camera_fov = 23;
  // @state config
  optional bool sun_enabled = 24;
  // @state config
  optional double sun_azimuth = 25;
  // @state config
  optional double sun_elevation = 26;
  // @state config
  optional double sun_intensity = 27;
  // @state config
  optional string sun_color = 28;
  // @state config
  optional string locale = 29;
  // @state config
  optional string contributions_json = 30;
  // @state artifact
  optional string hovered_id = 31;
}

message Process3dArtifact {}
message Process3dWorkshop {}
message Process3dStock {}
message Process3dStepsDelta {
  repeated Process3dStep added = 1;
  repeated string removed = 2;
  repeated Process3dStepPatchEntry patched = 3;
  repeated string reordered = 4;
}
message Process3dStep {}
message Process3dStepPatchEntry {
  string id = 1;
  Process3dStepPatch patch = 2;
}
message Process3dStepPatch {}
message Process3dPose {}
message ArtifactChildHandle { string child_id = 1; string target = 2; }
