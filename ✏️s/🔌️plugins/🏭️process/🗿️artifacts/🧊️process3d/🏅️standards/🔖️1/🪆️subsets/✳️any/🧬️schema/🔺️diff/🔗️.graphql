# 🧬️ Process3d diff schema — sparse field delta over the artifact: id-keyed machine, step and tool-solid row deltas plus the scalar stock slots.

type Process3dDiff {
  workshop: Process3dMachinesDelta @state(class: ARTIFACT)
  stockId: String @state(class: ARTIFACT)
  stockLabel: String @state(class: ARTIFACT)
  stockPose: Pose @state(class: ARTIFACT)
  stockPayload: Stock @state(class: ARTIFACT)
  stockSolid: ArtifactLink @state(class: ARTIFACT) @child(kind: "s.stdio.semio")
  stepPayloads: Process3dStepsDelta @state(class: ARTIFACT)
}

type Process3dMachinesDelta {
  removed: [Process3dMachinesRemoval!]!
  inserted: [Process3dMachinesInsertion!]!
  moved: [Process3dMachinesRelocation!]!
  modified: [Process3dMachinesModification!]!
}

type Process3dMachinesModification {
  id: String!
  patch: Process3dMachinePatch!
}

type Process3dMachinesRemoval {
  id: String!
  index: Int!
}

type Process3dMachinesInsertion {
  index: Int!
  row: WorkshopMachine!
}

type Process3dMachinesRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Process3dMachinePatch {
  label: String
  iconId: String
  capabilities: [Capability!]
}

type Process3dStepsDelta {
  removed: [Process3dStepsRemoval!]!
  inserted: [Process3dStepsInsertion!]!
  moved: [Process3dStepsRelocation!]!
  modified: [Process3dStepsModification!]!
}

type Process3dStepsModification {
  id: String!
  patch: Process3dStepPatch!
}

type Process3dStepsRemoval {
  id: String!
  index: Int!
}

type Process3dStepsInsertion {
  index: Int!
  row: ProcessStep!
}

type Process3dStepsRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Process3dStepPatch {
  label: String
  enabled: Boolean
  measure: ProcessMeasure
  origin: Process3dOptionalOrigin
}

type Process3dOptionalOrigin { value: StepOrigin }
