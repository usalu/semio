syntax = "proto3";
package semio.app.process.x3d;
message Process3dPresence {
  // @state presence
  string engagement_input = 1;
  // @state presence
  repeated double camera_position = 2;
  // @state presence
  repeated double camera_target = 3;
  // @state presence
  double camera_fov = 4;
  // @state presence
  string active_utility_id = 5;
}
