# 🧬️ Process3d artifact schema — every field with its state class.

type Process3dArtifact {
  workshop: Workshop! @state(class: ARTIFACT)
  stockId: String! @state(class: ARTIFACT)
  stockLabel: String! @state(class: ARTIFACT)
  stockPose: Pose! @state(class: ARTIFACT)
  stockPayload: Stock! @state(class: ARTIFACT)
  stockSolid: ArtifactLink! @state(class: ARTIFACT) @child(kind: "s.stdio.semio")
  steps: ArtifactLink! @state(class: ARTIFACT) @child(kind: "s.stdio.semio")
  stepPayloads: [ProcessStep!]! @state(class: ARTIFACT)
  toolSolids: [ArtifactLink!]! @state(class: ARTIFACT) @child(kind: "s.stdio.semio")
  resolvedUpTo: Int @state(class: ARTIFACT)
}

type ArtifactChildHandle {
  childId: String!
  target: String!
}
