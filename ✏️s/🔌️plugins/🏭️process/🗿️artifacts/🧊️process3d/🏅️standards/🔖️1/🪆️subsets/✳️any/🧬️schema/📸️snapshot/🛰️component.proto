syntax = "proto3";
package semio.s.process.process3d.snapshot;

// 🧬️ Process3d snapshot schema — artifact-lane fields only.

message Process3dSnapshot {
  // @state artifact
  Process3dWorkshop workshop = 1;
  // @state artifact
  string stock_id = 2;
  // @state artifact
  string stock_label = 3;
  Process3dPose stock_pose = 4;
  Process3dStock stock_payload = 5;
  ArtifactChildHandle stock_solid = 6;
  ArtifactChildHandle steps = 7;
  repeated Process3dStep step_payloads = 8;
  repeated ArtifactChildHandle tool_solids = 9;
  // @state artifact
  optional uint32 resolved_up_to = 10;
}

message Process3dWorkshop {}
message Process3dStock {}
message Process3dStep {}
message Process3dPose {}
message ArtifactChildHandle { string child_id = 1; string target = 2; }
