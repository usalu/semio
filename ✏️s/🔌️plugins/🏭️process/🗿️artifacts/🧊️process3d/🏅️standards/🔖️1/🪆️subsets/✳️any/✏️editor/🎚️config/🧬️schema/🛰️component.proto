syntax = "proto3";
package semio.app.process.x3d;
message Process3dConfig {
  // @state config
  string engagement_input = 1;
  // @state config
  repeated double camera_position = 2;
  // @state config
  repeated double camera_target = 3;
  // @state config
  double camera_fov = 4;
  // @state config
  bool sun_enabled = 5;
  // @state config
  double sun_azimuth = 6;
  // @state config
  double sun_elevation = 7;
  // @state config
  double sun_intensity = 8;
  // @state config
  string sun_color = 9;
  // @state config
  string active_utility_id = 10;
  // @state config
  string locale = 11;
  // @state config
  string contributions_json = 12;
}
