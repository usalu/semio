# 🧬️ Process3d artifact schema — every field with its state class.

type Process3dArtifact {
  workshop: Workshop! @state(class: ARTIFACT)
  stockId: String! @state(class: ARTIFACT)
  stockLabel: String! @state(class: ARTIFACT)
  stockPose: Pose! @state(class: ARTIFACT)
  stockPayload: Stock! @state(class: ARTIFACT)
  stockSolid: ArtifactLink! @state(class: ARTIFACT) @child(kind: "s.stdio.semio.brep")
  steps: ArtifactLink! @state(class: ARTIFACT) @child(kind: "s.stdio.semio.flow")
  stepPayloads: [ProcessStep!]! @state(class: ARTIFACT)
  toolSolids: [ArtifactLink!]! @state(class: ARTIFACT) @child(kind: "s.stdio.semio.brep")
  resolvedUpTo: Int @state(class: ARTIFACT)
  selectedId: String @state(class: PRESENCE)
  selectedFaceId: Int @state(class: PRESENCE)
  activeUtilityId: String! @state(class: PRESENCE)
  selectionMethod: String! @state(class: CONFIG)
  engagementInput: String! @state(class: CONFIG)
  cameraPositionX: Float! @state(class: CONFIG)
  cameraPositionY: Float! @state(class: CONFIG)
  cameraPositionZ: Float! @state(class: CONFIG)
  cameraTargetX: Float! @state(class: CONFIG)
  cameraTargetY: Float! @state(class: CONFIG)
  cameraTargetZ: Float! @state(class: CONFIG)
  cameraFov: Float! @state(class: CONFIG)
  sunEnabled: Boolean! @state(class: CONFIG)
  sunAzimuth: Float! @state(class: CONFIG)
  sunElevation: Float! @state(class: CONFIG)
  sunIntensity: Float! @state(class: CONFIG)
  sunColor: String! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
  contributionsJson: String! @state(class: CONFIG)
  hoveredId: String @state(class: ARTIFACT)
}
