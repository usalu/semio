# 🧬️ Process3d artifact schema — every field with its state class.

type Process3dArtifact {
  workshop: Workshop! @state(class: PERSISTENT)
  stock: Stock! @state(class: PERSISTENT)
  steps: [ProcessStep!]! @state(class: PERSISTENT)
  resolvedUpTo: Int @state(class: PERSISTENT)
  selectedId: String @state(class: SHARED_UI)
  selectedFaceId: Int @state(class: SHARED_UI)
  activeUtilityId: String! @state(class: SHARED_UI)
  selectionMethod: String! @state(class: LOCAL_UI)
  engagementInput: String! @state(class: LOCAL_UI)
  cameraPositionX: Float! @state(class: LOCAL_UI)
  cameraPositionY: Float! @state(class: LOCAL_UI)
  cameraPositionZ: Float! @state(class: LOCAL_UI)
  cameraTargetX: Float! @state(class: LOCAL_UI)
  cameraTargetY: Float! @state(class: LOCAL_UI)
  cameraTargetZ: Float! @state(class: LOCAL_UI)
  cameraFov: Float! @state(class: LOCAL_UI)
  sunEnabled: Boolean! @state(class: LOCAL_UI)
  sunAzimuth: Float! @state(class: LOCAL_UI)
  sunElevation: Float! @state(class: LOCAL_UI)
  sunIntensity: Float! @state(class: LOCAL_UI)
  sunColor: String! @state(class: LOCAL_UI)
  locale: String! @state(class: LOCAL_UI)
  contributionsJson: String! @state(class: LOCAL_UI)
  hoveredId: String @state(class: PREVIEW)
}

