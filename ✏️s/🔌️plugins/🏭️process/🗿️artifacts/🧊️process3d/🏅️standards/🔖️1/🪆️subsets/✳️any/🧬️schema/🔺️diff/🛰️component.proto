syntax = "proto3";
package semio.s.process.process3d.diff;

// 🧬️ Process3d diff schema — sparse field delta over the artifact.

message Process3dDiff {
  // @state artifact
  optional Process3dArtifact artifact = 1;
  // @state artifact
  optional Process3dWorkshop workshop = 2;
  // @state artifact
  optional Process3dStock stock = 3;
  // @state artifact
  optional Process3dStepsDelta steps = 4;
  // @state artifact
  optional uint32 resolved_up_to = 5;
  // @state presence
  optional string selected_id = 6;
  // @state presence
  optional uint32 selected_face_id = 7;
  // @state presence
  optional string active_utility_id = 8;
  // @state config
  optional string selection_method = 9;
  // @state config
  optional string engagement_input = 10;
  // @state config
  optional double camera_position_x = 11;
  // @state config
  optional double camera_position_y = 12;
  // @state config
  optional double camera_position_z = 13;
  // @state config
  optional double camera_target_x = 14;
  // @state config
  optional double camera_target_y = 15;
  // @state config
  optional double camera_target_z = 16;
  // @state config
  optional double camera_fov = 17;
  // @state config
  optional bool sun_enabled = 18;
  // @state config
  optional double sun_azimuth = 19;
  // @state config
  optional double sun_elevation = 20;
  // @state config
  optional double sun_intensity = 21;
  // @state config
  optional string sun_color = 22;
  // @state config
  optional string locale = 23;
  // @state config
  optional string contributions_json = 24;
  // @state artifact
  optional string hovered_id = 25;
}

message Process3dArtifact {}
message Process3dWorkshop {}
message Process3dStock {}
message Process3dStepsDelta {
  repeated Process3dStep added = 1;
  repeated string removed = 2;
  repeated Process3dStepPatchEntry patched = 3;
  repeated string reordered = 4;
}
message Process3dStep {}
message Process3dStepPatchEntry {
  string id = 1;
  Process3dStepPatch patch = 2;
}
message Process3dStepPatch {}
