[package]
name = "semio-s-plugin-process-wood"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Process wood machine catalog — contributes wood-shop machines to process3d-play"

[lints]
workspace = true

[package.metadata.component]
package = "semio:process-extension-wood"

[package.metadata.semio]
role = "extension"
extends = "process"
contributes = ["process.machines"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio_s_plugin_process = { path = "../../../../../../../✏️s/🔌️plugins/🏭️process/📦️packages/🦀️rust", package = "semio-s-plugin-process" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
serde_json = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
