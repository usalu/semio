[package]
name = "semio-s-plugin-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:process"

[package.metadata.semio]
consumes = ["process.machines"]

[[package.metadata.semio.playground]]
variant = "process3d"
app = "process3d-play"
aliases = ["process 3d"]
ports = { react = 6022, wgpu = 6122 }

# 🎪️ The `bearbeiten` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT).

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌️plugins/🏭️process/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
process_3d = { path = "../../../../../../../✏️s/🔌️plugins/🏭️process/🎛️apps/🧊️3d/⚡️implementations/🦀️rust", package = "semio-s-app-process-3d" }
process_3d_engine = { path = "../../../../../../../✏️s/🔌️plugins/🏭️process/🎛️apps/🧊️3d/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-process-3d-engine" }
process_3d_ui = { path = "../../../../../../../✏️s/🔌️plugins/🏭️process/🎛️apps/🧊️3d/🔨️modules/🖱️ui/⚡️implementations/🦀️rust", package = "semio-s-app-process-3d-ui" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
