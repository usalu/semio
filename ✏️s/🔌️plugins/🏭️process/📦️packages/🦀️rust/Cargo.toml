cargo-features = ["trim-paths"]

[package]
name = "semio-s-plugin-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Process plugin - one crate for the process3d artifact (diff/op/dsl/pack/spr/engine, incl. built-in machine catalogs) and the process 3d play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:process"

[package.metadata.semio]
role = "plugin"
consumes = ["process.machines"]

[[package.metadata.semio.playground]]
variant = "process3d"
app = "process3d-play"
aliases = ["process 3d"]
ports = { react = 6022, wgpu = 6122 }

# 🎪️ The `bearbeiten` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT).

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
pack = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
kernel_3d_brepkit = { path = "../../../../../✏️s/🔨️modules/🧊️3d/📐️brep/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-3d-brep" }
kernel_3d_engine = { path = "../../../../../✏️s/🔨️modules/🧊️3d/📐️brep/⚙️engine/⚡️implementations/🦀️rust", features = ["parallel"], package = "semio-framework-os-kernel-3d-brep-engine" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json.workspace = true
base64 = "0.22.1"

[dev-dependencies]
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

# ---------------------------------------------------------------------------------------------
# 🚧️ TEMPORARY VERIFICATION OVERLAY — delete this `[workspace]` table (and only this table) at
# registrar handoff. The new crate is not yet a workspace member (the OLD bundle crate with the
# same package name still is), so Cargo refuses to build it in-place unless it declares itself
# its own workspace root. Verify via `--manifest-path` while this is in place; see TEMPLATE.md §3.
# ---------------------------------------------------------------------------------------------
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde_json = "1.0.149"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[profile.wasm-release.package.semio-framework-os-kernel-store]
codegen-units = 1
