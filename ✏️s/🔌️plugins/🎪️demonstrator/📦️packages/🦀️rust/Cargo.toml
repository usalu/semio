[package]
name = "semio-s-plugin-demonstrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Entwerfen mit Bestand demonstrator plugin - one crate bundling the six demonstrator panes (generator/koordinator/aggregator/aussuchen/bearbeiten/verfolgen) served by procedural/cad/puzzle/sourcing/process/gis into one wasm component"

[lints]
workspace = true

[package.metadata.component]
package = "semio:demonstrator"

# 🎪️ REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT: bundles the six mit-bestand demonstrator panes'
# already-existing apps (procedural3d, cad, puzzle3d, sourcing-curate, process3d, gis2d) into ONE
# wasm component instead of six — the framework/kernel SDK (`semio-framework-plugin`,
# `semio-framework-os`) is statically linked exactly once, and the six panes share one plugin
# worker/module via the existing `acquirePluginModule` lease pool (framework core `📦️index.ts`),
# instead of six separate workers each duplicating that linkage. Each source plugin
# (procedural/cad/puzzle/sourcing/process/gis) keeps its own standalone playground rows unchanged
# for its own non-demonstrator variants (e.g. `procedural3d`, `puzzle3d`) — only the six
# demonstrator-specific rows (`generator`/`koordinator`/`aggregator`/`aussuchen`/`bearbeiten`/`verfolgen`)
# live here.
[package.metadata.semio]
role = "plugin"
consumes = ["forms.questionKind", "flow.extension", "process.machines"]

[[package.metadata.semio.playground]]
variant = "generator"
app = "procedural3d-play"
brand = "entwerfen-mit-bestand-generator"
aliases = ["entwerfen-mit-bestand-generator"]
ports = { react = 6027, wgpu = 6127 }

[[package.metadata.semio.playground]]
variant = "koordinator"
app = "cad-play"
brand = "entwerfen-mit-bestand-koordinator"
aliases = ["entwerfen-mit-bestand-koordinator"]
ports = { react = 6028, wgpu = 6128 }

[[package.metadata.semio.playground]]
variant = "aggregator"
app = "puzzle3d-play"
brand = "entwerfen-mit-bestand-aggregator"
aliases = ["mit-bestand", "entwerfen-mit-bestand"]
ports = { react = 6023, wgpu = 6123 }

[[package.metadata.semio.playground]]
variant = "aussuchen"
app = "sourcing-curate"
brand = "entwerfen-mit-bestand-aussuchen"
aliases = ["entwerfen-mit-bestand-aussuchen"]
ports = { react = 6030, wgpu = 6130 }

[[package.metadata.semio.playground]]
variant = "bearbeiten"
app = "process3d-play"
brand = "entwerfen-mit-bestand-bearbeiten"
aliases = ["entwerfen-mit-bestand-bearbeiten"]
ports = { react = 6031, wgpu = 6131 }

[[package.metadata.semio.playground]]
variant = "verfolgen"
app = "gis2d-play"
brand = "entwerfen-mit-bestand-verfolgen"
aliases = ["entwerfen-mit-bestand-verfolgen"]
ports = { react = 6032, wgpu = 6132 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-fixture"
app = "cad-play"
root = "✏️s/🔌️plugins/📐️cad/🧫️fixtures"

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "puzzle3d-play"
roots = ["🧰️framework/🔨️modules/🖼️assets/🌱️metabolism/🎨️representation", "♻️mit-bestand/🖼️asset/🏚️abbau-aufbau"]
placeholder = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/🧊️placeholder.glb"
filter_from_examples = true

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/infinite-fixture"
app = "puzzle3d-play"
root = "🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🧫️fixtures"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/osm"
app = "gis2d-play"
upstream = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
cache = "osm-tiles"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/vt"
app = "gis2d-play"
upstream = "https://tiles.openfreemap.org/planet"
cache = "openfreemap-vt"

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-3d = { path = "../../../../../🧰️framework/🔨️modules/🧊️3d/📦️packages/🦀️rust" }
serde.workspace = true
serde_json.workspace = true

procedural = { path = "../../../🌀️procedural/📦️packages/🦀️rust", package = "semio-s-plugin-procedural" }
cad = { path = "../../../📐️cad/📦️packages/🦀️rust", package = "semio-s-plugin-cad" }
puzzle = { path = "../../../🧩️puzzle/📦️packages/🦀️rust", package = "semio-s-plugin-puzzle" }
sourcing = { path = "../../../🪵️sourcing/📦️packages/🦀️rust", package = "semio-s-plugin-sourcing" }
process = { path = "../../../🏭️process/📦️packages/🦀️rust", package = "semio-s-plugin-process" }
gis = { path = "../../../🌍️gis/📦️packages/🦀️rust", package = "semio-s-plugin-gis" }
