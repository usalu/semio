[package]
name = "semio-s-plugin-demonstrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Entwerfen mit Bestand demonstrator plugin - one crate bundling the six demonstrator panes (generator/koordinator/aggregator/aussuchen/bearbeiten/verfolgen) served by procedural/cad/puzzle/sourcing/process/gis into one wasm component"

[lints]
workspace = true

[package.metadata.component]
package = "semio:demonstrator"

# 🎪️ REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT: bundles the six mit-bestand demonstrator panes'
# already-existing apps (generation3d, cad, puzzle3d, sourcing-curation, process3d, gis2d) into ONE
# wasm component instead of six — the framework/kernel SDK (`semio-framework-plugin`,
# `semio-framework-os`) is statically linked exactly once, and the six panes share one plugin
# worker/module via the existing `acquirePluginModule` lease pool (framework core `🟦️.ts`),
# instead of six separate workers each duplicating that linkage. Each source plugin
# (procedural/cad/puzzle/sourcing/process/gis) keeps its own standalone playground rows unchanged
# for its own non-demonstrator variants (e.g. `generation3d`, `puzzle3d`) — only the six
# demonstrator-specific rows (`generator`/`koordinator`/`aggregator`/`aussuchen`/`bearbeiten`/`verfolgen`)
# live here.
[package.metadata.semio]
role = "plugin"
consumes = ["forms.questionKind", "flow.extension", "process.machines"]

[[package.metadata.semio.playground]]
variant = "demonstrator"
app = "s.demonstrator.playground@1/*#editor"
ports = { react = 6107, wgpu = 6207 }

[[package.metadata.semio.playground]]
variant = "generator"
app = "s.procedural.generation3d@1/*#editor"
brand = "entwerfen-mit-bestand-generator"
aliases = ["entwerfen-mit-bestand-generator"]
ports = { react = 6027, wgpu = 6127 }

[[package.metadata.semio.playground]]
variant = "koordinator"
app = "s.cad.cad@1/*#editor"
brand = "entwerfen-mit-bestand-koordinator"
aliases = ["entwerfen-mit-bestand-koordinator"]
ports = { react = 6028, wgpu = 6128 }

[[package.metadata.semio.playground]]
variant = "aggregator"
app = "s.puzzle.puzzle3d@1/*#editor"
brand = "entwerfen-mit-bestand-aggregator"
aliases = ["mit-bestand", "entwerfen-mit-bestand"]
ports = { react = 6023, wgpu = 6123 }

[[package.metadata.semio.playground]]
variant = "aussuchen"
app = "s.sourcing.curation@1/*#editor"
brand = "entwerfen-mit-bestand-aussuchen"
aliases = ["entwerfen-mit-bestand-aussuchen"]
ports = { react = 6030, wgpu = 6130 }

[[package.metadata.semio.playground]]
variant = "bearbeiten"
app = "s.process.process3d@1/*#editor"
brand = "entwerfen-mit-bestand-bearbeiten"
aliases = ["entwerfen-mit-bestand-bearbeiten"]
ports = { react = 6031, wgpu = 6131 }

[[package.metadata.semio.playground]]
variant = "verfolgen"
app = "s.gis.gismap@1/*#editor"
brand = "entwerfen-mit-bestand-verfolgen"
aliases = ["entwerfen-mit-bestand-verfolgen"]
ports = { react = 6032, wgpu = 6132 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/cad-fixture"
app = "s.cad.cad@1/*#editor"
root = "✏️s/🔌️plugins/📐️cad/🗿️artifacts/📐️cad/🏅️standards/🔖️1/🪆️subsets/✳️any/📚️examples/🧫️fixtures"

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "s.puzzle.puzzle3d@1/*#editor"
catalog = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/📇️catalog.json"

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/infinite-fixture"
app = "s.puzzle.puzzle3d@1/*#editor"
root = "🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🧫️fixtures"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/osm"
app = "s.gis.gismap@1/*#editor"
upstream = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
cache = "osm-tiles"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/vt"
app = "s.gis.gismap@1/*#editor"
upstream = "https://tiles.openfreemap.org/planet"
cache = "openfreemap-vt"

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false, features = ["full-artifact-catalog"] }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-job = { workspace = true }
# 🚪️ NO `semio-framework-os` / `semio-framework-3d` here, deliberately (ticket
# 26/08/13/UNIFIED-STATE-ARCHITECTURE-AND-DEMONSTRATOR-RESTORATION D2). The demonstrator used to
# reach into the OS host crate to register `"3d.cad"`'s ten solid/mesh/dwg codecs and `"2d.map"`'s
# two media codecs — kinds it neither declares nor owns — making plugin load order decide the winner
# for a process-global key. Those registrations now live with 📐️cad and 🌍️gis, so this crate needs
# neither the host crate nor the BRep kernel it passed to it. `POLICY_PLUGIN_DEP_OS_SYMBOLS` carries
# no carve-out for `🎪️demonstrator` any more: reintroducing the dependency is a plain breach.
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }

# 🔌️ `default-features = false` switches OFF each pane plugin's `plugin-entry` feature: this
# crate bundles all six into ONE component and owns the single `semio_plugin_install_bundle`
# entry point. Without this, seven crates export that `#[no_mangle]` symbol and the component
# fails to link with duplicate-symbol errors.
value_derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
procedural = { path = "../../../🌀️procedural/📦️packages/🦀️rust", package = "semio-s-plugin-procedural", default-features = false }
cad = { path = "../../../📐️cad/📦️packages/🦀️rust", package = "semio-s-plugin-cad", default-features = false }
puzzle = { path = "../../../🧩️puzzle/📦️packages/🦀️rust", package = "semio-s-plugin-puzzle", default-features = false }
sourcing = { path = "../../../🪵️sourcing/📦️packages/🦀️rust", package = "semio-s-plugin-sourcing", default-features = false }
process = { path = "../../../🏭️process/📦️packages/🦀️rust", package = "semio-s-plugin-process", default-features = false }
gis = { path = "../../../🌍️gis/📦️packages/🦀️rust", package = "semio-s-plugin-gis", default-features = false }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust" }
semio-framework-ui-runtime = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧠️runtime/📦️packages/🦀️rust" }
