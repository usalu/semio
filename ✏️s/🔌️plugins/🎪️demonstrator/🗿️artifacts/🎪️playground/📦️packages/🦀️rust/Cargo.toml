[package]
name = "semio-s-artifact-demonstrator-playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "demonstrator playground artifact"

[package.metadata.semio]
role = "s-module"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-s-artifact-stdio-csv = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-xlsx = { workspace = true }
semio-s-artifact-stdio-zip = { workspace = true }
semio-framework-os-kernel = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework = { path = "../../../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-job = { workspace = true }
# 🚪️ NO `semio-framework-os` / `semio-framework-3d` here, deliberately (ticket
# 26/08/13/UNIFIED-STATE-ARCHITECTURE-AND-DEMONSTRATOR-RESTORATION D2). The demonstrator used to
# reach into the OS host crate to register `"3d.cad"`'s ten solid/mesh/dwg codecs and `"2d.map"`'s
# two media codecs — kinds it neither declares nor owns — making plugin load order decide the winner
# for a process-global key. Those registrations now live with 📐️cad and 🌍️gis, so this crate needs
# neither the host crate nor the BRep kernel it passed to it. `POLICY_PLUGIN_DEP_OS_SYMBOLS` carries
# no carve-out for `🎪️demonstrator` any more: reintroducing the dependency is a plain breach.
semio-framework-schema = { path = "../../../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }

# 🔌️ `default-features = false` switches OFF each pane plugin's `plugin-entry` feature: this
# crate bundles all six into ONE component and owns the single `semio_plugin_install_bundle`
# entry point. Without this, seven crates export that `#[no_mangle]` symbol and the component
# fails to link with duplicate-symbol errors.
value_derive = { path = "../../../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }

[dev-dependencies]
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest", "artifact-app-testing"], package = "semio-framework-plugin" }
semio-framework-os-kernel = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel", features = ["protocol-laws"] }
serde.workspace = true
serde_json.workspace = true
semio-framework-async-macros = { path = "../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-ui-scene = { path = "../../../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust" }
semio-framework-ui-runtime = { path = "../../../../../../../🧰️framework/🔨️modules/🖱️ui/🧠️runtime/📦️packages/🦀️rust" }
