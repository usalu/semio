[package]
workspace = "../.."
name = "semio-s-plugin-block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Block plugin shared schema and retirement authority"

[package.metadata.semio]
role = "plugin"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
test-serde = ["dep:serde"]

[[test]]
name = "shared-schema"
path = "../../🧬️schema/🧱️document-fields/🧪️tests/🦀️.rs"
required-features = ["test-serde"]

[dependencies]
semio-framework-pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-native-owned = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-dsl-record-derive = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
