[package]
workspace = "../../../.."
name = "semio-s-plugin-block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Block plugin shared schema and retirement authority"

[package.metadata.semio]
role = "plugin"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
test-serde = ["dep:serde"]

[[test]]
name = "shared-schema"
path = "../../🧬️schema/🧱️shared/🧪️tests/🦀️.rs"
required-features = ["test-serde"]

[dependencies]
semio-framework-value = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-dsl-record-derive = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
