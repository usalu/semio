[package]
name = "semio-s-plugin-block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Block plugin — 2D, 3D, and 5D single-kind-definition editors in one hot-swappable WASM component"

[lints]
workspace = true

[package.metadata.component]
package = "semio:block"

[package.metadata.semio]
role = "plugin"

# 📖️ Opts this plugin into the generated Storybook scope registry (`.storybook/scopes.ts`'s
# `GENERATED_SCOPES`, read via `readSemioMarkerSubTable`) instead of a hand-maintained entry — see
# 26/08/06/GENERATED-STORYBOOK-SCOPES-AND-STORIES-FROM-PACKAGE-CATALOG. `"."` is this plugin's OWNER
# root (`✏️s/🔌️plugins/🧱️block`) itself, matching the pre-existing hand-curated `block` scope.
[package.metadata.semio.storybook]
id = "block"
titlePrefix = "🧱️block"
sourceRoots = ["."]

[[package.metadata.semio.playground]]
variant = "block2d"
app = "s.block.block2d@1/*#editor"
aliases = ["block 2d"]
ports = { react = 6024, wgpu = 6124 }

[[package.metadata.semio.playground]]
variant = "block3d"
app = "s.block.block3d@1/*#editor"
aliases = ["block 3d"]
ports = { react = 6025, wgpu = 6125 }

[[package.metadata.semio.playground]]
variant = "block5d"
app = "s.block.block5d@1/*#editor"
aliases = ["block 5d"]
ports = { react = 6026, wgpu = 6126 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "s.block.block3d@1/*#editor"
roots = ["🧰️framework/🔨️modules/🖼️assets/🌱️metabolism/🎨️representation", "♻️mit-bestand/🖼️asset/🏚️abbau-aufbau"]
placeholder = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/🧊️placeholder.glb"
filter_from_examples = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
# 🕹️ ticket 26/08/14/FIRST-CLASS-HOVER-AND-SELECTION-MECHANISM: `InteractionDefinition`/`InteractionRef`/
# `GranularityDefinition`/`HierarchyProvider`/`HoverSpec`/`SelectionSpec`/`SelectionMode`/`SelectionMethod`/
# `MergeMode` live in `semio-framework` itself (not re-exported by `semio-framework-plugin`), so apps
# declaring `.interaction(...)` need this as a direct dependency, same as every other plugin crate.
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-job = { workspace = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
