[package]
name = "semio-s-plugin-block"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Block plugin — 2D, 3D, and 5D single-kind-definition editors in one hot-swappable WASM component"

[lints]
workspace = true

[package.metadata.component]
package = "semio:block"

[package.metadata.semio]
role = "plugin"

# 📖️ Opts this plugin into the generated Storybook scope registry (`.storybook/scopes.ts`'s
# `GENERATED_SCOPES`, read via `readSemioMarkerSubTable`) instead of a hand-maintained entry — see
# 26/08/06/GENERATED-STORYBOOK-SCOPES-AND-STORIES-FROM-PACKAGE-CATALOG. `"."` is this plugin's OWNER
# root (`✏️s/🔌️plugins/🧱️block`) itself, matching the pre-existing hand-curated `block` scope.
[package.metadata.semio.storybook]
id = "block"
titlePrefix = "🧱️block"
sourceRoots = ["."]

[[package.metadata.semio.playground]]
variant = "block2d"
app = "block2d-play"
aliases = ["block 2d"]
ports = { react = 6024, wgpu = 6124 }

[[package.metadata.semio.playground]]
variant = "block3d"
app = "block3d-play"
aliases = ["block 3d"]
ports = { react = 6025, wgpu = 6125 }

[[package.metadata.semio.playground]]
variant = "block5d"
app = "block5d-play"
aliases = ["block 5d"]
ports = { react = 6026, wgpu = 6126 }

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "block3d-play"
roots = ["🧰️framework/🔨️modules/🖼️assets/⚡️implementations/🟦️typescript/🌱️metabolism/🎨️representation", "♻️mit-bestand/🖼️assets/🏚️abbau-aufbau"]
placeholder = "🧰️framework/🔨️modules/🖼️assets/⚡️implementations/🟦️typescript/🥽️mesh/🧊️placeholder.glb"
filter_from_examples = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
pack = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true

