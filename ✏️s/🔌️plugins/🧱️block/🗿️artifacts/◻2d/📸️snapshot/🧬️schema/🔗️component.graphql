# 🧬️ Block2d snapshot schema — persistent fields only.

type Block2dSnapshot {
  schema: String! @state(class: PERSISTENT)
  nodeKind: BlockKindIdentity! @state(class: PERSISTENT)
  presentation: Block2dPresentation! @state(class: PERSISTENT)
  handleKinds: [Block2dHandleKind!]! @state(class: PERSISTENT)
  handles: [Block2dHandleTemplate!]! @state(class: PERSISTENT)
  compatibility: [BlockCompatibilityRule!]! @state(class: PERSISTENT)
  attributes: [BlockAttribute!]! @state(class: PERSISTENT)
  authors: [BlockAuthor!]! @state(class: PERSISTENT)
  camera2d: BlockCamera2d! @state(class: PERSISTENT)
  meta: BlockMeta! @state(class: PERSISTENT)
}

type BlockKindIdentity { _placeholder: Boolean }

type Block2dPresentation { _placeholder: Boolean }

type Block2dHandleKind { _placeholder: Boolean }

type Block2dHandleTemplate { _placeholder: Boolean }

type BlockCompatibilityRule { _placeholder: Boolean }

type BlockAttribute { _placeholder: Boolean }

type BlockAuthor { _placeholder: Boolean }

type BlockCamera2d { _placeholder: Boolean }

type BlockMeta { _placeholder: Boolean }
