syntax = "proto3";
package semio.s.block.block2d.snapshot;

// 🧬️ Block2d snapshot schema — artifact-lane fields only.

message Block2dSnapshot {
  // @state artifact
  string schema = 1;
  // @state artifact
  BlockKindIdentity node_kind = 2;
  // @state artifact
  Block2dPresentation presentation = 3;
  // @state artifact
  repeated Block2dHandleKind handle_kinds = 4;
  // @state artifact
  repeated Block2dHandleTemplate handles = 5;
  // @state artifact
  repeated BlockCompatibilityRule compatibility = 6;
  // @state artifact
  repeated BlockAttribute attributes = 7;
  // @state artifact
  repeated BlockAuthor authors = 8;
  // @state artifact
  BlockCamera2d camera2d = 9;
  // @state artifact
  BlockMeta meta = 10;
}

message BlockKindIdentity {
  bool _placeholder = 1;
}

message Block2dPresentation {
  bool _placeholder = 1;
}

message Block2dHandleKind {
  bool _placeholder = 1;
}

message Block2dHandleTemplate {
  bool _placeholder = 1;
}

message BlockCompatibilityRule {
  bool _placeholder = 1;
}

message BlockAttribute {
  bool _placeholder = 1;
}

message BlockAuthor {
  bool _placeholder = 1;
}

message BlockCamera2d {
  bool _placeholder = 1;
}

message BlockMeta {
  bool _placeholder = 1;
}
