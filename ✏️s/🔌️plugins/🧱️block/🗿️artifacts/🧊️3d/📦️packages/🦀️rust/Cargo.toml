semio-s-artifact-block-3d-io-read = { workspace = true }
semio-framework-artifact-reference = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-block-3d-editor = { workspace = true }
semio-s-artifact-block-3d-examples = { workspace = true }
semio-s-artifact-block-3d-io = { workspace = true }
semio-s-artifact-block-3d-model = { workspace = true }
semio-s-artifact-block-3d-schema = { workspace = true }
semio-s-artifact-block-3d-viewer = { workspace = true }
semio-s-artifact-stdio-semio-kit = { workspace = true }

[dev-dependencies]
semio-s-artifact-block-3d-editor-modes = { workspace = true }
pack = { workspace = true }
semio-framework-async-macros = { workspace = true }
