[package]
workspace = "../../../../../.."
name = "semio-s-artifact-block-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Block 3d artifact"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

