syntax = "proto3";
package semio.s.block.block3d.artifact;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";

// 🧬️ Block3d artifact schema — every field with its state class.

message Block3dArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  BlockKindIdentity object_kind = 2;
  // @state artifact
  repeated BlockRepresentation representations = 3;
  // @state artifact
  semio.os.store.ArtifactChild catalog = 4;
  // @state artifact
  repeated Block3dVortexKindExtra vortex_kind_extra = 5;
  // @state artifact
  repeated Block3dVortexTemplate vortices = 6;
  // @state artifact
  repeated BlockCompatibilityRule compatibility = 7;
  // @state artifact
  repeated BlockAttribute attributes = 8;
  // @state artifact
  repeated BlockAuthor authors = 9;
  // @state artifact
  BlockCamera3d camera3d = 10;
  // @state artifact
  BlockMeta meta = 11;
  // @state config
}

message BlockKindIdentity {
  bool _placeholder = 1;
}

message BlockRepresentation {
  bool _placeholder = 1;
}

message Block3dVortexKind {
  bool _placeholder = 1;
}

message Block3dVortexKindExtra {
  bool _placeholder = 1;
}

message Block3dVortexTemplate {
  bool _placeholder = 1;
}

message BlockCompatibilityRule {
  bool _placeholder = 1;
}

message BlockAttribute {
  bool _placeholder = 1;
}

message BlockAuthor {
  bool _placeholder = 1;
}

message BlockCamera3d {
  bool _placeholder = 1;
}

message BlockMeta {
  bool _placeholder = 1;
}

message Block3dWindowView {
  bool _placeholder = 1;
}
