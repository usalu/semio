semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-block-3d-editor-commands = { workspace = true }
semio-s-artifact-block-3d-editor-config = { workspace = true }
semio-s-artifact-block-3d-editor-modes = { workspace = true }
