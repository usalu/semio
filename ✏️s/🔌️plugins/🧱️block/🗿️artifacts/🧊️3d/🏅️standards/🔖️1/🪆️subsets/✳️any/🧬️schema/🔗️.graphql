# 🧬️ Block3d artifact schema — every field with its state class.

type Block3dArtifact {
  schema: String! @state(class: ARTIFACT)
  objectKind: BlockKindIdentity! @state(class: ARTIFACT)
  representations: [BlockRepresentation!]! @state(class: ARTIFACT)
  catalog: ArtifactChild! @state(class: ARTIFACT)
  vortexKindExtra: [Block3dVortexKindExtra!]! @state(class: ARTIFACT)
  vortices: [Block3dVortexTemplate!]! @state(class: ARTIFACT)
  compatibility: [BlockCompatibilityRule!]! @state(class: ARTIFACT)
  attributes: [BlockAttribute!]! @state(class: ARTIFACT)
  authors: [BlockAuthor!]! @state(class: ARTIFACT)
  camera3d: BlockCamera3d! @state(class: ARTIFACT)
  meta: BlockMeta! @state(class: ARTIFACT)
}

type BlockKindIdentity { _placeholder: Boolean }

type BlockRepresentation { _placeholder: Boolean }

type Block3dVortexKind { _placeholder: Boolean }

type Block3dVortexKindExtra { _placeholder: Boolean }

type Block3dVortexTemplate { _placeholder: Boolean }

type BlockCompatibilityRule { _placeholder: Boolean }

type BlockAttribute { _placeholder: Boolean }

type BlockAuthor { _placeholder: Boolean }

type BlockCamera3d { _placeholder: Boolean }

type BlockMeta { _placeholder: Boolean }

type Block3dWindowView { _placeholder: Boolean }
