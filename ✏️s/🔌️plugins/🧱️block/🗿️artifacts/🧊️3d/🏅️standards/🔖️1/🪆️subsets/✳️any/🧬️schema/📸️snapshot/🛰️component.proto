syntax = "proto3";
package semio.s.block.block3d.snapshot;

// 🧬️ Block3d snapshot schema — persistent fields only.

message Block3dSnapshot {
  // @state artifact
  string schema = 1;
  // @state artifact
  BlockKindIdentity object_kind = 2;
  // @state artifact
  repeated BlockRepresentation representations = 3;
  // @state artifact
  repeated Block3dVortexKind vortex_kinds = 4;
  // @state artifact
  repeated Block3dVortexTemplate vortices = 5;
  // @state artifact
  repeated BlockCompatibilityRule compatibility = 6;
  // @state artifact
  repeated BlockAttribute attributes = 7;
  // @state artifact
  repeated BlockAuthor authors = 8;
  // @state artifact
  BlockCamera3d camera3d = 9;
  // @state artifact
  BlockMeta meta = 10;
}

message BlockKindIdentity {
  bool _placeholder = 1;
}

message BlockRepresentation {
  bool _placeholder = 1;
}

message Block3dVortexKind {
  bool _placeholder = 1;
}

message Block3dVortexTemplate {
  bool _placeholder = 1;
}

message BlockCompatibilityRule {
  bool _placeholder = 1;
}

message BlockAttribute {
  bool _placeholder = 1;
}

message BlockAuthor {
  bool _placeholder = 1;
}

message BlockCamera3d {
  bool _placeholder = 1;
}

message BlockMeta {
  bool _placeholder = 1;
}

message Block3dWindowView {
  bool _placeholder = 1;
}

message Block3dBrushPreview {
  bool _placeholder = 1;
}
