syntax = "proto3";
package semio.s.block.block3d.diff;

// 🧬️ Block3d diff schema — field-sparse, id-keyed delta.

message Block3dDiff {
  optional string schema = 1;
  optional BlockKindIdentityPatch object_kind = 2;
  optional BlockRepresentationsDelta representations = 3;
  optional Block3dVortexKindsDelta vortex_kinds = 4;
  optional Block3dVorticesDelta vortices = 5;
  optional BlockCompatibilityDelta compatibility = 6;
  optional BlockAttributesDelta attributes = 7;
  optional BlockAuthorsDelta authors = 8;
  optional BlockCamera3dPatch camera3d = 9;
  optional BlockMetaPatch meta = 10;
}

message BlockOptionalText {
  string value = 1;
  bool cleared = 2;
}

message BlockKindIdentityPatch {
  optional string id = 1;
  optional string name = 2;
  optional string label = 3;
  optional string description = 4;
  optional BlockOptionalText variant = 5;
  optional BlockOptionalText icon = 6;
  optional BlockOptionalText unit = 7;
}

message BlockRepresentationPatch {
  optional string name = 1;
  optional BlockOptionalText mesh_url = 2;
  optional BlockOptionalText lod = 3;
  optional string description = 4;
  repeated string tags_removed = 5;
  repeated string tags_added = 6;
  repeated string attributes_removed = 7;
  repeated BlockAttribute attributes_added = 8;
}

message Block3dVortexKindPatch {
  optional string name = 1;
  optional string label = 2;
  optional string color = 3;
  optional string default_cable_kind = 4;
}

message Block3dVortexTemplatePatch {
  optional string vortex_kind = 1;
  repeated double position = 2;
  repeated double direction = 3;
  optional double radius = 4;
  optional BlockOptionalText label = 5;
}

message BlockCompatibilityRulePatch {
  optional string source = 1;
  optional string target = 2;
  optional bool bidirectional = 3;
}

message BlockAttributePatch {
  optional string value = 1;
  optional BlockOptionalText definition = 2;
}

message BlockAuthorPatch {
  optional string name = 1;
  optional BlockOptionalText email = 2;
}

message BlockCamera3dPatch {
  repeated double position = 1;
  repeated double target = 2;
  optional double zoom = 3;
}

message BlockMetaPatch {
  optional string description = 1;
}

message BlockRepresentationsPatchEntry {
  string id = 1;
  BlockRepresentationPatch patch = 2;
}

message BlockRepresentationsRemoval {
  string id = 1;
  uint32 index = 2;
}

message BlockRepresentationsInsertion {
  uint32 index = 1;
  BlockRepresentation row = 2;
}

message BlockRepresentationsRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BlockRepresentationsDelta {
  repeated BlockRepresentationsRemoval removed = 1;
  repeated BlockRepresentationsInsertion inserted = 2;
  repeated BlockRepresentationsRelocation moved = 3;
  repeated BlockRepresentationsPatchEntry modified = 4;
}

message Block3dVortexKindsPatchEntry {
  string id = 1;
  Block3dVortexKindPatch patch = 2;
}

message Block3dVortexKindsRemoval {
  string id = 1;
  uint32 index = 2;
}

message Block3dVortexKindsInsertion {
  uint32 index = 1;
  Block3dVortexKind row = 2;
}

message Block3dVortexKindsRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Block3dVortexKindsDelta {
  repeated Block3dVortexKindsRemoval removed = 1;
  repeated Block3dVortexKindsInsertion inserted = 2;
  repeated Block3dVortexKindsRelocation moved = 3;
  repeated Block3dVortexKindsPatchEntry modified = 4;
}

message Block3dVorticesPatchEntry {
  string id = 1;
  Block3dVortexTemplatePatch patch = 2;
}

message Block3dVorticesRemoval {
  string id = 1;
  uint32 index = 2;
}

message Block3dVorticesInsertion {
  uint32 index = 1;
  Block3dVortexTemplate row = 2;
}

message Block3dVorticesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Block3dVorticesDelta {
  repeated Block3dVorticesRemoval removed = 1;
  repeated Block3dVorticesInsertion inserted = 2;
  repeated Block3dVorticesRelocation moved = 3;
  repeated Block3dVorticesPatchEntry modified = 4;
}

message BlockCompatibilityPatchEntry {
  string id = 1;
  BlockCompatibilityRulePatch patch = 2;
}

message BlockCompatibilityRemoval {
  string id = 1;
  uint32 index = 2;
}

message BlockCompatibilityInsertion {
  uint32 index = 1;
  BlockCompatibilityRule row = 2;
}

message BlockCompatibilityRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BlockCompatibilityDelta {
  repeated BlockCompatibilityRemoval removed = 1;
  repeated BlockCompatibilityInsertion inserted = 2;
  repeated BlockCompatibilityRelocation moved = 3;
  repeated BlockCompatibilityPatchEntry modified = 4;
}

message BlockAttributesPatchEntry {
  string id = 1;
  BlockAttributePatch patch = 2;
}

message BlockAttributesRemoval {
  string id = 1;
  uint32 index = 2;
}

message BlockAttributesInsertion {
  uint32 index = 1;
  BlockAttribute row = 2;
}

message BlockAttributesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BlockAttributesDelta {
  repeated BlockAttributesRemoval removed = 1;
  repeated BlockAttributesInsertion inserted = 2;
  repeated BlockAttributesRelocation moved = 3;
  repeated BlockAttributesPatchEntry modified = 4;
}

message BlockAuthorsPatchEntry {
  string id = 1;
  BlockAuthorPatch patch = 2;
}

message BlockAuthorsRemoval {
  string id = 1;
  uint32 index = 2;
}

message BlockAuthorsInsertion {
  uint32 index = 1;
  BlockAuthor row = 2;
}

message BlockAuthorsRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BlockAuthorsDelta {
  repeated BlockAuthorsRemoval removed = 1;
  repeated BlockAuthorsInsertion inserted = 2;
  repeated BlockAuthorsRelocation moved = 3;
  repeated BlockAuthorsPatchEntry modified = 4;
}

