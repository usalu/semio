syntax = "proto3";
package semio.s.block.block3d.diff;

// 🧬️ Block3d diff schema — sparse field delta.

message Block3dDiff {
  // @state artifact
  optional Block3dArtifact artifact = 1;
  // @state artifact
  optional string schema = 2;
  // @state artifact
  optional BlockKindIdentity object_kind = 3;
  // @state artifact
  optional Block3dRepresentationsDelta representations = 4;
  // @state artifact
  optional Block3dVortexKindsDelta vortex_kinds = 5;
  // @state artifact
  optional Block3dVorticesDelta vortices = 6;
  // @state artifact
  optional Block3dCompatibilityDelta compatibility = 7;
  // @state artifact
  optional Block3dAttributesDelta attributes = 8;
  // @state artifact
  optional Block3dAuthorList authors = 9;
  // @state artifact
  optional BlockCamera3d camera3d = 10;
  // @state artifact
  optional BlockMeta meta = 11;
  // @state config
}

message BlockKindIdentity {
  bool _placeholder = 1;
}

message BlockRepresentation {
  bool _placeholder = 1;
}

message Block3dVortexKind {
  bool _placeholder = 1;
}

message Block3dVortexTemplate {
  bool _placeholder = 1;
}

message BlockCompatibilityRule {
  bool _placeholder = 1;
}

message BlockAttribute {
  bool _placeholder = 1;
}

message BlockAuthor {
  bool _placeholder = 1;
}

message BlockCamera3d {
  bool _placeholder = 1;
}

message BlockMeta {
  bool _placeholder = 1;
}

message Block3dWindowView {
  bool _placeholder = 1;
}

message Block3dStringList {
  repeated string values = 1;
}

message Block3dAuthorList {
  repeated BlockAuthor values = 1;
}

message Block3dRepresentationsDelta {
  repeated BlockRepresentation added = 1;
  repeated string removed = 2;
  repeated Block3dRepresentationsPatchEntry patched = 3;
  repeated string reordered = 4;
}

message Block3dRepresentationsPatchEntry {
  string id = 1;
  Block3dRepresentationsPatch patch = 2;
}

message Block3dRepresentationsPatch {
  optional BlockRepresentation replacement = 1;
}

message Block3dVortexKindsDelta {
  repeated Block3dVortexKind added = 1;
  repeated string removed = 2;
  repeated Block3dVortexKindsPatchEntry patched = 3;
  repeated string reordered = 4;
}

message Block3dVortexKindsPatchEntry {
  string id = 1;
  Block3dVortexKindsPatch patch = 2;
}

message Block3dVortexKindsPatch {
  optional Block3dVortexKind replacement = 1;
}

message Block3dVorticesDelta {
  repeated Block3dVortexTemplate added = 1;
  repeated string removed = 2;
  repeated Block3dVorticesPatchEntry patched = 3;
  repeated string reordered = 4;
}

message Block3dVorticesPatchEntry {
  string id = 1;
  Block3dVorticesPatch patch = 2;
}

message Block3dVorticesPatch {
  optional Block3dVortexTemplate replacement = 1;
}

message Block3dCompatibilityDelta {
  repeated BlockCompatibilityRule added = 1;
  repeated string removed = 2;
  repeated Block3dCompatibilityPatchEntry patched = 3;
  repeated string reordered = 4;
}

message Block3dCompatibilityPatchEntry {
  string id = 1;
  Block3dCompatibilityPatch patch = 2;
}

message Block3dCompatibilityPatch {
  optional BlockCompatibilityRule replacement = 1;
}

message Block3dAttributesDelta {
  repeated BlockAttribute added = 1;
  repeated string removed = 2;
  repeated Block3dAttributesPatchEntry patched = 3;
  repeated string reordered = 4;
}

message Block3dAttributesPatchEntry {
  string id = 1;
  Block3dAttributesPatch patch = 2;
}

message Block3dAttributesPatch {
  optional BlockAttribute replacement = 1;
}

message Block3dWindowsList {
  repeated Block3dWindowView values = 1;
}

message Block3dArtifact {
  string schema = 1;
}
