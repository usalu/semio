    ChangeObjectKindLabel change_object_kind_label = 2;
    ChangeObjectKindVariant change_object_kind_variant = 3;
    ChangeObjectKindDescription change_object_kind_description = 4;
    ChangeObjectKindIcon change_object_kind_icon = 5;
    ChangeObjectKindUnit change_object_kind_unit = 6;
    CreateRepresentation create_representation = 7;
    DeleteRepresentation delete_representation = 8;
    RenameRepresentation rename_representation = 9;
    ChangeRepresentationMeshUrl change_representation_mesh_url = 10;
    ChangeRepresentationLod change_representation_lod = 11;
    ChangeRepresentationDescription change_representation_description = 12;
    AddRepresentationTag add_representation_tag = 13;
    RemoveRepresentationTag remove_representation_tag = 14;
    AddRepresentationAttribute add_representation_attribute = 15;
    RemoveRepresentationAttribute remove_representation_attribute = 16;
    CreateVortexKind create_vortex_kind = 17;
    DeleteVortexKind delete_vortex_kind = 18;
    RenameVortexKind rename_vortex_kind = 19;
    ChangeVortexKindLabel change_vortex_kind_label = 20;
    ChangeVortexKindColor change_vortex_kind_color = 21;
    ChangeVortexKindDefaultCableKind change_vortex_kind_default_cable_kind = 22;
    CreateVortex create_vortex = 23;
    DeleteVortex delete_vortex = 24;
    MoveVortex move_vortex = 25;
    ResizeVortex resize_vortex = 26;
    ChangeVortexVortexKind change_vortex_vortex_kind = 27;
    ChangeVortexLabel change_vortex_label = 28;
    AddCompatibilityRule add_compatibility_rule = 29;
    RemoveCompatibilityRule remove_compatibility_rule = 30;
    AddAttribute add_attribute = 31;
    RemoveAttribute remove_attribute = 32;
    AddAuthor add_author = 33;
    RemoveAuthor remove_author = 34;
    MoveCamera3d move_camera3d = 35;
    ScaleCamera3d scale_camera3d = 36;
    ChangeMetaDescription change_meta_description = 37;
  }
}

