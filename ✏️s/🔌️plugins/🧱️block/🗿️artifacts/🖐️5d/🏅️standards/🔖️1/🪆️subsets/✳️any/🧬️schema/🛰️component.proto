syntax = "proto3";
package semio.s.block.block5d.artifact;

// 🧬️ Block5d artifact schema — every field with its state class.

message Block5dArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  BlockKindIdentity part_kind = 2;
  // @state artifact
  Block5dPart2d part2d = 3;
  // @state artifact
  Block5dPart3d part3d = 4;
  // @state artifact
  repeated BlockRepresentation representations = 5;
  // @state artifact
  repeated Block5dGripKind grip_kinds = 6;
  // @state artifact
  repeated Block5dGripTemplate grips = 7;
  // @state artifact
  repeated BlockCompatibilityRule compatibility = 8;
  // @state artifact
  repeated BlockAttribute attributes = 9;
  // @state artifact
  repeated BlockAuthor authors = 10;
  // @state artifact
  BlockCamera2d camera2d = 11;
  // @state artifact
  BlockCamera3d camera3d = 12;
  // @state artifact
  BlockMeta meta = 13;
  // @state presence
  repeated string selected_ids = 14;
  // @state config
  string locale = 15;
}

message BlockKindIdentity {
  bool _placeholder = 1;
}

message Block5dPart2d {
  bool _placeholder = 1;
}

message Block5dPart3d {
  bool _placeholder = 1;
}

message BlockRepresentation {
  bool _placeholder = 1;
}

message Block5dGripKind {
  bool _placeholder = 1;
}

message Block5dGripTemplate {
  bool _placeholder = 1;
}

message BlockCompatibilityRule {
  bool _placeholder = 1;
}

message BlockAttribute {
  bool _placeholder = 1;
}

message BlockAuthor {
  bool _placeholder = 1;
}

message BlockCamera2d {
  bool _placeholder = 1;
}

message BlockCamera3d {
  bool _placeholder = 1;
}

message BlockMeta {
  bool _placeholder = 1;
}
