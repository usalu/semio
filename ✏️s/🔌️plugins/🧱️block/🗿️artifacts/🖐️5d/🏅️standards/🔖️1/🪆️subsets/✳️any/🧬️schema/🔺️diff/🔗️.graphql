# 🧬️ Block5d diff schema — field-sparse, id-keyed delta.

type Block5dDiff {
  schema: String
  partKind: BlockKindIdentityPatch
  part2d: Block5dPart2dPatch
  part3d: Block5dPart3dPatch
  representations: BlockRepresentationsDelta
  gripKinds: Block5dGripKindsDelta
  grips: Block5dGripsDelta
  compatibility: BlockCompatibilityDelta
  attributes: BlockAttributesDelta
  authors: BlockAuthorsDelta
  camera2d: BlockCamera2dPatch
  camera3d: BlockCamera3dPatch
  meta: BlockMetaPatch
}

type BlockOptionalText {
  value: String
}

type BlockOptionalNumber {
  value: Float
}

type BlockOptionalOrientation {
  value: [Float!]
}

type BlockOptionalScale {
  value: [Float!]
}

type BlockKindIdentityPatch {
  id: String
  name: String
  label: String
  description: String
  variant: BlockOptionalText
  icon: BlockOptionalText
  unit: BlockOptionalText
}

type Block5dPart2dPatch {
  shape: BlockOptionalText
  radius: BlockOptionalNumber
  width: BlockOptionalNumber
  height: BlockOptionalNumber
  color: BlockOptionalText
  iconKind: BlockOptionalText
}

type Block5dPart3dPatch {
  orientation: BlockOptionalOrientation
  scale: BlockOptionalScale
}

type BlockRepresentationPatch {
  name: String
  meshUrl: BlockOptionalText
  lod: BlockOptionalText
  description: String
  tagsRemoved: [String!]!
  tagsAdded: [String!]!
  attributesRemoved: [String!]!
  attributesAdded: [BlockAttribute!]!
}

type Block5dGripKindPatch {
  name: String
  label: String
  color: String
  defaultRopeKind: String
}

type Block5dGripTemplatePatch {
  gripKind: String
  angle: Float
  radius2d: Float
  position: [Float!]
  direction: [Float!]
  radius3d: Float
}

type BlockCompatibilityRulePatch {
  source: String
  target: String
  bidirectional: Boolean
}

type BlockAttributePatch {
  value: String
  definition: BlockOptionalText
}

type BlockAuthorPatch {
  name: String
  email: BlockOptionalText
}

type BlockCamera2dPatch {
  x: Float
  y: Float
  zoom: Float
}

type BlockCamera3dPatch {
  position: [Float!]
  target: [Float!]
  zoom: Float
}

type BlockMetaPatch {
  description: String
}

type BlockRepresentationsPatchEntry {
  id: String!
  patch: BlockRepresentationPatch!
}

type BlockRepresentationsRemoval {
  id: String!
  index: Int!
}

type BlockRepresentationsInsertion {
  index: Int!
  row: BlockRepresentation!
}

type BlockRepresentationsRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BlockRepresentationsDelta {
  removed: [BlockRepresentationsRemoval!]!
  inserted: [BlockRepresentationsInsertion!]!
  moved: [BlockRepresentationsRelocation!]!
  modified: [BlockRepresentationsPatchEntry!]!
}

type Block5dGripKindsPatchEntry {
  id: String!
  patch: Block5dGripKindPatch!
}

type Block5dGripKindsRemoval {
  id: String!
  index: Int!
}

type Block5dGripKindsInsertion {
  index: Int!
  row: Block5dGripKind!
}

type Block5dGripKindsRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Block5dGripKindsDelta {
  removed: [Block5dGripKindsRemoval!]!
  inserted: [Block5dGripKindsInsertion!]!
  moved: [Block5dGripKindsRelocation!]!
  modified: [Block5dGripKindsPatchEntry!]!
}

type Block5dGripsPatchEntry {
  id: String!
  patch: Block5dGripTemplatePatch!
}

type Block5dGripsRemoval {
  id: String!
  index: Int!
}

type Block5dGripsInsertion {
  index: Int!
  row: Block5dGripTemplate!
}

type Block5dGripsRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Block5dGripsDelta {
  removed: [Block5dGripsRemoval!]!
  inserted: [Block5dGripsInsertion!]!
  moved: [Block5dGripsRelocation!]!
  modified: [Block5dGripsPatchEntry!]!
}

type BlockCompatibilityPatchEntry {
  id: String!
  patch: BlockCompatibilityRulePatch!
}

type BlockCompatibilityRemoval {
  id: String!
  index: Int!
}

type BlockCompatibilityInsertion {
  index: Int!
  row: BlockCompatibilityRule!
}

type BlockCompatibilityRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BlockCompatibilityDelta {
  removed: [BlockCompatibilityRemoval!]!
  inserted: [BlockCompatibilityInsertion!]!
  moved: [BlockCompatibilityRelocation!]!
  modified: [BlockCompatibilityPatchEntry!]!
}

type BlockAttributesPatchEntry {
  id: String!
  patch: BlockAttributePatch!
}

type BlockAttributesRemoval {
  id: String!
  index: Int!
}

type BlockAttributesInsertion {
  index: Int!
  row: BlockAttribute!
}

type BlockAttributesRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BlockAttributesDelta {
  removed: [BlockAttributesRemoval!]!
  inserted: [BlockAttributesInsertion!]!
  moved: [BlockAttributesRelocation!]!
  modified: [BlockAttributesPatchEntry!]!
}

type BlockAuthorsPatchEntry {
  id: String!
  patch: BlockAuthorPatch!
}

type BlockAuthorsRemoval {
  id: String!
  index: Int!
}

type BlockAuthorsInsertion {
  index: Int!
  row: BlockAuthor!
}

type BlockAuthorsRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BlockAuthorsDelta {
  removed: [BlockAuthorsRemoval!]!
  inserted: [BlockAuthorsInsertion!]!
  moved: [BlockAuthorsRelocation!]!
  modified: [BlockAuthorsPatchEntry!]!
}

