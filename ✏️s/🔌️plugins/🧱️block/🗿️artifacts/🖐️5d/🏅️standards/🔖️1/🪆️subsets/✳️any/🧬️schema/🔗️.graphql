# 🧬️ Block5d artifact schema — every field with its state class.

type Block5dArtifact {
  schema: String! @state(class: ARTIFACT)
  partKind: BlockKindIdentity! @state(class: ARTIFACT)
  part2d: Block5dPart2d! @state(class: ARTIFACT)
  part3d: Block5dPart3d! @state(class: ARTIFACT)
  representations: [BlockRepresentation!]! @state(class: ARTIFACT)
  gripKinds: [Block5dGripKind!]! @state(class: ARTIFACT)
  grips: [Block5dGripTemplate!]! @state(class: ARTIFACT)
  compatibility: [BlockCompatibilityRule!]! @state(class: ARTIFACT)
  attributes: [BlockAttribute!]! @state(class: ARTIFACT)
  authors: [BlockAuthor!]! @state(class: ARTIFACT)
  camera2d: BlockCamera2d! @state(class: ARTIFACT)
  camera3d: BlockCamera3d! @state(class: ARTIFACT)
  meta: BlockMeta! @state(class: ARTIFACT)
  selectedIds: [String!]! @state(class: PRESENCE)
  locale: String! @state(class: CONFIG)
}

