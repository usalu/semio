# 🧬️ Block2d diff schema — field-sparse, id-keyed delta.

type Block2dDiff {
  schema: String
  nodeKind: BlockKindIdentityPatch
  presentation: Block2dPresentationPatch
  handleKinds: Block2dHandleKindsDelta
  handles: Block2dHandlesDelta
  compatibility: BlockCompatibilityDelta
  attributes: BlockAttributesDelta
  authors: BlockAuthorsDelta
  camera2d: BlockCamera2dPatch
  meta: BlockMetaPatch
}

type BlockOptionalText {
  value: String
}

type BlockOptionalNumber {
  value: Float
}

type BlockKindIdentityPatch {
  id: String
  name: String
  label: String
  description: String
  variant: BlockOptionalText
  icon: BlockOptionalText
  unit: BlockOptionalText
}

type Block2dPresentationPatch {
  shape: BlockOptionalText
  radius: BlockOptionalNumber
  width: BlockOptionalNumber
  height: BlockOptionalNumber
  color: BlockOptionalText
  iconKind: BlockOptionalText
}

type Block2dHandleKindPatch {
  name: String
  label: String
  color: String
  defaultWireKind: String
}

type Block2dHandleTemplatePatch {
  handleKind: String
  angle: Float
  radius: Float
}

type BlockCompatibilityRulePatch {
  source: String
  target: String
  bidirectional: Boolean
}

type BlockAttributePatch {
  value: String
  definition: BlockOptionalText
}

type BlockAuthorPatch {
  name: String
  email: BlockOptionalText
}

type BlockCamera2dPatch {
  x: Float
  y: Float
  zoom: Float
}

type BlockMetaPatch {
  description: String
}

type Block2dHandleKindsPatchEntry {
  id: String!
  patch: Block2dHandleKindPatch!
}

type Block2dHandleKindsRemoval {
  id: String!
  index: Int!
}

type Block2dHandleKindsInsertion {
  index: Int!
  row: Block2dHandleKind!
}

type Block2dHandleKindsRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Block2dHandleKindsDelta {
  removed: [Block2dHandleKindsRemoval!]!
  inserted: [Block2dHandleKindsInsertion!]!
  moved: [Block2dHandleKindsRelocation!]!
  modified: [Block2dHandleKindsPatchEntry!]!
}

type Block2dHandlesPatchEntry {
  id: String!
  patch: Block2dHandleTemplatePatch!
}

type Block2dHandlesRemoval {
  id: String!
  index: Int!
}

type Block2dHandlesInsertion {
  index: Int!
  row: Block2dHandleTemplate!
}

type Block2dHandlesRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Block2dHandlesDelta {
  removed: [Block2dHandlesRemoval!]!
  inserted: [Block2dHandlesInsertion!]!
  moved: [Block2dHandlesRelocation!]!
  modified: [Block2dHandlesPatchEntry!]!
}

type BlockCompatibilityPatchEntry {
  id: String!
  patch: BlockCompatibilityRulePatch!
}

type BlockCompatibilityRemoval {
  id: String!
  index: Int!
}

type BlockCompatibilityInsertion {
  index: Int!
  row: BlockCompatibilityRule!
}

type BlockCompatibilityRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BlockCompatibilityDelta {
  removed: [BlockCompatibilityRemoval!]!
  inserted: [BlockCompatibilityInsertion!]!
  moved: [BlockCompatibilityRelocation!]!
  modified: [BlockCompatibilityPatchEntry!]!
}

type BlockAttributesPatchEntry {
  id: String!
  patch: BlockAttributePatch!
}

type BlockAttributesRemoval {
  id: String!
  index: Int!
}

type BlockAttributesInsertion {
  index: Int!
  row: BlockAttribute!
}

type BlockAttributesRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BlockAttributesDelta {
  removed: [BlockAttributesRemoval!]!
  inserted: [BlockAttributesInsertion!]!
  moved: [BlockAttributesRelocation!]!
  modified: [BlockAttributesPatchEntry!]!
}

type BlockAuthorsPatchEntry {
  id: String!
  patch: BlockAuthorPatch!
}

type BlockAuthorsRemoval {
  id: String!
  index: Int!
}

type BlockAuthorsInsertion {
  index: Int!
  row: BlockAuthor!
}

type BlockAuthorsRelocation {
  id: String!
  from: Int!
  to: Int!
}

type BlockAuthorsDelta {
  removed: [BlockAuthorsRemoval!]!
  inserted: [BlockAuthorsInsertion!]!
  moved: [BlockAuthorsRelocation!]!
  modified: [BlockAuthorsPatchEntry!]!
}

