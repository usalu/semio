syntax = "proto3";
package semio.s.block.block2d.diff;

// 🧬️ Block2d diff schema — field-sparse, id-keyed delta.

message Block2dDiff {
  optional string schema = 1;
  optional BlockKindIdentityPatch node_kind = 2;
  optional Block2dPresentationPatch presentation = 3;
  optional Block2dHandleKindsDelta handle_kinds = 4;
  optional Block2dHandlesDelta handles = 5;
  optional BlockCompatibilityDelta compatibility = 6;
  optional BlockAttributesDelta attributes = 7;
  optional BlockAuthorsDelta authors = 8;
  optional BlockCamera2dPatch camera2d = 9;
  optional BlockMetaPatch meta = 10;
}

message BlockOptionalText {
  string value = 1;
  bool cleared = 2;
}

message BlockOptionalNumber {
  double value = 1;
  bool cleared = 2;
}

message BlockKindIdentityPatch {
  optional string id = 1;
  optional string name = 2;
  optional string label = 3;
  optional string description = 4;
  optional BlockOptionalText variant = 5;
  optional BlockOptionalText icon = 6;
  optional BlockOptionalText unit = 7;
}

message Block2dPresentationPatch {
  optional BlockOptionalText shape = 1;
  optional BlockOptionalNumber radius = 2;
  optional BlockOptionalNumber width = 3;
  optional BlockOptionalNumber height = 4;
  optional BlockOptionalText color = 5;
  optional BlockOptionalText icon_kind = 6;
}

message Block2dHandleKindPatch {
  optional string name = 1;
  optional string label = 2;
  optional string color = 3;
  optional string default_wire_kind = 4;
}

message Block2dHandleTemplatePatch {
  optional string handle_kind = 1;
  optional double angle = 2;
  optional double radius = 3;
}

message BlockCompatibilityRulePatch {
  optional string source = 1;
  optional string target = 2;
  optional bool bidirectional = 3;
}

message BlockAttributePatch {
  optional string value = 1;
  optional BlockOptionalText definition = 2;
}

message BlockAuthorPatch {
  optional string name = 1;
  optional BlockOptionalText email = 2;
}

message BlockCamera2dPatch {
  optional double x = 1;
  optional double y = 2;
  optional double zoom = 3;
}

message BlockMetaPatch {
  optional string description = 1;
}

message Block2dHandleKindsPatchEntry {
  string id = 1;
  Block2dHandleKindPatch patch = 2;
}

message Block2dHandleKindsRemoval {
  string id = 1;
  uint32 index = 2;
}

message Block2dHandleKindsInsertion {
  uint32 index = 1;
  Block2dHandleKind row = 2;
}

message Block2dHandleKindsRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Block2dHandleKindsDelta {
  repeated Block2dHandleKindsRemoval removed = 1;
  repeated Block2dHandleKindsInsertion inserted = 2;
  repeated Block2dHandleKindsRelocation moved = 3;
  repeated Block2dHandleKindsPatchEntry modified = 4;
}

message Block2dHandlesPatchEntry {
  string id = 1;
  Block2dHandleTemplatePatch patch = 2;
}

message Block2dHandlesRemoval {
  string id = 1;
  uint32 index = 2;
}

message Block2dHandlesInsertion {
  uint32 index = 1;
  Block2dHandleTemplate row = 2;
}

message Block2dHandlesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Block2dHandlesDelta {
  repeated Block2dHandlesRemoval removed = 1;
  repeated Block2dHandlesInsertion inserted = 2;
  repeated Block2dHandlesRelocation moved = 3;
  repeated Block2dHandlesPatchEntry modified = 4;
}

message BlockCompatibilityPatchEntry {
  string id = 1;
  BlockCompatibilityRulePatch patch = 2;
}

message BlockCompatibilityRemoval {
  string id = 1;
  uint32 index = 2;
}

message BlockCompatibilityInsertion {
  uint32 index = 1;
  BlockCompatibilityRule row = 2;
}

message BlockCompatibilityRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BlockCompatibilityDelta {
  repeated BlockCompatibilityRemoval removed = 1;
  repeated BlockCompatibilityInsertion inserted = 2;
  repeated BlockCompatibilityRelocation moved = 3;
  repeated BlockCompatibilityPatchEntry modified = 4;
}

message BlockAttributesPatchEntry {
  string id = 1;
  BlockAttributePatch patch = 2;
}

message BlockAttributesRemoval {
  string id = 1;
  uint32 index = 2;
}

message BlockAttributesInsertion {
  uint32 index = 1;
  BlockAttribute row = 2;
}

message BlockAttributesRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BlockAttributesDelta {
  repeated BlockAttributesRemoval removed = 1;
  repeated BlockAttributesInsertion inserted = 2;
  repeated BlockAttributesRelocation moved = 3;
  repeated BlockAttributesPatchEntry modified = 4;
}

message BlockAuthorsPatchEntry {
  string id = 1;
  BlockAuthorPatch patch = 2;
}

message BlockAuthorsRemoval {
  string id = 1;
  uint32 index = 2;
}

message BlockAuthorsInsertion {
  uint32 index = 1;
  BlockAuthor row = 2;
}

message BlockAuthorsRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message BlockAuthorsDelta {
  repeated BlockAuthorsRemoval removed = 1;
  repeated BlockAuthorsInsertion inserted = 2;
  repeated BlockAuthorsRelocation moved = 3;
  repeated BlockAuthorsPatchEntry modified = 4;
}

