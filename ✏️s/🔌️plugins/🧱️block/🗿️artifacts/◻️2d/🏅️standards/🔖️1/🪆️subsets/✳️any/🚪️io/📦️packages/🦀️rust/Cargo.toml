[package]
workspace = "../../../../../../.."
name = "semio-s-artifact-block-2d-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Block 2d io: composition, builder, analyzer and the text and binary codecs"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
pack = { workspace = true }
semio-framework-diagnostic = { workspace = true }
semio-framework-dsl = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-block-2d-diff = { workspace = true }
semio-s-artifact-block-2d-io-read = { workspace = true }
semio-s-artifact-block-2d-io-write = { workspace = true }
semio-s-artifact-block-2d-model = { workspace = true }
semio-s-artifact-block-2d-mut-handles = { workspace = true }
semio-s-artifact-block-2d-mut-meta = { workspace = true }
semio-s-artifact-block-2d-mut-node-kind = { workspace = true }
semio-s-artifact-block-2d-mutations = { workspace = true }
semio-s-artifact-block-2d-schema = { workspace = true }
semio-s-plugin-block = { workspace = true }

[dev-dependencies]
semio-framework = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-s-plugin-block = { workspace = true, features = ["test-serde"] }
