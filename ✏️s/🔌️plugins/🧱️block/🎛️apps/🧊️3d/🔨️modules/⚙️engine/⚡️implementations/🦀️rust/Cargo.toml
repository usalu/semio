[package]
name = "semio-s-app-block-3d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Block 3D app — headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
crate-type = ["rlib"]
path = "../../../../../../../../../✏️s/🔌️plugins/🧱️block/🎛️apps/🧊️3d/🔨️modules/⚙️engine/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
block_3d = { path = "../../../../../../../../../✏️s/🔌️plugins/🧱️block/🎛️apps/🧊️3d/⚡️implementations/🦀️rust", package = "semio-s-app-block-3d" }
block_shared = { path = "../../../../../../../../../✏️s/🔌️plugins/🧱️block/🔨️modules/🤝️shared/⚡️implementations/🦀️rust", package = "semio-s-plugin-block-shared" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
dsl = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
