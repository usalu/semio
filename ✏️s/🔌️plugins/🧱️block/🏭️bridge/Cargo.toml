cargo-features = [ "trim-paths" ]
# 🧭️ Own workspace root: the repository root manifest is a shared leased file, and a member crate would serialise
# every concurrent session behind that lease.
[workspace]

[package]
name = "semio-block-mutation-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "🏭️ Production mutation bridge for 🧱️block — answers listMutations from the production dispatch aggregates themselves."

[[bin]]
name = "semio-block-mutation-bridge"
path = "🦀️.rs"

[dependencies]
semio-framework-pack-json = { path = "../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-value = { path = "../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust" }
pack = { path = "../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
semio-s-artifact-block-2d = { path = "../🗿️artifacts/◻️2d/📦️packages/🦀️rust" }
semio-s-artifact-block-3d = { path = "../🗿️artifacts/🧊️3d/📦️packages/🦀️rust" }
semio-s-artifact-block-5d = { path = "../🗿️artifacts/🖐️5d/📦️packages/🦀️rust" }
semio-s-artifact-block-2d-model = { path = "../🗿️artifacts/◻️2d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📸️snapshot/📦️packages/🦀️rust" }
semio-s-artifact-block-2d-mutations = { path = "../🗿️artifacts/◻️2d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/📦️packages/🦀️rust" }
semio-s-artifact-block-3d-editor-modes = { path = "../🗿️artifacts/🧊️3d/🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🎭️modes/📦️packages/🦀️rust" }
semio-s-artifact-block-3d-model = { path = "../🗿️artifacts/🧊️3d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📸️snapshot/📦️packages/🦀️rust" }
semio-s-artifact-block-3d-mutations = { path = "../🗿️artifacts/🧊️3d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/📦️packages/🦀️rust" }
semio-s-artifact-block-5d-model = { path = "../🗿️artifacts/🖐️5d/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📸️snapshot/📦️packages/🦀️rust" }
