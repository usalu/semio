[package]
name = "semio-s-plugin-dag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DAG plugin - one crate for the dag artifact (diff/op/dsl/pack/spr/engine) and the dag play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:dag"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "dag"
ports = { react = 6017, wgpu = 6117 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
ui_wgpu = {path = "../../../../../🧰️framework/🔨️modules/🖱️ui/📦️packages/🦀️rust", package = "semio-framework-ui", features = ["wgpu"]}
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
math = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/📦️packages/🦀️rust", package = "semio-framework-math" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
