syntax = "proto3";
package semio.s.dag.dag.artifact;
message DagArtifact {
  string schema = 1; // @state persistent
  repeated DagNodeSpec nodes = 2; // @state persistent
  repeated DagFixtureEdge edges = 3; // @state persistent
  repeated string selected_node_ids = 4; // @state shared-ui
  DagCamera camera = 5; // @state local-ui
  string locale = 6; // @state local-ui
}
message DagNodeSpec { string id = 1; }
message DagFixtureEdge { string id = 1; string source = 2; string target = 3; }
message DagCamera { double x = 1; double y = 2; double zoom = 3; }
