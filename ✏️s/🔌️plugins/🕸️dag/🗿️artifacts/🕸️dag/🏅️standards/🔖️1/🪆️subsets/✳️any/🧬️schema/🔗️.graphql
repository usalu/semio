# 🧬️ DAG artifact schema.
type DagArtifact {
  schema: String! @state(class: ARTIFACT)
  nodes: [DagNodeSpec!]! @state(class: ARTIFACT)
  edges: [DagFixtureEdge!]! @state(class: ARTIFACT)
  selectedNodeIds: [String!]! @state(class: PRESENCE)
  camera: DagCamera! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}
type DagNodeSpec { id: String! }
type DagFixtureEdge { id: String! source: String! target: String! }
type DagCamera { x: Float! y: Float! zoom: Float! }
