[package]
name = "semio-s-app-draw-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../✏️s/🔌️plugins/🖍️draw/🎛️apps/🖍️draw/🔨️modules/🖱️ui/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
draw = { path = "../../../../../../../../../✏️s/🔌️plugins/🖍️draw/🎛️apps/🖍️draw/⚡️implementations/🦀️rust", package = "semio-s-app-draw" }
draw_engine = { path = "../../../../../../../../../✏️s/🔌️plugins/🖍️draw/🎛️apps/🖍️draw/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-draw-engine" }
draw_op = { path = "../../../../../../../../../✏️s/🔌️plugins/🖍️draw/🎛️apps/🖍️draw/🔨️modules/🔧️op/⚡️implementations/🦀️rust", package = "semio-s-app-draw-op" }
draw_protocol = { path = "../../../../../../../../../✏️s/🔌️plugins/🖍️draw/🎛️apps/🖍️draw/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-s-app-draw-protocol" }
fsm = { path = "../../../../../../../../../✏️s/🔌️plugins/🖍️draw/🔨️modules/🔄️fsm/⚡️implementations/🦀️rust", package = "semio-s-plugin-draw-fsm" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
serde = { version = "1.0.219", features = ["derive"] }
