syntax = "proto3";
package semio.app.draw.draw;
message DrawConfig {
  // @state local-ui
  repeated string selected_ids = 1;
  // @state local-ui
  optional string hovered_id = 2;
  // @state local-ui
  string engagement_input = 3;
  // @state local-ui
  DrawCamera camera = 4;
  // @state local-ui
  string active_utility_id = 5;
  // @state local-ui
  string locale = 6;
}
message DrawCamera { double x = 1; double y = 2; double zoom = 3; }
