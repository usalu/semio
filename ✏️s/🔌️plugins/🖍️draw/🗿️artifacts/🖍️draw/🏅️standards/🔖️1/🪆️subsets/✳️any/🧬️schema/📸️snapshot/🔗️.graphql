# 📸️ Mirrors Rust `DrawSnapshot` (persisted draw document snapshot — artifact-lane fields only;
# sibling `🦀️.rs`). Nested types imported from the artifact's own root schema so every
# facet of the draw artifact agrees on the same `DrawLayerNode`/`DrawImageAsset`/`DrawArtboard`.
# import DrawLayerNode from "../🔗️.graphql"
# import DrawImageAssetEntry from "../🔗️.graphql"
# import DrawImageAsset from "../🔗️.graphql"
# import DrawArtboard from "../🔗️.graphql"

type DrawSnapshot {
  schema: String! @state(class: ARTIFACT)
  id: String! @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  layers: [DrawLayerNode!]! @state(class: ARTIFACT)
  assets: [DrawImageAssetEntry!]! @state(class: ARTIFACT)
  artboard: DrawArtboard @state(class: ARTIFACT)
}
