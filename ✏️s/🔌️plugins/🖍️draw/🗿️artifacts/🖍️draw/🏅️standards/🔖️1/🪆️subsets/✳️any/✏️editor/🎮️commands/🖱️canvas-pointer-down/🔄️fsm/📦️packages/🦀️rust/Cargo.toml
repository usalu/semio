[package]
name = "semio-s-plugin-draw-fsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw plugin - statechart kernel, actor runtime and hosts (used by the draw app's canvas gesture machine); kept as its own crate because its proc-macro sibling cannot be merged into the main plugin crate"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📦️glue.rs"

[features]
default = ["macros", "serde"]
macros = ["dep:fsm_macros"]
serde = ["dep:serde", "dep:serde_json"]
testing = []

[dependencies]
fsm_macros = { path = "../../✨️macros/📦️packages/🦀️rust", optional = true, package = "semio-s-plugin-draw-fsm-macros" }
semio-framework-dispatch-macros = { path = "../../../../../../../../../../../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust" }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.71"
js-sys = "0.3.83"

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../../../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
