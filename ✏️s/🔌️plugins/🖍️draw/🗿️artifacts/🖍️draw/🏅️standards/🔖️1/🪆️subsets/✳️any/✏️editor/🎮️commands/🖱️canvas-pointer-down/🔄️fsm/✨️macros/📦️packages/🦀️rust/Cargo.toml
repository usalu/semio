[package]
name = "semio-s-plugin-draw-fsm-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw plugin - fsm statechart! proc-macro (draw-fsm's sibling; a proc-macro crate can never be merged into a normal rlib/cdylib crate)"

[lints]
workspace = true

[lib]
proc-macro = true
path = "📦️glue.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../../../../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
