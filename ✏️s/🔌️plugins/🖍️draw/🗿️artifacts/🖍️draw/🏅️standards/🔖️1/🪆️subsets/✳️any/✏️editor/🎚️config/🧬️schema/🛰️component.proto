syntax = "proto3";
package semio.app.draw.draw;
message DrawConfig {
  // @state config
  string engagement_input = 1;
  // @state config
  DrawCamera camera = 2;
  // @state config
  string active_utility_id = 3;
  // @state config
  string locale = 4;
  uint64 trace_pointer_generation = 5;
  uint64 trace_pointer_completed_work = 6;
  uint64 trace_pointer_pending_work = 7;
}
message DrawCamera { double x = 1; double y = 2; double zoom = 3; }
