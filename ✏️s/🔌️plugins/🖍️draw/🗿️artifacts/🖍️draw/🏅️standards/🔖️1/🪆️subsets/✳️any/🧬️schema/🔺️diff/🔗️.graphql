# 🔺️ Mirrors Rust `DrawDiff` (sparse field delta over the draw artifact; sibling `🦀️.rs`).
# A Rust `Option<Option<T>>` field collapses to a plain nullable `T` here, same as every other
# optional field — GraphQL already conflates "absent" with "explicit null". Nested types imported
# from the artifact's own root schema so every facet of the draw artifact agrees on the same
# `DrawLayerNode`/`DrawImageAsset`/`DrawArtboard`/`DrawArtifact`.
# import DrawArtifact from "../🔗️.graphql"
# import DrawLayerNode from "../🔗️.graphql"
# import DrawImageAsset from "../🔗️.graphql"
# import DrawArtboard from "../🔗️.graphql"

type DrawDiff {
  artifact: DrawArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  layers: DrawLayersDelta @state(class: ARTIFACT)
  assets: DrawAssetsDelta @state(class: ARTIFACT)
  artboard: DrawArtboard @state(class: ARTIFACT)
  selectedIds: DrawStringList @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  engagementInput: String @state(class: CONFIG)
  cameraX: Float @state(class: CONFIG)
  cameraY: Float @state(class: CONFIG)
  cameraZoom: Float @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  hoveredId: String @state(class: ARTIFACT)
}

# 🗂️ Mirrors Rust `DrawAssetsDelta` — asset-map wrapper so optional map diffs stay scalar across
# formats; a null `value` marks a removed asset.
type DrawAssetsDelta {
  entries: [DrawAssetsDeltaEntry!]!
}

type DrawAssetsDeltaEntry {
  key: String!
  value: DrawImageAsset
}

# 📋 Mirrors Rust `DrawStringList` — string-list wrapper so optional list diffs stay scalar across
# formats.
type DrawStringList {
  values: [String!]!
}

# 🧩 Mirrors Rust `DrawLayersDelta` — identified-collection delta for `layers`.
type DrawLayersDelta {
  added: [DrawLayerAddition!]!
  removed: [String!]!
  patched: [DrawLayerPatchEntry!]!
  reordered: [String!]
}

# ➕️ Mirrors Rust `DrawLayerAddition` — one inserted layer with its real (parent, index) target
# location.
type DrawLayerAddition {
  parentId: String
  index: Int!
  layer: DrawLayerNode!
}

# 🩹 Mirrors Rust `DrawLayerPatchEntry` — one patched layer entry.
type DrawLayerPatchEntry {
  id: String!
  patch: DrawLayerPatch!
}

# 🩹 Mirrors Rust `DrawLayerPatch` — sparse layer field patch (JSON blobs for complex nested values:
# transform/fill/stroke/trace params are re-serialized rather than typed directly).
type DrawLayerPatch {
  visible: Boolean
  locked: Boolean
  name: String
  opacity: Float
  blendMode: String
  transformJson: String
  fillJson: String
  strokeJson: String
  booleanOperation: String
  traceParamsJson: String
  layerJson: String
}
