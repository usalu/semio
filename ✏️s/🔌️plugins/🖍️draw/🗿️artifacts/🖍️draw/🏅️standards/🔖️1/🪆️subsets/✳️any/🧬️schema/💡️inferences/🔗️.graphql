# 💡️ Draw inference schema — layer-tree topology (structural pre-order + nesting depth).

type DrawInference {
  topology: DrawTopology! @derived
}

type DrawTopology {
  topoOrder: [String!]!
  depth: [DrawTopologyDepthEntry!]!
  cycleFree: Boolean!
  nodeCount: Int!
}

type DrawTopologyDepthEntry {
  id: String!
  depth: Int!
}
