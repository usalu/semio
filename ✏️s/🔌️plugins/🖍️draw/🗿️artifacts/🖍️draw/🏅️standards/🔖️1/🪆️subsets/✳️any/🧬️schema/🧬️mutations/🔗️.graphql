# 🧩️ Mirrors Rust `DrawMutation` — closed semantic mutation vocabulary for the draw document
# (sibling `🦀️.rs`, `#[serde(tag = "mutation", rename_all = "camelCase")]`), same
# declaration order as the already-correct `🟦️.ts` sibling this file matches field-for-
# field. Shared value types imported from the artifact's own root schema so every facet of the draw
# artifact agrees on the same `DrawLayerNode`.
# import DrawLayerNode from "../🔗️.graphql"

type SetLayerVisible {
  layerId: String!
  visible: Boolean!
}

type SetLayerLocked {
  layerId: String!
  locked: Boolean!
}

type SetLayerOpacity {
  layerId: String!
  opacity: Float!
}

type SetLayerBlendMode {
  layerId: String!
  blendMode: String!
}

type RenameLayer {
  layerId: String!
  newName: String!
}

# 🔄️ Mirrors Rust `DrawTransform` (`🗿️artifacts/🖍️draw/🦀️.rs`).
type DrawTransform {
  x: Float!
  y: Float!
  scaleX: Float!
  scaleY: Float!
  rotation: Float!
}

type UpdateLayerTransform {
  layerId: String!
  transform: DrawTransform!
}

# 🎨️ Mirrors Rust `GradientStop` (`🗿️artifacts/🖍️draw/🦀️.rs`).
type GradientStop {
  offset: Float!
  color: [Float!]!
}

# 🎨️ Mirrors Rust `FillStyle` (`🗿️artifacts/🖍️draw/🦀️.rs`), tagged on `kind`.
type FillStyleSolid {
  color: [Float!]!
}

type FillStyleLinearGradient {
  x1: Float!
  y1: Float!
  x2: Float!
  y2: Float!
  stops: [GradientStop!]!
}

type FillStyleRadialGradient {
  cx: Float!
  cy: Float!
  r: Float!
  stops: [GradientStop!]!
}

union FillStyle = FillStyleSolid | FillStyleLinearGradient | FillStyleRadialGradient

type ReplaceLayerFill {
  layerId: String!
  fill: FillStyle
}

# ✏️ Mirrors Rust `StrokeStyle` (`🗿️artifacts/🖍️draw/🦀️.rs`).
type StrokeStyle {
  color: [Float!]!
  width: Float!
  cap: String!
  join: String!
  dash: [Float!]
}

type ReplaceLayerStroke {
  layerId: String!
  stroke: StrokeStyle
}

type SetLayerBooleanOperation {
  layerId: String!
  booleanOperation: String!
}

# 🔧 Mirrors Rust `DrawTraceParams` (`🗿️artifacts/🖍️draw/🦀️.rs`).
type DrawTraceParams {
  threshold: Float!
  simplifyEpsilon: Float!
}

type UpdateLayerTraceParams {
  layerId: String!
  params: DrawTraceParams!
}

type CreateLayer {
  parentId: String
  index: Int
  layer: DrawLayerNode!
}

type DuplicateLayer {
  layerId: String!
}

type DeleteLayer {
  layerId: String!
}

type ReorderLayer {
  layerId: String!
  parentId: String
  index: Int!
}

union DrawMutation =
    SetLayerVisible
  | SetLayerLocked
  | SetLayerOpacity
  | SetLayerBlendMode
  | RenameLayer
  | UpdateLayerTransform
  | ReplaceLayerFill
  | ReplaceLayerStroke
  | SetLayerBooleanOperation
  | UpdateLayerTraceParams
  | CreateLayer
  | DuplicateLayer
  | DeleteLayer
  | ReorderLayer
