semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-persistent = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-draw-drawing-editor-interaction = { workspace = true }
semio-s-artifact-draw-drawing-geometry = { workspace = true }
