[package]
name = "semio-s-plugin-draw-fsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw plugin - statechart kernel, actor runtime and hosts (used by the drawing app's canvas gesture machine); kept as its own crate because its proc-macro sibling cannot be merged into the main plugin crate"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "📚️library/🦀️.rs"

[features]
default = ["macros"]
macros = ["dep:fsm_macros"]
testing = []

[dependencies]
fsm_macros = { path = "../../✨️macros/📦️packages/🦀️rust", optional = true, package = "semio-s-plugin-draw-fsm-macros" }
semio-framework-dispatch-macros = { path = "../../../../../../../../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust" }
semio-framework-os-kernel = { path = "../../../../../../../../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-value-derive = { path = "../../../../../../../../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
