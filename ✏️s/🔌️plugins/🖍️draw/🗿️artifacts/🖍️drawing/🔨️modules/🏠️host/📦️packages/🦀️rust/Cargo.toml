[package]
workspace = "../../../.."
name = "semio-s-artifact-draw-drawing-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Drawing host: the retained store owner, its mutation authorities and the store initialization job"

[package.metadata.semio]
role = "library"

[lints]
