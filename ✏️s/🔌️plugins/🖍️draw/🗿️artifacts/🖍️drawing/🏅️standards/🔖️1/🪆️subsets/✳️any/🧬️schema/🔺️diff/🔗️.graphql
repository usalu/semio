# 🔺️ Mirrors Rust `DrawingDiff` (sparse field delta over the drawing artifact; sibling `🦀️.rs`).
# A Rust `Option<Option<T>>` field collapses to a plain nullable `T` here, same as every other
# optional field — GraphQL already conflates "absent" with "explicit null". Nested types imported
# from the artifact's own root schema so every facet of the drawing artifact agrees on the same
# `DrawingLayerNode`/`DrawingImageAsset`/`DrawingArtboard`.
# import PathSegment from "../🔗️.graphql"
# import DrawingLayerNode from "../🔗️.graphql"
# import DrawingImageAsset from "../🔗️.graphql"
# import DrawingArtboard from "../🔗️.graphql"

type DrawingDiff {
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  layers: DrawingLayersDelta @state(class: ARTIFACT)
  assets: DrawingAssetsDelta @state(class: ARTIFACT)
  artboard: DrawingArtboard @state(class: ARTIFACT)
}

# 🗂️ Mirrors Rust `DrawingAssetsDelta` — asset-map wrapper so optional map diffs stay scalar across
# formats; a null `value` marks a removed asset.
type DrawingAssetsDelta {
  entries: [DrawingAssetsDeltaEntry!]!
}

type DrawingAssetsDeltaEntry {
  key: String!
  value: DrawingImageAsset
}

# 📋 Mirrors Rust `DrawingStringList` — string-list wrapper so optional list diffs stay scalar across
# formats.
type DrawingStringList {
  values: [String!]!
}

# 🧩 Mirrors Rust `DrawingLayersDelta` — positional delta for the layer tree (per container, no order list, no anchor).
type DrawingLayersDelta {
  removed: [DrawingLayerRemoval!]!
  inserted: [DrawingLayerInsertion!]!
  moved: [DrawingLayerRelocation!]!
  modified: [DrawingLayerModification!]!
}

# 📍️ Mirrors Rust `DrawingLayerAddress` — the child list of `parentId` (root when absent) at `index`.
type DrawingLayerAddress {
  parentId: String
  index: Int!
}

# ➖️ Mirrors Rust `DrawingLayerRemoval` — one removed layer subtree at its BASE address.
type DrawingLayerRemoval {
  id: String!
  parentId: String
  index: Int!
}

# ➕️ Mirrors Rust `DrawingLayerInsertion` — one inserted layer subtree at its AFTER address.
type DrawingLayerInsertion {
  parentId: String
  index: Int!
  layer: DrawingLayerNode!
}

# ↕️ Mirrors Rust `DrawingLayerRelocation` — one repositioned layer subtree: its BASE and its AFTER address.
type DrawingLayerRelocation {
  id: String!
  from: DrawingLayerAddress!
  to: DrawingLayerAddress!
}

# 🩹 Mirrors Rust `DrawingLayerModification` — one modified layer entry.
type DrawingLayerModification {
  id: String!
  patch: DrawingLayerPatch!
}

# 🩹 Mirrors Rust `DrawingLayerPatch` — sparse layer field patch (JSON blobs for complex nested values:
# transform/fill/stroke/trace params are re-serialized rather than typed directly).
enum FillRule { evenodd nonzero }
type DrawingLayerPatch {
  visible: Boolean
  locked: Boolean
  name: String
  opacity: Float
  blendMode: String
  fillRule: FillRule
  transform: DrawingTransform
  fill: DrawingFillPatch
  stroke: DrawingStrokePatch
  booleanOperation: String
  traceParams: DrawingTraceParams
  layer: DrawingLayerNode
  pathSegments: [PathSegment!]
  textContent: String
  textSize: Float
  imageKey: String
  imageWidth: Float
  imageHeight: Float
  shapeCoordinates: [DrawingShapeCoordinatePatch!]
}

# import DrawingTransform from "../🧬️mutations/🔗️.graphql"
# import DrawingTraceParams from "../🧬️mutations/🔗️.graphql"
# import FillStyle from "../🧬️mutations/🔗️.graphql"
# import StrokeStyle from "../🔗️.graphql"
type DrawingFillPatch { value: FillStyle }
type DrawingStrokePatch { value: StrokeStyle }

type DrawingShapeCoordinatePatch {
  field: String!
  index: Int
  value: Float!
}
