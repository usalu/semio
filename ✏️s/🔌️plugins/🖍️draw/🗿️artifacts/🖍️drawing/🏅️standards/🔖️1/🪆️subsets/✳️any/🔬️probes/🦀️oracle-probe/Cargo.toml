# 🧭️ Own workspace root. The repository's root Cargo.toml is a shared, leased manifest that concurrent
# sessions edit, and this crate must also stay OUT of the plugin's dependency graph: it links no
# repository crate at all, only the one approved third-party reader. That isolation is deliberate — it
# is what lets the probe build and run while `semio-s-plugin-stdio` is mid-refactor, and it is what
# guarantees the reader shares no code with the implementation it adjudicates.
# See ../../../../../../../../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/✳️drawing/🔬️probes/🦀️oracle-probe/Cargo.toml
# for the same standalone-workspace pattern (this crate mirrors only its `svg` leg — `drawing`'s own
# dwg/dxf/pdf/png exports are confirmed stubs, see this subset's 🔣️oracle.json rationale).
[workspace]

[package]
name = "semio-drawing-oracle-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "🔬️ Third-party carrier reader for s.draw.drawing@1/✳️any — reads the exported SVG and reports what it found. Computes no mutation semantics."

[[bin]]
name = "semio-drawing-oracle-probe"
path = "🦀️.rs"

# 🔮️ TEST-ONLY BY CONSTRUCTION, AND A READER ONLY. Already an approved `test-oracle` entry in the
# repository's 🔒️dependencies.json (registered for `semio@v1/drawing`'s, `svg@1.1/any`'s, `bcf`'s,
# `docx`'s, `xlsx`'s and `pptx`'s own oracles). It is never asked what a mutation should produce — see
# this subset's 🔣️oracle.json.
[dependencies]
quick-xml = "0.42"
