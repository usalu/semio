syntax = "proto3";
package semio.s.draw.drawing.artifact;

// 🧬️ Drawing artifact schema — every field with its state class.

message DrawingArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  string id = 2;
  // @state artifact
  optional string title = 3;
  // @state artifact
  repeated DrawingLayerNode layers = 4;
  // @state artifact
  map<string, DrawingImageAsset> assets = 5;
  // @state artifact
  optional DrawingArtboard artboard = 6;
  // @state presence
  // @state config
}

message DrawingLayerNode {
  string kind = 1;
  DrawingAttributes attributes = 2;
}

enum StrokeCap { STROKE_CAP_BUTT = 0; STROKE_CAP_ROUND = 1; STROKE_CAP_SQUARE = 2; }
enum StrokeJoin { STROKE_JOIN_MITER = 0; STROKE_JOIN_ROUND = 1; STROKE_JOIN_BEVEL = 2; }
message StrokeStyle {
  repeated double color = 1;
  double width = 2;
  StrokeCap cap = 3;
  StrokeJoin join = 4;
  repeated double dash = 5;
}
enum FillRule { FILL_RULE_EVENODD = 0; FILL_RULE_NONZERO = 1; }
message DrawingAttributes { optional StrokeStyle stroke = 1; FillRule fill_rule = 2; }

message DrawingImageSample { uint32 red = 1; uint32 green = 2; uint32 blue = 3; uint32 alpha = 4; }
message DrawingImageAsset {
  uint32 width = 1;
  uint32 height = 2;
  repeated DrawingImageSample samples = 3;
}

message DrawingArtboard {
  double width = 1;
  double height = 2;
}

// ✏️ Typed path geometry shared by editing and persistence.
message PathPoint { double x = 1; double y = 2; }
message PathMove { PathPoint to = 1; }
message PathLine { PathPoint to = 1; }
message PathQuad { PathPoint ctrl = 1; PathPoint to = 2; }
message PathCubic { PathPoint ctrl1 = 1; PathPoint ctrl2 = 2; PathPoint to = 3; }
message PathArc { double rx = 1; double ry = 2; double rotation = 3; bool large_arc = 4; bool sweep = 5; PathPoint to = 6; }
message PathClose {}
message PathSegment {
  oneof segment {
    PathMove move = 1;
    PathLine line = 2;
    PathQuad quad = 3;
    PathCubic cubic = 4;
    PathArc arc = 5;
    PathClose close = 6;
  }
}

message DrawingGradientStop { double offset=1;repeated double color=2; }
message DrawingSolidFill { repeated double color=1; }
message DrawingLinearGradientFill { double x1=1;double y1=2;double x2=3;double y2=4;repeated DrawingGradientStop stops=5; }
message DrawingRadialGradientFill { double cx=1;double cy=2;double r=3;repeated DrawingGradientStop stops=4; }
message FillStyle { oneof value { DrawingSolidFill solid=1;DrawingLinearGradientFill linear_gradient=2;DrawingRadialGradientFill radial_gradient=3; } }
