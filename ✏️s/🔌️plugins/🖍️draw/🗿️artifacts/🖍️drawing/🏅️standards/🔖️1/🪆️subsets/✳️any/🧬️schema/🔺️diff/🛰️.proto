syntax = "proto3";
package semio.s.draw.drawing.diff;
import "✏️s/🔌️plugins/🖍️draw/🗿️artifacts/🖍️drawing/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

message DrawingAssetsDeltaEntry { string key = 1; optional semio.s.draw.drawing.artifact.DrawingImageAsset value = 2; }
message DrawingAssetsDelta { repeated DrawingAssetsDeltaEntry entries = 1; }
message DrawingLayersDelta {
  repeated DrawingLayerAddition added = 1;
  repeated string removed = 2;
  repeated DrawingLayerPatchEntry patched = 3;
  repeated string reordered = 4;
}
message DrawingLayerAddition {
  optional string parent_id = 1;
  uint64 index = 2;
  semio.s.draw.drawing.artifact.DrawingLayerNode layer = 3;
}
message DrawingLayerPatchEntry { string id = 1; DrawingLayerPatch patch = 2; }
message DrawingLayerPatch {
  optional bool visible = 1;
  optional bool locked = 2;
  optional string name = 3;
  optional double opacity = 4;
  optional string blend_mode = 5;
  optional string transform_json = 6;
  optional string fill_json = 7;
  optional string stroke_json = 8;
  optional string boolean_operation = 9;
  optional string trace_params_json = 10;
  optional string layer_json = 11;
}
message DrawingDiff {
  optional semio.s.draw.drawing.artifact.DrawingArtifact artifact = 1;
  optional string schema = 2;
  optional string id = 3;
  optional string title = 4;
  optional DrawingLayersDelta layers = 5;
  optional DrawingAssetsDelta assets = 6;
  optional semio.s.draw.drawing.artifact.DrawingArtboard artboard = 7;
}
