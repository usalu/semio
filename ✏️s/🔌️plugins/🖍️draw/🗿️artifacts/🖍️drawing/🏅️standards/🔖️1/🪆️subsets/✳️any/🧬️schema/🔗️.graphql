# 🧬️ Drawing artifact schema — every field with its state class.

type DrawingArtifact {
  schema: String! @state(class: ARTIFACT)
  id: String! @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  layers: [DrawingLayerNode!]! @state(class: ARTIFACT)
  assets: [DrawingImageAssetEntry!]! @state(class: ARTIFACT)
  artboard: DrawingArtboard @state(class: ARTIFACT)
}

type DrawingLayerNode {
  kind: String!
}

type DrawingImageAssetEntry {
  key: String!
  value: DrawingImageAsset!
}

type DrawingImageAsset {
  mime: String!
  data: String!
  width: Int
  height: Int
}

type DrawingArtboard {
  width: Float!
  height: Float!
}

# ✏️ Typed path geometry shared by editing and persistence.
type PathPoint { x: Float! y: Float! }
type PathMove { to: PathPoint! }
type PathLine { to: PathPoint! }
type PathQuad { ctrl: PathPoint! to: PathPoint! }
type PathCubic { ctrl1: PathPoint! ctrl2: PathPoint! to: PathPoint! }
type PathArc { rx: Float! ry: Float! rotation: Float! largeArc: Boolean! sweep: Boolean! to: PathPoint! }
type PathClose { kind: String! }
union PathSegment = PathMove | PathLine | PathQuad | PathCubic | PathArc | PathClose
