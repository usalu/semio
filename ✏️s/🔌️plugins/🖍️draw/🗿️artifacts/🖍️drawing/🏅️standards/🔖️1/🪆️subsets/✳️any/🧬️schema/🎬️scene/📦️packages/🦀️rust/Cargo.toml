[package]
workspace = "../../../../../../../.."
name = "semio-s-artifact-draw-drawing-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Drawing scene: preparation, paint, raster, booleans, trace and text of the flattened drawing scene"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
testkit = ["dep:serde", "semio-s-artifact-draw-drawing-geometry/testkit", "semio-s-artifact-draw-drawing-model/testkit"]

