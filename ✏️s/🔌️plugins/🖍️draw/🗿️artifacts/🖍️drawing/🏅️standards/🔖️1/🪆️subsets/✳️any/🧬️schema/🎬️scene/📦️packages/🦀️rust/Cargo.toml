semio-framework-2d-text-font-catalog = { path = "../../../../../../../../../../../../../🧰️framework/🔨️modules/◻️2d/📝️text/🔤️font/📇️catalog/📦️packages/🦀️rust" }
semio-framework-2d-text-font-run = { path = "../../../../../../../../../../../../../🧰️framework/🔨️modules/◻️2d/📝️text/🔤️font/🧵️run/📦️packages/🦀️rust" }
semio-framework-2d-text-font-shape-unicode = { path = "../../../../../../../../../../../../../🧰️framework/🔨️modules/◻️2d/📝️text/🔤️font/🧵️shape/🌐️unicode/📦️packages/🦀️rust" }
