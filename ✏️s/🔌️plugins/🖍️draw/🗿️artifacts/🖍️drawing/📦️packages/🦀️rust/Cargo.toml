[package]
workspace = "../.."
name = "semio-s-artifact-draw-drawing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Drawing artifact — registration and composition of the drawing family"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-artifact-reference = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-dsl-record-derive = { workspace = true }
semio-framework-graph-manifest = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-draw-drawing-diff = { workspace = true }
semio-s-artifact-draw-drawing-editor = { workspace = true }
semio-s-artifact-draw-drawing-host = { workspace = true }
semio-s-artifact-draw-drawing-io = { workspace = true }
semio-s-artifact-draw-drawing-model = { workspace = true }
semio-s-artifact-draw-drawing-mutations = { workspace = true }
semio-s-artifact-draw-drawing-read = { workspace = true }
semio-s-artifact-draw-drawing-viewer = { workspace = true }
semio-s-artifact-draw-drawing-write = { workspace = true }

[dev-dependencies]
png = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["mutation-testing", "protocol-laws"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
