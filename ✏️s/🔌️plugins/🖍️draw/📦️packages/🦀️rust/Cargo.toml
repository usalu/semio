[package]
name = "semio-s-plugin-draw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Draw plugin - one crate for the draw artifact (diff/op/dsl/pack/spr/engine) and the draw play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:draw"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "draw"
ports = { react = 6064, wgpu = 6164 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio" }
fsm = { path = "../../🔄️fsm/📦️packages/🦀️rust", package = "semio-s-plugin-draw-fsm" }
semio_s_2d = { path = "../../../../../🧰️framework/🔨️modules/◻2d/📦️packages/🦀️rust", package = "semio-framework-2d" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
