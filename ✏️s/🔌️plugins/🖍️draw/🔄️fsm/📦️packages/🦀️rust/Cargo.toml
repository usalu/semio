# 🚧️ TEMPORARY verification-only overlay (TEMPLATE.md §3 chicken-and-egg): the `cargo-features`
# line + `[workspace]` (and the `[workspace.lints.*]`/`[profile.*]` blocks further down) make this
# crate its own workspace root so it can be `cargo check`ed via --manifest-path before the
# registrar adds it to the real root workspace. DELETE all of these at registrar handoff.
cargo-features = ["trim-paths"]

[package]
name = "semio-s-plugin-draw-fsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Draw plugin - statechart kernel, actor runtime and hosts (used by the draw app's canvas gesture machine); kept as its own crate because its proc-macro sibling cannot be merged into the main plugin crate"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../📦️lib.rs"

[features]
default = ["macros", "serde"]
macros = ["dep:fsm_macros"]
serde = ["dep:serde", "dep:serde_json"]
testing = []

[dependencies]
fsm_macros = { path = "../../✨️macros/📦️packages/🦀️rust", optional = true, package = "semio-s-plugin-draw-fsm-macros" }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.140", optional = true }
thiserror = "2.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"

[dev-dependencies]

[workspace]

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3
