[workspace]
members = ["."]

[workspace.metadata.semio.repository]
exclude-patterns = []
schema-version = 1
member-manifests = ["Cargo.toml"]

[package]
name = "semio-s-plugin-stdio-document-test-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "🔮️ Owned independent test oracle provider"

[package.metadata.semio]
role = "test"

[lib]
name = "semio_s_plugin_stdio_document_test_oracle"
path = "../../🦀️.rs"

[dependencies]
"lopdf" = { version = "0.44", default-features = false }
"pdf-writer" = { version = "0.15" }
"quick-xml" = { version = "0.42" }
"semio-repo-test-host" = { path = "../../../../../../../🧰️framework/🛍️products/🦑️repo/🔨️modules/🧪️test/📦️packages/🦀️rust", default-features = false }
"zip" = { version = "6", default-features = false, features = ["deflate"] }
