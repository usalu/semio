[workspace]
members = ["."]

[workspace.metadata.semio.repository]
exclude-patterns = []
schema-version = 1
member-manifests = ["Cargo.toml"]

[package]
name = "semio-s-plugin-stdio-raster-test-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "🔮️ Owned independent test oracle provider"

[package.metadata.semio]
role = "test"

[lib]
name = "semio_s_plugin_stdio_raster_test_oracle"
path = "../../🦀️.rs"

[dependencies]
"gif" = { version = "0.13" }
"image" = { version = "0.25", default-features = false, features = ["bmp", "tiff", "jpeg"] }
"png" = { version = "0.18" }
"semio-repo-test-host" = { path = "../../../../../../../🧰️framework/🛍️products/🦑️repo/🔨️modules/🧪️test/📦️packages/🦀️rust", default-features = false }
