# 🧭️ Own workspace root, exactly like the AVI/any sibling's `riff-avi-codec`
# (../../../../../📼️avi/🏅️standards/🔖️1.0/🪆️subsets/✳️any/🏭️generator/🔁️codec/📦️packages/🦀️rust/Cargo.toml)
# — never joins the repository's root workspace or its Cargo.lock.
[workspace]
members = ["."]

[workspace.metadata.semio.repository]
exclude-patterns = []
schema-version = 1
member-manifests = ["Cargo.toml"]

[package]
name = "quick-xml-svg-codec"
version = "0.1.0"
edition = "2021"

[dependencies]
quick-xml = "0.42"

[[bin]]
name = "quick-xml-svg-codec"
path = "../../🦀️.rs"
