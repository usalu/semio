# 🌳 `XmlAttr`/`XmlNode`/`XmlDeclaration` are NOT redefined here -- `SvgSnapshot.doc` wraps an
# XmlDocument and `SvgDiff` diffs that same node tree directly (spec-mandated reuse of xml's NODE
# model; svg's DIFF types below are its own), so this facet relies on 📰xml's own
# `📸️snapshot/🔗️component.graphql` types being present in the assembled schema, exactly as
# `stdio.xml`'s own diff/mutations facets rely on `XmlSnapshot` without locally redefining it.

""" 🔺️ Diff for `stdio.svg`. `declaration`/`doctype` are tri-state scalars: the field is absent
from the payload when unchanged; represented here as plain nullable fields since GraphQL has no
native tri-state -- the wire encoding (JSON, via the sibling `.json`/`.ts` facets) is authoritative
for the absent/null/set distinction. """
type SvgDiff {
  declaration: XmlDeclaration
  doctype: String
  root: SvgNodeDiff
}

enum SvgNodeDiffKind {
  ELEMENT
  TEXT
  REPLACE
}

""" 🌳 Recursive per-node diff -- tagged union flattened like `XmlNode`. """
type SvgNodeDiff {
  kind: SvgNodeDiffKind!
  name: String
  attributes: SvgAttributesDiff
  children: SvgChildrenDiff
  text: String
  node: XmlNode
}

type SvgAttrModified {
  name: String!
  value: String!
}

type SvgAttrAdded {
  index: Int!
  name: String!
  value: String!
}

""" 🏷️ Name-keyed, order-preserving attribute triple. """
type SvgAttributesDiff {
  removed: [String!]!
  modified: [SvgAttrModified!]!
  added: [SvgAttrAdded!]!
}

type SvgChildModified {
  index: Int!
  diff: SvgNodeDiff!
}

type SvgChildAdded {
  index: Int!
  item: XmlNode!
}

""" 🌳 Index-keyed, recursive children triple. """
type SvgChildrenDiff {
  removed: [Int!]!
  modified: [SvgChildModified!]!
  added: [SvgChildAdded!]!
}
