syntax = "proto3";
package semio.s_stdio_svg.diff;

import "s_stdio_xml/snapshot.proto";

// 🌳 svg embeds xml's NODE model directly (per the plan's spec-mandated-reuse rule) but declares
// its own DIFF messages below -- `semio.s_stdio_xml.snapshot.XmlNode`/`XmlDeclaration` are the
// real, canonical messages (see 📰xml's own `📸️snapshot/🛰️component.proto`), never redefined here.

message SvgDiff {
  optional NullableXmlDeclaration declaration = 1;
  optional NullableString doctype = 2;
  optional SvgNodeDiff root = 3;
}

// 🏳️ Tri-state wrapper: unset `NullableXmlDeclaration` field on `SvgDiff` = unchanged; present
// with `is_null = true` = cleared; present with `value` set = set to that value.
message NullableXmlDeclaration {
  bool is_null = 1;
  semio.s_stdio_xml.snapshot.XmlDeclaration value = 2;
}

message NullableString {
  bool is_null = 1;
  string value = 2;
}

message SvgNodeDiff {
  oneof diff {
    SvgElementDiff element = 1;
    SvgTextDiff text = 2;
    SvgReplaceDiff replace = 3;
  }
}

message SvgElementDiff {
  optional string name = 1;
  optional SvgAttributesDiff attributes = 2;
  optional SvgChildrenDiff children = 3;
}

message SvgTextDiff {
  optional string text = 1;
}

message SvgReplaceDiff {
  semio.s_stdio_xml.snapshot.XmlNode node = 1;
}

message SvgAttrModified {
  string name = 1;
  string value = 2;
}

message SvgAttrAdded {
  uint64 index = 1;
  string name = 2;
  string value = 3;
}

message SvgAttributesDiff {
  repeated string removed = 1;
  repeated SvgAttrModified modified = 2;
  repeated SvgAttrAdded added = 3;
}

message SvgChildModified {
  uint64 index = 1;
  SvgNodeDiff diff = 2;
}

message SvgChildAdded {
  uint64 index = 1;
  semio.s_stdio_xml.snapshot.XmlNode item = 2;
}

message SvgChildrenDiff {
  repeated uint64 removed = 1;
  repeated SvgChildModified modified = 2;
  repeated SvgChildAdded added = 3;
}
