syntax = "proto3";
package semio.s.stdio.las.inference;

// 💡️ Las inference schema — header-declared bounding box and point count.

message LasInference {
  // @state inferred
  LasBounds bounds = 1;
}

message LasBounds {
  double min_x = 1;
  double min_y = 2;
  double min_z = 3;
  double max_x = 4;
  double max_y = 5;
  double max_z = 6;
  uint32 point_count = 7;
}
