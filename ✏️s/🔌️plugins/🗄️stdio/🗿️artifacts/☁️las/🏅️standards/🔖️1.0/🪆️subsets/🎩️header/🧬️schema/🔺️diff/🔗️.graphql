# 🔺️ LasDiff
type LasVlrDiff {
  userId: String
  recordId: Int
  description: String
  data: [Int!]
}

type LasVlrModified {
  index: Int!
  diff: LasVlrDiff!
}

type LasVlrAdded {
  index: Int!
  vlr: LasVlr!
}

type LasVlrsDiff {
  removed: [Int!]!
  modified: [LasVlrModified!]!
  added: [LasVlrAdded!]!
}

type LasPointDiff {
  x: Float
  y: Float
  z: Float
  intensity: Int
  returnNumber: Int
  numberOfReturns: Int
  scanDirectionFlag: Boolean
  edgeOfFlightLine: Boolean
  classification: Int
  scanAngleRank: Int
  userData: Int
  pointSourceId: Int
  gpsTime: Float
  rgb: [Int!]
}

type LasPointModified {
  index: Int!
  diff: LasPointDiff!
}

type LasPointAdded {
  index: Int!
  point: LasPoint!
}

type LasPointsDiff {
  removed: [Int!]!
  modified: [LasPointModified!]!
  added: [LasPointAdded!]!
}

# Every real header field is a top-level scalar; schema is an identity field and never appears here.
type LasDiff {
  versionMajor: Int
  versionMinor: Int
  systemIdentifier: String
  generatingSoftware: String
  creationDayOfYear: Int
  creationYear: Int
  headerSize: Int
  offsetToPointData: Int
  numberOfVlrs: Int
  pointDataFormatId: Int
  pointDataRecordLength: Int
  numberOfPointRecords: Int
  pointsByReturn: [Int!]
  xScale: Float
  yScale: Float
  zScale: Float
  xOffset: Float
  yOffset: Float
  zOffset: Float
  maxX: Float
  minX: Float
  maxY: Float
  minY: Float
  maxZ: Float
  minZ: Float
  vlrs: LasVlrsDiff
  points: LasPointsDiff
}
