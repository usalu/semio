# 🧬️ PngArtifact schema facet — full artifact state, mirrors PngSnapshot field-for-field.

enum PngColorType { GRAYSCALE RGB PALETTE GRAYSCALE_ALPHA RGBA }
enum PngSrgbIntent { PERCEPTUAL RELATIVE_COLORIMETRIC SATURATION ABSOLUTE_COLORIMETRIC }
enum PngTextKind { TEXT Z_TEXT I_TEXT }

type PngArtifactRgb { r: Int! g: Int! b: Int! }

type PngArtifactTransparency {
  colorType: String!
  alpha: [Int!]
  gray: Int
  r: Int
  g: Int
  b: Int
}

type PngArtifactChromaticities {
  whiteX: Int! whiteY: Int! redX: Int! redY: Int!
  greenX: Int! greenY: Int! blueX: Int! blueY: Int!
}

type PngArtifactPhysicalDims { ppuX: Int! ppuY: Int! unitIsMeter: Boolean! }

type PngArtifactTimestamp { year: Int! month: Int! day: Int! hour: Int! minute: Int! second: Int! }

type PngArtifactBackground { colorType: String! gray: Int r: Int g: Int b: Int index: Int }

type PngArtifactTextChunk {
  keyword: String! value: String! compressed: Boolean! kind: PngTextKind!
  languageTag: String! translatedKeyword: String!
}

type PngArtifactChunk { kind: [Int!]! data: [Int!]! }

type PngArtifactChunkMarker { chunk: String! index: Int }

type PngArtifact {
  schema: String! @state(class: ARTIFACT)
  width: Int! @state(class: ARTIFACT)
  height: Int! @state(class: ARTIFACT)
  bitDepth: Int! @state(class: ARTIFACT)
  colorType: PngColorType! @state(class: ARTIFACT)
  interlace: Boolean! @state(class: ARTIFACT)
  plte: [PngArtifactRgb!] @state(class: ARTIFACT)
  trns: PngArtifactTransparency @state(class: ARTIFACT)
  gama: Int @state(class: ARTIFACT)
  chrm: PngArtifactChromaticities @state(class: ARTIFACT)
  srgb: PngSrgbIntent @state(class: ARTIFACT)
  phys: PngArtifactPhysicalDims @state(class: ARTIFACT)
  time: PngArtifactTimestamp @state(class: ARTIFACT)
  bkgd: PngArtifactBackground @state(class: ARTIFACT)
  textChunks: [PngArtifactTextChunk!]! @state(class: ARTIFACT)
  pixels: [Int!]! @state(class: ARTIFACT)
  chunkOrder: [PngArtifactChunkMarker!]! @state(class: ARTIFACT)
  unknownChunks: [PngArtifactChunk!]! @state(class: ARTIFACT)
}
