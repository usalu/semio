# 🔺️ PngDiff schema facet — sparse structural diff, mirrors 🦀️.rs. No full-replace
# slot: index-keyed removed/modified/added triples for every collection.

type PngPlteEntryModified { index: Int! rgb: PngRgb! }
type PngPlteEntryAdded { index: Int! rgb: PngRgb! }

"Outer tri-state on PngDiff.plte: absent = unchanged, null-typed removed = chunk gone."
type PngPlteDiff {
  removed: [Int!]
  modified: [PngPlteEntryModified!]
  added: [PngPlteEntryAdded!]
}

"Sparse per-field patch for one PngTextChunk."
type PngTextChunkDiff {
  keyword: String
  value: String
  compressed: Boolean
  kind: PngTextKind
  languageTag: String
  translatedKeyword: String
}

type PngTextChunkModified { index: Int! diff: PngTextChunkDiff! }
type PngTextChunkAdded { index: Int! chunk: PngTextChunk! }

type PngTextChunksDiff {
  removed: [Int!]
  modified: [PngTextChunkModified!]
  added: [PngTextChunkAdded!]
}

type PngUnknownChunkModified { index: Int! chunk: PngChunk! }
type PngUnknownChunkAdded { index: Int! chunk: PngChunk! }

type PngUnknownChunksDiff {
  removed: [Int!]
  modified: [PngUnknownChunkModified!]
  added: [PngUnknownChunkAdded!]
}

type PngChunkOrderModified { index: Int! marker: PngChunkMarker! }
type PngChunkOrderAdded { index: Int! marker: PngChunkMarker! }

type PngChunkOrderDiff {
  removed: [Int!]
  modified: [PngChunkOrderModified!]
  added: [PngChunkOrderAdded!]
}

"Sparse diff for stdio.png. Tri-state ancillary fields use an explicit null sentinel for
'cleared' vs absent for 'unchanged' (modeled here as separate optional fields since GraphQL
has no native tri-state)."
type PngDiff {
  width: Int
  height: Int
  bitDepth: Int
  colorType: PngColorType
  interlace: Boolean
  plteChanged: Boolean
  plte: PngPlteDiff
  trnsChanged: Boolean
  trns: PngTransparency
  gamaChanged: Boolean
  gama: Int
  chrmChanged: Boolean
  chrm: PngChromaticities
  srgbChanged: Boolean
  srgb: PngSrgbIntent
  physChanged: Boolean
  phys: PngPhysicalDims
  timeChanged: Boolean
  time: PngTimestamp
  bkgdChanged: Boolean
  bkgd: PngBackground
  textChunks: PngTextChunksDiff
  pixels: [Int!]
  chunkOrder: PngChunkOrderDiff
  unknownChunks: PngUnknownChunksDiff
}
