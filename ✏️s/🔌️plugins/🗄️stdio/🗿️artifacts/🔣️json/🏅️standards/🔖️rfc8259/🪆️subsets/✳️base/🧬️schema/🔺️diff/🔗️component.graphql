# 🔺️ JsonDiff — recursive diff mirroring JsonValue's shape (see ../📸️snapshot/🔗️component.graphql).
type JsonValueDiff {
  kind: JsonValueDiffKind!
  replaceValue: JsonValue
  boolValue: Boolean
  numberLexeme: String
  stringValue: String
  arrayDiff: JsonArrayDiff
  objectDiff: JsonObjectDiff
}

enum JsonValueDiffKind {
  REPLACE
  BOOL
  NUMBER
  STRING
  ARRAY
  OBJECT
}

type JsonArrayModified {
  index: Int!
  diff: JsonValueDiff!
}
type JsonArrayAdded {
  index: Int!
  item: JsonValue!
}
type JsonArrayDiff {
  removed: [Int!]
  modified: [JsonArrayModified!]
  added: [JsonArrayAdded!]
}

type JsonObjectModified {
  key: String!
  diff: JsonValueDiff!
}
type JsonObjectAdded {
  index: Int!
  key: String!
  item: JsonValue!
}
type JsonObjectDiff {
  removed: [String!]
  modified: [JsonObjectModified!]
  added: [JsonObjectAdded!]
}

type JsonDiff {
  value: JsonValueDiff @state(class: ARTIFACT)
}
