syntax = "proto3";
package semio.s.stdio.xml.inference;

// 💡️ Xml inference schema — document outline (element count, max depth, hasDoctype).

message XmlInference {
  // @derived
  XmlOutline outline = 1;
}

message XmlOutline {
  uint32 element_count = 1;
  uint32 max_depth = 2;
  bool has_doctype = 3;
}
