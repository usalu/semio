syntax = "proto3";
package semio.s_stdio_xml.diff;

import "s_stdio_xml/snapshot.proto";

message XmlDiff {
  optional NullableXmlDeclaration declaration = 1;
  optional NullableString doctype = 2;
  optional XmlNodeDiff root = 3;
  optional XmlNodeList prolog = 4;
}

message XmlNodeList {
  repeated semio.s_stdio_xml.snapshot.XmlNode values = 1;
}

// 🏳️ Tri-state wrapper: unset `NullableXmlDeclaration` field on `XmlDiff` = unchanged;
// present with `is_null = true` = cleared; present with `value` set = set to that value.
message NullableXmlDeclaration {
  bool is_null = 1;
  semio.s_stdio_xml.snapshot.XmlDeclaration value = 2;
}

message NullableString {
  bool is_null = 1;
  string value = 2;
}

message XmlNodeDiff {
  oneof diff {
    XmlElementDiff element = 1;
    XmlTextDiff text = 2;
    XmlReplaceDiff replace = 3;
  }
}

message XmlElementDiff {
  optional string name = 1;
  optional XmlAttributesDiff attributes = 2;
  optional XmlChildrenDiff children = 3;
}

message XmlTextDiff {
  optional string text = 1;
}

message XmlReplaceDiff {
  semio.s_stdio_xml.snapshot.XmlNode node = 1;
}

message XmlAttrModified {
  string name = 1;
  string value = 2;
}

message XmlAttrAdded {
  uint64 index = 1;
  string name = 2;
  string value = 3;
}

message XmlAttributesDiff {
  repeated string removed = 1;
  repeated XmlAttrModified modified = 2;
  repeated XmlAttrAdded added = 3;
}

message XmlChildModified {
  uint64 index = 1;
  XmlNodeDiff diff = 2;
}

message XmlChildAdded {
  uint64 index = 1;
  semio.s_stdio_xml.snapshot.XmlNode item = 2;
}

message XmlChildrenDiff {
  repeated uint64 removed = 1;
  repeated XmlChildModified modified = 2;
  repeated XmlChildAdded added = 3;
}
