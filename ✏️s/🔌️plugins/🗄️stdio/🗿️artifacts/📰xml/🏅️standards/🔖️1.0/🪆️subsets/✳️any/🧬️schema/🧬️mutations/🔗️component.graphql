# 🧬 Transparent XmlMutation descriptor roster.
# set-declaration/SetDeclaration
# set-doctype/SetDoctype
# insert-element/InsertElement
# remove-element/RemoveElement
# set-attribute/SetAttribute
# set-text/SetText
enum XmlMutationKind {
  SET_DECLARATION
  SET_DOCTYPE
  INSERT_ELEMENT
  REMOVE_ELEMENT
  SET_ATTRIBUTE
  SET_TEXT
}
scalar MutationPayload
input XmlMutationInput { kind: XmlMutationKind!, payload: MutationPayload! }
