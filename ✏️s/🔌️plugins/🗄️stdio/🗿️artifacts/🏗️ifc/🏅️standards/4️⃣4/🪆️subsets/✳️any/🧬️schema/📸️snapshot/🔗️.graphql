"""🔑️ Unsigned 64-bit identity, transported as a canonical decimal string (0 through 18446744073709551615)."""
scalar IfcUInt64

"""🔢️ Signed 64-bit integer, transported as a canonical decimal string (-9223372036854775808 through 9223372036854775807)."""
scalar IfcInt64

"""📍️ Unsigned 64-bit coordinate, transported as a canonical decimal string; consumers check their addressable sequence bounds."""
scalar IfcIndex

# 🔤️ One typed value in IFC4's Part-21 argument-list syntax (own type, mirrors STEP's shape).
enum IfcValueKind {
  UNSET
  DERIVED
  INTEGER
  REAL
  STRING
  ENUM
  REFERENCE
  AGGREGATE
  TYPED_VALUE
  BINARY
}

type IfcValue {
  kind: IfcValueKind!
  intValue: IfcInt64
  referenceValue: IfcUInt64
  realValue: Float
  stringValue: String
  binaryValue: String
  aggregate: [IfcValue!]
  typedName: String
  typedArgs: [IfcValue!]
}

# 🧩️ One additional `(TYPE(args...) ...)` member of an IFC4 COMPLEX instance.
type IfcComplexType {
  name: String!
  args: [IfcValue!]!
}

# 📦️ One `#N = TYPE(args...);` IFC4 instance — id-keyed strong entity.
type IfcEntity {
  id: IfcUInt64!
  name: String!
  args: [IfcValue!]!
  complex: [IfcComplexType!]
}

# 📇️ The three standard `HEADER;` records, typed via `IfcValue`.
type IfcHeader {
  fileDescription: [IfcValue!]!
  fileName: [IfcValue!]!
  fileSchema: [IfcValue!]!
}

# 🧬️ IfcSnapshot
type IfcSnapshot {
  schema: String! @state(class: ARTIFACT)
  header: IfcHeader! @state(class: ARTIFACT)
  entities: [IfcEntity!]! @state(class: ARTIFACT)
}
