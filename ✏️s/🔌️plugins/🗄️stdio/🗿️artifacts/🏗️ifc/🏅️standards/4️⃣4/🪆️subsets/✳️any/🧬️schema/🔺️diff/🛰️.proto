syntax = "proto3";
package semio.s_stdio_ifc.diff;

import "snapshot.proto";

message IfcArgModified {
  uint64 index = 1;
  semio.s_stdio_ifc.snapshot.IfcValue value = 2;
}
message IfcArgAdded {
  uint64 index = 1;
  semio.s_stdio_ifc.snapshot.IfcValue value = 2;
}
message IfcArgsDiff {
  repeated uint64 removed = 1;
  repeated IfcArgModified modified = 2;
  repeated IfcArgAdded added = 3;
}

message IfcValues {
  repeated semio.s_stdio_ifc.snapshot.IfcValue items = 1;
}
message IfcComplexTypes {
  repeated semio.s_stdio_ifc.snapshot.IfcComplexType items = 1;
}
message IfcEntityDiff {
  optional string name = 1;
  IfcArgsDiff args = 2;
  IfcComplexTypes complex = 3;
}
message IfcEntityRemoved {
  uint64 id = 1;
  uint64 index = 2;
}
message IfcEntityModified {
  uint64 id = 1;
  IfcEntityDiff diff = 2;
}
message IfcEntityAdded {
  uint64 index = 1;
  semio.s_stdio_ifc.snapshot.IfcEntity entity = 2;
}
message IfcEntitiesDiff {
  repeated IfcEntityRemoved removed = 1;
  repeated IfcEntityModified modified = 2;
  repeated IfcEntityAdded added = 3;
}

message IfcDiff {
  IfcValues file_description = 1;
  IfcValues file_name = 2;
  IfcValues file_schema = 3;
  IfcEntitiesDiff entities = 4;
}
