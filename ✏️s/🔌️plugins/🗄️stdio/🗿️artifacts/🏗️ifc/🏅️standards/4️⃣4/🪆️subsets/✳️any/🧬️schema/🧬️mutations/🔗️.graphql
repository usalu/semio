# 📐️ Typed content mutation for `stdio.ifc`.
enum IfcMutationTag {
  SET_FILE_DESCRIPTION
  SET_FILE_NAME
  SET_FILE_SCHEMA
  INSERT_ENTITY
  REMOVE_ENTITY
  SET_ENTITY_NAME
  SET_ENTITY_ARG
  INSERT_ENTITY_ARG
  REMOVE_ENTITY_ARG
  SET_ENTITY_COMPLEX
}

type IfcMutation {
  mutation: IfcMutationTag!
  values: [IfcValue!]
  index: IfcIndex
  entity: IfcEntity
  id: IfcUInt64
  name: String
  value: IfcValue
  complex: [IfcComplexType!]
}
