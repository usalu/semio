# 📐️ Typed content mutation for `stdio.ifc`.
enum IfcMutationTag {
  SET_SNAPSHOT
  SET_FILE_DESCRIPTION
  SET_FILE_NAME
  SET_FILE_SCHEMA
  INSERT_ENTITY
  REMOVE_ENTITY
  SET_ENTITY_NAME
  SET_ENTITY_ARG
  INSERT_ENTITY_ARG
  REMOVE_ENTITY_ARG
}

type IfcMutation {
  mutation: IfcMutationTag!
  snapshot: IfcSnapshot
  values: [IfcValue!]
  index: Int
  entity: IfcEntity
  id: Int
  name: String
  value: IfcValue
}
