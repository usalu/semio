# 🔺️ One `args.modified[]`/`added[]` entry.
type IfcArgModified {
  index: IfcIndex!
  value: IfcValue!
}
type IfcArgAdded {
  index: IfcIndex!
  value: IfcValue!
}

# 🔺️ Index-keyed collection triple for one entity's positional `args`.
type IfcArgsDiff {
  removed: [IfcIndex!]!
  modified: [IfcArgModified!]!
  added: [IfcArgAdded!]!
}

# 🔺️ Sparse per-field diff for one `IfcEntity`.
type IfcEntityDiff {
  name: String
  args: IfcArgsDiff
  complex: [IfcComplexType!]
}

type IfcEntityRemoved {
  id: IfcUInt64!
  index: IfcIndex!
}
type IfcEntityModified {
  id: IfcUInt64!
  diff: IfcEntityDiff!
}
type IfcEntityAdded {
  index: IfcIndex!
  entity: IfcEntity!
}

# 📦️ Sparse id-keyed `entities` triple.
type IfcEntitiesDiff {
  removed: [IfcEntityRemoved!]!
  modified: [IfcEntityModified!]!
  added: [IfcEntityAdded!]!
}

# 🔺️ IfcDiff — no `snapshot` full-replace slot.
type IfcDiff {
  fileDescription: [IfcValue!]
  fileName: [IfcValue!]
  fileSchema: [IfcValue!]
  entities: IfcEntitiesDiff
}
