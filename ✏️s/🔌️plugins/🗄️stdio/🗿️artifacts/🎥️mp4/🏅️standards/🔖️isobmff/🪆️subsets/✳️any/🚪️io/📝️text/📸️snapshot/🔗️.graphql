type Mp4HevcNalArray { arrayCompleteness: Boolean! nalUnitType: Int! nalUnits: [[Int!]!]! }
type Mp4HevcConfig { generalProfileSpace: Int! generalTierFlag: Boolean! generalProfileIdc: Int! generalProfileCompatibilityFlags: Float! generalConstraintIndicatorFlags: String! generalLevelIdc: Int! minSpatialSegmentationIdc: Int! parallelismType: Int! chromaFormatIdc: Int! bitDepthLumaMinus8: Int! bitDepthChromaMinus8: Int! avgFrameRate: Int! constantFrameRate: Int! numTemporalLayers: Int! temporalIdNested: Boolean! arrays: [Mp4HevcNalArray!]! }
type Mp4Codec { format: String! sps: [[Int!]!]! pps: [[Int!]!]! nalLengthSize: Int! extension: Mp4AvcExtension hevc: Mp4HevcConfig }
