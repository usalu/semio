type Mp4Ftyp { majorBrand: String! minorVersion: Int! compatibleBrands: [String!]! }
union Mp4Codec = Mp4CodecAvc | Mp4CodecHevc | Mp4CodecJpeg
type Mp4CodecAvc { format: String! sps: [[Int!]!]! pps: [[Int!]!]! nalLengthSize: Int! }
type Mp4HevcNalArray { arrayCompleteness: Boolean! nalUnitType: Int! nalUnits: [[Int!]!]! }
type Mp4CodecHevc { format: String! nalLengthSize: Int! generalProfileSpace: Int! generalTierFlag: Boolean! generalProfileIdc: Int! generalProfileCompatibilityFlags: Float! generalConstraintIndicatorFlags: Float! generalLevelIdc: Int! minSpatialSegmentationIdc: Int! parallelismType: Int! chromaFormatIdc: Int! bitDepthLumaMinus8: Int! bitDepthChromaMinus8: Int! avgFrameRate: Int! constantFrameRate: Int! numTemporalLayers: Int! temporalIdNested: Boolean! arrays: [Mp4HevcNalArray!]! }
type Mp4CodecJpeg { format: String! }
type Mp4Sample { data: [Int!]! duration: Int! ctsOffset: Int! sync: Boolean! }
type Mp4Track { trackId: Int! timescale: Int! codec: Mp4Codec! width: Int! height: Int! chunkSampleCounts: [Int!]! samples: [Mp4Sample!]! }
type Mp4Snapshot {
  schema: String! @state(class: ARTIFACT)
  ftyp: Mp4Ftyp! @state(class: ARTIFACT)
  tracks: [Mp4Track!]! @state(class: ARTIFACT)
}
