# 🧬️ DeflateSnapshot — typed RFC1950 zlib container
enum DeflateLevelHint {
  FASTEST
  FAST
  DEFAULT
  MAXIMUM
}

type DeflateSnapshot {
  schema: String! @state(class: PERSISTENT)
  compressionMethod: Int! @state(class: PERSISTENT)
  windowBits: Int! @state(class: PERSISTENT)
  compressionLevelHint: DeflateLevelHint! @state(class: PERSISTENT)
  dictId: Int @state(class: PERSISTENT)
  payload: [Int!]! @state(class: PERSISTENT)
}
