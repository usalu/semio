syntax = "proto3";
package semio.s_stdio_deflate.artifact;

enum DeflateLevelHint {
  FASTEST = 0;
  FAST = 1;
  DEFAULT = 2;
  MAXIMUM = 3;
}

message DeflateArtifact {
  string schema = 1;
  uint32 compression_method = 2;
  uint32 window_bits = 3;
  DeflateLevelHint compression_level_hint = 4;
  optional uint32 dict_id = 5;
  bytes payload = 6;
}
