# 🧬️ DeflateMutation — imperative verbs over the typed RFC1950 container fields
enum DeflateMutationTag {
  SET_SNAPSHOT
  SET_COMPRESSION_PARAMS
  SET_PRESET_DICTIONARY
  SET_PAYLOAD
}

input DeflateMutationInput {
  mutation: DeflateMutationTag!
  snapshot: DeflateSnapshotInput
  method: Int
  windowBits: Int
  levelHint: DeflateLevelHint
  dictId: Int
  payload: [Int!]
}
