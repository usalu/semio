# 🧬️ DeflateArtifact — mirrors DeflateSnapshot's typed RFC1950 fields
type DeflateArtifact {
  schema: String! @state(class: ARTIFACT)
  compressionMethod: Int! @state(class: ARTIFACT)
  windowBits: Int! @state(class: ARTIFACT)
  compressionLevelHint: DeflateLevelHint! @state(class: ARTIFACT)
  dictId: Int @state(class: ARTIFACT)
  payload: [Int!]! @state(class: ARTIFACT)
}
