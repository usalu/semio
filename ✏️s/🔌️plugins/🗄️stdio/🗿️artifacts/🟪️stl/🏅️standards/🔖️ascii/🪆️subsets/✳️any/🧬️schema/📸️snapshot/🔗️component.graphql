# 🧬️ StlSnapshot — complete per the ASCII STL spec (solid/endsolid + triangle list).

type StlTriangle {
  normal: [Float!]!
  vertices: [[Float!]!]!
}

type StlSnapshot {
  schema: String! @state(class: ARTIFACT)
  solidName: String! @state(class: ARTIFACT)
  triangles: [StlTriangle!]! @state(class: ARTIFACT)
}
