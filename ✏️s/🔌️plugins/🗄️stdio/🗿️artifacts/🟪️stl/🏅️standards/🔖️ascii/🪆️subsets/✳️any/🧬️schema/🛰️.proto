syntax = "proto3";
package semio.s_stdio_stl.artifact;

message StlTriangleProto {
  repeated double normal = 1;
  repeated double vertex0 = 2;
  repeated double vertex1 = 3;
  repeated double vertex2 = 4;
}

message StlArtifact {
  string schema = 1;
  string solid_name = 2;
  repeated StlTriangleProto triangles = 3;
}
