syntax = "proto3";
import "../📸️snapshot/🛰️.proto";
package semio.s_stdio_bmp.mutations;

message PaintIndexedRegion {
  string revision = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 palette_index = 6;
}

message PaintDirectRegion {
  string revision = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 red = 6;
  uint32 green = 7;
  uint32 blue = 8;
  uint32 alpha = 9;
}

message BmpRegion {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message BmpNativeSample {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
  uint32 alpha = 4;
  uint32 reserved = 5;
}

message ReplaceSamples {
  BmpRegion region = 1;
  bytes indices = 2;
  repeated BmpNativeSample samples = 3;
}

message BmpMutation { oneof payload { ReplaceImage replace_image = 12; PaintIndexedRegion paint_indexed_region = 3; PaintDirectRegion paint_direct_region = 4; ReplaceSamples replace_samples = 13; SetPaletteEntry set_palette_entry = 14; InsertPaletteEntry insert_palette_entry = 15; RemovePaletteEntry remove_palette_entry = 16; } }

message ReplaceImage { semio.s_stdio_bmp.snapshot.BmpImage image = 1; }

message SetPaletteEntry {
  uint32 index = 1;
  uint32 red = 2;
  uint32 green = 3;
  uint32 blue = 4;
  uint32 reserved = 5;
}

message InsertPaletteEntry {
  uint32 index = 1;
  uint32 red = 2;
  uint32 green = 3;
  uint32 blue = 4;
  uint32 reserved = 5;
  uint32 colors_used = 6;
}

message RemovePaletteEntry {
  uint32 index = 1;
  uint32 colors_used = 2;
}
