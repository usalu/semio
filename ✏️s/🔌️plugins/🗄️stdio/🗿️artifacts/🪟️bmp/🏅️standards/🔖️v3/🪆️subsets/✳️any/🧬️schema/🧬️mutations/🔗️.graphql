input PaintIndexedRegion {
  revision: String!
  x: Int!
  y: Int!
  width: Int!
  height: Int!
  paletteIndex: Int!
}

input PaintDirectRegion {
  revision: String!
  x: Int!
  y: Int!
  width: Int!
  height: Int!
  red: Int!
  green: Int!
  blue: Int!
  alpha: Int!
}

input BmpMutation @oneOf { replaceImage: ReplaceImage  paintIndexedRegion: PaintIndexedRegion paintDirectRegion: PaintDirectRegion }

input ReplaceImage { image: BmpImageInput! }
