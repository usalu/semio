input PaintIndexedRegion {
  revision: String!
  x: Int!
  y: Int!
  width: Int!
  height: Int!
  paletteIndex: Int!
}

input PaintDirectRegion {
  revision: String!
  x: Int!
  y: Int!
  width: Int!
  height: Int!
  red: Int!
  green: Int!
  blue: Int!
  alpha: Int!
}

input BmpRegionInput {
  x: Int!
  y: Int!
  width: Int!
  height: Int!
}

input BmpNativeSampleInput {
  red: Int!
  green: Int!
  blue: Int!
  alpha: Int!
  reserved: Int!
}

input ReplaceSamples {
  region: BmpRegionInput!
  indices: [Int!]
  samples: [BmpNativeSampleInput!]
}

input BmpMutation @oneOf { replaceImage: ReplaceImage  paintIndexedRegion: PaintIndexedRegion paintDirectRegion: PaintDirectRegion replaceSamples: ReplaceSamples setPaletteEntry: SetPaletteEntry insertPaletteEntry: InsertPaletteEntry removePaletteEntry: RemovePaletteEntry }

input ReplaceImage { image: BmpImageInput! }

input SetPaletteEntry {
  index: Int!
  red: Int!
  green: Int!
  blue: Int!
  reserved: Int!
}

input InsertPaletteEntry {
  index: Int!
  red: Int!
  green: Int!
  blue: Int!
  reserved: Int!
  colorsUsed: Int!
}

input RemovePaletteEntry {
  index: Int!
  colorsUsed: Int!
}
