input PaintIndexedRegion {
  revision: String!
  x: Int!
  y: Int!
  width: Int!
  height: Int!
  paletteIndex: Int!
}

input PaintDirectRegion {
  revision: String!
  x: Int!
  y: Int!
  width: Int!
  height: Int!
  red: Int!
  green: Int!
  blue: Int!
  alpha: Int!
}

input BmpRegionInput {
  x: Int!
  y: Int!
  width: Int!
  height: Int!
}

input BmpNativeSampleInput {
  red: Int!
  green: Int!
  blue: Int!
  alpha: Int!
  reserved: Int!
}

input ReplaceSamples {
  region: BmpRegionInput!
  indices: [Int!]
  samples: [BmpNativeSampleInput!]
}

input BmpMutation @oneOf { replaceImage: ReplaceImage  paintIndexedRegion: PaintIndexedRegion paintDirectRegion: PaintDirectRegion replaceSamples: ReplaceSamples }

input ReplaceImage { image: BmpImageInput! }
