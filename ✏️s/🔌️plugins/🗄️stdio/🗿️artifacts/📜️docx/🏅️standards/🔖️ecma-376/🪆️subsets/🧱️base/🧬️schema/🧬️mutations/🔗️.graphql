  INSERT_BLOCK
  REMOVE_BLOCK
  SET_BLOCK_CONTENT
  SET_RUN_TEXT
  REPLACE_XML_NODE
  SET_RUN_FORMATTING
  SET_PARAGRAPH_STYLE
  INSERT_TABLE_ROW
  REMOVE_TABLE_ROW
  INSERT_XML_NODE
  REMOVE_XML_NODE
  INSERT_STYLE
  REMOVE_STYLE
  SET_STYLE_NAME
  SET_STYLE_BASED_ON
  SET_PART
