syntax = "proto3";
package semio.s_stdio_docx.mutation;
import "s_stdio_xml/snapshot.proto";
enum DocxMutationKind {
  DOCX_MUTATION_KIND_UNSPECIFIED = 0;
  DOCX_MUTATION_KIND_INSERT_BLOCK = 2;
  DOCX_MUTATION_KIND_REMOVE_BLOCK = 3;
  DOCX_MUTATION_KIND_SET_BLOCK_CONTENT = 4;
  DOCX_MUTATION_KIND_SET_RUN_TEXT = 5;
  DOCX_MUTATION_KIND_REPLACE_XML_NODE = 6;
  DOCX_MUTATION_KIND_SET_RUN_FORMATTING = 7;
  DOCX_MUTATION_KIND_INSERT_STYLE = 8;
  DOCX_MUTATION_KIND_REMOVE_STYLE = 9;
  DOCX_MUTATION_KIND_SET_STYLE_NAME = 10;
  DOCX_MUTATION_KIND_SET_STYLE_BASED_ON = 11;
  DOCX_MUTATION_KIND_SET_PART = 12;
  DOCX_MUTATION_KIND_REMOVE_PART = 13;
  DOCX_MUTATION_KIND_SET_PARAGRAPH_STYLE = 14;
  DOCX_MUTATION_KIND_INSERT_TABLE_ROW = 15;
  DOCX_MUTATION_KIND_REMOVE_TABLE_ROW = 16;
  DOCX_MUTATION_KIND_INSERT_XML_NODE = 17;
  DOCX_MUTATION_KIND_REMOVE_XML_NODE = 18;
}
message DocxMutation {
  DocxMutationKind kind = 1;
  bytes payload = 2;
}

message DocxPartContent {
  oneof content {
    semio.s_stdio_xml.snapshot.XmlDocument xml = 1;
    bytes binary = 2;
  }
}
message DocxSetPart { string path = 1; string content_type = 2; DocxPartContent payload = 3; optional uint64 index = 4; optional uint64 override_index = 5; }
