# 🧭️ Own workspace root: never joins the repository's root workspace, whose root manifest is a shared,
# contended file.
#
# The READER for this subset. `gif` 0.13 cannot WRITE a GIF87a — its encoder hardcodes `b"GIF89a"` and
# emits a Graphic Control Extension for every frame — but it READS 87a completely, including the
# version itself (`decoder.rs:558` maps `b"GIF87a"` to `Version::V87a`; `version()` is public at
# `decoder.rs:501`). So it judges; something else writes.
[workspace]

[package]
name = "gif-87a-any-reader"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "reader"
path = "src/main.rs"

[dependencies]
gif = "0.13"
