# 🧭️ Own workspace root: linked by `../📜️script.ts` (`cargo run --manifest-path`), never joins the
# repository's root workspace, whose root manifest is a shared, contended file.
#
# Builds this subset's `third-party-generated` fixtures with the SAME registered reference crate
# (`gif` 0.13) named in `../../🧪️oracle/🔣️.json`'s `gif-89a-any-mutate` oracle — never with this
# repository's own `encode_gif`. See `../📜️script.ts` for the generation contract.
[workspace]

[package]
name = "gif-89a-any-fixture-generator"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "src/main.rs"

[dependencies]
gif = "0.13"
