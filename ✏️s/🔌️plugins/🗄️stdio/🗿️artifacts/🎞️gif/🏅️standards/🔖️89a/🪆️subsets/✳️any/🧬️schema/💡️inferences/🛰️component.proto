syntax = "proto3";
package semio.s.stdio.gif.89a.inference;

// 💡️ Gif (89a) inference schema — logical screen geometry.

message GifInference {
  // @state inferred
  GifDimensions dimensions = 1;
}

message GifDimensions {
  uint32 width = 1;
  uint32 height = 2;
  uint32 bit_depth = 3;
  bool has_alpha = 4;
  uint64 pixel_count = 5;
}
