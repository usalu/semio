[package]
workspace = "../../../../../.."
name = "semio-s-artifact-stdio-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio xlsx artifact"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
component-app-assembly = []

[dependencies]
semio-framework-hash = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-binary = { workspace = true }
semio-s-artifact-stdio-contract = { workspace = true }
semio-s-artifact-stdio-xml = { workspace = true }
semio-s-artifact-stdio-zip = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
calamine = { version = "0.36.1", default-features = false }
quick-xml = "0.42"
zip = { version = "6", default-features = false, features = ["deflate"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-async-macros = { workspace = true }
semio-framework-ui-scene = { workspace = true }

[package.metadata.semio.composition]
manifest = "../../🧩️composition/🔣️.json"
