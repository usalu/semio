cargo-features = [ "trim-paths" ]

[workspace]
resolver = "2"
members = [
    "🏅️standards/🔖️ecma-376/🪆️subsets/🌉️transitional/📦️packages/🦀️rust",
    "🏅️standards/🔖️ecma-376/🪆️subsets/🔒️strict/📦️packages/🦀️rust",
    "🏅️standards/🔖️ecma-376/🪆️subsets/🔒️strict/🧬️schema/🧬️mutations/📦️packages/🦀️rust",
    "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/📦️packages/🦀️rust",
    "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/💡️inferences/📦️packages/🦀️rust",
    "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/📇️descriptor/📦️packages/🦀️rust",
    "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/📦️packages/🦀️rust",
    "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/🧬️mutations/📦️packages/🦀️rust",
    "📦️packages/🦀️rust",
]
exclude = [
  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**",
  "🔮️oracles/📦️packages/🦀️rust"
]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**"
]
member-manifests = [ "**/📦️packages/🦀️rust/Cargo.toml" ]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

[workspace.dependencies.semio-framework]
path = "../../../../../🧰️framework/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-artifact-reference]
path = "../../../../../🧰️framework/🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-async-macros]
path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-hash]
path = "../../../../../🧰️framework/🔨️modules/🔏️hash/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-os-kernel]
path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-plugin]
path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-schema]
path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-ui-scene]
path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-value-derive]
path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-binary]
path = "../💾️binary/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-contract]
path = "../../📇️registry/🧬️contract/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xml]
path = "../📰️xml/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-zip]
path = "../🎒️zip/📦️packages/🦀️rust"

[workspace.dependencies.serde_json]
version = "1.0.149"
features = [ "raw_value" ]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

  [workspace.lints.rust.future_incompatible]
  level = "warn"
  priority = -1

  [workspace.lints.rust.rust_2018_idioms]
  level = "warn"
  priority = -1

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

  [workspace.lints.clippy.all]
  level = "warn"
  priority = -1

[workspace.dependencies.semio-s-artifact-stdio-xlsx-base-descriptor]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/📇️descriptor/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-base-inferences]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/💡️inferences/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-base-mutations]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/🧬️mutations/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-base-model]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-base]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-transitional]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🌉️transitional/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-strict-mutations]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🔒️strict/🧬️schema/🧬️mutations/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-strict]
path = "🏅️standards/🔖️ecma-376/🪆️subsets/🔒️strict/📦️packages/🦀️rust"
