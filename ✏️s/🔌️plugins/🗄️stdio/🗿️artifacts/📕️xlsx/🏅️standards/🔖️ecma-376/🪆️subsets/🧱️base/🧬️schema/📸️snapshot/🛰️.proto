syntax = "proto3";
package semio.s_stdio_xlsx.snapshot;

import "s_stdio_xml/snapshot.proto";

message NameValue { string name = 1; string value = 2; }
message OpcContentTypes { repeated NameValue defaults = 1; repeated NameValue overrides = 2; }
message OpcPart { string path = 1; string content_type = 2; bytes bytes = 3; }
enum OpcTargetMode { OPC_TARGET_MODE_INTERNAL = 0; OPC_TARGET_MODE_EXTERNAL = 1; }
message OpcRelationship { string id = 1; string rel_type = 2; string target = 3; OpcTargetMode target_mode = 4; }
message OpcRelationshipOwner { string owner = 1; repeated OpcRelationship relationships = 2; }
message OpcPackage {
  repeated OpcPart parts = 1;
  OpcContentTypes content_types = 2;
  repeated OpcRelationshipOwner relationships = 3;
  string comment = 4;
}
message XlsxXmlPart {
  string path = 1;
  string content_type = 2;
  semio.s_stdio_xml.snapshot.XmlDocument document = 3;
}
message XlsxSnapshot {
  string schema = 1;
  OpcPackage opc = 2;
  repeated XlsxXmlPart xml_parts = 3;
}
