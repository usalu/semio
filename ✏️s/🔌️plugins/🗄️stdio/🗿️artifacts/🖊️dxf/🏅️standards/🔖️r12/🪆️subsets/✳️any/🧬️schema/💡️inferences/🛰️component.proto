syntax = "proto3";
package semio.s.stdio.dxf.inference;

// 💡️ Dxf inference schema — entity-derived 3D bounding box over top-level and block-nested entities.

message DxfInference {
  // @state inferred
  DxfBounds bounds = 1;
}

message DxfBounds {
  repeated double min = 1;
  repeated double max = 2;
  uint32 entity_count = 3;
}
