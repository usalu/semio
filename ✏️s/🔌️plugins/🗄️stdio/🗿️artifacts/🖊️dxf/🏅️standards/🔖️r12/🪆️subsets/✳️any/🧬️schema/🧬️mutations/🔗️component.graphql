# 🧬️ DxfMutation union — mirrors 🦀️component.rs's #[serde(tag = "mutation")] enum, one
# discriminated variant per Rust variant, camelCase field names.

enum DxfMutationKind {
  SET_SNAPSHOT
  SET_HEADER_VAR REMOVE_HEADER_VAR
  INSERT_LAYER REMOVE_LAYER SET_LAYER
  INSERT_STYLE REMOVE_STYLE SET_STYLE
  INSERT_LINETYPE REMOVE_LINETYPE SET_LINETYPE
  INSERT_ENTITY REMOVE_ENTITY SET_ENTITY
  INSERT_BLOCK REMOVE_BLOCK SET_BLOCK
}

"""🧬️ Discriminated on `mutation`; fields relevant to other variants are null."""
type DxfMutation {
  mutation: DxfMutationKind!
  snapshot: DxfSnapshot
  name: String
  headerVar: DxfHeaderVar
  index: Int
  layer: DxfLayer
  style: DxfStyle
  linetype: DxfLinetype
  entity: DxfEntity
  block: DxfBlock
}
