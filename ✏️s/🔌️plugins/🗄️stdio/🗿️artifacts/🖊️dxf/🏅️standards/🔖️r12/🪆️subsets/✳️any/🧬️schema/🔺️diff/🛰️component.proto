syntax = "proto3";
package semio.s_stdio_dxf.diff;

import "snapshot.proto"; // DxfValue, DxfGroupCode, DxfHeaderVar, DxfLayer, DxfStyle, DxfLinetype, DxfEntity, DxfBlock

// 🔺️ DxfDiff schema facet — mirrors 🦀️component.rs field-for-field. Name-keyed
// removed/modified/added triples for header_vars/layers/styles/linetypes; index-keyed triples
// for blocks/entities. No full-replace `snapshot` slot anywhere.

message DxfHeaderVarDiff {
  optional int32 group_code = 1;
  semio.s_stdio_dxf.snapshot.DxfValue value = 2;
  repeated semio.s_stdio_dxf.snapshot.DxfGroupCode extra_group_codes = 3;
}
message DxfHeaderVarModified { string name = 1; DxfHeaderVarDiff diff = 2; }
message DxfHeaderVarAdded { uint32 index = 1; semio.s_stdio_dxf.snapshot.DxfHeaderVar header_var = 2; }
message DxfHeaderVarsDiff {
  repeated string removed = 1;
  repeated DxfHeaderVarModified modified = 2;
  repeated DxfHeaderVarAdded added = 3;
}

message DxfLayerDiff { optional int32 color = 1; optional string linetype = 2; optional int32 flags = 3; repeated semio.s_stdio_dxf.snapshot.DxfGroupCode unknown_group_codes = 4; }
message DxfLayerModified { string name = 1; DxfLayerDiff diff = 2; }
message DxfLayerAdded { uint32 index = 1; semio.s_stdio_dxf.snapshot.DxfLayer layer = 2; }
message DxfLayersDiff { repeated string removed = 1; repeated DxfLayerModified modified = 2; repeated DxfLayerAdded added = 3; }

message DxfStyleDiff { optional int32 flags = 1; optional string font_name = 2; repeated semio.s_stdio_dxf.snapshot.DxfGroupCode unknown_group_codes = 3; }
message DxfStyleModified { string name = 1; DxfStyleDiff diff = 2; }
message DxfStyleAdded { uint32 index = 1; semio.s_stdio_dxf.snapshot.DxfStyle style = 2; }
message DxfStylesDiff { repeated string removed = 1; repeated DxfStyleModified modified = 2; repeated DxfStyleAdded added = 3; }

message DxfLinetypeDiff { optional int32 flags = 1; optional string description = 2; repeated semio.s_stdio_dxf.snapshot.DxfGroupCode unknown_group_codes = 3; }
message DxfLinetypeModified { string name = 1; DxfLinetypeDiff diff = 2; }
message DxfLinetypeAdded { uint32 index = 1; semio.s_stdio_dxf.snapshot.DxfLinetype linetype = 2; }
message DxfLinetypesDiff { repeated string removed = 1; repeated DxfLinetypeModified modified = 2; repeated DxfLinetypeAdded added = 3; }

message DxfTablesDiff {
  DxfLayersDiff layers = 1;
  DxfStylesDiff styles = 2;
  DxfLinetypesDiff linetypes = 3;
}

message DxfEntityDiff {
  enum Kind { REPLACE = 0; LINE = 1; CIRCLE = 2; ARC = 3; POLYLINE = 4; TEXT = 5; SOLID = 6; INSERT = 7; OTHER = 8; }
  Kind kind = 1;
  semio.s_stdio_dxf.snapshot.DxfEntity replace_entity = 2;
  repeated double start = 3;
  repeated double end = 4;
  repeated double center = 5;
  optional double radius = 6;
  optional double start_angle = 7;
  optional double end_angle = 8;
  repeated semio.s_stdio_dxf.snapshot.DxfVertex vertices = 9;
  optional bool closed = 10;
  repeated double position = 11;
  optional double height = 12;
  optional string value = 13;
  repeated double points = 14;
  optional string block_name = 15;
  repeated double scale = 16;
  optional double rotation = 17;
  optional string layer = 18;
  repeated semio.s_stdio_dxf.snapshot.DxfGroupCode group_codes = 19;
  repeated semio.s_stdio_dxf.snapshot.DxfGroupCode unknown_group_codes = 20;
}
message DxfEntityModified { uint32 index = 1; DxfEntityDiff diff = 2; }
message DxfEntityAdded { uint32 index = 1; semio.s_stdio_dxf.snapshot.DxfEntity entity = 2; }
// 🔺️ Reused for both DxfSnapshot.entities and each DxfBlock.entities.
message DxfEntitiesDiff { repeated uint32 removed = 1; repeated DxfEntityModified modified = 2; repeated DxfEntityAdded added = 3; }

message DxfBlockDiff {
  optional string name = 1;
  repeated double base_point = 2;
  DxfEntitiesDiff entities = 3;
  repeated semio.s_stdio_dxf.snapshot.DxfGroupCode unknown_group_codes = 4;
}
message DxfBlockModified { uint32 index = 1; DxfBlockDiff diff = 2; }
message DxfBlockAdded { uint32 index = 1; semio.s_stdio_dxf.snapshot.DxfBlock block = 2; }
message DxfBlocksDiff { repeated uint32 removed = 1; repeated DxfBlockModified modified = 2; repeated DxfBlockAdded added = 3; }

message DxfDiff {
  DxfHeaderVarsDiff header_vars = 1;
  DxfTablesDiff tables = 2;
  DxfBlocksDiff blocks = 3;
  DxfEntitiesDiff entities = 4;
}
