# ⏎️ LineEnding
enum LineEnding {
  LF
  CR_LF
}

# 🧬️ TxtSnapshot
type TxtSnapshot {
  schema: String! @state(class: ARTIFACT)
  lines: [String!]! @state(class: ARTIFACT)
  trailingNewline: Boolean! @state(class: ARTIFACT)
  lineEnding: LineEnding! @state(class: ARTIFACT)
}

input TxtSnapshotInput {
  schema: String!
  lines: [String!]!
  trailingNewline: Boolean!
  lineEnding: LineEnding!
}
