# ➕️ TxtLineAdded
type TxtLineAdded {
  index: Int!
  text: String!
}

# ✏️ TxtLineModified
type TxtLineModified {
  index: Int!
  text: String!
}

# 🧮 TxtLinesDiff
type TxtLinesDiff {
  removed: [Int!]!
  modified: [TxtLineModified!]!
  added: [TxtLineAdded!]!
}

# 🔺️ TxtDiff
type TxtDiff {
  trailingNewline: Boolean
  lineEnding: LineEnding
  lines: TxtLinesDiff
}
