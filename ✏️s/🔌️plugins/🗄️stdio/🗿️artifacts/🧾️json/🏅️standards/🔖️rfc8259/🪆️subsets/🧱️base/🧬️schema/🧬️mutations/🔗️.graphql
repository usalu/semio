# 🧬 Transparent JsonMutation descriptor roster.
# set-member/SetMember
# remove-member/RemoveMember
# insert-array-element/InsertArrayElement
# remove-array-element/RemoveArrayElement
# set-scalar/SetScalar
enum JsonMutationKind {
  SET_MEMBER
  REMOVE_MEMBER
  INSERT_ARRAY_ELEMENT
  REMOVE_ARRAY_ELEMENT
  SET_SCALAR
}
scalar MutationPayload
input JsonMutationInput { kind: JsonMutationKind!, payload: MutationPayload! }
