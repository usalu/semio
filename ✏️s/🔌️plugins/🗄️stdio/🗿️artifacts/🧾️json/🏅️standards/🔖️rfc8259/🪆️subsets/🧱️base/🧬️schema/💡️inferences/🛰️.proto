syntax = "proto3";
package semio.s.stdio.json.inference;

// 💡️ Json inference schema — document outline (node count, max depth, root kind).

message JsonInference {
  // @derived
  JsonOutline outline = 1;
}

message JsonOutline {
  uint32 node_count = 1;
  uint32 max_depth = 2;
  string root_kind = 3;
}
