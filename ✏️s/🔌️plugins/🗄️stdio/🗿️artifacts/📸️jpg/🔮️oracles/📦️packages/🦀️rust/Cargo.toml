[workspace]
members = ["."]

[workspace.metadata.semio.repository]
exclude-patterns = []
schema-version = 1
member-manifests = ["Cargo.toml"]

[package]
name = "semio-s-artifact-stdio-jpg-test-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "🔮️ Owned independent test oracle provider"

[package.metadata.semio]
role = "test"

[lib]
name = "semio_s_artifact_stdio_jpg_test_oracle"
path = "../../🦀️.rs"

[features]
oracles = ["dep:image"]

[dependencies]
"image" = { version = "0.25", optional = true, default-features = false, features = ["bmp", "tiff", "jpeg"] }
"semio-repo-test-host" = { path = "../../../../../../../../🧰️framework/🛍️products/🦑️repo/🔨️modules/🧪️test/📦️packages/🦀️rust", default-features = false }
