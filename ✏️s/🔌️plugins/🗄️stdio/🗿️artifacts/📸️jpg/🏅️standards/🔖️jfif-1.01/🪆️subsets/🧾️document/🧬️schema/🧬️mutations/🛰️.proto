syntax = "proto3";
package stdio.jpg;
import "🪪️change-jfif/🛰️.proto";
import "📥️insert-other/🛰️.proto";
import "🗑️remove-other/🛰️.proto";
import "🔲️replace-pixels/🛰️.proto";
import "🖼️replace-image/🛰️.proto";
message JpgMutation {
  oneof mutation {
    ChangeJfifHeaderMutation change_jfif_header = 1;
    InsertOtherSegmentMutation insert_other_segment = 2;
    RemoveOtherSegmentMutation remove_other_segment = 3;
    ReplacePixelsMutation replace_pixels = 4;
    ReplaceImage replace_image = 5;
  }
}
