# 🔺️ Sparse authored JPEG image fields; absent members preserve their current value.
type JpgSegmentDiff { marker: Int, data: [Int!] }
type JpgSegmentModified { index: Int!, diff: JpgSegmentDiff! }
type JpgSegmentAdded { index: Int!, item: JpgSegment! }
type JpgOtherSegmentsDiff { removed: [Int!], modified: [JpgSegmentModified!], added: [JpgSegmentAdded!] }
type JpgDiff {
  width: Int @state(class: ARTIFACT)
  height: Int @state(class: ARTIFACT)
  pixels: [Int!] @state(class: ARTIFACT)
  jfifVersion: [Int!] @state(class: ARTIFACT)
  jfifDensityUnits: JfifDensityUnits @state(class: ARTIFACT)
  jfifXDensity: Int @state(class: ARTIFACT)
  jfifYDensity: Int @state(class: ARTIFACT)
  jfifThumbnail: JfifThumbnail @state(class: ARTIFACT)
  otherSegments: JpgOtherSegmentsDiff @state(class: ARTIFACT)
}
