syntax = "proto3";
package semio.s_stdio_jpg.snapshot;

message JfifThumbnail {
  uint32 width = 1;
  uint32 height = 2;
  bytes rgb_data = 3;
}

message JpgSegment {
  uint32 marker = 1;
  bytes data = 2;
}

enum JfifDensityUnits {
  ASPECT = 0;
  PIXELS_PER_INCH = 1;
  PIXELS_PER_CM = 2;
}

message JpgSnapshot {
  string schema = 1;
  JpgImage image = 2;
}
message JpgImage {
  uint32 width = 1;
  uint32 height = 2;
  bytes pixels = 3;
  uint32 jfif_version_major = 4;
  uint32 jfif_version_minor = 5;
  JfifDensityUnits jfif_density_units = 6;
  uint32 jfif_x_density = 7;
  uint32 jfif_y_density = 8;
  optional JfifThumbnail jfif_thumbnail = 9;
  repeated JpgSegment other_segments = 10;
}

