# 🧬️ JpgSnapshot schema facet — mirrors 🦀️.rs field-for-field.

"📏️ JFIF APP0 units byte. ASPECT means x/y density are merely a pixel aspect ratio."
enum JfifDensityUnits {
  ASPECT
  PIXELS_PER_INCH
  PIXELS_PER_CM
}

"🖼️ JFIF APP0's optional embedded thumbnail — uncompressed 24-bit RGB."
type JfifThumbnail {
  width: Int!
  height: Int!
  rgbData: [Int!]!
}


"🗃️ An other APPn/COM segment retained verbatim. Index-keyed within JpgImage.otherSegments."
type JpgSegment {
  marker: Int!
  data: [Int!]!
}

"📸️ Complete stdio.jpg jfif-1.01 semantic snapshot. schema is an identity field, never diffed."
type JpgSnapshot {
  schema: String! @state(class: ARTIFACT)
  image: JpgImage! @state(class: ARTIFACT)
}
type JpgImage {
  width: Int! @state(class: ARTIFACT)
  height: Int! @state(class: ARTIFACT)
  pixels: [Int!]! @state(class: ARTIFACT)
  jfifVersion: [Int!]! @state(class: ARTIFACT)
  jfifDensityUnits: JfifDensityUnits! @state(class: ARTIFACT)
  jfifXDensity: Int! @state(class: ARTIFACT)
  jfifYDensity: Int! @state(class: ARTIFACT)
  jfifThumbnail: JfifThumbnail @state(class: ARTIFACT)
  otherSegments: [JpgSegment!]! @state(class: ARTIFACT)
}

