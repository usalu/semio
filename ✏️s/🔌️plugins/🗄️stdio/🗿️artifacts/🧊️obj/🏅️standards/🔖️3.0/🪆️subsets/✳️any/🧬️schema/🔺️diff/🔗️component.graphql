# 🔺️ ObjDiff schema facet — mirrors 🦀️component.rs field-for-field.

type ObjFaceVertex { vertex: Int! texcoord: Int normal: Int }
type ObjUsemtlRange { faceIndexFrom: Int! material: String! }
type ObjSmoothingRange { faceIndexFrom: Int! group: Int }
type ObjUnknownStatement { lineIndex: Int! raw: String! }

type ObjVertexInput { x: Float! y: Float! z: Float! w: Float }
type ObjVertexDiff { x: Float y: Float z: Float w: Float }
type ObjVertexModified { index: Int! diff: ObjVertexDiff! }
type ObjVertexAdded { index: Int! vertex: ObjVertexInput! }
type ObjVerticesDiff { removed: [Int!]! modified: [ObjVertexModified!]! added: [ObjVertexAdded!]! }

type ObjTexCoordInput { u: Float! v: Float! w: Float }
type ObjTexCoordDiff { u: Float v: Float w: Float }
type ObjTexCoordModified { index: Int! diff: ObjTexCoordDiff! }
type ObjTexCoordAdded { index: Int! texcoord: ObjTexCoordInput! }
type ObjTexCoordsDiff { removed: [Int!]! modified: [ObjTexCoordModified!]! added: [ObjTexCoordAdded!]! }

type ObjNormalInput { x: Float! y: Float! z: Float! }
type ObjNormalDiff { x: Float y: Float z: Float }
type ObjNormalModified { index: Int! diff: ObjNormalDiff! }
type ObjNormalAdded { index: Int! normal: ObjNormalInput! }
type ObjNormalsDiff { removed: [Int!]! modified: [ObjNormalModified!]! added: [ObjNormalAdded!]! }

type ObjFaceInput { vertices: [ObjFaceVertex!]! }
type ObjFaceDiff { vertices: [ObjFaceVertex!] }
type ObjFaceModified { index: Int! diff: ObjFaceDiff! }
type ObjFaceAdded { index: Int! face: ObjFaceInput! }
type ObjFacesDiff { removed: [Int!]! modified: [ObjFaceModified!]! added: [ObjFaceAdded!]! }

type ObjGroupInput { name: String! faces: [Int!]! }
type ObjGroupDiff { faces: [Int!] }
type ObjGroupModified { name: String! diff: ObjGroupDiff! }
type ObjGroupAdded { index: Int! group: ObjGroupInput! }
type ObjGroupsDiff { removed: [String!]! modified: [ObjGroupModified!]! added: [ObjGroupAdded!]! }

type ObjObjectInput { name: String! faces: [Int!]! }
type ObjObjectAdded { index: Int! object: ObjObjectInput! }
type ObjObjectsDiff { removed: [String!]! modified: [ObjGroupModified!]! added: [ObjObjectAdded!]! }

"Diff for stdio.obj. schema is an identity field and never appears here."
type ObjDiff {
  vertices: ObjVerticesDiff
  texcoords: ObjTexCoordsDiff
  normals: ObjNormalsDiff
  faces: ObjFacesDiff
  groups: ObjGroupsDiff
  objects: ObjObjectsDiff
  "tri-state: absent = unchanged, null = cleared, string = set"
  mtllib: String
  usemtl: [ObjUsemtlRange!]
  smoothingGroups: [ObjSmoothingRange!]
  unknownStatements: [ObjUnknownStatement!]
}
