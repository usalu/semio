syntax = "proto3";
package semio.s_stdio_ply.mutation;

enum PlyScalarType {
  PLY_SCALAR_TYPE_UNSPECIFIED = 0;
  CHAR = 1;
  U_CHAR = 2;
  SHORT = 3;
  U_SHORT = 4;
  INT = 5;
  U_INT = 6;
  FLOAT = 7;
  DOUBLE = 8;
}

message PlyProperty {
  oneof form {
    ScalarProperty scalar = 1;
    ListProperty list = 2;
  }
  message ScalarProperty {
    string name = 1;
    PlyScalarType kind = 2;
  }
  message ListProperty {
    string name = 1;
    PlyScalarType count_kind = 2;
    PlyScalarType value_kind = 3;
  }
}

message PlyValue {
  PlyScalarType kind = 1;
  double scalar_value = 2;
  repeated PlyValue list_value = 3;
}

message PlyRow {
  repeated PlyValue values = 1;
}

message PlyElement {
  string name = 1;
  uint64 count = 2;
  repeated PlyProperty properties = 3;
  repeated PlyRow rows = 4;
}

enum PlyFormat {
  PLY_FORMAT_UNSPECIFIED = 0;
  ASCII = 1;
  BINARY_LITTLE_ENDIAN = 2;
  BINARY_BIG_ENDIAN = 3;
}

message PlySnapshot {
  string schema = 1;
  PlyFormat format = 2;
  repeated string comments = 3;
  repeated PlyElement elements = 4;
}

enum PlyMutationKind {
  NO_MUTATION = 0;
  SET_SNAPSHOT = 1;
  SET_FORMAT = 2;
  INSERT_COMMENT = 3;
  REMOVE_COMMENT = 4;
  ADD_ELEMENT = 5;
  REMOVE_ELEMENT = 6;
  INSERT_ROW = 7;
  REMOVE_ROW = 8;
  SET_ROW_PROPERTY = 9;
}

// Field set per `mutation` kind is exactly that Rust variant's own fields (see `component.rs`)
// — never a mix; unused fields for a given kind are simply absent on the wire.
message PlyMutation {
  PlyMutationKind mutation = 1;
  PlySnapshot snapshot = 2;
  PlyFormat format = 3;
  uint64 index = 4;
  string comment = 5;
  PlyElement element = 6;
  string name = 7;
  string element_name = 8;
  PlyRow row = 9;
  uint64 row_index = 10;
  string property_name = 11;
  PlyValue value = 12;
}
