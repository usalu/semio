# 🧬️ EpwSnapshot schema facet — mirrors 🦀️.rs field-for-field.

type EpwLocation {
  city: String!
  stateProvince: String!
  country: String!
  source: String!
  wmo: String!
  latitude: String!
  longitude: String!
  timeZone: String!
  elevation: String!
}

type EpwDataPeriod {
  name: String!
  startDayOfWeek: String!
  startDate: String!
  endDate: String!
}

type EpwDataPeriods {
  recordsPerHour: Int!
  periods: [EpwDataPeriod!]!
}

"One hourly EPW data record — all 35 spec columns, in spec order."
type EpwRecord {
  year: String!
  month: String!
  day: String!
  hour: String!
  minute: String!
  dataSourceUncertainty: String!
  dryBulbTemp: String!
  dewPointTemp: String!
  relativeHumidity: String!
  atmosphericPressure: String!
  extraterrestrialHorizontalRadiation: String!
  extraterrestrialDirectNormalRadiation: String!
  horizontalInfraredRadiation: String!
  globalHorizontalRadiation: String!
  directNormalRadiation: String!
  diffuseHorizontalRadiation: String!
  globalHorizontalIlluminance: String!
  directNormalIlluminance: String!
  diffuseHorizontalIlluminance: String!
  zenithLuminance: String!
  windDirection: String!
  windSpeed: String!
  totalSkyCover: String!
  opaqueSkyCover: String!
  visibility: String!
  ceilingHeight: String!
  presentWeatherObservation: String!
  presentWeatherCodes: String!
  precipitableWater: String!
  aerosolOpticalDepth: String!
  snowDepth: String!
  daysSinceLastSnowfall: String!
  albedo: String!
  liquidPrecipDepth: String!
  liquidPrecipQuantity: String!
}

type EpwSnapshot {
  schema: String!
  location: EpwLocation!
  designConditions: String!
  typicalExtremePeriods: String!
  groundTemperatures: String!
  holidaysDst: String!
  comments1: String!
  comments2: String!
  dataPeriods: EpwDataPeriods!
  records: [EpwRecord!]!
}
