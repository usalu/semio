# 🧬️ EpwMutation union — mirrors 🦀️component.rs's tagged enum (modeled as one input type
# with the tag plus optional per-variant payload fields, mirroring the JSON Schema facet's oneOf).

enum EpwMutationTag {
  NO_MUTATION
  SET_SNAPSHOT
  SET_LOCATION
  SET_DESIGN_CONDITIONS
  SET_TYPICAL_EXTREME_PERIODS
  SET_GROUND_TEMPERATURES
  SET_HOLIDAYS_DST
  SET_COMMENTS_1
  SET_COMMENTS_2
  SET_DATA_PERIODS
  INSERT_RECORD
  REMOVE_RECORD
  SET_RECORD_FIELD
}

input EpwMutationInput {
  mutation: EpwMutationTag!
  snapshot: EpwSnapshotInput
  location: EpwLocationInput
  value: String
  dataPeriods: EpwDataPeriodsInput
  index: Int
  record: EpwRecordInput
  recordIndex: Int
  fieldIndex: Int
}
