# 🔺️ PdfDiff (1.4) — an index-keyed triple over the document's page tree. No full-replace slot:
# document differences stay sparse and page-addressed.
type PdfPageDiff {
  width: Float
  height: Float
  text: String
}
type PdfPageModified {
  index: Int!
  diff: PdfPageDiff!
}
type PdfPageAdded {
  index: Int!
  page: PageDoc!
}
type PdfPagesDiff {
  removed: [Int!]!
  modified: [PdfPageModified!]!
  added: [PdfPageAdded!]!
}
type PdfDiff {
  pages: PdfPagesDiff @state(class: ARTIFACT)
}
