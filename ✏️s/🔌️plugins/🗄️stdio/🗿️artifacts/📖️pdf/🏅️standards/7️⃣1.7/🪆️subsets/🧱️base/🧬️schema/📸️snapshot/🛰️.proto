syntax = "proto3";
package semio.s_stdio_pdf_1_7.snapshot;

message ObjRef {
  uint32 num = 1;
  uint32 gen = 2;
}

message PdfDictEntry {
  string key = 1;
  PdfObject value = 2;
}

message PdfDecimal {
  bool negative = 1;
  string coefficient = 2;
  uint32 scale = 3;
}

message PdfPredictor {
  uint32 predictor = 1;
  uint32 colors = 2;
  uint32 bits_per_component = 3;
  uint32 columns = 4;
}

message PdfStreamFilter {
  enum Kind { FLATE = 0; ASCII_HEX = 1; ASCII_85 = 2; RUN_LENGTH = 3; }
  Kind kind = 1;
  optional PdfPredictor predictor = 2;
}

// ISO 32000-1 §7.3 COS object grammar. `stream_data` is filter-decoded logical data.
message PdfObject {
  enum Kind {
    NULL = 0;
    BOOL = 1;
    INT = 2;
    REAL = 3;
    STR = 4;
    NAME = 5;
    ARRAY = 6;
    DICT = 7;
    REF = 8;
    STREAM = 9;
  }
  Kind kind = 1;
  bool bool_value = 2;
  int64 int_value = 3;
  PdfDecimal real_value = 4;
  bytes str_value = 5;
  string name_value = 6;
  repeated PdfObject array_value = 7;
  repeated PdfDictEntry dict_value = 8;
  ObjRef ref_value = 9;
  repeated PdfDictEntry stream_dict = 10;
  bytes stream_data = 11;
  repeated PdfStreamFilter stream_filters = 12;
}

message PdfIndirectObject {
  ObjRef id = 1;
  PdfObject value = 2;
}

message PdfPage {
  repeated double media_box = 1; // exactly 4
  repeated double crop_box = 2;  // exactly 4 when present, empty = unset
  int32 rotate = 3;
  string text = 4;
}

message PdfInfo {
  optional string title = 1;
  optional string author = 2;
  optional string subject = 3;
  optional string keywords = 4;
  optional string creator = 5;
  optional string producer = 6;
}

message PdfSnapshot {
  string schema = 1;
  string declared_version = 2;
  repeated PdfPage pages = 3;
  PdfInfo info = 4;
  repeated PdfIndirectObject objects = 5;
  repeated PdfDictEntry trailer = 6;
}
