syntax = "proto3";
package semio.s_stdio_pdf_1_7.mutation;

message PdfMutation {
  oneof mutation {
    InsertPageMutation insert_page = 1;
    RemovePageMutation remove_page = 2;
    SetPageMediaBoxMutation set_page_media_box = 3;
    SetPageCropBoxMutation set_page_crop_box = 4;
    AppendPageContentMutation append_page_content = 5;
    SetInfoMutation set_info = 6;
    InsertObjectMutation insert_object = 7;
    RemoveObjectMutation remove_object = 8;
    SetObjectValueMutation set_object_value = 9;
    SetDictEntryMutation set_dict_entry = 10;
    RemoveDictEntryMutation remove_dict_entry = 11;
    SetTrailerEntryMutation set_trailer_entry = 12;
    RemoveTrailerEntryMutation remove_trailer_entry = 13;
    MovePageMutation move_page = 14;
    SetPageContentMutation set_page_content = 15;
    SetPageRotationMutation set_page_rotation = 16;
  }
}
