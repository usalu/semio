syntax = "proto3";
package semio.s_stdio_xml.snapshot;

message XmlAttr {
  string name = 1;
  string value = 2;
}

message XmlNode {
  oneof node {
    XmlElement element = 1;
    XmlText text = 2;
    XmlCData c_data = 3;
    XmlComment comment = 4;
    XmlProcessingInstruction processing_instruction = 5;
  }
}

message XmlElement {
  string name = 1;
  repeated XmlAttr attrs = 2;
  repeated XmlNode children = 3;
}

message XmlText {
  string text = 1;
}

message XmlCData {
  string text = 1;
}

message XmlComment {
  string text = 1;
}

message XmlProcessingInstruction {
  string target = 1;
  string data = 2;
}

message XmlDeclaration {
  // 🗣️ Delimiter the pseudo-attributes are written with (XML 1.0 §2.8); unset = DOUBLE.
  enum Quote { DOUBLE = 0; SINGLE = 1; }
  string version = 1;
  optional string encoding = 2;
  optional bool standalone = 3;
  optional Quote quote = 4;
}

message XmlExternalId {
  enum Kind { SYSTEM = 0; PUBLIC = 1; }
  Kind kind = 1;
  optional string public_id = 2;
  string system_id = 3;
}
message XmlDtdEntity { bool parameter = 1; string name = 2; string value = 3; }
message XmlDoctype { string name = 1; optional XmlExternalId external_id = 2; repeated XmlDtdEntity declarations = 3; uint64 prolog_position = 4; }

message XmlDocument {
  optional XmlNode root = 1;
  optional XmlDoctype doctype = 2;
  optional XmlDeclaration declaration = 3;
  repeated XmlNode prolog = 4;
  repeated XmlNode epilog = 5;
}

message RetainedXmlAttribute { string name = 1; string value = 2; }
message RetainedXmlElement { string name = 1; uint64 first_attribute = 2; uint64 attribute_count = 3; optional uint64 first_child = 4; }
message RetainedXmlNodeValue {
  oneof node {
    RetainedXmlElement element = 1;
    XmlText text = 2;
    XmlCData c_data = 3;
    XmlComment comment = 4;
    XmlProcessingInstruction processing_instruction = 5;
  }
}
message RetainedXmlNode { optional uint64 next_sibling = 1; RetainedXmlNodeValue value = 2; }
message RetainedXmlDeclaration {
  string version = 1;
  optional string encoding = 2;
  optional bool standalone = 3;
  XmlDeclaration.Quote quote = 4;
}
message RetainedXmlDoctype {
  uint64 prolog_position = 1;
  string name = 2;
  optional XmlExternalId external_id = 3;
  repeated XmlDtdEntity declarations = 4;
}
message RetainedXmlDocument {
  repeated RetainedXmlNode nodes = 1;
  repeated RetainedXmlAttribute attributes = 2;
  repeated uint64 prolog = 3;
  repeated uint64 epilog = 4;
  optional uint64 root = 5;
  optional RetainedXmlDoctype doctype = 6;
  optional RetainedXmlDeclaration declaration = 7;
}

message XmlSnapshot {
  string schema = 1;
  XmlDocument doc = 2;
}
