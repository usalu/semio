""" 🏷️ XML attribute pair. """
type XmlAttr {
  name: String!
  value: String!
}

""" 🌳 XML node discriminant. """
enum XmlNodeKind {
  ELEMENT
  TEXT
  C_DATA
  COMMENT
  PROCESSING_INSTRUCTION
}

""" 🌳 XML node: element, text, CDATA, comment, or processing instruction -- a tagged union
represented flatly since GraphQL has no native sum type; only the fields matching `kind` are set.
"""
type XmlNode {
  kind: XmlNodeKind!
  name: String
  attrs: [XmlAttr!]
  children: [XmlNode!]
  text: String
  target: String
  data: String
}

""" 🏳️ Typed `<?xml version="1.0" encoding="..." standalone="..."?>` declaration. """
""" 🗣️ Delimiter the declaration's pseudo-attributes are written with (XML 1.0 §2.8). """
enum XmlQuote { DOUBLE SINGLE }

type XmlDeclaration {
  version: String!
  encoding: String
  standalone: Boolean
  quote: XmlQuote
}

enum XmlExternalIdKind { SYSTEM PUBLIC }
type XmlExternalId { kind: XmlExternalIdKind! publicId: String systemId: String! }
type XmlDtdEntity { parameter: Boolean! name: String! value: String! }
type XmlDoctype { prologPosition: Int! name: String! externalId: XmlExternalId declarations: [XmlDtdEntity!]! }

""" 📰 Well-formed XML document root. """
type XmlDocument {
  root: XmlNode
  doctype: XmlDoctype
  declaration: XmlDeclaration
  prolog: [XmlNode!]!
  epilog: [XmlNode!]!
}

scalar RetainedXmlIndex
type RetainedXmlAttribute { name: String! value: String! }
type RetainedXmlNodeValue {
  kind: XmlNodeKind!
  name: String
  firstAttribute: RetainedXmlIndex
  attributeCount: RetainedXmlIndex
  firstChild: RetainedXmlIndex
  text: String
  target: String
  data: String
}
type RetainedXmlNode { nextSibling: RetainedXmlIndex value: RetainedXmlNodeValue! }
type RetainedXmlDeclaration { version: String! encoding: String standalone: Boolean quote: XmlQuote! }
type RetainedXmlDoctype { prologPosition: String! name: String! externalId: XmlExternalId declarations: [XmlDtdEntity!]! }

""" 🗂️ Flat retained XML document authority. """
type RetainedXmlDocument {
  nodes: [RetainedXmlNode!]!
  attributes: [RetainedXmlAttribute!]!
  prolog: [RetainedXmlIndex!]!
  epilog: [RetainedXmlIndex!]!
  root: RetainedXmlIndex
  doctype: RetainedXmlDoctype
  declaration: RetainedXmlDeclaration
}

""" 📸️ Persisted `stdio.xml` snapshot. """
type XmlSnapshot {
  schema: String!
  doc: XmlDocument!
}
