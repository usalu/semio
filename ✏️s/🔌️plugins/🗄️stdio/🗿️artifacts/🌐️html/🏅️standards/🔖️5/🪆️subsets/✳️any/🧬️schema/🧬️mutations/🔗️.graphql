# 🌳 `HtmlNode` is NOT redefined here -- this facet relies on the sibling
# `../📸️snapshot/🔗️.graphql` types being present in the assembled schema.

"""✂️ One range of an edited source: `delete` Unicode scalars at `offset` are replaced by `insert`."""
type HtmlSourceSplice {
  offset: Int!
  delete: Int!
  insert: String!
}

enum HtmlMutationKind {
  SET_DOCTYPE
  INSERT_NODE
  REMOVE_NODE
  SET_ELEMENT_NAME
  SET_ATTRIBUTE
  SET_TEXT
  SET_COMMENT
  SET_RAW_TEXT
  SPLICE_SOURCE
}

""" 🧬️ HtmlMutation union, flattened -- only the fields matching `mutation` are set.
`insertNode`/`removeNode`'s `parent` addresses the PARENT element; every other path-carrying
variant's `path` addresses the target node itself. """
type HtmlMutation {
  mutation: HtmlMutationKind!
  snapshot: HtmlSnapshot
  doctype: String
  parent: [Int!]
  path: [Int!]
  index: Int
  node: HtmlNode
  name: String
  value: String
  text: String
  splices: [HtmlSourceSplice!]
}
