# 🔺️ PlyDiff schema — handcrafted sparse diff. Two collection levels nest: `elements`
# (name-keyed) → each modified element's `rows` (index-keyed).

type PlyRowFieldChange {
  name: String!
  value: PlyValue!
}

type PlyRowDiff {
  fields: [PlyRowFieldChange!]
}

type PlyRowModified {
  index: Int!
  diff: PlyRowDiff!
}

type PlyRowAdded {
  index: Int!
  row: PlyRow!
}

type PlyRowsDiff {
  removed: [Int!]
  modified: [PlyRowModified!]
  added: [PlyRowAdded!]
}

""" `properties` is a weak value-list — whole-vec replaced, never sub-diffed. """
type PlyElementDiff {
  count: UInt64
  properties: [PlyProperty!]
  rows: PlyRowsDiff
}

type PlyElementModified {
  name: String!
  diff: PlyElementDiff!
}

type PlyElementAdded {
  index: Int!
  element: PlyElement!
}

type PlyElementsDiff {
  removed: [String!]
  modified: [PlyElementModified!]
  added: [PlyElementAdded!]
}

type PlyCommentModified {
  index: Int!
  diff: String!
}
type PlyCommentAdded {
  index: Int!
  item: String!
}
type PlyCommentsDiff {
  removed: [Int!]
  modified: [PlyCommentModified!]
  added: [PlyCommentAdded!]
}

""" 🔺️ Diff for `stdio.ply`. `schema` is an identity field and never appears here. """
type PlyDiff {
  format: PlyFormat
  comments: PlyCommentsDiff
  elements: PlyElementsDiff
}
