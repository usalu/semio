syntax = "proto3";
package semio.s_stdio_ply.diff;

enum PlyScalarType {
  PLY_SCALAR_TYPE_UNSPECIFIED = 0;
  CHAR = 1;
  U_CHAR = 2;
  SHORT = 3;
  U_SHORT = 4;
  INT = 5;
  U_INT = 6;
  FLOAT = 7;
  DOUBLE = 8;
}

message PlyProperty {
  oneof form {
    ScalarProperty scalar = 1;
    ListProperty list = 2;
  }
  message ScalarProperty {
    string name = 1;
    PlyScalarType kind = 2;
  }
  message ListProperty {
    string name = 1;
    PlyScalarType count_kind = 2;
    PlyScalarType value_kind = 3;
  }
}

message PlyValue {
  PlyScalarType kind = 1;
  double scalar_value = 2;
  repeated PlyValue list_value = 3;
}

message PlyRow {
  repeated PlyValue values = 1;
}

message PlyElement {
  string name = 1;
  uint64 count = 2;
  repeated PlyProperty properties = 3;
  repeated PlyRow rows = 4;
}

enum PlyFormat {
  PLY_FORMAT_UNSPECIFIED = 0;
  ASCII = 1;
  BINARY_LITTLE_ENDIAN = 2;
  BINARY_BIG_ENDIAN = 3;
}

message PlyRowFieldChange {
  string name = 1;
  PlyValue value = 2;
}

message PlyRowDiff {
  repeated PlyRowFieldChange fields = 1;
}

message PlyRowModified {
  uint64 index = 1;
  PlyRowDiff diff = 2;
}

message PlyRowAdded {
  uint64 index = 1;
  PlyRow row = 2;
}

message PlyRowsDiff {
  repeated uint64 removed = 1;
  repeated PlyRowModified modified = 2;
  repeated PlyRowAdded added = 3;
}

// `properties` is a weak value-list — whole-vec replaced, never sub-diffed.
message PlyElementDiff {
  repeated PlyProperty properties = 1;
  PlyRowsDiff rows = 2;
}

message PlyElementModified {
  string name = 1;
  PlyElementDiff diff = 2;
}

message PlyElementAdded {
  uint64 index = 1;
  PlyElement element = 2;
}

message PlyElementsDiff {
  repeated string removed = 1;
  repeated PlyElementModified modified = 2;
  repeated PlyElementAdded added = 3;
}

// `schema` is an identity field and never appears here.
message PlyDiff {
  optional PlyFormat format = 1;
  repeated string comments = 2;
  PlyElementsDiff elements = 3;
}
