[package.metadata.semio.composition]
manifest = "../../🧩️composition/🔣️.json"

[package.metadata.semio.preparation]
script = "📜️script.ts"
command = ["composition", "prepare"]

[[test]]
name = "preparation_law"
path = "../../🧪️tests/⚙️preparation/🦀️.rs"

[[test]]
name = "native_prefix"
path = "../../🏅️standards/🔖️v1/🪆️subsets/✉️base/🚪️io/🪶️sqlite/📸️snapshot/🧪️tests/🫙️prefix/🦀️.rs"
