semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-contract = { workspace = true }
semio-s-artifact-stdio-semio-animation = { workspace = true }
semio-s-artifact-stdio-semio-audio = { workspace = true }
semio-s-artifact-stdio-semio-base = { workspace = true }
semio-s-artifact-stdio-semio-brep = { workspace = true }
semio-s-artifact-stdio-semio-cad = { workspace = true }
semio-s-artifact-stdio-semio-document = { workspace = true }
semio-s-artifact-stdio-semio-drawing = { workspace = true }
