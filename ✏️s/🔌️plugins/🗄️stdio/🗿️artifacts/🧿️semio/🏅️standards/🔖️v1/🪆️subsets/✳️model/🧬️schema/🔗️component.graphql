# SemioModelArtifact schema -- full artifact state, mirrors SemioModelSnapshot field for field.
type SemioModelArtifact {
  schema: String! @state(class: PERSISTENT)
  spatial: [SpatialNode!]! @state(class: PERSISTENT)
  elements: [SemioModelElement!]! @state(class: PERSISTENT)
  relations: [ModelRelation!]! @state(class: PERSISTENT)
}
