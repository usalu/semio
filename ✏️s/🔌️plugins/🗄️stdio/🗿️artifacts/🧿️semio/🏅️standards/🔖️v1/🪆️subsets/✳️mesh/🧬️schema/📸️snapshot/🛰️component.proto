syntax = "proto3";
// 🧬️ SemioMeshSnapshot schema — real mirror of `🦀️component.rs`.
package semio.s_stdio_semio_mesh.snapshot;

enum SemioTopology {
  POINTS = 0;
  LINES = 1;
  LINE_STRIP = 2;
  TRIANGLES = 3;
  TRIANGLE_STRIP = 4;
  TRIANGLE_FAN = 5;
}

message SemioPoint3 { double x = 1; double y = 2; double z = 3; }
message SemioUv { double u = 1; double v = 2; }
message SemioRgba { float r = 1; float g = 2; float b = 3; float a = 4; }

message SemioPrimitive {
  string id = 1;
  SemioTopology topology = 2;
  repeated SemioPoint3 positions = 3;
  repeated SemioPoint3 normals = 4;
  repeated SemioUv uvs = 5;
  repeated SemioRgba colors = 6;
  repeated uint32 indices = 7;
  optional string material_id = 8;
}

message SemioMesh {
  string id = 1;
  repeated SemioPrimitive primitives = 2;
}

message SemioMaterial {
  string id = 1;
  SemioRgba base_color = 2;
  float metallic = 3;
  float roughness = 4;
}

message SemioTexture {
  string id = 1;
  string mime = 2;
  bytes bytes_ = 3;
}

message SemioMeshSnapshot {
  string schema = 1;
  repeated SemioMesh meshes = 2;
  repeated SemioMaterial materials = 3;
  repeated SemioTexture textures = 4;
}
