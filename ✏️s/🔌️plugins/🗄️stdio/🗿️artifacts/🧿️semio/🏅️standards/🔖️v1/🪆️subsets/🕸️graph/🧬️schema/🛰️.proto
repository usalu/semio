syntax = "proto3";
// 🧬️ SemioGraphArtifact schema — full artifact state, mirrors `SemioGraphSnapshot` field for field.
package semio.s_stdio_semio_graph.artifact;

import "📸️snapshot/🛰️.proto";

message SemioGraphArtifact {
  string schema = 1;
  repeated semio.s_stdio_semio_graph.snapshot.SemioGraphNode nodes = 2;
  repeated semio.s_stdio_semio_graph.snapshot.SemioGraphEdge edges = 3;
}
