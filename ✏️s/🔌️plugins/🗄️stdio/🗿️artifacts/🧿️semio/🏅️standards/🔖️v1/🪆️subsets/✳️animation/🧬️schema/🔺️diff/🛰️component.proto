syntax = "proto3";
// 🔺️ SemioAnimationDiff schema — real mirror of `🦀️component.rs`. No full-replace slot.
// timelines/channels/keyframes are index-keyed removed/modified/added triples, monomorphized per
// nesting level.
package semio.s_stdio_semio_animation.diff;

import "../📸️snapshot/🛰️component.proto";

message AnimKeyframeDiff {
  optional double t = 1;
  semio.s_stdio_semio_animation.snapshot.AnimValue value = 2;
}

message KeyframeModified { uint32 index = 1; AnimKeyframeDiff diff = 2; }
message KeyframeAdded { uint32 index = 1; semio.s_stdio_semio_animation.snapshot.AnimKeyframe item = 2; }
message KeyframeTripleDiff { repeated uint32 removed = 1; repeated KeyframeModified modified = 2; repeated KeyframeAdded added = 3; }

message AnimChannelDiff {
  semio.s_stdio_semio_animation.snapshot.AnimTarget target = 1;
  optional semio.s_stdio_semio_animation.snapshot.AnimInterpolation interpolation = 2;
  KeyframeTripleDiff keyframes = 3;
}

message ChannelModified { uint32 index = 1; AnimChannelDiff diff = 2; }
message ChannelAdded { uint32 index = 1; semio.s_stdio_semio_animation.snapshot.AnimChannel item = 2; }
message ChannelTripleDiff { repeated uint32 removed = 1; repeated ChannelModified modified = 2; repeated ChannelAdded added = 3; }

message AnimTimelineDiff {
  optional string name = 1; // tri-state carried by has_name below
  bool has_name = 2;
  ChannelTripleDiff channels = 3;
}

message TimelineModified { uint32 index = 1; AnimTimelineDiff diff = 2; }
message TimelineAdded { uint32 index = 1; semio.s_stdio_semio_animation.snapshot.AnimTimeline item = 2; }
message TimelineTripleDiff { repeated uint32 removed = 1; repeated TimelineModified modified = 2; repeated TimelineAdded added = 3; }

message SemioAnimationDiff {
  TimelineTripleDiff timelines = 1;
}
