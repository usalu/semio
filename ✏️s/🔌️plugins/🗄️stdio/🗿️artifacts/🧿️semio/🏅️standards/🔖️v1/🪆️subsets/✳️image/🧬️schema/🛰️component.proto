syntax = "proto3";
// 🧬️ SemioImageArtifact schema — real facet mirror of the Rust `🦀️component.rs` sibling.
package semio.s_stdio_semio_image.artifact;

message SemioImageFrame {
  uint32 delay_ms = 1;
  bytes rgba8 = 2;
}
message SemioImageMetadataEntry {
  string key = 1;
  string value = 2;
}
message SemioImageArtifact {
  string schema = 1;
  uint32 width = 2;
  uint32 height = 3;
  string colorspace = 4;
  uint32 bit_depth = 5;
  repeated SemioImageFrame frames = 6;
  optional bytes icc = 7;
  repeated SemioImageMetadataEntry metadata = 8;
}
