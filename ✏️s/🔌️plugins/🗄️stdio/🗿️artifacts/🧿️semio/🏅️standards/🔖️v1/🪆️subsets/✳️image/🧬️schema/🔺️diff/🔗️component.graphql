# 🔺️ SemioImageDiff schema — real facet mirror of the Rust `🦀️component.rs` sibling.
type SemioImageFrameDiff {
  delayMs: Int
  rgba8: String
}
type IndexModifiedFrame { index: Int! diff: SemioImageFrameDiff! }
type IndexAddedFrame { index: Int! item: SemioImageFrameJson! }
type SemioImageFrameJson { delayMs: Int! rgba8: String! }
type SemioImageFramesDiff {
  removed: [Int!]!
  modified: [IndexModifiedFrame!]!
  added: [IndexAddedFrame!]!
}

type NamedModifiedMetadata { key: String! diff: String! }
type SemioImageMetadataEntryJson { key: String! value: String! }
type SemioImageMetadataDiff {
  removed: [String!]!
  modified: [NamedModifiedMetadata!]!
  added: [SemioImageMetadataEntryJson!]!
}

type SemioImageDiff {
  width: Int
  height: Int
  colorspace: String
  bitDepth: Int
  icc: String
  frames: SemioImageFramesDiff
  metadata: SemioImageMetadataDiff
}
