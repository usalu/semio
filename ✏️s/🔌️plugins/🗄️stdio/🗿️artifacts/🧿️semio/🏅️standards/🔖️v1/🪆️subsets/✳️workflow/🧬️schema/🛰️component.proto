syntax = "proto3";
// 🧬️ SemioWorkflowArtifact schema — real facet mirror of 🦀️component.rs.
package semio.s_stdio_semio_workflow.artifact;

message SemioPoint2 {
  double x = 1;
  double y = 2;
}
message PortRef {
  string node = 1;
  string port = 2;
}
message WorkflowParam {
  string key = 1;
  string value = 2;
}
message WorkflowNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  repeated WorkflowParam params = 4;
  SemioPoint2 position = 5;
}
message WorkflowEdge {
  string id = 1;
  PortRef from = 2;
  PortRef to = 3;
  string kind = 4;
}
message SemioWorkflowArtifact {
  string schema = 1;
  repeated WorkflowNode nodes = 2;
  repeated WorkflowEdge edges = 3;
}
