syntax = "proto3";
// 🧬️ SemioObjectArtifact schema — real facet mirror of the Rust `🦀️.rs` sibling.
package semio.s_stdio_semio_object.artifact;

message ArtifactChildHandle {
  string child_id = 1;
  string target = 2;
}
message SemioObjectArtifact {
  string schema = 1;
  bytes transform_wire = 2;
  ArtifactChildHandle brep = 3;
  ArtifactChildHandle mesh = 4;
  ArtifactChildHandle properties = 5;
}
