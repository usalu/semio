syntax = "proto3";
// 🧬️ SemioVideoSnapshot facet mirror — container-typed, payload-opaque.
package semio.s_stdio_semio_video.snapshot;

enum SemioVideoStreamKind {
  VIDEO = 0;
  AUDIO = 1;
  SUBTITLE = 2;
}

message SemioRational {
  int64 num = 1;
  int64 den = 2;
}

message SemioVideoSample {
  uint64 pts = 1;
  bool key = 2;
  bytes data = 3; // opaque compressed payload
}

message SemioVideoStream {
  SemioVideoStreamKind kind = 1;
  string codec = 2;
  uint32 width = 3;
  uint32 height = 4;
  SemioRational rate = 5;
  repeated SemioVideoSample samples = 6;
}

message SemioVideoSnapshot {
  string schema = 1;
  repeated SemioVideoStream streams = 2;
}
