syntax = "proto3";
// 🧬️ SemioTextArtifact schema — real facet mirror of the Rust `🦀️component.rs` sibling.
package semio.s_stdio_semio_text.artifact;

enum SemioTextMarkKind {
  BOLD = 0;
  ITALIC = 1;
  CODE = 2;
  LINK = 3;
}
message SemioTextMark {
  SemioTextMarkKind kind = 1;
  string href = 2;
}
message SemioTextRun {
  string language = 1;
  string content = 2;
  repeated SemioTextMark marks = 3;
}
message SemioTextArtifact {
  string schema = 1;
  repeated SemioTextRun runs = 2;
}
