# 🔺️ SemioCadDiff schema — real facet mirror of `🦀️.rs` (source of truth).
type CadLayerDiff {
  colorIndex: Int
  lineType: String
  visible: Boolean
}

type CadEntityRecordDiff {
  layer: String
  entity: CadEntity
}

type CadBlockDiff {
  basePoint: SemioPoint2
  entities: CadEntitiesDiff
}

type CadLayerModified { key: String! diff: CadLayerDiff! }
type CadLayersDiff { removed: [String!]! modified: [CadLayerModified!]! added: [CadLayerAdded!]! }

type CadBlockModified { key: String! diff: CadBlockDiff! }
type CadBlocksDiff { removed: [String!]! modified: [CadBlockModified!]! added: [CadBlockAdded!]! }

type CadEntityRecordModified { key: String! diff: CadEntityRecordDiff! }
type CadEntitiesDiff { removed: [String!]! modified: [CadEntityRecordModified!]! added: [CadEntityRecordAdded!]! }

type SemioCadDiff {
  layers: CadLayersDiff
  blocks: CadBlocksDiff
  entities: CadEntitiesDiff
}

type CadLayerAdded { index: Int! item: CadLayer! }
type CadBlockAdded { index: Int! item: CadBlock! }
type CadEntityRecordAdded { index: Int! item: CadEntityRecord! }
