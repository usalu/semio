# 🧭️ Own workspace root: never joins the repository's root workspace, whose root manifest is a shared,
# contended file.
#
# 🚫️ DEPENDS ON `json` (json-rust) AND NOTHING ELSE — never `serde_json`, which the subject crate links in
# production. `SemioDocumentSnapshot::images` is an INLINE `Vec<DocImage>` carrying `{id, mime, bytes}`
# directly in this subset's own JSON export, so `insert-image`, `remove-image` and `set-image-bytes` are
# carrier-level facts a third-party JSON implementation can witness in full.
[workspace]

[package]
name = "semio-document-json-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "../../🏗️generate/🦀️.rs"

[[bin]]
name = "reader"
path = "../../📖️reader/🦀️.rs"

[lib]
name = "semio_document_json"
path = "../../🦀️.rs"

[dependencies]
json = "0.12"
