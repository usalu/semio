# 🧬️ SemioMeshArtifact schema — full artifact state, mirrors SemioMeshSnapshot field for field.
type SemioMeshArtifact {
  schema: String! @state(class: ARTIFACT)
  meshes: [SemioMesh!]! @state(class: ARTIFACT)
  materials: [SemioMaterial!]! @state(class: ARTIFACT)
  textures: [SemioTexture!]! @state(class: ARTIFACT)
}
