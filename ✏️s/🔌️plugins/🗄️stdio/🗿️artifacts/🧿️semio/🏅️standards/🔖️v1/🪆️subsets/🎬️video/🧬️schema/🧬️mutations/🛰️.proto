syntax = "proto3";
// 🧬️ SemioVideoMutation facet mirror — named-variant union, discriminated on `mutation`.
package semio.s_stdio_semio_video.mutations;
import "../📸️snapshot/🛰️.proto";
import "../🔺️diff/🛰️.proto";

enum SemioVideoMutationTag {
  SET_SNAPSHOT = 0;
  INSERT_STREAM = 2;
  REMOVE_STREAM = 3;
  SET_STREAM_META = 4;
  INSERT_SAMPLE = 5;
  REMOVE_SAMPLE = 6;
  SET_SAMPLE_DATA = 7;
  SET_SAMPLE_FLAGS = 8;
}

message SemioVideoMutation {
  SemioVideoMutationTag mutation = 1;
  semio.s_stdio_semio_video.snapshot.SemioVideoSnapshot snapshot = 2;
  optional uint64 index = 3;
  semio.s_stdio_semio_video.snapshot.SemioVideoStream stream = 4;
  optional semio.s_stdio_semio_video.snapshot.SemioVideoStreamKind kind = 5;
  optional string codec = 6;
  optional uint32 width = 7;
  optional uint32 height = 8;
  semio.s_stdio_semio_video.snapshot.SemioRational rate = 9;
  optional uint64 stream_index = 10;
  semio.s_stdio_semio_video.snapshot.SemioVideoSample sample = 11;
  optional bytes data = 12;
  optional uint64 pts = 13;
  optional bool key = 14;
}
