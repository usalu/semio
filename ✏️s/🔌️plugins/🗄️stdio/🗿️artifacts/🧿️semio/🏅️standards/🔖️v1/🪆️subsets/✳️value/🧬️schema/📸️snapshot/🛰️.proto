syntax = "proto3";
// 🧬️ SemioValueSnapshot facet mirror — mirrors the 🦀️.rs sibling's real fields.
package semio.s_stdio_semio_value.snapshot;

message ValueId {
  string value = 1;
}

message SemioValueEntry {
  string key = 1;
  SemioValue value = 2;
}

message SemioValueNode {
  ValueId id = 1;
  SemioValue value = 2;
}

message SemioValue {
  oneof kind {
    bool is_null = 1;
    bool bool_value = 2;
    string int_lexeme = 3;
    string float_lexeme = 4;
    string str_value = 5;
    bytes bytes_value = 6;
    SemioValueList list = 7;
    SemioValueMap map = 8;
    ValueId ref_id = 9;
  }
}

message SemioValueList {
  repeated SemioValue items = 1;
}

message SemioValueMap {
  repeated SemioValueEntry entries = 1;
}

message SemioValueSnapshot {
  string schema = 1;
  SemioValue root = 2;
  repeated SemioValueNode nodes = 3;
}
