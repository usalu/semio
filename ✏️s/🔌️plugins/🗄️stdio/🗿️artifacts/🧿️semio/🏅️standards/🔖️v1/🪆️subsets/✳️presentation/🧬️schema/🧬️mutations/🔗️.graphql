# 🧬️ SemioPresentationMutation — named-variant vocabulary.
enum PresentationMutationTag {
  SET_SNAPSHOT, INSERT_SLIDE, REMOVE_SLIDE, SET_SLIDE_LAYOUT, SET_SLIDE_NOTES,
  INSERT_SHAPE, REMOVE_SHAPE, SET_SHAPE_FRAME, SET_TEXTBOX_BLOCKS,
  INSERT_MASTER, REMOVE_MASTER, INSERT_LAYOUT, REMOVE_LAYOUT, SET_LAYOUT_MASTER
}

type SemioPresentationMutation {
  mutation: PresentationMutationTag!
  index: Int
  slideIndex: Int
  shapeIndex: Int
  id: String
  masterId: String
  layoutId: String
  snapshotJson: String
  slideJson: String
  shapeJson: String
  frameJson: String
  blocksJson: String
  masterJson: String
  layoutJson: String
}
