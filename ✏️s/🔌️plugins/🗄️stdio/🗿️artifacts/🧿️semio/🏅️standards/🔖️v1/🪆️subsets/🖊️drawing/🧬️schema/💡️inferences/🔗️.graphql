# 💡️ SemioDrawing inference schema — flattenedScene (world transform + resolved style) per
# scene-graph entity.

type SemioDrawingInference {
  flattenedScene: [SemioDrawingFlattenedSceneEntry!]! @derived
}

type SemioDrawingFlattenedSceneEntry {
  key: String!
  node: FlattenedNode!
}

type FlattenedNode {
  worldTransform: Transform!
  resolvedStyle: DrawStyle
}

type Rgba {
  r: Float!
  g: Float!
  b: Float!
  a: Float!
}

type DrawStyle {
  name: String!
  fill: Rgba
  stroke: Rgba
  strokeWidth: Float
  opacity: Float
}

type Transform {
  translation: [Float!]!
  rotation: [Float!]!
  scale: [Float!]!
}
