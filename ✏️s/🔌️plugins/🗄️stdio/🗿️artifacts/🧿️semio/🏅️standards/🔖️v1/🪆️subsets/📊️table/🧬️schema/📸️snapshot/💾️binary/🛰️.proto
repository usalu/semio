syntax = "proto3";
// 💾️ SemioTableSnapshot binary frame — descriptive twin of 📡️.protocol.semio.
package semio.s_stdio_semio_table.snapshot.binary;

message SemioTableSnapshotFrame {
  uint32 format = 1;
  bytes schema = 2;
  bytes payload = 3; // opaque: columns + rows, protocol-array-of-records gap
}

message SemioTableSnapshotBinaryFrame {
  optional int64 format = 1;
  optional int64 schema_len = 2;
  optional string schema_bytes = 3;
  optional string payload = 4;
}
