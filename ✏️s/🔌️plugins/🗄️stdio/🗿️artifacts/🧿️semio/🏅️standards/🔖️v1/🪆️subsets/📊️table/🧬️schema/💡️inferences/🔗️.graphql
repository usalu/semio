# 💡️ Semio table inference schema — dimensions + declared column-kind census.

type SemioTableInference {
  shape: SemioTableShape! @derived
}

type SemioTableShape {
  columnCount: Int!
  rowCount: Int!
  nullColumnCount: Int!
  boolColumnCount: Int!
  intColumnCount: Int!
  floatColumnCount: Int!
  strColumnCount: Int!
  bytesColumnCount: Int!
}
