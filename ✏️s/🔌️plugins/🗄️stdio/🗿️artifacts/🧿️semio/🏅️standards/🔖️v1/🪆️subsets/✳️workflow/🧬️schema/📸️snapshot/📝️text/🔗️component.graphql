# 🧬️ SemioWorkflowSnapshot schema (TEXT representation facet mirror) — real, matches the facet root.
type SemioPoint2 {
  x: Float!
  y: Float!
}
type PortRef {
  node: String!
  port: String!
}
type WorkflowParam {
  key: String!
  value: String!
}
type WorkflowNode {
  id: String!
  kind: String!
  label: String!
  params: [WorkflowParam!]!
  position: SemioPoint2!
}
type WorkflowEdge {
  id: String!
  from: PortRef!
  to: PortRef!
  kind: String!
}
type SemioWorkflowSnapshot {
  schema: String! @state(class: PERSISTENT)
  nodes: [WorkflowNode!]! @state(class: PERSISTENT)
  edges: [WorkflowEdge!]! @state(class: PERSISTENT)
}
