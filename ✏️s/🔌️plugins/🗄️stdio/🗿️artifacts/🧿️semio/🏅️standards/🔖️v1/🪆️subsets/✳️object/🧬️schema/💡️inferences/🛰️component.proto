syntax = "proto3";
package semio.s.stdio.semio.object.inference;

// 💡️ Semio object inference schema — composition census + own placement.

message SemioObjectInference {
  // @state inferred
  SemioObjectComposition composition = 1;
}

message SemioObjectComposition {
  bool has_brep = 1;
  bool has_mesh = 2;
  bool has_properties = 3;
  SemioPoint3 position = 4;
}

message SemioPoint3 {
  double x = 1;
  double y = 2;
  double z = 3;
}
