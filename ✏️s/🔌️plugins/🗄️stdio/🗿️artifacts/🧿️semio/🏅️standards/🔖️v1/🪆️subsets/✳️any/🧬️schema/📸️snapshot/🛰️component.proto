syntax = "proto3";
// 🧬️ SemioSnapshot schema — real mirror of `🦀️component.rs`. The envelope union over all 13
// domain subsets. Proto packages never cross-import between subsets (each subset's own mirror is
// its own top-level package), so every variant below carries the referenced subset's own snapshot
// as a length-prefixed OPAQUE `bytes` field — that subset's own wire form, produced/consumed only
// by that subset's own codec — rather than a cross-package message reference.
package semio.s_stdio_semio.snapshot;

message SemioSubsetSnapshot {
  oneof subset {
    bytes brep = 1;         // SemioBrepSnapshot (brep subset's own wire form)
    bytes mesh = 2;          // SemioMeshSnapshot (mesh subset's own wire form)
    bytes model = 3;         // SemioModelSnapshot (model subset's own wire form)
    bytes value = 4;        // SemioValueSnapshot (value subset's own wire form)
    bytes document = 5;      // SemioDocumentSnapshot (document subset's own wire form)
    bytes cad = 6;           // SemioCadSnapshot (cad subset's own wire form)
    bytes drawing = 7;       // SemioDrawingSnapshot (drawing subset's own wire form)
    bytes image = 8;         // SemioImageSnapshot (image subset's own wire form)
    bytes video = 9;         // SemioVideoSnapshot (video subset's own wire form)
    bytes audio = 10;        // SemioAudioSnapshot (audio subset's own wire form)
    bytes animation = 11;    // SemioAnimationSnapshot (animation subset's own wire form)
    bytes presentation = 12; // SemioPresentationSnapshot (presentation subset's own wire form)
    bytes flow = 13;     // SemioFlowSnapshot (flow subset's own wire form)
  }
}

message SemioSnapshot {
  string schema = 1;
  SemioSubsetSnapshot subset = 2;
}
