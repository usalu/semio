# SemioModelMutation union mirror -- named-variant vocabulary, discriminated on `mutation`.

enum SemioModelMutationTag {
  INSERT_SPATIAL_NODE REMOVE_SPATIAL_NODE SET_SPATIAL_NODE
  INSERT_ELEMENT REMOVE_ELEMENT SET_ELEMENT
  INSERT_RELATION REMOVE_RELATION SET_RELATION
  DRAG_ELEMENTS ROTATE_ELEMENTS SCALE_ELEMENTS
}

type SemioModelMutation {
  mutation: SemioModelMutationTag!
  node: SpatialNode
  element: SemioModelElement
  relation: ModelRelation
  id: String
  kind: String
  name: String
  parentId: String
  placement: SemioTransform
  class: ElementClass
  geometry: GeometryRef
  spatialId: String
  psets: [PropertySet!]
  from: String
  to: String
  targets: [String!]
  offset: [Float!]
  axis: [Float!]
  angle: Float
  factors: [Float!]
}
