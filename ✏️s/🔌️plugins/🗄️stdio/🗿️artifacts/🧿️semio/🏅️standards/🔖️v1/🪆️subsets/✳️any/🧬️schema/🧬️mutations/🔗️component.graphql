# 🧬️ SemioMutation schema — real mirror of `🦀️component.rs`. The envelope union's own mutation
# vocabulary: `SetSnapshot` (the only way to change SUBSET KIND — no sparse representation exists
# for "this artifact used to be a video, now it's a flow") and 18 wrapper variants each carrying
# that subset's OWN, already-real, already-hand-written mutation enum unchanged. `NoMutation` was
# dropped from the Rust side (`#[derive(dsl::Mutations)]` requires every variant to wrap exactly
# one leaf payload, and `no` is not an approved semantic verb) — a "do nothing" mutation is now
# expressed as `SetSnapshot` with the current snapshot unchanged. Adjacently tagged (`#[serde(tag =
# "mutation", content = "payload")]`, NOT internally tagged like every wrapped subset's own mutation
# enum — an internally-tagged wrapper here would collide key-for-key with a wrapped variant's OWN
# `mutation` discriminator field), so every non-unit variant below carries its data under a named
# `payload` field.


type SemioMutationSetSnapshotPayload { snapshot: SemioSnapshot! } # SemioSnapshot: defined in this subset's own snapshot mirror
type SemioMutationSetSnapshot { mutation: String!, payload: SemioMutationSetSnapshotPayload! }

type SemioMutationBrep { mutation: String!, payload: SemioBrepMutation! } # defined in ✳️brep's own mutations mirror
type SemioMutationMesh { mutation: String!, payload: SemioMeshMutation! } # defined in ✳️mesh's own mutations mirror
type SemioMutationModel { mutation: String!, payload: SemioModelMutation! } # defined in ✳️model's own mutations mirror
type SemioMutationValue { mutation: String!, payload: SemioValueMutation! } # defined in ✳️value's own mutations mirror
type SemioMutationDocument { mutation: String!, payload: SemioDocumentMutation! } # defined in ✳️document's own mutations mirror
type SemioMutationCad { mutation: String!, payload: SemioCadMutation! } # defined in ✳️cad's own mutations mirror
type SemioMutationDrawing { mutation: String!, payload: SemioDrawingMutation! } # defined in ✳️drawing's own mutations mirror
type SemioMutationImage { mutation: String!, payload: SemioImageMutation! } # defined in ✳️image's own mutations mirror
type SemioMutationVideo { mutation: String!, payload: SemioVideoMutation! } # defined in ✳️video's own mutations mirror
type SemioMutationAudio { mutation: String!, payload: SemioAudioMutation! } # defined in ✳️audio's own mutations mirror
type SemioMutationAnimation { mutation: String!, payload: SemioAnimationMutation! } # defined in ✳️animation's own mutations mirror
type SemioMutationPresentation { mutation: String!, payload: SemioPresentationMutation! } # defined in ✳️presentation's own mutations mirror
type SemioMutationFlow { mutation: String!, payload: SemioFlowMutation! } # defined in ✳️flow's own mutations mirror
type SemioMutationText { mutation: String!, payload: SemioTextMutation! } # defined in ✳️text's own mutations mirror
type SemioMutationTable { mutation: String!, payload: SemioTableMutation! } # defined in ✳️table's own mutations mirror
type SemioMutationGraph { mutation: String!, payload: SemioGraphMutation! } # defined in ✳️graph's own mutations mirror
type SemioMutationObject { mutation: String!, payload: SemioObjectMutation! } # defined in ✳️object's own mutations mirror
type SemioMutationKit { mutation: String!, payload: SemioKitMutation! } # defined in ✳️kit's own mutations mirror

union SemioMutation =
  | SemioMutationSetSnapshot
  | SemioMutationBrep
  | SemioMutationMesh
  | SemioMutationModel
  | SemioMutationValue
  | SemioMutationDocument
  | SemioMutationCad
  | SemioMutationDrawing
  | SemioMutationImage
  | SemioMutationVideo
  | SemioMutationAudio
  | SemioMutationAnimation
  | SemioMutationPresentation
  | SemioMutationFlow
  | SemioMutationText
  | SemioMutationTable
  | SemioMutationGraph
  | SemioMutationObject
  | SemioMutationKit
