syntax = "proto3";
// 🧬️ SemioAnimationMutation schema — real mirror of `🦀️component.rs` (the source of truth).
package semio.s_stdio_semio_animation.mutations;

import "../📸️snapshot/🛰️component.proto";

message SetSnapshot { semio.s_stdio_semio_animation.snapshot.SemioAnimationSnapshot snapshot = 1; }
message InsertTimeline { uint32 index = 1; semio.s_stdio_semio_animation.snapshot.AnimTimeline timeline = 2; }
message RemoveTimeline { uint32 index = 1; }
message SetTimelineName { uint32 index = 1; optional string name = 2; bool has_name = 3; }
message InsertChannel { uint32 timeline_index = 1; uint32 index = 2; semio.s_stdio_semio_animation.snapshot.AnimChannel channel = 3; }
message RemoveChannel { uint32 timeline_index = 1; uint32 index = 2; }
message SetChannelTarget { uint32 timeline_index = 1; uint32 index = 2; semio.s_stdio_semio_animation.snapshot.AnimTarget target = 3; }
message SetChannelInterpolation { uint32 timeline_index = 1; uint32 index = 2; semio.s_stdio_semio_animation.snapshot.AnimInterpolation interpolation = 3; }
message InsertKeyframe { uint32 timeline_index = 1; uint32 channel_index = 2; uint32 index = 3; semio.s_stdio_semio_animation.snapshot.AnimKeyframe keyframe = 4; }
message RemoveKeyframe { uint32 timeline_index = 1; uint32 channel_index = 2; uint32 index = 3; }
message SetKeyframeTime { uint32 timeline_index = 1; uint32 channel_index = 2; uint32 index = 3; double t = 4; }
message SetKeyframeValue { uint32 timeline_index = 1; uint32 channel_index = 2; uint32 index = 3; semio.s_stdio_semio_animation.snapshot.AnimValue value = 4; }

message SemioAnimationMutation {
  oneof mutation {
    bool no_mutation = 1;
    SetSnapshot set_snapshot = 2;
    InsertTimeline insert_timeline = 3;
    RemoveTimeline remove_timeline = 4;
    SetTimelineName set_timeline_name = 5;
    InsertChannel insert_channel = 6;
    RemoveChannel remove_channel = 7;
    SetChannelTarget set_channel_target = 8;
    SetChannelInterpolation set_channel_interpolation = 9;
    InsertKeyframe insert_keyframe = 10;
    RemoveKeyframe remove_keyframe = 11;
    SetKeyframeTime set_keyframe_time = 12;
    SetKeyframeValue set_keyframe_value = 13;
  }
}
