syntax = "proto3";
// 🔺️ SemioDiff schema — real mirror of `🦀️component.rs`. The envelope union's own diff: NoChange,
// 13 same-kind opaque-wire wrappers, and Replace (cross-kind change / explicit SetSnapshot).
// Proto packages never cross-import between subsets, so each same-kind field is that subset's own
// OPAQUE diff wire form; `replace` reuses this package's own SemioSnapshot message directly (same
// subset, real message reference, not opaque bytes).
package semio.s_stdio_semio.diff;

import "../📸️snapshot/🛰️component.proto";

message SemioDiff {
  oneof kind {
    bool no_change = 1;
    bytes brep = 2;         // SemioBrepDiff (brep subset's own wire form)
    bytes mesh = 3;          // SemioMeshDiff (mesh subset's own wire form)
    bytes model = 4;         // SemioModelDiff (model subset's own wire form)
    bytes value = 5;        // SemioValueTreeDiff (value subset's own wire form)
    bytes document = 6;      // SemioDocumentDiff (document subset's own wire form)
    bytes cad = 7;           // SemioCadDiff (cad subset's own wire form)
    bytes drawing = 8;       // SemioDrawingDiff (drawing subset's own wire form)
    bytes image = 9;         // SemioImageDiff (image subset's own wire form)
    bytes video = 10;        // SemioVideoDiff (video subset's own wire form)
    bytes audio = 11;        // SemioAudioDiff (audio subset's own wire form)
    bytes animation = 12;    // SemioAnimationDiff (animation subset's own wire form)
    bytes presentation = 13; // SemioPresentationDiff (presentation subset's own wire form)
    bytes flow = 14;     // SemioFlowDiff (flow subset's own wire form)
    semio.s_stdio_semio.snapshot.SemioSnapshot replace = 15;
  }
}
