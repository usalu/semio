# 🔺️ SemioDiff schema — real mirror of `🦀️.rs`. The envelope union's own diff: `NoChange`,
# 13 same-kind wrappers each nesting that subset's own REAL diff type unchanged, and `Replace` (the
# escape hatch for a genuine cross-kind change or an explicit `SetSnapshot` mutation — there is no
# sparse representation for "this artifact used to be a video, now it's a flow"). Tag key is
# `kind` (not `subset` — distinct from the snapshot facet's own tag key), tag values are
# lowerCamelCase (`noChange`, `brep`, …, `flow`, `replace`). Same one-type-per-variant,
# reference-by-name convention as the snapshot facet's own `📸️snapshot/🔗️.graphql`.

type SemioDiffNoChange { kind: String! }
type SemioDiffBrep { kind: String!, brep: SemioBrepDiff! } # defined in 🧊️brep's own diff mirror
type SemioDiffMesh { kind: String!, mesh: SemioMeshDiff! } # defined in 🔺️mesh's own diff mirror
type SemioDiffModel { kind: String!, model: SemioModelDiff! } # defined in 🏛️model's own diff mirror
type SemioDiffValue { kind: String!, value: SemioValueTreeDiff! } # defined in 🔢️value's own diff mirror
type SemioDiffDocument { kind: String!, document: SemioDocumentDiff! } # defined in 📑️document's own diff mirror
type SemioDiffCad { kind: String!, cad: SemioCadDiff! } # defined in 📐️cad's own diff mirror
type SemioDiffDrawing { kind: String!, drawing: SemioDrawingDiff! } # defined in 🖊️drawing's own diff mirror
type SemioDiffImage { kind: String!, image: SemioImageDiff! } # defined in 🖼️image's own diff mirror
type SemioDiffVideo { kind: String!, video: SemioVideoDiff! } # defined in 🎬️video's own diff mirror
type SemioDiffAudio { kind: String!, audio: SemioAudioDiff! } # defined in 🔊️audio's own diff mirror
type SemioDiffAnimation { kind: String!, animation: SemioAnimationDiff! } # defined in 🎞️animation's own diff mirror
type SemioDiffPresentation { kind: String!, presentation: SemioPresentationDiff! } # defined in 📽️presentation's own diff mirror
type SemioDiffFlow { kind: String!, flow: SemioFlowDiff! } # defined in 🌊️flow's own diff mirror
type SemioDiffReplace { kind: String!, snapshot: SemioSnapshot! } # SemioSnapshot: defined in this subset's own snapshot mirror

union SemioDiff =
    SemioDiffNoChange
  | SemioDiffBrep
  | SemioDiffMesh
  | SemioDiffModel
  | SemioDiffValue
  | SemioDiffDocument
  | SemioDiffCad
  | SemioDiffDrawing
  | SemioDiffImage
  | SemioDiffVideo
  | SemioDiffAudio
  | SemioDiffAnimation
  | SemioDiffPresentation
  | SemioDiffFlow
  | SemioDiffReplace
