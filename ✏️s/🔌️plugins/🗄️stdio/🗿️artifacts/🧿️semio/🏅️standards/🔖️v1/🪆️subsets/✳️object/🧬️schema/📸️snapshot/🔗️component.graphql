# 🧬️ SemioObjectSnapshot facet mirror — mirrors the `🦀️component.rs` sibling's real fields.
enum SemioValueKind { NULL BOOL INT FLOAT STR BYTES LIST MAP REF }

type ObjectId {
  value: String!
}

type SemioValue {
  kind: SemioValueKind!
  value: String
  lexeme: String
  items: [SemioValue!]
  entries: [SemioObjectEntry!]
  id: ObjectId
}

type SemioObjectEntry {
  key: String!
  value: SemioValue!
}

type SemioObjectNode {
  id: ObjectId!
  value: SemioValue!
}

type SemioObjectSnapshot {
  schema: String! @state(class: PERSISTENT)
  root: SemioValue! @state(class: PERSISTENT)
  objects: [SemioObjectNode!]! @state(class: PERSISTENT)
}
