# 💾️ SemioTableSnapshot binary frame — descriptive twin of 📡️.protocol.semio.
type SemioTableSnapshotFrame {
  format: Int!
  schema: String!
  payload: String! # opaque base64: columns + rows
}

type SemioTableSnapshotBinaryFrame {
  format: Int
  schemaLen: Int
  schemaBytes: String
  payload: String
}
