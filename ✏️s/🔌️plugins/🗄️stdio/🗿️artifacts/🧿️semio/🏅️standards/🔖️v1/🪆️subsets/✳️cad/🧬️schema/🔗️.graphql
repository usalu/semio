# 🧬️ SemioCadArtifact schema — full artifact state, mirrors SemioCadSnapshot field for field.
type SemioCadArtifact {
  schema: String! @state(class: ARTIFACT)
  layers: [CadLayer!]! @state(class: ARTIFACT)
  blocks: [CadBlock!]! @state(class: ARTIFACT)
  entities: [CadEntityRecord!]! @state(class: ARTIFACT)
}
