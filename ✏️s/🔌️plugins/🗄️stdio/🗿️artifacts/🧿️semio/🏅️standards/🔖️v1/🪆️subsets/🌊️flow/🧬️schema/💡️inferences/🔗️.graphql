# 💡️ Semio flow inference schema — node/edge topological order (Kahn's algorithm).

type SemioFlowInference {
  topology: SemioFlowTopology! @derived
}

type SemioFlowTopology {
  topoOrder: [String!]!
  depth: [SemioFlowTopologyDepthEntry!]!
  cycleFree: Boolean!
  nodeCount: Int!
}

type SemioFlowTopologyDepthEntry {
  id: String!
  depth: Int!
}
