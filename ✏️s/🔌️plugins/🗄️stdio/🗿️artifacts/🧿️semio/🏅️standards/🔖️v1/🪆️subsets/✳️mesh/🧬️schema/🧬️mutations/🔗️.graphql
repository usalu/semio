# 🧬️ SemioMeshMutation facet mirror — see the `🦀️.rs` sibling for the real source of
# truth. Seventeen-verb mesh vocabulary; `replacePrimitiveGeometry` is SMO's approved rename of
# the old `setPrimitiveGeometry`, completed by DKM after SMO wound down.

enum MeshMutationKind {
  CREATE_MESH
  DELETE_MESH
  CREATE_PRIMITIVE
  DELETE_PRIMITIVE
  SET_PRIMITIVE_TOPOLOGY
  REPLACE_PRIMITIVE_GEOMETRY
  SET_PRIMITIVE_MATERIAL
  CREATE_MATERIAL
  DELETE_MATERIAL
  CHANGE_MATERIAL_BASE_COLOR
  CHANGE_MATERIAL_METALLIC
  CHANGE_MATERIAL_ROUGHNESS
  CREATE_TEXTURE
  DELETE_TEXTURE
  CHANGE_TEXTURE_MIME
  REPLACE_TEXTURE_BYTES
  MOVE_VERTEX
}

type SemioMeshMutation {
  mutation: MeshMutationKind!
  id: String
  meshId: String
  primitiveId: String
  vertexIndex: Int
  mesh: SemioMesh
  primitive: SemioPrimitive
  material: SemioMaterial
  texture: SemioTexture
  topology: SemioTopology
  positions: [SemioPoint3!]
  normals: [SemioPoint3!]
  uvs: [SemioUv!]
  colors: [SemioRgba!]
  indices: [Int!]
  materialId: String
  newBaseColor: SemioRgba
  newMetallic: Float
  newRoughness: Float
  newMime: String
  newBytes: [Int!]
  newPoint: SemioPoint3
}
