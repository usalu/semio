syntax = "proto3";
// 🧬️ SemioMeshArtifact schema — full artifact state, mirrors SemioMeshSnapshot field for field.
package semio.s_stdio_semio_mesh.artifact;

import "📸️snapshot/🛰️component.proto";

message SemioMeshArtifact {
  string schema = 1;
  repeated semio.s_stdio_semio_mesh.snapshot.SemioMesh meshes = 2;
  repeated semio.s_stdio_semio_mesh.snapshot.SemioMaterial materials = 3;
  repeated semio.s_stdio_semio_mesh.snapshot.SemioTexture textures = 4;
}
