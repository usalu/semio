# 🧬️ SemioAudioSnapshot
enum SemioAudioFormat { PCM8 PCM16 PCM24 PCM32 F32 F64 }
type SemioAudioChannel {
  samples: [Float!]!
}
type SemioAudioTag {
  key: String!
  value: String!
}
type SemioAudioSnapshot {
  schema: String! @state(class: ARTIFACT)
  sampleRate: Int! @state(class: ARTIFACT)
  format: SemioAudioFormat! @state(class: ARTIFACT)
  channels: [SemioAudioChannel!]! @state(class: ARTIFACT)
  tags: [SemioAudioTag!]! @state(class: ARTIFACT)
}
