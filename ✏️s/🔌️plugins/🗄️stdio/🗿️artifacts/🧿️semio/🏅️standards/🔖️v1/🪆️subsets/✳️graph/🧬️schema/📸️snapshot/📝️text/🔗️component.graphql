# 📝️ Text-facet grammar mirror, GraphQL SDL shape (descriptive) — see ../🔗️component.graphql for
# the canonical facet schema; this file describes the DSL-text ENCODING of the same shape.
type SemioGraphSnapshotDsl {
  schema: String!
  nodes: [SemioGraphNodeDsl!]!
  edges: [SemioGraphEdgeDsl!]!
}
type SemioGraphNodeDsl {
  id: String!
  kind: String!
  label: String!
  x: String!
  y: String!
  ports: [SemioGraphPortDsl!]!
  properties: [String!]!
}
type SemioGraphPortDsl {
  name: String!
  kind: String!
}
type SemioGraphEdgeDsl {
  id: String!
  source: String!
  target: String!
  kind: String!
  label: String!
}
