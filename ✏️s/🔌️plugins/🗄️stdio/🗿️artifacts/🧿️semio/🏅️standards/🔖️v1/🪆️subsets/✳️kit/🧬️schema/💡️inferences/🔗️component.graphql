# 💡️ Semio kit inference schema — catalog census over the kit's own collections.

type SemioKitInference {
  entries: SemioKitEntries! @derived
}

type SemioKitEntries {
  typeCount: Int!
  designCount: Int!
  pieceCount: Int!
  connectionCount: Int!
  objectCount: Int!
  modelCount: Int!
  hasProperties: Boolean!
  representationCount: Int!
}
