# 🔺️ SemioBrepDiff facet mirror — see the `🦀️.rs` sibling for the real source of truth.

type NamedModifiedVertex { key: String!, diff: BrepVertexDiff! }
type BrepVertexDiff { point: SemioPoint3, tol: Float }
type BrepVerticesDiff { removed: [String!]!, modified: [NamedModifiedVertex!]!, added: [BrepVertexAdded!]! }

type NamedModifiedEdge { key: String!, diff: BrepEdgeDiff! }
type BrepEdgeDiff { startVertex: String, endVertex: String, curve: BrepCurve, tol: Float }
type BrepEdgesDiff { removed: [String!]!, modified: [NamedModifiedEdge!]!, added: [BrepEdgeAdded!]! }

type NamedModifiedLoop { key: String!, diff: BrepLoopDiff! }
type BrepLoopDiff { edges: [BrepLoopEdge!] }
type BrepLoopsDiff { removed: [String!]!, modified: [NamedModifiedLoop!]!, added: [BrepLoopAdded!]! }

type NamedModifiedFace { key: String!, diff: BrepFaceDiff! }
type BrepFaceDiff { outerLoop: String, innerLoops: [String!], surface: BrepSurface, orientation: Boolean, tol: Float }
type BrepFacesDiff { removed: [String!]!, modified: [NamedModifiedFace!]!, added: [BrepFaceAdded!]! }

type NamedModifiedShell { key: String!, diff: BrepShellDiff! }
type BrepShellDiff { faces: [BrepShellFace!] }
type BrepShellsDiff { removed: [String!]!, modified: [NamedModifiedShell!]!, added: [BrepShellAdded!]! }

type NamedModifiedSolid { key: String!, diff: BrepSolidDiff! }
type BrepSolidDiff { shells: [BrepSolidShell!] }
type BrepSolidsDiff { removed: [String!]!, modified: [NamedModifiedSolid!]!, added: [BrepSolidAdded!]! }

type SemioBrepDiff {
  vertices: BrepVerticesDiff
  edges: BrepEdgesDiff
  loops: BrepLoopsDiff
  faces: BrepFacesDiff
  shells: BrepShellsDiff
  solids: BrepSolidsDiff
}

type BrepVertexAdded { index: Int! item: BrepVertex! }
type BrepEdgeAdded { index: Int! item: BrepEdge! }
type BrepLoopAdded { index: Int! item: BrepLoop! }
type BrepFaceAdded { index: Int! item: BrepFace! }
type BrepShellAdded { index: Int! item: BrepShell! }
type BrepSolidAdded { index: Int! item: BrepSolid! }
