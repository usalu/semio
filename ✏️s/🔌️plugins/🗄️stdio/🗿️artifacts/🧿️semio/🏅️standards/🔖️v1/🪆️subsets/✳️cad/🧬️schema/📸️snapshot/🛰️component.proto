syntax = "proto3";
// 🧬️ SemioCadSnapshot schema — real facet mirror of 🦀️component.rs (source of truth).
package semio.s_stdio_semio_cad.snapshot;

message SemioPoint2 {
  double x = 1;
  double y = 2;
}

message CadEntity {
  message Line { SemioPoint2 a = 1; SemioPoint2 b = 2; }
  message Arc { SemioPoint2 center = 1; double radius = 2; double start_angle = 3; double end_angle = 4; }
  message Circle { SemioPoint2 center = 1; double radius = 2; }
  message Ellipse { SemioPoint2 center = 1; SemioPoint2 major_axis_end = 2; double ratio = 3; double start_param = 4; double end_param = 5; }
  message Polyline { repeated SemioPoint2 vertices = 1; bool closed = 2; }
  message Text { SemioPoint2 position = 1; double height = 2; double rotation = 3; string content = 4; }
  message Insert { string block_name = 1; SemioPoint2 insertion_point = 2; SemioPoint2 scale = 3; double rotation = 4; }
  message Solid { SemioPoint2 p1 = 1; SemioPoint2 p2 = 2; SemioPoint2 p3 = 3; SemioPoint2 p4 = 4; }
  message Dimension { SemioPoint2 def_point = 1; SemioPoint2 text_position = 2; double measurement = 3; string text = 4; }

  oneof value {
    Line line = 1;
    Arc arc = 2;
    Circle circle = 3;
    Ellipse ellipse = 4;
    Polyline polyline = 5;
    Text text = 6;
    Insert insert = 7;
    Solid solid = 8;
    Dimension dimension = 9;
  }
}

message CadLayer {
  string name = 1;
  int32 color_index = 2;
  string line_type = 3;
  bool visible = 4;
}

// Referential invariant (checked by SemioCadValidator, not by protobuf): layer must name a real CadLayer.
message CadEntityRecord {
  string handle = 1;
  string layer = 2;
  CadEntity entity = 3;
}

message CadBlock {
  string name = 1;
  SemioPoint2 base_point = 2;
  repeated CadEntityRecord entities = 3;
}

message SemioCadSnapshot {
  string schema = 1;
  repeated CadLayer layers = 2;
  repeated CadBlock blocks = 3;
  repeated CadEntityRecord entities = 4;
}
