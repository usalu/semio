syntax = "proto3";
// 🧬️ SemioValueMutation facet mirror — mirrors the 🦀️component.rs sibling's real fields.
package semio.s_stdio_semio_value.mutations;

import "../📸️snapshot/🛰️component.proto";

message SemioValuePathSegment {
  oneof kind {
    string key = 1;
    uint64 index = 2;
  }
}

message SetSnapshot { semio.s_stdio_semio_value.snapshot.SemioValueSnapshot snapshot = 1; }
message SetValue { repeated SemioValuePathSegment path = 1; semio.s_stdio_semio_value.snapshot.SemioValue value = 2; }
message SetMapEntry { repeated SemioValuePathSegment path = 1; string key = 2; semio.s_stdio_semio_value.snapshot.SemioValue value = 3; }
message RemoveMapEntry { repeated SemioValuePathSegment path = 1; string key = 2; }
message InsertListItem { repeated SemioValuePathSegment path = 1; uint64 index = 2; semio.s_stdio_semio_value.snapshot.SemioValue value = 3; }
message RemoveListItem { repeated SemioValuePathSegment path = 1; uint64 index = 2; }
message SetNode { semio.s_stdio_semio_value.snapshot.ValueId id = 1; semio.s_stdio_semio_value.snapshot.SemioValue value = 2; }
message RemoveNode { semio.s_stdio_semio_value.snapshot.ValueId id = 1; }

message SemioValueMutation {
  oneof mutation {
    bool no_mutation = 1;
    SetSnapshot set_snapshot = 2;
    SetValue set_value = 3;
    SetMapEntry set_map_entry = 4;
    RemoveMapEntry remove_map_entry = 5;
    InsertListItem insert_list_item = 6;
    RemoveListItem remove_list_item = 7;
    SetNode set_node = 8;
    RemoveNode remove_node = 9;
  }
}
