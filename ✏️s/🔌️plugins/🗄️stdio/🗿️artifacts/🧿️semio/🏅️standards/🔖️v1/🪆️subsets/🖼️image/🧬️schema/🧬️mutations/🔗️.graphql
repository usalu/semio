# 🧬️ SemioImageMutation schema — real facet mirror of the Rust `🦀️.rs` sibling.
enum SemioImageMutationTag {
  SET_SNAPSHOT SET_DIMENSIONS SET_COLORSPACE SET_BIT_DEPTH SET_ICC
  INSERT_FRAME REMOVE_FRAME MOVE_FRAME SET_FRAME_DELAY SET_FRAME_PIXELS
  SET_METADATA_ENTRY REMOVE_METADATA_ENTRY
}

type SemioImageMutation {
  mutation: SemioImageMutationTag!
  snapshot: SemioImageSnapshotJson
  width: Int
  height: Int
  colorspace: String
  bitDepth: Int
  icc: String
  index: Int
  frame: SemioImageFrameJson
  from: Int
  to: Int
  delayMs: Int
  rgba8: String
  key: String
  value: String
}

type SemioImageSnapshotJson { schema: String! }
type SemioImageFrameJson { delayMs: Int! rgba8: String! }
