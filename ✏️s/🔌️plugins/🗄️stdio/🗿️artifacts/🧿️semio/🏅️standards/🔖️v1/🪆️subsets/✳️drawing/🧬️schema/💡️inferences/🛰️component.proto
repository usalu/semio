syntax = "proto3";
package semio.s.stdio.semio.drawing.inference;

// 💡️ SemioDrawing inference schema — flattenedScene (world transform + resolved style) per
// scene-graph entity, keyed by its structural address.

message SemioDrawingInference {
  // @state inferred
  map<string, FlattenedNode> flattened_scene = 1;
}

message Transform {
  repeated double translation = 1;
  repeated double rotation = 2;
  repeated double scale = 3;
}

message Rgba {
  float r = 1;
  float g = 2;
  float b = 3;
  float a = 4;
}

message DrawStyle {
  string name = 1;
  Rgba fill = 2;
  Rgba stroke = 3;
  double stroke_width = 4;
  float opacity = 5;
}

message FlattenedNode {
  Transform world_transform = 1;
  DrawStyle resolved_style = 2;
}
