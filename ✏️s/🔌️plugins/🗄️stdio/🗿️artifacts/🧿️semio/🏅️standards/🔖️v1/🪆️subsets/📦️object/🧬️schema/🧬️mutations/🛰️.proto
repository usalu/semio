syntax = "proto3";
package semio.s.stdio.semio.v1.object.mutations;
import "✏️s/🔌️plugins/🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/✉️base/🧬️schema/🧮️geometry/🛰️.proto";
import "🧰️framework/🔨️modules/🚪️io/🧬️schema/🛰️.proto";

message MoveObject { semio.s.stdio.semio.v1.base.geometry.SemioPoint3 translation = 1; }
message RotateObject { semio.s.stdio.semio.v1.base.geometry.SemioQuaternion rotation = 1; }
message ScaleObject { semio.s.stdio.semio.v1.base.geometry.SemioPoint3 scale = 1; }
message CreateBrep { string child_id = 1 [json_name = "child_id"]; semio.framework.io.ArtifactRef target = 2; }
message DeleteBrep {  }
message CreateMesh { string child_id = 1 [json_name = "child_id"]; semio.framework.io.ArtifactRef target = 2; }
message DeleteMesh {  }
message CreateProperties { string child_id = 1 [json_name = "child_id"]; semio.framework.io.ArtifactRef target = 2; }
