message SemioObjectMutation {
  oneof mutation {
    MoveObject moveObject = 1 [json_name = "MoveObject"];
    RotateObject rotateObject = 2 [json_name = "RotateObject"];
    ScaleObject scaleObject = 3 [json_name = "ScaleObject"];
    CreateBrep createBrep = 4 [json_name = "CreateBrep"];
    DeleteBrep deleteBrep = 5 [json_name = "DeleteBrep"];
    CreateMesh createMesh = 6 [json_name = "CreateMesh"];
    DeleteMesh deleteMesh = 7 [json_name = "DeleteMesh"];
    CreateProperties createProperties = 8 [json_name = "CreateProperties"];
    DeleteProperties deleteProperties = 9 [json_name = "DeleteProperties"];
  }
}
