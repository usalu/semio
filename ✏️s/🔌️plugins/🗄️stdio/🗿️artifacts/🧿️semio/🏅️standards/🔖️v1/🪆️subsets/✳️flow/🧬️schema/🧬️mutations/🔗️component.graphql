# 🧬️ SemioFlowMutation schema — real facet mirror of 🦀️component.rs.
type SemioPoint2 {
  x: Float!
  y: Float!
}
type PortRef {
  node: String!
  port: String!
}
type FlowParam {
  key: String!
  value: String!
}
type FlowNode {
  id: String!
  kind: String!
  label: String!
  params: [FlowParam!]!
  position: SemioPoint2!
}
type FlowEdge {
  id: String!
  from: PortRef!
  to: PortRef!
  kind: String!
}
type SemioFlowSnapshot {
  schema: String!
  nodes: [FlowNode!]!
  edges: [FlowEdge!]!
}
enum SemioFlowMutationKind {
  SET_SNAPSHOT
  INSERT_NODE
  REMOVE_NODE
  SET_NODE_KIND
  SET_NODE_LABEL
  SET_NODE_POSITION
  SET_NODE_PARAM
  REMOVE_NODE_PARAM
  INSERT_EDGE
  REMOVE_EDGE
  SET_EDGE_ENDPOINTS
  SET_EDGE_KIND
}
type SemioFlowMutation {
  mutation: SemioFlowMutationKind!
  snapshot: SemioFlowSnapshot
  node: FlowNode
  edge: FlowEdge
  id: String
  kind: String
  label: String
  position: SemioPoint2
  key: String
  value: String
  from: PortRef
  to: PortRef
}
