# 🔗️ GraphQL mirror of `s.stdio.semio.mesh`'s DSL TEXT representation — a hex string wrapping
# the real SemioMeshSnapshot JSON payload (see ../🦀️.rs for the grammar this mirrors).
scalar HexBytes

type SemioMeshSnapshotDslText {
  """ preamble line: `semio stdio.semio.mesh.dsl v1` """
  preamble: String!
  """ whitespace-tolerant ASCII hex dump of SemioMeshSnapshot's JSON bytes """
  body: HexBytes!
}
