# 🧬️ SemioCadSnapshot schema — real facet mirror of `🦀️component.rs` (source of truth).
type SemioPoint2 {
  x: Float!
  y: Float!
}

type CadEntityLine { a: SemioPoint2! b: SemioPoint2! }
type CadEntityArc { center: SemioPoint2! radius: Float! startAngle: Float! endAngle: Float! }
type CadEntityCircle { center: SemioPoint2! radius: Float! }
type CadEntityEllipse { center: SemioPoint2! majorAxisEnd: SemioPoint2! ratio: Float! startParam: Float! endParam: Float! }
type CadEntityPolyline { vertices: [SemioPoint2!]! closed: Boolean! }
type CadEntityText { position: SemioPoint2! height: Float! rotation: Float! content: String! }
type CadEntityInsert { blockName: String! insertionPoint: SemioPoint2! scale: SemioPoint2! rotation: Float! }
type CadEntitySolid { p1: SemioPoint2! p2: SemioPoint2! p3: SemioPoint2! p4: SemioPoint2! }
type CadEntityDimension { defPoint: SemioPoint2! textPosition: SemioPoint2! measurement: Float! text: String! }

union CadEntity =
    CadEntityLine
  | CadEntityArc
  | CadEntityCircle
  | CadEntityEllipse
  | CadEntityPolyline
  | CadEntityText
  | CadEntityInsert
  | CadEntitySolid
  | CadEntityDimension

type CadLayer {
  name: String!
  colorIndex: Int!
  lineType: String!
  visible: Boolean!
}

type CadEntityRecord {
  handle: String!
  layer: String!
  entity: CadEntity!
}

type CadBlock {
  name: String!
  basePoint: SemioPoint2!
  entities: [CadEntityRecord!]!
}

type SemioCadSnapshot {
  schema: String! @state(class: PERSISTENT)
  layers: [CadLayer!]! @state(class: PERSISTENT)
  blocks: [CadBlock!]! @state(class: PERSISTENT)
  entities: [CadEntityRecord!]! @state(class: PERSISTENT)
}
