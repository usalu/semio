# 🧬️ SemioWorkflowMutation schema (TEXT representation facet mirror) — real, matches the facet root.
type SemioPoint2 {
  x: Float!
  y: Float!
}
type PortRef {
  node: String!
  port: String!
}
type WorkflowParam {
  key: String!
  value: String!
}
type WorkflowNode {
  id: String!
  kind: String!
  label: String!
  params: [WorkflowParam!]!
  position: SemioPoint2!
}
type WorkflowEdge {
  id: String!
  from: PortRef!
  to: PortRef!
  kind: String!
}
type SemioWorkflowSnapshot {
  schema: String!
  nodes: [WorkflowNode!]!
  edges: [WorkflowEdge!]!
}
enum SemioWorkflowMutationKind {
  NO_MUTATION
  SET_SNAPSHOT
  INSERT_NODE
  REMOVE_NODE
  SET_NODE_KIND
  SET_NODE_LABEL
  SET_NODE_POSITION
  SET_NODE_PARAM
  REMOVE_NODE_PARAM
  INSERT_EDGE
  REMOVE_EDGE
  SET_EDGE_ENDPOINTS
  SET_EDGE_KIND
}
type SemioWorkflowMutation {
  mutation: SemioWorkflowMutationKind!
  snapshot: SemioWorkflowSnapshot
  node: WorkflowNode
  edge: WorkflowEdge
  id: String
  kind: String
  label: String
  position: SemioPoint2
  key: String
  value: String
  from: PortRef
  to: PortRef
}
