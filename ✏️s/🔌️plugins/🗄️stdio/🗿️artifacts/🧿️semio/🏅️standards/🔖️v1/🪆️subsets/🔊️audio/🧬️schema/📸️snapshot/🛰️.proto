syntax = "proto3";
package semio.s_stdio_semio_audio.snapshot;
enum SemioAudioFormat {
  PCM8 = 0;
  PCM16 = 1;
  PCM24 = 2;
  PCM32 = 3;
  F32 = 4;
  F64 = 5;
}
message SemioAudioChannel { repeated float samples = 1; }
message SemioAudioTag {
  string key = 1;
  string value = 2;
}
message SemioAudioSnapshot {
  string schema = 1;
  uint32 sample_rate = 2;
  SemioAudioFormat format = 3;
  repeated SemioAudioChannel channels = 4;
  repeated SemioAudioTag tags = 5;
}
