syntax = "proto3";
// 🧬️ SemioMutation schema — real mirror of `🦀️component.rs`. The envelope union's own mutation
// vocabulary: NoMutation, SetSnapshot (the only way to change SUBSET KIND — reuses this package's
// own SemioSnapshot message directly), and 13 wrapper variants. Proto packages never cross-import
// between subsets, so each wrapped variant carries that subset's own mutation OPAQUE wire form.
package semio.s_stdio_semio.mutations;

import "../📸️snapshot/🛰️component.proto";

message SetSnapshotPayload {
  semio.s_stdio_semio.snapshot.SemioSnapshot snapshot = 1;
}

message SemioMutation {
  oneof mutation {
    bool no_mutation = 1;
    SetSnapshotPayload set_snapshot = 2;
    bytes brep = 3;         // SemioBrepMutation (brep subset's own wire form)
    bytes mesh = 4;          // SemioMeshMutation (mesh subset's own wire form)
    bytes model = 5;         // SemioModelMutation (model subset's own wire form)
    bytes object = 6;        // SemioObjectMutation (object subset's own wire form)
    bytes document = 7;      // SemioDocumentMutation (document subset's own wire form)
    bytes cad = 8;           // SemioCadMutation (cad subset's own wire form)
    bytes drawing = 9;       // SemioDrawingMutation (drawing subset's own wire form)
    bytes image = 10;        // SemioImageMutation (image subset's own wire form)
    bytes video = 11;        // SemioVideoMutation (video subset's own wire form)
    bytes audio = 12;        // SemioAudioMutation (audio subset's own wire form)
    bytes animation = 13;    // SemioAnimationMutation (animation subset's own wire form)
    bytes presentation = 14; // SemioPresentationMutation (presentation subset's own wire form)
    bytes workflow = 15;     // SemioWorkflowMutation (workflow subset's own wire form)
  }
}
