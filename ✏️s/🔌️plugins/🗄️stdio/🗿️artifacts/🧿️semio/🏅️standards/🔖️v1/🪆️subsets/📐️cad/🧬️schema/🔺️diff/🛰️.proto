syntax = "proto3";
// 🔺️ SemioCadDiff schema — real facet mirror of 🦀️.rs (source of truth).
package semio.s_stdio_semio_cad.diff;

import "../📸️snapshot/🛰️.proto";

message CadLayerDiff {
  optional int32 color_index = 1;
  optional string line_type = 2;
  optional bool visible = 3;
}

message CadEntityRecordDiff {
  optional string layer = 1;
  optional semio.s_stdio_semio_cad.snapshot.CadEntity entity = 2;
}

message CadEntitiesDiff {
  message Modified { string key = 1; CadEntityRecordDiff diff = 2; }
  repeated string removed = 1;
  repeated Modified modified = 2;
  repeated semio.s_stdio_semio_cad.snapshot.CadEntityRecord added = 3;
}

message CadBlockDiff {
  optional semio.s_stdio_semio_cad.snapshot.SemioPoint2 base_point = 1;
  optional CadEntitiesDiff entities = 2;
}

message CadLayersDiff {
  message Modified { string key = 1; CadLayerDiff diff = 2; }
  repeated string removed = 1;
  repeated Modified modified = 2;
  repeated semio.s_stdio_semio_cad.snapshot.CadLayer added = 3;
}

message CadBlocksDiff {
  message Modified { string key = 1; CadBlockDiff diff = 2; }
  repeated string removed = 1;
  repeated Modified modified = 2;
  repeated semio.s_stdio_semio_cad.snapshot.CadBlock added = 3;
}

message SemioCadDiff {
  optional CadLayersDiff layers = 1;
  optional CadBlocksDiff blocks = 2;
  optional CadEntitiesDiff entities = 3;
}
