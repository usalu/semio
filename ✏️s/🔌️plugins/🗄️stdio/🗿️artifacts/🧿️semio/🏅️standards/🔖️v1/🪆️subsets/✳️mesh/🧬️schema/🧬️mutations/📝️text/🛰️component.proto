syntax = "proto3";
// 🛰️ Proto mirror of `s.stdio.semio.mesh`'s hand-rolled OpText TEXT grammar.
package semio.s_stdio_semio_mesh.mutations.text;
message Stdio_semio_mesh_mutation_text_arg {
  string name = 1;
  string value = 2;
}
message Stdio_semio_mesh_mutation_text {
  string keyword = 1;
  repeated Stdio_semio_mesh_mutation_text_arg args = 2;
}
