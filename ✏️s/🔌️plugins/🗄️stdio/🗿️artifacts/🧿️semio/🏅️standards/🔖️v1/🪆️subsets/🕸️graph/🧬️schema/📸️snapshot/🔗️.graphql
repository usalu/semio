# 🧬️ SemioGraphSnapshot schema — real facet mirror of the Rust `🦀️.rs` sibling.
enum SemioGraphPortKind { IN OUT IN_OUT }

type SemioGraphPort {
  name: String!
  kind: SemioGraphPortKind!
  category: String!
  properties: [SemioValueEntry!]!
}

type GraphNodeId { value: String! }
type GraphEdgeId { value: String! }

type SemioGraphNode {
  id: GraphNodeId!
  kind: String!
  label: String!
  position: SemioGraphPosition!
  width: Binary64Word!
  height: Binary64Word!
  ports: [SemioGraphPort!]!
  properties: [SemioValueEntry!]!
}

type Binary64Word { bits: String! }
type SemioGraphPosition { x: Binary64Word! y: Binary64Word! }

type SemioGraphEdge {
  id: GraphEdgeId!
  source: GraphNodeId!
  target: GraphNodeId!
  kind: String!
  label: String!
  sourcePort: String
  targetPort: String
  properties: [SemioValueEntry!]!
}

type SemioGraphSnapshot {
  schema: String! @state(class: ARTIFACT)
  nodes: [SemioGraphNode!]! @state(class: ARTIFACT)
  edges: [SemioGraphEdge!]! @state(class: ARTIFACT)
}
