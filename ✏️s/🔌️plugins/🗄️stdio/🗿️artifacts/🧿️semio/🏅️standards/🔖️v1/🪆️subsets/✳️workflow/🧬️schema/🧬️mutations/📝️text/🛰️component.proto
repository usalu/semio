syntax = "proto3";
// 🧬️ SemioWorkflowMutation schema (TEXT representation facet mirror) — real, matches the facet root.
package semio.s_stdio_semio_workflow.mutations.text;

message SemioPoint2 {
  double x = 1;
  double y = 2;
}
message PortRef {
  string node = 1;
  string port = 2;
}
message WorkflowParam {
  string key = 1;
  string value = 2;
}
message WorkflowNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  repeated WorkflowParam params = 4;
  SemioPoint2 position = 5;
}
message WorkflowEdge {
  string id = 1;
  PortRef from = 2;
  PortRef to = 3;
  string kind = 4;
}
message SemioWorkflowSnapshot {
  string schema = 1;
  repeated WorkflowNode nodes = 2;
  repeated WorkflowEdge edges = 3;
}
message SemioWorkflowMutation {
  string mutation = 1;
  SemioWorkflowSnapshot snapshot = 2;
  WorkflowNode node = 3;
  WorkflowEdge edge = 4;
  string id = 5;
  string kind = 6;
  string label = 7;
  SemioPoint2 position = 8;
  string key = 9;
  string value = 10;
  PortRef from = 11;
  PortRef to = 12;
}
