syntax = "proto3";
// 🧬️ SemioFlowMutation schema — real facet mirror of 🦀️component.rs.
package semio.s_stdio_semio_flow.mutations;

message SemioPoint2 {
  double x = 1;
  double y = 2;
}
message PortRef {
  string node = 1;
  string port = 2;
}
message FlowParam {
  string key = 1;
  string value = 2;
}
message FlowNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  repeated FlowParam params = 4;
  SemioPoint2 position = 5;
}
message FlowEdge {
  string id = 1;
  PortRef from = 2;
  PortRef to = 3;
  string kind = 4;
}
message SemioFlowSnapshot {
  string schema = 1;
  repeated FlowNode nodes = 2;
  repeated FlowEdge edges = 3;
}
message SemioFlowMutation {
  string mutation = 1; // no-mutation | set-snapshot | insert-node | remove-node | set-node-kind |
                        // set-node-label | set-node-position | set-node-param | remove-node-param |
                        // insert-edge | remove-edge | set-edge-endpoints | set-edge-kind
  SemioFlowSnapshot snapshot = 2;
  FlowNode node = 3;
  FlowEdge edge = 4;
  string id = 5;
  string kind = 6;
  string label = 7;
  SemioPoint2 position = 8;
  string key = 9;
  string value = 10;
  PortRef from = 11;
  PortRef to = 12;
}
