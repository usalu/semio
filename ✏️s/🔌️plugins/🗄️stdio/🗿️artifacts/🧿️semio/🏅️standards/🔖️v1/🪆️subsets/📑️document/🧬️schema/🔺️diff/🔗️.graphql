# Handcrafted sparse SemioDocumentDiff -- name-keyed styles/images triples + an index-keyed
# recursive blocks triple. GraphQL exposes the triple shape generically since the item/diff
# payload types vary per collection.
type IndexTripleShape {
  removedIndices: [Int!]!
  modifiedCount: Int!
  addedCount: Int!
}
type NamedTripleShape {
  removedKeys: [String!]!
  modifiedCount: Int!
  addedCount: Int!
}
type SemioDocumentDiff {
  styles: NamedTripleShape
  images: NamedTripleShape
  blocks: IndexTripleShape
}
