syntax = "proto3";
// Named-variant SemioDocumentMutation enum. Real per-variant typed payloads (DocBlock/DocStyle/
// DocImage/RunStyle/DocBlockPath) mirror the `📸️snapshot/🛰️.proto` messages; carried as
// opaque JSON bytes here since proto3 lacks a direct import path to a sibling facet package.
package semio.s_stdio_semio_document.mutations;

enum MutationTag {
  SET_SNAPSHOT = 0; INSERT_BLOCK = 2; REMOVE_BLOCK = 3; SET_BLOCK_CONTENT = 4;
  SET_PARAGRAPH_STYLE = 5; SET_HEADING_LEVEL = 6; SET_LIST_ORDERED = 7; SET_RUN_TEXT = 8;
  SET_RUN_STYLE = 9; SET_IMAGE_BLOCK = 10; INSERT_STYLE = 11; REMOVE_STYLE = 12;
  SET_STYLE_NAME = 13; SET_STYLE_BASED_ON = 14; INSERT_IMAGE = 15; REMOVE_IMAGE = 16;
  SET_IMAGE_BYTES = 17;
}
message SemioDocumentMutation {
  MutationTag mutation = 1;
  bytes payload_json = 2; // the variant's own fields, JSON-encoded (path/block/style/image/etc.)
}
