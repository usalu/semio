# 🧬️ SemioBrepSnapshot facet mirror — see the `🦀️.rs` sibling for the real source of truth.

type SemioPoint3 { x: Float!, y: Float!, z: Float! }
type SemioPoint2 { x: Float!, y: Float! }

union BrepCurve2 = BrepCurve2Line | BrepCurve2Circle | BrepCurve2Ellipse | BrepCurve2Nurbs
type BrepCurve2Line { origin: SemioPoint2!, direction: SemioPoint2! }
type BrepCurve2Circle { center: SemioPoint2!, radius: Float! }
type BrepCurve2Ellipse { center: SemioPoint2!, xAxis: SemioPoint2!, radiusMajor: Float!, radiusMinor: Float! }
type BrepCurve2Nurbs { controlPoints: [SemioPoint2!]!, weights: [Float!]!, degree: Int!, knots: [Float!]! }

union BrepCurve = BrepCurveLine | BrepCurveCircle | BrepCurveEllipse | BrepCurveNurbs
type BrepCurveLine { origin: SemioPoint3!, direction: SemioPoint3! }
type BrepCurveCircle { center: SemioPoint3!, axis: SemioPoint3!, radius: Float! }
type BrepCurveEllipse { center: SemioPoint3!, axis: SemioPoint3!, radiusMajor: Float!, radiusMinor: Float! }
type BrepCurveNurbs { controlPoints: [SemioPoint3!]!, weights: [Float!]!, degree: Int!, knots: [Float!]! }

union BrepSurface = BrepSurfacePlane | BrepSurfaceCylinder | BrepSurfaceCone | BrepSurfaceSphere | BrepSurfaceTorus | BrepSurfaceNurbs
type BrepSurfacePlane { origin: SemioPoint3!, normal: SemioPoint3! }
type BrepSurfaceCylinder { origin: SemioPoint3!, axis: SemioPoint3!, radius: Float! }
type BrepSurfaceCone { origin: SemioPoint3!, axis: SemioPoint3!, radius: Float!, halfAngle: Float! }
type BrepSurfaceSphere { center: SemioPoint3!, radius: Float! }
type BrepSurfaceTorus { center: SemioPoint3!, axis: SemioPoint3!, majorRadius: Float!, minorRadius: Float! }
type BrepSurfaceNurbs {
  controlPoints: [SemioPoint3!]!
  weights: [Float!]!
  uCount: Int!
  vCount: Int!
  degreeU: Int!
  degreeV: Int!
  knotsU: [Float!]!
  knotsV: [Float!]!
}

type BrepVertex { id: String!, point: SemioPoint3!, tol: Float! }
type BrepEdge { id: String!, startVertex: String!, endVertex: String!, curve: BrepCurve!, tol: Float! }
type BrepLoopEdge { edge: String!, orientation: Boolean! }
type BrepLoop { id: String!, edges: [BrepLoopEdge!]! }
type BrepFace { id: String!, outerLoop: String!, innerLoops: [String!]!, surface: BrepSurface!, orientation: Boolean!, tol: Float! }
type BrepShellFace { face: String!, orientation: Boolean! }
type BrepShell { id: String!, faces: [BrepShellFace!]! }
type BrepSolidShell { shell: String!, isVoid: Boolean! }
type BrepSolid { id: String!, shells: [BrepSolidShell!]! }
# 🧱️ First-class coedge — see the `🦀️.rs` sibling's `BrepCoedge` doc comment for why this is a
# separate collection rather than a widened `BrepLoopEdge`.
type BrepCoedge { id: String!, edge: String!, forward: Boolean!, pcurve: BrepCurve2, prange: [Float!]!, loopId: String!, next: String!, prev: String! }

type SemioBrepSnapshot {
  schema: String! @state(class: ARTIFACT)
  vertices: [BrepVertex!]! @state(class: ARTIFACT)
  edges: [BrepEdge!]! @state(class: ARTIFACT)
  loops: [BrepLoop!]! @state(class: ARTIFACT)
  faces: [BrepFace!]! @state(class: ARTIFACT)
  shells: [BrepShell!]! @state(class: ARTIFACT)
  solids: [BrepSolid!]! @state(class: ARTIFACT)
  coedges: [BrepCoedge!]! @state(class: ARTIFACT)
  nextLabel: Int! @state(class: ARTIFACT)
}
