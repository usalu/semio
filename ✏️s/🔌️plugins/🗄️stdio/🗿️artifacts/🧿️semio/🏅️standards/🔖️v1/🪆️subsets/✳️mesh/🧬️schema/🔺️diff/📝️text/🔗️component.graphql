# 🔗️ GraphQL mirror of `s.stdio.semio.mesh`'s hand-rolled DiffCodec TEXT grammar.
type SemioMeshDiffTextToken {
  key: String!    # "meshes" | "materials" | "textures"
  removed: [String!]!
  modified: [String!]!   # each "key:diff" encoded
  added: [String!]!
}
type SemioMeshDiffText {
  tokens: [SemioMeshDiffTextToken!]!   # space-separated in the real wire form
}
