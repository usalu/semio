# 🧬️ SemioVideoSnapshot facet mirror — container-typed, payload-opaque.
enum SemioVideoStreamKind {
  VIDEO
  AUDIO
  SUBTITLE
}

type SemioRational {
  num: Int!
  den: Int!
}

type SemioVideoSample {
  pts: Int!
  key: Boolean!
  data: String! # hex-encoded opaque bytes
}

type SemioVideoStream {
  kind: SemioVideoStreamKind!
  codec: String!
  width: Int!
  height: Int!
  rate: SemioRational!
  samples: [SemioVideoSample!]!
}

type SemioVideoSnapshot {
  schema: String! @state(class: PERSISTENT)
  streams: [SemioVideoStream!]! @state(class: PERSISTENT)
}
