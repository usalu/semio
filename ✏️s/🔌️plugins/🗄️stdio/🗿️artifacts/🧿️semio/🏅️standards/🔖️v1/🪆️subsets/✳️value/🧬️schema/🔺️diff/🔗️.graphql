# 🔺️ SemioValueTreeDiff facet mirror — mirrors the `🦀️.rs` sibling's real fields.
enum SemioValueDiffKind { REPLACE BOOL INT FLOAT STR BYTES LIST MAP REF }

type SemioValueDiff {
  kind: SemioValueDiffKind!
  value: String
  lexeme: String
  diff: String
  id: ValueId
}

type IndexedTripleDiff {
  removed: [Int!]!
  modifiedIndex: [Int!]!
  modifiedDiff: [SemioValueDiff!]!
  addedIndex: [Int!]!
  addedItem: [SemioValue!]!
}

type NamedAddedEntry {
  index: Int!
  item: SemioValueEntry!
}

type NamedTripleDiff {
  removed: [String!]!
  modifiedKey: [String!]!
  modifiedDiff: [SemioValueDiff!]!
  added: [NamedAddedEntry!]!
}

type NamedAddedNode {
  index: Int!
  item: SemioValueNode!
}

type NodesTripleDiff {
  removed: [ValueId!]!
  modifiedKey: [ValueId!]!
  modifiedDiff: [SemioValueDiff!]!
  added: [NamedAddedNode!]!
}

type SemioValueTreeDiff {
  root: SemioValueDiff @state(class: ARTIFACT)
  nodes: NodesTripleDiff @state(class: ARTIFACT)
}
