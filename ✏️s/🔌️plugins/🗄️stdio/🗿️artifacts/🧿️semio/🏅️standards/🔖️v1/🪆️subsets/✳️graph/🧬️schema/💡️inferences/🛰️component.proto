syntax = "proto3";
package semio.s.stdio.semio.graph.inference;

// 💡️ Semio graph inference schema — node/edge topological order (Kahn's algorithm).

message SemioGraphInference {
  // @derived
  SemioGraphTopology topology = 1;
}

message SemioGraphTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}
