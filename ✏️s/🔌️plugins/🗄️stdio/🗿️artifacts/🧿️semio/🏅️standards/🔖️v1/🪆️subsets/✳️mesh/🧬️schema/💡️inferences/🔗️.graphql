# 💡️ SemioMeshInference facet mirror — see the `🦀️.rs` sibling for the real source of
# truth. `computedNormals`/`tessellationPreview` are deliberately absent (see that file's module
# doc comment for why).

type SemioAabbPoint3 {
  x: Float!
  y: Float!
  z: Float!
}

type SemioAabb {
  min: SemioAabbPoint3!
  max: SemioAabbPoint3!
}

type SemioMeshAabbEntry {
  key: String!
  value: SemioAabb!
}

type SemioMeshInference {
  aabb: [SemioMeshAabbEntry!]!
}
