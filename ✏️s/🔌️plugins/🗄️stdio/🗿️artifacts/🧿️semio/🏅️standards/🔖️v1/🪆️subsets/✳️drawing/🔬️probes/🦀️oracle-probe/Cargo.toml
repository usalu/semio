# 🧭️ Own workspace root. The repository's root Cargo.toml is a shared, leased manifest that concurrent
# sessions edit, and this crate must also stay OUT of the plugin's dependency graph: it links no
# repository crate at all, only the three approved third-party readers. That isolation is deliberate —
# it is what lets the probe build and run while `semio-s-plugin-stdio` is mid-refactor, and it is what
# guarantees the reader shares no code with the implementation it adjudicates.
# See ../../../../../../../../📐️step/🏅️standards/🔖️ap214/🪆️subsets/✳️cc6/🏭️bridge/Cargo.toml for the
# same standalone-workspace pattern.
[workspace]

[package]
name = "semio-drawing-oracle-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "🔬️ Third-party carrier readers for s.stdio.semio@v1/✳️drawing — reads svg/dxf/pdf and reports what it found. Computes no mutation semantics."

[[bin]]
name = "semio-drawing-oracle-probe"
path = "🦀️component.rs"

# 🔮️ TEST-ONLY BY CONSTRUCTION, AND READERS ONLY. Each of the three is an already-approved
# `test-oracle` entry in the repository's 🔒️dependencies.json, registered here for the carrier it
# parses. None of them is asked what a mutation should produce — see this subset's 🧪️oracle/🔣️.json.
[dependencies]
quick-xml = "0.42"
dxf = "0.6"
lopdf = "0.44"
