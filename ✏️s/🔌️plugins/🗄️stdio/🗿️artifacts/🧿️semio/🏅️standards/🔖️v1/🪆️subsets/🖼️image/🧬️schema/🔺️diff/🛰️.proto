syntax = "proto3";
// 🔺️ SemioImageDiff schema — real facet mirror of the Rust `🦀️.rs` sibling.
package semio.s_stdio_semio_image.diff;

message SemioImageFrameDiff {
  optional uint32 delay_ms = 1;
  optional bytes rgba8 = 2;
}
message IndexAddedFrame { uint32 index = 1; bytes frame_json = 2; }
message IndexModifiedFrameDiff { uint32 index = 1; SemioImageFrameDiff diff = 2; }
message SemioImageFramesDiff {
  repeated uint32 removed = 1;
  repeated IndexModifiedFrameDiff modified = 2;
  repeated IndexAddedFrame added = 3;
}

message NamedModifiedMetadata { string key = 1; string diff = 2; }
message SemioImageMetadataEntry { string key = 1; string value = 2; }
message SemioImageMetadataDiff {
  repeated string removed = 1;
  repeated NamedModifiedMetadata modified = 2;
  repeated SemioImageMetadataEntry added = 3;
}

message SemioImageDiff {
  optional uint32 width = 1;
  optional uint32 height = 2;
  optional string colorspace = 3;
  optional uint32 bit_depth = 4;
  optional bytes icc = 5; // tri-state via `has_icc`/`icc` proto3 optional semantics
  SemioImageFramesDiff frames = 6;
  SemioImageMetadataDiff metadata = 7;
}
