# stdio.semio.animation.snapshot text grammar schema
type Timeline { name: String channels: [Channel!]! }
type Channel { target: Target! interpolation: Interpolation! keyframes: [Keyframe!]! }
type Target { node: String! property: TargetProperty! }
enum Interpolation { LINEAR STEP CUBIC_SPLINE }
type Keyframe { t: Float! value: AnimValue! }
