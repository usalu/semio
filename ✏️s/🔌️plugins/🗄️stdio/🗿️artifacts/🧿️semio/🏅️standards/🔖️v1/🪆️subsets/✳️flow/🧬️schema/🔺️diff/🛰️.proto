syntax = "proto3";
// 🔺️ SemioFlowDiff schema — real facet mirror of 🦀️.rs.
package semio.s_stdio_semio_flow.diff;

message SemioPoint2 {
  double x = 1;
  double y = 2;
}
message PortRef {
  string node = 1;
  string port = 2;
}
message FlowParam {
  string key = 1;
  string value = 2;
}
message FlowNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  repeated FlowParam params = 4;
  SemioPoint2 position = 5;
}
message FlowEdge {
  string id = 1;
  PortRef from = 2;
  PortRef to = 3;
  string kind = 4;
}
message FlowParamDiff {
  optional string value = 1;
}
message FlowParamModified {
  string key = 1;
  FlowParamDiff diff = 2;
}
message FlowParamsDiff {
  repeated string removed = 1;
  repeated FlowParamModified modified = 2;
  repeated FlowParam added = 3;
}
message FlowNodeDiff {
  optional string kind = 1;
  optional string label = 2;
  FlowParamsDiff params = 3;
  SemioPoint2 position = 4;
}
message FlowNodeModified {
  string key = 1;
  FlowNodeDiff diff = 2;
}
message FlowNodesDiff {
  repeated string removed = 1;
  repeated FlowNodeModified modified = 2;
  repeated FlowNode added = 3;
}
message FlowEdgeDiff {
  PortRef from = 1;
  PortRef to = 2;
  optional string kind = 3;
}
message FlowEdgeModified {
  string key = 1;
  FlowEdgeDiff diff = 2;
}
message FlowEdgesDiff {
  repeated string removed = 1;
  repeated FlowEdgeModified modified = 2;
  repeated FlowEdge added = 3;
}
message SemioFlowDiff {
  FlowNodesDiff nodes = 1;
  FlowEdgesDiff edges = 2;
}
