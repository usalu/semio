# 🧬️ SemioDrawingMutation — mirrors the real Rust 🧬️mutations/🦀️component.rs. Variant fields
# target canvas/styles (key-ed added/modified/removed, base upsert)/layers/node children/root,
# read the base snapshot's schema/translation for inverse(); line = one-line OpText wire, item =
# a triple's inserted payload.
input NodePath { layer: Int! path: [Int!]! }

enum SemioDrawingMutationKind {
  NO_MUTATION
  SET_SNAPSHOT
  SET_CANVAS_SIZE
  SET_CANVAS_BACKGROUND
  SET_STYLE
  REMOVE_STYLE
  INSERT_LAYER
  REMOVE_LAYER
  SET_LAYER_META
  MOVE_LAYER
  SET_GROUP_TRANSFORM
  SET_PATH_SEGMENTS
  SET_NODE_STYLE
  SET_TEXT
  SET_IMAGE
  INSERT_NODE
  REMOVE_NODE
  REPLACE_NODE
}

input SemioDrawingMutationInput {
  mutation: SemioDrawingMutationKind!
  snapshot: SemioDrawingSnapshotInput
  width: Float
  height: Float
  background: RgbaInput
  name: String
  fill: RgbaInput
  stroke: RgbaInput
  strokeWidth: Float
  opacity: Float
  index: Int
  layer: DrawLayerInput
  id: String
  visible: Boolean
  from: Int
  to: Int
  path: NodePath
  transform: TransformInput
  segments: [PathSegmentInput!]
  style: String
  value: String
  at: SemioPoint2Input
  mime: String
  bytes: String
  node: DrawNodeInput
}
