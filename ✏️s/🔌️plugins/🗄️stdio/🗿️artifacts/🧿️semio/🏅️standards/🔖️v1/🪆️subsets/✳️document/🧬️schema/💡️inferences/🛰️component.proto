syntax = "proto3";
package semio.s.stdio.semio.document.inference;

// 💡️ Semio document inference schema — heading/word/block-derived document outline.

message SemioDocumentInference {
  // @state inferred
  SemioDocumentOutline outline = 1;
}

message SemioDocumentHeadingEntry {
  uint32 level = 1;
  string text = 2;
}

message SemioDocumentOutline {
  repeated SemioDocumentHeadingEntry section_outline = 1;
  uint32 block_count = 2;
  uint32 word_count = 3;
}
