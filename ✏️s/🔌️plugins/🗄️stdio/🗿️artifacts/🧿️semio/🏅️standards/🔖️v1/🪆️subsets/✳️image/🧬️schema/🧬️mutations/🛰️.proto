syntax = "proto3";
// 🧬️ SemioImageMutation schema — real facet mirror of the Rust `🦀️.rs` sibling.
package semio.s_stdio_semio_image.mutations;

enum SemioImageMutationTag {
  SET_SNAPSHOT = 0;
  SET_DIMENSIONS = 2;
  SET_COLORSPACE = 3;
  SET_BIT_DEPTH = 4;
  SET_ICC = 5;
  INSERT_FRAME = 6;
  REMOVE_FRAME = 7;
  MOVE_FRAME = 8;
  SET_FRAME_DELAY = 9;
  SET_FRAME_PIXELS = 10;
  SET_METADATA_ENTRY = 11;
  REMOVE_METADATA_ENTRY = 12;
}

message SemioImageMutation {
  SemioImageMutationTag mutation = 1;
  optional bytes snapshot_json = 2;
  optional uint32 width = 3;
  optional uint32 height = 4;
  optional string colorspace = 5;
  optional uint32 bit_depth = 6;
  optional bytes icc = 7;
  optional uint32 index = 8;
  optional bytes frame_json = 9;
  optional uint32 from = 10;
  optional uint32 to = 11;
  optional uint32 delay_ms = 12;
  optional bytes rgba8 = 13;
  optional string key = 14;
  optional string value = 15;
}
