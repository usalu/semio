# 🔺️ SemioDrawingDiff — mirrors the real Rust 🔺️diff/🦀️.rs. between(base, other)
# computes the schema delta from scratch against the base snapshot; Transform carries
# translation/rotation/scale; the hand-rolled DiffCodec's line is built from space-separated
# tokens; NodePath{layer, path} addresses a node.
type DrawCanvasDiff {
  width: Float
  height: Float
  backgroundChanged: Boolean!
  background: Rgba
}
type DrawStyleModified { key: String! diff: DrawStyleDiff! }
type DrawStyleDiff {
  fillChanged: Boolean!
  fill: Rgba
  strokeChanged: Boolean!
  stroke: Rgba
  strokeWidthChanged: Boolean!
  strokeWidth: Float
  opacityChanged: Boolean!
  opacity: Float
}
type StylesDiff {
  removed: [String!]!
  modified: [DrawStyleModified!]!
  added: [DrawStyle!]!
}

enum DrawNodeDiffKind { PATH TEXT GROUP IMAGE REPLACE }
type DrawNodeChildModified { index: Int! diff: DrawNodeDiff! }
type DrawNodeChildAdded { index: Int! item: DrawNode! }
type DrawChildrenDiff {
  removed: [Int!]!
  modified: [DrawNodeChildModified!]!
  added: [DrawNodeChildAdded!]!
}
type DrawNodeDiff {
  kind: DrawNodeDiffKind!
  segments: [PathSegment!]
  style: String
  value: String
  at: SemioPoint2
  transform: Transform
  children: DrawChildrenDiff
  width: Float
  height: Float
  mime: String
  bytes: String
  node: DrawNode
}

type DrawLayerDiff {
  id: String
  name: String
  visible: Boolean
  root: DrawNodeDiff
}
type DrawLayerModified { index: Int! diff: DrawLayerDiff! }
type DrawLayerAdded { index: Int! item: DrawLayer! }
type LayersDiff {
  removed: [Int!]!
  modified: [DrawLayerModified!]!
  added: [DrawLayerAdded!]!
}

type SemioDrawingDiff {
  canvas: DrawCanvasDiff
  styles: StylesDiff
  layers: LayersDiff
}
