# 🧬️ SemioKitSnapshot schema — real facet mirror of the Rust `🦀️component.rs` sibling.
type SemioKitType { id: String! name: String! category: String! }
type SemioKitPiece { id: String! typeId: String! transformWire: String! }
type SemioKitConnection { id: String! connectingPieceId: String! connectingPort: String! connectedPieceId: String! connectedPort: String! }
type SemioKitDesign { id: String! name: String! pieces: [SemioKitPiece!]! connections: [SemioKitConnection!]! }

type SemioKitSnapshot {
  schema: String! @state(class: PERSISTENT)
  types: [SemioKitType!]! @state(class: PERSISTENT)
  designs: [SemioKitDesign!]! @state(class: PERSISTENT)
  objects: [ArtifactLink!]! @state(class: PERSISTENT) @child(kind: "s.stdio.semio.object")
  models: [ArtifactLink!]! @state(class: PERSISTENT) @child(kind: "s.stdio.semio.model")
  properties: ArtifactLink @state(class: PERSISTENT) @child(kind: "s.stdio.semio.value")
  representations: [ArtifactLink!]! @state(class: PERSISTENT) @link(roles: ["representation"])
}
