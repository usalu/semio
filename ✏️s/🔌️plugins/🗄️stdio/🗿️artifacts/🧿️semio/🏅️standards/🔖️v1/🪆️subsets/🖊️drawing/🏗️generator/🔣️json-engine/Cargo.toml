# 🧭️ Own workspace root: never joins the repository's root workspace, whose root manifest is a shared,
# contended file.
#
# 🚫️ DEPENDS ON `serde_json` AND NOTHING ELSE. `SemioDrawingSnapshot::layers` is an INLINE
# `Vec<DrawLayer>` directly in this subset's own JSON export
# (`🖊️drawing/🧬️schema/📸️snapshot/🦀️.rs`), so `create-layer` — a caller-supplied full `DrawLayer` at a
# caller-supplied index, clamped to `base.layers.len()` (an append when the index is at or past the
# end), with a duplicate `id` already present in `base` rejected outright
# (`create-layer/🔺️diff/🦀️.rs`'s own `diff` body) — is a carrier-level fact a third-party JSON
# implementation can witness in full, the identical discriminator
# `📑️document/🏗️generator/🔣️json-engine` already establishes for `insert-image`.
[workspace]

[package]
name = "semio-drawing-json-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "src/🏗️generate.rs"

[lib]
name = "semio_drawing_json"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
