# 🧬️ SemioObjectMutation facet mirror — mirrors the `🦀️component.rs` sibling's real fields.
enum SemioObjectMutationKind {
  NO_MUTATION
  SET_SNAPSHOT
  SET_VALUE
  SET_MAP_ENTRY
  REMOVE_MAP_ENTRY
  INSERT_LIST_ITEM
  REMOVE_LIST_ITEM
  SET_OBJECT
  REMOVE_OBJECT
}

enum SemioObjectPathSegmentKind { KEY INDEX }
type SemioObjectPathSegment {
  kind: SemioObjectPathSegmentKind!
  key: String
  index: Int
}

type SemioObjectMutation {
  mutation: SemioObjectMutationKind!
  snapshot: SemioObjectSnapshot
  path: [SemioObjectPathSegment!]
  value: SemioValue
  key: String
  index: Int
  id: ObjectId
}
