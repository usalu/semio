# 🧭️ Own workspace root: never joins the repository's root workspace, whose root manifest is a shared,
# contended file.
#
# 🚫️ DEPENDS ON `serde_json` AND NOTHING ELSE. `SemioCadSnapshot::layers` is an INLINE `Vec<CadLayer>`
# directly in this subset's own JSON export (`✳️cad/🧬️schema/📸️snapshot/🦀️.rs`), so `add-layer` — a
# caller-supplied full `CadLayer` appended with no computed field — is a carrier-level fact a
# third-party JSON implementation can witness in full, the identical discriminator
# `✳️document/🏭️generator/🦀️json-engine` already establishes for `insert-image`.
[workspace]

[package]
name = "semio-cad-json-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "src/generate.rs"

[lib]
name = "semio_cad_json"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
