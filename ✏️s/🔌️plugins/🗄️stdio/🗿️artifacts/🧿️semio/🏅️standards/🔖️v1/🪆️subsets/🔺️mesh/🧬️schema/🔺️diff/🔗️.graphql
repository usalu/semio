# 🔺️ SemioMeshDiff schema — real mirror of `🦀️.rs`. Collections are id-keyed
# removed/modified/added triples.
type SemioPrimitiveDiff {
  topology: SemioTopology
  positions: [SemioPoint3!]
  normals: [SemioPoint3!]
  uvs: [SemioUv!]
  colors: [SemioRgba!]
  indices: [Int!]
  materialId: String
}

type SemioMeshItemDiff {
  primitives: SemioPrimitivesDiff
}

type SemioMaterialDiff {
  baseColor: SemioRgba
  metallic: Float
  roughness: Float
}

type SemioTextureDiff {
  mime: String
  bytes: [Int!]
}

type SemioMeshModified { key: String! diff: SemioMeshItemDiff! }
type SemioMeshesDiff { removed: [String!]! modified: [SemioMeshModified!]! added: [SemioMesh!]! }

type SemioPrimitiveModified { key: String! diff: SemioPrimitiveDiff! }
type SemioPrimitivesDiff { removed: [String!]! modified: [SemioPrimitiveModified!]! added: [SemioPrimitive!]! }

type SemioMaterialModified { key: String! diff: SemioMaterialDiff! }
type SemioMaterialsDiff { removed: [String!]! modified: [SemioMaterialModified!]! added: [SemioMaterial!]! }

type SemioTextureModified { key: String! diff: SemioTextureDiff! }
type SemioTexturesDiff { removed: [String!]! modified: [SemioTextureModified!]! added: [SemioTexture!]! }

type SemioMeshDiff {
  meshes: SemioMeshesDiff
  materials: SemioMaterialsDiff
  textures: SemioTexturesDiff
}
