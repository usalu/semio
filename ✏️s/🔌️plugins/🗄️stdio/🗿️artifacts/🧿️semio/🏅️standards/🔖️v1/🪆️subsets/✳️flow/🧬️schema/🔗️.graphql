# 🧬️ SemioFlowArtifact schema — real facet mirror of 🦀️.rs.
type SemioPoint2 {
  x: Float!
  y: Float!
}
type PortRef {
  node: String!
  port: String!
}
type FlowParam {
  key: String!
  value: String!
}
type FlowNode {
  id: String!
  kind: String!
  label: String!
  params: [FlowParam!]!
  position: SemioPoint2!
}
type FlowEdge {
  id: String!
  from: PortRef!
  to: PortRef!
  kind: String!
}
type SemioFlowArtifact {
  schema: String! @state(class: ARTIFACT)
  nodes: [FlowNode!]! @state(class: ARTIFACT)
  edges: [FlowEdge!]! @state(class: ARTIFACT)
}
