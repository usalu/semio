# 🧬️ SemioValueMutation facet mirror — mirrors the `🦀️.rs` sibling's real fields.
enum SemioValueMutationKind {
  SET_SNAPSHOT
  SET_VALUE
  SET_MAP_ENTRY
  REMOVE_MAP_ENTRY
  INSERT_LIST_ITEM
  REMOVE_LIST_ITEM
  SET_NODE
  REMOVE_NODE
}

enum SemioValuePathSegmentKind { KEY INDEX }
type SemioValuePathSegment {
  kind: SemioValuePathSegmentKind!
  key: String
  index: Int
}

type SemioValueMutation {
  mutation: SemioValueMutationKind!
  snapshot: SemioValueSnapshot
  path: [SemioValuePathSegment!]
  value: SemioValue
  key: String
  index: Int
  id: ValueId
}
