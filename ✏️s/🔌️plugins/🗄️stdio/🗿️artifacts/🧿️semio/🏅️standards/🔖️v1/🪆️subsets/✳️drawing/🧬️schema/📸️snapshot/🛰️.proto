syntax = "proto3";
// 🧬️ SemioDrawingSnapshot — mirrors the real Rust 📸️snapshot/🦀️.rs. Codec: hex body,
// options-aware ArtifactPack, semio_format-enveloped text.
package semio.s_stdio_semio_drawing.snapshot;

message SemioPoint2 { double x = 1; double y = 2; }
message Rgba { float r = 1; float g = 2; float b = 3; float a = 4; }
message Transform {
  message Point3 { double x = 1; double y = 2; double z = 3; }
  message Quaternion { double x = 1; double y = 2; double z = 3; double w = 4; }
  Point3 translation = 1;
  Quaternion rotation = 2;
  Point3 scale = 3;
}

message PathSegment {
  enum Kind { MOVE_TO = 0; LINE_TO = 1; CUBIC_TO = 2; QUAD_TO = 3; ARC_TO = 4; CLOSE = 5; }
  Kind kind = 1;
  SemioPoint2 to = 2;
  SemioPoint2 c1 = 3;
  SemioPoint2 c2 = 4;
  SemioPoint2 c = 5;
  double rx = 6;
  double ry = 7;
  double x_rotation = 8; // xRotation
  bool large_arc = 9; // largeArc
  bool sweep = 10;
}

message DrawNode {
  enum Kind { PATH = 0; TEXT = 1; GROUP = 2; IMAGE = 3; }
  Kind kind = 1;
  repeated PathSegment segments = 2;
  optional string style = 3;
  optional string value = 4;
  optional SemioPoint2 at = 5;
  optional Transform transform = 6;
  repeated DrawNode children = 7;
  optional double width = 8;
  optional double height = 9;
  optional string mime = 10;
  optional bytes bytes = 11;
}

message DrawStyle {
  string name = 1;
  optional Rgba fill = 2;
  optional Rgba stroke = 3;
  optional double stroke_width = 4; // strokeWidth
  optional float opacity = 5;
}

message DrawLayer {
  string id = 1;
  string name = 2;
  bool visible = 3;
  DrawNode root = 4;
}

message DrawCanvas {
  double width = 1;
  double height = 2;
  optional Rgba background = 3;
}

message SemioDrawingSnapshot {
  string schema = 1;
  DrawCanvas canvas = 2;
  repeated DrawStyle styles = 3;
  repeated DrawLayer layers = 4;
}
