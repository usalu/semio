syntax = "proto3";
// 🔺️ SemioWorkflowDiff schema (TEXT representation facet mirror) — real, matches the facet root.
package semio.s_stdio_semio_workflow.diff.text;

message SemioPoint2 {
  double x = 1;
  double y = 2;
}
message PortRef {
  string node = 1;
  string port = 2;
}
message WorkflowParam {
  string key = 1;
  string value = 2;
}
message WorkflowNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  repeated WorkflowParam params = 4;
  SemioPoint2 position = 5;
}
message WorkflowEdge {
  string id = 1;
  PortRef from = 2;
  PortRef to = 3;
  string kind = 4;
}
message WorkflowParamDiff {
  optional string value = 1;
}
message WorkflowParamModified {
  string key = 1;
  WorkflowParamDiff diff = 2;
}
message WorkflowParamsDiff {
  repeated string removed = 1;
  repeated WorkflowParamModified modified = 2;
  repeated WorkflowParam added = 3;
}
message WorkflowNodeDiff {
  optional string kind = 1;
  optional string label = 2;
  WorkflowParamsDiff params = 3;
  SemioPoint2 position = 4;
}
message WorkflowNodeModified {
  string key = 1;
  WorkflowNodeDiff diff = 2;
}
message WorkflowNodesDiff {
  repeated string removed = 1;
  repeated WorkflowNodeModified modified = 2;
  repeated WorkflowNode added = 3;
}
message WorkflowEdgeDiff {
  PortRef from = 1;
  PortRef to = 2;
  optional string kind = 3;
}
message WorkflowEdgeModified {
  string key = 1;
  WorkflowEdgeDiff diff = 2;
}
message WorkflowEdgesDiff {
  repeated string removed = 1;
  repeated WorkflowEdgeModified modified = 2;
  repeated WorkflowEdge added = 3;
}
message SemioWorkflowDiff {
  WorkflowNodesDiff nodes = 1;
  WorkflowEdgesDiff edges = 2;
}
