# 🧬️ SemioAnimationSnapshot schema — real mirror of `🦀️component.rs` (the source of truth).
# timelines -> channels{target{node,property}, interpolation, keyframes{t, value}}, informed by
# gltf's Animation/Channel/Sampler triad.

type SemioPoint3 { x: Float! y: Float! z: Float! }
type SemioQuaternion { x: Float! y: Float! z: Float! w: Float! }

enum AnimInterpolation { LINEAR STEP CUBIC_SPLINE }

union AnimTargetProperty =
    AnimTargetPropertyTranslation
  | AnimTargetPropertyRotation
  | AnimTargetPropertyScale
  | AnimTargetPropertyWeights
  | AnimTargetPropertyCustom

type AnimTargetPropertyTranslation { _: Boolean }
type AnimTargetPropertyRotation { _: Boolean }
type AnimTargetPropertyScale { _: Boolean }
type AnimTargetPropertyWeights { _: Boolean }
type AnimTargetPropertyCustom { name: String! }

type AnimTarget {
  node: String!
  property: AnimTargetProperty!
}

union AnimValue =
    AnimValueScalar
  | AnimValueVec3
  | AnimValueQuat
  | AnimValueWeights

type AnimValueScalar { value: Float! }
type AnimValueVec3 { value: SemioPoint3! }
type AnimValueQuat { value: SemioQuaternion! }
type AnimValueWeights { values: [Float!]! }

type AnimKeyframe {
  t: Float!
  value: AnimValue!
}

type AnimChannel {
  target: AnimTarget!
  interpolation: AnimInterpolation!
  keyframes: [AnimKeyframe!]!
}

type AnimTimeline {
  name: String
  channels: [AnimChannel!]!
}

type SemioAnimationSnapshot {
  schema: String! @state(class: ARTIFACT)
  timelines: [AnimTimeline!]! @state(class: ARTIFACT)
}
