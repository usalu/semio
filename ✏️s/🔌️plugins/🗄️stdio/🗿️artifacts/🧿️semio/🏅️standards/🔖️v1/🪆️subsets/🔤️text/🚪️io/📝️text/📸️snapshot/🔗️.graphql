# 📝️ Text-facet grammar mirror, GraphQL SDL shape (descriptive) — see ../🔗️.graphql for
# the canonical facet schema; this file describes the DSL-text ENCODING of the same shape.
type SemioTextSnapshotDsl {
  schema: String!
  runs: [SemioTextRunDsl!]!
}
type SemioTextRunDsl {
  language: String!
  content: String!
  marks: [SemioTextMarkDsl!]!
}
type SemioTextMarkDsl {
  kind: String!
  href: String!
}
