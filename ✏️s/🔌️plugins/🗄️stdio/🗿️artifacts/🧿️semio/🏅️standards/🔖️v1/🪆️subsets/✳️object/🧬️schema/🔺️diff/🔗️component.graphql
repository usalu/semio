# 🔺️ SemioObjectDiff facet mirror — mirrors the `🦀️component.rs` sibling's real fields.
enum SemioValueDiffKind { REPLACE BOOL INT FLOAT STR BYTES LIST MAP REF }

type SemioValueDiff {
  kind: SemioValueDiffKind!
  value: String
  lexeme: String
  diff: String
  id: ObjectId
}

type IndexedTripleDiff {
  removed: [Int!]!
  modifiedIndex: [Int!]!
  modifiedDiff: [SemioValueDiff!]!
  addedIndex: [Int!]!
  addedItem: [SemioValue!]!
}

type NamedAddedEntry {
  index: Int!
  item: SemioObjectEntry!
}

type NamedTripleDiff {
  removed: [String!]!
  modifiedKey: [String!]!
  modifiedDiff: [SemioValueDiff!]!
  added: [NamedAddedEntry!]!
}

type NamedAddedNode {
  index: Int!
  item: SemioObjectNode!
}

type ObjectsTripleDiff {
  removed: [ObjectId!]!
  modifiedKey: [ObjectId!]!
  modifiedDiff: [SemioValueDiff!]!
  added: [NamedAddedNode!]!
}

type SemioObjectDiff {
  root: SemioValueDiff @state(class: PERSISTENT)
  objects: ObjectsTripleDiff @state(class: PERSISTENT)
}
