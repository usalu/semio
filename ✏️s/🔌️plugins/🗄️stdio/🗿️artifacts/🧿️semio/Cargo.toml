cargo-features = [ "trim-paths" ]

[workspace]
resolver = "2"
members = [ "📦️packages/🦀️rust" ]
exclude = [
  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**",
  "🏅️standards/🔖️v1/🪆️subsets/📐️cad/🏭️generator/🧩️json/📦️packages/🦀️rust",
  "🏅️standards/🔖️v1/🪆️subsets/📐️cad/🔬️probes/📖️reader/📦️packages/🦀️rust",
  "🏅️standards/🔖️v1/🪆️subsets/📑️document/🏭️generator/🧩️json/📦️packages/🦀️rust",
  "🏅️standards/🔖️v1/🪆️subsets/🔺️mesh/🏭️generator/🧩️json/📦️packages/🦀️rust",
  "🏅️standards/🔖️v1/🪆️subsets/🖊️drawing/🏭️generator/🔁️codec/📦️packages/🦀️rust",
  "🏅️standards/🔖️v1/🪆️subsets/🖊️drawing/🏭️generator/🧩️json/📦️packages/🦀️rust",
  "🏅️standards/🔖️v1/🪆️subsets/🖊️drawing/🔬️probes/📖️reader/📦️packages/🦀️rust",
  "🏅️standards/🔖️v1/🪆️subsets/🧊️brep/🏭️generator/🧩️json/📦️packages/🦀️rust",
  "🔮️oracles/📦️packages/🦀️rust"
]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**"
]
member-manifests = [ "**/📦️packages/🦀️rust/Cargo.toml" ]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

