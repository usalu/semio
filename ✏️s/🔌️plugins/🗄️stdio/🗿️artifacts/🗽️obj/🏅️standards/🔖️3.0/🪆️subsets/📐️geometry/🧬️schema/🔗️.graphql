scalar ObjIndexUInt32
scalar ObjSourceUInt64

# 🧬️ ObjArtifact schema facet — mirrors 🦀️.rs field-for-field.

type ObjVertex { x: Float! y: Float! z: Float! w: Float }
type ObjTexCoord { u: Float! v: Float! w: Float }
type ObjNormal { x: Float! y: Float! z: Float! }
type ObjFaceVertex { vertex: ObjIndexUInt32! texcoord: ObjIndexUInt32 normal: ObjIndexUInt32 }
type ObjFace { vertices: [ObjFaceVertex!]! }
type ObjGroup { name: String! faces: [ObjSourceUInt64!]! }
type ObjObject { name: String! faces: [ObjSourceUInt64!]! }
type ObjUsemtlRange { faceIndexFrom: ObjSourceUInt64! material: String! }
type ObjSmoothingRange { faceIndexFrom: ObjSourceUInt64! group: ObjIndexUInt32 }
type ObjUnknownStatement { lineIndex: ObjSourceUInt64! raw: String! }

type ObjArtifact {
  schema: String!
  vertices: [ObjVertex!]!
  texcoords: [ObjTexCoord!]!
  normals: [ObjNormal!]!
  faces: [ObjFace!]!
  groups: [ObjGroup!]!
  objects: [ObjObject!]!
  mtllib: String
  usemtl: [ObjUsemtlRange!]!
  smoothingGroups: [ObjSmoothingRange!]!
  unknownStatements: [ObjUnknownStatement!]!
}
