# 🧬️ Exact logical TIFF pages and precision-preserving sample words.
scalar UInt32
scalar UInt16
scalar Int64
enum TiffFieldType { BYTE ASCII SHORT LONG RATIONAL S_BYTE UNDEFINED S_SHORT S_LONG S_RATIONAL FLOAT DOUBLE }
type TiffWord64 { lo: UInt32! hi: UInt32! }
input TiffWord64Input { lo: UInt32! hi: UInt32! }
type TiffBinary32 { bits: UInt32! }
input TiffBinary32Input { bits: UInt32! }
type TiffRationalPair { numerator: Int64! denominator: Int64! }
input TiffRationalPairInput { numerator: Int64! denominator: Int64! }
type TiffValues { kind: TiffFieldType! byteValue: [UInt32!] asciiValue: [String!] shortValue: [UInt32!] longValue: [UInt32!] rationalValue: [TiffRationalPair!] sByteValue: [Int!] undefinedValue: [UInt32!] sShortValue: [Int!] sLongValue: [Int!] sRationalValue: [TiffRationalPair!] floatValue: [TiffBinary32!] doubleValue: [TiffWord64!] }
input TiffValuesInput { kind: TiffFieldType! byteValue: [UInt32!] asciiValue: [String!] shortValue: [UInt32!] longValue: [UInt32!] rationalValue: [TiffRationalPairInput!] sByteValue: [Int!] undefinedValue: [UInt32!] sShortValue: [Int!] sLongValue: [Int!] sRationalValue: [TiffRationalPairInput!] floatValue: [TiffBinary32Input!] doubleValue: [TiffWord64Input!] }
type TiffTag { tag: UInt16! values: TiffValues! }
input TiffTagInput { tag: UInt16! values: TiffValuesInput! }
type TiffSampleBlock { x: UInt32! y: UInt32! width: UInt32! height: UInt32! channels: UInt16! samples: [TiffWord64!]! }
input TiffSampleBlockInput { x: UInt32! y: UInt32! width: UInt32! height: UInt32! channels: UInt16! samples: [TiffWord64Input!]! }
type TiffIfd { entries: [TiffTag!]! blocks: [TiffSampleBlock!]! }
input TiffIfdInput { entries: [TiffTagInput!]! blocks: [TiffSampleBlockInput!]! }
type TiffSnapshot { schema: String! @state(class: ARTIFACT) ifds: [TiffIfd!]! @state(class: ARTIFACT) }
input TiffSnapshotInput { schema: String! ifds: [TiffIfdInput!]! }
