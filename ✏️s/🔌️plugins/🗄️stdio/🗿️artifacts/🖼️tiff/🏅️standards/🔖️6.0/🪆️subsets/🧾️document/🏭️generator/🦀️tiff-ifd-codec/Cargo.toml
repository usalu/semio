# 🧭️ Own workspace root, exactly like the sibling riff-avi-codec
# (✏️s/🔌️plugins/🗄️stdio/🗿️artifacts/📼️avi/🏅️standards/🔖️1.0/🪆️subsets/✳️any/🏭️generator/🦀️riff-avi-codec/Cargo.toml)
# — never joins the repository's root workspace or its Cargo.lock.
[workspace]

[package]
name = "tiff-ifd-codec"
version = "0.1.0"
edition = "2021"

[dependencies]
tiff = "0.11.3"

[[bin]]
name = "tiff-ifd-codec"
path = "src/main.rs"
