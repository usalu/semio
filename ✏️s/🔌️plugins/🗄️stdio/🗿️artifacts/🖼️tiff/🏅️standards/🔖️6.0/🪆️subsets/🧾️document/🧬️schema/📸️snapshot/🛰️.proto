syntax = "proto3";
package semio.s_stdio_tiff.snapshot;
// 🧬️ Ordered logical pages and exact word identities.
enum TiffFieldType { TIFF_FIELD_TYPE_UNSPECIFIED = 0; BYTE = 1; ASCII = 2; SHORT = 3; LONG = 4; RATIONAL = 5; S_BYTE = 6; UNDEFINED = 7; S_SHORT = 8; S_LONG = 9; S_RATIONAL = 10; FLOAT = 11; DOUBLE = 12; }
message TiffWord64 { uint32 lo = 1; uint32 hi = 2; }
message TiffBinary32 { uint32 bits = 1; }
message TiffRationalPair { sint64 numerator = 1; sint64 denominator = 2; }
message TiffValues { TiffFieldType kind = 1; repeated uint32 byte_value = 2; repeated string ascii_value = 3; repeated uint32 short_value = 4; repeated uint32 long_value = 5; repeated TiffRationalPair rational_value = 6; repeated sint32 s_byte_value = 7; repeated uint32 undefined_value = 8; repeated sint32 s_short_value = 9; repeated sint32 s_long_value = 10; repeated TiffRationalPair s_rational_value = 11; repeated TiffBinary32 float_value = 12; repeated TiffWord64 double_value = 13; }
message TiffTag { uint32 tag = 1; TiffValues values = 2; }
message TiffSampleBlock { uint32 x = 1; uint32 y = 2; uint32 width = 3; uint32 height = 4; uint32 channels = 5; repeated TiffWord64 samples = 6; }
message TiffIfd { repeated TiffTag entries = 1; repeated TiffSampleBlock blocks = 2; }
message TiffSnapshot { string schema = 1; repeated TiffIfd ifds = 2; }
