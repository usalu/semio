enum MdMutationKind {
  INSERT_BLOCK
  REMOVE_BLOCK
  REPLACE_BLOCK
  SET_INLINES
  SPLICE_SOURCE
}

""" 🧬️ MdMutation union, tagged-union flattened. Every `path`-carrying variant addresses the
CONTAINER `index` lives in (`path: []` = the top-level document blocks). """
type MdMutation {
  mutation: MdMutationKind!
  snapshot: MdSnapshot
  path: [MdPathStep!]
  index: Int
  block: MdBlock
  inlines: [MdInline!]
  splices: [MdSourceSplice!]
}

"""✂️ One range of the edited document source: `delete` scalars at `offset` replaced by `insert`. """
type MdSourceSplice {
  offset: Int!
  delete: Int!
  insert: String!
}
