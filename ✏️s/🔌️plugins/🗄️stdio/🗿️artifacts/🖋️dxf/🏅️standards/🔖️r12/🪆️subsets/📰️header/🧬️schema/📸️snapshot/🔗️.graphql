# 🧬️ DxfSnapshot schema facet — mirrors 🦀️.rs field-for-field (camelCase).

enum DxfValueKind { STR INT DOUBLE POINT }

type DxfValue {
  kind: DxfValueKind!
  strValue: String
  intValue: Int
  doubleValue: Float
  pointValue: [Float!]
}

type DxfGroupCode {
  code: Int!
  value: DxfValue!
}

type DxfTag {
  code: Int!
  value: String!
}

type DxfHeaderVar {
  name: String!
  groupCode: Int!
  value: DxfValue!
  extraGroupCodes: [DxfGroupCode!]
}

type DxfLayer {
  name: String!
  color: Int!
  linetype: String!
  flags: Int!
  unknownGroupCodes: [DxfGroupCode!]
}

type DxfStyle {
  name: String!
  flags: Int!
  fontName: String!
  unknownGroupCodes: [DxfGroupCode!]
}

type DxfLinetype {
  name: String!
  flags: Int!
  description: String!
  unknownGroupCodes: [DxfGroupCode!]
}

type DxfTables {
  layers: [DxfLayer!]!
  styles: [DxfStyle!]!
  linetypes: [DxfLinetype!]!
}

type DxfOtherTable {
  name: String!
  tags: [DxfTag!]!
}

type DxfVertex {
  x: Float!
  y: Float!
  z: Float!
  bulge: Float!
  unknownGroupCodes: [DxfGroupCode!]
}

enum DxfEntityKind { LINE CIRCLE ARC POLYLINE TEXT SOLID INSERT OTHER }

"""📐️ Discriminated on `kind`; fields relevant to other kinds are null."""
type DxfEntity {
  kind: DxfEntityKind!
  start: [Float!]
  end: [Float!]
  center: [Float!]
  radius: Float
  startAngle: Float
  endAngle: Float
  vertices: [DxfVertex!]
  closed: Boolean
  position: [Float!]
  height: Float
  value: String
  points: [[Float!]!]
  blockName: String
  scale: [Float!]
  rotation: Float
  layer: String
  otherKind: String
  groupCodes: [DxfGroupCode!]
  unknownGroupCodes: [DxfGroupCode!]
}

type DxfBlock {
  name: String!
  basePoint: [Float!]!
  entities: [DxfEntity!]!
  unknownGroupCodes: [DxfGroupCode!]
}

type DxfSnapshot {
  schema: String!
  headerVars: [DxfHeaderVar!]!
  tables: DxfTables!
  otherTables: [DxfOtherTable!]!
  blocks: [DxfBlock!]!
  entities: [DxfEntity!]!
}
