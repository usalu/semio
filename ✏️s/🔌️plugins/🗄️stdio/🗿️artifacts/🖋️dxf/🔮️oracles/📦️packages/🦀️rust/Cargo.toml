[workspace]
members = ["."]

[workspace.metadata.semio.repository]
exclude-patterns = []
schema-version = 1
member-manifests = ["Cargo.toml"]

[package]
name = "semio-s-artifact-stdio-dxf-test-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "🔮️ Owned independent test oracle provider"

[package.metadata.semio]
role = "test"

[lib]
name = "semio_s_artifact_stdio_dxf_test_oracle"
path = "../../🦀️.rs"

[features]
oracles = ["dep:dxf", "semio-s-plugin-stdio-drawing-test-oracle/oracles"]

[dependencies]
"dxf" = { version = "0.6", optional = true }
"semio-repo-test-host" = { path = "../../../../../../../../🧰️framework/🛍️products/🦑️repo/🔨️modules/🧪️test/📦️packages/🦀️rust", default-features = false }
"semio-s-plugin-stdio-drawing-test-oracle" = { path = "../../../../../🔮️oracles/🖊️drawing/📦️packages/🦀️rust", default-features = false }
