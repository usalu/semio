# 🧬 Transparent TxtMutation descriptor roster.
# set-trailing-newline/SetTrailingNewline
# set-line-ending/SetLineEnding
# insert-line/InsertLine
# remove-line/RemoveLine
# set-line/SetLine
enum TxtMutationTag {
  SET_TRAILING_NEWLINE
  SET_LINE_ENDING
  INSERT_LINE
  REMOVE_LINE
  SET_LINE
}

input TxtMutationInput {
  mutation: TxtMutationTag!
  setTrailingNewline: SetTrailingNewlinePayload
  setLineEnding: SetLineEndingPayload
  insertLine: InsertLinePayload
  removeLine: RemoveLinePayload
  setLine: SetLinePayload
}
