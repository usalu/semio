syntax = "proto3";
package semio.s.stdio.txt.inference;

// 💡️ Txt inference schema — document outline (line/word/char counts).

message TxtInference {
  // @state inferred
  TxtOutline outline = 1;
}

message TxtOutline {
  uint32 line_count = 1;
  uint32 word_count = 2;
  uint32 char_count = 3;
}
