# 🧬 Logical ZIP mutations over archive comment and name-keyed decompressed members.

enum ZipMutationKind {
  SET_ARCHIVE_COMMENT
  ADD_ENTRY
  REMOVE_ENTRY
  RENAME_ENTRY
  SET_ENTRY_DATA
}

type ZipEntry {
  name: String!
  data: [Int!]!
}

type ZipSnapshot {
  schema: String!
  entries: [ZipEntry!]!
  comment: String!
}

type ZipMutation {
  mutation: ZipMutationKind!
  snapshot: ZipSnapshot
  comment: String
  commentUtf8: Boolean
  entry: ZipEntry
  before: String
  name: String
  newName: String
  data: [Int!]
}
