[package]
workspace = "../.."
name = "semio-s-artifact-stdio-gltf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio gltf artifact: definition, declaration, facets and registration over the gltf crates"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-os-command = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️spr/🎮️command/📦️packages/🦀️rust" }
semio-framework-pack = { path = "../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-diagnostic = { workspace = true }
semio-framework-dsl = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-s-artifact-stdio-contract = { workspace = true }
semio-s-artifact-stdio-gltf-inferences = { workspace = true }
semio-s-artifact-stdio-gltf-model = { workspace = true }
semio-s-artifact-stdio-gltf-mutations = { workspace = true }

[dev-dependencies]
blake3 = "1.8"
semio-framework = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-test-fixtures = { path = "../../../../../../../🧰️framework/🔨️modules/🧪️test/🧲️fixture-reader/📦️packages/🦀️rust" }
semio-s-artifact-stdio-contract = { workspace = true, features = ["testing"] }
semio-s-artifact-stdio-gltf-editor = { workspace = true }
serde_json = { workspace = true }

[package.metadata.semio.composition]
manifest = "../../🧩️composition/🔣️.json"
