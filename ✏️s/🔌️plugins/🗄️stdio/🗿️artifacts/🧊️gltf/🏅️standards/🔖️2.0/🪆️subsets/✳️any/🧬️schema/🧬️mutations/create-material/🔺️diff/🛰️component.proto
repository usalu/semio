syntax = "proto3";
package stdio.gltf.mutation;
message GltfCreateMaterialPayloadV1 { uint32 position = 1; }
message GltfMaterialValueV1 { optional string name = 1; bytes pbr_metallic_roughness = 2; bytes normal_texture = 3; bytes occlusion_texture = 4; bytes emissive_texture = 5; repeated float emissive_factor = 6; string alpha_mode = 7; float alpha_cutoff = 8; bool double_sided = 9; bytes extensions = 10; bytes extras = 11; }
message GltfPrimitiveValueV1 { map<string, uint32> attributes = 1; optional uint32 indices = 2; optional uint32 material = 3; uint32 mode = 4; repeated bytes targets = 5; bytes extensions = 6; bytes extras = 7; }
message GltfAnimationChannelValueV1 { uint32 sampler = 1; bytes target = 2; bytes extensions = 3; bytes extras = 4; }
message GltfAnimationSamplerValueV1 { uint32 input = 1; string interpolation = 2; uint32 output = 3; bytes extensions = 4; bytes extras = 5; }
message GltfPerspectiveValueV1 { optional float aspect_ratio = 1; float yfov = 2; optional float zfar = 3; float znear = 4; bytes extensions = 5; bytes extras = 6; }
message GltfOrthographicValueV1 { float xmag = 1; float ymag = 2; float zfar = 3; float znear = 4; bytes extensions = 5; bytes extras = 6; }
message GltfCameraProjectionV1 { oneof projection { GltfPerspectiveValueV1 perspective = 1; GltfOrthographicValueV1 orthographic = 2; } }
message GltfCreateMaterialDiffOperationV1 { string kind = 1; uint32 position = 2; GltfMaterialValueV1 item = 3; }
message GltfCreateMaterialDiffV1 { string id = 1; uint32 version = 2; repeated string touched_paths = 3; GltfCreateMaterialPayloadV1 payload = 4; GltfCreateMaterialDiffOperationV1 operation = 5; }
