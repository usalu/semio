# 💡️ Typed slenderness glTF inference result.
type GltfSlendernessQualityV1 {
  method: String!
  coverage: Float!
  absoluteError: Float
  relativeError: Float
  sampleCount: Int!
  watertight: Boolean!
  manifold: Boolean!
  consistentlyOriented: Boolean!
  warnings: [String!]!
}

type GltfSlendernessProvenanceV1 {
  algorithm: String!
  algorithmVersion: Int!
  dependencyFingerprints: [String!]!
  coordinateSpace: String!
  toleranceFingerprint: String!
  samplingSeed: String
  pose: String
}

type GltfSlendernessInferenceV1 {
  value: Float
  unit: String!
  availability: String!
  validity: String!
  diagnosticIds: [String!]!
  quality: GltfSlendernessQualityV1!
  provenance: GltfSlendernessProvenanceV1!
}
