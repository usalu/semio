[package]
workspace = "../../../../../../.."
name = "semio-s-artifact-stdio-gltf-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio gltf model: the glTF 2.0 snapshot, schema and native codecs, with the reader and writer"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
# 🧪️ Test-only: the serde codec oracles the dependent crates' tests compare against; enabled only through `[dev-dependencies]`.
testing = ["semio-s-artifact-stdio-gltf-model-v2-0/testing", "semio-s-artifact-stdio-gltf-model-diff-aggregate/testing", "semio-s-artifact-stdio-gltf-model-snapshot/testing", "semio-s-artifact-stdio-gltf-model-snapshot-root/testing", "semio-s-artifact-stdio-gltf-model-schema/testing", "semio-s-artifact-stdio-gltf-model-wire/testing", "semio-s-artifact-stdio-gltf-model-wire-2/testing"]
[dependencies]
semio-s-artifact-stdio-gltf-model-v2-0 = { path = "../../../../../📦️packages/🦀️rust" }
semio-s-artifact-stdio-gltf-model-diff-aggregate = { path = "../../🔺️diff/🧊️gltf-diff-aggregate/📦️packages/🦀️rust" }
semio-s-artifact-stdio-gltf-model-snapshot = { path = "../../📸️snapshot/📦️packages/🦀️rust" }
semio-s-artifact-stdio-gltf-model-snapshot-root = { path = "../../📸️snapshot/🧳️snapshot-root/📦️packages/🦀️rust" }
semio-s-artifact-stdio-gltf-model-schema = { path = "../../../🚪️io/📝️text/📸️snapshot/🧪️serde-oracle/📦️packages/🦀️rust" }
semio-s-artifact-stdio-gltf-model-wire = { path = "../../../🚪️io/💾️binary/🔺️diff/🧵️wire/📦️packages/🦀️rust" }
semio-s-artifact-stdio-gltf-model-wire-2 = { path = "../../../🚪️io/📝️text/🔺️diff/🧵️wire/📦️packages/🦀️rust" }
pack = { workspace = true }
semio-framework-artifact-reference = { workspace = true }
semio-framework-diagnostic = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-dsl-record-derive = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-schema-composition = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-framework-schema-state = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semio-s-artifact-stdio-gltf-exports-graphql = { workspace = true }
semio-s-artifact-stdio-gltf-exports-json = { workspace = true }
semio-s-artifact-stdio-gltf-exports-proto = { workspace = true }
semio-s-artifact-stdio-gltf-exports-rust = { workspace = true }
semio-s-artifact-stdio-gltf-exports-typescript = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
semio-framework-dsl = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-s-artifact-stdio-contract = { workspace = true, features = ["testing"] }
