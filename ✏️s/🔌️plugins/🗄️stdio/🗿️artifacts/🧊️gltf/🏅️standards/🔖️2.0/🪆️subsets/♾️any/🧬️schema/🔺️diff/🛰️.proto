syntax = "proto3";
package semio.s_stdio_gltf.diff;

enum GltfTouchedRegion { TOUCHED_REGION_UNSPECIFIED = 0; ASSET = 1; SCENE = 2; SCENES = 3; NODES = 4; MESHES = 5; ACCESSORS = 6; BUFFER_VIEWS = 7; BUFFERS = 8; BUFFER_BYTES = 9; MATERIALS = 10; TEXTURES = 11; IMAGES = 12; SAMPLERS = 13; SKINS = 14; ANIMATIONS = 15; CAMERAS = 16; EXTENSIONS_USED = 17; EXTENSIONS_REQUIRED = 18; EXTENSIONS = 19; EXTRAS = 20; SOURCE_FORM = 21; }

import "../📸️snapshot/🛰️.proto";
// GltfAsset, GltfScene, GltfNode, GltfMesh, GltfAccessor, GltfBufferView, GltfBuffer,
// GltfMaterial, GltfTexture, GltfImage, GltfSampler, GltfSkin, GltfAnimation, GltfCamera,
// GltfJsonValue, GltfSparseAccessor.

message GltfAssetDiff {
  optional string version = 1;
  optional string generator = 2;
  optional string copyright = 3;
  optional string min_version = 4;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 5;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 6;
}

message GltfRefsDelta { repeated GltfRefRemoval removed = 1; repeated GltfRefInsertion inserted = 2; repeated GltfRefRelocation moved = 3; }
message GltfRefRemoval { uint64 id = 1; uint64 index = 2; }
message GltfRefInsertion { uint64 index = 1; uint64 row = 2; }
message GltfRefRelocation { uint64 id = 1; uint64 from = 2; uint64 to = 3; }
message GltfStringsDelta { repeated GltfStringRemoval removed = 1; repeated GltfStringInsertion inserted = 2; repeated GltfStringRelocation moved = 3; }
message GltfStringRemoval { string id = 1; uint64 index = 2; }
message GltfStringInsertion { uint64 index = 1; string row = 2; }
message GltfStringRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message GltfAttribute { string semantic = 1; uint64 accessor = 2; }
message GltfAttributesDelta { repeated GltfAttributeRemoval removed = 1; repeated GltfAttributeInsertion inserted = 2; repeated GltfAttributeRelocation moved = 3; }
message GltfAttributeRemoval { string id = 1; uint64 index = 2; }
message GltfAttributeInsertion { uint64 index = 1; GltfAttribute row = 2; }
message GltfAttributeRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message GltfTargetsDelta { repeated GltfTargetRemoval removed = 1; repeated GltfTargetInsertion inserted = 2; repeated GltfTargetRelocation moved = 3; }
message GltfTargetRemoval { string id = 1; uint64 index = 2; }
message GltfTargetInsertion { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfMorphTarget row = 2; }
message GltfTargetRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message GltfChannelsDelta { repeated GltfChannelRemoval removed = 1; repeated GltfChannelInsertion inserted = 2; repeated GltfChannelRelocation moved = 3; }
message GltfChannelRemoval { string id = 1; uint64 index = 2; }
message GltfChannelInsertion { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfAnimationChannel row = 2; }
message GltfChannelRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message GltfAnimationSamplersDelta { repeated GltfAnimationSamplerRemoval removed = 1; repeated GltfAnimationSamplerInsertion inserted = 2; repeated GltfAnimationSamplerRelocation moved = 3; }
message GltfAnimationSamplerRemoval { string id = 1; uint64 index = 2; }
message GltfAnimationSamplerInsertion { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfAnimationSampler row = 2; }
message GltfAnimationSamplerRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message GltfSceneDiff { optional GltfRefsDelta nodes = 1; optional string name = 2; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 3; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 4; }
message GltfNodeDiff {
  optional GltfRefsDelta children = 1;
  optional uint64 mesh = 2;
  optional uint64 camera = 3;
  optional uint64 skin = 4;
  repeated double matrix = 5;
  repeated double translation = 6;
  repeated double rotation = 7;
  repeated double scale = 8;
  repeated double weights = 9;
  optional string name = 10;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 11;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 12;
}
message GltfPrimitiveDiff { optional GltfAttributesDelta attributes = 1; optional uint64 indices = 2; optional uint64 material = 3; optional uint64 mode = 4; optional GltfTargetsDelta targets = 5; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 6; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 7; }
message GltfPrimitivesDiff { repeated uint64 removed = 1; repeated GltfPrimitiveModified modified = 2; repeated GltfPrimitiveAdded added = 3; repeated GltfPrimitiveModified amended = 4; }
message GltfPrimitiveModified { uint64 index = 1; GltfPrimitiveDiff diff = 2; }
message GltfPrimitiveAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfPrimitive item = 2; }
message GltfMeshDiff { optional GltfPrimitivesDiff primitives = 1; repeated double weights = 2; optional string name = 3; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 4; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 5; }
message GltfAccessorDiff {
  optional uint64 buffer_view = 1;
  optional uint64 byte_offset = 2;
  optional uint32 component_type = 3;
  optional bool normalized = 4;
  optional uint64 count = 5;
  optional string kind = 6;
  repeated double max = 7;
  repeated double min = 8;
  optional semio.s_stdio_gltf.snapshot.GltfSparseAccessor sparse = 9;
  optional string name = 10;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 11;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 12;
}
message GltfMaterialDiff {
  optional string name = 1;
  optional semio.s_stdio_gltf.snapshot.GltfPbrMetallicRoughness pbr_metallic_roughness = 2;
  optional semio.s_stdio_gltf.snapshot.GltfNormalTextureInfo normal_texture = 3;
  optional semio.s_stdio_gltf.snapshot.GltfOcclusionTextureInfo occlusion_texture = 4;
  optional semio.s_stdio_gltf.snapshot.GltfTextureInfo emissive_texture = 5;
  repeated double emissive_factor = 6;
  optional string alpha_mode = 7;
  optional double alpha_cutoff = 8;
  optional bool double_sided = 9;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 10;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 11;
}
message GltfBufferDiff { optional uint64 byte_length = 1; optional string uri = 2; optional string name = 3; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 4; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 5; }

// Generic collection triple wire shape, one instantiation per top-level array (repeated blocks
// below since proto3 has no generics) -- `modified`/`added` payload type varies per array.
message GltfScenesDiff { repeated uint64 removed = 1; repeated GltfSceneModified modified = 2; repeated GltfSceneAdded added = 3; repeated GltfSceneModified amended = 4; }
message GltfSceneModified { uint64 index = 1; GltfSceneDiff diff = 2; }
message GltfSceneAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfScene item = 2; }

message GltfNodesDiff { repeated uint64 removed = 1; repeated GltfNodeModified modified = 2; repeated GltfNodeAdded added = 3; repeated GltfNodeModified amended = 4; }
message GltfNodeModified { uint64 index = 1; GltfNodeDiff diff = 2; }
message GltfNodeAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfNode item = 2; }

message GltfMeshesDiff { repeated uint64 removed = 1; repeated GltfMeshModified modified = 2; repeated GltfMeshAdded added = 3; repeated GltfMeshModified amended = 4; }
message GltfMeshModified { uint64 index = 1; GltfMeshDiff diff = 2; }
message GltfMeshAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfMesh item = 2; }

message GltfAccessorsDiff { repeated uint64 removed = 1; repeated GltfAccessorModified modified = 2; repeated GltfAccessorAdded added = 3; repeated GltfAccessorModified amended = 4; }
message GltfAccessorModified { uint64 index = 1; GltfAccessorDiff diff = 2; }
message GltfAccessorAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfAccessor item = 2; }

message GltfMaterialsDiff { repeated uint64 removed = 1; repeated GltfMaterialModified modified = 2; repeated GltfMaterialAdded added = 3; repeated GltfMaterialModified amended = 4; }
message GltfMaterialModified { uint64 index = 1; GltfMaterialDiff diff = 2; }
message GltfMaterialAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfMaterial item = 2; }

message GltfBuffersDiff { repeated uint64 removed = 1; repeated GltfBufferModified modified = 2; repeated GltfBufferAdded added = 3; repeated GltfBufferModified amended = 4; }
message GltfBufferModified { uint64 index = 1; GltfBufferDiff diff = 2; }
message GltfBufferAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfBuffer item = 2; }

// Weak collections: diff == whole new item.
message GltfBufferViewsDiff { repeated uint64 removed = 1; repeated GltfBufferViewModified modified = 2; repeated GltfBufferViewAdded added = 3; repeated GltfBufferViewModified amended = 4; }
message GltfBufferViewModified { uint64 index = 1; GltfBufferViewDiff diff = 2; }
message GltfBufferViewDiff { optional uint64 buffer = 1; optional uint64 byte_offset = 2; optional uint64 byte_length = 3; optional uint64 byte_stride = 4; optional uint64 target = 5; optional string name = 6; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 7; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 8; }
message GltfBufferViewAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfBufferView item = 2; }

message GltfBufferBytesDiff { repeated uint64 removed = 1; repeated GltfBufferBytesModified modified = 2; repeated GltfBufferBytesAdded added = 3; repeated GltfBufferBytesModified amended = 4; }
message GltfBufferBytesModified { uint64 index = 1; bytes diff = 2; }
message GltfBufferBytesAdded { uint64 index = 1; bytes item = 2; }

message GltfTexturesDiff { repeated uint64 removed = 1; repeated GltfTextureModified modified = 2; repeated GltfTextureAdded added = 3; repeated GltfTextureModified amended = 4; }
message GltfTextureModified { uint64 index = 1; GltfTextureDiff diff = 2; }
message GltfTextureDiff { optional uint64 sampler = 1; optional uint64 source = 2; optional string name = 3; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 4; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 5; }
message GltfTextureAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfTexture item = 2; }

message GltfImagesDiff { repeated uint64 removed = 1; repeated GltfImageModified modified = 2; repeated GltfImageAdded added = 3; repeated GltfImageModified amended = 4; }
message GltfImageModified { uint64 index = 1; GltfImageDiff diff = 2; }
message GltfImageDiff { optional string uri = 1; optional string mime_type = 2; optional uint64 buffer_view = 3; optional string name = 4; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 5; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 6; }
message GltfImageAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfImage item = 2; }

message GltfSamplersDiff { repeated uint64 removed = 1; repeated GltfSamplerModified modified = 2; repeated GltfSamplerAdded added = 3; repeated GltfSamplerModified amended = 4; }
message GltfSamplerModified { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfSampler diff = 2; }
message GltfSamplerAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfSampler item = 2; }

message GltfSkinsDiff { repeated uint64 removed = 1; repeated GltfSkinModified modified = 2; repeated GltfSkinAdded added = 3; repeated GltfSkinModified amended = 4; }
message GltfSkinModified { uint64 index = 1; GltfSkinDiff diff = 2; }
message GltfSkinDiff { optional uint64 inverse_bind_matrices = 1; optional uint64 skeleton = 2; optional GltfRefsDelta joints = 3; optional string name = 4; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 5; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 6; }
message GltfSkinAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfSkin item = 2; }

message GltfAnimationsDiff { repeated uint64 removed = 1; repeated GltfAnimationModified modified = 2; repeated GltfAnimationAdded added = 3; repeated GltfAnimationModified amended = 4; }
message GltfAnimationModified { uint64 index = 1; GltfAnimationDiff diff = 2; }
message GltfAnimationDiff { optional GltfChannelsDelta channels = 1; optional GltfAnimationSamplersDelta samplers = 2; optional string name = 3; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 4; optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 5; }
message GltfAnimationAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfAnimation item = 2; }

message GltfCamerasDiff { repeated uint64 removed = 1; repeated GltfCameraModified modified = 2; repeated GltfCameraAdded added = 3; repeated GltfCameraModified amended = 4; }
message GltfCameraModified { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfCamera diff = 2; }
message GltfCameraAdded { uint64 index = 1; semio.s_stdio_gltf.snapshot.GltfCamera item = 2; }

message GltfDiff {
  optional GltfAssetDiff asset = 1;
  optional uint64 scene = 2;
  optional GltfScenesDiff scenes = 3;
  optional GltfNodesDiff nodes = 4;
  optional GltfMeshesDiff meshes = 5;
  optional GltfAccessorsDiff accessors = 6;
  optional GltfBufferViewsDiff buffer_views = 7;
  optional GltfBuffersDiff buffers = 8;
  optional GltfBufferBytesDiff buffer_bytes = 9;
  optional GltfMaterialsDiff materials = 10;
  optional GltfTexturesDiff textures = 11;
  optional GltfImagesDiff images = 12;
  optional GltfSamplersDiff samplers = 13;
  optional GltfSkinsDiff skins = 14;
  optional GltfAnimationsDiff animations = 15;
  optional GltfCamerasDiff cameras = 16;
  optional GltfStringsDelta extensions_used = 17;
  optional GltfStringsDelta extensions_required = 18;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extensions = 19;
  optional semio.s_stdio_gltf.snapshot.GltfJsonValue extras = 20;
  optional string source_form = 21;
}
message GltfDiffDerivation { GltfDiff forward = 1; GltfDiff inverse = 2; repeated string touched_paths = 3; repeated GltfTouchedRegion touched_regions = 4; }
