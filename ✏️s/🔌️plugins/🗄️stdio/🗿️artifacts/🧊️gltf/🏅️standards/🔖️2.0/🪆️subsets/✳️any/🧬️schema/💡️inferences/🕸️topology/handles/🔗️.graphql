# 💡️ Typed handles glTF inference result.
scalar GltfHandlesUInt64V1

type GltfHandlesQualityV1 {
  method: String!
  coverage: Float!
  absoluteError: Float
  relativeError: Float
  sampleCount: GltfHandlesUInt64V1!
  watertight: Boolean!
  manifold: Boolean!
  consistentlyOriented: Boolean!
  warnings: [String!]!
}

type GltfHandlesProvenanceV1 {
  algorithm: String!
  algorithmVersion: Int!
  dependencyFingerprints: [String!]!
  coordinateSpace: String!
  toleranceFingerprint: String!
  samplingSeed: String
  pose: String
}

type GltfHandlesInferenceV1 {
  value: GltfHandlesUInt64V1
  unit: String!
  availability: String!
  validity: String!
  diagnosticIds: [String!]!
  quality: GltfHandlesQualityV1!
  provenance: GltfHandlesProvenanceV1!
}
