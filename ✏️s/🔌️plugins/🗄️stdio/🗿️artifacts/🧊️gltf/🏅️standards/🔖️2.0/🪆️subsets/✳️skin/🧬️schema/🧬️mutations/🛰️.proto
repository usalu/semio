syntax = "proto3";
package stdio.gltf.mutation.skin;
import "🌱️🧥️create-skin/🛰️.proto";
import "🗑️🧥️delete-skin/🛰️.proto";
import "🚚️🧥️move-skin/🛰️.proto";
import "🔀️🧥️reorder-skins/🛰️.proto";

message GltfSkinMutation {
  oneof mutation {
    GltfCreateSkinPayloadV1 create_skin = 1;
    GltfDeleteSkinPayloadV1 delete_skin = 2;
    GltfMoveSkinPayloadV1 move_skin = 3;
    GltfReorderSkinsPayloadV1 reorder_skins = 4;
  }
}
