// move-morph-target-attribute inverse facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfMoveMorphTargetAttributePayloadV1 {
  uint32 mesh = 1;
  uint32 primitive = 2;
  uint32 target = 3;
  string semantic = 4;
  uint32 position = 5;
}
message GltfMoveMorphTargetAttributeInverseV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
