// 💡️ Typed genus glTF inference result.
syntax = "proto3";

package stdio.gltf.inference;

message GltfGenusQualityV1 {
  string method = 1;
  double coverage = 2;
  optional double absolute_error = 3;
  optional double relative_error = 4;
  uint64 sample_count = 5;
  bool watertight = 6;
  bool manifold = 7;
  bool consistently_oriented = 8;
  repeated string warnings = 9;
}

message GltfGenusProvenanceV1 {
  string algorithm = 1;
  uint32 algorithm_version = 2;
  repeated string dependency_fingerprints = 3;
  string coordinate_space = 4;
  string tolerance_fingerprint = 5;
  optional string sampling_seed = 6;
  optional string pose = 7;
}

message GltfGenusInferenceV1 {
  optional uint64 value = 1;
  string unit = 2;
  string availability = 3;
  string validity = 4;
  repeated string diagnostic_ids = 5;
  GltfGenusQualityV1 quality = 6;
  GltfGenusProvenanceV1 provenance = 7;
}
