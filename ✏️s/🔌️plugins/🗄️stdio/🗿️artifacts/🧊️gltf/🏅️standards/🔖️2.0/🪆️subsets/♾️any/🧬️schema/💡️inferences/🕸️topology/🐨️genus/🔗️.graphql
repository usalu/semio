# 💡️ Typed genus glTF inference result.
scalar GltfGenusUInt64V1

type GltfGenusQualityV1 {
  method: String!
  coverage: Float!
  absoluteError: Float
  relativeError: Float
  sampleCount: GltfGenusUInt64V1!
  watertight: Boolean!
  manifold: Boolean!
  consistentlyOriented: Boolean!
  warnings: [String!]!
}

type GltfGenusProvenanceV1 {
  algorithm: String!
  algorithmVersion: Int!
  dependencyFingerprints: [String!]!
  coordinateSpace: String!
  toleranceFingerprint: String!
  samplingSeed: String
  pose: String
}

type GltfGenusInferenceV1 {
  value: GltfGenusUInt64V1
  unit: String!
  availability: String!
  validity: String!
  diagnosticIds: [String!]!
  quality: GltfGenusQualityV1!
  provenance: GltfGenusProvenanceV1!
}
