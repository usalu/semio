# 💡️ Typed flatness glTF inference result.
type GltfFlatnessQualityV1 {
  method: String!
  coverage: Float!
  absoluteError: Float
  relativeError: Float
  sampleCount: Int!
  watertight: Boolean!
  manifold: Boolean!
  consistentlyOriented: Boolean!
  warnings: [String!]!
}

type GltfFlatnessProvenanceV1 {
  algorithm: String!
  algorithmVersion: Int!
  dependencyFingerprints: [String!]!
  coordinateSpace: String!
  toleranceFingerprint: String!
  samplingSeed: String
  pose: String
}

type GltfFlatnessInferenceV1 {
  value: Float
  unit: String!
  availability: String!
  validity: String!
  diagnosticIds: [String!]!
  quality: GltfFlatnessQualityV1!
  provenance: GltfFlatnessProvenanceV1!
}
