syntax = "proto3";
package stdio.gltf.mutation.buffer;
import "🌱️💾️create-buffer/🛰️.proto";
import "🌱️👁️create-buffer-view/🛰️.proto";
import "🗑️💾️delete-buffer/🛰️.proto";
import "🗑️👁️delete-buffer-view/🛰️.proto";
import "🚚️💾️move-buffer/🛰️.proto";
import "🚚️👁️move-buffer-view/🛰️.proto";
import "🔀️👁️reorder-buffer-views/🛰️.proto";
import "🔀️💾️reorder-buffers/🛰️.proto";

message GltfBufferMutation {
  oneof mutation {
    GltfCreateBufferPayloadV1 create_buffer = 1;
    GltfCreateBufferViewPayloadV1 create_buffer_view = 2;
    GltfDeleteBufferPayloadV1 delete_buffer = 3;
    GltfDeleteBufferViewPayloadV1 delete_buffer_view = 4;
    GltfMoveBufferPayloadV1 move_buffer = 5;
    GltfMoveBufferViewPayloadV1 move_buffer_view = 6;
    GltfReorderBufferViewsPayloadV1 reorder_buffer_views = 7;
    GltfReorderBuffersPayloadV1 reorder_buffers = 8;
  }
}
