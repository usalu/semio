// move-scene-root-node mutation facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfMoveSceneRootNodePayloadV1 {
  uint32 scene = 1;
  uint32 node = 2;
  uint32 position = 3;
}
message GltfMoveSceneRootNodeMutationV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
