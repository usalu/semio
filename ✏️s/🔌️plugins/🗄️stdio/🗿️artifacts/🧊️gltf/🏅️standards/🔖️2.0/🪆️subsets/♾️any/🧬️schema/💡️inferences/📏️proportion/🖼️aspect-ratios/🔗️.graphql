# 💡️ Typed aspect-ratios glTF inference result.
type GltfAspectRatiosValueV1 {
  x: Float!
  y: Float!
  z: Float!
}

type GltfAspectRatiosQualityV1 {
  method: String!
  coverage: Float!
  absoluteError: Float
  relativeError: Float
  sampleCount: Int!
  watertight: Boolean!
  manifold: Boolean!
  consistentlyOriented: Boolean!
  warnings: [String!]!
}

type GltfAspectRatiosProvenanceV1 {
  algorithm: String!
  algorithmVersion: Int!
  dependencyFingerprints: [String!]!
  coordinateSpace: String!
  toleranceFingerprint: String!
  samplingSeed: String
  pose: String
}

type GltfAspectRatiosInferenceV1 {
  value: GltfAspectRatiosValueV1
  unit: String!
  availability: String!
  validity: String!
  diagnosticIds: [String!]!
  quality: GltfAspectRatiosQualityV1!
  provenance: GltfAspectRatiosProvenanceV1!
}
