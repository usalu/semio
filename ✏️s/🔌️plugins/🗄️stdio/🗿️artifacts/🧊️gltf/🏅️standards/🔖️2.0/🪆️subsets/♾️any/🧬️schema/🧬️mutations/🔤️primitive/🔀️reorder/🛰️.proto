// reorder-primitive-attributes mutation facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfReorderPrimitiveAttributesPayloadV1 {
  uint32 mesh = 1;
  uint32 primitive = 2;
  repeated string order = 3;
}
message GltfReorderPrimitiveAttributesMutationV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
