// change-mesh-name diff facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfChangeMeshNamePayloadV1 {
  uint32 mesh = 1;
  string value = 2;
}
message GltfChangeMeshNameDiffV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
