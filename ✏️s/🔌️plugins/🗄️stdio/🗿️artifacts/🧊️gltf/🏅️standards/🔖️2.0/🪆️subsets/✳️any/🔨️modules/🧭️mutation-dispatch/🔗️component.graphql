#region 🧭️MutationDispatchContract
# 🧬️ Generic descriptor envelope; command payload validation belongs to the registered leaf.
scalar GltfMutationU32
enum GltfMutationPhase { MUTATION DIFF INVERSE }
type GltfMutation { commandId: String! version: GltfMutationU32! phase: GltfMutationPhase! payload: String! }
type GltfDiffEnvelope { commandId: String! version: GltfMutationU32! phase: GltfMutationPhase! payload: String! touchedPaths: [String!]! }
type GltfMutationRejection { code: String! path: String! detail: String! }
union GltfMutationApplication = GltfMutationAccepted | GltfMutationRejected
type GltfMutationAccepted { accepted: Boolean! snapshot: GltfSnapshot! touchedPaths: [String!]! }
type GltfMutationRejected { accepted: Boolean! rejection: GltfMutationRejection! }
#endregion 🧭️MutationDispatchContract
