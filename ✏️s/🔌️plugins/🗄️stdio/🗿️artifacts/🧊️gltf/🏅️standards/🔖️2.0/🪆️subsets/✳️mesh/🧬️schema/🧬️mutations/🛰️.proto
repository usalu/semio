message GltfMeshMutation {
  oneof mutation {
    GltfBindMorphTargetAttributePayloadV1 bind_morph_target_attribute = 1;
    GltfBindPrimitiveAttributePayloadV1 bind_primitive_attribute = 2;
    GltfBindPrimitiveIndicesPayloadV1 bind_primitive_indices = 3;
    GltfBindPrimitiveMaterialPayloadV1 bind_primitive_material = 4;
    GltfChangeMeshExtensionDataPayloadV1 change_mesh_extension_data = 5;
    GltfChangeMeshExtraDataPayloadV1 change_mesh_extra_data = 6;
    GltfChangeMeshMorphWeightsPayloadV1 change_mesh_morph_weights = 7;
    GltfChangeMeshNamePayloadV1 change_mesh_name = 8;
    GltfChangePrimitiveExtensionDataPayloadV1 change_primitive_extension_data = 9;
    GltfChangePrimitiveExtraDataPayloadV1 change_primitive_extra_data = 10;
    GltfChangePrimitiveTopologyModePayloadV1 change_primitive_topology_mode = 11;
    GltfCreateAccessorPayloadV1 create_accessor = 12;
    GltfCreateMeshPayloadV1 create_mesh = 13;
    GltfCreateMorphTargetPayloadV1 create_morph_target = 14;
    GltfCreatePrimitivePayloadV1 create_primitive = 15;
    GltfDeleteAccessorPayloadV1 delete_accessor = 16;
    GltfDeleteMeshPayloadV1 delete_mesh = 17;
    GltfDeleteMorphTargetPayloadV1 delete_morph_target = 18;
    GltfDeletePrimitivePayloadV1 delete_primitive = 19;
    GltfMoveAccessorPayloadV1 move_accessor = 20;
    GltfMoveMeshPayloadV1 move_mesh = 21;
    GltfMoveMorphTargetPayloadV1 move_morph_target = 22;
    GltfMoveMorphTargetAttributePayloadV1 move_morph_target_attribute = 23;
    GltfMovePrimitivePayloadV1 move_primitive = 24;
    GltfMovePrimitiveAttributePayloadV1 move_primitive_attribute = 25;
    GltfReorderAccessorsPayloadV1 reorder_accessors = 26;
    GltfReorderMeshsPayloadV1 reorder_meshs = 27;
    GltfReorderMorphTargetAttributesPayloadV1 reorder_morph_target_attributes = 28;
    GltfReorderMorphTargetsPayloadV1 reorder_morph_targets = 29;
    GltfReorderPrimitiveAttributesPayloadV1 reorder_primitive_attributes = 30;
    GltfReorderPrimitivesPayloadV1 reorder_primitives = 31;
    GltfUnbindMorphTargetAttributePayloadV1 unbind_morph_target_attribute = 32;
    GltfUnbindPrimitiveAttributePayloadV1 unbind_primitive_attribute = 33;
    GltfUnbindPrimitiveIndicesPayloadV1 unbind_primitive_indices = 34;
    GltfUnbindPrimitiveMaterialPayloadV1 unbind_primitive_material = 35;
