// reorder-morph-targets inverse facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfReorderMorphTargetsPayloadV1 {
  uint32 mesh = 1;
  uint32 primitive = 2;
  repeated uint32 order = 3;
}
message GltfReorderMorphTargetsInverseV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
