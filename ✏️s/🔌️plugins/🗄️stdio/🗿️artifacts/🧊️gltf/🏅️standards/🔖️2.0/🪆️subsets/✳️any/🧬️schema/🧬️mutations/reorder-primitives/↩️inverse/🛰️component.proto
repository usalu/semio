// reorder-primitives inverse facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfReorderPrimitivesPayloadV1 {
  uint32 mesh = 1;
  repeated uint32 order = 2;
}
message GltfReorderPrimitivesInverseV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
