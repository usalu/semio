    GltfBindNodeCameraPayloadV1 bind_node_camera = 2;
    GltfBindNodeChildPayloadV1 bind_node_child = 3;
    GltfBindNodeMeshPayloadV1 bind_node_mesh = 4;
    GltfBindNodeSkinPayloadV1 bind_node_skin = 5;
    GltfBindSceneRootNodePayloadV1 bind_scene_root_node = 6;
