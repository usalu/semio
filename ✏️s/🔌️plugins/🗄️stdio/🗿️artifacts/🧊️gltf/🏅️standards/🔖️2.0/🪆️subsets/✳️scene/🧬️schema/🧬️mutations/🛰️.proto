    GltfChangeSceneExtensionDataPayloadV1 change_scene_extension_data = 11;
    GltfChangeSceneExtraDataPayloadV1 change_scene_extra_data = 12;
    GltfChangeSceneNamePayloadV1 change_scene_name = 13;
    GltfCreateNodePayloadV1 create_node = 14;
    GltfCreateScenePayloadV1 create_scene = 15;
    GltfDeleteNodePayloadV1 delete_node = 16;
    GltfDeleteScenePayloadV1 delete_scene = 17;
    GltfMoveNodePayloadV1 move_node = 18;
    GltfMoveNodeChildPayloadV1 move_node_child = 19;
    GltfMoveScenePayloadV1 move_scene = 20;
    GltfMoveSceneRootNodePayloadV1 move_scene_root_node = 21;
