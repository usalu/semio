    GltfUnbindNodeCameraPayloadV1 unbind_node_camera = 29;
    GltfUnbindNodeChildPayloadV1 unbind_node_child = 30;
    GltfUnbindNodeMeshPayloadV1 unbind_node_mesh = 31;
    GltfUnbindNodeSkinPayloadV1 unbind_node_skin = 32;
    GltfUnbindSceneRootNodePayloadV1 unbind_scene_root_node = 33;
