syntax = "proto3";
package semio.s.stdio.gltf.inference;
// 💡 Universal glTF geometric inference schema.
message GltfInference { GltfGeometricInference geometry = 1; }
enum GltfUnit { UNIT_UNSPECIFIED = 0; UNITLESS = 1; METRE = 2; SQUARE_METRE = 3; CUBIC_METRE = 4; RADIAN = 5; INVERSE_METRE = 6; INVERSE_SQUARE_METRE = 7; }
enum GltfCoordinateSpace { COORDINATE_SPACE_UNSPECIFIED = 0; MESH_LOCAL = 1; NODE_LOCAL = 2; SCENE_WORLD = 3; }
enum GltfAvailability { AVAILABILITY_UNSPECIFIED = 0; AVAILABLE = 1; APPROXIMATE = 2; UNAVAILABLE = 3; INVALID_INPUT = 4; UNSUPPORTED_PRIMITIVE = 5; OPEN_SURFACE = 6; NON_MANIFOLD = 7; DEGENERATE = 8; UNRESOLVED_RESOURCE = 9; }
enum GltfValidity { VALIDITY_UNSPECIFIED = 0; VALID = 1; INVALID = 2; INDETERMINATE = 3; }
enum GltfSeverity { SEVERITY_UNSPECIFIED = 0; INFO = 1; WARNING = 2; ERROR = 3; }
enum GltfComputationMethod { METHOD_UNSPECIFIED = 0; EXACT = 1; DETERMINISTIC_ESTIMATE = 2; }
enum GltfEntityScope { ENTITY_SCOPE_UNSPECIFIED = 0; DOCUMENT = 1; SCENE = 2; NODE_INSTANCE = 3; MESH = 4; PRIMITIVE = 5; COMPONENT = 6; SURFACE_REGION = 7; }
message GltfVec3 { double x = 1; double y = 2; double z = 3; }
message GltfBounds3 { GltfVec3 min = 1; GltfVec3 max = 2; GltfVec3 dimensions = 3; }
message GltfHistogram { repeated double edges = 1; repeated uint64 counts = 2; repeated double weights = 3; }
message GltfStatistics { optional double minimum = 1; optional double maximum = 2; optional double mean = 3; optional double variance = 4; optional double standard_deviation = 5; optional double median = 6; repeated double quantiles = 7; optional GltfHistogram histogram = 8; }
message GltfDirectionScore { GltfVec3 direction = 1; double score = 2; optional uint32 order = 3; }
message GltfPrincipalFrame { GltfVec3 centroid = 1; repeated GltfVec3 axes = 2; repeated double eigenvalues = 3; }
message GltfTensor { repeated double values = 1; }
message GltfDirections { repeated GltfDirectionScore values = 1; }
message GltfQuality { GltfComputationMethod method = 1; double coverage = 2; optional double absolute_error = 3; optional double relative_error = 4; uint64 sample_count = 5; bool watertight = 6; bool manifold = 7; bool consistently_oriented = 8; repeated string warnings = 9; }
message GltfProvenance { string algorithm = 1; uint32 algorithm_version = 2; repeated string dependency_fingerprints = 3; GltfCoordinateSpace coordinate_space = 4; string tolerance_fingerprint = 5; optional string sampling_seed = 6; optional string pose = 7; }
message GltfMeasure { oneof value { double scalar = 1; uint64 count = 2; bool boolean = 3; GltfVec3 vector = 4; GltfBounds3 bounds = 5; GltfStatistics statistics = 6; GltfPrincipalFrame principal_frame = 7; GltfTensor tensor = 8; GltfDirections directions = 9; } GltfUnit unit = 10; GltfAvailability availability = 11; GltfValidity validity = 12; repeated string diagnostic_ids = 13; GltfQuality quality = 14; GltfProvenance provenance = 15; }
message GltfAnalysisPolicy { uint32 schema_version = 1; double absolute_length_tolerance = 2; double relative_tolerance = 3; double angular_tolerance_radians = 4; double contact_tolerance = 5; double sharp_feature_angle_radians = 6; repeated double histogram_edges = 7; uint64 sampling_budget = 8; string sampling_seed = 9; bool static_pose = 10; bool unit_density = 11; string fingerprint = 12; }
message GltfDiagnostic { string id = 1; GltfSeverity severity = 2; string code = 3; string message = 4; repeated string paths = 5; }
message GltfEntityAddress { GltfEntityScope scope = 1; optional uint64 scene = 2; repeated uint64 node_path = 3; optional uint64 mesh = 4; optional uint64 primitive = 5; optional uint64 component = 6; optional uint64 surface_region = 7; string content_fingerprint = 8; }
message GltfSizeIndicators { GltfMeasure overall_size = 1; GltfMeasure axis_aligned_bounds = 2; GltfMeasure oriented_bounds = 3; GltfMeasure bounding_box_dimensions = 4; GltfMeasure characteristic_length = 5; GltfMeasure footprint_area = 6; GltfMeasure projected_area = 7; }
message GltfAreaVolumeIndicators { GltfMeasure surface_area = 1; GltfMeasure total_area = 2; GltfMeasure exposed_area = 3; GltfMeasure contact_area = 4; GltfMeasure volume = 5; GltfMeasure enclosed_volume = 6; GltfMeasure material_volume = 7; GltfMeasure void_volume = 8; }
message GltfCompactnessIndicators { GltfMeasure compactness = 1; GltfMeasure surface_to_volume_ratio = 2; GltfMeasure sphericity = 3; GltfMeasure compactness_index = 4; GltfMeasure hull_fill_ratio = 5; }
message GltfProportionIndicators { GltfMeasure aspect_ratios = 1; GltfMeasure slenderness = 2; GltfMeasure flatness = 3; GltfMeasure elongation = 4; }
message GltfMassIndicators { GltfMeasure centroid = 1; GltfMeasure principal_frame = 2; GltfMeasure principal_axes = 3; GltfMeasure moments_of_inertia = 4; GltfMeasure inertia_tensor = 5; }
message GltfCurvatureIndicators { GltfMeasure mean_curvature = 1; GltfMeasure gaussian_curvature = 2; GltfMeasure curvature_histogram = 3; GltfMeasure sharp_feature_proportion = 4; }
message GltfThicknessIndicators { GltfMeasure mean_thickness = 1; GltfMeasure minimum_thickness = 2; GltfMeasure thickness_variability = 3; GltfMeasure thickness_distribution = 4; }
message GltfConcavityIndicators { GltfMeasure convex_hull_gap = 1; GltfMeasure reentrant_area = 2; GltfMeasure reentrant_volume = 3; GltfMeasure concavity_index = 4; }
message GltfClearanceIndicators { GltfMeasure minimum_distance_to_neighbors = 1; GltfMeasure clearance_distribution = 2; GltfMeasure interference_volume = 3; GltfMeasure overlap_volume = 4; }
message GltfAdjacencyIndicators { GltfMeasure number_of_contacts = 1; GltfMeasure contact_graph_degree = 2; GltfMeasure connected_components = 3; }
message GltfOrientationIndicators { GltfMeasure main_axis_direction = 1; GltfMeasure face_normal_distribution = 2; GltfMeasure orientation_consistency = 3; }
message GltfSymmetryIndicators { GltfMeasure reflection_symmetry_score = 1; GltfMeasure rotational_symmetry_score = 2; GltfMeasure reflection_symmetries = 3; GltfMeasure rotational_symmetries = 4; GltfMeasure repetition_ratio = 5; GltfMeasure modularity_ratio = 6; }
message GltfRoughnessIndicators { GltfMeasure deviation_from_ideal = 1; GltfMeasure deviation_from_smoothed_geometry = 2; GltfMeasure normal_variation = 3; GltfMeasure surface_waviness = 4; GltfMeasure irregularity = 5; }
message GltfTopologyIndicators { GltfMeasure holes = 1; GltfMeasure handles = 2; GltfMeasure boundary_loops = 3; GltfMeasure euler_characteristic = 4; GltfMeasure genus = 5; }
message GltfEntityIndicators { GltfSizeIndicators size = 1; GltfAreaVolumeIndicators area_volume = 2; GltfCompactnessIndicators compactness = 3; GltfProportionIndicators proportion = 4; GltfMassIndicators mass = 5; GltfCurvatureIndicators curvature = 6; GltfThicknessIndicators thickness = 7; GltfConcavityIndicators concavity = 8; GltfClearanceIndicators clearance = 9; GltfAdjacencyIndicators adjacency = 10; GltfOrientationIndicators orientation = 11; GltfSymmetryIndicators symmetry = 12; GltfRoughnessIndicators roughness = 13; GltfTopologyIndicators topology = 14; }
message GltfPartInference { GltfEntityAddress address = 1; optional string name = 2; GltfEntityIndicators indicators = 3; repeated string diagnostic_ids = 4; }
message GltfPairInference { GltfEntityAddress first = 1; GltfEntityAddress second = 2; GltfMeasure minimum_distance = 3; GltfMeasure clearance_distribution = 4; GltfMeasure contact_area = 5; GltfMeasure interference_volume = 6; GltfMeasure overlap_volume = 7; GltfMeasure adjacent = 8; GltfMeasure orientation_consistency = 9; }
message GltfInferenceCounts { uint64 scene_count = 1; uint64 node_instance_count = 2; uint64 mesh_count = 3; uint64 primitive_count = 4; uint64 vertex_count = 5; uint64 triangle_count = 6; uint64 component_count = 7; uint64 surface_region_count = 8; uint64 pair_count = 9; uint64 valid_part_count = 10; uint64 invalid_part_count = 11; }
message GltfGeometricInference { string schema = 1; uint32 schema_version = 2; GltfAnalysisPolicy policy = 3; GltfInferenceCounts counts = 4; GltfEntityIndicators overall = 5; repeated GltfPartInference parts = 6; repeated GltfPairInference pairs = 7; repeated GltfDiagnostic diagnostics = 8; GltfValidity validity = 9; GltfQuality quality = 10; GltfProvenance provenance = 11; }
