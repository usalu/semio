// change-node-name mutation facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfChangeNodeNameOptionalStringV1 { oneof state { string present = 1; bool absent = 2; } }
message GltfChangeNodeNamePayloadV1 { uint32 node = 1; GltfChangeNodeNameOptionalStringV1 value = 2; }
message GltfChangeNodeNameMutationV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
