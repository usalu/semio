// change-primitive-extra-data diff facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfChangePrimitiveExtraDataPayloadV1 {
  uint32 mesh = 1;
  uint32 primitive = 2;
  bytes data = 3;
}
message GltfChangePrimitiveExtraDataDiffV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
