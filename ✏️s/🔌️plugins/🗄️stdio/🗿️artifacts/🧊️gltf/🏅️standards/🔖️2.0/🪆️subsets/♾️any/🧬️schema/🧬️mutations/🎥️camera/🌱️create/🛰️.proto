syntax = "proto3";
package stdio.gltf.mutation;
message GltfCreateCameraPayloadV1 { uint32 position = 1; GltfCameraProjectionV1 projection = 2; GltfCameraRecordV1 camera = 3; }
message GltfCreateCameraMutationV1 { string id = 1; uint32 version = 2; repeated string touched_paths = 3; GltfCreateCameraPayloadV1 payload = 4; }
