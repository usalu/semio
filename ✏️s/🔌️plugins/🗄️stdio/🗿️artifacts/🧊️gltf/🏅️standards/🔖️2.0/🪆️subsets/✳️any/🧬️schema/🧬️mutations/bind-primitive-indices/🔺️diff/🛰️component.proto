// bind-primitive-indices diff facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfBindPrimitiveIndicesPayloadV1 {
  uint32 mesh = 1;
  uint32 primitive = 2;
  uint32 accessor = 3;
}
message GltfBindPrimitiveIndicesDiffV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
