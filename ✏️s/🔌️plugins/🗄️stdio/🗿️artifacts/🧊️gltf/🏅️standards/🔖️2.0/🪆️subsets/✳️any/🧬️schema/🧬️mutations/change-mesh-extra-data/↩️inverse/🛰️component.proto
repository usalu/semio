// change-mesh-extra-data inverse facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfChangeMeshExtraDataPayloadV1 {
  uint32 mesh = 1;
  bytes data = 2;
}
message GltfChangeMeshExtraDataInverseV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
