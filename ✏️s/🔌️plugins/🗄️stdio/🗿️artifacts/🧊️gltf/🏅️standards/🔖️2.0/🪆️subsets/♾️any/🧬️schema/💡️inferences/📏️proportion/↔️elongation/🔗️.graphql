# 💡️ Typed elongation glTF inference result.
type GltfElongationQualityV1 {
  method: String!
  coverage: Float!
  absoluteError: Float
  relativeError: Float
  sampleCount: Int!
  watertight: Boolean!
  manifold: Boolean!
  consistentlyOriented: Boolean!
  warnings: [String!]!
}

type GltfElongationProvenanceV1 {
  algorithm: String!
  algorithmVersion: Int!
  dependencyFingerprints: [String!]!
  coordinateSpace: String!
  toleranceFingerprint: String!
  samplingSeed: String
  pose: String
}

type GltfElongationInferenceV1 {
  value: Float
  unit: String!
  availability: String!
  validity: String!
  diagnosticIds: [String!]!
  quality: GltfElongationQualityV1!
  provenance: GltfElongationProvenanceV1!
}
