// bind-primitive-attribute inverse facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfBindPrimitiveAttributePayloadV1 {
  uint32 mesh = 1;
  uint32 primitive = 2;
  string semantic = 3;
  uint32 accessor = 4;
}
message GltfBindPrimitiveAttributeInverseV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
