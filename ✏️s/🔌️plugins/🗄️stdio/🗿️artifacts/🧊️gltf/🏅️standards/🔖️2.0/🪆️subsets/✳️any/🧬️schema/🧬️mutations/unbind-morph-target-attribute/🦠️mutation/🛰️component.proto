// unbind-morph-target-attribute mutation facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfUnbindMorphTargetAttributePayloadV1 {
  uint32 mesh = 1;
  uint32 primitive = 2;
  uint32 target = 3;
  string semantic = 4;
}
message GltfUnbindMorphTargetAttributeMutationV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
