// 💡️ glTF inference DAG assembly binary facet.
syntax = "proto3";

package stdio.gltf.inference;

message GltfInferenceLeafReferenceV1 {
  string id = 1;
  uint32 algorithm_version = 2;
  string cache_key = 3;
}

message GltfInferenceDagV1 {
  repeated GltfInferenceLeafReferenceV1 leaves = 1;
}
message GltfOverallSizeQualityV1 { string method = 1; double coverage = 2; uint64 sample_count = 3; optional bool watertight = 4; optional bool manifold = 5; optional bool consistently_oriented = 6; }
message GltfOverallSizeProvenanceV1 { string algorithm = 1; uint32 algorithm_version = 2; string tolerance_fingerprint = 3; optional string sampling_seed = 4; }
message GltfOverallSizeMeasureV1 { optional double value = 1; string unit = 2; string availability = 3; string validity = 4; repeated string diagnostic_ids = 5; GltfOverallSizeQualityV1 quality = 6; GltfOverallSizeProvenanceV1 provenance = 7; }
message GltfInferenceBoundsVec3V1 { double x = 1; double y = 2; double z = 3; }
message GltfInferenceBounds3V1 { GltfInferenceBoundsVec3V1 min = 1; GltfInferenceBoundsVec3V1 max = 2; GltfInferenceBoundsVec3V1 dimensions = 3; }
message GltfAxisAlignedBoundsMeasureV1 { GltfInferenceBounds3V1 value = 1; string unit = 2; string availability = 3; string validity = 4; repeated string diagnostic_ids = 5; GltfOverallSizeQualityV1 quality = 6; GltfOverallSizeProvenanceV1 provenance = 7; }
message GltfSizeInferenceV1 { GltfOverallSizeMeasureV1 overall_size = 1; GltfAxisAlignedBoundsMeasureV1 axis_aligned_bounds = 2; }
message GltfGeometryInferenceV1 { GltfSizeInferenceV1 size = 1; }
message GltfInference { GltfGeometryInferenceV1 geometry = 1; }
