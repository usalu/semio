// unbind-scene-root-node mutation facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfUnbindSceneRootNodePayloadV1 {
  uint32 scene = 1;
  uint32 node = 2;
}
message GltfUnbindSceneRootNodeMutationV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
