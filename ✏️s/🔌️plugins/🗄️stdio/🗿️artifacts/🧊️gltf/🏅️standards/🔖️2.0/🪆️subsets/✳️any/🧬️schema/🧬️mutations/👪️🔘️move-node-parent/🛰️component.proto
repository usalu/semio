// move-node-parent mutation facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfReparentNodePayloadV1 {
  uint32 parent = 1;
  uint32 child = 2;
  uint32 position = 3;
}
message GltfReparentNodeMutationV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
