# 📨 Canonical text I/O envelope for one glTF inference leaf.
scalar JSON

type GltfInferenceLeafEnvelope {
  id: String!
  algorithmVersion: Int!
  policyHash: String!
  dependencyHashes: [String!]!
  cacheKey: String!
  validity: String!
  quality: String!
  diagnosticIds: [String!]!
  provenance: [String!]!
  value: JSON!
}

type GltfInferenceTextDocument {
  schema: String!
  version: Int!
  payloadLength: Int!
  checksum: String!
  value: GltfInferenceLeafEnvelope!
}
