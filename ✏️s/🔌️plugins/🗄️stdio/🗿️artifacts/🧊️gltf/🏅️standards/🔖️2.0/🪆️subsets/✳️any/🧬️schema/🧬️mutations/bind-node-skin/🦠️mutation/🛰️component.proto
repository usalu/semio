// bind-node-skin mutation facet.
syntax = "proto3";
package stdio.gltf.mutation;
message GltfBindNodeSkinPayloadV1 {
  uint32 node = 1;
  uint32 skin = 2;
}
message GltfBindNodeSkinMutationV1 { string id = 1; uint32 version = 2; bool accepted = 3; repeated string touched_paths = 4; string rejection_code = 5; }
