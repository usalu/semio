syntax = "proto3";
package semio.s_stdio_pdf.snapshot;

// 📄️ One resolved page: its /MediaBox extent and its shown text.
message PageDoc {
  double width = 1;
  double height = 2;
  string text = 3;
}

// 📸️ The document's page tree, walked flat, in reading order.
message PdfSnapshot {
  string schema = 1;
  repeated PageDoc pages = 2;
}
