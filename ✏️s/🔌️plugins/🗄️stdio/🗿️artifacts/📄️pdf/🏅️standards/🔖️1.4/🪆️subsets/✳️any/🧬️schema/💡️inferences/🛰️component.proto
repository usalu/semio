syntax = "proto3";
package semio.s.stdio.pdf.inference;

// 💡️ Pdf (1.4) inference schema — document outline (page count, word/char counts).

message PdfInference {
  // @derived
  PdfOutline outline = 1;
}

message PdfOutline {
  uint32 page_count = 1;
  uint32 word_count = 2;
  uint32 char_count = 3;
}
