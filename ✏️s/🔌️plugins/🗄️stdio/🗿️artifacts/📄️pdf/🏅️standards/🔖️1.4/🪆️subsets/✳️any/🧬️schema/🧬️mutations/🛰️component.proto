syntax = "proto3";
package semio.stdio.pdf.v1_4.mutations;
import "📥️insert-page/🛰️component.proto";
import "🗑️remove-page/🛰️component.proto";
import "🔀️move-page/🛰️component.proto";
import "📐️resize-page/🛰️component.proto";
import "📝️replace-page-text/🛰️component.proto";

// 🧬️ Exactly one direct PDF 1.4 operation.
message PdfMutation {
  oneof mutation {
    InsertPage insert_page = 1;
    RemovePage remove_page = 2;
    MovePage move_page = 3;
    ResizePage resize_page = 4;
    ReplacePageText replace_page_text = 5;
  }
}
