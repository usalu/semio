syntax = "proto3";
package semio.s_stdio_pdf_1_7.diff;

import "s_stdio_pdf_1_7_snapshot.proto"; // ObjRef, PdfObject, PdfInfo, PdfPage

message PdfPageDiff {
  repeated double media_box = 1; // empty = unchanged
  repeated double crop_box = 2;  // empty + has_crop_box=false = unchanged; empty + true = cleared
  bool has_crop_box = 3;
  optional int32 rotate = 4;
  optional string text = 5;
}

message PdfPageModified {
  uint64 index = 1;
  PdfPageDiff diff = 2;
}
message PdfPageAdded {
  uint64 index = 1;
  semio.s_stdio_pdf_1_7.snapshot.PdfPage page = 2;
}
message PdfPagesDiff {
  repeated uint64 removed = 1;
  repeated PdfPageModified modified = 2;
  repeated PdfPageAdded added = 3;
}

message PdfDictModified {
  string key = 1;
  PdfValueDiff diff = 2;
}
message PdfDictAdded {
  uint64 index = 1;
  string key = 2;
  semio.s_stdio_pdf_1_7.snapshot.PdfObject item = 3;
}
// Name-keyed Dict/Stream.dict/trailer triple -- reused verbatim for PdfDiff.trailer.
message PdfDictDiff {
  repeated string removed = 1;
  repeated PdfDictModified modified = 2;
  repeated PdfDictAdded added = 3;
}

message PdfArrayModified {
  uint64 index = 1;
  PdfValueDiff diff = 2;
}
message PdfArrayAdded {
  uint64 index = 1;
  semio.s_stdio_pdf_1_7.snapshot.PdfObject item = 2;
}
message PdfArrayDiff {
  repeated uint64 removed = 1;
  repeated PdfArrayModified modified = 2;
  repeated PdfArrayAdded added = 3;
}

// Recursive diff mirroring PdfObject's shape. REPLACE is the fallback for a node-KIND change.
message PdfValueDiff {
  enum Kind {
    REPLACE = 0;
    BOOL = 1;
    INT = 2;
    REAL = 3;
    STR = 4;
    NAME = 5;
    REF = 6;
    ARRAY = 7;
    DICT = 8;
    STREAM = 9;
  }
  Kind kind = 1;
  semio.s_stdio_pdf_1_7.snapshot.PdfObject replace_value = 2;
  bool bool_value = 3;
  int64 int_value = 4;
  double real_value = 5;
  bytes str_value = 6;
  string name_value = 7;
  semio.s_stdio_pdf_1_7.snapshot.ObjRef ref_value = 8;
  PdfArrayDiff array_diff = 9;
  PdfDictDiff dict_diff = 10;
  PdfDictDiff stream_dict = 11;
  bytes stream_data = 12;
  bool stream_has_raw_filter = 13;
  optional string stream_raw_filter = 14;
}

message PdfObjectModified {
  semio.s_stdio_pdf_1_7.snapshot.ObjRef id = 1;
  PdfValueDiff diff = 2;
}
message PdfObjectAdded {
  uint64 index = 1;
  semio.s_stdio_pdf_1_7.snapshot.ObjRef id = 2;
  semio.s_stdio_pdf_1_7.snapshot.PdfObject value = 3;
}
// (id,gen)-keyed objects triple.
message PdfObjectsDiff {
  repeated semio.s_stdio_pdf_1_7.snapshot.ObjRef removed = 1;
  repeated PdfObjectModified modified = 2;
  repeated PdfObjectAdded added = 3;
}

message PdfPathSegment {
  enum Kind {
    ARRAY_INDEX = 0;
    DICT_KEY = 1;
  }
  Kind kind = 1;
  uint64 index = 2;
  string key = 3;
}

message PdfDiff {
  optional string declared_version = 1;
  semio.s_stdio_pdf_1_7.snapshot.PdfInfo info = 2;
  PdfPagesDiff pages = 3;
  PdfObjectsDiff objects = 4;
  PdfDictDiff trailer = 5;
}
