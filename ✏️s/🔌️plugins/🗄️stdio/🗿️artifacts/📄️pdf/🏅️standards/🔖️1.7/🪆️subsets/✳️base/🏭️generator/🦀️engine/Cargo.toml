# 🧭️ Own workspace root: linked by `../📜️script.ts` (`cargo run --manifest-path`), never joins the
# repository's root workspace, whose root manifest is a shared, contended file.
#
# Builds this subset's `third-party-generated` fixtures with the SAME registered reference crate
# (`lopdf` 0.44) named in `../../🔣️oracle.json`'s `lopdf-pdf-1-7-mutate` oracle — never with this
# repository's own `encode_pdf`. See `../📜️script.ts` for the generation contract.
[workspace]

[package]
name = "pdf-1-7-base-fixture-generator"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "src/main.rs"

[dependencies]
lopdf = "0.44"
