# 🔺️ PdfDiff (1.7) — handcrafted sparse diff (see ../📸️snapshot/🔗️component.graphql for
# ObjRef/PdfObject/PdfInfo/PdfPage). No `snapshot` full-replace slot anywhere.

type PdfPageDiff {
  mediaBox: [Float!]
  cropBox: [Float!]
  hasCropBox: Boolean!
  rotate: Int
  text: String
}

type PdfPageModified {
  index: Int!
  diff: PdfPageDiff!
}
type PdfPageAdded {
  index: Int!
  page: PdfPage!
}
type PdfPagesDiff {
  removed: [Int!]
  modified: [PdfPageModified!]
  added: [PdfPageAdded!]
}

type PdfDictModified {
  key: String!
  diff: PdfValueDiff!
}
type PdfDictAdded {
  index: Int!
  key: String!
  item: PdfObject!
}
"Name-keyed Dict/Stream.dict/trailer triple -- reused verbatim for PdfDiff.trailer."
type PdfDictDiff {
  removed: [String!]
  modified: [PdfDictModified!]
  added: [PdfDictAdded!]
}

type PdfArrayModified {
  index: Int!
  diff: PdfValueDiff!
}
type PdfArrayAdded {
  index: Int!
  item: PdfObject!
}
type PdfArrayDiff {
  removed: [Int!]
  modified: [PdfArrayModified!]
  added: [PdfArrayAdded!]
}

"Recursive diff mirroring PdfObject's shape. REPLACE is the fallback for a node-KIND change."
type PdfValueDiff {
  kind: PdfValueDiffKind!
  replaceValue: PdfObject
  boolValue: Boolean
  intValue: Int
  realValue: Float
  strValue: [Int!]
  nameValue: String
  refValue: ObjRef
  arrayDiff: PdfArrayDiff
  dictDiff: PdfDictDiff
  streamDict: PdfDictDiff
  streamData: [Int!]
  streamRawFilter: String
  streamHasRawFilter: Boolean!
}

enum PdfValueDiffKind {
  REPLACE
  BOOL
  INT
  REAL
  STR
  NAME
  REF
  ARRAY
  DICT
  STREAM
}

type PdfObjectModified {
  id: ObjRef!
  diff: PdfValueDiff!
}
type PdfObjectAdded {
  index: Int!
  id: ObjRef!
  value: PdfObject!
}
"(id,gen)-keyed objects triple."
type PdfObjectsDiff {
  removed: [ObjRef!]
  modified: [PdfObjectModified!]
  added: [PdfObjectAdded!]
}

"One step of a NodePath-style address into ONE object's PdfObject tree."
type PdfPathSegment {
  kind: PdfPathSegmentKind!
  index: Int
  key: String
}

enum PdfPathSegmentKind {
  ARRAY_INDEX
  DICT_KEY
}

type PdfDiff {
  declaredVersion: String @state(class: PERSISTENT)
  info: PdfInfo @state(class: PERSISTENT)
  pages: PdfPagesDiff @state(class: PERSISTENT)
  objects: PdfObjectsDiff @state(class: PERSISTENT)
  trailer: PdfDictDiff @state(class: PERSISTENT)
}
