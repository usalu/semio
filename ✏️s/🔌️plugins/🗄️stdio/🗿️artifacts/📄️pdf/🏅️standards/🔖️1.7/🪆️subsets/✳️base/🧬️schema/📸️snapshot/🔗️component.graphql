# 🧬️ PdfSnapshot (1.7) schema — real object-graph model.

type ObjRef {
  num: Int!
  gen: Int!
}

type PdfDictEntry {
  key: String!
  value: PdfObject!
}

type PdfDecimal {
  negative: Boolean!
  coefficient: String!
  scale: Int!
}

type PdfPredictor { predictor: Int! colors: Int! bitsPerComponent: Int! columns: Int! }
type PdfStreamFilter { kind: PdfStreamFilterKind! predictor: PdfPredictor }
enum PdfStreamFilterKind { FLATE ASCII_HEX ASCII_85 RUN_LENGTH }

"""ISO 32000-1 §7.3 COS object grammar, including streams. Exactly the kind-specific field(s)
matching `kind` are populated. `str` is a byte string (not necessarily UTF-8)."""
type PdfObject {
  kind: PdfObjectKind!
  boolValue: Boolean
  intValue: Int
  realValue: PdfDecimal
  strValue: [Int!]
  nameValue: String
  arrayValue: [PdfObject!]
  dictValue: [PdfDictEntry!]
  refValue: ObjRef
  streamDict: [PdfDictEntry!]
  streamData: [Int!]
  streamFilters: [PdfStreamFilter!]
}

enum PdfObjectKind {
  NULL
  BOOL
  INT
  REAL
  STR
  NAME
  ARRAY
  DICT
  REF
  STREAM
}

type PdfIndirectObject {
  id: ObjRef!
  value: PdfObject!
}

type PdfPage {
  mediaBox: [Float!]!
  cropBox: [Float!]
  rotate: Int!
  text: String!
}

type PdfInfo {
  title: String
  author: String
  subject: String
  keywords: String
  creator: String
  producer: String
}

type PdfSnapshot {
  schema: String! @state(class: ARTIFACT)
  declaredVersion: String! @state(class: ARTIFACT)
  pages: [PdfPage!]! @state(class: ARTIFACT)
  info: PdfInfo! @state(class: ARTIFACT)
  objects: [PdfIndirectObject!]! @state(class: ARTIFACT)
  trailer: [PdfDictEntry!]! @state(class: ARTIFACT)
}
