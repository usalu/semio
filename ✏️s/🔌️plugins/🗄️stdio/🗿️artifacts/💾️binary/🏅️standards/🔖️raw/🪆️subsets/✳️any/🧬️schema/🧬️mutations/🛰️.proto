syntax = "proto3";
package semio.s_stdio_binary.mutation;

import "s_stdio_binary/snapshot.proto";

enum BinaryMutationKind {
  SET_SNAPSHOT = 0;
  SPLICE = 2;
  APPEND_BYTES = 3;
  TRUNCATE_AT = 4;
}

message BinaryMutation {
  BinaryMutationKind mutation = 1;
  semio.s_stdio_binary.snapshot.BinarySnapshot snapshot = 2;
  uint64 offset = 3;
  uint64 remove_len = 4;
  bytes insert = 5;
  bytes data = 6;
}
