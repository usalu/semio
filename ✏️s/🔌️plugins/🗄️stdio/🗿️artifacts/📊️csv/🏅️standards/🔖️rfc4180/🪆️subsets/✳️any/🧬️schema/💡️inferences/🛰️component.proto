syntax = "proto3";
package semio.s.stdio.csv.inference;

// 💡️ Csv inference schema — document outline (record/column counts + hasHeader).

message CsvInference {
  // @state inferred
  CsvOutline outline = 1;
}

message CsvOutline {
  uint32 record_count = 1;
  uint32 column_count = 2;
  bool has_header = 3;
}
