# 🧬️ TsvArtifact schema facet — full artifact state, mirrors TsvSnapshot field-for-field.

enum TsvArtifactLineEnding { LF CRLF }
type TsvArtifactRow { fields: [String!]! }

type TsvArtifact {
  schema: String!
  records: [TsvArtifactRow!]!
  trailingNewline: Boolean!
  lineEnding: TsvArtifactLineEnding!
}
