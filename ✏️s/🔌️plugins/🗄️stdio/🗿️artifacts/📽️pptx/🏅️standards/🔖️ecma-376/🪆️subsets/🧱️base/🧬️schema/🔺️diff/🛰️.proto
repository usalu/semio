syntax = "proto3";
package semio.s_stdio_pptx.diff;
message PptxXmlPartsReplacement { repeated semio.s_stdio_pptx.snapshot.PptxXmlPart parts = 1; }
message PptxDiff {
  optional string schema = 1;
  optional semio.s_stdio_pptx.snapshot.OpcPackage opc = 2;
  optional PptxXmlPartsReplacement xml_parts = 3;
}
