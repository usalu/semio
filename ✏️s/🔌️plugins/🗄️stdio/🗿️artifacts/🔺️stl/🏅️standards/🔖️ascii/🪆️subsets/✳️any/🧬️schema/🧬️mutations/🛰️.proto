syntax = "proto3";
package semio.s_stdio_stl.mutation;

message StlTriangle {
  repeated double normal = 1;
  repeated double vertex0 = 2;
  repeated double vertex1 = 3;
  repeated double vertex2 = 4;
}

message StlSnapshot {
  string schema = 1;
  string solid_name = 2;
  repeated StlTriangle triangles = 3;
}

message SetSnapshot { StlSnapshot snapshot = 1; }
message SetSolidName { string name = 1; }
message InsertTriangle { uint64 index = 1; StlTriangle triangle = 2; }
message RemoveTriangle { uint64 index = 1; }
message SetTriangleNormal { uint64 index = 1; repeated double normal = 2; }
message SetTriangleVertices { uint64 index = 1; repeated double vertex0 = 2; repeated double vertex1 = 3; repeated double vertex2 = 4; }

message StlMutation {
  oneof op {
    SetSnapshot set_snapshot = 2;
    SetSolidName set_solid_name = 3;
    InsertTriangle insert_triangle = 4;
    RemoveTriangle remove_triangle = 5;
    SetTriangleNormal set_triangle_normal = 6;
    SetTriangleVertices set_triangle_vertices = 7;
  }
}
