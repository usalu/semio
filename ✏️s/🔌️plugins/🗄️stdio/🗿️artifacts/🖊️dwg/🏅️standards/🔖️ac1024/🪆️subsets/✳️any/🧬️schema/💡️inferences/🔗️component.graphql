# 💡️ Dwg (ac1024) inference schema — structural byte/section/page statistics over the real D1/D2 section-page decode.

type DwgInference {
  structure: DwgStructure! @derived
}

type DwgStructure {
  byteCount: Int!
  sectionCount: Int!
  pageCount: Int!
  decodedPageCount: Int!
  errorPageCount: Int!
  declaredTotalSize: Float!
  codepage: Int!
  version: String!
}
