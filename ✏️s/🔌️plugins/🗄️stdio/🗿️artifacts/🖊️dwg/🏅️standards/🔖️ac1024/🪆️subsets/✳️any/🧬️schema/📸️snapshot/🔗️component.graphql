type DwgLogicalGeometry { kind: String!, values: [Float!]!, indices: [Int!]!, text: String!, closed: Boolean! }
type DwgLogicalLayer { name: String!, color: Int! }
type DwgLogicalEntity { layer: Int!, color: Int!, geometry: DwgLogicalGeometry! }
type DwgLogicalDrawing { layers: [DwgLogicalLayer!]!, entities: [DwgLogicalEntity!]!, extmin: [Float!]!, extmax: [Float!]! }
type DwgSnapshot { schema: String!, version: String!, maintenanceVersion: Int!, codepage: Int!, drawing: DwgLogicalDrawing!, sectionNames: [String!]!, decodeStatus: String! }
