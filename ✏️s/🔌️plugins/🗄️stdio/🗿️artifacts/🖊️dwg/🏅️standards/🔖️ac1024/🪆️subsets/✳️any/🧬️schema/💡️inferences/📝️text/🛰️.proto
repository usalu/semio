syntax = "proto3";
package semio.s.stdio.dwg.ac1024.inference_text;
message DwgInferenceText {
  string schema = 1;
  DwgStructureText structure = 2;
}
message DwgStructureText {
  uint64 layer_count = 1;
  uint64 entity_count = 2;
  uint64 geometry_value_count = 3;
  uint64 geometry_index_count = 4;
  uint64 text_character_count = 5;
  uint64 codepage = 6;
  string version = 7;
}
