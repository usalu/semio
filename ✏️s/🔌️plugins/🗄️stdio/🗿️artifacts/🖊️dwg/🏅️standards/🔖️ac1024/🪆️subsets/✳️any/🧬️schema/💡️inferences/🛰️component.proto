syntax = "proto3";
package semio.s.stdio.dwg.ac1024.inference;

// 💡️ Dwg (ac1024) inference schema — structural byte/section/page statistics over the real D1/D2 section-page decode.

message DwgInference {
  // @derived
  DwgStructure structure = 1;
}

message DwgStructure {
  uint32 byte_count = 1;
  uint32 section_count = 2;
  uint32 page_count = 3;
  uint32 decoded_page_count = 4;
  uint32 error_page_count = 5;
  uint64 declared_total_size = 6;
  uint32 codepage = 7;
  string version = 8;
}
