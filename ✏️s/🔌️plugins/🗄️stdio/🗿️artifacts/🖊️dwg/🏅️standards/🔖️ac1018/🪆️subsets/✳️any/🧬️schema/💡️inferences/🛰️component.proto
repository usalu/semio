syntax = "proto3";
package semio.s.stdio.dwg.ac1018.inference;

// 💡️ Dwg (ac1018) inference schema — structural byte/section statistics over the undecoded raw payload.

message DwgInference {
  // @state inferred
  DwgStructure structure = 1;
}

message DwgStructure {
  uint32 byte_count = 1;
  uint32 section_count = 2;
  uint32 codepage = 3;
  string version = 4;
}
