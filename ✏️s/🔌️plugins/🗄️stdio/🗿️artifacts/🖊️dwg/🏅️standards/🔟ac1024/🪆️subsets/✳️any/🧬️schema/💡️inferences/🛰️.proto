syntax = "proto3";
package semio.s.stdio.dwg.ac1024.inference;

// 💡️ Dwg (ac1024) inference schema over logical drawing concepts.

message DwgInference {
  // @derived
  DwgStructure structure = 1;
}

message DwgStructure {
  uint32 layer_count = 1;
  uint32 entity_count = 2;
  uint32 geometry_value_count = 3;
  uint32 geometry_index_count = 4;
  uint32 text_character_count = 5;
  uint32 codepage = 6;
  string version = 7;
}
