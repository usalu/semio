type WavArtifactFmt { audioFormat: Int!, channels: Int!, sampleRate: Int!, byteRate: Int!, blockAlign: Int!, bitsPerSample: Int!, ext: [Int!] }
type WavArtifactData { kind: String!, value: [Float!]! }
type WavArtifactRiffChunk { fourcc: String!, data: [Int!]!, padByte: Int }
type WavArtifactChunkRef { kind: String!, value: Int }
type WavArtifact {
  schema: String! @state(class: ARTIFACT)
  fmt: WavArtifactFmt! @state(class: ARTIFACT)
  data: WavArtifactData! @state(class: ARTIFACT)
  fmtPadByte: Int @state(class: ARTIFACT)
  dataPadByte: Int @state(class: ARTIFACT)
  otherChunks: [WavArtifactRiffChunk!]! @state(class: ARTIFACT)
  chunkOrder: [WavArtifactChunkRef!]! @state(class: ARTIFACT)
}
