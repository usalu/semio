type WavFmt { audioFormat: Int!, channels: Int!, sampleRate: Int!, byteRate: Int!, blockAlign: Int!, bitsPerSample: Int!, ext: [Int!] }
type WavData { kind: String!, value: [Float!]! }
type RiffChunk { fourcc: String!, data: [Int!]!, padByte: Int }
type WavChunkRef { kind: String!, value: Int }
type WavSnapshot {
  schema: String! @state(class: ARTIFACT)
  fmt: WavFmt! @state(class: ARTIFACT)
  data: WavData! @state(class: ARTIFACT)
  fmtPadByte: Int @state(class: ARTIFACT)
  dataPadByte: Int @state(class: ARTIFACT)
  otherChunks: [RiffChunk!]! @state(class: ARTIFACT)
  chunkOrder: [WavChunkRef!]! @state(class: ARTIFACT)
}
