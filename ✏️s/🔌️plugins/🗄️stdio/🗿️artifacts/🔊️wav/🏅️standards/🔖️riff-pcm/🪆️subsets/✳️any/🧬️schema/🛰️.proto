syntax = "proto3";
package semio.s_stdio_wav.artifact;
message WavArtifactFmt { uint32 audio_format = 1; uint32 channels = 2; uint32 sample_rate = 3; uint32 byte_rate = 4; uint32 block_align = 5; uint32 bits_per_sample = 6; bytes ext = 7; }
message WavArtifactData { string kind = 1; repeated double value = 2; }
message WavArtifactRiffChunk { string fourcc = 1; bytes data = 2; uint32 pad_byte = 3; }
message WavArtifactChunkRef { string kind = 1; uint64 value = 2; }
message WavArtifact {
  string schema = 1;
  WavArtifactFmt fmt = 2;
  WavArtifactData data = 3;
  uint32 fmt_pad_byte = 4;
  uint32 data_pad_byte = 5;
  repeated WavArtifactRiffChunk other_chunks = 6;
  repeated WavArtifactChunkRef chunk_order = 7;
}
