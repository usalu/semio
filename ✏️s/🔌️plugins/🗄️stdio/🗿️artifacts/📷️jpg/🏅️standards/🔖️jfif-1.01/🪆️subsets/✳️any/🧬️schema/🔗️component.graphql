"""🧬️ JpgArtifact schema — reduced UI-editable view: identity + the raster the user is directly
manipulating."""
type JpgArtifact {
  schema: String! @state(class: PERSISTENT)
  width: Int! @state(class: PERSISTENT)
  height: Int! @state(class: PERSISTENT)
  pixels: [Int!]! @state(class: PERSISTENT)
}
