syntax = "proto3";
package semio.s.stdio.jpg.inference;

// 💡️ Jpg inference schema — canonical raster geometry.

message JpgInference {
  // @state inferred
  JpgDimensions dimensions = 1;
}

message JpgDimensions {
  uint32 width = 1;
  uint32 height = 2;
  uint32 bit_depth = 3;
  bool has_alpha = 4;
  uint64 pixel_count = 5;
}
