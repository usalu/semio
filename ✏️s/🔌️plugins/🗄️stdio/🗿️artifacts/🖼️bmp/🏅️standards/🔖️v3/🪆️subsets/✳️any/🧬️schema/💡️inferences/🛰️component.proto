syntax = "proto3";
package semio.s.stdio.bmp.inference;

// 💡️ Bmp inference schema — BITMAPINFOHEADER-derived raster geometry.

message BmpInference {
  // @derived
  BmpDimensions dimensions = 1;
}

message BmpDimensions {
  uint32 width = 1;
  uint32 height = 2;
  uint32 bit_depth = 3;
  bool has_alpha = 4;
  uint64 pixel_count = 5;
}
