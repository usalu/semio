syntax = "proto3";
package semio.stdio.editing;
import "../../../../../../../🧰️framework/🔨️modules/🌱️value/🧬️schema/🛰️.proto";
message PatchSet { string path = 1; semio.framework.value.DslValue value = 2; }
message PatchInsert { string path = 1; semio.framework.value.DslValue value = 2; optional uint64 index = 3; }
message PatchRemove { string path = 1; }
message PatchMove { string from = 1; string path = 2; optional uint64 index = 3; }
message PatchRename { string path = 1; string key = 2; }
message PatchSplice { string path = 1; uint64 offset = 2; uint64 remove = 3; semio.framework.value.DslValue value = 4; bool continued = 5; }
message SnapshotPatch { oneof operation { PatchSet set = 1; PatchInsert insert = 2; PatchRemove remove = 3; PatchMove move = 4; PatchRename rename = 5; PatchSplice splice = 6; } }
