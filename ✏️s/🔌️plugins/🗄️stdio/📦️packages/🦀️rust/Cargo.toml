[package]
name = "semio-s-plugin-stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio plugin - zero-app library of well-known file-format artifacts"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio"

[package.metadata.semio]
role = "plugin"

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

# 🔌️ Only the ROOT plugin of a component may emit `plugin_exports!`'s `#[no_mangle]` installer
# symbols. stdio is unusual: it is a plugin in its own right AND an rlib dependency of other plugins
# (space's `🚪️io` deserializers). When a dependent links it, both crates emitted
# `semio_plugin_install_bundle`/`semio_plugin_bundle_installer_link_shim` and rust-lld failed with
# `duplicate symbol` — i.e. no plugin could depend on another. Dependents therefore take stdio with
# `default-features = false`; only its own component build keeps `plugin-root`.
[features]
default = ["plugin-root"]
plugin-root = []

[dependencies]
semio-framework-ui-contract = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-3d = { path = "../../../../../🧰️framework/🔨️modules/🧊️3d/📦️packages/🦀️rust", package = "semio-framework-3d" }
semio-framework-geometry = { path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
semio-framework-graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-hash = { path = "../../../../../🧰️framework/🔨️modules/🔢️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-job = { workspace = true }
semio-framework-math = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/📦️packages/🦀️rust", package = "semio-framework-math" }
semio-framework-mesh-engine = { path = "../../../../../🧰️framework/🔨️modules/🔺️mesh-engine/📦️packages/🦀️rust", package = "semio-framework-mesh-engine" }
semio-framework-number = { path = "../../../../../🧰️framework/🔨️modules/🔢️number/📦️packages/🦀️rust", package = "semio-framework-number" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
pack = { path = "../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
# 🚧️ INTERIM, not final: conversion to `ToValue`/`FromValue` is IN PROGRESS across this crate (see
# `.🧬semio/🦑️repo/🎫️tickets/🎆️26/🌙️09/☀️01/RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS/
# 🔍️research/📓️serde-fanout-stdio-trinity-space.md`) — most `#[derive(Serialize, Deserialize)]` +
# `#[serde(...)]` call sites are converted, but real `serde_json::` call sites and a handful of
# `#[serde(flatten/transparent/bound/alias/serialize_with/deserialize_with)]` structs still need
# these. Matches the sanctioned pilot pattern (`📖️playbook`'s manifest keeps them mid-conversion
# too) — do NOT remove until the research doc's remaining-file list is empty.
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
semio-framework-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }

[[bench]]
name = "brep_kernel"
path = "benches/brep_kernel.rs"
harness = false
