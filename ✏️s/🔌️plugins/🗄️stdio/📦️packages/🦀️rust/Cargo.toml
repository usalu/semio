[package]
name = "semio-s-plugin-stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio plugin composition over independently compiled artifact packages"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio"

[package.metadata.semio]
role = "plugin"

# 🎮️ Each editor subset owns a playground; its viewer is reached by the editor/viewer switch.
# Markdown retains 6110/6210 and the original document launchers retain 6211–6218/6311–6318.
# The remaining artifact subsets use 6400–6478 for React and 6500–6578 for WGPU.
[[package.metadata.semio.playground]]
variant = "stdio"
app = "s.stdio.md@commonmark/*#editor"
aliases = ["stdio markdown"]
ports = { react = 6110, wgpu = 6210 }

[[package.metadata.semio.playground]]
variant = "stdio-txt"
app = "s.stdio.txt@utf-8/*#editor"
