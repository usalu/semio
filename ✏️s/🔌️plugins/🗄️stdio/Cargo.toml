[profile.wasm-dev]
inherits = "dev"
codegen-units = 1
incremental = false

[profile.wasm-dev.package.semio-framework-os-flow]
opt-level = 2

[profile.wasm-dev.package.semio-framework-os-kernel-neural-engine]
opt-level = 2

[profile.wasm-dev.package.semio-framework-replication]
opt-level = 2

[profile.wasm-dev.package.semio-framework-pack]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[profile.wasm-release.package.semio-framework-os-kernel]
codegen-units = 1
