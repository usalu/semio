[package]
name = "semio-s-plugin-stdio-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio family component: the png/jpg/bmp/tiff/gif/svg raster and vector image apps"

[lints]
workspace = true

[package.metadata.component]
package = "semio:stdio-image"

# 🔗️ `stdio` owns every kind this family opens (definitions, codecs, hub-native codec closure); the family ships only the
# apps, so the host loads `stdio` beside it (`.depends_on("stdio", tree_pin!())` mirrors this row).
[package.metadata.semio]
role = "plugin"
depends-on = ["stdio"]

# 🎮️ ONE row per shipped editor, each pinning its own `app`: `semio-tech play`'s coverage laws reach every editor a
# descriptor declares and every viewer through its pane's editor⇄viewer switch exactly when every shipped app owns a
# row, and `🗄️stdio/🧪️tests/🚢️shipped-fleet` asserts these rows ARE the shipped editors. Ports continue stdio's block.
[[package.metadata.semio.playground]]
variant = "stdio-png"
app = "s.stdio.png@1.2/*#editor"
aliases = ["stdio png"]
ports = { react = 6219, wgpu = 6319 }

[[package.metadata.semio.playground]]
variant = "stdio-jpg"
app = "s.stdio.jpg@jfif-1.01/*#editor"
aliases = ["stdio jpeg"]
ports = { react = 6220, wgpu = 6320 }

[[package.metadata.semio.playground]]
variant = "stdio-jpg-baseline"
app = "s.stdio.jpg@jfif-1.01/baseline#editor"
aliases = ["stdio baseline jpeg"]
ports = { react = 6221, wgpu = 6321 }

[[package.metadata.semio.playground]]
variant = "stdio-bmp"
app = "s.stdio.bmp@v3/*#editor"
aliases = ["stdio bitmap"]
ports = { react = 6223, wgpu = 6323 }

[[package.metadata.semio.playground]]
variant = "stdio-tiff"
app = "s.stdio.tiff@6.0/*#editor"
aliases = ["stdio tiff"]
ports = { react = 6224, wgpu = 6324 }

[[package.metadata.semio.playground]]
variant = "stdio-tiff-baseline"
app = "s.stdio.tiff@6.0/baseline#editor"
aliases = ["stdio baseline tiff"]
ports = { react = 6225, wgpu = 6325 }

[[package.metadata.semio.playground]]
variant = "stdio-gif-87a"
app = "s.stdio.gif@87a/*#editor"
aliases = ["stdio gif 87a"]
ports = { react = 6226, wgpu = 6326 }

[[package.metadata.semio.playground]]
variant = "stdio-gif-89a"
app = "s.stdio.gif@89a/*#editor"
aliases = ["stdio gif 89a"]
ports = { react = 6227, wgpu = 6327 }

[[package.metadata.semio.playground]]
variant = "stdio-svg"
app = "s.stdio.svg@1.1/*#editor"
aliases = ["stdio svg"]
ports = { react = 6228, wgpu = 6328 }

[[package.metadata.semio.playground]]
variant = "stdio-svg-basic"
app = "s.stdio.svg@1.1/basic#editor"
aliases = ["stdio svg basic"]
ports = { react = 6229, wgpu = 6329 }

[[package.metadata.semio.playground]]
variant = "stdio-svg-tiny"
app = "s.stdio.svg@1.1/tiny#editor"
aliases = ["stdio svg tiny"]
ports = { react = 6230, wgpu = 6330 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!`). Default-on so this family builds as its own component, and
# switched off by any crate that links it as a library (the stdio census law links every family at once).
default = ["plugin-root"]
plugin-root = ["semio-framework-plugin/component-guest"]

[dependencies]
semio-s-artifact-stdio-png = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-jpg = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-bmp = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-tiff = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-gif = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-stdio-svg = { workspace = true, features = ["component-app-assembly"] }
semio-framework = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-plugin = { workspace = true }
