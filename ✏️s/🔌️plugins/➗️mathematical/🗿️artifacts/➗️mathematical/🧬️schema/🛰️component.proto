syntax = "proto3";
package semio.s.mathematical.mathematical;

message MathematicalArtifact {
  MathematicalGraph graph = 1;
  MathematicalGeometry geometry = 2;
  // @state local-ui
  double camera_x = 3;
  // @state local-ui
  double camera_y = 4;
  // @state local-ui
  double camera_zoom = 5;
  // @state local-ui
  string locale = 6;
}

message MathematicalGraph {
  bool directed = 1;
  repeated MathematicalNode nodes = 2;
  repeated MathematicalEdge edges = 3;
  string algorithm = 4;
  optional string algorithm_seed = 5;
}

message MathematicalNode {
  string id = 1;
  string label = 2;
  double x = 3;
  double y = 4;
}

message MathematicalEdge {
  string id = 1;
  string source = 2;
  string target = 3;
}

message MathematicalPoint {
  double x = 1;
  double y = 2;
}

message MathematicalGeometry {
  repeated MathematicalPoint points = 1;
}
