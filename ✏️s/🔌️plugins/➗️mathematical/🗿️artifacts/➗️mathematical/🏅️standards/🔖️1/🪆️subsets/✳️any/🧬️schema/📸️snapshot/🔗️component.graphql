# 📸️ Mathematical snapshot schema.

type MathematicalSnapshot {
  graph: MathematicalGraph! @state(class: PERSISTENT)
  geometry: MathematicalGeometry! @state(class: PERSISTENT)
}

type MathematicalGraph {
  directed: Boolean!
  nodes: [MathematicalNode!]!
  edges: [MathematicalEdge!]!
  algorithm: String!
  algorithmSeed: String
}

type MathematicalNode {
  id: String!
  label: String!
  x: Float!
  y: Float!
}

type MathematicalEdge {
  id: String!
  source: String!
  target: String!
}

type MathematicalPoint {
  x: Float!
  y: Float!
}

type MathematicalGeometry {
  points: [MathematicalPoint!]!
}
