syntax = "proto3";
package semio.s.mathematical.mathematical.inference;

// 💡️ Mathematical inference schema — topology (graph topological order).

message MathematicalInference {
  // @derived
  MathematicalTopology topology = 1;
}

message MathematicalTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}
