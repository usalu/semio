# 💡️ Mathematical inference schema — topology (graph topological order).

type MathematicalInference {
  topology: MathematicalTopology! @derived
}

type MathematicalTopology {
  topoOrder: [String!]!
  depth: [MathematicalTopologyDepthEntry!]!
  cycleFree: Boolean!
  nodeCount: Int!
}

type MathematicalTopologyDepthEntry {
  nodeId: String!
  depth: Int!
}
