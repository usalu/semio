# 🧬️ Mathematical artifact schema.

type MathematicalArtifact {
  graph: MathematicalGraph! @state(class: ARTIFACT)
  geometry: MathematicalGeometry! @state(class: ARTIFACT)
  cameraX: Float! @state(class: CONFIG)
  cameraY: Float! @state(class: CONFIG)
  cameraZoom: Float! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}

type MathematicalGraph {
  directed: Boolean!
  nodes: [MathematicalNode!]!
  edges: [MathematicalEdge!]!
  algorithm: String!
  algorithmSeed: String
}

type MathematicalNode {
  id: String!
  label: String!
  x: Float!
  y: Float!
}

type MathematicalEdge {
  id: String!
  source: String!
  target: String!
}

type MathematicalPoint {
  x: Float!
  y: Float!
}

type MathematicalGeometry {
  points: [MathematicalPoint!]!
}
