syntax = "proto3";
package semio.s.mathematical.equation.diff;
import "🧰️framework/🔨️modules/🌱️value/🧬️schema/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
import "✏️s/🔌️plugins/➗️mathematical/🗿️artifacts/➗️equation/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
message EquationDiff {
  optional bool directed = 1;
  optional string algorithm = 2;
  optional EquationOptionalSeed algorithm_seed = 3;
  optional EquationNodesDelta nodes = 4;
  optional EquationEdgesDelta edges = 5;
  optional EquationPointsDelta points = 6;
  optional EquationExprDiff equation = 10;
}
message EquationOptionalSeed { optional string value = 1; }
message EquationNodeRemoval {
  string id = 1;
  uint32 index = 2;
}
message EquationNodeInsertion {
  uint32 index = 1;
  semio.s.mathematical.equation.artifact.EquationNode row = 2;
}
message EquationNodeRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message EquationNodesDelta {
  repeated EquationNodeRemoval removed = 1;
  repeated EquationNodeInsertion inserted = 2;
  repeated EquationNodeRelocation moved = 3;
  repeated EquationNodesModification modified = 4;
}
message EquationNodesModification {
  string id = 1;
  EquationNodePatch patch = 2;
}
message EquationNodePatch {
  optional string label = 1;
  optional double x = 2;
  optional double y = 3;
}
message EquationEdgeRemoval {
  string id = 1;
  uint32 index = 2;
}
message EquationEdgeInsertion {
  uint32 index = 1;
  semio.s.mathematical.equation.artifact.EquationEdge row = 2;
}
message EquationEdgeRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message EquationEdgesDelta {
  repeated EquationEdgeRemoval removed = 1;
  repeated EquationEdgeInsertion inserted = 2;
  repeated EquationEdgeRelocation moved = 3;
  repeated EquationEdgesModification modified = 4;
}
message EquationEdgesModification {
  string id = 1;
  EquationEdgePatch patch = 2;
}
message EquationEdgePatch {
  optional string source = 1;
  optional string target = 2;
}
message EquationPointsDelta { repeated EquationPointEdit edits = 1; }
message EquationPointEdit {
  oneof edit {
    EquationPointInsert insert = 1;
    EquationPointRemove remove = 2;
    EquationPointSet set = 3;
  }
}
message EquationPointInsert { uint32 at = 1; semio.s.mathematical.equation.artifact.EquationPoint point = 2; }
message EquationPointRemove { uint32 at = 1; }
message EquationPointSet { uint32 at = 1; semio.s.mathematical.equation.artifact.EquationPoint point = 2; }
message EquationExprDiff {
  repeated EquationKindPatch kinds = 1;
  optional uint64 next_label = 2;
}
message EquationKindPatch { uint64 label = 1; semio.framework.value.DslValue kind = 2; }
