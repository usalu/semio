# 🧬️ Equation artifact schema.

type EquationArtifact {
  graph: EquationGraph! @state(class: ARTIFACT)
  geometry: EquationGeometry! @state(class: ARTIFACT)
  cameraX: Float! @state(class: CONFIG)
  cameraY: Float! @state(class: CONFIG)
  cameraZoom: Float! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}

type EquationGraph {
  directed: Boolean!
  nodes: [EquationNode!]!
  edges: [EquationEdge!]!
  algorithm: String!
  algorithmSeed: String
}

type EquationNode {
  id: String!
  label: String!
  x: Float!
  y: Float!
}

type EquationEdge {
  id: String!
  source: String!
  target: String!
}

type EquationPoint {
  x: Float!
  y: Float!
}

type EquationGeometry {
  points: [EquationPoint!]!
}
