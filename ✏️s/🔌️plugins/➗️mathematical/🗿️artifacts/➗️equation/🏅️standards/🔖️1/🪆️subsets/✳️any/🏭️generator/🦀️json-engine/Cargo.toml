# 🧭️ Own workspace root: never joins the repository's root workspace, whose root manifest is a shared,
# contended file.
#
# 🚫️ DEPENDS ON `serde_json` AND NOTHING ELSE. It independently writes and reads the complete
# `{graph, geometry, equation}` foreign carrier without linking production code.
[workspace]

[package]
name = "equation-1-any-json-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "src/generate.rs"

[[bin]]
name = "reader"
path = "src/reader.rs"

[lib]
name = "equation_json"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
