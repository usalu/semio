# s.mathematical.equation mutations — one input type per semantic mutation variant, in `EquationMutation` declaration order
# (binary tags 0..17 of 📡️.protocol.semio).

input EquationNodeInput { id: String! label: String! x: Float! y: Float! }
input EquationEdgeInput { id: String! source: String! target: String! }
input EquationGraphInput { directed: Boolean! nodes: [EquationNodeInput!]! edges: [EquationEdgeInput!]! algorithm: String! algorithmSeed: String }
input EquationPointInput { x: Float! y: Float! }
input EquationNodePositionInput { id: String! x: Float! y: Float! }
input EquationPointPositionInput { index: Int! x: Float! y: Float! }

input ChangeGraphDirected { newDirected: Boolean! }
input UpdateGraphAlgorithm { newAlgorithm: String! newAlgorithmSeed: String }
input ReplaceGraph { graph: EquationGraphInput! }
input CreateNode { id: String! label: String! x: Float! y: Float! index: Int }
input DeleteNode { id: String! }
input DeleteNodes { ids: [String!]! }
input ChangeNodeLabel { id: String! newLabel: String! }
input MoveNode { id: String! x: Float! y: Float! }
input ConnectNodes { id: String! source: String! target: String! index: Int }
input DisconnectNodes { id: String! }
input ReplacePoints { points: [EquationPointInput!]! }
input InsertPoint { index: Int! x: Float! y: Float! }
input RemovePoint { index: Int! }
input MovePoints { indices: [Int!]! dx: Float! dy: Float! }
input ChangeCoefficient { label: Int! numer: String! denom: String! }
input MoveNodes { ids: [String!]! dx: Float! dy: Float! }
input SetNodePositions { positions: [EquationNodePositionInput!]! }
input SetPointPositions { positions: [EquationPointPositionInput!]! }

union EquationMutation = ChangeGraphDirected | UpdateGraphAlgorithm | ReplaceGraph | CreateNode | DeleteNode | DeleteNodes | ChangeNodeLabel | MoveNode | ConnectNodes | DisconnectNodes | ReplacePoints | InsertPoint | RemovePoint | MovePoints | ChangeCoefficient | MoveNodes | SetNodePositions | SetPointPositions
