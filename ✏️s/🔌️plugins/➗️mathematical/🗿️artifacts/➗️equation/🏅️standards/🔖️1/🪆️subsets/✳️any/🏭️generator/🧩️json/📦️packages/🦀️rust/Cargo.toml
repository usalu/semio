# 🧭️ Own workspace root: never joins the repository's root workspace, whose root manifest is a shared,
# contended file.
#
# 🚫️ DEPENDS ON `json` (json-rust) AND NOTHING ELSE. `serde_json` is a production runtime dependency
# of the equation plugin, so a reader built on it would compare the implementation with itself. It
# independently writes and reads the complete `{graph, geometry, equation}` foreign carrier without
# linking production code.
[workspace]

[package]
name = "equation-1-any-json-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "../../🏗️generate/🦀️.rs"

[[bin]]
name = "reader"
path = "../../📖️reader/🦀️.rs"

[lib]
name = "equation_json"
path = "../../🦀️.rs"

[dependencies]
json = "0.12"
