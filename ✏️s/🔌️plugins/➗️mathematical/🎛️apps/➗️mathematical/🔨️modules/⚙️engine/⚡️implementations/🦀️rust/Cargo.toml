[package]
name = "semio-s-app-mathematical-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Mathematical app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "../../../../../../../../../✏️s/🔌️plugins/➗️mathematical/🎛️apps/➗️mathematical/🔨️modules/⚙️engine/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
mathematical = { path = "../../../../../../../../../✏️s/🔌️plugins/➗️mathematical/🎛️apps/➗️mathematical/⚡️implementations/🦀️rust", package = "semio-s-app-mathematical" }
mathematical_graph = { path = "../../../../../../../../../🧰️framework/🔨️modules/🧮️math/🕸️graph/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-graph" }
mathematical_geometry = { path = "../../../../../../../../../🧰️framework/🔨️modules/🧮️math/📐️geometry/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-geometry" }
ui_wgpu = { path = "../../../../../../../../../🧰️framework/🔨️modules/🖱️ui/🧊️wgpu/⚡️implementations/🦀️rust", package = "semio-framework-ui-wgpu" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
dsl = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
# 🔌️ `PortMultiplicity` isn't re-exported by `semio-framework-plugin` (WORKFLOWS-END-TO-END-TYPED-PORTS
# port recipe) — a direct dependency on the core crate is the minimal fix, mirroring how the plugin
# crate itself depends on it.
semio-framework-core = { path = "../../../../../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
