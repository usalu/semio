# 🪪️ FormsDiff imports the canonical OS Store child identity.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
# import FormQuestion, FormStep, DslValue from "../📝️definition/🔗️.graphql"
# import FormsResponse from "../📨️response/🔗️.graphql"
type FormsDiff {
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  version: String @state(class: ARTIFACT)
  title: FormsOptionalText @state(class: ARTIFACT)
  steps: FormsStepsDelta @state(class: ARTIFACT)
  responses: FormsResponsesDelta @state(class: ARTIFACT)
}

type FormsOptionalText { value: String }

type FormsBlockField { field: String! value: DslValue }

type FormsQuestionPatch {
  kind: String
  changes: [FormsBlockField!]!
}

type FormsQuestionsDelta {
  removed: [FormsQuestionRemoval!]!
  inserted: [FormsQuestionInsertion!]!
  moved: [FormsQuestionRelocation!]!
  modified: [FormsQuestionsModification!]!
}

type FormsQuestionsModification {
  id: String!
  patch: FormsQuestionPatch!
}

type FormsQuestionRemoval {
  id: String!
  index: Int!
}

type FormsQuestionInsertion {
  index: Int!
  row: FormQuestion!
}

type FormsQuestionRelocation {
  id: String!
  from: Int!
  to: Int!
}

type FormsStepPatch {
  title: String
  description: FormsOptionalText
  blocks: FormsQuestionsDelta
}

type FormsStepsDelta {
  removed: [FormsStepRemoval!]!
  inserted: [FormsStepInsertion!]!
  moved: [FormsStepRelocation!]!
  modified: [FormsStepsModification!]!
}

type FormsStepsModification {
  id: String!
  patch: FormsStepPatch!
}

type FormsStepRemoval {
  id: String!
  index: Int!
}

type FormsStepInsertion {
  index: Int!
  row: FormStep!
}

type FormsStepRelocation {
  id: String!
  from: Int!
  to: Int!
}

type FormsResponsesDelta {
  removed: [FormsResponseRemoval!]!
  inserted: [FormsResponseInsertion!]!
  moved: [FormsResponseRelocation!]!
}

type FormsResponseRemoval {
  id: String!
  index: Int!
}

type FormsResponseInsertion {
  index: Int!
  row: FormsResponse!
}

type FormsResponseRelocation {
  id: String!
  from: Int!
  to: Int!
}
