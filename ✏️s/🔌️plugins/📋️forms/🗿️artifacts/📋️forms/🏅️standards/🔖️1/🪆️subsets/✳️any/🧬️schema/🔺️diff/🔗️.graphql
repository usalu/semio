# 🪪️ FormsDiff imports the canonical OS Store child identity.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
# import FormQuestion, FormStep, DslValue from "../📝️definition/🔗️.graphql"
# import FormsResponse from "../📨️response/🔗️.graphql"
type FormsDiff {
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  version: String @state(class: ARTIFACT)
  title: FormsOptionalText @state(class: ARTIFACT)
  steps: FormsStepsDelta @state(class: ARTIFACT)
  responses: FormsResponsesDelta @state(class: ARTIFACT)
  structure: ArtifactChild @state(class: ARTIFACT)
  results: ArtifactChild @state(class: ARTIFACT)
}

type FormsOptionalText { value: String }

type FormsBlockField { field: String! value: DslValue }

type FormsQuestionPatch {
  id: String!
  kind: String
  changes: [FormsBlockField!]!
}

type FormsQuestionsDelta {
  added: [FormQuestion!]!
  removed: [String!]!
  patched: [FormsQuestionPatch!]!
  reordered: [String!]
}

type FormsStepPatch {
  id: String!
  title: String
  description: FormsOptionalText
  blocks: FormsQuestionsDelta
}

type FormsStepsDelta {
  added: [FormStep!]!
  removed: [String!]!
  patched: [FormsStepPatch!]!
  reordered: [String!]
}

type FormsResponsePatch { id: String! }

type FormsResponsesDelta {
  added: [FormsResponse!]!
  removed: [String!]!
  patched: [FormsResponsePatch!]!
  reordered: [String!]
}
