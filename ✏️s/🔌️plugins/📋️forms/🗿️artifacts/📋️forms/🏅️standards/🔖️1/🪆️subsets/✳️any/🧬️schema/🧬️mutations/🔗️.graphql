# 🧬️ FormsMutation — closed semantic mutation vocabulary for the forms document. Mirrors Rust
# `FormMutation` (sibling `🦀️.rs`), same declaration order as the sibling `🟦️.ts`
# this file matches field-for-field.

# import FormStep, FormQuestion from "../📝️definition/🔗️.graphql"
# import FormsResponse from "../📨️response/🔗️.graphql"

type CreateStep {
  step: FormStep!
  index: Int
}

type DeleteStep {
  id: String!
}

type ReorderStep {
  id: String!
  toIndex: Int!
}

type RenameStep {
  id: String!
  newTitle: String!
}

type ChangeStepDescription {
  id: String!
  newDescription: String
}

type CreateBlock {
  stepId: String!
  block: FormQuestion!
  index: Int
}

type DeleteBlock {
  stepId: String!
  id: String!
}

type MoveBlockToStep {
  stepId: String!
  blockId: String!
  toStepId: String!
  index: Int!
}

type ReplaceBlock {
  stepId: String!
  block: FormQuestion!
}

type ChangeFormTitle {
  newTitle: String
}

type CommitResponse {
  response: FormsResponse!
  index: Int
}

type DiscardResponse {
  id: String!
}

union FormsMutation =
    CreateStep
  | DeleteStep
  | ReorderStep
  | RenameStep
  | ChangeStepDescription
  | CreateBlock
  | DeleteBlock
  | MoveBlockToStep
  | ReplaceBlock
  | ChangeFormTitle
  | CommitResponse
  | DiscardResponse
