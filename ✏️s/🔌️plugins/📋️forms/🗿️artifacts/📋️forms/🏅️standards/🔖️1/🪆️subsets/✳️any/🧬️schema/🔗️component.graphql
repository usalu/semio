# @emoji 🧬️ Shared @state directive is defined in the framework schema module.

type FormsArtifact {
  schema: String! @state(class: ARTIFACT)
  id: String! @state(class: ARTIFACT)
  version: String! @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  steps: [FormStep!]! @state(class: ARTIFACT)
  selectedIds: [String!]! @state(class: PRESENCE)
  currentStepIndex: Int! @state(class: CONFIG)
  tryValues: [FormsTryValue!]! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
  contributionsJson: String! @state(class: CONFIG)
}

type FormsTryValue {
  key: String!
  chunks: [String!]!
}

type FormStep {
  id: String!
  title: String!
  description: String
  blocks: [FormQuestion!]!
}

type FormQuestion {
  id: String!
  label: String!
  kind: String!
}
