syntax = "proto3";
package semio.app.forms.forms;
message FormsConfig {
  // @state local-ui
  repeated string selected_ids = 1;
  // @state local-ui
  uint32 current_step_index = 2;
  // @state local-ui
  string try_values_json = 3;
  // @state local-ui
  string locale = 4;
  // @state local-ui
  string contributions_json = 5;
}
