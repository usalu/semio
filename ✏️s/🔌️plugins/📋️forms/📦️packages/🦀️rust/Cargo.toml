[package]
name = "semio-s-plugin-forms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Forms plugin - one crate for the forms artifact (diff/op/dsl/pack/spr/engine) and the forms play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:forms"

[package.metadata.semio]
role = "plugin"
consumes = ["forms.questionKind"]

[[package.metadata.semio.playground]]
variant = "forms"
ports = { react = 6058, wgpu = 6158 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
serde.workspace = true
serde_json.workspace = true
