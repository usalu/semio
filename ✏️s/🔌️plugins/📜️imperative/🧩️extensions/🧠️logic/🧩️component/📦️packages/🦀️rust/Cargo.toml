[package]
workspace = "../../.."
name = "semio-s-plugin-imperative-logic-component"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "The `imperative-extension-logic` extension component: the one cdylib of `semio-s-plugin-imperative-logic`, holding only its entry point"

[lints]
workspace = true

[package.metadata.component]
package = "semio:imperative-extension-logic"

[package.metadata.semio]
role = "extension"
deployment-directory = "⚖️imperative-extension-logic"
component-kind = "extension"
extends = "imperative"
contributes = ["imperative.module"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]
path = "../../🦀️.rs"

[dependencies]
semio-framework-pack = { path = "../../../../../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust" }
semio-s-plugin-imperative-logic = { path = "../../../📦️packages/🦀️rust" }
semio-framework-plugin = { path = "../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust" }

[dev-dependencies]
semio-framework-plugin = { path = "../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["artifact-app-testing"] }
semio-framework-async = { path = "../../../../../../../../🧰️framework/🔨️modules/⏳️async/📦️packages/🦀️rust" }
semio-framework-async-macros = { path = "../../../../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
