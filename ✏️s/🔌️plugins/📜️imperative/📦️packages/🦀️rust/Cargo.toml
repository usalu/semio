# 🚧️ TEMPORARY (registrar removes on registration): must be the manifest's first line — TOML root-level
# keys must precede any [table] header, or they get folded into whatever table preceded them.
cargo-features = ["trim-paths"]

[package]
name = "semio-s-plugin-imperative"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Imperative plugin - one crate for the imperative artifact (diff/op/dsl/pack/spr/engine) and the imperative play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:imperative"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "imperative"
ports = { react = 6076, wgpu = 6176 }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
neural_engine = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🧠️neural/⚙️engine/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
imperative_engine = { path = "../../../../../✏️s/🔨️modules/📜️imperative/⚡️implementations/🦀️rust", package = "semio-s-kernel-imperative" }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# ============================================================================
# 🚧️ TEMPORARY VERIFICATION OVERLAY — registrar removes this whole block (and
# the nested target/ + Cargo.lock it creates) once the crate is registered as a
# real root-workspace member. Makes this crate its own standalone workspace so
# `cargo check/test/clippy --manifest-path …` can run before the registrar pass,
# per TEMPLATE.md §3. Copied verbatim from root Cargo.toml (cargo-features line moved to file top).
# ============================================================================
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
thiserror = "2.0.18"
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1
