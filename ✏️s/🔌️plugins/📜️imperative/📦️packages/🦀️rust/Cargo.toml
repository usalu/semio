[package]
name = "semio-s-plugin-imperative"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Imperative plugin - one crate for the imperative artifact (diff/op/dsl/pack/spr/engine) and the imperative play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:imperative"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "imperative"
ports = { react = 6076, wgpu = 6176 }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
neural_engine = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🧠️neural/⚙️engine/📦️packages/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }
imperative_engine = { path = "../../../../../✏️s/🔨️modules/📜️imperative/📦️packages/🦀️rust", package = "semio-s-imperative" }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
