[package]
name = "semio-s-app-imperative-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Imperative app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib"]
path = "../../../../../../../../../✏️s/🔌️plugins/📜️imperative/🎛️apps/📜️imperative/🔨️modules/🖱️ui/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
imperative = { path = "../../../../../../../../../✏️s/🔌️plugins/📜️imperative/🎛️apps/📜️imperative/⚡️implementations/🦀️rust", package = "semio-s-app-imperative" }
imperative_engine = { path = "../../../../../../../../../✏️s/🔌️plugins/📜️imperative/🎛️apps/📜️imperative/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-imperative-engine" }
imperative_op = { path = "../../../../../../../../../✏️s/🔌️plugins/📜️imperative/🎛️apps/📜️imperative/🔨️modules/🔧️op/⚡️implementations/🦀️rust", package = "semio-s-app-imperative-op" }
imperative_protocol = { path = "../../../../../../../../../✏️s/🔌️plugins/📜️imperative/🎛️apps/📜️imperative/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-s-app-imperative-protocol" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
neural_engine = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🧠️neural/⚙️engine/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-neural-engine" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
