syntax = "proto3";
package semio.imperative.v1;

message ProcedurePathRef { optional string owner = 1; optional string slot = 2; }
message ProcedureStep { string id = 1; string kind = 2; string params_json = 3; string bodies_json = 4; }
message CreateStep { ProcedurePathRef path_ref = 1; ProcedureStep step = 2; }
message DeleteStep { ProcedurePathRef path_ref = 1; string id = 2; }
message ReorderSteps { ProcedurePathRef path_ref = 1; string id = 2; uint64 to_index = 3; }
message EditStepParams { ProcedurePathRef path_ref = 1; string id = 2; string new_params_json = 3; }

message ProcedureMutation {
  oneof mutation {
    CreateStep create_step = 1;
    DeleteStep delete_step = 2;
    ReorderSteps reorder_steps = 3;
    EditStepParams edit_step_params = 4;
  }
}
