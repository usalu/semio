syntax = "proto3";
package semio.s.imperative.procedure.diff;

// 🧬️ Imperative diff schema — sparse field delta over the artifact.

message ProcedureDiff {
  optional ProcedureArtifact artifact = 1; // @state artifact
  optional string schema = 2; // @state artifact
  optional ProcedurePathDelta path = 3; // @state artifact
  optional map<string, string> seed = 4; // @state artifact
  optional ProcedureStringList selected_step_ids = 5; // @state presence
  optional string locale = 6; // @state config
  optional string contributions_json = 7; // @state config
}

message ProcedureStringList {
  repeated string values = 1;
}

message ProcedurePathRef {
  optional string owner = 1;
  optional string slot = 2;
}

message ProcedurePathDelta {
  ProcedurePathRef path_ref = 1;
  ProcedureStepsDelta steps = 2;
}

message ProcedureStepsDelta {
  repeated ProcedureStep added = 1;
  repeated string removed = 2;
  repeated ProcedureStepPatchEntry patched = 3;
  repeated string reordered = 4;
}

message ProcedureStepPatchEntry {
  string id = 1;
  string patch_json = 2;
}

message ProcedurePath {
  repeated ProcedureStep steps = 1;
}

message ProcedureStep {
  string id = 1;
  string kind = 2;
  string params_json = 3;
  repeated ProcedureStepBodyEntry bodies = 4;
}

message ProcedureStepBodyEntry {
  string slot = 1;
  ProcedurePath path = 2;
}

message ProcedureArtifact {
  string schema = 1;
  ProcedurePath path = 2;
  map<string, string> seed = 3;
  repeated string selected_step_ids = 4;
  string locale = 5;
  string contributions_json = 6;
  string run_output_json = 7;
}
