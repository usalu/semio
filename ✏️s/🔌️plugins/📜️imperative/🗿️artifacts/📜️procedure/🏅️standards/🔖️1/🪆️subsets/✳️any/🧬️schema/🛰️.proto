syntax = "proto3";
package semio.s.imperative.procedure.artifact;

// 🧬️ Imperative artifact schema — every field with its state class.

message ProcedureArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  ProcedurePath path = 2;
  // @state artifact
  map<string, string> seed = 3;
  // @state config
}

message ProcedurePath {
  repeated ProcedureStep steps = 1;
}

message ProcedureStep {
  string id = 1;
  string kind = 2;
  string params_json = 3;
  repeated ProcedureStepBodyEntry bodies = 4;
}

message ProcedureStepBodyEntry {
  string slot = 1;
  ProcedurePath path = 2;
}
