# 🧬️ Imperative artifact schema — every field with its state class.

type ImperativeArtifact {
  schema: String! @state(class: ARTIFACT)
  path: ImperativePath! @state(class: ARTIFACT)
  seed: [ImperativeSeedEntry!]! @state(class: ARTIFACT)
  selectedStepIds: [String!]! @state(class: PRESENCE)
  locale: String! @state(class: CONFIG)
  contributionsJson: String! @state(class: CONFIG)
  runOutputJson: String! @state(class: TRANSIENT)
}

type ImperativePath {
  steps: [ImperativeStep!]!
}

type ImperativeStep {
  id: String!
  kind: String!
  params: JSON
  bodies: [ImperativeStepBodyEntry!]
}

type ImperativeStepBodyEntry {
  slot: String!
  path: ImperativePath!
}

type ImperativeSeedEntry {
  key: String!
  value: JSON!
}

scalar JSON
