# 🧬️ Imperative diff schema — sparse field delta over the artifact.

type ImperativeDiff {
  artifact: ImperativeArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  path: ImperativePathDelta @state(class: ARTIFACT)
  seed: [ImperativeSeedEntry!] @state(class: ARTIFACT)
  selectedStepIds: ImperativeStringList @state(class: PRESENCE)
  locale: String @state(class: CONFIG)
  contributionsJson: String @state(class: CONFIG)
}

type ImperativeStringList {
  values: [String!]!
}

type ImperativePathRef {
  owner: String
  slot: String
}

type ImperativePathDelta {
  pathRef: ImperativePathRef!
  steps: ImperativeStepsDelta!
}

type ImperativeStepsDelta {
  added: [ImperativeStep!]!
  removed: [String!]!
  patched: [ImperativeStepPatchEntry!]!
  reordered: [String!]
}

type ImperativeStepPatchEntry {
  id: String!
  patch: JSON!
}

type ImperativePath {
  steps: [ImperativeStep!]!
}

type ImperativeStep {
  id: String!
  kind: String!
  params: JSON
  bodies: [ImperativeStepBodyEntry!]
}

type ImperativeStepBodyEntry {
  slot: String!
  path: ImperativePath!
}

type ImperativeSeedEntry {
  key: String!
  value: JSON!
}

type ImperativeArtifact {
  schema: String!
  path: ImperativePath!
  seed: [ImperativeSeedEntry!]!
  selectedStepIds: [String!]!
  locale: String!
  contributionsJson: String!
  runOutputJson: String!
}

scalar JSON
