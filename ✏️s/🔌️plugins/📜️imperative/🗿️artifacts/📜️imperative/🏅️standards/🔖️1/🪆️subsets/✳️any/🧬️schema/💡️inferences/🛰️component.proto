syntax = "proto3";
package semio.s.imperative.imperative.inference;

// 💡️ Imperative inference schema — topology (depth-first order + nesting depth + cycle-freedom) over the Path/Step tree.

message ImperativeInference {
  // @derived
  ImperativeTopology topology = 1;
}

message ImperativeTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}
