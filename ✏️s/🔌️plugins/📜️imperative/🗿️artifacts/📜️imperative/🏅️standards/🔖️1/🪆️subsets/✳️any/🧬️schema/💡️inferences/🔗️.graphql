# 💡️ Imperative inference schema — topology (depth-first order + nesting depth + cycle-freedom) over the Path/Step tree.

type ImperativeInference {
  topology: ImperativeTopology! @derived
}

type ImperativeTopology {
  topoOrder: [String!]!
  depth: [ImperativeDepthEntry!]!
  cycleFree: Boolean!
  nodeCount: Int!
}

type ImperativeDepthEntry {
  stepId: String!
  depth: Int!
}
