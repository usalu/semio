# 📜️ Imperative direct mutation aggregate.
scalar JSON

input ImperativePathRefInput { owner: String, slot: String }
input ImperativeStepInput { id: String!, kind: String!, params: JSON!, bodies: JSON! }
input CreateStepInput { pathRef: ImperativePathRefInput!, step: ImperativeStepInput! }
input DeleteStepInput { pathRef: ImperativePathRefInput!, id: String! }
input ReorderStepsInput { pathRef: ImperativePathRefInput!, id: String!, toIndex: Int! }
input EditStepParamsInput { pathRef: ImperativePathRefInput!, id: String!, newParams: JSON! }

input ImperativeMutationInput {
  createStep: CreateStepInput
  deleteStep: DeleteStepInput
  reorderSteps: ReorderStepsInput
  editStepParams: EditStepParamsInput
}
