# 🧬️ Imperative mutation schema — artifact-lane fields only.

type ImperativeMutation {
  schema: String! @state(class: ARTIFACT)
  path: ImperativePath! @state(class: ARTIFACT)
  seed: [ImperativeSeedEntry!]! @state(class: ARTIFACT)
}

type ImperativePath {
  steps: [ImperativeStep!]!
}

type ImperativeStep {
  id: String!
  kind: String!
  params: JSON
  bodies: [ImperativeStepBodyEntry!]
}

type ImperativeStepBodyEntry {
  slot: String!
  path: ImperativePath!
}

type ImperativeSeedEntry {
  key: String!
  value: JSON!
}

scalar JSON
