syntax = "proto3";
package semio.s.imperative.imperative.mutation;

// 🧬️ Imperative mutation schema — persistent fields only.

message ImperativeMutation {
  // @state persistent
  string schema = 1;
  // @state persistent
  ImperativePath path = 2;
  // @state persistent
  map<string, string> seed = 3;
}

message ImperativePath {
  repeated ImperativeStep steps = 1;
}

message ImperativeStep {
  string id = 1;
  string kind = 2;
  string params_json = 3;
  repeated ImperativeStepBodyEntry bodies = 4;
}

message ImperativeStepBodyEntry {
  string slot = 1;
  ImperativePath path = 2;
}
