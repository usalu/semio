syntax = "proto3";
package semio.imperative.v1;

message ImperativePathRef { optional string owner = 1; optional string slot = 2; }
message ImperativeStep { string id = 1; string kind = 2; string params_json = 3; string bodies_json = 4; }
message CreateStep { ImperativePathRef path_ref = 1; ImperativeStep step = 2; }
message DeleteStep { ImperativePathRef path_ref = 1; string id = 2; }
message ReorderSteps { ImperativePathRef path_ref = 1; string id = 2; uint64 to_index = 3; }
message EditStepParams { ImperativePathRef path_ref = 1; string id = 2; string new_params_json = 3; }

message ImperativeMutation {
  oneof mutation {
    CreateStep create_step = 1;
    DeleteStep delete_step = 2;
    ReorderSteps reorder_steps = 3;
    EditStepParams edit_step_params = 4;
  }
}
