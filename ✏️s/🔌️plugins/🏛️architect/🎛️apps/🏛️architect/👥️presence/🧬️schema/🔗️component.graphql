enum AdjacencyKind {
  required
  preferred
  optional
  prohibited
}

type ArchitectPresence {
  activeRegister: String! @state(class: PRESENCE)
  adjacencyKindFilter: AdjacencyKind @state(class: PRESENCE)
  graphCameraX: Float! @state(class: PRESENCE)
  graphCameraY: Float! @state(class: PRESENCE)
  graphCameraZoom: Float! @state(class: PRESENCE)
}
