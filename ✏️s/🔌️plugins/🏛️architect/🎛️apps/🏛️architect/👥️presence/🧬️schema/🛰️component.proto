syntax = "proto3";
package semio.app.architect.architect;

enum AdjacencyKind {
  ADJACENCY_KIND_UNSPECIFIED = 0;
  ADJACENCY_KIND_REQUIRED = 1;
  ADJACENCY_KIND_PREFERRED = 2;
  ADJACENCY_KIND_OPTIONAL = 3;
  ADJACENCY_KIND_PROHIBITED = 4;
}

message ArchitectPresence {
  // @state presence
  string active_register = 1;
  // @state presence
  optional AdjacencyKind adjacency_kind_filter = 2;
  // @state presence
  double graph_camera_x = 3;
  // @state presence
  double graph_camera_y = 4;
  // @state presence
  double graph_camera_zoom = 5;
}
