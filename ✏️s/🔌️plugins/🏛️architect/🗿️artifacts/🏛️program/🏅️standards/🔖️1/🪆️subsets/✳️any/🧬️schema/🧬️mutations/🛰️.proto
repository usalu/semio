syntax = "proto3";
package semio.s.architect.program.mutation;

// 🧬️ Program mutation schema — one message per semantic mutation kind; the four register-row kinds address
// the 64 id-keyed registers through `RegisterKey`.
message ProgramMutation {
  oneof mutation {
    CreateRegisterRow createRegisterRow = 1;
    DeleteRegisterRow deleteRegisterRow = 2;
    RenameRegisterRow renameRegisterRow = 3;
    ReplaceRegisterRow replaceRegisterRow = 4;
    ConnectAdjacency connectAdjacency = 5;
    DisconnectAdjacency disconnectAdjacency = 6;
    ConnectTrace connectTrace = 7;
    DisconnectTrace disconnectTrace = 8;
    RenameMeta renameMeta = 9;
    ReplaceMeta replaceMeta = 10;
    RenameProject renameProject = 11;
    ReplaceProject replaceProject = 12;
    RenameGovernance renameGovernance = 13;
    ReplaceGovernance replaceGovernance = 14;
  }
}

enum RegisterKey {
  REGISTER_KEY_INFORMATION_REQUIREMENT = 0;
  REGISTER_KEY_SUSTAINABILITY_REQUIREMENT = 1;
  REGISTER_KEY_ACCESSIBILITY_REQUIREMENT = 2;
  REGISTER_KEY_CONFLICT = 3;
  REGISTER_KEY_OPTION_EVALUATION = 4;
  REGISTER_KEY_FUNCTION = 5;
  REGISTER_KEY_RISK = 6;
  REGISTER_KEY_DECISION = 7;
  REGISTER_KEY_VALIDATION_RECORD = 8;
  REGISTER_KEY_PRIORITY_RECORD = 9;
  REGISTER_KEY_FLOW_REQUIREMENT = 10;
  REGISTER_KEY_ENVIRONMENTAL_REQUIREMENT = 11;
  REGISTER_KEY_WORKSHOP = 12;
  REGISTER_KEY_SCENARIO = 13;
  REGISTER_KEY_BENCHMARK_RECORD = 14;
  REGISTER_KEY_ACTIVITY = 15;
  REGISTER_KEY_INFRASTRUCTURE_REQUIREMENT = 16;
  REGISTER_KEY_ORGANIZATIONAL_REQUIREMENT = 17;
  REGISTER_KEY_ISSUE = 18;
  REGISTER_KEY_APPROVAL_RECORD = 19;
  REGISTER_KEY_STAKEHOLDER = 20;
  REGISTER_KEY_QUALITY_RECORD = 21;
  REGISTER_KEY_RESILIENCE_REQUIREMENT = 22;
  REGISTER_KEY_ASSUMPTION = 23;
  REGISTER_KEY_COST_REQUIREMENT = 24;
  REGISTER_KEY_DOCUMENT = 25;
  REGISTER_KEY_SCHEDULE_REQUIREMENT = 26;
  REGISTER_KEY_GROWTH_PLAN = 27;
  REGISTER_KEY_PERFORMANCE_CRITERION = 28;
  REGISTER_KEY_OPERATIONAL_REQUIREMENT = 29;
  REGISTER_KEY_REQUIREMENT = 30;
  REGISTER_KEY_SITE_CONTEXT = 31;
  REGISTER_KEY_TEMPLATE_RECORD = 32;
  REGISTER_KEY_REPORT_RECORD = 33;
  REGISTER_KEY_AUDIT_EVENT = 34;
  REGISTER_KEY_KNOWLEDGE_RECORD = 35;
  REGISTER_KEY_REGULATORY_REQUIREMENT = 36;
  REGISTER_KEY_COMMUNICATION_REQUIREMENT = 37;
  REGISTER_KEY_RESOURCE = 38;
  REGISTER_KEY_STATUS_RECORD = 39;
  REGISTER_KEY_CHANGE_RECORD = 40;
  REGISTER_KEY_PROCESS = 41;
  REGISTER_KEY_SEARCH_FILTER = 42;
  REGISTER_KEY_ACCESS_RULE = 43;
  REGISTER_KEY_PRIVACY_REQUIREMENT = 44;
  REGISTER_KEY_QUANTITY_REQUIREMENT = 45;
  REGISTER_KEY_ANALYSIS_RECORD = 46;
  REGISTER_KEY_RELATIONSHIP = 47;
  REGISTER_KEY_STORAGE_REQUIREMENT = 48;
  REGISTER_KEY_MEETING_RECORD = 49;
  REGISTER_KEY_SURVEY = 50;
  REGISTER_KEY_DELIVERY_CONSTRAINT = 51;
  REGISTER_KEY_CONSTRAINT_RECORD = 52;
  REGISTER_KEY_COMPLIANCE_RECORD = 53;
  REGISTER_KEY_SERVICE_REQUIREMENT = 54;
  REGISTER_KEY_EQUIPMENT = 55;
  REGISTER_KEY_SECURITY_REQUIREMENT = 56;
  REGISTER_KEY_COLLABORATION_RECORD = 57;
  REGISTER_KEY_SAFETY_REQUIREMENT = 58;
  REGISTER_KEY_USER_PROFILE = 59;
  REGISTER_KEY_HUMAN_FACTOR_REQUIREMENT = 60;
  REGISTER_KEY_FLEXIBILITY_REQUIREMENT = 61;
  REGISTER_KEY_WAYFINDING_REQUIREMENT = 62;
  REGISTER_KEY_PROGRAM_ELEMENT = 63;
}

message CreateRegisterRow {
  bytes row = 1;
  optional uint32 index = 2;
}

message DeleteRegisterRow {
  RegisterKey register = 1;
  string id = 2;
}

message RenameRegisterRow {
  RegisterKey register = 1;
  string id = 2;
  string new_name = 3;
}

message ReplaceRegisterRow {
  bytes row = 1;
}

message ConnectAdjacency {
  bytes adjacency = 1;
  optional uint32 index = 2;
}

message DisconnectAdjacency {
  string id = 1;
}

message ConnectTrace {
  bytes trace = 1;
  optional uint32 index = 2;
}

message DisconnectTrace {
  string id = 1;
}

message RenameMeta {
  string new_title = 1;
}

message ReplaceMeta {
  bytes new_meta = 1;
}

message RenameProject {
  string new_code = 1;
}

message ReplaceProject {
  bytes new_project = 1;
}

message RenameGovernance {
  string new_framework = 1;
}

message ReplaceGovernance {
  bytes new_governance = 1;
}
