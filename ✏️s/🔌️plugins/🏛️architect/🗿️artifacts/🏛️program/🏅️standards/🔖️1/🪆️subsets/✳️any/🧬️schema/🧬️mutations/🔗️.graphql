# 🧬️ Program mutation schema — one type per semantic mutation kind; the four register-row kinds address
# the 64 id-keyed registers through `RegisterKey`.
scalar JSON

union ProgramMutation = CreateRegisterRow | DeleteRegisterRow | RenameRegisterRow | ReplaceRegisterRow | ConnectAdjacency | DisconnectAdjacency | ConnectTrace | DisconnectTrace | RenameMeta | ReplaceMeta | RenameProject | ReplaceProject | RenameGovernance | ReplaceGovernance

enum RegisterKey {
  informationRequirement
  sustainabilityRequirement
  accessibilityRequirement
  conflict
  optionEvaluation
  function
  risk
  decision
  validationRecord
  priorityRecord
  flowRequirement
  environmentalRequirement
  workshop
  scenario
  benchmarkRecord
  activity
  infrastructureRequirement
  organizationalRequirement
  issue
  approvalRecord
  stakeholder
  qualityRecord
  resilienceRequirement
  assumption
  costRequirement
  document
  scheduleRequirement
  growthPlan
  performanceCriterion
  operationalRequirement
  requirement
  siteContext
  templateRecord
  reportRecord
  auditEvent
  knowledgeRecord
  regulatoryRequirement
  communicationRequirement
  resource
  statusRecord
  changeRecord
  process
  searchFilter
  accessRule
  privacyRequirement
  quantityRequirement
  analysisRecord
  relationship
  storageRequirement
  meetingRecord
  survey
  deliveryConstraint
  constraintRecord
  complianceRecord
  serviceRequirement
  equipment
  securityRequirement
  collaborationRecord
  safetyRequirement
  userProfile
  humanFactorRequirement
  flexibilityRequirement
  wayfindingRequirement
  programElement
}

type CreateRegisterRow {
  row: JSON!
  index: Int
}

type DeleteRegisterRow {
  register: RegisterKey!
  id: ID!
}

type RenameRegisterRow {
  register: RegisterKey!
  id: ID!
  newName: String!
}

type ReplaceRegisterRow {
  row: JSON!
}

type ConnectAdjacency {
  adjacency: JSON!
  index: Int
}

type DisconnectAdjacency {
  id: ID!
}

type ConnectTrace {
  trace: JSON!
  index: Int
}

type DisconnectTrace {
  id: ID!
}

type RenameMeta {
  newTitle: String!
}

type ReplaceMeta {
  newMeta: JSON!
}

type RenameProject {
  newCode: String!
}

type ReplaceProject {
  newProject: JSON!
}

type RenameGovernance {
  newFramework: String!
}

type ReplaceGovernance {
  newGovernance: JSON!
}
