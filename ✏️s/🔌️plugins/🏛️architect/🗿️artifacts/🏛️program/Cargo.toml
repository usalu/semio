  "🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/📌️panels/📚️catalogue/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🚪️io/💾️binary/🧬️mutations/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/💡️inferences/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/💡️inferences/🧪️tests/🔬️tests-exchange/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📸️snapshot/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🗄️registers/🌐️context-requirements/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🗄️registers/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🗄️registers/🗂️catalog/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🗄️registers/🧭️program-structure/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🗄️registers/🧭️program-structure/🧪️tests/🔬️unit/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧪️tests/🔬️unit/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧱️kernel/🧪️tests/🔬️unit/📦️packages/🦀️rust",
  "📦️packages/🦀️rust",
]
exclude = [
    "**/🏭️bridge/**",
    "**/👽️guest/**",
    "**/🔮️oracles/**",
]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**",
]
member-manifests = [ "**/📦️packages/🦀️rust/Cargo.toml" ]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

[workspace.dependencies.semio-framework-artifact-reference]
path = "../../../../../🧰️framework/🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-job]
path = "../../../../../🧰️framework/🔨️modules/🧵️job/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-tool-machine]
path = "../../../../../🧰️framework/🔨️modules/🛠️tool-machine/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-ui-contract]
path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-csv]
path = "../../../🗄️stdio/🗿️artifacts/📊️csv/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-json]
path = "../../../🗄️stdio/🗿️artifacts/🧾️json/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio-table-model]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/📊️table/🧬️schema/📦️packages/🦀️rust"
[workspace.dependencies.semio-s-artifact-stdio-semio-value-model]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/🔢️value/🧬️schema/📦️packages/🦀️rust"
[workspace.dependencies.semio-s-artifact-stdio-tsv]
path = "../../../🗄️stdio/🗿️artifacts/📑️tsv/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-txt]
path = "../../../🗄️stdio/🗿️artifacts/🔤️txt/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-base]
path = "../../../🗄️stdio/🗿️artifacts/📕️xlsx/🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-xlsx-base-model]
path = "../../../🗄️stdio/🗿️artifacts/📕️xlsx/🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/📦️packages/🦀️rust"
[workspace.dependencies.semio-s-artifact-stdio-zip]
path = "../../../🗄️stdio/🗿️artifacts/🎒️zip/📦️packages/🦀️rust"

[workspace.dependencies.serde]
version = "1.0.228"
features = [ "derive" ]

[workspace.dependencies.serde_json]
version = "1.0.149"
features = [ "raw_value" ]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

  [workspace.lints.rust.future_incompatible]
  level = "warn"
  priority = -1

  [workspace.lints.rust.rust_2018_idioms]
  level = "warn"
  priority = -1

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

  [workspace.lints.clippy.all]
  level = "warn"
  priority = -1

