[package]
name = "semio-s-plugin-architect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Architect plugin — the architectural programming document app (registers, adjacency, analysis, reporting) in one hot-swappable WASM component"

[lints]
workspace = true

[package.metadata.component]
package = "semio:architect"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "architect"
ports = { react = 6090, wgpu = 6190 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
blake3 = "1"
graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

