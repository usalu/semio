[package]
name = "semio-s-plugin-writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Writer plugin - one crate for the writer artifact (diff/op/dsl/pack/spr/engine) and the writer play app (commands/modes/windows/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:writer"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "writer"
ports = { react = 6062, wgpu = 6162 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
framework_editor = { path = "../../../../../🧰️framework/🔨️modules/✍️editor/⚡️implementations/🦀️rust", package = "semio-framework-editor" }
trinity_jack = { path = "../../../../../✏️s/🔌️plugins/🔱️trinity/🔨️modules/🔌️jack/⚡️implementations/🦀️rust", package = "semio-s-plugin-trinity-jack" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true
regex = "1.11.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# 🚧️ TEMPORARY VERIFICATION OVERLAY — DELETE BEFORE HANDOFF (see TEMPLATE.md §3 "chicken-and-egg").
# Makes this crate its own workspace root so it can be `cargo check`ed in isolation before the
# registrar adds it as a real root-workspace member (the old bundle crate still holds this package
# name as a member today). Copied verbatim from root Cargo.toml so artifact fingerprints match and
# the shared `target/` stays warm.
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1

