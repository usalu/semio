syntax = "proto3";
package semio.app.writer.writer;
message WriterPresence {
  // @state presence
  repeated string selected_ast_ids = 1;
  // @state presence
  optional WriterEditorSelection editor_selection = 2;
  // @state presence
  optional string tree_hovered_ast_id = 3;
  // @state presence
  optional uint32 editor_hover_offset = 4;
  // @state presence
  WriterCamera camera = 5;
}

message WriterEditorSelection {
  uint32 start = 1;
  uint32 end = 2;
}

message WriterCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
