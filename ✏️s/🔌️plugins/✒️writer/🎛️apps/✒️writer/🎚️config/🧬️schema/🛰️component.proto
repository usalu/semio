syntax = "proto3";
package semio.app.writer.writer;
message WriterConfig {
  // @state config
  repeated string selected_ast_ids = 1;
  // @state config
  optional WriterEditorSelection editor_selection = 2;
  // @state config
  uint32 format_signal = 3;
  // @state config
  uint32 lint_signal = 4;
  // @state config
  uint32 revision = 5;
  // @state config
  WriterEditorSettings editor_settings = 6;
  // @state config
  optional string tree_hovered_ast_id = 7;
  // @state config
  optional uint32 editor_hover_offset = 8;
  // @state config
  string engagement_input = 9;
  // @state config
  WriterCamera camera = 10;
  // @state config
  string locale = 11;
}

message WriterEditorSelection {
  uint32 start = 1;
  uint32 end = 2;
}

message WriterEditorSettings {
  bool show_line_numbers = 1;
  uint32 font_px = 2;
  uint32 line_height = 3;
  uint32 tab_size = 4;
}

message WriterCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
