cargo-features = [ "trim-paths" ]

[workspace]
resolver = "2"
members = [
  "🏅️standards/🔖️1/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/✏️editor/🎭️modes/✏️edit/🪟️windows/✒️main/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/⚙️operations/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/⚙️operations/🧪️tests/🔬️unit/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/💡️inferences/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧪️tests/🔬️unit/📦️packages/🦀️rust",
  "🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🧬️mutations/🏷️rename-writer/📦️packages/🦀️rust",
  "📦️packages/🦀️rust",
]
exclude = [
    "**/🏭️bridge/**",
    "**/👽️guest/**",
    "**/🔮️oracles/**",
]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**",
]
member-manifests = [ "**/📦️packages/🦀️rust/Cargo.toml" ]

  [workspace.package]
  version = "0.1.0"
  edition = "2021"
  rust-version = "1.95"

[workspace.dependencies.semio-framework-graph-manifest]
path = "../../../../../🧰️framework/🔨️modules/🕸️graph/🛂️manifest/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-artifact-reference]
path = "../../../../../🧰️framework/🔨️modules/🗿️artifact-reference/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-job]
path = "../../../../../🧰️framework/🔨️modules/🧵️job/📦️packages/🦀️rust"

[workspace.dependencies.semio-framework-ui-contract]
path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-docx-base-model]
path = "../../../🗄️stdio/🗿️artifacts/📜️docx/🏅️standards/🔖️ecma-376/🪆️subsets/🧱️base/🧬️schema/📦️packages/🦀️rust"
[workspace.dependencies.semio-s-artifact-stdio-json]
path = "../../../🗄️stdio/🗿️artifacts/🧾️json/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-md]
path = "../../../🗄️stdio/🗿️artifacts/📝️md/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-pdf]
path = "../../../🗄️stdio/🗿️artifacts/📖️pdf/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio-document]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/📑️document/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-txt]
path = "../../../🗄️stdio/🗿️artifacts/🔤️txt/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-trinity-jack]
path = "../../../🔱️trinity/🗿️artifacts/🔌️jack/📦️packages/🦀️rust"

[workspace.dependencies.serde]
version = "1.0.228"
features = [ "derive" ]

[workspace.dependencies.serde_json]
version = "1.0.149"
features = [ "raw_value" ]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

  [workspace.lints.rust.future_incompatible]
  level = "warn"
  priority = -1

  [workspace.lints.rust.rust_2018_idioms]
  level = "warn"
  priority = -1

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

  [workspace.lints.clippy.all]
  level = "warn"
  priority = -1

