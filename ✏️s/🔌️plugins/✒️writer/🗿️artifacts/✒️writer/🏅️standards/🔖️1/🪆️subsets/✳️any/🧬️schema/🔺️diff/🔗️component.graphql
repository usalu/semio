# 🧬️ Writer diff schema.

type WriterDiff {
  artifact: WriterArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  languageId: String @state(class: ARTIFACT)
  uri: String @state(class: ARTIFACT)
  text: WriterTextDelta @state(class: ARTIFACT)
  selectedAstIds: WriterStringList @state(class: PRESENCE)
  editorSelection: WriterEditorSelection @state(class: PRESENCE)
  editorSettings: WriterEditorSettings @state(class: PRESENCE)
  formatSignal: Int @state(class: CONFIG)
  lintSignal: Int @state(class: CONFIG)
  revision: Int @state(class: CONFIG)
  engagementInput: String @state(class: CONFIG)
  cameraX: Float @state(class: CONFIG)
  cameraY: Float @state(class: CONFIG)
  cameraZoom: Float @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  treeHoveredAstId: String @state(class: ARTIFACT)
  editorHoverOffset: Int @state(class: ARTIFACT)
}

type WriterArtifact {
  schema: String!
  id: String!
  languageId: String!
  uri: String!
  text: String!
  selectedAstIds: [String!]!
  editorSelection: WriterEditorSelection
  editorSettings: WriterEditorSettings!
  formatSignal: Int!
  lintSignal: Int!
  revision: Int!
  engagementInput: String!
  cameraX: Float!
  cameraY: Float!
  cameraZoom: Float!
  locale: String!
  treeHoveredAstId: String
  editorHoverOffset: Int
}

type WriterEditorSelection {
  start: Int!
  end: Int!
}

type WriterEditorSettings {
  showLineNumbers: Boolean!
  fontPx: Int!
  lineHeight: Int!
  tabSize: Int!
}

type WriterStringList {
  values: [String!]!
}

type WriterTextDelta {
  replacement: String
  edits: [WriterTextRangeEdit!]!
}

type WriterTextRangeEdit {
  start: Int!
  end: Int!
  insert: String!
}
