# ✒️ Writer direct mutation aggregate.
input RenameWriterInput { newId: String! }
input ChangeUriInput { newUri: String! }
input ChangeLanguageInput { newLanguageId: String! }
input EditTextInput { text: String! }

input WriterMutationInput {
  renameWriter: RenameWriterInput
  changeUri: ChangeUriInput
  changeLanguage: ChangeLanguageInput
  editText: EditTextInput
}
