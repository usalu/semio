syntax = "proto3";
package semio.s.writer.writer.inference;

// 💡️ Writer inference schema — document outline (markdown headings + word/line counts).

message WriterInference {
  // @derived
  WriterOutline outline = 1;
}

message WriterOutline {
  repeated string section_outline = 1;
  uint32 word_count = 2;
  uint32 line_count = 3;
}
