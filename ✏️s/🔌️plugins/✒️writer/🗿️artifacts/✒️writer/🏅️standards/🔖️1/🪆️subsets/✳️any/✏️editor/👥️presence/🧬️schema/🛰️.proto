syntax = "proto3";
package semio.app.writer.writer;
message WriterPresence {
  reserved 1, 3, 4;
  // @state presence
  optional WriterEditorSelection editor_selection = 2;
  // @state presence
  WriterCamera camera = 5;
}

message WriterEditorSelection {
  uint32 start = 1;
  uint32 end = 2;
}

message WriterCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
