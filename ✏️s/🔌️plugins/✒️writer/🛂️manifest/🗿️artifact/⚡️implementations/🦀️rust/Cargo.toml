[package]
name = "semio-s-plugin-writer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:writer"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "writer"
ports = { react = 6062, wgpu = 6162 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌️plugins/✒️writer/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
semio-framework-plugin = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
framework_editor = { path = "../../../../../../../🧰️framework/🔨️modules/✍️editor/⚡️implementations/🦀️rust", package = "semio-framework-editor" }
writer = { path = "../../../../../../../✏️s/🔌️plugins/✒️writer/🎛️apps/✒️writer/⚡️implementations/🦀️rust", package = "semio-s-app-writer" }
writer_op = { path = "../../../../../../../✏️s/🔌️plugins/✒️writer/🎛️apps/✒️writer/🔨️modules/🔧️op/⚡️implementations/🦀️rust", package = "semio-s-app-writer-op" }
writer_ui = { path = "../../../../../../../✏️s/🔌️plugins/✒️writer/🎛️apps/✒️writer/🔨️modules/🖱️ui/⚡️implementations/🦀️rust", package = "semio-s-app-writer-ui" }
store = { path = "../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
