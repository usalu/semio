type FemCamera {
  x: Float!
  y: Float!
  zoom: Float!
}

type Fem2dConfig {
  resultSourceId: String @state(class: CONFIG)
  resultMode: String! @state(class: CONFIG)
  resultModeIndex: Int! @state(class: CONFIG)
  camera: FemCamera! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}
