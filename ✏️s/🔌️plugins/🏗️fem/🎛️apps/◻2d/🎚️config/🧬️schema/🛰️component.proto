syntax = "proto3";
package semio.app.fem.2d.config;
message FemCamera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
message Fem2dConfig {
  // @state local-ui
  optional string result_source_id = 1;
  // @state local-ui
  string result_mode = 2;
  // @state local-ui
  uint32 result_mode_index = 3;
  // @state local-ui
  FemCamera camera = 4;
  // @state local-ui
  string locale = 5;
}
