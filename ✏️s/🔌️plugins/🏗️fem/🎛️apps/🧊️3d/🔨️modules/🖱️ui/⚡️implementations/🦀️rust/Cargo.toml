[package]
name = "semio-s-app-fem-3d-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "FEM 3D app - DocumentApp impl, render, manifest (constitutional: ui)"

[lints]
workspace = true
[lib]
path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🎛️apps/🧊️3d/🔨️modules/🖱️ui/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
fem3d = { path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🎛️apps/🧊️3d/⚡️implementations/🦀️rust", package = "semio-s-app-fem-3d" }
fem3d_engine = { path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🎛️apps/🧊️3d/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-app-fem-3d-engine" }
fem3d_op = { path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🎛️apps/🧊️3d/🔨️modules/🔧️op/⚡️implementations/🦀️rust", package = "semio-s-app-fem-3d-op" }
fem3d_protocol = { path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🎛️apps/🧊️3d/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-s-app-fem-3d-protocol" }
fem3d_dsl = { path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🎛️apps/🧊️3d/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-s-app-fem-3d-dsl" }
fem_shared = { path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🔨️modules/🤝️shared/⚡️implementations/🦀️rust", package = "semio-s-plugin-fem-shared" }
fem_core = { path = "../../../../../../../../../✏️s/🔌️plugins/🏗️fem/🔨️modules/🫀️core/⚡️implementations/🦀️rust", package = "semio-s-plugin-fem-core" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
# 🎯️ B1: this crate's own `Config`/`ConfigOperation`/`Command` types now mirror `fem2d`'s crate split
# exactly — they live in `fem3d_engine`/`fem3d_op`/`fem3d_protocol` respectively, so this crate no
# longer needs `dsl`/`protocol`/`serde` directly (only `serde_json` for scene JSON building).
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
