# 🧬️ Fem2d diff schema — sparse field delta.

type Fem2dDiff {
  nodes: Fem2dNodesDelta @state(class: ARTIFACT)
  elements: Fem2dElementsDelta @state(class: ARTIFACT)
  regions: Fem2dRegionsDelta @state(class: ARTIFACT)
  materials: Fem2dMaterialsDelta @state(class: ARTIFACT)
  sections: Fem2dSectionsDelta @state(class: ARTIFACT)
  supports: Fem2dSupportsDelta @state(class: ARTIFACT)
  loadCases: Fem2dLoadCasesDelta @state(class: ARTIFACT)
  combinations: Fem2dCombinationsDelta @state(class: ARTIFACT)
  analysis: Fem2dAnalysisPatch @state(class: ARTIFACT)
}

type Fem2dNodeRemoval {
  id: String!
  index: Int!
}

type Fem2dNodeInsertion {
  index: Int!
  row: FemNode!
}

type Fem2dNodeRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Fem2dNodesModification {
  id: String!
  patch: Fem2dNodePatch!
}

type Fem2dNodesDelta {
  removed: [Fem2dNodeRemoval!]!
  inserted: [Fem2dNodeInsertion!]!
  moved: [Fem2dNodeRelocation!]!
  modified: [Fem2dNodesModification!]!
}

