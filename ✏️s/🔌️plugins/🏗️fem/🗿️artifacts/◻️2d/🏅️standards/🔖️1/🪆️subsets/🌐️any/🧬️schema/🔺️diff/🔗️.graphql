}

# 🧱️ Sparse material changes preserve independent fields.
type Fem2dMaterialPatch {
  name: String
  e: Float
  nu: Float
  rho: Float
}

type Fem2dNodePatch {
  x: Float
  y: Float
}

type Fem2dSectionPatch {
  name: String
  area: Float
  iy: Float
}

type Fem2dRegionPatch {
  name: String
  outline: [[Float!]!]
  holes: [[[Float!]!]!]
  materialId: String
  meshSize: Float
  thickness: Float
}

type Fem2dSupportPatch {
  nodeId: String
  fixed: [FemDof!]
  tx: Boolean
  ty: Boolean
  rz: Boolean
}

type Fem2dElementPatch {
  kind: String
  start: String
  end: String
  materialId: String
  sectionId: String
}

union Fem2dLoadPatch = Fem2dNodalLoadPatch | Fem2dMemberUdlLoadPatch | Fem2dAreaLoadPatch
type Fem2dNodalLoadPatch { kind: String! nodeId: String dof: FemDof value: Float }
type Fem2dMemberUdlLoadPatch { kind: String! elementId: String wx: Float wy: Float }
type Fem2dAreaLoadPatch { kind: String! regionId: String pressure: Float }
type Fem2dCombinationTermPatch { factor: Float }
type Fem2dCombinationTermRemoval { id: String! index: Unsigned64! }
type Fem2dCombinationTermInsertion { index: Unsigned64! row: FemCombinationTerm! }
type Fem2dCombinationTermRelocation { id: String! from: Unsigned64! to: Unsigned64! }
type Fem2dCombinationTermModification { id: String! patch: Fem2dCombinationTermPatch! }
type Fem2dCombinationTermsDelta { removed: [Fem2dCombinationTermRemoval!]! inserted: [Fem2dCombinationTermInsertion!]! moved: [Fem2dCombinationTermRelocation!]! modified: [Fem2dCombinationTermModification!]! }
type Fem2dCombinationPatch { name: String terms: Fem2dCombinationTermsDelta }
scalar Unsigned64
