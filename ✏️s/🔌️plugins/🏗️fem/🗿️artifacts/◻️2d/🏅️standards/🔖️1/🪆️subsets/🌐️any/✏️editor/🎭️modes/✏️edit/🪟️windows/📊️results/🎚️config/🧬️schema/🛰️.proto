syntax = "proto3";
import "✏️s/🔌️plugins/🏗️fem/⚙️engine/🖥️app-surface/🧬️schema/👁️result-mode/🛰️.proto";
package semio.app.fem.fem2d.results_window_config;
import "🧰️framework/🔨️modules/🖱️ui/🪟️viewport/◻️2d/🧬️schema/🛰️.proto";
enum Fem2dLoopMode {
  FEM_2D_LOOP_MODE_LOOP = 0;
  FEM_2D_LOOP_MODE_PING_PONG = 1;
  FEM_2D_LOOP_MODE_ONCE = 2;
}
enum Fem2dWaveform {
  FEM_2D_WAVEFORM_RAMP = 0;
  FEM_2D_WAVEFORM_SINE = 1;
}
message Fem2dResultsAnimation {
  double phase = 1;
  bool playing = 2;
  double speed = 3;
  Fem2dLoopMode loop_mode = 4;
  Fem2dWaveform waveform = 5;
  bool reverse = 6;
}
message Fem2dResultsWindowConfig {
  semio.framework.ui.viewport.Viewport2d camera = 1;
  optional string result_source_id = 2;
  semio.fem.result_mode.ResultMode result_mode = 3;
  uint32 result_mode_index = 4;
  Fem2dResultsAnimation animation = 5;
}
