syntax = "proto3";
package semio.s.fem.fem2d.snapshot;

// 🧬️ Fem2d snapshot schema
message Fem2dSnapshot {
  // @state artifact
  repeated FemNode nodes = 1;
  // @state artifact
  repeated FemElement elements = 2;
  // @state artifact
  repeated FemRegion regions = 3;
  // @state artifact
  repeated FemMaterial materials = 4;
  // @state artifact
  repeated FemSection sections = 5;
  // @state artifact
  repeated FemSupport supports = 6;
  // @state artifact
  repeated FemLoadCase load_cases = 7;
  // @state artifact
  repeated FemCombination combinations = 8;
  // @state artifact
  FemAnalysisSettings analysis = 9;
}

message FemAnalysisSettings {
  uint64 modal_count = 1;
  uint64 buckling_count = 2;
  double deformation_scale = 3;
}

// 🧱️ Complete domain records referenced by snapshots, mutations and diffs.
enum FemDof { Tx = 0; Ty = 1; Tz = 2; Rx = 3; Ry = 4; Rz = 5; }
message FemMaterial { string id = 1; string name = 2; double e = 3; double nu = 4; double rho = 5;  }
message FemSection { string id = 1; string name = 2; double area = 3; double iy = 4;  }
message FemSupport { string id = 1; string node_id = 2; repeated FemDof fixed = 3; }
message FemLoadCase { string id = 1; string name = 2; repeated FemLoad loads = 3; bool self_weight = 4; }
message FemNodalLoad { string id = 1; string node_id = 2; FemDof dof = 3; double value = 4; }
message FemMemberLoad { string id = 1; string element_id = 2; double wx = 3; double wy = 4;  }
message FemAreaLoad { string id = 1; string region_id = 2; double pressure = 3; }
message FemLoad { oneof kind { FemNodalLoad nodal = 1; FemMemberLoad member_udl = 2; FemAreaLoad area = 3; } }
message FemPoint2 { double x = 1; double y = 2; }
message FemRing { repeated FemPoint2 points = 1; }
message FemBar { string id = 1; string start = 2; string end = 3; string material_id = 4; string section_id = 5; }
message FemNode { string id = 1; double x = 2; double y = 3; }
message FemElement { oneof kind { FemBar bar = 1; FemBar beam = 2; } }
message FemRegion { string id = 1; string name = 2; repeated FemPoint2 outline = 3; repeated FemRing holes = 4; double thickness = 5; string material_id = 6; double mesh_size = 7; }
message FemCombinationTerm { string case_id = 1; double factor = 2; }
message FemCombination { string id = 1; string name = 2; repeated FemCombinationTerm terms = 3; }
