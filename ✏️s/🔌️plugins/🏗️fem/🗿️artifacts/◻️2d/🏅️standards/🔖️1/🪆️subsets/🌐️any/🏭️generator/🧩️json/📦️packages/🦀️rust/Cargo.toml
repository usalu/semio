# 🧭️ Own workspace root: never joins the repository's root workspace, whose root manifest is a shared,
# contended file.
#
# 🚫️ DEPENDS ON `json` (json-rust) AND NOTHING ELSE. The fem plugin itself links `serde_json` and the
# first-party `pack` JSON tree, so a reader built on either would compare the implementation with itself.
#
# The two mesh oracles already registered here (`three-fem2d-mesh-reader`, `manifold-fem2d-mesh-measure`)
# read the STL/OBJ export and therefore see GEOMETRY only — which is why they cover the three
# region kinds and nothing else. This engine is not a replacement for them; it answers the question
# they structurally cannot.
[workspace]

[package]
name = "fem2d-1-any-json-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "generate"
path = "../../🏗️generate/🦀️.rs"

[[bin]]
name = "reader"
path = "../../📖️reader/🦀️.rs"

[lib]
name = "fem2d_json"
path = "../../🦀️.rs"

[dependencies]
json = "0.12"
