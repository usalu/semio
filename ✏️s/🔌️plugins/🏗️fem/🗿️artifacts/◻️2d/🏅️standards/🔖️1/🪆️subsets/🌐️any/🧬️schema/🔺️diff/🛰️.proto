syntax = "proto3";
package semio.s.fem.fem2d.diff;

import "../📸️snapshot/🛰️.proto";

// 🧬️ Fem2d diff schema
message Fem2dDiff {
  // @state artifact
  optional Fem2dNodesDelta nodes = 1;
  // @state artifact
  optional Fem2dElementsDelta elements = 2;
  // @state artifact
  optional Fem2dRegionsDelta regions = 3;
  // @state artifact
  optional Fem2dMaterialsDelta materials = 4;
  // @state artifact
  optional Fem2dSectionsDelta sections = 5;
  // @state artifact
  optional Fem2dSupportsDelta supports = 6;
  // @state artifact
  optional Fem2dLoadCasesDelta load_cases = 7;
  // @state artifact
  optional Fem2dCombinationsDelta combinations = 8;
  // @state artifact
  optional Fem2dAnalysisPatch analysis = 9;
  // @state config
}

message Fem2dNodeRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dNodeInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemNode row = 2;
}

message Fem2dNodeRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dNodesModification {
  string id = 1;
  Fem2dNodePatch patch = 2;
}

message Fem2dNodesDelta {
  repeated Fem2dNodeRemoval removed = 1;
  repeated Fem2dNodeInsertion inserted = 2;
  repeated Fem2dNodeRelocation moved = 3;
  repeated Fem2dNodesModification modified = 4;
}

message Fem2dElementRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dElementInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemElement row = 2;
}

message Fem2dElementRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dElementsModification {
  string id = 1;
  Fem2dElementPatch patch = 2;
}

message Fem2dElementsDelta {
  repeated Fem2dElementRemoval removed = 1;
  repeated Fem2dElementInsertion inserted = 2;
  repeated Fem2dElementRelocation moved = 3;
  repeated Fem2dElementsModification modified = 4;
}

message Fem2dRegionRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dRegionInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemRegion row = 2;
}

message Fem2dRegionRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dRegionsModification {
  string id = 1;
  Fem2dRegionPatch patch = 2;
}

message Fem2dRegionsDelta {
  repeated Fem2dRegionRemoval removed = 1;
  repeated Fem2dRegionInsertion inserted = 2;
  repeated Fem2dRegionRelocation moved = 3;
  repeated Fem2dRegionsModification modified = 4;
}

message Fem2dMaterialRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dMaterialInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemMaterial row = 2;
}

message Fem2dMaterialRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dMaterialsModification {
  string id = 1;
  Fem2dMaterialPatch patch = 2;
}

message Fem2dMaterialsDelta {
  repeated Fem2dMaterialRemoval removed = 1;
  repeated Fem2dMaterialInsertion inserted = 2;
  repeated Fem2dMaterialRelocation moved = 3;
  repeated Fem2dMaterialsModification modified = 4;
}

message Fem2dSectionRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dSectionInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemSection row = 2;
}

message Fem2dSectionRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dSectionsModification {
  string id = 1;
  Fem2dSectionPatch patch = 2;
}

message Fem2dSectionsDelta {
  repeated Fem2dSectionRemoval removed = 1;
  repeated Fem2dSectionInsertion inserted = 2;
  repeated Fem2dSectionRelocation moved = 3;
  repeated Fem2dSectionsModification modified = 4;
}

message Fem2dSupportRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dSupportInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemSupport row = 2;
}

message Fem2dSupportRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dSupportsModification {
  string id = 1;
  Fem2dSupportPatch patch = 2;
}

message Fem2dSupportsDelta {
  repeated Fem2dSupportRemoval removed = 1;
  repeated Fem2dSupportInsertion inserted = 2;
  repeated Fem2dSupportRelocation moved = 3;
  repeated Fem2dSupportsModification modified = 4;
}

message Fem2dLoadCaseRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dLoadCaseInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemLoadCase row = 2;
}

message Fem2dLoadCaseRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dLoadCasesModification {
  string id = 1;
  Fem2dLoadCasePatch patch = 2;
}

message Fem2dLoadCasesDelta {
  repeated Fem2dLoadCaseRemoval removed = 1;
  repeated Fem2dLoadCaseInsertion inserted = 2;
  repeated Fem2dLoadCaseRelocation moved = 3;
  repeated Fem2dLoadCasesModification modified = 4;
}

message Fem2dLoadCasePatch {
  optional string name = 1;
  optional bool self_weight = 2;
  optional Fem2dLoadsDelta loads = 3;
}

message Fem2dLoadRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dLoadInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemLoad row = 2;
}

message Fem2dLoadRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dLoadsModification {
  string id = 1;
  Fem2dLoadPatch patch = 2;
}

message Fem2dLoadsDelta {
  repeated Fem2dLoadRemoval removed = 1;
  repeated Fem2dLoadInsertion inserted = 2;
  repeated Fem2dLoadRelocation moved = 3;
  repeated Fem2dLoadsModification modified = 4;
}

message Fem2dCombinationRemoval {
  string id = 1;
  uint64 index = 2;
}

message Fem2dCombinationInsertion {
  uint64 index = 1;
  semio.s.fem.fem2d.snapshot.FemCombination row = 2;
}

message Fem2dCombinationRelocation {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Fem2dCombinationsModification {
  string id = 1;
  Fem2dCombinationPatch patch = 2;
}

message Fem2dCombinationsDelta {
  repeated Fem2dCombinationRemoval removed = 1;
  repeated Fem2dCombinationInsertion inserted = 2;
  repeated Fem2dCombinationRelocation moved = 3;
  repeated Fem2dCombinationsModification modified = 4;
}

message Fem2dAnalysisPatch {
  optional uint32 modal_count = 1;
  optional uint32 buckling_count = 2;
  optional double deformation_scale = 3;
}

// 🧱️ Sparse material changes preserve field presence.
message Fem2dMaterialPatch {
  optional string name = 1;
  optional double e = 2;
  optional double nu = 3;
  optional double rho = 4;
}

message Fem2dNodePatch {
  optional double x = 1;
  optional double y = 2;
}

message Fem2dSectionPatch {
  optional string name = 1;
  optional double area = 2;
  optional double iy = 3;
}

message Fem2dGeometryHoles { repeated semio.s.fem.fem2d.snapshot.FemRing rings = 1; }
message Fem2dRegionPatch {
  optional string name = 1;
  semio.s.fem.fem2d.snapshot.FemRing outline = 2;
  Fem2dGeometryHoles holes = 3;
  optional double thickness = 4;
  optional string material_id = 5;
  optional double mesh_size = 6;
}

message Fem2dFixedDofs { repeated semio.s.fem.fem2d.snapshot.FemDof values = 1; }
message Fem2dSupportPatch {
  optional string node_id = 1;
  Fem2dFixedDofs fixed = 2;
  optional bool tx = 3;
  optional bool ty = 4;
  optional bool rz = 5;
}

message Fem2dElementPatch {
  optional string kind = 1;
  optional string start = 2;
  optional string end = 3;
  optional string material_id = 4;
  optional string section_id = 5;
}

message Fem2dNodalLoadPatch { optional string node_id = 1; optional semio.s.fem.fem2d.snapshot.FemDof dof = 2; optional double value = 3; }
message Fem2dMemberUdlLoadPatch { optional string element_id = 1; optional double wx = 2; optional double wy = 3; }
message Fem2dAreaLoadPatch { optional string region_id = 1; optional double pressure = 2; }
message Fem2dLoadPatch { oneof kind { Fem2dNodalLoadPatch nodal = 1; Fem2dMemberUdlLoadPatch member_udl = 2; Fem2dAreaLoadPatch area = 3; } }
message Fem2dCombinationTermPatch { optional double factor = 1; }
message Fem2dCombinationTermRemoval { string id = 1; uint64 index = 2; }
message Fem2dCombinationTermInsertion { uint64 index = 1; semio.s.fem.fem2d.snapshot.FemCombinationTerm row = 2; }
message Fem2dCombinationTermRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Fem2dCombinationTermModification { string id = 1; Fem2dCombinationTermPatch patch = 2; }
message Fem2dCombinationTermsDelta { repeated Fem2dCombinationTermRemoval removed = 1; repeated Fem2dCombinationTermInsertion inserted = 2; repeated Fem2dCombinationTermRelocation moved = 3; repeated Fem2dCombinationTermModification modified = 4; }
message Fem2dCombinationPatch { optional string name = 1; Fem2dCombinationTermsDelta terms = 2; }
