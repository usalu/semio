# 🧬️ Typed Fem2d mutation payloads and their discriminated union.
scalar Binary64

union Fem2dMutation = Fem2dCreateNode | Fem2dDeleteNode | Fem2dCreateElement | Fem2dDeleteElement | Fem2dReplaceElement | Fem2dCreateMaterial | Fem2dDeleteMaterial | Fem2dReplaceMaterial | Fem2dChangeMaterial | Fem2dCreateSection | Fem2dDeleteSection | Fem2dReplaceSection | Fem2dCreateSupport | Fem2dDeleteSupport | Fem2dReplaceSupport | Fem2dCreateRegion | Fem2dDeleteRegion | Fem2dReplaceRegion | Fem2dCreateLoadCase | Fem2dDeleteLoadCase | Fem2dAddLoad | Fem2dRemoveLoad | Fem2dChangeLoadCaseSelfWeight | Fem2dCreateCombination | Fem2dDeleteCombination | Fem2dUpdateAnalysisSettings | Fem2dReplaceNode | Fem2dReplaceLoad | Fem2dChangeLoadCaseName | Fem2dReplaceCombination | Fem2dMoveSelection | Fem2dChangeNode | Fem2dChangeSection | Fem2dChangeRegion | Fem2dChangeSupport | Fem2dChangeElement | Fem2dChangeLoad | Fem2dChangeCombinationName | Fem2dChangeCombinationTerm

