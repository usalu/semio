# 🧬️ Fem2d artifact schema — every field with its state class.

type Fem2dArtifact {
  nodes: [FemNode!]! @state(class: ARTIFACT)
  elements: [FemElement!]! @state(class: ARTIFACT)
  regions: [FemRegion!]! @state(class: ARTIFACT)
  materials: [FemMaterial!]! @state(class: ARTIFACT)
  sections: [FemSection!]! @state(class: ARTIFACT)
  supports: [FemSupport!]! @state(class: ARTIFACT)
  loadCases: [FemLoadCase!]! @state(class: ARTIFACT)
  combinations: [FemCombination!]! @state(class: ARTIFACT)
  analysis: FemAnalysisSettings! @state(class: ARTIFACT)
}

type FemCamera {
  x: Float!
  y: Float!
  zoom: Float!
}

type FemAnalysisSettings {
  modalCount: Int!
  bucklingCount: Int!
  deformationScale: Float!
}

type FemNode {
  id: String!
  x: Float!
  y: Float!
}

scalar FemElement

type FemRegion {
  id: String!
  name: String!
  outline: [[Float!]!]!
  holes: [[[Float!]!]!]!
  thickness: Float!
  materialId: String!
  meshSize: Float!
}

type FemMaterial {
  id: String!
  name: String!
  e: Float!
  nu: Float!
  rho: Float!
}

type FemSection {
  id: String!
  name: String!
  area: Float!
  iy: Float!
}

type FemSupport {
  id: String!
  nodeId: String!
  fixed: [String!]!
}
