[package]
workspace = "../.."
name = "semio-s-artifact-fem-2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FEM 2d artifact: definition, declaration and registration over the fem 2d crates"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-s-fem-node = { path = "../../../../⚙️engine/📍node/📦️packages/🦀️rust" }
semio-s-fem-material = { path = "../../../../⚙️engine/🧱️material/📦️packages/🦀️rust" }
semio-framework-geometry = { path = "../../../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-s-artifact-fem-2d-editor = { workspace = true }
semio-s-artifact-fem-2d-io = { workspace = true }
semio-s-artifact-fem-2d-model = { workspace = true }
semio-s-artifact-fem-2d-viewer = { workspace = true }

[dev-dependencies]
pack = { workspace = true }
semio-framework-trace = { workspace = true }
# 🔮 Test-only CSV ORACLE: the third-party `csv` reader parses the node table export.
csv = "1"
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-async = { workspace = true }

semio-framework-async-macros = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-value = { workspace = true }
serde_json = { workspace = true }
semio-framework-test-original-snapshot-owners = { path = "../../../../../../../🧰️framework/🔨️modules/🧪️test/🛬️original-snapshot-owners/📦️packages/🦀️rust" }
