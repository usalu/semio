# 🧬️ Fem2d artifact schema — every field with its state class.

type Fem2dArtifact {
  nodes: [FemNode!]! @state(class: PERSISTENT)
  elements: [FemElement!]! @state(class: PERSISTENT)
  regions: [FemRegion!]! @state(class: PERSISTENT)
  materials: [FemMaterial!]! @state(class: PERSISTENT)
  sections: [FemSection!]! @state(class: PERSISTENT)
  supports: [FemSupport!]! @state(class: PERSISTENT)
  loadCases: [FemLoadCase!]! @state(class: PERSISTENT)
  combinations: [FemCombination!]! @state(class: PERSISTENT)
  analysis: FemAnalysisSettings! @state(class: PERSISTENT)
  resultSourceId: String @state(class: SHARED_UI)
  resultMode: String! @state(class: SHARED_UI)
  resultModeIndex: Int! @state(class: SHARED_UI)
  camera: FemCamera! @state(class: LOCAL_UI)
  locale: String! @state(class: LOCAL_UI)
  solverResultsJson: String! @state(class: PREVIEW)
  meshPreviewJson: String! @state(class: PREVIEW)
}

