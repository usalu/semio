# 🧬️ Fem3d snapshot schema — persistent fields only.

type Fem3dSnapshot {
  nodes: [FemNode!]! @state(class: PERSISTENT)
  elements: [FemElement!]! @state(class: PERSISTENT)
  materials: [FemMaterial!]! @state(class: PERSISTENT)
  sections: [FemSection!]! @state(class: PERSISTENT)
  solids: [FemSolid!]! @state(class: PERSISTENT)
  supports: [FemSupport!]! @state(class: PERSISTENT)
  loadCases: [FemLoadCase!]! @state(class: PERSISTENT)
  combinations: [FemCombination!]! @state(class: PERSISTENT)
  analysis: FemAnalysisSettings! @state(class: PERSISTENT)
}

