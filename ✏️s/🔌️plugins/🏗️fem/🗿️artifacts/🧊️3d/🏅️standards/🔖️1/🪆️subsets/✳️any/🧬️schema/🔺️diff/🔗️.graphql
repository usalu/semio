# 🧬️ Fem3d diff schema — sparse field delta.

type Fem3dDiff {
  artifact: Fem3dArtifact @state(class: ARTIFACT)
  nodes: Fem3dNodesDelta @state(class: ARTIFACT)
  elements: Fem3dElementsDelta @state(class: ARTIFACT)
  materials: Fem3dMaterialsDelta @state(class: ARTIFACT)
  sections: Fem3dSectionsDelta @state(class: ARTIFACT)
  solids: Fem3dSolidsDelta @state(class: ARTIFACT)
  supports: Fem3dSupportsDelta @state(class: ARTIFACT)
  loadCases: Fem3dLoadCasesDelta @state(class: ARTIFACT)
  combinations: Fem3dCombinationsDelta @state(class: ARTIFACT)
  analysis: FemAnalysisSettings @state(class: ARTIFACT)
  resultSourceId: String @state(class: PRESENCE)
  resultMode: String @state(class: PRESENCE)
  resultModeIndex: Int @state(class: PRESENCE)
  camera: FemCamera @state(class: CONFIG)
  solverResultsJson: String @state(class: ARTIFACT)
  meshPreviewJson: String @state(class: ARTIFACT)
}

type Fem3dNodesDelta {
  added: [FemNode!]!
  removed: [String!]!
  patched: [Fem3dNodesPatchEntry!]!
  reordered: [String!]
}

type Fem3dNodesPatchEntry {
  id: String!
  item: FemNode!
}

type Fem3dElementsDelta {
  added: [FemElement!]!
  removed: [String!]!
  patched: [Fem3dElementsPatchEntry!]!
  reordered: [String!]
}

type Fem3dElementsPatchEntry {
  id: String!
  item: FemElement!
}

type Fem3dMaterialsDelta {
  added: [FemMaterial!]!
  removed: [String!]!
  patched: [Fem3dMaterialsPatchEntry!]!
  reordered: [String!]
}

type Fem3dMaterialsPatchEntry {
  id: String!
  item: FemMaterial!
}

type Fem3dSectionsDelta {
  added: [FemSection!]!
  removed: [String!]!
  patched: [Fem3dSectionsPatchEntry!]!
  reordered: [String!]
}

type Fem3dSectionsPatchEntry {
  id: String!
  item: FemSection!
}

type Fem3dSolidsDelta {
  added: [FemSolid!]!
  removed: [String!]!
  patched: [Fem3dSolidsPatchEntry!]!
  reordered: [String!]
}

type Fem3dSolidsPatchEntry {
  id: String!
  item: FemSolid!
}

type Fem3dSupportsDelta {
  added: [FemSupport!]!
  removed: [String!]!
  patched: [Fem3dSupportsPatchEntry!]!
  reordered: [String!]
}

type Fem3dSupportsPatchEntry {
  id: String!
  item: FemSupport!
}

type Fem3dLoadCasesDelta {
  added: [FemLoadCase!]!
  removed: [String!]!
  patched: [Fem3dLoadCasesPatchEntry!]!
  reordered: [String!]
}

type Fem3dLoadCasesPatchEntry {
  id: String!
  item: FemLoadCase!
}

type Fem3dCombinationsDelta {
  added: [FemCombination!]!
  removed: [String!]!
  patched: [Fem3dCombinationsPatchEntry!]!
  reordered: [String!]
}

type Fem3dCombinationsPatchEntry {
  id: String!
  item: FemCombination!
}

