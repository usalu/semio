# 🧬️ Fem3d artifact schema — every field with its state class.

type Fem3dArtifact {
  nodes: [FemNode!]! @state(class: ARTIFACT)
  elements: [FemElement!]! @state(class: ARTIFACT)
  materials: [FemMaterial!]! @state(class: ARTIFACT)
  sections: [FemSection!]! @state(class: ARTIFACT)
  solids: [FemSolid!]! @state(class: ARTIFACT)
  supports: [FemSupport!]! @state(class: ARTIFACT)
  loadCases: [FemLoadCase!]! @state(class: ARTIFACT)
  combinations: [FemCombination!]! @state(class: ARTIFACT)
  analysis: FemAnalysisSettings! @state(class: ARTIFACT)
  resultSourceId: String @state(class: PRESENCE)
  resultMode: String! @state(class: PRESENCE)
  resultModeIndex: Int! @state(class: PRESENCE)
  camera: FemCamera! @state(class: CONFIG)
  solverResultsJson: String! @state(class: ARTIFACT)
  meshPreviewJson: String! @state(class: ARTIFACT)
}

