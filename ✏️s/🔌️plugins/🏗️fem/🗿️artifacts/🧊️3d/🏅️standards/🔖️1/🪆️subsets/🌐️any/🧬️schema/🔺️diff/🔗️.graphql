type Fem3dLoadCasePatch {
  name: String
  selfWeight: Boolean
  loads: Fem3dLoadsDelta
}

type Fem3dLoadRemoval {
  id: String!
  index: Int!
}

type Fem3dLoadInsertion {
  index: Int!
  row: FemLoad!
}

type Fem3dLoadRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Fem3dLoadsModification {
  id: String!
  patch: Fem3dLoadPatch!
