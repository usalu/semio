# 🧬️ Fem3d diff schema — sparse field delta.

type Fem3dDiff {
  nodes: Fem3dNodesDelta @state(class: ARTIFACT)
  elements: Fem3dElementsDelta @state(class: ARTIFACT)
  materials: Fem3dMaterialsDelta @state(class: ARTIFACT)
  sections: Fem3dSectionsDelta @state(class: ARTIFACT)
  solids: Fem3dSolidsDelta @state(class: ARTIFACT)
  supports: Fem3dSupportsDelta @state(class: ARTIFACT)
  loadCases: Fem3dLoadCasesDelta @state(class: ARTIFACT)
  combinations: Fem3dCombinationsDelta @state(class: ARTIFACT)
  analysis: Fem3dAnalysisPatch @state(class: ARTIFACT)
}

type Fem3dNodeRemoval {
  id: String!
  index: Int!
}

type Fem3dNodeInsertion {
  index: Int!
  row: FemNode!
}

type Fem3dNodeRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Fem3dNodesModification {
  id: String!
  patch: FemNode!
}

type Fem3dNodesDelta {
  removed: [Fem3dNodeRemoval!]!
  inserted: [Fem3dNodeInsertion!]!
  moved: [Fem3dNodeRelocation!]!
  modified: [Fem3dNodesModification!]!
}

