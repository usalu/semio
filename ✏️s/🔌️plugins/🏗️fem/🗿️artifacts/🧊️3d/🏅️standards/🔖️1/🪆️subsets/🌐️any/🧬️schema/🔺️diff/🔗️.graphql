type Fem3dAnalysisPatch {
  modalCount: Int
  bucklingCount: Int
  deformationScale: Float
}

# 🧱️ Sparse material changes preserve independent fields.
type Fem3dMaterialPatch {
  name: String
  e: Float
  nu: Float
  rho: Float
  g: Float
}

type Fem3dNodePatch {
  x: Float
  y: Float
  z: Float
}

type Fem3dSectionPatch {
  name: String
  area: Float
  iy: Float
  iz: Float
  j: Float
}

type Fem3dSolidPatch {
  name: String
  outline: [[Float!]!]
  holes: [[[Float!]!]!]
  materialId: String
  meshSize: Float
  baseZ: Float
  height: Float
  layers: Unsigned64
  axis: FemAxis
}

scalar Unsigned64

type Fem3dSupportPatch {
  nodeId: String
  fixed: [FemDof!]
  tx: Boolean
  ty: Boolean
  tz: Boolean
  rx: Boolean
  ry: Boolean
  rz: Boolean
}

type Fem3dElementPatch {
  kind: String
  start: String
  end: String
  materialId: String
  sectionId: String
  roll: Float
}

union Fem3dLoadPatch = Fem3dNodalLoadPatch | Fem3dMemberUdlLoadPatch | Fem3dAreaLoadPatch
type Fem3dNodalLoadPatch { kind: String! nodeId: String dof: FemDof value: Float }
type Fem3dMemberUdlLoadPatch { kind: String! elementId: String wx: Float wy: Float wz: Float }
type Fem3dAreaLoadPatch { kind: String! solidId: String pressure: Float }
"""🗂️ Shared keyed MapDelta wire with finite numeric set payloads."""
scalar Fem3dCombinationTermsDelta
type Fem3dCombinationPatch { name: String terms: Fem3dCombinationTermsDelta }
