# 🧬️ Fem3d diff schema — sparse field delta.

type Fem3dDiff {
  nodes: Fem3dNodesDelta @state(class: ARTIFACT)
  elements: Fem3dElementsDelta @state(class: ARTIFACT)
  materials: Fem3dMaterialsDelta @state(class: ARTIFACT)
  sections: Fem3dSectionsDelta @state(class: ARTIFACT)
  solids: Fem3dSolidsDelta @state(class: ARTIFACT)
  supports: Fem3dSupportsDelta @state(class: ARTIFACT)
  loadCases: Fem3dLoadCasesDelta @state(class: ARTIFACT)
  combinations: Fem3dCombinationsDelta @state(class: ARTIFACT)
  analysis: Fem3dAnalysisPatch @state(class: ARTIFACT)
}

type Fem3dNodeRemoval {
  id: String!
  index: Int!
}

type Fem3dNodeInsertion {
  index: Int!
  row: FemNode!
}

type Fem3dNodeRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Fem3dNodesModification {
  id: String!
  patch: Fem3dNodePatch!
}

type Fem3dNodesDelta {
  removed: [Fem3dNodeRemoval!]!
  inserted: [Fem3dNodeInsertion!]!
  moved: [Fem3dNodeRelocation!]!
  modified: [Fem3dNodesModification!]!
}

type Fem3dElementRemoval {
  id: String!
  index: Int!
}

type Fem3dElementInsertion {
  index: Int!
  row: FemElement!
}

type Fem3dElementRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Fem3dElementsModification {
  id: String!
  patch: Fem3dElementPatch!
}

type Fem3dElementsDelta {
  removed: [Fem3dElementRemoval!]!
  inserted: [Fem3dElementInsertion!]!
  moved: [Fem3dElementRelocation!]!
  modified: [Fem3dElementsModification!]!
}

type Fem3dMaterialRemoval {
  id: String!
  index: Int!
}

type Fem3dMaterialInsertion {
  index: Int!
  row: FemMaterial!
}

type Fem3dMaterialRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Fem3dMaterialsModification {
  id: String!
  patch: Fem3dMaterialPatch!
}

type Fem3dMaterialsDelta {
  removed: [Fem3dMaterialRemoval!]!
  inserted: [Fem3dMaterialInsertion!]!
  moved: [Fem3dMaterialRelocation!]!
  modified: [Fem3dMaterialsModification!]!
}

