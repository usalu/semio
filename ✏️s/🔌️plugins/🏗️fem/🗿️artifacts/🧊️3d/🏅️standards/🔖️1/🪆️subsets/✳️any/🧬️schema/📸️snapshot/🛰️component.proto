syntax = "proto3";
package semio.s.fem.fem3d.snapshot;

// 🧬️ Fem3d snapshot schema
message Fem3dSnapshot {
  // @state artifact
  repeated FemNode nodes = 1;
  // @state artifact
  repeated FemElement elements = 2;
  // @state artifact
  repeated FemMaterial materials = 3;
  // @state artifact
  repeated FemSection sections = 4;
  // @state artifact
  repeated FemSolid solids = 5;
  // @state artifact
  repeated FemSupport supports = 6;
  // @state artifact
  repeated FemLoadCase load_cases = 7;
  // @state artifact
  repeated FemCombination combinations = 8;
  // @state artifact
  FemAnalysisSettings analysis = 9;
}

