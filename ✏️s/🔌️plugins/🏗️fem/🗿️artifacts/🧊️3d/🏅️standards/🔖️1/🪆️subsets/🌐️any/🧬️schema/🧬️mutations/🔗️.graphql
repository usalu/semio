  index: Int
}

type Fem3dDeleteSection {
  id: String!
}

type Fem3dReplaceSection {
  id: String!
  newSection: FemSection!
}

type Fem3dCreateSupport {
  support: FemSupport!
  index: Int
}

type Fem3dDeleteSupport {
  id: String!
}

type Fem3dReplaceSupport {
  id: String!
  newSupport: FemSupport!
}

