# 🧬️ Typed Fem3d mutation payloads and their discriminated union.
scalar Binary64

union Fem3dMutation = Fem3dCreateNode | Fem3dDeleteNode | Fem3dCreateElement | Fem3dDeleteElement | Fem3dReplaceElement | Fem3dCreateMaterial | Fem3dDeleteMaterial | Fem3dReplaceMaterial | Fem3dChangeMaterial | Fem3dCreateSection | Fem3dDeleteSection | Fem3dReplaceSection | Fem3dCreateSupport | Fem3dDeleteSupport | Fem3dReplaceSupport | Fem3dCreateSolid | Fem3dDeleteSolid | Fem3dReplaceSolid | Fem3dCreateLoadCase | Fem3dDeleteLoadCase | Fem3dAddLoad | Fem3dRemoveLoad | Fem3dChangeLoadCaseSelfWeight | Fem3dCreateCombination | Fem3dDeleteCombination | Fem3dUpdateAnalysisSettings | Fem3dReplaceNode | Fem3dReplaceLoad | Fem3dChangeLoadCaseName | Fem3dReplaceCombination | Fem3dMoveSelection | Fem3dChangeNode | Fem3dChangeSection | Fem3dChangeSolid | Fem3dChangeSupport | Fem3dChangeElement | Fem3dChangeLoad | Fem3dChangeCombinationName | Fem3dChangeCombinationTerm

type Fem3dCreateNode {
  node: FemNode!
  index: Int
}

type Fem3dDeleteNode {
  id: String!
}

type Fem3dCreateElement {
  element: FemElement!
  index: Int
}

