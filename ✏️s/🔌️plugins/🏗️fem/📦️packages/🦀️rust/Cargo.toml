[package]
name = "semio-s-plugin-fem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FEM plugin composition for independently packaged 2D and 3D artifacts"

[lints]
workspace = true

[package.metadata.component]
package = "semio:fem"

[package.metadata.semio]
role = "plugin"

# 📚️ Storybook coverage opt-in — read by `.storybook/scopes.ts`'s `buildGeneratedScopes`, which resolves
# `sourceRoots` against this package's discovered owner root and derives the story glob
# `./stories/fem/**` from `id`. Stories live in `.storybook/stories/fem/`.
[package.metadata.semio.storybook]
id = "fem"
titlePrefix = "🏗️fem"
sourceRoots = ["."]

[[package.metadata.semio.playground]]
variant = "fem2d"
app = "s.fem.fem2d@1/*#editor"
aliases = ["fem 2d"]
ports = { react = 6086, wgpu = 6186 }

[[package.metadata.semio.playground]]
variant = "fem3d"
app = "s.fem.fem3d@1/*#editor"
aliases = ["fem 3d"]
ports = { react = 6087, wgpu = 6187 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it: two crates defining that symbol in one component is a
# `rust-lld: duplicate symbol` link error, and the embedder must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-artifact-fem-2d = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-fem-3d = { workspace = true, features = ["component-app-assembly"] }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
