[package]
name = "semio-s-plugin-fem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FEM plugin - one crate for the fem2d/fem3d artifacts (diff/op/dsl/pack/spr/engine) and their play apps (commands/modes/windows), sharing a cross-artifact fem_core kernel"

[lints]
workspace = true

[package.metadata.component]
package = "semio:fem"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "fem2d"
app = "fem2d-play"
aliases = ["fem 2d"]
ports = { react = 6086, wgpu = 6186 }

[[package.metadata.semio.playground]]
variant = "fem3d"
app = "fem3d-play"
aliases = ["fem 3d"]
ports = { react = 6087, wgpu = 6187 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
pack = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
mathematical_algebra = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/➕️algebra/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-algebra" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
spade = "2.15.1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }

# 🚧️ TEMPORARY VERIFICATION OVERLAY — delete this whole block (and the nested target/Cargo.lock it
# creates) at registrar handoff. Makes this manifest its own workspace root so `cargo check
# --manifest-path …` works before the crate is a real root-workspace member (see TEMPLATE.md §3,
# "The chicken-and-egg, and how to verify anyway"). Copied verbatim from root Cargo.toml.
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
thiserror = "2.0.18"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
# END TEMPORARY VERIFICATION OVERLAY
