[package]
name = "semio-s-plugin-norm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Norm plugin — fifteen compliance-standard document apps (DIN/EN/ISO/VDI) with headless NormHost-backed checking in one hot-swappable WASM component"

[lints]
workspace = true

[package.metadata.component]
package = "semio:norm"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "din4108"
app = "s.norm.din4108@1/*#editor"
ports = { react = 6091, wgpu = 6191 }

[[package.metadata.semio.playground]]
variant = "din16798"
app = "s.norm.din16798@1/*#editor"
ports = { react = 6092, wgpu = 6192 }

[[package.metadata.semio.playground]]
variant = "din18599"
app = "s.norm.din18599@1/*#editor"
ports = { react = 6093, wgpu = 6193 }

[[package.metadata.semio.playground]]
variant = "en1990"
app = "s.norm.en1990@1/*#editor"
ports = { react = 6094, wgpu = 6194 }

[[package.metadata.semio.playground]]
variant = "en1991"
app = "s.norm.en1991@1/*#editor"
ports = { react = 6095, wgpu = 6195 }

[[package.metadata.semio.playground]]
variant = "en1992"
app = "s.norm.en1992@1/*#editor"
ports = { react = 6096, wgpu = 6196 }

