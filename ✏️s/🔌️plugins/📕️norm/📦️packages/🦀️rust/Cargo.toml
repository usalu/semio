[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[features]
default = []
cross-fem = ["semio-s-artifact-norm-en1992/cross-fem", "semio-s-artifact-norm-en1993/cross-fem"]

[dependencies]
semio-framework-dispatch-macros = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-s-artifact-norm-din4108 = { workspace = true }
semio-s-artifact-norm-din16798 = { workspace = true }
semio-s-artifact-norm-din18599 = { workspace = true }
