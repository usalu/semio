[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[features]
default = []
cross-fem = ["dep:fem"]

[dependencies]
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
# 🏗️ Cross-plugin: EN 1992/EN 1993 solve a simply supported beam with the FEM plugin's shared kernel
# (optional until `semio-s-plugin-fem` completes Wave 4 mutations migration).
fem = { path = "../../../🏗️fem/📦️packages/🦀️rust", package = "semio-s-plugin-fem", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
