[package]
workspace = "../../.."
name = "semio-s-plugin-norm-compliance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Norm compliance: check reports, clauses, quantities, remedies and the norm artifact record"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
compliance-testing = ["dep:serde", "dep:serde_json", "dep:semio-framework-artifact-reference"]

[dependencies]
pack = { workspace = true }
semio-framework-artifact-reference = { workspace = true, optional = true }
semio-framework-diagnostic = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-dsl-record-derive = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
semio-framework-artifact-reference = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
serde_json = { workspace = true }
