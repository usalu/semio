[package]
workspace = "../../.."
name = "semio-s-plugin-norm-compliance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Norm compliance facade: re-exports the core and adds the norm family, incremental evaluation, design cases, reasons and the norm artifact record"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
test-support = ["dep:serde"]
compliance-testing = ["semio-s-plugin-norm-compliance-core/compliance-testing", "dep:serde", "dep:serde_json", "dep:semio-framework-artifact-reference"]

[dependencies]
pack = { workspace = true }
semio-framework-artifact-reference = { workspace = true, optional = true }
semio-framework-diagnostic = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-dsl-record-derive = { workspace = true }
semio-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-schema = { workspace = true }
semio-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-plugin-norm-compliance-core = { path = "../../🧱️core/📦️packages/🦀️rust" }
semio-s-plugin-norm-ndp = { path = "../../📜️annex-and-tables/🔖️ndp/📦️packages/🦀️rust" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
semio-s-plugin-norm-compliance-core = { path = "../../🧱️core/📦️packages/🦀️rust", features = ["compliance-testing"] }
semio-framework-artifact-reference = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
serde_json = { workspace = true }
