type CheckReport {
  summary: CheckReportSummary!
  checks: [CheckResult!]!
}
enum QuantityKind {
  Dimensionless
  Length
  Area
  Volume
  Mass
  Time
  Temperature
  Force
  Pressure
  Stress
  Moment
  Energy
  Power
  ThermalConductivity
  ThermalResistance
  HeatTransferCoefficient
  AirPermeability
  VentilationRate
  Acceleration
  Velocity
}
type Quantity {
  kind: QuantityKind!
  value: Float!
}
type ClauseId {
  family: String!
  part: String!
  section: String!
}
type LocalizedCopy {
  en: String!
  de: String!
}
type SubjectRef {
  entityId: String!
  path: String!
  label: LocalizedCopy!
}
enum CheckStatus {
  Pass
  Warning
  Fail
  NotApplicable
  UnverifiedBasis
  Info
}
enum AnnexChoice {
  En
  De
}
enum RemedyBound {
  AtLeast
  AtMost
  Exactly
  OneOf
  Remove
  Insert
}
type Remedy {
  target: SubjectRef!
  current: Quantity!
  required: Quantity!
  bound: RemedyBound!
  options: [String!]!
  action: LocalizedCopy!
  applicable: Boolean!
}
type CheckResult {
  id: String!
  part: String!
  clause: ClauseId!
  subject: SubjectRef!
  status: CheckStatus!
  title: LocalizedCopy!
  explanation: LocalizedCopy!
  computed: Quantity!
  limit: Quantity!
  utilization: Float!
  annex: AnnexChoice!
  remedies: [Remedy!]!
  ndps: [String!]!
  stations: [Station!]!
  stationField: String!
}
type Station {
  at: [Float!]!
  utilization: Float!
  values: [Quantity!]!
}
type PartVerdict {
  part: String!
  pass: Int!
  warning: Int!
  fail: Int!
  notApplicable: Int!
  unverified: Int!
  worstUtilization: Float!
  complies: Boolean!
  info: Int!
}
type CheckReportSummary {
  total: Int!
  pass: Int!
  warning: Int!
  fail: Int!
  notApplicable: Int!
  unverified: Int!
  worstUtilization: Float!
  complies: Boolean!
  parts: [PartVerdict!]!
  info: Int!
}
enum NdpStatus {
  verified
  unverified
}
scalar NdpValue
type NdpSource {
  document: String!
  edition: String!
  locator: String!
}
type NdpAnnexVerification {
  status: NdpStatus!
  evidence: String!
}
type NdpAnnexStatus {
  en: NdpAnnexVerification!
  naDe: NdpAnnexVerification!
}
type NdpEntry {
  id: String!
  code: String!
  part: String!
  clause: String!
  symbol: String!
  unit: String!
  specRef: String!
  asWritten: String!
  recommended: NdpValue!
  naDe: NdpValue!
  source: NdpSource!
  status: NdpStatus!
  evidence: String!
  annexStatus: NdpAnnexStatus
}
type NdpRegistry {
  entries: [NdpEntry!]!
}
