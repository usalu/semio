# 🧬️ Din18599 diff schema — keyed sparse diff: scalar setters, id/index/key keyed row diffs and per-field section patches.

type Din18599ZonesPatch {
  labelEn: String
  labelDe: String
  usageProfile: UsageProfile
  areaM2: Float
  volumeM3: Float
  thetaIHeatC: Float
  thetaICoolC: Float
  occupants: Int
  internalGainsWM2: Float
  lightingPowerWM2: Float
}

type Din18599ZonesRemoved {
  id: String!
  index: Int!
}

type Din18599ZonesInserted {
  index: Int!
  row: ThermalZone!
}

type Din18599ZonesMoved {
  id: String!
  from: Int!
  to: Int!
}

type Din18599ZonesModified {
  id: String!
  patch: Din18599ZonesPatch!
}

type Din18599ZonesRows {
  removed: [Din18599ZonesRemoved!]!
  inserted: [Din18599ZonesInserted!]!
  moved: [Din18599ZonesMoved!]!
  modified: [Din18599ZonesModified!]!
}

type Din18599ElementsPatch {
  labelEn: String
  labelDe: String
  kind: ElementKind
  zoneId: String
  areaM2: Float
  uValueWM2k: Float
  orientationDeg: Float
  tiltDeg: Float
  gValue: Float
  fc: Float
  adjacency: Adjacency
}

type Din18599ElementsRemoved {
  id: String!
  index: Int!
}

type Din18599ElementsInserted {
  index: Int!
  row: EnvelopeElement!
}

type Din18599ElementsMoved {
  id: String!
  from: Int!
  to: Int!
}

type Din18599ElementsModified {
  id: String!
  patch: Din18599ElementsPatch!
}

type Din18599ElementsRows {
  removed: [Din18599ElementsRemoved!]!
  inserted: [Din18599ElementsInserted!]!
  moved: [Din18599ElementsMoved!]!
  modified: [Din18599ElementsModified!]!
}

type Din18599HeatingPatch {
  generationEfficiency: Float
  distributionEfficiency: Float
  storageEfficiency: Float
  transferEfficiency: Float
  energyCarrier: String
}

type Din18599DhwPatch {
  specificDemandKwhPersonA: Float
  storageLossKwhA: Float
  distributionLossKwhA: Float
  energyCarrier: String
}

type Din18599VentilationPatch {
  airflowM3H: Float
  heatRecoveryEta: Float
  fanPowerW: Float
}

type Din18599CoolingPatchPlantValue {
  value: CoolingPlant
}

type Din18599CoolingPatch {
  plant: Din18599CoolingPatchPlantValue
}

type Din18599LightingPatch {
  controlFactor: Float
}

type Din18599RenewablesPatch {
  pvAreaM2: Float
  pvEfficiency: Float
  solarThermalKwhA: Float
}

type Din18599ClimatePatch {
  thetaEC: [Float!]
  gHWM2: [Float!]
}

type Din18599Diff {
  buildingCategory: BuildingCategory @state(class: ARTIFACT)
  attachment: Attachment @state(class: ARTIFACT)
  useClass: UseClass @state(class: ARTIFACT)
  method: CalculationMethod @state(class: ARTIFACT)
  netFloorAreaM2: Float @state(class: ARTIFACT)
  heatedVolumeM3: Float @state(class: ARTIFACT)
  gegQpFactor: Float @state(class: ARTIFACT)
  deltaUWbWM2k: Float @state(class: ARTIFACT)
  automationClass: AutomationClass @state(class: ARTIFACT)
  zones: Din18599ZonesRows @state(class: ARTIFACT)
  elements: Din18599ElementsRows @state(class: ARTIFACT)
  heating: Din18599HeatingPatch @state(class: ARTIFACT)
  dhw: Din18599DhwPatch @state(class: ARTIFACT)
  ventilation: Din18599VentilationPatch @state(class: ARTIFACT)
  cooling: Din18599CoolingPatch @state(class: ARTIFACT)
  lighting: Din18599LightingPatch @state(class: ARTIFACT)
  renewables: Din18599RenewablesPatch @state(class: ARTIFACT)
  climate: Din18599ClimatePatch @state(class: ARTIFACT)
}
