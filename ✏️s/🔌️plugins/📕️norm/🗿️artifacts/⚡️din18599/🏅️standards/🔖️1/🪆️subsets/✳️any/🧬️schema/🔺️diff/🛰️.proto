syntax = "proto3";
package semio.s.norm.din18599.diff;

message Din18599ZonesPatch {
  optional string label_en = 1;
  optional string label_de = 2;
  optional double area_m2 = 3;
  optional double volume_m3 = 4;
  optional double theta_i_heat_c = 5;
  optional double theta_i_cool_c = 6;
  optional uint32 occupants = 7;
  optional double internal_gains_w_m2 = 8;
  optional double lighting_power_w_m2 = 9;
}

message Din18599ZonesRemoved {
  string id = 1;
  uint64 index = 2;
}

message Din18599ZonesInserted {
  uint64 index = 1;
}

message Din18599ZonesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Din18599ZonesModified {
  string id = 1;
  Din18599ZonesPatch patch = 2;
}

message Din18599ZonesRows {
  repeated Din18599ZonesRemoved removed = 1;
  repeated Din18599ZonesInserted inserted = 2;
  repeated Din18599ZonesMoved moved = 3;
  repeated Din18599ZonesModified modified = 4;
}

message Din18599ElementsPatch {
  optional string label_en = 1;
  optional string label_de = 2;
  optional string zone_id = 3;
  optional double area_m2 = 4;
  optional double u_value_w_m2k = 5;
  optional double orientation_deg = 6;
  optional double tilt_deg = 7;
  optional double g_value = 8;
  optional double fc = 9;
}

message Din18599ElementsRemoved {
  string id = 1;
  uint64 index = 2;
}

message Din18599ElementsInserted {
  uint64 index = 1;
}

message Din18599ElementsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Din18599ElementsModified {
  string id = 1;
  Din18599ElementsPatch patch = 2;
}

message Din18599ElementsRows {
  repeated Din18599ElementsRemoved removed = 1;
  repeated Din18599ElementsInserted inserted = 2;
  repeated Din18599ElementsMoved moved = 3;
  repeated Din18599ElementsModified modified = 4;
}

message Din18599HeatingPatch {
  optional double generation_efficiency = 1;
  optional double distribution_efficiency = 2;
  optional double storage_efficiency = 3;
  optional double transfer_efficiency = 4;
  optional string energy_carrier = 5;
}

message Din18599DhwPatch {
  optional double specific_demand_kwh_person_a = 1;
  optional double storage_loss_kwh_a = 2;
  optional double distribution_loss_kwh_a = 3;
  optional string energy_carrier = 4;
}

message Din18599VentilationPatch {
  optional double airflow_m3_h = 1;
  optional double heat_recovery_eta = 2;
  optional double fan_power_w = 3;
}

message Din18599CoolingPatchPlantValue {
}

message Din18599CoolingPatch {
  optional Din18599CoolingPatchPlantValue plant = 1;
}

message Din18599LightingPatch {
  optional double control_factor = 1;
}

message Din18599RenewablesPatch {
  optional double pv_area_m2 = 1;
  optional double pv_efficiency = 2;
  optional double solar_thermal_kwh_a = 3;
}

message Din18599ClimatePatch {
}

message Din18599Diff {
  optional double net_floor_area_m2 = 1;
  optional double heated_volume_m3 = 2;
  optional double geg_qp_factor = 3;
  optional double delta_u_wb_w_m2k = 4;
  optional Din18599ZonesRows zones = 5;
  optional Din18599ElementsRows elements = 6;
  optional Din18599HeatingPatch heating = 7;
  optional Din18599DhwPatch dhw = 8;
  optional Din18599VentilationPatch ventilation = 9;
  optional Din18599CoolingPatch cooling = 10;
  optional Din18599LightingPatch lighting = 11;
  optional Din18599RenewablesPatch renewables = 12;
  optional Din18599ClimatePatch climate = 13;
}
