# 🧬️ Iso16757 artifact schema — every field with its state class.

type Iso16757Artifact {
  catalogue: String! @state(class: PERSISTENT)
  dictionary: String! @state(class: PERSISTENT)
  geometry: String! @state(class: PERSISTENT)
  selection: String! @state(class: PERSISTENT)
  partNumberRule: String! @state(class: PERSISTENT)
  partNumberInputs: [Iso16757StringMapEntry!]! @state(class: PERSISTENT)
  scriptLimits: String! @state(class: PERSISTENT)
  exchangeProcess: String! @state(class: PERSISTENT)
  selectedCheckIndex: Int @state(class: SHARED_UI)
}

type Iso16757StringMapEntry { key: String! value: String! }
