syntax = "proto3";

message Din16798Zone {
  string id = 1;
  string name = 2;
  string usage_type = 3;
  double floor_area_m2 = 4;
  uint32 occupants = 5;
  string comfort_category = 6;
  string pollution_class = 7;
  string comfort_model = 8;
  double t_op_winter_c = 9;
  double t_op_summer_c = 10;
  double air_speed_m_s = 11;
  double clothing_clo = 12;
  double metabolic_rate_met = 13;
  double rh_percent = 14;
  double outdoor_air_supplied_m3_h = 15;
  double co2_ppm = 16;
  double illuminance_lx = 17;
  double noise_db = 18;
  string vent_system_id = 19;
  double turbulence_intensity_percent = 20;
  string vent_method = 21;
}

message Din16798VentSystem {
  string id = 1;
  string name = 2;
  string system_type = 3;
  double sfp_w_m3_s = 4;
  uint32 sfp_required_class = 5;
  double heat_recovery_eta = 6;
  string oda_class = 7;
  string filter_sup_class = 8;
  uint32 years_since_inspection = 9;
  double humidification_required_kg_h = 10;
  double humidification_provided_kg_h = 11;
  double fan_q_v_m3_s = 12;
  double fan_t_run_h = 13;
  string duct_class = 14;
  double duct_test_pressure_pa = 15;
  double duct_leakage_m3_s_m2 = 16;
  double design_airflow_m3_h = 17;
}

message Din16798Snapshot {
  string annex = 1;
  double theta_rm_c = 2;
  double outdoor_co2_ppm = 3;
  repeated Din16798Zone zones = 4;
  repeated Din16798VentSystem vent_systems = 5;
  double envelope_n50_h_inv = 6;
  double envelope_volume_m3 = 7;
  double cellar_area_m2 = 8;
  double cellar_ventilation_m3_h = 9;
  double night_setback_k = 10;
}
