# 🧬️ Din16798 diff schema — sparse scalar fields plus keyed row deltas.

type Din16798Diff {
  annex: String @state(class: ARTIFACT)
  thetaRmC: Float @state(class: ARTIFACT)
  outdoorCo2Ppm: Float @state(class: ARTIFACT)
  envelopeN50HInv: Float @state(class: ARTIFACT)
  envelopeVolumeM3: Float @state(class: ARTIFACT)
  cellarAreaM2: Float @state(class: ARTIFACT)
  cellarVentilationM3H: Float @state(class: ARTIFACT)
  nightSetbackK: Float @state(class: ARTIFACT)
  zones: Din16798ZoneDelta! @state(class: ARTIFACT)
  ventSystems: Din16798VentSystemDelta! @state(class: ARTIFACT)
}

type Din16798ZoneDelta {
  removed: [Din16798ZoneRemoval!]!
  inserted: [Din16798ZoneInsertion!]!
  moved: [Din16798ZoneRelocation!]!
  modified: [Din16798ZoneModification!]!
}

type Din16798ZoneRemoval {
  id: String!
  index: Int!
}

type Din16798ZoneInsertion {
  index: Int!
  row: Din16798Zone!
}

type Din16798ZoneRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Din16798ZoneModification {
  id: String!
  patch: Din16798ZonePatch!
}

type Din16798ZonePatch {
  name: String
  usageType: String
  floorAreaM2: Float
  occupants: Int
  comfortCategory: String
  pollutionClass: String
  comfortModel: String
  tOpWinterC: Float
  tOpSummerC: Float
  airSpeedMS: Float
  clothingClo: Float
  metabolicRateMet: Float
  rhPercent: Float
  outdoorAirSuppliedM3H: Float
  co2Ppm: Float
  illuminanceLx: Float
  noiseDb: Float
  turbulenceIntensityPercent: Float
  ventMethod: String
  ventSystemId: String
}

type Din16798VentSystemDelta {
  removed: [Din16798VentSystemRemoval!]!
  inserted: [Din16798VentSystemInsertion!]!
  moved: [Din16798VentSystemRelocation!]!
  modified: [Din16798VentSystemModification!]!
}

type Din16798VentSystemRemoval {
  id: String!
  index: Int!
}

type Din16798VentSystemInsertion {
  index: Int!
  row: Din16798VentSystem!
}

type Din16798VentSystemRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Din16798VentSystemModification {
  id: String!
  patch: Din16798VentSystemPatch!
}

type Din16798VentSystemPatch {
  name: String
  systemType: String
  sfpWM3S: Float
  sfpRequiredClass: Int
  heatRecoveryEta: Float
  odaClass: String
  filterSupClass: String
  yearsSinceInspection: Int
  humidificationRequiredKgH: Float
  humidificationProvidedKgH: Float
  fanQVM3S: Float
  fanTRunH: Float
  ductClass: String
  ductTestPressurePa: Float
  ductLeakageM3SM2: Float
  designAirflowM3H: Float
}
