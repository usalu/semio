syntax = "proto3";
package semio.s.norm.en1996.inference;

// 💡️ En1996 inference schema — document outline (field/section list + entry count).

message En1996Inference {
  // @derived
  En1996Outline outline = 1;
}

message En1996Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
