semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-norm-contract = { workspace = true }
semio-s-artifact-norm-en1996-editor = { workspace = true }
semio-s-artifact-norm-en1996-inferences = { workspace = true }
semio-s-artifact-norm-en1996-io = { workspace = true }
semio-s-artifact-norm-en1996-schema = { workspace = true }

[dev-dependencies]
pack = { workspace = true }
semio-framework-artifact-reference = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-value = { workspace = true }
semio-s-artifact-norm-en1996-diff = { workspace = true }
semio-s-artifact-norm-en1996-model = { workspace = true }
semio-s-artifact-norm-en1996-mut-project = { workspace = true }
semio-s-artifact-norm-en1996-mut-walls = { workspace = true }
