[package]
workspace = "../.."
name = "semio-s-artifact-norm-en1996"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Norm en1996 artifact"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[bin]]
name = "regenerate-en1996-example-assets"
path = "bins/regenerate_example_assets.rs"

[dependencies]
semio-framework-dsl = { workspace = true }
semio-framework-os-kernel = { workspace = true }
