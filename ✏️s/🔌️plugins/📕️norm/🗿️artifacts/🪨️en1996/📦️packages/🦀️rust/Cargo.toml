semio-s-artifact-norm-en1996-editor = { workspace = true }
semio-s-artifact-norm-en1996-inferences = { workspace = true }
semio-s-artifact-norm-en1996-io = { workspace = true }
semio-s-artifact-norm-en1996-schema = { workspace = true }

[dev-dependencies]
semio-s-plugin-norm-results-config = { workspace = true, features = ["test-support"] }
semio-s-artifact-norm-en1996-schema = { workspace = true, features = ["test-support"] }
semio-s-artifact-norm-en1996-inferences = { workspace = true, features = ["test-support"] }
pack = { workspace = true }
semio-framework-artifact-reference = { workspace = true }
semio-framework-async-macros = { workspace = true }
