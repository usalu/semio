syntax = "proto3";
package semio.s.norm.din4108.diff;

message Din4108Diff {
  // @state artifact
  optional Din4108Artifact artifact = 1;
  // @state artifact
  optional string category = 2;
  // @state artifact
  optional Din4108LayerList layers = 3;
  // @state artifact
  optional string climate = 4;
  // @state artifact
  optional double airtightness_n50 = 5;
  // @state artifact
  optional double psi_times_l_sum = 6;
  // @state artifact
  optional double rh_int = 7;
  // @state artifact
  optional string catalog_id = 8;
  // @state artifact
  optional string material_id = 9;
  // @state artifact
  optional string airtightness_class = 10;
  // @state artifact
  optional double t_int_c = 11;
  // @state artifact
  optional double solar_absorptance = 12;
  // @state artifact
  optional double irradiance_w_m2 = 13;
  // @state artifact
  optional double moisture_mu_exterior = 14;
  // @state artifact
  optional double moisture_mu_interior = 15;
  // @state artifact
  optional double envelope_area_m2 = 16;
  // @state artifact
  optional bool bb2_details_conform = 17;
  // @state artifact
  optional string application_type = 18;
  // @state artifact
  optional string declared_application_class = 19;
  // @state presence
  optional uint32 selected_check_index = 20;
}

message Din4108Artifact {
  string category = 1;
  repeated string layers = 2;
  string climate = 3;
  double airtightness_n50 = 4;
  double psi_times_l_sum = 5;
  double rh_int = 6;
  string catalog_id = 7;
  string material_id = 8;
  string airtightness_class = 9;
  double t_int_c = 10;
  double solar_absorptance = 11;
  double irradiance_w_m2 = 12;
  double moisture_mu_exterior = 13;
  double moisture_mu_interior = 14;
  double envelope_area_m2 = 15;
  bool bb2_details_conform = 16;
  string application_type = 17;
  string declared_application_class = 18;
  optional uint32 selected_check_index = 19;
}

message Din4108LayerList { repeated string values = 1; }
