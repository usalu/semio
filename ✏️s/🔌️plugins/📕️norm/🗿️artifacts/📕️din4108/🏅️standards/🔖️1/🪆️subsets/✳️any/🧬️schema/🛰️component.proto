syntax = "proto3";
package semio.s.norm.din4108.artifact;

// 🧬️ Din4108 artifact schema — every field with its state class.

message Din4108Artifact {
  // @state artifact
  string category = 1;
  // @state artifact
  repeated string layers = 2;
  // @state artifact
  string climate = 3;
  // @state artifact
  double airtightness_n50 = 4;
  // @state artifact
  double psi_times_l_sum = 5;
  // @state artifact
  double rh_int = 6;
  // @state artifact
  string catalog_id = 7;
  // @state artifact
  string material_id = 8;
  // @state artifact
  string airtightness_class = 9;
  // @state artifact
  double t_int_c = 10;
  // @state artifact
  double solar_absorptance = 11;
  // @state artifact
  double irradiance_w_m2 = 12;
  // @state artifact
  double moisture_mu_exterior = 13;
  // @state artifact
  double moisture_mu_interior = 14;
  // @state artifact
  double envelope_area_m2 = 15;
  // @state artifact
  bool bb2_details_conform = 16;
  // @state artifact
  string application_type = 17;
  // @state artifact
  string declared_application_class = 18;
  // @state presence
  optional uint32 selected_check_index = 19;
}
