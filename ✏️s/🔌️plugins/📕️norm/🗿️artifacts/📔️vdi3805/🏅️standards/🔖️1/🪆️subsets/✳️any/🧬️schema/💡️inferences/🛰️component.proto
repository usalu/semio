syntax = "proto3";
package semio.s.norm.vdi3805.inference;

// 💡️ Vdi3805 inference schema — document outline (field/section list + entry count).

message Vdi3805Inference {
  // @state inferred
  Vdi3805Outline outline = 1;
}

message Vdi3805Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
