# 🧬️ Vdi3805 snapshot schema — persistent fields only.

type Vdi3805Snapshot {
  manufacturerFile: String! @state(class: PERSISTENT)
  catalog: String! @state(class: PERSISTENT)
  editionProfile: [Vdi3805StringMapEntry!]! @state(class: PERSISTENT)
  correctionAsOf: String! @state(class: PERSISTENT)
  strictMode: Boolean! @state(class: PERSISTENT)
  index: String! @state(class: PERSISTENT)
  geometry: [Vdi3805StringMapEntry!]! @state(class: PERSISTENT)
  curves: [Vdi3805StringMapEntry!]! @state(class: PERSISTENT)
  limits: String! @state(class: PERSISTENT)
}

type Vdi3805StringMapEntry { key: String! value: String! }
