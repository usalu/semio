# 🧬️ En1998 diff schema — sparse scalar fields plus keyed row deltas.

type En1998Diff {
  annex: String @state(class: ARTIFACT)
  site: En1998Site @state(class: ARTIFACT)
  buildings: En1998BuildingDelta! @state(class: ARTIFACT)
  bridges: En1998BridgeDelta! @state(class: ARTIFACT)
  assessments: En1998AssessmentDelta! @state(class: ARTIFACT)
  silos: En1998SiloDelta! @state(class: ARTIFACT)
  tanks: En1998TankDelta! @state(class: ARTIFACT)
  foundations: En1998FoundationDelta! @state(class: ARTIFACT)
  retainingWalls: En1998RetainingWallDelta! @state(class: ARTIFACT)
  towers: En1998TowerDelta! @state(class: ARTIFACT)
}

type En1998SystemDelta {
  removed: [En1998SystemRemoval!]!
  inserted: [En1998SystemInsertion!]!
  moved: [En1998SystemRelocation!]!
  modified: [En1998SystemModification!]!
}

type En1998SystemRemoval {
  id: String!
  index: Int!
}

type En1998SystemInsertion {
  index: Int!
  row: En1998System!
}

type En1998SystemRelocation {
  id: String!
  from: Int!
  to: Int!
}

type En1998SystemModification {
  id: String!
  patch: En1998SystemPatch!
}

type En1998SystemPatch {
  direction: String
  systemType: String
  material: String
  ductilityClass: String
  q0: Float
  alphaUOverAlpha1: Float
  kW: Float
  baseShearResistanceN: Float
}

