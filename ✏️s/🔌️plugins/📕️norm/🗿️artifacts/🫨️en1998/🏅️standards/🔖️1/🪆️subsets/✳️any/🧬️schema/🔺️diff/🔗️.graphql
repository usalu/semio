  patch: En1998StoreyPatch!
}

type En1998StoreyPatch {
  heightM: Float
  permanentGkN: Float
  correlatedOccupancy: Boolean
  variables: String
  stiffnessX: Float
  stiffnessY: Float
  centreOfMassXM: Float
  centreOfMassYM: Float
  centreOfStiffnessXM: Float
  centreOfStiffnessYM: Float
  driftXM: Float
  driftYM: Float
  shearResistanceN: Float
}

