}

message En1998StoreyPatch {
  optional double height_m = 1;
  optional double permanent_gk_n = 2;
  optional bool correlated_occupancy = 3;
  optional bytes variables = 4;
  optional double stiffness_x = 5;
  optional double stiffness_y = 6;
  optional double centre_of_mass_x_m = 7;
  optional double centre_of_mass_y_m = 8;
  optional double centre_of_stiffness_x_m = 9;
  optional double centre_of_stiffness_y_m = 10;
  optional double drift_x_m = 11;
  optional double drift_y_m = 12;
  optional double shear_resistance_n = 13;
}

