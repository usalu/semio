message En1998Diff {
  // @state artifact
  optional string annex = 1;
  // @state artifact
  optional bytes site = 2;
  // @state artifact
  En1998BuildingDelta buildings = 3;
  // @state artifact
  En1998BridgeDelta bridges = 4;
  // @state artifact
  En1998AssessmentDelta assessments = 5;
  // @state artifact
  En1998SiloDelta silos = 6;
  // @state artifact
  En1998TankDelta tanks = 7;
  // @state artifact
  En1998FoundationDelta foundations = 8;
  // @state artifact
  En1998RetainingWallDelta retaining_walls = 9;
  // @state artifact
  En1998TowerDelta towers = 10;
}
