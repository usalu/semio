// 🧬️ En1998 diff
syntax = "proto3";
package semio.s.norm.en1998.diff;

message En1998SystemRemoval {
  string id = 1;
  uint32 index = 2;
}

message En1998SystemInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message En1998SystemRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message En1998SystemModification {
  string id = 1;
  En1998SystemPatch patch = 2;
}

message En1998SystemDelta {
  repeated En1998SystemRemoval removed = 1;
  repeated En1998SystemInsertion inserted = 2;
  repeated En1998SystemRelocation moved = 3;
  repeated En1998SystemModification modified = 4;
}

message En1998SystemPatch {
  optional string direction = 1;
  optional string system_type = 2;
  optional string material = 3;
  optional string ductility_class = 4;
  optional double q0 = 5;
  optional double alpha_u_over_alpha_1 = 6;
  optional double k_w = 7;
  optional double base_shear_resistance_n = 8;
}

