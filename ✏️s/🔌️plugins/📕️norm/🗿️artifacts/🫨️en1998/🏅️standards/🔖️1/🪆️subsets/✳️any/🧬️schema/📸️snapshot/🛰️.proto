  bool claims_simple_masonry = 16;
  double masonry_wall_area_ratio = 17;
  double accidental_eccentricity_ratio = 18;
  double setback_ratio = 19;
  double plan_envelope_gap_ratio = 20;
  double joint_gap_m = 21;
  double nonstructural_weight_n = 22;
  double nonstructural_height_m = 23;
  double nonstructural_period_s = 24;
  double nonstructural_q = 25;
  double nonstructural_resistance_n = 26;
  double column_moment_sum_nm = 27;
  double beam_moment_sum_nm = 28;
  double overturning_base_x_m = 29;
