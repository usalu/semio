syntax = "proto3";
package semio.s.norm.en1998;
message En1998Snapshot {
  // @state artifact
  string annex = 1;
  // @state artifact
  En1998Site site = 2;
  // @state artifact
  repeated En1998Building buildings = 3;
  // @state artifact
  repeated En1998Bridge bridges = 4;
  // @state artifact
  repeated En1998Assessment assessments = 5;
  // @state artifact
  repeated En1998Silo silos = 6;
  // @state artifact
  repeated En1998Tank tanks = 7;
  // @state artifact
  repeated En1998Foundation foundations = 8;
  // @state artifact
  repeated En1998RetainingWall retaining_walls = 9;
  // @state artifact
  repeated En1998Tower towers = 10;
  // @state artifact
  repeated En1998SoilLayer soil_layers = 11;
  // @state artifact
  repeated En1998Diaphragm diaphragms = 12;
  // @state artifact
  repeated En1998Accelerogram accelerograms = 13;
  // @state artifact
  repeated En1998Pier piers = 14;
  // @state artifact
  repeated En1998Bearing bearings = 15;
  // @state artifact
  repeated En1998Joint joints = 16;
  // @state artifact
  repeated En1998Placement placements = 17;
  // @state artifact
  repeated En1998TieBeam tie_beams = 18;
  // @state artifact
  repeated En1998Slope slopes = 19;
}
message En1998Site {
  double s_ap_r = 1;
  double a_gr = 2;
  DeGroundCombo de_ground_combo = 3;
  EnGroundType en_ground_type = 4;
  EnSpectrumType en_spectrum_type = 5;
  ImportanceClass importance_class = 6;
  double v_s30_m_s = 7;
  double n_spt = 8;
  double c_u_kpa = 9;
  double soft_clay_thickness_m = 10;
  double soft_clay_pi = 11;
  bool liquefiable_layer = 12;
  double alluvium_thickness_m = 13;
  double alluvium_v_s_m_s = 14;
  double below_alluvium_v_s_m_s = 15;
}
message En1998System {
  string id = 1;
  AnalysisDirection direction = 2;
  SystemType system_type = 3;
  StructuralMaterial material = 4;
  DuctilityClass ductility_class = 5;
  double q0 = 6;
  double alpha_u_over_alpha1 = 7;
  double k_w = 8;
  double base_shear_resistance_n = 9;
}
message En1998Storey {
  string id = 1;
  double height_m = 2;
  double permanent_gk_n = 3;
  bool correlated_occupancy = 4;
  repeated En1998VariableAction variables = 5;
  double stiffness_x = 6;
  double stiffness_y = 7;
  double centre_of_mass_x_m = 8;
  double centre_of_mass_y_m = 9;
  double centre_of_stiffness_x_m = 10;
  double centre_of_stiffness_y_m = 11;
  double drift_x_m = 12;
  double drift_y_m = 13;
  double shear_resistance_n = 14;
}
message En1998Member {
  string id = 1;
  StructuralMaterial material = 2;
  MemberKind role = 3;
  bool detailing_compatible_with_q = 4;
  double min_dimension_m = 5;
  double rho = 6;
  double rho_prime = 7;
  double omega_wd = 8;
  uint32 steel_section_class = 9;
  double fastener_diameter_mm = 10;
  double timber_thickness_mm = 11;
  double wall_thickness_m = 12;
  double wall_effective_height_m = 13;
  double wall_length_m = 14;
  double wall_direction_rad = 15;
  string wall_storey_id = 16;
  double wall_start_x_m = 17;
  double wall_start_y_m = 18;
  double wall_poisson_ratio = 19;
