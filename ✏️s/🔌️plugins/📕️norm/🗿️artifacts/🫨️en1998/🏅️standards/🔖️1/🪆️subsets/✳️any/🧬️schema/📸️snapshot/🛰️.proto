  double concrete_strength_mpa = 19;
  double stirrup_leg_area_m2 = 20;
  double stirrup_spacing_m = 21;
  double stirrup_yield_mpa = 22;
  double core_width_m = 23;
  double core_depth_m = 24;
  double restrained_bar_count = 25;
  double restrained_bar_spacing_m = 26;
  double diagonal_reinforcement_ratio = 27;
  double shear_cracking_before_yield = 28;
  double shear_force_demand_n = 29;
  double intermediate_steel_area_m2 = 30;
