  double pier_height_m = 9;
  double pier_moment_rd_nm = 10;
  double pier_shear_rd_n = 11;
  double deck_length_m = 12;
  double deck_ei_nm2 = 13;
  double importance_class = 14;
  double vertical_period_s = 15;
  double pier_cracked_inertia_ratio = 16;
}
message En1998Assessment {
  string id = 1;
  KnowledgeLevel knowledge_level = 2;
  LimitState limit_state = 3;
  string supported_building_id = 4;
  double r_k_n = 5;
  double gamma_el = 6;
  double chord_rotation_demand_rad = 7;
  double chord_rotation_yield_rad = 8;
  double chord_rotation_ultimate_rad = 9;
