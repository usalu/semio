  string id = 1;
  uint64 index = 2;
}

message Iso16757ProductIndexesInserted {
  uint64 index = 1;
}

message Iso16757ProductIndexesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Iso16757ProductIndexesModified {
  string id = 1;
  Iso16757ProductIndexesPatch patch = 2;
}

message Iso16757ProductIndexesRows {
  repeated Iso16757ProductIndexesRemoved removed = 1;
  repeated Iso16757ProductIndexesInserted inserted = 2;
