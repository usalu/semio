  optional string value = 1;
}

message Iso16757SubjectsPatch {
  optional Iso16757SubjectsPatchParentIdValue parent_id = 1;
}

message Iso16757SubjectsRemoved {
  string id = 1;
  uint64 index = 2;
}

message Iso16757SubjectsInserted {
  uint64 index = 1;
}

message Iso16757SubjectsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Iso16757SubjectsModified {
  string id = 1;
  Iso16757SubjectsPatch patch = 2;
}

message Iso16757SubjectsRows {
  repeated Iso16757SubjectsRemoved removed = 1;
  repeated Iso16757SubjectsInserted inserted = 2;
  repeated Iso16757SubjectsMoved moved = 3;
  repeated Iso16757SubjectsModified modified = 4;
}

message Iso16757GeometryObjectsEntry {
  string key = 1;
}

message Iso16757GeometryObjectsRows {
  repeated Iso16757GeometryObjectsEntry added = 1;
  repeated string removed = 2;
}

message Iso16757SelectionSeriesIdValue {
  optional string value = 1;
}

message Iso16757SelectionConstraintsInserted {
  uint64 index = 1;
}

message Iso16757SelectionConstraintsRows {
  repeated uint64 removed = 1;
  repeated Iso16757SelectionConstraintsInserted inserted = 2;
