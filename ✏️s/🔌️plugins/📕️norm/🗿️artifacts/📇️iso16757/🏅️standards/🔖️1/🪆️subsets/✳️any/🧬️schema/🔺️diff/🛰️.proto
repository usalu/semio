syntax = "proto3";
package semio.s.norm.iso16757.diff;

message Iso16757ProductGroupsPatch {
  optional string name = 1;
}

message Iso16757ProductGroupsRemoved {
  string id = 1;
  uint64 index = 2;
}

message Iso16757ProductGroupsInserted {
  uint64 index = 1;
}

message Iso16757ProductGroupsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Iso16757ProductGroupsModified {
  string id = 1;
  Iso16757ProductGroupsPatch patch = 2;
}

message Iso16757ProductGroupsRows {
  repeated Iso16757ProductGroupsRemoved removed = 1;
  repeated Iso16757ProductGroupsInserted inserted = 2;
  repeated Iso16757ProductGroupsMoved moved = 3;
  repeated Iso16757ProductGroupsModified modified = 4;
}

message Iso16757ProductClassesPatchParentIdValue {
  optional string value = 1;
}

message Iso16757ProductClassesPatch {
