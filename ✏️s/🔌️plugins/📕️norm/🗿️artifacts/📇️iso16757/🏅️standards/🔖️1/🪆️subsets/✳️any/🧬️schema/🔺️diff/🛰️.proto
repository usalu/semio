  optional string value = 1;
}

message Iso16757ProductSeriesPatch {
  optional string class_id = 1;
  optional Iso16757ProductSeriesPatchGeometryIdValue geometry_id = 2;
}

message Iso16757ProductSeriesRemoved {
  string id = 1;
  uint64 index = 2;
}

message Iso16757ProductSeriesInserted {
  uint64 index = 1;
}

message Iso16757ProductSeriesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Iso16757ProductSeriesModified {
  string id = 1;
  Iso16757ProductSeriesPatch patch = 2;
}

message Iso16757ProductSeriesRows {
  repeated Iso16757ProductSeriesRemoved removed = 1;
  repeated Iso16757ProductSeriesInserted inserted = 2;
  repeated Iso16757ProductSeriesMoved moved = 3;
  repeated Iso16757ProductSeriesModified modified = 4;
}

message Iso16757ProductsPatch {
  optional string name = 1;
}

message Iso16757ProductsRemoved {
  string id = 1;
  uint64 index = 2;
}

message Iso16757ProductsInserted {
  uint64 index = 1;
}

message Iso16757ProductsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message Iso16757ProductsModified {
  string id = 1;
  Iso16757ProductsPatch patch = 2;
}

message Iso16757ProductsRows {
  repeated Iso16757ProductsRemoved removed = 1;
  repeated Iso16757ProductsInserted inserted = 2;
  repeated Iso16757ProductsMoved moved = 3;
  repeated Iso16757ProductsModified modified = 4;
}

message Iso16757ProductIndexesPatchVariantIdValue {
  optional string value = 1;
}

message Iso16757ProductIndexesPatch {
  optional string product_id = 1;
  optional Iso16757ProductIndexesPatchVariantIdValue variant_id = 2;
  repeated string search_tags = 3;
