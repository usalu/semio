# 🧬️ Iso16757 diff schema — keyed sparse diff: scalar setters, id/index/key keyed row diffs and per-field section patches.

type Iso16757ProductGroupsPatch {
  name: String
}

type Iso16757ProductGroupsRemoved {
  id: String!
  index: Int!
}

type Iso16757ProductGroupsInserted {
  index: Int!
  row: ProductGroup!
}

type Iso16757ProductGroupsMoved {
  id: String!
  from: Int!
  to: Int!
}

type Iso16757ProductGroupsModified {
  id: String!
  patch: Iso16757ProductGroupsPatch!
}

type Iso16757ProductGroupsRows {
  removed: [Iso16757ProductGroupsRemoved!]!
  inserted: [Iso16757ProductGroupsInserted!]!
  moved: [Iso16757ProductGroupsMoved!]!
  modified: [Iso16757ProductGroupsModified!]!
}

