# 🧬️ Din4108 diff schema — sparse scalar fields plus keyed row deltas.

type Din4108Diff {
  climateZone: String @state(class: ARTIFACT)
  usage: String @state(class: ARTIFACT)
  tIntC: Float @state(class: ARTIFACT)
  rhInt: Float @state(class: ARTIFACT)
  hasMechanicalVentilation: Boolean @state(class: ARTIFACT)
  airtightnessN50: Float @state(class: ARTIFACT)
  bb2DetailsConform: Boolean @state(class: ARTIFACT)
  zones: Din4108ZoneDelta! @state(class: ARTIFACT)
  elements: Din4108ElementDelta! @state(class: ARTIFACT)
  thermalBridges: Din4108ThermalBridgeDelta! @state(class: ARTIFACT)
}

type Din4108WindowDelta {
  removed: [Din4108WindowRemoval!]!
  inserted: [Din4108WindowInsertion!]!
  moved: [Din4108WindowRelocation!]!
  modified: [Din4108WindowModification!]!
}

type Din4108WindowRemoval {
  id: String!
  index: Int!
}

type Din4108WindowInsertion {
  index: Int!
  row: Din4108ZoneWindow!
}

type Din4108WindowRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Din4108WindowModification {
  id: String!
  patch: Din4108WindowPatch!
}

type Din4108WindowPatch {
  orientation: String
  inclinationDeg: Float
  areaM2: Float
  gValue: Float
  shadingFc: Float
}

type Din4108LayerDelta {
  removed: [Din4108LayerRemoval!]!
  inserted: [Din4108LayerInsertion!]!
  moved: [Din4108LayerRelocation!]!
  modified: [Din4108LayerModification!]!
}

type Din4108LayerRemoval {
  id: String!
  index: Int!
}

type Din4108LayerInsertion {
  index: Int!
  row: Din4108LayerDocument!
}

type Din4108LayerRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Din4108LayerModification {
  id: String!
  patch: Din4108LayerPatch!
}

type Din4108LayerPatch {
  materialId: String
  thicknessM: Float
  lambda: Float
  mu: Float
  density: Float
  applicationType: String
  compressiveClass: String
  waterClass: String
  tensileClass: String
  acousticClass: String
  segments: String
}

type Din4108ZoneDelta {
  removed: [Din4108ZoneRemoval!]!
  inserted: [Din4108ZoneInsertion!]!
  moved: [Din4108ZoneRelocation!]!
  modified: [Din4108ZoneModification!]!
}

type Din4108ZoneRemoval {
  id: String!
  index: Int!
}

type Din4108ZoneInsertion {
  index: Int!
  row: Din4108ThermalZone!
}

type Din4108ZoneRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Din4108ZoneModification {
  id: String!
  patch: Din4108ZonePatch!
}

type Din4108ZonePatch {
  floorAreaM2: Float
  heaviness: String
  nightVentilation: String
  windows: Din4108WindowDelta!
}

type Din4108ElementDelta {
  removed: [Din4108ElementRemoval!]!
  inserted: [Din4108ElementInsertion!]!
  moved: [Din4108ElementRelocation!]!
  modified: [Din4108ElementModification!]!
}

type Din4108ElementRemoval {
  id: String!
  index: Int!
}

type Din4108ElementInsertion {
  index: Int!
  row: Din4108EnvelopeElement!
}

type Din4108ElementRelocation {
  id: String!
  from: Int!
  to: Int!
}

type Din4108ElementModification {
  id: String!
  patch: Din4108ElementPatch!
}

type Din4108ElementPatch {
  kind: String
  zoneId: String
  orientationDeg: Float
  inclinationDeg: Float
  adjacent: String
  areaM2: Float
  deltaUG: Float
  deltaUF: Float
  deltaUR: Float
