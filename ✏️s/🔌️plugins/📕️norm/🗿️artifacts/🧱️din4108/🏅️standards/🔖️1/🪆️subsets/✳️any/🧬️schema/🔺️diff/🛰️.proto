syntax = "proto3";
package semio.s.norm.din4108.diff;

message Din4108Diff {
  // @state artifact
  optional string climate_zone = 1;
  // @state artifact
  optional string usage = 2;
  // @state artifact
  optional double t_int_c = 3;
  // @state artifact
  optional double rh_int = 4;
  // @state artifact
  optional bool has_mechanical_ventilation = 5;
  // @state artifact
  optional double airtightness_n50 = 6;
  // @state artifact
  optional bool bb2_details_conform = 7;
  // @state artifact
  optional Din4108ZoneList zones = 8;
  // @state artifact
  optional Din4108ElementList elements = 9;
  // @state artifact
  optional Din4108ThermalBridgeList thermal_bridges = 10;
}

message Din4108ZoneList {
  repeated bytes values = 1;
}

message Din4108ElementList {
  repeated bytes values = 1;
}

message Din4108ThermalBridgeList {
  repeated bytes values = 1;
}
