// 🧬️ Din4108 diff
syntax = "proto3";
package semio.s.norm.din4108.diff;

message Din4108WindowRemoval {
  string id = 1;
  uint32 index = 2;
}

message Din4108WindowInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message Din4108WindowRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Din4108WindowModification {
  string id = 1;
  Din4108WindowPatch patch = 2;
}

message Din4108WindowDelta {
  repeated Din4108WindowRemoval removed = 1;
  repeated Din4108WindowInsertion inserted = 2;
  repeated Din4108WindowRelocation moved = 3;
  repeated Din4108WindowModification modified = 4;
}

message Din4108WindowPatch {
  optional string orientation = 1;
  optional double inclination_deg = 2;
  optional double area_m2 = 3;
  optional double g_value = 4;
  optional double shading_fc = 5;
}

message Din4108LayerRemoval {
  string id = 1;
  uint32 index = 2;
}

message Din4108LayerInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message Din4108LayerRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Din4108LayerModification {
  string id = 1;
  Din4108LayerPatch patch = 2;
}

message Din4108LayerDelta {
  repeated Din4108LayerRemoval removed = 1;
  repeated Din4108LayerInsertion inserted = 2;
  repeated Din4108LayerRelocation moved = 3;
  repeated Din4108LayerModification modified = 4;
}

message Din4108LayerPatch {
  optional string material_id = 1;
  optional double thickness_m = 2;
  optional double lambda = 3;
  optional double mu = 4;
  optional double density = 5;
  optional string application_type = 6;
  optional string compressive_class = 7;
  optional string water_class = 8;
  optional string tensile_class = 9;
  optional string acoustic_class = 10;
  optional bytes segments = 11;
}

message Din4108ZoneRemoval {
  string id = 1;
  uint32 index = 2;
}

message Din4108ZoneInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message Din4108ZoneRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Din4108ZoneModification {
  string id = 1;
  Din4108ZonePatch patch = 2;
}

message Din4108ZoneDelta {
  repeated Din4108ZoneRemoval removed = 1;
  repeated Din4108ZoneInsertion inserted = 2;
  repeated Din4108ZoneRelocation moved = 3;
  repeated Din4108ZoneModification modified = 4;
}

message Din4108ZonePatch {
  optional double floor_area_m2 = 1;
  optional string heaviness = 2;
  optional string night_ventilation = 3;
  Din4108WindowDelta windows = 4;
}

message Din4108ElementRemoval {
  string id = 1;
  uint32 index = 2;
}

message Din4108ElementInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message Din4108ElementRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Din4108ElementModification {
  string id = 1;
  Din4108ElementPatch patch = 2;
}

message Din4108ElementDelta {
  repeated Din4108ElementRemoval removed = 1;
  repeated Din4108ElementInsertion inserted = 2;
  repeated Din4108ElementRelocation moved = 3;
  repeated Din4108ElementModification modified = 4;
}

message Din4108ElementPatch {
  optional string kind = 1;
  optional string zone_id = 2;
  optional double orientation_deg = 3;
  optional double inclination_deg = 4;
  optional string adjacent = 5;
  optional double area_m2 = 6;
  optional double delta_u_g = 7;
  optional double delta_u_f = 8;
  optional double delta_u_r = 9;
  Din4108LayerDelta layers = 10;
}

message Din4108ThermalBridgeRemoval {
  string id = 1;
  uint32 index = 2;
}

message Din4108ThermalBridgeInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message Din4108ThermalBridgeRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message Din4108ThermalBridgeModification {
  string id = 1;
  Din4108ThermalBridgePatch patch = 2;
}

message Din4108ThermalBridgeDelta {
  repeated Din4108ThermalBridgeRemoval removed = 1;
  repeated Din4108ThermalBridgeInsertion inserted = 2;
  repeated Din4108ThermalBridgeRelocation moved = 3;
  repeated Din4108ThermalBridgeModification modified = 4;
}

message Din4108ThermalBridgePatch {
  optional double psi = 1;
  optional double length_m = 2;
  optional string bb2_type = 3;
}

message Din4108Diff {
  // @state artifact
  optional string climate_zone = 1;
  // @state artifact
  optional string usage = 2;
  // @state artifact
  optional double t_int_c = 3;
  // @state artifact
  optional double rh_int = 4;
  // @state artifact
  optional bool has_mechanical_ventilation = 5;
  // @state artifact
  optional double airtightness_n50 = 6;
  // @state artifact
  optional bool bb2_details_conform = 7;
  // @state artifact
  Din4108ZoneDelta zones = 8;
  // @state artifact
  Din4108ElementDelta elements = 9;
  // @state artifact
  Din4108ThermalBridgeDelta thermal_bridges = 10;
}
