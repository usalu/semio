syntax = "proto3";
package semio.s.norm.en1995.inference;

// 💡️ En1995 inference schema — document outline (field/section list + entry count).

message En1995Inference {
  // @state inferred
  En1995Outline outline = 1;
}

message En1995Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
