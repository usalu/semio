syntax = "proto3";
package semio.s.norm.en1997.inference;

// 💡️ En1997 inference schema — document outline (field/section list + entry count).

message En1997Inference {
  // @state inferred
  En1997Outline outline = 1;
}

message En1997Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
