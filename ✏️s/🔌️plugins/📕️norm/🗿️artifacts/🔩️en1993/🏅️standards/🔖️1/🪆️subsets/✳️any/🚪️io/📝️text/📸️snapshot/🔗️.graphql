# 🧬 EN 1993 snapshot GraphQL (handcrafted SI schema).
type DesignAction { n: Float! vy: Float! vz: Float! my: Float! mz: Float! t: Float! }
type LoadCase { id: String! name: String! kind: String! category: String! }
type MemberAction { id: String! memberId: String! loadCaseId: String! action: DesignAction! }
type ForceAction { id: String! loadCaseId: String! force: Float! }
type JointForceAction { id: String! loadCaseId: String! shear: Float! tension: Float! }
type FatigueBand { id: String! deltaSigma: Float! cycles: Float! }
type SteelMaterial { id: String! grade: String! fy: Float! fu: Float! eModulus: Float! gModulus: Float! subgrade: String! kind: String! }
type SteelSection { id: String! designation: String! kind: String! h: Float! b: Float! tw: Float! tf: Float! r: Float! area: Float! shearAreaY: Float! shearAreaZ: Float! iy: Float! iz: Float! it: Float! iw: Float! wElY: Float! wElZ: Float! wPlY: Float! wPlZ: Float! areaNet: Float! }
type SteelMember { id: String! label: String! memberType: String! sectionId: String! materialId: String! length: Float! bucklingLengthY: Float! bucklingLengthZ: Float! ltbLength: Float! ltbRestraintSpacing: Float! loadApplication: String! endMomentRatioPsi: Float! momentDiagram: String! deflectionLimitRatio: Float! analysis: String! }
type SteelJoint { id: String! kind: String! memberId: String! boltClass: String! boltDiameter: Float! boltRows: Int! boltsPerRow: Int! pitch: Float! gauge: Float! endDistance: Float! edgeDistance: Float! shearPlanes: Int! plateThickness: Float! plateFu: Float! weldThroat: Float! weldLength: Float! weldFu: Float! weldGrade: String! actions: [JointForceAction!]! category: String! frictionMu: Float! preloadForce: Float! slipFactorKs: Float! frictionSurfaces: Int! }
type FatigueDetail { id: String! memberId: String! category: Int! method: String! spectrum: [FatigueBand!]! }
type FireExposure { id: String! memberId: String! rating: String! protectionThickness: Float! sectionFactor: Float! mu0: Float! designTemperature: Float! protectionConductivity: Float! protectionDensity: Float! protectionSpecificHeat: Float! }
type ColdFormedMember { id: String! bBar: Float! thickness: Float! kSigma: Float! psi: Float! fy: Float! grossResistance: Float! actions: [ForceAction!]! }
type PlatedPanel { id: String! a: Float! b: Float! thickness: Float! fy: Float! kSigma: Float! actions: [ForceAction!]! }
type SiloShell { id: String! thickness: Float! radius: Float! depth: Float! k: Float! gamma: Float! fy: Float! }
type TensionComponent { id: String! fUk: Float! fK: Float! actions: [ForceAction!]! }
type BridgeFatigue { id: String! memberId: String! lambda: Float! phi2: Float! deltaSigmaP: Float! category: Int! method: String! }
type TowerLeg { id: String! memberId: String! forceCoefficient: Float! dynamicFactor: Float! actions: [ForceAction!]! }
type SteelPile { id: String! sectionId: String! materialId: String! drivingStress: Float! embeddedLength: Float! shaftPerimeter: Float! actions: [ForceAction!]! }
type CraneRunway { id: String! memberId: String! wheelContactLength: Float! dispersion: Float! webThickness: Float! fy: Float! phi: Float! actions: [ForceAction!]! }
type En1993Snapshot { annex: String! materials: [SteelMaterial!]! sections: [SteelSection!]! members: [SteelMember!]! loadCases: [LoadCase!]! memberActions: [MemberAction!]! joints: [SteelJoint!]! fatigueDetails: [FatigueDetail!]! fireExposures: [FireExposure!]! coldFormedMembers: [ColdFormedMember!]! platedPanels: [PlatedPanel!]! siloShells: [SiloShell!]! tensionComponents: [TensionComponent!]! bridgeFatigue: [BridgeFatigue!]! towerLegs: [TowerLeg!]! piles: [SteelPile!]! craneRunways: [CraneRunway!]! }
