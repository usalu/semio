[package]
workspace = "../../../../../../../../.."
name = "semio-s-artifact-norm-en1993-checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "EN 1993 compliance checks"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
oracle-wiring = ["dep:semio-s-plugin-norm-mechanics", "dep:serde_json", "semio-s-plugin-norm-compliance/compliance-testing"]

[dependencies]
semio-s-artifact-norm-en1993-spec-trace = { workspace = true }
semio-s-artifact-norm-en1993-checks-special = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { path = "../../../../../../../../../../../../../../🧰️framework/🔨️modules/🎒️pack/🔤️json/📦️packages/🦀️rust" }
semio-framework-schema = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-norm-en1993-clauses = { workspace = true }
semio-s-artifact-norm-en1993-model = { workspace = true }
semio-s-artifact-norm-en1993-parts = { workspace = true }
semio-s-plugin-norm-compliance = { workspace = true }
semio-s-plugin-norm-mechanics = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
semio-s-artifact-norm-en1993-showcase = { workspace = true }
semio-s-plugin-norm-results-config = { workspace = true, features = ["test-support"] }
