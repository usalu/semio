    UpdateFireInputs update_fire_inputs = 3;
    UpdateColdFormedInputs update_cold_formed_inputs = 4;
    UpdateStainlessInputs update_stainless_inputs = 5;
    UpdatePlatedInputs update_plated_inputs = 6;
    UpdateSiloShellInputs update_silo_shell_inputs = 7;
    UpdateBoltInputs update_bolt_inputs = 8;
    UpdateWeldInputs update_weld_inputs = 9;
    UpdateFatigueInputs update_fatigue_inputs = 10;
    UpdateThroughThicknessInputs update_through_thickness_inputs = 11;
    UpdateTensionComponentInputs update_tension_component_inputs = 12;
    UpdateHssInputs update_hss_inputs = 13;
    UpdateBridgeInputs update_bridge_inputs = 14;
    UpdateTowerInputs update_tower_inputs = 15;
    UpdatePileInputs update_pile_inputs = 16;
    UpdateCraneInputs update_crane_inputs = 17;
    InsertMaterial insert_material = 18;
    RemoveMaterial remove_material = 19;
    InsertSection insert_section = 20;
    RemoveSection remove_section = 21;
    InsertMember insert_member = 22;
    RemoveMember remove_member = 23;
    InsertLoadCase insert_load_case = 24;
    RemoveLoadCase remove_load_case = 25;
