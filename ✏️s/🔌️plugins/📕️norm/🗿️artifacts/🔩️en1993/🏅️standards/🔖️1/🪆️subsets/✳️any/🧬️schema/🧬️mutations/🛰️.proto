message InsertSiloShell { uint32 index = 1; bytes payload = 2; }
message RemoveSiloShell { uint32 index = 1; }
message InsertTensionComponent { uint32 index = 1; bytes payload = 2; }
message RemoveTensionComponent { uint32 index = 1; }
message InsertBridgeFatigue { uint32 index = 1; bytes payload = 2; }
message RemoveBridgeFatigue { uint32 index = 1; }
message InsertTowerLeg { uint32 index = 1; bytes payload = 2; }
message RemoveTowerLeg { uint32 index = 1; }
message InsertPile { uint32 index = 1; bytes payload = 2; }
message RemovePile { uint32 index = 1; }
