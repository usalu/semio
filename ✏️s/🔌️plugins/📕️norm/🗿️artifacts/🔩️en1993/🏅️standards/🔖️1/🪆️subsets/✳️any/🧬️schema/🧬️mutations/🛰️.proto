    RemoveMemberAction remove_member_action = 27;
    InsertJoint insert_joint = 28;
    RemoveJoint remove_joint = 29;
    InsertFatigueDetail insert_fatigue_detail = 30;
    RemoveFatigueDetail remove_fatigue_detail = 31;
    InsertFireExposure insert_fire_exposure = 32;
    RemoveFireExposure remove_fire_exposure = 33;
    InsertColdFormedMember insert_cold_formed_member = 34;
    RemoveColdFormedMember remove_cold_formed_member = 35;
    InsertPlatedPanel insert_plated_panel = 36;
    RemovePlatedPanel remove_plated_panel = 37;
    InsertSiloShell insert_silo_shell = 38;
    RemoveSiloShell remove_silo_shell = 39;
    InsertTensionComponent insert_tension_component = 40;
    RemoveTensionComponent remove_tension_component = 41;
    InsertBridgeFatigue insert_bridge_fatigue = 42;
    RemoveBridgeFatigue remove_bridge_fatigue = 43;
    InsertTowerLeg insert_tower_leg = 44;
    RemoveTowerLeg remove_tower_leg = 45;
    InsertPile insert_pile = 46;
    RemovePile remove_pile = 47;
    InsertCraneRunway insert_crane_runway = 48;
