message UpdateBridgeInputs { bytes payload = 1; }
message UpdateTowerInputs { bytes payload = 1; }
message UpdatePileInputs { bytes payload = 1; }
message UpdateCraneInputs { bytes payload = 1; }
message InsertMaterial { uint32 index = 1; bytes payload = 2; }
