# 🧬️ En1993 diff schema — sparse scalar fields plus keyed row deltas.

type En1993Diff {
  annex: String @state(class: ARTIFACT)
  materials: En1993MaterialDelta! @state(class: ARTIFACT)
  sections: En1993SectionDelta! @state(class: ARTIFACT)
  members: En1993MemberDelta! @state(class: ARTIFACT)
  loadCases: En1993LoadCaseDelta! @state(class: ARTIFACT)
  memberActions: En1993MemberActionDelta! @state(class: ARTIFACT)
  joints: En1993JointDelta! @state(class: ARTIFACT)
  fatigueDetails: En1993FatigueDetailDelta! @state(class: ARTIFACT)
  fireExposures: En1993FireExposureDelta! @state(class: ARTIFACT)
  coldFormedMembers: En1993ColdFormedMemberDelta! @state(class: ARTIFACT)
  platedPanels: En1993PlatedPanelDelta! @state(class: ARTIFACT)
  siloShells: En1993SiloShellDelta! @state(class: ARTIFACT)
  tensionComponents: En1993TensionComponentDelta! @state(class: ARTIFACT)
  bridgeFatigue: En1993BridgeFatigueDelta! @state(class: ARTIFACT)
  towerLegs: En1993TowerLegDelta! @state(class: ARTIFACT)
  piles: En1993PileDelta! @state(class: ARTIFACT)
  craneRunways: En1993CraneRunwayDelta! @state(class: ARTIFACT)
}

type En1993MaterialDelta {
  removed: [String!]!
  added: [En1993MaterialAddition!]!
  modified: [En1993MaterialModification!]!
}

type En1993MaterialAddition {
  after: String
  row: SteelMaterial!
}

type En1993MaterialModification {
  key: String!
  patch: En1993MaterialPatch!
}

type En1993MaterialPatch {
  grade: String
  fy: Float
  fu: Float
  eModulus: Float
  gModulus: Float
  subgrade: String
  kind: String
}

