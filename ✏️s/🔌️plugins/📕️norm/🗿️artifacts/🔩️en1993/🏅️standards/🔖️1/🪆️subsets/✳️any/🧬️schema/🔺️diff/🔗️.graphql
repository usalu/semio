# 🧬️ En1993 diff schema — sparse scalar fields and ordered per-collection row edits.

enum En1993RowOp {
  INSERT
  REMOVE
  REPLACE
}

type En1993Diff {
  annex: String @state(class: ARTIFACT)
  materials: [En1993MaterialEdit!]! @state(class: ARTIFACT)
  sections: [En1993SectionEdit!]! @state(class: ARTIFACT)
  members: [En1993MemberEdit!]! @state(class: ARTIFACT)
  loadCases: [En1993LoadCaseEdit!]! @state(class: ARTIFACT)
  memberActions: [En1993MemberActionEdit!]! @state(class: ARTIFACT)
  joints: [En1993JointEdit!]! @state(class: ARTIFACT)
  fatigueDetails: [En1993FatigueDetailEdit!]! @state(class: ARTIFACT)
  fireExposures: [En1993FireExposureEdit!]! @state(class: ARTIFACT)
  coldFormedMembers: [En1993ColdFormedMemberEdit!]! @state(class: ARTIFACT)
  platedPanels: [En1993PlatedPanelEdit!]! @state(class: ARTIFACT)
  siloShells: [En1993SiloShellEdit!]! @state(class: ARTIFACT)
  tensionComponents: [En1993TensionComponentEdit!]! @state(class: ARTIFACT)
  bridgeFatigue: [En1993BridgeFatigueEdit!]! @state(class: ARTIFACT)
  towerLegs: [En1993TowerLegEdit!]! @state(class: ARTIFACT)
  piles: [En1993PileEdit!]! @state(class: ARTIFACT)
  craneRunways: [En1993CraneRunwayEdit!]! @state(class: ARTIFACT)
}

type En1993MaterialEdit {
  op: En1993RowOp!
  index: Int!
  id: String!
  value: SteelMaterial
}

type En1993SectionEdit {
  op: En1993RowOp!
  index: Int!
  id: String!
