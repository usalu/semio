  optional double tf = 6;
  optional double r = 7;
  optional double area = 8;
  optional double shear_area_y = 9;
  optional double shear_area_z = 10;
  optional double iy = 11;
  optional double iz = 12;
  optional double it = 13;
  optional double iw = 14;
  optional double w_el_y = 15;
  optional double w_el_z = 16;
  optional double w_pl_y = 17;
