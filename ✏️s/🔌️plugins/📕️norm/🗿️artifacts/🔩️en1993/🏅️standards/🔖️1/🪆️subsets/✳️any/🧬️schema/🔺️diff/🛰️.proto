// 🧬️ En1993 diff
syntax = "proto3";
package semio.s.norm.en1993.diff;
message En1993ListWrap { repeated bytes values = 1; }
message En1993Diff {
  bytes artifact = 1;
  optional string annex = 2;
  optional En1993ListWrap materials = 3;
  optional En1993ListWrap sections = 4;
  optional En1993ListWrap members = 5;
  optional En1993ListWrap load_cases = 6;
  optional En1993ListWrap member_actions = 7;
  optional En1993ListWrap joints = 8;
  optional En1993ListWrap fatigue_details = 9;
  optional En1993ListWrap fire_exposures = 10;
  optional En1993ListWrap cold_formed_members = 11;
  optional En1993ListWrap plated_panels = 12;
  optional En1993ListWrap silo_shells = 13;
  optional En1993ListWrap tension_components = 14;
  optional En1993ListWrap bridge_fatigue = 15;
  optional En1993ListWrap tower_legs = 16;
  optional En1993ListWrap piles = 17;
  optional En1993ListWrap crane_runways = 18;
}
