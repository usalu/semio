// 🧬️ En1993 diff
syntax = "proto3";
package semio.s.norm.en1993.diff;

message En1993MaterialAddition {
  optional string after = 1;
  bytes row = 2;
}

message En1993MaterialModification {
  string key = 1;
  En1993MaterialPatch patch = 2;
}

message En1993MaterialDelta {
  repeated string removed = 1;
  repeated En1993MaterialAddition added = 2;
  repeated En1993MaterialModification modified = 3;
}

message En1993MaterialPatch {
  optional string grade = 1;
  optional double fy = 2;
  optional double fu = 3;
  optional double e_modulus = 4;
  optional double g_modulus = 5;
  optional string subgrade = 6;
  optional string kind = 7;
}

