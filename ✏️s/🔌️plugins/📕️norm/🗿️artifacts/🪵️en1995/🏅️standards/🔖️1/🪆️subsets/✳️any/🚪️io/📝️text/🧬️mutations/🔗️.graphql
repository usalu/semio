scalar UInt32

union En1995Mutation = ChangeAnnex | InsertMember | RemoveMember | ChangeMemberH | ChangeMemberB | ChangeMemberStrengthClass | ChangeConnectionNumber | InsertConnection | RemoveConnection
type ChangeAnnex {
  newAnnex: AnnexChoice!
}
type InsertMember {
  index: Int!
  member: TimberMember!
}
type RemoveMember {
  index: Int!
}
type ChangeMemberH {
  memberId: String!
  newValue: Float!
}
type ChangeMemberB {
  memberId: String!
  newValue: Float!
}
type ChangeMemberStrengthClass {
  memberId: String!
  newValue: StrengthClass!
}
type ChangeConnectionNumber {
  connectionId: String!
  newValue: UInt32!
}
type InsertConnection {
  index: Int!
  connection: TimberConnection!
}
type RemoveConnection {
  index: Int!
}
