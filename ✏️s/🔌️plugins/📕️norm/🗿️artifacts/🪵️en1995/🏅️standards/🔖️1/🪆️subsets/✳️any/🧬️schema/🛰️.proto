syntax = "proto3";
package semio.s.norm.en1995;
message En1995Artifact {
  // @state artifact
  string annex = 1;
  // @state artifact
  repeated TimberMember members = 2;
  // @state artifact
  repeated TimberConnection connections = 3;
  // @state artifact
  UlsEquation uls_equation = 4;
  // @state artifact
  repeated CaseRow cases = 5;
  // @state artifact
  repeated Placement placements = 6;
  // @state artifact
  repeated Taper tapers = 7;
  // @state artifact
  repeated Cutout cutouts = 8;
  // @state artifact
  repeated Fastener fasteners = 9;
  // @state artifact
  repeated Panel panels = 10;
  // @state artifact
  repeated Floor floors = 11;
  // @state artifact
  repeated Diaphragm diaphragms = 12;
  // @state artifact
  repeated Truss trusses = 13;
  // @state artifact
  repeated Bracing bracings = 14;
  // @state artifact
  repeated Deck decks = 15;
  // @state artifact
  string reliability_class = 16;
}
enum UlsEquation {
  ULS_EQUATION_EQ610 = 0;
  ULS_EQUATION_EQ610AB = 1;
}
enum StrengthClass {
  STRENGTH_CLASS_C14 = 0;
  STRENGTH_CLASS_C16 = 1;
  STRENGTH_CLASS_C18 = 2;
  STRENGTH_CLASS_C20 = 3;
  STRENGTH_CLASS_C22 = 4;
  STRENGTH_CLASS_C24 = 5;
  STRENGTH_CLASS_C27 = 6;
  STRENGTH_CLASS_C30 = 7;
  STRENGTH_CLASS_C35 = 8;
  STRENGTH_CLASS_C40 = 9;
  STRENGTH_CLASS_C45 = 10;
  STRENGTH_CLASS_C50 = 11;
  STRENGTH_CLASS_D18 = 12;
  STRENGTH_CLASS_D24 = 13;
  STRENGTH_CLASS_D30 = 14;
  STRENGTH_CLASS_D35 = 15;
  STRENGTH_CLASS_D40 = 16;
  STRENGTH_CLASS_D50 = 17;
  STRENGTH_CLASS_D60 = 18;
  STRENGTH_CLASS_D70 = 19;
  STRENGTH_CLASS_GL20H = 20;
  STRENGTH_CLASS_GL22H = 21;
  STRENGTH_CLASS_GL24H = 22;
  STRENGTH_CLASS_GL26H = 23;
  STRENGTH_CLASS_GL28H = 24;
  STRENGTH_CLASS_GL30H = 25;
  STRENGTH_CLASS_GL32H = 26;
  STRENGTH_CLASS_GL20C = 27;
  STRENGTH_CLASS_GL22C = 28;
  STRENGTH_CLASS_GL24C = 29;
  STRENGTH_CLASS_GL26C = 30;
  STRENGTH_CLASS_GL28C = 31;
  STRENGTH_CLASS_GL30C = 32;
  STRENGTH_CLASS_GL32C = 33;
  STRENGTH_CLASS_LVL32 = 34;
  STRENGTH_CLASS_CLT100 = 35;
}
message TimberMember {
  string id = 1;
  string label_en = 2;
  string label_de = 3;
  string role = 4;
  StrengthClass strength_class = 5;
  uint32 service_class = 6;
  string support = 7;
  double b_m = 8;
  double h_m = 9;
  double span_m = 10;
  double support_length_m = 11;
  double bearing_length_m = 12;
  double buckling_length_y_m = 13;
  double buckling_length_z_m = 14;
  double lateral_restraint_spacing_m = 15;
  double notch_depth_m = 16;
  double notch_distance_m = 17;
  double mass_kg_per_m = 18;
  double mass_kg_per_m2 = 19;
  double damping_xi = 20;
  double fire_duration_s = 21;
  double bridge_n_obs = 22;
  double bridge_t_l_years = 23;
  double bridge_beta = 24;
  double bridge_a = 25;
  double bridge_b = 26;
  double bridge_crowd_per_m2 = 27;
  repeated CharacteristicAction actions = 28;
}
enum FastenerType {
  FASTENER_TYPE_NAIL = 0;
  FASTENER_TYPE_SCREW = 1;
  FASTENER_TYPE_BOLT = 2;
  FASTENER_TYPE_DOWEL = 3;
}
message TimberConnection {
  string id = 1;
  string label_en = 2;
  string label_de = 3;
  FastenerType fastener_type = 4;
  StrengthClass strength_class = 5;
  uint32 service_class = 6;
  double diameter_m = 7;
  uint32 number = 8;
  uint32 rows = 9;
  double spacing_m = 10;
  double edge_distance_m = 11;
  double end_distance_m = 12;
  double t1_m = 13;
  double t2_m = 14;
  bool steel_plate = 15;
  double steel_plate_thickness_m = 16;
  uint32 shear_planes = 17;
  double f_u_k = 18;
  repeated ConnectionAction actions = 19;
}
message CaseRow {
  string id = 1;
  string label_en = 2;
  string label_de = 3;
  string entry_id = 4;
  repeated CaseNumber numbers = 5;
  repeated CaseText texts = 6;
}
message Placement {
  string id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  double yaw = 5;
}
message Taper {
  string id = 1;
  string member_id = 2;
  string kind = 3;
  double taper_angle_rad = 4;
  double apex_depth_m = 5;
  double inner_radius_m = 6;
  double lamella_thickness_m = 7;
  double apex_angle_rad = 8;
  string tension_side = 9;
  uint32 rods = 10;
  double rod_resistance_n = 11;
}
message Cutout {
  string id = 1;
  string member_id = 2;
  string kind = 3;
  string face = 4;
  double distance_m = 5;
  double length_m = 6;
  double depth_m = 7;
  double centre_height_m = 8;
  double slope = 9;
  uint32 rods = 10;
  double rod_resistance_n = 11;
}
message Fastener {
  string id = 1;
  string connection_id = 2;
  string member_id = 3;
  uint32 columns = 4;
  uint32 lines = 5;
  double spacing_parallel_m = 6;
  double spacing_perpendicular_m = 7;
  double end_distance_m = 8;
  double edge_distance_m = 9;
  double offset_x_m = 10;
  double offset_y_m = 11;
  double load_angle_rad = 12;
  repeated FastenerPosition positions = 13;
}
message Panel {
  string id = 1;
  StrengthClass strength_class = 2;
  repeated PanelLayer layers = 3;
  double span_m = 4;
  double width_m = 5;
  double load_pa = 6;
  double fire_duration_s = 7;
}
message Floor {
  string id = 1;
  string member_id = 2;
  double span_m = 3;
  double width_m = 4;
  double joist_spacing_m = 5;
  double ei_l_n_m2_per_m = 6;
  double ei_b_n_m2_per_m = 7;
  double mass_kg_per_m2 = 8;
  double damping_ratio = 9;
  double permanent_load_pa = 10;
  double imposed_load_pa = 11;
  double psi2 = 12;
}
message Diaphragm {
  string id = 1;
  string kind = 2;
  string method = 3;
  double panel_width_m = 4;
  double wall_height_m = 5;
  double fastener_spacing_m = 6;
  uint32 panels = 7;
  double fastener_capacity_n = 8;
  double shear_ed_n = 9;
  double hold_down_n = 10;
  double diaphragm_force_n = 11;
  double diaphragm_length_m = 12;
  double shear_resistance_n_per_m = 13;
}
message Truss {
  string id = 1;
  string kind = 2;
  string product = 3;
  double span_m = 4;
  double height_m = 5;
  uint32 bays = 6;
  double chord_width_m = 7;
  double chord_depth_m = 8;
  double web_width_m = 9;
  double web_depth_m = 10;
  double chord_force_n = 11;
  double restraint_length_m = 12;
  double bracing_capacity_n_per_m = 13;
}
message Bracing {
  string id = 1;
  string kind = 2;
  string member_id = 3;
  uint32 stabilised_count = 4;
  double spacing_m = 5;
  double length_m = 6;
  double brace_width_m = 7;
  double brace_depth_m = 8;
  double compression_force_n = 9;
  double resistance_n = 10;
  double stiffness_n_per_m = 11;
}
message PanelLayer {
  string id = 1;
  double thickness_m = 2;
  string orientation = 3;
  string grade = 4;
}
message FastenerPosition {
  string id = 1;
  double x_m = 2;
  double y_m = 3;
}
message CaseNumber {
  string id = 1;
  double value = 2;
}
message CaseText {
  string id = 1;
  string value = 2;
}
message ConnectionAction {
  string id = 1;
  ActionKind kind = 2;
  LoadDurationClass load_duration = 3;
  double f_k_n = 4;
}
enum ActionKind {
  ACTION_KIND_PERMANENT = 0;
  ACTION_KIND_IMPOSED = 1;
  ACTION_KIND_SNOW = 2;
  ACTION_KIND_WIND = 3;
  ACTION_KIND_ACCIDENTAL = 4;
}
enum ImposedCategory {
  IMPOSED_CATEGORY_NOT_IMPOSED = 0;
  IMPOSED_CATEGORY_A = 1;
  IMPOSED_CATEGORY_B = 2;
  IMPOSED_CATEGORY_C = 3;
  IMPOSED_CATEGORY_D = 4;
  IMPOSED_CATEGORY_E = 5;
  IMPOSED_CATEGORY_F = 6;
  IMPOSED_CATEGORY_G = 7;
  IMPOSED_CATEGORY_H = 8;
  IMPOSED_CATEGORY_SNOW_HIGH = 9;
}
enum LoadDurationClass {
  LOAD_DURATION_CLASS_PERMANENT = 0;
  LOAD_DURATION_CLASS_LONG = 1;
  LOAD_DURATION_CLASS_MEDIUM = 2;
  LOAD_DURATION_CLASS_SHORT = 3;
  LOAD_DURATION_CLASS_INSTANTANEOUS = 4;
}
message CharacteristicAction {
  string id = 1;
  ActionKind kind = 2;
  ImposedCategory category = 3;
  LoadDurationClass load_duration = 4;
  double q_line_n_per_m = 5;
  double f_point_n = 6;
  double m_k_nm = 7;
  double v_k_n = 8;
  double n_k_n = 9;
  double n_t_k_n = 10;
  double f_c90_k_n = 11;
}
