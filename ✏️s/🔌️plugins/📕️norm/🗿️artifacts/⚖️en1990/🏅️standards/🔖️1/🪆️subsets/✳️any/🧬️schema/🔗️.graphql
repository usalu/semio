enum ImportanceClass { I II III IV }
# 📸️ En1990Artifact GraphQL mirror
enum AnnexChoice { En De }

type PermanentAction { id: String! kind: String! gk: Float! }
type VariableAction { id: String! category: String! qk: Float! }
type AccidentalAction { id: String! ad: Float! }
type SeismicAction { id: String! aEk: Float!
  importanceClass: ImportanceClass! }
type Member {
  id: String!
  labelEn: String!
  labelDe: String!
  rdStr: Float!
  rdGeo: Float!
  rdEquStab: Float!
  rdEquDestab: Float!
  rdFat: Float!
  span: Float!
  deflectionW: Float!
  deflectionLimitRatio: Float!
  vibrationFrequency: Float!
  vibrationFrequencyMin: Float!
}
type BridgeSls {
  id: String!
  memberId: String!
  deckAcceleration: Float!
  deckAccelerationLimit: Float!
  deckTwist: Float!
  deckTwistLimit: Float!
  bridgeDeflection: Float!
  bridgeDeflectionLimit: Float!
}
type MemberEffect { memberId: String! actionId: String! influence: Float! }

type En1990Artifact {
  annex: AnnexChoice!
  projectId: String!
  structureKind: String!
  altitudeM: Float!
  consequenceClass: Int!
  reliabilityClass: Int!
  designWorkingLifeCategory: Int!
  designWorkingLifeYears: Float!
  referencePeriodYears: Float!
  supervisionLevel: String!
  inspectionLevel: String!
  kFiDeclared: Float!
  betaComputed: Float!
  permanents: [PermanentAction!]!
  variables: [VariableAction!]!
  accidentals: [AccidentalAction!]!
  seismics: [SeismicAction!]!
  members: [Member!]!
  bridgeSls: [BridgeSls!]!
  effects: [MemberEffect!]!
}
