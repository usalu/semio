  optional double vibration_frequency = 18;
  optional double vibration_frequency_min = 19;
  optional double frame_height = 20;
  optional double frame_drift = 21;
  optional double storey_height = 22;
  optional double storey_drift = 23;
  optional double material_strength_k = 24;
  optional double material_conversion_factor = 25;
