syntax = "proto3";
package semio.s.norm.en1990;
message En1990Diff {
  // @state artifact
  optional string annex = 1;
  // @state artifact
  optional string project_id = 2;
  // @state artifact
  optional string structure_kind = 3;
  // @state artifact
  optional double altitude_m = 4;
  // @state artifact
  optional uint32 consequence_class = 5;
  // @state artifact
  optional string reliability_class = 6;
  // @state artifact
  optional uint32 design_working_life_category = 7;
  // @state artifact
  optional double design_working_life_years = 8;
  // @state artifact
  optional double reference_period_years = 9;
  // @state artifact
  optional string supervision_level = 10;
  // @state artifact
  optional string inspection_level = 11;
  // @state artifact
  optional double beta_computed = 12;
  // @state artifact
  bytes permanents = 13;
  // @state artifact
  bytes variables = 14;
  // @state artifact
  bytes accidentals = 15;
  // @state artifact
  bytes seismics = 16;
  // @state artifact
  bytes members = 17;
  // @state artifact
  bytes bridge_sls = 18;
  // @state artifact
  repeated En1990EffectEdit effects = 19;
  // @state artifact
  bytes fatigue_spectra = 20;
  // @state artifact
  bytes reliability_analyses = 21;
  // @state artifact
  bytes test_series = 22;
  // @state artifact
  bytes placements = 23;
  // @state artifact
  CaseRowDelta cases = 24;
  // @state artifact
  bytes factor_overrides = 25;
  // @state artifact
  bytes traffic_groups = 26;
}
message En1990PermanentDelta {
  repeated En1990PermanentRemoval removed = 1;
  repeated En1990PermanentInsertion inserted = 2;
  repeated En1990PermanentRelocation moved = 3;
  repeated En1990PermanentModification modified = 4;
}
message En1990PermanentRemoval {
  string id = 1;
  uint32 index = 2;
}
message En1990PermanentInsertion {
  uint32 index = 1;
  PermanentAction row = 2;
}
message En1990PermanentRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message En1990PermanentModification {
  string id = 1;
  En1990PermanentPatch patch = 2;
}
message En1990PermanentPatch {
  optional string kind = 1;
  optional double gk = 2;
}
