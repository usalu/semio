// 🧬️ En1990 diff
syntax = "proto3";
package semio.s.norm.en1990.diff;

message En1990PermanentRemoval {
  string id = 1;
  uint32 index = 2;
}

message En1990PermanentInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message En1990PermanentRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message En1990PermanentModification {
  string id = 1;
  En1990PermanentPatch patch = 2;
}

message En1990PermanentDelta {
  repeated En1990PermanentRemoval removed = 1;
  repeated En1990PermanentInsertion inserted = 2;
  repeated En1990PermanentRelocation moved = 3;
  repeated En1990PermanentModification modified = 4;
}

message En1990PermanentPatch {
  optional string kind = 1;
  optional double gk = 2;
}

message En1990VariableRemoval {
  string id = 1;
  uint32 index = 2;
}

message En1990VariableInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message En1990VariableRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message En1990VariableModification {
  string id = 1;
  En1990VariablePatch patch = 2;
}

message En1990VariableDelta {
  repeated En1990VariableRemoval removed = 1;
  repeated En1990VariableInsertion inserted = 2;
  repeated En1990VariableRelocation moved = 3;
  repeated En1990VariableModification modified = 4;
}

message En1990VariablePatch {
  optional string category = 1;
  optional double qk = 2;
}

message En1990AccidentalRemoval {
  string id = 1;
  uint32 index = 2;
}

message En1990AccidentalInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message En1990AccidentalRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message En1990AccidentalModification {
  string id = 1;
  En1990AccidentalPatch patch = 2;
}

message En1990AccidentalDelta {
  repeated En1990AccidentalRemoval removed = 1;
  repeated En1990AccidentalInsertion inserted = 2;
  repeated En1990AccidentalRelocation moved = 3;
  repeated En1990AccidentalModification modified = 4;
}

message En1990AccidentalPatch {
  optional double ad = 1;
}

message En1990SeismicRemoval {
  string id = 1;
  uint32 index = 2;
}

message En1990SeismicInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message En1990SeismicRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message En1990SeismicModification {
  string id = 1;
  En1990SeismicPatch patch = 2;
}

message En1990SeismicDelta {
  repeated En1990SeismicRemoval removed = 1;
  repeated En1990SeismicInsertion inserted = 2;
  repeated En1990SeismicRelocation moved = 3;
  repeated En1990SeismicModification modified = 4;
}

message En1990SeismicPatch {
  optional double a_ek = 1;
  optional bytes importance_class = 2;
}

message En1990MemberRemoval {
  string id = 1;
  uint32 index = 2;
}

message En1990MemberInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message En1990MemberRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message En1990MemberModification {
  string id = 1;
  En1990MemberPatch patch = 2;
}

message En1990MemberDelta {
  repeated En1990MemberRemoval removed = 1;
  repeated En1990MemberInsertion inserted = 2;
  repeated En1990MemberRelocation moved = 3;
  repeated En1990MemberModification modified = 4;
}

message En1990MemberPatch {
  optional string label_en = 1;
  optional string label_de = 2;
  optional double rd_str = 3;
  optional double rd_geo = 4;
  optional double rd_equ_stab = 5;
  optional double rd_equ_destab = 6;
  optional double rd_fat = 7;
  optional double span = 8;
  optional double deflection_w = 9;
  optional double deflection_limit_ratio = 10;
  optional double vibration_frequency = 11;
  optional double vibration_frequency_min = 12;
}

message En1990BridgeSlsRemoval {
  string id = 1;
  uint32 index = 2;
}

message En1990BridgeSlsInsertion {
  uint32 index = 1;
  bytes row = 2;
}

message En1990BridgeSlsRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message En1990BridgeSlsModification {
  string id = 1;
  En1990BridgeSlsPatch patch = 2;
}

message En1990BridgeSlsDelta {
  repeated En1990BridgeSlsRemoval removed = 1;
  repeated En1990BridgeSlsInsertion inserted = 2;
  repeated En1990BridgeSlsRelocation moved = 3;
  repeated En1990BridgeSlsModification modified = 4;
}

message En1990BridgeSlsPatch {
  optional string member_id = 1;
  optional double deck_acceleration = 2;
  optional double deck_acceleration_limit = 3;
  optional double deck_twist = 4;
  optional double deck_twist_limit = 5;
  optional double bridge_deflection = 6;
  optional double bridge_deflection_limit = 7;
}

enum En1990RowOp {
  EN1990_ROW_OP_INSERT = 0;
  EN1990_ROW_OP_REMOVE = 1;
  EN1990_ROW_OP_REPLACE = 2;
}

message En1990EffectEdit {
  En1990RowOp op = 1;
  uint32 index = 2;
  string id = 3;
  optional bytes value = 4;
}

message En1990Diff {
  // @state artifact
  optional string annex = 1;
  // @state artifact
  optional string project_id = 2;
  // @state artifact
  optional string structure_kind = 3;
  // @state artifact
  optional double altitude_m = 4;
  // @state artifact
  optional uint32 consequence_class = 5;
  // @state artifact
  optional uint32 reliability_class = 6;
  // @state artifact
  optional uint32 design_working_life_category = 7;
  // @state artifact
  optional double design_working_life_years = 8;
  // @state artifact
  optional double reference_period_years = 9;
  // @state artifact
  optional string supervision_level = 10;
  // @state artifact
  optional string inspection_level = 11;
  // @state artifact
  optional double k_fi_declared = 12;
  // @state artifact
  optional double beta_computed = 13;
  // @state artifact
  En1990PermanentDelta permanents = 14;
  // @state artifact
  En1990VariableDelta variables = 15;
  // @state artifact
  En1990AccidentalDelta accidentals = 16;
  // @state artifact
  En1990SeismicDelta seismics = 17;
  // @state artifact
  En1990MemberDelta members = 18;
  // @state artifact
  En1990BridgeSlsDelta bridge_sls = 19;
  // @state artifact
  repeated En1990EffectEdit effects = 20;
}
