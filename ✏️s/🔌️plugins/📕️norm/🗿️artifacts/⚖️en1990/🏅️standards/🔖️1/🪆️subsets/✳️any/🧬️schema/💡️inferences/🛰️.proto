syntax = "proto3";
package semio.s.norm.en1990;
message En1990Inference {
  En1990Outline outline = 1;
}
message En1990Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
  uint32 check_count = 4;
  uint32 pass_count = 5;
  bool all_pass = 6;
  string governing_clause = 7;
  double governing_utilization = 8;
}
