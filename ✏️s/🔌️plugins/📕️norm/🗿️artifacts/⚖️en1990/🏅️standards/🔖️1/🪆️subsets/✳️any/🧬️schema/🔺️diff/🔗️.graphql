}

type En1990VariableRelocation {
  id: String!
  from: Int!
  to: Int!
}

type En1990VariableModification {
  id: String!
  patch: En1990VariablePatch!
}

type En1990VariablePatch {
  category: String
  qk: Float
}

type En1990AccidentalDelta {
  removed: [En1990AccidentalRemoval!]!
  inserted: [En1990AccidentalInsertion!]!
  moved: [En1990AccidentalRelocation!]!
