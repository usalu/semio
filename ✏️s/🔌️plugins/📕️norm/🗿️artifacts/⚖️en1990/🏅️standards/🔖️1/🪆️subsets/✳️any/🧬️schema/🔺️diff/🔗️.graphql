# 🧬️ En1990 diff schema — sparse scalar fields plus keyed row deltas.

type En1990Diff {
  annex: String @state(class: ARTIFACT)
  projectId: String @state(class: ARTIFACT)
  structureKind: String @state(class: ARTIFACT)
  altitudeM: Float @state(class: ARTIFACT)
  consequenceClass: Int @state(class: ARTIFACT)
  reliabilityClass: Int @state(class: ARTIFACT)
  designWorkingLifeCategory: Int @state(class: ARTIFACT)
  designWorkingLifeYears: Float @state(class: ARTIFACT)
  referencePeriodYears: Float @state(class: ARTIFACT)
  supervisionLevel: String @state(class: ARTIFACT)
  inspectionLevel: String @state(class: ARTIFACT)
  kFiDeclared: Float @state(class: ARTIFACT)
  betaComputed: Float @state(class: ARTIFACT)
  permanents: En1990PermanentDelta! @state(class: ARTIFACT)
  variables: En1990VariableDelta! @state(class: ARTIFACT)
  accidentals: En1990AccidentalDelta! @state(class: ARTIFACT)
  seismics: En1990SeismicDelta! @state(class: ARTIFACT)
  members: En1990MemberDelta! @state(class: ARTIFACT)
  bridgeSls: En1990BridgeSlsDelta! @state(class: ARTIFACT)
  effects: [En1990EffectEdit!]! @state(class: ARTIFACT)
}

type En1990PermanentDelta {
  removed: [En1990PermanentRemoval!]!
  inserted: [En1990PermanentInsertion!]!
  moved: [En1990PermanentRelocation!]!
  modified: [En1990PermanentModification!]!
}

type En1990PermanentRemoval {
  id: String!
  index: Int!
}

type En1990PermanentInsertion {
  index: Int!
  row: En1990PermanentAction!
}

type En1990PermanentRelocation {
  id: String!
  from: Int!
  to: Int!
}

type En1990PermanentModification {
  id: String!
  patch: En1990PermanentPatch!
}

type En1990PermanentPatch {
  kind: String
  gk: Float
}

type En1990VariableDelta {
  removed: [En1990VariableRemoval!]!
  inserted: [En1990VariableInsertion!]!
  moved: [En1990VariableRelocation!]!
  modified: [En1990VariableModification!]!
}

type En1990VariableRemoval {
  id: String!
