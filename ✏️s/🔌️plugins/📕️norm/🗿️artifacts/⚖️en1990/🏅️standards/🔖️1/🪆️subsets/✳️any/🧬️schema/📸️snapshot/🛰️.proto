syntax = "proto3";
package semio.norm.en1990;

enum AnnexChoice { ANNEX_CHOICE_UNSPECIFIED = 0; En = 1; De = 2; }
message PermanentAction { string id = 1; string kind = 2; double gk = 3; }
message VariableAction { string id = 1; string category = 2; double qk = 3; }
message AccidentalAction { string id = 1; double ad = 2; }
enum ImportanceClass { IMPORTANCE_CLASS_UNSPECIFIED = 0; I = 1; II = 2; III = 3; IV = 4; }
message SeismicAction { string id = 1; double a_ek = 2; ImportanceClass importance_class = 3; }
message Member {
  string id = 1; string label_en = 2; string label_de = 3;
  double rd_str = 4; double rd_geo = 5; double rd_equ_stab = 6; double rd_equ_destab = 7; double rd_fat = 8;
  double span = 9; double deflection_w = 10; double deflection_limit_ratio = 11;
  double vibration_frequency = 12; double vibration_frequency_min = 13;
}
message BridgeSls {
  string id = 1; string member_id = 2;
  double deck_acceleration = 3; double deck_acceleration_limit = 4;
  double deck_twist = 5; double deck_twist_limit = 6;
  double bridge_deflection = 7; double bridge_deflection_limit = 8;
}
message MemberEffect { string member_id = 1; string action_id = 2; double influence = 3; }
message En1990Snapshot {
  AnnexChoice annex = 1;
  string project_id = 2;
  string structure_kind = 3;
  double altitude_m = 4;
  uint32 consequence_class = 5;
  uint32 reliability_class = 6;
  uint32 design_working_life_category = 7;
  double design_working_life_years = 8;
  double reference_period_years = 9;
  string supervision_level = 10;
  string inspection_level = 11;
  double k_fi_declared = 12;
  double beta_computed = 13;
  repeated PermanentAction permanents = 14;
  repeated VariableAction variables = 15;
  repeated AccidentalAction accidentals = 16;
  repeated SeismicAction seismics = 17;
  repeated Member members = 18;
  repeated BridgeSls bridge_sls = 19;
  repeated MemberEffect effects = 20;
}
