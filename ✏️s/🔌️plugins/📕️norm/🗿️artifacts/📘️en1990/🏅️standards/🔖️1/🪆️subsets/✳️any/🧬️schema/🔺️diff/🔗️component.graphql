# 🧬️ En1990 diff schema — sparse field delta.

type En1990Diff {
  artifact: En1990Artifact @state(class: ARTIFACT)
  gK: Float @state(class: ARTIFACT)
  qK: En1990QkList @state(class: ARTIFACT)
  resistanceKn: Float @state(class: ARTIFACT)
  consequenceClass: Int @state(class: ARTIFACT)
  annex: String @state(class: ARTIFACT)
  seismicAEdKn: Float @state(class: ARTIFACT)
  selectedCheckIndex: Int @state(class: PRESENCE)
}

type En1990Artifact {
  gK: Float
  qK: [qKItem!]!
  resistanceKn: Float
  consequenceClass: Int
  annex: String
  seismicAEdKn: Float
  selectedCheckIndex: Int
}

type En1990QkEntry {
  category: String!
  value: Float!
}

type En1990QkList {
  values: [En1990QkEntry!]!
}