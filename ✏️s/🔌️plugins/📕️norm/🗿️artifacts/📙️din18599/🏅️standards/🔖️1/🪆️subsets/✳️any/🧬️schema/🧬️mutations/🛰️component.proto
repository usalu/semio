syntax = "proto3";
package semio.s.norm.din18599.mutation;

message Din18599Mutation {
  // @state artifact
  string use_class = 1;
  // @state artifact
  double heated_area_m2 = 2;
  // @state artifact
  uint32 occupants = 3;
  // @state artifact
  double h_t = 4;
  // @state artifact
  double h_v = 5;
  // @state artifact
  string climate = 6;
  // @state artifact
  double internal_gains_w_m2 = 7;
  // @state artifact
  double solar_gains_kwh = 8;
  // @state artifact
  double system_losses_kwh = 9;
  // @state artifact
  double renewable_kwh = 10;
  // @state artifact
  double annual_limit_kwh = 11;
  // @state artifact
  string energy_carrier = 12;
  // @state artifact
  double reference_q_p_kwh = 13;
}
