# 🧬️ En1997 mutations
enum AnnexChoice { de en }
input SoilLayerInput {
  id: String!
  soilType: String!
  depthTop: Float!
  depthBottom: Float!
  gamma: Float!
  gammaPrime: Float!
  phiPrimeDeg: Float!
  cohesionEffective: Float!
  cohesionUndrained: Float!
  oedometricModulus: Float!
  poissonRatio: Float!
  cptQc: Float!
  sptN: Float!
}
input SpreadFoundationInput {
  id: String!
  width: Float!
  length: Float!
  embedment: Float!
  baseInclinationDeg: Float!
  settlementLimit: Float!
}
input PileInput {
  id: String!
  pileType: String!
  diameter: Float!
  length: Float!
  count: Int!
  alphaS: Float!
  unitShaftResistance: Float!
  unitBaseResistance: Float!
  compressionPermanent: Float!
  compressionVariable: Float!
  tensionPermanent: Float!
  tensionVariable: Float!
}
union En1997Mutation =
  ChangeAnnex
  | ChangeGeotechnicalCategory
  | ChangeDesignSituation
  | ChangeDesignApproach
  | ChangeGroundwaterLevel
  | ChangeInvestigationDepth
  | ChangeFootingWidth
  | ChangeFootingEmbedment
  | ChangePileLength
  | ChangePileCount
  | ChangeWallBaseWidth
  | ChangeSlopeAngle
  | ChangeLayerPhiPrime
  | ChangeLayerOedometricModulus
  | InsertLayer
  | RemoveLayer
  | InsertFooting
  | RemoveFooting
  | InsertPile
  | RemovePile
type ChangeAnnex { mutation: String! newAnnex: AnnexChoice! }
type ChangeGeotechnicalCategory { mutation: String! newGeotechnicalCategory: Int! }
type ChangeDesignSituation { mutation: String! newDesignSituation: String! }
type ChangeDesignApproach { mutation: String! newDesignApproach: String! }
type ChangeGroundwaterLevel { mutation: String! newGroundwaterLevel: Float! }
type ChangeInvestigationDepth { mutation: String! newInvestigationDepth: Float! }
type ChangeFootingWidth { mutation: String! id: String! newWidth: Float! }
type ChangeFootingEmbedment { mutation: String! id: String! newEmbedment: Float! }
type ChangePileLength { mutation: String! id: String! newLength: Float! }
type ChangePileCount { mutation: String! id: String! newCount: Int! }
type ChangeWallBaseWidth { mutation: String! id: String! newBaseWidth: Float! }
type ChangeSlopeAngle { mutation: String! id: String! newAngleDeg: Float! }
type ChangeLayerPhiPrime { mutation: String! id: String! newPhiPrimeDeg: Float! }
type ChangeLayerOedometricModulus { mutation: String! id: String! newOedometricModulus: Float! }
type InsertLayer { mutation: String! index: Int! layer: SoilLayerInput! }
type RemoveLayer { mutation: String! index: Int! }
type InsertFooting { mutation: String! index: Int! footing: SpreadFoundationInput! }
type RemoveFooting { mutation: String! index: Int! }
type InsertPile { mutation: String! index: Int! pile: PileInput! }
type RemovePile { mutation: String! index: Int! }
