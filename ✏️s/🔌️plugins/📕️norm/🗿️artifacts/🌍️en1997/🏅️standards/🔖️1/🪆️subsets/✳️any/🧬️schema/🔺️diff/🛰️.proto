syntax = "proto3";
package semio.s.norm.en1997.diff;

message En1997LayersPatch {
  optional double oedometric_modulus = 1;
  optional double phi_prime_deg = 2;
}

message En1997LayersRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1997LayersInserted {
  uint64 index = 1;
}

message En1997LayersMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1997LayersModified {
  string id = 1;
  En1997LayersPatch patch = 2;
}

message En1997LayersRows {
  repeated En1997LayersRemoved removed = 1;
  repeated En1997LayersInserted inserted = 2;
  repeated En1997LayersMoved moved = 3;
  repeated En1997LayersModified modified = 4;
}

message En1997FootingsPatch {
  optional double width = 1;
  optional double embedment = 2;
}

message En1997FootingsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1997FootingsInserted {
  uint64 index = 1;
}

message En1997FootingsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1997FootingsModified {
  string id = 1;
  En1997FootingsPatch patch = 2;
}

message En1997FootingsRows {
  repeated En1997FootingsRemoved removed = 1;
  repeated En1997FootingsInserted inserted = 2;
  repeated En1997FootingsMoved moved = 3;
  repeated En1997FootingsModified modified = 4;
}

message En1997PilesPatch {
  optional double length = 1;
  optional uint32 count = 2;
}

message En1997PilesRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1997PilesInserted {
  uint64 index = 1;
}

message En1997PilesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1997PilesModified {
  string id = 1;
  En1997PilesPatch patch = 2;
}

message En1997PilesRows {
  repeated En1997PilesRemoved removed = 1;
  repeated En1997PilesInserted inserted = 2;
  repeated En1997PilesMoved moved = 3;
  repeated En1997PilesModified modified = 4;
}

message En1997RetainingWallsPatch {
  optional double base_width = 1;
}

message En1997RetainingWallsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1997RetainingWallsInserted {
  uint64 index = 1;
}

message En1997RetainingWallsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1997RetainingWallsModified {
  string id = 1;
  En1997RetainingWallsPatch patch = 2;
}

message En1997RetainingWallsRows {
  repeated En1997RetainingWallsRemoved removed = 1;
  repeated En1997RetainingWallsInserted inserted = 2;
  repeated En1997RetainingWallsMoved moved = 3;
  repeated En1997RetainingWallsModified modified = 4;
}

message En1997SlopesPatch {
  optional double angle_deg = 1;
}

message En1997SlopesRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1997SlopesInserted {
  uint64 index = 1;
}

message En1997SlopesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1997SlopesModified {
  string id = 1;
  En1997SlopesPatch patch = 2;
}

message En1997SlopesRows {
  repeated En1997SlopesRemoved removed = 1;
  repeated En1997SlopesInserted inserted = 2;
  repeated En1997SlopesMoved moved = 3;
  repeated En1997SlopesModified modified = 4;
}

message En1997UpliftCasesPatch {
  optional double permanent_stabilizing = 1;
  optional double permanent_destabilizing = 2;
  optional double variable_destabilizing = 3;
  optional double pore_pressure = 4;
  optional double total_stress = 5;
}

message En1997UpliftCasesRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1997UpliftCasesInserted {
  uint64 index = 1;
}

message En1997UpliftCasesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1997UpliftCasesModified {
  string id = 1;
  En1997UpliftCasesPatch patch = 2;
}

message En1997UpliftCasesRows {
  repeated En1997UpliftCasesRemoved removed = 1;
  repeated En1997UpliftCasesInserted inserted = 2;
  repeated En1997UpliftCasesMoved moved = 3;
  repeated En1997UpliftCasesModified modified = 4;
}

message En1997Diff {
  optional string structure_id = 1;
  optional uint32 geotechnical_category = 2;
  optional string design_situation = 3;
  optional string design_approach = 4;
  optional double groundwater_level = 5;
  optional double investigation_depth = 6;
  optional En1997LayersRows layers = 7;
  optional En1997FootingsRows footings = 8;
  optional En1997PilesRows piles = 9;
  optional En1997RetainingWallsRows retaining_walls = 10;
  optional En1997SlopesRows slopes = 11;
  optional En1997UpliftCasesRows uplift_cases = 12;
}
