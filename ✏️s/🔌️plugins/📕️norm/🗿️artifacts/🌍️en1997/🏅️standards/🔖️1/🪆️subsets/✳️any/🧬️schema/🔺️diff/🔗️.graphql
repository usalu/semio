type En1997Diff {
  structureId: String @state(class: ARTIFACT)
  geotechnicalCategory: Int @state(class: ARTIFACT)
  designSituation: String @state(class: ARTIFACT)
  designApproach: String @state(class: ARTIFACT)
  annex: AnnexChoice @state(class: ARTIFACT)
  groundwaterLevel: Float @state(class: ARTIFACT)
  investigationDepth: Float @state(class: ARTIFACT)
  layers: En1997LayersRows @state(class: ARTIFACT)
  footings: En1997FootingsRows @state(class: ARTIFACT)
  piles: En1997PilesRows @state(class: ARTIFACT)
  retainingWalls: En1997RetainingWallsRows @state(class: ARTIFACT)
  slopes: En1997SlopesRows @state(class: ARTIFACT)
  upliftCases: En1997UpliftCasesRows @state(class: ARTIFACT)
}
