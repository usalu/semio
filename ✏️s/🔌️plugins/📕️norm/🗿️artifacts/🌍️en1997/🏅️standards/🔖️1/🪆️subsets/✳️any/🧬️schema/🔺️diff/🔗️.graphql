# 🧬️ En1997 diff schema — keyed sparse diff: scalar setters, id/index/key keyed row diffs and per-field section patches.

type En1997LayersPatch {
  oedometricModulus: Float
  phiPrimeDeg: Float
}

type En1997LayersRemoved {
  id: String!
  index: Int!
}

type En1997LayersInserted {
  index: Int!
  row: SoilLayer!
}

type En1997LayersMoved {
  id: String!
  from: Int!
  to: Int!
}

type En1997LayersModified {
  id: String!
  patch: En1997LayersPatch!
}

type En1997LayersRows {
  removed: [En1997LayersRemoved!]!
  inserted: [En1997LayersInserted!]!
  moved: [En1997LayersMoved!]!
  modified: [En1997LayersModified!]!
}

type En1997FootingsPatch {
  width: Float
  embedment: Float
}

type En1997FootingsRemoved {
  id: String!
  index: Int!
}

type En1997FootingsInserted {
