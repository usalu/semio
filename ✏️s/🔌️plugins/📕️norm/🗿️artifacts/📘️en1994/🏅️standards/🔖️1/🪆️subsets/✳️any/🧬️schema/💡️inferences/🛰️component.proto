syntax = "proto3";
package semio.s.norm.en1994.inference;

// 💡️ En1994 inference schema — document outline (field/section list + entry count).

message En1994Inference {
  // @state inferred
  En1994Outline outline = 1;
}

message En1994Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
