syntax = "proto3";
package semio.s.norm.en1998.inference;

// 💡️ En1998 inference schema — document outline (field/section list + entry count).

message En1998Inference {
  // @state inferred
  En1998Outline outline = 1;
}

message En1998Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
