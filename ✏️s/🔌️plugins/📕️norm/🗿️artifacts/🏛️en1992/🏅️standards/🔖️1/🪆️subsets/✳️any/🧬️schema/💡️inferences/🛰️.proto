syntax = "proto3";
package semio.s.norm.en1992.inference;

// 💡️ En1992 inference schema — document outline (field/section list + entry count).

message En1992Inference {
  // @derived
  En1992Outline outline = 1;
}

message En1992Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
