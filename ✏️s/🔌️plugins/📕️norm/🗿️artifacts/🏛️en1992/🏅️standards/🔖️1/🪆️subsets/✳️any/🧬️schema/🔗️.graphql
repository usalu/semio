  stirrups: Stirrups
  punching: PunchingSpec
  prestress: PrestressSpec
  fire: FireSpec
  actions: [LoadCaseActions!]!
  useFem: Boolean!
  udl: Float!
  deflectionSensitive: Boolean!
  tightness: TightnessClass
  hdOverH: Float!
  liquidSigmaS: Float!
  liquidRhoPEff: Float!
  liquidFCtEff: Float!
  liquidSRMax: Float!
  bridgeSigmaC: Float!
  bridgeDeltaSigmaS: Float!
}
type Anchor {
  id: String!
  hEf: Float!
  cracked: Boolean!
  fUk: Float!
  fYk: Float!
  aS: Float!
  d: Float!
  c1: Float!
  nEd: Float!
  vEd: Float!
  fCk: Float!
}
type En1992Snapshot {
  annex: AnnexChoice! @state(class: ARTIFACT)
  title: String! @state(class: ARTIFACT)
  designWorkingLifeYears: Float! @state(class: ARTIFACT)
  deltaCDev: Float! @state(class: ARTIFACT)
  cementType: String! @state(class: ARTIFACT)
  concreteGrades: [ConcreteGrade!]! @state(class: ARTIFACT)
  reinforcementGrades: [ReinforcementGrade!]! @state(class: ARTIFACT)
  prestressSteels: [PrestressSteel!]! @state(class: ARTIFACT)
  members: [RcMember!]! @state(class: ARTIFACT)
  anchors: [Anchor!]! @state(class: ARTIFACT)
}
