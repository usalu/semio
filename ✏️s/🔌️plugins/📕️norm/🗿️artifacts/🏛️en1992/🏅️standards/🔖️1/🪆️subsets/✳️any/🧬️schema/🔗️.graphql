# 🧬️ En1992 snapshot — hierarchical SI subject (characteristic actions + materials catalogue).

enum AnnexChoice { EN DE }
enum MemberKind { BEAM SLAB COLUMN WALL FLAT_SLAB BRIDGE LIQUID_RETAINING }
enum SupportCondition { SIMPLY_SUPPORTED CONTINUOUS CANTILEVER FIXED }
enum ExposureClass { X0 XC1 XC2 XC3 XC4 XD1 XD2 XD3 XS1 XS2 XS3 XF1 XF2 XF3 XF4 XA1 XA2 XA3 }
enum FireRating { R30 R60 R90 R120 }
enum TightnessClass { TC0 TC1 TC2 }

type ConcreteGrade {
  id: String!
  name: String!
  fCk: Float!
  fCkCube: Float!
  fCm: Float!
  fCtm: Float!
  fCtk005: Float!
  eCm: Float!
  epsC2: Float!
  epsCu2: Float!
  epsC3: Float!
  epsCu3: Float!
  nParabola: Float!
}
type ReinforcementGrade {
  id: String!
  name: String!
  fYk: Float!
  eS: Float!
  k: Float!
  epsUk: Float!
}
type PrestressSteel { id: String! name: String! fPk: Float! fP01k: Float! }
type BarLayer {
  id: String!
  diameter: Float!
  count: Int!
  position: String!
  anchorageLength: Float!
  lapLength: Float!
  bondCondition: String!
  aggregateSize: Float!
}
type Stirrups { diameter: Float! spacing: Float! legs: Int! }
type PunchingSpec { columnWidth: Float! columnDepth: Float! columnPosition: String! asw: Float! }
type PrestressSpec { force: Float! area: Float! eccentricity: Float! lossRatio: Float! }
type FireSpec { rating: FireRating! axisDistance: Float! }
type LoadCaseActions {
  id: String!
  kind: String!
  category: String!
  source: String!
  gKLine: Float!
  qKLine: Float!
  pointForce: Float!
  mK: Float!
  nK: Float!
  vK: Float!
  tK: Float!
  vKPunch: Float!
}
type RcMember {
  id: String!
  labelEn: String!
  labelDe: String!
  kind: MemberKind!
  concreteGradeId: String!
  reinforcementGradeId: String!
  prestressSteelId: String!
  exposure: ExposureClass!
  width: Float!
  height: Float!
  effectiveDepth: Float!
  cover: Float!
  span: Float!
  support: SupportCondition!
  bucklingLength: Float!
