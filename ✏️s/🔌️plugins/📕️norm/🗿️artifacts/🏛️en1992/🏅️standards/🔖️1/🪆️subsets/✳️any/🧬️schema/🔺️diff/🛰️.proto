syntax = "proto3";
package semio.s.norm.en1992.diff;

message En1992StringList {
  repeated string values = 1;
}

message En1992Diff {
  // @state artifact
  optional string annex = 1;
  // @state artifact
  optional string title = 2;
  // @state artifact
  optional double design_working_life_years = 3;
  // @state artifact
  optional double delta_c_dev = 4;
  // @state artifact
  optional string cement_type = 5;
}
