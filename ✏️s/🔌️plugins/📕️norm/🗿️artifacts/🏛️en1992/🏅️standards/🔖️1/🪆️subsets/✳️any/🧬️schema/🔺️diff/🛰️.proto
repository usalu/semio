syntax = "proto3";
package semio.s.norm.en1992.diff;

message En1992ConcreteGradesPatch {
  optional double f_ck = 1;
}

message En1992ConcreteGradesRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1992ConcreteGradesInserted {
  uint64 index = 1;
}

message En1992ConcreteGradesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1992ConcreteGradesModified {
  string id = 1;
  En1992ConcreteGradesPatch patch = 2;
}

message En1992ConcreteGradesRows {
  repeated En1992ConcreteGradesRemoved removed = 1;
  repeated En1992ConcreteGradesInserted inserted = 2;
  repeated En1992ConcreteGradesMoved moved = 3;
  repeated En1992ConcreteGradesModified modified = 4;
}

message En1992ReinforcementGradesPatch {
  optional double f_yk = 1;
}

message En1992ReinforcementGradesRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1992ReinforcementGradesInserted {
  uint64 index = 1;
}

message En1992ReinforcementGradesMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1992ReinforcementGradesModified {
  string id = 1;
  En1992ReinforcementGradesPatch patch = 2;
}

message En1992ReinforcementGradesRows {
  repeated En1992ReinforcementGradesRemoved removed = 1;
  repeated En1992ReinforcementGradesInserted inserted = 2;
  repeated En1992ReinforcementGradesMoved moved = 3;
  repeated En1992ReinforcementGradesModified modified = 4;
}

message En1992PrestressSteelsPatch {
  optional string name = 1;
  optional double f_pk = 2;
  optional double f_p0_1k = 3;
}

message En1992PrestressSteelsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1992PrestressSteelsInserted {
  uint64 index = 1;
}

message En1992PrestressSteelsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1992PrestressSteelsModified {
  string id = 1;
  En1992PrestressSteelsPatch patch = 2;
}

message En1992PrestressSteelsRows {
  repeated En1992PrestressSteelsRemoved removed = 1;
  repeated En1992PrestressSteelsInserted inserted = 2;
  repeated En1992PrestressSteelsMoved moved = 3;
  repeated En1992PrestressSteelsModified modified = 4;
}

message En1992MembersLongitudinalPatch {
  optional double diameter = 1;
  optional uint32 count = 2;
}

message En1992MembersLongitudinalRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1992MembersLongitudinalInserted {
  uint64 index = 1;
}

message En1992MembersLongitudinalMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1992MembersLongitudinalModified {
  string id = 1;
  En1992MembersLongitudinalPatch patch = 2;
}

message En1992MembersLongitudinalRows {
  repeated En1992MembersLongitudinalRemoved removed = 1;
  repeated En1992MembersLongitudinalInserted inserted = 2;
  repeated En1992MembersLongitudinalMoved moved = 3;
  repeated En1992MembersLongitudinalModified modified = 4;
}

message En1992MembersActionsPatch {
  optional double m_k = 1;
  optional double n_k = 2;
  optional double v_k = 3;
}

message En1992MembersActionsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1992MembersActionsInserted {
  uint64 index = 1;
}

message En1992MembersActionsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1992MembersActionsModified {
  string id = 1;
  En1992MembersActionsPatch patch = 2;
}

message En1992MembersActionsRows {
  repeated En1992MembersActionsRemoved removed = 1;
  repeated En1992MembersActionsInserted inserted = 2;
  repeated En1992MembersActionsMoved moved = 3;
  repeated En1992MembersActionsModified modified = 4;
}

message En1992MembersPatch {
  optional double width = 1;
  optional double height = 2;
  optional double effective_depth = 3;
  optional double cover = 4;
  optional double span = 5;
  optional double fire_axis_distance = 6;
  optional double stirrups_spacing = 7;
  optional En1992MembersLongitudinalRows longitudinal = 8;
  optional En1992MembersActionsRows actions = 9;
}

message En1992MembersRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1992MembersInserted {
  uint64 index = 1;
}

message En1992MembersMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1992MembersModified {
  string id = 1;
  En1992MembersPatch patch = 2;
}

message En1992MembersRows {
  repeated En1992MembersRemoved removed = 1;
  repeated En1992MembersInserted inserted = 2;
  repeated En1992MembersMoved moved = 3;
  repeated En1992MembersModified modified = 4;
}

message En1992AnchorsPatch {
  optional double h_ef = 1;
  optional double a_s = 2;
}

message En1992AnchorsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1992AnchorsInserted {
  uint64 index = 1;
}

message En1992AnchorsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1992AnchorsModified {
  string id = 1;
  En1992AnchorsPatch patch = 2;
}

message En1992AnchorsRows {
  repeated En1992AnchorsRemoved removed = 1;
  repeated En1992AnchorsInserted inserted = 2;
  repeated En1992AnchorsMoved moved = 3;
  repeated En1992AnchorsModified modified = 4;
}

message En1992Diff {
  optional string title = 1;
  optional double design_working_life_years = 2;
  optional double delta_c_dev = 3;
  optional string cement_type = 4;
  optional En1992ConcreteGradesRows concrete_grades = 5;
  optional En1992ReinforcementGradesRows reinforcement_grades = 6;
  optional En1992PrestressSteelsRows prestress_steels = 7;
  optional En1992MembersRows members = 8;
  optional En1992AnchorsRows anchors = 9;
}
