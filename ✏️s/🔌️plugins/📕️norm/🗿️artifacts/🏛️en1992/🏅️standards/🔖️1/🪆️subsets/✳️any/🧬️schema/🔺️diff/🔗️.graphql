type En1992MembersPatch {
  exposure: ExposureClass
  width: Float
  height: Float
  effectiveDepth: Float
  cover: Float
  span: Float
  fireRating: FireRating
  fireAxisDistance: Float
  stirrupsSpacing: Float
  longitudinal: En1992MembersLongitudinalRows
  actions: En1992MembersActionsRows
}

type En1992MembersRemoved {
  id: String!
  index: Int!
}

type En1992MembersInserted {
  index: Int!
  row: RcMember!
}

type En1992MembersMoved {
  id: String!
  from: Int!
  to: Int!
}

type En1992MembersModified {
