# 🧬️ En1992 diff schema — keyed sparse diff: scalar setters, id/index/key keyed row diffs and per-field section patches.

type En1992ConcreteGradesPatch {
  fCk: Float
}

type En1992ConcreteGradesRemoved {
  id: String!
  index: Int!
}

type En1992ConcreteGradesInserted {
  index: Int!
  row: ConcreteGrade!
}

type En1992ConcreteGradesMoved {
  id: String!
  from: Int!
  to: Int!
}

type En1992ConcreteGradesModified {
  id: String!
  patch: En1992ConcreteGradesPatch!
}

type En1992ConcreteGradesRows {
  removed: [En1992ConcreteGradesRemoved!]!
  inserted: [En1992ConcreteGradesInserted!]!
  moved: [En1992ConcreteGradesMoved!]!
  modified: [En1992ConcreteGradesModified!]!
}

type En1992ReinforcementGradesPatch {
  fYk: Float
}

type En1992ReinforcementGradesRemoved {
  id: String!
  index: Int!
}

type En1992ReinforcementGradesInserted {
  index: Int!
  row: ReinforcementGrade!
}

type En1992ReinforcementGradesMoved {
  id: String!
  from: Int!
  to: Int!
}

type En1992ReinforcementGradesModified {
  id: String!
  patch: En1992ReinforcementGradesPatch!
}

type En1992ReinforcementGradesRows {
  removed: [En1992ReinforcementGradesRemoved!]!
  inserted: [En1992ReinforcementGradesInserted!]!
  moved: [En1992ReinforcementGradesMoved!]!
  modified: [En1992ReinforcementGradesModified!]!
}

