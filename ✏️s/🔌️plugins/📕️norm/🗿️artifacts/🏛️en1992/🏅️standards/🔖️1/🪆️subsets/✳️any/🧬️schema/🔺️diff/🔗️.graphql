# 🧬️ En1992 diff schema — sparse hierarchical field delta.

type En1992ConcreteGradeList { values: [ConcreteGrade!]! }
type En1992ReinforcementGradeList { values: [ReinforcementGrade!]! }
type En1992PrestressSteelList { values: [PrestressSteel!]! }
type En1992MemberList { values: [RcMember!]! }
type En1992AnchorList { values: [Anchor!]! }

type En1992Diff {
  artifact: En1992Artifact @state(class: ARTIFACT)
  annex: String @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  designWorkingLifeYears: Float @state(class: ARTIFACT)
  deltaCDev: Float @state(class: ARTIFACT)
  cementType: String @state(class: ARTIFACT)
  concreteGrades: En1992ConcreteGradeList @state(class: ARTIFACT)
  reinforcementGrades: En1992ReinforcementGradeList @state(class: ARTIFACT)
  prestressSteels: En1992PrestressSteelList @state(class: ARTIFACT)
  members: En1992MemberList @state(class: ARTIFACT)
  anchors: En1992AnchorList @state(class: ARTIFACT)
}
