  modified: [En1992AnchorsModified!]!
}

type En1992Diff {
  annex: AnnexChoice @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  designWorkingLifeYears: Float @state(class: ARTIFACT)
  deltaCDev: Float @state(class: ARTIFACT)
  cementType: String @state(class: ARTIFACT)
  concreteGrades: En1992ConcreteGradesRows @state(class: ARTIFACT)
  reinforcementGrades: En1992ReinforcementGradesRows @state(class: ARTIFACT)
  prestressSteels: En1992PrestressSteelsRows @state(class: ARTIFACT)
  members: En1992MembersRows @state(class: ARTIFACT)
  anchors: En1992AnchorsRows @state(class: ARTIFACT)
}
