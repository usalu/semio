syntax = "proto3";
package semio.norm.en1992;

message En1992ActionMutation {
  string id = 1;
  string kind = 2;
  string category = 3;
  string source = 4;
  double g_k_line = 5;
  double q_k_line = 6;
  double point_force = 7;
  double m_k = 8;
  double n_k = 9;
  double v_k = 10;
  double t_k = 11;
  double v_k_punch = 12;
}
message En1992MemberMutation {
  string id = 1;
  double cover = 2;
  double width = 3;
  double height = 4;
  double effective_depth = 5;
  double span = 6;
  repeated En1992ActionMutation actions = 7;
  bool use_fem = 8;
  double udl = 9;
  bool deflection_sensitive = 10;
}
message En1992Mutation {
  string annex = 1;
  string title = 2;
  double design_working_life_years = 3;
  double delta_c_dev = 4;
  string cement_type = 5;
  repeated En1992MemberMutation members = 6;
}
