type En1999Snapshot @state {
  annex: String! @state(artifact)
  materials: [AluminiumMaterial!]! @state(artifact)
  sections: [AluminiumSection!]! @state(artifact)
  members: [AluminiumMember!]! @state(artifact)
  connections: [AluminiumConnection!]! @state(artifact)
  fireScenarios: [FireScenario!]! @state(artifact)
  fatigueDetails: [FatigueDetail!]! @state(artifact)
  coldFormed: [ColdFormedSheet!]! @state(artifact)
  shells: [AluminiumShell!]! @state(artifact)
}
type AluminiumMaterial { id: String!, designation: String! }
type PlateElement { id: String!, width: Float!, thickness: Float!, outstand: Boolean!, welded: Boolean!, weldPosition: Float! }
type AluminiumSection { id: String!, kind: String!, height: Float!, width: Float!, flangeThickness: Float!, webThickness: Float!, outerDiameter: Float!, elements: [PlateElement!]! }
type MemberAction { id: String!, kind: String!, category: String!, source: String!, gKLine: Float!, qKLine: Float!, nK: Float!, vYK: Float!, vZK: Float!, mYK: Float!, mZK: Float! }
type AluminiumMember { id: String!, sectionId: String!, materialId: String!, length: Float!, support: String!, bucklingLengthY: Float!, bucklingLengthZ: Float!, bucklingLengthT: Float!, ltbLength: Float!, c1: Float!, restrainedLtb: Boolean!, actions: [MemberAction!]! }
type BoltGroup { material: String!, diameter: Float!, rows: Int!, boltsPerRow: Int!, edgeDistance: Float!, pitch: Float!, gauge: Float!, plateThickness: Float! }
type WeldGroup { fillerAlloy: String!, throat: Float!, length: Float!, betaW: Float!, hazExtent: Float! }
type AluminiumConnection { id: String!, memberId: String!, materialId: String!, kind: String!, actions: [MemberAction!]!, bolts: BoltGroup!, welds: WeldGroup! }
type FireScenario { id: String!, memberId: String!, thetaA: Float!, durationS: Float! }
type FatigueDetail { id: String!, memberId: String!, detailCategory: String!, deltaSigmaC: Float!, deltaSigmaEd: Float!, nCycles: Float!, m1: Float!, m2: Float! }
type ColdFormedSheet { id: String!, materialId: String!, thickness: Float!, width: Float!, span: Float!, welded: Boolean!, actions: [MemberAction!]! }
type AluminiumShell { id: String!, materialId: String!, radius: Float!, thickness: Float!, length: Float!, actions: [MemberAction!]! }
