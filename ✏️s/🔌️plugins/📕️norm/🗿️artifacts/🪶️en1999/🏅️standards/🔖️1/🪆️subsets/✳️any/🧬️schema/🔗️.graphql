  patchLoads: [PatchLoad!]!
  ringStiffeners: [RingStiffener!]!
  transverseStiffeners: [TransverseStiffener!]!
  reliabilityClass: String!
}
enum ProductForm {
  sheet
  extrudedProfile
  extrudedTube
  extrudedBar
  drawnTube
  forging
}
type AluminiumMaterial {
  id: String!
