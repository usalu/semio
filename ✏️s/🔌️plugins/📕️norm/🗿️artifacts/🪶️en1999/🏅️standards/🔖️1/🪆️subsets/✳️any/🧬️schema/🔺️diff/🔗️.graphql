# 🧬️ En1999 diff schema — keyed sparse diff: scalar setters, id/index/key keyed row diffs and per-field section patches.

type En1999MaterialsPatch {
  designation: String
}

type En1999MaterialsRemoved {
  id: String!
  index: Int!
}

type En1999MaterialsInserted {
  index: Int!
  row: AluminiumMaterial!
}

type En1999MaterialsMoved {
  id: String!
  from: Int!
  to: Int!
}

type En1999MaterialsModified {
  id: String!
  patch: En1999MaterialsPatch!
}

type En1999MaterialsRows {
  removed: [En1999MaterialsRemoved!]!
  inserted: [En1999MaterialsInserted!]!
  moved: [En1999MaterialsMoved!]!
  modified: [En1999MaterialsModified!]!
}

