// 🧬️ EN 1999 mutation schema — semantic kinds matching Rust `KINDS`.
syntax = "proto3";
package semio.s.norm.en1999.mutation;

// kind: change-annex
message ChangeAnnex {
  // @state artifact
  string new_annex = 1;
}

// kind: change-materials
message ChangeMaterials {
  // @state artifact
  bytes materials = 1;
}

// kind: change-sections
message ChangeSections {
  // @state artifact
  bytes sections = 1;
}

// kind: change-members
message ChangeMembers {
  // @state artifact
  bytes members = 1;
}

// kind: change-connections
message ChangeConnections {
  // @state artifact
  bytes connections = 1;
}

// kind: change-fire-scenarios
message ChangeFireScenarios {
  // @state artifact
  bytes fire_scenarios = 1;
}

// kind: change-fatigue-details
message ChangeFatigueDetails {
  // @state artifact
  bytes fatigue_details = 1;
}

// kind: change-cold-formed
message ChangeColdFormed {
  // @state artifact
  bytes cold_formed = 1;
}

// kind: change-shells
message ChangeShells {
  // @state artifact
  bytes shells = 1;
}

// kind: add-member
message AddMember {
  // @state artifact
  uint32 index = 1;
  // @state artifact
  bytes member = 2;
}

// kind: remove-member
message RemoveMember {
  // @state artifact
  string id = 1;
}

// kind: change-member-n-ed
message ChangeMemberNEd {
  // @state artifact
  string member_id = 1;
  // @state artifact
  string action_id = 2;
  // @state artifact
  double new_n_k = 3;
}

// kind: change-member-my-ed
message ChangeMemberMYEd {
  // @state artifact
  string member_id = 1;
  // @state artifact
  string action_id = 2;
  // @state artifact
  double new_m_y_k = 3;
}

// kind: change-member-buckling-length
message ChangeMemberBucklingLength {
  // @state artifact
  string member_id = 1;
  // @state artifact
  string axis = 2;
  // @state artifact
  double new_length = 3;
}

// kind: change-material-designation
message ChangeMaterialDesignation {
  // @state artifact
  string material_id = 1;
  // @state artifact
  string new_designation = 2;
}

// kind: change-plate-thickness
message ChangePlateThickness {
  // @state artifact
  string section_id = 1;
  // @state artifact
  string element_id = 2;
  // @state artifact
  double new_thickness = 3;
}

// kind: change-weld-throat
message ChangeWeldThroat {
  // @state artifact
  string connection_id = 1;
  // @state artifact
  double new_throat = 2;
}

// kind: change-bolt-count
message ChangeBoltCount {
  // @state artifact
  string connection_id = 1;
  // @state artifact
  uint32 new_rows = 2;
  // @state artifact
  uint32 new_bolts_per_row = 3;
}

message En1999Mutation {
  oneof payload {
    ChangeAnnex change_annex = 1;
    ChangeMaterials change_materials = 2;
    ChangeSections change_sections = 3;
    ChangeMembers change_members = 4;
    ChangeConnections change_connections = 5;
    ChangeFireScenarios change_fire_scenarios = 6;
    ChangeFatigueDetails change_fatigue_details = 7;
    ChangeColdFormed change_cold_formed = 8;
    ChangeShells change_shells = 9;
    AddMember add_member = 10;
    RemoveMember remove_member = 11;
    ChangeMemberNEd change_member_n_ed = 12;
    ChangeMemberMYEd change_member_my_ed = 13;
    ChangeMemberBucklingLength change_member_buckling_length = 14;
    ChangeMaterialDesignation change_material_designation = 15;
    ChangePlateThickness change_plate_thickness = 16;
    ChangeWeldThroat change_weld_throat = 17;
    ChangeBoltCount change_bolt_count = 18;
  }
}
