}

message En1999ShellsRows {
  repeated En1999ShellsRemoved removed = 1;
  repeated En1999ShellsInserted inserted = 2;
  repeated En1999ShellsMoved moved = 3;
  repeated En1999ShellsModified modified = 4;
}

message En1999Diff {
  optional En1999MaterialsRows materials = 1;
  optional En1999SectionsRows sections = 2;
  optional En1999MembersRows members = 3;
  optional En1999ConnectionsRows connections = 4;
  optional En1999FireScenariosRows fire_scenarios = 5;
  optional En1999FatigueDetailsRows fatigue_details = 6;
  optional En1999ColdFormedRows cold_formed = 7;
  optional En1999ShellsRows shells = 8;
}
