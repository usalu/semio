message En1999FatigueDetailsPatch {
  optional string member_id = 1;
  optional string detail_category = 2;
  optional double delta_sigma_c = 3;
  optional double delta_sigma_ed = 4;
  optional double n_cycles = 5;
  optional double m1 = 6;
  optional double m2 = 7;
