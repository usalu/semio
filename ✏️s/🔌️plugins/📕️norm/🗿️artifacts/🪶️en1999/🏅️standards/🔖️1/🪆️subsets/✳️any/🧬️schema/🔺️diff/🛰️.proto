message En1999ShellsPatch {
  optional string material_id = 1;
  optional double radius = 2;
  optional double thickness = 3;
  optional double length = 4;
}

message En1999ShellsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999ShellsInserted {
