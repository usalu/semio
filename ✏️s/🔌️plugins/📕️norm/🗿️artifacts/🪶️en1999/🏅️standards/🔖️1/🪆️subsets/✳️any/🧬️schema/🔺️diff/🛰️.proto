message En1999FatigueDetailsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999FatigueDetailsInserted {
  uint64 index = 1;
}

message En1999FatigueDetailsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1999FatigueDetailsModified {
  string id = 1;
  En1999FatigueDetailsPatch patch = 2;
}

message En1999FatigueDetailsRows {
  repeated En1999FatigueDetailsRemoved removed = 1;
  repeated En1999FatigueDetailsInserted inserted = 2;
  repeated En1999FatigueDetailsMoved moved = 3;
  repeated En1999FatigueDetailsModified modified = 4;
}

message En1999ColdFormedPatch {
  optional string material_id = 1;
  optional double thickness = 2;
  optional double width = 3;
  optional double span = 4;
  optional bool welded = 5;
}

message En1999ColdFormedRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999ColdFormedInserted {
  uint64 index = 1;
}

message En1999ColdFormedMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1999ColdFormedModified {
