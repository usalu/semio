message En1999ConnectionsModified {
  string id = 1;
  En1999ConnectionsPatch patch = 2;
}

message En1999ConnectionsRows {
  repeated En1999ConnectionsRemoved removed = 1;
  repeated En1999ConnectionsInserted inserted = 2;
  repeated En1999ConnectionsMoved moved = 3;
  repeated En1999ConnectionsModified modified = 4;
}

message En1999FireScenariosPatch {
  optional string member_id = 1;
  optional double theta_a = 2;
  optional double duration_s = 3;
}

message En1999FireScenariosRemoved {
