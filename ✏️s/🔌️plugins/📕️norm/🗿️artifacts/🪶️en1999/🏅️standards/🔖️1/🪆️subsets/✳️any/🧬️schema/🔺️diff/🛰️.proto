syntax = "proto3";
package semio.s.norm.en1999.diff;

message En1999MaterialsPatch {
  optional string designation = 1;
}

message En1999MaterialsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999MaterialsInserted {
  uint64 index = 1;
}

message En1999MaterialsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1999MaterialsModified {
  string id = 1;
  En1999MaterialsPatch patch = 2;
}

message En1999MaterialsRows {
  repeated En1999MaterialsRemoved removed = 1;
  repeated En1999MaterialsInserted inserted = 2;
  repeated En1999MaterialsMoved moved = 3;
  repeated En1999MaterialsModified modified = 4;
}

message En1999SectionsElementsPatch {
  optional double thickness = 1;
}

message En1999SectionsElementsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999SectionsElementsInserted {
  uint64 index = 1;
}

message En1999SectionsElementsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1999SectionsElementsModified {
  string id = 1;
  En1999SectionsElementsPatch patch = 2;
}

message En1999SectionsElementsRows {
  repeated En1999SectionsElementsRemoved removed = 1;
  repeated En1999SectionsElementsInserted inserted = 2;
  repeated En1999SectionsElementsMoved moved = 3;
  repeated En1999SectionsElementsModified modified = 4;
}

message En1999SectionsPatch {
  optional string kind = 1;
  optional double height = 2;
  optional double width = 3;
  optional double flange_thickness = 4;
  optional double web_thickness = 5;
  optional double outer_diameter = 6;
  optional En1999SectionsElementsRows elements = 7;
}

message En1999SectionsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999SectionsInserted {
  uint64 index = 1;
}

message En1999SectionsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1999SectionsModified {
  string id = 1;
  En1999SectionsPatch patch = 2;
}

message En1999SectionsRows {
  repeated En1999SectionsRemoved removed = 1;
  repeated En1999SectionsInserted inserted = 2;
  repeated En1999SectionsMoved moved = 3;
  repeated En1999SectionsModified modified = 4;
}

message En1999MembersActionsPatch {
  optional double n_k = 1;
  optional double m_y_k = 2;
}

message En1999MembersActionsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999MembersActionsInserted {
  uint64 index = 1;
}

message En1999MembersActionsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1999MembersActionsModified {
  string id = 1;
  En1999MembersActionsPatch patch = 2;
}

message En1999MembersActionsRows {
  repeated En1999MembersActionsRemoved removed = 1;
  repeated En1999MembersActionsInserted inserted = 2;
  repeated En1999MembersActionsMoved moved = 3;
  repeated En1999MembersActionsModified modified = 4;
}

message En1999MembersPatch {
  optional double buckling_length_y = 1;
  optional double buckling_length_z = 2;
  optional double buckling_length_t = 3;
  optional double ltb_length = 4;
  optional En1999MembersActionsRows actions = 5;
}

message En1999MembersRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999MembersInserted {
  uint64 index = 1;
}

message En1999MembersMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}

message En1999MembersModified {
  string id = 1;
  En1999MembersPatch patch = 2;
}

message En1999MembersRows {
  repeated En1999MembersRemoved removed = 1;
  repeated En1999MembersInserted inserted = 2;
  repeated En1999MembersMoved moved = 3;
  repeated En1999MembersModified modified = 4;
}

message En1999ConnectionsPatch {
  optional double welds_throat = 1;
  optional uint32 bolts_rows = 2;
  optional uint32 bolts_bolts_per_row = 3;
}

message En1999ConnectionsRemoved {
  string id = 1;
  uint64 index = 2;
}

message En1999ConnectionsInserted {
  uint64 index = 1;
}

message En1999ConnectionsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
