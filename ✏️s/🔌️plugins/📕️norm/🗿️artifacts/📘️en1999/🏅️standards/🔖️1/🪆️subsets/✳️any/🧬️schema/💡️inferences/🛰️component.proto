syntax = "proto3";
package semio.s.norm.en1999.inference;

// 💡️ En1999 inference schema — document outline (field/section list + entry count).

message En1999Inference {
  // @state inferred
  En1999Outline outline = 1;
}

message En1999Outline {
  repeated string section_outline = 1;
  uint32 field_count = 2;
  uint32 entry_count = 3;
}
