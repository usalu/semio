message En1991FatigueModelPatch {
  optional string model = 1;
  optional uint32 lane = 2;
  optional double assumed_axle_load = 3;
  optional double assumed_udl = 4;
}
message En1991SupportCollisionPatch {
  optional string location = 1;
  optional double assumed_force_x = 2;
  optional double assumed_force_y = 3;
  optional double height = 4;
  optional double position_x = 5;
}
message En1991LocalFirePatch {
  optional double fire_diameter = 1;
  optional double heat_release_rate = 2;
  optional double ceiling_height = 3;
  optional double horizontal_distance = 4;
  optional double assumed_flux = 5;
}
message En1991SnowGuardPatch {
  optional string roof_id = 1;
  optional double slope_length = 2;
  optional double assumed_force = 3;
}
message En1991RailDerailmentPatch {
  optional string situation = 1;
  optional double assumed_line_load = 2;
  optional double loaded_length = 3;
  optional double offset = 4;
}
message En1991RailLoadGroupPatch {
  optional string load_group = 1;
  optional double factor_vertical = 2;
  optional double factor_longitudinal = 3;
  optional double factor_lateral = 4;
  optional double assumed_axle_load = 5;
  optional double assumed_udl = 6;
  optional double assumed_longitudinal = 7;
  optional double assumed_lateral = 8;
}
message En1991DustExplosionPatch {
  optional double kst = 1;
  optional double p_max = 2;
  optional double volume = 3;
  optional double vent_area = 4;
  optional double static_opening_pressure = 5;
  optional double design_pressure = 6;
}
