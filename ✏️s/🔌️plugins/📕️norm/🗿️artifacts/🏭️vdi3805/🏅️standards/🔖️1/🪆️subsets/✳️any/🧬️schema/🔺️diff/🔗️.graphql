# 🧬️ Vdi3805 diff schema — keyed sparse diff: scalar setters, id/index/key keyed row diffs and per-field section patches.

type Vdi3805ManufacturerFilePatch {
  headerVersion: String
  manufacturer: String
  buildingSystemNumber: BuildingSystemNumber
  created: String
  charset: String
  recordCount: Int
  extensions: ExtensionBag
}

type Vdi3805ProductsPatch {
  title: [LocalizedText!]
  configuration: Configuration
}

type Vdi3805ProductsRemoved {
  id: String!
  index: Int!
}

type Vdi3805ProductsInserted {
  index: Int!
  row: CatalogueProduct!
}

type Vdi3805ProductsMoved {
  id: String!
  from: Int!
  to: Int!
}

type Vdi3805ProductsModified {
  id: String!
  patch: Vdi3805ProductsPatch!
}

type Vdi3805ProductsRows {
  removed: [Vdi3805ProductsRemoved!]!
  inserted: [Vdi3805ProductsInserted!]!
  moved: [Vdi3805ProductsMoved!]!
  modified: [Vdi3805ProductsModified!]!
}

type Vdi3805EditionProfileEntry {
  key: String!
  value: EditionProfileChoice!
}

type Vdi3805EditionProfileRows {
  added: [Vdi3805EditionProfileEntry!]!
  removed: [String!]!
  modified: [Vdi3805EditionProfileEntry!]!
}

type Vdi3805GeometryConnectionsPatchDiameterMmValue {
  value: Float
}

type Vdi3805GeometryConnectionsPatch {
  medium: String
  position: [Float!]
  direction: [Float!]
  diameterMm: Vdi3805GeometryConnectionsPatchDiameterMmValue
}

type Vdi3805GeometryConnectionsRemoved {
  id: String!
  index: Int!
}

type Vdi3805GeometryConnectionsInserted {
  index: Int!
  row: ConnectionPoint!
}

type Vdi3805GeometryConnectionsMoved {
  id: String!
  from: Int!
  to: Int!
}

type Vdi3805GeometryConnectionsModified {
  id: String!
  patch: Vdi3805GeometryConnectionsPatch!
}

type Vdi3805GeometryConnectionsRows {
  removed: [Vdi3805GeometryConnectionsRemoved!]!
  inserted: [Vdi3805GeometryConnectionsInserted!]!
  moved: [Vdi3805GeometryConnectionsMoved!]!
  modified: [Vdi3805GeometryConnectionsModified!]!
}

type Vdi3805GeometryEntry {
  key: String!
  value: ParametricGeometry!
}

type Vdi3805GeometryPatch {
  key: String!
  bbox: BoundingBox
  parameters: JSON
  connections: Vdi3805GeometryConnectionsRows
}

type Vdi3805GeometryRows {
  added: [Vdi3805GeometryEntry!]!
  removed: [String!]!
  modified: [Vdi3805GeometryPatch!]!
}

type Vdi3805CurvesEntry {
  key: String!
  value: CharacteristicCurve!
}

type Vdi3805CurvesPatch {
  key: String!
  points: [CurvePoint!]
}

type Vdi3805CurvesRows {
  added: [Vdi3805CurvesEntry!]!
  removed: [String!]!
  modified: [Vdi3805CurvesPatch!]!
}

type Vdi3805LimitsPatch {
  maxFileBytes: Int
  maxRecords: Int
  maxFieldLength: Int
  maxNestingDepth: Int
}

type Vdi3805Diff {
  manufacturerFile: Vdi3805ManufacturerFilePatch @state(class: ARTIFACT)
  products: Vdi3805ProductsRows @state(class: ARTIFACT)
  catalogExtensions: ExtensionBag @state(class: ARTIFACT)
  editionProfile: Vdi3805EditionProfileRows @state(class: ARTIFACT)
  correctionAsOf: EditionId @state(class: ARTIFACT)
  strictMode: Boolean @state(class: ARTIFACT)
  geometry: Vdi3805GeometryRows @state(class: ARTIFACT)
  curves: Vdi3805CurvesRows @state(class: ARTIFACT)
  limits: Vdi3805LimitsPatch @state(class: ARTIFACT)
}
