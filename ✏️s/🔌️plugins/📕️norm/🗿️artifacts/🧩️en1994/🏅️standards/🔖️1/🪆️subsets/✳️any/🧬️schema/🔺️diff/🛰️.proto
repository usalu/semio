syntax = "proto3";
package semio.s.norm.en1994;
message En1994Diff {
  // @state artifact
  optional string annex = 1;
  // @state artifact
  optional string structure_kind = 2;
  // @state artifact
  optional double steel_f_y_pa = 3;
  // @state artifact
  optional En1994BeamsRows beams = 4;
  // @state artifact
  optional En1994ColumnsRows columns = 5;
  // @state artifact
  optional En1994SlabsRows slabs = 6;
  // @state artifact
  optional En1994PlacementsRows placements = 7;
  // @state artifact
  optional En1994StudsRows studs = 8;
  // @state artifact
  optional string fire_rating = 9;
  // @state artifact
  optional double insulation_thickness_m = 10;
  // @state artifact
  optional string fatigue_detail = 11;
  // @state artifact
  optional string reliability_class = 12;
  // @state artifact
  optional CaseRowDelta cases = 13;
}
message En1994BeamsActionsInserted {
  uint64 index = 1;
  CharacteristicAction row = 2;
}
message En1994BeamsActionsModified {
  string id = 1;
  En1994BeamsActionsPatch patch = 2;
}
message En1994BeamsActionsMoved {
  string id = 1;
  uint64 from = 2;
  uint64 to = 3;
}
message En1994BeamsActionsPatch {
  optional string kind = 1;
  optional string category = 2;
  optional string stage = 3;
  optional double q_area_pa = 4;
  optional double f_k_n = 5;
  optional double delta_sigma_k_pa = 6;
  optional double delta_tau_k_pa = 7;
  optional double x_m = 8;
}
message En1994BeamsActionsRemoved {
  string id = 1;
  uint64 index = 2;
}
message En1994BeamsActionsRows {
  repeated En1994BeamsActionsRemoved removed = 1;
  repeated En1994BeamsActionsInserted inserted = 2;
  repeated En1994BeamsActionsMoved moved = 3;
  repeated En1994BeamsActionsModified modified = 4;
}
