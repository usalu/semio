message En1994BeamsRows {
  repeated En1994BeamsRemoved removed = 1;
  repeated En1994BeamsInserted inserted = 2;
  repeated En1994BeamsMoved moved = 3;
  repeated En1994BeamsModified modified = 4;
}
message En1994ColumnsActionsInserted {
