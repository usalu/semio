syntax = "proto3";
package semio.s.norm.en1994.diff;

message En1994BeamsActionsPatch {
  uint64 index = 1;
  optional double q_area_pa = 2;
}

message En1994BeamsActionsRows {
  repeated En1994BeamsActionsPatch modified = 1;
}

message En1994BeamsPatch {
  uint64 index = 1;
  optional double span_m = 2;
  optional double slab_thickness_m = 3;
  optional string construction = 4;
  optional double transverse_as_m2_per_m = 5;
  optional double studs_diameter_m = 6;
  optional double studs_f_u_pa = 7;
  optional double studs_spacing_m = 8;
  optional uint32 studs_total_count = 9;
  optional En1994BeamsActionsRows actions = 10;
}

message En1994BeamsInserted {
  uint64 index = 1;
}

message En1994BeamsRows {
  repeated uint64 removed = 1;
  repeated En1994BeamsInserted inserted = 2;
  repeated En1994BeamsPatch modified = 3;
}

message En1994ColumnsActionsPatch {
  uint64 index = 1;
  optional double n_k_n = 2;
}

message En1994ColumnsActionsRows {
  repeated En1994ColumnsActionsPatch modified = 1;
}

message En1994ColumnsPatch {
  uint64 index = 1;
  optional string kind = 2;
  optional En1994ColumnsActionsRows actions = 3;
}

message En1994ColumnsInserted {
  uint64 index = 1;
}

message En1994ColumnsRows {
  repeated uint64 removed = 1;
  repeated En1994ColumnsInserted inserted = 2;
  repeated En1994ColumnsPatch modified = 3;
}

message En1994SlabsActionsPatch {
  uint64 index = 1;
  optional double q_area_pa = 2;
}

message En1994SlabsActionsRows {
  repeated En1994SlabsActionsPatch modified = 1;
}

message En1994SlabsPatch {
  uint64 index = 1;
  optional double concrete_thickness_m = 2;
  optional En1994SlabsActionsRows actions = 3;
}

message En1994SlabsInserted {
  uint64 index = 1;
}

message En1994SlabsRows {
  repeated uint64 removed = 1;
  repeated En1994SlabsInserted inserted = 2;
  repeated En1994SlabsPatch modified = 3;
}

message En1994Diff {
  optional string structure_kind = 1;
  optional double steel_f_y_pa = 2;
  optional En1994BeamsRows beams = 3;
  optional En1994ColumnsRows columns = 4;
  optional En1994SlabsRows slabs = 5;
  optional string fire_rating = 6;
  optional double insulation_thickness_m = 7;
  optional string fatigue_detail = 8;
}
