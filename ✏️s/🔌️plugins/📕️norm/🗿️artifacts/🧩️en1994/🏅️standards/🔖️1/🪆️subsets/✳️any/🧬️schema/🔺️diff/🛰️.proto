syntax = "proto3";
package semio.s.norm.en1994.diff;

message En1994Diff {
  // @state artifact
  optional En1994Artifact artifact = 1;
  // @state artifact
  optional string annex = 2;
  // @state artifact
  optional double m_ed_knm = 3;
  // @state artifact
  optional double v_ed_kn = 4;
  // @state artifact
  optional double m_pla = 5;
  // @state artifact
  optional double m_pl_rd = 6;
  // @state artifact
  optional double eta = 7;
  // @state artifact
  optional double v_l_rd = 8;
  // @state artifact
  optional double insulation_thickness_mm = 9;
  // @state artifact
  optional string fire_rating = 10;
  // @state artifact
  optional string deck_type = 11;
  // @state artifact
  optional double delta_sigma_mpa = 12;
  // @state artifact
  optional string fatigue_detail = 13;
  // @state artifact
  optional double d_mm = 14;
  // @state artifact
  optional double h_sc_mm = 15;
  // @state artifact
  optional double f_ck_mpa = 16;
  // @state artifact
  optional double f_u_mpa = 17;
  // @state artifact
  optional double e_cm_mpa = 18;
  // @state artifact
  optional double v_ed_per_stud_kn = 19;
  // @state artifact
  optional double span_m = 20;
  // @state artifact
  optional double f_y_mpa = 21;
  // @state artifact
  optional double n_cycles_stud = 22;
  // @state artifact
  optional double delta_tau_stud_mpa = 23;
  // @state presence
  optional uint32 selected_check_index = 24;
}

message En1994Artifact {
  string annex = 1;
  double m_ed_knm = 2;
  double v_ed_kn = 3;
  double m_pla = 4;
  double m_pl_rd = 5;
  double eta = 6;
  double v_l_rd = 7;
  double insulation_thickness_mm = 8;
  string fire_rating = 9;
  string deck_type = 10;
  double delta_sigma_mpa = 11;
  string fatigue_detail = 12;
  double d_mm = 13;
  double h_sc_mm = 14;
  double f_ck_mpa = 15;
  double f_u_mpa = 16;
  double e_cm_mpa = 17;
  double v_ed_per_stud_kn = 18;
  double span_m = 19;
  double f_y_mpa = 20;
  double n_cycles_stud = 21;
  double delta_tau_stud_mpa = 22;
  optional uint32 selected_check_index = 23;
}

message En1994StringList { repeated string values = 1; }
