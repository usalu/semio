  fatigueDetail: String
  dMm: Float
  hScMm: Float
  fCkMpa: Float
  fUMpa: Float
  eCmMpa: Float
  vEdPerStudKn: Float
  spanM: Float
  fYMpa: Float
  nCyclesStud: Float
  deltaTauStudMpa: Float
  selectedCheckIndex: Int
}