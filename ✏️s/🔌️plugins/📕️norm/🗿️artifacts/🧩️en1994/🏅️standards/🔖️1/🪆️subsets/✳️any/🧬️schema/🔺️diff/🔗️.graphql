# 🧬️ En1994 diff schema — sparse field delta.

type En1994Diff {
  artifact: En1994Artifact @state(class: ARTIFACT)
  annex: String @state(class: ARTIFACT)
  mEdKnm: Float @state(class: ARTIFACT)
  vEdKn: Float @state(class: ARTIFACT)
  mPla: Float @state(class: ARTIFACT)
  mPlRd: Float @state(class: ARTIFACT)
  eta: Float @state(class: ARTIFACT)
  vLRd: Float @state(class: ARTIFACT)
  insulationThicknessMm: Float @state(class: ARTIFACT)
  fireRating: String @state(class: ARTIFACT)
  deckType: String @state(class: ARTIFACT)
  deltaSigmaMpa: Float @state(class: ARTIFACT)
  fatigueDetail: String @state(class: ARTIFACT)
  dMm: Float @state(class: ARTIFACT)
  hScMm: Float @state(class: ARTIFACT)
  fCkMpa: Float @state(class: ARTIFACT)
  fUMpa: Float @state(class: ARTIFACT)
  eCmMpa: Float @state(class: ARTIFACT)
  vEdPerStudKn: Float @state(class: ARTIFACT)
  spanM: Float @state(class: ARTIFACT)
  fYMpa: Float @state(class: ARTIFACT)
  nCyclesStud: Float @state(class: ARTIFACT)
  deltaTauStudMpa: Float @state(class: ARTIFACT)
  selectedCheckIndex: Int @state(class: PRESENCE)
}

