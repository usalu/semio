semio-s-artifact-norm-en1994-model = { workspace = true }
semio-s-artifact-norm-en1994-mut-beams = { workspace = true }
semio-s-artifact-norm-en1994-mut-columns-slabs = { workspace = true }
semio-s-artifact-norm-en1994-mut-project = { workspace = true }
semio-s-artifact-norm-en1994-mut-studs = { workspace = true }
semio-s-artifact-norm-en1994-mutations = { workspace = true }
