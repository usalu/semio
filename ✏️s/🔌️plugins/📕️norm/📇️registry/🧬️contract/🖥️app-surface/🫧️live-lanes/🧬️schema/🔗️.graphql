# 🫧️ Live lanes GraphQL twin, mirrors ./🦀️.rs (generated by wp02-gen-twins.py); external types: EntityRef, Vec3.
#import 🎬️structural-scene/🧬️schema/🔗️.graphql

scalar JSON

type FieldWrite {
  path: String!
  value: JSON!
}

type DragPreview {
  handle: String!
  writes: [FieldWrite!]!
  startedSeq: Int!
  origin: Float!
  s: Float!
  entry: String!
}

type GhostPreview {
  writes: [FieldWrite!]!
  source: GhostSource!
}

type EvalProgress {
  running: [String!]!
  done: Int!
  total: Int!
  cancelled: Boolean!
}

type NormTransient {
  drag: DragPreview
  ghost: GhostPreview
  eval: EvalProgress!
  peers: [PeerDrag!]!
  view: ViewLane!
}

type ViewLane {
  activeField: String
  track: String
  value: Float
  playing: Boolean!
  clock: Float!
  speed: Float!
  units: String
  item: Int
  check: Int
  group: Int
  menu: Boolean!
  frame: Boolean!
}

type PeerDrag {
  user: String!
  drag: DragPreview!
}

type CameraPose {
  eye: Vec3!
  target: Vec3!
  up: Vec3!
  fovY: Float!
}

type NormPresence {
  user: String!
  selection: [EntityRef!]!
  hover: EntityRef
  camera: CameraPose
  drag: DragPreview
}

enum Lane {
  PersistedShared
  PersistedLocal
  EphemeralShared
  EphemeralLocal
}

type GhostSourceRemedyData {
  checkId: String!
  index: Int!
}

type GhostSourceRemedy {
  kind: String!
  data: GhostSourceRemedyData!
}

type GhostSourceHover {
  kind: String!
}

type GhostSourceInsertData {
  spec: String!
  kind: EntityKind!
  at: Vec3!
}

type GhostSourceInsert {
  kind: String!
  data: GhostSourceInsertData!
}

union GhostSource = GhostSourceRemedy | GhostSourceHover | GhostSourceInsert
