[package]
workspace = "../../../../.."
name = "semio-s-plugin-norm-app-surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Norm app surface: panels, windows, field meta, tool jobs and the retained editor"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
compliance-testing = ["dep:serde", "dep:serde_json", "dep:semio-framework-artifact-reference"]

[dependencies]
pack = { workspace = true }
semio-framework = { workspace = true }
semio-framework-action-bus = { path = "../../../../../../../../🧰️framework/🔨️modules/🎯️action-bus/📦️packages/🦀️rust" }
semio-framework-artifact-reference = { workspace = true, optional = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-plugin-norm-compliance = { workspace = true }
semio-s-plugin-norm-results-config = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
semio-framework-ui-contract = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
serde_json = { workspace = true }
