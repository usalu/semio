# 🕹️handles GraphQL twin, mirrors ./🦀️.rs (generated by wp02-gen-twins.py); external types: EntityRef, Interval, LocalizedCopy, Vec3.

type Affine {
  base: Float!
  k: Float!
}

type FieldBinding {
  path: String!
  map: Affine!
  unit: String!
  quantise: Quantise
}

type SnapRule {
  grid: Float
  increment: Float
  targets: [Float!]!
  catalogue: [Float!]!
  tolerance: Float!
}

type Handle {
  id: String!
  entity: EntityRef!
  kind: HandleKind!
  anchor: Vec3!
  grip: GripStyle!
  writes: [FieldBinding!]!
  snap: SnapRule!
  limits: Interval
  accessibleName: LocalizedCopy!
}

type HandleDrag {
  handle: String!
  s: Float!
  startedSeq: Int!
}

type ResolvedWrite {
  path: String!
  value: Float!
  token: String
  unit: String!
}

type ChoiceToken {
  token: String!
  label: LocalizedCopy!
}

enum GripStyle {
  Arrow
  Diamond
  Ring
}

type QuantiseRoundData {
  step: Float!
}

type QuantiseRound {
  kind: String!
  data: QuantiseRoundData!
}

type QuantiseChoiceData {
  values: [Float!]!
}

type QuantiseChoice {
  kind: String!
  data: QuantiseChoiceData!
}

type QuantiseInt {
  kind: String!
}

type QuantiseDecadesData {
  perDecade: Float!
}

type QuantiseDecades {
  kind: String!
  data: QuantiseDecadesData!
}

type QuantiseTokenData {
  tokens: [ChoiceToken!]!
}

type QuantiseToken {
  kind: String!
  data: QuantiseTokenData!
}

union Quantise = QuantiseRound | QuantiseChoice | QuantiseInt | QuantiseDecades | QuantiseToken

type HandleKindTranslateData {
  axis: Vec3!
}

type HandleKindTranslate {
  kind: String!
  data: HandleKindTranslateData!
}

type HandleKindTranslatePlaneData {
  normal: Vec3!
}

type HandleKindTranslatePlane {
  kind: String!
  data: HandleKindTranslatePlaneData!
}

type HandleKindScalarAlongData {
  axis: Vec3!
}

type HandleKindScalarAlong {
  kind: String!
  data: HandleKindScalarAlongData!
}

type HandleKindRadialData {
  centre: Vec3!
}

type HandleKindRadial {
  kind: String!
  data: HandleKindRadialData!
}

type HandleKindAngularData {
  axis: Vec3!
  centre: Vec3!
}

type HandleKindAngular {
  kind: String!
  data: HandleKindAngularData!
}

type HandleKindDimensionLine {
  kind: String!
}

type HandleKindCountStepper {
  kind: String!
}

type HandleKindChoiceStepper {
  kind: String!
}

type HandleKindFaceOffsetData {
  normal: Vec3!
}

type HandleKindFaceOffset {
  kind: String!
  data: HandleKindFaceOffsetData!
}

union HandleKind = HandleKindTranslate | HandleKindTranslatePlane | HandleKindScalarAlong | HandleKindRadial | HandleKindAngular | HandleKindDimensionLine | HandleKindCountStepper | HandleKindChoiceStepper | HandleKindFaceOffset
