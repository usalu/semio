[package]
name = "semio-s-plugin-lowpoly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lowpoly plugin - one crate for the lowpoly artifact (diff/op/dsl/pack/spr/engine) and the lowpoly play app (commands/modes/windows/options/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:lowpoly"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "lowpoly"
ports = { react = 6078, wgpu = 6178 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-s-3d = { path = "../../../../🔨️modules/🧊️3d/📦️packages/🦀️rust" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22.1"
png = "0.17.16"

[dev-dependencies]
# 🧪️ Test-only: `⚙️engine/🧵️media/🦀️component.rs`'s `export_concrete_forest_mesh_tests` builds a real CAD solid from a
# fixture model to derive a lowpoly mesh export — see that module's doc comment. Carried forward from the
# old `⚙️engine` crate's `[dev-dependencies]` verbatim (already repointed by a prior batch-1 agent from the
# deleted `semio-s-app-cad-engine` to this crate).
cad_plugin = { path = "../../../../../✏️s/🔌️plugins/📐️cad/📦️packages/🦀️rust", package = "semio-s-plugin-cad" }
