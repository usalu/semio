[package]
name = "semio-s-plugin-lowpoly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lowpoly plugin - one crate for the lowpoly artifact (diff/op/dsl/pack/spr/engine) and the lowpoly play app (commands/modes/windows/options/panels)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:lowpoly"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "lowpoly"
ports = { react = 6078, wgpu = 6178 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-3d = { path = "../../../../../🧰️framework/🔨️modules/🧊️3d/📦️packages/🦀️rust" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22.1"
png = "0.17.16"

[features]
# 🧪️ Optional: CAD fixture round-trip tests in `⚙️engine/🧵️media` (Wave 4 must keep CAD compilable).
cad-fixtures = ["dep:cad_plugin"]

[dependencies.cad_plugin]
path = "../../../../../✏️s/🔌️plugins/📐️cad/📦️packages/🦀️rust"
package = "semio-s-plugin-cad"
optional = true
