type LowpolyPresence {
  selectionMode: String! @state(class: PRESENCE)
  selectionIds: [Int!]! @state(class: PRESENCE)
  selectionTargetsMesh: Boolean! @state(class: PRESENCE)
  selectionTargetsVertex: Boolean! @state(class: PRESENCE)
  selectionTargetsEdge: Boolean! @state(class: PRESENCE)
  selectionTargetsFace: Boolean! @state(class: PRESENCE)
  selectedObjectIds: [String!]! @state(class: PRESENCE)
  hoveredObjectId: String @state(class: PRESENCE)
  hoveredTargetObjectId: String @state(class: PRESENCE)
  hoveredTargetMode: String @state(class: PRESENCE)
  hoveredTargetId: Int @state(class: PRESENCE)
  worldCameraPosition: [Float!]! @state(class: PRESENCE)
  worldCameraTarget: [Float!]! @state(class: PRESENCE)
  worldCameraFov: Float! @state(class: PRESENCE)
  activeUtilityId: String! @state(class: PRESENCE)
  paintUtility: String! @state(class: PRESENCE)
}
