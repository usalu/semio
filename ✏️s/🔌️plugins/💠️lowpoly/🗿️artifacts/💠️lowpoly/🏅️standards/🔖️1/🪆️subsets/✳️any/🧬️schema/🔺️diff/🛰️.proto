syntax = "proto3";
package semio.s.lowpoly.lowpoly.diff;
import "✏️s/🔌️plugins/💠️lowpoly/🗿️artifacts/💠️lowpoly/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🕸️mesh/🛰️.proto";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
import "✏️s/🔌️plugins/💠️lowpoly/🗿️artifacts/💠️lowpoly/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

// 🧬️ Lowpoly diff schema — sparse field delta.

message LowpolyDiff {
  // @state artifact
  optional string schema = 1;
  // @state artifact
  optional LowpolyObjectsDelta objects = 2;
  // @state presence
  // @state config
}

message LowpolyObjectRemoval {
  string id = 1;
  uint32 index = 2;
}
message LowpolyObjectInsertion {
  uint32 index = 1;
  semio.s.lowpoly.lowpoly.artifact.LowpolyObject row = 2;
}
message LowpolyObjectRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message LowpolyObjectsDelta {
  repeated LowpolyObjectRemoval removed = 1;
  repeated LowpolyObjectInsertion inserted = 2;
  repeated LowpolyObjectRelocation moved = 3;
  repeated LowpolyObjectsModification modified = 4;
}
message LowpolyObjectsModification {
  string id = 1;
  LowpolyObjectPatchEntry patch = 2;
}

message LowpolyObjectPatchEntry {
  LowpolyObjectPatch patch = 1;
  optional LowpolyPaintLayersDelta paint_layers = 2;
  repeated LowpolyVertexPosition mesh_vertices = 3;
  repeated semio.s.lowpoly.lowpoly.artifact.LowpolyMeshAttribute mesh_attributes = 4;
}

message LowpolyObjectPatch {
  optional string name = 1;
  optional bool smooth_shading = 2;
  repeated float position = 3;
  repeated float rotation = 7;
  repeated float scale = 8;
  // absent = untouched; message-field presence = touched (still `null`-able via the wire's own
  // ArtifactChild-or-null convention, same as `LowpolyObject.mesh`).
  semio.os.store.ArtifactChild mesh = 4;
  optional string mesh_content = 5;
  optional LowpolyMeshStateSlot mesh_state = 6;
}

message LowpolyPaintLayersDelta { repeated LowpolyPaintEdit edits = 1; }

message LowpolyPaintEdit {
  oneof edit {
    LowpolyPaintInsert insert = 1;
    LowpolyPaintRemove remove = 2;
    LowpolyPaintReplace replace = 3;
    LowpolyPaintPatch patch = 4;
    LowpolyPaintStroke stroke = 5;
  }
}

message LowpolyPaintInsert { uint32 index = 1; semio.s.lowpoly.lowpoly.artifact.LowpolyPaintLayer layer = 2; }
message LowpolyPaintRemove { uint32 index = 1; }
message LowpolyPaintReplace { uint32 index = 1; semio.s.lowpoly.lowpoly.artifact.LowpolyPaintLayer layer = 2; }
message LowpolyPaintPatch { uint32 index = 1; LowpolyPaintLayerPatch patch = 2; }
message LowpolyPaintStroke { uint32 index = 1; repeated PixelRun runs = 2; }

message LowpolyVertexPosition { uint32 vertex = 1; repeated float position = 2; }

message LowpolyPaintLayerPatch {
  optional string name = 1;
  optional bool visible = 2;
  optional float opacity = 3;
  optional string blend_mode = 4;
}

message PixelRun {
  uint32 offset = 1;
  string bytes = 2;
}

message LowpolyMeshStateSlot { optional semio.s.lowpoly.lowpoly.artifact.LowpolyMeshState state = 1; }
