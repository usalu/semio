syntax = "proto3";
package semio.s.lowpoly.lowpoly.mutation;
import "🧰️framework/🔨️modules/🚪️io/🧬️schema/🛰️.proto";
import "✏️s/🔌️plugins/💠️lowpoly/🗿️artifacts/💠️lowpoly/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

// 🧬️ LowpolyMutation dispatch — real facet mirror of the Rust `🦀️.rs` sibling's
// `LowpolyMutation` enum (`dsl::Mutations`-derived, seventeen variants: nine object-lane verbs, a
// create/delete pair for the `mesh` CHILD slot, and six paint-layer verbs plus one pixel edit).

// One contiguous run of RGBA bytes written into a paint-layer pixel buffer at `offset`.
message PixelRun {
  uint32 offset = 1;
  bytes bytes = 2;
}

message CreateObject {
  uint64 index = 1;
  semio.s.lowpoly.lowpoly.artifact.LowpolyObject object = 2;
}

message DeleteObject {
  string id = 1;
}

message ReorderObjects {
  string id = 1;
  uint64 to_index = 2;
}

message RenameObject {
  string id = 1;
  string new_name = 2;
}

message ChangeObjectSmoothShading {
  string id = 1;
  bool new_smooth_shading = 2;
}

message MoveObject {
  string id = 1;
  repeated float new_position = 2;
}

message RotateObject {
  string id = 1;
  repeated float new_rotation = 2;
}

message ScaleObject {
  string id = 1;
  repeated float new_scale = 2;
}

message CreateMesh {
  string id = 1;
  string child_id = 2;
  semio.framework.io.ArtifactRef target = 3;
  string mesh_workspace = 4;
}

message DeleteMesh {
  string id = 1;
}

message InsertPaintLayer {
  string object_id = 1;
  uint64 index = 2;
  semio.s.lowpoly.lowpoly.artifact.LowpolyPaintLayer layer = 3;
}

message RemovePaintLayer {
  string object_id = 1;
  uint64 index = 2;
}

message RenamePaintLayer {
  string object_id = 1;
  uint64 index = 2;
  string new_name = 3;
}

message ChangePaintLayerVisible {
  string object_id = 1;
  uint64 index = 2;
  bool new_visible = 3;
}

message ChangePaintLayerOpacity {
  string object_id = 1;
  uint64 index = 2;
  float new_opacity = 3;
}

message ChangePaintLayerBlendMode {
  string object_id = 1;
  uint64 index = 2;
  string new_blend_mode = 3;
}

message EditPaintLayer {
  string object_id = 1;
  uint64 layer_index = 2;
  repeated PixelRun runs = 3;
}

message StrokePoint {
  float u = 1;
  float v = 2;
}

message ApplyPaintStroke {
  string object_id = 1;
  uint64 layer_index = 2;
  bool eraser = 3;
  repeated uint32 color = 4;
  float radius = 5;
  float hardness = 6;
  float opacity = 7;
  repeated StrokePoint points = 8;
}

message MoveSelection {
  string object_id = 1;
  repeated uint32 vertex_ids = 2;
  repeated float offset = 3;
}

message RotateSelection {
  string object_id = 1;
  repeated uint32 vertex_ids = 2;
  repeated float pivot = 3;
  repeated float axis = 4;
  float angle = 5;
}

message ScaleSelection {
  string object_id = 1;
  repeated uint32 vertex_ids = 2;
  repeated float pivot = 3;
  repeated float factor = 4;
}

// 🎛️ Dispatch envelope — exactly one payload set, matching the Rust `LowpolyMutation` enum's
// declaration order and spelling (`🦀️.rs`'s `KINDS`).
message LowpolyMutation {
  oneof mutation {
    CreateObject create_object = 1;
    DeleteObject delete_object = 2;
    ReorderObjects reorder_objects = 3;
    RenameObject rename_object = 4;
    ChangeObjectSmoothShading change_object_smooth_shading = 5;
    MoveObject move_object = 6;
    RotateObject rotate_object = 7;
    ScaleObject scale_object = 8;
    CreateMesh create_mesh = 9;
    DeleteMesh delete_mesh = 10;
    InsertPaintLayer insert_paint_layer = 11;
    RemovePaintLayer remove_paint_layer = 12;
    RenamePaintLayer rename_paint_layer = 13;
    ChangePaintLayerVisible change_paint_layer_visible = 14;
    ChangePaintLayerOpacity change_paint_layer_opacity = 15;
    ChangePaintLayerBlendMode change_paint_layer_blend_mode = 16;
    EditPaintLayer edit_paint_layer = 17;
    ApplyPaintStroke apply_paint_stroke = 18;
    MoveSelection move_selection = 19;
    RotateSelection rotate_selection = 20;
    ScaleSelection scale_selection = 21;
  }
}
