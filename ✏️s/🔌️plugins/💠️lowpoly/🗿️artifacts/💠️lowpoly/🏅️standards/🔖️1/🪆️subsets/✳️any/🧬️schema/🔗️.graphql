# 🧬️ Lowpoly artifact schema — every field with its state class.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"

type LowpolyArtifact {
  schema: String! @state(class: ARTIFACT)
  objects: [LowpolyObject!]! @state(class: ARTIFACT)
}

type LowpolySelectionTargets {
  mesh: Boolean!
  vertex: Boolean!
  edge: Boolean!
  face: Boolean!
}

type LowpolySelection {
  targets: LowpolySelectionTargets!
  keys: [String!]!
  mode: String!
  ids: [Int!]!
}

type LowpolyTransform {
  position: [Float!]!
  rotation: [Float!]!
  scale: [Float!]!
}

type LowpolyPaintLayer {
  name: String!
  visible: Boolean!
  opacity: Float!
  blendMode: String!
  pixels: String!
}

type LowpolyObject {
  id: String!
  name: String!
  transform: LowpolyTransform!
  smoothShading: Boolean!
  "null when the object owns no mesh yet — confirmed against the create-object mutation fixture."
  mesh: ArtifactChild
  paintLayers: [LowpolyPaintLayer!]!
}
