semio-s-artifact-lowpoly-lowpoly-model-diff = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-mutations = { workspace = true }
semio-s-artifact-stdio-dwg-geometry = { workspace = true }
semio-s-artifact-stdio-dwg-read = { workspace = true }
semio-s-artifact-stdio-dwg-snapshot = { workspace = true }
semio-s-artifact-stdio-dwg-write = { workspace = true }
semio-s-artifact-stdio-gltf-model = { workspace = true }
