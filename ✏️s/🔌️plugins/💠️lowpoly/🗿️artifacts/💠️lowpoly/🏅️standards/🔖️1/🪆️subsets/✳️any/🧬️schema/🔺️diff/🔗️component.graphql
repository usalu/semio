# 🧬️ Lowpoly diff schema — sparse field delta.

type LowpolyDiff {
  artifact: LowpolyArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  objects: LowpolyObjectsDelta @state(class: ARTIFACT)
  activeObjectId: String @state(class: PRESENCE)
  selection: LowpolySelection @state(class: PRESENCE)
  selectedObjectIds: LowpolyStringList @state(class: PRESENCE)
  paintUtility: String @state(class: PRESENCE)
  activePaintLayer: Int @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  showEdges: Boolean @state(class: CONFIG)
  sunEnabled: Boolean @state(class: CONFIG)
  sunAzimuth: Float @state(class: CONFIG)
  sunElevation: Float @state(class: CONFIG)
  sunIntensity: Float @state(class: CONFIG)
  sunColor: String @state(class: CONFIG)
  worldCameraPositionX: Float @state(class: CONFIG)
  worldCameraPositionY: Float @state(class: CONFIG)
  worldCameraPositionZ: Float @state(class: CONFIG)
  worldCameraTargetX: Float @state(class: CONFIG)
  worldCameraTargetY: Float @state(class: CONFIG)
  worldCameraTargetZ: Float @state(class: CONFIG)
  worldCameraFov: Float @state(class: CONFIG)
  utilityParamsJson: String @state(class: CONFIG)
  paintColorR: Int @state(class: CONFIG)
  paintColorG: Int @state(class: CONFIG)
  paintColorB: Int @state(class: CONFIG)
  paintColorA: Int @state(class: CONFIG)
  selectionMethod: String @state(class: CONFIG)
  selectionModeDefault: String @state(class: CONFIG)
  engagementInput: String @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  hoveredObjectId: String @state(class: ARTIFACT)
  hoveredTargetObjectId: String @state(class: ARTIFACT)
  hoveredTargetMode: String @state(class: ARTIFACT)
  hoveredTargetId: Int @state(class: ARTIFACT)
  strokeDragActive: Boolean @state(class: ARTIFACT)
  transformDragActive: Boolean @state(class: ARTIFACT)
  previewSeq: Int @state(class: ARTIFACT)
}

type LowpolyStringList {
  values: [String!]!
}

type LowpolyObjectsDelta {
  added: [LowpolyObject!]!
  removed: [String!]!
  patched: [LowpolyObjectPatchEntry!]!
  reordered: [String!]
}

type LowpolyObjectPatchEntry {
  id: String!
  patch: LowpolyObjectPatch!
}

type LowpolyObjectPatch {
  name: String
  smoothShading: Boolean
  transform: LowpolyTransform
  mesh: LowpolyMeshHandle
}

type ArtifactDialect {
  artifactKind: String!
  standard: String!
  subset: String!
}

type ArtifactRef {
  artifactId: String!
  dialect: ArtifactDialect!
}

type LowpolyMeshHandle {
  childId: String!
  target: ArtifactRef!
}

type LowpolyArtifact {
  schema: String!
  objects: [LowpolyObject!]!
}

type LowpolySelection {
  mode: String!
  ids: [Int!]!
  keys: [String!]!
}

type LowpolyTransform {
  position: [Float!]!
  rotation: [Float!]!
  scale: [Float!]!
}

type LowpolyObject {
  id: String!
  name: String!
}
