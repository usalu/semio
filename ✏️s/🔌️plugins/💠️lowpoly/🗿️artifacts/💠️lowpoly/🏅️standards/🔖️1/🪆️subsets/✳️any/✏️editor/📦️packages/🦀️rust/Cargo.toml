[package]
workspace = "../../../../../../.."
name = "semio-s-artifact-lowpoly-lowpoly-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "lowpoly editor app"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[test]]
name = "lowpoly_editor_unit"
path = "../../🧪️tests/🔬️unit/🦀️.rs"

[[test]]
name = "lowpoly_editor_mounted"
