[dependencies]
semio-framework = { workspace = true }
semio-framework-2d = { workspace = true }
semio-framework-artifact-reference = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-framework-tool-machine = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-commands = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-config = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-engine = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-examples = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-model = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-model-diff = { workspace = true }
