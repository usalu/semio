  newSmoothShading: Boolean!
}

type MoveObjectMutation {
  mutation: LowpolyMutationKind!
  payload: MoveObjectPayload!
}
type MoveObjectPayload {
  id: String!
  newPosition: [Float!]!
}

type RotateObjectMutation {
  mutation: LowpolyMutationKind!
  payload: RotateObjectPayload!
}
type RotateObjectPayload {
  id: String!
  newRotation: [Float!]!
}

type ScaleObjectMutation {
  mutation: LowpolyMutationKind!
  payload: ScaleObjectPayload!
}
type ScaleObjectPayload {
  id: String!
  newScale: [Float!]!
}

type CreateMeshMutation {
  mutation: LowpolyMutationKind!
  payload: CreateMeshPayload!
}
type CreateMeshPayload {
  id: String!
  childId: String!
  target: ArtifactRef!
  meshWorkspace: String!
}

type DeleteMeshMutation {
  mutation: LowpolyMutationKind!
  payload: DeleteMeshPayload!
}
type DeleteMeshPayload {
  id: String!
}

type InsertPaintLayerMutation {
  mutation: LowpolyMutationKind!
  payload: InsertPaintLayerPayload!
}
type InsertPaintLayerPayload {
  objectId: String!
  index: Int!
  layer: LowpolyPaintLayer!
}

type RemovePaintLayerMutation {
  mutation: LowpolyMutationKind!
  payload: RemovePaintLayerPayload!
}
type RemovePaintLayerPayload {
  objectId: String!
