# import LowpolyMeshState,LowpolyMeshStateInput from "✏️s/🔌️plugins/💠️lowpoly/🗿️artifacts/💠️lowpoly/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🕸️mesh/🔗️.graphql"
# 🧬️ Lowpoly diff schema — sparse field delta.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
# import LowpolyObject, LowpolyPaintLayer from "../🔗️.graphql"

type LowpolyDiff {
  schema: String @state(class: ARTIFACT)
  objects: LowpolyObjectsDelta @state(class: ARTIFACT)
}

type LowpolyObjectsDelta {
  added: [LowpolyObject!]!
  removed: [String!]!
  patched: [LowpolyObjectPatchEntry!]!
  reordered: [String!]
}

type LowpolyObjectPatchEntry {
  id: String!
  patch: LowpolyObjectPatch!
  paintLayers: LowpolyPaintLayersDelta
  meshMotions: [LowpolyMeshMotion!]!
}

type LowpolyObjectPatch {
  name: String
  smoothShading: Boolean
  position: [Float!]
  rotation: [Float!]
  scale: [Float!]
  mesh: ArtifactChild
  meshContent: String
  meshState: LowpolyMeshStateSlot
}

type LowpolyPaintLayersDelta { edits: [LowpolyPaintEdit!]! }

union LowpolyPaintEdit = LowpolyPaintInsert | LowpolyPaintRemove | LowpolyPaintReplace | LowpolyPaintPatch | LowpolyPaintStroke

type LowpolyPaintInsert { op: String! index: Int! layer: LowpolyPaintLayer! }

type LowpolyPaintRemove { op: String! index: Int! }

type LowpolyPaintReplace { op: String! index: Int! layer: LowpolyPaintLayer! }

type LowpolyPaintPatch { op: String! index: Int! patch: LowpolyPaintLayerPatch! }

type LowpolyPaintStroke { op: String! index: Int! runs: [PixelRun!]! }

union LowpolyMeshMotion = LowpolyMeshOffset | LowpolyMeshTurn | LowpolyMeshStretch

type LowpolyMeshOffset { motion: String! vertexIds: [Int!]! offset: [Float!]! }

type LowpolyMeshTurn { motion: String! vertexIds: [Int!]! pivot: [Float!]! axis: [Float!]! angle: Float! }

type LowpolyMeshStretch { motion: String! vertexIds: [Int!]! pivot: [Float!]! factor: [Float!]! }

type LowpolyPaintLayerPatch {
  name: String
  visible: Boolean
  opacity: Float
  blendMode: String
}

type PixelRun {
  offset: Int!
  bytes: String!
}

type LowpolyMeshStateSlot { state: LowpolyMeshState }
