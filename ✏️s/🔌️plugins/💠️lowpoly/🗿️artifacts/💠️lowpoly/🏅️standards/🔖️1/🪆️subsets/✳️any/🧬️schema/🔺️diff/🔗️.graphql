# 🧬️ Lowpoly diff schema — sparse field delta.
# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
# import LowpolyArtifact, LowpolyObject, LowpolyPaintLayer, LowpolyTransform from "../🔗️.graphql"

type LowpolyDiff {
  artifact: LowpolyArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  objects: LowpolyObjectsDelta @state(class: ARTIFACT)
}

type LowpolyObjectsDelta {
  added: [LowpolyObject!]!
  removed: [String!]!
  patched: [LowpolyObjectPatchEntry!]!
  reordered: [String!]
}

type LowpolyObjectPatchEntry {
  id: String!
  patch: LowpolyObjectPatch!
  paintLayers: LowpolyPaintLayersDelta
}

type LowpolyObjectPatch {
  name: String
  smoothShading: Boolean
  transform: LowpolyTransform
  mesh: ArtifactChild
}

type LowpolyPaintLayersDelta {
  added: [LowpolyIndexedPaintLayer!]!
  removed: [Int!]!
  patched: [LowpolyIndexedPaintLayerPatch!]!
  strokes: [LowpolyPaintStrokeAt!]!
}

type LowpolyIndexedPaintLayer {
  index: Int!
  layer: LowpolyPaintLayer!
}

type LowpolyIndexedPaintLayerPatch {
  index: Int!
  patch: LowpolyPaintLayerPatch!
}

type LowpolyPaintLayerPatch {
  name: String
  visible: Boolean
  opacity: Float
  blendMode: String
}

type LowpolyPaintStrokeAt {
  layerIndex: Int!
  runs: [PixelRun!]!
}

type PixelRun {
  offset: Int!
  bytes: String!
}
