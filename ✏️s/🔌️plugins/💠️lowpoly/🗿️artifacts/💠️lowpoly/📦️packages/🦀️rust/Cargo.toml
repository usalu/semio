[package]
workspace = "../.."
name = "semio-s-artifact-lowpoly-lowpoly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "lowpoly lowpoly artifact"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-dsl = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-editor = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-inferences = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-io = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-model = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-model-diff = { workspace = true }
semio-s-artifact-lowpoly-lowpoly-mutations = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-schema = { workspace = true }
semio-framework-schema-state = { workspace = true }
