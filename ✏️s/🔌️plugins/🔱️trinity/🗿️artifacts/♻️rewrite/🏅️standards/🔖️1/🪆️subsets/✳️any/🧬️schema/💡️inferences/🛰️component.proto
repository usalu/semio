syntax = "proto3";
package semio.s.trinity.rewrite.inference;

// 💡️ Rewrite inference schema — bounds (bounding box + node count) over `ruleLayout`.

message RewriteInference {
  // @derived
  RewriteBounds bounds = 1;
}

message RewriteBoundingBox {
  double min_x = 1;
  double min_y = 2;
  double max_x = 3;
  double max_y = 4;
}

message RewriteBounds {
  RewriteBoundingBox bounding_box = 1;
  uint32 node_count = 2;
}
