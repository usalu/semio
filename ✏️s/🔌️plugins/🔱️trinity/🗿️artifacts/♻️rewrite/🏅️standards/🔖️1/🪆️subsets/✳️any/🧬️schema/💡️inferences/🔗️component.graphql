# 💡️ Rewrite inference schema — bounds (bounding box + node count) over `ruleLayout`.

type RewriteInference {
  bounds: RewriteBounds! @derived
}

type RewriteBounds {
  boundingBox: RewriteBoundingBox!
  nodeCount: Int!
}

type RewriteBoundingBox {
  minX: Float!
  minY: Float!
  maxX: Float!
  maxY: Float!
}
