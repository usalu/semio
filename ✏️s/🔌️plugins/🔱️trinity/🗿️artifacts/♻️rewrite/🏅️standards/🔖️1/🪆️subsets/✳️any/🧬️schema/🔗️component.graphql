# 🧬️ Rewrite artifact schema — every field with its state class.

type RewriteArtifact {
  beforeFixtureJson: String! @state(class: ARTIFACT)
  lhsJson: String! @state(class: ARTIFACT)
  rhsJson: String! @state(class: ARTIFACT)
  parameterBindings: [PropertyValueEntry!]! @state(class: ARTIFACT)
  ruleLayout: [LayoutPointEntry!]! @state(class: ARTIFACT)
  selectedNodeIds: [String!]! @state(class: PRESENCE)
  activeHoverVar: String! @state(class: PRESENCE)
  activeSelectVar: String! @state(class: PRESENCE)
  lodModeByWindow: [StringEntry!]! @state(class: PRESENCE)
  beforePaneCamera: Camera! @state(class: CONFIG)
  reorganizeEpoch: Int! @state(class: CONFIG)
  hoverEpoch: Int! @state(class: CONFIG)
  selectEpoch: Int! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}

type PropertyValueEntry {
  key: String!
  value: String!
}

type LayoutPointEntry {
  key: String!
  value: LayoutPoint!
}

type StringEntry {
  key: String!
  value: String!
}

type LayoutPoint {
  x: Float!
  y: Float!
}

type Camera {
  x: Float!
  y: Float!
  zoom: Float!
}
