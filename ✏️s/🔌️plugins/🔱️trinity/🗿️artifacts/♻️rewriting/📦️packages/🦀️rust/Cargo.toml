[package]
name = "semio-s-artifact-trinity-rewriting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trinity rewriting artifact"

[package.metadata.semio]
role = "s-module"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
component-app-assembly = ["dep:semio-framework", "dep:semio-framework-os-infinite", "semio-framework-plugin/component-guest", "dep:semio-framework-dispatch-macros", "dep:semio-framework-ui-contract", "semio-s-artifact-trinity-jack/component-app-assembly"]

[dependencies]
semio-framework-graph = { workspace = true }
semio-framework = { workspace = true, optional = true }
semio-framework-os-infinite = { workspace = true, optional = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-replication = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-docx = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-md = { workspace = true }
semio-s-artifact-stdio-pdf = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
semio-s-artifact-trinity-jack = { workspace = true }
pack = { workspace = true }
serde_json = { workspace = true }
semio-framework-dispatch-macros = { workspace = true, optional = true }
semio-framework-ui-contract = { workspace = true, optional = true }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws"] }
semio-framework = { workspace = true }
semio-framework-async-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
