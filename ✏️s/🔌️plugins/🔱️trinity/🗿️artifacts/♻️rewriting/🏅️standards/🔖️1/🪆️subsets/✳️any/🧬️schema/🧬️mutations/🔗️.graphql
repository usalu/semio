input EditBeforeFixtureInput { newWorkingGraph: JackSnapshotInput! }
input EditLhsInput { newLhs: LhsInput! }
input EditRhsInput { newRhs: RhsInput! }
input ChangeParameterBindingInput { key: String! newValue: PropertyValueInput! }
input RemoveParameterBindingInput { key: String! }
input ChangeRuleLayoutPointInput { key: String! newPoint: LayoutPointInput! }
input RemoveRuleLayoutPointInput { key: String! }
input DragRuleNodesInput { targets: [String!]! dx: Binary64WordInput! dy: Binary64WordInput! }
input SetRuleLayoutPointsInput { points: [RuleLayoutPlacementInput!]! cleared: [String!]! }
input RuleLayoutPlacementInput { key: String! x: Binary64WordInput! y: Binary64WordInput! }
input RewriteRuleMutationInput @oneOf {
 editBeforeFixture: EditBeforeFixtureInput
 editLhs: EditLhsInput
 editRhs: EditRhsInput
 changeParameterBinding: ChangeParameterBindingInput
 removeParameterBinding: RemoveParameterBindingInput
 changeRuleLayoutPoint: ChangeRuleLayoutPointInput
 removeRuleLayoutPoint: RemoveRuleLayoutPointInput
 dragRuleNodes: DragRuleNodesInput
 setRuleLayoutPoints: SetRuleLayoutPointsInput
}
