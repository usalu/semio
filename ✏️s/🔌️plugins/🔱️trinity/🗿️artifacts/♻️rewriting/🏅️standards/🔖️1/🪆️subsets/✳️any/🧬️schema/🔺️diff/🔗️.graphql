# 🧬️ Rewriting diff schema — sparse field delta.

type RewritingDiff {
  beforeFixtureJson: String @state(class: ARTIFACT)
  lhsJson: String @state(class: ARTIFACT)
  rhsJson: String @state(class: ARTIFACT)
  parameterBindings: [PropertyValueOptEntry!] @state(class: ARTIFACT)
  ruleLayout: [LayoutPointOptEntry!] @state(class: ARTIFACT)
  lodModeByWindow: [StringOptEntry!] @state(class: PRESENCE)
  beforePaneCamera: Camera @state(class: CONFIG)
  reorganizeEpoch: Int @state(class: CONFIG)
  locale: String @state(class: CONFIG)
}

type PropertyValueOptEntry {
  key: String!
  value: String
}

type LayoutPointOptEntry {
  key: String!
  value: LayoutPoint
}

type StringOptEntry {
  key: String!
  value: String
}

type RewritingArtifact {
  beforeFixtureJson: String!
  lhsJson: String!
  rhsJson: String!
}

type LayoutPoint {
  x: Float!
  y: Float!
}

type Camera {
  x: Float!
  y: Float!
  zoom: Float!
}
