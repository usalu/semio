syntax = "proto3";
package semio.s.trinity.rewriting.mutation;
import "✏️s/🔌️plugins/🔱️trinity/🗿️artifacts/♻️rewriting/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";
import "✏️s/🔌️plugins/🔱️trinity/🗿️artifacts/🔌️jack/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/📸️snapshot/🛰️.proto";
import "🧰️framework/🔨️modules/🌱️value/🧬️schema/🛰️.proto";
import "🧰️framework/🔨️modules/🕸️graph/🛂️manifest/🌱️value/🧬️schema/🛰️.proto";
message EditBeforeFixture { semio.s.trinity.jack.snapshot.JackSnapshot new_working_graph = 1; }
message EditLhs { semio.s.trinity.rewriting.artifact.Lhs new_lhs = 1; }
message EditRhs { semio.s.trinity.rewriting.artifact.Rhs new_rhs = 1; }
message ChangeParameterBinding { string key = 1; semio.framework.graph.manifest.PropertyValue new_value = 2; }
message RemoveParameterBinding { string key = 1; }
message ChangeRuleLayoutPoint { string key = 1; semio.s.trinity.rewriting.artifact.LayoutPoint new_point = 2; }
message RemoveRuleLayoutPoint { string key = 1; }
message DragRuleNodes { repeated string targets = 1; semio.framework.value.Binary64Word dx = 2; semio.framework.value.Binary64Word dy = 3; }
message SetRuleLayoutPoints { repeated RuleLayoutPlacement points = 1; repeated string cleared = 2; }
message RuleLayoutPlacement { string key = 1; semio.framework.value.Binary64Word x = 2; semio.framework.value.Binary64Word y = 3; }
message RewriteRuleMutation {
 oneof mutation {
  EditBeforeFixture edit_before_fixture = 1;
  EditLhs edit_lhs = 2;
  EditRhs edit_rhs = 3;
  ChangeParameterBinding change_parameter_binding = 4;
  RemoveParameterBinding remove_parameter_binding = 5;
  ChangeRuleLayoutPoint change_rule_layout_point = 6;
  RemoveRuleLayoutPoint remove_rule_layout_point = 7;
  DragRuleNodes drag_rule_nodes = 8;
  SetRuleLayoutPoints set_rule_layout_points = 9;
 }
}
