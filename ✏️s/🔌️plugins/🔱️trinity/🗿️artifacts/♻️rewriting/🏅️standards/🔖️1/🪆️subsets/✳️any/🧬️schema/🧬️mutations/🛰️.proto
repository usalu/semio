syntax = "proto3";
package semio.s.trinity.rewriting.mutation;

import "google/protobuf/struct.proto";

message RewriteRuleLayoutPoint { double x = 1; double y = 2; }
message EditBeforeFixture { string new_before_fixture_json = 1; }
message EditLhs { string new_lhs_json = 1; }
message EditRhs { string new_rhs_json = 1; }
message ChangeParameterBinding { string key = 1; google.protobuf.Value new_value = 2; }
message RemoveParameterBinding { string key = 1; }
message ChangeRuleLayoutPoint { string key = 1; RewriteRuleLayoutPoint new_point = 2; }
message RemoveRuleLayoutPoint { string key = 1; }
message DragWorkingNodes { repeated string targets = 1; double dx = 2; double dy = 3; }
message PatchWorkingNodes { repeated string targets = 1; string field = 2; string value = 3; }
message DragRuleNodes { repeated string targets = 1; double dx = 2; double dy = 3; }
message RuleLayoutPlacement { string key = 1; double x = 2; double y = 3; }
message SetRuleLayoutPoints { repeated RuleLayoutPlacement points = 1; repeated string cleared = 2; }
message DeleteWorkingNodes { repeated string targets = 1; }
message ConnectWorkingPorts { string source = 1; string target = 2; string kind = 3; }
message DisconnectWorkingEdges { repeated string targets = 1; }

message RewriteRuleMutation {
  oneof mutation {
    EditBeforeFixture edit_before_fixture = 1;
    EditLhs edit_lhs = 2;
    EditRhs edit_rhs = 3;
    ChangeParameterBinding change_parameter_binding = 4;
    RemoveParameterBinding remove_parameter_binding = 5;
    ChangeRuleLayoutPoint change_rule_layout_point = 6;
    RemoveRuleLayoutPoint remove_rule_layout_point = 7;
    DragWorkingNodes drag_working_nodes = 8;
    PatchWorkingNodes patch_working_nodes = 9;
    DragRuleNodes drag_rule_nodes = 10;
    SetRuleLayoutPoints set_rule_layout_points = 11;
    DeleteWorkingNodes delete_working_nodes = 12;
    ConnectWorkingPorts connect_working_ports = 13;
    DisconnectWorkingEdges disconnect_working_edges = 14;
  }
}
