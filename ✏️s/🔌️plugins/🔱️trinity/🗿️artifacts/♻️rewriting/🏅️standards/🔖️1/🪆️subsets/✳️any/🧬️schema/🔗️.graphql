# 🧬️ Rewriting's durable document contract.
# import DslValue from "🧰️framework/🔨️modules/🌱️value/🧬️schema/🔗️.graphql"

type RewritingArtifact {
  beforeFixtureJson: String! @state(class: ARTIFACT)
  lhsJson: String! @state(class: ARTIFACT)
  rhsJson: String! @state(class: ARTIFACT)
  parameterBindings: [PropertyValueEntry!]! @state(class: ARTIFACT)
  ruleLayout: [LayoutPointEntry!]! @state(class: ARTIFACT)
}

type PropertyValueEntry { key: String!, value: DslValue }
type LayoutPointEntry { key: String!, value: LayoutPoint! }
type LayoutPoint { x: Float!, y: Float! }
