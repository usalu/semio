type Pattern { leftVar: String!, leftKind: String!, edgeVar: String, edgeKind: String, rightVar: String, rightKind: String }
type Lhs { pattern: Pattern!, whereClause: String }
enum ParameterKind { STRING NUMBER BOOLEAN }
type ParameterSpec { name: String!, kind: ParameterKind!, default: PropertyValue! }
type Assignment { var: String!, prop: String!, value: PropertyValue! }
type Rhs { create: [Pattern!]!, delete: [String!]!, set: [Assignment!]!, merge: [Pattern!]!, parameters: [ParameterSpec!]! }
type LayoutPoint { xIeee754Bits: String!, yIeee754Bits: String! }
type LayoutPointEntry { key: String!, value: LayoutPoint! }
type RewritingArtifact { workingGraph: JackSnapshot! @state(class: ARTIFACT), lhs: Lhs! @state(class: ARTIFACT), rhs: Rhs! @state(class: ARTIFACT), parameterBindings: [PropertyValueEntry!]! @state(class: ARTIFACT), ruleLayout: [LayoutPointEntry!]! @state(class: ARTIFACT) }

input PatternInput { leftVar: String! leftKind: String! edgeVar: String edgeKind: String rightVar: String rightKind: String }
input LhsInput { pattern: PatternInput! whereClause: String }
input ParameterSpecInput { name: String! kind: ParameterKind! default: PropertyValueInput! }
input AssignmentInput { var: String! prop: String! value: PropertyValueInput! }
input RhsInput { create: [PatternInput!]! delete: [String!]! set: [AssignmentInput!]! merge: [PatternInput!]! parameters: [ParameterSpecInput!]! }
