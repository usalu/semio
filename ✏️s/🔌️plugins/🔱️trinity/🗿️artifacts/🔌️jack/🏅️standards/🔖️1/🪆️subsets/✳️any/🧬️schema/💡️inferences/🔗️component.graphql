# 💡️ Jack inference schema — topology (topological order, depth, cycle-freedom) over nodes/edges,
# and flat-position (each node's flattened (u, v) position, BFS-walked from root_node_id).

type JackInference {
  topology: JackTopology! @state(class: INFERRED)
  flatPosition: JackFlatPosition! @state(class: INFERRED)
}

type JackTopology {
  topoOrder: [String!]!
  depth: [JackDepthEntry!]!
  cycleFree: Boolean!
  nodeCount: Int!
}

type JackDepthEntry {
  nodeId: String!
  depth: Int!
}

type JackFlatPosition {
  positions: [JackFlatPositionEntry!]!
}

type JackFlatPositionEntry {
  nodeId: String!
  u: Float!
  v: Float!
}
