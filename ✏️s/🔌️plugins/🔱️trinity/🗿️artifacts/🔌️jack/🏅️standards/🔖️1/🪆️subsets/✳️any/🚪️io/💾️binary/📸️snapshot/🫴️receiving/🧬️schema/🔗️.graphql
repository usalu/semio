"""🫴️ Closed Jack Pack fields move into one retained typed candidate, leaving original record remnants owned."""
type JackRecordReconstruction { source: NativeRecord! candidate: JackSnapshot cursor: UInt64! ready: Boolean! }
"""⏱️ Each supplied original decoder turn admits one bounded field or real backing allocation."""
interface JackRecordReconstructionReceiver { step(source: JackRecordReconstruction!, control: OriginalNativeDecodeControl!, grant: RetainedCloneGrant!, maximumWork: UInt64!): OriginalNativeDecodeIssued! }

"""📏️ Semantic row/type ceilings are authored independently of each original supplied receiving wallet."""
type JackRecordReconstructionPolicy { maximumRows: UInt64! maximumTypeDepth: UInt64! }
