syntax = "proto3";
package semio.s.trinity.jack.snapshot;
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
import "🧰️framework/🔨️modules/🌱️value/🧬️schema/🛰️.proto";
message JackSnapshot {
 string schema = 1;
 string name = 2;
 optional string manifest_id = 3;
 Manifest manifest = 4;
 Camera camera = 5;
 semio.os.store.ArtifactChild content = 6;
 optional string root_node_id = 7;
 string query = 8;
}
message Camera { semio.framework.value.Binary64Word x = 1; semio.framework.value.Binary64Word y = 2; semio.framework.value.Binary64Word zoom = 3; }
message Manifest { repeated ManifestNodeKind node_kinds = 1; repeated ManifestEdgeKind edge_kinds = 2; repeated ManifestPortKind port_kinds = 3; }
enum ManifestPropertyKind { DATA = 0; DERIVED = 1; }
message ManifestProperty { string name = 1; ManifestPropertyKind kind = 2; semio.framework.value.ValueType value_type = 3; optional string expr = 4; }
message ManifestNodeKind { string name = 1; repeated ManifestProperty properties = 2; repeated string port_kinds = 3; }
message ManifestEdgeKind { string name = 1; repeated ManifestProperty properties = 2; }
message ManifestPortKind { string name = 1; string direction = 2; repeated ManifestProperty properties = 3; }
