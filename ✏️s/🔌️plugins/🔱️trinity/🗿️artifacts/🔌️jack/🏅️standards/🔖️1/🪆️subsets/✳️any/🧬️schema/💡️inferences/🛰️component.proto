syntax = "proto3";
package semio.s.trinity.jack.inference;

// 💡️ Jack inference schema — topology (topological order, depth, cycle-freedom) over nodes/edges,
// and flat-position (each node's flattened (u, v) position, BFS-walked from root_node_id).

message JackInference {
  // @state inferred
  JackTopology topology = 1;
  // @state inferred
  JackFlatPosition flat_position = 2;
}

message JackTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}

message JackFlatPositionUv {
  double u = 1;
  double v = 2;
}

message JackFlatPosition {
  map<string, JackFlatPositionUv> positions = 1;
}
