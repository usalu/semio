syntax = "proto3";
package semio.s.trinity.jack.inference;

// 💡️ Jack inference schema — topology (topological order, depth, cycle-freedom) over nodes/edges.

message JackInference {
  // @state inferred
  JackTopology topology = 1;
}

message JackTopology {
  repeated string topo_order = 1;
  map<string, uint32> depth = 2;
  bool cycle_free = 3;
  uint32 node_count = 4;
}
