syntax = "proto3";
package semio.s.trinity.jack.mutation.create_node;
// create-node / CreateNode
import "google/protobuf/struct.proto";
message CreateNodePort { string id = 1; string kind = 2; string direction = 3; map<string, google.protobuf.Value> properties = 4; }
message CreateNodeNode { string id = 1; string kind = 2; string name = 3; double x = 4; double y = 5; double width = 6; double height = 7; map<string, google.protobuf.Value> properties = 8; repeated CreateNodePort ports = 9; }
message CreateNode { CreateNodeNode node = 1; }
