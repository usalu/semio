# 🧬️ Jack artifact schema — every field with its state class.

type JackArtifact {
  schema: String! @state(class: ARTIFACT)
  name: String! @state(class: ARTIFACT)
  manifestId: String @state(class: ARTIFACT)
  manifest: Manifest! @state(class: ARTIFACT)
  camera: Camera! @state(class: ARTIFACT)
  nodes: [Node!]! @state(class: ARTIFACT)
  edges: [Edge!]! @state(class: ARTIFACT)
  rootNodeId: String @state(class: ARTIFACT)
  activeFixtureId: String! @state(class: PRESENCE)
  jackQuery: String! @state(class: PRESENCE)
  lodModeByWindow: [StringEntry!]! @state(class: PRESENCE)
  viewportCamera: Camera! @state(class: CONFIG)
  jackResultJson: String! @state(class: CONFIG)
  editorEngagementInput: String! @state(class: CONFIG)
  graphEngagementInput: String! @state(class: CONFIG)
  resultsEngagementInput: String! @state(class: CONFIG)
  reorganizeEpoch: Int! @state(class: CONFIG)
  editorSelection: JackEditorSelection @state(class: CONFIG)
  revision: Int! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}

type StringEntry {
  key: String!
  value: String!
}

type JackEditorSelection {
  start: Int!
  end: Int!
}

type Camera {
  x: Float!
  y: Float!
  zoom: Float!
}

type Node {
  id: String!
  kind: String!
  name: String!
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  ports: [Port!]!
}

type Port {
  id: String!
  kind: String!
  direction: String!
}

type Edge {
  id: String!
  kind: String!
  source: String!
  target: String!
}

type Manifest {
  nodeKinds: [ManifestKind!]!
  edgeKinds: [ManifestKind!]!
  portKinds: [ManifestPortKind!]!
}

type ManifestKind {
  name: String!
}

type ManifestPortKind {
  name: String!
  direction: String!
}
