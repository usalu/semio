syntax = "proto3";
package semio.s.trinity.jack.snapshot;

// 🧬️ Jack snapshot schema — persistent fields only.

message JackSnapshot {
  // @state persistent
  string schema = 1;
  // @state persistent
  string name = 2;
  // @state persistent
  optional string manifest_id = 3;
  // @state persistent
  Manifest manifest = 4;
  // @state persistent
  Camera camera = 5;
  // @state persistent
  repeated Node nodes = 6;
  // @state persistent
  repeated Edge edges = 7;
  // @state persistent
  optional string root_node_id = 8;
}

message Camera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}

message Port {
  string id = 1;
  string kind = 2;
  string direction = 3;
}

message Node {
  string id = 1;
  string kind = 2;
  string name = 3;
  double x = 4;
  double y = 5;
  double width = 6;
  double height = 7;
  repeated Port ports = 8;
}

message Edge {
  string id = 1;
  string kind = 2;
  string source = 3;
  string target = 4;
}

message Manifest {
  repeated ManifestKind node_kinds = 1;
  repeated ManifestKind edge_kinds = 2;
  repeated ManifestPortKind port_kinds = 3;
}

message ManifestKind {
  string name = 1;
}

message ManifestPortKind {
  string name = 1;
  string direction = 2;
}
