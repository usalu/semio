[package]
name = "semio-s-artifact-trinity-jack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trinity Jack artifact"

[package.metadata.semio]
role = "s-module"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
component-app-assembly = ["semio-framework-plugin/component-guest", "dep:semio-framework", "dep:semio-framework-dispatch-macros", "dep:semio-framework-geometry", "dep:semio-framework-os-infinite", "dep:semio-framework-ui-contract"]

[dependencies]
semio-framework = { workspace = true, optional = true }
semio-framework-artifact-flow-flow = { workspace = true }
semio-framework-geometry = { workspace = true, optional = true }
semio-framework-graph = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-infinite = { workspace = true, optional = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-csv = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-md = { workspace = true }
semio-s-artifact-stdio-png = { workspace = true }
semio-s-artifact-stdio-semio = { workspace = true }
semio-s-artifact-stdio-svg = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
pack = { workspace = true }
serde_json = { workspace = true }
semio-framework-dispatch-macros = { workspace = true, optional = true }
semio-framework-ui-contract = { workspace = true, optional = true }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
