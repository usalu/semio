syntax = "proto3";
package semio.app.trinity.rewrite;
message RewriteConfig {
  // @state local-ui
  repeated string selected_node_ids = 1;
  // @state local-ui
  Camera before_pane_camera = 2;
  // @state local-ui
  int64 reorganize_epoch = 3;
  // @state local-ui
  string active_hover_var = 4;
  // @state local-ui
  int64 hover_epoch = 5;
  // @state local-ui
  string active_select_var = 6;
  // @state local-ui
  int64 select_epoch = 7;
  // @state local-ui
  map<string, string> lod_mode_by_window = 8;
  // @state local-ui
  string locale = 9;
}

message Camera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
