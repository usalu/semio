syntax = "proto3";
package semio.app.trinity.rewrite;
message RewritePresence {
  // @state shared-ui
  repeated string selected_node_ids = 1;
  // @state shared-ui
  string active_hover_var = 2;
  // @state shared-ui
  string active_select_var = 3;
  // @state shared-ui
  Camera before_pane_camera = 4;
  // @state shared-ui
  map<string, string> lod_mode_by_window = 5;
}

message Camera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
