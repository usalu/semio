type JackPresence {
  selectedNodeIds: [String!]! @state(class: SHARED_UI)
  activeFixtureId: String! @state(class: SHARED_UI)
  jackQuery: String! @state(class: SHARED_UI)
  camera: Camera! @state(class: SHARED_UI)
  lodModeByWindow: [StringEntry!]! @state(class: SHARED_UI)
}

type StringEntry {
  key: String!
  value: String!
}

type Camera {
  x: Float!
  y: Float!
  zoom: Float!
}
