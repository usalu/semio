syntax = "proto3";
package semio.app.trinity.jack;
message JackPresence {
  // @state presence
  repeated string selected_node_ids = 1;
  // @state presence
  string active_fixture_id = 2;
  // @state presence
  string jack_query = 3;
  // @state presence
  Camera camera = 4;
  // @state presence
  map<string, string> lod_mode_by_window = 5;
}

message Camera {
  double x = 1;
  double y = 2;
  double zoom = 3;
}
