# 🧭️ Own workspace root: the repository root manifest is a shared leased file, and a member crate would serialise
# every concurrent session behind that lease.
[workspace]

[package]
name = "semio-trinity-mutation-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "🏭️ Production mutation bridge for 🔱️trinity — answers listMutations from the production dispatch aggregates themselves."

[[bin]]
name = "semio-trinity-mutation-bridge"
path = "🦀️.rs"

[dependencies]
semio-framework-os-kernel = { path = "../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust" }
pack = { path = "../../../../🧰️framework/🔨️modules/🎒️pack/📦️packages/🦀️rust", package = "semio-framework-pack" }
semio-s-artifact-trinity-jack = { path = "../🗿️artifacts/🔌️jack/📦️packages/🦀️rust" }
semio-s-artifact-trinity-rewriting = { path = "../🗿️artifacts/♻️rewriting/📦️packages/🦀️rust" }
