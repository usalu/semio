[package]
name = "semio-s-plugin-trinity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trinity plugin — directed property port graphs (Jack query editor + Rewrite parametric rules)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:trinity"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "trinity-jack"
app = "trinity-jack-play"
aliases = ["trinity jack"]
ports = { react = 6054, wgpu = 6154 }

[[package.metadata.semio.playground]]
variant = "trinity-rewrite"
app = "trinity-rewrite-play"
aliases = ["trinity rewrite"]
ports = { react = 6056, wgpu = 6156 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
vcs = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🌿️vcs/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-vcs" }
mathematical_graph_dsl = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🕸️graph/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-graph-dsl" }
mathematical_graph_manifest = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🕸️graph/🛂️manifest/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-graph-manifest" }
mathematical_graph_drawing = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🕸️graph/🖊️drawing/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-graph-drawing" }
mathematical_geometry = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/📐️geometry/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-geometry" }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🖼️canvas/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas" }
infinite_board_port_directed = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🎲️board/🔌️ports/➡️directed/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-board-port-directed" }
infinite_board_port_directed_normal = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🎲️board/🔌️ports/➡️directed/➕️normal/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-board-port-directed-normal" }
semio-framework-os = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.71"
js-sys = "0.3.83"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }
