[package]
name = "semio-s-plugin-trinity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trinity plugin — directed property port graphs (Jack query editor + Rewriting parametric rules)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:trinity"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "trinity-jack"
app = "s.trinity.jack@1/*#editor"
aliases = ["trinity jack"]
ports = { react = 6054, wgpu = 6154 }

[[package.metadata.semio.playground]]
variant = "trinity-rewriting"
app = "s.trinity.rewriting@1/*#editor"
aliases = ["trinity rewriting"]
ports = { react = 6056, wgpu = 6156 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it: two crates defining that symbol in one component is a
# `rust-lld: duplicate symbol` link error, and the embedder must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-artifact-trinity-jack = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-trinity-rewriting = { workspace = true, features = ["component-app-assembly"] }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }

[dev-dependencies]
semio-framework-plugin = { workspace = true, features = ["component-guest", "artifact-app-testing"] }
semio-framework-async-macros = { workspace = true }
