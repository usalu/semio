[package]
name = "semio-s-plugin-trinity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trinity plugin — directed property port graphs (Jack query editor + Rewrite parametric rules)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:trinity"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "trinity-jack"
app = "s.trinity.jack@1/*#editor"
aliases = ["trinity jack"]
ports = { react = 6054, wgpu = 6154 }

[[package.metadata.semio.playground]]
variant = "trinity-rewrite"
app = "s.trinity.rewrite@1/*#editor"
aliases = ["trinity rewrite"]
ports = { react = 6056, wgpu = 6156 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it: two crates defining that symbol in one component is a
# `rust-lld: duplicate symbol` link error, and the embedder must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
math = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/📦️packages/🦀️rust", package = "semio-framework-math" }
geometry = { path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework = { workspace = true }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
# 🧵️ The generated `🧬️mutations/💾️binary` decoders yield through `semio_framework_job::StepOutcome`,
# so the job crate has to be linked here the same way `🌍️gis` links it.
semio-framework-job = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
semio-framework-async = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = "0.3.83"
web-sys = { version = "0.3.98", features = ["console", "HtmlCanvasElement"] }


[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
