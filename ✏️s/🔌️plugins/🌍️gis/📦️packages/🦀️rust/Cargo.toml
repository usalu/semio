[package]
name = "semio-s-plugin-gis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GIS plugin - one crate for the gismap/gisterrain artifacts (diff/op/dsl/pack/spr/engine) and the 2d map / 3d terrain play apps (commands/modes/windows/panels/options)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:gis"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "gis2d"
aliases = ["gis 2d"]
app = "gis2d-play"
ports = { react = 6040, wgpu = 6140 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

[[package.metadata.semio.playground]]
variant = "gis3d"
aliases = ["gis 3d"]
app = "gis3d-play"
ports = { react = 6083, wgpu = 6183 }
engines = ["./🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust"]

# 🎪️ The `verfolgen` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The `/osm`+`/vt` asset rows below
# stay here too (copies also live on the bundle crate) since the standalone `gis2d` dev variant needs
# them independently of the demonstrator.

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/osm"
app = "gis2d-play"
upstream = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
cache = "osm-tiles"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/vt"
app = "gis2d-play"
upstream = "https://tiles.openfreemap.org/planet"
cache = "openfreemap-vt"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/dem"
app = "gis3d-play"
upstream = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
cache = "terrarium-dem"

[lib]
crate-type = ["cdylib", "rlib"]
path = "📦️glue.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it (the 🎪️demonstrator bundles all six panes into one
# component): seven crates each exporting the same `#[no_mangle]` symbol is a duplicate-symbol
# link error, and the embedding crate is the one that must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
framework_surface = { path = "../../../../../🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust", package = "semio-framework-surface", default-features = false }
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/🖥️host/📦️packages/🦀️rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
# 🔌️ `PortMultiplicity` isn't re-exported by `semio-framework-plugin` (WORKFLOWS-END-TO-END-TYPED-PORTS
# port recipe) — a direct dependency on the core crate is the minimal fix, mirroring `shooting`.
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

[dev-dependencies]

