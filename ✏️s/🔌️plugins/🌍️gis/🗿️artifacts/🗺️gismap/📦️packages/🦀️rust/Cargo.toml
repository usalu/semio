[package]
name = "semio-s-artifact-gis-gismap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GIS map artifact"

[package.metadata.semio]
role = "s-module"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
component-app-assembly = ["dep:semio-framework", "dep:semio-framework-surface", "semio-framework-plugin/component-guest", "dep:semio-framework-dispatch-macros", "dep:semio-framework-ui-contract", "dep:semio-framework-ui-scene"]

[dependencies]
semio-framework-surface = { path = "../../../../../../../🧰️framework/🔨️modules/🗺️surface/📦️packages/🦀️rust", package = "semio-framework-surface", default-features = false, optional = true }
semio-framework = { workspace = true, optional = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-dwg = { workspace = true }
semio-s-artifact-stdio-dxf = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-pdf = { workspace = true }
semio-s-artifact-stdio-png = { workspace = true }
semio-s-artifact-stdio-semio = { workspace = true, features = ["conversion-drawing"] }
semio-s-artifact-stdio-svg = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
pack = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semio-framework-dispatch-macros = { workspace = true, optional = true }
semio-framework-ui-contract = { workspace = true, optional = true }
semio-framework-ui-scene = { workspace = true, optional = true }

[dev-dependencies]
geo = { version = "0.31.0", default-features = false }
semio-framework-async-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
