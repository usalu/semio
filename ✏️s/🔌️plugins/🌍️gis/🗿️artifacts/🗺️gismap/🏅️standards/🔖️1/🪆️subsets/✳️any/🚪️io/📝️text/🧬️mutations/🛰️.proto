syntax = "proto3";
package semio.gis_gismap.mutations;

message CreatePosition {
  uint32 index = 1;
}
message DeletePosition {
  string id = 1;
}
message ReplacePositionData {
  string id = 1;
  bytes new_data = 2;
}
message ReorderPositions {
  string id = 1;
  uint32 to_index = 2;
}
message CreateRoute {
  uint32 index = 1;
}
message DeleteRoute {
  string id = 1;
}
message ReplaceRouteData {
  string id = 1;
  bytes new_data = 2;
}
message ReorderRoutes {
  string id = 1;
  uint32 to_index = 2;
}
message CreateRegion {
  uint32 index = 1;
}
message DeleteRegion {
  string id = 1;
}
message ReplaceRegionData {
  string id = 1;
  bytes new_data = 2;
}
message ReorderRegions {
  string id = 1;
  uint32 to_index = 2;
}
message SetPositionProperty {
  string feature = 1;
  string key = 2;
  bytes value = 3;
  optional string before = 4;
}
message RemovePositionProperty {
  string feature = 1;
  string key = 2;
}
message SetRouteProperty {
  string feature = 1;
  string key = 2;
  bytes value = 3;
  optional string before = 4;
}
message RemoveRouteProperty {
  string feature = 1;
  string key = 2;
}
message SetRegionProperty {
  string feature = 1;
  string key = 2;
  bytes value = 3;
  optional string before = 4;
}
message RemoveRegionProperty {
  string feature = 1;
  string key = 2;
}

message GismapMutation {
  oneof kind {
    CreatePosition create_position = 1;
    DeletePosition delete_position = 2;
    ReplacePositionData replace_position_data = 3;
    ReorderPositions reorder_positions = 4;
    CreateRoute create_route = 5;
    DeleteRoute delete_route = 6;
    ReplaceRouteData replace_route_data = 7;
    ReorderRoutes reorder_routes = 8;
    CreateRegion create_region = 9;
    DeleteRegion delete_region = 10;
    ReplaceRegionData replace_region_data = 11;
    ReorderRegions reorder_regions = 12;
    SetPositionProperty set_position_property = 13;
    RemovePositionProperty remove_position_property = 14;
    SetRouteProperty set_route_property = 15;
    RemoveRouteProperty remove_route_property = 16;
    SetRegionProperty set_region_property = 17;
    RemoveRegionProperty remove_region_property = 18;
  }
}
