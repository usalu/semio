# 🧬️ GIS map artifact schema — every field with its state class.

type GisMapArtifact {
  positions: [GisMapFeature!]! @state(class: ARTIFACT)
  routes: [GisMapFeature!]! @state(class: ARTIFACT)
  regions: [GisMapFeature!]! @state(class: ARTIFACT)
}

type GisMapFeature {
  id: String!
  data: String!
}

type GisMapBoolEntry {
  key: String!
  value: Boolean!
}

type GisMapNumberEntry {
  key: String!
  value: Float!
}
