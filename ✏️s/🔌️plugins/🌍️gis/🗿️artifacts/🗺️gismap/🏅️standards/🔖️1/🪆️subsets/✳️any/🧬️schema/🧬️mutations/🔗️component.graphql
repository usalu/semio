# 🧬️ GIS map mutation schema — persistent fields only.

type GisMapMutation {
  positions: [GisMapFeature!]! @state(class: PERSISTENT)
  routes: [GisMapFeature!]! @state(class: PERSISTENT)
  regions: [GisMapFeature!]! @state(class: PERSISTENT)
}

type GisMapFeature {
  id: String!
  data: String!
}
