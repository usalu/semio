# 💡️ GIS map inference schema — per-collection feature counts + geographic bounding box.

type GisMapInference {
  positionCount: Int! @derived
  routeCount: Int! @derived
  regionCount: Int! @derived
  bounds: GisMapBounds @derived
}

type GisMapBounds {
  lonMin: Float!
  lonMax: Float!
  latMin: Float!
  latMax: Float!
}
