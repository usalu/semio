# 🔺️ Map deltas reuse the document and feature schema owners.
# import GisMapArtifact from "../🔗️.graphql"
# import GisMapFeature, GisMapFeaturePatch from "../📍️feature/🔗️.graphql"
type GisMapDiff { artifact: GisMapArtifact, positions: GisMapFeaturesDelta, routes: GisMapFeaturesDelta, regions: GisMapFeaturesDelta }
type GisMapFeaturesDelta { added: [GisMapFeature!]!, removed: [String!]!, patched: [GisMapFeaturePatchEntry!]!, reordered: [String!] }
type GisMapFeaturePatchEntry { id: String!, patch: GisMapFeaturePatch! }
