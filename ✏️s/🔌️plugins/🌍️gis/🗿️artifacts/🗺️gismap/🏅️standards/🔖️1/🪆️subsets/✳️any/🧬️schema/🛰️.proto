syntax = "proto3";
package semio.s.gis.gismap.artifact;

// 🧬️ GIS map artifact schema — every field with its state class.

message GisMapArtifact {
  // @state artifact
  repeated GisMapFeature positions = 1;
  // @state artifact
  repeated GisMapFeature routes = 2;
  // @state artifact
  repeated GisMapFeature regions = 3;
  // @state config
}

message GisMapFeature {
  string id = 1;
  string data_json = 2;
}

message GisMapBoolEntry {
  string key = 1;
  bool value = 2;
}

message GisMapNumberEntry {
  string key = 1;
  double value = 2;
}
