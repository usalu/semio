syntax = "proto3";
package semio.app.gis.gis2d;
//#region 🧬️Configuration
message Gis2dConfig {
  // @state config
  map<string, bool> layer_visibility = 1;
  // @state config
  string camera_json = 2;
  // @state config
  string render_mode = 3;
  // @state config
  string vector_style = 4;
  // @state config
  string lod_mode = 5;
  // @state config
  map<string, double> layer_stroke_scale = 6;
  // @state config
  string locale = 7;
}
//#endregion 🧬️Configuration
