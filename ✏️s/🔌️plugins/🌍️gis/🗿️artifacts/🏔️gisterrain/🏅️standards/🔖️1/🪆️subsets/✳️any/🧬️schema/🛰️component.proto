syntax = "proto3";
package semio.s.gis.gisterrain.artifact;

// 🧬️ GIS terrain artifact schema — every field with its state class.

message GisTerrainArtifact {
  // @state artifact
  double exaggeration = 1;
  // @state artifact
  string imported_features_json = 2;
  // @state presence
  repeated string selected_ids = 3;
  // @state config
  string camera_json = 4;
  // @state config
  string locale = 5;
}
