# 🧬️ GIS terrain diff schema — sparse field delta.

type GisTerrainDiff {
  artifact: GisTerrainArtifact @state(class: ARTIFACT)
  exaggeration: Float @state(class: ARTIFACT)
  importedFeaturesJson: String @state(class: ARTIFACT)
}

type GisTerrainArtifact {
  exaggeration: Float!
  importedFeaturesJson: String!
}

type GisTerrainStringList {
  values: [String!]!
}
