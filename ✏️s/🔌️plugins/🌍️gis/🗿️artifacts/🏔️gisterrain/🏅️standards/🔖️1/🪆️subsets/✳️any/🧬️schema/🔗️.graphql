# 🧬️ GIS terrain artifact schema — every field with its state class.

type GisTerrainArtifact {
  exaggeration: Float! @state(class: ARTIFACT)
  importedFeaturesJson: String! @state(class: ARTIFACT)
  selectedIds: [String!]! @state(class: PRESENCE)
  cameraJson: String! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}
