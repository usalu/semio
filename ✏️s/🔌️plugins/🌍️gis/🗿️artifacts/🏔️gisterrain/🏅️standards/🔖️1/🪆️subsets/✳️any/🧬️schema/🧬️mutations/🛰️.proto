syntax = "proto3";
package semio.s.gis.gisterrain.mutation;

import "🎚️change-exaggeration/🛰️.proto";
import "📥change-imported-features/🛰️.proto";
import "🏔️replace-elevation-source/🛰️.proto";

message GisTerrainMutation {
  oneof mutation {
    ChangeExaggeration change_exaggeration = 1;
    ChangeImportedFeatures change_imported_features = 2;
    ReplaceElevationSource replace_elevation_source = 3;
  }
}
