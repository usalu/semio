syntax = "proto3";
package semio.gis_gisterrain.mutations;

message ChangeExaggeration {
  double new_exaggeration = 1;
}
message ChangeImportedFeatures {
}

message GisterrainMutation {
  oneof kind {
    ChangeExaggeration change_exaggeration = 1;
    ChangeImportedFeatures change_imported_features = 2;
  }
}
