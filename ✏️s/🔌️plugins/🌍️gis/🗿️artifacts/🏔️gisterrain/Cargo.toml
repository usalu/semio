[workspace.dependencies.semio-s-artifact-stdio-ply]
path = "../../../🗄️stdio/🗿️artifacts/🧱️ply/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-png]
path = "../../../🗄️stdio/🗿️artifacts/📷️png/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio-base]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/✉️base/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio-mesh]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/🔺️mesh/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-semio-mesh-export]
path = "../../../🗄️stdio/🗿️artifacts/🧿️semio/🏅️standards/🔖️v1/🪆️subsets/🔺️mesh/🚪️io/📤️export/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-stl]
path = "../../../🗄️stdio/🗿️artifacts/🔺️stl/📦️packages/🦀️rust"

[workspace.dependencies.semio-s-artifact-stdio-txt]
path = "../../../🗄️stdio/🗿️artifacts/🔤️txt/📦️packages/🦀️rust"

[workspace.dependencies.serde]
version = "1.0.228"
features = [ "derive" ]

[workspace.dependencies.serde_json]
version = "1.0.149"
features = [ "raw_value" ]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

  [workspace.lints.rust.future_incompatible]
  level = "warn"
  priority = -1

  [workspace.lints.rust.rust_2018_idioms]
  level = "warn"
  priority = -1

[workspace.lints.clippy]
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

  [workspace.lints.clippy.all]
  level = "warn"
  priority = -1

