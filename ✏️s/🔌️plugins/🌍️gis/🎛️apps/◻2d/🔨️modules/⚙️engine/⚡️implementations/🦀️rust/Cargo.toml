[package]
name = "semio-s-app-gis-2d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "GIS 2D app - headless compute (constitutional: engine)"

[lints]
workspace = true
[lib]
path = "../../../../../../../../../✏️s/🔌️plugins/🌍️gis/🎛️apps/◻2d/🔨️modules/⚙️engine/⚡️implementations/🦀️rust/📦️lib.rs"

[dependencies]
gis2d = { path = "../../../../../../../../../✏️s/🔌️plugins/🌍️gis/🎛️apps/◻2d/⚡️implementations/🦀️rust", package = "semio-s-app-gis-2d" }
gis2d_dsl = { path = "../../../../../../../../../✏️s/🔌️plugins/🌍️gis/🎛️apps/◻2d/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-s-app-gis-2d-dsl" }
dsl = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
protocol = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
semio-framework-plugin = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", package = "semio-framework-plugin" }
semio-framework-os = { path = "../../../../../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }
# 🔌️ `PortMultiplicity` isn't re-exported by `semio-framework-plugin` (WORKFLOWS-END-TO-END-TYPED-PORTS
# port recipe) — a direct dependency on the core crate is the minimal fix, mirroring `shooting_engine`.
semio-framework-core = { path = "../../../../../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
