[package]
name = "semio-s-plugin-puzzle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle plugin - one crate for the puzzle2d/puzzle3d/puzzle5d artifacts (diff/op/dsl/pack/spr/engine) and their three play apps (commands/modes/windows/panels)"
build = "build.rs"

[lints]
workspace = true

[package.metadata.component]
package = "semio:puzzle"

# 🪶️ Carried verbatim from the old `semio-s-app-puzzle-5d-engine` crate: the 5d wasm surface is built
# without `wasm-opt` (it miscompiles the brush/copy-paste session state), and that crate's cdylib has
# collapsed into this one.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "puzzle2d"
app = "puzzle2d-play"
aliases = ["2d"]
ports = { react = 6012, wgpu = 6112 }
engines = ["🧰️framework/🔨️modules/🗺️surface/🎲️board-2d/⚡️implementations/🦀️rust"]

[[package.metadata.semio.playground]]
variant = "puzzle3d"
app = "puzzle3d-play"
aliases = ["3d"]
ports = { react = 6013, wgpu = 6113 }

[[package.metadata.semio.playground]]
variant = "puzzle5d"
app = "puzzle5d-play"
aliases = ["5d"]
ports = { react = 6014, wgpu = 6114 }

# 🎪️ The `aggregator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The asset rows below stay here too
# (copies also live on the bundle crate) since the standalone `puzzle3d` dev variant needs them
# independently of the demonstrator.

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "puzzle3d-play"
roots = ["🧰️framework/🔨️modules/🖼️assets/⚡️implementations/🟦️typescript/🌱️metabolism/🎨️representation", "♻️mit-bestand/🖼️assets/🏚️abbau-aufbau"]
placeholder = "🧰️framework/🔨️modules/🖼️assets/⚡️implementations/🟦️typescript/🥽️mesh/🧊️placeholder.glb"
filter_from_examples = true

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/infinite-fixture"
app = "puzzle3d-play"
root = "🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🧫️fixtures"

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[build-dependencies]
serde_json.workspace = true

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
pack = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
infinite_board_port_directed_normal = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🎲️board/🔌️ports/➡️directed/➕️normal/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-board-port-directed-normal" }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🖼️canvas/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-infinite-canvas" }
mathematical_graph_manifest = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🕸️graph/🛂️manifest/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-graph-manifest" }
reasoning_mindmap = { path = "../../../../🔨️modules/💭️mindmap/⚡️implementations/🦀️rust", package = "semio-s-kernel-reasoning-mindmap" }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
parry3d = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_env = "p2")))'.dependencies]
semio-framework-os = { path = "../../../../../🧰️framework/🛍️products/💻️os/⚡️implementations/🦀️rust", package = "semio-framework-os" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# 🚧️ TEMPORARY verification overlay (TEMPLATE.md §3) — DELETE at registrar handoff.
# The old `semio-s-plugin-puzzle` bundle crate is still a root-workspace member, so this manifest
# cannot be added to `members` yet; making it its own workspace root is the only way to build it in
# isolation. Copied verbatim from root Cargo.toml so artifact fingerprints match the shared target/.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
thiserror = "2.0.18"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1
