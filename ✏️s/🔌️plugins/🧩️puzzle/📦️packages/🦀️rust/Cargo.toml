[package]
name = "semio-s-plugin-puzzle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle plugin - one crate for the puzzle2d/puzzle3d/puzzle5d artifacts (diff/op/dsl/pack/spr/engine) and their three play apps (commands/modes/windows/panels)"
build = "build.rs"

[lints]
workspace = true

[package.metadata.component]
package = "semio:puzzle"

# 🪶️ Carried verbatim from the old `semio-s-app-puzzle-5d-engine` crate: the 5d wasm surface is built
# without `wasm-opt` (it miscompiles the brush/copy-paste session state), and that crate's cdylib has
# collapsed into this one.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "puzzle2d"
app = "s.puzzle.puzzle2d@1/*#editor"
aliases = ["2d", "puzzle 2d"]
ports = { react = 6012, wgpu = 6112 }
engines = ["./✏️s/🔌️plugins/🧩️puzzle/📦️packages/🦀️rust"]

[[package.metadata.semio.playground]]
variant = "puzzle3d"
app = "s.puzzle.puzzle3d@1/*#editor"
aliases = ["3d", "puzzle 3d"]
ports = { react = 6013, wgpu = 6113 }

[[package.metadata.semio.playground]]
variant = "puzzle5d"
app = "s.puzzle.puzzle5d@1/*#editor"
aliases = ["5d", "puzzle 5d"]
ports = { react = 6014, wgpu = 6114 }

# 🎪️ The `aggregator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The asset rows below stay here too
# (copies also live on the bundle crate) since the standalone `puzzle3d` dev variant needs them
# independently of the demonstrator.

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "s.puzzle.puzzle3d@1/*#editor"
roots = ["🧰️framework/🔨️modules/🖼️assets/🌱️metabolism/🎨️representation", "♻️mit-bestand/🖼️asset/🏚️abbau-aufbau"]
placeholder = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/🧊️placeholder.glb"
filter_from_examples = true

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/infinite-fixture"
app = "s.puzzle.puzzle3d@1/*#editor"
root = "🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🧫️fixtures"

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[build-dependencies]
serde_json.workspace = true

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it (the 🎪️demonstrator bundles all six panes into one
# component): seven crates each exporting the same `#[no_mangle]` symbol is a duplicate-symbol
# link error, and the embedding crate is the one that must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
geometry = { path = "../../../../../🧰️framework/🔨️modules/📐️geometry/📦️packages/🦀️rust", package = "semio-framework-geometry" }
graph = { path = "../../../../../🧰️framework/🔨️modules/🕸️graph/📦️packages/🦀️rust", package = "semio-framework-graph" }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework-hash = { path = "../../../../../🧰️framework/🔨️modules/🔢️hash/📦️packages/🦀️rust", package = "semio-framework-hash" }
semio-framework-job = { workspace = true }
semio-framework-async = { workspace = true }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
infinite_canvas = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/📦️packages/🦀️rust", package = "semio-framework-os-infinite" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-ui-contract = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🧬️contract/📦️packages/🦀️rust", package = "semio-framework-ui-contract" }
semio-framework-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust", package = "semio-framework-ui-scene" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-3d = { path = "../../../../../🧰️framework/🔨️modules/🧊️3d/📦️packages/🦀️rust", default-features = false }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }
serde.workspace = true
serde_json.workspace = true

# 🌉️ Browser-only bridge (`BoardSession`'s WebGPU/DOM canvas surface, wasm-pack built as
# `@semio-tech/puzzle-wasm`). Excluded from `wasm32-wasip2` because `target_arch = "wasm32"`
# is TRUE for the WASI component target too — declaring these under the bare arch gate linked
# `wasm-bindgen`/`js-sys`/`web-sys` into the shipped plugin component, which must stay free of
# third-party runtime dependencies. Mirrors the `not(… target_env = "p2")` split above.
[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
wasm-bindgen.workspace = true
js-sys = "0.3.83"
web-sys = { version = "0.3.98", features = ["HtmlCanvasElement"] }

[dev-dependencies]
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
