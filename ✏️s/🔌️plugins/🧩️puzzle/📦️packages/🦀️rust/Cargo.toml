[package]
name = "semio-s-plugin-puzzle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle plugin composition for independently packaged 2D, 3D, and 5D artifacts"

[lints]
workspace = true

[package.metadata.component]
package = "semio:puzzle"

# 🪶️ Carried verbatim from the old `semio-s-app-puzzle-5d-engine` crate: the 5d wasm surface is built
# without `wasm-opt` (it miscompiles the brush/copy-paste session state), and that crate's cdylib has
# collapsed into this one.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "puzzle2d"
app = "s.puzzle.puzzle2d@1/*#editor"
aliases = ["2d", "puzzle 2d"]
ports = { react = 6012, wgpu = 6112 }
engines = ["./✏️s/🔌️plugins/🧩️puzzle/📦️packages/🦀️rust"]

[[package.metadata.semio.playground]]
variant = "puzzle3d"
app = "s.puzzle.puzzle3d@1/*#editor"
aliases = ["3d", "puzzle 3d"]
ports = { react = 6013, wgpu = 6113 }

[[package.metadata.semio.playground]]
variant = "puzzle5d"
app = "s.puzzle.puzzle5d@1/*#editor"
aliases = ["5d", "puzzle 5d"]
ports = { react = 6014, wgpu = 6114 }

# 🎪️ The `aggregator` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🪪️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT). The asset rows below stay here too
# (copies also live on the bundle crate) since the standalone `puzzle3d` dev variant needs them
# independently of the demonstrator.

[[package.metadata.semio.assets]]
kind = "mesh-collection"
route = "/mesh"
app = "s.puzzle.puzzle3d@1/*#editor"
catalog = "🧰️framework/🔨️modules/🖼️assets/🥽️mesh/📇️catalog.json"

[[package.metadata.semio.assets]]
kind = "static-dir"
route = "/infinite-fixture"
app = "s.puzzle.puzzle3d@1/*#editor"
root = "🧰️framework/🛍️products/💻️os/🔨️modules/♾️infinite/🧫️fixtures"

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it (the 🎪️demonstrator bundles all six panes into one
# component): seven crates each exporting the same `#[no_mangle]` symbol is a duplicate-symbol
# link error, and the embedding crate is the one that must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-artifact-puzzle-2d = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-puzzle-3d = { workspace = true, features = ["component-app-assembly"] }
semio-s-artifact-puzzle-5d = { workspace = true, features = ["component-app-assembly"] }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true, features = ["component-guest"] }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
