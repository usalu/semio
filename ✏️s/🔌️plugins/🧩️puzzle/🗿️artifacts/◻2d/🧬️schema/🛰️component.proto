syntax = "proto3";
package semio.s.puzzle.puzzle2d.artifact;

// 🧬️ Puzzle2d artifact schema — every field with its state class.

message Puzzle2dArtifact {
  // @state persistent
  string schema = 1;
  // @state persistent
  Puzzle2dCamera camera = 2;
  // @state persistent
  repeated Puzzle2dNode nodes = 3;
  // @state persistent
  repeated Puzzle2dEdge edges = 4;
  // @state persistent
  Puzzle2dMeta meta = 5;
  // @state shared-ui
  repeated string selected_ids = 6;
  // @state shared-ui
  string active_utility_id = 7;
  // @state local-ui
  double camera_x = 8;
  // @state local-ui
  double camera_y = 9;
  // @state local-ui
  double camera_zoom = 10;
  // @state local-ui
  string selection_method = 11;
  // @state local-ui
  bool grid_snap_enabled = 12;
  // @state local-ui
  double grid_factor = 13;
  // @state local-ui
  double suggestion_offset = 14;
  // @state local-ui
  uint32 fill_count = 15;
  // @state local-ui
  uint32 brush_candidate_index = 16;
  // @state local-ui
  string brush_candidate_source_handle_id = 17;
  // @state local-ui
  string locale = 18;
  // @state local-ui
  string terminology = 19;
  // @state local-ui
  string lod_mode_by_pane_json = 20;
  // @state local-ui
  string engagement_input_by_pane_json = 21;
  // @state local-ui
  string brush_candidates_json = 22;
  // @state local-ui
  string node_kind_weights_json = 23;
  // @state local-ui
  string handle_kind_weights_json = 24;
  // @state local-ui
  string active_utility_by_window_id_json = 25;
  // @state preview
  optional string hovered_node_id = 26;
  // @state preview
  int64 preview_seq = 27;
}

