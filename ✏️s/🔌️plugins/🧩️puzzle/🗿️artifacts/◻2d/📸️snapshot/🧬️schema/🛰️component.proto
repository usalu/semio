syntax = "proto3";
package semio.s.puzzle.puzzle2d.snapshot;

// 🧬️ Puzzle2d snapshot schema — persistent fields only.

message Puzzle2dSnapshot {
  // @state persistent
  string schema = 1;
  // @state persistent
  Puzzle2dCamera camera = 2;
  // @state persistent
  repeated Puzzle2dNode nodes = 3;
  // @state persistent
  repeated Puzzle2dEdge edges = 4;
  // @state persistent
  Puzzle2dMeta meta = 5;
}

