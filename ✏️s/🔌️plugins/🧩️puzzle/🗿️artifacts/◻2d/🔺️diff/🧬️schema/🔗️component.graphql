# 🧬️ Puzzle2d diff schema — sparse field delta.

type Puzzle2dDiff {
  artifact: Puzzle2dArtifact @state(class: PERSISTENT)
  schema: String @state(class: PERSISTENT)
  camera: Puzzle2dCamera @state(class: PERSISTENT)
  nodes: Puzzle2dNodesDelta @state(class: PERSISTENT)
  edges: Puzzle2dEdgesDelta @state(class: PERSISTENT)
  meta: Puzzle2dMeta @state(class: PERSISTENT)
  selectedIds: Puzzle2dStringList @state(class: SHARED_UI)
  activeUtilityId: String @state(class: SHARED_UI)
  cameraX: Float @state(class: LOCAL_UI)
  cameraY: Float @state(class: LOCAL_UI)
  cameraZoom: Float @state(class: LOCAL_UI)
  selectionMethod: String @state(class: LOCAL_UI)
  gridSnapEnabled: Boolean @state(class: LOCAL_UI)
  gridFactor: Float @state(class: LOCAL_UI)
  suggestionOffset: Float @state(class: LOCAL_UI)
  fillCount: Int @state(class: LOCAL_UI)
  brushCandidateIndex: Int @state(class: LOCAL_UI)
  brushCandidateSourceHandleId: String @state(class: LOCAL_UI)
  locale: String @state(class: LOCAL_UI)
  terminology: String @state(class: LOCAL_UI)
  lodModeByPaneJson: String @state(class: LOCAL_UI)
  engagementInputByPaneJson: String @state(class: LOCAL_UI)
  brushCandidatesJson: String @state(class: LOCAL_UI)
  nodeKindWeightsJson: String @state(class: LOCAL_UI)
  handleKindWeightsJson: String @state(class: LOCAL_UI)
  activeUtilityByWindowIdJson: String @state(class: LOCAL_UI)
  hoveredNodeId: String @state(class: PREVIEW)
  previewSeq: Int @state(class: PREVIEW)
}

type Puzzle2dStringList { values: [String!]! }
type Puzzle2dNodesDelta { added: [Puzzle2dNode!]! removed: [String!]! patched: [Puzzle2dNodePatchEntry!]! reordered: [String!] }
type Puzzle2dNodePatchEntry { id: String! patch: Puzzle2dNodePatch! }
type Puzzle2dNodePatch { replacement: Puzzle2dNode }
type Puzzle2dEdgesDelta { added: [Puzzle2dEdge!]! removed: [String!]! patched: [Puzzle2dEdgePatchEntry!]! reordered: [String!] }
type Puzzle2dEdgePatchEntry { id: String! patch: Puzzle2dEdgePatch! }
type Puzzle2dEdgePatch { replacement: Puzzle2dEdge }
type Puzzle2dArtifact { schema: String! }


enum Puzzle2dNodeAnchor { FIXED DERIVED }

type Puzzle2dCamera { x: Float! y: Float! zoom: Float! }

type Puzzle2dHandle {
  id: String!
  handleKind: String
  angle: Float!
  radius: Float
  color: String
  iconKind: String
  scale: Float
  visible: Boolean
  locked: Boolean
}

type Puzzle2dNode {
  id: String!
  nodeKind: String
  shape: String
  x: Float!
  y: Float!
  radius: Float
  width: Float
  height: Float
  text: String
  iconKind: String
  root: Boolean
  scale: Float
  visible: Boolean
  locked: Boolean
  anchor: Puzzle2dNodeAnchor!
  handles: [Puzzle2dHandle!]!
}

type Puzzle2dEdge {
  id: String!
  source: String!
  target: String!
  edgeKind: String
  gap: Float!
  shift: Float!
  rise: Float!
  rotation: Float!
  turn: Float!
  tilt: Float!
  x: Float!
  y: Float!
  sourceTip: String
  targetTip: String
  visible: Boolean
  locked: Boolean
}

enum Puzzle2dCompatSpecificity { GENERAL NODE EDGE HANDLE WIRE VORTEX }

type Puzzle2dKindCompatibility {
  source: String!
  target: String!
  bidirectional: Boolean!
  important: Boolean!
  specificity: Puzzle2dCompatSpecificity!
}

type Puzzle2dAttribute { id: String! key: String! value: String! definition: String }
type Puzzle2dAuthor { id: String! name: String! email: String! role: String rank: Int }
type Puzzle2dRepresentation { id: String! name: String! url: String! mime: String! tags: [String!]! lod: String description: String! }
type Puzzle2dHandleTemplate {
  id: String!
  name: String!
  label: String!
  description: String!
  icon: String!
  handleKind: String
  angle: Float!
  t: Float
  mandatory: Boolean
  radius: Float
}
type Puzzle2dCatalogNodeKind {
  id: String!
  name: String!
  label: String!
  description: String!
  icon: String!
  image: String!
  unit: String!
  abstract: Boolean!
  baseKinds: [String!]!
  representations: [Puzzle2dRepresentation!]!
  handles: [Puzzle2dHandleTemplate!]!
  attributes: [Puzzle2dAttribute!]!
  authors: [Puzzle2dAuthor!]!
}
type Puzzle2dCatalogHandleKind {
  id: String!
  code: String
  label: String
  order: Int
  compatibleWith: [String!]!
  description: String!
  icon: String!
  color: String!
  defaultWireKind: String!
}
type Puzzle2dCatalogEdgeKind { id: String! name: String! label: String! description: String! icon: String! color: String! }
type Puzzle2dCatalogWireKind { id: String! name: String! label: String! description: String! icon: String! color: String! defaultEdgeKind: String! }
type Puzzle2dKindCatalogs {
  nodes: [Puzzle2dCatalogNodeKind!]!
  handles: [Puzzle2dCatalogHandleKind!]!
  edges: [Puzzle2dCatalogEdgeKind!]!
  wires: [Puzzle2dCatalogWireKind!]!
}
type Puzzle2dMeta {
  manifestId: String
  kindCompatibility: [Puzzle2dKindCompatibility!]!
  kindCatalogs: Puzzle2dKindCatalogs
}

