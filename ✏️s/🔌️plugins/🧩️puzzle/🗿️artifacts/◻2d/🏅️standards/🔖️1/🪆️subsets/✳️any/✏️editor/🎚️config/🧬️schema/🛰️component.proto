syntax = "proto3";
package semio.app.puzzle.puzzle2d;
message Puzzle2dConfig {
  // @state config
  double camera_x = 1;
  // @state config
  double camera_y = 2;
  // @state config
  double camera_zoom = 3;
  // @state config
  map<string, string> lod_mode_by_pane = 4;
  // @state config
  map<string, string> engagement_input_by_pane = 5;
  // @state config
  uint64 brush_candidate_index = 6;
  // @state config
  repeated string brush_candidates = 7;
  // @state config
  string brush_candidate_source_handle_id = 8;
  // @state config
  uint32 fill_count = 9;
  // @state config
  optional bytes fill_job_checkpoint = 10;
  // @state config
  uint64 fill_job_operation = 11;
  // @state config
  uint64 fill_job_generation = 12;
  // @state config
  uint64 fill_job_seed = 13;
  // @state config
  uint64 fill_job_applied_count = 14;
  // @state config
  optional string fill_job_preview = 15;
  // @state config
  bool grid_snap_enabled = 16;
  // @state config
  double grid_factor = 17;
  // @state config
  double suggestion_offset = 18;
  // @state config
  map<string, double> node_kind_weights = 19;
  // @state config
  map<string, double> handle_kind_weights = 20;
  // @state config
  map<string, string> active_utility_by_window_id = 21;
  // @state config
  string locale = 22;
  // @state config
  string terminology = 23;
  // @state config
  uint64 example_load_generation = 24;
  // @state config
  optional string example_load_id = 25;
}
