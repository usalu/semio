syntax = "proto3";
package semio.app.puzzle.puzzle2d;
message Puzzle2dConfig {
  // @state config
  double camera_x = 1;
  // @state config
  double camera_y = 2;
  // @state config
  double camera_zoom = 3;
  // @state config
  map<string, string> lod_mode_by_pane = 4;
  // @state config
  map<string, string> engagement_input_by_pane = 5;
  // @state config
  uint64 brush_candidate_index = 6;
  // @state config
  repeated string brush_candidates = 7;
  // @state config
  string brush_candidate_source_handle_id = 8;
  // @state config
  uint32 fill_count = 9;
  // @state config
  uint64 fill_job_operation = 10;
  // @state config
  uint64 fill_job_generation = 11;
  // @state config
  uint64 fill_job_seed = 12;
  // @state config
  uint64 fill_job_base_revision = 13;
  // @state config
  uint64 fill_job_checkpoint_sequence = 14;
  // @state config
  uint64 fill_job_accepted_count = 15;
  // @state config
  uint64 fill_job_search_count = 16;
  // @state config
  string fill_job_stage = 17;
  // @state config
  Puzzle2dFillLifecycle fill_job_lifecycle = 18;
  // @state config
  optional string fill_job_fault_code = 19;
  // @state config
  bool grid_snap_enabled = 20;
  // @state config
  double grid_factor = 21;
  // @state config
  double suggestion_offset = 22;
  // @state config
  map<string, double> node_kind_weights = 23;
  // @state config
  map<string, double> handle_kind_weights = 24;
  // @state config
  map<string, string> active_utility_by_window_id = 25;
  // @state config
  string locale = 26;
  // @state config
  string terminology = 27;
  // @state config
  uint64 example_load_generation = 28;
  // @state config
  optional string example_load_id = 29;
}

enum Puzzle2dFillLifecycle {
  PUZZLE2D_FILL_LIFECYCLE_IDLE = 0;
  PUZZLE2D_FILL_LIFECYCLE_CAPTURING = 1;
  PUZZLE2D_FILL_LIFECYCLE_QUEUED = 2;
  PUZZLE2D_FILL_LIFECYCLE_RUNNING = 3;
  PUZZLE2D_FILL_LIFECYCLE_CHECKPOINT_READY = 4;
  PUZZLE2D_FILL_LIFECYCLE_APPLYING = 5;
  PUZZLE2D_FILL_LIFECYCLE_AWAITING_ADOPTION = 6;
  PUZZLE2D_FILL_LIFECYCLE_CLOSING = 7;
  PUZZLE2D_FILL_LIFECYCLE_COMPLETED = 8;
  PUZZLE2D_FILL_LIFECYCLE_CANCELLED = 9;
  PUZZLE2D_FILL_LIFECYCLE_FAULTED = 10;
  PUZZLE2D_FILL_LIFECYCLE_DISCARDED = 11;
}
