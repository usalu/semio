type Puzzle2dConfig {
  cameraX: Float! @state(class: CONFIG)
  cameraY: Float! @state(class: CONFIG)
  cameraZoom: Float! @state(class: CONFIG)
  lodModeByPane: [StringEntry!]! @state(class: CONFIG)
  engagementInputByPane: [StringEntry!]! @state(class: CONFIG)
  brushCandidateIndex: Int! @state(class: CONFIG)
  brushCandidates: [JsonValue!]! @state(class: CONFIG)
  brushCandidateSourceHandleId: String! @state(class: CONFIG)
  fillCount: Int! @state(class: CONFIG)
  fillJobOperation: Long! @state(class: CONFIG)
  fillJobGeneration: Long! @state(class: CONFIG)
  fillJobSeed: Long! @state(class: CONFIG)
  fillJobBaseRevision: Long! @state(class: CONFIG)
  fillJobCheckpointSequence: Long! @state(class: CONFIG)
  fillJobAcceptedCount: Long! @state(class: CONFIG)
  fillJobSearchCount: Long! @state(class: CONFIG)
  fillJobStage: String! @state(class: CONFIG)
  fillJobLifecycle: Puzzle2dFillLifecycle! @state(class: CONFIG)
  fillJobFaultCode: String @state(class: CONFIG)
  gridSnapEnabled: Boolean! @state(class: CONFIG)
  gridFactor: Float! @state(class: CONFIG)
  suggestionOffset: Float! @state(class: CONFIG)
  nodeKindWeights: [FloatEntry!]! @state(class: CONFIG)
  handleKindWeights: [FloatEntry!]! @state(class: CONFIG)
  activeUtilityByWindowId: [StringEntry!]! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
  terminology: String! @state(class: CONFIG)
  exampleLoadGeneration: Long! @state(class: CONFIG)
  exampleLoadId: String @state(class: CONFIG)
}

enum Puzzle2dFillLifecycle {
  IDLE
  CAPTURING
  QUEUED
  RUNNING
  CHECKPOINT_READY
  APPLYING
  AWAITING_ADOPTION
  CLOSING
  COMPLETED
  CANCELLED
  FAULTED
  DISCARDED
}

type StringEntry {
  key: String!
  value: String!
}

type FloatEntry {
  key: String!
  value: Float!
}

scalar JsonValue
