syntax = "proto3";
package semio.s.puzzle.puzzle3d.snapshot;

// 🧬️ Puzzle3d snapshot schema — persistent fields only.

message Puzzle3dSnapshot {
  // @state persistent
  string schema = 1;
  // @state persistent
  string domain = 2;
  // @state persistent
  Puzzle3dMeta meta = 3;
  // @state persistent
  repeated Puzzle3dObject objects = 4;
  // @state persistent
  repeated Puzzle3dAttraction attractions = 5;
  // @state persistent
  repeated Puzzle3dTargetVolume target_volumes = 6;
  // @state persistent
  repeated Puzzle3dReference references = 7;
}

