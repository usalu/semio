[package]
workspace = "../.."
name = "semio-s-artifact-puzzle-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle 3d artifact"

[package.metadata.semio]
role = "artifact"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework-artifact-reference = { workspace = true }
semio-framework-dsl = { workspace = true }
semio-framework-graph-manifest = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-native-owned = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-puzzle-3d-diff = { workspace = true }
semio-s-artifact-puzzle-3d-editor = { workspace = true }
semio-s-artifact-puzzle-3d-examples = { workspace = true }
semio-s-artifact-puzzle-3d-inferences = { workspace = true }
semio-s-artifact-puzzle-3d-io = { workspace = true }
semio-s-artifact-puzzle-3d-model = { workspace = true }
semio-s-artifact-puzzle-3d-mutations = { workspace = true }
semio-s-artifact-puzzle-3d-viewer = { workspace = true }

[dev-dependencies]
pack = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-dispatch-macros = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-s-artifact-puzzle-3d-editor-snapshot = { workspace = true }
semio-s-artifact-puzzle-3d-model = { workspace = true, features = ["testing"] }
semio-s-artifact-puzzle-3d-mutations = { workspace = true, features = ["testing"] }
semio-framework-async = { workspace = true }
serde = { workspace = true }

serde_json = { workspace = true }

[[test]]
name = "snapshot-sqlite"
path = "../../🧪️tests/🗃️snapshot-sqlite/🦀️.rs"
