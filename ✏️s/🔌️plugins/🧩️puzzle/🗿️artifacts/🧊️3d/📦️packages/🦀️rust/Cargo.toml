[package]
name = "semio-s-artifact-puzzle-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle 3d artifact"

[package.metadata.semio]
role = "s-module"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
component-app-assembly = ["semio-framework-plugin/component-guest", "dep:semio-framework-3d", "dep:semio-framework-async", "dep:semio-framework-ui-contract", "dep:semio-framework-ui-scene", "dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { workspace = true, optional = true }
semio-framework = { workspace = true }
semio-framework-graph = { workspace = true }
semio-framework-hash = { workspace = true }
# 🔤️ First-party base64 codec — the paged `registerBrushMesh` wire carries mesh values as base64 of
# little-endian bytes, which is the only encoding that fits 1 024 values in one 8 192-byte command.
semio-framework-io-base64 = { path = "../../../../../../../🧰️framework/🔨️modules/🚪️io/🔤️base64/📦️packages/🦀️rust" }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-stdio-dwg = { workspace = true }
semio-s-artifact-stdio-gltf = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-las = { workspace = true }
semio-s-artifact-stdio-obj = { workspace = true }
semio-s-artifact-stdio-ply = { workspace = true }
semio-s-artifact-stdio-png = { workspace = true }
semio-s-artifact-stdio-stl = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
pack = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semio-framework-3d = { workspace = true, optional = true }
semio-framework-async = { workspace = true, optional = true }
semio-framework-ui-contract = { workspace = true, optional = true }
semio-framework-ui-scene = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", not(target_env = "p2")))'.dependencies]
js-sys = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
# 🧮️ The shared heap witness this artifact's growth laws weigh the tick loop with — test-only.
semio-framework-trace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
