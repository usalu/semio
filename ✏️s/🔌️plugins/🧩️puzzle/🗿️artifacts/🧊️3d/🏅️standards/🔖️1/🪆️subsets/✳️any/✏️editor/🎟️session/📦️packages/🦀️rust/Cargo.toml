[package]
workspace = "../../../../../../../.."
name = "semio-s-artifact-puzzle-3d-editor-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle 3d editing session"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
semio-framework = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-ui-contract = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-puzzle-3d-editor-config = { workspace = true }
semio-s-artifact-puzzle-3d-editor-presence = { workspace = true }
semio-s-artifact-puzzle-3d-editor-snapshot = { workspace = true }
semio-s-artifact-puzzle-3d-editor-terminology = { workspace = true }
semio-s-artifact-puzzle-3d-editor-transform = { workspace = true }
semio-s-artifact-puzzle-3d-model = { workspace = true }
semio-s-artifact-puzzle-3d-mutations = { workspace = true }
semio-s-artifact-puzzle-3d-precompute = { workspace = true }
semio-s-artifact-puzzle-3d-precompute-brush = { workspace = true }
semio-s-artifact-puzzle-3d-precompute-fill = { workspace = true }
semio-s-plugin-puzzle-jobs = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
parry3d = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-framework-tool-run = { workspace = true }
semio-framework-trace = { workspace = true }
semio-s-artifact-puzzle-3d-model = { workspace = true, features = ["testing"] }
semio-s-artifact-puzzle-3d-mutations = { workspace = true, features = ["testing"] }
semio-s-artifact-puzzle-3d-precompute-brush = { workspace = true, features = ["testing"] }
semio-s-artifact-puzzle-3d-precompute-fill = { workspace = true, features = ["testing"] }
semio-s-artifact-puzzle-3d-precompute-geometry = { workspace = true }
semio-s-plugin-puzzle-jobs = { workspace = true, features = ["testing"] }

[[test]]
name = "precompute-brush"
path = "../../../⏳️precompute/🖌️brush/🧪️tests/🔬️unit/🦀️.rs"

[[test]]
name = "precompute-fill"
path = "../../../⏳️precompute/🪣️fill/🧪️tests/🔬️unit/🦀️.rs"
