syntax = "proto3";
package semio.s.puzzle.puzzle3d.mutation;

// 🧬️ Puzzle3d mutation schema — persistent fields only.

message Puzzle3dMutation {
  // @state artifact
  string schema = 1;
  // @state artifact
  string domain = 2;
  // @state artifact
  Puzzle3dMeta meta = 3;
  // @state artifact
  repeated Puzzle3dObject objects = 4;
  // @state artifact
  repeated Puzzle3dAttraction attractions = 5;
  // @state artifact
  repeated Puzzle3dTargetVolume target_volumes = 6;
  // @state artifact
  repeated Puzzle3dReference references = 7;
}

enum Puzzle3dObjectAnchor {
  PUZZLE3D_OBJECT_ANCHOR_FIXED = 0;
  PUZZLE3D_OBJECT_ANCHOR_DERIVED = 1;
}

enum Puzzle3dCompatSpecificity {
  PUZZLE3D_COMPAT_SPECIFICITY_GENERAL = 0;
  PUZZLE3D_COMPAT_SPECIFICITY_OBJECT = 1;
  PUZZLE3D_COMPAT_SPECIFICITY_ATTRACTION = 2;
  PUZZLE3D_COMPAT_SPECIFICITY_VORTEX = 3;
  PUZZLE3D_COMPAT_SPECIFICITY_CABLE = 4;
}

message Puzzle3dAttraction {
  string id = 1;
  string attracting = 2;
  string attracted = 3;
  double gap = 4;
  double shift = 5;
  double rise = 6;
  double rotation = 7;
  double turn = 8;
  double tilt = 9;
  double x = 10;
  double y = 11;
}

message Puzzle3dObject {
  string id = 1;
  optional string label = 2;
  optional string object_kind = 3;
  Puzzle3dObjectAnchor anchor = 4;
  repeated double origin = 5;
  repeated double orientation = 6;
  optional string mesh_url = 7;
  repeated Puzzle3dVortex vortices = 8;
  bool hidden = 9;
  bool locked = 10;
}

message Puzzle3dVortex {
  string id = 1;
  optional string vortex_kind = 2;
  optional string label = 3;
  repeated double position = 4;
  repeated double direction = 5;
  optional double radius = 6;
  bool hidden = 7;
  bool locked = 8;
}

message Puzzle3dRepresentation {
  string id = 1;
  string name = 2;
  string url = 3;
  string mime = 4;
  repeated string tags = 5;
  optional string lod = 6;
  string description = 7;
}

message Puzzle3dCatalogVortexTemplate {
  string id = 1;
  string name = 2;
  string label = 3;
  string description = 4;
  string icon = 5;
  optional string vortex_kind = 6;
  repeated double point = 7;
  repeated double direction = 8;
  optional double t = 9;
  optional bool mandatory = 10;
  optional double radius = 11;
}

message Puzzle3dCatalogObjectKind {
  string id = 1;
  string name = 2;
  string label = 3;
  string description = 4;
  string icon = 5;
  string image = 6;
  string unit = 7;
  bool abstract = 8;
  repeated string base_kinds = 9;
  repeated Puzzle3dRepresentation representations = 10;
  repeated Puzzle3dCatalogVortexTemplate vortices = 11;
}

message Puzzle3dCatalogVortexKind {
  string id = 1;
  optional string code = 2;
  optional string label = 3;
  optional int32 order = 4;
  repeated string compatible_with = 5;
  string description = 6;
  string icon = 7;
  string color = 8;
  string default_cable_kind = 9;
}

message Puzzle3dKindCompatibility {
  string source = 1;
  string target = 2;
  bool bidirectional = 3;
  bool important = 4;
  Puzzle3dCompatSpecificity specificity = 5;
}

message Puzzle3dMeta {
  Puzzle3dKindCatalogs kind_catalogs = 1;
  repeated Puzzle3dKindCompatibility kind_compatibility = 2;
}

message Puzzle3dKindCatalogs {
  repeated Puzzle3dCatalogObjectKind objects = 1;
  repeated Puzzle3dCatalogVortexKind vortices = 2;
}
