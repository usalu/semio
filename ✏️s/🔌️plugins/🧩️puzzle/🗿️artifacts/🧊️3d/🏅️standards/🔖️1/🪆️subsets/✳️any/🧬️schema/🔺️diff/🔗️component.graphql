# 🧬️ Puzzle3d diff schema — sparse field delta.

type Puzzle3dDiff {
  artifact: Puzzle3dArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  domain: String @state(class: ARTIFACT)
  meta: Puzzle3dMeta @state(class: ARTIFACT)
  objects: Puzzle3dObjectsDelta @state(class: ARTIFACT)
  attractions: Puzzle3dAttractionsDelta @state(class: ARTIFACT)
  targetVolumes: Puzzle3dTargetVolumesDelta @state(class: ARTIFACT)
  references: Puzzle3dReferencesDelta @state(class: ARTIFACT)
  selectedObjectIds: Puzzle3dStringList @state(class: PRESENCE)
  selectedVortexIds: Puzzle3dStringList @state(class: PRESENCE)
  selectedAttractionIds: Puzzle3dStringList @state(class: PRESENCE)
  selectedTargetVolumeIds: Puzzle3dStringList @state(class: PRESENCE)
  selectedReferenceIds: Puzzle3dStringList @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  cameraPositionX: Float @state(class: CONFIG)
  cameraPositionY: Float @state(class: CONFIG)
  cameraPositionZ: Float @state(class: CONFIG)
  cameraTargetX: Float @state(class: CONFIG)
  cameraTargetY: Float @state(class: CONFIG)
  cameraTargetZ: Float @state(class: CONFIG)
  cameraZoom: Float @state(class: CONFIG)
  selectionMethod: String @state(class: CONFIG)
  selectionModeDefault: String @state(class: CONFIG)
  engagementInput: String @state(class: CONFIG)
  gridVisible: Boolean @state(class: CONFIG)
  gridSnapEnabled: Boolean @state(class: CONFIG)
  gridSpacing: Float @state(class: CONFIG)
  overlapBudget: Float @state(class: CONFIG)
  fillCount: Int @state(class: CONFIG)
  brushCandidateIndex: Int @state(class: CONFIG)
  lodAutomatic: Boolean @state(class: CONFIG)
  lodDepthVariable: Boolean @state(class: CONFIG)
  lodManual: Float @state(class: CONFIG)
  proximityRadius: Float @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  runtimeExtrasJson: String @state(class: CONFIG)
  hoveredObjectId: String @state(class: ARTIFACT)
  hoveredVortexFullId: String @state(class: ARTIFACT)
  hoveredKindId: String @state(class: ARTIFACT)
  previewSeq: Int @state(class: ARTIFACT)
}

type Puzzle3dStringList { values: [String!]! }
type Puzzle3dObjectsDelta { added: [Puzzle3dObject!]! removed: [String!]! patched: [Puzzle3dObjectPatchEntry!]! reordered: [String!] }
type Puzzle3dObjectPatchEntry { id: String! patch: Puzzle3dObjectPatch! }
type Puzzle3dObjectPatch { replacement: Puzzle3dObject }
enum Puzzle3dObjectAnchor { Fixed Derived }
type Puzzle3dObject {
  id: String!
  label: String
  objectKind: String
  anchor: Puzzle3dObjectAnchor!
  origin: [Float!]!
  orientation: [Float!]
  meshUrl: String
  vortices: [Puzzle3dVortex!]!
  hidden: Boolean!
  locked: Boolean!
}
type Puzzle3dVortex {
  id: String!
  vortexKind: String
  label: String
  position: [Float!]!
  direction: [Float!]
  radius: Float
  hidden: Boolean!
  locked: Boolean!
}
enum Puzzle3dCompatSpecificity { General Object Attraction Vortex Cable }
type Puzzle3dKindCompatibility {
  source: String!
  target: String!
  bidirectional: Boolean!
  important: Boolean!
  specificity: Puzzle3dCompatSpecificity!
}
type Puzzle3dMeta {
  kindCompatibility: [Puzzle3dKindCompatibility!]!
}
type Puzzle3dAttractionsDelta { added: [Puzzle3dAttraction!]! removed: [String!]! patched: [Puzzle3dAttractionPatchEntry!]! reordered: [String!] }
type Puzzle3dAttractionPatchEntry { id: String! patch: Puzzle3dAttractionPatch! }
type Puzzle3dAttractionPatch { replacement: Puzzle3dAttraction }
type Puzzle3dAttraction {
  id: String!
  attracting: String!
  attracted: String!
  gap: Float!
  shift: Float!
  rise: Float!
  rotation: Float!
  turn: Float!
  tilt: Float!
  x: Float!
  y: Float!
}
type Puzzle3dTargetVolumesDelta { added: [Puzzle3dTargetVolume!]! removed: [String!]! patched: [Puzzle3dTargetVolumePatchEntry!]! reordered: [String!] }
type Puzzle3dTargetVolumePatchEntry { id: String! patch: Puzzle3dTargetVolumePatch! }
type Puzzle3dTargetVolumePatch { replacement: Puzzle3dTargetVolume }
type Puzzle3dTargetVolume { id: String! }
type Puzzle3dReferencesDelta { added: [Puzzle3dReference!]! removed: [String!]! patched: [Puzzle3dReferencePatchEntry!]! reordered: [String!] }
type Puzzle3dReferencePatchEntry { id: String! patch: Puzzle3dReferencePatch! }
type Puzzle3dReferencePatch { replacement: Puzzle3dReference }
type Puzzle3dReference { id: String! }
type Puzzle3dArtifact { schema: String! }
type Puzzle3dMeta { _placeholder: Boolean }

