syntax = "proto3";
package semio.s.puzzle.puzzle3d.inference;

// 💡️ Puzzle3d inference schema — flatPosition (plane + center) per object.

message Puzzle3dInference {
  // @derived
  map<string, FlattenPose> flat_positions = 1;
}

message FlattenPlane {
  repeated double origin = 1;
  repeated double x_axis = 2;
  repeated double y_axis = 3;
}

message FlattenPose {
  FlattenPlane plane = 1;
  repeated double center = 2;
  repeated double orientation = 3;
}
