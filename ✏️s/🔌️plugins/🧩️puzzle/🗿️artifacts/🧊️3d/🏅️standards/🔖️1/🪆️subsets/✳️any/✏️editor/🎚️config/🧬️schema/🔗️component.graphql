type Puzzle3dConfig {
  selection: Puzzle3dSelection! @state(class: CONFIG)
  selectionMethod: String! @state(class: CONFIG)
  hoveredObjectId: String @state(class: CONFIG)
  hoveredVortexFullId: String @state(class: CONFIG)
  suggestionMenu: Puzzle3dSuggestionMenu @state(class: CONFIG)
  overlapBudget: Float! @state(class: CONFIG)
  fillCount: Int! @state(class: CONFIG)
  fillCheckpoint: [Int!]! @state(class: CONFIG)
  brushCandidateIndex: Int! @state(class: CONFIG)
  objectKindWeights: [FloatEntry!]! @state(class: CONFIG)
  vortexKindWeights: [FloatEntry!]! @state(class: CONFIG)
  lodAutomatic: Boolean! @state(class: CONFIG)
  lodDepthVariable: Boolean! @state(class: CONFIG)
  gridVisible: Boolean! @state(class: CONFIG)
  lodManual: Float! @state(class: CONFIG)
  gridSnapEnabled: Boolean! @state(class: CONFIG)
  gridSpacing: Float! @state(class: CONFIG)
  selectableKinds: Puzzle3dSelectableKinds! @state(class: CONFIG)
  hoveredKindId: String @state(class: CONFIG)
  engagementInput: String! @state(class: CONFIG)
  selectionModeDefault: String! @state(class: CONFIG)
  proximityRadius: Float! @state(class: CONFIG)
  chunkSize: Float! @state(class: CONFIG)
  voxelDims: [Int!]! @state(class: CONFIG)
  transformMove: Boolean! @state(class: CONFIG)
  transformRotate: Boolean! @state(class: CONFIG)
  vortexShow: String! @state(class: CONFIG)
  vortexDirection: String! @state(class: CONFIG)
  sun: WorldSunConfig! @state(class: CONFIG)
  camera: Puzzle3dCamera! @state(class: CONFIG)
  windowOptions: [Puzzle3dWindowOptionsEntry!]! @state(class: CONFIG)
  activeUtilityByWindowId: [StringEntry!]! @state(class: CONFIG)
  activeToolId: String @state(class: CONFIG)
  terminology: String! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
  windowIds: [String!]! @state(class: CONFIG)
}

type SelectionSet {
  ids: [String!]!
}

type WorldSunConfig {
  enabled: Boolean!
  azimuth: Float!
  elevation: Float!
  intensity: Float!
  color: String!
}

type WorldProjectionConfig {
  kind: String!
  orthographicView: String!
  axonometricVariant: String!
  axonometricAngleA: Float!
  axonometricAngleB: Float!
  axonometricQuadrant: String!
  obliqueVariant: String!
  obliqueAngle: Float!
  obliqueDepth: Float!
  onePointAxis: String!
  fov: Float!
  twoPointShift: Float!
  curvilinearFov: Float!
  curvilinearStrength: Float!
  curvilinearMapping: String!
}

type StringEntry {
  key: String!
  value: String!
}

type FloatEntry {
  key: String!
  value: Float!
}

type Puzzle3dCamera {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
  up: [Float!]
  projection: WorldProjectionConfig!
}

type Puzzle3dSelection {
  objectIds: SelectionSet!
  vortexIds: SelectionSet!
  attractionIds: SelectionSet!
  targetVolumeIds: SelectionSet!
  referenceIds: SelectionSet!
}

type Puzzle3dSelectableKinds {
  objects: Boolean!
  vortices: Boolean!
  attractions: Boolean!
}

type Puzzle3dSuggestionMenu {
  x: Float!
  y: Float!
  windowId: String!
}

type Puzzle3dWindowOptions {
  selectionMethod: String!
  lodAutomatic: Boolean!
  lodDepthVariable: Boolean!
  gridVisible: Boolean!
  lodManual: Float!
  gridSnapEnabled: Boolean!
  gridSpacing: Float!
  selectableKinds: Puzzle3dSelectableKinds!
  engagementInput: String!
  selectionModeDefault: String!
  proximityRadius: Float!
  chunkSize: Float!
  voxelDims: [Int!]!
  transformMove: Boolean!
  transformRotate: Boolean!
  vortexShow: String!
  vortexDirection: String!
  sun: WorldSunConfig!
  camera: Puzzle3dCamera!
}

type Puzzle3dWindowOptionsEntry {
  key: String!
  value: Puzzle3dWindowOptions!
}
