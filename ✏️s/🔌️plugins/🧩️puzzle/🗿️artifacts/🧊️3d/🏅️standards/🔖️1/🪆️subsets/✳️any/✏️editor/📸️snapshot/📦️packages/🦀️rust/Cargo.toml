[package]
workspace = "../../../../../../../.."
name = "semio-s-artifact-puzzle-3d-editor-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native editor root with typed authority and a derived intrinsic host view"

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[dependencies]
pack = { workspace = true }
semio-framework-artifact-reference = { workspace = true }
semio-framework-diagnostic = { workspace = true }
semio-framework-dsl-record = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-pack-json = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema-composition = { workspace = true }
semio-framework-ui-locale = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-native-owned = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-puzzle-3d-diff = { workspace = true }
semio-s-artifact-puzzle-3d-editor-config = { workspace = true }
semio-s-artifact-puzzle-3d-editor-terminology = { workspace = true }
semio-s-artifact-puzzle-3d-examples = { path = "../../../../📚️examples/📦️packages/🦀️rust" }
semio-s-artifact-puzzle-3d-model = { workspace = true }
semio-s-artifact-puzzle-3d-mutations = { workspace = true }
semio-s-artifact-puzzle-3d-mutations-object = { workspace = true }

[dev-dependencies]
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-framework-plugin = { workspace = true, features = ["artifact-app-testing"] }
semio-s-artifact-puzzle-3d-model = { workspace = true, features = ["testing"] }
semio-s-artifact-puzzle-3d-mutations = { workspace = true, features = ["testing"] }
semio-s-artifact-puzzle-3d-mutations-object = { workspace = true, features = ["testing"] }
