# 🧬️ Puzzle3d diff schema — sparse typed delta.

type Puzzle3dDiff {
  artifact: Puzzle3dArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  domain: String @state(class: ARTIFACT)
  meta: Puzzle3dMetaPatch @state(class: ARTIFACT)
  objects: Puzzle3dObjectsDelta @state(class: ARTIFACT)
  attractions: Puzzle3dAttractionsDelta @state(class: ARTIFACT)
  targetVolumes: Puzzle3dTargetVolumesDelta @state(class: ARTIFACT)
  references: Puzzle3dReferencesDelta @state(class: ARTIFACT)
}

type Puzzle3dKindCompatibilityKey { source: String! target: String! }
type Puzzle3dVortexPatch { vortexKind: String label: String position: [Float!] direction: [Float!] radius: Float hidden: Boolean locked: Boolean }
type Puzzle3dObjectPatch { label: String objectKind: String anchor: Puzzle3dObjectAnchor origin: [Float!] orientation: [Float!] scale: Puzzle3dScale meshUrl: String vortices: Puzzle3dVorticesDelta hidden: Boolean locked: Boolean }
type Puzzle3dAttractionPatch { attracting: String attracted: String gap: Float shift: Float rise: Float rotation: Float turn: Float tilt: Float x: Float y: Float }
type Puzzle3dTargetVolumePatch { origin: [Float!] orientation: [Float!] scale: Puzzle3dScale hidden: Boolean locked: Boolean }
type Puzzle3dReferencePatch { source: Puzzle3dReferenceSource origin: [Float!] widthWorld: Float locked: Boolean hidden: Boolean }
type Puzzle3dKindCompatibilityPatch { bidirectional: Boolean important: Boolean specificity: Puzzle3dCompatSpecificity }
type Puzzle3dMetaPatch { kindCatalogs: Puzzle3dKindCatalogs kindCompatibility: Puzzle3dKindCompatibilityDelta }
type Puzzle3dVorticesDelta { removed: [Puzzle3dVortexRemoval!]! inserted: [Puzzle3dVortexInsertion!]! moved: [Puzzle3dVortexRelocation!]! modified: [Puzzle3dVortexModification!]! }
type Puzzle3dVortexRemoval { id: String! index: Int! }
type Puzzle3dVortexInsertion { index: Int! row: Puzzle3dVortex! }
type Puzzle3dVortexRelocation { id: String! from: Int! to: Int! }
type Puzzle3dVortexModification { id: String! patch: Puzzle3dVortexPatch! }
type Puzzle3dObjectsDelta { removed: [Puzzle3dObjectRemoval!]! inserted: [Puzzle3dObjectInsertion!]! moved: [Puzzle3dObjectRelocation!]! modified: [Puzzle3dObjectModification!]! }
type Puzzle3dObjectRemoval { id: String! index: Int! }
type Puzzle3dObjectInsertion { index: Int! row: Puzzle3dObject! }
type Puzzle3dObjectRelocation { id: String! from: Int! to: Int! }
type Puzzle3dObjectModification { id: String! patch: Puzzle3dObjectPatch! }
type Puzzle3dAttractionsDelta { removed: [Puzzle3dAttractionRemoval!]! inserted: [Puzzle3dAttractionInsertion!]! moved: [Puzzle3dAttractionRelocation!]! modified: [Puzzle3dAttractionModification!]! }
type Puzzle3dAttractionRemoval { id: String! index: Int! }
type Puzzle3dAttractionInsertion { index: Int! row: Puzzle3dAttraction! }
type Puzzle3dAttractionRelocation { id: String! from: Int! to: Int! }
type Puzzle3dAttractionModification { id: String! patch: Puzzle3dAttractionPatch! }
type Puzzle3dTargetVolumesDelta { removed: [Puzzle3dTargetVolumeRemoval!]! inserted: [Puzzle3dTargetVolumeInsertion!]! moved: [Puzzle3dTargetVolumeRelocation!]! modified: [Puzzle3dTargetVolumeModification!]! }
type Puzzle3dTargetVolumeRemoval { id: String! index: Int! }
type Puzzle3dTargetVolumeInsertion { index: Int! row: Puzzle3dTargetVolume! }
type Puzzle3dTargetVolumeRelocation { id: String! from: Int! to: Int! }
type Puzzle3dTargetVolumeModification { id: String! patch: Puzzle3dTargetVolumePatch! }
type Puzzle3dReferencesDelta { removed: [Puzzle3dReferenceRemoval!]! inserted: [Puzzle3dReferenceInsertion!]! moved: [Puzzle3dReferenceRelocation!]! modified: [Puzzle3dReferenceModification!]! }
type Puzzle3dReferenceRemoval { id: String! index: Int! }
type Puzzle3dReferenceInsertion { index: Int! row: Puzzle3dReference! }
type Puzzle3dReferenceRelocation { id: String! from: Int! to: Int! }
type Puzzle3dReferenceModification { id: String! patch: Puzzle3dReferencePatch! }
type Puzzle3dKindCompatibilityDelta { removed: [Puzzle3dKindCompatibilityRemoval!]! inserted: [Puzzle3dKindCompatibilityInsertion!]! moved: [Puzzle3dKindCompatibilityRelocation!]! modified: [Puzzle3dKindCompatibilityModification!]! }
type Puzzle3dKindCompatibilityRemoval { id: Puzzle3dKindCompatibilityKey! index: Int! }
type Puzzle3dKindCompatibilityInsertion { index: Int! row: Puzzle3dKindCompatibility! }
type Puzzle3dKindCompatibilityRelocation { id: Puzzle3dKindCompatibilityKey! from: Int! to: Int! }
type Puzzle3dKindCompatibilityModification { id: Puzzle3dKindCompatibilityKey! patch: Puzzle3dKindCompatibilityPatch! }
