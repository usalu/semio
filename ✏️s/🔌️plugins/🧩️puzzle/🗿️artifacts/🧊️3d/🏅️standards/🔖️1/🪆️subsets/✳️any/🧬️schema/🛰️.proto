syntax = "proto3";
package semio.s.puzzle.puzzle3d.artifact;

// 🧬️ Puzzle3d artifact schema — every field with its state class.

message Puzzle3dArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  string domain = 2;
  // @state artifact
  Puzzle3dMeta meta = 3;
  // @state artifact
  repeated Puzzle3dObject objects = 4;
  // @state artifact
  repeated Puzzle3dAttraction attractions = 5;
  // @state artifact
  repeated Puzzle3dTargetVolume target_volumes = 6;
  // @state artifact
  repeated Puzzle3dReference references = 7;
  // @state presence
  repeated string selected_object_ids = 8;
  // @state presence
  repeated string selected_vortex_ids = 9;
  // @state presence
  repeated string selected_attraction_ids = 10;
  // @state presence
  repeated string selected_target_volume_ids = 11;
  // @state presence
  repeated string selected_reference_ids = 12;
  // @state presence
  string active_utility_id = 13;
  // @state config
  double camera_position_x = 14;
  // @state config
  double camera_position_y = 15;
  // @state config
  double camera_position_z = 16;
  // @state config
  double camera_target_x = 17;
  // @state config
  double camera_target_y = 18;
  // @state config
  double camera_target_z = 19;
  // @state config
  double camera_zoom = 20;
  // @state config
  string selection_method = 21;
  // @state config
  string selection_mode_default = 22;
  // @state config
  string engagement_input = 23;
  // @state config
  bool grid_visible = 24;
  // @state config
  bool grid_snap_enabled = 25;
  // @state config
  double grid_spacing = 26;
  // @state config
  double overlap_budget = 27;
  // @state config
  uint32 fill_count = 28;
  // @state config
  uint32 brush_candidate_index = 29;
  // @state config
  bool lod_automatic = 30;
  // @state config
  bool lod_depth_variable = 31;
  // @state config
  double lod_manual = 32;
  // @state config
  double proximity_radius = 33;
  // @state config
  string locale = 34;
  // @state config
  string runtime_extras_json = 35;
  // @state artifact
  optional string hovered_object_id = 36;
  // @state artifact
  optional string hovered_vortex_full_id = 37;
  // @state artifact
  optional string hovered_kind_id = 38;
  // @state artifact
  int64 preview_seq = 39;
}

enum Puzzle3dObjectAnchor {
  PUZZLE3D_OBJECT_ANCHOR_FIXED = 0;
  PUZZLE3D_OBJECT_ANCHOR_DERIVED = 1;
}

enum Puzzle3dCompatSpecificity {
  PUZZLE3D_COMPAT_SPECIFICITY_GENERAL = 0;
  PUZZLE3D_COMPAT_SPECIFICITY_OBJECT = 1;
  PUZZLE3D_COMPAT_SPECIFICITY_ATTRACTION = 2;
  PUZZLE3D_COMPAT_SPECIFICITY_VORTEX = 3;
  PUZZLE3D_COMPAT_SPECIFICITY_CABLE = 4;
}

message Puzzle3dAttraction {
  string id = 1;
  string attracting = 2;
  string attracted = 3;
  double gap = 4;
  double shift = 5;
  double rise = 6;
  double rotation = 7;
  double turn = 8;
  double tilt = 9;
  double x = 10;
  double y = 11;
}

message Puzzle3dObject {
  string id = 1;
  optional string label = 2;
  optional string object_kind = 3;
  Puzzle3dObjectAnchor anchor = 4;
  repeated double origin = 5;
  repeated double orientation = 6;
  optional string mesh_url = 7;
  repeated Puzzle3dVortex vortices = 8;
  bool hidden = 9;
  bool locked = 10;
}

message Puzzle3dVortex {
  string id = 1;
  optional string vortex_kind = 2;
  optional string label = 3;
  repeated double position = 4;
  repeated double direction = 5;
  optional double radius = 6;
  bool hidden = 7;
  bool locked = 8;
}

message Puzzle3dRepresentation {
  string id = 1;
  string name = 2;
  string url = 3;
  string mime = 4;
  repeated string tags = 5;
  optional string lod = 6;
  string description = 7;
}

message Puzzle3dCatalogVortexTemplate {
  string id = 1;
  string name = 2;
  string label = 3;
  string description = 4;
  string icon = 5;
  optional string vortex_kind = 6;
  repeated double point = 7;
  repeated double direction = 8;
  optional double t = 9;
  optional bool mandatory = 10;
  optional double radius = 11;
}

message Puzzle3dCatalogObjectKind {
  string id = 1;
  string name = 2;
  string label = 3;
  string description = 4;
  string icon = 5;
  string image = 6;
  string unit = 7;
  bool abstract = 8;
  repeated string base_kinds = 9;
  repeated Puzzle3dRepresentation representations = 10;
  repeated Puzzle3dCatalogVortexTemplate vortices = 11;
}

message Puzzle3dCatalogVortexKind {
  string id = 1;
  optional string code = 2;
  optional string label = 3;
  optional int32 order = 4;
  repeated string compatible_with = 5;
  string description = 6;
  string icon = 7;
  string color = 8;
  string default_cable_kind = 9;
}

message Puzzle3dKindCompatibility {
  string source = 1;
  string target = 2;
  bool bidirectional = 3;
  bool important = 4;
  Puzzle3dCompatSpecificity specificity = 5;
}

message Puzzle3dMeta {
  Puzzle3dKindCatalogs kind_catalogs = 1;
  repeated Puzzle3dKindCompatibility kind_compatibility = 2;
}

message Puzzle3dKindCatalogs {
  repeated Puzzle3dCatalogObjectKind objects = 1;
  repeated Puzzle3dCatalogVortexKind vortices = 2;
}
