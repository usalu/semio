syntax = "proto3";
package semio.s.puzzle.puzzle3d.diff;

// 🧬️ Puzzle3d diff schema — sparse typed delta.

message Puzzle3dDiff {
  // @state artifact
  optional Puzzle3dArtifact artifact = 1;
  // @state artifact
  optional string schema = 2;
  // @state artifact
  optional string domain = 3;
  // @state artifact
  optional Puzzle3dMetaPatch meta = 4;
  // @state artifact
  optional Puzzle3dObjectsDelta objects = 5;
  // @state artifact
  optional Puzzle3dAttractionsDelta attractions = 6;
  // @state artifact
  optional Puzzle3dTargetVolumesDelta target_volumes = 7;
  // @state artifact
  optional Puzzle3dReferencesDelta references = 8;
}

message Puzzle3dArtifact { string schema = 1; }
message Puzzle3dKindCompatibilityKey { string source = 1; string target = 2; }
message Puzzle3dVortexPatch { optional string vortex_kind = 1; optional string label = 2; repeated double position = 3; repeated double direction = 4; optional double radius = 5; optional bool hidden = 6; optional bool locked = 7; }
message Puzzle3dObjectPatch { optional string label = 1; optional string object_kind = 2; optional Puzzle3dObjectAnchor anchor = 3; repeated double origin = 4; repeated double orientation = 5; optional Puzzle3dScale scale = 6; optional string mesh_url = 7; optional Puzzle3dVorticesDelta vortices = 8; optional bool hidden = 9; optional bool locked = 10; }
message Puzzle3dAttractionPatch { optional string attracting = 1; optional string attracted = 2; optional double gap = 3; optional double shift = 4; optional double rise = 5; optional double rotation = 6; optional double turn = 7; optional double tilt = 8; optional double x = 9; optional double y = 10; }
message Puzzle3dTargetVolumePatch { repeated double origin = 1; repeated double orientation = 2; optional Puzzle3dScale scale = 3; optional bool hidden = 4; optional bool locked = 5; }
message Puzzle3dReferencePatch { optional Puzzle3dReferenceSource source = 1; repeated double origin = 2; optional double width_world = 3; optional bool locked = 4; optional bool hidden = 5; }
message Puzzle3dKindCompatibilityPatch { optional bool bidirectional = 1; optional bool important = 2; optional Puzzle3dCompatSpecificity specificity = 3; }
message Puzzle3dMetaPatch { optional Puzzle3dKindCatalogs kind_catalogs = 1; optional Puzzle3dKindCompatibilityDelta kind_compatibility = 2; }
message Puzzle3dVorticesDelta { repeated Puzzle3dVortexRemoval removed = 1; repeated Puzzle3dVortexInsertion inserted = 2; repeated Puzzle3dVortexRelocation moved = 3; repeated Puzzle3dVortexModification modified = 4; }
message Puzzle3dVortexRemoval { string id = 1; uint64 index = 2; }
message Puzzle3dVortexInsertion { uint64 index = 1; Puzzle3dVortex row = 2; }
message Puzzle3dVortexRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle3dVortexModification { string id = 1; Puzzle3dVortexPatch patch = 2; }
message Puzzle3dObjectsDelta { repeated Puzzle3dObjectRemoval removed = 1; repeated Puzzle3dObjectInsertion inserted = 2; repeated Puzzle3dObjectRelocation moved = 3; repeated Puzzle3dObjectModification modified = 4; }
message Puzzle3dObjectRemoval { string id = 1; uint64 index = 2; }
message Puzzle3dObjectInsertion { uint64 index = 1; Puzzle3dObject row = 2; }
message Puzzle3dObjectRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle3dObjectModification { string id = 1; Puzzle3dObjectPatch patch = 2; }
message Puzzle3dAttractionsDelta { repeated Puzzle3dAttractionRemoval removed = 1; repeated Puzzle3dAttractionInsertion inserted = 2; repeated Puzzle3dAttractionRelocation moved = 3; repeated Puzzle3dAttractionModification modified = 4; }
message Puzzle3dAttractionRemoval { string id = 1; uint64 index = 2; }
message Puzzle3dAttractionInsertion { uint64 index = 1; Puzzle3dAttraction row = 2; }
message Puzzle3dAttractionRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle3dAttractionModification { string id = 1; Puzzle3dAttractionPatch patch = 2; }
message Puzzle3dTargetVolumesDelta { repeated Puzzle3dTargetVolumeRemoval removed = 1; repeated Puzzle3dTargetVolumeInsertion inserted = 2; repeated Puzzle3dTargetVolumeRelocation moved = 3; repeated Puzzle3dTargetVolumeModification modified = 4; }
message Puzzle3dTargetVolumeRemoval { string id = 1; uint64 index = 2; }
message Puzzle3dTargetVolumeInsertion { uint64 index = 1; Puzzle3dTargetVolume row = 2; }
message Puzzle3dTargetVolumeRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle3dTargetVolumeModification { string id = 1; Puzzle3dTargetVolumePatch patch = 2; }
message Puzzle3dReferencesDelta { repeated Puzzle3dReferenceRemoval removed = 1; repeated Puzzle3dReferenceInsertion inserted = 2; repeated Puzzle3dReferenceRelocation moved = 3; repeated Puzzle3dReferenceModification modified = 4; }
message Puzzle3dReferenceRemoval { string id = 1; uint64 index = 2; }
message Puzzle3dReferenceInsertion { uint64 index = 1; Puzzle3dReference row = 2; }
message Puzzle3dReferenceRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle3dReferenceModification { string id = 1; Puzzle3dReferencePatch patch = 2; }
message Puzzle3dKindCompatibilityDelta { repeated Puzzle3dKindCompatibilityRemoval removed = 1; repeated Puzzle3dKindCompatibilityInsertion inserted = 2; repeated Puzzle3dKindCompatibilityRelocation moved = 3; repeated Puzzle3dKindCompatibilityModification modified = 4; }
message Puzzle3dKindCompatibilityRemoval { Puzzle3dKindCompatibilityKey id = 1; uint64 index = 2; }
message Puzzle3dKindCompatibilityInsertion { uint64 index = 1; Puzzle3dKindCompatibility row = 2; }
message Puzzle3dKindCompatibilityRelocation { Puzzle3dKindCompatibilityKey id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle3dKindCompatibilityModification { Puzzle3dKindCompatibilityKey id = 1; Puzzle3dKindCompatibilityPatch patch = 2; }
