# 🧬️ Puzzle2d diff schema — sparse typed delta.

type Puzzle2dDiff {
  artifact: Puzzle2dArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  camera: Puzzle2dCamera @state(class: ARTIFACT)
  nodes: Puzzle2dNodesDelta @state(class: ARTIFACT)
  edges: Puzzle2dEdgesDelta @state(class: ARTIFACT)
  targetRegions: Puzzle2dTargetRegionsDelta @state(class: ARTIFACT)
  meta: Puzzle2dMetaPatch @state(class: ARTIFACT)
}

type Puzzle2dKindCompatibilityKey { source: String! target: String! }
type Puzzle2dHandlePatch { handleKind: String angle: Float radius: Float color: String iconKind: String scale: Float visible: Boolean locked: Boolean }
type Puzzle2dNodePatch { nodeKind: String shape: String x: Float y: Float radius: Float width: Float height: Float text: String iconKind: String root: Boolean scale: Float visible: Boolean locked: Boolean anchor: Puzzle2dNodeAnchor handles: Puzzle2dHandlesDelta }
type Puzzle2dEdgePatch { source: String target: String edgeKind: String gap: Float shift: Float rise: Float rotation: Float turn: Float tilt: Float x: Float y: Float sourceTip: String targetTip: String visible: Boolean locked: Boolean }
type Puzzle2dTargetRegionPatch { x: Float y: Float width: Float height: Float label: String hidden: Boolean locked: Boolean }
type Puzzle2dKindCompatibilityPatch { bidirectional: Boolean important: Boolean specificity: Puzzle2dCompatSpecificity }
type Puzzle2dMetaPatch { manifestId: String kindCompatibility: Puzzle2dKindCompatibilityDelta kindCatalogs: Puzzle2dKindCatalogs }
type Puzzle2dHandlesDelta { removed: [Puzzle2dHandleRemoval!]! inserted: [Puzzle2dHandleInsertion!]! moved: [Puzzle2dHandleRelocation!]! modified: [Puzzle2dHandleModification!]! }
type Puzzle2dHandleRemoval { id: String! index: Int! }
type Puzzle2dHandleInsertion { index: Int! row: Puzzle2dHandle! }
type Puzzle2dHandleRelocation { id: String! from: Int! to: Int! }
type Puzzle2dHandleModification { id: String! patch: Puzzle2dHandlePatch! }
type Puzzle2dNodesDelta { removed: [Puzzle2dNodeRemoval!]! inserted: [Puzzle2dNodeInsertion!]! moved: [Puzzle2dNodeRelocation!]! modified: [Puzzle2dNodeModification!]! }
type Puzzle2dNodeRemoval { id: String! index: Int! }
type Puzzle2dNodeInsertion { index: Int! row: Puzzle2dNode! }
type Puzzle2dNodeRelocation { id: String! from: Int! to: Int! }
type Puzzle2dNodeModification { id: String! patch: Puzzle2dNodePatch! }
type Puzzle2dEdgesDelta { removed: [Puzzle2dEdgeRemoval!]! inserted: [Puzzle2dEdgeInsertion!]! moved: [Puzzle2dEdgeRelocation!]! modified: [Puzzle2dEdgeModification!]! }
type Puzzle2dEdgeRemoval { id: String! index: Int! }
type Puzzle2dEdgeInsertion { index: Int! row: Puzzle2dEdge! }
type Puzzle2dEdgeRelocation { id: String! from: Int! to: Int! }
type Puzzle2dEdgeModification { id: String! patch: Puzzle2dEdgePatch! }
type Puzzle2dTargetRegionsDelta { removed: [Puzzle2dTargetRegionRemoval!]! inserted: [Puzzle2dTargetRegionInsertion!]! moved: [Puzzle2dTargetRegionRelocation!]! modified: [Puzzle2dTargetRegionModification!]! }
type Puzzle2dTargetRegionRemoval { id: String! index: Int! }
type Puzzle2dTargetRegionInsertion { index: Int! row: Puzzle2dTargetRegion! }
type Puzzle2dTargetRegionRelocation { id: String! from: Int! to: Int! }
type Puzzle2dTargetRegionModification { id: String! patch: Puzzle2dTargetRegionPatch! }
type Puzzle2dKindCompatibilityDelta { removed: [Puzzle2dKindCompatibilityRemoval!]! inserted: [Puzzle2dKindCompatibilityInsertion!]! moved: [Puzzle2dKindCompatibilityRelocation!]! modified: [Puzzle2dKindCompatibilityModification!]! }
type Puzzle2dKindCompatibilityRemoval { id: Puzzle2dKindCompatibilityKey! index: Int! }
type Puzzle2dKindCompatibilityInsertion { index: Int! row: Puzzle2dKindCompatibility! }
type Puzzle2dKindCompatibilityRelocation { id: Puzzle2dKindCompatibilityKey! from: Int! to: Int! }
type Puzzle2dKindCompatibilityModification { id: Puzzle2dKindCompatibilityKey! patch: Puzzle2dKindCompatibilityPatch! }
