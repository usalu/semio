type Puzzle2dConfig {
  nodeKindWeights: [FloatEntry!]! @state(class: CONFIG)
  handleKindWeights: [FloatEntry!]! @state(class: CONFIG)
  fillCount: Int! @state(class: CONFIG)
  contactTolerance: Float! @state(class: CONFIG)
  brushPlacementOverlapBudget: Float! @state(class: CONFIG)
}

type FloatEntry {
  key: String!
  value: Float!
}
