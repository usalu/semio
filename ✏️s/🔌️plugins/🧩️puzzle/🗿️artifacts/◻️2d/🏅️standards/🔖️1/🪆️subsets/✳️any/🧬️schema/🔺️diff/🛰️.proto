syntax = "proto3";
package semio.s.puzzle.puzzle2d.diff;

// 🧬️ Puzzle2d diff schema — sparse typed delta.

message Puzzle2dDiff {
  // @state artifact
  optional Puzzle2dArtifact artifact = 1;
  // @state artifact
  optional string schema = 2;
  // @state artifact
  optional Puzzle2dCamera camera = 3;
  // @state artifact
  optional Puzzle2dNodesDelta nodes = 4;
  // @state artifact
  optional Puzzle2dEdgesDelta edges = 5;
  // @state artifact
  optional Puzzle2dTargetRegionsDelta target_regions = 6;
  // @state artifact
  optional Puzzle2dMetaPatch meta = 7;
}

message Puzzle2dArtifact { string schema = 1; }
message Puzzle2dKindCompatibilityKey { string source = 1; string target = 2; }
message Puzzle2dHandlePatch { optional string handle_kind = 1; optional double angle = 2; optional double radius = 3; optional string color = 4; optional string icon_kind = 5; optional double scale = 6; optional bool visible = 7; optional bool locked = 8; }
message Puzzle2dNodePatch { optional string node_kind = 1; optional string shape = 2; optional double x = 3; optional double y = 4; optional double radius = 5; optional double width = 6; optional double height = 7; optional string text = 8; optional string icon_kind = 9; optional bool root = 10; optional double scale = 11; optional bool visible = 12; optional bool locked = 13; optional Puzzle2dNodeAnchor anchor = 14; optional Puzzle2dHandlesDelta handles = 15; }
message Puzzle2dEdgePatch { optional string source = 1; optional string target = 2; optional string edge_kind = 3; optional double gap = 4; optional double shift = 5; optional double rise = 6; optional double rotation = 7; optional double turn = 8; optional double tilt = 9; optional double x = 10; optional double y = 11; optional string source_tip = 12; optional string target_tip = 13; optional bool visible = 14; optional bool locked = 15; }
message Puzzle2dTargetRegionPatch { optional double x = 1; optional double y = 2; optional double width = 3; optional double height = 4; optional string label = 5; optional bool hidden = 6; optional bool locked = 7; }
message Puzzle2dKindCompatibilityPatch { optional bool bidirectional = 1; optional bool important = 2; optional Puzzle2dCompatSpecificity specificity = 3; }
message Puzzle2dMetaPatch { optional string manifest_id = 1; optional Puzzle2dKindCompatibilityDelta kind_compatibility = 2; optional Puzzle2dKindCatalogs kind_catalogs = 3; }
message Puzzle2dHandlesDelta { repeated Puzzle2dHandleRemoval removed = 1; repeated Puzzle2dHandleInsertion inserted = 2; repeated Puzzle2dHandleRelocation moved = 3; repeated Puzzle2dHandleModification modified = 4; }
message Puzzle2dHandleRemoval { string id = 1; uint64 index = 2; }
message Puzzle2dHandleInsertion { uint64 index = 1; Puzzle2dHandle row = 2; }
message Puzzle2dHandleRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle2dHandleModification { string id = 1; Puzzle2dHandlePatch patch = 2; }
message Puzzle2dNodesDelta { repeated Puzzle2dNodeRemoval removed = 1; repeated Puzzle2dNodeInsertion inserted = 2; repeated Puzzle2dNodeRelocation moved = 3; repeated Puzzle2dNodeModification modified = 4; }
message Puzzle2dNodeRemoval { string id = 1; uint64 index = 2; }
message Puzzle2dNodeInsertion { uint64 index = 1; Puzzle2dNode row = 2; }
message Puzzle2dNodeRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle2dNodeModification { string id = 1; Puzzle2dNodePatch patch = 2; }
message Puzzle2dEdgesDelta { repeated Puzzle2dEdgeRemoval removed = 1; repeated Puzzle2dEdgeInsertion inserted = 2; repeated Puzzle2dEdgeRelocation moved = 3; repeated Puzzle2dEdgeModification modified = 4; }
message Puzzle2dEdgeRemoval { string id = 1; uint64 index = 2; }
message Puzzle2dEdgeInsertion { uint64 index = 1; Puzzle2dEdge row = 2; }
message Puzzle2dEdgeRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle2dEdgeModification { string id = 1; Puzzle2dEdgePatch patch = 2; }
message Puzzle2dTargetRegionsDelta { repeated Puzzle2dTargetRegionRemoval removed = 1; repeated Puzzle2dTargetRegionInsertion inserted = 2; repeated Puzzle2dTargetRegionRelocation moved = 3; repeated Puzzle2dTargetRegionModification modified = 4; }
message Puzzle2dTargetRegionRemoval { string id = 1; uint64 index = 2; }
message Puzzle2dTargetRegionInsertion { uint64 index = 1; Puzzle2dTargetRegion row = 2; }
message Puzzle2dTargetRegionRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle2dTargetRegionModification { string id = 1; Puzzle2dTargetRegionPatch patch = 2; }
message Puzzle2dKindCompatibilityDelta { repeated Puzzle2dKindCompatibilityRemoval removed = 1; repeated Puzzle2dKindCompatibilityInsertion inserted = 2; repeated Puzzle2dKindCompatibilityRelocation moved = 3; repeated Puzzle2dKindCompatibilityModification modified = 4; }
message Puzzle2dKindCompatibilityRemoval { Puzzle2dKindCompatibilityKey id = 1; uint64 index = 2; }
message Puzzle2dKindCompatibilityInsertion { uint64 index = 1; Puzzle2dKindCompatibility row = 2; }
message Puzzle2dKindCompatibilityRelocation { Puzzle2dKindCompatibilityKey id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle2dKindCompatibilityModification { Puzzle2dKindCompatibilityKey id = 1; Puzzle2dKindCompatibilityPatch patch = 2; }
