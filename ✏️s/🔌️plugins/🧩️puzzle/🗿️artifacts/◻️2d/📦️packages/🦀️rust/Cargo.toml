[package]
name = "semio-s-artifact-puzzle-2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Puzzle 2d artifact"

[package.metadata.semio]
role = "s-module"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[features]
default = []
component-app-assembly = ["semio-framework-plugin/component-guest", "dep:semio-framework-3d", "dep:semio-framework-async", "dep:semio-framework-dispatch-macros", "dep:semio-framework-ui-contract", "dep:semio-framework-ui-scene"]

[dependencies]
# 🌐️ `✏️editor/🌉️wasm` is declared ungated in this crate's root and carries `#[wasm_bindgen]`
# exports, so the crate needs the attribute macro on every target it is built for — the browser
# renderer builds it for wasm32-unknown-unknown, where the module is live.
wasm-bindgen = { workspace = true }
semio-framework = { workspace = true }
semio-framework-geometry = { workspace = true }
semio-framework-job = { workspace = true }
semio-framework-os-infinite = { workspace = true }
semio-framework-os-kernel = { workspace = true }
semio-framework-plugin = { workspace = true }
semio-framework-schema = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-puzzle-3d = { workspace = true }
semio-s-artifact-stdio-dwg = { workspace = true }
semio-s-artifact-stdio-dxf = { workspace = true }
semio-s-artifact-stdio-json = { workspace = true }
semio-s-artifact-stdio-pdf = { workspace = true }
semio-s-artifact-stdio-png = { workspace = true }
semio-s-artifact-stdio-svg = { workspace = true }
semio-s-artifact-stdio-txt = { workspace = true }
pack = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semio-framework-3d = { workspace = true, optional = true }
semio-framework-async = { workspace = true, optional = true }
semio-framework-dispatch-macros = { workspace = true, optional = true }
semio-framework-ui-contract = { workspace = true, optional = true }
semio-framework-ui-scene = { workspace = true, optional = true }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
