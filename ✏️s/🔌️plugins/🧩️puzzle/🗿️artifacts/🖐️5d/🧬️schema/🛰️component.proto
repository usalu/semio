syntax = "proto3";
package semio.s.puzzle.puzzle5d.artifact;

// 🧬️ Puzzle5d artifact schema — every field with its state class.

message Puzzle5dArtifact {
  // @state persistent
  string schema = 1;
  // @state persistent
  string domain = 2;
  // @state persistent
  optional string label = 3;
  // @state persistent
  Puzzle5dMeta meta = 4;
  // @state persistent
  optional Puzzle5dKindCatalogs kind_catalogs = 5;
  // @state persistent
  repeated Puzzle5dKindCompatibility kind_compatibility = 6;
  // @state persistent
  repeated Puzzle5dPart parts = 7;
  // @state persistent
  repeated Puzzle5dFastener fasteners = 8;
  // @state shared-ui
  repeated string selected_part_ids = 9;
  // @state shared-ui
  repeated string selected_grip_ids = 10;
  // @state shared-ui
  repeated string selected_fastener_ids = 11;
  // @state shared-ui
  string active_utility_id = 12;
  // @state local-ui
  double camera2d_x = 13;
  // @state local-ui
  double camera2d_y = 14;
  // @state local-ui
  double camera2d_zoom = 15;
  // @state local-ui
  double camera3d_position_x = 16;
  // @state local-ui
  double camera3d_position_y = 17;
  // @state local-ui
  double camera3d_position_z = 18;
  // @state local-ui
  double camera3d_target_x = 19;
  // @state local-ui
  double camera3d_target_y = 20;
  // @state local-ui
  double camera3d_target_z = 21;
  // @state local-ui
  double camera3d_zoom = 22;
  // @state local-ui
  string selection_method = 23;
  // @state local-ui
  bool grid_snap_enabled = 24;
  // @state local-ui
  double grid_factor = 25;
  // @state local-ui
  double suggestion_offset = 26;
  // @state local-ui
  double overlap_budget = 27;
  // @state local-ui
  uint32 fill_count = 28;
  // @state local-ui
  uint32 brush_candidate_index = 29;
  // @state local-ui
  string lod_mode = 30;
  // @state local-ui
  string locale = 31;
  // @state local-ui
  string runtime_extras_json = 32;
  // @state preview
  optional string hovered_part_id = 33;
  // @state preview
  int64 preview_seq = 34;
}

