# 🧬️ Puzzle5d artifact schema — every field with its state class.

type Puzzle5dArtifact {
  schema: String! @state(class: PERSISTENT)
  domain: String! @state(class: PERSISTENT)
  label: String @state(class: PERSISTENT)
  meta: Puzzle5dMeta! @state(class: PERSISTENT)
  kindCatalogs: Puzzle5dKindCatalogs @state(class: PERSISTENT)
  kindCompatibility: [Puzzle5dKindCompatibility!]! @state(class: PERSISTENT)
  parts: [Puzzle5dPart!]! @state(class: PERSISTENT)
  fasteners: [Puzzle5dFastener!]! @state(class: PERSISTENT)
  selectedPartIds: [String!]! @state(class: SHARED_UI)
  selectedGripIds: [String!]! @state(class: SHARED_UI)
  selectedFastenerIds: [String!]! @state(class: SHARED_UI)
  activeUtilityId: String! @state(class: SHARED_UI)
  camera2dX: Float! @state(class: LOCAL_UI)
  camera2dY: Float! @state(class: LOCAL_UI)
  camera2dZoom: Float! @state(class: LOCAL_UI)
  camera3dPositionX: Float! @state(class: LOCAL_UI)
  camera3dPositionY: Float! @state(class: LOCAL_UI)
  camera3dPositionZ: Float! @state(class: LOCAL_UI)
  camera3dTargetX: Float! @state(class: LOCAL_UI)
  camera3dTargetY: Float! @state(class: LOCAL_UI)
  camera3dTargetZ: Float! @state(class: LOCAL_UI)
  camera3dZoom: Float! @state(class: LOCAL_UI)
  selectionMethod: String! @state(class: LOCAL_UI)
  gridSnapEnabled: Boolean! @state(class: LOCAL_UI)
  gridFactor: Float! @state(class: LOCAL_UI)
  suggestionOffset: Float! @state(class: LOCAL_UI)
  overlapBudget: Float! @state(class: LOCAL_UI)
  fillCount: Int! @state(class: LOCAL_UI)
  brushCandidateIndex: Int! @state(class: LOCAL_UI)
  lodMode: String! @state(class: LOCAL_UI)
  locale: String! @state(class: LOCAL_UI)
  runtimeExtrasJson: String! @state(class: LOCAL_UI)
  hoveredPartId: String @state(class: PREVIEW)
  previewSeq: Int! @state(class: PREVIEW)
}



enum Puzzle5dPartAnchor { FIXED DERIVED }
enum Puzzle5dCompatSpecificity { GENERAL PART FASTENER GRIP ROPE }

type Puzzle5dAttribute { id: String key: String value: String definition: String }
type Puzzle5dAuthor { id: String name: String email: String role: String rank: Int }
type Puzzle5dRepresentation { id: String name: String url: String mime: String tags: [String!] lod: String description: String }
type Puzzle5dGripTemplate {
  id: String
  name: String
  label: String
  description: String
  icon: String
  gripKind: String
  point: [Float!]
  direction: [Float!]
  t: Float
  mandatory: Boolean
  radius: Float
}
type Puzzle5dCatalogPartKind {
  id: String!
  name: String
  label: String
  description: String
  icon: String
  image: String
  unit: String
  abstract: Boolean
  baseKinds: [String!]
  representations: [Puzzle5dRepresentation!]
  grips: [Puzzle5dGripTemplate!]
  attributes: [Puzzle5dAttribute!]
  authors: [Puzzle5dAuthor!]
}
type Puzzle5dCatalogGripKind {
  id: String!
  code: String
  label: String
  order: Int
  compatibleWith: [String!]
  description: String
  icon: String
  color: String
  defaultRopeKind: String
}
type Puzzle5dCatalogFastenerKind { id: String! name: String label: String }
type Puzzle5dCatalogRopeKind { id: String! name: String label: String defaultFastenerKind: String }
type Puzzle5dKindCatalogs {
  parts: [Puzzle5dCatalogPartKind!]
  grips: [Puzzle5dCatalogGripKind!]
  fasteners: [Puzzle5dCatalogFastenerKind!]
  ropes: [Puzzle5dCatalogRopeKind!]
}
type Puzzle5dKindCompatibility {
  source: String!
  target: String!
  bidirectional: Boolean
  important: Boolean
  specificity: Puzzle5dCompatSpecificity
}
type Puzzle5dMeta { description: String }
type Puzzle5dPart {
  id: String!
  partKind: String
  anchor: Puzzle5dPartAnchor
}
type Puzzle5dFastener {
  id: String!
  source: String!
  target: String!
  fastenerKind: String
  gap: Float
  shift: Float
  rise: Float
  rotation: Float
  turn: Float
  tilt: Float
  x: Float
  y: Float
}
