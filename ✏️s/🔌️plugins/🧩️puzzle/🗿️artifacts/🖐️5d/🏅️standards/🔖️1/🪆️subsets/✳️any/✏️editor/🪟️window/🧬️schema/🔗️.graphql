type Puzzle5dCamera2d {
  x: Float!
  y: Float!
  zoom: Float!
}

type Puzzle5dWorldProjectionConfig {
  kind: String!
  orthographicView: String!
  axonometricVariant: String!
  axonometricAngleA: Float!
  axonometricAngleB: Float!
  axonometricQuadrant: String!
  obliqueVariant: String!
  obliqueAngle: Float!
  obliqueDepth: Float!
  onePointAxis: String!
  fov: Float!
  twoPointShift: Float!
  curvilinearFov: Float!
  curvilinearStrength: Float!
  curvilinearMapping: String!
}

type Puzzle5dCamera3d {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
  up: [Float!]
  projection: Puzzle5dWorldProjectionConfig!
}

type Puzzle5dSelectableKinds {
  parts: Boolean!
  grips: Boolean!
  fasteners: Boolean!
}

type Puzzle5dWorldSunConfig {
  enabled: Boolean!
  azimuth: Float!
  elevation: Float!
  intensity: Float!
  color: String!
}

type Puzzle5dBoardWindowConfig {
  camera2d: Puzzle5dCamera2d!
  lodMode: String!
  suggestionOffset: Float!
  gridSnapEnabled: Boolean!
  gridFactor: Float!
  gridVisible: Boolean!
  selectableKinds: Puzzle5dSelectableKinds!
}

type Puzzle5dWorldWindowConfig {
  camera3d: Puzzle5dCamera3d!
  sun: Puzzle5dWorldSunConfig!
  gridVisible: Boolean!
  gridSnapEnabled: Boolean!
  gridSpacing: Float!
  lodAutomatic: Boolean!
  lodDepthVariable: Boolean!
  lodManual: Float!
  selectableKinds: Puzzle5dSelectableKinds!
  gripShow: String!
  gripDirection: String!
  transformMove: Boolean!
  transformRotate: Boolean!
  voxelDims: [Int!]!
}

type Puzzle5dSuggestionMenu {
  x: Float!
  y: Float!
  windowId: String!
  vortexFullId: String!
  submenu: Boolean!
}

type Puzzle5dWindowTransient {
  suggestionMenu: Puzzle5dSuggestionMenu
  engagementInput: String!
  brushCandidateIndex: Int!
}
