# 🧬️ Puzzle5d diff schema — sparse typed delta.

type Puzzle5dDiff {
  artifact: Puzzle5dArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  domain: String @state(class: ARTIFACT)
  label: String @state(class: ARTIFACT)
  meta: Puzzle5dMetaPatch @state(class: ARTIFACT)
  kindCatalogs: ArtifactChildHandle @state(class: ARTIFACT)
  kindCatalogsExtra: Puzzle5dKindCatalogsExtra @state(class: ARTIFACT)
  kindCompatibility: Puzzle5dKindCompatibilityDelta @state(class: ARTIFACT)
  parts: Puzzle5dPartsDelta @state(class: ARTIFACT)
  fasteners: Puzzle5dFastenersDelta @state(class: ARTIFACT)
  targetVolumes: Puzzle5dTargetVolumesDelta @state(class: ARTIFACT)
}

type Puzzle5dKindCompatibilityKey { source: String! target: String! }
type Puzzle5dPart2dPatch { x: Float y: Float shape: String radius: Float width: Float height: Float text: String iconKind: String hidden: Boolean locked: Boolean }
type Puzzle5dPart3dPatch { origin: [Float!] meshUrl: String orientation: [Float!] scale: Puzzle5dScale label: String }
type Puzzle5dGrip2dPatch { angle: Float gripKind: String radius: Float }
type Puzzle5dGrip3dPatch { position: [Float!] direction: [Float!] radius: Float label: String }
type Puzzle5dGripPatch { gripKind: String _2d: Puzzle5dGrip2dPatch _3d: Puzzle5dGrip3dPatch }
type Puzzle5dPartPatch { partKind: String anchor: Puzzle5dPartAnchor _2d: Puzzle5dPart2dPatch _3d: Puzzle5dPart3dPatch grips: Puzzle5dGripsDelta }
type Puzzle5dFastenerPatch { source: String target: String fastenerKind: String gap: Float shift: Float rise: Float rotation: Float turn: Float tilt: Float x: Float y: Float }
type Puzzle5dTargetVolumePatch { origin: [Float!] orientation: [Float!] scale: Puzzle5dScale hidden: Boolean locked: Boolean }
type Puzzle5dKindCompatibilityPatch { bidirectional: Boolean important: Boolean specificity: Puzzle5dCompatSpecificity }
type Puzzle5dMetaPatch { description: String }
type Puzzle5dGripsDelta { removed: [Puzzle5dGripRemoval!]! inserted: [Puzzle5dGripInsertion!]! moved: [Puzzle5dGripRelocation!]! modified: [Puzzle5dGripModification!]! }
type Puzzle5dGripRemoval { id: String! index: Int! }
type Puzzle5dGripInsertion { index: Int! row: Puzzle5dGrip! }
type Puzzle5dGripRelocation { id: String! from: Int! to: Int! }
type Puzzle5dGripModification { id: String! patch: Puzzle5dGripPatch! }
type Puzzle5dPartsDelta { removed: [Puzzle5dPartRemoval!]! inserted: [Puzzle5dPartInsertion!]! moved: [Puzzle5dPartRelocation!]! modified: [Puzzle5dPartModification!]! }
type Puzzle5dPartRemoval { id: String! index: Int! }
type Puzzle5dPartInsertion { index: Int! row: Puzzle5dPart! }
type Puzzle5dPartRelocation { id: String! from: Int! to: Int! }
type Puzzle5dPartModification { id: String! patch: Puzzle5dPartPatch! }
type Puzzle5dFastenersDelta { removed: [Puzzle5dFastenerRemoval!]! inserted: [Puzzle5dFastenerInsertion!]! moved: [Puzzle5dFastenerRelocation!]! modified: [Puzzle5dFastenerModification!]! }
type Puzzle5dFastenerRemoval { id: String! index: Int! }
type Puzzle5dFastenerInsertion { index: Int! row: Puzzle5dFastener! }
type Puzzle5dFastenerRelocation { id: String! from: Int! to: Int! }
type Puzzle5dFastenerModification { id: String! patch: Puzzle5dFastenerPatch! }
type Puzzle5dTargetVolumesDelta { removed: [Puzzle5dTargetVolumeRemoval!]! inserted: [Puzzle5dTargetVolumeInsertion!]! moved: [Puzzle5dTargetVolumeRelocation!]! modified: [Puzzle5dTargetVolumeModification!]! }
type Puzzle5dTargetVolumeRemoval { id: String! index: Int! }
type Puzzle5dTargetVolumeInsertion { index: Int! row: Puzzle5dTargetVolume! }
type Puzzle5dTargetVolumeRelocation { id: String! from: Int! to: Int! }
type Puzzle5dTargetVolumeModification { id: String! patch: Puzzle5dTargetVolumePatch! }
type Puzzle5dKindCompatibilityDelta { removed: [Puzzle5dKindCompatibilityRemoval!]! inserted: [Puzzle5dKindCompatibilityInsertion!]! moved: [Puzzle5dKindCompatibilityRelocation!]! modified: [Puzzle5dKindCompatibilityModification!]! }
type Puzzle5dKindCompatibilityRemoval { id: Puzzle5dKindCompatibilityKey! index: Int! }
type Puzzle5dKindCompatibilityInsertion { index: Int! row: Puzzle5dKindCompatibility! }
type Puzzle5dKindCompatibilityRelocation { id: Puzzle5dKindCompatibilityKey! from: Int! to: Int! }
type Puzzle5dKindCompatibilityModification { id: Puzzle5dKindCompatibilityKey! patch: Puzzle5dKindCompatibilityPatch! }
