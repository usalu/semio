syntax = "proto3";
package semio.s.puzzle.puzzle5d.diff;

// 🧬️ Puzzle5d diff schema — sparse typed delta.

message Puzzle5dDiff {
  // @state artifact
  optional Puzzle5dArtifact artifact = 1;
  // @state artifact
  optional string schema = 2;
  // @state artifact
  optional string domain = 3;
  // @state artifact
  optional string label = 4;
  // @state artifact
  optional Puzzle5dMetaPatch meta = 5;
  // @state artifact
  optional ArtifactChildHandle kind_catalogs = 6;
  // @state artifact
  optional Puzzle5dKindCatalogsExtra kind_catalogs_extra = 7;
  // @state artifact
  optional Puzzle5dKindCompatibilityDelta kind_compatibility = 8;
  // @state artifact
  optional Puzzle5dPartsDelta parts = 9;
  // @state artifact
  optional Puzzle5dFastenersDelta fasteners = 10;
  // @state artifact
  optional Puzzle5dTargetVolumesDelta target_volumes = 11;
}

message Puzzle5dArtifact { string schema = 1; }
message Puzzle5dKindCompatibilityKey { string source = 1; string target = 2; }
message Puzzle5dPart2dPatch { optional double x = 1; optional double y = 2; optional string shape = 3; optional double radius = 4; optional double width = 5; optional double height = 6; optional string text = 7; optional string icon_kind = 8; optional bool hidden = 9; optional bool locked = 10; }
message Puzzle5dPart3dPatch { repeated double origin = 1; optional string mesh_url = 2; repeated double orientation = 3; optional Puzzle5dScale scale = 4; optional string label = 5; }
message Puzzle5dGrip2dPatch { optional double angle = 1; optional string grip_kind = 2; optional double radius = 3; }
message Puzzle5dGrip3dPatch { repeated double position = 1; repeated double direction = 2; optional double radius = 3; optional string label = 4; }
message Puzzle5dGripPatch { optional string grip_kind = 1; optional Puzzle5dGrip2dPatch grip_2d = 2; optional Puzzle5dGrip3dPatch grip_3d = 3; }
message Puzzle5dPartPatch { optional string part_kind = 1; optional Puzzle5dPartAnchor anchor = 2; optional Puzzle5dPart2dPatch part_2d = 3; optional Puzzle5dPart3dPatch part_3d = 4; optional Puzzle5dGripsDelta grips = 5; }
message Puzzle5dFastenerPatch { optional string source = 1; optional string target = 2; optional string fastener_kind = 3; optional double gap = 4; optional double shift = 5; optional double rise = 6; optional double rotation = 7; optional double turn = 8; optional double tilt = 9; optional double x = 10; optional double y = 11; }
message Puzzle5dTargetVolumePatch { repeated double origin = 1; repeated double orientation = 2; optional Puzzle5dScale scale = 3; optional bool hidden = 4; optional bool locked = 5; }
message Puzzle5dKindCompatibilityPatch { optional bool bidirectional = 1; optional bool important = 2; optional Puzzle5dCompatSpecificity specificity = 3; }
message Puzzle5dMetaPatch { optional string description = 1; }
message Puzzle5dGripsDelta { repeated Puzzle5dGripRemoval removed = 1; repeated Puzzle5dGripInsertion inserted = 2; repeated Puzzle5dGripRelocation moved = 3; repeated Puzzle5dGripModification modified = 4; }
message Puzzle5dGripRemoval { string id = 1; uint64 index = 2; }
message Puzzle5dGripInsertion { uint64 index = 1; Puzzle5dGrip row = 2; }
message Puzzle5dGripRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle5dGripModification { string id = 1; Puzzle5dGripPatch patch = 2; }
message Puzzle5dPartsDelta { repeated Puzzle5dPartRemoval removed = 1; repeated Puzzle5dPartInsertion inserted = 2; repeated Puzzle5dPartRelocation moved = 3; repeated Puzzle5dPartModification modified = 4; }
message Puzzle5dPartRemoval { string id = 1; uint64 index = 2; }
message Puzzle5dPartInsertion { uint64 index = 1; Puzzle5dPart row = 2; }
message Puzzle5dPartRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle5dPartModification { string id = 1; Puzzle5dPartPatch patch = 2; }
message Puzzle5dFastenersDelta { repeated Puzzle5dFastenerRemoval removed = 1; repeated Puzzle5dFastenerInsertion inserted = 2; repeated Puzzle5dFastenerRelocation moved = 3; repeated Puzzle5dFastenerModification modified = 4; }
message Puzzle5dFastenerRemoval { string id = 1; uint64 index = 2; }
message Puzzle5dFastenerInsertion { uint64 index = 1; Puzzle5dFastener row = 2; }
message Puzzle5dFastenerRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle5dFastenerModification { string id = 1; Puzzle5dFastenerPatch patch = 2; }
message Puzzle5dTargetVolumesDelta { repeated Puzzle5dTargetVolumeRemoval removed = 1; repeated Puzzle5dTargetVolumeInsertion inserted = 2; repeated Puzzle5dTargetVolumeRelocation moved = 3; repeated Puzzle5dTargetVolumeModification modified = 4; }
message Puzzle5dTargetVolumeRemoval { string id = 1; uint64 index = 2; }
message Puzzle5dTargetVolumeInsertion { uint64 index = 1; Puzzle5dTargetVolume row = 2; }
message Puzzle5dTargetVolumeRelocation { string id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle5dTargetVolumeModification { string id = 1; Puzzle5dTargetVolumePatch patch = 2; }
message Puzzle5dKindCompatibilityDelta { repeated Puzzle5dKindCompatibilityRemoval removed = 1; repeated Puzzle5dKindCompatibilityInsertion inserted = 2; repeated Puzzle5dKindCompatibilityRelocation moved = 3; repeated Puzzle5dKindCompatibilityModification modified = 4; }
message Puzzle5dKindCompatibilityRemoval { Puzzle5dKindCompatibilityKey id = 1; uint64 index = 2; }
message Puzzle5dKindCompatibilityInsertion { uint64 index = 1; Puzzle5dKindCompatibility row = 2; }
message Puzzle5dKindCompatibilityRelocation { Puzzle5dKindCompatibilityKey id = 1; uint64 from = 2; uint64 to = 3; }
message Puzzle5dKindCompatibilityModification { Puzzle5dKindCompatibilityKey id = 1; Puzzle5dKindCompatibilityPatch patch = 2; }
