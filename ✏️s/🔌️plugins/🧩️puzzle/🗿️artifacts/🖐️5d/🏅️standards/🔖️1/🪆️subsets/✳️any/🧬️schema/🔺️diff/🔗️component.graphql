# 🧬️ Puzzle5d diff schema — sparse field delta.

type Puzzle5dDiff {
  artifact: Puzzle5dArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  domain: String @state(class: ARTIFACT)
  label: String @state(class: ARTIFACT)
  meta: Puzzle5dMeta @state(class: ARTIFACT)
  kindCatalogs: Puzzle5dKindCatalogs @state(class: ARTIFACT)
  kindCompatibility: Puzzle5dKindCompatibilityList @state(class: ARTIFACT)
  parts: Puzzle5dPartsDelta @state(class: ARTIFACT)
  fasteners: Puzzle5dFastenersDelta @state(class: ARTIFACT)
  selectedPartIds: Puzzle5dStringList @state(class: PRESENCE)
  selectedGripIds: Puzzle5dStringList @state(class: PRESENCE)
  selectedFastenerIds: Puzzle5dStringList @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  camera2dX: Float @state(class: CONFIG)
  camera2dY: Float @state(class: CONFIG)
  camera2dZoom: Float @state(class: CONFIG)
  camera3dPositionX: Float @state(class: CONFIG)
  camera3dPositionY: Float @state(class: CONFIG)
  camera3dPositionZ: Float @state(class: CONFIG)
  camera3dTargetX: Float @state(class: CONFIG)
  camera3dTargetY: Float @state(class: CONFIG)
  camera3dTargetZ: Float @state(class: CONFIG)
  camera3dZoom: Float @state(class: CONFIG)
  selectionMethod: String @state(class: CONFIG)
  gridSnapEnabled: Boolean @state(class: CONFIG)
  gridFactor: Float @state(class: CONFIG)
  suggestionOffset: Float @state(class: CONFIG)
  overlapBudget: Float @state(class: CONFIG)
  fillCount: Int @state(class: CONFIG)
  brushCandidateIndex: Int @state(class: CONFIG)
  lodMode: String @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  runtimeExtrasJson: String @state(class: CONFIG)
  hoveredPartId: String @state(class: ARTIFACT)
  previewSeq: Int @state(class: ARTIFACT)
}

type Puzzle5dStringList { values: [String!]! }
type Puzzle5dPartsDelta { added: [Puzzle5dPart!]! removed: [String!]! patched: [Puzzle5dPartPatchEntry!]! reordered: [String!] }
type Puzzle5dPartPatchEntry { id: String! patch: Puzzle5dPartPatch! }
type Puzzle5dPartPatch { replacement: Puzzle5dPart }
type Puzzle5dPart { id: String! partKind: String anchor: Puzzle5dPartAnchor }
type Puzzle5dFastenersDelta { added: [Puzzle5dFastener!]! removed: [String!]! patched: [Puzzle5dFastenerPatchEntry!]! reordered: [String!] }
type Puzzle5dFastenerPatchEntry { id: String! patch: Puzzle5dFastenerPatch! }
type Puzzle5dFastenerPatch { replacement: Puzzle5dFastener }
type Puzzle5dFastener { id: String! source: String target: String gap: Float shift: Float rise: Float rotation: Float turn: Float tilt: Float x: Float y: Float }
type Puzzle5dKindCompatibility { source: String target: String bidirectional: Boolean important: Boolean specificity: Puzzle5dCompatSpecificity }
type Puzzle5dArtifact { schema: String! }
type Puzzle5dMeta { _placeholder: Boolean }
type Puzzle5dKindCatalogs { _placeholder: Boolean }

type Puzzle5dKindCompatibilityList { values: [Puzzle5dKindCompatibility!]! }

enum Puzzle5dPartAnchor { FIXED DERIVED }
enum Puzzle5dCompatSpecificity { GENERAL PART FASTENER GRIP ROPE }
