syntax = "proto3";
package semio.s.puzzle.puzzle5d.snapshot;

// 🧬️ Puzzle5d snapshot schema — persistent fields only.

message Puzzle5dSnapshot {
  // @state persistent
  string schema = 1;
  // @state persistent
  string domain = 2;
  // @state persistent
  optional string label = 3;
  // @state persistent
  Puzzle5dMeta meta = 4;
  // @state persistent
  optional Puzzle5dKindCatalogs kind_catalogs = 5;
  // @state persistent
  repeated Puzzle5dKindCompatibility kind_compatibility = 6;
  // @state persistent
  repeated Puzzle5dPart parts = 7;
  // @state persistent
  repeated Puzzle5dFastener fasteners = 8;
}

