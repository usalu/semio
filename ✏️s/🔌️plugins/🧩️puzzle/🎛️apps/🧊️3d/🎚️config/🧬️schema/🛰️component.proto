syntax = "proto3";
package semio.app.puzzle.puzzle3d;
message Puzzle3dConfig {
  // @state local-ui
  Puzzle3dSelection selection = 1;
  // @state local-ui
  string selection_method = 2;
  // @state local-ui
  optional string hovered_object_id = 3;
  // @state local-ui
  optional string hovered_vortex_full_id = 4;
  // @state local-ui
  optional Puzzle3dSuggestionMenu suggestion_menu = 5;
  // @state local-ui
  double overlap_budget = 6;
  // @state local-ui
  uint32 fill_count = 7;
  // @state local-ui
  uint64 brush_candidate_index = 8;
  // @state local-ui
  map<string, double> object_kind_weights = 9;
  // @state local-ui
  map<string, double> vortex_kind_weights = 10;
  // @state local-ui
  bool lod_automatic = 11;
  // @state local-ui
  bool lod_depth_variable = 12;
  // @state local-ui
  bool grid_visible = 13;
  // @state local-ui
  double lod_manual = 14;
  // @state local-ui
  bool grid_snap_enabled = 15;
  // @state local-ui
  double grid_spacing = 16;
  // @state local-ui
  Puzzle3dSelectableKinds selectable_kinds = 17;
  // @state local-ui
  optional string hovered_kind_id = 18;
  // @state local-ui
  string engagement_input = 19;
  // @state local-ui
  string selection_mode_default = 20;
  // @state local-ui
  double proximity_radius = 21;
  // @state local-ui
  double chunk_size = 22;
  // @state local-ui
  repeated uint32 voxel_dims = 23;
  // @state local-ui
  bool transform_move = 24;
  // @state local-ui
  bool transform_rotate = 25;
  // @state local-ui
  string vortex_show = 26;
  // @state local-ui
  string vortex_direction = 27;
  // @state local-ui
  WorldSunConfig sun = 28;
  // @state local-ui
  Puzzle3dCamera camera = 29;
  // @state local-ui
  map<string, Puzzle3dWindowOptions> window_options = 30;
  // @state local-ui
  map<string, string> active_utility_by_window_id = 31;
  // @state local-ui
  optional string active_tool_id = 32;
  // @state local-ui
  string terminology = 33;
  // @state local-ui
  string locale = 34;
  // @state local-ui
  repeated string window_ids = 35;
}

message SelectionSet {
  repeated string ids = 1;
}

message WorldSunConfig {
  bool enabled = 1;
  double azimuth = 2;
  double elevation = 3;
  double intensity = 4;
  string color = 5;
}

message WorldProjectionConfig {
  string kind = 1;
  string orthographic_view = 2;
  string axonometric_variant = 3;
  double axonometric_angle_a = 4;
  double axonometric_angle_b = 5;
  string axonometric_quadrant = 6;
  string oblique_variant = 7;
  double oblique_angle = 8;
  double oblique_depth = 9;
  string one_point_axis = 10;
  double fov = 11;
  double two_point_shift = 12;
  double curvilinear_fov = 13;
  double curvilinear_strength = 14;
  string curvilinear_mapping = 15;
}

message Puzzle3dCamera {
  repeated double position = 1;
  repeated double target = 2;
  double zoom = 3;
  repeated double up = 4;
  WorldProjectionConfig projection = 5;
}

message Puzzle3dSelection {
  SelectionSet object_ids = 1;
  SelectionSet vortex_ids = 2;
  SelectionSet attraction_ids = 3;
  SelectionSet target_volume_ids = 4;
  SelectionSet reference_ids = 5;
}

message Puzzle3dSelectableKinds {
  bool objects = 1;
  bool vortices = 2;
  bool attractions = 3;
}

message Puzzle3dSuggestionMenu {
  double x = 1;
  double y = 2;
  string window_id = 3;
}

message Puzzle3dWindowOptions {
  string selection_method = 1;
  bool lod_automatic = 2;
  bool lod_depth_variable = 3;
  bool grid_visible = 4;
  double lod_manual = 5;
  bool grid_snap_enabled = 6;
  double grid_spacing = 7;
  Puzzle3dSelectableKinds selectable_kinds = 8;
  string engagement_input = 9;
  string selection_mode_default = 10;
  double proximity_radius = 11;
  double chunk_size = 12;
  repeated uint32 voxel_dims = 13;
  bool transform_move = 14;
  bool transform_rotate = 15;
  string vortex_show = 16;
  string vortex_direction = 17;
  WorldSunConfig sun = 18;
  Puzzle3dCamera camera = 19;
}
