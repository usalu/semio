syntax = "proto3";
package semio.app.puzzle.puzzle5d;
message Puzzle5dPresence {
  // @state presence
  repeated string selected_part_ids = 1;
  // @state presence
  repeated string selected_grip_ids = 2;
  // @state presence
  repeated string selected_fastener_ids = 3;
  // @state presence
  optional string hovered_part_id = 4;
  // @state presence
  double camera2d_x = 5;
  // @state presence
  double camera2d_y = 6;
  // @state presence
  double camera2d_zoom = 7;
  // @state presence
  repeated double camera3d_position = 8;
  // @state presence
  repeated double camera3d_target = 9;
  // @state presence
  double camera3d_zoom = 10;
  // @state presence
  string active_utility_id = 11;
}
