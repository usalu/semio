type Puzzle5dConfig {
  camera2d: Puzzle5dCamera2d! @state(class: CONFIG)
  camera3d: Puzzle5dCamera3d! @state(class: CONFIG)
  selection: Puzzle5dSelection! @state(class: CONFIG)
  selectionMethod: String! @state(class: CONFIG)
  hoveredPartId: String @state(class: CONFIG)
  fillCount: Int! @state(class: CONFIG)
  brushCandidateIndex: Int! @state(class: CONFIG)
  overlapBudget: Float! @state(class: CONFIG)
  lodMode: String! @state(class: CONFIG)
  suggestionOffset: Float! @state(class: CONFIG)
  gridSnapEnabled: Boolean! @state(class: CONFIG)
  gridFactor: Float! @state(class: CONFIG)
  engagementInputByWindow: [StringEntry!]! @state(class: CONFIG)
  objectKindWeights: [FloatEntry!]! @state(class: CONFIG)
  vortexKindWeights: [FloatEntry!]! @state(class: CONFIG)
  sun: WorldSunConfig! @state(class: CONFIG)
  activeUtilityByWindowId: [StringEntry!]! @state(class: CONFIG)
  terminology: String! @state(class: CONFIG)
  locale: String! @state(class: CONFIG)
}

type SelectionSet {
  ids: [String!]!
}

type WorldSunConfig {
  enabled: Boolean!
  azimuth: Float!
  elevation: Float!
  intensity: Float!
  color: String!
}

type WorldProjectionConfig {
  kind: String!
  orthographicView: String!
  axonometricVariant: String!
  axonometricAngleA: Float!
  axonometricAngleB: Float!
  axonometricQuadrant: String!
  obliqueVariant: String!
  obliqueAngle: Float!
  obliqueDepth: Float!
  onePointAxis: String!
  fov: Float!
  twoPointShift: Float!
  curvilinearFov: Float!
  curvilinearStrength: Float!
  curvilinearMapping: String!
}

type StringEntry {
  key: String!
  value: String!
}

type FloatEntry {
  key: String!
  value: Float!
}

type Puzzle5dCamera2d {
  x: Float!
  y: Float!
  zoom: Float!
}

type Puzzle5dCamera3d {
  position: [Float!]!
  target: [Float!]!
  zoom: Float!
}

type Puzzle5dSelection {
  partIds: SelectionSet!
  gripIds: SelectionSet!
  fastenerIds: SelectionSet!
}
