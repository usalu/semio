syntax = "proto3";
package semio.app.puzzle.puzzle2d;
message Puzzle2dConfig {
  // @state local-ui
  repeated string selected_ids = 1;
  // @state local-ui
  double camera_x = 2;
  // @state local-ui
  double camera_y = 3;
  // @state local-ui
  double camera_zoom = 4;
  // @state local-ui
  map<string, string> lod_mode_by_pane = 5;
  // @state local-ui
  map<string, string> engagement_input_by_pane = 6;
  // @state local-ui
  uint64 brush_candidate_index = 7;
  // @state local-ui
  repeated string brush_candidates = 8;
  // @state local-ui
  string brush_candidate_source_handle_id = 9;
  // @state local-ui
  uint32 fill_count = 10;
  // @state local-ui
  string selection_method = 11;
  // @state local-ui
  bool grid_snap_enabled = 12;
  // @state local-ui
  double grid_factor = 13;
  // @state local-ui
  double suggestion_offset = 14;
  // @state local-ui
  map<string, double> node_kind_weights = 15;
  // @state local-ui
  map<string, double> handle_kind_weights = 16;
  // @state local-ui
  map<string, string> active_utility_by_window_id = 17;
  // @state local-ui
  string locale = 18;
  // @state local-ui
  string terminology = 19;
}
