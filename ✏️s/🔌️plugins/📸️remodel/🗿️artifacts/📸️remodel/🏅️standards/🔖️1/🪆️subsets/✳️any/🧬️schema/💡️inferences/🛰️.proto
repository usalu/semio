syntax = "proto3";
package semio.s.remodel.remodel.inference;

// 💡️ Remodel inference schema — reconstructed-mesh bounds (bounding box + vertex/face counts).

message RemodelInference {
  // @derived
  RemodelBounds bounds = 1;
}

message RemodelBounds {
  RemodelBoundingBox bounding_box = 1;
  uint32 vertex_count = 2;
  uint32 face_count = 3;
}

message RemodelBoundingBox {
  repeated double min = 1;
  repeated double max = 2;
}
