# 🧬️ Remodel diff schema — sparse field delta.

type RemodelDiff {
  artifact: RemodelArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  streams: RemodelMediaStreamList @state(class: ARTIFACT)
  assets: [ImageAssetEntry!] @state(class: ARTIFACT)
  calibration: CalibrationState @state(class: ARTIFACT)
  params: ReconstructionParams @state(class: ARTIFACT)
  gcps: RemodelGcpList @state(class: ARTIFACT)
  job: ReconstructionJob @state(class: ARTIFACT)
  results: ReconstructionResults @state(class: ARTIFACT)
  selection: RemodelUiSelection @state(class: PRESENCE)
  activeUtilityId: String @state(class: PRESENCE)
  reportTable: String @state(class: PRESENCE)
  frameCursor: RemodelUiFrameCursor @state(class: PRESENCE)
  camera: RemodelUiCamera @state(class: CONFIG)
  layers: RemodelUiLayers @state(class: CONFIG)
  locale: String @state(class: CONFIG)
}

type RemodelArtifact { _placeholder: Boolean }
type RemodelMediaStreamList { values: [MediaStream!]! }
type RemodelGcpList { values: [GroundControlPoint!]! }
type RemodelUiCamera { fov: Float }
type RemodelUiSelection { mode: String }
type RemodelUiLayers { mesh: Boolean }
type RemodelUiFrameCursor { frameIndex: Int }
type MediaStream { id: String! }
type ImageAsset { mime: String! }
type ImageAssetEntry { key: String! value: ImageAsset! }
type CalibrationState { _placeholder: Boolean }
type ReconstructionParams { _placeholder: Boolean }
type GroundControlPoint { id: String! }
type ReconstructionJob { _placeholder: Boolean }
type ReconstructionResults { _placeholder: Boolean }
