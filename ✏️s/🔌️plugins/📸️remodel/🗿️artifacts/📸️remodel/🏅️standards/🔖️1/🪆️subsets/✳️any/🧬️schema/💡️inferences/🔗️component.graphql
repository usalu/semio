# 💡️ Remodel inference schema — reconstructed-mesh bounds (bounding box + vertex/face counts).

type RemodelInference {
  bounds: RemodelBounds! @derived
}

type RemodelBounds {
  boundingBox: RemodelBoundingBox!
  vertexCount: Int!
  faceCount: Int!
}

type RemodelBoundingBox {
  min: [Float!]!
  max: [Float!]!
}
