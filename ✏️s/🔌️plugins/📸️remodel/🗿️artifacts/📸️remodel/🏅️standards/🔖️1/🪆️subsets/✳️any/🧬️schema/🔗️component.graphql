# 🧬️ Remodel artifact schema — every field with its state class.

type RemodelArtifact {
  schema: String! @state(class: PERSISTENT)
  id: String! @state(class: PERSISTENT)
  streams: [MediaStream!]! @state(class: PERSISTENT)
  assets: [ImageAssetEntry!]! @state(class: PERSISTENT)
  calibration: CalibrationState! @state(class: PERSISTENT)
  params: ReconstructionParams! @state(class: PERSISTENT)
  gcps: [GroundControlPoint!]! @state(class: PERSISTENT)
  job: ReconstructionJob! @state(class: PERSISTENT)
  results: ReconstructionResults! @state(class: PERSISTENT)
  selection: RemodelUiSelection! @state(class: SHARED_UI)
  activeUtilityId: String! @state(class: SHARED_UI)
  reportTable: String! @state(class: SHARED_UI)
  frameCursor: RemodelUiFrameCursor! @state(class: SHARED_UI)
  camera: RemodelUiCamera! @state(class: LOCAL_UI)
  layers: RemodelUiLayers! @state(class: LOCAL_UI)
  locale: String! @state(class: LOCAL_UI)
}

type RemodelUiCamera {
  position: [Float!]!
  target: [Float!]!
  fov: Float!
}

type RemodelUiSelection {
  mode: String!
  ids: [String!]!
}

type RemodelUiLayers {
  mesh: Boolean!
  dense: Boolean!
  sparse: Boolean!
  cameras: Boolean!
  gcps: Boolean!
}

type RemodelUiFrameCursor {
  streamId: String
  frameIndex: Int!
}

type MediaStream { id: String! }
type ImageAsset { mime: String! }
type ImageAssetEntry { key: String! value: ImageAsset! }
type CalibrationState { _placeholder: Boolean }
type ReconstructionParams { _placeholder: Boolean }
type GroundControlPoint { id: String! }
type ReconstructionJob { _placeholder: Boolean }
type ReconstructionResults { _placeholder: Boolean }
