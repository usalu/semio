syntax = "proto3";
package semio.s.remodel.remodel.artifact;

// 🧬️ Remodel artifact schema.

message RemodelArtifact {
  // @state persistent
  string schema = 1;
  // @state persistent
  string id = 2;
  // @state persistent
  repeated MediaStream streams = 3;
  // @state persistent
  map<string, ImageAsset> assets = 4;
  // @state persistent
  CalibrationState calibration = 5;
  // @state persistent
  ReconstructionParams params = 6;
  // @state persistent
  repeated GroundControlPoint gcps = 7;
  // @state persistent
  ReconstructionJob job = 8;
  // @state persistent
  ReconstructionResults results = 9;
  // @state shared-ui
  RemodelUiSelection selection = 10;
  // @state shared-ui
  string active_utility_id = 11;
  // @state shared-ui
  string report_table = 12;
  // @state shared-ui
  RemodelUiFrameCursor frame_cursor = 13;
  // @state local-ui
  RemodelUiCamera camera = 14;
  // @state local-ui
  RemodelUiLayers layers = 15;
  // @state local-ui
  string locale = 16;
}

message MediaStream {
  string _placeholder = 1;
}

message ImageAsset {
  string _placeholder = 1;
}

message CalibrationState {
  string _placeholder = 1;
}

message ReconstructionParams {
  string _placeholder = 1;
}

message GroundControlPoint {
  string _placeholder = 1;
}

message ReconstructionJob {
  string _placeholder = 1;
}

message ReconstructionResults {
  string _placeholder = 1;
}

message RemodelUiCamera {
  string _placeholder = 1;
}

message RemodelUiSelection {
  string _placeholder = 1;
}

message RemodelUiLayers {
  string _placeholder = 1;
}

message RemodelUiFrameCursor {
  string _placeholder = 1;
}

message RemodelMediaStreamList {
  string _placeholder = 1;
}

message RemodelGcpList {
  string _placeholder = 1;
}

