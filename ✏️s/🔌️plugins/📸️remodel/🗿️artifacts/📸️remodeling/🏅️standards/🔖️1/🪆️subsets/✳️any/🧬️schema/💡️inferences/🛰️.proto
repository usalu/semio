syntax = "proto3";
package semio.s.remodel.remodeling.inference;

// 💡️ Remodeling inference schema.

message RemodelingInference {
  // @derived
  RemodelingBounds bounds = 1;
  // @derived
  map<string, RemodelingPoseDelta> relative_camera_poses = 2;
}

message RemodelingBoundingBox {
  repeated double min = 1;
  repeated double max = 2;
}

message RemodelingBounds {
  RemodelingBoundingBox bounding_box = 1;
  uint32 vertex_count = 2;
  uint32 face_count = 3;
}

message RemodelingPoseDelta {
  repeated double translation_delta = 1;
  double rotation_angle_rad = 2;
}
