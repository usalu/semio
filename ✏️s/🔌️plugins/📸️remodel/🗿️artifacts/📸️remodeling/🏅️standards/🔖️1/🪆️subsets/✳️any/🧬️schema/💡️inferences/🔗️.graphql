# 💡️ Remodeling inference schema — derived, never persisted.

type RemodelingInference {
  bounds: RemodelingBounds! @derived
  relativeCameraPoses: [RemodelingPoseDeltaEntry!]! @derived
}

type RemodelingBoundingBox {
  min: [Float!]!
  max: [Float!]!
}

type RemodelingBounds {
  boundingBox: RemodelingBoundingBox!
  vertexCount: Int!
  faceCount: Int!
}

type RemodelingPoseDelta {
  translationDelta: [Float!]!
  rotationAngleRad: Float!
}

type RemodelingPoseDeltaEntry {
  key: String!
  value: RemodelingPoseDelta!
}
