syntax = "proto3";
package semio.s.remodel.remodeling.diff;

// 🔺️ Remodeling diff schema.

message RemodelingDiff {
  // @state artifact
  optional string schema = 1;
  // @state artifact
  optional string id = 2;
  // @state artifact
  optional RemodelingStreamsDelta streams = 3;
  // @state artifact
  optional RemodelingAssetsDelta assets = 4;
  // @state artifact
  optional RemodelingContentDelta durable_artifacts = 5;
  // @state artifact
  optional RemodelingCalibrationDelta calibration = 6;
  // @state artifact
  optional RemodelingParamsDiff params = 7;
  // @state artifact
  optional RemodelingGcpsDelta gcps = 8;
  // @state artifact
  optional RemodelingResultsDiff results = 9;
}

enum RemodelingRowKind { REMODELING_ROW_KIND_INSERT = 0; REMODELING_ROW_KIND_REPLACE = 1; REMODELING_ROW_KIND_REMOVE = 2; REMODELING_ROW_KIND_PATCH = 3; }

message RemodelingStreamRow { RemodelingRowKind row = 1; optional MediaStream entity = 2; optional string key = 3; optional MediaStreamPatch patch = 4; }
message RemodelingGcpRow { RemodelingRowKind row = 1; optional GroundControlPoint entity = 2; optional string key = 3; optional GroundControlPointPatch patch = 4; }
message RemodelingCameraRow { RemodelingRowKind row = 1; optional CameraCalibration entity = 2; optional string key = 3; }
message RemodelingRigRow { RemodelingRowKind row = 1; optional RigExtrinsic entity = 2; optional string key = 3; }
message RemodelingAssetRow { RemodelingRowKind row = 1; optional RemodelingAssetEntry entity = 2; optional string key = 3; }
message RemodelingStreamsDelta { repeated RemodelingStreamRow rows = 1; }
message RemodelingGcpsDelta { repeated RemodelingGcpRow rows = 1; }
message RemodelingCamerasDelta { repeated RemodelingCameraRow rows = 1; }
message RemodelingRigDelta { repeated RemodelingRigRow rows = 1; }
message RemodelingAssetsDelta { repeated RemodelingAssetRow rows = 1; }
message RemodelingAssetEntry { string key = 1; RemodelingAssetChild child = 2; }
message RemodelingCalibrationDelta { RemodelingCamerasDelta cameras = 1; RemodelingRigDelta rig = 2; }

message FrameRefMembers { repeated FrameRef removed = 1; repeated FrameRef added = 2; }
message GcpObservationMembers { repeated GcpObservation removed = 1; repeated GcpObservation added = 2; }
message RemodelingAssignedVideoSource { optional VideoSource value = 1; }
message MediaStreamPatch { optional double sync_offset_ms = 1; optional RemodelingAssignedVideoSource source = 2; optional FrameRefMembers frames = 3; }
message GroundControlPointPatch { optional GcpObservationMembers observations = 1; }

enum RemodelingContentRowKind { REMODELING_CONTENT_ROW_KIND_APPEND = 0; REMODELING_CONTENT_ROW_KIND_TRUNCATE = 1; }
message RemodelingContentHeader { string kind = 1; optional string mime = 2; uint32 width = 3; uint32 height = 4; }
message RemodelingContentRow { RemodelingContentRowKind row = 1; string id = 2; optional RemodelingContentHeader header = 3; repeated ByteBuffer chunks = 4; optional uint64 from = 5; }
message RemodelingContentDelta { repeated RemodelingContentRow rows = 1; }

message RemodelingParamsDiff {
  optional IngestParams ingest = 1;
  optional FeatureParams feature = 2;
  optional MatchParams matching = 3;
  optional SfmParams sfm = 4;
  optional DenseParams dense = 5;
  optional MeshParams mesh = 6;
  optional MotionParams motion = 7;
  optional GeoParams geo = 8;
}

message RemodelingAssignedSparseCloud { optional SparseCloud value = 1; }
message RemodelingAssignedDenseCloud { optional DenseCloud value = 1; }
message RemodelingAssignedCameraTrajectory { optional CameraTrajectory value = 1; }
message RemodelingAssignedGeoProducts { optional GeoProducts value = 1; }
message RemodelingAssignedQcReport { optional QcReportSnapshot value = 1; }
message RemodelingTracks { repeated MotionTrackSummary values = 1; }
message RemodelingResultsDiff {
  optional RemodelingAssignedSparseCloud sparse = 1;
  optional RemodelingAssignedDenseCloud dense = 2;
  optional RemodelingMesh mesh = 3;
  optional RemodelingAssignedCameraTrajectory trajectory = 4;
  optional RemodelingTracks tracks = 5;
  optional RemodelingAssignedGeoProducts geo = 6;
  optional RemodelingAssignedQcReport qc = 7;
}

message ArtifactDialect {
  string artifact_kind = 1;
  string standard = 2;
  string subset = 3;
}

message ArtifactRef {
  string artifact_id = 1;
  ArtifactDialect dialect = 2;
}

message CameraCalibration {
  string id = 1;
  string label = 2;
  string model = 3;
  double fx = 4;
  double fy = 5;
  double cx = 6;
  double cy = 7;
  double skew = 8;
  repeated float distortion = 9;
  optional float rms_reprojection_px = 10;
  bool locked = 11;
}

message CameraPosePreview {
  string camera_id = 1;
  repeated float rotation_wxyz = 2;
  repeated float translation = 3;
}

message CameraTrajectory {
  repeated CameraPosePreview poses = 1;
}

message DenseCloud {
  Float32Buffer positions = 1;
  optional ByteBuffer colors = 2;
  optional Float32Buffer confidence = 3;
  optional ByteBuffer classification = 4;
}

message DenseParams {
  DenseResolution resolution = 1;
  uint32 window_radius_px = 2;
  uint32 min_view_consistency = 3;
  float confidence_threshold = 4;
  uint32 max_points = 5;
}

enum DenseResolution {
  DENSE_RESOLUTION_LOW = 0;
  DENSE_RESOLUTION_MEDIUM = 1;
  DENSE_RESOLUTION_HIGH = 2;
}

enum FeatureDetector {
  FEATURE_DETECTOR_ORB = 0;
  FEATURE_DETECTOR_AKAZE = 1;
  FEATURE_DETECTOR_HARRIS = 2;
}

message FeatureParams {
  FeatureDetector detector = 1;
  uint32 target_count = 2;
  uint32 octaves = 3;
  float edge_threshold = 4;
}

message FrameRef {
  uint32 index = 1;
  double timestamp_ms = 2;
  string asset_id = 3;
}

message GcpObservation {
  string stream_id = 1;
  uint32 frame_index = 2;
  repeated float pixel = 3;
}

message GeoParams {
  bool enabled = 1;
  optional double origin_lon = 2;
  optional double origin_lat = 3;
  optional double origin_alt = 4;
  float gsd_m = 5;
  float dsm_cell_m = 6;
  float dtm_filter_radius_m = 7;
  uint32 ortho_max_px = 8;
}

message GeoProducts {
  optional string dsm_asset_id = 1;
  optional string dtm_asset_id = 2;
  optional string ortho_asset_id = 3;
}

message GroundControlPoint {
  string id = 1;
  string name = 2;
  repeated double world_position = 3;
  repeated GcpObservation observations = 4;
}

message IngestParams {
  uint32 frame_sample_stride = 1;
  uint32 max_frames = 2;
  uint32 downscale_long_edge_px = 3;
  float min_sharpness = 4;
}

message MatchParams {
  MatcherKind matcher = 1;
  float ratio_test = 2;
  bool cross_check = 3;
  uint32 sequential_window = 4;
  uint32 max_pairs_per_frame = 5;
  bool loop_closure = 6;
}

enum MatcherKind {
  MATCHER_KIND_BRUTE_FORCE = 0;
  MATCHER_KIND_KD_TREE = 1;
}

enum MediaKind {
  MEDIA_KIND_IMAGE_SEQUENCE = 0;
  MEDIA_KIND_VIDEO = 1;
}

message MediaStream {
  string id = 1;
  string name = 2;
  MediaKind kind = 3;
  optional string camera_id = 4;
  double sync_offset_ms = 5;
  double fps_hint = 6;
  repeated FrameRef frames = 7;
  optional VideoSource source = 8;
}

message MeshParams {
  float tsdf_voxel_size_mm = 1;
  float tsdf_truncation_mm = 2;
  uint32 decimate_target_triangles = 3;
  uint32 smoothing_iterations = 4;
  bool texture_enabled = 5;
  uint32 texture_size = 6;
  bool guarantee_watertight = 7;
  uint32 hole_fill_max_boundary_verts = 8;
  bool self_intersection_check = 9;
}

enum MeshSource {
  MESH_SOURCE_PLACEHOLDER = 0;
  MESH_SOURCE_RECONSTRUCTED = 1;
  MESH_SOURCE_IMPORTED = 2;
}

message MotionParams {
  bool enabled = 1;
  uint32 max_tracks = 2;
  uint32 track_window_px = 3;
  float min_track_quality = 4;
  uint32 min_track_length_frames = 5;
}

message MotionTrackSummary {
  string id = 1;
  uint32 length = 2;
  TrackClass class = 3;
  float mean_speed_m_s = 4;
}

message QcReportSnapshot {
  double reprojection_rms_px = 1;
  optional double gcp_checkpoint_rmse = 2;
  optional WatertightReportSnapshot watertight = 3;
  float mean_track_length = 4;
  float registered_frame_ratio = 5;
  float dense_coverage_ratio = 6;
  repeated string warnings = 7;
}

message RemodelingAssetChild {
  string child_id = 1;
  ArtifactRef target = 2;
}

message RemodelingMesh {
  RemodelingMeshChild mesh = 1;
  MeshSource source = 2;
  optional string texture_asset_id = 3;
  optional WatertightReportSnapshot watertight = 4;
}

message RemodelingMeshChild {
  string child_id = 1;
  ArtifactRef target = 2;
}

message RigExtrinsic {
  string camera_id = 1;
  repeated float rotation_wxyz = 2;
  repeated float translation_m = 3;
}

enum RobustLossKind {
  ROBUST_LOSS_KIND_L2 = 0;
  ROBUST_LOSS_KIND_HUBER = 1;
  ROBUST_LOSS_KIND_CAUCHY = 2;
}

message SfmParams {
  uint32 ransac_iterations = 1;
  float ransac_threshold_px = 2;
  uint32 min_track_length = 3;
  uint32 ba_max_iterations = 4;
  RobustLossKind robust_loss = 5;
  float huber_delta_px = 6;
}

message SparseCloud {
  Float32Buffer points = 1;
  optional ByteBuffer colors = 2;
}

enum TrackClass {
  TRACK_CLASS_STATIC = 0;
  TRACK_CLASS_MOVING = 1;
}

enum VideoCodec {
  VIDEO_CODEC_AVC = 0;
  VIDEO_CODEC_HEVC = 1;
  VIDEO_CODEC_VP9 = 2;
  VIDEO_CODEC_AV1 = 3;
  VIDEO_CODEC_MJPEG = 4;
  VIDEO_CODEC_UNKNOWN = 5;
}

message VideoSource {
  string name = 1;
  string container = 2;
  VideoCodec codec = 3;
  double duration_ms = 4;
  uint32 frame_count = 5;
  uint32 width = 6;
  uint32 height = 7;
}

message WatertightReportSnapshot {
  uint32 vertex_count = 1;
  uint32 triangle_count = 2;
  uint32 boundary_edge_count = 3;
  uint32 boundary_loop_count = 4;
  uint32 non_manifold_edge_count = 5;
  uint32 non_manifold_vertex_count = 6;
  uint32 connected_components = 7;
  bool consistently_oriented = 8;
  int64 euler_characteristic = 9;
  optional int64 genus = 10;
  double signed_volume = 11;
  optional uint32 self_intersection_pairs = 12;
  bool closed_fallback_used = 13;
  bool is_closed = 14;
  bool is_two_manifold = 15;
  bool is_watertight = 16;
}

message Float32Inline { repeated fixed32 sample_bits = 1; }
message Float32Content { string content_id = 1; uint64 chunk_count = 2; }
message Float32Buffer { oneof storage { Float32Inline inline = 1; Float32Content content = 2; } }
message ByteBuffer { bytes values = 1; }
