syntax = "proto3";
package semio.app.remodeling.remodeling;

message RemodelingWorldCamera {
  // @state config
  repeated double position = 1;
  // @state config
  repeated double target = 2;
  // @state config
  double fov = 3;
}

message RemodelingLayerVisibility {
  // @state config
  bool mesh = 6;
  // @state config
  bool dense = 7;
  // @state config
  bool sparse = 8;
  // @state config
  bool cameras = 9;
  // @state config
  bool gcps = 10;
}

message RemodelingFrameCursor {
  // @state config
  optional string stream_id = 11;
  // @state config
  uint32 frame_index = 12;
}

message RemodelingConfig {
  // @state config
  RemodelingWorldCamera camera = 1;
  // @state config
  RemodelingLayerVisibility layers = 3;
  // @state config
  RemodelingFrameCursor frame_cursor = 4;
  // @state config
  string report_table = 5;
  // @state config
  string active_utility_id = 6;
  // @state config
  string locale = 7;
}