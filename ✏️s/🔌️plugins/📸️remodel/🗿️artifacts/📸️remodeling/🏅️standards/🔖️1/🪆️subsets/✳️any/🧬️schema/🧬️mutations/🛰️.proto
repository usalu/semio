syntax = "proto3";
package semio.s.remodel.remodeling.mutation;

// 🧬️ Remodeling mutation vocabulary — one message per semantic kind.

message RemodelingMutation {
  oneof kind {
    CreateStream create_stream = 1;
    DeleteStream delete_stream = 2;
    ChangeStreamSync change_stream_sync = 3;
    AddStreamFrame add_stream_frame = 4;
    RemoveStreamFrame remove_stream_frame = 5;
    ReplaceStreamSource replace_stream_source = 6;
    CreateAsset create_asset = 7;
    DeleteAsset delete_asset = 8;
    CreateCameraCalibration create_camera_calibration = 9;
    UpdateCameraCalibration update_camera_calibration = 10;
    DeleteCameraCalibration delete_camera_calibration = 11;
    CreateRigExtrinsic create_rig_extrinsic = 12;
    DeleteRigExtrinsic delete_rig_extrinsic = 13;
    UpdateRigExtrinsic update_rig_extrinsic = 14;
    CreateGcp create_gcp = 15;
    DeleteGcp delete_gcp = 16;
    AddGcpObservation add_gcp_observation = 17;
    RemoveGcpObservation remove_gcp_observation = 18;
    UpdateIngestParams update_ingest_params = 19;
    UpdateFeatureParams update_feature_params = 20;
    UpdateMatchParams update_match_params = 21;
    UpdateSfmParams update_sfm_params = 22;
    UpdateDenseParams update_dense_params = 23;
    UpdateMeshParams update_mesh_params = 24;
    UpdateMotionParams update_motion_params = 25;
    UpdateGeoParams update_geo_params = 26;
    ReplaceJob replace_job = 27;
    ReplaceSparse replace_sparse = 28;
    ReplaceDense replace_dense = 29;
    ReplaceMeshResult replace_mesh_result = 30;
    ReplaceTrajectory replace_trajectory = 31;
    ReplaceTracks replace_tracks = 32;
    ReplaceGeoProducts replace_geo_products = 33;
    ReplaceQc replace_qc = 34;
    CommitReconstruction commit_reconstruction = 35;
  }
}

message CreateStream {
  string mutation = 1;
  MediaStream stream = 2;
}

message DeleteStream {
  string mutation = 1;
  string id = 2;
}

message ChangeStreamSync {
  string mutation = 1;
  string id = 2;
  double new_sync_offset_ms = 3;
}

message AddStreamFrame {
  string mutation = 1;
  string id = 2;
  FrameRef frame = 3;
  MediaKind kind = 4;
}

message RemoveStreamFrame {
  string mutation = 1;
  string id = 2;
  uint32 frame_index = 3;
}

message ReplaceStreamSource {
  string mutation = 1;
  string id = 2;
  optional VideoSource source = 3;
}

message CreateAsset {
  string mutation = 1;
  string key = 2;
  ImageAsset asset = 3;
}

message DeleteAsset {
  string mutation = 1;
  string key = 2;
}

message CreateCameraCalibration {
  string mutation = 1;
  CameraCalibration camera = 2;
}

message UpdateCameraCalibration {
  string mutation = 1;
  CameraCalibration camera = 2;
}

message DeleteCameraCalibration {
  string mutation = 1;
  string camera_id = 2;
}

message CreateRigExtrinsic {
  string mutation = 1;
  RigExtrinsic extrinsic = 2;
}

message DeleteRigExtrinsic {
  string mutation = 1;
  string camera_id = 2;
}

message UpdateRigExtrinsic {
  string mutation = 1;
  RigExtrinsic extrinsic = 2;
}

message CreateGcp {
  string mutation = 1;
  GroundControlPoint gcp = 2;
}

message DeleteGcp {
  string mutation = 1;
  string id = 2;
}

message AddGcpObservation {
  string mutation = 1;
  string id = 2;
  GcpObservation observation = 3;
}

message RemoveGcpObservation {
  string mutation = 1;
  string id = 2;
  uint32 observation_index = 3;
}

message UpdateIngestParams {
  string mutation = 1;
  IngestParams params = 2;
}

message UpdateFeatureParams {
  string mutation = 1;
  FeatureParams params = 2;
}

message UpdateMatchParams {
  string mutation = 1;
  MatchParams params = 2;
}

message UpdateSfmParams {
  string mutation = 1;
  SfmParams params = 2;
}

message UpdateDenseParams {
  string mutation = 1;
  DenseParams params = 2;
}

message UpdateMeshParams {
  string mutation = 1;
  MeshParams params = 2;
}

message UpdateMotionParams {
  string mutation = 1;
  MotionParams params = 2;
}

message UpdateGeoParams {
  string mutation = 1;
  GeoParams params = 2;
}

message ReplaceJob {
  string mutation = 1;
  ReconstructionJob job = 2;
}

message ReplaceSparse {
  string mutation = 1;
  optional SparseCloud sparse = 2;
}

message ReplaceDense {
  string mutation = 1;
  optional DenseCloud dense = 2;
}

message ReplaceMeshResult {
  string mutation = 1;
  RemodelingMesh mesh = 2;
}

message ReplaceTrajectory {
  string mutation = 1;
  optional CameraTrajectory trajectory = 2;
}

message ReplaceTracks {
  string mutation = 1;
  repeated MotionTrackSummary tracks = 2;
}

message ReplaceGeoProducts {
  string mutation = 1;
  optional GeoProducts geo = 2;
}

message ReplaceQc {
  string mutation = 1;
  optional QcReportSnapshot qc = 2;
}

message CommitReconstruction {
  string mutation = 1;
  ReconstructionJob job = 2;
  optional SparseCloud sparse = 3;
  optional CameraTrajectory trajectory = 4;
  optional RemodelingMesh mesh = 5;
  optional GeoProducts geo = 6;
  optional QcReportSnapshot qc = 7;
  repeated ReconstructionAssetCommit assets = 8;
}

message ArtifactDialect {
  string artifact_kind = 1;
  string standard = 2;
  string subset = 3;
}

message ArtifactRef {
  string artifact_id = 1;
  ArtifactDialect dialect = 2;
}

message CameraCalibration {
  string id = 1;
  string label = 2;
  string model = 3;
  double fx = 4;
  double fy = 5;
  double cx = 6;
  double cy = 7;
  double skew = 8;
  repeated float distortion = 9;
  optional float rms_reprojection_px = 10;
  bool locked = 11;
}

message CameraPosePreview {
  string camera_id = 1;
  repeated float rotation_wxyz = 2;
  repeated float translation = 3;
}

message CameraTrajectory {
  repeated CameraPosePreview poses = 1;
}

message DenseCloud {
  string positions = 1;
  optional string colors = 2;
  optional string confidence = 3;
  optional string classification = 4;
}

message DenseParams {
  DenseResolution resolution = 1;
  uint32 window_radius_px = 2;
  uint32 min_view_consistency = 3;
  float confidence_threshold = 4;
  uint32 max_points = 5;
}

enum DenseResolution {
  DENSE_RESOLUTION_LOW = 0;
  DENSE_RESOLUTION_MEDIUM = 1;
  DENSE_RESOLUTION_HIGH = 2;
}

enum FeatureDetector {
  FEATURE_DETECTOR_ORB = 0;
  FEATURE_DETECTOR_AKAZE = 1;
  FEATURE_DETECTOR_HARRIS = 2;
}

message FeatureParams {
  FeatureDetector detector = 1;
  uint32 target_count = 2;
  uint32 octaves = 3;
  float edge_threshold = 4;
}

message FrameRef {
  uint32 index = 1;
  double timestamp_ms = 2;
  string asset_id = 3;
}

message GcpObservation {
  string stream_id = 1;
  uint32 frame_index = 2;
  repeated float pixel = 3;
}

message GeoParams {
  bool enabled = 1;
  optional double origin_lon = 2;
  optional double origin_lat = 3;
  optional double origin_alt = 4;
  float gsd_m = 5;
  float dsm_cell_m = 6;
  float dtm_filter_radius_m = 7;
  uint32 ortho_max_px = 8;
}

message GeoProducts {
  optional string dsm_asset_id = 1;
  optional string dtm_asset_id = 2;
  optional string ortho_asset_id = 3;
}

message GroundControlPoint {
  string id = 1;
  string name = 2;
  repeated double world_position = 3;
  repeated GcpObservation observations = 4;
}

message ImageAsset {
  string mime = 1;
  string data = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message IngestParams {
  uint32 frame_sample_stride = 1;
  uint32 max_frames = 2;
  uint32 downscale_long_edge_px = 3;
  float min_sharpness = 4;
}

message MatchParams {
  MatcherKind matcher = 1;
  float ratio_test = 2;
  bool cross_check = 3;
  uint32 sequential_window = 4;
  uint32 max_pairs_per_frame = 5;
  bool loop_closure = 6;
}

enum MatcherKind {
  MATCHER_KIND_BRUTE_FORCE = 0;
  MATCHER_KIND_KD_TREE = 1;
}

enum MediaKind {
  MEDIA_KIND_IMAGE_SEQUENCE = 0;
  MEDIA_KIND_VIDEO = 1;
}

message MediaStream {
  string id = 1;
  string name = 2;
  MediaKind kind = 3;
  optional string camera_id = 4;
  double sync_offset_ms = 5;
  double fps_hint = 6;
  repeated FrameRef frames = 7;
  optional VideoSource source = 8;
}

message MeshParams {
  float tsdf_voxel_size_mm = 1;
  float tsdf_truncation_mm = 2;
  uint32 decimate_target_triangles = 3;
  uint32 smoothing_iterations = 4;
  bool texture_enabled = 5;
  uint32 texture_size = 6;
  bool guarantee_watertight = 7;
  uint32 hole_fill_max_boundary_verts = 8;
  bool self_intersection_check = 9;
}

enum MeshSource {
  MESH_SOURCE_PLACEHOLDER = 0;
  MESH_SOURCE_RECONSTRUCTED = 1;
  MESH_SOURCE_IMPORTED = 2;
}

message MotionParams {
  bool enabled = 1;
  uint32 max_tracks = 2;
  uint32 track_window_px = 3;
  float min_track_quality = 4;
  uint32 min_track_length_frames = 5;
}

message MotionTrackSummary {
  string id = 1;
  uint32 length = 2;
  TrackClass class = 3;
  float mean_speed_m_s = 4;
}

message QcReportSnapshot {
  double reprojection_rms_px = 1;
  optional double gcp_checkpoint_rmse = 2;
  optional WatertightReportSnapshot watertight = 3;
  float mean_track_length = 4;
  float registered_frame_ratio = 5;
  float dense_coverage_ratio = 6;
  repeated string warnings = 7;
}

message ReconstructionAssetCommit {
  string id = 1;
  ImageAsset asset = 2;
}

message ReconstructionJob {
  string id = 1;
  ReconstructionStage stage = 2;
  float progress_0_1 = 3;
  bool cancel_requested = 4;
  uint32 stage_cursor = 5;
  optional double started_at_ms = 6;
  optional string error = 7;
  repeated CameraPosePreview camera_poses_preview = 8;
  string sparse_point_cloud_preview = 9;
}

enum ReconstructionStage {
  RECONSTRUCTION_STAGE_IDLE = 0;
  RECONSTRUCTION_STAGE_INGESTING = 1;
  RECONSTRUCTION_STAGE_CALIBRATING = 2;
  RECONSTRUCTION_STAGE_EXTRACTING_FEATURES = 3;
  RECONSTRUCTION_STAGE_MATCHING_FEATURES = 4;
  RECONSTRUCTION_STAGE_ESTIMATING_POSES = 5;
  RECONSTRUCTION_STAGE_BUNDLE_ADJUSTING = 6;
  RECONSTRUCTION_STAGE_GEOREFERENCING = 7;
  RECONSTRUCTION_STAGE_DENSE_STEREO = 8;
  RECONSTRUCTION_STAGE_FUSING_VOLUME = 9;
  RECONSTRUCTION_STAGE_EXTRACTING_SURFACE = 10;
  RECONSTRUCTION_STAGE_CLEANING_MESH = 11;
  RECONSTRUCTION_STAGE_TEXTURING = 12;
  RECONSTRUCTION_STAGE_TRACKING_MOTION = 13;
  RECONSTRUCTION_STAGE_DERIVING_GEO_PRODUCTS = 14;
  RECONSTRUCTION_STAGE_REPORTING_QC = 15;
  RECONSTRUCTION_STAGE_DONE = 16;
  RECONSTRUCTION_STAGE_FAILED = 17;
}

message RemodelingMesh {
  RemodelingMeshChild mesh = 1;
  MeshSource source = 2;
  optional string texture_asset_id = 3;
  optional WatertightReportSnapshot watertight = 4;
}

message RemodelingMeshChild {
  string child_id = 1;
  ArtifactRef target = 2;
}

message RigExtrinsic {
  string camera_id = 1;
  repeated float rotation_wxyz = 2;
  repeated float translation_m = 3;
}

enum RobustLossKind {
  ROBUST_LOSS_KIND_L2 = 0;
  ROBUST_LOSS_KIND_HUBER = 1;
  ROBUST_LOSS_KIND_CAUCHY = 2;
}

message SfmParams {
  uint32 ransac_iterations = 1;
  float ransac_threshold_px = 2;
  uint32 min_track_length = 3;
  uint32 ba_max_iterations = 4;
  RobustLossKind robust_loss = 5;
  float huber_delta_px = 6;
}

message SparseCloud {
  string points = 1;
  optional string colors = 2;
}

enum TrackClass {
  TRACK_CLASS_STATIC = 0;
  TRACK_CLASS_MOVING = 1;
}

enum VideoCodec {
  VIDEO_CODEC_AVC = 0;
  VIDEO_CODEC_HEVC = 1;
  VIDEO_CODEC_VP9 = 2;
  VIDEO_CODEC_AV1 = 3;
  VIDEO_CODEC_MJPEG = 4;
  VIDEO_CODEC_UNKNOWN = 5;
}

message VideoSource {
  string name = 1;
  string container = 2;
  VideoCodec codec = 3;
  double duration_ms = 4;
  uint32 frame_count = 5;
  uint32 width = 6;
  uint32 height = 7;
}

message WatertightReportSnapshot {
  uint32 vertex_count = 1;
  uint32 triangle_count = 2;
  uint32 boundary_edge_count = 3;
  uint32 boundary_loop_count = 4;
  uint32 non_manifold_edge_count = 5;
  uint32 non_manifold_vertex_count = 6;
  uint32 connected_components = 7;
  bool consistently_oriented = 8;
  int64 euler_characteristic = 9;
  optional int64 genus = 10;
  double signed_volume = 11;
  optional uint32 self_intersection_pairs = 12;
  bool closed_fallback_used = 13;
  bool is_closed = 14;
  bool is_two_manifold = 15;
  bool is_watertight = 16;
}
