[package]
workspace = "../../../../../../../../.."
name = "semio-s-artifact-remodel-remodeling-video"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "remodeling engine video: container admission, providers and frame extraction."

[package.metadata.semio]
role = "library"

[lints]
workspace = true

[lib]
path = "🦀️.rs"

[features]
default = ["video-containers"]
# 🧩️ Capability Features
video-containers = ["video-avi","video-mp4"]
video-avi = ["dep:semio-s-artifact-stdio-avi"]
video-mp4 = ["dep:semio-s-artifact-stdio-mp4"]
# /🧩️ Capability Features

[dependencies]
semio-framework-pack-json = { workspace = true }
semio-framework-value = { workspace = true }
semio-s-artifact-remodel-remodeling-images = { workspace = true }
semio-s-artifact-remodel-remodeling-video-h264 = { workspace = true }
# 🧩️ Capability Dependencies
semio-s-artifact-stdio-avi = { workspace = true, optional = true }
semio-s-artifact-stdio-mp4 = { workspace = true, optional = true }
# /🧩️ Capability Dependencies
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
