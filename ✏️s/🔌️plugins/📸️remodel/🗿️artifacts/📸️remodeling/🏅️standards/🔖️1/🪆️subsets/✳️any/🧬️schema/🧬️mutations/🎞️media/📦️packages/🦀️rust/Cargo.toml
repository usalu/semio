semio-framework-value-derive = { workspace = true }
semio-s-artifact-remodel-remodeling-model = { workspace = true }
semio-s-artifact-remodel-remodeling-model-diff = { workspace = true }
semio-s-artifact-remodel-remodeling-mut-results = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
semio-framework-async-macros = { workspace = true }
semio-framework-diagnostic = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
semio-s-artifact-remodel-remodeling-mutations = { workspace = true }
semio-s-artifact-remodel-remodeling-mut-vectors = { workspace = true }

[[test]]
name = "assets"
path = "🧪️tests/🔬️assets/🦀️.rs"

[[test]]
