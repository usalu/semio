[package]
workspace = "../../../../../../../../.."
name = "semio-s-artifact-remodel-remodeling-mut-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "remodeling media mutations: stream, asset and durable content leaves."

[package.metadata.semio]
