[package]
workspace = "../../../../../../../.."
name = "semio-s-artifact-remodel-remodeling-mutations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "remodeling mutation vocabulary: the dispatch enum, its apply boundary, text and binary codecs and format leaves."

[package.metadata.semio]
role = "library"

