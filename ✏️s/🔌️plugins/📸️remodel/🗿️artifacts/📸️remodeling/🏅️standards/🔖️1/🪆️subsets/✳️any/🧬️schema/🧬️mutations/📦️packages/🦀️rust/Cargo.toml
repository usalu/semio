semio-framework-pack-json = { workspace = true }
semio-framework-schema-registry = { workspace = true }
semio-framework-value = { workspace = true }
semio-framework-value-derive = { workspace = true }
semio-s-artifact-remodel-remodeling-model = { workspace = true }
semio-s-artifact-remodel-remodeling-model-diff = { workspace = true }
semio-s-artifact-remodel-remodeling-mut-calib = { workspace = true }
semio-s-artifact-remodel-remodeling-mut-media = { workspace = true }
semio-s-artifact-remodel-remodeling-mut-params = { workspace = true }
semio-s-artifact-remodel-remodeling-mut-results = { workspace = true }

[dev-dependencies]
base64_codec = { workspace = true }
semio-framework = { workspace = true }
semio-framework-async-macros = { workspace = true }
semio-framework-os-kernel = { workspace = true, features = ["protocol-laws", "mutation-testing"] }
