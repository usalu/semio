# 🔺️ Remodeling diff schema — sparse keyed rows per id-keyed collection, ordered content rows, per-facet params and per-slot results.

type RemodelingDiff {
  schema: String @state(class: ARTIFACT)
  id: String @state(class: ARTIFACT)
  streams: RemodelingStreamsDelta @state(class: ARTIFACT)
  assets: RemodelingAssetsDelta @state(class: ARTIFACT)
  durableArtifacts: RemodelingContentDelta @state(class: ARTIFACT)
  calibration: RemodelingCalibrationDelta @state(class: ARTIFACT)
  params: RemodelingParamsDiff @state(class: ARTIFACT)
  gcps: RemodelingGcpsDelta @state(class: ARTIFACT)
  results: RemodelingResultsDiff @state(class: ARTIFACT)
}

enum RemodelingRowKind { INSERT REPLACE REMOVE PATCH }

type RemodelingStreamRow { row: RemodelingRowKind! entity: MediaStream key: String patch: MediaStreamPatch }
type RemodelingGcpRow { row: RemodelingRowKind! entity: GroundControlPoint key: String patch: GroundControlPointPatch }
type RemodelingCameraRow { row: RemodelingRowKind! entity: CameraCalibration key: String }
type RemodelingRigRow { row: RemodelingRowKind! entity: RigExtrinsic key: String }
type RemodelingAssetRow { row: RemodelingRowKind! entity: RemodelingAssetEntry key: String }
type RemodelingStreamsDelta { rows: [RemodelingStreamRow!]! }
type RemodelingGcpsDelta { rows: [RemodelingGcpRow!]! }
type RemodelingCamerasDelta { rows: [RemodelingCameraRow!]! }
type RemodelingRigDelta { rows: [RemodelingRigRow!]! }
type RemodelingAssetsDelta { rows: [RemodelingAssetRow!]! }
type RemodelingAssetEntry { key: String! child: RemodelingAssetChild! }
type RemodelingCalibrationDelta { cameras: RemodelingCamerasDelta! rig: RemodelingRigDelta! }

type FrameRefMembers { removed: [FrameRef!]! added: [FrameRef!]! }
type GcpObservationMembers { removed: [GcpObservation!]! added: [GcpObservation!]! }
type RemodelingAssignedVideoSource { value: VideoSource }
type MediaStreamPatch { syncOffsetMs: Float source: RemodelingAssignedVideoSource frames: FrameRefMembers }
type GroundControlPointPatch { observations: GcpObservationMembers }

enum RemodelingContentRowKind { APPEND TRUNCATE }
type RemodelingContentHeader { kind: String! mime: String width: Int! height: Int! }
type RemodelingContentRow { row: RemodelingContentRowKind! id: String! header: RemodelingContentHeader chunks: [Octets!] from: UInt64 }
type RemodelingContentDelta { rows: [RemodelingContentRow!]! }

type RemodelingParamsDiff {
  ingest: IngestParams
  feature: FeatureParams
  matching: MatchParams
  sfm: SfmParams
  dense: DenseParams
  mesh: MeshParams
  motion: MotionParams
  geo: GeoParams
}

type RemodelingAssignedSparseCloud { value: SparseCloud }
type RemodelingAssignedDenseCloud { value: DenseCloud }
type RemodelingAssignedCameraTrajectory { value: CameraTrajectory }
type RemodelingAssignedGeoProducts { value: GeoProducts }
type RemodelingAssignedQcReport { value: QcReportSnapshot }
type RemodelingResultsDiff {
  sparse: RemodelingAssignedSparseCloud
  dense: RemodelingAssignedDenseCloud
  mesh: RemodelingMesh
  trajectory: RemodelingAssignedCameraTrajectory
  tracks: [MotionTrackSummary!]
  geo: RemodelingAssignedGeoProducts
  qc: RemodelingAssignedQcReport
}

type ArtifactDialect {
  artifactKind: String!
  standard: String!
  subset: String!
}

type ArtifactRef {
  artifactId: String!
  dialect: ArtifactDialect!
}

type CameraCalibration {
  id: String!
  label: String!
  model: String!
  fx: Float!
  fy: Float!
  cx: Float!
  cy: Float!
  skew: Float!
  distortion: [Float!]!
  rmsReprojectionPx: Float
  locked: Boolean!
}

type CameraPosePreview {
  cameraId: String!
  rotationWxyz: [Float!]!
  translation: [Float!]!
}

type CameraTrajectory {
  poses: [CameraPosePreview!]!
}

type DenseCloud {
  positions: Float32Buffer!
  colors: Octets
  confidence: Float32Buffer
  classification: Octets
}

type DenseParams {
  resolution: DenseResolution!
  windowRadiusPx: Int!
  minViewConsistency: Int!
  confidenceThreshold: Float!
  maxPoints: Int!
}

enum DenseResolution {
  Low
  Medium
  High
}

enum FeatureDetector {
  Orb
  Akaze
  Harris
}

type FeatureParams {
  detector: FeatureDetector!
  targetCount: Int!
  octaves: Int!
  edgeThreshold: Float!
}

type FrameRef {
  index: Int!
  timestampMs: Float!
  assetId: String!
}

type GcpObservation {
  streamId: String!
  frameIndex: Int!
  pixel: [Float!]!
}

type GeoParams {
  enabled: Boolean!
  originLon: Float
  originLat: Float
  originAlt: Float
  gsdM: Float!
  dsmCellM: Float!
  dtmFilterRadiusM: Float!
  orthoMaxPx: Int!
}

type GeoProducts {
  dsmAssetId: String
  dtmAssetId: String
  orthoAssetId: String
}

type GroundControlPoint {
  id: String!
  name: String!
  worldPosition: [Float!]!
  observations: [GcpObservation!]!
}

type IngestParams {
  frameSampleStride: Int!
  maxFrames: Int!
  downscaleLongEdgePx: Int!
  minSharpness: Float!
}

type MatchParams {
  matcher: MatcherKind!
  ratioTest: Float!
  crossCheck: Boolean!
  sequentialWindow: Int!
  maxPairsPerFrame: Int!
  loopClosure: Boolean!
}

enum MatcherKind {
  BruteForce
  KdTree
}

enum MediaKind {
  ImageSequence
  Video
}

type MediaStream {
  id: String!
  name: String!
  kind: MediaKind!
  cameraId: String
  syncOffsetMs: Float!
  fpsHint: Float!
  frames: [FrameRef!]!
  source: VideoSource
}

type MeshParams {
  tsdfVoxelSizeMm: Float!
  tsdfTruncationMm: Float!
  decimateTargetTriangles: Int!
  smoothingIterations: Int!
  textureEnabled: Boolean!
  textureSize: Int!
  guaranteeWatertight: Boolean!
  holeFillMaxBoundaryVerts: Int!
  selfIntersectionCheck: Boolean!
}

enum MeshSource {
  Placeholder
  Reconstructed
  Imported
}

type MotionParams {
  enabled: Boolean!
  maxTracks: Int!
  trackWindowPx: Int!
  minTrackQuality: Float!
  minTrackLengthFrames: Int!
}

type MotionTrackSummary {
  id: String!
  length: Int!
  class: TrackClass!
  meanSpeedMS: Float!
}

type QcReportSnapshot {
  reprojectionRmsPx: Float!
  gcpCheckpointRmse: Float
  watertight: WatertightReportSnapshot
  meanTrackLength: Float!
  registeredFrameRatio: Float!
  denseCoverageRatio: Float!
  warnings: [String!]!
}

type RemodelingAssetChild {
  childId: String!
  target: ArtifactRef!
}

type RemodelingMesh {
  mesh: RemodelingMeshChild!
  source: MeshSource!
  textureAssetId: String
  watertight: WatertightReportSnapshot
}

type RemodelingMeshChild {
  childId: String!
  target: ArtifactRef!
}

type RigExtrinsic {
  cameraId: String!
  rotationWxyz: [Float!]!
  translationM: [Float!]!
}

enum RobustLossKind {
  L2
  Huber
  Cauchy
}

type SfmParams {
  ransacIterations: Int!
  ransacThresholdPx: Float!
  minTrackLength: Int!
  baMaxIterations: Int!
  robustLoss: RobustLossKind!
  huberDeltaPx: Float!
}

type SparseCloud {
  points: Float32Buffer!
  colors: Octets
}

enum TrackClass {
  Static
  Moving
}

enum VideoCodec {
  Avc
  Hevc
  Vp9
  Av1
  Mjpeg
  Unknown
}

type VideoSource {
  name: String!
  container: String!
  codec: VideoCodec!
  durationMs: Float!
  frameCount: Int!
  width: Int!
  height: Int!
}

type WatertightReportSnapshot {
  vertexCount: Int!
  triangleCount: Int!
  boundaryEdgeCount: Int!
  boundaryLoopCount: Int!
  nonManifoldEdgeCount: Int!
  nonManifoldVertexCount: Int!
  connectedComponents: Int!
  consistentlyOriented: Boolean!
  eulerCharacteristic: Int!
  genus: Int
  signedVolume: Float!
  selfIntersectionPairs: Int
  closedFallbackUsed: Boolean!
  isClosed: Boolean!
  isTwoManifold: Boolean!
  isWatertight: Boolean!
}

scalar Binary32
scalar UInt64
scalar Octets

union Float32Buffer = Float32Inline | Float32Content
type Float32Inline { values: [Binary32!]! }
type Float32Content { contentId: String! chunkCount: UInt64! }
