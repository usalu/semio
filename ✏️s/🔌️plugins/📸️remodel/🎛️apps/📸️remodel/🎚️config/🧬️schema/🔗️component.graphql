type RemodelWorldCamera {
  position: [Float!]! @state(class: LOCAL_UI)
  target: [Float!]! @state(class: LOCAL_UI)
  fov: Float! @state(class: LOCAL_UI)
}

type RemodelSelection {
  mode: String! @state(class: LOCAL_UI)
  ids: [String!]! @state(class: LOCAL_UI)
}

type RemodelLayerVisibility {
  mesh: Boolean! @state(class: LOCAL_UI)
  dense: Boolean! @state(class: LOCAL_UI)
  sparse: Boolean! @state(class: LOCAL_UI)
  cameras: Boolean! @state(class: LOCAL_UI)
  gcps: Boolean! @state(class: LOCAL_UI)
}

type RemodelFrameCursor {
  streamId: String @state(class: LOCAL_UI)
  frameIndex: Int! @state(class: LOCAL_UI)
}

type RemodelConfig {
  camera: RemodelWorldCamera! @state(class: LOCAL_UI)
  selection: RemodelSelection! @state(class: LOCAL_UI)
  layers: RemodelLayerVisibility! @state(class: LOCAL_UI)
  frameCursor: RemodelFrameCursor! @state(class: LOCAL_UI)
  reportTable: String! @state(class: LOCAL_UI)
  activeUtilityId: String! @state(class: LOCAL_UI)
  locale: String! @state(class: LOCAL_UI)
}
