[package]
name = "semio-s-plugin-sourcing-beams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sourcing beams module — contributes the beams typology and demo catalogue kinds"

[lints]
workspace = true

[package.metadata.component]
package = "semio:sourcing-module-beams"

[package.metadata.semio]
role = "extension"
extends = "sourcing"
contributes = ["sourcing.module"]

[package.metadata.wasm-pack.profile.dev]
