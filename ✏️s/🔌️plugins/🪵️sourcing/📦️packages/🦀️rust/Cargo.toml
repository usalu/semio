[package]
name = "semio-s-plugin-sourcing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sourcing plugin - one crate for the curate artifact (diff/op/dsl/pack/spr/engine) and the curate app (commands/modes/windows)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:sourcing"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "sourcing"
app = "sourcing-curate"
aliases = ["curate"]
ports = { react = 6081, wgpu = 6181 }

# 🎪️ The `aussuchen` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT).

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../📦️lib.rs"

[dependencies]
dsl = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🗣️dsl/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-dsl" }
store = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-store" }
protocol = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/📡️protocol/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-protocol" }
pack = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🎒️pack/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-pack" }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/⚡️implementations/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

# 🧪️ TEMPORARY VERIFICATION OVERLAY — delete this whole `[workspace]` table (and the nested
# `target/`/`Cargo.lock` it creates) at registrar handoff. The new crate is not yet a workspace
# member of root Cargo.toml (only the registrar adds it), and Cargo refuses to build a manifest
# that sits inside an existing workspace without being one of its members — so this overlay makes
# the crate its own temporary workspace root for `cargo check/clippy/test --manifest-path …`.
# Copied verbatim from root Cargo.toml so artifact fingerprints match and `target/` stays warm.
[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1
