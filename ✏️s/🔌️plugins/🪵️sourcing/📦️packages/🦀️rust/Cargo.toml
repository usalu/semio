[package]
name = "semio-s-plugin-sourcing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sourcing plugin - one crate for the curate artifact (diff/op/dsl/pack/spr/engine) and the curate app (commands/modes/windows)"

[lints]
workspace = true

[package.metadata.component]
package = "semio:sourcing"

[package.metadata.semio]
role = "plugin"

[[package.metadata.semio.playground]]
variant = "sourcing"
app = "s.sourcing.curate@1/*#editor"
aliases = ["curate"]
ports = { react = 6081, wgpu = 6181 }

# 🎪️ The `aussuchen` demonstrator row moved to
# ✏️s/🔌️plugins/🎪️demonstrator/🛂️manifest/🗿️artifact/⚡️implementations/🦀️rust/Cargo.toml — see that
# crate's docstring (REDUCE-DEMONSTRATOR-IDLE-MEMORY-FOOTPRINT).

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "🦀️.rs"

[features]
# 🔌️ The WASM component entry point (`plugin_exports!` → `#[no_mangle]`
# `semio_plugin_install_bundle`). Default-on so this plugin builds as its own component, and
# switched OFF by any crate that EMBEDS it (the 🎪️demonstrator bundles all six panes into one
# component): seven crates each exporting the same `#[no_mangle]` symbol is a duplicate-symbol
# link error, and the embedding crate is the one that must own the entry point.
default = ["plugin-entry"]
plugin-entry = []

[dependencies]
semio-s-plugin-stdio = { path = "../../../🗄️stdio/📦️packages/🦀️rust", package = "semio-s-plugin-stdio", default-features = false }
semio-framework-os-kernel = { path = "../../../../../🧰️framework/🛍️products/💻️os/📦️packages/🦀️rust", package = "semio-framework-os-kernel" }
semio-framework = { path = "../../../../../🧰️framework/📦️packages/🦀️rust", package = "semio-framework" }
semio-framework-job = { workspace = true }
semio-framework-plugin = { path = "../../../../../🧰️framework/🛍️products/💻️os/🔨️modules/🔌️plugin/📦️packages/🦀️rust", features = ["component-guest"], package = "semio-framework-plugin" }
semio-framework-schema = { path = "../../../../../🧰️framework/🔨️modules/🧬️schema/📦️packages/🦀️rust", package = "semio-framework-schema" }
# 🎬️ `MeshWindowKit::render` packs its `World3dScene` into the surface's opaque `UiFixedBytes`, so the
# window tests decode the scene back rather than string-matching the built node (see 🎪️demonstrator).
semio-framework-ui-scene = { path = "../../../../../🧰️framework/🔨️modules/🖱️ui/🎬️scene/📦️packages/🦀️rust" }
semio-framework-dispatch-macros = { path = "../../../../../🧰️framework/🔨️modules/🔀️dispatch/📦️packages/🦀️rust", package = "semio-framework-dispatch-macros" }
semio-framework-value-derive = { path = "../../../../../🧰️framework/🔨️modules/🌱️value/✨️derive/📦️packages/🦀️rust", package = "semio-framework-value-derive" }

[dev-dependencies]
# 🔬️ Every schema type now has its own first-party `ToValue`/`FromValue` codec (ticket 26/09/01/
# RUNTIME-DEPENDENCY-ELIMINATION-FOR-S-PLUGINS-AND-ARTIFACTS) — `serde`'s `Serialize`/`Deserialize`
# survive only `#[cfg(test)]`/`#[cfg_attr(test, …)]`-gated as differential oracles, never a
# production dependency of this crate.
serde.workspace = true
serde_json.workspace = true
semio-framework-async-macros = { path = "../../../../../🧰️framework/🔨️modules/⏳️async/✨️macros/📦️packages/🦀️rust" }
