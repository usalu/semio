# 🧬️ Curation diff schema — sparse field delta.

enum SortDirection {
  ASC
  DESC
}

type TableSort {
  columnId: String!
  direction: SortDirection!
}

type Filters {
  query: String!
  moduleIds: [String!]!
  typologyPath: [String!]!
  minAvailability: Int!
  sort: TableSort
}

union GeometryRecipe =
  | GeometryRecipeBox
  | GeometryRecipeFrame
  | GeometryRecipeSlab
  | GeometryRecipeMesh

type GeometryRecipeBox {
  kind: String!
  width: Float!
  height: Float!
  depth: Float!
}

type GeometryRecipeFrame {
  kind: String!
  width: Float!
  height: Float!
  depth: Float!
  profile: Float!
}

type GeometryRecipeSlab {
  kind: String!
  width: Float!
  depth: Float!
  thickness: Float!
}

type GeometryRecipeMesh {
  kind: String!
  positions: [Float!]!
  normals: [Float!]!
  indices: [Int!]!
}

type ObjectKind {
  id: String!
  name: String!
  moduleId: String!
  typologyPath: [String!]!
  availability: Int!
  geometry: GeometryRecipe!
}

type CuratedItem {
  objectId: String!
  count: Int!
}

type CurationStringList {
  values: [String!]!
}

type ObjectKindExtra {
  id: String!
  name: String!
  moduleId: String!
  typologyPath: [String!]!
  availability: Int!
  geometry: GeometryRecipe!
}

type CurationObjectKindExtraPatchEntry {
  id: String!
  extra: ObjectKindExtra!
}

type CurationStockExtraDelta {
  added: [ObjectKindExtra!]
  removed: [String!]
  patched: [CurationObjectKindExtraPatchEntry!]
  reordered: [String!]
}

type CurationCuratedPatchEntry {
  objectId: String!
  count: Int
}

type CurationCuratedDelta {
  added: [CuratedItem!]
  removed: [String!]
  patched: [CurationCuratedPatchEntry!]
  reordered: [String!]
}

type CurationDiff {
  artifact: CurationArtifact @state(class: ARTIFACT)
  catalog: ArtifactLink @state(class: ARTIFACT) @child(kind: "s.stdio.semio.kit")
  stockExtra: CurationStockExtraDelta @state(class: ARTIFACT)
  curated: CurationCuratedDelta @state(class: ARTIFACT)
  filters: Filters @state(class: CONFIG)
  locale: String @state(class: CONFIG)
  contributionsJson: String @state(class: CONFIG)
}
