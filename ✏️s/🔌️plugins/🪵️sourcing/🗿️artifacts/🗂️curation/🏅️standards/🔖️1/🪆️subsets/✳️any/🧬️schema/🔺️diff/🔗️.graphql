# import ArtifactChild from "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🔗️.graphql"
# 🧬️ Curation diff schema — sparse field delta.

# import ObjectKindExtra, CuratedItem from "✏️s/🔌️plugins/🪵️sourcing/🗿️artifacts/🗂️curation/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🔗️.graphql"

type CurationObjectKindExtraPatchEntry {
  extra: ObjectKindExtra!
}

type CurationStockExtraDelta {
  removed: [CurationStockExtraRemoval!]
  inserted: [CurationStockExtraInsertion!]
  moved: [CurationStockExtraRelocation!]
  modified: [CurationStockExtraModification!]
}

type CurationStockExtraModification {
  id: String!
  patch: CurationObjectKindExtraPatchEntry!
}

type CurationStockExtraRemoval {
  id: String!
  index: Int!
}

type CurationStockExtraInsertion {
  index: Int!
  row: ObjectKindExtra!
}

type CurationStockExtraRelocation {
  id: String!
  from: Int!
  to: Int!
}

type CurationCuratedPatchEntry {
  count: Int
}

type CurationCuratedDelta {
  removed: [CurationCuratedRemoval!]
  inserted: [CurationCuratedInsertion!]
  moved: [CurationCuratedRelocation!]
  modified: [CurationCuratedModification!]
}

type CurationCuratedModification {
  id: String!
  patch: CurationCuratedPatchEntry!
}

type CurationCuratedRemoval {
  id: String!
  index: Int!
}

type CurationCuratedInsertion {
  index: Int!
  row: CuratedItem!
}

type CurationCuratedRelocation {
  id: String!
  from: Int!
  to: Int!
}

type CurationDiff {
  catalog: ArtifactChild @state(class: ARTIFACT) @child(kind: "s.stdio.semio")
  stockExtra: CurationStockExtraDelta @state(class: ARTIFACT)
  curated: CurationCuratedDelta @state(class: ARTIFACT)
}
