syntax = "proto3";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
package semio.s.sourcing.curation.diff;
import "✏️s/🔌️plugins/🪵️sourcing/🗿️artifacts/🗂️curation/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

// 🧬️ Curation diff schema — sparse field delta.

message CurationStringList { repeated string values = 1; }

message CurationObjectKindExtraPatchEntry {
  string id = 1;
  semio.s.sourcing.curation.artifact.ObjectKindExtra extra = 2;
}

message CurationStockExtraDelta {
  repeated semio.s.sourcing.curation.artifact.ObjectKindExtra added = 1;
  repeated string removed = 2;
  repeated CurationObjectKindExtraPatchEntry patched = 3;
  optional CurationStringList reordered = 4;
}

message CurationCuratedPatchEntry {
  string object_id = 1;
  optional uint32 count = 2;
}

message CurationCuratedDelta {
  repeated semio.s.sourcing.curation.artifact.CuratedItem added = 1;
  repeated string removed = 2;
  repeated CurationCuratedPatchEntry patched = 3;
  optional CurationStringList reordered = 4;
}

message CurationDiff {
  // @state artifact
  optional semio.s.sourcing.curation.artifact.CurationArtifact artifact = 1;
  // @state artifact @child kind=s.stdio.semio
  optional semio.os.store.ArtifactChild catalog = 2;
  // @state artifact
  optional CurationStockExtraDelta stock_extra = 3;
  // @state artifact
  optional CurationCuratedDelta curated = 4;
}
