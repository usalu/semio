syntax = "proto3";
import "🧰️framework/🛍️products/💻️os/🔨️modules/🏪️store/🪆️child/🧬️schema/🛰️.proto";
package semio.s.sourcing.curation.diff;
import "✏️s/🔌️plugins/🪵️sourcing/🗿️artifacts/🗂️curation/🏅️standards/🔖️1/🪆️subsets/✳️any/🧬️schema/🛰️.proto";

// 🧬️ Curation diff schema — sparse field delta.

message CurationStringList { repeated string values = 1; }

message CurationObjectKindExtraPatchEntry {
  semio.s.sourcing.curation.artifact.ObjectKindExtra extra = 1;
}

message CurationStockExtraRemoval {
  string id = 1;
  uint32 index = 2;
}
message CurationStockExtraInsertion {
  uint32 index = 1;
  semio.s.sourcing.curation.artifact.ObjectKindExtra row = 2;
}
message CurationStockExtraRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message CurationStockExtraDelta {
  repeated CurationStockExtraRemoval removed = 1;
  repeated CurationStockExtraInsertion inserted = 2;
  repeated CurationStockExtraRelocation moved = 3;
  repeated CurationStockExtraModification modified = 4;
}
message CurationStockExtraModification {
  string id = 1;
  CurationObjectKindExtraPatchEntry patch = 2;
}

message CurationCuratedPatchEntry {
  optional uint32 count = 1;
}

message CurationCuratedRemoval {
  string id = 1;
  uint32 index = 2;
}
message CurationCuratedInsertion {
  uint32 index = 1;
  semio.s.sourcing.curation.artifact.CuratedItem row = 2;
}
message CurationCuratedRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}
message CurationCuratedDelta {
  repeated CurationCuratedRemoval removed = 1;
  repeated CurationCuratedInsertion inserted = 2;
  repeated CurationCuratedRelocation moved = 3;
  repeated CurationCuratedModification modified = 4;
}
message CurationCuratedModification {
  string id = 1;
  CurationCuratedPatchEntry patch = 2;
}

message CurationDiff {
  // @state artifact @child kind=s.stdio.semio
  optional semio.os.store.ArtifactChild catalog = 1;
  // @state artifact
  optional CurationStockExtraDelta stock_extra = 2;
  // @state artifact
  optional CurationCuratedDelta curated = 3;
}
