syntax = "proto3";
package semio.s.sourcing.curation.diff;

// 🧬️ Curation diff schema — sparse field delta.

message TableSort {
  string column_id = 1;
  string direction = 2;
}

message Filters {
  string query = 1;
  repeated string module_ids = 2;
  repeated string typology_path = 3;
  uint32 min_availability = 4;
  optional TableSort sort = 5;
}

message GeometryRecipeBox {
  string kind = 1;
  double width = 2;
  double height = 3;
  double depth = 4;
}

message GeometryRecipeFrame {
  string kind = 1;
  double width = 2;
  double height = 3;
  double depth = 4;
  double profile = 5;
}

message GeometryRecipeSlab {
  string kind = 1;
  double width = 2;
  double depth = 3;
  double thickness = 4;
}

message GeometryRecipeMesh {
  string kind = 1;
  repeated float positions = 2;
  repeated float normals = 3;
  repeated uint32 indices = 4;
}

message GeometryRecipe {
  oneof recipe {
    GeometryRecipeBox box = 1;
    GeometryRecipeFrame frame = 2;
    GeometryRecipeSlab slab = 3;
    GeometryRecipeMesh mesh = 4;
  }
}

message ObjectKind {
  string id = 1;
  string name = 2;
  string module_id = 3;
  repeated string typology_path = 4;
  uint32 availability = 5;
  GeometryRecipe geometry = 6;
}

message CuratedItem {
  string object_id = 1;
  uint32 count = 2;
}

message CurationStringList {
  repeated string values = 1;
}

message ObjectKindExtra {
  string id = 1;
  string name = 2;
  string module_id = 3;
  repeated string typology_path = 4;
  uint32 availability = 5;
  GeometryRecipe geometry = 6;
}

message ArtifactChildHandle { string child_id = 1; string target = 2; }

message CurationObjectKindExtraPatchEntry {
  string id = 1;
  ObjectKindExtra extra = 2;
}

message CurationStockExtraDelta {
  repeated ObjectKindExtra added = 1;
  repeated string removed = 2;
  repeated CurationObjectKindExtraPatchEntry patched = 3;
  repeated string reordered = 4;
}

message CurationCuratedPatchEntry {
  string object_id = 1;
  optional uint32 count = 2;
}

message CurationCuratedDelta {
  repeated CuratedItem added = 1;
  repeated string removed = 2;
  repeated CurationCuratedPatchEntry patched = 3;
  repeated string reordered = 4;
}

message CurationDiff {
  // @state artifact
  optional CurationArtifact artifact = 1;
  // @state artifact @child kind=s.stdio.semio.kit
  optional ArtifactChildHandle catalog = 2;
  // @state artifact
  optional CurationStockExtraDelta stock_extra = 3;
  // @state artifact
  optional CurationCuratedDelta curated = 4;
  // @state config
  optional Filters filters = 5;
  // @state config
  optional string locale = 7;
  // @state config
  optional string contributions_json = 8;
}
