syntax = "proto3";
package semio.s.sourcing.curation.inference;

// 💡️ Curation inference schema — a real census over the stock catalog and curated bill of quantities.

message CurationInference {
  // @derived
  CurationEntries entries = 1;
}

message CurationEntries {
  uint32 stock_count = 1;
  uint32 entry_count = 2;
  uint32 total_count = 3;
}
