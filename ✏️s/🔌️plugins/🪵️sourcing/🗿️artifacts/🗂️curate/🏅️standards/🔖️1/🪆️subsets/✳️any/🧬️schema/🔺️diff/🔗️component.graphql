# 🧬️ Curate diff schema — sparse field delta.

enum SortDirection {
  ASC
  DESC
}

type TableSort {
  columnId: String!
  direction: SortDirection!
}

type Filters {
  query: String!
  moduleIds: [String!]!
  typologyPath: [String!]!
  minAvailability: Int!
  sort: TableSort
}

union GeometryRecipe =
  | GeometryRecipeBox
  | GeometryRecipeFrame
  | GeometryRecipeSlab
  | GeometryRecipeMesh

type GeometryRecipeBox {
  kind: String!
  width: Float!
  height: Float!
  depth: Float!
}

type GeometryRecipeFrame {
  kind: String!
  width: Float!
  height: Float!
  depth: Float!
  profile: Float!
}

type GeometryRecipeSlab {
  kind: String!
  width: Float!
  depth: Float!
  thickness: Float!
}

type GeometryRecipeMesh {
  kind: String!
  positions: [Float!]!
  normals: [Float!]!
  indices: [Int!]!
}

type ObjectKind {
  id: String!
  name: String!
  moduleId: String!
  typologyPath: [String!]!
  availability: Int!
  geometry: GeometryRecipe!
}

type CuratedItem {
  objectId: String!
  count: Int!
}

type CurateStringList {
  values: [String!]!
}

type ObjectKindExtra {
  id: String!
  typologyPath: [String!]!
  availability: Int!
  geometry: GeometryRecipe!
}

type CurateObjectKindExtraPatchEntry {
  id: String!
  extra: ObjectKindExtra!
}

type CurateStockExtraDelta {
  added: [ObjectKindExtra!]
  removed: [String!]
  patched: [CurateObjectKindExtraPatchEntry!]
  reordered: [String!]
}

type CurateCuratedPatchEntry {
  objectId: String!
  count: Int
}

type CurateCuratedDelta {
  added: [CuratedItem!]
  removed: [String!]
  patched: [CurateCuratedPatchEntry!]
  reordered: [String!]
}

type CurateDiff {
  artifact: CurateArtifact @state(class: ARTIFACT)
  catalog: ArtifactLink @state(class: ARTIFACT) @child(kind: "s.stdio.semio.kit")
  stockExtra: CurateStockExtraDelta @state(class: ARTIFACT)
  curated: CurateCuratedDelta @state(class: ARTIFACT)
  filters: Filters @state(class: CONFIG)
  selectedObjectId: String @state(class: PRESENCE)
  locale: String @state(class: CONFIG)
  contributionsJson: String @state(class: CONFIG)
}
