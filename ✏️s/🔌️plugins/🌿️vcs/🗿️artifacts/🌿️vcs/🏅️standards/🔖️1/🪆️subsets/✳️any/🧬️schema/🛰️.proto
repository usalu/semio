syntax = "proto3";
package semio.s.vcs.vcs.artifact;

// 🧬️ VCS artifact schema — every field with its state class.

message VcsArtifact {
  // @state artifact
  string schema = 1;
  // @state artifact
  string title = 2;
  // @state artifact
  int64 counter = 3;
  // @state artifact
  string notes = 4;
  // @state artifact
  string status = 5;
  // @state artifact
  repeated string tags = 6;
  // @state presence
  repeated string selected_checkpoint_ids = 7;
  // @state config
  string locale = 8;
}
