# 🧬️ VCS diff schema — sparse field delta over the artifact.

type VcsDiff {
  artifact: VcsArtifact @state(class: ARTIFACT)
  schema: String @state(class: ARTIFACT)
  title: String @state(class: ARTIFACT)
  counter: Long @state(class: ARTIFACT)
  notes: String @state(class: ARTIFACT)
  status: String @state(class: ARTIFACT)
  tags: VcsTagsDelta @state(class: ARTIFACT)
  selectedCheckpointIds: VcsStringList @state(class: PRESENCE)
  locale: String @state(class: CONFIG)
}

type VcsStringList {
  values: [String!]!
}

type VcsTagsDelta {
  added: [String!]!
  removed: [String!]!
}
