syntax = "proto3";
package semio.s.vcs.vcs.diff;

// 🧬️ VCS diff schema — sparse field delta over the artifact.

message VcsDiff {
  // @state artifact
  optional string schema = 1;
  // @state artifact
  optional string title = 2;
  // @state artifact
  optional int64 counter = 3;
  // @state artifact
  optional string notes = 4;
  // @state artifact
  optional string status = 5;
  // @state artifact
  optional VcsTagsDelta tags = 6;
  // @state config
}

message VcsStringList {
  repeated string values = 1;
}

message VcsTagsDelta {
  repeated string added = 1;
  repeated string removed = 2;
  optional VcsStringList reordered = 3;
}

