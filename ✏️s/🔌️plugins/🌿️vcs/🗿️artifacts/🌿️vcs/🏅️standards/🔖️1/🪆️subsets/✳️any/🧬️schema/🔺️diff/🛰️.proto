syntax = "proto3";
package semio.s.vcs.vcs.diff;

// 🧬️ VCS diff schema — sparse field delta over the artifact.

message VcsDiff {
  // @state artifact
  optional string schema = 1;
  // @state artifact
  optional string title = 2;
  // @state artifact
  optional int64 counter = 3;
  // @state artifact
  optional string notes = 4;
  // @state artifact
  optional string status = 5;
  // @state artifact
  optional VcsTagsDelta tags = 6;
  // @state config
}

message VcsTagRemoval {
  string id = 1;
  uint32 index = 2;
}

message VcsTagInsertion {
  uint32 index = 1;
  string row = 2;
}

message VcsTagRelocation {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message VcsTagsDelta {
  repeated VcsTagRemoval removed = 1;
  repeated VcsTagInsertion inserted = 2;
  repeated VcsTagRelocation moved = 3;
}
