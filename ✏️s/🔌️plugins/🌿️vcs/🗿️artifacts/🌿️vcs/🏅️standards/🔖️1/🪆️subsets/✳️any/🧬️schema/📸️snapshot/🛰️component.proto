syntax = "proto3";
package semio.s.vcs.vcs.snapshot;

// 🧬️ VCS snapshot schema — artifact-lane fields only.

message VcsSnapshot {
  // @state artifact
  string schema = 1;
  // @state artifact
  string title = 2;
  // @state artifact
  int64 counter = 3;
  // @state artifact
  string notes = 4;
  // @state artifact
  string status = 5;
  // @state artifact
  repeated string tags = 6;
}
