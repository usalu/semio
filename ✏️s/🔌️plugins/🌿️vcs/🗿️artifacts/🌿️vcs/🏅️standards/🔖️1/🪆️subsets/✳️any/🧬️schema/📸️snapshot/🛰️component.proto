syntax = "proto3";
package semio.s.vcs.vcs.snapshot;

// 🧬️ VCS snapshot schema — persistent fields only.

message VcsSnapshot {
  // @state persistent
  string schema = 1;
  // @state persistent
  string title = 2;
  // @state persistent
  int64 counter = 3;
  // @state persistent
  string notes = 4;
  // @state persistent
  string status = 5;
  // @state persistent
  repeated string tags = 6;
}
