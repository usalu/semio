[package]
workspace = "../.."
name = "semio-s-dev-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Development hosts with explicit caller-owned installed service inventories"

[package.metadata.semio]
role = "tool"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[bin]]
name = "semio-s-services-native"
path = "../../⌨️entrypoint/🦀️.rs"
required-features = ["native-renderer"]

[[bin]]
name = "semio-s-services-mcp"
path = "../../🌉️mcp/⌨️entrypoint/🦀️.rs"
required-features = ["mcp-service"]

[dependencies]
semio-framework-os-kernel.workspace = true
semio-framework-os-renderer-wgpu = { workspace = true, optional = true }
semio-framework-os-mcp = { workspace = true, optional = true }

[features]
native-renderer = ["dep:semio-framework-os-renderer-wgpu"]
mcp-service = ["dep:semio-framework-os-mcp"]
