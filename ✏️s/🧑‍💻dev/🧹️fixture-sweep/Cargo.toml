  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
  "**/🏭️bridge/**"
]

[workspace.metadata.semio.repository]
schema-version = 1
exclude-patterns = [
  "**/🏅️standards/**",
  "**/👽️guest/**",
  "**/🔮️oracles/**",
