[package]
workspace = "../.."
name = "semio-s-dev-gis-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Outward native document service application composition"

[package.metadata.semio]
role = "tool"

[lints]
workspace = true

[lib]
path = "../../🦀️.rs"

[[bin]]
name = "semio-s-gis-services-native"
path = "../../⌨️entrypoint/🦀️.rs"
required-features=["native-renderer"]

[dependencies]
semio-framework-value = { path = "../../../../../../../🧰️framework/🔨️modules/🌱️value/📦️packages/🦀️rust" }
semio-framework-os-kernel.workspace = true
semio-s-dev-services.workspace = true
semio-s-artifact-gis-gismap.workspace=true

semio-hub-auth-client={path="../../../../../../../🌎️hub/🔐️auth/🔌️client/📦️packages/🦀️rust",optional=true}

[dev-dependencies]
semio-framework-os-kernel = { workspace = true, features = ["mutation-testing"] }
serde_json.workspace = true

[[bin]]
name="semio-s-gis-services-mcp"
path="../../🌉️mcp/⌨️entrypoint/🦀️.rs"
required-features=["mcp-service"]

[features]
native-renderer=["semio-s-dev-services/native-renderer"]
mcp-service=["semio-s-dev-services/mcp-service","dep:semio-hub-auth-client","semio-s-artifact-gis-gismap/mcp-service"]
