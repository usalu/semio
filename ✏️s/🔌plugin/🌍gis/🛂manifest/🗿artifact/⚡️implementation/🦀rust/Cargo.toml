[package]
name = "semio-s-plugin-gis"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:gis"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "gis2d"
aliases = ["gis 2d"]
app = "gis2d-play"
ports = { react = 6040, wgpu = 6140 }
engines = ["./🧰framework/🔨module/🗺️surface/🗺️tiled-map/⚡️implementation/🦀rust"]

[[package.metadata.semio.playground]]
variant = "gis3d"
aliases = ["gis 3d"]
app = "gis3d-play"
ports = { react = 6083, wgpu = 6183 }
engines = ["./🧰framework/🔨module/🗺️surface/🏔️terrain/⚡️implementation/🦀rust"]

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/osm"
app = "gis2d-play"
upstream = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
cache = "osm-tiles"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/vt"
app = "gis2d-play"
upstream = "https://tiles.openfreemap.org/planet"
cache = "openfreemap-vt"

[[package.metadata.semio.assets]]
kind = "tile-proxy"
route = "/dem"
app = "gis3d-play"
upstream = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
cache = "terrarium-dem"

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌plugin/🌍gis/🛂manifest/🗿artifact/⚡️implementation/🦀rust/📦lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../../../🧰framework/🛍️product/💻os/⚡️implementation/🦀rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🔌plugin/⚡️implementation/🦀rust", features = ["component-guest"], package = "semio-framework-plugin" }
gis2d = { path = "../../../../../../../✏️s/🔌plugin/🌍gis/🎛️app/◻️2d/⚡️implementation/🦀rust", package = "semio-s-app-gis-2d" }
gis2d_engine = { path = "../../../../../../../✏️s/🔌plugin/🌍gis/🎛️app/◻️2d/🔨module/⚙️engine/⚡️implementation/🦀rust", package = "semio-s-app-gis-2d-engine" }
gis2d_ui = { path = "../../../../../../../✏️s/🔌plugin/🌍gis/🎛️app/◻️2d/🔨module/🖱️ui/⚡️implementation/🦀rust", package = "semio-s-app-gis-2d-ui" }
gis3d = { path = "../../../../../../../✏️s/🔌plugin/🌍gis/🎛️app/🧊3d/⚡️implementation/🦀rust", package = "semio-s-app-gis-3d" }
gis3d_ui = { path = "../../../../../../../✏️s/🔌plugin/🌍gis/🎛️app/🧊3d/🔨module/🖱️ui/⚡️implementation/🦀rust", package = "semio-s-app-gis-3d-ui" }
