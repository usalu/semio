[package]
name = "raster-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[package.metadata.component]
package = "semio:raster"

[package.metadata.semio]

[[package.metadata.semio.playground]]
variant = "raster"
ports = { react = 6060, wgpu = 6160 }
engines = ["./🧰framework/🔨module/🗺️surface/🎨paint/⚡️implementation/🦀rust"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "../../../../../../../✏️s/🔌plugin/🖨️raster/🛂manifest/🗿artifact/⚡️implementation/🦀rust/📦lib.rs"

[dependencies]
semio-framework-os = { path = "../../../../../../../🧰framework/🛍️product/💻os/⚡️implementation/🦀rust", package = "semio-framework-os" }
semio-framework-plugin = { path = "../../../../../../../🧰framework/🛍️product/💻os/🔨module/🔌plugin/⚡️implementation/🦀rust", features = ["component-guest"], package = "semio-framework-plugin" }
raster = { path = "../../../../../../../✏️s/🔌plugin/🖨️raster/🎛️app/🖨️raster/⚡️implementation/🦀rust", package = "semio-s-app-raster" }
raster_engine = { path = "../../../../../../../✏️s/🔌plugin/🖨️raster/🎛️app/🖨️raster/🔨module/⚙️engine/⚡️implementation/🦀rust", package = "semio-s-app-raster-engine" }
raster_op = { path = "../../../../../../../✏️s/🔌plugin/🖨️raster/🎛️app/🖨️raster/🔨module/🔧op/⚡️implementation/🦀rust", package = "semio-s-app-raster-op" }
raster_ui = { path = "../../../../../../../✏️s/🔌plugin/🖨️raster/🎛️app/🖨️raster/🔨module/🖱️ui/⚡️implementation/🦀rust", package = "semio-s-app-raster-ui" }
serde_json = "1.0.140"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"

