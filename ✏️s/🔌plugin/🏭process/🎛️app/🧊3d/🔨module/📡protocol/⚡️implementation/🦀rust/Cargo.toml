[package]
name = "semio-s-app-process-3d-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Process 3d app - binary command protocol surface + laws (constitutional: protocol)"

[lints]
workspace = true
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["rlib", "cdylib"]
path = "../../../../../../../../../✏️s/🔌plugin/🏭process/🎛️app/🧊3d/🔨module/📡protocol/⚡️implementation/🦀rust/📦lib.rs"

[dependencies]
process_3d = { path = "../../../../../../../../../✏️s/🔌plugin/🏭process/🎛️app/🧊3d/⚡️implementation/🦀rust", package = "semio-s-app-process-3d" }
process_3d_op = { path = "../../../../../../../../../✏️s/🔌plugin/🏭process/🎛️app/🧊3d/🔨module/🔧op/⚡️implementation/🦀rust", package = "semio-s-app-process-3d-op" }
protocol = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/📡protocol/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-protocol" }
store = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🏪store/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-store" }
serde_json = "1.0.140"

[dev-dependencies]
vcs = { path = "../../../../../../../../../🧰framework/🛍️product/💻os/🔨module/🌿vcs/⚡️implementation/🦀rust", package = "semio-framework-os-kernel-vcs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
