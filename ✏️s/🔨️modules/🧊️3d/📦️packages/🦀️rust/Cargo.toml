[package]
name = "semio-s-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared 3D s-module - one crate for the B-Rep kernel (native geometry modules, the BrepKernel interface and its brepkit-backed implementation), the half-edge mesh kernel, generic scene math and the BVH spatial index"

[lints]
workspace = true

[package.metadata.semio]
role = "s-module"

[lib]
path = "📦️lib.rs"

[features]
default = ["parallel", "brep"]
parallel = ["dep:rayon", "dep:futures"]
brep = [
    "dep:semio-framework-core",
    "dep:async-trait",
    "dep:base64",
    "dep:pollster",
    "dep:brepkit-check",
    "dep:brepkit-geometry",
    "dep:brepkit-io",
    "dep:brepkit-math",
    "dep:brepkit-operations",
    "dep:brepkit-topology",
]

[dependencies]
async-trait = { version = "0.1.88", optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3.31", optional = true }
pollster = { version = "0.4.0", optional = true }
rayon = { version = "1.10.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
semio-framework-math = { workspace = true }
semio-framework-core = { workspace = true, optional = true }
brepkit-check = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" , optional = true }
brepkit-geometry = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" , optional = true }
brepkit-io = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" , optional = true }
brepkit-math = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" , optional = true }
brepkit-operations = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" , optional = true }
brepkit-topology = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" , optional = true }
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
[[bench]]
name = "kernel"
path = "benches/kernel.rs"
harness = false
