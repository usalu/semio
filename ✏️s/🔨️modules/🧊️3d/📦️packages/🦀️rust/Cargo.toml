[package]
name = "semio-s-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared 3D s-module - one crate for the B-Rep kernel (native geometry modules, the BrepKernel interface and its brepkit-backed implementation), the half-edge mesh kernel, generic scene math and the BVH spatial index"

[lints]
workspace = true

[package.metadata.semio]
role = "s-module"

[lib]
path = "📦️lib.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "dep:futures"]

[dependencies]
async-trait = "0.1.88"
base64 = "0.22"
futures = { version = "0.3.31", optional = true }
pollster = "0.4.0"
rayon = { version = "1.10.0", optional = true }
semio-framework-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
brepkit-check = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" }
brepkit-geometry = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" }
brepkit-io = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" }
brepkit-math = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" }
brepkit-operations = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" }
brepkit-topology = { git = "https://github.com/andymai/brepkit", rev = "d470b7c7d1c6fea793d310b6f7bc4f8fdcc1db6e" }
mathematical_algebra = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/➕️algebra/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-algebra" }
mathematical_number = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🔢️number/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-number" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
mathematical_random = { path = "../../../../../🧰️framework/🔨️modules/🧮️math/🎲️random/⚡️implementations/🦀️rust", package = "semio-framework-os-kernel-math-random" }

[[bench]]
name = "kernel"
path = "benches/kernel.rs"
harness = false
