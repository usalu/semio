cargo-features = ["trim-paths"]
[package]
name = "semio-framework-os-kernel-3d-brep-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"


[lints]
workspace = true
[lib]
name = "kernel_3d_engine"
path = "../../../../📐️brep/⚙️engine/⚡️implementations/🦀️rust/📦️lib.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "dep:futures"]

[dependencies]
async-trait = "0.1.88"
futures = { version = "0.3.31", optional = true }
pollster = "0.4.0"
rayon = { version = "1.10.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"

# ─── ⚠️ TEMPORARY VERIFICATION OVERLAY (ticket 26/08/06 S-MODULES…) — DELETE AFTER BASELINE ───
[workspace]

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
