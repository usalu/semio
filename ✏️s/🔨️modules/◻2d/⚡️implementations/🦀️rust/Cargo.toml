cargo-features = ["trim-paths"]

# ---- TEMPORARY VERIFICATION OVERLAY (scratch, removed before handoff, see TEMPLATE.md §3) ----
[workspace]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust" }

[profile.dev]
debug = false
incremental = true

[profile.dev.package.semio-framework-os-kernel-store]
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false
trim-paths = "object"

[profile.wasm-release.package.semio-framework-os-kernel-store]
codegen-units = 1

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
# ---- END TEMPORARY OVERLAY ----

[package]
name = "semio-s-kernel-geometry-2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "kernel_2d_rs"
path = "../../../../../✏️s/🔨️modules/◻2d/⚡️implementations/🦀️rust/📦️lib.rs"

[features]
default = ["booleans", "trace"]
booleans = ["dep:geo"]
trace = []

[dependencies]
async-trait = "0.1.88"
kernel_2d_engine = { path = "../../../../../✏️s/🔨️modules/◻2d/🔨️modules/⚙️engine/⚡️implementations/🦀️rust", package = "semio-s-kernel-geometry-2d-engine" }
geo = { version = "0.29", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
semio-framework-core = { path = "../../../../../🧰️framework/⚡️implementations/🦀️rust", package = "semio-framework-core" }
