[package]
name = "semio-s-2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "🖊️ 2D drawing kernel: scene-graph store, planar booleans, bitmap trace, SVG/PDF/DWG export."

[lints]
workspace = true

[package.metadata.semio]
role = "s-module"

[lib]
path = "📦️glue.rs"

[features]
default = ["booleans", "trace", "parallel"]
booleans = ["dep:geo"]
trace = []
parallel = ["dep:rayon", "dep:futures"]

[dependencies]
async-trait = "0.1.88"
futures = { version = "0.3.31", optional = true }
geo = { version = "0.29", optional = true }
pollster = "0.4.0"
rayon = { version = "1.10.0", optional = true }
semio-framework-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
