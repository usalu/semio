[package]
name = "semio-s-kernel-geometry-2d-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "kernel_2d_engine"
path = "../../../../../../../✏️s/🔨️modules/◻2d/🔨️modules/⚙️engine/⚡️implementations/🦀️rust/📦️lib.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "dep:futures"]

[dependencies]
async-trait = "0.1.88"
futures = { version = "0.3.31", optional = true }
pollster = "0.4.0"
rayon = { version = "1.10.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
