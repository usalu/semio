# ⚠️ TEMPORARY VERIFICATION OVERLAY (delete before handoff) — makes this manifest its own
# workspace root so it can be built in isolation before the registrar adds it as a real
# member of root Cargo.toml. Copied verbatim from root Cargo.toml per TEMPLATE.md §3.
cargo-features = ["trim-paths"]

[workspace]
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.dev]
debug = false
incremental = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
trim-paths = "object"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
redundant_clone = "warn"
# ⚠️ END TEMPORARY VERIFICATION OVERLAY

[package]
name = "semio-s-imperative"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.semio]
role = "s-module"

[lib]
crate-type = ["rlib"]
path = "📦️lib.rs"

[dependencies]
