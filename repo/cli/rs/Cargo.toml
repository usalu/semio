[package]
name = "repo_cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "semio monorepo orchestrator CLI + TUI dashboard (binary: semio)"


[lints]
workspace = true
[lib]
path = "lib.rs"

[[bin]]
name = "semio"
path = "main.rs"

[dependencies]
ui_tui = { path = "../../../framework/ui/tui/rs", features = ["terminal"] }
ui_styling = { path = "../../../framework/ui/styling/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
