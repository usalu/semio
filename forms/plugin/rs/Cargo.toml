[package]
name = "forms-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:forms"

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
forms = { path = "../../rs" }
vcs = { path = "../../../vcs/rs" }
flow_core = { path = "../../../flow/core/rs" }
flow_module_brep = { path = "../../../flow/module/brep/rs", default-features = false }
kernel_3d_brepkit = { path = "../../../kernel/3d/brep/rs" }
kernel_3d_engine = { path = "../../../kernel/3d/brep/engine/rs", features = ["parallel"] }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
base64 = "0.22.1"
image = "0.25.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
