[package]
name = "forms-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[package.metadata.component]
package = "semio:forms"

[package.metadata.semio]
consumes = ["forms.questionKind"]

[[package.metadata.semio.playground]]
variant = "forms"
ports = { react = 6058, wgpu = 6158 }

[lib]
crate-type = ["cdylib", "rlib"]
path = "lib.rs"

[dependencies]
forms = { path = "../../rs" }
vcs = { path = "../../../vcs/rs" }
protocol = { path = "../../../protocol/rs" }
semio-framework-plugin = { path = "../../../framework/plugin/rs" }
semio-framework-core = { path = "../../../framework/core/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
