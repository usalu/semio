[package]
name = "forms"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Forms document domain — a forms-flavored instance of the generic `protocol` list/block model"


[lints]
workspace = true
[lib]
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[dependencies]
protocol = { path = "../../protocol/rs" }
vcs = { path = "../../vcs/rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
